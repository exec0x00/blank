:7"}, {"n": 40, "q": "ಗಲಾತ್ಯರಿಗೆ 4:4–5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನೇ ಕಳುಹಿಸಿಕೊಟ್ಟರು. ಇವರು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುಕ್ಕಾಗಿಯೂ ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು ನಮಗೆ ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿಯೂ ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು. ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಿಯೇ ಹುಟ್ಟಿದರು.", "r": "4:4–5"}, {"n": 41, "q": "ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಯಾರನ್ನು ಕಳುಹಿಸಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು", "r": "4:6"}, {"n": 42, "q": "ದೇವಪುತ್ರನ ಆತ್ಮವು ದೇವರನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತದೆ?", "a": "“ಅಪ್ಪಾ, ತಂದೆಯೇ”", "r": "4:6"}, {"n": 43, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ಗಲಾತ್ಯರ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದು ಏಕೆ?", "a": "ಅವರು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ", "r": "4:6"}, {"n": 44, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ಎಲ್ಲಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ?", "a": "ನಮ್ಮ ಹೃದಯಗಳಿಗೆ", "r": "4:6"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಪ್ಪಾ, ತಂದೆಯೇ, ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.”", "a": "ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ", "r": "4:6"}, {"n": 46, "q": "“ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ಅಪ್ಪಾ, ತಂದೆಯೇ, ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "4:6"}, {"n": 47, "q": "ಗಲಾತ್ಯರಿಗೆ 4:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, “ಅಪ್ಪಾ, ತಂದೆಯೇ,” ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.", "r": "4:6"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ಅಪ್ಪಾ, ತಂದೆಯೇ, ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿದ್ದಾರೆ", "r": "4:6"}, {"n": 49, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ಅಪ್ಪಾ, ತಂದೆಯೇ, ಎಂದು ಕರೆಯುವ …”", "a": "“… ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.”", "r": "4:6"}, {"n": 50, "q": "ದೇವರ ಅನುಗ್ರಹದಿಂದ ‘ನೀನು’ ಏನಾಗಿದ್ದೀ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.”", "r": "4:7"}, {"n": 51, "q": "ಮಗನೆಂದಮೇಲೆ ಅವನು ಇನ್ನೇನೂ ಹೌದು ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ವಾರಸುದಾರನೂ ಹೌದು", "r": "4:7"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ, ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.”", "a": "ಅನುಗ್ರಹದಿಂದಲೇ", "r": "4:7"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ವಾರಸುದಾರನೂ ಹೌದು.”", "a": "ಮಗನೆಂದಮೇಲೆ", "r": "4:7"}, {"n": 54, "q": "“ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 55, "q": "ಗಲಾತ್ಯರಿಗೆ 4:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ. ಮಗನೆಂದಮೇಲೆ ನೀನು ವಾರಸುದಾರನೂ ಹೌದು.", "r": "4:7"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಗನಾಗಿದ್ದೀ", "r": "4:7"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗನೆಂದಮೇಲೆ ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೌದು.”", "a": "ವಾರಸುದಾರನೂ", "r": "4:7"}, {"n": 58, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 4:8ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೌಲನ ಕಳಕಳಿ", "r": "4:8"}, {"n": 59, "q": "ಹಿಂದೆ ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದ ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಅಧೀನರಾಗಿದ್ದರು?", "a": "ದೇವರಲ್ಲದವುಗಳಿಗೆ", "r": "4:8"}, {"n": 60, "q": "ಗಲಾತ್ಯರು ದೇವರಲ್ಲದವುಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದದ್ದು ಯಾವಾಗ?", "a": "ಹಿಂದೆ ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಾಗ", "r": "4:8"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರಿಯದೆ ಇದ್ದಿರಿ.”", "a": "ದೇವರನ್ನು", "r": "4:8"}, {"n": 62, "q": "“ಹಿಂದೆ ನೀವು ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "4:8"}, {"n": 63, "q": "ಗಲಾತ್ಯರಿಗೆ 4:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಿಂದೆ ನೀವು ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಿರಿ. ದೇವರಲ್ಲದವುಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದಿರಿ.", "r": "4:8"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೆ ನೀವು ದೇವರನ್ನು ಅರಿಯದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇದ್ದಿರಿ", "r": "4:8"}, {"n": 65, "q": "ಈಗ ಗಲಾತ್ಯರು ಯಾರನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ?", "a": "ನಿಜದೇವರನ್ನು", "r": "4:9"}, {"n": 66, "q": "‘ನಿಜದೇವರನ್ನು ಅರಿತುಕೊಂಡಿದ್ದೀರಿ’ ಎಂಬುದನ್ನು ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ಏನೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರು ನಿಮ್ಮನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ”", "r": "4:9"}, {"n": 67, "q": "ಪೌಲನು ಮೂಲಭೂತ ಶಕ್ತಿಗಳನ್ನು ಹೇಗೆ ವರ್ಣಿಸುತ್ತಾನೆ?", "a": "ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ", "r": "4:9"}, {"n": 68, "q": "ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಮರಳುವ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಎರಡನೆಯ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಪುನಃ ಅವುಗಳಿಗೆ ಗುಲಾಮರಾಗಲು ಇಚ್ಛಿಸುವುದೇಕೆ?”", "r": "4:9"}, {"n": 69, "q": "ಗಲಾತ್ಯರು ಪುನಃ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಏನಾಗಲು ಇಚ್ಛಿಸುತ್ತಿದ್ದರು?", "a": "ಗುಲಾಮರಾಗಲು", "r": "4:9"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ದೇವರು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರಿತುಕೊಂಡಿದ್ದಾರೆ", "r": "4:9"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ ಮೂಲಭೂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮರಳುವುದೇಕೆ?”", "a": "ಶಕ್ತಿಗಳಿಗೆ", "r": "4:9"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ ಅವುಗಳಿಗೆ ಗುಲಾಮರಾಗಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಇಚ್ಛಿಸುವುದೇಕೆ", "r": "4:9"}, {"n": 73, "q": "“ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ದೇವರು ನಿಮ್ಮನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "4:9"}, {"n": 74, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ …”", "a": "“… ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ನೀವು ಮರಳುವುದೇಕೆ?”", "r": "4:9"}, {"n": 75, "q": "ಗಲಾತ್ಯರು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತಿದ್ದ ಮೂರು ವಿಷಯಗಳು ಯಾವುವು?", "a": "ಶುಭಾಶುಭ ದಿನಗಳು, ಮಾಸಗಳು ಮತ್ತು ಸಂವತ್ಸರಗಳು", "r": "4:10"}, {"n": 76, "q": "ಗಲಾತ್ಯರು ದಿನ, ಮಾಸ, ಸಂವತ್ಸರಗಳನ್ನು ಹೇಗೆ ನೋಡುತ್ತಿದ್ದರು?", "a": "ಜಾಗರೂಕತೆಯಿಂದ", "r": "4:10"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "a": "ಸಂವತ್ಸರಗಳನ್ನು", "r": "4:10"}, {"n": 78, "q": "“ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 79, "q": "ಗಲಾತ್ಯರಿಗೆ 4:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.", "r": "4:10"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡುತ್ತೀರಿ.”", "a": "ಜಾಗರೂಕತೆಯಿಂದ", "r": "4:10"}, {"n": 81, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು …”", "a": "“… ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "r": "4:10"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "a": "ಮಾಸಗಳನ್ನು", "r": "4:10"}, {"n": 83, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನನ್ನು ಯಾವ ಶಂಕೆ ಕಾಡುತ್ತಿತ್ತು?", "a": "ಅವರಿಗಾಗಿ ತಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ", "r": "4:11"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "a": "ವ್ಯರ್ಥವಾಯಿತೇನೋ", "r": "4:11"}, {"n": 85, "q": "“ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 86, "q": "ಗಲಾತ್ಯರಿಗೆ 4:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.", "r": "4:11"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "a": "ಪ್ರಯಾಸವೆಲ್ಲ", "r": "4:11"}, {"n": 88, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ …”", "a": "“… ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "r": "4:11"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನನ್ನನ್ನು; ಕಾಡುತ್ತಿದೆ", "r": "4:11"}, {"n": 90, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಕಳಕಳಿಯಿಂದ ಏನು ಕೇಳಿಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ತಾನು ಅವರಂತೆ ಆದಹಾಗೆ ಅವರೂ ತನ್ನಂತೆ ಆಗಬೇಕೆಂದು", "r": "4:12"}, {"n": 91, "q": "ಗಲಾತ್ಯರು ತನಗೆ ಮಾಡಿದ್ದರ ಬಗ್ಗೆ ಪೌಲನು 4:12ರಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ ಮಾಡಿಲ್ಲ.”", "r": "4:12"}, {"n": 92, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಪ್ರಿಯ ಸಹೋದರರೇ” ಎಂಬ ಸಂಬೋಧನೆ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ (4:12; 4:28; 4:31)", "r": "4:12; 4:28; 4:31"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ", "r": "4:12"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನಗೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಲ್ಲ.”", "a": "ಅನ್ಯಾಯವನ್ನೂ", "r": "4:12"}, {"n": 95, "q": "“ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "4:12"}, {"n": 96, "q": "ಗಲಾತ್ಯರಿಗೆ 4:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ. ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ ಮಾಡಿಲ್ಲ.", "r": "4:12"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ.”", "a": "ಆಗಬೇಕೆಂದು", "r": "4:12"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಲ್ಲ", "r": "4:12"}, {"n": 99, "q": "ಪೌಲನು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಗಲಾತ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಲು ಆಸ್ಪದವಾದದ್ದು ಹೇಗೆ?", "a": "ಅವನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ಅವರಲ್ಲೇ ಇರಬೇಕಾಯಿತು", "r": "4:13"}, {"n": 100, "q": "ಪೌಲನು ಅಸ್ವಸ್ಥನಾಗಿ ಗಲಾತ್ಯರಲ್ಲಿ ಇದ್ದಾಗ ಏನು ಮಾಡಿದನು?", "a": "ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಿದನು", "r": "4:13"}, {"n": 101, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಮೊದಲು ಶುಭಸಂದೇಶ ಸಾರಿದಾಗ ಅವನ ಆರೋಗ್ಯ ಹೇಗಿತ್ತು?", "a": "ಅಸ್ವಸ್ಥನಾಗಿದ್ದನು", "r": "4:13"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.”", "a": "ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ", "r": "4:13"}, {"n": 103, "q": "“ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 104, "q": "ಗಲಾತ್ಯರಿಗೆ 4:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು. ಇದನ್ನು ನೀವು ಬಲ್ಲಿರಿ.", "r": "4:13"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಸ್ಪದವಾಯಿತು.”", "a": "ಸಾರಲು", "r": "4:13"}, {"n": 106, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ …”", "a": "“… ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.”", "r": "4:13"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಸಾರಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶುಭಸಂದೇಶವನ್ನು; ಆಸ್ಪದವಾಯಿತು", "r": "4:13"}, {"n": 108, "q": "ಪೌಲನ ದೇಹಸ್ಥಿತಿ ಗಲಾತ್ಯರಿಗೆ ಹೇಗಿತ್ತು?", "a": "ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿತ್ತು", "r": "4:14"}, {"n": 109, "q": "ಪೌಲನ ದೇಹಸ್ಥಿತಿ ಬೇಸರವನ್ನುಂಟುಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ಗಲಾತ್ಯರು ಮಾಡದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ತಿರಸ್ಕರಿಸಲಿಲ್ಲ; ಅಸಹ್ಯಪಡಲಿಲ್ಲ", "r": "4:14"}, {"n": 110, "q": "ಗಲಾತ್ಯರು ಪೌಲನನ್ನು ಯಾರಂತೆ ಭಾವಿಸಿ ಉಪಚರಿಸಿದರು?", "a": "ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ", "r": "4:14"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ;”", "a": "ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ", "r": "4:14"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸಿ ಉಪಚರಿಸಿದಿರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ", "r": "4:14"}, {"n": 113, "q": "“ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 114, "q": "ಗಲಾತ್ಯರಿಗೆ 4:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ; ಅಸಹ್ಯಪಡಲಿಲ್ಲ. ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ ಭಾವಿಸಿ ಉಪಚರಿಸಿದಿರಿ.", "r": "4:14"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ತಿರಸ್ಕರಿಸಲಿಲ್ಲ", "r": "4:14"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ ಭಾವಿಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಪಚರಿಸಿದಿರಿ", "r": "4:14"}, {"n": 117, "q": "ಗಲಾತ್ಯರ ಹಿಂದಿನ ಪ್ರೀತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಆ ಭಾವನೆ ಈಗೆಲ್ಲಿದೆ?”", "r": "4:15"}, {"n": 118, "q": "ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ಗಲಾತ್ಯರು ಪೌಲನಿಗೆ ಏನನ್ನು ಕಿತ್ತು ಕೊಡುತ್ತಿದ್ದರು ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ", "r": "4:15"}, {"n": 119, "q": "ಗಲಾತ್ಯರು ಪೌಲನನ್ನು ಉಪಚರಿಸಿದ್ದನ್ನು ಏನೆಂದು ತಿಳಿದಿದ್ದರು?", "a": "ಅದೊಂದು ಭಾಗ್ಯವೆಂದು", "r": "4:15"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "a": "ಬೇಕಾಗಿದ್ದಿದ್ದರೆ", "r": "4:15"}, {"n": 121, "q": "“ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "4:15"}, {"n": 122, "q": "ಗಲಾತ್ಯರಿಗೆ 4:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದೊಂದು ಭಾಗ್ಯವೆಂದೇ ತಿಳಿದಿರಿ. ಆ ಭಾವನೆ ಈಗೆಲ್ಲಿದೆ? ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!", "r": "4:15"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "a": "ಕೊಡುತ್ತಿದ್ದಿರಿ", "r": "4:15"}, {"n": 124, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು …”", "a": "“… ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "r": "4:15"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಕಣ್ಣುಗಳನ್ನೇ; ಹೇಳಬಲ್ಲೆ", "r": "4:15"}, {"n": 126, "q": "ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "r": "4:16"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "a": "ನುಡಿಯುವುದರಿಂದ", "r": "4:16"}, {"n": 128, "q": "“ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "4:16"}, {"n": 129, "q": "ಗಲಾತ್ಯರಿಗೆ 4:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?", "r": "4:16"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "a": "ಹೀಗಿರಲಾಗಿ", "r": "4:16"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಬಿಟ್ಟೆನೇ", "r": "4:16"}, {"n": 132, "q": "ಗಲಾತ್ಯರನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಪೌಲನ ವಿರೋಧಿಗಳು", "r": "4:17"}, {"n": 133, "q": "ಪೌಲನ ವಿರೋಧಿಗಳ ಉದ್ದೇಶ ಏನಾಗಿತ್ತು?", "a": "ಗಲಾತ್ಯರು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದು", "r": "4:17"}, {"n": 134, "q": "ಪೌಲನ ವಿರೋಧಿಗಳು ಗಲಾತ್ಯರನ್ನು ಯಾರಿಂದ ಬೇರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು?", "a": "ಪೌಲನಿಂದ", "r": "4:17"}, {"n": 135, "q": "ಪೌಲನ ವಿರೋಧಿಗಳ ಆಸಕ್ತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರ ಉದ್ದೇಶ ಒಳ್ಳೆಯದಲ್ಲ", "r": "4:17"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನನ್ನ ವಿರೋಧಿಗಳು ನಿಮ್ಮನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸುತ್ತಿದ್ದಾರೆ", "r": "4:17"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರ ಉದ್ದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒಳ್ಳೆಯದಲ್ಲ", "r": "4:17"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಉದ್ದೇಶ.”", "a": "ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದೇ", "r": "4:17"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದಲೇ ನಿಮ್ಮನ್ನು ನನ್ನಿಂದ ಬೇರ್ಪಡಿಸಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯತ್ನಿಸುತ್ತಿದ್ದಾರೆ", "r": "4:17"}, {"n": 140, "q": "“ಆ ನನ್ನ ವಿರೋಧಿಗಳು ನಿಮ್ಮನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 141, "q": "ಬೇರೆಯವರು ಗಲಾತ್ಯರಲ್ಲಿ ಆಸಕ್ತರಾಗಿರುವುದು ಯಾವಾಗ ಒಳ್ಳೆಯದು?", "a": "ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ ಕೂಡಿದ್ದಾಗ", "r": "4:18"}, {"n": 142, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬಳಿ ಇರಲಿ ಇಲ್ಲದಿರಲಿ, ಯಾವುದು ಒಳ್ಳೆಯದೇ?", "a": "ಬೇರೆಯವರು ಗಲಾತ್ಯರಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು", "r": "4:18"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳ್ಳೆಯದೇ.”", "a": "ಆಸಕ್ತರಾಗಿರುವುದು", "r": "4:18"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡಿರಬೇಕು.”", "a": "ಸದುದ್ದೇಶದಿಂದ", "r": "4:18"}, {"n": 145, "q": "“ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "4:18"}, {"n": 146, "q": "ಗಲಾತ್ಯರಿಗೆ 4:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ. ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ ಕೂಡಿರಬೇಕು.", "r": "4:18"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ.”", "a": "ಇಲ್ಲದಿರಲಿ", "r": "4:18"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೂಡಿರಬೇಕು", "r": "4:18"}, {"n": 149, "q": "ಪೌಲನು 4:19ರಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "“ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ”", "r": "4:19"}, {"n": 150, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗಾಗಿ ಪಡುತ್ತಿದ್ದ ವೇದನೆಯನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪಡುವ ಪ್ರಸವ ವೇದನೆಗೆ", "r": "4:19"}, {"n": 151, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗಾಗಿ ಎಲ್ಲಿಯವರೆಗೆ ವೇದನೆಯನ್ನು ಪಡುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಅವರಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ", "r": "4:19"}, {"n": 152, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಪ್ರಸವ ವೇದನೆ’ಯ ಉಲ್ಲೇಖವಿರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "4:19 (ಪೌಲನ ವೇದನೆ) ಮತ್ತು 4:27 (ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳು)", "r": "4:19; 4:27"}, {"n": 153, "q": "ಪೌಲನ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ಗಲಾತ್ಯರಲ್ಲಿ ಏನಾಗಬೇಕು?", "a": "ರೂಪುಗೊಳ್ಳಬೇಕು", "r": "4:19"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "4:19"}, {"n": 155, "q": "“ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "4:19"}, {"n": 156, "q": "ಗಲಾತ್ಯರಿಗೆ 4:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.", "r": "4:19"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಡುತ್ತಿದ್ದೇನೆ", "r": "4:19"}, {"n": 158, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.”", "r": "4:19"}, {"n": 159, "q": "ಗಲಾತ್ಯರ ವಿಷಯದಲ್ಲಿ ಪೌಲನಿಗೆ ಏನು ತೋಚುತ್ತಿರಲಿಲ್ಲ?", "a": "ಏನು ಮಾಡಬೇಕೋ ಎಂಬುದು", "r": "4:20"}, {"n": 160, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬಳಿ ನೇರವಾಗಿ ಬಂದು ತನ್ನ ಯಾವುದನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತು ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ತನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು", "r": "4:20"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋಚುತ್ತಿಲ್ಲ", "r": "4:20"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ", "r": "4:20"}, {"n": 163, "q": "“ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ ತೋಚುತ್ತಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "4:20"}, {"n": 164, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ …”", "a": "“… ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ!”", "r": "4:20"}, {"n": 165, "q": "ಗಲಾತ್ಯರಿಗೆ 4:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ ತೋಚುತ್ತಿಲ್ಲ. ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ!", "r": "4:20"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏನು ಮಾಡಬೇಕೋ ನನಗೆ ತೋಚುತ್ತಿಲ್ಲ.”", "a": "ವಿಷಯದಲ್ಲಿ", "r": "4:20"}, {"n": 167, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 4:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು", "r": "4:21"}, {"n": 168, "q": "ಪೌಲನು 4:21ರಲ್ಲಿ ಯಾರನ್ನು ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರನ್ನು", "r": "4:21"}, {"n": 169, "q": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರಿಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?”", "r": "4:21"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಧೀನರಾಗಲು ಆಶಿಸುವವರೇ, ನನಗೆ ಉತ್ತರ ಕೊಡಿ:”", "a": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ", "r": "4:21"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?”", "a": "ಧರ್ಮಶಾಸ್ತ್ರ", "r": "4:21"}, {"n": 172, "q": "“ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರೇ, ನನಗೆ ಉತ್ತರ ಕೊಡಿ:” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "4:21"}, {"n": 173, "q": "ಗಲಾತ್ಯರಿಗೆ 4:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರೇ, ನನಗೆ ಉತ್ತರ ಕೊಡಿ: ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?", "r": "4:21"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಶಿಸುವವರೇ, ನನಗೆ ಉತ್ತರ ಕೊಡಿ:”", "a": "ಅಧೀನರಾಗಲು", "r": "4:21"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕೇಳಿಲ್ಲವೇ?”", "a": "ಹೇಳುವುದನ್ನು", "r": "4:21"}, {"n": 176, "q": "ಅಬ್ರಹಾಮನಿಗೆ ಎಷ್ಟು ಮಕ್ಕಳಿದ್ದರು ಎಂದು ಪೌಲನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಇಬ್ಬರು", "r": "4:22"}, {"n": 177, "q": "ಅಬ್ರಹಾಮನ ಇಬ್ಬರು ಮಕ್ಕಳು ಯಾರಿಂದ ಹುಟ್ಟಿದವರು?", "a": "ಒಬ್ಬನು ದಾಸಿಯಿಂದ; ಇನ್ನೊಬ್ಬನು ಧರ್ಮಪತ್ನಿಯಿಂದ", "r": "4:22"}, {"n": 178, "q": "ಪೌಲನ ಅಲಂಕಾರ ರೂಪದಲ್ಲಿ ದಾಸಿ ಮತ್ತು ಧರ್ಮಪತ್ನಿ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತಾರೆ?", "a": "ದಾಸಿ (ಹಾಗರಳು) ಸೀನಾಯ್ ಪರ್ವತದ ಒಡಂಬಡಿಕೆ ಮತ್ತು ಈಗಿನ ಜೆರುಸಲೇಮ್ (ದಾಸತ್ವ); ಧರ್ಮಪತ್ನಿ ಸ್ವತಂತ್ರಳಾದ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ (ನಮ್ಮ ತಾಯಿ)", "r": "4:22–31"}, {"n": 179, "q": "ಪೌಲನು 4:22ರಲ್ಲಿ ಯಾರ ಇಬ್ಬರು ಮಕ್ಕಳನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಅಬ್ರಹಾಮನ", "r": "4:22"}, {"n": 180, "q": "ಗಲಾತ್ಯರಿಗೆ 4:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಬ್ರಹಾಮನಿಗೆ ಇಬ್ಬರು ಮಕ್ಕಳಿದ್ದರು: ಒಬ್ಬನು ದಾಸಿಯಿಂದ ಹುಟ್ಟಿದವನು; ಇನ್ನೊಬ್ಬನು ಧರ್ಮಪತ್ನಿಯಿಂದ ಹುಟ್ಟಿದವನು.", "r": "4:22"}, {"n": 181, "q": "ದಾಸಿಯ ಮಗ ಹೇಗೆ ಹುಟ್ಟಿದವನು?", "a": "ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ", "r": "4:23"}, {"n": 182, "q": "ಧರ್ಮಪತ್ನಿಯ ಮಗ ಹೇಗೆ ಹುಟ್ಟಿದವನು?", "a": "ವಾಗ್ದಾನದ ಫಲವಾಗಿ", "r": "4:23"}, {"n": 183, "q": "ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನನ್ನು ಪೌಲನು ಬೇರೆ ಯಾವ ರೀತಿಯಲ್ಲಿ ವರ್ಣಿಸುತ್ತಾನೆ?", "a": "ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನು", "r": "4:23; 4:28–29"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹುಟ್ಟಿದವನು", "r": "4:23"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದರೋ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು.”", "a": "ಧರ್ಮಪತ್ನಿಯ", "r": "4:23"}, {"n": 186, "q": "“ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "4:23"}, {"n": 187, "q": "ಗಲಾತ್ಯರಿಗೆ 4:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು; ಧರ್ಮಪತ್ನಿಯ ಮಗನಾದರೋ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು.", "r": "4:23"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು;”", "a": "ಪ್ರಕೃತಿ", "r": "4:23"}, {"n": 189, "q": "ಅಬ್ರಹಾಮನ ಇಬ್ಬರು ಮಕ್ಕಳ ವೃತ್ತಾಂತವನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಅಲಂಕಾರ ರೂಪ", "r": "4:24"}, {"n": 190, "q": "ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಯಾವುದಕ್ಕೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ?", "a": "ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ", "r": "4:24"}, {"n": 191, "q": "ದಾಸತ್ವಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುವ ಒಡಂಬಡಿಕೆಯನ್ನು ಎಲ್ಲಿ ಮಾಡಲಾಯಿತು?", "a": "ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ", "r": "4:24"}, {"n": 192, "q": "ಸೀನಾಯ್ ಪರ್ವತದ ಒಡಂಬಡಿಕೆಯನ್ನು ಸೂಚಿಸುವವಳು ಯಾರು?", "a": "ದಾಸಿ ಹಾಗರಳು", "r": "4:24"}, {"n": 193, "q": "ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ ಯಾವುದಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುತ್ತದೆ?", "a": "ದಾಸತ್ವಕ್ಕೆ", "r": "4:24"}, {"n": 194, "q": "ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎಷ್ಟು ಒಡಂಬಡಿಕೆಗಳಿಗೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ?", "a": "ಎರಡು", "r": "4:24"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ", "r": "4:24"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ;”", "a": "ಸೀನಾಯ್", "r": "4:24"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳನ್ನು ಹೆರುತ್ತದೆ.”", "a": "ದಾಸತ್ವಕ್ಕೆ", "r": "4:24"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸಿ ಹಾಗರಳು.”", "a": "ಸೂಚಿಸುವವಳೇ", "r": "4:24"}, {"n": 199, "q": "“ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "4:24"}, {"n": 200, "q": "ಸೀನಾಯ್ ಪರ್ವತ ಎಲ್ಲಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅರೇಬಿಯಾದಲ್ಲಿ", "r": "4:25"}, {"n": 201, "q": "ಹಾಗರಳು ಯಾವ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ?", "a": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು", "r": "4:25"}, {"n": 202, "q": "ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮನ್ನು ಹೋಲುವುದು ಹೇಗೆ?", "a": "ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇರುವುದರಿಂದ", "r": "4:25"}, {"n": 203, "q": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ಮತ್ತು ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿದೆ; ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಸ್ವತಂತ್ರಳು, ನಮ್ಮ ತಾಯಿ", "r": "4:25–26"}, {"n": 204, "q": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವವಳು ಯಾರು?", "a": "ಹಾಗರಳು", "r": "4:25"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.”", "a": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ", "r": "4:25"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೇಗೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇದೆ.”", "a": "ಜೆರುಸಲೇಮ್", "r": "4:25"}, {"n": 207, "q": "“ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "4:25"}, {"n": 208, "q": "ಗಲಾತ್ಯರಿಗೆ 4:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ. ಹೇಗೆಂದರೆ, ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇದೆ.", "r": "4:25"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.”", "a": "ಜೆರುಸಲೇಮ್", "r": "4:25"}, {"n": 210, "q": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಹೇಗಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು", "r": "4:26"}, {"n": 211, "q": "ಪೌಲನ ಪ್ರಕಾರ ‘ನಮ್ಮ ತಾಯಿ’ ಯಾರು?", "a": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್", "r": "4:26"}, {"n": 212, "q": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಯಾವುದು ಅಲ್ಲ?", "a": "ದಾಸಿ ಅಲ್ಲ", "r": "4:26"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "a": "ಜೆರುಸಲೇಮ್", "r": "4:26"}, {"n": 214, "q": "“ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "4:26"}, {"n": 215, "q": "ಗಲಾತ್ಯರಿಗೆ 4:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.", "r": "4:26"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "a": "ಸ್ವತಂತ್ರಳು", "r": "4:26"}, {"n": 217, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ …”", "a": "“… ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "r": "4:26"}, {"n": 218, "q": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಗೆ ಏನೆಂದು ಹೇಳಲಾಗಿದೆ?", "a": "“ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು”", "r": "4:27"}, {"n": 219, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರ ಸಂತಾನ ಹೆಚ್ಚು?", "a": "ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು", "r": "4:27"}, {"n": 220, "q": "‘ಹರ್ಷೋದ್ಗಾರಮಾಡು’ ಎಂದು ಯಾರಿಗೆ ಹೇಳಲಾಗಿದೆ?", "a": "ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳಿಗೆ", "r": "4:27"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ", "r": "4:27"}, {"n": 222, "q": "“ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "4:27"}, {"n": 223, "q": "ಗಲಾತ್ಯರಿಗೆ 4:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,” ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.", "r": "4:27"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಗಂಡನುಳ್ಳವಳಿಗಿಂತ", "r": "4:27"}, {"n": 225, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ …”", "a": "“… ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "r": "4:27"}, {"n": 226, "q": "ಗಲಾತ್ಯರು ಯಾರಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು?", "a": "ಇಸಾಕನಂತೆ", "r": "4:28"}, {"n": 227, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನಾಗಿ ಹೆಸರಿಸಲಾದ ಅಬ್ರಹಾಮನ ಮಗ ಯಾರು?", "a": "ಇಸಾಕ", "r": "4:28"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಇಸಾಕನಂತೆ", "r": "4:28"}, {"n": 229, "q": "“ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "4:28"}, {"n": 230, "q": "ಗಲಾತ್ಯರಿಗೆ 4:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.", "r": "4:28"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಆದ್ದರಿಂದ", "r": "4:28"}, {"n": 232, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು …”", "a": "“… ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "r": "4:28"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ಇಸಾಕನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಸಹೋದರರೇ; ವಾಗ್ದಾನದ", "r": "4:28"}, {"n": 234, "q": "ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನಿಗೆ ಏನು ಮಾಡಿದನು?", "a": "ಹಿಂಸೆಪಡಿಸಿದನು", "r": "4:29"}, {"n": 235, "q": "ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಯಾವಾಗ ನಡೆಯುತ್ತದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಇಂದೂ", "r": "4:29"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಪ್ರಕೃತಿಸಹಜವಾಗಿ", "r": "4:29"}, {"n": 237, "q": "“ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "4:29"}, {"n": 238, "q": "ಗಲಾತ್ಯರಿಗೆ 4:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.", "r": "4:29"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಹಿಂಸೆಪಡಿಸಿದಂತೆ", "r": "4:29"}, {"n": 240, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ …”", "a": "“… ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "r": "4:29"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಹುಟ್ಟಿದವನು", "r": "4:29"}, {"n": 242, "q": "ದಾಸಿ ಮತ್ತು ಅವಳ ಮಗನ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥ ಏನು ಹೇಳುತ್ತದೆ?", "a": "“ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು”", "r": "4:30"}, {"n": 243, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ದಾಸಿಯ ಮಗನು ಯಾರೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು?", "a": "ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ", "r": "4:30"}, {"n": 244, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರನ್ನು ಹೊರಕ್ಕೆ ದೂಡಬೇಕು?", "a": "ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ", "r": "4:30"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು;”", "a": "ದಾಸಿಯನ್ನೂ", "r": "4:30"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗನು ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದಲ್ಲವೇ?”", "a": "ಪಾಲುಗಾರನಾಗಕೂಡದು", "r": "4:30"}, {"n": 247, "q": "“ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "4:30"}, {"n": 248, "q": "ಗಲಾತ್ಯರಿಗೆ 4:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥ ಹೇಳುವುದಾದರೂ ಏನು? “ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು; ದಾಸಿಯ ಮಗನು ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು,” ಎಂದಲ್ಲವೇ?", "r": "4:30"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯನ್ನೂ ಅವಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಕ್ಕೆ ದೂಡು;”", "a": "ಮಗನನ್ನೂ", "r": "4:30"}, {"n": 250, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯ ವಚನದಲ್ಲಿ ಪೌಲನು ಏನೆಂದು ತೀರ್ಮಾನಿಸುತ್ತಾನೆ?", "a": "“ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "r": "4:31"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳು.”", "a": "ಧರ್ಮಪತ್ನಿಯ", "r": "4:31"}, {"n": 252, "q": "“ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "4:31"}, {"n": 253, "q": "ಗಲಾತ್ಯರಿಗೆ 4:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.", "r": "4:31"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "a": "ಮಕ್ಕಳಲ್ಲ", "r": "4:31"}, {"n": 255, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು …”", "a": "“… ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "r": "4:31"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "a": "ಪ್ರಿಯ", "r": "4:31"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
