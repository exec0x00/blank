ೆ", "r": "4:11"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "a": "ವ್ಯರ್ಥವಾಯಿತೇನೋ", "r": "4:11"}, {"n": 83, "q": "“ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 84, "q": "ಗಲಾತ್ಯರಿಗೆ 4:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.", "r": "4:11"}, {"n": 85, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ …”", "a": "“… ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "r": "4:11"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ ನನ್ನನ್ನು ಕಾಡುತ್ತಿದೆ.”", "a": "ಪ್ರಯಾಸವೆಲ್ಲ", "r": "4:11"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗಾಗಿ ನಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನನ್ನನ್ನು; ಕಾಡುತ್ತಿದೆ", "r": "4:11"}, {"n": 88, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಕಳಕಳಿಯಿಂದ ಏನು ಕೇಳಿಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ತಾನು ಅವರಂತೆ ಆದಹಾಗೆ ಅವರೂ ತನ್ನಂತೆ ಆಗಬೇಕೆಂದು", "r": "4:12"}, {"n": 89, "q": "ಗಲಾತ್ಯರು ತನಗೆ ಮಾಡಿದ್ದರ ಬಗ್ಗೆ ಪೌಲನು 4:12ರಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ ಮಾಡಿಲ್ಲ.”", "r": "4:12"}, {"n": 90, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಪ್ರಿಯ ಸಹೋದರರೇ” ಎಂಬ ಸಂಬೋಧನೆ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ (4:12; 4:28; 4:31)", "r": "4:12; 4:28; 4:31"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ", "r": "4:12"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನಗೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಲ್ಲ.”", "a": "ಅನ್ಯಾಯವನ್ನೂ", "r": "4:12"}, {"n": 93, "q": "“ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "4:12"}, {"n": 94, "q": "ಗಲಾತ್ಯರಿಗೆ 4:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ. ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ ಮಾಡಿಲ್ಲ.", "r": "4:12"}, {"n": 95, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ನಿಮ್ಮಂತೆ ಆದಹಾಗೆ, …”", "a": "“… ನೀವೂ ನನ್ನಂತೆ ಆಗಬೇಕೆಂದು ಕಳಕಳಿಯಿಂದ ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ.”", "r": "4:12"}, {"n": 96, "q": "“ನೀವು ನನಗೆ ಯಾವ ಅನ್ಯಾಯವನ್ನೂ ಮಾಡಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "4:12"}, {"n": 97, "q": "ಪೌಲನು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಗಲಾತ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಲು ಆಸ್ಪದವಾದದ್ದು ಹೇಗೆ?", "a": "ಅವನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ಅವರಲ್ಲೇ ಇರಬೇಕಾಯಿತು", "r": "4:13"}, {"n": 98, "q": "ಪೌಲನು ಅಸ್ವಸ್ಥನಾಗಿ ಗಲಾತ್ಯರಲ್ಲಿ ಇದ್ದಾಗ ಏನು ಮಾಡಿದನು?", "a": "ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಿದನು", "r": "4:13"}, {"n": 99, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಮೊದಲು ಶುಭಸಂದೇಶ ಸಾರಿದಾಗ ಅವನ ಆರೋಗ್ಯ ಹೇಗಿತ್ತು?", "a": "ಅಸ್ವಸ್ಥನಾಗಿದ್ದನು", "r": "4:13"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.”", "a": "ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ", "r": "4:13"}, {"n": 101, "q": "“ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 102, "q": "ಗಲಾತ್ಯರಿಗೆ 4:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು. ಇದನ್ನು ನೀವು ಬಲ್ಲಿರಿ.", "r": "4:13"}, {"n": 103, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ …”", "a": "“… ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ ಸಾರಲು ಆಸ್ಪದವಾಯಿತು.”", "r": "4:13"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಸ್ಪದವಾಯಿತು.”", "a": "ಸಾರಲು", "r": "4:13"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದುದರಿಂದ ನಿಮ್ಮಲ್ಲೇ ಇದ್ದು ಮೊತ್ತಮೊದಲ ಬಾರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಸಾರಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶುಭಸಂದೇಶವನ್ನು; ಆಸ್ಪದವಾಯಿತು", "r": "4:13"}, {"n": 106, "q": "ಪೌಲನ ದೇಹಸ್ಥಿತಿ ಗಲಾತ್ಯರಿಗೆ ಹೇಗಿತ್ತು?", "a": "ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿತ್ತು", "r": "4:14"}, {"n": 107, "q": "ಪೌಲನ ದೇಹಸ್ಥಿತಿ ಬೇಸರವನ್ನುಂಟುಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ಗಲಾತ್ಯರು ಮಾಡದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ತಿರಸ್ಕರಿಸಲಿಲ್ಲ; ಅಸಹ್ಯಪಡಲಿಲ್ಲ", "r": "4:14"}, {"n": 108, "q": "ಗಲಾತ್ಯರು ಪೌಲನನ್ನು ಯಾರಂತೆ ಭಾವಿಸಿ ಉಪಚರಿಸಿದರು?", "a": "ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ", "r": "4:14"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ;”", "a": "ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ", "r": "4:14"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸಿ ಉಪಚರಿಸಿದಿರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ", "r": "4:14"}, {"n": 111, "q": "“ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 112, "q": "ಗಲಾತ್ಯರಿಗೆ 4:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ; ಅಸಹ್ಯಪಡಲಿಲ್ಲ. ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ ಭಾವಿಸಿ ಉಪಚರಿಸಿದಿರಿ.", "r": "4:14"}, {"n": 113, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನ ದೇಹಸ್ಥಿತಿ ನಿಮಗೆ ಬೇಸರವನ್ನುಂಟು …”", "a": "“… ಮಾಡುವಂಥದ್ದಾಗಿದ್ದರೂ ನೀವು ನನ್ನನ್ನು ತಿರಸ್ಕರಿಸಲಿಲ್ಲ;”", "r": "4:14"}, {"n": 114, "q": "“ನನ್ನನ್ನು ದೇವದೂತನಂತೆ ಏಕೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಂತೆಯೇ ಭಾವಿಸಿ ಉಪಚರಿಸಿದಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 115, "q": "ಗಲಾತ್ಯರ ಹಿಂದಿನ ಪ್ರೀತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಆ ಭಾವನೆ ಈಗೆಲ್ಲಿದೆ?”", "r": "4:15"}, {"n": 116, "q": "ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ಗಲಾತ್ಯರು ಪೌಲನಿಗೆ ಏನನ್ನು ಕಿತ್ತು ಕೊಡುತ್ತಿದ್ದರು ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ತಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ", "r": "4:15"}, {"n": 117, "q": "ಗಲಾತ್ಯರು ಪೌಲನನ್ನು ಉಪಚರಿಸಿದ್ದನ್ನು ಏನೆಂದು ತಿಳಿದಿದ್ದರು?", "a": "ಅದೊಂದು ಭಾಗ್ಯವೆಂದು", "r": "4:15"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "a": "ಬೇಕಾಗಿದ್ದಿದ್ದರೆ", "r": "4:15"}, {"n": 119, "q": "“ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "4:15"}, {"n": 120, "q": "ಗಲಾತ್ಯರಿಗೆ 4:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದೊಂದು ಭಾಗ್ಯವೆಂದೇ ತಿಳಿದಿರಿ. ಆ ಭಾವನೆ ಈಗೆಲ್ಲಿದೆ? ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!", "r": "4:15"}, {"n": 121, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು …”", "a": "“… ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "r": "4:15"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನೇ ಕಿತ್ತು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಹೇಳಬಲ್ಲೆ!”", "a": "ಕೊಡುತ್ತಿದ್ದಿರಿ", "r": "4:15"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಬೇಕಾಗಿದ್ದಿದ್ದರೆ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿತ್ತು ನನಗೆ ಕೊಡುತ್ತಿದ್ದಿರಿ ಎಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಕಣ್ಣುಗಳನ್ನೇ; ಹೇಳಬಲ್ಲೆ", "r": "4:15"}, {"n": 124, "q": "ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "r": "4:16"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "a": "ನುಡಿಯುವುದರಿಂದ", "r": "4:16"}, {"n": 126, "q": "“ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "4:16"}, {"n": 127, "q": "ಗಲಾತ್ಯರಿಗೆ 4:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?", "r": "4:16"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ ಬಿಟ್ಟೆನೇ?”", "a": "ಹೀಗಿರಲಾಗಿ", "r": "4:16"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ ಸತ್ಯವನ್ನು ನುಡಿಯುವುದರಿಂದ ನಾನು ನಿಮಗೆ ಶತ್ರುವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಬಿಟ್ಟೆನೇ", "r": "4:16"}, {"n": 130, "q": "ಗಲಾತ್ಯರನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಪೌಲನ ವಿರೋಧಿಗಳು", "r": "4:17"}, {"n": 131, "q": "ಪೌಲನ ವಿರೋಧಿಗಳ ಉದ್ದೇಶ ಏನಾಗಿತ್ತು?", "a": "ಗಲಾತ್ಯರು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದು", "r": "4:17"}, {"n": 132, "q": "ಪೌಲನ ವಿರೋಧಿಗಳು ಗಲಾತ್ಯರನ್ನು ಯಾರಿಂದ ಬೇರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು?", "a": "ಪೌಲನಿಂದ", "r": "4:17"}, {"n": 133, "q": "ಪೌಲನ ವಿರೋಧಿಗಳ ಆಸಕ್ತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರ ಉದ್ದೇಶ ಒಳ್ಳೆಯದಲ್ಲ", "r": "4:17"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನನ್ನ ವಿರೋಧಿಗಳು ನಿಮ್ಮನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸುತ್ತಿದ್ದಾರೆ", "r": "4:17"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಉದ್ದೇಶ.”", "a": "ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದೇ", "r": "4:17"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದಲೇ ನಿಮ್ಮನ್ನು ನನ್ನಿಂದ ಬೇರ್ಪಡಿಸಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯತ್ನಿಸುತ್ತಿದ್ದಾರೆ", "r": "4:17"}, {"n": 137, "q": "“ಆ ನನ್ನ ವಿರೋಧಿಗಳು ನಿಮ್ಮನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 138, "q": "“ನೀವು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 139, "q": "ಗಲಾತ್ಯರಿಗೆ 4:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ನನ್ನ ವಿರೋಧಿಗಳು ನಿಮ್ಮನ್ನು ಮೆಚ್ಚಿಸಲು ತುಂಬ ಆಸಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತಿದ್ದಾರೆ. ಆದರೆ ಅವರ ಉದ್ದೇಶ ಒಳ್ಳೆಯದಲ್ಲ. ನೀವು ಸಹ ಅವರನ್ನು ಅಷ್ಟೇ ಆಸಕ್ತಿಯಿಂದ ಮೆಚ್ಚಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶ. ಆದ್ದರಿಂದಲೇ ನಿಮ್ಮನ್ನು ನನ್ನಿಂದ ಬೇರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದಾರೆ.", "r": "4:17"}, {"n": 140, "q": "ಬೇರೆಯವರು ಗಲಾತ್ಯರಲ್ಲಿ ಆಸಕ್ತರಾಗಿರುವುದು ಯಾವಾಗ ಒಳ್ಳೆಯದು?", "a": "ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ ಕೂಡಿದ್ದಾಗ", "r": "4:18"}, {"n": 141, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬಳಿ ಇರಲಿ ಇಲ್ಲದಿರಲಿ, ಯಾವುದು ಒಳ್ಳೆಯದೇ?", "a": "ಬೇರೆಯವರು ಗಲಾತ್ಯರಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು", "r": "4:18"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳ್ಳೆಯದೇ.”", "a": "ಆಸಕ್ತರಾಗಿರುವುದು", "r": "4:18"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡಿರಬೇಕು.”", "a": "ಸದುದ್ದೇಶದಿಂದ", "r": "4:18"}, {"n": 144, "q": "“ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "4:18"}, {"n": 145, "q": "ಗಲಾತ್ಯರಿಗೆ 4:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ. ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ ಕೂಡಿರಬೇಕು.", "r": "4:18"}, {"n": 146, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ನಿಮ್ಮ ಬಳಿ ಇರಲಿ, ಇಲ್ಲದಿರಲಿ, …”", "a": "“… ಬೇರೆಯವರು ನಿಮ್ಮಲ್ಲಿ ಅಷ್ಟು ಆಸಕ್ತರಾಗಿರುವುದು ಒಳ್ಳೆಯದೇ.”", "r": "4:18"}, {"n": 147, "q": "“ಆದರೆ ಅಂಥ ಆಸಕ್ತಿ ಸದುದ್ದೇಶದಿಂದ ಕೂಡಿರಬೇಕು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "4:18"}, {"n": 148, "q": "ಪೌಲನು 4:19ರಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "“ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ”", "r": "4:19"}, {"n": 149, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗಾಗಿ ಪಡುತ್ತಿದ್ದ ವೇದನೆಯನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪಡುವ ಪ್ರಸವ ವೇದನೆಗೆ", "r": "4:19"}, {"n": 150, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗಾಗಿ ಎಲ್ಲಿಯವರೆಗೆ ವೇದನೆಯನ್ನು ಪಡುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಅವರಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ", "r": "4:19"}, {"n": 151, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಪ್ರಸವ ವೇದನೆ’ಯ ಉಲ್ಲೇಖವಿರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "4:19 (ಪೌಲನ ವೇದನೆ) ಮತ್ತು 4:27 (ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳು)", "r": "4:19; 4:27"}, {"n": 152, "q": "ಪೌಲನ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ಗಲಾತ್ಯರಲ್ಲಿ ಏನಾಗಬೇಕು?", "a": "ರೂಪುಗೊಳ್ಳಬೇಕು", "r": "4:19"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "4:19"}, {"n": 154, "q": "“ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "4:19"}, {"n": 155, "q": "ಗಲಾತ್ಯರಿಗೆ 4:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.", "r": "4:19"}, {"n": 156, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು ಪಡುತ್ತಿದ್ದೇನೆ.”", "r": "4:19"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಿಯ ಮಕ್ಕಳೇ, ತಾಯಿ ತನ್ನ ಮಗುವಿಗಾಗಿ ಪ್ರಸವ ವೇದನೆಪಡುವ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ನಿಮ್ಮಲ್ಲಿ ರೂಪುಗೊಳ್ಳುವ ತನಕ ನಿಮಗಾಗಿ ನಾನು ಮತ್ತೆ ಅಂಥ ವೇದನೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಡುತ್ತಿದ್ದೇನೆ", "r": "4:19"}, {"n": 158, "q": "ಗಲಾತ್ಯರ ವಿಷಯದಲ್ಲಿ ಪೌಲನಿಗೆ ಏನು ತೋಚುತ್ತಿರಲಿಲ್ಲ?", "a": "ಏನು ಮಾಡಬೇಕೋ ಎಂಬುದು", "r": "4:20"}, {"n": 159, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬಳಿ ನೇರವಾಗಿ ಬಂದು ತನ್ನ ಯಾವುದನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತು ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ತನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು", "r": "4:20"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋಚುತ್ತಿಲ್ಲ", "r": "4:20"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ", "r": "4:20"}, {"n": 162, "q": "“ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ ತೋಚುತ್ತಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "4:20"}, {"n": 163, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ …”", "a": "“… ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ!”", "r": "4:20"}, {"n": 164, "q": "ಗಲಾತ್ಯರಿಗೆ 4:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಬೇಕೋ ನನಗೆ ತೋಚುತ್ತಿಲ್ಲ. ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ!", "r": "4:20"}, {"n": 165, "q": "“ಬಹುಶಃ ನೇರವಾಗಿ ನಿಮ್ಮ ಬಳಿಗೆ ಬಂದು, ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲೇ ಇದ್ದು ನನ್ನ ಮಾತಿನ ವೈಖರಿಯನ್ನು ಬದಲಾಯಿಸಿದ್ದರೆ ಚೆನ್ನಾಗಿರುತ್ತಿತ್ತೇನೋ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "4:20"}, {"n": 166, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 4:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು", "r": "4:21"}, {"n": 167, "q": "ಪೌಲನು 4:21ರಲ್ಲಿ ಯಾರನ್ನು ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರನ್ನು", "r": "4:21"}, {"n": 168, "q": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರಿಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?”", "r": "4:21"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?”", "a": "ಧರ್ಮಶಾಸ್ತ್ರ", "r": "4:21"}, {"n": 170, "q": "“ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "4:21"}, {"n": 171, "q": "ಗಲಾತ್ಯರಿಗೆ 4:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಲು ಆಶಿಸುವವರೇ, ನನಗೆ ಉತ್ತರ ಕೊಡಿ: ಅದೇ ಧರ್ಮಶಾಸ್ತ್ರ ಹೇಳುವುದನ್ನು ನೀವು ಕೇಳಿಲ್ಲವೇ?", "r": "4:21"}, {"n": 172, "q": "ಅಬ್ರಹಾಮನಿಗೆ ಎಷ್ಟು ಮಕ್ಕಳಿದ್ದರು ಎಂದು ಪೌಲನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಇಬ್ಬರು", "r": "4:22"}, {"n": 173, "q": "ಅಬ್ರಹಾಮನ ಇಬ್ಬರು ಮಕ್ಕಳು ಯಾರಿಂದ ಹುಟ್ಟಿದವರು?", "a": "ಒಬ್ಬನು ದಾಸಿಯಿಂದ; ಇನ್ನೊಬ್ಬನು ಧರ್ಮಪತ್ನಿಯಿಂದ", "r": "4:22"}, {"n": 174, "q": "ಪೌಲನ ಅಲಂಕಾರ ರೂಪದಲ್ಲಿ ದಾಸಿ ಮತ್ತು ಧರ್ಮಪತ್ನಿ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತಾರೆ?", "a": "ದಾಸಿ (ಹಾಗರಳು) ಸೀನಾಯ್ ಪರ್ವತದ ಒಡಂಬಡಿಕೆ ಮತ್ತು ಈಗಿನ ಜೆರುಸಲೇಮ್ (ದಾಸತ್ವ); ಧರ್ಮಪತ್ನಿ ಸ್ವತಂತ್ರಳಾದ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ (ನಮ್ಮ ತಾಯಿ)", "r": "4:22–31"}, {"n": 175, "q": "ಪೌಲನು 4:22ರಲ್ಲಿ ಯಾರ ಇಬ್ಬರು ಮಕ್ಕಳನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಅಬ್ರಹಾಮನ", "r": "4:22"}, {"n": 176, "q": "ಗಲಾತ್ಯರಿಗೆ 4:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಬ್ರಹಾಮನಿಗೆ ಇಬ್ಬರು ಮಕ್ಕಳಿದ್ದರು: ಒಬ್ಬನು ದಾಸಿಯಿಂದ ಹುಟ್ಟಿದವನು; ಇನ್ನೊಬ್ಬನು ಧರ್ಮಪತ್ನಿಯಿಂದ ಹುಟ್ಟಿದವನು.", "r": "4:22"}, {"n": 177, "q": "ದಾಸಿಯ ಮಗ ಹೇಗೆ ಹುಟ್ಟಿದವನು?", "a": "ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ", "r": "4:23"}, {"n": 178, "q": "ಧರ್ಮಪತ್ನಿಯ ಮಗ ಹೇಗೆ ಹುಟ್ಟಿದವನು?", "a": "ವಾಗ್ದಾನದ ಫಲವಾಗಿ", "r": "4:23"}, {"n": 179, "q": "ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನನ್ನು ಪೌಲನು ಬೇರೆ ಯಾವ ರೀತಿಯಲ್ಲಿ ವರ್ಣಿಸುತ್ತಾನೆ?", "a": "ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನು", "r": "4:23; 4:28–29"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹುಟ್ಟಿದವನು", "r": "4:23"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದರೋ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು.”", "a": "ಧರ್ಮಪತ್ನಿಯ", "r": "4:23"}, {"n": 182, "q": "“ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "4:23"}, {"n": 183, "q": "ಗಲಾತ್ಯರಿಗೆ 4:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಾಸಿಯ ಮಗ ಪ್ರಕೃತಿ ಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು; ಧರ್ಮಪತ್ನಿಯ ಮಗನಾದರೋ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು.", "r": "4:23"}, {"n": 184, "q": "“ಧರ್ಮಪತ್ನಿಯ ಮಗನಾದರೋ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "4:23"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಪತ್ನಿಯ ಮಗನಾದರೋ ವಾಗ್ದಾನದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದವನು.”", "a": "ಫಲವಾಗಿ", "r": "4:23"}, {"n": 186, "q": "ಅಬ್ರಹಾಮನ ಇಬ್ಬರು ಮಕ್ಕಳ ವೃತ್ತಾಂತವನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಅಲಂಕಾರ ರೂಪ", "r": "4:24"}, {"n": 187, "q": "ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಯಾವುದಕ್ಕೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ?", "a": "ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ", "r": "4:24"}, {"n": 188, "q": "ದಾಸತ್ವಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುವ ಒಡಂಬಡಿಕೆಯನ್ನು ಎಲ್ಲಿ ಮಾಡಲಾಯಿತು?", "a": "ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ", "r": "4:24"}, {"n": 189, "q": "ಸೀನಾಯ್ ಪರ್ವತದ ಒಡಂಬಡಿಕೆಯನ್ನು ಸೂಚಿಸುವವಳು ಯಾರು?", "a": "ದಾಸಿ ಹಾಗರಳು", "r": "4:24"}, {"n": 190, "q": "ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ ಯಾವುದಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುತ್ತದೆ?", "a": "ದಾಸತ್ವಕ್ಕೆ", "r": "4:24"}, {"n": 191, "q": "ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎಷ್ಟು ಒಡಂಬಡಿಕೆಗಳಿಗೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ?", "a": "ಎರಡು", "r": "4:24"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ", "r": "4:24"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ;”", "a": "ಸೀನಾಯ್", "r": "4:24"}, {"n": 194, "q": "“ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "4:24"}, {"n": 195, "q": "ಗಲಾತ್ಯರಿಗೆ 4:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದೊಂದು ಅಲಂಕಾರ ರೂಪ. ಆ ಇಬ್ಬರು ಸ್ತ್ರೀಯರು ಎರಡು ಒಡಂಬಡಿಕೆಗಳಿಗೆ ಸದೃಶ್ಯರಾಗಿದ್ದಾರೆ. ಒಂದು, ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ; ಅದು ದಾಸತ್ವಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುತ್ತದೆ. ಅದನ್ನು ಸೂಚಿಸುವವಳೇ ದಾಸಿ ಹಾಗರಳು.", "r": "4:24"}, {"n": 196, "q": "“ಒಂದು, ಸೀನಾಯ್ ಪರ್ವತದಲ್ಲಿ ಮಾಡಲಾದ ಒಡಂಬಡಿಕೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "4:24"}, {"n": 197, "q": "ಸೀನಾಯ್ ಪರ್ವತ ಎಲ್ಲಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅರೇಬಿಯಾದಲ್ಲಿ", "r": "4:25"}, {"n": 198, "q": "ಹಾಗರಳು ಯಾವ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ?", "a": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು", "r": "4:25"}, {"n": 199, "q": "ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮನ್ನು ಹೋಲುವುದು ಹೇಗೆ?", "a": "ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇರುವುದರಿಂದ", "r": "4:25"}, {"n": 200, "q": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ಮತ್ತು ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಈಗಿನ ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿದೆ; ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಸ್ವತಂತ್ರಳು, ನಮ್ಮ ತಾಯಿ", "r": "4:25–26"}, {"n": 201, "q": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವವಳು ಯಾರು?", "a": "ಹಾಗರಳು", "r": "4:25"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.”", "a": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ", "r": "4:25"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೇಗೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇದೆ.”", "a": "ಜೆರುಸಲೇಮ್", "r": "4:25"}, {"n": 204, "q": "“ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "4:25"}, {"n": 205, "q": "ಗಲಾತ್ಯರಿಗೆ 4:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ. ಹೇಗೆಂದರೆ, ಜೆರುಸಲೇಮ್ ತನ್ನ ಮಕ್ಕಳ ಸಮೇತವಾಗಿ ದಾಸತ್ವದಲ್ಲಿ ಇದೆ.", "r": "4:25"}, {"n": 206, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅರೇಬಿಯಾದಲ್ಲಿರುವ ಸೀನಾಯ್ ಪರ್ವತವನ್ನು ಪ್ರತಿನಿಧಿಸುವ ಈ …”", "a": "“… ಹಾಗರಳು ಈಗಿನ ಜೆರುಸಲೇಮ್ ನಗರವನ್ನು ಹೋಲುತ್ತಾಳೆ.”", "r": "4:25"}, {"n": 207, "q": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಹೇಗಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು", "r": "4:26"}, {"n": 208, "q": "ಪೌಲನ ಪ್ರಕಾರ ‘ನಮ್ಮ ತಾಯಿ’ ಯಾರು?", "a": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್", "r": "4:26"}, {"n": 209, "q": "ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ಯಾವುದು ಅಲ್ಲ?", "a": "ದಾಸಿ ಅಲ್ಲ", "r": "4:26"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "a": "ಜೆರುಸಲೇಮ್", "r": "4:26"}, {"n": 211, "q": "“ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "4:26"}, {"n": 212, "q": "ಗಲಾತ್ಯರಿಗೆ 4:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.", "r": "4:26"}, {"n": 213, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ …”", "a": "“… ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "r": "4:26"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಸ್ವರ್ಗೀಯ ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈಕೆಯೇ ನಮ್ಮ ತಾಯಿ.”", "a": "ಸ್ವತಂತ್ರಳು", "r": "4:26"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮ್ ದಾಸಿ ಅಲ್ಲ, ಸ್ವತಂತ್ರಳು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮ ತಾಯಿ.”", "a": "ಸ್ವರ್ಗೀಯ; ಈಕೆಯೇ", "r": "4:26"}, {"n": 216, "q": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಗೆ ಏನೆಂದು ಹೇಳಲಾಗಿದೆ?", "a": "“ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು”", "r": "4:27"}, {"n": 217, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರ ಸಂತಾನ ಹೆಚ್ಚು?", "a": "ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು", "r": "4:27"}, {"n": 218, "q": "‘ಹರ್ಷೋದ್ಗಾರಮಾಡು’ ಎಂದು ಯಾರಿಗೆ ಹೇಳಲಾಗಿದೆ?", "a": "ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳಿಗೆ", "r": "4:27"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ", "r": "4:27"}, {"n": 220, "q": "“‘ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "4:27"}, {"n": 221, "q": "ಗಲಾತ್ಯರಿಗೆ 4:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,” ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.", "r": "4:27"}, {"n": 222, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು ಗಂಡನುಳ್ಳವಳಿಗಿಂತ …”", "a": "“… ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "r": "4:27"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ ವೇದನೆಯನರಿಯದವಳೇ, ಹರ್ಷೋದ್ಗಾರಮಾಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಗಂಡನುಳ್ಳವಳಿಗಿಂತ", "r": "4:27"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಸಂತಾನವಿಲ್ಲದ ಸ್ತ್ರೀಯೇ, ಸಂತೋಷಿಸು ಪ್ರಸವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಂಡನುಳ್ಳವಳಿಗಿಂತ ಕೈ ಬಿಟ್ಟವಳ ಸಂತಾನ ಹೆಚ್ಚು,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "a": "ವೇದನೆಯನರಿಯದವಳೇ; ಹರ್ಷೋದ್ಗಾರಮಾಡು", "r": "4:27"}, {"n": 225, "q": "ಗಲಾತ್ಯರು ಯಾರಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು?", "a": "ಇಸಾಕನಂತೆ", "r": "4:28"}, {"n": 226, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನಾಗಿ ಹೆಸರಿಸಲಾದ ಅಬ್ರಹಾಮನ ಮಗ ಯಾರು?", "a": "ಇಸಾಕ", "r": "4:28"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಇಸಾಕನಂತೆ", "r": "4:28"}, {"n": 228, "q": "“ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "4:28"}, {"n": 229, "q": "ಗಲಾತ್ಯರಿಗೆ 4:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.", "r": "4:28"}, {"n": 230, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು …”", "a": "“… ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "r": "4:28"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಿಯ ಸಹೋದರರೇ, ನೀವು ಇಸಾಕನಂತೆ ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಆದ್ದರಿಂದ", "r": "4:28"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಪ್ರಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ಇಸಾಕನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲವಾಗಿ ಹುಟ್ಟಿದ ಮಕ್ಕಳು.”", "a": "ಸಹೋದರರೇ; ವಾಗ್ದಾನದ", "r": "4:28"}, {"n": 233, "q": "ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನಿಗೆ ಏನು ಮಾಡಿದನು?", "a": "ಹಿಂಸೆಪಡಿಸಿದನು", "r": "4:29"}, {"n": 234, "q": "ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಯಾವಾಗ ನಡೆಯುತ್ತದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಇಂದೂ", "r": "4:29"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಪ್ರಕೃತಿಸಹಜವಾಗಿ", "r": "4:29"}, {"n": 236, "q": "“ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "4:29"}, {"n": 237, "q": "ಗಲಾತ್ಯರಿಗೆ 4:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.", "r": "4:29"}, {"n": 238, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ …”", "a": "“… ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "r": "4:29"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ ಹುಟ್ಟಿದವನು ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಹಿಂಸೆಪಡಿಸಿದಂತೆ", "r": "4:29"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು ಪ್ರಕೃತಿಸಹಜವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರಾತ್ಮದಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಹಿಂಸೆಪಡಿಸಿದಂತೆ ಇಂದೂ ನಡೆಯುತ್ತದೆ.”", "a": "ಹುಟ್ಟಿದವನು", "r": "4:29"}, {"n": 241, "q": "ದಾಸಿ ಮತ್ತು ಅವಳ ಮಗನ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥ ಏನು ಹೇಳುತ್ತದೆ?", "a": "“ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು”", "r": "4:30"}, {"n": 242, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ದಾಸಿಯ ಮಗನು ಯಾರೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು?", "a": "ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ", "r": "4:30"}, {"n": 243, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರನ್ನು ಹೊರಕ್ಕೆ ದೂಡಬೇಕು?", "a": "ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ", "r": "4:30"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು;”", "a": "ದಾಸಿಯನ್ನೂ", "r": "4:30"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗನು ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದಲ್ಲವೇ?”", "a": "ಪಾಲುಗಾರನಾಗಕೂಡದು", "r": "4:30"}, {"n": 246, "q": "“‘ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "4:30"}, {"n": 247, "q": "ಗಲಾತ್ಯರಿಗೆ 4:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥ ಹೇಳುವುದಾದರೂ ಏನು? “ದಾಸಿಯನ್ನೂ ಅವಳ ಮಗನನ್ನೂ ಹೊರಕ್ಕೆ ದೂಡು; ದಾಸಿಯ ಮಗನು ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು,” ಎಂದಲ್ಲವೇ?", "r": "4:30"}, {"n": 248, "q": "“ದಾಸಿಯ ಮಗನು ಧರ್ಮಪತ್ನಿಯ ಮಗನೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು,’ ಎಂದಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "4:30"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸಿಯ ಮಗನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನೊಂದಿಗೆ ಪಾಲುಗಾರನಾಗಕೂಡದು,’ ಎಂದಲ್ಲವೇ?”", "a": "ಧರ್ಮಪತ್ನಿಯ", "r": "4:30"}, {"n": 250, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯ ವಚನದಲ್ಲಿ ಪೌಲನು ಏನೆಂದು ತೀರ್ಮಾನಿಸುತ್ತಾನೆ?", "a": "“ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "r": "4:31"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳು.”", "a": "ಧರ್ಮಪತ್ನಿಯ", "r": "4:31"}, {"n": 252, "q": "“ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "4:31"}, {"n": 253, "q": "ಗಲಾತ್ಯರಿಗೆ 4:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.", "r": "4:31"}, {"n": 254, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು …”", "a": "“… ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "r": "4:31"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "a": "ಮಕ್ಕಳಲ್ಲ", "r": "4:31"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹೋದರರೇ, ನಾವು ದಾಸಿಯ ಮಕ್ಕಳಲ್ಲ, ಧರ್ಮಪತ್ನಿಯ ಮಕ್ಕಳು.”", "a": "ಪ್ರಿಯ", "r": "4:31"}]}, {"chapter": 5, "label": "ಅಧ್ಯಾಯ 5", "verses": 26, "subtitle": null, "questions": [{"n": 1, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಸದುಪಯೋಗಿಸಿಕೊಳ್ಳಿ", "r": "5:1"}, {"n": 2, "q": "ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಏಕೆ ಬಿಡುಗಡೆ ಮಾಡಿದರು?", "a": "ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು", "r": "5:1"}, {"n": 3, "q": "ಕ್ರಿಸ್ತಯೇಸು ಬಿಡುಗಡೆ ಮಾಡಿದ್ದರಿಂದ ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಕೊಡುವ ಎರಡು ಸಲಹೆಗಳು ಯಾವುವು?", "a": "“ಆದ್ದರಿಂದ ದೃಢವಾಗಿರಿ. ಗುಲಾಮಗಿರಿಯ ನೊಗಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡದಿರಿ.”", "r": "5:1"}, {"n": 4, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡಬಾರದು?", "a": "ಗುಲಾಮಗಿರಿಯ ನೊಗಕ್ಕೆ", "r": "5:1"}, {"n": 5, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯ ಅಥವಾ ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನದ ಬಗ್ಗೆ ಹೇಳುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "5:1 ಮತ್ತು 5:13", "r": "5:1; 5:13"}, {"n": 6, "q": "ಕ್ರಿಸ್ತಯೇಸು ಬಿಡುಗಡೆ ಮಾಡಿದ್ದರಿಂದ ಗಲಾತ್ಯರು ಹೇಗಿರಬೇಕು?", "a": "ದೃಢವಾಗಿರಬೇಕು", "r": "5:1"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "5:1"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೊಗಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡದಿರಿ.”", "a": "ಗುಲಾಮಗಿರಿಯ", "r": "5:1"}, {"n": 9, "q": "“ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "5:1"}, {"n": 10, "q": "ಗಲಾತ್ಯರಿಗೆ 5:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು. ಆದ್ದರಿಂದ ದೃಢವಾಗಿರಿ. ಗುಲಾಮಗಿರಿಯ ನೊಗಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡದಿರಿ.", "r": "5:1"}, {"n": 11, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.”", "r": "5:1"}, {"n": 12, "q": "“ಗುಲಾಮಗಿರಿಯ ನೊಗಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡದಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "5:1"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಮುಕ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.”", "a": "ಸ್ವಾತಂತ್ರ್ಯದಿಂದ", "r": "5:1"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ಬಿಡುಗಡೆ", "r": "5:1"}, {"n": 15, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:2ರಲ್ಲಿ ತನ್ನ ಹೆಸರನ್ನು ಹೇಳಿಕೊಂಡು ಮಾತನಾಡುವವರು ಯಾರು?", "a": "ಪೌಲನು (“ಪೌಲನಾದ ನಾನು”)", "r": "5:2"}, {"n": 16, "q": "ಗಲಾತ್ಯರು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ಅವರಿಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ", "r": "5:2"}, {"n": 17, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸುನ್ನತಿ’ ವಿಷಯ ಬರುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:2, 5:3, 5:6, 5:11", "r": "5:2; 5:3; 5:6; 5:11"}, {"n": 18, "q": "ಪೌಲನು 5:2ರಲ್ಲಿ ಗಲಾತ್ಯರಿಗೆ ಹೇಳುವ ಮಾತುಗಳನ್ನು ಹೇಗೆ ಆರಂಭಿಸುತ್ತಾನೆ?", "a": "“ಪೌಲನಾದ ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳಿ”", "r": "5:2"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತ", "r": "5:2"}, {"n": 20, "q": "“ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "5:2"}, {"n": 21, "q": "ಗಲಾತ್ಯರಿಗೆ 5:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪೌಲನಾದ ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳಿ: ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.", "r": "5:2"}, {"n": 22, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ …”", "a": "“… ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "r": "5:2"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಂಡರೆ", "r": "5:2"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೇಸುವಿನಿಂದ; ಆಗುವುದಿಲ್ಲ", "r": "5:2"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗುವುದಿಲ್ಲ.”", "a": "ಪ್ರಯೋಜನವೂ", "r": "5:2"}, {"n": 26, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಏನನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ?", "a": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "5:3"}, {"n": 27, "q": "ಸುನ್ನತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಹೇಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ಪುನಃ ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ", "r": "5:3"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "5:3"}, {"n": 29, "q": "“ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "5:3"}, {"n": 30, "q": "ಗಲಾತ್ಯರಿಗೆ 5:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.", "r": "5:3"}, {"n": 31, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು …”", "a": "“… ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "r": "5:3"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಬದ್ಧನಾಗಿದ್ದಾನೆ", "r": "5:3"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳುವ; ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "5:3"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:3"}, {"n": 35, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳ ಮೂಲಕ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು ಯಾರಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದಾರೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ", "r": "5:4"}, {"n": 36, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು ಯಾವುದರಿಂದ ದೂರವಾಗಿದ್ದಾರೆ?", "a": "ದೈವಾನುಗ್ರಹದಿಂದ", "r": "5:4"}, {"n": 37, "q": "ಪೌಲನ ಪ್ರಕಾರ ದೈವಾನುಗ್ರಹದಿಂದ ದೂರವಾಗಿರುವವರು ಯಾರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು", "r": "5:4"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ", "r": "5:4"}, {"n": 39, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "5:4"}, {"n": 40, "q": "ಗಲಾತ್ಯರಿಗೆ 5:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ. ದೈವಾನುಗ್ರಹದಿಂದ ದೂರವಾಗಿದ್ದೀರಿ.", "r": "5:4"}, {"n": 41, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ …”", "a": "“… ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "r": "5:4"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ", "r": "5:4"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು; ಪಡೆಯಬೇಕೆಂದಿರುವ", "r": "5:4"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:4"}, {"n": 45, "q": "ನಾವು ಯಾವ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ", "r": "5:5"}, {"n": 46, "q": "ನಾವು ಏನನ್ನು ಎದುರುನೋಡುತ್ತಿದ್ದೇವೆ?", "a": "ಈ ನಿರೀಕ್ಷೆ ಸಫಲವಾಗುವುದನ್ನು", "r": "5:5"}, {"n": 47, "q": "ನಾವು ಯಾರ ಮುಖಾಂತರ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ?", "a": "ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ", "r": "5:5"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ಪವಿತ್ರಾತ್ಮರ", "r": "5:5"}, {"n": 49, "q": "“ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "5:5"}, {"n": 50, "q": "ಗಲಾತ್ಯರಿಗೆ 5:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ; ಈ ನಿರೀಕ್ಷೆ ಸಫಲವಾಗುವುದನ್ನು ಎದುರುನೋಡುತ್ತಿದ್ದೇವೆ.", "r": "5:5"}, {"n": 51, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ …”", "a": "“… ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "r": "5:5"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಉಳ್ಳವರಾಗಿದ್ದೇವೆ", "r": "5:5"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ಸತ್ಸಂಬಂಧವನ್ನು; ಹೊಂದುತ್ತೇವೆಂಬ", "r": "5:5"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ವಿಶ್ವಾಸದಿಂದ", "r": "5:5"}, {"n": 55, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಯಾವುದು ಮುಖ್ಯವಲ್ಲ?", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "5:6"}, {"n": 56, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಪ್ರಮುಖವಾದುದು ಯಾವುದು?", "a": "ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸ", "r": "5:6"}, {"n": 57, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಪ್ರೀತಿ’ಯನ್ನು ಉಲ್ಲೇಖಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:6, 5:13, 5:14, 5:22", "r": "5:6; 5:13; 5:14; 5:22"}, {"n": 58, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಮುಖ್ಯವಲ್ಲದವರು ಯಾರು?", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ", "r": "5:6"}, {"n": 59, "q": "ಪ್ರಮುಖವಾದ ವಿಶ್ವಾಸವು ಹೇಗೆ ಕಾರ್ಯ ಎಸಗುತ್ತದೆ?", "a": "ಪ್ರೀತಿಯಿಂದ", "r": "5:6"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತ", "r": "5:6"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಮುಖವಾದುದು", "r": "5:6"}, {"n": 62, "q": "“ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 63, "q": "ಗಲಾತ್ಯರಿಗೆ 5:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ. ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ ಪ್ರಮುಖವಾದುದು.", "r": "5:6"}, {"n": 64, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ …”", "a": "“… ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "r": "5:6"}, {"n": 65, "q": "“ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ ಪ್ರಮುಖವಾದುದು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖ್ಯವಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "5:6"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "a": "ಬಾಳುವವರಿಗೆ", "r": "5:6"}, {"n": 68, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬದುಕನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ಓಟಕ್ಕೆ (“ನಿಮ್ಮ ಬದುಕಿನ ಓಟ”)", "r": "5:7"}, {"n": 69, "q": "ಗಲಾತ್ಯರ ಓಟಕ್ಕೆ ಅಡ್ಡಿಯಾದದ್ದರ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?”", "r": "5:7"}, {"n": 70, "q": "ಇದುವರೆಗೂ ಗಲಾತ್ಯರ ಬದುಕಿನ ಓಟ ಹೇಗೆ ಸಾಗುತ್ತಿತ್ತು?", "a": "ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು", "r": "5:7"}, {"n": 71, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಶರಣರಾಗದಂತೆ ತಡೆಯಲ್ಪಟ್ಟರು?", "a": "ಸತ್ಯಕ್ಕೆ", "r": "5:7"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಗುತ್ತಿತ್ತು", "r": "5:7"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?”", "a": "ಶರಣರಾಗದಂತೆ", "r": "5:7"}, {"n": 74, "q": "“ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 75, "q": "ಗಲಾತ್ಯರಿಗೆ 5:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು. ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?", "r": "5:7"}, {"n": 76, "q": "“ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು.”", "a": "ಇದುವರೆಗೂ", "r": "5:7"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಡೆದವರು ಯಾರು?”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:7"}, {"n": 79, "q": "ಗಲಾತ್ಯರಿಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು ಯಾರು ಅಲ್ಲ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರನ್ನು ಕರೆದ ದೇವರು ಅಲ್ಲ", "r": "5:8"}, {"n": 80, "q": "ಗಲಾತ್ಯರನ್ನು ಕರೆದವರು ಯಾರು?", "a": "ದೇವರು", "r": "5:8"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:8"}, {"n": 82, "q": "“ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "5:8"}, {"n": 83, "q": "ಗಲಾತ್ಯರಿಗೆ 5:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.", "r": "5:8"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ಮಾಡಿದವರು", "r": "5:8"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ಕರೆದ", "r": "5:8"}, {"n": 86, "q": "ಹುಳಿಯ ಬಗ್ಗೆ ಪೌಲನು ಹೇಳುವ ಗಾದೆ ಮಾತು ಯಾವುದು?", "a": "“ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!”", "r": "5:9"}, {"n": 87, "q": "ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು ಎಷ್ಟು ಹುಳಿ ಸಾಕು?", "a": "ಒಂದಿಷ್ಟು", "r": "5:9"}, {"n": 88, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:9ರಲ್ಲಿ ಸ್ವಲ್ಪ ಹುಳಿ ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಏನು ಮಾಡುತ್ತದೆ?", "a": "ಹುದುಗೆಬ್ಬಿಸುತ್ತದೆ", "r": "5:9"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುದುಗೆಬ್ಬಿಸಲು!”", "a": "ಹಿಟ್ಟನ್ನೆಲ್ಲಾ", "r": "5:9"}, {"n": 90, "q": "“ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "5:9"}, {"n": 91, "q": "ಗಲಾತ್ಯರಿಗೆ 5:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!", "r": "5:9"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದಿಷ್ಟು ಹುಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!”", "a": "ಸಾಕು", "r": "5:9"}, {"n": 93, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನಿಗೆ ಪ್ರಭುವಿನಲ್ಲಿ ಯಾವ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ?", "a": "ಅವರು ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ಮಣಿಯುವುದಿಲ್ಲವೆಂದು", "r": "5:10"}, {"n": 94, "q": "ಗಲಾತ್ಯರಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "5:10"}, {"n": 95, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನ ದೃಢವಾದ ನಂಬಿಕೆ ಯಾರಲ್ಲಿ ಇದೆ?", "a": "ಪ್ರಭುವಿನಲ್ಲಿ", "r": "5:10"}, {"n": 96, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ಪೌಲನಿಗೆ ನಂಬಿಕೆ ಇದೆ?", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ", "r": "5:10"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ", "r": "5:10"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "5:10"}, {"n": 99, "q": "“ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 100, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ …”", "a": "“… ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.”", "r": "5:10"}, {"n": 101, "q": "ಗಲಾತ್ಯರಿಗೆ 5:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ. ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.", "r": "5:10"}, {"n": 102, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು …”", "a": "“… ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "r": "5:10"}, {"n": 103, "q": "“ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "a": "ಮಣಿಯುವುದಿಲ್ಲವೆಂದು", "r": "5:10"}, {"n": 105, "q": "ಪೌಲನ ಬಗ್ಗೆ ಕೆಲವರು ಏನು ಹೇಳುತ್ತಿದ್ದರು?", "a": "ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ಅವನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿದ್ದಾನೆ ಎಂದು", "r": "5:11"}, {"n": 106, "q": "ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸುತ್ತಿದ್ದರೆ ತನಗೆ ಏನಾಗುತ್ತಿರಲಿಲ್ಲ ಎಂದು ಪೌಲನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು?”", "r": "5:11"}, {"n": 107, "q": "ಪೌಲನು ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸಿದ್ದರೆ ಯಾವುದರಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ?", "a": "ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ", "r": "5:11"}, {"n": 108, "q": "ಪೌಲನು ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಯಾವ ಸಂಬೋಧನೆಯಿಂದ ಕರೆಯುತ್ತಾನೆ?", "a": "“ಸಹೋದರರೇ” (5:11; 5:13)", "r": "5:11; 5:13"}, {"n": 109, "q": "ಪೌಲನು ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸುತ್ತಿಲ್ಲ ಎಂಬುದಕ್ಕೆ ಅವನು ಕೊಡುವ ಪುರಾವೆ ಏನು?", "a": "ಅವನು ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸುತ್ತಿರುವುದು", "r": "5:11"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?”", "a": "ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು", "r": "5:11"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು", "r": "5:11"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "5:11"}, {"n": 113, "q": "“ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 114, "q": "“ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 115, "q": "ಗಲಾತ್ಯರಿಗೆ 5:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ? ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು? ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ.", "r": "5:11"}, {"n": 116, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು …”", "a": "“… ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?”", "r": "5:11"}, {"n": 117, "q": "“ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 118, "q": "ಗಲಾತ್ಯರಿಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು", "r": "5:12"}, {"n": 119, "q": "ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು ಎಂದು ಪೌಲನು ಯಾರ ಬಗ್ಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ಗಲಾತ್ಯರಿಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರ ಬಗ್ಗೆ", "r": "5:12"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.”", "a": "ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ", "r": "5:12"}, {"n": 121, "q": "“ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "5:12"}, {"n": 122, "q": "ಗಲಾತ್ಯರಿಗೆ 5:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.", "r": "5:12"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.”", "a": "ಕೊಡುತ್ತಿರುವವರು", "r": "5:12"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಲೇಸು", "r": "5:12"}, {"n": 125, "q": "ದೇವರು ಗಲಾತ್ಯರನ್ನು ಯಾವ ಜೀವನಕ್ಕೆ ಕರೆದಿದ್ದಾರೆ?", "a": "ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನಕ್ಕೆ", "r": "5:13"}, {"n": 126, "q": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಯಾವುದಕ್ಕೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬಾರದು?", "a": "ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ", "r": "5:13"}, {"n": 127, "q": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದುರುಪಯೋಗ ಮಾಡುವ ಬದಲು ಗಲಾತ್ಯರು ಏನು ಮಾಡಬೇಕು?", "a": "“ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.”", "r": "5:13"}, {"n": 128, "q": "ಗಲಾತ್ಯರು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ಕರೆದವರು ಯಾರು?", "a": "ದೇವರು", "r": "5:13"}, {"n": 129, "q": "ಗಲಾತ್ಯರು ಒಬ್ಬರಿಗೊಬ್ಬರು ಹೇಗೆ ಸೇವೆಮಾಡಬೇಕು?", "a": "ಪ್ರೀತಿಯಿಂದ", "r": "5:13"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.”", "a": "ನಡೆಸಬೇಕೆಂದು", "r": "5:13"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ.”", "a": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು", "r": "5:13"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.”", "a": "ಒಬ್ಬರಿಗೊಬ್ಬರು", "r": "5:13"}, {"n": 133, "q": "“ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 134, "q": "“ಬದಲಾಗಿ, ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 135, "q": "ಗಲಾತ್ಯರಿಗೆ 5:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ. ಆದರೆ, ಆ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ. ಬದಲಾಗಿ, ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.", "r": "5:13"}, {"n": 136, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ …”", "a": "“… ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.”", "r": "5:13"}, {"n": 137, "q": "“ಆದರೆ, ಆ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 138, "q": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿರುವ ಒಂದೇ ವಚನ ಯಾವುದು?", "a": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು”", "r": "5:14"}, {"n": 139, "q": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು” ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಏನು ಅಡಗಿದೆ?", "a": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರ", "r": "5:14"}, {"n": 140, "q": "“… ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು” — ನಾವು ನೆರೆಯವರನ್ನು ಯಾರಂತೆ ಪ್ರೀತಿಸಬೇಕು?", "a": "ನಮ್ಮನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ", "r": "5:14"}, {"n": 141, "q": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಎಷ್ಟು ವಚನದಲ್ಲಿ ಅಡಗಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಒಂದೇ ವಚನದಲ್ಲಿ", "r": "5:14"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ", "r": "5:14"}, {"n": 143, "q": "“‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "5:14"}, {"n": 144, "q": "ಗಲಾತ್ಯರಿಗೆ 5:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,” ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.", "r": "5:14"}, {"n": 145, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ …”", "a": "“… ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "r": "5:14"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಡಗಿದೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರವು", "r": "5:14"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ನಿನ್ನನ್ನೇ; ನೆರೆಯವರನ್ನು", "r": "5:14"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ಪ್ರೀತಿಸು", "r": "5:14"}, {"n": 149, "q": "ಗಲಾತ್ಯರು ನಿಲ್ಲಿಸಬೇಕಾದ ಮೂರು ವಿಷಯಗಳು ಯಾವುವು?", "a": "ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ", "r": "5:15"}, {"n": 150, "q": "ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಪೌಲನು ಎಚ್ಚರಿಸುತ್ತಾನೆ?", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ", "r": "5:15"}, {"n": 151, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:15 ಯಾವ ಪದದಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಎಚ್ಚರಿಕೆ!", "r": "5:15"}, {"n": 152, "q": "ಗಲಾತ್ಯರು ಕಚ್ಚಾಟವನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಯಾರಿಂದ ವಿನಾಶವಾದಾರು?", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು", "r": "5:15"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "a": "ನಿಲ್ಲಿಸದಿದ್ದರೆ", "r": "5:15"}, {"n": 154, "q": "“ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "5:15"}, {"n": 155, "q": "ಗಲಾತ್ಯರಿಗೆ 5:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!", "r": "5:15"}, {"n": 156, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ …”", "a": "“… - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "r": "5:15"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು", "r": "5:15"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಚ್ಚರಿಕೆ!”", "a": "ಇವುಗಳನ್ನು; ವಿನಾಶವಾದೀರಿ", "r": "5:15"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಎಚ್ಚರಿಕೆ", "r": "5:15"}, {"n": 160, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:16ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಹಾಗೂ ದೇಹದ ದುಷ್ಫಲಗಳು", "r": "5:16"}, {"n": 161, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು?", "a": "ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ", "r": "5:16"}, {"n": 162, "q": "ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಂಡರೆ ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಈಡಾಗಲಾರರು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ", "r": "5:16"}, {"n": 163, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಜಯಿಸಲು ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯ ನೀಡುವ ಎರಡು ಮಾರ್ಗಗಳು ಯಾವುವು?", "a": "1) ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳುವುದು (5:16); 2) ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಶಿಲುಬೆಗೆ ಜಡಿಯುವುದು (5:24)", "r": "5:16; 5:24"}, {"n": 164, "q": "“ನಾನು ಹೇಳುವುದೇನೆಂದರೆ:” — ಎಂದು ಆರಂಭಿಸಿ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು.”", "r": "5:16"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ದೈಹಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಈಡಾಗಲಾರಿರಿ.”", "a": "ವ್ಯಾಮೋಹಕ್ಕೆ", "r": "5:16"}, {"n": 166, "q": "ಗಲಾತ್ಯರಿಗೆ 5:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಹೇಳುವುದೇನೆಂದರೆ: ನೀವು ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು. ಆಗ, ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ನೀವು ಈಡಾಗಲಾರಿರಿ.", "r": "5:16"}, {"n": 167, "q": "“ಆಗ, ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ನೀವು ಈಡಾಗಲಾರಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "5:16"}, {"n": 168, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಯಾರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ?", "a": "ಪವಿತ್ರಾತ್ಮರಿಗೆ", "r": "5:17"}, {"n": 169, "q": "ನಮ್ಮ ಬಯಕೆ ಏಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹ ಮತ್ತು ಪವಿತ್ರಾತ್ಮ ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ", "r": "5:17"}, {"n": 170, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ವಿರುದ್ಧವಾಗಿರುವವರು ಯಾರು?", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "5:17"}, {"n": 171, "q": "ಯಾವ ಎರಡು ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುತ್ತವೆ?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹ ಮತ್ತು ಪವಿತ್ರಾತ್ಮ", "r": "5:17"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾಗಿದೆ.”", "a": "ಪವಿತ್ರಾತ್ಮರಿಗೆ", "r": "5:17"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.”", "a": "ಕಾದಾಡುವುದರಿಂದ", "r": "5:17"}, {"n": 174, "q": "“ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಪವಿತ್ರಾತ್ಮರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 175, "q": "“ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 176, "q": "ಗಲಾತ್ಯರಿಗೆ 5:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಪವಿತ್ರಾತ್ಮರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ. ಪವಿತ್ರಾತ್ಮ ಆ ವ್ಯಾಮೋಹಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದ್ದಾರೆ. ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.", "r": "5:17"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಗೂಡುವುದಿಲ್ಲ", "r": "5:17"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈಗೂಡುವುದಿಲ್ಲ.”", "a": "ಬಯಕೆ", "r": "5:17"}, {"n": 179, "q": "ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರು ಯಾವುದಕ್ಕೆ ಅಧೀನರಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ", "r": "5:18"}, {"n": 180, "q": "ಗಲಾತ್ಯರು ಯಾವಾಗ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ಅಧೀನರಲ್ಲ?", "a": "ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ", "r": "5:18"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "5:18"}, {"n": 182, "q": "“ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "5:18"}, {"n": 183, "q": "ಗಲಾತ್ಯರಿಗೆ 5:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.", "r": "5:18"}, {"n": 184, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ …”", "a": "“… ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "r": "5:18"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ವಿಧಿನಿಯಮಗಳಿಗೆ", "r": "5:18"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ನಡೆಯುವವರಾದರೆ; ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:18"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ಮಾರ್ಗದಲ್ಲಿ", "r": "5:18"}, {"n": 188, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳಲ್ಲಿ 5:19ರಲ್ಲಿ ಹೇಳಲಾದ ಮೂರು ಯಾವುವು?", "a": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ", "r": "5:19"}, {"n": 189, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:19–20ರಲ್ಲಿ ಹೆಸರಿಸಲಾದ ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ಎಷ್ಟು?", "a": "ಹದಿನಾಲ್ಕು (ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ, ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ) — “ಇತ್ಯಾದಿಗಳು”", "r": "5:19–20"}, {"n": 190, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳನ್ನು ಪೌಲನು ಹೇಳಿದ ಕ್ರಮದಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಿ.", "a": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ, ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ", "r": "5:19–20"}, {"n": 191, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವು ತಿಳಿದೇ ಇವೆ", "r": "5:19"}, {"n": 192, "q": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ ಇವು ಯಾವುದರ ದುಷ್ಪರಿಣಾಮಗಳು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ", "r": "5:19"}, {"n": 193, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ಎಷ್ಟು, ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಎಷ್ಟು?", "a": "ದುಷ್ಪರಿಣಾಮಗಳು ಹದಿನಾಲ್ಕು; ಸತ್ಫಲಗಳು ಒಂಬತ್ತು", "r": "5:19–22"}, {"n": 194, "q": "ಗಲಾತ್ಯರಿಗೆ 5:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ತಿಳಿದೇ ಇವೆ: ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ,", "r": "5:19"}, {"n": 195, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ವಿಗ್ರಹಾರಾಧನೆ’ಯ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಮಾಟಮಂತ್ರ", "r": "5:20"}, {"n": 196, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ಕೊನೆಯದು ಯಾವುದು?", "a": "ದುಂದೌತಣ", "r": "5:20"}, {"n": 197, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲೂ ಅಧ್ಯಾಯದ ಕೊನೆಯ ಎಚ್ಚರಿಕೆಯಲ್ಲೂ ಬರುವ ದುರ್ಗುಣ ಯಾವುದು?", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20; 5:26"}, {"n": 198, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಕ್ರೋಧ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಸ್ವಾರ್ಥಭೇದ", "r": "5:20"}, {"n": 199, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಜಗಳ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20"}, {"n": 200, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಮತ್ಸರ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಕುಡುಕತನ", "r": "5:20"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ವಿಗ್ರಹಾರಾಧನೆ", "r": "5:20"}, {"n": 202, "q": "“ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "5:20"}, {"n": 203, "q": "ಗಲಾತ್ಯರಿಗೆ 5:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.", "r": "5:20"}, {"n": 204, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, …”", "a": "“… ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "r": "5:20"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ವಾರ್ಥಭೇದ; ಇತ್ಯಾದಿಗಳು", "r": "5:20"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ಮಾಟಮಂತ್ರ", "r": "5:20"}, {"n": 208, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ಯಾವುದಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ?", "a": "ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ", "r": "5:21"}, {"n": 209, "q": "‘ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ’ ಎಂದು ಪೌಲನು ಯಾವಾಗ ಎಚ್ಚರಿಸಿದ್ದನು?", "a": "ಈಗಾಗಲೇ ಎಚ್ಚರಿಸಿದ್ದನು; ಈಗಲೂ ಎಚ್ಚರಿಸುತ್ತಾನೆ", "r": "5:21"}, {"n": 210, "q": "ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲದವರು ಯಾರು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು", "r": "5:21"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಎಚ್ಚರಿಸಿದ್ದೇನೆ", "r": "5:21"}, {"n": 212, "q": "“ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "5:21"}, {"n": 213, "q": "ಗಲಾತ್ಯರಿಗೆ 5:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ; ಈಗಲೂ ಎಚ್ಚರಿಸುತ್ತೇನೆ.", "r": "5:21"}, {"n": 214, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ …”", "a": "“… ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "r": "5:21"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ", "r": "5:21"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ಕೃತ್ಯಗಳನ್ನು; ಬಾಧ್ಯರಲ್ಲ", "r": "5:21"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:21"}, {"n": 218, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಯಾವುವು?", "a": "ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ", "r": "5:22"}, {"n": 219, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:22ರಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಎಷ್ಟು?", "a": "ಒಂಬತ್ತು", "r": "5:22"}, {"n": 220, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ಮೊದಲನೆಯದು ಮತ್ತು ಕೊನೆಯದು ಯಾವುವು?", "a": "ಪ್ರೀತಿ; ಸಂಯಮ", "r": "5:22"}, {"n": 221, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಸಹನೆ’ಯ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ದಯೆ", "r": "5:22"}, {"n": 222, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಸದ್ಗುಣ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಪ್ರಾಮಾಣಿಕತೆ", "r": "5:22"}, {"n": 223, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಆನಂದ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಶಾಂತಿಸಮಾಧಾನ", "r": "5:22"}, {"n": 224, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಸಂಯಮ’ಕ್ಕೆ ಮುಂಚಿನದು ಯಾವುದು?", "a": "ಸೌಜನ್ಯ", "r": "5:22"}, {"n": 225, "q": "ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ ಇವು ಯಾರಿಂದ ದತ್ತವಾದ ಸತ್ಫಲಗಳು?", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ", "r": "5:22"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರೀತಿ, ಆನಂದ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.”", "a": "ಶಾಂತಿಸಮಾಧಾನ", "r": "5:22"}, {"n": 227, "q": "“ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "5:22"}, {"n": 228, "q": "ಗಲಾತ್ಯರಿಗೆ 5:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಯಾವುದೆಂದರೆ: ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.", "r": "5:22"}, {"n": 229, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, …”", "a": "“… ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.”", "r": "5:22"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.”", "a": "ಪ್ರಾಮಾಣಿಕತೆ", "r": "5:22"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರೀತಿ; ಇಂಥವುಗಳೇ", "r": "5:22"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ - ಇಂಥವುಗಳೇ.”", "a": "ಸದ್ಗುಣ", "r": "5:22"}, {"n": 233, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳನ್ನು ಯಾವುದೂ ಆಕ್ಷೇಪಿಸುವುದಿಲ್ಲ?", "a": "ಯಾವ ಧರ್ಮಶಾಸ್ತ್ರವೂ", "r": "5:23"}, {"n": 234, "q": "“ಇವುಗಳನ್ನು ಯಾವ ಧರ್ಮಶಾಸ್ತ್ರವೂ ಆಕ್ಷೇಪಿಸುವುದಿಲ್ಲ” — ಇಲ್ಲಿ ಇವುಗಳು ಯಾವುವು?", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು", "r": "5:23"}, {"n": 235, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿಗೆ ಸೇರಿದ ಎಲ್ಲರೂ ತಮ್ಮ ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಏನು ಮಾಡಿದ್ದಾರೆ?", "a": "ಅದರ ಆಶಾಪಾಶಗಳ ಹಾಗೂ ದುರಿಚ್ಛೆಗಳ ಸಮೇತ ಶಿಲುಬೆಗೆ ಜಡಿದುಬಿಟ್ಟಿದ್ದಾರೆ", "r": "5:24"}, {"n": 236, "q": "ತಮ್ಮ ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಶಿಲುಬೆಗೆ ಜಡಿದುಬಿಟ್ಟಿರುವವರು ಯಾರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿಗೆ ಸೇರಿದ ಎಲ್ಲರೂ", "r": "5:24"}, {"n": 237, "q": "ದೈಹಿ
