ೆ?", "a": "ಹುಟ್ಟು ಯೆಹೂದ್ಯರು", "r": "2:15"}, {"n": 187, "q": "‘ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ’ ಜನರು ಯಾರು ಎಂದು ಪೌಲನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಅನ್ಯಧರ್ಮೀಯರು", "r": "2:15"}, {"n": 188, "q": "ಪೌಲನು ಹುಟ್ಟು ಯೆಹೂದ್ಯರನ್ನು ಯಾರಿಂದ ಬೇರ್ಪಡಿಸಿ ಹೇಳುತ್ತಾನೆ?", "a": "ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಿಂದ", "r": "2:15"}, {"n": 189, "q": "ಗಲಾತ್ಯರಿಗೆ 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವಂತೂ ಹುಟ್ಟು ಯೆಹೂದ್ಯರು; ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಲ್ಲ.", "r": "2:15"}, {"n": 190, "q": "ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೇಗೆ ಪಡೆಯುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ", "r": "2:16"}, {"n": 191, "q": "ಮಾನವನು ಯಾವುದರಿಂದ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವುದಿಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದ", "r": "2:16"}, {"n": 192, "q": "ಪೌಲನು ಮತ್ತು ಇತರರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟದ್ದು ಏಕೆ?", "a": "ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ", "r": "2:16"}, {"n": 193, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:16ರಲ್ಲಿ “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು” ಎಂಬ ಪದಗುಚ್ಛ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ", "r": "2:16"}, {"n": 194, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ದೊರಕುವುದಾದರೆ ಏನಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕ", "r": "2:16; 2:21"}, {"n": 195, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ…” — ಈ ವಾಕ್ಯವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "r": "2:16"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "a": "ಅನುಸರಿಸುವುದರಿಂದಲೆ", "r": "2:16"}, {"n": 199, "q": "“ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 200, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ …”", "a": "“… ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "r": "2:16"}, {"n": 201, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 202, "q": "ಗಲಾತ್ಯರಿಗೆ 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು. ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ. ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.", "r": "2:16"}, {"n": 203, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ …”", "a": "“… ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "r": "2:16"}, {"n": 204, "q": "“ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 205, "q": "ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುವವರು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡುಬಂದರೆ ಏನು ಹೇಳಿದಂತಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 206, "q": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುವ ವಾದಕ್ಕೆ ಪೌಲನ ಉತ್ತರವೇನು?", "a": "“ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.”", "r": "2:17"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "2:17"}, {"n": 208, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 209, "q": "ಗಲಾತ್ಯರಿಗೆ 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ. ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.", "r": "2:17"}, {"n": 210, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು …”", "a": "“… ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "r": "2:17"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ", "r": "2:17"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯತ್ನಿಸುತ್ತಿರುವ; ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಂತೆ", "r": "2:17"}, {"n": 214, "q": "ಪೌಲನು ತಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 215, "q": "ಪೌಲನ ಪ್ರಕಾರ ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟುವುದು ಯಾವ ಪರಿಣಾಮ ಉಂಟುಮಾಡುತ್ತದೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ", "r": "2:18"}, {"n": 217, "q": "“ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 218, "q": "ಗಲಾತ್ಯರಿಗೆ 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?", "r": "2:18"}, {"n": 219, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು …”", "a": "“… ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "r": "2:18"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕೆಡವಿದ್ದನ್ನೇ", "r": "2:18"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕಟ್ಟಿದರೆ; ನನ್ನನ್ನು", "r": "2:18"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ರುಜುವಾತು", "r": "2:18"}, {"n": 223, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಏನಾಗಿದ್ದಾನೆ?", "a": "ಸತ್ತವನಾಗಿದ್ದಾನೆ", "r": "2:19"}, {"n": 224, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿರುವುದು ಯಾವುದಕ್ಕೋಸ್ಕರ?", "a": "ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 225, "q": "ಪೌಲನು ಯಾವುದರ ಮೂಲಕ ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ", "r": "2:19"}, {"n": 226, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:19–20ರಲ್ಲಿ ಪೌಲನು ತಾನು ಯಾವುದರ ಪಾಲಿಗೆ ಸತ್ತವನು, ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನು; ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು", "r": "2:19–20"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 228, "q": "“ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 229, "q": "ಗಲಾತ್ಯರಿಗೆ 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.", "r": "2:19"}, {"n": 230, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ …”", "a": "“… ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "r": "2:19"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸತ್ತವನಾಗಿದ್ದೇನೆ", "r": "2:19"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ಪಾಲಿಗೆ", "r": "2:19"}, {"n": 233, "q": "ಪೌಲನು ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ", "r": "2:20"}, {"n": 234, "q": "ಈಗ ತನ್ನಲ್ಲಿ ಯಾರು ಜೀವಿಸುತ್ತಾರೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ.”", "r": "2:20"}, {"n": 235, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು” ಎಂಬ ಮಾತಿನ ನಂತರ ಪೌಲನು ತನ್ನ ಬಗ್ಗೆ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ.”", "r": "2:20"}, {"n": 236, "q": "ಪೌಲನು ಈಗ ಯಾವುದರಿಂದ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ?", "a": "ದೇವರ ಪುತ್ರನಲ್ಲಿ ತಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 237, "q": "ಪೌಲನ ಪ್ರಕಾರ ದೇವರ ಪುತ್ರನು ಅವನಿಗಾಗಿ ಮಾಡಿದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ಅವನನ್ನು ಪ್ರೀತಿಸಿದರು; ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದರು", "r": "2:20"}, {"n": 238, "q": "ಪೌಲನನ್ನು ಪ್ರೀತಿಸಿ ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದವರು ಯಾರು?", "a": "ದೇವರ ಪುತ್ರ", "r": "2:20"}, {"n": 239, "q": "ಪೌಲನು ಈಗ ಎಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಈ ದೇಹದಲ್ಲಿ", "r": "2:20"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜೀವಿಸುತ್ತಿದ್ದೇನೆ", "r": "2:20"}, {"n": 241, "q": "“ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 242, "q": "ಗಲಾತ್ಯರಿಗೆ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು. ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ. ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ. ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.", "r": "2:20"}, {"n": 243, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ …”", "a": "“… ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "r": "2:20"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ಪ್ರಾಣಾರ್ಪಣೆ; ಪುತ್ರನಲ್ಲಿ", "r": "2:20"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ನನ್ನನ್ನು", "r": "2:20"}, {"n": 247, "q": "ಪೌಲನು ಯಾವುದನ್ನು ನಿರಾಕರಿಸುವಂಥವನಲ್ಲ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 248, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಏನು ನಿರರ್ಥಕವೇ ಸರಿ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 249, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯ ವಚನದಲ್ಲಿ ಪೌಲನು ಏನನ್ನು ನಿರಾಕರಿಸುವುದಿಲ್ಲವೆಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "2:21"}, {"n": 251, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು …”", "a": "“… ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "r": "2:21"}, {"n": 252, "q": "ಗಲಾತ್ಯರಿಗೆ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು ನಿರಾಕರಿಸುವಂಥವನು ನಾನಲ್ಲ. ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.", "r": "2:21"}, {"n": 253, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ; ದೊರಕುವುದಾದರೆ", "r": "2:21"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಸತ್ಸಂಬಂಧವು", "r": "2:21"}]}, {"chapter": 3, "label": "ಅಧ್ಯಾಯ 3", "verses": 29, "subtitle": null, "questions": [{"n": 1, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರವೋ? ಶುಭಸಂದೇಶವೋ?", "r": "3:1"}, {"n": 2, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು 3:1ರಲ್ಲಿ ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "“ಎಲೈ ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರೇ”", "r": "3:1"}, {"n": 3, "q": "ಪೌಲನು ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರನ್ನು ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಿಮ್ಮನ್ನು ಮರುಳುಗೊಳಿಸಿದವರು ಯಾರು?”", "r": "3:1"}, {"n": 4, "q": "ಗಲಾತ್ಯರ ಕಣ್ಣೆದುರಿಗೇ ಏನನ್ನು ಚಿತ್ರಿತಗೊಳಿಸಲಾಗಿತ್ತು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು ಶಿಲುಬೆಯ ಮೇಲೆ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ್ದನ್ನು", "r": "3:1"}, {"n": 5, "q": "ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯ ಮರಣವನ್ನು ಗಲಾತ್ಯರಿಗೆ ಎಲ್ಲಿ ಚಿತ್ರಿತಗೊಳಿಸಲಾಗಿತ್ತು?", "a": "ಅವರ ಕಣ್ಣೆದುರಿಗೇ", "r": "3:1"}, {"n": 6, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಎರಡು ಬಾರಿ ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಮತಿಗೆಟ್ಟವರು (“ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರೇ” 3:1; “ಅಷ್ಟು ಮತಿಗೆಟ್ಟವರೋ?” 3:3)", "r": "3:1; 3:3"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಲೈ ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರೇ, ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರು?”", "a": "ಮರುಳುಗೊಳಿಸಿದವರು", "r": "3:1"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು ಶಿಲುಬೆಯ ಮೇಲೆ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ್ದನ್ನು ನಿಮ್ಮ ಕಣ್ಣೆದುರಿಗೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಚಿತ್ರಿತಗೊಳಿಸಲಿಲ್ಲವೆ", "r": "3:1"}, {"n": 9, "q": "“ಎಲೈ ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರೇ, ನಿಮ್ಮನ್ನು ಮರುಳುಗೊಳಿಸಿದವರು ಯಾರು?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "3:1"}, {"n": 10, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು ಶಿಲುಬೆಯ ಮೇಲೆ ಪ್ರಾಣಾರ್ಪಣೆ …”", "a": "“… ಮಾಡಿದ್ದನ್ನು ನಿಮ್ಮ ಕಣ್ಣೆದುರಿಗೇ ಚಿತ್ರಿತಗೊಳಿಸಲಿಲ್ಲವೆ?”", "r": "3:1"}, {"n": 11, "q": "ಗಲಾತ್ಯರಿಗೆ 3:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎಲೈ ಮತಿಗೆಟ್ಟ ಗಲಾತಿಯರೇ, ನಿಮ್ಮನ್ನು ಮರುಳುಗೊಳಿಸಿದವರು ಯಾರು? ಯೇಸುಕ್ರಿಸ್ತರು ಶಿಲುಬೆಯ ಮೇಲೆ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ್ದನ್ನು ನಿಮ್ಮ ಕಣ್ಣೆದುರಿಗೇ ಚಿತ್ರಿತಗೊಳಿಸಲಿಲ್ಲವೆ?", "r": "3:1"}, {"n": 12, "q": "“ಯೇಸುಕ್ರಿಸ್ತರು ಶಿಲುಬೆಯ ಮೇಲೆ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ್ದನ್ನು ನಿಮ್ಮ ಕಣ್ಣೆದುರಿಗೇ ಚಿತ್ರಿತಗೊಳಿಸಲಿಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "3:1"}, {"n": 13, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಪವಿತ್ರಾತ್ಮರ ಬಗ್ಗೆ ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದು ಹೇಗೆ?”", "r": "3:2"}, {"n": 14, "q": "ಗಲಾತ್ಯರು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದರ ಬಗ್ಗೆ ಪೌಲನು ಮುಂದಿಡುವ ಎರಡು ಆಯ್ಕೆಗಳು ಯಾವುವು?", "a": "1) ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲೋ? 2) ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸಿದ್ದರಿಂದಲೋ?", "r": "3:2"}, {"n": 15, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಪವಿತ್ರಾತ್ಮರು ದೊರಕುವುದು ಯಾವುದರ ಮೂಲಕ?", "a": "ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸುವುದರ ಮೂಲಕ (ವಿಶ್ವಾಸದ ಮೂಲಕ)", "r": "3:2; 3:5; 3:14"}, {"n": 16, "q": "ಗಲಾತ್ಯರಿಗೆ 3:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ಬಳಿ ಒಂದು ವಿಷಯವನ್ನು ಕೇಳಲಿಚ್ಛಿಸುತ್ತೇನೆ: ನೀವು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದು ಹೇಗೆ? ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲೋ? ಇಲ್ಲವೆ ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸಿದ್ದರಿಂದಲೋ?", "r": "3:2"}, {"n": 17, "q": "ಗಲಾತ್ಯರು ಯಾವ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿದ್ದರು?", "a": "ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು", "r": "3:3"}, {"n": 18, "q": "ಗಲಾತ್ಯರು ತಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಈಗ ಯಾವುದರಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದರು?", "a": "ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ", "r": "3:3"}, {"n": 19, "q": "ಗಲಾತ್ಯರ ಬದಲಾವಣೆಯ ಬಗ್ಗೆ ಪೌಲನು 3:3ರ ಕೊನೆಯಲ್ಲಿ ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀವು ಅಷ್ಟು ಮತಿಗೆಟ್ಟವರೋ?”", "r": "3:3"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "3:3"}, {"n": 21, "q": "“ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 22, "q": "ಗಲಾತ್ಯರಿಗೆ 3:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ? ನೀವು ಅಷ್ಟು ಮತಿಗೆಟ್ಟವರೋ?", "r": "3:3"}, {"n": 23, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ …”", "a": "“… ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "r": "3:3"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ", "r": "3:3"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೀವನವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "a": "ಆಧ್ಯಾತ್ಮಿಕ; ಪ್ರಾರಂಭಿಸಿಯೂ", "r": "3:3"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "a": "ಜೀವನವನ್ನು", "r": "3:3"}, {"n": 27, "q": "ಗಲಾತ್ಯರ ಅನುಭವಗಳ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?”", "r": "3:4"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?”", "a": "ಅನುಭವಗಳೆಲ್ಲವೂ", "r": "3:4"}, {"n": 29, "q": "“ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 30, "q": "ಗಲಾತ್ಯರಿಗೆ 3:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?", "r": "3:4"}, {"n": 31, "q": "ದೇವರು ಗಲಾತ್ಯರಿಗೆ ಏನನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ?", "a": "ಪವಿತ್ರಾತ್ಮರನ್ನು", "r": "3:5"}, {"n": 32, "q": "ದೇವರು ಗಲಾತ್ಯರಲ್ಲಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಿರುವುದು ಯಾವುದರಿಂದ?", "a": "ಅವರು ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸ ಇಟ್ಟಿರುವುದರಿಂದ (ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ)", "r": "3:5"}, {"n": 33, "q": "ದೇವರು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಏನನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ?", "a": "ಮಹತ್ಕಾರ್ಯಗಳನ್ನು", "r": "3:5"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.”", "a": "ಪವಿತ್ರಾತ್ಮರನ್ನು", "r": "3:5"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಮಾಡುತ್ತಿರುವುದು, ನೀವು ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ", "r": "3:5"}, {"n": 36, "q": "“ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 37, "q": "ಗಲಾತ್ಯರಿಗೆ 3:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ. ಹಾಗೆ ಮಾಡುತ್ತಿರುವುದು, ನೀವು ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ. ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ, ವಿಶ್ವಾಸ ಇಟ್ಟಿರುವುದರಿಂದ.", "r": "3:5"}, {"n": 38, "q": "“ಹಾಗೆ ಮಾಡುತ್ತಿರುವುದು, ನೀವು ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.”", "a": "ಮಹತ್ಕಾರ್ಯಗಳನ್ನು", "r": "3:5"}, {"n": 40, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು", "r": "3:6"}, {"n": 41, "q": "ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಕಾರಣ ದೇವರು ಆತನನ್ನು ಏನೆಂದು ಪರಿಗಣಿಸಿದರು?", "a": "ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ", "r": "3:6"}, {"n": 42, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದಾಗಿ ಪೌಲನು ಉಲ್ಲೇಖಿಸುವ ವಾಕ್ಯ ಯಾವುದು?", "a": "“ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು; ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "r": "3:6"}, {"n": 43, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು/ಸಂತತಿ ಯಾರು?", "a": "ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುವವರು (3:7); ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು (3:29)", "r": "3:6; 3:7; 3:9; 3:29"}, {"n": 44, "q": "ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು ಎಂಬುದು ಎಲ್ಲಿ ಬರೆದಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ", "r": "3:6"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.’”", "a": "ಸತ್ಸಂಬಂಧದಲ್ಲಿ", "r": "3:6"}, {"n": 46, "q": "“ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.’” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 47, "q": "ಗಲಾತ್ಯರಿಗೆ 3:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವಂತೆ: “ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು; ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "r": "3:6"}, {"n": 48, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು …”", "a": "“… ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.’”", "r": "3:6"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.’”", "a": "ಪರಿಗಣಿಸಿದರು", "r": "3:6"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.’”", "a": "ದೇವರು", "r": "3:6"}, {"n": 51, "q": "ಪೌಲನ ಪ್ರಕಾರ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು ಯಾರು?", "a": "ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ", "r": "3:7"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಅಬ್ರಹಾಮನ", "r": "3:7"}, {"n": 53, "q": "“ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 54, "q": "ಗಲಾತ್ಯರಿಗೆ 3:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.", "r": "3:7"}, {"n": 55, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ …”", "a": "“… ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "r": "3:7"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಜೀವಿಸುತ್ತಾರೋ", "r": "3:7"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಮಕ್ಕಳೆಂದು", "r": "3:7"}, {"n": 58, "q": "ದೇವರು ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುವುದು ಯಾವುದರ ಮೂಲಕ?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕವೇ", "r": "3:8"}, {"n": 59, "q": "ಅಬ್ರಹಾಮನಿಗೆ ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾದ ಶುಭವರ್ತಮಾನ ಯಾವುದು?", "a": "“ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು”", "r": "3:8"}, {"n": 60, "q": "“ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು” ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಯಾರಿಗೆ ತಿಳಿಸಲಾಯಿತು?", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:8"}, {"n": 61, "q": "ಅನ್ಯಧರ್ಮೀಯರ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಏನು ಬರೆಯಲಾಗಿತ್ತು?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು", "r": "3:8"}, {"n": 62, "q": "ಶುಭವರ್ತಮಾನವನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ಯಾವಾಗ ತಿಳಿಸಲಾಯಿತು?", "a": "ಮುಂಚಿತವಾಗಿ", "r": "3:8"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.”", "a": "ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ", "r": "3:8"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣದಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು,’ ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.”", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:8"}, {"n": 65, "q": "“ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "3:8"}, {"n": 66, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ಕಾರಣದಿಂದಲೇ ಅಬ್ರಹಾಮನಿಗೆ, ‘ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ …”", "a": "“… ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು,’ ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.”", "r": "3:8"}, {"n": 67, "q": "ಗಲಾತ್ಯರಿಗೆ 3:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು. ಈ ಕಾರಣದಿಂದಲೇ ಅಬ್ರಹಾಮನಿಗೆ, “ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು,” ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.", "r": "3:8"}, {"n": 68, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು …”", "a": "“… ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.”", "r": "3:8"}, {"n": 69, "q": "ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ಏನನ್ನು ಪಡೆಯುವರು?", "a": "ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ", "r": "3:9"}, {"n": 70, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:9ರಲ್ಲಿ ‘ವಿಶ್ವಾಸಿ’ ಎಂದು ಕರೆಯಲ್ಪಟ್ಟವನು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು", "r": "3:9"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "3:9"}, {"n": 72, "q": "“ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "3:9"}, {"n": 73, "q": "ಗಲಾತ್ಯರಿಗೆ 3:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.", "r": "3:9"}, {"n": 74, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ …”", "a": "“… ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "r": "3:9"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವರು.”", "a": "ಸೌಭಾಗ್ಯವನ್ನೇ", "r": "3:9"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "a": "ಹೀಗಿರಲಾಗಿ", "r": "3:9"}, {"n": 77, "q": "ಪೌಲನ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು", "r": "3:10"}, {"n": 78, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತನು ಎಂದು ಲಿಖಿತವಾಗಿದೆ?", "a": "“ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು”", "r": "3:10"}, {"n": 79, "q": "ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಎಷ್ಟು ಬಾರಿ ಕೈಗೊಂಡು ನಡೆಯಬೇಕು ಎಂದು ಲಿಖಿತವಾಗಿದೆ?", "a": "ಅನುದಿನವೂ", "r": "3:10"}, {"n": 80, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಶಾಪಗ್ರಸ್ತನು” ಎಂದು ಲಿಖಿತವಾದ ಎರಡು ಉಲ್ಲೇಖಗಳು ಯಾರನ್ನು ಕುರಿತಿವೆ?", "a": "ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನು (3:10); ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನು (3:13)", "r": "3:10; 3:13"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು.”", "a": "ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು", "r": "3:10"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ‘ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ", "r": "3:10"}, {"n": 83, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 84, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಏಕೆಂದರೆ, ‘ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು …”", "a": "“… ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಲಿಖಿತವಾಗಿದೆ.”", "r": "3:10"}, {"n": 85, "q": "ಗಲಾತ್ಯರಿಗೆ 3:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು. ಏಕೆಂದರೆ, “ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,” ಎಂದು ಲಿಖಿತವಾಗಿದೆ.", "r": "3:10"}, {"n": 86, "q": "“ಏಕೆಂದರೆ, ‘ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಲಿಖಿತವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 87, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಏನು ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಸ್ಪಷ್ಟವಾಗಿದೆ?", "a": "ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು", "r": "3:11"}, {"n": 88, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದಿರುವವರು ಯಾವುದರಿಂದ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ?", "a": "“ವಿಶ್ವಾಸದಿಂದಲೇ”", "r": "3:11"}, {"n": 89, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ?", "a": "ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುವವರು", "r": "3:11"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.”", "a": "ವಿಧಿಸುವುದನ್ನು", "r": "3:11"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾಕೆಂದರೆ, ‘ಯಾರು ದೇವರೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಂದಿರುತ್ತಾರೋ ಅವರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ’ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಸತ್ಸಂಬಂಧವನ್ನು", "r": "3:11"}, {"n": 92, "q": "“ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 93, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯಾಕೆಂದರೆ, ‘ಯಾರು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುತ್ತಾರೋ ಅವರು …”", "a": "“… ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ’ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "r": "3:11"}, {"n": 94, "q": "ಗಲಾತ್ಯರಿಗೆ 3:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ. ಯಾಕೆಂದರೆ, “ಯಾರು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುತ್ತಾರೋ ಅವರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ” ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.", "r": "3:11"}, {"n": 95, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ …”", "a": "“… ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.”", "r": "3:11"}, {"n": 96, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವುದನ್ನು ಆಧರಿಸಿಲ್ಲ?", "a": "ವಿಶ್ವಾಸವನ್ನು", "r": "3:12"}, {"n": 97, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನ ಬಗ್ಗೆ ಏನೆಂದು ಬರೆಯಲಾಗಿದೆ?", "a": "“ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ”", "r": "3:12"}, {"n": 98, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಯಾವುದರ ಮೂಲಕ ಜೀವಿಸುತ್ತಾನೆ?", "a": "ಆ ವಿಧಿನಿಯಮಗಳ ಮೂಲಕ", "r": "3:12"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ‘ಅದರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,’ ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "3:12"}, {"n": 100, "q": "“ಬದಲಿಗೆ, ‘ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,’ ಎಂದು ಬರೆಯಲಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 101, "q": "ಗಲಾತ್ಯರಿಗೆ 3:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರ ವಿಶ್ವಾಸವನ್ನು ಆಧರಿಸಿಲ್ಲ. ಬದಲಿಗೆ, “ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,” ಎಂದು ಬರೆಯಲಾಗಿದೆ.", "r": "3:12"}, {"n": 102, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬದಲಿಗೆ, ‘ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು …”", "a": "“… ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,’ ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "r": "3:12"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ‘ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "a": "ಜೀವಿಸುತ್ತಾನೆ", "r": "3:12"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ‘ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಾಲಿಸುವವನು; ಬರೆಯಲಾಗಿದೆ", "r": "3:12"}, {"n": 105, "q": "ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದವನ ಬಗ್ಗೆ ಏನೆಂದು ಬರೆಯಲಾಗಿದೆ?", "a": "“ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು”", "r": "3:13"}, {"n": 106, "q": "ಕ್ರಿಸ್ತಯೇಸು ನಮಗೋಸ್ಕರ ಏನಾದರು?", "a": "ಶಾಪ ಸ್ವರೂಪಿಯಾದರು", "r": "3:13"}, {"n": 107, "q": "ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ನಮ್ಮನ್ನು ಯಾವುದರಿಂದ ಪಾರುಮಾಡಿದರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ", "r": "3:13"}, {"n": 108, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದವರು ಯಾರು?", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:13"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:13"}, {"n": 110, "q": "“‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 111, "q": "ಗಲಾತ್ಯರಿಗೆ 3:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,” ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.", "r": "3:13"}, {"n": 112, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "r": "3:13"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,’ ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ", "r": "3:13"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಶಾಪಗ್ರಸ್ತನು; ಬರೆದಿರುವಂತೆ", "r": "3:13"}, {"n": 115, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ಏನು ದೊರಕುವಂತಾಯಿತು?", "a": "ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ", "r": "3:14"}, {"n": 116, "q": "ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ ನಮಗೂ ಯಾರು ದೊರಕುವಂತಾಯಿತು?", "a": "ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ", "r": "3:14"}, {"n": 117, "q": "ಕ್ರಿಸ್ತಯೇಸು ಶಾಪದಿಂದ ಪಾರುಮಾಡಿದ್ದರ ಎರಡು ಫಲಗಳು ಯಾವುವು?", "a": "1) ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು; 2) ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ವಿಶ್ವಾಸದ ಮೂಲಕ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು", "r": "3:14"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "3:14"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "3:14"}, {"n": 120, "q": "“ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 121, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ …”", "a": "“… ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.”", "r": "3:14"}, {"n": 122, "q": "ಗಲಾತ್ಯರಿಗೆ 3:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು; ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.", "r": "3:14"}, {"n": 123, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;”", "r": "3:14"}, {"n": 124, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:15ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ರದ್ದಾಗದ ವಾಗ್ದಾನ", "r": "3:15"}, {"n": 125, "q": "ಪೌಲನು ದೈನಂದಿನ ಜೀವನದಿಂದ ಯಾವ ಉದಾಹರಣೆಯನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಮಾಡಿಕೊಳ್ಳುವ ಒಪ್ಪಂದ", "r": "3:15"}, {"n": 126, "q": "ಕ್ರಮಬದ್ಧವಾಗಿ ಮಾಡಿ ಮುಗಿಸಿದ ಒಪ್ಪಂದದ ಬಗ್ಗೆ ಯಾರೂ ಏನು ಮಾಡುವಂತಿಲ್ಲ?", "a": "ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ", "r": "3:15"}, {"n": 127, "q": "ಪೌಲನು 3:15ರಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "“ಪ್ರಿಯ ಸಹೋದರರೇ”", "r": "3:15"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಒಂದು ಒಪ್ಪಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "3:15"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.”", "a": "ರದ್ದುಮಾಡುವಂತಿಲ್ಲ", "r": "3:15"}, {"n": 130, "q": "“ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಒಂದು ಒಪ್ಪಂದ ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 131, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ …”", "a": "“… ಮೇಲೆ ಯಾರೂ ಅದನ್ನು ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.”", "r": "3:15"}, {"n": 132, "q": "ಗಲಾತ್ಯರಿಗೆ 3:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ದೈನಂದಿನ ಜೀವನದಿಂದ ಒಂದು ಉದಾಹಣೆಯನ್ನೇ ತೆಗೆದುಕೊಳ್ಳೋಣ: ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಒಂದು ಒಪ್ಪಂದ ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ. ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.", "r": "3:15"}, {"n": 133, "q": "“ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 134, "q": "ದೇವರು ಯಾರಿಗೆ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು?", "a": "ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ", "r": "3:16"}, {"n": 135, "q": "“ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಮತ್ತು “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂಬ ಮಾತುಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಪೌಲನು ಹೇಗೆ ವಿವರಿಸುತ್ತಾನೆ?", "a": "“ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಎಂದರೆ ಅನೇಕರು; “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂದರೆ ಒಬ್ಬ ವ್ಯಕ್ತಿ", "r": "3:16"}, {"n": 136, "q": "ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಲಾದ ‘ಒಬ್ಬ ವ್ಯಕ್ತಿ’ ಯಾರು?", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:16"}, {"n": 137, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸಂತತಿ’ ಎಂಬ ಪದ ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವನ್ನು (3:16, 19); ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರೂ ಅಬ್ರಹಾಮನ ಸಂತತಿ (3:29)", "r": "3:16; 3:19; 3:29"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಯೇ, ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನಿಗೂ", "r": "3:16"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ’ ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, ‘ನಿನ್ನ ಸಂತತಿಗೆ’ ಎಂದು ಹೇಳಿ ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು.”", "a": "ವ್ಯಕ್ತಿಯನ್ನೇ", "r": "3:16"}, {"n": 140, "q": "“ಹಾಗೆಯೇ, ದೇವರು ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 141, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ’ ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, ‘ನಿನ್ನ …”", "a": "“… ಸಂತತಿಗೆ’ ಎಂದು ಹೇಳಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನೇ ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು.”", "r": "3:16"}, {"n": 142, "q": "ಗಲಾತ್ಯರಿಗೆ 3:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗೆಯೇ, ದೇವರು ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು. “ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂದು ಹೇಳಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನೇ ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು. ಆ ವ್ಯಕ್ತಿಯೇ ಕ್ರಿಸ್ತಯೇಸು.", "r": "3:16"}, {"n": 143, "q": "“‘ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ’ ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, ‘ನಿನ್ನ ಸಂತತಿಗೆ’ ಎಂದು ಹೇಳಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನೇ ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 144, "q": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಒಪ್ಪಂದ ಮಾಡಿದ ಎಷ್ಟು ವರ್ಷಗಳಾದ ಮೇಲೆ ಧರ್ಮಶಾಸ್ತ್ರ ಬಂತು?", "a": "ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ", "r": "3:17"}, {"n": 145, "q": "ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಏನು ಮಾಡಲಾಗದು?", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ರದ್ದುಪಡಿಸಲಾಗದು; ಆ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು", "r": "3:17"}, {"n": 146, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಯಾವ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು?", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದದ ವಾಗ್ದಾನವನ್ನು", "r": "3:17"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;”", "a": "ಅಬ್ರಹಾಮನೊಂದಿಗೆ", "r": "3:17"}, {"n": 148, "q": "“ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "3:17"}, {"n": 149, "q": "ಗಲಾತ್ಯರಿಗೆ 3:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು; ಆ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು.", "r": "3:17"}, {"n": 150, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ …”", "a": "“… ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;”", "r": "3:17"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರದ್ದುಪಡಿಸಲಾಗದು;”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ", "r": "3:17"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮಾಡಿಮುಗಿಸಿದ; ರದ್ದುಪಡಿಸಲಾಗದು", "r": "3:17"}, {"n": 153, "q": "ದೇವರು ಹಕ್ಕುಬಾಧ್ಯತೆಯನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ಯಾವುದರ ಮೂಲಕ ದಯಪಾಲಿಸಿದರು?", "a": "ವಾಗ್ದಾನದ ಮೂಲಕವೇ", "r": "3:18"}, {"n": 154, "q": "ಹಕ್ಕುಬಾಧ್ಯತೆ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಏನೆಂದಂತಾಯಿತು?", "a": "ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು", "r": "3:18"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.”", "a": "ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ", "r": "3:18"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ದೇವರು ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯಪಾಲಿಸಿದ್ದು ವಾಗ್ದಾನದ ಮೂಲಕವೇ.”", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:18"}, {"n": 157, "q": "“ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "3:18"}, {"n": 158, "q": "ಗಲಾತ್ಯರಿಗೆ 3:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು. ಆದರೆ ದೇವರು ಅದನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ದಯಪಾಲಿಸಿದ್ದು ವಾಗ್ದಾನದ ಮೂಲಕವೇ.", "r": "3:18"}, {"n": 159, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ …”", "a": "“… ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.”", "r": "3:18"}, {"n": 160, "q": "“ಆದರೆ ದೇವರು ಅದನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ದಯಪಾಲಿಸಿದ್ದು ವಾಗ್ದಾನದ ಮೂಲಕವೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "3:18"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ", "r": "3:18"}, {"n": 162, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಬಗ್ಗೆ ಪೌಲನು 3:19ರಲ್ಲಿ ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹಾಗಾದರೆ ಧರ್ಮಶಾಸ್ತ್ರದ ಉದ್ದೇಶವಾದರೂ ಏನು?”", "r": "3:19"}, {"n": 163, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕಾಲಕ್ರಮೇಣ ಏಕೆ ಸೇರಿಸಲಾಯಿತು?", "a": "ಅಪರಾಧದ ಅರಿವನ್ನು ಮೂಡಿಸುವುದಕ್ಕಾಗಿ", "r": "3:19"}, {"n": 164, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವ ತನಕ ಮಾತ್ರ ಇರಲೆಂದು ಕೊಡಲಾಯಿತು?", "a": "ದೇವವಾಗ್ದಾನವನ್ನು ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ", "r": "3:19"}, {"n": 165, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ನೀಡಲಾಯಿತು?", "a": "ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ", "r": "3:19"}, {"n": 166, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ನೀಡಲಾಯಿತು ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವದೂತರ ಮುಖಾಂತರ", "r": "3:19"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಪರಾಧದ ಅರಿವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದನ್ನು ಕಾಲಕ್ರಮೇಣ ಸೇರಿಸಲಾಯಿತು.”", "a": "ಮೂಡಿಸುವುದಕ್ಕಾಗಿ", "r": "3:19"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ ಮಾತ್ರ ಅದು ಇರಲೆಂದು ಕೊಡಲಾಯಿತು.”", "a": "ದೇವವಾಗ್ದಾನವನ್ನು", "r": "3:19"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ ಮಾತ್ರ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೀಡಲಾಯಿತು", "r": "3:19"}, {"n": 170, "q": "“ದೇವವಾಗ್ದಾನವನ್ನು ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ ಮಾತ್ರ ಅದು ಇರಲೆಂದು ಕೊಡಲಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "3:19"}, {"n": 171, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲದೆ, ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ …”", "a": "“… ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ ಮಾತ್ರ ಅದನ್ನು ನೀಡಲಾಯಿತು.”", "r": "3:19"}, {"n": 172, "q": "ಗಲಾತ್ಯರಿಗೆ 3:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗಾದರೆ ಧರ್ಮಶಾಸ್ತ್ರದ ಉದ್ದೇಶವಾದರೂ ಏನು? ಅಪರಾಧದ ಅರಿವನ್ನು ಮೂಡಿಸುವುದಕ್ಕಾಗಿ ಅದನ್ನು ಕಾಲಕ್ರಮೇಣ ಸೇರಿಸಲಾಯಿತು. ದೇವವಾಗ್ದಾನವನ್ನು ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ ಮಾತ್ರ ಅದು ಇರಲೆಂದು ಕೊಡಲಾಯಿತು. ಅಲ್ಲದೆ, ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ ಮಾತ್ರ ಅದನ್ನು ನೀಡಲಾಯಿತು.", "r": "3:19"}, {"n": 173, "q": "ಯಾವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ?", "a": "ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ", "r": "3:20"}, {"n": 174, "q": "ದೇವರ ಬಗ್ಗೆ ಪೌಲನು 3:20ರಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರಾದರೋ ಒಬ್ಬರೇ.”", "r": "3:20"}, {"n": 175, "q": "‘ಒಬ್ಬರೇ’ ಎಂದು ಪೌಲನು ಯಾರ ಬಗ್ಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವರ ಬಗ್ಗೆ", "r": "3:20"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.”", "a": "ಮಧ್ಯಸ್ಥನು", "r": "3:20"}, {"n": 177, "q": "“ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "3:20"}, {"n": 178, "q": "ಗಲಾತ್ಯರಿಗೆ 3:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.", "r": "3:20"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರೇ.”", "a": "ದೇವರಾದರೋ", "r": "3:20"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒಬ್ಬರೇ", "r": "3:20"}, {"n": 181, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಕ್ರಿಸ್ತೇಸುವಿಗೆ ಸೇರಿದವರು ವಾರಸುದಾರರು", "r": "3:21"}, {"n": 182, "q": "“ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಪೌಲನ ಉತ್ತರವೇನು?", "a": "“ಎಂದಿಗೂ ಇಲ್ಲ.”", "r": "3:21"}, {"n": 183, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವ ಶಕ್ತಿಯನ್ನು ಹೊಂದಿದ್ದರೆ ಅದರಿಂದ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು?", "a": "ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು", "r": "3:21"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳೋಣವೇ?”", "a": "ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು", "r": "3:21"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.”", "a": "ಅನುಸರಿಸುವುದರಿಂದ", "r": "3:21"}, {"n": 186, "q": "“ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "3:21"}, {"n": 187, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು …”", "a": "“… ಅನುಸರಿಸುವುದರಿಂದ ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.”", "r": "3:21"}, {"n": 188, "q": "ಗಲಾತ್ಯರಿಗೆ 3:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ? ಎಂದಿಗೂ ಇಲ್ಲ. ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು ಅನುಸರಿಸುವುದರಿಂದ ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.", "r": "3:21"}, {"n": 189, "q": "“ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು ಅನುಸರಿಸುವುದರಿಂದ ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "3:21"}, {"n": 190, "q": "ಸಮಸ್ತ ಲೋಕದ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥ ಏನನ್ನು ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ?", "a": "ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು", "r": "3:22"}, {"n": 191, "q": "ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯಾರಿಗೆ ಕೊಡಲಾಗುತ್ತದೆ?", "a": "ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ", "r": "3:22"}, {"n": 192, "q": "ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯಾವುದರ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ?", "a": "ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ", "r": "3:22"}, {"n": 193, "q": "ಸಮಸ್ತ ಲೋಕವೂ ಏನಕ್ಕೆ ಒಳಗಾಯಿತು?", "a": "ಪಾಪಕ್ಕೆ", "r": "3:22"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ", "r": "3:22"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ", "r": "3:22"}, {"n": 196, "q": "“ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "3:22"}, {"n": 197, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ …”", "a": "“… ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.”", "r": "3:22"}, {"n": 198, "q": "ಗಲಾತ್ಯರಿಗೆ 3:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ. ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.", "r": "3:22"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ …”", "a": "“… ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ.”", "r": "3:22"}, {"n": 200, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ‘ನಾವು’ ಯಾರಂತೆ ಇದ್ದೆವು?", "a": "ಕೈದಿಗಳಂತೆ", "r": "3:23"}, {"n": 201, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲಕ್ಕೆ ಮೊದಲು ನಾವು ಯಾವುದಕ್ಕೆ ಒಳಗಾಗಿದ್ದೆವು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ", "r": "3:23"}, {"n": 202, "q": "‘ಕೈದಿಗಳಂತೆ’ ಇದ್ದ ಪರಿಸ್ಥಿತಿ ಯಾವ ತನಕ ಇತ್ತು?", "a": "ಈ ವಿಶ್ವಾಸವು ಪ್ರಕಟವಾಗುವವರೆಗೂ", "r": "3:23"}, {"n": 203, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸ ಬರುವ ಮೊದಲು ಮತ್ತು ಬಂದ ನಂತರದ ನಮ್ಮ ಸ್ಥಿತಿ ಏನು?", "a": "ಮೊದಲು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು; ಈಗ ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ", "r": "3:23; 3:25"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.”", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ", "r": "3:23"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಶ್ವಾಸವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.”", "a": "ಪ್ರಕಟವಾಗುವವರೆಗೂ", "r": "3:23"}, {"n": 206, "q": "“ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "3:23"}, {"n": 207, "q": "ಗಲಾತ್ಯರಿಗೆ 3:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು. ಈ ವಿಶ್ವಾಸವು ಪ್ರಕಟವಾಗುವವರೆಗೂ ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.", "r": "3:23"}, {"n": 208, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು …”", "a": "“… ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.”", "r": "3:23"}, {"n": 209, "q": "“ಈ ವಿಶ್ವಾಸವು ಪ್ರಕಟವಾಗುವವರೆಗೂ ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "3:23"}, {"n": 210, "q": "ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಧರ್ಮಶಾಸ್ತ್ರ ನಮಗೆ ಏನಾಗಿತ್ತು?", "a": "ಕಾವಲಾಗಿತ್ತು", "r": "3:24"}, {"n": 211, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ನಮಗೆ ಕಾವಲಾಗಿದ್ದದ್ದು ಏಕೆ?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ", "r": "3:24"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:24"}, {"n": 213, "q": "“ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "3:24"}, {"n": 214, "q": "ಗಲಾತ್ಯರಿಗೆ 3:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.", "r": "3:24"}, {"n": 215, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ …”", "a": "“… ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "r": "3:24"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾವಲಾಗಿತ್ತು", "r": "3:24"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "a": "ವಿಶ್ವಾಸದ; ಹೊಂದುವಂತೆ", "r": "3:24"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "a": "ದೇವರೊಡನೆ", "r": "3:24"}, {"n": 219, "q": "ನಾವು ಇನ್ನು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲದಿರಲು ಕಾರಣವೇನು?", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ", "r": "3:25"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು", "r": "3:25"}, {"n": 221, "q": "“ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "3:25"}, {"n": 222, "q": "ಗಲಾತ್ಯರಿಗೆ 3:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.", "r": "3:25"}, {"n": 223, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು …”", "a": "“… ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "r": "3:25"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಆಗಮಿಸಿರುವುದರಿಂದ", "r": "3:25"}, {"n": 225, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ಗಲಾತ್ಯರು ಏನಾಗಿದ್ದಾರೆ?", "a": "ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದಾರೆ", "r": "3:26"}, {"n": 226, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ದೇವರ ಮಕ್ಕಳಾಗಿರುವವರು ಯಾರು?", "a": "ನೀವೆಲ್ಲರೂ (ಗಲಾತ್ಯರೆಲ್ಲರೂ)", "r": "3:26"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "3:26"}, {"n": 228, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "3:26"}, {"n": 229, "q": "ಗಲಾತ್ಯರಿಗೆ 3:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.", "r": "3:26"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಕ್ಕಳಾಗಿದ್ದೀರಿ", "r": "3:26"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.”", "a": "ವಿಶ್ವಾಸದ", "r": "3:26"}, {"n": 232, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡವರು ಏನಾಗಿದ್ದಾ nsform:translateY(-2pt);margin:0 1mm\"><\/span>, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.”", "a": "ಯೆಹೂದ್ಯನಲ್ಲದವ", "r": "3:28"}, {"n": 243, "q": "“ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "3:28"}, {"n": 244, "q": "ಗಲಾತ್ಯರಿಗೆ 3:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗಿದ್ದೀರಿ. ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.", "r": "3:28"}, {"n": 245, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- …”", "a": "“… ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.”", "r": "3:28"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಭೇದವಿಲ್ಲ.”", "a": "ಗಂಡು-ಹೆಣ್ಣು", "r": "3:28"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಾಸ-ದಣಿ; ಭೇದವಿಲ್ಲ", "r": "3:28"}, {"n": 248, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು ಯಾರ ಸಂತತಿಯಾಗಿದ್ದಾರೆ?", "a": "ಅಬ್ರಹಾಮನ ಸಂತತಿ", "r": "3:29"}, {"n": 249, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ಏನಾಗಿದ್ದಾರೆ?", "a": "ವಾರಸುದಾರರು", "r": "3:29"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;”", "a": "ಅಬ್ರಹಾಮನ", "r": "3:29"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಿದ್ದೀರಿ.”", "a": "ವಾರಸುದಾರರೂ", "r": "3:29"}, {"n": 252, "q": "“ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "3:29"}, {"n": 253, "q": "ಗಲಾತ್ಯರಿಗೆ 3:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ; ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ವಾರಸುದಾರರೂ ಆಗಿದ್ದೀರಿ.", "r": "3:29"}, {"n": 254, "q": "“ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ವಾರಸುದಾರರೂ ಆಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "3:29"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;”", "a": "ಕ್ರಿಸ್ತ", "r": "3:29"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕ್ರಿಸ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;”", "a": "ಯೇಸುವಿಗೆ", "r": "3:29"}]}, {"chapter": 4, "label": "ಅಧ್ಯಾಯ 4", "verses": 31, "subtitle": null, "questions": [{"n": 1, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಮನೆಯಾಳಲ್ಲ, ಮಗನೇ ಹೌದು", "r": "4:1"}, {"n": 2, "q": "ವಾರಸುದಾರನು ಯಾವುದಕ್ಕೆಲ್ಲಾ ಹಕ್ಕುದಾರನಾಗಿರುತ್ತಾನೆ?", "a": "ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ", "r": "4:1"}, {"n": 3, "q": "ವಾರಸುದಾರನು ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಯಾರಿಗೂ ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ?", "a": "ಆಳಿಗೂ", "r": "4:1"}, {"n": 4, "q": "ವಾರಸುದಾರನಿಗೂ ಆಳಿಗೂ ವ್ಯತ್ಯಾಸವಿರದದ್ದು ಯಾವ ತನಕ?", "a": "ಅವನು ಬಾಲಕನಾಗಿರುವ ತನಕ", "r": "4:1"}, {"n": 5, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ವಾರಸುದಾರ’ ಎಂಬ ಪದ ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "4:1 ಮತ್ತು 4:7", "r": "4:1; 4:7"}, {"n": 6, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಾರಸುದಾರನು ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ ಹಕ್ಕುದಾರನಾಗಿದ್ದರೂ, ಅವನು ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಆಳಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ", "r": "4:1"}, {"n": 7, "q": "“ವಾರಸುದಾರನು ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ ಹಕ್ಕುದಾರನಾಗಿದ್ದರೂ, ಅವನು ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಆಳಿಗೂ ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "4:1"}, {"n": 8, "q": "ಗಲಾತ್ಯರಿಗೆ 4:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಮತ್ತೆ ಹೇಳುವುದೇನೆಂದರೆ: ವಾರಸುದಾರನು ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ ಹಕ್ಕುದಾರನಾಗಿದ್ದರೂ, ಅವನು ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಆಳಿಗೂ ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ.", "r": "4:1"}, {"n": 9, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ವಾರಸುದಾರನು ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ ಹಕ್ಕುದಾರನಾಗಿದ್ದರೂ, ಅವನು …”", "a": "“… ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಆಳಿಗೂ ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ.”", "r": "4:1"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಾರಸುದಾರನು ತಂದೆಯ ಆಸ್ತಿಗೆಲ್ಲಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನು ಬಾಲಕನಾಗಿರುವ ತನಕ ಅವನಿಗೂ ಆಳಿಗೂ ವ್ಯತ್ಯಾಸವಿರುವುದಿಲ್ಲ.”", "a": "ಹಕ್ಕುದಾರನಾಗಿದ್ದರೂ", "r": "4:1"}, {"n": 11, "q": "ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ ವಾರಸುದಾರನು ಯಾರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ?", "a": "ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ", "r": "4:2"}, {"n": 12, "q": "ವಾರಸುದಾರನು ಎಲ್ಲಿಯವರೆಗೆ ಪೋಷಕರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ?", "a": "ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ", "r": "4:2"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ ಅವನು ಪೋಷಕರ ಹಾಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ.”", "a": "ಕಾರ್ಯನಿರ್ವಾಹಕರ", "r": "4:2"}, {"n": 14, "q": "“ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ ಅವನು ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "4:2"}, {"n": 15, "q": "ಗಲಾತ್ಯರಿಗೆ 4:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ ಅವನು ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ.", "r": "4:2"}, {"n": 16, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ತಂದೆ ಗೊತ್ತುಮಾಡಿದ ದಿನದವರೆಗೂ ಅವನು …”", "a": "“… ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ.”", "r": "4:2"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನದವರೆಗೂ ಅವನು ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ ಇರುತ್ತಾನೆ.”", "a": "ಗೊತ್ತುಮಾಡಿದ", "r": "4:2"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಂದೆ ಗೊತ್ತುಮಾಡಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು ಪೋಷಕರ ಹಾಗೂ ಕಾರ್ಯನಿರ್ವಾಹಕರ ಕೈಕೆಳಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಿನದವರೆಗೂ; ಇರುತ್ತಾನೆ", "r": "4:2"}, {"n": 19, "q": "ನಾವು ಬಾಲಕರಂತೆ ಯಾವುದಕ್ಕೆ ಅಧೀನರಾಗಿದ್ದೆವು?", "a": "ವಿಶ್ವದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ", "r": "4:3"}, {"n": 20, "q": "ಪೌಲನು ‘ನಮ್ಮ ಸ್ಥಿತಿ’ಯನ್ನು ಯಾವ ಉದಾಹರಣೆಗೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ಬಾಲಕನಾಗಿರುವ ವಾರಸುದಾರನ ಸ್ಥಿತಿಗೆ", "r": "4:3"}, {"n": 21, "q": "“ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ” ಎಂಬ ಪದ ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "4:3 (ವಿಶ್ವದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳು) ಮತ್ತು 4:9 (ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳು)", "r": "4:3; 4:9"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಬಾಲಕರಂತೆ ವಿಶ್ವದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಧೀನರಾಗಿದ್ದೆವು", "r": "4:3"}, {"n": 23, "q": "ಗಲಾತ್ಯರಿಗೆ 4:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಮ್ಮ ಸ್ಥಿತಿಯೂ ಹಾಗೆಯೇ ಇತ್ತು. ನಾವು ಬಾಲಕರಂತೆ ವಿಶ್ವದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದೆವು.", "r": "4:3"}, {"n": 24, "q": "“ನಾವು ಬಾಲಕರಂತೆ ವಿಶ್ವದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "4:3"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಬಾಲಕರಂತೆ ವಿಶ್ವದ ಮೂಲಭೂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಧೀನರಾಗಿದ್ದೆವು.”", "a": "ಶಕ್ತಿಗಳಿಗೆ", "r": "4:3"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಬಾಲಕರಂತೆ ವಿಶ್ವದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಕ್ತಿಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದೆವು.”", "a": "ಮೂಲಭೂತ", "r": "4:3"}, {"n": 27, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಯಾವಾಗ ಕಳುಹಿಸಿಕೊಟ್ಟರು?", "a": "ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ", "r": "4:4–5"}, {"n": 28, "q": "ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ ದೇವರು ಯಾರನ್ನು ಕಳುಹಿಸಿಕೊಟ್ಟರು?", "a": "ತಮ್ಮ ಪುತ್ರನನ್ನೇ", "r": "4:4–5"}, {"n": 29, "q": "ದೇವಪುತ್ರನು ಹೇಗೆ ಜನಿಸಿದರು?", "a": "ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು; ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಿಯೇ ಹುಟ್ಟಿದರು", "r": "4:4–5"}, {"n": 30, "q": "ದೇವರ ಪುತ್ರನು ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದ ಎರಡು ಉದ್ದೇಶಗಳು ಯಾವುವು?", "a": "1) ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ; 2) ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು ನಮಗೆ ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿ", "r": "4:4–5"}, {"n": 31, "q": "ದೇವರ ಪುತ್ರನು ನಮಗೆ ಯಾವ ಪದವಿಯನ್ನು ಒದಗಿಸಿಕೊಡಲು ಜನಿಸಿದರು?", "a": "ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು", "r": "4:4–5"}, {"n": 32, "q": "ದೇವರ ಪುತ್ರನು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಏನು ಮಾಡಲು ಜನಿಸಿದರು?", "a": "ಬಿಡುಗಡೆ ಮಾಡಲು", "r": "4:4–5"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟರು", "r": "4:4–5"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುಕ್ಕಾಗಿಯೂ ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು.”", "a": "ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿಯೂ", "r": "4:4–5"}, {"n": 35, "q": "“ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನೇ ಕಳುಹಿಸಿಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4–5", "r": "4:4–5"}, {"n": 36, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇವರು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುಕ್ಕಾಗಿಯೂ ದೇವಪುತ್ರರ …”", "a": "“… ಪದವಿಯನ್ನು ನಮಗೆ ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿಯೂ ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು.”", "r": "4:4–5"}, {"n": 37, "q": "“ಇವರು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುಕ್ಕಾಗಿಯೂ ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು ನಮಗೆ ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿಯೂ ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4–5", "r": "4:4–5"}, {"n": 38, "q": "ದೇವರ ಪುತ್ರನ ಆಗಮನದ ಫಲವಾಗಿ ನಾವು ಆಳಿನ ಸ್ಥಿತಿಯಿಂದ ಯಾವ ಸ್ಥಿತಿಗೆ ಬಂದೆವು?", "a": "ಮನೆಯಾಳಲ್ಲ, ಮಗ ಮತ್ತು ವಾರಸುದಾರ", "r": "4:5; 4:7"}, {"n": 39, "q": "ಗಲಾತ್ಯರಿಗೆ 4:4–5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕಾಲವು ಪರಿಪಕ್ವವಾದಾಗ ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನೇ ಕಳುಹಿಸಿಕೊಟ್ಟರು. ಇವರು ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾದವರನ್ನು ಬಿಡುಗಡೆ ಮಾಡುವುಕ್ಕಾಗಿಯೂ ದೇವಪುತ್ರರ ಪದವಿಯನ್ನು ನಮಗೆ ಒದಗಿಸಿಕೊಡುವುದಕ್ಕಾಗಿಯೂ ಒಬ್ಬ ಸ್ತ್ರೀಯಲ್ಲಿ ಜನಿಸಿದರು. ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಅಧೀನರಾಗಿಯೇ ಹುಟ್ಟಿದರು.", "r": "4:4–5"}, {"n": 40, "q": "ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಯಾರನ್ನು ಕಳುಹಿಸಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು", "r": "4:6"}, {"n": 41, "q": "ದೇವಪುತ್ರನ ಆತ್ಮವು ದೇವರನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತದೆ?", "a": "“ಅಪ್ಪಾ, ತಂದೆಯೇ”", "r": "4:6"}, {"n": 42, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ಗಲಾತ್ಯರ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದು ಏಕೆ?", "a": "ಅವರು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ", "r": "4:6"}, {"n": 43, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ಎಲ್ಲಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ?", "a": "ನಮ್ಮ ಹೃದಯಗಳಿಗೆ", "r": "4:6"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಅಪ್ಪಾ, ತಂದೆಯೇ,’ ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.”", "a": "ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ", "r": "4:6"}, {"n": 45, "q": "“ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ‘ಅಪ್ಪಾ, ತಂದೆಯೇ,’ ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "4:6"}, {"n": 46, "q": "ಗಲಾತ್ಯರಿಗೆ 4:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, “ಅಪ್ಪಾ, ತಂದೆಯೇ,” ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.", "r": "4:6"}, {"n": 47, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ‘ಅಪ್ಪಾ, ತಂದೆಯೇ,’ ಎಂದು ಕರೆಯುವ …”", "a": "“… ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ ಕಳುಹಿಸಿದ್ದಾರೆ.”", "r": "4:6"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ‘ಅಪ್ಪಾ, ತಂದೆಯೇ,’ ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ ಆತ್ಮವನ್ನು ದೇವರು ನಮ್ಮ ಹೃದಯಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿದ್ದಾರೆ", "r": "4:6"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದೇವರ ಮಕ್ಕಳಾಗಿರುವುದರಿಂದಲೇ, ‘ಅಪ್ಪಾ, ತಂದೆಯೇ,’ ಎಂದು ಕರೆಯುವ ತಮ್ಮ ಪುತ್ರನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳುಹಿಸಿದ್ದಾರೆ.”", "a": "ಆತ್ಮವನ್ನು; ಹೃದಯಗಳಿಗೆ", "r": "4:6"}, {"n": 50, "q": "ದೇವರ ಅನುಗ್ರಹದಿಂದ ‘ನೀನು’ ಏನಾಗಿದ್ದೀ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.”", "r": "4:7"}, {"n": 51, "q": "ಮಗನೆಂದಮೇಲೆ ಅವನು ಇನ್ನೇನೂ ಹೌದು ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ವಾರಸುದಾರನೂ ಹೌದು", "r": "4:7"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ, ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.”", "a": "ಅನುಗ್ರಹದಿಂದಲೇ", "r": "4:7"}, {"n": 53, "q": "“ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 54, "q": "ಗಲಾತ್ಯರಿಗೆ 4:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ. ಮಗನೆಂದಮೇಲೆ ನೀನು ವಾರಸುದಾರನೂ ಹೌದು.", "r": "4:7"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ, ದೇವರ ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಗನಾಗಿದ್ದೀ", "r": "4:7"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹದಿಂದಲೇ ನೀನು ಇನ್ನು ಮನೆಯಾಳಲ್ಲ, ಮಗನಾಗಿದ್ದೀ.”", "a": "ದೇವರ", "r": "4:7"}, {"n": 57, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 4:8ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೌಲನ ಕಳಕಳಿ", "r": "4:8"}, {"n": 58, "q": "ಹಿಂದೆ ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದ ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಅಧೀನರಾಗಿದ್ದರು?", "a": "ದೇವರಲ್ಲದವುಗಳಿಗೆ", "r": "4:8"}, {"n": 59, "q": "ಗಲಾತ್ಯರು ದೇವರಲ್ಲದವುಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದದ್ದು ಯಾವಾಗ?", "a": "ಹಿಂದೆ ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಾಗ", "r": "4:8"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರಿಯದೆ ಇದ್ದಿರಿ.”", "a": "ದೇವರನ್ನು", "r": "4:8"}, {"n": 61, "q": "“ಹಿಂದೆ ನೀವು ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "4:8"}, {"n": 62, "q": "ಗಲಾತ್ಯರಿಗೆ 4:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಿಂದೆ ನೀವು ದೇವರನ್ನು ಅರಿಯದೆ ಇದ್ದಿರಿ. ದೇವರಲ್ಲದವುಗಳಿಗೆ ಅಧೀನರಾಗಿದ್ದಿರಿ.", "r": "4:8"}, {"n": 63, "q": "ಈಗ ಗಲಾತ್ಯರು ಯಾರನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ?", "a": "ನಿಜದೇವರನ್ನು", "r": "4:9"}, {"n": 64, "q": "‘ನಿಜದೇವರನ್ನು ಅರಿತುಕೊಂಡಿದ್ದೀರಿ’ ಎಂಬುದನ್ನು ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ಏನೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರು ನಿಮ್ಮನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ”", "r": "4:9"}, {"n": 65, "q": "ಪೌಲನು ಮೂಲಭೂತ ಶಕ್ತಿಗಳನ್ನು ಹೇಗೆ ವರ್ಣಿಸುತ್ತಾನೆ?", "a": "ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ", "r": "4:9"}, {"n": 66, "q": "ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಮರಳುವ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಎರಡನೆಯ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಪುನಃ ಅವುಗಳಿಗೆ ಗುಲಾಮರಾಗಲು ಇಚ್ಛಿಸುವುದೇಕೆ?”", "r": "4:9"}, {"n": 67, "q": "ಗಲಾತ್ಯರು ಪುನಃ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ಏನಾಗಲು ಇಚ್ಛಿಸುತ್ತಿದ್ದರು?", "a": "ಗುಲಾಮರಾಗಲು", "r": "4:9"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ದೇವರು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರಿತುಕೊಂಡಿದ್ದಾರೆ", "r": "4:9"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ ಮೂಲಭೂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮರಳುವುದೇಕೆ?”", "a": "ಶಕ್ತಿಗಳಿಗೆ", "r": "4:9"}, {"n": 70, "q": "“ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ದೇವರು ನಿಮ್ಮನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "4:9"}, {"n": 71, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ …”", "a": "“… ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ನೀವು ಮರಳುವುದೇಕೆ?”", "r": "4:9"}, {"n": 72, "q": "ಗಲಾತ್ಯರಿಗೆ 4:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈಗಲಾದರೋ ನಿಜದೇವರನ್ನು ಅರಿತುಕೊಂಡಿದ್ದೀರಿ; ಸರಿಯಾಗಿ ಹೇಳಬೇಕಾದರೆ ದೇವರು ನಿಮ್ಮನ್ನು ಅರಿತುಕೊಂಡಿದ್ದಾರೆ. ಹೀಗಿರಲಾಗಿ, ದುರ್ಬಲ ಹಾಗೂ ದರಿದ್ರವಾದ ಮೂಲಭೂತ ಶಕ್ತಿಗಳಿಗೆ ನೀವು ಮರಳುವುದೇಕೆ? ಪುನಃ ಅವುಗಳಿಗೆ ಗುಲಾಮರಾಗಲು ಇಚ್ಛಿಸುವುದೇಕೆ?", "r": "4:9"}, {"n": 73, "q": "ಗಲಾತ್ಯರು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತಿದ್ದ ಮೂರು ವಿಷಯಗಳು ಯಾವುವು?", "a": "ಶುಭಾಶುಭ ದಿನಗಳು, ಮಾಸಗಳು ಮತ್ತು ಸಂವತ್ಸರಗಳು", "r": "4:10"}, {"n": 74, "q": "ಗಲಾತ್ಯರು ದಿನ, ಮಾಸ, ಸಂವತ್ಸರಗಳನ್ನು ಹೇಗೆ ನೋಡುತ್ತಿದ್ದರು?", "a": "ಜಾಗರೂಕತೆಯಿಂದ", "r": "4:10"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "a": "ಸಂವತ್ಸರಗಳನ್ನು", "r": "4:10"}, {"n": 76, "q": "“ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 77, "q": "ಗಲಾತ್ಯರಿಗೆ 4:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.", "r": "4:10"}, {"n": 78, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು …”", "a": "“… ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "r": "4:10"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, ಮಾಸಗಳನ್ನು ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡುತ್ತೀರಿ.”", "a": "ಜಾಗರೂಕತೆಯಿಂದ", "r": "4:10"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಶುಭಾಶುಭ ದಿನಗಳನ್ನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಸಂವತ್ಸರಗಳನ್ನು ಜಾಗರೂಕತೆಯಿಂದ ನೋಡುತ್ತೀರಿ.”", "a": "ಮಾಸಗಳನ್ನು", "r": "4:10"}, {"n": 81, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನನ್ನು ಯಾವ ಶಂಕೆ ಕಾಡುತ್ತಿತ್ತು?", "a": "ಅವರಿಗಾಗಿ ತಾನು ಪಟ್ಟ ಪ್ರಯಾಸವೆಲ್ಲ ವ್ಯರ್ಥವಾಯಿತೇನೋ ಎಂಬ ಶಂಕ
