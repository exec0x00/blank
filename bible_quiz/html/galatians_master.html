ನಬನೂ ಸಹ ಮಾರುಹೋದನು.", "r": "2:13"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವರ್ತಿಸಿದರು", "r": "2:13"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾರುಹೋದನು", "r": "2:13"}, {"n": 166, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ …”", "a": "“… ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "r": "2:13"}, {"n": 167, "q": "“ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ ಮಾರುಹೋದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "a": "ಮಿಕ್ಕ", "r": "2:13"}, {"n": 169, "q": "ಕೇಫನ ಮತ್ತು ಇತರರ ನಡತೆ ಯಾವುದಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಪೌಲನಿಗೆ ಮನದಟ್ಟಾಯಿತು?", "a": "ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ", "r": "2:14"}, {"n": 170, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಯಾರ ಸಮ್ಮುಖದಲ್ಲಿ ಪ್ರಶ್ನಿಸಿದನು?", "a": "ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ", "r": "2:14"}, {"n": 171, "q": "ಪೌಲನು ಕೇಫನ ನಡತೆಯ ಬಗ್ಗೆ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "r": "2:14"}, {"n": 172, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಅನ್ಯಧರ್ಮೀಯರ ಬಗ್ಗೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದನು?", "a": "“ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?”", "r": "2:14"}, {"n": 173, "q": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ…” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಕೇಳಿದರು?", "a": "ಪೌಲನು ಕೇಫನಿಗೆ", "r": "2:14"}, {"n": 174, "q": "ಪೌಲನು ಕೇಫನಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಿದ್ದು ಯಾವಾಗ?", "a": "ಅವರ ನಡತೆ ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಮನದಟ್ಟಾದಾಗ", "r": "2:14"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.”", "a": "ಅನುಗುಣವಾದುದಲ್ಲ", "r": "2:14"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಕೇಫನಿಗೆ", "r": "2:14"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "a": "ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ", "r": "2:14"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ?”", "a": "ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ", "r": "2:14"}, {"n": 179, "q": "“ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 180, "q": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 181, "q": "ಗಲಾತ್ಯರಿಗೆ 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು. ಆಗ ನಾನು ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ ಕೇಫನಿಗೆ: “ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ? ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?” ಎಂದು ಕೇಳಿದೆ.", "r": "2:14"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮನದಟ್ಟಾಯಿತು", "r": "2:14"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ಅವರೆಲ್ಲರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಫನಿಗೆ:”", "a": "ಸಮ್ಮುಖದಲ್ಲೇ", "r": "2:14"}, {"n": 184, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:15ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವೇ ಜೀವೋದ್ಧಾರದ ಮಾರ್ಗ", "r": "2:15"}, {"n": 185, "q": "ಪೌಲನು ತಾನೂ ಕೇಫನೂ ಹುಟ್ಟಿನಿಂದ ಏನೆಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಹುಟ್ಟು ಯೆಹೂದ್ಯರು", "r": "2:15"}, {"n": 186, "q": "‘ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ’ ಜನರು ಯಾರು ಎಂದು ಪೌಲನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಅನ್ಯಧರ್ಮೀಯರು", "r": "2:15"}, {"n": 187, "q": "ಪೌಲನು ಹುಟ್ಟು ಯೆಹೂದ್ಯರನ್ನು ಯಾರಿಂದ ಬೇರ್ಪಡಿಸಿ ಹೇಳುತ್ತಾನೆ?", "a": "ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಿಂದ", "r": "2:15"}, {"n": 188, "q": "ಗಲಾತ್ಯರಿಗೆ 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವಂತೂ ಹುಟ್ಟು ಯೆಹೂದ್ಯರು; ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಲ್ಲ.", "r": "2:15"}, {"n": 189, "q": "ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೇಗೆ ಪಡೆಯುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ", "r": "2:16"}, {"n": 190, "q": "ಮಾನವನು ಯಾವುದರಿಂದ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವುದಿಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದ", "r": "2:16"}, {"n": 191, "q": "ಪೌಲನು ಮತ್ತು ಇತರರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟದ್ದು ಏಕೆ?", "a": "ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ", "r": "2:16"}, {"n": 192, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:16ರಲ್ಲಿ “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು” ಎಂಬ ಪದಗುಚ್ಛ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ", "r": "2:16"}, {"n": 193, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ದೊರಕುವುದಾದರೆ ಏನಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕ", "r": "2:16; 2:21"}, {"n": 194, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ…” — ಈ ವಾಕ್ಯವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "r": "2:16"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "a": "ಅನುಸರಿಸುವುದರಿಂದಲೆ", "r": "2:16"}, {"n": 198, "q": "“ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ …”", "a": "“… ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "r": "2:16"}, {"n": 200, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 201, "q": "ಗಲಾತ್ಯರಿಗೆ 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು. ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ. ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.", "r": "2:16"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "a": "ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ", "r": "2:16"}, {"n": 203, "q": "ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುವವರು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡುಬಂದರೆ ಏನು ಹೇಳಿದಂತಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 204, "q": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುವ ವಾದಕ್ಕೆ ಪೌಲನ ಉತ್ತರವೇನು?", "a": "“ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.”", "r": "2:17"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "2:17"}, {"n": 206, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 207, "q": "ಗಲಾತ್ಯರಿಗೆ 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ. ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.", "r": "2:17"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ", "r": "2:17"}, {"n": 209, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು …”", "a": "“… ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "r": "2:17"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯತ್ನಿಸುತ್ತಿರುವ; ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಂತೆ", "r": "2:17"}, {"n": 212, "q": "ಪೌಲನು ತಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 213, "q": "ಪೌಲನ ಪ್ರಕಾರ ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟುವುದು ಯಾವ ಪರಿಣಾಮ ಉಂಟುಮಾಡುತ್ತದೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ", "r": "2:18"}, {"n": 215, "q": "“ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 216, "q": "ಗಲಾತ್ಯರಿಗೆ 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?", "r": "2:18"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕೆಡವಿದ್ದನ್ನೇ", "r": "2:18"}, {"n": 218, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು …”", "a": "“… ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "r": "2:18"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕಟ್ಟಿದರೆ; ನನ್ನನ್ನು", "r": "2:18"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ರುಜುವಾತು", "r": "2:18"}, {"n": 221, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಏನಾಗಿದ್ದಾನೆ?", "a": "ಸತ್ತವನಾಗಿದ್ದಾನೆ", "r": "2:19"}, {"n": 222, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿರುವುದು ಯಾವುದಕ್ಕೋಸ್ಕರ?", "a": "ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 223, "q": "ಪೌಲನು ಯಾವುದರ ಮೂಲಕ ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ", "r": "2:19"}, {"n": 224, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:19–20ರಲ್ಲಿ ಪೌಲನು ತಾನು ಯಾವುದರ ಪಾಲಿಗೆ ಸತ್ತವನು, ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನು; ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು", "r": "2:19–20"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 226, "q": "“ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 227, "q": "ಗಲಾತ್ಯರಿಗೆ 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.", "r": "2:19"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸತ್ತವನಾಗಿದ್ದೇನೆ", "r": "2:19"}, {"n": 229, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ …”", "a": "“… ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "r": "2:19"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ದೇವರಿಗಾಗಿ", "r": "2:19"}, {"n": 231, "q": "ಪೌಲನು ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ", "r": "2:20"}, {"n": 232, "q": "ಈಗ ತನ್ನಲ್ಲಿ ಯಾರು ಜೀವಿಸುತ್ತಾರೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ.”", "r": "2:20"}, {"n": 233, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು” ಎಂಬ ಮಾತಿನ ನಂತರ ಪೌಲನು ತನ್ನ ಬಗ್ಗೆ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ.”", "r": "2:20"}, {"n": 234, "q": "ಪೌಲನು ಈಗ ಯಾವುದರಿಂದ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ?", "a": "ದೇವರ ಪುತ್ರನಲ್ಲಿ ತಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 235, "q": "ಪೌಲನ ಪ್ರಕಾರ ದೇವರ ಪುತ್ರನು ಅವನಿಗಾಗಿ ಮಾಡಿದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ಅವನನ್ನು ಪ್ರೀತಿಸಿದರು; ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದರು", "r": "2:20"}, {"n": 236, "q": "ಪೌಲನನ್ನು ಪ್ರೀತಿಸಿ ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದವರು ಯಾರು?", "a": "ದೇವರ ಪುತ್ರ", "r": "2:20"}, {"n": 237, "q": "ಪೌಲನು ಈಗ ಎಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಈ ದೇಹದಲ್ಲಿ", "r": "2:20"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜೀವಿಸುತ್ತಿದ್ದೇನೆ", "r": "2:20"}, {"n": 239, "q": "“ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 240, "q": "ಗಲಾತ್ಯರಿಗೆ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು. ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ. ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ. ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.", "r": "2:20"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 242, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ …”", "a": "“… ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "r": "2:20"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ಪ್ರಾಣಾರ್ಪಣೆ; ಪುತ್ರನಲ್ಲಿ", "r": "2:20"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ನನ್ನನ್ನು", "r": "2:20"}, {"n": 245, "q": "ಪೌಲನು ಯಾವುದನ್ನು ನಿರಾಕರಿಸುವಂಥವನಲ್ಲ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 246, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಏನು ನಿರರ್ಥಕವೇ ಸರಿ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 247, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯ ವಚನದಲ್ಲಿ ಪೌಲನು ಏನನ್ನು ನಿರಾಕರಿಸುವುದಿಲ್ಲವೆಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಅನುಗ್ರಹವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನಲ್ಲ.”", "a": "ನಿರಾಕರಿಸುವಂಥವನು", "r": "2:21"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "2:21"}, {"n": 250, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು …”", "a": "“… ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "r": "2:21"}, {"n": 251, "q": "ಗಲಾತ್ಯರಿಗೆ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು ನಿರಾಕರಿಸುವಂಥವನು ನಾನಲ್ಲ. ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.", "r": "2:21"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರಾಕರಿಸುವಂಥವನು ನಾನಲ್ಲ.”", "a": "ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 254, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ; ದೊರಕುವುದಾದರೆ", "r": "2:21"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಸತ್ಸಂಬಂಧವು", "r": "2:21"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
