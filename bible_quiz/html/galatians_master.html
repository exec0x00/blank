ರನ್ನು ಮರಣದಿಂದ ಎಬ್ಬಿಸಿದ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರೇಷಿತನಾಗಿರುತ್ತೇನೆ.”", "a": "ಮಾನವರಿಂದಾಗಲಿ", "r": "1:2"}, {"n": 21, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಏನೇನು ಲಭಿಸಲಿ ಎಂದು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ", "r": "1:3"}, {"n": 22, "q": "ಗಲಾತ್ಯರಿಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಯಾರಿಂದ ಲಭಿಸಲಿ ಎಂದು ಪೌಲನು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ", "r": "1:3"}, {"n": 23, "q": "ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರೊಡನೆ ಕೃಪಾಶೀರ್ವಾದವನ್ನು ನೀಡುವವರು ಎಂದು ಪೌಲನು ಹೇಳುವವರು ಯಾರು?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರು", "r": "1:3"}, {"n": 24, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:3–4ರಲ್ಲಿ ದೇವರನ್ನು ಯಾವ ಹೆಸರಿನಿಂದ ಎರಡು ಬಾರಿ ಕರೆಯಲಾಗಿದೆ?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರು", "r": "1:3–4"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ", "r": "1:3"}, {"n": 26, "q": "“ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "1:3"}, {"n": 27, "q": "ಗಲಾತ್ಯರಿಗೆ 1:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!", "r": "1:3"}, {"n": 28, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು …”", "a": "“… ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "r": "1:3"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ಕೃಪಾಶೀರ್ವಾದವೂ", "r": "1:3"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಭಿಸಲಿ!”", "a": "ದೇವರಿಂದಲೂ; ಶಾಂತಿಸಮಾಧಾನವೂ", "r": "1:3"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ತಂದೆಯಾದ", "r": "1:3"}, {"n": 32, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಏನಾಗಿ ಅರ್ಪಿಸಿದರು?", "a": "ಬಲಿಯಾಗಿ", "r": "1:4"}, {"n": 33, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದ್ದು ಏಕೆ?", "a": "ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 34, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ಯಾರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ", "r": "1:4"}, {"n": 35, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ನಮ್ಮನ್ನು ಯಾವುದರಿಂದ ಬಿಡುಗಡೆ ಮಾಡಲು ಬಲಿಯಾದರು?", "a": "ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ", "r": "1:4"}, {"n": 36, "q": "“ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು” — ಯಾರು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:4"}, {"n": 37, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದ್ದು ಯಾವುದರ ಪರಿಹಾರಕ್ಕಾಗಿ?", "a": "ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ", "r": "1:4"}, {"n": 39, "q": "“ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "1:4"}, {"n": 40, "q": "ಗಲಾತ್ಯರಿಗೆ 1:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.", "r": "1:4"}, {"n": 41, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ …”", "a": "“… ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "r": "1:4"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:4"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಡುಗಡೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ದುಷ್ಟಕಾಲದಿಂದ; ಮಾಡುವುದಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 45, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೌಲನು ದೇವರಿಗೆ ಸಲ್ಲಿಸುವ ಸ್ತುತಿ ಏನು?", "a": "“ದೇವರಿಗೆ ಯುಗಯುಗಾಂತರಕ್ಕೂ ಸ್ತುತಿಸ್ತೋತ್ರ ಸಲ್ಲಲಿ! ಆಮೆನ್.”", "r": "1:5"}, {"n": 46, "q": "ದೇವರಿಗೆ ಸ್ತುತಿಸ್ತೋತ್ರ ಎಷ್ಟು ಕಾಲ ಸಲ್ಲಲಿ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಯುಗಯುಗಾಂತರಕ್ಕೂ", "r": "1:5"}, {"n": 47, "q": "ಗಲಾತ್ಯರಿಗೆ 1:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರಿಗೆ ಯುಗಯುಗಾಂತರಕ್ಕೂ ಸ್ತುತಿಸ್ತೋತ್ರ ಸಲ್ಲಲಿ! ಆಮೆನ್.", "r": "1:5"}, {"n": 48, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:6ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಏಕೈಕ ಶುಭಸಂದೇಶ", "r": "1:6"}, {"n": 49, "q": "ಪೌಲನಿಗೆ ಏಕೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿತ್ತು?", "a": "ಗಲಾತ್ಯರು ತಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ಇಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವರೆಂದು ಕೇಳಿ", "r": "1:6"}, {"n": 50, "q": "ದೇವರು ಗಲಾತ್ಯರನ್ನು ಯಾವುದರಿಂದ ಕರೆದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ", "r": "1:6"}, {"n": 51, "q": "ಗಲಾತ್ಯರು ದೇವರನ್ನು ತ್ಯಜಿಸಿ ಏನನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿದ್ದರು?", "a": "ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು", "r": "1:6"}, {"n": 52, "q": "ಗಲಾತ್ಯರು ದೇವರನ್ನು ಎಷ್ಟು ಬೇಗ ತ್ಯಜಿಸುತ್ತಿದ್ದರೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಇಷ್ಟು ಬೇಗನೆ", "r": "1:6"}, {"n": 53, "q": "ಗಲಾತ್ಯರು ‘ಬೇರೊಂದು ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವರೆಂದು ಕೇಳಿ ಪೌಲನಿಗೆ ಏನಾಯಿತು?", "a": "ಆಶ್ಚರ್ಯವಾಗುತ್ತಿತ್ತು", "r": "1:6"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:6"}, {"n": 55, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "1:6"}, {"n": 56, "q": "ಗಲಾತ್ಯರಿಗೆ 1:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.", "r": "1:6"}, {"n": 57, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ …”", "a": "“… ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "r": "1:6"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು", "r": "1:6"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶುಭಸಂದೇಶ’ವನ್ನು; ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ", "r": "1:6"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಅನುಗ್ರಹದಿಂದ", "r": "1:6"}, {"n": 61, "q": "‘ಬೇರೊಂದು ಶುಭಸಂದೇಶ’ದ ಬಗ್ಗೆ ಪೌಲನು ವಾಸ್ತವವಾಗಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.”", "r": "1:7"}, {"n": 62, "q": "ಗಲಾತ್ಯರಲ್ಲಿ ಕೆಲವರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಗೊಂದಲವೆಬ್ಬಿಸಿ ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು", "r": "1:7"}, {"n": 63, "q": "ಗೊಂದಲವೆಬ್ಬಿಸುವವರು ಯಾವುದನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು", "r": "1:7"}, {"n": 64, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಗಲಾತ್ಯರಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸುತ್ತಿದ್ದ ಕೆಲವರು", "r": "1:7"}, {"n": 65, "q": "ಗೊಂದಲವೆಬ್ಬಿಸುವವರು ಗಲಾತ್ಯರಲ್ಲಿ ಏನನ್ನು ಎಬ್ಬಿಸುತ್ತಿದ್ದರು?", "a": "ಗೊಂದಲವನ್ನು", "r": "1:7"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.”", "a": "ವಾಸ್ತವವಾಗಿ", "r": "1:7"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:7"}, {"n": 68, "q": "“ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 69, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "r": "1:7"}, {"n": 70, "q": "ಗಲಾತ್ಯರಿಗೆ 1:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ. ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.", "r": "1:7"}, {"n": 71, "q": "“ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "a": "ಗೊಂದಲವೆಬ್ಬಿಸಿ", "r": "1:7"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, ಕ್ರಿಸ್ತಯೇಸುವಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರ್ಪಡಿಸಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾರೆ.”", "a": "ಶುಭಸಂದೇಶವನ್ನು; ಯತ್ನಿಸುತ್ತಾ", "r": "1:7"}, {"n": 74, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಯಾರು ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ", "r": "1:8"}, {"n": 75, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಬೋಧಿಸುವವನಿಗೆ ಏನಾಗಲಿ ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:8"}, {"n": 76, "q": "ಪೌಲನ ಪ್ರಕಾರ ಯಾವ ದೇವದೂತನು ವಿರುದ್ಧ ಸಂದೇಶ ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತನಾಗಲಿ?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನು", "r": "1:8"}, {"n": 77, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಶಾಪಗ್ರಸ್ತನಾಗಲಿ’ ಎಂಬ ಪದ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಎರಡು ಬಾರಿ (1:8; 1:9)", "r": "1:8–9"}, {"n": 78, "q": "ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ‘ನಾವೇ’ ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತರಾಗಲಿ ಎಂದು ಹೇಳುವವರು ಯಾರು?", "a": "ಪೌಲನು", "r": "1:8"}, {"n": 79, "q": "ಪೌಲನ ಪ್ರಕಾರ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಬೋಧಿಸಿದರೆ ಶಾಪಗ್ರಸ್ತರಾಗುವವರಲ್ಲಿ ಸ್ವರ್ಗದ ಜೀವಿ ಯಾರು?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನು", "r": "1:8"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:8"}, {"n": 81, "q": "“ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 82, "q": "ಗಲಾತ್ಯರಿಗೆ 1:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!", "r": "1:8"}, {"n": 83, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, …”", "a": "“… ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "r": "1:8"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "a": "ಶುಭಸಂದೇಶಕ್ಕೆ", "r": "1:8"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "a": "ವಿರುದ್ಧವಾದ; ಸಂದೇಶವನ್ನು", "r": "1:8"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "1:8"}, {"n": 87, "q": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂಬ ಮಾತನ್ನು ಪೌಲನು ಮೊದಲೇ ಹೇಳಿದಂತೆ ಮತ್ತೊಮ್ಮೆ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ", "r": "1:9"}, {"n": 88, "q": "ಗಲಾತ್ಯರು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನಿಗೆ ಏನಾಗಲಿ ಎಂದು ಪೌಲನು ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ?", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:9"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಸಾರುವವನು", "r": "1:9"}, {"n": 90, "q": "“ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "1:9"}, {"n": 91, "q": "ಗಲಾತ್ಯರಿಗೆ 1:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.", "r": "1:9"}, {"n": 92, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ …”", "a": "“… ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "r": "1:9"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:9"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಅಂಗೀಕರಿಸಿದ; ಶುಭಸಂದೇಶಕ್ಕೆ", "r": "1:9"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿರುದ್ಧವಾದ", "r": "1:9"}, {"n": 96, "q": "“ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ?” — ಈ ಪ್ರಶ್ನೆಯ ನಂತರ ಪೌಲನು ಕೇಳುವ ಎರಡು ಉಪಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ಮಾನವರನ್ನೋ? ದೇವರನ್ನೋ?”", "r": "1:10"}, {"n": 97, "q": "ಪೌಲನು ಯಾರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ?", "a": "ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು", "r": "1:10"}, {"n": 98, "q": "ಪೌಲನು ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಅವನಿಗೆ ಏನು ಸಾಧ್ಯವೇ ಇಲ್ಲ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು", "r": "1:10"}, {"n": 99, "q": "ಪೌಲನು ತನ್ನನ್ನು ಯಾರ ದಾಸನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸ", "r": "1:10"}, {"n": 100, "q": "ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನು ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂದು ಪೌಲನು ಏಕೆ ಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನಲ್ಲ, ದೇವರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿರುವುದರಿಂದ", "r": "1:10"}, {"n": 101, "q": "“ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ” — ಇದು ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಯಾವ ವಚನ?", "a": "1:10", "r": "1:10"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ", "r": "1:10"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಯತ್ನಿಸುತ್ತಿಲ್ಲ", "r": "1:10"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:10"}, {"n": 105, "q": "“ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 106, "q": "“ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 107, "q": "ಗಲಾತ್ಯರಿಗೆ 1:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ? ಮಾನವರನ್ನೋ? ದೇವರನ್ನೋ? ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ; ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.", "r": "1:10"}, {"n": 108, "q": "“ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 109, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ …”", "a": "“… ಆಗಿದ್ದರೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.”", "r": "1:10"}, {"n": 110, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:11ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪ್ರೇಷಿತನಾದ ಪೌಲ", "r": "1:11"}, {"n": 111, "q": "ತಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶದ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಏನನ್ನು ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತಾನೆ?", "a": "ಅದು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು", "r": "1:11"}, {"n": 112, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ (1:11)?", "a": "“ಪ್ರಿಯ ಸಹೋದರರೇ”", "r": "1:11"}, {"n": 113, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶದ ಮೂಲ ಯಾವುದು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರೇ ಅದನ್ನು ಶ್ರುತಪಡಿಸಿದರು", "r": "1:11–12"}, {"n": 114, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶ ಯಾವುದು ಅಲ್ಲ?", "a": "ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ", "r": "1:11"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಶುಭಸಂದೇಶವು", "r": "1:11"}, {"n": 116, "q": "“ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "1:11"}, {"n": 117, "q": "ಗಲಾತ್ಯರಿಗೆ 1:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.", "r": "1:11"}, {"n": 118, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ …”", "a": "“… ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "r": "1:11"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಯಸುತ್ತೇನೆ", "r": "1:11"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಸಹೋದರರೇ; ಅಲ್ಲವೆಂದು", "r": "1:11"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಬೋಧಿಸಿದ", "r": "1:11"}, {"n": 122, "q": "ಪೌಲನಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಶ್ರುತಪಡಿಸಿದವರು ಯಾರು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:12"}, {"n": 123, "q": "ಪೌಲನು ಶುಭಸಂದೇಶವನ್ನು ಹೇಗೆ ಪಡೆಯಲಿಲ್ಲ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "1) ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ; 2) ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ", "r": "1:12"}, {"n": 124, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಶ್ರುತಪಡಿಸಿದರು’ ಎಂಬ ಪದವನ್ನು ಯಾರ ಬಗ್ಗೆ ಉಪಯೋಗಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು ಶುಭಸಂದೇಶವನ್ನು ಶ್ರುತಪಡಿಸಿದರು (1:12); ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದರು (1:16)", "r": "1:12; 1:16"}, {"n": 125, "q": "ಪೌಲನು ಶುಭಸಂದೇಶವನ್ನು ಯಾರಿಂದ ಕಲಿತುಕೊಂಡನು?", "a": "ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ; ಯೇಸುಕ್ರಿಸ್ತರೇ ಅದನ್ನು ಶ್ರುತಪಡಿಸಿದರು", "r": "1:12"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ;”", "a": "ಶುಭಸಂದೇಶವನ್ನು", "r": "1:12"}, {"n": 127, "q": "“ಈ ಶುಭಸಂದೇಶವನ್ನು ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "1:12"}, {"n": 128, "q": "ಗಲಾತ್ಯರಿಗೆ 1:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಶುಭಸಂದೇಶವನ್ನು ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ; ಅದನ್ನು ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ; ಯೇಸುಕ್ರಿಸ್ತರೇ ನನಗದನ್ನು ಶ್ರುತಪಡಿಸಿದರು.", "r": "1:12"}, {"n": 129, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದ್ದು ಯಾವಾಗ?", "a": "ಹಿಂದೊಮ್ಮೆ ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ", "r": "1:13"}, {"n": 130, "q": "ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ಪೌಲನು ದೇವರ ಸಭೆಗೆ ಏನು ಮಾಡಿದನು?", "a": "ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದನು; ಅದನ್ನು ಧ್ವಂಸಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದನು", "r": "1:13"}, {"n": 131, "q": "ಪೌಲನ ಹಿಂದಿನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ಯಾರು ಚೆನ್ನಾಗಿ ಬಲ್ಲರು?", "a": "ಗಲಾತ್ಯರು (“ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ”)", "r": "1:13"}, {"n": 132, "q": "ಪೌಲನು ಹಿಂದೆ ಹಿಂಸಿಸಿದ್ದನ್ನು ಸ್ವತಃ ಪೌಲನೂ, ಜುದೇಯದ ಸಭೆಗಳೂ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "1:13 (ಪೌಲನು); 1:23 (ಜುದೇಯದ ಸಭೆಗಳು ಕೇಳಿದ ಸುದ್ದಿ)", "r": "1:13; 1:23"}, {"n": 133, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಏನು ಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದನು?", "a": "ಧ್ವಂಸಮಾಡಲು", "r": "1:13"}, {"n": 134, "q": "ಪೌಲನು ಹಿಂದೆ ಯಾವ ಮತಕ್ಕೆ ಸೇರಿದವನಾಗಿದ್ದನು?", "a": "ಯೆಹೂದ್ಯ ಮತ (ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದನು)", "r": "1:13"}, {"n": 135, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಹೇಗೆ ಹಿಂಸಿಸಿದನು?", "a": "ಕ್ರೂರವಾಗಿ", "r": "1:13"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.”", "a": "ಮತಸ್ಥನಾಗಿದ್ದಾಗ", "r": "1:13"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಸಿಸಿದೆ;”", "a": "ಕ್ರೂರವಾಗಿ", "r": "1:13"}, {"n": 138, "q": "“ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 139, "q": "ಗಲಾತ್ಯರಿಗೆ 1:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ. ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದೆ; ಅದನ್ನು ಧ್ವಂಸಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದೆ.", "r": "1:13"}, {"n": 140, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ …”", "a": "“… ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.”", "r": "1:13"}, {"n": 141, "q": "“ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.”", "a": "ಹೇಗಿತ್ತೆಂದು", "r": "1:13"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹಿಂಸಿಸಿದೆ", "r": "1:13"}, {"n": 144, "q": "ಪೌಲನು ಯಾವುದರಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದನು?", "a": "ತನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ", "r": "1:14"}, {"n": 145, "q": "ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಪೌಲನು ಯಾರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದನು?", "a": "ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ", "r": "1:14"}, {"n": 146, "q": "ಪೌಲನು ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಹೇಗಿದ್ದನು?", "a": "ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದನು", "r": "1:14"}, {"n": 147, "q": "ಪೌಲನು ಯಾರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದನು?", "a": "ತನ್ನ ಪೂರ್ವಜರ", "r": "1:14"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ", "r": "1:14"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.”", "a": "ಸಮವಯಸ್ಕರಿಗಿಂತ", "r": "1:14"}, {"n": 150, "q": "“ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 151, "q": "ಗಲಾತ್ಯರಿಗೆ 1:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ. ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.", "r": "1:14"}, {"n": 152, "q": "“ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ.”", "a": "ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ", "r": "1:14"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.”", "a": "ಮತಾಚರಣೆಯಲ್ಲಿ", "r": "1:14"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ.”", "a": "ಅತ್ಯಧಿಕ", "r": "1:14"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translat nslateY(-2pt);margin:0 1mm\"><\/span> ತಾಯಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ನಾನಿನ್ನೂ; ಗರ್ಭದಲ್ಲಿ", "r": "1:15"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ಇದ್ದಾಗಲೇ", "r": "1:15"}, {"n": 169, "q": "ಪೌಲನು ಯಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಅವನಿಗೆ ಶ್ರುತಪಡಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "1:16"}, {"n": 170, "q": "ದೇವರು ಪೌಲನಿಗೆ ಯಾರನ್ನು ಶ್ರುತಪಡಿಸಿದರು?", "a": "ತಮ್ಮ ಮಗನನ್ನು", "r": "1:16"}, {"n": 171, "q": "ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದಾಗ ಪೌಲನು ಸಲಹೆಗಾಗಿ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ", "r": "1:16"}, {"n": 172, "q": "ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದ ನಂತರ ಪೌಲನು ಮಾಡದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "1) ಸಲಹೆಗಾಗಿ ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ; 2) ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಲಿಲ್ಲ", "r": "1:16–17"}, {"n": 173, "q": "ಪೌಲನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಏನನ್ನು ಸಾರಬೇಕಿತ್ತು?", "a": "ಶುಭಸಂದೇಶವನ್ನು", "r": "1:16"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "a": "ಸಾರಬೇಕೆಂದು", "r": "1:16"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ.”", "a": "ಸಲಹೆಗಾಗಿ", "r": "1:16"}, {"n": 176, "q": "“ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 177, "q": "ಗಲಾತ್ಯರಿಗೆ 1:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು. ಆಗ ಸಲಹೆಗಾಗಿ ನಾನು ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ.", "r": "1:16"}, {"n": 178, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು …”", "a": "“… ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "r": "1:16"}, {"n": 179, "q": "“ಆಗ ಸಲಹೆಗಾಗಿ ನಾನು ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "1:16"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಸಲಹೆಗಾಗಿ ನಾನು ಯಾರ ಬಳಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಲಿಲ್ಲ", "r": "1:16"}, {"n": 182, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿ ಯಾರನ್ನು ಕಾಣಲಿಲ್ಲ?", "a": "ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು", "r": "1:17"}, {"n": 183, "q": "ಕರೆ ಹೊಂದಿದ ನಂತರ ಪೌಲನು ನೇರವಾಗಿ ಎಲ್ಲಿಗೆ ಹೋದನು?", "a": "ಅರೇಬಿಯಾಕ್ಕೆ", "r": "1:17"}, {"n": 184, "q": "ಅರೇಬಿಯಾದಿಂದ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹಿಂದಿರುಗಿದನು?", "a": "ದಮಸ್ಕಸ್ ನಗರಕ್ಕೆ", "r": "1:17"}, {"n": 185, "q": "ಕರೆ ಹೊಂದಿದ ತಕ್ಷಣ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹೋಗಲಿಲ್ಲ?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "1:17"}, {"n": 186, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೌಲನು ಹೋದ ಸ್ಥಳಗಳನ್ನು ಕ್ರಮವಾಗಿ ತಿಳಿಸಿ.", "a": "1) ಅರೇಬಿಯ; 2) ದಮಸ್ಕಸ್; 3) ಜೆರುಸಲೇಮ್ (ಮೂರು ವರ್ಷಗಳ ನಂತರ); 4) ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳು", "r": "1:17–21"}, {"n": 187, "q": "ಪೌಲನು ಅರೇಬಿಯಾಕ್ಕೆ ಹೇಗೆ ಹೋದನು?", "a": "ನೇರವಾಗಿ", "r": "1:17"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ.”", "a": "ಪ್ರೇಷಿತರಾದವರನ್ನು", "r": "1:17"}, {"n": 189, "q": "“ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "1:17"}, {"n": 190, "q": "ಗಲಾತ್ಯರಿಗೆ 1:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ. ಬದಲಿಗೆ, ನೇರವಾಗಿ ಅರೇಬಿಯಾಕ್ಕೆ ಹೋದೆ. ಅಲ್ಲಿಂದ ದಮಸ್ಕಸ್ ನಗರಕ್ಕೆ ಹಿಂದಿರುಗಿದೆ.", "r": "1:17"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಲಿಲ್ಲ.”", "a": "ಜೆರುಸಲೇಮಿಗೂ", "r": "1:17"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಲಿಲ್ಲ", "r": "1:17"}, {"n": 193, "q": "ಎಷ್ಟು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಹೋದನು?", "a": "ಮೂರು ವರ್ಷಗಳ ನಂತರ", "r": "1:18"}, {"n": 194, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಯಾರನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಹೋದನು?", "a": "ಕೇಫನನ್ನು", "r": "1:18"}, {"n": 195, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಕೇಫನೊಂದಿಗೆ ಎಷ್ಟು ದಿನ ತಂಗಿದ್ದನು?", "a": "ಹದಿನೈದು ದಿನ", "r": "1:18"}, {"n": 196, "q": "ಮೂರು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಏಕೆ ಹೋದನು?", "a": "ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು", "r": "1:18"}, {"n": 197, "q": "ಮೂರು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹೋದನು?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "1:18"}, {"n": 198, "q": "ಪೌಲನು ಹದಿನೈದು ದಿನ ಯಾರೊಂದಿಗೆ ತಂಗಿದ್ದನು?", "a": "ಕೇಫನೊಂದಿಗೆ", "r": "1:18"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ;”", "a": "ಕೇಫನನ್ನು", "r": "1:18"}, {"n": 200, "q": "“ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "1:18"}, {"n": 201, "q": "ಗಲಾತ್ಯರಿಗೆ 1:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ; ಹದಿನೈದು ದಿನ ಆತನೊಂದ line-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ ನಾನು ಕಾಣಲಿಲ್ಲ.”", "a": "ಪ್ರೇಷಿತರಲ್ಲಿ", "r": "1:19"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹೋದರ ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಕಾಣಲಿಲ್ಲ.”", "a": "ಪ್ರಭುವಿನ; ಪ್ರೇಷಿತರನ್ನೂ", "r": "1:19"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಲಿಲ್ಲ", "r": "1:19"}, {"n": 216, "q": "ಪೌಲನು ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ಯಾರು ಸಾಕ್ಷಿ?", "a": "ದೇವರೇ", "r": "1:20"}, {"n": 217, "q": "ತನ್ನ ಮಾತುಗಳ ಸತ್ಯತೆಯ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.”", "r": "1:20"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರೇ ಸಾಕ್ಷಿ.”", "a": "ಎಂಬುದಕ್ಕೆ", "r": "1:20"}, {"n": 219, "q": "“ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "1:20"}, {"n": 220, "q": "ಗಲಾತ್ಯರಿಗೆ 1:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.", "r": "1:20"}, {"n": 221, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು …”", "a": "“… ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.”", "r": "1:20"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.”", "a": "ಸಂಗತಿಗಳು", "r": "1:20"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿ", "r": "1:20"}, {"n": 224, "q": "ಜೆರುಸಲೇಮಿನ ಭೇಟಿಯ ಅನಂತರ ಪೌಲನು ಯಾವ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದನು?", "a": "ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ", "r": "1:21"}, {"n": 225, "q": "ಜೆರುಸಲೇಮಿನಿಂದ ಪೌಲನು ಹೋದ ಪ್ರಾಂತ್ಯಗಳು ಎಷ್ಟು? ಯಾವುವು?", "a": "ಎರಡು: ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ", "r": "1:21"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.”", "a": "ಸಿಲಿಸಿಯ", "r": "1:21"}, {"n": 227, "q": "“ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "1:21"}, {"n": 228, "q": "ಗಲಾತ್ಯರಿಗೆ 1:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.", "r": "1:21"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.”", "a": "ಸಿರಿಯ", "r": "1:21"}, {"n": 230, "q": "ಪೌಲನ ಪರಿಚಯವಾಗಿರದಿದ್ದ ಸಭೆಗಳು ಯಾವುವು?", "a": "ಜುದೇಯ ಪ್ರಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು", "r": "1:22"}, {"n": 231, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನನ್ನು ಕುರಿತು ದೇವರನ್ನು ಏಕೆ ಕೊಂಡಾಡುತ್ತಿದ್ದರು?", "a": "ಹಿಂದೆ ತಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ ಎಂಬ ಸುದ್ದಿ ಕೇಳಿದ್ದರಿಂದ", "r": "1:22–24"}, {"n": 232, "q": "ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದಾಗ ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ಪೌಲನ ಬಗ್ಗೆ ಏನು ಸ್ಥಿತಿ ಇತ್ತು?", "a": "ಅವರಿಗೆ ಅವನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ", "r": "1:22"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.”", "a": "ಜುದೇಯ", "r": "1:22"}, {"n": 234, "q": "“ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "1:22"}, {"n": 235, "q": "ಗಲಾತ್ಯರಿಗೆ 1:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.", "r": "1:22"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ", "r": "1:22"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.”", "a": "ಕ್ರೈಸ್ತ", "r": "1:22"}, {"n": 238, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನ ಬಗ್ಗೆ ಕೇಳಿದ್ದ ಸುದ್ದಿ ಏನು?", "a": "‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’", "r": "1:23"}, {"n": 239, "q": "ಪೌಲನು ಹಿಂದೆ ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ್ದು ಏನನ್ನು?", "a": "ವಿಶ್ವಾಸವನ್ನು (ದೇವರ ಸಭೆಯನ್ನು)", "r": "1:23"}, {"n": 240, "q": "“ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು” ಎಂಬುದು ಯಾರನ್ನು ಕುರಿತು?", "a": "ಪೌಲನನ್ನು", "r": "1:23"}, {"n": 241, "q": "ಹಿಂದೊಮ್ಮೆ ಸಭೆಯನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದ ಪೌಲನು ಈಗ ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದನು", "r": "1:23"}, {"n": 242, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನ ಬಗ್ಗೆ ಏನನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು?", "a": "ಒಂದು ಸುದ್ದಿಯನ್ನು (ಹಿಂದೆ ಹಿಂಸಿಸುತ್ತಿದ್ದವನು ಈಗ ವಿಶ್ವಾಸವನ್ನು ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ ಎಂಬುದು)", "r": "1:23"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಹಿಂಸಿಸುತ್ತಿದ್ದವನು", "r": "1:23"}, {"n": 244, "q": "“‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "1:23"}, {"n": 245, "q": "ಗಲಾತ್ಯರಿಗೆ 1:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.", "r": "1:23"}, {"n": 246, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ …”", "a": "“… ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "r": "1:23"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಮಾಡುತ್ತಿದ್ದಾನೆ", "r": "1:23"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಮಾಡಲೆತ್ನಿಸಿದ; ವಿಶ್ವಾಸವನ್ನೇ", "r": "1:23"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಸುದ್ದಿಯನ್ನು", "r": "1:23"}, {"n": 250, "q": "ಪೌಲನನ್ನು ಕುರಿತು ಜುದೇಯದ ಸಭೆಗಳವರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ದೇವರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು", "r": "1:24"}, {"n": 251, "q": "ಜುದೇಯದ ಸಭೆಗಳವರು ಪೌಲನನ್ನು ಕುರಿತು ಯಾರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು?", "a": "ದೇವರನ್ನು", "r": "1:24"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ನನ್ನನ್ನು ಕುರಿತು ಅವರು ದೇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಂಡಾಡುತ್ತಿದ್ದರು", "r": "1:24"}, {"n": 253, "q": "“ಈ ಕಾರಣ ನನ್ನನ್ನು ಕುರಿತು ಅವರು ದೇವರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "1:24"}, {"n": 254, "q": "ಗಲಾತ್ಯರಿಗೆ 1:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಕಾರಣ ನನ್ನನ್ನು ಕುರಿತು ಅವರು ದೇವರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು.", "r": "1:24"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಅವರು ದೇವರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು.”", "a": "ನನ್ನನ್ನು", "r": "1:24"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನನ್ನು ಕುರಿತು ಅವರು ದೇವರನ್ನು ಕೊಂಡಾಡುತ್ತಿದ್ದರು.”", "a": "ಕಾರಣ", "r": "1:24"}]}, {"chapter": 2, "label": "ಅಧ್ಯಾಯ 2", "verses": 21, "subtitle": null, "questions": [{"n": 1, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೌಲನು ಮತ್ತು ಇತರ ಪ್ರೇಷಿತರು", "r": "2:1"}, {"n": 2, "q": "ಎಷ್ಟು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ಪೌಲನು ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದನು?", "a": "ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು", "r": "2:1"}, {"n": 3, "q": "ಪೌಲನು ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದಾಗ ಯಾರನ್ನು ಕರೆದುಕೊಂಡು ಹೋದನು?", "a": "ತೀತನನ್ನು", "r": "2:1"}, {"n": 4, "q": "ಪೌಲನು ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಯಾರ ಜೊತೆಯಲ್ಲಿ ಹೋದನು?", "a": "ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ", "r": "2:1"}, {"n": 5, "q": "ಹದಿನಾಲ್ಕು ವರ್ಷಗಳ ನಂತರ ಜೆರುಸಲೇಮಿಗೆ ಹೋದಾಗ ಪೌಲನೊಂದಿಗೆ ಇದ್ದ ಇಬ್ಬರು ಯಾರು?", "a": "ಬಾರ್ನಬ ಮತ್ತು ತೀತ", "r": "2:1"}, {"n": 6, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಬಾರ್ನಬನನ್ನು ಉಲ್ಲೇಖಿಸುವ ಮೂರು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "1) ಪೌಲನೊಡನೆ ಜೆರುಸಲೇಮಿಗೆ ಹೋದದ್ದು (2:1); 2) ಸಭಾಸ್ತಂಭಗಳು ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆ ಸೂಚಿಸಿದ್ದು (2:9); 3) ಯೆಹೂದ್ಯರ ಕಪಟ ವರ್ತನೆಗೆ ಮಾರುಹೋದದ್ದು (2:13)", "r": "2:1; 2:9; 2:13"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದುಕೊಂಡು ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.”", "a": "ತೀತನನ್ನು", "r": "2:1"}, {"n": 8, "q": "“ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು ಕರೆದುಕೊಂಡು ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "2:1"}, {"n": 9, "q": "ಗಲಾತ್ಯರಿಗೆ 2:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು ಕರೆದುಕೊಂಡು ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.", "r": "2:1"}, {"n": 10, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು …”", "a": "“… ಕರೆದುಕೊಂಡು ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.”", "r": "2:1"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು ಕರೆದುಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.”", "a": "ಬಾರ್ನಬನ", "r": "2:1"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದೆ.”", "a": "ಕರೆದುಕೊಂಡು; ಜೆರುಸಲೇಮಿಗೆ", "r": "2:1"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ ತೀತನನ್ನು ಕರೆದುಕೊಂಡು ಬಾರ್ನಬನ ಜೊತೆಯಲ್ಲಿ ಪುನಃ ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ.”", "a": "ಹದಿನಾಲ್ಕು", "r": "2:1"}, {"n": 14, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಯಾವುದಕ್ಕೆ ಅನುಸಾರವಾಗಿ ಹೋದನು?", "a": "ದೇವಪ್ರೇರಣೆಗೆ ಅನುಸಾರವಾಗಿ", "r": "2:2"}, {"n": 15, "q": "ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ತಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶವನ್ನು ಪೌಲನು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಯಾರಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದನು?", "a": "ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ", "r": "2:2"}, {"n": 16, "q": "ಪೌಲನು ತನ್ನ ಸಂದೇಶವನ್ನು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಹೇಗೆ ತಿಳಿಸಿದನು?", "a": "ಪ್ರತ್ಯೇಕವಾಗಿ", "r": "2:2"}, {"n": 17, "q": "ಪೌಲನು ತನ್ನ ಸಂದೇಶವನ್ನು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಏಕೆ ತಿಳಿಸಿದನು?", "a": "ಅದುವರೆಗೆ ತಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ", "r": "2:2"}, {"n": 18, "q": "ಪೌಲನು ಯಾರಿಗೆ ಸಂದೇಶವನ್ನು ಸಾರುತ್ತಿದ್ದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಗೆ", "r": "2:2"}, {"n": 19, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿನ ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಏನನ್ನು ತಿಳಿಸಿದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ತಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು", "r": "2:2"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.”", "a": "ಸಾರುತ್ತಿದ್ದ", "r": "2:2"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "a": "ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ", "r": "2:2"}, {"n": 22, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು …”", "a": "“… ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.”", "r": "2:2"}, {"n": 23, "q": "“ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 24, "q": "ಗಲಾತ್ಯರಿಗೆ 2:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವಪ್ರೇರಣೆಗೆ ಅನುಸಾರವಾಗಿಯೇ ಅಲ್ಲಿಗೆ ಹೋದೆ. ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ. ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.", "r": "2:2"}, {"n": 25, "q": "“ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 26, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ …”", "a": "“… ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "r": "2:2"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.”", "a": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ", "r": "2:2"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "a": "ಪಡುತ್ತಿರುವ", "r": "2:2"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸಿದೆ.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಗೆ; ಪ್ರತ್ಯೇಕವಾಗಿ", "r": "2:2"}, {"n": 30, "q": "ಪೌಲನ ಸಂಗಡವಿದ್ದ ಗ್ರೀಕನು ಯಾರು?", "a": "ತೀತನು", "r": "2:3"}, {"n": 31, "q": "ತೀತನು ಯಾವ ಜನಾಂಗದವನಾಗಿದ್ದನು?", "a": "ಗ್ರೀಕನು", "r": "2:3"}, {"n": 32, "q": "ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಯಾರೂ ಅವನಿಗೆ ಏನಾಗಬೇಕೆಂದು ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ?", "a": "ಸುನ್ನತಿ", "r": "2:3"}, {"n": 33, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸುನ್ನತಿ’ ಎಂಬ ಪದ ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:3 (ತೀತನಿಗೆ ಸುನ್ನತಿ); 2:12 (ಸುನ್ನತಿ ಪರವಾದಿಗಳು)", "r": "2:3; 2:12"}, {"n": 34, "q": "“ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು” — ಇಲ್ಲಿ ‘ನನ್ನ’ ಎಂಬುದು ಯಾರನ್ನು ಕುರಿತದ್ದು?", "a": "ಪೌಲನನ್ನು", "r": "2:3"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ತೀತನು", "r": "2:3"}, {"n": 36, "q": "“ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 37, "q": "ಗಲಾತ್ಯರಿಗೆ 2:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.", "r": "2:3"}, {"n": 38, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ …”", "a": "“… ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "r": "2:3"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ", "r": "2:3"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ಸಂಗಡವಿದ್ದ; ಗ್ರೀಕನಾಗಿದ್ದರೂ", "r": "2:3"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ಆಗಬೇಕೆಂದು", "r": "2:3"}, {"n": 42, "q": "ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಸುನ್ನತಿಯ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆಗೆ ಕಾರಣರಾದವರು ಯಾರು?", "a": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು", "r": "2:4"}, {"n": 43, "q": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಸಹೋದರರು ಯಾವುದರ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ", "r": "2:4"}, {"n": 44, "q": "ಗೂಢಾಚಾರರ ಉದ್ದೇಶ ಏನಾಗಿತ್ತು?", "a": "ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದು", "r": "2:4"}, {"n": 45, "q": "ಗೂಢಾಚಾರರು ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಹೇಗೆ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು?", "a": "ಗುಟ್ಟಾಗಿ", "r": "2:4"}, {"n": 46, "q": "ಗೂಢಾಚಾರರು ಪೌಲನ ಸಂಗಡಿಗರನ್ನು ಯಾವುದರಲ್ಲಿ ಸಿಕ್ಕಿಸಲು ಬಯಸಿದರು, ಪೌಲನು ಯಾವುದನ್ನು ಕಾಪಾಡಿದನು?", "a": "ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಲು; ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದನು", "r": "2:4; 2:5"}, {"n": 47, "q": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದವರನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಕೆಲವು ಸಹೋದರರು", "r": "2:4"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "a": "ಅಲ್ಲಿದ್ದುದರಿಂದ", "r": "2:4"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:4"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.”", "a": "ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ", "r": "2:4"}, {"n": 51, "q": "“ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 52, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ …”", "a": "“… ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.”", "r": "2:4"}, {"n": 53, "q": "“ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 54, "q": "ಗಲಾತ್ಯರಿಗೆ 2:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು. ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು. ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.", "r": "2:4"}, {"n": 55, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು …”", "a": "“… ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "r": "2:4"}, {"n": 56, "q": "“ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "a": "ಗೂಢಾಚಾರರಾಗಿ", "r": "2:4"}, {"n": 58, "q": "ಪೌಲನು ಮತ್ತು ಸಂಗಡಿಗರು ಗೂಢಾಚಾರರಿಗೆ ಎಷ್ಟು ಹೊತ್ತು ಬಿಟ್ಟುಕೊಟ್ಟರು?", "a": "ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ", "r": "2:5"}, {"n": 59, "q": "ಗೂಢಾಚಾರರಿಗೆ ಬಿಟ್ಟುಕೊಡದೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೋಸ್ಕರ ಏನನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದನು?", "a": "ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು", "r": "2:5"}, {"n": 60, "q": "ಶುಭಸಂದೇಶದ ‘ಸತ್ಯಾರ್ಥ’ ಮತ್ತು ‘ಸತ್ಯ’ ಎಂಬ ಪದಗಳು ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:5 (ಸತ್ಯಾರ್ಥ) ಮತ್ತು 2:14 (ಸತ್ಯ)", "r": "2:5; 2:14"}, {"n": 61, "q": "ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಯಾರಿಗೋಸ್ಕರ ಸುಭದ್ರವಾಗಿ ಇರಿಸಲಾಯಿತು?", "a": "ಗಲಾತ್ಯರಿಗೋಸ್ಕರ (“ನಿಮಗೋಸ್ಕರ”)", "r": "2:5"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ", "r": "2:5"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.”", "a": "ಸತ್ಯಾರ್ಥವನ್ನು", "r": "2:5"}, {"n": 64, "q": "“ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 65, "q": "ಗಲಾತ್ಯರಿಗೆ 2:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ. ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.", "r": "2:5"}, {"n": 66, "q": "“ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರಿಸಿದೆವು.”", "a": "ಸುಭದ್ರವಾಗಿ", "r": "2:5"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರಿಸಿದೆವು", "r": "2:5"}, {"n": 69, "q": "ಜೆರುಸಲೇಮಿನ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಪೌಲನಿಗೆ ಏನು ನೀಡಲಿಲ್ಲ?", "a": "ಯಾವ ಹೊಸ ಸಲಹೆಯನ್ನೂ", "r": "2:6"}, {"n": 70, "q": "ದೇವರ ನಿಷ್ಪಕ್ಷಪಾತದ ಬಗ್ಗೆ ಪೌಲನು ಆವರಣದಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರು ಮುಖನೋಡಿ ಮಣೆ ಹಾಕುವವರಲ್ಲ”", "r": "2:6"}, {"n": 71, "q": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳ ಬಗ್ಗೆ ಪೌಲನಿಗೆ ಯಾವುದು ಮುಖ್ಯವಲ್ಲ?", "a": "ಅವರು ಹಿಂದೆ ಎಂಥವರಾಗಿದ್ದರು ಎಂಬುದು", "r": "2:6"}, {"n": 72, "q": "ಪೌಲನಿಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡದವರು ಯಾರು?", "a": "ಅಲ್ಲಿದ್ದ (ಜೆರುಸಲೇಮಿನ) ಗಣ್ಯವ್ಯಕ್ತಿಗಳು", "r": "2:6"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳು", "r": "2:6"}, {"n": 74, "q": "“ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 75, "q": "ಗಲಾತ್ಯರಿಗೆ 2:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ (ಅವರು ಹಿಂದೆ ಎಂಥವರಾಗಿದ್ದರು ಎಂಬುದು ನನಗೆ ಮುಖ್ಯವಲ್ಲ; ದೇವರು ಮುಖನೋಡಿ ಮಣೆ ಹಾಕುವವರಲ್ಲ) ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.", "r": "2:6"}, {"n": 76, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … …”", "a": "“… ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "r": "2:6"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಅಲ್ಲಿದ್ದ", "r": "2:6"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಲಹೆ; ನೀಡಲಿಲ್ಲ", "r": "2:6"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಯಾವ", "r": "2:6"}, {"n": 80, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ದೇವರು ಯಾರಿಗೆ ವಹಿಸಿಕೊಟ್ಟರು?", "a": "ಪೇತ್ರನಿಗೆ", "r": "2:7"}, {"n": 81, "q": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯ ಯಾರಿಗೆ ವಹಿಸಲ್ಪಟ್ಟಿತು?", "a": "ಪೌಲನಿಗೆ", "r": "2:7"}, {"n": 82, "q": "ಜೆರುಸಲೇಮಿನ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಪೌಲನ ಬಗ್ಗೆ ಏನನ್ನು ಒಪ್ಪಿಕೊಂಡರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ಅವನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು", "r": "2:7"}, {"n": 83, "q": "ಪೌಲನು ತನ್ನ ಸೇವೆಯನ್ನು ಯಾರ ಸೇವೆಗೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶ ಸಾರುವ ಪೇತ್ರನ ಸೇವೆಗೆ", "r": "2:7"}, {"n": 84, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೇತ್ರನನ್ನು ಯಾವ ಎರಡು ಹೆಸರುಗಳಿಂದ ಕರೆಯಲಾಗಿದೆ?", "a": "ಪೇತ್ರ (2:7–8) ಮತ್ತು ಕೇಫ (2:9, 11, 14)", "r": "2:7–9; 2:11"}, {"n": 85, "q": "ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟ ಸೇವೆ ಯಾವುದು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆ", "r": "2:7"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಪೇತ್ರನಿಗೆ", "r": "2:7"}, {"n": 87, "q": "“ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 88, "q": "ಗಲಾತ್ಯರಿಗೆ 2:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.", "r": "2:7"}, {"n": 89, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು …”", "a": "“… ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "r": "2:7"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:7"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ; ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ", "r": "2:7"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಸೇವಾಕಾರ್ಯವನ್ನು", "r": "2:7"}, {"n": 93, "q": "ದೇವರು ಪೇತ್ರನನ್ನು ಯಾರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪ್ರೇರೇಪಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ", "r": "2:8"}, {"n": 94, "q": "ದೇವರು ಪೌಲನನ್ನು ಯಾರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ಪ್ರೇರೇಪಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:8"}, {"n": 95, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದವರು ಯಾರು?", "a": "ದೇವರು", "r": "2:8"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಪೇತ್ರನನ್ನು", "r": "2:8"}, {"n": 97, "q": "“ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "2:8"}, {"n": 98, "q": "ಗಲಾತ್ಯರಿಗೆ 2:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.", "r": "2:8"}, {"n": 99, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ …”", "a": "“… ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "r": "2:8"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:8"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರೇಷಿತನಾಗುವಂತೆ; ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ", "r": "2:8"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಪ್ರೇಷಿತನಾಗಲು", "r": "2:8"}, {"n": 103, "q": "ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದವರು ಯಾರು?", "a": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು", "r": "2:9"}, {"n": 104, "q": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ಏನೆಂದು ಪರಿಗಣಿತರಾಗಿದ್ದರು?", "a": "ಸಭಾಸ್ತಂಭಗಳೆಂದು", "r": "2:9"}, {"n": 105, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಿಗೂ ಬಾರ್ನಬನಿಗೂ ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಹೇಗೆ ಸೂಚಿಸಿದರು?", "a": "ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು", "r": "2:9"}, {"n": 106, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಲ್ಲಿ ಏನನ್ನು ಮನಗಂಡರು?", "a": "ಅವನಿಗೆ ಕೊಡಲಾಗಿದ್ದ ವಿಶೇಷ ವರವನ್ನು", "r": "2:9"}, {"n": 107, "q": "ಸೇವೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳುವ ಬಗ್ಗೆ ಸಭಾಸ್ತಂಭಗಳು ಪೌಲ ಬಾರ್ನಬರಿಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ”", "r": "2:9"}, {"n": 108, "q": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ಯಾರಿಬ್ಬರಿಗೆ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು?", "a": "ಪೌಲನಿಗೂ ಬಾರ್ನಬನಿಗೂ", "r": "2:9"}, {"n": 109, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯಕೋಬನನ್ನು ಉಲ್ಲೇಖಿಸುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:9 (ಸಭಾಸ್ತಂಭಗಳಲ್ಲಿ ಒಬ್ಬ); 2:12 (ಯಕೋಬನ ಕಡೆಯಿಂದ ಬಂದ ಸಹೋದರರು)", "r": "2:9; 2:12"}, {"n": 110, "q": "ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಮೂವರು (ಯಕೋಬ, ಕೇಫ, ಯೊವಾನ್ನ)", "r": "2:9"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "a": "ಬಾರ್ನಬನಿಗೂ", "r": "2:9"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರ", "r": "2:9"}, {"n": 113, "q": "“ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, …”", "a": "“… ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.”", "r": "2:9"}, {"n": 115, "q": "ಗಲಾತ್ಯರಿಗೆ 2:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು. ಅಲ್ಲದೆ, “ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,” ಎಂದೂ ಹೇಳಿದರು.", "r": "2:9"}, {"n": 116, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, …”", "a": "“… ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "r": "2:9"}, {"n": 117, "q": "“ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "a": "ಯೊವಾನ್ನರು", "r": "2:9"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದೂ ಹೇಳಿದರು.”", "a": "ಹೋಗುತ್ತೇವೆ", "r": "2:9"}, {"n": 120, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಿಂದ ಕೇಳಿಕೊಂಡ ಒಂದೇ ವಿಷಯ ಯಾವುದು?", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬುದು", "r": "2:10"}, {"n": 121, "q": "ಬಡಬಗ್ಗರಿಗೆ ನೆರವಾಗುವ ವಿಷಯದಲ್ಲಿ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು", "r": "2:10"}, {"n": 122, "q": "ಪೌಲನು ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂದು ಸಭಾಸ್ತಂಭಗಳು ಕೇಳಿಕೊಂಡದ್ದು ಯಾರಿಗೆ?", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ", "r": "2:10"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ನೆರವಾಗಬೇಕೆಂಬ", "r": "2:10"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.”", "a": "ಮಾಡಬೇಕೆಂದು", "r": "2:10"}, {"n": 125, "q": "“ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 126, "q": "ಗಲಾತ್ಯರಿಗೆ 2:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು. ನಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.", "r": "2:10"}, {"n": 127, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ …”", "a": "“… ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "r": "2:10"}, {"n": 128, "q": "“ನಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ಅವರಲ್ಲಿದ್ದ", "r": "2:10"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ವಿಷಯವನ್ನು", "r": "2:10"}, {"n": 131, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:11ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೇತ್ರ ಪೌಲರ ವಾಗ್ವಾದ", "r": "2:11"}, {"n": 132, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಎಲ್ಲಿ ಖಂಡಿಸಿದನು?", "a": "ಅಂತಿಯೋಕ್ಯದಲ್ಲಿ (ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ)", "r": "2:11"}, {"n": 133, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಹೇಗೆ ಖಂಡಿಸಿದನು?", "a": "ಮುಖಾಮುಖಿಯಾಗಿ", "r": "2:11"}, {"n": 134, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಏಕೆ ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದನು?", "a": "ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ", "r": "2:11"}, {"n": 135, "q": "ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಅವನ ಬಗ್ಗೆ ಏನು ಸಿದ್ಧವಾಗಿತ್ತು?", "a": "ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು", "r": "2:11"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಅಂತಿಯೋಕ್ಯಕ್ಕೆ", "r": "2:11"}, {"n": 137, "q": "“ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 138, "q": "ಗಲಾತ್ಯರಿಗೆ 2:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.", "r": "2:11"}, {"n": 139, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು …”", "a": "“… ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "r": "2:11"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ", "r": "2:11"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಕೇಫನು; ತಪ್ಪಿತಸ್ಥನೆಂಬುದು", "r": "2:11"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಖಂಡಿಸಿದೆ.”", "a": "ಮುಖಾಮುಖಿಯಾಗಿ", "r": "2:11"}, {"n": 143, "q": "ಕೇಫನು ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದದ್ದು ಯಾರ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬಂದ ಮೇಲೆ?", "a": "ಯಕೋಬನ ಕಡೆಯಿಂದ", "r": "2:12"}, {"n": 144, "q": "ಯಕೋಬನ ಕಡೆಯ ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಕೇಫನು ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು", "r": "2:12"}, {"n": 145, "q": "ಕೇಫನು ಅನ್ಯಧರ್ಮೀಯರಿಂದ ಏಕೆ ದೂರವಾದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ", "r": "2:12"}, {"n": 146, "q": "ಕೇಫನು ಯಾರಿಗೆ ಅಂಜಿದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ", "r": "2:12"}, {"n": 147, "q": "ಯಕೋಬನ ಕಡೆಯ ಸಹೋದರರು ಬಂದ ಮೇಲೆ ಕೇಫನು ಏನು ಮಾಡಿದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು", "r": "2:12"}, {"n": 148, "q": "ಕೇಫನು ಯಾರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದು ಆಮೇಲೆ ಅವರಿಂದ ದೂರವಾದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ", "r": "2:12"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "a": "ಯಕೋಬನ", "r": "2:12"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೂರವಾದನು.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಂದ", "r": "2:12"}, {"n": 151, "q": "“ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 152, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ …”", "a": "“… ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.”", "r": "2:12"}, {"n": 153, "q": "ಗಲಾತ್ಯರಿಗೆ 2:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು. ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.", "r": "2:12"}, {"n": 154, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ …”", "a": "“… ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "r": "2:12"}, {"n": 155, "q": "“ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ", "r": "2:12"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.”", "a": "ಪರವಾದಿಗಳಿಗೆ", "r": "2:12"}, {"n": 158, "q": "ಕೇಫನ ಸಂಗಡ ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದವರು ಯಾರು?", "a": "ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು", "r": "2:13"}, {"n": 159, "q": "ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದ ಯೆಹೂದ್ಯರ ವರ್ತನೆಗೆ ಮಾರುಹೋದವನು ಯಾರು?", "a": "ಬಾರ್ನಬ", "r": "2:13"}, {"n": 160, "q": "ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಹೇಗೆ ವರ್ತಿಸಿದರು?", "a": "ಕಪಟತನದಿಂದ", "r": "2:13"}, {"n": 161, "q": "ಬಾರ್ನಬನು ಯಾರ ವರ್ತನೆಗೆ ಮಾರುಹೋದನು?", "a": "ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರ ವರ್ತನೆಗೆ", "r": "2:13"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "a": "ಕೇಫನ", "r": "2:13"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರ ವರ್ತನೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹ ಮಾರುಹೋದನು.”", "a": "ಬಾರ್ನಬನೂ", "r": "2:13"}, {"n": 164, "q": "“ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 165, "q": "ಗಲಾತ್ಯರಿಗೆ 2:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು. ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ ಮಾರುಹೋದನು.", "r": "2:13"}, {"n": 166, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ …”", "a": "“… ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "r": "2:13"}, {"n": 167, "q": "“ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ ಮಾರುಹೋದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವರ್ತಿಸಿದರು", "r": "2:13"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "a": "ಮಿಕ್ಕ", "r": "2:13"}, {"n": 170, "q": "ಕೇಫನ ಮತ್ತು ಇತರರ ನಡತೆ ಯಾವುದಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಪೌಲನಿಗೆ ಮನದಟ್ಟಾಯಿತು?", "a": "ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ", "r": "2:14"}, {"n": 171, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಯಾರ ಸಮ್ಮುಖದಲ್ಲಿ ಪ್ರಶ್ನಿಸಿದನು?", "a": "ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ", "r": "2:14"}, {"n": 172, "q": "ಪೌಲನು ಕೇಫನ ನಡತೆಯ ಬಗ್ಗೆ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "r": "2:14"}, {"n": 173, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಅನ್ಯಧರ್ಮೀಯರ ಬಗ್ಗೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದನು?", "a": "“ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?”", "r": "2:14"}, {"n": 174, "q": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ…” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಕೇಳಿದರು?", "a": "ಪೌಲನು ಕೇಫನಿಗೆ", "r": "2:14"}, {"n": 175, "q": "ಪೌಲನು ಕೇಫನಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಿದ್ದು ಯಾವಾಗ?", "a": "ಅವರ ನಡತೆ ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಮನದಟ್ಟಾದಾಗ", "r": "2:14"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.”", "a": "ಅನುಗುಣವಾದುದಲ್ಲ", "r": "2:14"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "a": "ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ", "r": "2:14"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.”", "a": "ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ", "r": "2:14"}, {"n": 179, "q": "“ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 180, "q": "“ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 181, "q": "ಗಲಾತ್ಯರಿಗೆ 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು. ಆಗ ನಾನು ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ ಕೇಫನಿಗೆ: “ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ? ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?” ಎಂದು ಕೇಳಿದೆ.", "r": "2:14"}, {"n": 182, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ …”", "a": "“… ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.”", "r": "2:14"}, {"n": 183, "q": "“‘ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 184, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು …”", "a": "“… ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.”", "r": "2:14"}, {"n": 185, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:15ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವೇ ಜೀವೋದ್ಧಾರದ ಮಾರ್ಗ", "r": "2:15"}, {"n": 186, "q": "ಪೌಲನು ತಾನೂ ಕೇಫನೂ ಹುಟ್ಟಿನಿಂದ ಏನೆಂದು ಹೇಳುತ್ತಾನ
