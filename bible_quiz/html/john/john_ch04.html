<script id="src" type="application/json">{"title": "ಯೊವಾನ್ನನು ಬರೆದ ಶುಭಸಂದೇಶ", "portion": "ಯೊವಾನ್ನ 1–12", "cover": false, "sections": false, "chapters": [{"chapter": 4, "label": "ಅಧ್ಯಾಯ 4", "verses": 54, "subtitle": null, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಸಮಾರಿಯದ ಮಹಿಳೆ", "r": "4:1"}, {"n": 2, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದ ವಾರ್ತೆ ಏನು?", "a": "ಯೊವಾನ್ನನಿಗಿಂತಲೂ ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದಾರೆ ಎಂಬುದು", "r": "4:1"}, {"n": 3, "q": "ಯೇಸು ಹೆಚ್ಚುಮಂದಿಯನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾರೆಂಬ ವಾರ್ತೆ ಯಾರ ಕಿವಿಗೆ ಬಿದ್ದಿತು?", "a": "ಫರಿಸಾಯರ", "r": "4:1"}, {"n": 4, "q": "ಫರಿಸಾಯರು ಕೇಳಿದ ವಾರ್ತೆಗೂ ವಾಸ್ತವಕ್ಕೂ ಇದ್ದ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದಾರೆಂದು ವಾರ್ತೆ; ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದವರು ಅವರ ಶಿಷ್ಯರು", "r": "4:1–2"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ, ಅವರಿಗೆ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಾ ಇದ್ದಾರೆಂಬ ವಾರ್ತೆ ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದಿತು.”", "a": "ಯೊವಾನ್ನನಿಗಿಂತಲೂ", "r": "4:1"}, {"n": 6, "q": "“ಯೊವಾನ್ನನಿಗಿಂತಲೂ ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ, ಅವರಿಗೆ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಾ ಇದ್ದಾರೆಂಬ ವಾರ್ತೆ ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "4:1"}, {"n": 7, "q": "ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಶಿಷ್ಯರು (ಯೇಸುವಲ್ಲ)", "r": "4:2"}, {"n": 8, "q": "ಯೊವಾನ್ನ 4:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "(ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದವರು ಯೇಸುವಿನ ಶಿಷ್ಯರೇ ಹೊರತು ಯೇಸುವಲ್ಲ).", "r": "4:2"}, {"n": 9, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ವಾರ್ತೆ ಬಿದ್ದುದನ್ನು ತಿಳಿದು ಯೇಸು ಯಾವ ನಾಡನ್ನು ಬಿಟ್ಟು ಎಲ್ಲಿಗೆ ಹೊರಟರು?", "a": "ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:3"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟರು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:3"}, {"n": 11, "q": "“ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "4:3"}, {"n": 12, "q": "ಯೊವಾನ್ನ 4:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.", "r": "4:3"}, {"n": 13, "q": "ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೋಗುವ ದಾರಿಯಲ್ಲಿ ಯೇಸು ಯಾವ ಪ್ರಾಂತ್ಯವನ್ನು ಹಾದುಹೋಗಬೇಕಾಗಿತ್ತು?", "a": "ಸಮಾರಿಯ ಪ್ರಾಂತ್ಯವನ್ನು", "r": "4:4"}, {"n": 14, "q": "ಯೇಸು ಸಮಾರಿಯದ ಯಾವ ಊರನ್ನು ತಲುಪಿದರು?", "a": "ಸಿಖಾರ್", "r": "4:5"}, {"n": 15, "q": "ಸಿಖಾರ್ ಊರಿನ ಪಕ್ಕದಲ್ಲಿ ಏನಿದೆ?", "a": "ಯಕೋಬನು ತನ್ನ ಮಗನಾದ ಜೋಸೆಫನಿಗೆ ಕೊಟ್ಟ ಭೂಮಿ", "r": "4:5"}, {"n": 16, "q": "ಯಕೋಬನು ಸಿಖಾರಿನ ಬಳಿಯ ಭೂಮಿಯನ್ನು ಯಾರಿಗೆ ಕೊಟ್ಟನು?", "a": "ತನ್ನ ಮಗನಾದ ಜೋಸೆಫನಿಗೆ", "r": "4:5"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೋಗುತ್ತಿರುವಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿಖಾರೆಂಬ ಊರನ್ನು ತಲುಪಿದರು.”", "a": "ಸಮಾರಿಯದ", "r": "4:5"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಊರಿನ ಪಕ್ಕದಲ್ಲೇ ಯಕೋಬನು ತನ್ನ ಮಗನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟ ಭೂಮಿ ಇದೆ.”", "a": "ಜೋಸೆಫನಿಗೆ", "r": "4:5"}, {"n": 19, "q": "“ಯೇಸು ಹೋಗುತ್ತಿರುವಾಗ ಸಮಾರಿಯದ ಸಿಖಾರೆಂಬ ಊರನ್ನು ತಲುಪಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "4:5"}, {"n": 20, "q": "ಸಿಖಾರಿನ ಬಳಿ ಇರುವ ಬಾವಿ ಯಾರದು?", "a": "ಯಕೋಬನ ಬಾವಿ", "r": "4:6"}, {"n": 21, "q": "ಯೇಸು ಬಾವಿಯ ಬಳಿ ಏಕೆ ಕುಳಿತುಕೊಂಡರು?", "a": "ಪಯಣದಿಂದ ಬಳಲಿದ್ದರಿಂದ", "r": "4:6"}, {"n": 22, "q": "ಯೇಸು ಯಕೋಬನ ಬಾವಿಯ ಬಳಿ ಕುಳಿತಾಗ ಸಮಯ ಎಷ್ಟಾಗಿತ್ತು?", "a": "ಸುಮಾರು ಮಧ್ಯಾಹ್ನದ ಹೊತ್ತು", "r": "4:6"}, {"n": 23, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಎರಡು ಮಧ್ಯಾಹ್ನದ ಹೊತ್ತುಗಳು ಯಾವುವು?", "a": "ಯೇಸು ಯಕೋಬನ ಬಾವಿಯ ಬಳಿ ಕುಳಿತ ಹೊತ್ತು (4:6); ಅಧಿಕಾರಿಯ ಮಗನ ಜ್ವರ ಬಿಟ್ಟ ಹೊತ್ತು — ಮಧ್ಯಾಹ್ನ ಒಂದು ಗಂಟೆ (4:52)", "r": "4:6; 4:52"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಯಣದಿಂದ ಬಳಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾವಿಯ ಬಳಿ ಕುಳಿತುಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "4:6"}, {"n": 25, "q": "ಯೊವಾನ್ನ 4:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲೇ ಯಕೋಬನ ಬಾವಿಯೂ ಇದೆ. ಪಯಣದಿಂದ ಬಳಲಿದ್ದ ಯೇಸು ಬಾವಿಯ ಬಳಿ ಕುಳಿತುಕೊಂಡರು. ಆಗ ಸುಮಾರು ಮಧ್ಯಾಹ್ನದ ಹೊತ್ತು.", "r": "4:6"}, {"n": 26, "q": "ಯಕೋಬನ ಬಾವಿಗೆ ನೀರು ಸೇದಲು ಬಂದವರು ಯಾರು?", "a": "ಒಬ್ಬ ಸಮಾರಿಯದ ಮಹಿಳೆ", "r": "4:7"}, {"n": 27, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಕುಡಿಯಲು ಕೊಂಚ ನೀರು ಕೊಡು”", "r": "4:7"}, {"n": 28, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವಿನೊಡನೆ ಮಾತನಾಡುವಾಗ ಯೇಸುವನ್ನು ಕುರಿತು ಕ್ರಮವಾಗಿ ಏನೆಂದು ಗುರುತಿಸಿಕೊಂಡಳು?", "a": "ಯೆಹೂದ್ಯ (4:9) → ಸ್ವಾಮೀ (4:15) → ಪ್ರವಾದಿ (4:19) → ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು? (4:29)", "r": "4:7; 4:9; 4:15; 4:17"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಿಳೆ ನೀರು ಸೇದಲು ಅಲ್ಲಿಗೆ ಬಂದಳು.”", "a": "ಸಮಾರಿಯದ", "r": "4:7"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಕುಡಿಯಲು ಕೊಂಚ ನೀರು ಕೊಡು,’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:7"}, {"n": 31, "q": "“ಒಬ್ಬ ಸಮಾರಿಯದ ಮಹಿಳೆ ನೀರು ಸೇದಲು ಅಲ್ಲಿಗೆ ಬಂದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 32, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ ಮಾತನಾಡುತ್ತಿದ್ದಾಗ ಶಿಷ್ಯರು ಎಲ್ಲಿಗೆ ಹೋಗಿದ್ದರು?", "a": "ಊರಿನೊಳಗೆ (ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ)", "r": "4:8"}, {"n": 33, "q": "ಶಿಷ್ಯರು ಊರಿನೊಳಗೆ ಹೋದದ್ದು ಏಕೆ, ಹಿಂದಿರುಗಿದ ಮೇಲೆ ಅವರು ಯೇಸುವಿಗೆ ಏನು ಒತ್ತಾಯಿಸಿದರು?", "a": "ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ; “ಗುರುದೇವಾ, ಊಟಮಾಡಿ”", "r": "4:8; 4:31–33"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.”", "a": "ತರುವುದಕ್ಕೆ", "r": "4:8"}, {"n": 35, "q": "“ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "4:8"}, {"n": 36, "q": "ಯೊವಾನ್ನ 4:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.", "r": "4:8"}, {"n": 37, "q": "ಯೇಸು ನೀರು ಕೇಳಿದಾಗ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನೆಂದಳು?", "a": "“ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು ಸಮಾರಿಯದವಳು. ಹೀಗಿರುವಲ್ಲಿ ನೀವು ನನ್ನಿಂದ ನೀರು ಕೇಳಬಹುದೇ?”", "r": "4:9"}, {"n": 38, "q": "ಯೆಹೂದ್ಯನಾದ ಯೇಸು ನೀರು ಕೇಳಿದ್ದು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಆಶ್ಚರ್ಯವಾದದ್ದು ಏಕೆ?", "a": "ಯೆಹೂದ್ಯರಿಗೂ ಸಮಾರಿಯದವರಿಗೂ ಹೊಕ್ಕುಬಳಕೆ ಇರಲಿಲ್ಲ", "r": "4:9"}, {"n": 39, "q": "“ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು ಸಮಾರಿಯದವಳು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವಿಗೆ", "r": "4:9"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ‘ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಮಾರಿಯದವಳು", "r": "4:9"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನಿಂದ ನೀರು ಕೇಳಬಹುದೇ?’ ಎಂದಳು.”", "a": "ಹೀಗಿರುವಲ್ಲಿ", "r": "4:9"}, {"n": 42, "q": "“ಅದಕ್ಕೆ ಆಕೆ, ‘ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು ಸಮಾರಿಯದವಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "4:9"}, {"n": 43, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯಾವ ಎರಡನ್ನು ಅರಿತಿದ್ದರೆ ಯೇಸುವಿನಲ್ಲಿ ಬೇಡುತ್ತಿದ್ದಳು?", "a": "ದೇವರು ಕೊಡುವ ವರದಾನವನ್ನು ಮತ್ತು ಕುಡಿಯಲು ನೀರು ಕೇಳುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು", "r": "4:10"}, {"n": 44, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಏನನ್ನು ಕೊಡುತ್ತಿದ್ದರು ಎಂದು ಹೇಳಿದರು?", "a": "ಜೀವಜಲವನ್ನು", "r": "4:10"}, {"n": 45, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಂದಿಗಿನ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಯೇಸು ಕೊಡುವ ‘ನೀರು’ ಏನನ್ನು ತರುತ್ತದೆ?", "a": "ನಿತ್ಯಜೀವವನ್ನು (ಅದು ಜೀವಜಲ)", "r": "4:10; 4:14"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ದೇವರು ಕೊಡುವ ವರದಾನವನ್ನು ಮತ್ತು ಕುಡಿಯಲು ನಿನ್ನಿಂದ ನೀರು ಕೇಳುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ನೀನು ಅರಿತಿದ್ದರೆ ಆಗ ನೀನೇ ಆತನಲ್ಲಿ ಬೇಡುತ್ತಿದ್ದೆ.”", "a": "ಯೇಸು", "r": "4:10"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ನಿನಗೆ ಜೀವಜಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಕೊಡುತ್ತಿದ್ದನು", "r": "4:10"}, {"n": 48, "q": "“ಆಗ ಯೇಸು, ‘ದೇವರು ಕೊಡುವ ವರದಾನವನ್ನು ಮತ್ತು ಕುಡಿಯಲು ನಿನ್ನಿಂದ ನೀರು ಕೇಳುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ನೀನು ಅರಿತಿದ್ದರೆ ಆಗ ನೀನೇ ಆತನಲ್ಲಿ ಬೇಡುತ್ತಿದ್ದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 49, "q": "ಜೀವಜಲದ ಬಗ್ಗೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹೀಗಿರುವಲ್ಲಿ ನಿಮಗೆ ಜೀವಜಲ ಎಲ್ಲಿಂದ ಬಂದೀತು?”", "r": "4:11"}, {"n": 50, "q": "ಯೇಸು ಜೀವಜಲ ಕೊಡಲಾರರು ಎಂಬುದಕ್ಕೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಕೊಟ್ಟ ಎರಡು ಕಾರಣಗಳು ಯಾವುವು?", "a": "1) ನೀರು ಸೇದುವುದಕ್ಕೆ ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ; 2) ಬಾವಿಯೂ ಆಳವಾಗಿದೆ", "r": "4:11"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ‘ನೀರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ, ಬಾವಿಯೂ ಆಳವಾಗಿದೆ;”", "a": "ಸೇದುವುದಕ್ಕೆ", "r": "4:11"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಜೀವಜಲ ಎಲ್ಲಿಂದ ಬಂದೀತು?”", "a": "ಹೀಗಿರುವಲ್ಲಿ", "r": "4:11"}, {"n": 53, "q": "“ಅದಕ್ಕೆ ಆಕೆ, ‘ನೀರು ಸೇದುವುದಕ್ಕೆ ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ, ಬಾವಿಯೂ ಆಳವಾಗಿದೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 54, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯ ಪ್ರಕಾರ ಅವರಿಗೆ ಬಾವಿಯನ್ನು ಕೊಟ್ಟವನು ಯಾರು?", "a": "ನಮ್ಮ ಪಿತಾಮಹ ಯಕೋಬನು", "r": "4:12"}, {"n": 55, "q": "ಯಕೋಬನ ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದವರು ಯಾರು ಎಂದು ಸಮಾರಿಯದ ಮಹಿಳೆ ಹೇಳಿದಳು?", "a": "ಯಕೋಬನು, ಆತನ ಮಕ್ಕಳು ಮತ್ತು ದನಕರುಗಳು", "r": "4:12"}, {"n": 56, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವನ್ನು ಯಕೋಬನಿಗೆ ಹೋಲಿಸಿ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅಂಥ ಪಿತಾಮಹನಿಗಿಂತ ತಾವು ದೊಡ್ಡವರೋ?”", "r": "4:12"}, {"n": 57, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯಕೋಬನನ್ನು ಏನೆಂದು ಕರೆದಳು?", "a": "ನಮ್ಮ ಪಿತಾಮಹ", "r": "4:12"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೆ ಈ ಬಾವಿಯನ್ನು ಕೊಟ್ಟವನು ನಮ್ಮ ಪಿತಾಮಹ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯಕೋಬನು", "r": "4:12"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು, ಆತನ ಮಕ್ಕಳು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದೇ ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದರು.”", "a": "ದನಕರುಗಳು", "r": "4:12"}, {"n": 60, "q": "ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಏನಾಗುತ್ತದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ", "r": "4:13"}, {"n": 61, "q": "ಯಕೋಬನ ಬಾವಿಯ ನೀರಿಗೂ ಯೇಸು ಕೊಡುವ ನೀರಿಗೂ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದವರಿಗೆ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ; ಯೇಸು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "4:13–14"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.”", "a": "ಯೇಸು", "r": "4:13"}, {"n": 63, "q": "“ಆಗ ಯೇಸು, ‘ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 64, "q": "ಯೊವಾನ್ನ 4:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.", "r": "4:13"}, {"n": 65, "q": "ಯೇಸು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "4:14"}, {"n": 66, "q": "ಯೇಸು ಕೊಡುವ ನೀರು ಕುಡಿದವನಲ್ಲಿ ಏನಾಗುತ್ತದೆ?", "a": "ಉಕ್ಕಿ ಹರಿಯುವ ಬುಗ್ಗೆಯಾಗಿ ನಿತ್ಯಜೀವವನ್ನು ತರುತ್ತದೆ", "r": "4:14"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾನು ಕೊಡುವ ನೀರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದಿಗೂ ದಾಹವಾಗದು;”", "a": "ಕುಡಿದವನಿಗೆ", "r": "4:14"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನೀರು ಅವನಲ್ಲಿ ಉಕ್ಕಿ ಹರಿಯುವ ಬುಗ್ಗೆಯಾಗಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತರುತ್ತದೆ,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "4:14"}, {"n": 69, "q": "“ಆದರೆ ನಾನು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 70, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನೆಂದು ಬೇಡಿದಳು?", "a": "“ಸ್ವಾಮೀ, ಅಂಥ ನೀರನ್ನು ಕೊಡಿ; ಇನ್ನು ಮುಂದೆ ನನಗೆ ದಾಹವಾಗದಿರಲಿ.”", "r": "4:15"}, {"n": 71, "q": "ಜೀವಜಲ ಪಡೆದರೆ ತನಗೆ ಏನು ತಪ್ಪುತ್ತದೆ ಎಂದು ಮಹಿಳೆ ಭಾವಿಸಿದಳು?", "a": "ನೀರು ಸೇದಲು ಇಷ್ಟು ದೂರ ಬರುವುದು", "r": "4:15"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ‘ಸ್ವಾಮೀ, ಅಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡಿ;”", "a": "ನೀರನ್ನು", "r": "4:15"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರು ಸೇದಲು ಇಷ್ಟು ದೂರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಪ್ಪಲಿ,’ ಎಂದಳು.”", "a": "ಬರುವುದು", "r": "4:15"}, {"n": 74, "q": "“ಅದಕ್ಕೆ ಆಕೆ, ‘ಸ್ವಾಮೀ, ಅಂಥ ನೀರನ್ನು ಕೊಡಿ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "4:15"}, {"n": 75, "q": "ಜೀವಜಲ ಕೇಳಿದ ಮಹಿಳೆಗೆ ಯೇಸು ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ”", "r": "4:16"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:16"}, {"n": 77, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ‘ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ,’ ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "4:16"}, {"n": 78, "q": "ಯೊವಾನ್ನ 4:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ,” ಎಂದು ಹೇಳಿದರು.", "r": "4:16"}, {"n": 79, "q": "“ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ” ಎಂದಾಗ ಮಹಿಳೆ ಏನು ಹೇಳಿದಳು?", "a": "“ನನಗೆ ಗಂಡನಿಲ್ಲ”", "r": "4:17"}, {"n": 80, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಎಷ್ಟು ಜನ ಗಂಡಂದಿರು ಇದ್ದರು?", "a": "ಐದು", "r": "4:18"}, {"n": 81, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ ಈಗ ಇರುವವನ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "ಅವನು ಅವಳ ಗಂಡನಲ್ಲ", "r": "4:18"}, {"n": 82, "q": "ಮಹಿಳೆ “ನನಗೆ ಗಂಡನಿಲ್ಲ” ಎಂದಾಗ ಯೇಸು ಏನೆಂದರು?", "a": "“ಗಂಡನಿಲ್ಲವೆಂದು ಸರಿಯಾಗಿ ಹೇಳಿದೆ”", "r": "4:18"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಐದು ಜನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದರು.”", "a": "ಗಂಡಂದಿರು", "r": "4:18"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನಿನ್ನೊಡನೆ ಇರುವವನು ನಿನ್ನ ಗಂಡನಲ್ಲ, ನೀನು ಹೇಳಿದ್ದು ಸರಿಯೇ,’ ಎಂದರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "4:18"}, {"n": 85, "q": "“ನಿನಗೆ ಐದು ಜನ ಗಂಡಂದಿರು ಇದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "4:18"}, {"n": 86, "q": "ಯೇಸು ತನ್ನ ಜೀವನದ ಬಗ್ಗೆ ಹೇಳಿದ ನಂತರ ಮಹಿಳೆ ಯೇಸುವನ್ನು ಏನೆಂದು ಗುರುತಿಸಿದಳು?", "a": "ಪ್ರವಾದಿ", "r": "4:19"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, ‘ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಯಿತು", "r": "4:19"}, {"n": 88, "q": "“ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, ‘ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ ತಿಳಿಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "4:19"}, {"n": 89, "q": "ಯೊವಾನ್ನ 4:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, “ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ ತಿಳಿಯಿತು.", "r": "4:19"}, {"n": 90, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯ ಪೂರ್ವಜರು ದೇವರನ್ನು ಎಲ್ಲಿ ಆರಾಧಿಸುತ್ತಿದ್ದರು?", "a": "ಈ ಬೆಟ್ಟದ ಮೇಲೆ", "r": "4:20"}, {"n": 91, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಆರಾಧಿಸತಕ್ಕ ಕ್ಷೇತ್ರ ಎಲ್ಲಿದೆ?", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲೇ", "r": "4:20"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಪೂರ್ವಜರು ಈ ಬೆಟ್ಟದ ಮೇಲೆ ದೇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆರಾಧಿಸುತ್ತಿದ್ದರು", "r": "4:20"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಆರಾಧಿಸತಕ್ಕ ಕ್ಷೇತ್ರ ಇರುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಯೆಹೂದ್ಯರಾದ ನೀವು ಹೇಳುತ್ತೀರಲ್ಲ’ ಎಂದಳು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲೇ", "r": "4:20"}, {"n": 94, "q": "“ನಮ್ಮ ಪೂರ್ವಜರು ಈ ಬೆಟ್ಟದ ಮೇಲೆ ದೇವರನ್ನು ಆರಾಧಿಸುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "4:20"}, {"n": 95, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ತಾಯಿ”", "r": "4:21"}, {"n": 96, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಮುಂದೆ ಪಿತನ ಆರಾಧನೆಗೆ ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕಾಗಿಲ್ಲ?", "a": "ಈ ಬೆಟ್ಟಕ್ಕೂ ಬರಬೇಕಾಗಿಲ್ಲ; ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಬೇಕಾಗಿಲ್ಲ", "r": "4:21"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ತಾಯಿ, ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳು.”", "a": "ಯೇಸು", "r": "4:21"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ ಆರಾಧನೆಗೆ ಈ ಬೆಟ್ಟಕ್ಕೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಬರಬೇಕಾಗಿಲ್ಲ", "r": "4:21"}, {"n": 99, "q": "“ಆಗ ಯೇಸು, ‘ತಾಯಿ, ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "4:21"}, {"n": 100, "q": "ಯೆಹೂದ್ಯರಿಗೆ ತಾವು ಆರಾಧಿಸುವುದು ಯಾರೆಂದು ತಿಳಿದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಲೋಕೋದ್ಧಾರಕ ಬರುವುದು ಯೆಹೂದ್ಯರಿಂದಲೇ", "r": "4:22"}, {"n": 101, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕ ಯಾರಿಂದ ಬರುವನು?", "a": "ಯೆಹೂದ್ಯರಿಂದಲೇ", "r": "4:22"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ನಿಮಗೇ ತಿಳಿಯದು.”", "a": "ಆರಾಧಿಸುವುದು", "r": "4:22"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ನಮಗೆ ತಿಳಿದಿದೆ.”", "a": "ಆರಾಧಿಸುವುದು", "r": "4:22"}, {"n": 104, "q": "“ನೀವು ಆರಾಧಿಸುವುದು ಯಾರೆಂದು ನಿಮಗೇ ತಿಳಿಯದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "4:22"}, {"n": 105, "q": "ನಿಜವಾದ ಆರಾಧಕರು ಪಿತನನ್ನು ಹೇಗೆ ಆರಾಧಿಸುವರು?", "a": "ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ", "r": "4:23"}, {"n": 106, "q": "ಪಿತ ಯಾವ ರೀತಿಯ ಆರಾಧಕರನ್ನು ಆಶಿಸುತ್ತಾರೆ?", "a": "ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವ ನಿಜವಾದ ಆರಾಧಕರನ್ನು", "r": "4:23"}, {"n": 107, "q": "ನಿಜವಾದ ಆರಾಧಕರು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವ ಕಾಲ ಯಾವಾಗ ಬಂದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಈಗಲೇ ಬಂದಿದೆ", "r": "4:23"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮೇಲೆ ನಿಜವಾದ ಆರಾಧಕರು ಪಿತನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವರು.”", "a": "ಆತ್ಮದಿಂದಲೂ", "r": "4:23"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರೇ ತಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತ ಆಶಿಸುತ್ತಾರೆ.”", "a": "ಆರಾಧಿಸಬೇಕೆಂದು", "r": "4:23"}, {"n": 110, "q": "“ಇನ್ನು ಮೇಲೆ ನಿಜವಾದ ಆರಾಧಕರು ಪಿತನನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "4:23"}, {"n": 111, "q": "ದೇವರ ಸ್ವರೂಪದ ಬಗ್ಗೆ ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ.”", "r": "4:24"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಆರಾಧಿಸತಕ್ಕದ್ದು", "r": "4:24"}, {"n": 113, "q": "“ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸತಕ್ಕದ್ದು,’ ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "4:24"}, {"n": 114, "q": "ಯೊವಾನ್ನ 4:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ. ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸತಕ್ಕದ್ದು,” ಎಂದು ಹೇಳಿದರು.", "r": "4:24"}, {"n": 115, "q": "ಲೋಕೋದ್ಧಾರಕನ ಬಗ್ಗೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನು ಬಲ್ಲವಳಾಗಿದ್ದಳು?", "a": "“ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ. ಆತನು ಬಂದಾಗ ಎಲ್ಲವನ್ನೂ ತಿಳಿಸುವನು”", "r": "4:25"}, {"n": 116, "q": "ಲೋಕೋದ್ಧಾರಕನು ಬಂದಾಗ ಏನು ಮಾಡುವನೆಂದು ಮಹಿಳೆ ಹೇಳಿದಳು?", "a": "ಎಲ್ಲವನ್ನೂ ತಿಳಿಸುವನು", "r": "4:25"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಕೆ ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಅಭಿಷಿಕ್ತನಾದ", "r": "4:25"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಬಂದಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸುವನು,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಎಲ್ಲವನ್ನೂ", "r": "4:25"}, {"n": 119, "q": "“ಆಕೆ ‘ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "4:25"}, {"n": 120, "q": "ಯೇಸು ತಾವೇ ಲೋಕೋದ್ಧಾರಕನೆಂದು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಹೇಗೆ ತಿಳಿಸಿದರು?", "a": "“ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು”", "r": "4:26"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,’ ಎಂದು ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "4:26"}, {"n": 122, "q": "“ಆಗ ಯೇಸು, ‘ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,’ ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "4:26"}, {"n": 123, "q": "ಯೊವಾನ್ನ 4:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,” ಎಂದು ನುಡಿದರು.", "r": "4:26"}, {"n": 124, "q": "ಹಿಂದಿರುಗಿ ಬಂದ ಶಿಷ್ಯರು ಯಾವುದನ್ನು ಕಂಡು ಆಶ್ಚರ್ಯಪಟ್ಟರು?", "a": "ಯೇಸು ಆ ಮಹಿಳೆಯೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವುದನ್ನು", "r": "4:27"}, {"n": 125, "q": "ಆಶ್ಚರ್ಯಪಟ್ಟರೂ ಶಿಷ್ಯರು ಕೇಳದ ಎರಡು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "ಮಹಿಳೆಗೆ “ಏನು ಬೇಕು?”; ಯೇಸುವಿಗೆ “ಆಕೆಯೊಡನೆ ಏಕೆ ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ?”", "r": "4:27"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ ಹಿಂದಿರುಗಿ ಬಂದ ಶಿಷ್ಯರು ಯೇಸು ಆ ಮಹಿಳೆಯೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಆಶ್ಚರ್ಯಪಟ್ಟರು.”", "a": "ಮಾತನಾಡುತ್ತಿರುವುದನ್ನು", "r": "4:27"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ‘ಏನು ಬೇಕು?’ ಎಂದು ಆಕೆಯನ್ನಾಗಲಿ, ‘ಆಕೆಯೊಡನೆ ಏಕೆ ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರು ಕೇಳಲಿಲ್ಲ.”", "a": "ಯೇಸುವನ್ನಾಗಲಿ", "r": "4:27"}, {"n": 128, "q": "“ಅಷ್ಟರಲ್ಲಿ ಹಿಂದಿರುಗಿ ಬಂದ ಶಿಷ್ಯರು ಯೇಸು ಆ ಮಹಿಳೆಯೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವುದನ್ನು ಕಂಡು ಆಶ್ಚರ್ಯಪಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "4:27"}, {"n": 129, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು?", "a": "ತನ್ನ ಕೊಡವನ್ನು", "r": "4:28"}, {"n": 130, "q": "ಕೊಡವನ್ನು ಬಿಟ್ಟು ಮಹಿಳೆ ಎಲ್ಲಿಗೆ ನಡೆದಳು?", "a": "ಊರಿಗೆ", "r": "4:28"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮಹಿಳೆ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.”", "a": "ಕೊಡವನ್ನು", "r": "4:28"}, {"n": 132, "q": "“ಆ ಮಹಿಳೆ ತನ್ನ ಕೊಡವನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "4:28"}, {"n": 133, "q": "ಯೊವಾನ್ನ 4:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಮಹಿಳೆ ತನ್ನ ಕೊಡವನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.", "r": "4:28"}, {"n": 134, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಊರಿನ ಜನರನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಹೇಗೆ ಕರೆದಳು?", "a": "“ನಾನು ಮಾಡಿದ್ದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ತಿಳಿಸಿದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಅಲ್ಲಿ ಇದ್ದಾರೆ. ಬಂದು ನೋಡಿ.”", "r": "4:29"}, {"n": 135, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಊರಿನ ಜನರಿಗೆ ಯೇಸುವಿನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವರೇ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು?”", "r": "4:29"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಾನು ಮಾಡಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡಂತೆ ತಿಳಿಸಿದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಅಲ್ಲಿ ಇದ್ದಾರೆ.”", "a": "ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ", "r": "4:29"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು?’ ಎಂದು ಊರಿನ ಜನರನ್ನು ಕರೆದಳು.”", "a": "ಅಭಿಷಿಕ್ತನಾದ", "r": "4:29"}, {"n": 138, "q": "“‘ನಾನು ಮಾಡಿದ್ದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ತಿಳಿಸಿದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಅಲ್ಲಿ ಇದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "4:29"}, {"n": 139, "q": "ಮಹಿಳೆಯ ಮಾತು ಕೇಳಿದ ಊರಿನ ಜನರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದರು", "r": "4:30"}, {"n": 140, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಏನೆಂದು ಒತ್ತಾಯ ಮಾಡಿದರು?", "a": "“ಗುರುದೇವಾ, ಊಟಮಾಡಿ”", "r": "4:31"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, ‘ಗುರುದೇವಾ, ಊಟಮಾಡಿ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒತ್ತಾಯ ಮಾಡಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "4:31"}, {"n": 142, "q": "“ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, ‘ಗುರುದೇವಾ, ಊಟಮಾಡಿ,’ ಎಂದು ಯೇಸುವನ್ನು ಒತ್ತಾಯ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "4:31"}, {"n": 143, "q": "ಯೊವಾನ್ನ 4:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, “ಗುರುದೇವಾ, ಊಟಮಾಡಿ,” ಎಂದು ಯೇಸುವನ್ನು ಒತ್ತಾಯ ಮಾಡಿದರು.", "r": "4:31"}, {"n": 144, "q": "ಶಿಷ್ಯರು ಊಟಮಾಡಲು ಒತ್ತಾಯಿಸಿದಾಗ ಯೇಸು ಏನೆಂದರು?", "a": "“ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ”", "r": "4:32"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ,’ ಎಂದರು.”", "a": "ಯೇಸು", "r": "4:32"}, {"n": 146, "q": "“ಆಗ ಯೇಸು, ‘ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "4:32"}, {"n": 147, "q": "ಯೊವಾನ್ನ 4:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ,” ಎಂದರು.", "r": "4:32"}, {"n": 148, "q": "ಯೇಸುವಿನ ಆಹಾರದ ಬಗ್ಗೆ ಶಿಷ್ಯರು ಪರಸ್ಪರ ಏನು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "“ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?”", "r": "4:33"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು, ‘ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡಿಕೊಂಡರು", "r": "4:33"}, {"n": 150, "q": "“ಶಿಷ್ಯರು, ‘ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?’ ಎಂದು ಮಾತನಾಡಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "4:33"}, {"n": 151, "q": "ಯೊವಾನ್ನ 4:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು, “ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?” ಎಂದು ಮಾತನಾಡಿಕೊಂಡರು.", "r": "4:33"}, {"n": 152, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರ ಆಹಾರ ಯಾವುದು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದು", "r": "4:34"}, {"n": 153, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರ ತಿಂಡಿತೀರ್ಥ ಯಾವುದು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನು ಕೊಟ್ಟ ಕಾರ್ಯಗಳನ್ನು ಪೂರೈಸುವುದು", "r": "4:34"}, {"n": 154, "q": "ಯೇಸು ತಮ್ಮ ‘ಆಹಾರ’ ಎಂದು ಏನನ್ನು ಕರೆದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದನ್ನು", "r": "4:34"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದೇ ನನಗೆ ಆಹಾರ.”", "a": "ಯೇಸು", "r": "4:34"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಕೊಟ್ಟ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೂರೈಸುವುದೇ ನನಗೆ ತಿಂಡಿತೀರ್ಥ.”", "a": "ಕಾರ್ಯಗಳನ್ನು", "r": "4:34"}, {"n": 157, "q": "“ಯೇಸು ಅವರಿಗೆ, ‘ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದೇ ನನಗೆ ಆಹಾರ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "4:34"}, {"n": 158, "q": "ಸುಗ್ಗಿ ಬರಲು ಇನ್ನು ಎಷ್ಟು ತಿಂಗಳು ಎಂದು ಜನರು ಹೇಳುತ್ತಿದ್ದರು?", "a": "ನಾಲ್ಕು ತಿಂಗಳು", "r": "4:35"}, {"n": 159, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಕಣ್ಣುಹಾಯಿಸಿ ಏನನ್ನು ನೋಡಲು ಹೇಳಿದರು?", "a": "ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿರುವ ಹೊಲಗಳನ್ನು", "r": "4:35"}, {"n": 160, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ತೋರಿಸಿದ ಹೊಲಗಳು ಯಾವ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದವು?", "a": "ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿದ್ದವು", "r": "4:35"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ನಾಲ್ಕು ತಿಂಗಳು ಆದ ಮೇಲೆ ಸುಗ್ಗಿ ಬರುತ್ತದೆ ಎಂದು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುವುದಿಲ್ಲವೆ", "r": "4:35"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ.”", "a": "ಹೊಲಗಳನ್ನು", "r": "4:35"}, {"n": 163, "q": "“ಇನ್ನು ನಾಲ್ಕು ತಿಂಗಳು ಆದ ಮೇಲೆ ಸುಗ್ಗಿ ಬರುತ್ತದೆ ಎಂದು ನೀವು ಹೇಳುವುದಿಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "4:35"}, {"n": 164, "q": "ಕೊಯ್ದವನು ಏನನ್ನು ಪಡೆಯುತ್ತಾನೆ ಮತ್ತು ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಈಗಾಗಲೇ ಕೂಲಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ; ನಿತ್ಯಜೀವಕ್ಕೆ ಫಲವನ್ನು ಕೂಡಿಸಿಡುತ್ತಾನೆ", "r": "4:36"}, {"n": 165, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಒಟ್ಟಿಗೆ ಸಂತೋಷಪಡುವವರು ಯಾರು?", "a": "ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ", "r": "4:36"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ ಒಟ್ಟಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಂತೋಷಪಡುತ್ತಾರೆ", "r": "4:36"}, {"n": 167, "q": "“ಹೀಗೆ ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ ಒಟ್ಟಿಗೆ ಸಂತೋಷಪಡುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "4:36"}, {"n": 168, "q": "ಯೊವಾನ್ನ 4:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೊಯ್ದವನು ಈಗಾಗಲೇ ಕೂಲಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ. ಅವನು ನಿತ್ಯಜೀವಕ್ಕೆ ಫಲವನ್ನು ಕೂಡಿಸಿಡುತ್ತಾನೆ. ಹೀಗೆ ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ ಒಟ್ಟಿಗೆ ಸಂತೋಷಪಡುತ್ತಾರೆ.", "r": "4:36"}, {"n": 169, "q": "ಯೇಸು ನಿಜವಾದುದೆಂದು ಹೇಳಿದ ನಾಣ್ನುಡಿ ಯಾವುದು?", "a": "‘ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ’", "r": "4:37"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಬಿತ್ತುವವನೊಬ್ಬ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.”", "a": "ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ", "r": "4:37"}, {"n": 171, "q": "“‘ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ,’ ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "4:37"}, {"n": 172, "q": "ಯೊವಾನ್ನ 4:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ,’ ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.", "r": "4:37"}, {"n": 173, "q": "ಯೇಸು ಶಿಷ್ಯರನ್ನು ಎಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ಕಳುಹಿಸಿದ್ದರು?", "a": "ಅವರು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ", "r": "4:38"}, {"n": 174, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಬೇರೆಯವರ ದುಡಿಮೆಯ ಫಲ ಯಾರ ಪಾಲಿಗೆ ಬರುವುದು?", "a": "ಶಿಷ್ಯರ ಪಾಲಿಗೆ", "r": "4:38"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ನಾನು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿದ್ದೇನೆ", "r": "4:38"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲ ಬರುವುದು ನಿಮ್ಮ ಪಾಲಿಗೆ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ದುಡಿಮೆಯ", "r": "4:38"}, {"n": 177, "q": "“ನೀವು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ನಾನು ನಿಮ್ಮನ್ನು ಕಳುಹಿಸಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "4:38"}, {"n": 178, "q": "ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ್ದು ಹೇಗೆ?", "a": "‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ", "r": "4:39"}, {"n": 179, "q": "ಸಮಾರಿಯದವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ ಎರಡು ಮಾರ್ಗಗಳು ಯಾವುವು?", "a": "ಮಹಿಳೆಯ ಮಾತಿನಿಂದ (4:39); ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ (4:41)", "r": "4:39; 4:41"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "4:39"}, {"n": 181, "q": "“‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "4:39"}, {"n": 182, "q": "ಯೊವಾನ್ನ 4:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.", "r": "4:39"}, {"n": 183, "q": "ಸಮಾರಿಯದ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡರು?", "a": "ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು", "r": "4:40"}, {"n": 184, "q": "ಯೇಸು ಸಮಾರಿಯದವರ ಊರಿನಲ್ಲಿ ಎಷ್ಟು ದಿನ ಉಳಿದರು?", "a": "ಎರಡು ದಿನ", "r": "4:40"}, {"n": 185, "q": "ಯೇಸು ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು ಬೇಡಿಕೊಂಡವರು ಯಾರು?", "a": "ಸಮಾರಿಯ ಊರಿನ ಜನರು", "r": "4:40"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ ಆ ಊರಿನ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು ಬೇಡಿಕೊಂಡರು.”", "a": "ಯೇಸುವಿನ", "r": "4:40"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಲ್ಲಿ ಎರಡು ದಿನ ಉಳಿದರು.”", "a": "ಯೇಸು", "r": "4:40"}, {"n": 188, "q": "ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿದ್ದು ಹೇಗೆ?", "a": "ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ", "r": "4:41"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನೂ ಅನೇಕರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.”", "a": "ಯೇಸುವಿನ", "r": "4:41"}, {"n": 190, "q": "“ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "4:41"}, {"n": 191, "q": "ಯೊವಾನ್ನ 4:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.", "r": "4:41"}, {"n": 192, "q": "ಸಮಾರಿಯದ ಜನರು ಮಹಿಳೆಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನೀನು ಹೇಳಿದುದರಿಂದ ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ”", "r": "4:42"}, {"n": 193, "q": "ಸಮಾರಿಯದ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಅರಿತುಕೊಂಡರು?", "a": "ಲೋಕೋದ್ಧಾರಕ ಇವರೇ ಎಂದು", "r": "4:42"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, ಆ ಮಹಿಳೆಗೆ, ‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ;”", "a": "ಹೇಳಿದುದರಿಂದ", "r": "4:42"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನಮಗೀಗ ತಿಳಿಯಿತು,’ ಎಂದರು.”", "a": "ಲೋಕೋದ್ಧಾರಕ", "r": "4:42"}, {"n": 196, "q": "“ಆಗ ಅವರು, ಆ ಮಹಿಳೆಗೆ, ‘ನೀನು ಹೇಳಿದುದರಿಂದ ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "4:42"}, {"n": 197, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 4:43ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಅಧಿಕಾರಿಯ ಮಗನಿಗೆ ಆರೋಗ್ಯದಾನ", "r": "4:43"}, {"n": 198, "q": "ಸಮಾರಿಯದಲ್ಲಿ ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೊರಟರು?", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:43"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "4:43"}, {"n": 200, "q": "“ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "4:43"}, {"n": 201, "q": "ಯೊವಾನ್ನ 4:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.", "r": "4:43"}, {"n": 202, "q": "ಪ್ರವಾದಿಯ ಬಗ್ಗೆ ಯೇಸು ಸಾರಿದ್ದ ಮಾತು ಯಾವುದು?", "a": "ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ", "r": "4:44"}, {"n": 203, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪ್ರವಾದಿಗೆ ಎಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ?", "a": "ಸ್ವಗ್ರಾಮದಲ್ಲಿ", "r": "4:44"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರವಾದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.”", "a": "ಸ್ವಗ್ರಾಮದಲ್ಲಿ", "r": "4:44"}, {"n": 205, "q": "“ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "4:44"}, {"n": 206, "q": "ಯೊವಾನ್ನ 4:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.", "r": "4:44"}, {"n": 207, "q": "ಗಲಿಲೇಯದ ಜನರು ಯೇಸುವನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡದ್ದು ಏಕೆ?", "a": "ಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿದ್ದಾಗ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೇಸು ಮಾಡಿದ್ದನ್ನೆಲ್ಲಾ ನೋಡಿದ್ದರಿಂದ", "r": "4:45"}, {"n": 208, "q": "ಗಲಿಲೇಯದ ಜನರು ಯೇಸುವನ್ನು ಹೇಗೆ ಬರಮಾಡಿಕೊಂಡರು?", "a": "ಆದರದಿಂದ", "r": "4:45"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಲುಪಿದೊಡನೆ ಜನರು ಅವರನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡರು.”", "a": "ಗಲಿಲೇಯವನ್ನು", "r": "4:45"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಹಬ್ಬಕ್ಕಾಗಿ ಆ ಜನರು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿದ್ದಾಗ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ್ದನ್ನೆಲ್ಲಾ ನೋಡಿದ್ದರು.”", "a": "ಯೇಸು", "r": "4:45"}, {"n": 211, "q": "“ಗಲಿಲೇಯವನ್ನು ತಲುಪಿದೊಡನೆ ಜನರು ಅವರನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "4:45"}, {"n": 212, "q": "ಯೇಸು ಗಲಿಲೇಯದ ಯಾವ ಊರಿಗೆ ಮರಳಿ ಬಂದರು?", "a": "ಕಾನಾ ಊರಿಗೆ", "r": "4:46"}, {"n": 213, "q": "ಕಾನಾ ಊರಿನಲ್ಲಿ ಯೇಸು ಹಿಂದೆ ಏನು ಮಾಡಿದ್ದರು?", "a": "ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾಡಿದ್ದರು", "r": "4:46"}, {"n": 214, "q": "ಕಫೆರ್ನವುಮಿನಲ್ಲಿ ಯಾರ ಮಗನಿಗೆ ಕಾಯಿಲೆಯಾಗಿತ್ತು?", "a": "ರಾಜಸೇವೆಯಲ್ಲಿದ್ದ ಒಬ್ಬ ಅಧಿಕಾರಿಯ ಮಗನಿಗೆ", "r": "4:46"}, {"n": 215, "q": "ಅಧಿಕಾರಿಯ ಮಗನು ಯಾವ ಊರಿನಲ್ಲಿ ಕಾಯಿಲೆಬಿದ್ದಿದ್ದನು?", "a": "ಕಫೆರ್ನವುಮಿನಲ್ಲಿ", "r": "4:46"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾನಾ ಊರಿಗೆ ಮರಳಿ ಬಂದರು.”", "a": "ಗಲಿಲೇಯದ", "r": "4:46"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹಿಂದೆ ನೀರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ್ದು ಅಲ್ಲಿಯೇ.”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ", "r": "4:46"}, {"n": 218, "q": "ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡನು?", "a": "ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು", "r": "4:47"}, {"n": 219, "q": "ಅಧಿಕಾರಿಯ ಪ್ರಕಾರ ಅವನ ಮಗನು ಎಲ್ಲಿದ್ದನು?", "a": "ಸಾವಿನ ದವಡೆಯಲ್ಲಿ", "r": "4:47"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಜುದೇಯದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:47"}, {"n": 221, "q": "“ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "4:47"}, {"n": 222, "q": "ಯೊವಾನ್ನ 4:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.", "r": "4:47"}, {"n": 223, "q": "ಅಧಿಕಾರಿಯ ಬೇಡಿಕೆಗೆ ಯೇಸು ಮೊದಲು ಏನು ಹೇಳಿದರು?", "a": "“ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ”", "r": "4:48"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ‘ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ,’ ಎಂದರು.”", "a": "ಯೇಸು", "r": "4:48"}, {"n": 225, "q": "“ಯೇಸು ಅವನಿಗೆ ‘ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "4:48"}, {"n": 226, "q": "ಯೊವಾನ್ನ 4:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನಿಗೆ “ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ,” ಎಂದರು.", "r": "4:48"}, {"n": 227, "q": "ಆದರೂ ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಅಂಗಲಾಚಿದನು?", "a": "“ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ”", "r": "4:49"}, {"n": 228, "q": "ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಸ್ವಾಮೀ”", "r": "4:49"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಆ ಅಧಿಕಾರಿ, ‘ನನ್ನ ಮಗನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ,’ ಎಂದು ಅಂಗಲಾಚಿದನು.”", "a": "ಪ್ರಾಣಬಿಡುವ", "r": "4:49"}, {"n": 230, "q": "“ಆದರೂ ಆ ಅಧಿಕಾರಿ, ‘ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ,’ ಎಂದು ಅಂಗಲಾಚಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "4:49"}, {"n": 231, "q": "ಯೊವಾನ್ನ 4:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ಆ ಅಧಿಕಾರಿ, “ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ,” ಎಂದು ಅಂಗಲಾಚಿದನು.", "r": "4:49"}, {"n": 232, "q": "ಅಧಿಕಾರಿಗೆ ಯೇಸು ಕೊಟ್ಟ ಆಶ್ವಾಸನೆ ಏನು?", "a": "“ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ”", "r": "4:50"}, {"n": 233, "q": "“ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ” ಎಂದು ಯೇಸು ಹೇಳಿದಾಗ ಅಧಿಕಾರಿ ಏನು ಮಾಡಿದನು?", "a": "ಯೇಸುವಿನ ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು", "r": "4:50"}, {"n": 234, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 4:50 ಮತ್ತು 4:53ರಲ್ಲಿ ಅಧಿಕಾರಿಯ ವಿಶ್ವಾಸ ಹೇಗೆ ಬೆಳೆಯಿತು?", "a": "ಮೊದಲು ಯೇಸುವಿನ ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು (4:50); ಆಮೇಲೆ ಅವನೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದರು (4:53)", "r": "4:50; 4:53"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:50"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಅಧಿಕಾರಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು.”", "a": "ಯೇಸುವಿನ", "r": "4:50"}, {"n": 237, "q": "ಅರ್ಧದಾರಿಯಲ್ಲಿ ಆಳುಗಳು ಅಧಿಕಾರಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದರು?", "a": "“ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ”", "r": "4:51"}, {"n": 238, "q": "ಆಳುಗಳು ಅಧಿಕಾರಿಗೆ ಎಲ್ಲಿ ಎದುರಾದರು?", "a": "ಅರ್ಧದಾರಿಯಲ್ಲಿ", "r": "4:51"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, ‘ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ,’ ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಅರ್ಧದಾರಿಯಲ್ಲಿ", "r": "4:51"}, {"n": 240, "q": "“ಅವನು ಅರ್ಧದಾರಿಯಲ್ಲಿ ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, ‘ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ,’ ಎಂದು ತಿಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "4:51"}, {"n": 241, "q": "ಯೊವಾನ್ನ 4:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು ಅರ್ಧದಾರಿಯಲ್ಲಿ ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, “ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ,” ಎಂದು ತಿಳಿಸಿದರು.", "r": "4:51"}, {"n": 242, "q": "ಆಳುಗಳ ಪ್ರಕಾರ ಅಧಿಕಾರಿಯ ಮಗನ ಜ್ವರ ಯಾವಾಗ ಬಿಟ್ಟಿತು?", "a": "ನಿನ್ನೆ ಮಧ್ಯಾಹ್ನ ಒಂದು ಗಂಟೆಗೆ", "r": "4:52"}, {"n": 243, "q": "ಅಧಿಕಾರಿ ಆಳುಗಳನ್ನು ಏನೆಂದು ವಿಚಾರಿಸಿದನು?", "a": "ಎಷ್ಟು ಹೊತ್ತಿಗೆ ತನ್ನ ಮಗ ಚೇತರಿಸಿಕೊಂಡನೆಂದು", "r": "4:52"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ಗಂಟೆಗೆ ಅವನ ಜ್ವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಆಳುಗಳು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಬಿಟ್ಟಿತು", "r": "4:52"}, {"n": 245, "q": "“ಒಂದು ಗಂಟೆಗೆ ಅವನ ಜ್ವರ ಬಿಟ್ಟಿತು,’ ಎಂದು ಆಳುಗಳು ಉತ್ತರಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 52", "r": "4:52"}, {"n": 246, "q": "ಯೊವಾನ್ನ 4:52 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎಷ್ಟು ಹೊತ್ತಿಗೆ ತನ್ನ ಮಗ ಚೇತರಿಸಿಕೊಂಡನೆಂದು ಆ ಅಧಿಕಾರಿ ವಿಚಾರಿಸಿದಾಗ, “ನಿನ್ನೆ ಮಧ್ಯಾಹ್ನ: ಒಂದು ಗಂಟೆಗೆ ಅವನ ಜ್ವರ ಬಿಟ್ಟಿತು,” ಎಂದು ಆಳುಗಳು ಉತ್ತರಕೊಟ್ಟರು.", "r": "4:52"}, {"n": 247, "q": "ಅಧಿಕಾರಿಗೆ ಯಾವುದು ತಿಳಿಯಿತು?", "a": "‘ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ’ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು", "r": "4:53"}, {"n": 248, "q": "ಅಧಿಕಾರಿಯ ಮಗನು ಗುಣಹೊಂದಿದ ನಂತರ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದವರು ಯಾರು?", "a": "ಅಧಿಕಾರಿಯೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ", "r": "4:53"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು ತಂದೆಗೆ ತಿಳಿಯಿತು.”", "a": "ಯೇಸು", "r": "4:53"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "4:53"}, {"n": 251, "q": "“‘ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ’ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು ತಂದೆಗೆ ತಿಳಿಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 53", "r": "4:53"}, {"n": 252, "q": "ಅಧಿಕಾರಿಯ ಮಗನನ್ನು ಗುಣಪಡಿಸಿದ್ದು ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು ಮಾಡಿದ ಎಷ್ಟನೆಯ ಸೂಚಕಕಾರ್ಯ?", "a": "ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ", "r": "4:54"}, {"n": 253, "q": "ಯೇಸು ಗಲಿಲೇಯದ ಕಾನಾ ಊರಿನಲ್ಲಿ ಮಾಡಿದ ಎರಡು ಸೂಚಕಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾಡಿದ್ದು (2:11); ಅಧಿಕಾರಿಯ ಮಗನನ್ನು ಗುಣಪಡಿಸಿದ್ದು (4:46–54)", "r": "2:11; 4:54"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಜುದೇಯದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:54"}, {"n": 255, "q": "“ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 54", "r": "4:54"}, {"n": 256, "q": "ಯೊವಾನ್ನ 4:54 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.", "r": "4:54"}]}]}</script>

    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
