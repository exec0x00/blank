{"n": 12, "q": "ಯೇಸುವಿನ ಸೋದರರು ಅವರಿಗೆ ಎಲ್ಲಿಗೆ ಹೋಗಲು ಹೇಳಿದರು?", "a": "“ನೀನು ಇಲ್ಲಿಂದ ಜುದೇಯಕ್ಕೆ ಹೋಗು.”", "r": "7:3"}, {"n": 13, "q": "ಯೇಸು ಜುದೇಯಕ್ಕೆ ಹೋಗಬೇಕೆಂದು ಸೋದರರು ಏಕೆ ಹೇಳಿದರು?", "a": "ಅಲ್ಲಿ ಯೇಸು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಅವರ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ ಎಂದು", "r": "7:3"}, {"n": 14, "q": "ಹಬ್ಬಕ್ಕೆ ಹೋಗುವ ಬಗ್ಗೆ ಸೋದರರ ಸಲಹೆ ಮತ್ತು ಯೇಸು ಮಾಡಿದ್ದು ಏನು?", "a": "ಸೋದರರು ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಜುದೇಯಕ್ಕೆ ಹೋಗು ಎಂದರು; ಯೇಸು ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ ಹೋದರು", "r": "7:3; 7:10"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಇಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗು.”", "a": "ಜುದೇಯಕ್ಕೆ", "r": "7:3"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ.”", "a": "ಮಾಡುವುದನ್ನೆಲ್ಲಾ", "r": "7:3"}, {"n": 17, "q": "ಯೊವಾನ್ನ 7:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀನು ಇಲ್ಲಿಂದ ಜುದೇಯಕ್ಕೆ ಹೋಗು. ಅಲ್ಲಿ ನೀನು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ನಿನ್ನ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ.", "r": "7:3"}, {"n": 18, "q": "ಸೋದರರ ಪ್ರಕಾರ ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವವನು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ", "r": "7:4"}, {"n": 19, "q": "ಯೇಸು ತಮ್ಮ ಕಾರ್ಯಗಳನ್ನು ಹೇಗೆ ಮಾಡಬೇಕೆಂದು ಸೋದರರು ಹೇಳಿದರು?", "a": "ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ", "r": "7:4"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು, ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.”", "a": "ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ", "r": "7:4"}, {"n": 21, "q": "“ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು, ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "7:4"}, {"n": 22, "q": "ಯೊವಾನ್ನ 7:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು,” ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.", "r": "7:4"}, {"n": 23, "q": "ಯೇಸುವಿನ ಸೋದರರ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 7:5 ಏನು ಹೇಳುತ್ತದೆ?", "a": "ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ", "r": "7:5"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.”", "a": "ಸೋದರರಿಗೆ", "r": "7:5"}, {"n": 25, "q": "“ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "7:5"}, {"n": 26, "q": "ಯೊವಾನ್ನ 7:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.", "r": "7:5"}, {"n": 27, "q": "ಸಮಯದ ಬಗ್ಗೆ ಯೇಸು ತಮಗೂ ಸೋದರರಿಗೂ ಇರುವ ವ್ಯತ್ಯಾಸವನ್ನು ಹೇಗೆ ಹೇಳಿದರು?", "a": "ತಮಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ; ಸೋದರರಿಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ", "r": "7:6"}, {"n": 28, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ ಸಮಯ ಅಥವಾ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ ಎಂದು ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "7:6, 7:8, 7:30", "r": "7:6; 7:8; 7:30"}, {"n": 29, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸೋದರರಿಗೆ ಸಮಯ ಹೇಗಿದೆ?", "a": "ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ", "r": "7:6"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.”", "a": "ಯೇಸು", "r": "7:6"}, {"n": 31, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "7:6"}, {"n": 32, "q": "ಯೊವಾನ್ನ 7:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.", "r": "7:6"}, {"n": 33, "q": "ಲೋಕಕ್ಕೆ ಯೇಸುವಿನ ಮೇಲೆ ಏಕೆ ಹಗೆ ಇದೆ?", "a": "ಅದರ ವರ್ತನೆ ಕೆಟ್ಟದೆಂದು ಯೇಸು ಯಥಾರ್ಥವಾಗಿ ಹೇಳುತ್ತಿದ್ದುದರಿಂದ", "r": "7:7"}, {"n": 34, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಲೋಕಕ್ಕೆ ಯಾರ ಮೇಲೆ ಹಗೆಯಿಲ್ಲ?", "a": "ಸೋದರರ ಮೇಲೆ", "r": "7:7"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕಕ್ಕೆ ನಿಮ್ಮ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹಗೆಯಿಲ್ಲ", "r": "7:7"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಮೇಲೆ.”", "a": "ಹಗೆಯಿರುವುದು", "r": "7:7"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅದರ ವರ್ತನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಯಥಾರ್ಥವಾಗಿ ಹೇಳುತ್ತಾ ಇದ್ದೇನೆ.”", "a": "ಕೆಟ್ಟದೆಂದು", "r": "7:7"}, {"n": 38, "q": "ಹಬ್ಬಕ್ಕೆ ಹೋಗುವ ವಿಷಯದಲ್ಲಿ ಯೇಸು ಸೋದರರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ”", "r": "7:8"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,”", "a": "ಹೋಗುವುದಿಲ್ಲ", "r": "7:8"}, {"n": 40, "q": "“ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "7:8"}, {"n": 41, "q": "ಯೊವಾನ್ನ 7:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ,”", "r": "7:8"}, {"n": 42, "q": "ಸೋದರರಿಗೆ ಉತ್ತರ ಕೊಟ್ಟ ನಂತರ ಯೇಸು ಎಲ್ಲಿ ಉಳಿದುಕೊಂಡರು?", "a": "ಗಲಿಲೇಯದಲ್ಲೇ", "r": "7:9"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿದುಕೊಂಡರು.”", "a": "ಗಲಿಲೇಯದಲ್ಲೇ", "r": "7:9"}, {"n": 44, "q": "“ಎಂದು ಹೇಳಿ ಯೇಸು ಗಲಿಲೇಯದಲ್ಲೇ ಉಳಿದುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "7:9"}, {"n": 45, "q": "ಯೊವಾನ್ನ 7:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎಂದು ಹೇಳಿ ಯೇಸು ಗಲಿಲೇಯದಲ್ಲೇ ಉಳಿದುಕೊಂಡರು.", "r": "7:9"}, {"n": 46, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:10ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪರ್ಣಕುಟೀರ ಹಬ್ಬದಲ್ಲಿ ಯೇಸು", "r": "7:10"}, {"n": 47, "q": "ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದ ನಂತರ ಯೇಸು ಹಬ್ಬಕ್ಕೆ ಹೇಗೆ ಹೋದರು?", "a": "ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ", "r": "7:10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "7:10"}, {"n": 49, "q": "ಯೊವಾನ್ನ 7:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿಯ ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದರು. ಯೇಸುವೂ ಅಲ್ಲಿಗೆ ಹೋದರು. ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ.", "r": "7:10"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿಯ ಸೋದರರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಹಬ್ಬಕ್ಕೆ", "r": "7:10"}, {"n": 51, "q": "ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಯೇಸು ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು", "r": "7:11"}, {"n": 52, "q": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಗುಂಪು ಹೇಗೆ ಮಾತನಾಡುತ್ತಿತ್ತು?", "a": "ಗುಜುಗುಜು", "r": "7:11"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು.”", "a": "ಯೇಸು", "r": "7:11"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರಗುಂಪು ಗುಜುಗುಜು ಮಾತನಾಡುತ್ತಿತ್ತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:11"}, {"n": 55, "q": "“ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಯೇಸು ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "7:11"}, {"n": 56, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಜನರಲ್ಲಿ ಇದ್ದ ಎರಡು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’; ‘ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ’", "r": "7:12"}, {"n": 57, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಕೆಲವರು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’", "r": "7:12"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.”", "a": "ಎಳೆಯುತ್ತಿದ್ದಾನೆ", "r": "7:12"}, {"n": 59, "q": "“ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ, ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "7:12"}, {"n": 60, "q": "ಯೊವಾನ್ನ 7:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ‘ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ,’ ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.", "r": "7:12"}, {"n": 61, "q": "ಜನರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಬಹಿರಂಗವಾಗಿ ಏಕೆ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ", "r": "7:13"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ", "r": "7:13"}, {"n": 63, "q": "“ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "7:13"}, {"n": 64, "q": "ಯೊವಾನ್ನ 7:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ.", "r": "7:13"}, {"n": 65, "q": "ಯೇಸು ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದ್ದು ಯಾವಾಗ?", "a": "ಹಬ್ಬವು ಅರ್ಧಕ್ಕೆ ಅರ್ಧ ಮುಗಿದಾಗ", "r": "7:14"}, {"n": 66, "q": "ಹಬ್ಬದ ಮಧ್ಯದಲ್ಲಿ ಯೇಸು ಎಲ್ಲಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು?", "a": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "7:14"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರ್ಧ ಮುಗಿಯಿತು.”", "a": "ಅರ್ಧಕ್ಕೆ", "r": "7:14"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "7:14"}, {"n": 69, "q": "ಯೊವಾನ್ನ 7:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಬ್ಬವು ಅರ್ಧಕ್ಕೆ ಅರ್ಧ ಮುಗಿಯಿತು. ಆಗ ಯೇಸು ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು.", "r": "7:14"}, {"n": 70, "q": "ಯೇಸುವಿನ ಬೋಧನೆ ಕೇಳಿ ಬೆರಗಾದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ಕಲಿಯದಿದ್ದರೂ ಈ ಮನುಷ್ಯನಿಗೆ ಇಷ್ಟೆಲ್ಲಾ ಪಾಂಡಿತ್ಯ ಎಲ್ಲಿಂದ ಬಂದಿತು?”", "r": "7:15"}, {"n": 71, "q": "ಯೇಸುವಿನ ಪಾಂಡಿತ್ಯ ಕಂಡು ಬೆರಗಾದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "7:15"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆರಗಾದರು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "7:15"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಮನುಷ್ಯನಿಗೆ ಇಷ್ಟೆಲ್ಲಾ ಪಾಂಡಿತ್ಯ ಎಲ್ಲಿಂದ ಬಂದಿತು?”", "a": "ಕಲಿಯದಿದ್ದರೂ", "r": "7:15"}, {"n": 74, "q": "“ಅದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಬೆರಗಾದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "7:15"}, {"n": 75, "q": "ತಮ್ಮ ಬೋಧನೆಯ ಮೂಲದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ; ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನದು.”", "r": "7:16"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ;”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:16"}, {"n": 77, "q": "“ಆಗ ಯೇಸುಸ್ವಾಮಿ, ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "7:16"}, {"n": 78, "q": "ಯೊವಾನ್ನ 7:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸುಸ್ವಾಮಿ, “ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ; ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನದು.", "r": "7:16"}, {"n": 79, "q": "ಯೇಸುವಿನ ಬೋಧನೆ ದೇವರಿಂದ ಬಂದುದೋ ಎಂಬುದು ಯಾರಿಗೆ ತಿಳಿಯುತ್ತದೆ?", "a": "ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ", "r": "7:17"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಯುತ್ತದೆ", "r": "7:17"}, {"n": 81, "q": "“ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು ತಿಳಿಯುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "7:17"}, {"n": 82, "q": "ಯೊವಾನ್ನ 7:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು ತಿಳಿಯುತ್ತದೆ.", "r": "7:17"}, {"n": 83, "q": "ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ಮತ್ತು ಕಳುಹಿಸಿದಾತನ ಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುವವನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುತ್ತಾನೆ; ಕಳುಹಿಸಿದಾತನ ಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುವವನು ಪ್ರಾಮಾಣಿಕನು, ಅವನಲ್ಲಿ ಕಪಟವಿರದು", "r": "7:18"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಯಸುತ್ತಾನೆ.”", "a": "ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು", "r": "7:18"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಯಸುವವನು ಪ್ರಾಮಾಣಿಕನು.”", "a": "ಪ್ರತಿಷ್ಠೆಯನ್ನು", "r": "7:18"}, {"n": 86, "q": "“ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ತನ್ನ ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "7:18"}, {"n": 87, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕೊಟ್ಟವನು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೋಶೆ", "r": "7:19"}, {"n": 88, "q": "ಯೇಸು ಯೆಹೂದ್ಯರಿಗೆ ತಮ್ಮನ್ನು ಕೊಲ್ಲುವ ಸಂಚಿನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನನ್ನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನೀವು ಹವಣಿಸುವುದೇಕೆ?”", "r": "7:19"}, {"n": 89, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಮೋಶೆ ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಯಾರೂ ಇಲ್ಲ", "r": "7:19"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರ ನಿಮಗಿದೆಯಲ್ಲವೇ, ಆದರೂ ಅದಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರಾರೂ ನಿಮ್ಮಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಮೋಶೆ", "r": "7:19"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಹವಣಿಸುವುದೇಕೆ?”", "a": "ಕೊಲ್ಲಬೇಕೆಂದು", "r": "7:19"}, {"n": 92, "q": "“ಮೋಶೆ ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರ ನಿಮಗಿದೆಯಲ್ಲವೇ, ಆದರೂ ಅದಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರಾರೂ ನಿಮ್ಮಲ್ಲಿ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "7:19"}, {"n": 93, "q": "“ನನ್ನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನೀವು ಹವಣಿಸುವುದೇಕೆ?” ಎಂದಾಗ ಜನರು ಏನೆಂದರು?", "a": "“ನಿನಗೆ ದೆವ್ವ ಹಿಡಿದಿರಬೇಕು; ನಿನ್ನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿರುವವರಾದರು ಯಾರು?”", "r": "7:20"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ನಿನಗೆ ದೆವ್ವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹಿಡಿದಿರಬೇಕು", "r": "7:20"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರು?”", "a": "ಹವಣಿಸುತ್ತಿರುವವರಾದರು", "r": "7:20"}, {"n": 96, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ನಿನಗೆ ದೆವ್ವ ಹಿಡಿದಿರಬೇಕು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "7:20"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸಬ್ಬತ್ ದಿನ ಅವರು ಮಾಡಿದ್ದು ಏನು?", "a": "ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ", "r": "7:21"}, {"n": 98, "q": "ಸಬ್ಬತ್ ದಿನದ ಸೂಚಕಕಾರ್ಯಕ್ಕೆ ಜನರ ಪ್ರತಿಕ್ರಿಯೆ ಹೇಗಿತ್ತು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಎಲ್ಲರೂ ಕಂಗಾಲಾಗಿದ್ದರು", "r": "7:21"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವರಿಗೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ.”", "a": "ಸಬ್ಬತ್", "r": "7:21"}, {"n": 100, "q": "“ಯೇಸು ಅವರಿಗೆ, ಸಬ್ಬತ್ ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "7:21"}, {"n": 101, "q": "ಯೊವಾನ್ನ 7:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವರಿಗೆ, “ಸಬ್ಬತ್ ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ. ಅಷ್ಟಕ್ಕೇ ನೀವೆಲ್ಲರೂ ಕಂಗಾಲಾಗಿದ್ದೀರಿ.", "r": "7:21"}, {"n": 102, "q": "ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೋಶೆ", "r": "7:22"}, {"n": 103, "q": "ವಾಸ್ತವವಾಗಿ ಸುನ್ನತಿ ಯಾವಾಗಿನಿಂದ ರೂಢಿಯಲ್ಲಿತ್ತು?", "a": "ಪೂರ್ವಜರ ಕಾಲದಿಂದಲೂ (ಮೋಶೆಯ ಕಾಲದಿಂದಲ್ಲ)", "r": "7:22"}, {"n": 104, "q": "ಯೆಹೂದ್ಯರು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿಯೂ ಏನು ಮಾಡುವುದುಂಟು?", "a": "ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು", "r": "7:22"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೋಶೆ", "r": "7:22"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನದಲ್ಲಿಯೂ ನೀವು ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು.”", "a": "ಸಬ್ಬತ್", "r": "7:22"}, {"n": 107, "q": "ಯೊವಾನ್ನ 7:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು ಮೋಶೆ. (ವಾಸ್ತವವಾಗಿ ಅದು ಮೋಶೆಯ ಕಾಲದಿಂದಲ್ಲ, ಪೂರ್ವಜರ ಕಾಲದಿಂದಲೂ ರೂಢಿಯಲ್ಲಿತ್ತು). ಸಬ್ಬತ್ ದಿನದಲ್ಲಿಯೂ ನೀವು ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು.", "r": "7:22"}, {"n": 108, "q": "ಸಬ್ಬತ್ ದಿನದ ಸುನ್ನತಿ ಮತ್ತು ತಮ್ಮ ಗುಣಪಡಿಸುವಿಕೆಯನ್ನು ಯೇಸು ಹೇಗೆ ಹೋಲಿಸಿದರು?", "a": "ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ, ಅದೇ ದಿನದಲ್ಲಿ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ಸಿಟ್ಟಾಗಬೇಕೆ?", "r": "7:23"}, {"n": 109, "q": "ಯೇಸು ಸಬ್ಬತ್‌ದಿನದಲ್ಲಿ ಒಬ್ಬ ಮನುಷ್ಯನಿಗೆ ಏನು ಮಾಡಿದ್ದರು?", "a": "ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದರು", "r": "7:23"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?”", "a": "ಸಬ್ಬತ್ದಿನದಲ್ಲಿ", "r": "7:23"}, {"n": 111, "q": "“ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "7:23"}, {"n": 112, "q": "ಯೊವಾನ್ನ 7:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?", "r": "7:23"}, {"n": 113, "q": "ತೀರ್ಪು ಕೊಡುವ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ಬರೀ ತೋರಿಕೆಯಿಂದ ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು; ನಿಮ್ಮ ತೀರ್ಪು ನ್ಯಾಯಬದ್ಧವಾಗಿರಬೇಕು”", "r": "7:24"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬರೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು;”", "a": "ತೋರಿಕೆಯಿಂದ", "r": "7:24"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ತೀರ್ಪು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದರು.”", "a": "ನ್ಯಾಯಬದ್ಧವಾಗಿರಬೇಕು", "r": "7:24"}, {"n": 116, "q": "“ಬರೀ ತೋರಿಕೆಯಿಂದ ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "7:24"}, {"n": 117, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:25ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಲೋಕೋದ್ಧಾರಕನೇ?", "r": "7:25"}, {"n": 118, "q": "“ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?” ಎಂದವರು ಯಾರು?", "a": "ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ", "r": "7:25"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?”", "a": "ಕೊಲ್ಲಬೇಕೆಂದು", "r": "7:25"}, {"n": 120, "q": "“ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "7:25"}, {"n": 121, "q": "ಯೊವಾನ್ನ 7:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, “ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?", "r": "7:25"}, {"n": 122, "q": "ಜೆರುಸಲೇಮಿನವರಿಗೆ ಆಶ್ಚರ್ಯವಾದ ಸಂಗತಿ ಏನು?", "a": "ಯೇಸು ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿದ್ದರೂ ಅವರ ವಿರುದ್ಧ ಯಾರೂ ಮಾತೆತ್ತುತ್ತಿರಲಿಲ್ಲ", "r": "7:26"}, {"n": 123, "q": "ಮುಖಂಡರ ಬಗ್ಗೆ ಜೆರುಸಲೇಮಿನವರು ಕೇಳಿಕೊಂಡ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಈತನೇ ಲೋಕೋದ್ಧಾರಕನೆಂದು ಆ ಮುಖಂಡರಿಗೆ ಹೊಳೆದಿರಬಹುದೆ?”", "r": "7:26"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಗೋ, ಈತ ಬಹಿರಂಗವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತಿದ್ದಾನೆ", "r": "7:26"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಈತನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಅವರಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಮಾತೆತ್ತುತ್ತಿಲ್ಲ", "r": "7:26"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮುಖಂಡರಿಗೆ ಹೊಳೆದಿರಬಹುದೆ?”", "a": "ಲೋಕೋದ್ಧಾರಕನೆಂದು", "r": "7:26"}, {"n": 127, "q": "ಜೆರುಸಲೇಮಿನವರ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕನು ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ ಯಾರಿಗೂ ಏನು ತಿಳಿದಿರುವುದಿಲ್ಲ?", "a": "ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು", "r": "7:27"}, {"n": 128, "q": "ಜೆರುಸಲೇಮಿನವರ ಪ್ರಕಾರ ಯೇಸುವಿನ ಬಗ್ಗೆ ಅವರೆಲ್ಲರಿಗೂ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ಯೇಸು ಎಲ್ಲಿಂದ ಬಂದವನೆಂದು", "r": "7:27"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕೋದ್ಧಾರಕನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು ಯಾರಿಗೂ ತಿಳಿದಿರುವುದಿಲ್ಲ.”", "a": "ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ", "r": "7:27"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಈತನು ಎಲ್ಲಿಂದ ಬಂದವನೆಂದು ನಮ್ಮೆಲ್ಲರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ತಿಳಿದಿದೆಯಲ್ಲಾ", "r": "7:27"}, {"n": 131, "q": "“ಲೋಕೋದ್ಧಾರಕನು ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು ಯಾರಿಗೂ ತಿಳಿದಿರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "7:27"}, {"n": 132, "q": "ಯೇಸು ಗಟ್ಟಿಯಾಗಿ ಮಾತನಾಡಿದಾಗ ಎಲ್ಲಿ ಬೋಧಿಸುತ್ತಿದ್ದರು?", "a": "ದೇವಾಲಯದಲ್ಲಿ", "r": "7:28"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಗಿದ್ದಾನೆ?", "a": "ಸತ್ಯಸ್ವರೂಪಿ", "r": "7:28"}, {"n": 134, "q": "ಯೇಸು ತಮ್ಮ ಆಗಮನದ ಬಗ್ಗೆ ಏನೆಂದು ಗಟ್ಟಿಯಾಗಿ ಹೇಳಿದರು?", "a": "“ನಾನು ನನ್ನಷ್ಟಕ್ಕೇ ಬಂದವನಲ್ಲ”", "r": "7:28"}, {"n": 135, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಯಾರನ್ನು ಅರಿತಿಲ್ಲ?", "a": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು", "r": "7:28"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ದೇವಾಲಯದಲ್ಲಿ ಬೋಧಿಸುತ್ತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ಗಟ್ಟಿಯಾಗಿ ಇಂತೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:28"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಯಾರೆಂದು, ಎಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬಲ್ಲಿರೋ?”", "a": "ಬಂದವನೆಂದು", "r": "7:28"}, {"n": 138, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು ಅರಿತಿರುವುದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಅವರು ಬಂದುದು ಆತನಿಂದಲೇ; ಆತನೇ ಅವರನ್ನು ಕಳುಹಿಸಿದ್ದು", "r": "7:29"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು ಬಂದುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆತನಿಂದಲೇ", "r": "7:29"}, {"n": 140, "q": "ಯೊವಾನ್ನ 7:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ಆತನನ್ನು ಅರಿತಿದ್ದೇನೆ. ಏಕೆಂದರೆ, ನಾನು ಬಂದುದು ಆತನಿಂದಲೇ. ಆತನೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿದ್ದು,”", "r": "7:29"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನಿಂದಲೇ.”", "a": "ಬಂದುದು", "r": "7:29"}, {"n": 142, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರೂ ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ, ಏಕೆ?", "a": "ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದೆ ಇದ್ದ ಕಾರಣ", "r": "7:30"}, {"n": 143, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಹೇಳಲಾಗಿದೆ?", "a": "ಎರಡು ಬಾರಿ (7:30; 7:44)", "r": "7:30; 7:44"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಡಿದು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:30"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದೆ ಇದ್ದ ಕಾರಣ ಯಾರೂ ಅವರ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಹಾಕಲಿಲ್ಲ", "r": "7:30"}, {"n": 146, "q": "“ಇದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಹಿಡಿದು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "7:30"}, {"n": 147, "q": "ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ ಹಲವರು ಏನೆಂದುಕೊಂಡರು?", "a": "“ಲೋಕೋದ್ಧಾರಕ ಬಂದಾಗ ಈತನು ಮಾಡಿದ್ದಕ್ಕೂ ಮಿಗಿಲಾದ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡಿಯಾನೆ?”", "r": "7:31"}, {"n": 148, "q": "ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದವರು ಯಾರು?", "a": "ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರು", "r": "7:31"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "7:31"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕೋದ್ಧಾರಕ ಬಂದಾಗ ಈತನು ಮಾಡಿದ್ದಕ್ಕೂ ಮಿಗಿಲಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಯಾನೆ?”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "7:31"}, {"n": 151, "q": "“ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "7:31"}, {"n": 152, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:32ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಸಂಚು", "r": "7:32"}, {"n": 153, "q": "ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಕಾವಲಾಳುಗಳನ್ನು ಕಳುಹಿಸಿದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರೂ ಮುಖ್ಯಯಾಜಕರೂ", "r": "7:32"}, {"n": 154, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ಏನು ಮುಟ್ಟಿತು?", "a": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರು ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು", "r": "7:32"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರು ಹೀಗೆ ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು ಫರಿಸಾಯರ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯನ್ನು", "r": "7:32"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೂ ಮುಖ್ಯಯಾಜಕರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂಧಿಸಲು ಕಾವಲಾಳುಗಳನ್ನು ಕಳುಹಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:32"}, {"n": 157, "q": "“ಯೇಸುಸ್ವಾಮಿಯನ್ನು ಕುರಿತು ಜನರು ಹೀಗೆ ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು ಫರಿಸಾಯರ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "7:32"}, {"n": 158, "q": "ಯೇಸು ಇನ್ನು ಎಷ್ಟು ಕಾಲ ಜನರೊಡನೆ ಇರುವುದಾಗಿ ಹೇಳಿದರು?", "a": "ತುಸುಕಾಲ ಮಾತ್ರ", "r": "7:33"}, {"n": 159, "q": "ತುಸುಕಾಲದ ಅನಂತರ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೊರಟು ಹೋಗುವುದಾಗಿ ಹೇಳಿದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಬಳಿಗೆ", "r": "7:33"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇನ್ನು ತುಸುಕಾಲ ಮಾತ್ರ ನಾನು ನಿಮ್ಮೊಡನೆ ಇರುತ್ತೇನೆ.”", "a": "ಯೇಸು", "r": "7:33"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಹೊರಟು ಹೋಗುತ್ತೇನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನ", "r": "7:33"}, {"n": 162, "q": "“ಆಗ ಯೇಸು, ಇನ್ನು ತುಸುಕಾಲ ಮಾತ್ರ ನಾನು ನಿಮ್ಮೊಡನೆ ಇರುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "7:33"}, {"n": 163, "q": "ಯೇಸು ಹೊರಟು ಹೋದ ನಂತರ ಜನರ ಬಗ್ಗೆ ಹೇಳಿದ ಮೂರು ಸಂಗತಿಗಳು ಯಾವುವು?", "a": "ನೀವು ನನ್ನನ್ನು ಹುಡುಕುವಿರಿ; ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ; ನಾನು ಇರುವಲ್ಲಿಗೆ ನೀವು ಬರುವಂತೆಯೂ ಇಲ್ಲ", "r": "7:34"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹುಡುಕುವಿರಿ", "r": "7:34"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಸಿಗುವುದಿಲ್ಲ", "r": "7:34"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬರುವಂತೆಯೂ ಇಲ್ಲ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಇರುವಲ್ಲಿಗೆ", "r": "7:34"}, {"n": 167, "q": "ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಲಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಊಹಿಸಿದರು?", "a": "ಗ್ರೀಕರ ನಡುವೆ ಚದರಿ ಹೋಗಿರುವ ಯೆಹೂದ್ಯರಲ್ಲಿಗೆ ಹೋಗಿ ಅವರಿಗೆ ಬೋಧಿಸುವನೋ ಎಂದು", "r": "7:35"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ನಮಗೆ ಕಾಣಸಿಗದ ಹಾಗೆ ಇವನು ಎಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೋಗಲಿದ್ದಾನೆ", "r": "7:35"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗ್ರೀಕರ ನಡುವೆ ಚದರಿ ಹೋಗಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಅವರಿಗೆ ಬೋಧಿಸುವನೋ?”", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿಗೆ", "r": "7:35"}, {"n": 170, "q": "“ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ನಮಗೆ ಕಾಣಸಿಗದ ಹಾಗೆ ಇವನು ಎಲ್ಲಿ ಹೋಗಲಿದ್ದಾನೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "7:35"}, {"n": 171, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವಿನ ಯಾವ ಮಾತಿನ ಅರ್ಥವನ್ನು ತಿಳಿಯದಾದರು?", "a": "“ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ. ನಾನಿರುವಲ್ಲಿಗೆ ನೀವು ಬರುವಂತಿಲ್ಲ’", "r": "7:36"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಸಿಗುವುದಿಲ್ಲ", "r": "7:36"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬರುವಂತಿಲ್ಲ ಎಂದು ಇವನು ಹೇಳುವುದರ ಅರ್ಥ ಏನಿರಬಹುದು?”", "a": "ನಾನಿರುವಲ್ಲಿಗೆ", "r": "7:36"}, {"n": 174, "q": "“ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "7:36"}, {"n": 175, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:37ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜೀವದಾಯಕ ಹೊನಲು", "r": "7:37"}, {"n": 176, "q": "ಯೇಸು “ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ” ಎಂದು ಕೂಗಿ ಹೇಳಿದ್ದು ಯಾವ ದಿನ?", "a": "ಹಬ್ಬದ ಕೊನೆಯ ದಿನ, ಮಹಾದಿನ", "r": "7:37"}, {"n": 177, "q": "ಹಬ್ಬದ ಮಹಾದಿನದಂದು ಯೇಸು ನಿಂತುಕೊಂಡು ಕೂಗಿ ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ.”", "r": "7:37"}, {"n": 178, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ‘ಜೀವಜಲ’ದ ಬಗ್ಗೆ ಯೇಸು ಮಾತನಾಡಿದ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ (4:10); ಪರ್ಣಕುಟೀರ ಹಬ್ಬದ ಮಹಾದಿನದಂದು (7:37–38)", "r": "4:10; 7:37–38"}, {"n": 179, "q": "ಹಬ್ಬದ ಮಹಾದಿನದಂದು ಯೇಸು ಹೇಗೆ ಮಾತನಾಡಿದರು?", "a": "ನಿಂತುಕೊಂಡು ಕೂಗಿ ಹೇಳಿದರು", "r": "7:37"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬದ ಕೊನೆಯ ದಿನ ಮಹಾದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಗಿತ್ತು", "r": "7:37"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿ ನಿಂತುಕೊಂಡು, ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:37"}, {"n": 182, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಏನು ಹರಿಯುವುದು?", "a": "‘ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು’", "r": "7:38"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿರುವಂತೆ, ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು, ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ", "r": "7:38"}, {"n": 184, "q": "“ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಹೇಳಿರುವಂತೆ, ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು, ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "7:38"}, {"n": 185, "q": "ಯೊವಾನ್ನ 7:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಹೇಳಿರುವಂತೆ, ‘ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು’,” ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.", "r": "7:38"}, {"n": 186, "q": "‘ಜೀವಜಲ’ ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕುರಿತು ಹೇಳಿದರು?", "a": "ತಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವರು ಪಡೆಯಲಿದ್ದ ಪವಿತ್ರಾತ್ಮರನ್ನು ಕುರಿತು", "r": "7:39"}, {"n": 187, "q": "ಆಗ ಪವಿತ್ರ ಆತ್ಮ ಇನ್ನೂ ಏಕೆ ಬಂದಿರಲಿಲ್ಲ?", "a": "ಯೇಸು ಇನ್ನೂ ಮೇಲೇರಿ ಮಹಿಮೆಯನ್ನು ಪಡೆದಿರಲಿಲ್ಲ", "r": "7:39"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವರು ಪಡೆಯಲಿದ್ದ ಪವಿತ್ರಾತ್ಮರನ್ನು ಕುರಿತೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗೆ ಹೇಳಿದ್ದು.”", "a": "ಯೇಸು", "r": "7:39"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ತ ಆತ್ಮ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂದಿರಲಿಲ್ಲ", "r": "7:39"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನೂ ಮೇಲೇರಿ ಮಹಿಮೆಯನ್ನು ಪಡೆದಿರಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "7:39"}, {"n": 191, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:40ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜನರಲ್ಲಿ ಭಿನ್ನಭಾವನೆ", "r": "7:40"}, {"n": 192, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು ಏನೆಂದರು?", "a": "“ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ”", "r": "7:40"}, {"n": 193, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರ ಮೂರು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "1) ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ; 2) ಈತನೇ ಲೋಕೋದ್ಧಾರಕ; 3) ಲೋಕೋದ್ಧಾರಕ ಗಲಿಲೇಯದಿಂದ ಬರುವುದುಂಟೇ?", "r": "7:40–41"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲವರು, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ, ಎಂದರು.”", "a": "ನೆರೆದಿದ್ದವರಲ್ಲಿ", "r": "7:40"}, {"n": 195, "q": "“ಇದನ್ನು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "7:40"}, {"n": 196, "q": "ಯೊವಾನ್ನ 7:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು, “ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ,” ಎಂದರು.", "r": "7:40"}, {"n": 197, "q": "ಇನ್ನೂ ಕೆಲವರು ಯೇಸುವನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ಲೋಕೋದ್ಧಾರಕ", "r": "7:41"}, {"n": 198, "q": "ಯೇಸು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ ಎಂದು ವಾದಿಸಿದವರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಲೋಕೋದ್ಧಾರಕ ಗಲಿಲೇಯದಿಂದ ಬರುವುದುಂಟೇ?”", "r": "7:41"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನೂ ಕೆಲವರು, ಈತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಲೋಕೋದ್ದಾರಕ", "r": "7:41"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮತ್ತೆ ಕೆಲವರು, ಲೋಕೋದ್ಧಾರಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವುದುಂಟೇ?”", "a": "ಗಲಿಲೇಯದಿಂದ", "r": "7:41"}, {"n": 201, "q": "“ಇನ್ನೂ ಕೆಲವರು, ಈತನೇ ಲೋಕೋದ್ದಾರಕ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "7:41"}, {"n": 202, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕನು ಯಾರ ವಂಶಜನು ಮತ್ತು ಎಲ್ಲಿ ಹುಟ್ಟುವನು?", "a": "ದಾವೀದ ವಂಶಜನು; ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಹುಟ್ಟುವನು", "r": "7:42"}, {"n": 203, "q": "ದಾವೀದನ ಊರು ಯಾವುದು?", "a": "ಬೆತ್ಲೆಹೇಮ್", "r": "7:42"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?”", "a": "ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ", "r": "7:42"}, {"n": 205, "q": "“ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "7:42"}, {"n": 206, "q": "ಯೊವಾನ್ನ 7:42 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಆತ ದಾವೀದ ವಂಶಜನು; ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ’ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?” ಎಂದು ವಾದಿಸಿದರು.", "r": "7:42"}, {"n": 207, "q": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಏನು ಉಂಟಾಯಿತು?", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯ", "r": "7:43"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:43"}, {"n": 209, "q": "“ಹೀಗೆ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "7:43"}, {"n": 210, "q": "ಯೊವಾನ್ನ 7:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗೆ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.", "r": "7:43"}, {"n": 211, "q": "ಕೆಲವರಿಗೆ ಯೇಸುವನ್ನು ಏನು ಮಾಡಬೇಕೆನಿಸಿತು?", "a": "ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು", "r": "7:44"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೆಲವರಿಗಂತೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:44"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯಾರೂ ಅವರ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಹಾಕಲಿಲ್ಲ", "r": "7:44"}, {"n": 214, "q": "ಯೊವಾನ್ನ 7:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೆಲವರಿಗಂತೂ ಯೇಸುವನ್ನು ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು. ಆದರೆ ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ.", "r": "7:44"}, {"n": 215, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:45ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವಿಹೀನ ಮುಖಂಡರು", "r": "7:45"}, {"n": 216, "q": "ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು ಏನು ಕೇಳಿದರು?", "a": "“ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?”", "r": "7:45"}, {"n": 217, "q": "ಯೇಸುವನ್ನು ಹಿಡಿಯದೆ ಹಿಂದಿರುಗಿದವರು ಯಾರು?", "a": "ಕಾವಲಾಳುಗಳು", "r": "7:45"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?”", "a": "ಫರಿಸಾಯರು", "r": "7:45"}, {"n": 219, "q": "“ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು, ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "7:45"}, {"n": 220, "q": "ಯೊವಾನ್ನ 7:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು, “ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?” ಎಂದು ಕೇಳಿದರು.", "r": "7:45"}, {"n": 221, "q": "ಯೇಸುವನ್ನು ಏಕೆ ಹಿಡಿದು ತರಲಿಲ್ಲ ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಕಾವಲಾಳುಗಳು ಏನೆಂದು ಉತ್ತರಿಸಿದರು?", "a": "“ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ”", "r": "7:46"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಿಸಿದರು.”", "a": "ಮಾತನಾಡಿದ್ದಿಲ್ಲ", "r": "7:46"}, {"n": 223, "q": "“ಅವರು, ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ, ಎಂದು ಉತ್ತರಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "7:46"}, {"n": 224, "q": "ಯೊವಾನ್ನ 7:46 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು, “ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ,” ಎಂದು ಉತ್ತರಿಸಿದರು.", "r": "7:46"}, {"n": 225, "q": "ಕಾವಲಾಳುಗಳ ಉತ್ತರಕ್ಕೆ ಫರಿಸಾಯರು ಏನೆಂದರು?", "a": "“ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?”", "r": "7:47"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?”", "a": "ಫರಿಸಾಯರು", "r": "7:47"}, {"n": 227, "q": "“ಅದಕ್ಕೆ ಫರಿಸಾಯರು, ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "7:47"}, {"n": 228, "q": "ಯೊವಾನ್ನ 7:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಫರಿಸಾಯರು, “ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?", "r": "7:47"}, {"n": 229, "q": "ಯೇಸುವನ್ನು ನಂಬಿದವರ ಬಗ್ಗೆ ಫರಿಸಾಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?”", "r": "7:48"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?”", "a": "ಫರಿಸಾಯರಲ್ಲಾಗಲಿ", "r": "7:48"}, {"n": 231, "q": "“ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "7:48"}, {"n": 232, "q": "ಯೊವಾನ್ನ 7:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?", "r": "7:48"}, {"n": 233, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತರಾಗಿದ್ದಾರೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ", "r": "7:49"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ", "r": "7:49"}, {"n": 235, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "7:49"}, {"n": 236, "q": "ಯೊವಾನ್ನ 7:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ,” ಎಂದರು.", "r": "7:49"}, {"n": 237, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದು ಹಿಂದೆ ಯೇಸುವನ್ನು ಕಾಣಲು ಬಂದಿದ್ದವನು ಯಾರು?", "a": "ನಿಕೊದೇಮನು", "r": "7:50"}, {"n": 238, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ನಿಕೊದೇಮನನ್ನು ಉಲ್ಲೇಖಿಸುವ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು (ಅಧ್ಯಾಯ 3 ಮತ್ತು 7)?", "a": "ರಾತ್ರಿ ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದದ್ದು (3:1–2); ಫರಿಸಾಯರ ಮುಂದೆ ಯೇಸುವಿನ ಪರವಾಗಿ ಪ್ರಶ್ನಿಸಿದ್ದು (7:50–51)", "r": "3:1–2; 7:50–51"}, {"n": 239, "q": "ನಿಕೊದೇಮನು ಯಾವ ಪಂಗಡದವನು?", "a": "ಫರಿಸಾಯರಲ್ಲಿ ಒಬ್ಬನು", "r": "7:50"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಕೊದೇಮನು ಒಬ್ಬನು.”", "a": "ಫರಿಸಾಯರಲ್ಲಿ", "r": "7:50"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣಲು ಬಂದಿದ್ದವನು ಈತನೇ.”", "a": "ಯೇಸುವನ್ನು", "r": "7:50"}, {"n": 242, "q": "ಯೊವಾನ್ನ 7:50 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿದ್ದ ಫರಿಸಾಯರಲ್ಲಿ ನಿಕೊದೇಮನು ಒಬ್ಬನು. ಹಿಂದೆ ಯೇಸುವನ್ನು ಕಾಣಲು ಬಂದಿದ್ದವನು ಈತನೇ.", "r": "7:50"}, {"n": 243, "q": "ನಿಕೊದೇಮನು ಫರಿಸಾಯರಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?”", "r": "7:51"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನು ಅವರಿಗೆ, ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಶಾಸ್ತ್ರಸಮ್ಮತವೇ", "r": "7:51"}, {"n": 245, "q": "“ಈತನು ಅವರಿಗೆ, ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "7:51"}, {"n": 246, "q": "ಯೊವಾನ್ನ 7:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನು ಅವರಿಗೆ, “ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?” ಎಂದು ಕೇಳಿದನು.", "r": "7:51"}, {"n": 247, "q": "ನಿಕೊದೇಮನಿಗೆ ಫರಿಸಾಯರು ಕೊಟ್ಟ ಮರುತ್ತರ ಯಾವ ಪ್ರಶ್ನೆಯಿಂದ ಆರಂಭವಾಯಿತು?", "a": "“ನೀನೂ ಗಲಿಲೇಯದವನೋ?”", "r": "7:52"}, {"n": 248, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಗಲಿಲೇಯದಿಂದ ಯಾರು ತಲೆಯೆತ್ತುವುದಿಲ್ಲ?", "a": "ಯಾವ ಪ್ರವಾದಿಯೂ", "r": "7:52"}, {"n": 249, "q": "ಫರಿಸಾಯರು ನಿಕೊದೇಮನಿಗೆ ಏನನ್ನು ಓದಿ ನೋಡಲು ಹೇಳಿದರು?", "a": "ಪವಿತ್ರಗ್ರಂಥವನ್ನು", "r": "7:52"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ನೀನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಗಲಿಲೇಯದವನೋ", "r": "7:52"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾವ ಪ್ರವಾದಿಯೂ ತಲೆಯೆತ್ತುವುದಿಲ್ಲ, ಎಂಬುದು ನಿನಗೇ ಗೊತ್ತಾಗುತ್ತದೆ, ಎಂದು ಮರುತ್ತರ ಕೊಟ್ಟರು.”", "a": "ಗಲಿಲೇಯದಿಂದ", "r": "7:52"}, {"n": 252, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಗಲಿಲೇಯದಿಂದ ಯಾವ ಪ್ರವಾದಿಯೂ ತಲೆಯೆತ್ತುವುದಿಲ್ಲ, ಎಂಬುದು …”", "a": "“… ನಿನಗೇ ಗೊತ್ತಾಗುತ್ತದೆ, ಎಂದು ಮರುತ್ತರ ಕೊಟ್ಟರು.”", "r": "7:52"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಏಳನೆಯ ಅಧ್ಯಾಯ ಯಾವ ಸಂಗತಿಯಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು", "r": "7:53"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಳಿಕ ಎಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.”", "a": "ತಮ್ಮತಮ್ಮ", "r": "7:53"}, {"n": 255, "q": "“ಬಳಿಕ ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 53", "r": "7:53"}, {"n": 256, "q": "ಯೊವಾನ್ನ 7:53 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬಳಿಕ ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.", "r": "7:53"}]}]}</script>

<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
