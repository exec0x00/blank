<script id="src" type="application/json">{"title": "ಯೊವಾನ್ನನು ಬರೆದ ಶುಭಸಂದೇಶ", "portion": "ಯೊವಾನ್ನ 1–12", "cover": false, "sections": false, "chapters": [{"chapter": 1, "label": "ಅಧ್ಯಾಯ 1", "verses": 51, "subtitle": null, "questions": [{"n": 1, "q": "ಜಗತ್ತು ಉಂಟಾಗುವ ಮೊದಲೇ ಇದ್ದವರು ಯಾರು?", "a": "‘ದಿವ್ಯವಾಣಿ’ ಎಂಬವರು", "r": "1:1"}, {"n": 2, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪ್ರಕಾರ ಆ ದಿವ್ಯವಾಣಿ ಯಾರಾಗಿದ್ದರು?", "a": "ದೇವರಾಗಿದ್ದರು", "r": "1:1"}, {"n": 3, "q": "ದಿವ್ಯವಾಣಿ ಅನಾದಿಯಿಂದಲೇ ಯಾರೊಂದಿಗೆ ಇದ್ದರು?", "a": "ದೇವರೊಂದಿಗೆ", "r": "1:1–2"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜಗತ್ತು ಉಂಟಾಗುವ ಮೊದಲೇ ‘ದಿವ್ಯವಾಣಿ’ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಂಬವರಿದ್ದರು", "r": "1:1"}, {"n": 5, "q": "“ಜಗತ್ತು ಉಂಟಾಗುವ ಮೊದಲೇ ‘ದಿವ್ಯವಾಣಿ’ ಎಂಬವರಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "1:1"}, {"n": 6, "q": "ಯೊವಾನ್ನ 1:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜಗತ್ತು ಉಂಟಾಗುವ ಮೊದಲೇ ‘ದಿವ್ಯವಾಣಿ’ ಎಂಬವರಿದ್ದರು. ಆ ದಿವ್ಯವಾಣಿ ದೇವರಾಗಿದ್ದರು. ಆ ದಿವ್ಯವಾಣಿ ದೇವರೊಂದಿಗೆ ಇದ್ದರು;", "r": "1:1"}, {"n": 7, "q": "ದಿವ್ಯವಾಣಿ ದೇವರೊಂದಿಗೆ ಯಾವಾಗಿನಿಂದ ಇದ್ದರು?", "a": "ಅನಾದಿಯಿಂದಲೇ", "r": "1:2"}, {"n": 8, "q": "ದಿವ್ಯವಾಣಿಯ ಮುಖಾಂತರವೇ ಏನು ಉಂಟಾಯಿತು?", "a": "ಸಮಸ್ತವೂ", "r": "1:3"}, {"n": 9, "q": "ಉಂಟಾದವುಗಳ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:3 ಏನು ಹೇಳುತ್ತದೆ?", "a": "“ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ ಆದುದಲ್ಲ.”", "r": "1:3"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದುದಲ್ಲ.”", "a": "ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ", "r": "1:3"}, {"n": 11, "q": "ಯೊವಾನ್ನ 1:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಿವ್ಯವಾಣಿಯ ಮುಖಾಂತರವೇ ಸಮಸ್ತವೂ ಉಂಟಾಯಿತು. ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ ಆದುದಲ್ಲ.", "r": "1:3"}, {"n": 12, "q": "“ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ ಆದುದಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "1:3"}, {"n": 13, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ಏನಿತ್ತು?", "a": "ಸಜ್ಜೀವ", "r": "1:4"}, {"n": 14, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿದ್ದ ಜೀವವು ಏನಾಗಿತ್ತು?", "a": "ಮಾನವಜನಾಂಗದ ಜ್ಯೋತಿ", "r": "1:4"}, {"n": 15, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರಂಭದಲ್ಲಿ ದಿವ್ಯವಾಣಿಯನ್ನು ಯಾವ ಪ್ರತೀಕದಿಂದ ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಜ್ಯೋತಿ (ನಿಜವಾದ ಜ್ಯೋತಿ, ಜಗಜ್ಯೋತಿ)", "r": "1:4–9"}, {"n": 16, "q": "ಯೊವಾನ್ನ 1:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ಸಜ್ಜೀವವಿತ್ತು. ಆ ಜೀವವೇ ಮಾನವಜನಾಂಗದ ಜ್ಯೋತಿಯಾಗಿತ್ತು.", "r": "1:4"}, {"n": 17, "q": "ಜ್ಯೋತಿ ಎಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ?", "a": "ಕತ್ತಲಲ್ಲಿ", "r": "1:5"}, {"n": 18, "q": "ಕತ್ತಲಿಗೆ ಜ್ಯೋತಿಯನ್ನು ಏನು ಮಾಡಲಾಗಲಿಲ್ಲ?", "a": "ನಿಗ್ರಹಿಸಲಾಗಲಿಲ್ಲ", "r": "1:5"}, {"n": 19, "q": "ಯೊವಾನ್ನ 1:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಜ್ಯೋತಿ ಕತ್ತಲಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ. ಕತ್ತಲಿಗಾದರೋ ಅದನ್ನು ನಿಗ್ರಹಿಸಲಾಗಲಿಲ್ಲ.", "r": "1:5"}, {"n": 20, "q": "ದೇವರು ಕಳುಹಿಸಿದ ವ್ಯಕ್ತಿಯ ಹೆಸರೇನು?", "a": "ಯೊವಾನ್ನ", "r": "1:6"}, {"n": 21, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಸ್ನಾನಿಕ ಯೊವಾನ್ನನನ್ನು ಮೊದಲು ಹೇಗೆ ಪರಿಚಯಿಸಲಾಗಿದೆ?", "a": "ದೇವರು ಕಳುಹಿಸಿದ ವ್ಯಕ್ತಿ; ಆತನ ಹೆಸರು ಯೊವಾನ್ನ", "r": "1:6; 1:19"}, {"n": 22, "q": "ಯೊವಾನ್ನ 1:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು ಕಳುಹಿಸಿದರು. ಆತನ ಹೆಸರು ಯೊವಾನ್ನ.", "r": "1:6"}, {"n": 23, "q": "ಯೊವಾನ್ನನು ಏಕೆ ಬಂದನು?", "a": "ಸಾಕ್ಷಿಕೊಡಲು (ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲು)", "r": "1:7"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.”", "a": "ವಿಶ್ವಾಸಿಸುವಂತೆ", "r": "1:7"}, {"n": 25, "q": "“ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 26, "q": "ಯೊವಾನ್ನ 1:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನು ಸಾಕ್ಷಿಕೊಡಲು ಬಂದನು. ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.", "r": "1:7"}, {"n": 27, "q": "ಯೊವಾನ್ನನು ಏನಾಗಿರಲಿಲ್ಲ?", "a": "ಜ್ಯೋತಿಯಾಗಿರಲಿಲ್ಲ", "r": "1:8"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.”", "a": "ಜ್ಯೋತಿಯನ್ನು", "r": "1:8"}, {"n": 29, "q": "“ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 30, "q": "ಯೊವಾನ್ನ 1:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನೇ ಜ್ಯೋತಿಯಾಗಿರಲಿಲ್ಲ; ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.", "r": "1:8"}, {"n": 31, "q": "ನಿಜವಾದ ಜ್ಯೋತಿ ಯಾರು?", "a": "ಆ ದಿವ್ಯವಾಣಿಯೇ", "r": "1:9"}, {"n": 32, "q": "ಜಗಜ್ಯೋತಿ ಲೋಕಕ್ಕೆ ಏಕೆ ಆಗಮಿಸಲಿದ್ದರು?", "a": "ಮಾನವರೆಲ್ಲರನ್ನು ಬೆಳಗಿಸಲು", "r": "1:9"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಗಿಸಲು ಲೋಕಕ್ಕೆ ಆಗಮಿಸಲಿದ್ದ ಜಗಜ್ಯೋತಿ ಅವರೇ.”", "a": "ಮಾನವರೆಲ್ಲರನ್ನು", "r": "1:9"}, {"n": 34, "q": "ಯೊವಾನ್ನ 1:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಜವಾದ ಜ್ಯೋತಿ ಆ ದಿವ್ಯವಾಣಿಯೇ. ಮಾನವರೆಲ್ಲರನ್ನು ಬೆಳಗಿಸಲು ಲೋಕಕ್ಕೆ ಆಗಮಿಸಲಿದ್ದ ಜಗಜ್ಯೋತಿ ಅವರೇ.", "r": "1:9"}, {"n": 35, "q": "“ಮಾನವರೆಲ್ಲರನ್ನು ಬೆಳಗಿಸಲು ಲೋಕಕ್ಕೆ ಆಗಮಿಸಲಿದ್ದ ಜಗಜ್ಯೋತಿ ಅವರೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "1:9"}, {"n": 36, "q": "ದಿವ್ಯವಾಣಿ ಲೋಕದಲ್ಲಿ ಇದ್ದರೂ ಲೋಕ ಏನು ಮಾಡಿತು?", "a": "ಅವರನ್ನು ಅರಿತುಕೊಳ್ಳದೆ ಹೋಯಿತು", "r": "1:10"}, {"n": 37, "q": "ದಿವ್ಯವಾಣಿಯ ಮುಖಾಂತರವೇ ಯಾವುದು ಉಂಟಾಯಿತು ಎಂದು 1:10 ಹೇಳುತ್ತದೆ?", "a": "ಲೋಕವು", "r": "1:10"}, {"n": 38, "q": "ಯೊವಾನ್ನ 1:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಿವ್ಯವಾಣಿ ಲೋಕದಲ್ಲಿ ಇದ್ದರು. ಅವರ ಮುಖಾಂತರವೇ ಲೋಕವು ಉಂಟಾಯಿತು. ಲೋಕವಾದರೋ ಅವರನ್ನು ಅರಿತುಕೊಳ್ಳದೆ ಹೋಯಿತು.", "r": "1:10"}, {"n": 39, "q": "ದಿವ್ಯವಾಣಿ ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ ಬಂದಾಗ ಅವರನ್ನು ಬರಮಾಡಿಕೊಳ್ಳದೆ ಹೋದವರು ಯಾರು?", "a": "ಸ್ವಜನರೇ", "r": "1:11"}, {"n": 40, "q": "ದಿವ್ಯವಾಣಿ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ", "r": "1:11"}, {"n": 41, "q": "ಯೊವಾನ್ನ 1:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ ಬಂದರು; ಸ್ವಜನರೇ ಅವರನ್ನು ಬರಮಾಡಿಕೊಳ್ಳದೆ ಹೋದರು.", "r": "1:11"}, {"n": 42, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ ಅವರು ಏನನ್ನು ಕೊಟ್ಟರು?", "a": "ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು", "r": "1:12"}, {"n": 43, "q": "ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಪಡೆದವರು ಯಾರು?", "a": "ದಿವ್ಯವಾಣಿಯನ್ನು ಬರಮಾಡಿಕೊಂಡವರು, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರು", "r": "1:12"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರಿಗೆ, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಅವರು ಕೊಟ್ಟರು.”", "a": "ಇಟ್ಟವರಿಗೆ", "r": "1:12"}, {"n": 45, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂಥವರಿಗೆ, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ, …”", "a": "“… ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಅವರು ಕೊಟ್ಟರು.”", "r": "1:12"}, {"n": 46, "q": "ಯೊವಾನ್ನ 1:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೆಲವರಾದರೋ ಅವರನ್ನು ಬರಮಾಡಿ ಕೊಂಡರು. ಅಂಥವರಿಗೆ, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ, ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಅವರು ಕೊಟ್ಟರು.", "r": "1:12"}, {"n": 47, "q": "ದೇವರ ಮಕ್ಕಳಾದವರ ಜನನವು ಯಾವುದರಿಂದ ಅಲ್ಲ?", "a": "ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ; ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ; ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ", "r": "1:13"}, {"n": 48, "q": "ದೇವರ ಮಕ್ಕಳಾದವರ ಜನನವು ಯಾರಿಂದ ಆದುದು?", "a": "ದೇವರಿಂದಲೇ", "r": "1:13"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರ ಜನನವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.”", "a": "ರಕ್ತಸಂಬಂಧದಿಂದ", "r": "1:13"}, {"n": 50, "q": "“ಅಂಥವರ ಜನನವು ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 51, "q": "ಯೊವಾನ್ನ 1:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂಥವರ ಜನನವು ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.", "r": "1:13"}, {"n": 52, "q": "ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯರಾದುದರ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:14ರ ಆರಂಭದ ಮಾತುಗಳು ಯಾವುವು?", "a": "“ಆ ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯ ಆದರು. ಮನುಷ್ಯನಾಗಿ ನಮ್ಮೊಡನೆ ವಾಸಮಾಡಿದರು.”", "r": "1:14"}, {"n": 53, "q": "ಯಾರ ಮಹಿಮೆಯನ್ನು ‘ನಾವು ನೋಡಿದೆವು’ ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ದಿವ್ಯವಾಣಿಯ ಮಹಿಮೆಯನ್ನು", "r": "1:14"}, {"n": 54, "q": "ದಿವ್ಯವಾಣಿ ಯಾವುದರಿಂದ ಪರಿಪೂರ್ಣರಾಗಿದ್ದರು?", "a": "ವರಪ್ರಸಾದದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ", "r": "1:14"}, {"n": 55, "q": "ಪಿತನಿಂದ ಪಡೆದ ಮಹಿಮೆ ಯಾರಿಗೆ ಮೀಸಲಾದ ಮಹಿಮೆ?", "a": "ಏಕೈಕ ಪುತ್ರನಿಗೆ", "r": "1:14"}, {"n": 56, "q": "ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯನಾಗಿ ಯಾರೊಡನೆ ವಾಸಮಾಡಿದರು?", "a": "ನಮ್ಮೊಡನೆ", "r": "1:14"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನಿಂದ ಪಡೆದ ಆ ಮಹಿಮೆ ಏಕೈಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೀಸಲಾದ ಮಹಿಮೆಯೇ.”", "a": "ಪುತ್ರನಿಗೆ", "r": "1:14"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ ಅವರು ವರಪ್ರಸಾದದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಿಪೂರ್ಣರಾಗಿದ್ದರು", "r": "1:14"}, {"n": 59, "q": "“ಪಿತನಿಂದ ಪಡೆದ ಆ ಮಹಿಮೆ ಏಕೈಕ ಪುತ್ರನಿಗೆ ಮೀಸಲಾದ ಮಹಿಮೆಯೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 60, "q": "ಯೊವಾನ್ನನು ದಿವ್ಯವಾಣಿಯನ್ನು ಕುರಿತು ಘೋಷಿಸಿದ ಸಾಕ್ಷಿ ಯಾವುದು?", "a": "‘ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು; ಆದುದರಿಂದ ಅವರು ನನಗಿಂತಲೂ ಶ್ರೇಷ್ಠರು’", "r": "1:15"}, {"n": 61, "q": "“ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು” ಎಂಬ ಯೊವಾನ್ನನ ಸಾಕ್ಷಿ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಎರಡು ಬಾರಿ (1:15; 1:30)", "r": "1:15; 1:30"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನುಡಿಯುತ್ತಾ, ‘ ‘ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು;”", "a": "ಯೊವಾನ್ನನು", "r": "1:15"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವರು ನನಗಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>’ ಎಂದು ನಾನು ಹೇಳಿದ್ದು ಅವರನ್ನು ಕುರಿತೇ,’ ಎಂದು ಘೋಷಿಸಿದನು.”", "a": "ಶ್ರೇಷ್ಠರು", "r": "1:15"}, {"n": 64, "q": "“ಯೊವಾನ್ನನು ಅವರನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನುಡಿಯುತ್ತಾ, ‘ ‘ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "1:15"}, {"n": 65, "q": "ದಿವ್ಯವಾಣಿಯ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ಏನನ್ನು ಪಡೆದಿದ್ದೇವೆ?", "a": "ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು", "r": "1:16"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.”", "a": "ಪರಿಪೂರ್ಣತೆಯಿಂದ", "r": "1:16"}, {"n": 67, "q": "“ಅವರ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 68, "q": "ಯೊವಾನ್ನ 1:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.", "r": "1:16"}, {"n": 69, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು?", "a": "ಮೋಶೆಯ ಮುಖಾಂತರ", "r": "1:17"}, {"n": 70, "q": "ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವು ಯಾವುವು?", "a": "ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯ", "r": "1:17"}, {"n": 71, "q": "ಮೋಶೆ ಮತ್ತು ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವುಗಳನ್ನು ಹೋಲಿಸಿ.", "a": "ಮೋಶೆಯ ಮುಖಾಂತರ ಧರ್ಮಶಾಸ್ತ್ರ; ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯ", "r": "1:17"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯವಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ಬಂದವು.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರ", "r": "1:17"}, {"n": 73, "q": "ಯೊವಾನ್ನ 1:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಮೋಶೆಯ ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು. ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯವಾದರೋ ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವು.", "r": "1:17"}, {"n": 74, "q": "“ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯವಾದರೋ ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "1:17"}, {"n": 75, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:18ರ ಪ್ರಕಾರ ಯಾರೂ ಎಂದೂ ಯಾರನ್ನು ಕಂಡಿಲ್ಲ?", "a": "ದೇವರನ್ನು", "r": "1:18"}, {"n": 76, "q": "ದೇವರನ್ನು ತಿಳಿಯಪಡಿಸಿದವರು ಯಾರು?", "a": "ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ, ಸ್ವತಃ ದೇವರಾಗಿರುವ ಏಕೈಕ ಪುತ್ರ", "r": "1:18"}, {"n": 77, "q": "ಏಕೈಕ ಪುತ್ರನು ಎಲ್ಲಿರುವವರು ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿ", "r": "1:18"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸ್ವತಃ ದೇವರಾಗಿರುವ ಏಕೈಕ ಪುತ್ರನೇ ಅವರನ್ನು ತಿಳಿಯಪಡಿಸಿದ್ದಾರೆ.”", "a": "ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ", "r": "1:18"}, {"n": 79, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ, ಸ್ವತಃ ದೇವರಾಗಿರುವ …”", "a": "“… ಏಕೈಕ ಪುತ್ರನೇ ಅವರನ್ನು ತಿಳಿಯಪಡಿಸಿದ್ದಾರೆ.”", "r": "1:18"}, {"n": 80, "q": "ಯೊವಾನ್ನ 1:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯಾರೂ ಎಂದೂ ದೇವರನ್ನು ಕಂಡಿಲ್ಲ; ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ, ಸ್ವತಃ ದೇವರಾಗಿರುವ ಏಕೈಕ ಪುತ್ರನೇ ಅವರನ್ನು ತಿಳಿಯಪಡಿಸಿದ್ದಾರೆ.", "r": "1:18"}, {"n": 81, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:19ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಸ್ನಾನಿಕ ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯ", "r": "1:19"}, {"n": 82, "q": "ಯೊವಾನ್ನನ ಬಳಿಗೆ ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ ಕಳಿಸಿದವರು ಯಾರು?", "a": "ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "1:19"}, {"n": 83, "q": "ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೊವಾನ್ನನ ಬಳಿಗೆ ಯಾರನ್ನು ಕಳಿಸಿದರು?", "a": "ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ", "r": "1:19"}, {"n": 84, "q": "ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಯೊವಾನ್ನನನ್ನು ಮೊದಲು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಯಾರು?”", "r": "1:19"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಕಳಿಸಿದರು.”", "a": "ಯೊವಾನ್ನನ", "r": "1:19"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು, ‘ನೀನು ಯಾರು?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಶ್ನಿಸಿದರು", "r": "1:19"}, {"n": 87, "q": "“ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ ಯೊವಾನ್ನನ ಬಳಿಗೆ ಕಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "1:19"}, {"n": 88, "q": "“ನೀನು ಯಾರು?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೊವಾನ್ನನು ಸ್ಪಷ್ಟವಾಗಿ ಏನು ಹೇಳಿದನು?", "a": "“ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ”", "r": "1:20"}, {"n": 89, "q": "ಯೆಹೂದ್ಯರು ಕಳಿಸಿದವರ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರವಾಗಿ ಯೊವಾನ್ನನು ತಾನು ಯಾರಲ್ಲ ಎಂದು ಹೇಳಿದನು?", "a": "1) ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ; 2) ಎಲೀಯ; 3) ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ", "r": "1:20–21"}, {"n": 90, "q": "ಯೊವಾನ್ನನು ತಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ ಎಂದು ಹೇಗೆ ಹೇಳಿದನು?", "a": "ಸ್ಪಷ್ಟವಾಗಿ; ಏನನ್ನೂ ಮರೆಮಾಚಲಿಲ್ಲ", "r": "1:20"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, ‘ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ,’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:20"}, {"n": 92, "q": "“ಯೊವಾನ್ನನು ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, ‘ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ,’ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "1:20"}, {"n": 93, "q": "ಯೊವಾನ್ನ 1:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, “ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ,” ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು. ಏನನ್ನೂ ಮರೆಮಾಚಲಿಲ್ಲ.", "r": "1:20"}, {"n": 94, "q": "“ನೀನು ಎಲೀಯನೋ?” ಎಂದು ಕೇಳಿದಾಗ ಯೊವಾನ್ನನು ಏನೆಂದನು?", "a": "‘ಅಲ್ಲ’", "r": "1:21"}, {"n": 95, "q": "“ನೀನು ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯಿರಬಹುದೇ?” ಎಂದು ಕೇಳಿದಾಗ ಯೊವಾನ್ನನು ಏನೆಂದು ಮರುನುಡಿದನು?", "a": "“ಅದೂ ಅಲ್ಲ”", "r": "1:21"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ, ‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಕೇಳಲು ‘ಅಲ್ಲ’ ಎಂದನು.”", "a": "ಎಲೀಯನೋ", "r": "1:21"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ಬರಬೇಕಾಗಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಅವರು ಮತ್ತೆ ಕೇಳಲು, ‘ಅದೂ ಅಲ್ಲ,’ ಎಂದು ಮರುನುಡಿದನು.”", "a": "ಪ್ರವಾದಿಯಿರಬಹುದೇ", "r": "1:21"}, {"n": 98, "q": "“ಹಾಗಾದರೆ, ‘ನೀನು ಎಲೀಯನೋ?’ ಎಂದು ಕೇಳಲು ‘ಅಲ್ಲ’ ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "1:21"}, {"n": 99, "q": "ಯೊವಾನ್ನನು ಯಾರೆಂದು ತಿಳಿಸಬೇಕೆಂದು ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಏಕೆ ಕೇಳಿದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದವರಿಗೆ ಅವರು ಉತ್ತರಕೊಡಬೇಕಾಗಿದ್ದರಿಂದ", "r": "1:22"}, {"n": 100, "q": "ಯೊವಾನ್ನನಿಗೆ ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಮತ್ತೊಮ್ಮೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಿನ್ನನ್ನು ಕುರಿತು ನೀನು ಏನು ಹೇಳುತ್ತೀ?”", "r": "1:22"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಯಾರೆಂದು ನಮಗೆ ತಿಳಿಸು.”", "a": "ಹಾಗಾದರೆ", "r": "1:22"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ನೀನು ಏನು ಹೇಳುತ್ತೀ?’ ಎಂದು ಅವರು ಮತ್ತೊಮ್ಮೆ ಕೇಳಿದರು.”", "a": "ನಿನ್ನನ್ನು", "r": "1:22"}, {"n": 103, "q": "“‘ಹಾಗಾದರೆ ನೀನು ಯಾರೆಂದು ನಮಗೆ ತಿಳಿಸು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "1:22"}, {"n": 104, "q": "ತನ್ನ ಬಗ್ಗೆ ಯೊವಾನ್ನನು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲಿ ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು”", "r": "1:23"}, {"n": 105, "q": "“ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು” — ಯೊವಾನ್ನನು ಯಾವ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲಿ ಹೀಗೆ ಉತ್ತರಿಸಿದನು?", "a": "ಯೆಶಾಯ ಪ್ರವಾದಿಯ", "r": "1:23"}, {"n": 106, "q": "ಯೊವಾನ್ನನು ತಾನು ಎಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೆಂದು ಹೇಳಿದನು?", "a": "ಬೆಂಗಾಡಿನಲ್ಲಿ", "r": "1:23"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು,’ ಎಂದು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲೇ ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:23"}, {"n": 108, "q": "“ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ‘ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು,’ ಎಂದು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲೇ ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "1:23"}, {"n": 109, "q": "ಯೊವಾನ್ನ 1:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, “ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು,” ಎಂದು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲೇ ಉತ್ತರಕೊಟ್ಟನು.", "r": "1:23"}, {"n": 110, "q": "“… ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?” ಎಂದು ಯೊವಾನ್ನನನ್ನು ಪ್ರಶ್ನಿಸಿದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು", "r": "1:24–25"}, {"n": 111, "q": "ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದವರು ಯೊವಾನ್ನನನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?”", "r": "1:24–25"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ‘ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ಎಲೀಯನಾಗಲಿ", "r": "1:24–25"}, {"n": 113, "q": "“ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ‘ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24–25", "r": "1:24–25"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ‘ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, …”", "a": "“… ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.”", "r": "1:24–25"}, {"n": 115, "q": "ಯೊವಾನ್ನ 1:24–25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, “ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "1:24–25"}, {"n": 116, "q": "ಯೊವಾನ್ನನು ಯಾವುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದನು?", "a": "ನೀರಿನಿಂದ", "r": "1:26"}, {"n": 117, "q": "ಫರಿಸಾಯರ ಕಡೆಯವರಿಗೆ ಯೊವಾನ್ನನು ಅವರ ನಡುವೆ ಇರುವವರ ಬಗ್ಗೆ ಏನು ಹೇಳಿದನು?", "a": "“ನಿಮಗೆ ತಿಳಿಯದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ನಿಮ್ಮ ನಡುವೆ ಇದ್ದಾರೆ.”", "r": "1:26"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರತ್ಯುತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಾನು ನಿಮಗೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದೇನೆ.”", "a": "ಯೊವಾನ್ನನು", "r": "1:26"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ತಿಳಿಯದ ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ನಡುವೆ ಇದ್ದಾರೆ.”", "a": "ವ್ಯಕ್ತಿ", "r": "1:26"}, {"n": 120, "q": "“ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೊವಾನ್ನನು, ‘ನಾನು ನಿಮಗೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "1:26"}, {"n": 121, "q": "ಯೊವಾನ್ನನು ತನ್ನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರ ಯಾವುದನ್ನು ಬಿಚ್ಚುವುದಕ್ಕೂ ಯೋಗ್ಯನಲ್ಲ ಎಂದನು?", "a": "ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು", "r": "1:27"}, {"n": 122, "q": "ಯೊವಾನ್ನನ ಪ್ರಕಾರ ಅವನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರು ಯಾರು?", "a": "ಅವರ ನಡುವೆ ಇದ್ದ, ಅವರಿಗೆ ತಿಳಿಯದ ವ್ಯಕ್ತಿ (ಯೇಸು)", "r": "1:27"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಚ್ಚುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ,’ ಎಂದನು.”", "a": "ಪಾದರಕ್ಷೆಗಳನ್ನು", "r": "1:27"}, {"n": 124, "q": "ಯೊವಾನ್ನ 1:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರು ಅವರೇ. ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು ಬಿಚ್ಚುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ,” ಎಂದನು.", "r": "1:27"}, {"n": 125, "q": "“ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು ಬಿಚ್ಚುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ,’ ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "1:27"}, {"n": 126, "q": "ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯದ ಈ ಘಟನೆಗಳು ಎಲ್ಲಿ ನಡೆದವು?", "a": "ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ", "r": "1:28"}, {"n": 127, "q": "ಬೆಥಾನಿಯ ಯಾವ ನದಿಯ ಆಚೆದಡದಲ್ಲಿತ್ತು?", "a": "ಜೋರ್ಡನ್ ನದಿಯ", "r": "1:28"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:28"}, {"n": 129, "q": "“ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "1:28"}, {"n": 130, "q": "ಯೊವಾನ್ನ 1:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.", "r": "1:28"}, {"n": 131, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:29ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದೇವರ ಯಜ್ಞಪಶು", "r": "1:29"}, {"n": 132, "q": "ಯೇಸು ತನ್ನ ಬಳಿಗೆ ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು ಯೊವಾನ್ನನು ಏನೆಂದನು?", "a": "“ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ; ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಇವರೇ.”", "r": "1:29"}, {"n": 133, "q": "ಯೊವಾನ್ನನ ಪ್ರಕಾರ ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಯಾರು?", "a": "ಯೇಸು (ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ)", "r": "1:29"}, {"n": 134, "q": "ಯೊವಾನ್ನನು ಯೇಸುವನ್ನು “ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಕರೆದನು?", "a": "ಎರಡು ಬಾರಿ (1:29; 1:36)", "r": "1:29; 1:36"}, {"n": 135, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿಗೆ ಉಪಯೋಗಿಸಲಾದ ಯಾವುದಾದರೂ ನಾಲ್ಕು ಬಿರುದುಗಳನ್ನು ತಿಳಿಸಿ.", "a": "ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ; ದೇವರ ಪುತ್ರ; ಮೆಸ್ಸೀಯ; ಇಸ್ರಯೇಲರ ಅರಸ; ಗುರುದೇವ (ರಬ್ಬಿ); ನರಪುತ್ರ", "r": "1:29; 1:34; 1:36; 1:41; 1:49"}, {"n": 136, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮರುದಿನ ಅಥವಾ ಮಾರನೆಯ ದಿನ ಎಂದು ಆರಂಭವಾಗುವ ವಚನಗಳು ಯಾವುವು?", "a": "1:29, 1:35, 1:43", "r": "1:29; 1:35; 1:43"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರುದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಾನಿದ್ದಲ್ಲಿಗೇ ಯೇಸು ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು, ‘ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ;”", "a": "ಯೊವಾನ್ನನು", "r": "1:29"}, {"n": 138, "q": "“ಮರುದಿನ ಯೊವಾನ್ನನು, ತಾನಿದ್ದಲ್ಲಿಗೇ ಯೇಸು ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು, ‘ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "1:29"}, {"n": 139, "q": "ಯೊವಾನ್ನ 1:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮರುದಿನ ಯೊವಾನ್ನನು, ತಾನಿದ್ದಲ್ಲಿಗೇ ಯೇಸು ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು, “ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ; ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಇವರೇ.", "r": "1:29"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ‘ನನ್ನ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗಿಂತಲೂ ಮೊದಲೇ ಇದ್ದವರು;”", "a": "ಬಂದವರಾದರೂ", "r": "1:30"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಇವರು ನನಗಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ನಾನು ಹೇಳಿದುದು ಇವರನ್ನು ಕುರಿತೇ.”", "a": "ಶ್ರೇಷ್ಠರು", "r": "1:30"}, {"n": 142, "q": "“ಇವರು ‘ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತಲೂ ಮೊದಲೇ ಇದ್ದವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "1:30"}, {"n": 143, "q": "ಯೊವಾನ್ನನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದದ್ದು ಏಕೆ?", "a": "ಇಸ್ರಯೇಲರಿಗೆ ಯೇಸುವನ್ನು ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ", "r": "1:31"}, {"n": 144, "q": "“ಬರಬೇಕಾಗಿದ್ದವರು ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ” ಎಂದು ಯೊವಾನ್ನನು ಎಷ್ಟು ಬಾರಿ ಹೇಳಿದನು?", "a": "ಎರಡು ಬಾರಿ (1:31; 1:33)", "r": "1:31; 1:33"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲರಿಗೆ ಇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದೆನು;”", "a": "ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ", "r": "1:31"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ,’ ಎಂದು ನುಡಿದನು.”", "a": "ಬರಬೇಕಾಗಿದ್ದವರು", "r": "1:31"}, {"n": 147, "q": "“ಇಸ್ರಯೇಲರಿಗೆ ಇವರನ್ನು ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ ನಾನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದೆನು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "1:31"}, {"n": 148, "q": "ಪವಿತ್ರಾತ್ಮ ಯಾವ ರೂಪದಲ್ಲಿ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಯೇಸುವಿನ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ಯೊವಾನ್ನನು ನೋಡಿದನು?", "a": "ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ", "r": "1:32"}, {"n": 149, "q": "ಪವಿತ್ರಾತ್ಮ ಎಲ್ಲಿಂದ ಇಳಿದು ಬಂದರು?", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "1:32"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ‘ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:32"}, {"n": 151, "q": "“ಯೊವಾನ್ನನು ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ‘ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "1:32"}, {"n": 152, "q": "ಯೊವಾನ್ನ 1:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, “ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.", "r": "1:32"}, {"n": 153, "q": "ಯೊವಾನ್ನನನ್ನು ಕಳುಹಿಸಿದ ದೇವರು ಅವನಿಗೆ ಕೊಟ್ಟ ಗುರುತು ಯಾವುದು?", "a": "‘ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದು ಯಾವ ವ್ಯಕ್ತಿಯ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನೀನು ನೋಡುವಿಯೋ ಆತನೇ ಪವಿತ್ರಾತ್ಮನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುವಾತ’", "r": "1:33"}, {"n": 154, "q": "ಯೊವಾನ್ನನ ಸ್ನಾನದೀಕ್ಷೆ ಮತ್ತು ಯೇಸುವಿನ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಹೋಲಿಸಿ.", "a": "ಯೊವಾನ್ನನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾನೆ; ಯೇಸು ಪವಿತ್ರಾತ್ಮನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುತ್ತಾರೆ", "r": "1:33"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ.”", "a": "ಬರಬೇಕಾಗಿದ್ದವರು", "r": "1:33"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವಂತೆ ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ದೇವರು, ‘ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದು ಯಾವ ವ್ಯಕ್ತಿಯ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನೀನು ನೋಡುವಿಯೋ ಆತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುವಾತ,’ ಎಂದಿದ್ದರು.”", "a": "ಪವಿತ್ರಾತ್ಮನಿಂದ", "r": "1:33"}, {"n": 157, "q": "“ಬರಬೇಕಾಗಿದ್ದವರು ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "1:33"}, {"n": 158, "q": "ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದುದನ್ನು ಕಣ್ಣಾರೆ ನೋಡಿದ ಯೊವಾನ್ನನು ಯೇಸುವನ್ನು ಕುರಿತು ಏನೆಂದು ಸಾಕ್ಷಿ ನೀಡಿದನು?", "a": "ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು", "r": "1:34"}, {"n": 159, "q": "ಯೊವಾನ್ನನು ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದುದನ್ನು ಹೇಗೆ ನೋಡಿದನು?", "a": "ಕಣ್ಣಾರೆ", "r": "1:34"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಹೇಳಿದನು.”", "a": "ನೀಡುತ್ತಿದ್ದೇನೆ", "r": "1:34"}, {"n": 161, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದುದರಿಂದ ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು …”", "a": "“… ಸಾಕ್ಷಿ ನೀಡುತ್ತಿದ್ದೇನೆ,’ ಎಂದು ಹೇಳಿದನು.”", "r": "1:34"}, {"n": 162, "q": "ಯೊವಾನ್ನ 1:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದನ್ನು ನಾನು ಕಣ್ಣಾರೆ ನೋಡಿದ್ದೇನೆ. ಆದುದರಿಂದ ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು ಸಾಕ್ಷಿ ನೀಡುತ್ತಿದ್ದೇನೆ,” ಎಂದು ಹೇಳಿದನು.", "r": "1:34"}, {"n": 163, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:35ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪ್ರಥಮ ಶಿಷ್ಯರು", "r": "1:35"}, {"n": 164, "q": "ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ಎಷ್ಟು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿದ್ದನು?", "a": "ಇಬ್ಬರು", "r": "1:35"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:35"}, {"n": 166, "q": "“ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, ಯೇಸುಸ್ವಾಮಿ ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "1:35"}, {"n": 167, "q": "ಯೊವಾನ್ನ 1:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, ಯೇಸುಸ್ವಾಮಿ ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.", "r": "1:35"}, {"n": 168, "q": "ಯೇಸುವನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಶಿಷ್ಯರಿಗೆ ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ”", "r": "1:36"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರನ್ನು ನೋಡುತ್ತಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, ‘ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ,’ ಎಂದು ಹೇಳಿದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:36"}, {"n": 170, "q": "“ಅವರನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, ‘ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ,’ ಎಂದು ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "1:36"}, {"n": 171, "q": "ಯೊವಾನ್ನ 1:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, “ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ,” ಎಂದು ಹೇಳಿದನು.", "r": "1:36"}, {"n": 172, "q": "ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿದ ಅವನ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು", "r": "1:37"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "1:37"}, {"n": 174, "q": "“ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "1:37"}, {"n": 175, "q": "ಯೊವಾನ್ನ 1:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು.", "r": "1:37"}, {"n": 176, "q": "ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸಿ ಬರುತ್ತಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಿಗೆ ಯೇಸು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಿಮಗೆ ಏನು ಬೇಕು?”", "r": "1:38"}, {"n": 177, "q": "“ನಿಮಗೆ ಏನು ಬೇಕು?” ಎಂದು ಯೇಸು ಕೇಳಿದಾಗ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ರಬ್ಬಿ, ತಾವು ವಾಸ ಮಾಡುವುದೆಲ್ಲಿ?”", "r": "1:38"}, {"n": 178, "q": "‘ರಬ್ಬಿ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಗುರುದೇವ", "r": "1:38"}, {"n": 179, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಅರ್ಥವನ್ನು ವಿವರಿಸಲಾದ ಮೂರು ಪದಗಳು ಯಾವುವು?", "a": "ರಬ್ಬಿ (ಗುರುದೇವ); ಮೆಸ್ಸೀಯ (ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ); ಕೇಫ (ಪೇತ್ರ ಇಲ್ಲವೇ ಬಂಡೆ)", "r": "1:38; 1:41–42"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸಿ ಬರುತ್ತಿರುವುದನ್ನು ನೋಡಿ, ‘ನಿಮಗೆ ಏನು ಬೇಕು?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:38"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ‘ರಬ್ಬಿ, ತಾವು ವಾಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ವಿಚಾರಿಸಿದರು.”", "a": "ಮಾಡುವುದೆಲ್ಲಿ", "r": "1:38"}, {"n": 182, "q": "“ಯೇಸುಸ್ವಾಮಿ, ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸಿ ಬರುತ್ತಿರುವುದನ್ನು ನೋಡಿ, ‘ನಿಮಗೆ ಏನು ಬೇಕು?’ ಎಂದು ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "1:38"}, {"n": 183, "q": "“ತಾವು ವಾಸ ಮಾಡುವುದೆಲ್ಲಿ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಕೊಟ್ಟ ಉತ್ತರವೇನು?", "a": "“ಬಂದು ನೋಡಿ”", "r": "1:39"}, {"n": 184, "q": "ಇಬ್ಬರು ಶಿಷ್ಯರು ಯೇಸುವಿನೊಡನೆ ದಿನ ಕಳೆಯಲು ಹೋದಾಗ ಸಮಯ ಎಷ್ಟಾಗಿತ್ತು?", "a": "ಸಾಯಂಕಾಲ ಸುಮಾರು ನಾಲ್ಕು ಗಂಟೆ", "r": "1:39"}, {"n": 185, "q": "ಯೇಸು ಇದ್ದ ಸ್ಥಳವನ್ನು ಕಂಡ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಆ ದಿನವನ್ನು ಅವರೊಡನೆ ಕಳೆದರು", "r": "1:39"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಉತ್ತರವಾಗಿ, ‘ಬಂದು ನೋಡಿ’ ಎನ್ನಲು ಅವರು ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದ ಸ್ಥಳವನ್ನು ಕಂಡು ಆ ದಿನವನ್ನು ಅವರೊಡನೆ ಕಳೆದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:39"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಸಾಯಂಕಾಲ ಸುಮಾರು ನಾಲ್ಕು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗಂಟೆಯಾಗಿತ್ತು", "r": "1:39"}, {"n": 188, "q": "“ಯೇಸು ಉತ್ತರವಾಗಿ, ‘ಬಂದು ನೋಡಿ’ ಎನ್ನಲು ಅವರು ಹೋಗಿ ಯೇಸುಸ್ವಾಮಿ ಇದ್ದ ಸ್ಥಳವನ್ನು ಕಂಡು ಆ ದಿನವನ್ನು ಅವರೊಡನೆ ಕಳೆದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "1:39"}, {"n": 189, "q": "ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು ಯಾರು?", "a": "ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು", "r": "1:40"}, {"n": 190, "q": "ಅಂದ್ರೆಯನು ಯಾರ ಸಹೋದರ?", "a": "ಸಿಮೋನ ಪೇತ್ರನ", "r": "1:40"}, {"n": 191, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಯೇಸುವಿನ ನಾಲ್ವರು ಶಿಷ್ಯರು ಯಾರು?", "a": "ಅಂದ್ರೆಯ, ಸಿಮೋನ ಪೇತ್ರ, ಫಿಲಿಪ್ಪ, ನತಾನಿಯೇಲ", "r": "1:40–49"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಿಸಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು ಒಬ್ಬನು.”", "a": "ಯೇಸುವನ್ನು", "r": "1:40"}, {"n": 193, "q": "“ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು ಒಬ್ಬನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "1:40"}, {"n": 194, "q": "ಯೊವಾನ್ನ 1:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು ಒಬ್ಬನು.", "r": "1:40"}, {"n": 195, "q": "ಅಂದ್ರೆಯನು ತನ್ನ ಸಹೋದರ ಸಿಮೋನನಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದನು?", "a": "“ನಮಗೆ ‘ಮೆಸ್ಸೀಯ’ ಸಿಕ್ಕಿದ್ದಾರೆ”", "r": "1:41"}, {"n": 196, "q": "‘ಮೆಸ್ಸೀಯ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ", "r": "1:41–42"}, {"n": 197, "q": "ಅಂದ್ರೆಯನು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ ನಂತರ ಮೊದಲು ಯಾರನ್ನು ಕಂಡನು?", "a": "ತನ್ನ ಸಹೋದರ ಸಿಮೋನನನ್ನು", "r": "1:41"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನು ಮೊದಲು ತನ್ನ ಸಹೋದರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ‘ನಮಗೆ ‘ಮೆಸ್ಸೀಯ’ ಸಿಕ್ಕಿದ್ದಾರೆ,’ ಎಂದು ತಿಳಿಸಿ”", "a": "ಸಿಮೋನನನ್ನು", "r": "1:41"}, {"n": 199, "q": "“ಇವನು ಮೊದಲು ತನ್ನ ಸಹೋದರ ಸಿಮೋನನನ್ನು ಕಂಡು, ‘ನಮಗೆ ‘ಮೆಸ್ಸೀಯ’ ಸಿಕ್ಕಿದ್ದಾರೆ,’ ಎಂದು ತಿಳಿಸಿ” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "1:41"}, {"n": 200, "q": "ಯೊವಾನ್ನ 1:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇವನು ಮೊದಲು ತನ್ನ ಸಹೋದರ ಸಿಮೋನನನ್ನು ಕಂಡು, “ನಮಗೆ ‘ಮೆಸ್ಸೀಯ’ ಸಿಕ್ಕಿದ್ದಾರೆ,” ಎಂದು ತಿಳಿಸಿ", "r": "1:41"}, {"n": 201, "q": "ಸಿಮೋನನನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದವನು ಯಾರು?", "a": "ಅಂದ್ರೆಯನು", "r": "1:42"}, {"n": 202, "q": "ಯೇಸು ಸಿಮೋನನನ್ನು ನೋಡಿ ಏನೆಂದು ನುಡಿದರು?", "a": "“ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು”", "r": "1:42"}, {"n": 203, "q": "ಸಿಮೋನನ ತಂದೆಯ ಹೆಸರೇನು?", "a": "ಯೊವಾನ್ನ", "r": "1:42"}, {"n": 204, "q": "‘ಕೇಫ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "‘ಪೇತ್ರ’ ಇಲ್ಲವೇ ‘ಬಂಡೆ’", "r": "1:42"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ, ‘ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು,’ ಎಂದು ನುಡಿದರು.”", "a": "ಸಿಮೋನನನ್ನು", "r": "1:42"}, {"n": 206, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸು ಸಿಮೋನನನ್ನು ನೋಡಿ, ‘ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, …”", "a": "“… ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು,’ ಎಂದು ನುಡಿದರು.”", "r": "1:42"}, {"n": 207, "q": "ಯೊವಾನ್ನ 1:42 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದನು. (‘ಮೆಸ್ಸೀಯ’ ಎಂದರೆ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಎಂದು ಅರ್ಥ). ಯೇಸು ಸಿಮೋನನನ್ನು ನೋಡಿ, “ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು,” ಎಂದು ನುಡಿದರು. (‘ಕೇಫ’ ಎಂದರೆ ‘ಪೇತ್ರ’ ಇಲ್ಲವೇ ‘ಬಂಡೆ’ ಎಂದರ್ಥ).", "r": "1:42"}, {"n": 208, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:43ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಫಿಲಿಪ್ಪ ಮತ್ತು ನತಾನಿಯೇಲರಿಗೆ ಕರೆ", "r": "1:43"}, {"n": 209, "q": "ಮರುದಿನ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿದರು?", "a": "ಗಲಿಲೇಯ ನಾಡಿಗೆ", "r": "1:43"}, {"n": 210, "q": "ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ಕಂಡು ಹೇಗೆ ಕರೆದರು?", "a": "“ನನ್ನೊಡನೆ ಬಾ”", "r": "1:43"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರುದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಲಿಲೇಯ ನಾಡಿಗೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:43"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ‘ನನ್ನೊಡನೆ ಬಾ,’ ಎಂದು ಕರೆದರು.”", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "1:43"}, {"n": 213, "q": "“ಮರುದಿನ ಯೇಸುಸ್ವಾಮಿ ಗಲಿಲೇಯ ನಾಡಿಗೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "1:43"}, {"n": 214, "q": "ಫಿಲಿಪ್ಪನು ಯಾವ ಊರಿನವನು?", "a": "ಬೆತ್ಸಾಯಿದ", "r": "1:44"}, {"n": 215, "q": "ಫಿಲಿಪ್ಪನಂತೆ ಬೆತ್ಸಾಯಿದ ಊರಿನವರಾದ ಇನ್ನಿಬ್ಬರು ಯಾರು?", "a": "ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರ", "r": "1:44"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದ್ರೆಯ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.”", "a": "ಪೇತ್ರನಂತೆ", "r": "1:44"}, {"n": 217, "q": "“ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರನಂತೆ ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "1:44"}, {"n": 218, "q": "ಯೊವಾನ್ನ 1:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರನಂತೆ ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.", "r": "1:44"}, {"n": 219, "q": "ಫಿಲಿಪ್ಪನು ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾರಿಗೆ ತಿಳಿಸಿದನು?", "a": "ನತಾನಿಯೇಲನಿಗೆ", "r": "1:45"}, {"n": 220, "q": "ಫಿಲಿಪ್ಪನು ನತಾನಿಯೇಲನಿಗೆ ಯೇಸುವನ್ನು ಹೇಗೆ ಪರಿಚಯಿಸಿದನು?", "a": "“ಇವರೇ ಜೋಸೆಫನ ಮಗನಾದ ನಜರೇತ್ ಊರಿನ ಯೇಸು”", "r": "1:45"}, {"n": 221, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಯಾರು ಉಲ್ಲೇಖಿಸಿದ ವ್ಯಕ್ತಿ ತಮಗೆ ಸಿಕ್ಕಿದ್ದಾರೆಂದು ಫಿಲಿಪ್ಪನು ಹೇಳಿದನು?", "a": "ಮೋಶೆ (ಮತ್ತು ಪ್ರವಾದಿಗಳು)", "r": "1:45"}, {"n": 222, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಯೇಸು ಯಾರ ಮಗ?", "a": "ಜೋಸೆಫನ ಮಗ", "r": "1:45"}, {"n": 223, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಯೇಸು ಯಾವ ಊರಿನವರು?", "a": "ನಜರೇತ್", "r": "1:45"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಫಿಲಿಪ್ಪನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ‘ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಮೋಶೆ ಉಲ್ಲೇಖಿಸಿದ ಮತ್ತು ಪ್ರವಾದಿಗಳು ಪ್ರವಚನ ಮಾಡಿದ ವ್ಯಕ್ತಿಯು ನಮಗೆ ಸಿಕ್ಕಿದ್ದಾರೆ.”", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:45"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದ ನಜರೇತ್ ಊರಿನ ಯೇಸು,’ ಎಂದು ಹೇಳಿದನು.”", "a": "ಜೋಸೆಫನ", "r": "1:45"}, {"n": 226, "q": "“ಫಿಲಿಪ್ಪನು ನತಾನಿಯೇಲನನ್ನು ಕಂಡು, ‘ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಮೋಶೆ ಉಲ್ಲೇಖಿಸಿದ ಮತ್ತು ಪ್ರವಾದಿಗಳು ಪ್ರವಚನ ಮಾಡಿದ ವ್ಯಕ್ತಿಯು ನಮಗೆ ಸಿಕ್ಕಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "1:45"}, {"n": 227, "q": "ನಜರೇತಿನ ಬಗ್ಗೆ ನತಾನಿಯೇಲನು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಏನು? ನಜರೇತಿನಿಂದ ಒಳ್ಳೆಯದೇನಾದರೂ ಬರುವುದು ಉಂಟೆ?”", "r": "1:46"}, {"n": 228, "q": "ನತಾನಿಯೇಲನ ಸಂಶಯಕ್ಕೆ ಫಿಲಿಪ್ಪನು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ಬಂದು ನೀನೇ ನೋಡು”", "r": "1:46"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಜರೇತಿನಿಂದ ಒಳ್ಳೆಯದೇನಾದರೂ ಬರುವುದು ಉಂಟೆ?’ ಎಂದು ಕೇಳಲು, ‘ಬಂದು ನೀನೇ ನೋಡು,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಫಿಲಿಪ್ಪನು", "r": "1:46"}, {"n": 230, "q": "“ನಜರೇತಿನಿಂದ ಒಳ್ಳೆಯದೇನಾದರೂ ಬರುವುದು ಉಂಟೆ?’ ಎಂದು ಕೇಳಲು, ‘ಬಂದು ನೀನೇ ನೋಡು,’ ಎಂದು ಫಿಲಿಪ್ಪನು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "1:46"}, {"n": 231, "q": "ಯೊವಾನ್ನ 1:46 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನತಾನಿಯೇಲನು, “ಏನು? ನಜರೇತಿನಿಂದ ಒಳ್ಳೆಯದೇನಾದರೂ ಬರುವುದು ಉಂಟೆ?” ಎಂದು ಕೇಳಲು, “ಬಂದು ನೀನೇ ನೋಡು,” ಎಂದು ಫಿಲಿಪ್ಪನು ಉತ್ತರಕೊಟ್ಟನು.", "r": "1:46"}, {"n": 232, "q": "ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ ನತಾನಿಯೇಲನನ್ನು ಕಂಡು ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ”", "r": "1:47"}, {"n": 233, "q": "ಯೇಸು ಯಾರನ್ನು “ನಿಜವಾದ ಇಸ್ರಯೇಲನು” ಎಂದು ಕರೆದರು?", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:47"}, {"n": 234, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನತಾನಿಯೇಲನಲ್ಲಿ ಏನಿಲ್ಲ?", "a": "ಕಪಟವಿಲ್ಲ", "r": "1:47"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡ ಯೇಸು, ‘ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ,’ ಎಂದು ನುಡಿದರು.”", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:47"}, {"n": 236, "q": "“ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ ನತಾನಿಯೇಲನನ್ನು ಕಂಡ ಯೇಸು, ‘ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ,’ ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "1:47"}, {"n": 237, "q": "ಯೊವಾನ್ನ 1:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ ನತಾನಿಯೇಲನನ್ನು ಕಂಡ ಯೇಸು, “ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ,” ಎಂದು ನುಡಿದರು.", "r": "1:47"}, {"n": 238, "q": "ನತಾನಿಯೇಲನು ಯೇಸುವನ್ನು ಏನೆಂದು ಕೇಳಿದನು?", "a": "“ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?”", "r": "1:48"}, {"n": 239, "q": "ಫಿಲಿಪ್ಪನು ಕರೆಯುವ ಮೊದಲೇ ನತಾನಿಯೇಲನು ಎಲ್ಲಿದ್ದಾಗ ಯೇಸು ಅವನನ್ನು ಕಂಡರು?", "a": "ಅಂಜೂರದ ಮರದಡಿ", "r": "1:48"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?’ ಎಂದು ಕೇಳಲು ಯೇಸು, ‘ಫಿಲಿಪ್ಪನು ನಿನ್ನನ್ನು ಕರೆಯುವ ಮೊದಲೇ ನೀನು ಅಂಜೂರದ ಮರದಡಿ ಇದ್ದಾಗ ನಾನು ನಿನ್ನನ್ನು ಕಂಡೆ,’ ಎಂದು ಉತ್ತರ ಕೊಟ್ಟರು.”", "a": "ನತಾನಿಯೇಲನು", "r": "1:48"}, {"n": 241, "q": "“ನತಾನಿಯೇಲನು, ‘ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?’ ಎಂದು ಕೇಳಲು ಯೇಸು, ‘ಫಿಲಿಪ್ಪನು ನಿನ್ನನ್ನು ಕರೆಯುವ ಮೊದಲೇ ನೀನು ಅಂಜೂರದ ಮರದಡಿ ಇದ್ದಾಗ ನಾನು ನಿನ್ನನ್ನು ಕಂಡೆ,’ ಎಂದು ಉತ್ತರ ಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "1:48"}, {"n": 242, "q": "ಯೊವಾನ್ನ 1:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನತಾನಿಯೇಲನು, “ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?” ಎಂದು ಕೇಳಲು ಯೇಸು, “ಫಿಲಿಪ್ಪನು ನಿನ್ನನ್ನು ಕರೆಯುವ ಮೊದಲೇ ನೀನು ಅಂಜೂರದ ಮರದಡಿ ಇದ್ದಾಗ ನಾನು ನಿನ್ನನ್ನು ಕಂಡೆ,” ಎಂದು ಉತ್ತರ ಕೊಟ್ಟರು.", "r": "1:48"}, {"n": 243, "q": "ನತಾನಿಯೇಲನು ಯೇಸುವನ್ನು ಕುರಿತು ಮಾಡಿದ ಅರಿಕೆ ಏನು?", "a": "“ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ; ಇಸ್ರಯೇಲರ ಅರಸ ನೀವೇ”", "r": "1:49"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ‘ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ;”", "a": "ನತಾನಿಯೇಲನು", "r": "1:49"}, {"n": 245, "q": "“ಅದಕ್ಕೆ ನತಾನಿಯೇಲನು ‘ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "1:49"}, {"n": 246, "q": "ಯೊವಾನ್ನ 1:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನತಾನಿಯೇಲನು “ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ; ಇಸ್ರಯೇಲರ ಅರಸ ನೀವೇ,” ಎಂದನು.", "r": "1:49"}, {"n": 247, "q": "ನತಾನಿಯೇಲನ ವಿಶ್ವಾಸಕ್ಕೆ ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ? ಇದಕ್ಕೂ ಮಿಗಿಲಾದುವುಗಳನ್ನು ನೀನು ಕಾಣುವೆ”", "r": "1:50"}, {"n": 248, "q": "ನತಾನಿಯೇಲನು ಏನನ್ನು ಕಾಣುವನೆಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಇದಕ್ಕೂ ಮಿಗಿಲಾದುವುಗಳನ್ನು", "r": "1:50"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ?”", "a": "ಯೇಸು", "r": "1:50"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಕ್ಕೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಕಾಣುವೆ,’ ಎಂದು ನುಡಿದರು.”", "a": "ಮಿಗಿಲಾದುವುಗಳನ್ನು", "r": "1:50"}, {"n": 251, "q": "“ಆಗ ಯೇಸು, ‘ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 50", "r": "1:50"}, {"n": 252, "q": "ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ದೇವದೂತರು ಯಾರ ಮುಖಾಂತರ ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ಶಿಷ್ಯರು ಕಾಣುವರು?", "a": "ನರಪುತ್ರನ ಮುಖಾಂತರ", "r": "1:51"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೇಸು ಸತ್ಯವಾಗಿ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ”", "r": "1:51"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ತೆರೆದಿರುವುದನ್ನೂ", "r": "1:51"}, {"n": 255, "q": "“ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ,’ ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "1:51"}, {"n": 256, "q": "ಯೊವಾನ್ನ 1:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತಮ್ಮ ಮಾತನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ,” ಎಂದು ಹೇಳಿದರು.", "r": "1:51"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
