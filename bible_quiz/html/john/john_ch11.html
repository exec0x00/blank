a": "ವಚನ 2", "r": "11:2"}, {"n": 13, "q": "ಸಹೋದರಿಯರು ಯೇಸುವಿಗೆ ಏನೆಂದು ಹೇಳಿಕಳುಹಿಸಿದರು?", "a": "“ಪ್ರಭುವೇ, ನಿಮ್ಮ ಆಪ್ತಮಿತ್ರನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದಾನೆ”", "r": "11:3"}, {"n": 14, "q": "ಸಹೋದರಿಯರು ಲಾಸರನನ್ನು ಯೇಸುವಿನ ಏನೆಂದು ಕರೆದರು?", "a": "ಆಪ್ತಮಿತ್ರ", "r": "11:3"}, {"n": 15, "q": "ಲಾಸರನ ಕಾಯಿಲೆಯ ಸುದ್ದಿಯನ್ನು ಯೇಸುವಿಗೆ ಹೇಳಿಕಳುಹಿಸಿದವರು ಯಾರು?", "a": "ಅವನ ಸಹೋದರಿಯರು (ಮಾರ್ತ ಮತ್ತು ಮರಿಯ)", "r": "11:3"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸಹೋದರಿಯರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಪ್ರಭುವೇ, ನಿಮ್ಮ ಆಪ್ತಮಿತ್ರನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದಾನೆ,’ ಎಂದು ಹೇಳಿಕಳುಹಿಸಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಗೆ", "r": "11:3"}, {"n": 17, "q": "“ಈ ಸಹೋದರಿಯರು, ಯೇಸುಸ್ವಾಮಿಗೆ, ‘ಪ್ರಭುವೇ, ನಿಮ್ಮ ಆಪ್ತಮಿತ್ರನು ಅಸ್ವಸ್ಥನಾಗಿದ್ದಾನೆ,’ ಎಂದು ಹೇಳಿಕಳುಹಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "11:3"}, {"n": 18, "q": "ಲಾಸರನ ಕಾಯಿಲೆಯ ಬಗ್ಗೆ ಕೇಳಿದ ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ಈ ಕಾಯಿಲೆ ಮರಣಕ್ಕಾಗಿ ಬಂದುದಲ್ಲ, ದೇವರ ಮಹಿಮೆಗೋಸ್ಕರ ಬಂದಿದೆ.”", "r": "11:4"}, {"n": 19, "q": "ಲಾಸರನ ಕಾಯಿಲೆಯ ಮೂಲಕ ಯಾರಿಗೆ ಮಹಿಮೆ ಉಂಟಾಗಲಿದೆ?", "a": "ದೇವರ ಪುತ್ರನಿಗೆ", "r": "11:4"}, {"n": 20, "q": "ಹನ್ನೊಂದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ದೇವರ ಮಹಿಮೆ’ಯನ್ನು ಉಲ್ಲೇಖಿಸುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "11:4 (ಕಾಯಿಲೆ ದೇವರ ಮಹಿಮೆಗೋಸ್ಕರ) ಮತ್ತು 11:40 (ವಿಶ್ವಾಸವಿದ್ದಲ್ಲಿ ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣುವೆ)", "r": "11:4; 11:40"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈ ಕಾಯಿಲೆ ಮರಣಕ್ಕಾಗಿ ಬಂದುದಲ್ಲ, ದೇವರ ಮಹಿಮೆಗೋಸ್ಕರ ಬಂದಿದೆ.”", "a": "ಯೇಸು", "r": "11:4"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರ ಮೂಲಕ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಿಮೆ ಉಂಟಾಗಲಿದೆ,’ ಎಂದು ನುಡಿದರು.”", "a": "ಪುತ್ರನಿಗೆ", "r": "11:4"}, {"n": 23, "q": "ಯೇಸುವಿಗೆ ಅಚ್ಚುಮೆಚ್ಚಿನವರಾದ ಮೂವರು ಯಾರು?", "a": "ಮಾರ್ತ, ಮರಿಯ ಮತ್ತು ಲಾಸರ", "r": "11:5"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರ್ತ, ಅವಳ ಸಹೋದರಿ ಮರಿಯ ಮತ್ತು ಲಾಸರ, ಇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಚ್ಚುಮೆಚ್ಚಿನವರು.”", "a": "ಯೇಸುವಿಗೆ", "r": "11:5"}, {"n": 25, "q": "“ಮಾರ್ತ, ಅವಳ ಸಹೋದರಿ ಮರಿಯ ಮತ್ತು ಲಾಸರ, ಇವರು ಯೇಸುವಿಗೆ ಅಚ್ಚುಮೆಚ್ಚಿನವರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "11:5"}, {"n": 26, "q": "ಯೊವಾನ್ನ 11:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಾರ್ತ, ಅವಳ ಸಹೋದರಿ ಮರಿಯ ಮತ್ತು ಲಾಸರ, ಇವರು ಯೇಸುವಿಗೆ ಅಚ್ಚುಮೆಚ್ಚಿನವರು.", "r": "11:5"}, {"n": 27, "q": "ಲಾಸರನ ಕಾಯಿಲೆಯ ಸುದ್ದಿ ಕೇಳಿದ ಮೇಲೂ ಯೇಸು ಎಷ್ಟು ದಿನ ತಾವಿದ್ದಲ್ಲಿಯೇ ಉಳಿದರು?", "a": "ಇನ್ನೂ ಎರಡು ದಿನ", "r": "11:6"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಯಿಲೆಯ ಸುದ್ದಿಯನ್ನು ಕೇಳಿದ ಮೇಲೂ ಯೇಸು ತಾವಿದ್ದಲ್ಲಿಯೇ ಇನ್ನೂ ಎರಡು ದಿನ ಉಳಿದುಕೊಂಡರು.”", "a": "ಲಾಸರನ", "r": "11:6"}, {"n": 29, "q": "“ಲಾಸರನ ಕಾಯಿಲೆಯ ಸುದ್ದಿಯನ್ನು ಕೇಳಿದ ಮೇಲೂ ಯೇಸು ತಾವಿದ್ದಲ್ಲಿಯೇ ಇನ್ನೂ ಎರಡು ದಿನ ಉಳಿದುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "11:6"}, {"n": 30, "q": "ಯೊವಾನ್ನ 11:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಲಾಸರನ ಕಾಯಿಲೆಯ ಸುದ್ದಿಯನ್ನು ಕೇಳಿದ ಮೇಲೂ ಯೇಸು ತಾವಿದ್ದಲ್ಲಿಯೇ ಇನ್ನೂ ಎರಡು ದಿನ ಉಳಿದುಕೊಂಡರು.", "r": "11:6"}, {"n": 31, "q": "ಎರಡು ದಿನಗಳ ನಂತರ ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಏನೆಂದರು?", "a": "“ಬನ್ನಿ, ಜುದೇಯಕ್ಕೆ ಮರಳಿ ಹೋಗೋಣ”", "r": "11:7"}, {"n": 32, "q": "ಎರಡು ದಿನಗಳ ನಂತರ ಯೇಸು ಎಲ್ಲಿಗೆ ಮರಳಿ ಹೋಗೋಣ ಎಂದರು?", "a": "ಜುದೇಯಕ್ಕೆ", "r": "11:7"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಬನ್ನಿ, ಜುದೇಯಕ್ಕೆ ಮರಳಿ ಹೋಗೋಣ,’ ಎಂದರು.”", "a": "ಶಿಷ್ಯರಿಗೆ", "r": "11:7"}, {"n": 34, "q": "“ಅನಂತರ ತಮ್ಮ ಶಿಷ್ಯರಿಗೆ, ‘ಬನ್ನಿ, ಜುದೇಯಕ್ಕೆ ಮರಳಿ ಹೋಗೋಣ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "11:7"}, {"n": 35, "q": "ಯೊವಾನ್ನ 11:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅನಂತರ ತಮ್ಮ ಶಿಷ್ಯರಿಗೆ, “ಬನ್ನಿ, ಜುದೇಯಕ್ಕೆ ಮರಳಿ ಹೋಗೋಣ,” ಎಂದರು.", "r": "11:7"}, {"n": 36, "q": "ಜುದೇಯಕ್ಕೆ ಹೋಗುವುದರ ಬಗ್ಗೆ ಶಿಷ್ಯರು ಏಕೆ ಆತಂಕಪಟ್ಟರು?", "a": "ಇತ್ತೀಚೆಗೆ ತಾನೆ ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಕಲ್ಲಿನಿಂದ ಹೊಡೆಯಬೇಕೆಂದಿದ್ದರು", "r": "11:8"}, {"n": 37, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು (11:8)?", "a": "“ಗುರುದೇವಾ”", "r": "11:8"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಶಿಷ್ಯರು, ‘ಗುರುದೇವಾ, ಇತ್ತೀಚೆಗೆ ತಾನೆ ಯೆಹೂದ್ಯರು ನಿಮ್ಮನ್ನು ಕಲ್ಲಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೊಡೆಯಬೇಕೆಂದಿದ್ದರು", "r": "11:8"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ ಅಲ್ಲಿಗೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಹೋಗಬೇಕೆಂದಿರುವಿರಾ", "r": "11:8"}, {"n": 40, "q": "“ಆ ಶಿಷ್ಯರು, ‘ಗುರುದೇವಾ, ಇತ್ತೀಚೆಗೆ ತಾನೆ ಯೆಹೂದ್ಯರು ನಿಮ್ಮನ್ನು ಕಲ್ಲಿನಿಂದ ಹೊಡೆಯಬೇಕೆಂದಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "11:8"}, {"n": 41, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಹಗಲಿಗೆ ಎಷ್ಟು ತಾಸು ಉಂಟು?", "a": "ಹನ್ನೆರಡು ತಾಸು", "r": "11:9"}, {"n": 42, "q": "ಹಗಲಿನಲ್ಲಿ ನಡೆಯುವವನು ಏಕೆ ಎಡವಿ ಬೀಳುವುದಿಲ್ಲ?", "a": "ಈ ಲೋಕದ ಬೆಳಕು ಅವನಿಗೆ ಕಾಣಿಸುತ್ತದೆ", "r": "11:9"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಹಗಲಿಗೆ ಹನ್ನೆರಡು ತಾಸು ಉಂಟಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "11:9"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ ಈ ಲೋಕದ ಬೆಳಕು ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಿಸುತ್ತದೆ", "r": "11:9"}, {"n": 45, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ‘ಹಗಲಿಗೆ ಹನ್ನೆರಡು ತಾಸು ಉಂಟಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "11:9"}, {"n": 46, "q": "ರಾತ್ರಿಯಲ್ಲಿ ನಡೆಯುವವನು ಏಕೆ ಎಡವಿ ಬೀಳುತ್ತಾನೆ?", "a": "ಅವನಲ್ಲಿ ಬೆಳಕು ಇಲ್ಲ", "r": "11:10"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಯುವವನು ಎಡವಿ ಬೀಳುತ್ತಾನೆ.”", "a": "ರಾತ್ರಿಯಲ್ಲಿ", "r": "11:10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಕು ಇಲ್ಲ,’ ಎಂದರು.”", "a": "ಅವನಲ್ಲಿ", "r": "11:10"}, {"n": 49, "q": "“ಆದರೆ ರಾತ್ರಿಯಲ್ಲಿ ನಡೆಯುವವನು ಎಡವಿ ಬೀಳುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "11:10"}, {"n": 50, "q": "ಯೇಸು ಲಾಸರನ ಸ್ಥಿತಿಯನ್ನು ಶಿಷ್ಯರಿಗೆ ಮೊದಲು ಹೇಗೆ ವರ್ಣಿಸಿದರು?", "a": "“ನಮ್ಮ ಮಿತ್ರನಾದ ಲಾಸರನು ನಿದ್ರೆ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಅವನನ್ನು ಎಬ್ಬಿಸಲು ನಾನು ಹೋಗಬೇಕು”", "r": "11:11"}, {"n": 51, "q": "ಯೇಸು ಲಾಸರನನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ನಮ್ಮ ಮಿತ್ರ", "r": "11:11"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಳಿಕ ಯೇಸು, ‘ನಮ್ಮ ಮಿತ್ರನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿದ್ರೆ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಅವನನ್ನು ಎಬ್ಬಿಸಲು ನಾನು ಹೋಗಬೇಕು,’ ಎಂದು ನುಡಿದರು.”", "a": "ಲಾಸರನು", "r": "11:11"}, {"n": 53, "q": "“ಬಳಿಕ ಯೇಸು, ‘ನಮ್ಮ ಮಿತ್ರನಾದ ಲಾಸರನು ನಿದ್ರೆ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಅವನನ್ನು ಎಬ್ಬಿಸಲು ನಾನು ಹೋಗಬೇಕು,’ ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "11:11"}, {"n": 54, "q": "ಯೊವಾನ್ನ 11:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬಳಿಕ ಯೇಸು, “ನಮ್ಮ ಮಿತ್ರನಾದ ಲಾಸರನು ನಿದ್ರೆ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಅವನನ್ನು ಎಬ್ಬಿಸಲು ನಾನು ಹೋಗಬೇಕು,” ಎಂದು ನುಡಿದರು.", "r": "11:11"}, {"n": 55, "q": "ಲಾಸರನ ನಿದ್ರೆಯ ಬಗ್ಗೆ ಶಿಷ್ಯರು ಏನೆಂದರು?", "a": "“ಪ್ರಭುವೇ, ಅವನು ನಿದ್ರೆ ಮಾಡುತ್ತಿರುವನಾದರೆ ಚೇತರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ”", "r": "11:12"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು, ‘ಪ್ರಭುವೇ, ಅವನು ನಿದ್ರೆ ಮಾಡುತ್ತಿರುವನಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದರು.”", "a": "ಚೇತರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "11:12"}, {"n": 57, "q": "“ಶಿಷ್ಯರು, ‘ಪ್ರಭುವೇ, ಅವನು ನಿದ್ರೆ ಮಾಡುತ್ತಿರುವನಾದರೆ ಚೇತರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "11:12"}, {"n": 58, "q": "ಯೊವಾನ್ನ 11:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು, “ಪ್ರಭುವೇ, ಅವನು ನಿದ್ರೆ ಮಾಡುತ್ತಿರುವನಾದರೆ ಚೇತರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ,” ಎಂದರು.", "r": "11:12"}, {"n": 59, "q": "ಯೇಸು ಹೇಳಿದ ‘ನಿದ್ರೆ’ ಮತ್ತು ಶಿಷ್ಯರು ತಿಳಿದುಕೊಂಡ ‘ನಿದ್ರೆ’ಗೆ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಯೇಸು ಹೇಳಿದ್ದು ಲಾಸರನ ಮರಣವನ್ನು ಕುರಿತು; ಶಿಷ್ಯರು ಅದನ್ನು ಸಾಮಾನ್ಯ ನಿದ್ರೆಯೆಂದು ತಿಳಿದುಕೊಂಡರು", "r": "11:13"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು ಅವನ ಮರಣವನ್ನು ಕುರಿತು.”", "a": "ಯೇಸು", "r": "11:13"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರಾದರೋ ಅದು ಸಾಮಾನ್ಯ ನಿದ್ರೆಯೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿದುಕೊಂಡರು", "r": "11:13"}, {"n": 62, "q": "“ಯೇಸು ಹೇಳಿದ್ದು ಅವನ ಮರಣವನ್ನು ಕುರಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "11:13"}, {"n": 63, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಲಾಸರನ ಬಗ್ಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಏನು ಹೇಳಿದರು?", "a": "“ಲಾಸರನು ಸತ್ತು ಹೋಗಿದ್ದಾನೆ”", "r": "11:14"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಯೇಸು ಅವರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ತು ಹೋಗಿದ್ದಾನೆ;”", "a": "ಲಾಸರನು", "r": "11:14"}, {"n": 65, "q": "“ಆದುದರಿಂದ ಯೇಸು ಅವರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ, ‘ಲಾಸರನು ಸತ್ತು ಹೋಗಿದ್ದಾನೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "11:14"}, {"n": 66, "q": "ಯೊವಾನ್ನ 11:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದ ಯೇಸು ಅವರಿಗೆ ಸ್ಪಷ್ಟವಾಗಿ, “ಲಾಸರನು ಸತ್ತು ಹೋಗಿದ್ದಾನೆ;", "r": "11:14"}, {"n": 67, "q": "ಯೇಸು ಅಲ್ಲಿ ಇಲ್ಲದೆ ಹೋದದ್ದು ಶಿಷ್ಯರಿಗೆ ಏಕೆ ಒಳ್ಳೆಯದಾಯಿತು?", "a": "ಶಿಷ್ಯರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡುವಂತೆ", "r": "11:15"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅಲ್ಲಿ ಇಲ್ಲದೆ ಹೋದದ್ದು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಯಿತು.”", "a": "ಒಳ್ಳೆಯದೇ", "r": "11:15"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸ ಮೂಡುವಂತೆ ಇದೆಲ್ಲಾ ನಡೆದಿದೆ.”", "a": "ನನ್ನಲ್ಲಿ", "r": "11:15"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನ ಬಳಿಗೆ ಹೋಗೋಣ,’ ಎಂದರು.”", "a": "ಬನ್ನಿ", "r": "11:15"}, {"n": 71, "q": "ತೋಮನಿಗಿದ್ದ ಇನ್ನೊಂದು ಹೆಸರೇನು?", "a": "ದಿದುಮ", "r": "11:16"}, {"n": 72, "q": "ತೋಮನು ತನ್ನ ಜೊತೆ ಶಿಷ್ಯರಿಗೆ ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ನಾವು ಕೂಡ ಪ್ರಭುವಿನೊಡನೆ ಹೋಗಿ ಸಾಯೋಣ”", "r": "11:16"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ದಿದುಮನೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಜೊತೆ ಶಿಷ್ಯರಿಗೆ, ‘ನಾವು ಕೂಡ ಪ್ರಭುವಿನೊಡನೆ ಹೋಗಿ ಸಾಯೋಣ,’ ಎಂದು ಹೇಳಿದನು.”", "a": "ತೋಮನು", "r": "11:16"}, {"n": 74, "q": "“ಆಗ ದಿದುಮನೆಂಬ ತೋಮನು ತನ್ನ ಜೊತೆ ಶಿಷ್ಯರಿಗೆ, ‘ನಾವು ಕೂಡ ಪ್ರಭುವಿನೊಡನೆ ಹೋಗಿ ಸಾಯೋಣ,’ ಎಂದು ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "11:16"}, {"n": 75, "q": "ಯೊವಾನ್ನ 11:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ದಿದುಮನೆಂಬ ತೋಮನು ತನ್ನ ಜೊತೆ ಶಿಷ್ಯರಿಗೆ, “ನಾವು ಕೂಡ ಪ್ರಭುವಿನೊಡನೆ ಹೋಗಿ ಸಾಯೋಣ,” ಎಂದು ಹೇಳಿದನು.", "r": "11:16"}, {"n": 76, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 11:17ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನಾನೇ ಪುನರುತ್ಥಾನ; ನಾನೇ ಜೀವ!", "r": "11:17"}, {"n": 77, "q": "ಯೇಸು ಬೆಥಾನಿಯಕ್ಕೆ ಬಂದಾಗ ಲಾಸರನನ್ನು ಸಮಾಧಿಯಲ್ಲಿ ಹೂಳಿಟ್ಟು ಎಷ್ಟು ದಿನಗಳಾಗಿದ್ದವು?", "a": "ನಾಲ್ಕು ದಿನಗಳು", "r": "11:17"}, {"n": 78, "q": "ಹನ್ನೊಂದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಲಾಸರನು ಸತ್ತು ನಾಲ್ಕು ದಿನಗಳಾಗಿದ್ದವೆಂದು ಹೇಳುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "11:17 ಮತ್ತು 11:39", "r": "11:17; 11:39"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಗೆ ಬಂದಾಗ ಲಾಸರನನ್ನು ಸಮಾಧಿಯಲ್ಲಿ ಹೂಳಿಟ್ಟು ಆಗಾಗಲೇ ನಾಲ್ಕು ದಿನಗಳಾಗಿದ್ದುವೆಂದು ತಿಳಿಯಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "11:17"}, {"n": 80, "q": "“ಯೇಸುಸ್ವಾಮಿ ಅಲ್ಲಿಗೆ ಬಂದಾಗ ಲಾಸರನನ್ನು ಸಮಾಧಿಯಲ್ಲಿ ಹೂಳಿಟ್ಟು ಆಗಾಗಲೇ ನಾಲ್ಕು ದಿನಗಳಾಗಿದ್ದುವೆಂದು ತಿಳಿಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "11:17"}, {"n": 81, "q": "ಬೆಥಾನಿಯ ಜೆರುಸಲೇಮಿನಿಂದ ಎಷ್ಟು ದೂರದಲ್ಲಿದೆ?", "a": "ಸುಮಾರು ಮೂರು ಕಿಲೊಮೀಟರು", "r": "11:18"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿನಿಂದ ಸುಮಾರು ಮೂರು ಕಿಲೊಮೀಟರು ದೂರದಲ್ಲಿದೆ.”", "a": "ಬೆಥಾನಿಯ", "r": "11:18"}, {"n": 83, "q": "“ಬೆಥಾನಿಯ ಜೆರುಸಲೇಮಿನಿಂದ ಸುಮಾರು ಮೂರು ಕಿಲೊಮೀಟರು ದೂರದಲ್ಲಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "11:18"}, {"n": 84, "q": "ಯೊವಾನ್ನ 11:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬೆಥಾನಿಯ ಜೆರುಸಲೇಮಿನಿಂದ ಸುಮಾರು ಮೂರು ಕಿಲೊಮೀಟರು ದೂರದಲ್ಲಿದೆ.", "r": "11:18"}, {"n": 85, "q": "ಅನೇಕ ಯೆಹೂದ್ಯರು ಮಾರ್ತ ಮತ್ತು ಮರಿಯರ ಬಳಿಗೆ ಏಕೆ ಬಂದಿದ್ದರು?", "a": "ಅವರ ಸೋದರನ ಮರಣಕ್ಕಾಗಿ ಸಂತಾಪ ಸೂಚಿಸಲು", "r": "11:19"}, {"n": 86, "q": "ಮಾರ್ತ ಮತ್ತು ಮರಿಯರಿಗೆ ಸಂತಾಪ ಸೂಚಿಸಲು ಬಂದವರು ಯಾರು?", "a": "ಅನೇಕ ಯೆಹೂದ್ಯರು", "r": "11:19"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನೇಕ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರಿಯಳನ್ನೂ ಕಂಡು ಅವರ ಸೋದರನ ಮರಣಕ್ಕಾಗಿ ಸಂತಾಪ ಸೂಚಿಸಲು ಬಂದಿದ್ದರು.”", "a": "ಮಾರ್ತಳನ್ನೂ", "r": "11:19"}, {"n": 88, "q": "“ಅನೇಕ ಯೆಹೂದ್ಯರು ಮಾರ್ತಳನ್ನೂ ಮರಿಯಳನ್ನೂ ಕಂಡು ಅವರ ಸೋದರನ ಮರಣಕ್ಕಾಗಿ ಸಂತಾಪ ಸೂಚಿಸಲು ಬಂದಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "11:19"}, {"n": 89, "q": "ಯೊವಾನ್ನ 11:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅನೇಕ ಯೆಹೂದ್ಯರು ಮಾರ್ತಳನ್ನೂ ಮರಿಯಳನ್ನೂ ಕಂಡು ಅವರ ಸೋದರನ ಮರಣಕ್ಕಾಗಿ ಸಂತಾಪ ಸೂಚಿಸಲು ಬಂದಿದ್ದರು.", "r": "11:19"}, {"n": 90, "q": "ಯೇಸು ಬರುತ್ತಿದ್ದಾರೆಂದು ಕೇಳಿದಾಗ ಮಾರ್ತ ಮತ್ತು ಮರಿಯ ಏನು ಮಾಡಿದರು?", "a": "ಮಾರ್ತ ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋದಳು; ಮರಿಯ ಮನೆಯಲ್ಲೇ ಇದ್ದಳು", "r": "11:20"}, {"n": 91, "q": "ಯೇಸು ಬಂದಾಗ ಮರಿಯ ಎಲ್ಲಿದ್ದಳು?", "a": "ಮನೆಯಲ್ಲೇ", "r": "11:20"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಬರುತ್ತಿದ್ದಾರೆಂದು ಕೇಳಿದೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋದಳು.”", "a": "ಮಾರ್ತ", "r": "11:20"}, {"n": 93, "q": "“ಯೇಸು ಬರುತ್ತಿದ್ದಾರೆಂದು ಕೇಳಿದೊಡನೆ ಮಾರ್ತ ಅವರನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "11:20"}, {"n": 94, "q": "ಯೊವಾನ್ನ 11:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಬರುತ್ತಿದ್ದಾರೆಂದು ಕೇಳಿದೊಡನೆ ಮಾರ್ತ ಅವರನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋದಳು. ಮರಿಯ ಮನೆಯಲ್ಲೇ ಇದ್ದಳು.", "r": "11:20"}, {"n": 95, "q": "ಮಾರ್ತ ಯೇಸುವನ್ನು ಕಂಡು ಮೊದಲು ಏನೆಂದಳು?", "a": "‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರ ಸಾಯುತ್ತಿರಲಿಲ್ಲ.", "r": "11:21"}, {"n": 96, "q": "“ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ…” ಎಂದು ಆರಂಭಿಸಿ ಸಹೋದರನ ಮರಣದ ಬಗ್ಗೆ ಯೇಸುವಿಗೆ ಹೇಳಿದ ಇಬ್ಬರು ಯಾರು?", "a": "ಮಾರ್ತ (11:21) ಮತ್ತು ಮರಿಯ (11:32)", "r": "11:21; 11:32"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರ ಸಾಯುತ್ತಿರಲಿಲ್ಲ.”", "a": "ಯೇಸುವನ್ನು", "r": "11:21"}, {"n": 98, "q": "“ಮಾರ್ತ ಯೇಸುವನ್ನು ಕಂಡು, ‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರ ಸಾಯುತ್ತಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "11:21"}, {"n": 99, "q": "ಯೊವಾನ್ನ 11:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಾರ್ತ ಯೇಸುವನ್ನು ಕಂಡು, ‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರ ಸಾಯುತ್ತಿರಲಿಲ್ಲ.", "r": "11:21"}, {"n": 100, "q": "ಮಾರ್ತಳಿಗೆ ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾವ ವಿಶ್ವಾಸವಿತ್ತು?", "a": "ಯೇಸು ದೇವರಲ್ಲಿ ಏನೇ ಕೇಳಿಕೊಂಡರೂ ದೇವರು ಅವರಿಗೆ ನೀಡುವರೆಂದು", "r": "11:22"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗಲೂ ದೇವರಲ್ಲಿ ನೀವು ಏನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗವರು ನೀಡುವರೆಂದು ನಾನು ಬಲ್ಲೆ,’ ಎಂದಳು.”", "a": "ಕೇಳಿಕೊಂಡರೂ", "r": "11:22"}, {"n": 102, "q": "“ಈಗಲೂ ದೇವರಲ್ಲಿ ನೀವು ಏನೇ ಕೇಳಿಕೊಂಡರೂ ನಿಮಗವರು ನೀಡುವರೆಂದು ನಾನು ಬಲ್ಲೆ,’ ಎಂದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "11:22"}, {"n": 103, "q": "ಯೊವಾನ್ನ 11:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈಗಲೂ ದೇವರಲ್ಲಿ ನೀವು ಏನೇ ಕೇಳಿಕೊಂಡರೂ ನಿಮಗವರು ನೀಡುವರೆಂದು ನಾನು ಬಲ್ಲೆ,” ಎಂದಳು.", "r": "11:22"}, {"n": 104, "q": "ಯೇಸು ಮಾರ್ತಳಿಗೆ ಅವಳ ಸಹೋದರನ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ನಿನ್ನ ಸಹೋದರನು ಜೀವಂತವಾಗಿ ಏಳುವನು”", "r": "11:23"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಿನ್ನ ಸಹೋದರನು ಜೀವಂತವಾಗಿ ಏಳುವನು,’ ಎಂದರು.”", "a": "ಯೇಸು", "r": "11:23"}, {"n": 106, "q": "“ಯೇಸು, ‘ನಿನ್ನ ಸಹೋದರನು ಜೀವಂತವಾಗಿ ಏಳುವನು,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "11:23"}, {"n": 107, "q": "ಯೊವಾನ್ನ 11:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, “ನಿನ್ನ ಸಹೋದರನು ಜೀವಂತವಾಗಿ ಏಳುವನು,” ಎಂದರು.", "r": "11:23"}, {"n": 108, "q": "ಮಾರ್ತಳ ಪ್ರಕಾರ ಲಾಸರನು ಯಾವಾಗ ಜೀವಂತವಾಗಿ ಏಳುವನು?", "a": "ಅಂತಿಮ ದಿನದ ಪುನರುತ್ಥಾನದಲ್ಲಿ", "r": "11:24"}, {"n": 109, "q": "“ಅವನು ಅಂತಿಮ ದಿನದ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಜೀವಂತವಾಗಿ ಏಳುವನೆಂದು ನನಗೆ ತಿಳಿದಿದೆ” ಎಂದವರು ಯಾರು?", "a": "ಮಾರ್ತ", "r": "11:24"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಅವನು ಅಂತಿಮ ದಿನದ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಜೀವಂತವಾಗಿ ಏಳುವನೆಂದು ನನಗೆ ತಿಳಿದಿದೆ,’ ಎಂದಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾರ್ತ", "r": "11:24"}, {"n": 111, "q": "“‘ಅವನು ಅಂತಿಮ ದಿನದ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಜೀವಂತವಾಗಿ ಏಳುವನೆಂದು ನನಗೆ ತಿಳಿದಿದೆ,’ ಎಂದಳು ಮಾರ್ತ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "11:24"}, {"n": 112, "q": "ಯೊವಾನ್ನ 11:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಅವನು ಅಂತಿಮ ದಿನದ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಜೀವಂತವಾಗಿ ಏಳುವನೆಂದು ನನಗೆ ತಿಳಿದಿದೆ,” ಎಂದಳು ಮಾರ್ತ.", "r": "11:24"}, {"n": 113, "q": "ಯೇಸು ಮಾರ್ತಳಿಗೆ ತಮ್ಮ ಬಗ್ಗೆ ಮಾಡಿದ ಘೋಷಣೆ ಯಾವುದು?", "a": "“ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ; ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ಸಾವಿಗೀಡಾದರೂ ಜೀವಿಸುವನು.”", "r": "11:25"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವಳಿಗೆ, ‘ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ;”", "a": "ಯೇಸು", "r": "11:25"}, {"n": 115, "q": "“ಯೇಸು, ಅವಳಿಗೆ, ‘ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "11:25"}, {"n": 116, "q": "ಯೊವಾನ್ನ 11:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, ಅವಳಿಗೆ, “ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ; ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ಸಾವಿಗೀಡಾದರೂ ಜೀವಿಸುವನು.", "r": "11:25"}, {"n": 117, "q": "ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಜೀವಿಸುವ ಪ್ರತಿಯೊಬ್ಬನ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "ಅವನೆಂದಿಗೂ ಸಾಯನು", "r": "11:26"}, {"n": 118, "q": "“ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ” ಎಂದ ಬಳಿಕ ಯೇಸು ಮಾರ್ತಳಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಇದನ್ನು ನೀನು ವಿಶ್ವಾಸಿಸುತ್ತೀಯಾ?”", "r": "11:26"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೀವಿಸುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನನ್ನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನೆಂದಿಗೂ ಸಾಯನು.”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟನೆಂದರೆ", "r": "11:26"}, {"n": 120, "q": "“ಜೀವಿಸುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನೆಂದರೆ ಅವನೆಂದಿಗೂ ಸಾಯನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "11:26"}, {"n": 121, "q": "ಯೊವಾನ್ನ 11:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜೀವಿಸುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನೆಂದರೆ ಅವನೆಂದಿಗೂ ಸಾಯನು. ಇದನ್ನು ನೀನು ವಿಶ್ವಾಸಿಸುತ್ತೀಯಾ?” ಎಂದು ಕೇಳಲು ಅವಳು,", "r": "11:26"}, {"n": 122, "q": "ಮಾರ್ತಳ ವಿಶ್ವಾಸ ಅರಿಕೆಯಲ್ಲಿ ಯೇಸುವಿಗೆ ಉಪಯೋಗಿಸಿದ ಮೂರು ಬಿರುದುಗಳು ಯಾವುವು?", "a": "ಅಭಿಷಿಕ್ತರಾದ ಲೋಕೋದ್ಧಾರಕ; ದೇವರ ಪುತ್ರ; ಈ ಲೋಕಕ್ಕೆ ಬರಬೇಕಾದವರು", "r": "11:27"}, {"n": 123, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸುವಿನ ಬಗ್ಗೆ ವಿಶ್ವಾಸ ಅರಿಕೆ ಮಾಡಿದ ಇಬ್ಬರು ಯಾರು (ಅಧ್ಯಾಯ 6 ಮತ್ತು 11)?", "a": "ಸಿಮೋನ ಪೇತ್ರ (6:68–69) ಮತ್ತು ಮಾರ್ತ (11:27)", "r": "6:69; 11:27"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಹೌದು ಪ್ರಭುವೇ, ನೀವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ;”", "a": "ಅಭಿಷಿಕ್ತರಾದ", "r": "11:27"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಲೋಕಕ್ಕೆ ಬರಬೇಕಾದವರು - ಎಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ", "r": "11:27"}, {"n": 126, "q": "“‘ಹೌದು ಪ್ರಭುವೇ, ನೀವೇ ಅಭಿಷಿಕ್ತರಾದ ಲೋಕೋದ್ಧಾರಕ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "11:27"}, {"n": 127, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 11:28ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಕಂಬನಿಗರೆದ ಯೇಸು", "r": "11:28"}, {"n": 128, "q": "ಮಾರ್ತ ತನ್ನ ಸೋದರಿಯನ್ನು ಕರೆಯಲು ಹೋಗಿ ಏನೆಂದು ಹೇಳಿದಳು?", "a": "“ಬೋಧಕರು ಬಂದಿದ್ದಾರೆ; ನಿನ್ನನ್ನು ಕರೆಯುತ್ತಿದ್ದಾರೆ”", "r": "11:28"}, {"n": 129, "q": "ಮಾರ್ತ ಯೇಸುವನ್ನು ಮರಿಯಳಿಗೆ ಏನೆಂದು ಉಲ್ಲೇಖಿಸಿದಳು?", "a": "ಬೋಧಕರು", "r": "11:28"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಹೇಳಿದ ಮೇಲೆ ಅವಳು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆಯಲು ಹೋದಳು.”", "a": "ಸೋದರಿಯನ್ನು", "r": "11:28"}, {"n": 131, "q": "“ಹೀಗೆ ಹೇಳಿದ ಮೇಲೆ ಅವಳು ತನ್ನ ಸೋದರಿಯನ್ನು ಕರೆಯಲು ಹೋದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "11:28"}, {"n": 132, "q": "ಮಾರ್ತಳ ಮಾತು ಕೇಳಿದ ಮರಿಯಳು ಹೇಗೆ ಯೇಸುವನ್ನು ಕಾಣಹೋದಳು?", "a": "ತಟ್ಟನೆ ಎದ್ದು", "r": "11:29"}, {"n": 133, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ಮರಿಯಳು ತಟ್ಟನೆ ಎದ್ದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣಹೋದಳು.”", "a": "ಯೇಸುವನ್ನು", "r": "11:29"}, {"n": 134, "q": "“ಇದನ್ನು ಕೇಳಿದ ಮರಿಯಳು ತಟ್ಟನೆ ಎದ್ದು ಯೇಸುವನ್ನು ಕಾಣಹೋದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "11:29"}, {"n": 135, "q": "ಯೊವಾನ್ನ 11:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿದ ಮರಿಯಳು ತಟ್ಟನೆ ಎದ್ದು ಯೇಸುವನ್ನು ಕಾಣಹೋದಳು.", "r": "11:29"}, {"n": 136, "q": "ಮರಿಯಳು ಬಂದಾಗ ಯೇಸು ಎಲ್ಲಿದ್ದರು?", "a": "ಮಾರ್ತ ತಮ್ಮನ್ನು ಎದುರುಗೊಂಡ ಸ್ಥಳದಲ್ಲಿಯೇ (ಊರೊಳಗೆ ಬಂದಿರಲಿಲ್ಲ)", "r": "11:30"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮನ್ನು ಎದುರುಗೊಂಡ ಸ್ಥಳದಲ್ಲಿಯೇ ಇದ್ದರು.”", "a": "ಮಾರ್ತ", "r": "11:30"}, {"n": 138, "q": "ಯೊವಾನ್ನ 11:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಇನ್ನೂ ಊರೊಳಗೆ ಬಂದಿರಲಿಲ್ಲ; ಮಾರ್ತ ತಮ್ಮನ್ನು ಎದುರುಗೊಂಡ ಸ್ಥಳದಲ್ಲಿಯೇ ಇದ್ದರು.", "r": "11:30"}, {"n": 139, "q": "“ಮಾರ್ತ ತಮ್ಮನ್ನು ಎದುರುಗೊಂಡ ಸ್ಥಳದಲ್ಲಿಯೇ ಇದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "11:30"}, {"n": 140, "q": "ಮರಿಯಳನ್ನು ಸಂತೈಸುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರು ಅವಳ ಹಿಂದೆ ಏಕೆ ಹೋದರು?", "a": "ಅವಳು ಗೋಳಿಡುವುದಕ್ಕಾಗಿಯೇ ಸಮಾಧಿಯ ಕಡೆಗೆ ಹೋಗುತ್ತಿದ್ದಾಳೆಂದು ಎಣಿಸಿ", "r": "11:31"}, {"n": 141, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಮರಿಯ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿದ್ದಳು?", "a": "ಸಮಾಧಿಯ ಕಡೆಗೆ (ಗೋಳಿಡುವುದಕ್ಕಾಗಿ)", "r": "11:31"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತ್ತ ಮನೆಯಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂತೈಸಿಕೊಂಡಿದ್ದ ಯೆಹೂದ್ಯರು, ಆಕೆ ಅವಸರವಸರವಾಗಿ ಎದ್ದುಹೋಗುವುದನ್ನು ಕಂಡು ಗೋಳಿಡುವುದಕ್ಕಾಗಿಯೇ ಸಮಾಧಿಯ ಕಡೆಗೆ ಹೋಗುತ್ತಿದ್ದಾಳೆಂದು ಎಣಿಸಿ ಆಕೆಯ ಹಿಂದೆಯೇ ಹೋದರು.”", "a": "ಮರಿಯಳನ್ನು", "r": "11:31"}, {"n": 143, "q": "“ಇತ್ತ ಮನೆಯಲ್ಲಿ ಮರಿಯಳನ್ನು ಸಂತೈಸಿಕೊಂಡಿದ್ದ ಯೆಹೂದ್ಯರು, ಆಕೆ ಅವಸರವಸರವಾಗಿ ಎದ್ದುಹೋಗುವುದನ್ನು ಕಂಡು ಗೋಳಿಡುವುದಕ್ಕಾಗಿಯೇ ಸಮಾಧಿಯ ಕಡೆಗೆ ಹೋಗುತ್ತಿದ್ದಾಳೆಂದು ಎಣಿಸಿ ಆಕೆಯ ಹಿಂದೆಯೇ ಹೋದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "11:31"}, {"n": 144, "q": "ಯೊವಾನ್ನ 11:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇತ್ತ ಮನೆಯಲ್ಲಿ ಮರಿಯಳನ್ನು ಸಂತೈಸಿಕೊಂಡಿದ್ದ ಯೆಹೂದ್ಯರು, ಆಕೆ ಅವಸರವಸರವಾಗಿ ಎದ್ದುಹೋಗುವುದನ್ನು ಕಂಡು ಗೋಳಿಡುವುದಕ್ಕಾಗಿಯೇ ಸಮಾಧಿಯ ಕಡೆಗೆ ಹೋಗುತ್ತಿದ್ದಾಳೆಂದು ಎಣಿಸಿ ಆಕೆಯ ಹಿಂದೆಯೇ ಹೋದರು.", "r": "11:31"}, {"n": 145, "q": "ಮರಿಯಳು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದಕೂಡಲೇ ಏನು ಮಾಡಿದಳು?", "a": "ಅವರ ಕಾಲಿಗೆ ಬಿದ್ದಳು", "r": "11:32"}, {"n": 146, "q": "ಮರಿಯಳು ಯೇಸುವಿಗೆ ಏನೆಂದಳು?", "a": "“ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರನು ಸಾಯುತ್ತಿರಲಿಲ್ಲ”", "r": "11:32"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರಿಯಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದಕೂಡಲೇ ಅವರ ಕಾಲಿಗೆ ಬಿದ್ದು, ‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರನು ಸಾಯುತ್ತಿರಲಿಲ್ಲ,’ ಎಂದಳು.”", "a": "ಯೇಸುವಿನ", "r": "11:32"}, {"n": 148, "q": "“ಮರಿಯಳು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದಕೂಡಲೇ ಅವರ ಕಾಲಿಗೆ ಬಿದ್ದು, ‘ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರನು ಸಾಯುತ್ತಿರಲಿಲ್ಲ,’ ಎಂದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "11:32"}, {"n": 149, "q": "ಯೊವಾನ್ನ 11:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮರಿಯಳು ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದಕೂಡಲೇ ಅವರ ಕಾಲಿಗೆ ಬಿದ್ದು, “ಪ್ರಭುವೇ, ನೀವು ಇಲ್ಲಿದ್ದಿದ್ದರೆ ನನ್ನ ಸಹೋದರನು ಸಾಯುತ್ತಿರಲಿಲ್ಲ,” ಎಂದಳು.", "r": "11:32"}, {"n": 150, "q": "ಮರಿಯಳ ಮತ್ತು ಯೆಹೂದ್ಯರ ಗೋಳಾಟವನ್ನು ನೋಡಿದಾಗ ಯೇಸುವಿಗೆ ಏನಾಯಿತು?", "a": "ಅವರ ಮನ ಕರಗಿತು; ದುಃಖ ತುಂಬಿ ಬಂದಿತು", "r": "11:33"}, {"n": 151, "q": "ಲಾಸರನ ಸಮಾಧಿಯ ಬಳಿ ಯೇಸುವಿನ ಭಾವನೆಗಳನ್ನು ವರ್ಣಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "ಮನ ಕರಗಿತು, ದುಃಖ ತುಂಬಿ ಬಂದಿತು (11:33); ಕಣ್ಣೀರಿಟ್ಟರು (11:35); ಮತ್ತೊಮ್ಮೆ ಮನಮರುಗಿದರು (11:38)", "r": "11:33; 11:35; 11:38"}, {"n": 152, "q": "ಯೇಸು ಯಾರ ಗೋಳಾಟವನ್ನು ನೋಡಿದರು?", "a": "ಮರಿಯಳ ಮತ್ತು ಅವಳೊಡನೆ ಬಂದಿದ್ದ ಯೆಹೂದ್ಯರ", "r": "11:33"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಕೆಯ ಮತ್ತು ಆಕೆಯೊಡನೆ ಬಂದಿದ್ದ ಯೆಹೂದ್ಯರ ಗೋಳಾಟವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿದರು.”", "a": "ಯೇಸು", "r": "11:33"}, {"n": 154, "q": "“ಆಕೆಯ ಮತ್ತು ಆಕೆಯೊಡನೆ ಬಂದಿದ್ದ ಯೆಹೂದ್ಯರ ಗೋಳಾಟವನ್ನು ಯೇಸು ನೋಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "11:33"}, {"n": 155, "q": "ಯೇಸು ಲಾಸರನ ಸಮಾಧಿಯ ಬಗ್ಗೆ ಏನು ಕೇಳಿದರು?", "a": "“ಆತನನ್ನು ಎಲ್ಲಿ ಸಮಾಧಿಮಾಡಿದ್ದೀರಿ?”", "r": "11:34"}, {"n": 156, "q": "“ಆತನನ್ನು ಎಲ್ಲಿ ಸಮಾಧಿಮಾಡಿದ್ದೀರಿ?” ಎಂದಾಗ ಅವರು ಏನೆಂದರು?", "a": "“ಬಂದು ನೋಡಿ ಸ್ವಾಮೀ”", "r": "11:34"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ‘ಆತನನ್ನು ಎಲ್ಲಿ ಸಮಾಧಿಮಾಡಿದ್ದೀರಿ?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಯೇಸು", "r": "11:34"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ‘ಬಂದು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದರು.”", "a": "ಸ್ವಾಮೀ", "r": "11:34"}, {"n": 159, "q": "“ಯೇಸು ಅವರಿಗೆ, ‘ಆತನನ್ನು ಎಲ್ಲಿ ಸಮಾಧಿಮಾಡಿದ್ದೀರಿ?’ ಎಂದು ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "11:34"}, {"n": 160, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಅತಿ ಚಿಕ್ಕ ವಚನ (11:35) ಯಾವುದು?", "a": "“ಯೇಸು ಕಣ್ಣೀರಿಟ್ಟರು.”", "r": "11:35"}, {"n": 161, "q": "ಯೇಸು ಕಣ್ಣೀರಿಟ್ಟದ್ದನ್ನು ಕಂಡ ಯೆಹೂದ್ಯರು ಏನೆಂದುಕೊಂಡರು?", "a": "“ಅವನ ಮೇಲೆ ಈತನಿಗೆಷ್ಟು ಪ್ರೀತಿಯಿತ್ತು, ನೋಡಿದಿರಾ!”", "r": "11:36"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕಂಡ ಯೆಹೂದ್ಯರು, ‘ಅವನ ಮೇಲೆ ಈತನಿಗೆಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೋಡಿದಿರಾ!’ ಎಂದುಕೊಂಡರು.”", "a": "ಪ್ರೀತಿಯಿತ್ತು", "r": "11:36"}, {"n": 163, "q": "“ಇದನ್ನು ಕಂಡ ಯೆಹೂದ್ಯರು, ‘ಅವನ ಮೇಲೆ ಈತನಿಗೆಷ್ಟು ಪ್ರೀತಿಯಿತ್ತು, ನೋಡಿದಿರಾ!’ ಎಂದುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "11:36"}, {"n": 164, "q": "ಯೊವಾನ್ನ 11:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕಂಡ ಯೆಹೂದ್ಯರು, “ಅವನ ಮೇಲೆ ಈತನಿಗೆಷ್ಟು ಪ್ರೀತಿಯಿತ್ತು, ನೋಡಿದಿರಾ!” ಎಂದುಕೊಂಡರು.", "r": "11:36"}, {"n": 165, "q": "ಕೆಲವರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾವ ಪ್ರಶ್ನೆ ಎತ್ತಿದರು?", "a": "ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ಈತ ಲಾಸರನು ಸಾಯದಂತೆ ಮಾಡಬಾರದಿತ್ತೆ ಎಂದು", "r": "11:37"}, {"n": 166, "q": "ಕೆಲವರು ಯೇಸುವನ್ನು ಯಾರಿಗೆ ಕಣ್ಣುಕೊಟ್ಟವನೆಂದು ಉಲ್ಲೇಖಿಸಿದರು?", "a": "ಆ ಕುರುಡನಿಗೆ", "r": "11:37"}, {"n": 167, "q": "ಲಾಸರನ ಸಮಾಧಿಯ ಬಳಿ ಕೆಲವರು ಉಲ್ಲೇಖಿಸಿದ ಹಿಂದಿನ ಅದ್ಭುತ ಯಾವುದು?", "a": "ಹುಟ್ಟು ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟದ್ದು (9:6–7)", "r": "9:6–7; 11:37"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೆಲವರಾದರೋ, ‘ಆ ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ಈತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಯದಂತೆ ಮಡಬಾರದಿತ್ತೆ?’ ಎಂದರು.”", "a": "ಲಾಸರನು", "r": "11:37"}, {"n": 169, "q": "“ಕೆಲವರಾದರೋ, ‘ಆ ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ಈತ ಲಾಸರನು ಸಾಯದಂತೆ ಮಡಬಾರದಿತ್ತೆ?’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "11:37"}, {"n": 170, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 11:38ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನ", "r": "11:38"}, {"n": 171, "q": "ಲಾಸರನ ಸಮಾಧಿ ಹೇಗಿತ್ತು?", "a": "ಒಂದು ಗವಿಯಾಗಿತ್ತು; ಅದರ ಬಾಯಿಗೆ ಒಂದು ಕಲ್ಲನ್ನು ಮುಚ್ಚಲಾಗಿತ್ತು", "r": "11:38"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೊಮ್ಮೆ ಮನಮರುಗಿ ಸಮಾಧಿಯ ಬಳಿಗೆ ಬಂದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "11:38"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರ ಬಾಯಿಗೆ ಒಂದು ಕಲ್ಲನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮುಚ್ಚಲಾಗಿತ್ತು", "r": "11:38"}, {"n": 174, "q": "“ಯೇಸುಸ್ವಾಮಿ ಮತ್ತೊಮ್ಮೆ ಮನಮರುಗಿ ಸಮಾಧಿಯ ಬಳಿಗೆ ಬಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "11:38"}, {"n": 175, "q": "ಸಮಾಧಿಯ ಬಳಿ ಯೇಸು ಕೊಟ್ಟ ಮೊದಲ ಆಜ್ಞೆ ಏನು?", "a": "“ಆ ಕಲ್ಲನ್ನು ತೆಗೆಯಿರಿ”", "r": "11:39"}, {"n": 176, "q": "ಕಲ್ಲನ್ನು ತೆಗೆಯುವ ಆಜ್ಞೆಗೆ ಮಾರ್ತಳ ಆಕ್ಷೇಪಣೆ ಏನು?", "a": "“ಪ್ರಭುವೇ, ಅವನು ಸತ್ತು ನಾಲ್ಕು ದಿನಗಳಾದವು; ಈಗಾಗಲೇ ಅವನ ದೇಹ ಕೊಳೆತು ನಾರುತ್ತಿರಬೇಕು”", "r": "11:39"}, {"n": 177, "q": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನದಲ್ಲಿ ಯೇಸು ಕೊಟ್ಟ ಮೂರು ಆಜ್ಞೆಗಳು ಯಾವುವು?", "a": "“ಆ ಕಲ್ಲನ್ನು ತೆಗೆಯಿರಿ”; “ಲಾಸರನೇ, ಹೊರಗೆ ಬಾ”; “ಕಟ್ಟುಗಳನ್ನು ಬಿಚ್ಚಿ ಅವನನ್ನು ಹೋಗಲು ಬಿಡಿ”", "r": "11:39; 11:43; 11:44"}, {"n": 178, "q": "ಸಮಾಧಿಯ ಬಳಿ ಆಕ್ಷೇಪಿಸಿದ ‘ಮೃತನ ಸಹೋದರಿ’ ಯಾರು?", "a": "ಮಾರ್ತ", "r": "11:39"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಆ ಕಲ್ಲನ್ನು ತೆಗೆಯಿರಿ,’ ಎಂದು ಆಜ್ಞಾಪಿಸಿದರು.”", "a": "ಯೇಸು", "r": "11:39"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೃತನ ಸಹೋದರಿಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಪ್ರಭುವೇ, ಅವನು ಸತ್ತು ನಾಲ್ಕು ದಿನಗಳಾದವು;”", "a": "ಮಾರ್ತಳು", "r": "11:39"}, {"n": 181, "q": "ಮಾರ್ತಳ ಆಕ್ಷೇಪಣೆಗೆ ಯೇಸು ಏನೆಂದು ಮರುನುಡಿದರು?", "a": "“ನಿನಗೆ ವಿಶ್ವಾಸವಿದ್ದಲ್ಲಿ ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣುವೆ ಎಂದು ನಾನು ಹೇಳಲಿಲ್ಲವೆ?”", "r": "11:40"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣುವೆ ಎಂದು ನಾನು ಹೇಳಲಿಲ್ಲವೆ?’ ಎಂದು ಮರುನುಡಿದರು ಯೇಸು.”", "a": "ವಿಶ್ವಾಸವಿದ್ದಲ್ಲಿ", "r": "11:40"}, {"n": 183, "q": "“‘ನಿನಗೆ ವಿಶ್ವಾಸವಿದ್ದಲ್ಲಿ ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣುವೆ ಎಂದು ನಾನು ಹೇಳಲಿಲ್ಲವೆ?’ ಎಂದು ಮರುನುಡಿದರು ಯೇಸು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "11:40"}, {"n": 184, "q": "ಯೊವಾನ್ನ 11:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನಿನಗೆ ವಿಶ್ವಾಸವಿದ್ದಲ್ಲಿ ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣುವೆ ಎಂದು ನಾನು ಹೇಳಲಿಲ್ಲವೆ?” ಎಂದು ಮರುನುಡಿದರು ಯೇಸು.", "r": "11:40"}, {"n": 185, "q": "ಕಲ್ಲನ್ನು ತೆಗೆದುಹಾಕಿದ ನಂತರ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಕಣ್ಣೆತ್ತಿ ಮೇಲಕ್ಕೆ ನೋಡಿ ಪಿತನಿಗೆ ಕೃತಜ್ಞತೆಯನ್ನು ಸಲ್ಲಿಸಿದರು", "r": "11:41"}, {"n": 186, "q": "ಲಾಸರನ ಸಮಾಧಿಯ ಬಳಿ ಯೇಸು ಪಿತನಿಗೆ ಸಲ್ಲಿಸಿದ ಕೃತಜ್ಞತೆಯ ಕಾರಣವೇನು?", "a": "“ಪಿತನೇ, ನನ್ನ ಪ್ರಾರ್ಥನೆಗೆ ನೀವು ಕಿವಿಗೊಡುತ್ತೀರಿ”", "r": "11:41"}, {"n": 187, "q": "ಯೇಸುವಿನ ಆಜ್ಞೆಯಂತೆ ಸಮಾಧಿಯ ಬಾಯಿಂದ ಏನನ್ನು ತೆಗೆದುಹಾಕಲಾಯಿತು?", "a": "ಕಲ್ಲನ್ನು", "r": "11:41"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣ್ಣೆತ್ತಿ ಮೇಲಕ್ಕೆ ನೋಡಿ, ‘ಪಿತನೇ, ನನ್ನ ಪ್ರಾರ್ಥನೆಗೆ ನೀವು ಕಿವಿಗೊಡುತ್ತೀರಿ;”", "a": "ಯೇಸು", "r": "11:41"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಲ್ಲಿಸುತ್ತೇನೆ.”", "a": "ಕೃತಜ್ಞತೆಯನ್ನು", "r": "11:41"}, {"n": 190, "q": "ಯೇಸು ಪಿತನಿಗೆ ಗಟ್ಟಿಯಾಗಿ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿದ್ದು ಏಕೆ?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತ ಪಿತನೇ ಎಂದು ಸುತ್ತಲೂ ನೆರೆದಿರುವವರು ನಂಬುವಂತೆ", "r": "11:42"}, {"n": 191, "q": "ಯೇಸುವಿಗೆ ಯಾವುದು ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ ಎಂದು ಅವರು ಪಿತನಿಗೆ ಹೇಳಿದರು?", "a": "ಪಿತನು ಅವರ ಪ್ರಾರ್ಥನೆಗೆ ಯಾವಾಗಲೂ ಕಿವಿಗೊಡುತ್ತಾರೆ ಎಂಬುದು", "r": "11:42"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಾರ್ಥನೆಗೆ ನೀವು ಯಾವಾಗಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದು ನನಗೆ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.”", "a": "ಕಿವಿಗೊಡುತ್ತೀರಿ", "r": "11:42"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತ ನೀವೇ ಎಂದು ಸುತ್ತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬುವಂತೆ ನಾನು ಹೀಗೆ ಹೇಳಿದೆನು,’ ಎಂದು ನುಡಿದರು.”", "a": "ನೆರೆದಿರುವವರು", "r": "11:42"}, {"n": 194, "q": "“ನನ್ನ ಪ್ರಾರ್ಥನೆಗೆ ನೀವು ಯಾವಾಗಲೂ ಕಿವಿಗೊಡುತ್ತೀರಿ ಎಂಬುದು ನನಗೆ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "11:42"}, {"n": 195, "q": "ಯೇಸು ಲಾಸರನನ್ನು ಹೇಗೆ ಕರೆದರು?", "a": "“ಲಾಸರನೇ, ಹೊರಗೆ ಬಾ”", "r": "11:43"}, {"n": 196, "q": "ಯೇಸು ಲಾಸರನನ್ನು ಹೇಗೆ ಕೂಗಿದರು?", "a": "ಗಟ್ಟಿಯಾದ ಧ್ವನಿಯಿಂದ", "r": "11:43"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ಗಟ್ಟಿಯಾದ ಧ್ವನಿಯಿಂದ, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೊರಗೆ ಬಾ,’ ಎಂದು ಕೂಗಿದರು.”", "a": "ಲಾಸರನೇ", "r": "11:43"}, {"n": 198, "q": "“ಅನಂತರ ಗಟ್ಟಿಯಾದ ಧ್ವನಿಯಿಂದ, ‘ಲಾಸರನೇ, ಹೊರಗೆ ಬಾ,’ ಎಂದು ಕೂಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "11:43"}, {"n": 199, "q": "ಯೊವಾನ್ನ 11:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅನಂತರ ಗಟ್ಟಿಯಾದ ಧ್ವನಿಯಿಂದ, “ಲಾಸರನೇ, ಹೊರಗೆ ಬಾ,” ಎಂದು ಕೂಗಿದರು.", "r": "11:43"}, {"n": 200, "q": "ಹೊರಗೆ ಬಂದ ಲಾಸರನ ಸ್ಥಿತಿ ಹೇಗಿತ್ತು?", "a": "ಕೈಕಾಲುಗಳು ಶವವಸ್ತ್ರದಿಂದ ಸುತ್ತಿದ್ದವು; ಮುಖವು ಬಟ್ಟೆಯಿಂದ ಮುಚ್ಚಿತ್ತು", "r": "11:44"}, {"n": 201, "q": "ಲಾಸರನು ಹೊರಗೆ ಬಂದಾಗ ಯೇಸು ಅಲ್ಲಿದ್ದವರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಕಟ್ಟುಗಳನ್ನು ಬಿಚ್ಚಿ ಅವನನ್ನು ಹೋಗಲು ಬಿಡಿ”", "r": "11:44"}, {"n": 202, "q": "ಸತ್ತಿದ್ದ ಲಾಸರನು ಯಾವಾಗ ಹೊರಗೆ ಬಂದನು?", "a": "ಕೂಡಲೇ (ಯೇಸು ಕೂಗಿದ ಕೂಡಲೇ)", "r": "11:44"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಕಟ್ಟುಗಳನ್ನು ಬಿಚ್ಚಿ ಅವನನ್ನು ಹೋಗಲು ಬಿಡಿ,’ ಎಂದು ಅಲ್ಲಿದ್ದವರಿಗೆ ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "11:44"}, {"n": 204, "q": "“ಆಗ ಯೇಸು, ‘ಕಟ್ಟುಗಳನ್ನು ಬಿಚ್ಚಿ ಅವನನ್ನು ಹೋಗಲು ಬಿಡಿ,’ ಎಂದು ಅಲ್ಲಿದ್ದವರಿಗೆ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "11:44"}, {"n": 205, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 11:45ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವಿನ ವಿರುದ್ಧ ಹಂಚಿಕೆ", "r": "11:45"}, {"n": 206, "q": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನವನ್ನು ನೋಡಿ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದವರು ಯಾರು?", "a": "ಮರಿಯಳನ್ನು ನೋಡಲು ಬಂದಿದ್ದ ಹಲವು ಮಂದಿ ಯೆಹೂದ್ಯರು", "r": "11:45"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಲು ಬಂದಿದ್ದ ಹಲವು ಮಂದಿ ಯೆಹೂದ್ಯರು ನಡೆದ ಸಂಗತಿಯನ್ನು ನೋಡಿ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದರು.”", "a": "ಮರಿಯಳನ್ನು", "r": "11:45"}, {"n": 208, "q": "“ಮರಿಯಳನ್ನು ನೋಡಲು ಬಂದಿದ್ದ ಹಲವು ಮಂದಿ ಯೆಹೂದ್ಯರು ನಡೆದ ಸಂಗತಿಯನ್ನು ನೋಡಿ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "11:45"}, {"n": 209, "q": "ಕೆಲವರು ಫರಿಸಾಯರ ಬಳಿಗೆ ಹೋಗಿ ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸು ಮಾಡಿದ್ದೆಲ್ಲವನ್ನೂ ತಿಳಿಸಿದರು", "r": "11:46"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೆಲವರಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಹೋಗಿ ಯೇಸು ಮಾಡಿದ್ದೆಲ್ಲವನ್ನೂ ತಿಳಿಸಿದರು.”", "a": "ಫರಿಸಾಯರ", "r": "11:46"}, {"n": 211, "q": "“ಕೆಲವರಾದರೋ ಫರಿಸಾಯರ ಬಳಿಗೆ ಹೋಗಿ ಯೇಸು ಮಾಡಿದ್ದೆಲ್ಲವನ್ನೂ ತಿಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "11:46"}, {"n": 212, "q": "ಯೊವಾನ್ನ 11:46 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೆಲವರಾದರೋ ಫರಿಸಾಯರ ಬಳಿಗೆ ಹೋಗಿ ಯೇಸು ಮಾಡಿದ್ದೆಲ್ಲವನ್ನೂ ತಿಳಿಸಿದರು.", "r": "11:46"}, {"n": 213, "q": "‘ನ್ಯಾಯಸಭೆ’ಯನ್ನು ಕರೆದವರು ಯಾರು?", "a": "ಮುಖ್ಯ ಯಾಜಕರೂ ಫರಿಸಾಯರೂ", "r": "11:47"}, {"n": 214, "q": "ನ್ಯಾಯಸಭೆಯಲ್ಲಿ ಮುಖ್ಯ ಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಈಗ ನಾವೇನು ಮಾಡೋಣ?”", "r": "11:47"}, {"n": 215, "q": "ನ್ಯಾಯಸಭೆಯ ಪ್ರಕಾರ ಯೇಸು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಎಷ್ಟೋ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಿದ್ದರು", "r": "11:47"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮುಖ್ಯ ಯಾಜಕರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ‘ನ್ಯಾಯಸಭೆ’ಯನ್ನು ಕರೆದರು.”", "a": "ಫರಿಸಾಯರೂ", "r": "11:47"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮನುಷ್ಯನು ಎಷ್ಟೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುತ್ತಾನಲ್ಲಾ;”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "11:47"}, {"n": 218, "q": "ಯೇಸುವನ್ನು ಹಾಗೆಯೇ ಬಿಟ್ಟರೆ ಏನಾಗುವುದೆಂದು ನ್ಯಾಯಸಭೆ ಭಯಪಟ್ಟಿತು?", "a": "ಜನರೆಲ್ಲರೂ ಅವನನ್ನೇ ನಂಬುವರು; ರೋಮನರು ಬಂದು ಪವಿತ್ರ ದೇವಾಲಯವನ್ನೂ ರಾಷ್ಟ್ರವನ್ನೂ ನೆಲಸಮ ಮಾಡುವರು", "r": "11:48"}, {"n": 219, "q": "ನ್ಯಾಯಸಭೆಯ ಪ್ರಕಾರ ಯಾರು ದೇವಾಲಯವನ್ನೂ ರಾಷ್ಟ್ರವನ್ನೂ ನೆಲಸಮ ಮಾಡುವರು?", "a": "ರೋಮನರು", "r": "11:48"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನನ್ನು ಹೀಗೆಯೇ ಬಿಟ್ಟರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನನ್ನೇ ನಂಬುವರು.”", "a": "ಜನರೆಲ್ಲರೂ", "r": "11:48"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರೋಮನರು ಬಂದು ನಮ್ಮ ಪವಿತ್ರ ದೇವಾಲಯವನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಲಸಮ ಮಾಡುವರು,’ ಎಂದು ವಾದಿಸಿದರು.”", "a": "ರಾಷ್ಟ್ರವನ್ನೂ", "r": "11:48"}, {"n": 222, "q": "ಆ ವರ್ಷ ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದವನು ಯಾರು?", "a": "ಕಾಯಫನು", "r": "11:49"}, {"n": 223, "q": "ಯೊವಾನ್ನ 11:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ವರ್ಷ ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದ ಕಾಯಫನು,", "r": "11:49"}, {"n": 224, "q": "ಕಾಯಫನು ನ್ಯಾಯಸಭೆಯಲ್ಲಿ ಏನೆಂದು ನುಡಿದನು?", "a": "“ಇಡೀ ರಾಷ್ಟ್ರವೇ ನಿರ್ನಾಮವಾಗುವುದಕ್ಕಿಂತ ಜನತೆಗೋಸ್ಕರ ಒಬ್ಬನು ಸಾಯುವುದೇ ವಿಹಿತವೆಂದು ನಿಮಗೆ ಅರ್ಥವಾಗುತ್ತಿಲ್ಲವಲ್ಲಾ”", "r": "11:50"}, {"n": 225, "q": "ಕಾಯಫನ ಪ್ರಕಾರ ಯಾವುದು ಯಾವುದಕ್ಕಿಂತ ವಿಹಿತ?", "a": "ಇಡೀ ರಾಷ್ಟ್ರವೇ ನಿರ್ನಾಮವಾಗುವುದಕ್ಕಿಂತ ಜನತೆಗೋಸ್ಕರ ಒಬ್ಬನು ಸಾಯುವುದು", "r": "11:50"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಇಡೀ ರಾಷ್ಟ್ರವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜನತೆಗೋಸ್ಕರ ಒಬ್ಬನು ಸಾಯುವುದೇ ವಿಹಿತವೆಂದು ನಿಮಗೆ ಅರ್ಥವಾಗುತ್ತಿಲ್ಲವಲ್ಲಾ,’ ಎಂದು ನುಡಿದನು.”", "a": "ನಿರ್ನಾಮವಾಗುವುದಕ್ಕಿಂತ", "r": "11:50"}, {"n": 227, "q": "“‘ಇಡೀ ರಾಷ್ಟ್ರವೇ ನಿರ್ನಾಮವಾಗುವುದಕ್ಕಿಂತ ಜನತೆಗೋಸ್ಕರ ಒಬ್ಬನು ಸಾಯುವುದೇ ವಿಹಿತವೆಂದು ನಿಮಗೆ ಅರ್ಥವಾಗುತ್ತಿಲ್ಲವಲ್ಲಾ,’ ಎಂದು ನುಡಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 50", "r": "11:50"}, {"n": 228, "q": "ಕಾಯಫನು ಹಾಗೆ ಪ್ರವಾದಿಸಿದ್ದು ಹೇಗೆ?", "a": "ಆ ವರ್ಷ ಆತನು ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದ ಕಾರಣ (ತಾನಾಗಿಯೇ ಹೇಳಲಿಲ್ಲ)", "r": "11:51"}, {"n": 229, "q": "ಕಾಯಫನ ಪ್ರವಾದನೆ ಏನು?", "a": "ಯೇಸು ಜನತೆಗಾಗಿ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದಾರೆ", "r": "11:51"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ವರ್ಷ ಆತನು ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದ ಕಾರಣ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜನತೆಗಾಗಿ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದಾರೆ ಎಂದು ಹೀಗೆ ಪ್ರವಾದಿಸಿದನು.”", "a": "ಯೇಸು", "r": "11:51"}, {"n": 231, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆ ವರ್ಷ ಆತನು ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದ ಕಾರಣ, …”", "a": "“… ಯೇಸು ಜನತೆಗಾಗಿ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದಾರೆ ಎಂದು ಹೀಗೆ ಪ್ರವಾದಿಸಿದನು.”", "r": "11:51"}, {"n": 232, "q": "ಕಾಯಫನ ಮಾತಿನ ಇಂಗಿತದ ಪ್ರಕಾರ ಯೇಸು ಬೇರೆ ಯಾರಿಗಾಗಿಯೂ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದರು?", "a": "ಚದರಿಹೋಗಿದ್ದ ದೇವಜನರನ್ನು ಒಂದುಗೂಡಿಸುವ ಸಲುವಾಗಿ", "r": "11:52"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಜನತೆಗಾಗಿ ಮಾತ್ರವಲ್ಲ, ಚದರಿಹೋಗಿದ್ದ ದೇವಜನರನ್ನು ಒಂದುಗೂಡಿಸುವ ಸಲುವಾಗಿಯೂ ಪ್ರಾಣತ್ಯಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮಾತಿನ ಇಂಗಿತ.”", "a": "ಮಾಡಲಿದ್ದಾರೆಂಬುದು", "r": "11:52"}, {"n": 234, "q": "“ಆ ಜನತೆಗಾಗಿ ಮಾತ್ರವಲ್ಲ, ಚದರಿಹೋಗಿದ್ದ ದೇವಜನರನ್ನು ಒಂದುಗೂಡಿಸುವ ಸಲುವಾಗಿಯೂ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದಾರೆಂಬುದು ಆ ಮಾತಿನ ಇಂಗಿತ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 52", "r": "11:52"}, {"n": 235, "q": "ಯೊವಾನ್ನ 11:52 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಜನತೆಗಾಗಿ ಮಾತ್ರವಲ್ಲ, ಚದರಿಹೋಗಿದ್ದ ದೇವಜನರನ್ನು ಒಂದುಗೂಡಿಸುವ ಸಲುವಾಗಿಯೂ ಪ್ರಾಣತ್ಯಾಗ ಮಾಡಲಿದ್ದಾರೆಂಬುದು ಆ ಮಾತಿನ ಇಂಗಿತ.", "r": "11:52"}, {"n": 236, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ಯಾವಾಗಿನಿಂದ ನಿರ್ಧಾರ ಮಾಡಿಕೊಂಡರು?", "a": "ಅಂದಿನಿಂದಲೇ (ಕಾಯಫನ ಮಾತಿನ ದಿನದಿಂದ)", "r": "11:53"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದಿನಿಂದಲೇ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಲ್ಲಬೇಕೆಂದು ನಿರ್ಧಾರ ಮಾಡಿಕೊಂಡರು.”", "a": "ಯೇಸುವನ್ನು", "r": "11:53"}, {"n": 238, "q": "“ಅಂದಿನಿಂದಲೇ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನಿರ್ಧಾರ ಮಾಡಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 53", "r": "11:53"}, {"n": 239, "q": "ಯೊವಾನ್ನ 11:53 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂದಿನಿಂದಲೇ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನಿರ್ಧಾರ ಮಾಡಿಕೊಂಡರು.", "r": "11:53"}, {"n": 240, "q": "ಯೇಸು ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ಯಾವ ಗ್ರಾಮದಲ್ಲಿ ತಂಗಿದರು?", "a": "ಎಫ್ರಯಿಮ್", "r": "11:54"}, {"n": 241, "q": "ಎಫ್ರಯಿಮ್ ಗ್ರಾಮ ಯಾವುದರ ಪಕ್ಕದಲ್ಲಿತ್ತು?", "a": "ಬೆಂಗಾಡಿನ ಪಕ್ಕದಲ್ಲಿ", "r": "11:54"}, {"n": 242, "q": "ಯೇಸು ಜುದೇಯದಲ್ಲಿ ಯಾವುದನ್ನು ಕೈಬಿಟ್ಟರು?", "a": "ಬಹಿರಂಗವಾಗಿ ಓಡಾಡುವುದನ್ನು", "r": "11:54"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜುದೇಯದಲ್ಲಿ ಬಹಿರಂಗವಾಗಿ ಓಡಾಡುವುದನ್ನು ಕೈಬಿಟ್ಟರು.”", "a": "ಯೇಸು", "r": "11:54"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೆಂಗಾಡಿನ ಪಕ್ಕದಲ್ಲಿದ್ದ ಪ್ರದೇಶಕ್ಕೆ ತೆರಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಗ್ರಾಮದಲ್ಲಿ ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ತಂಗಿದರು.”", "a": "ಎಫ್ರಯಿಮ್", "r": "11:54"}, {"n": 245, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಹನ್ನೊಂದನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಸಮೀಪಿಸಿದ್ದ ಹಬ್ಬ ಯಾವುದು?", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕಹಬ್ಬ", "r": "11:55"}, {"n": 246, "q": "ಹಲವರು ಗ್ರಾಮಾಂತರ ಪ್ರದೇಶಗಳಿಂದ ಜೆರುಸಲೇಮಿಗೆ ಮೊದಲೇ ಏಕೆ ಬಂದಿದ್ದರು?", "a": "ಹಬ್ಬಕ್ಕೆ ಮುಂಚೆ ನಡೆಯುವ ಶುದ್ಧೀಕರಣಕ್ಕಾಗಿ", "r": "11:55"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬಕ್ಕೆ ಮುಂಚೆ ನಡೆಯುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಲವರು ಜೆರುಸಲೇಮಿಗೆ ಗ್ರಾಮಾಂತರ ಪ್ರದೇಶಗಳಿಂದ ಮೊದಲೇ ಬಂದಿದ್ದರು.”", "a": "ಶುದ್ದೀಕರಣಕ್ಕಾಗಿ", "r": "11:55"}, {"n": 248, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹಬ್ಬಕ್ಕೆ ಮುಂಚೆ ನಡೆಯುವ ಶುದ್ದೀಕರಣಕ್ಕಾಗಿ ಹಲವರು …”", "a": "“… ಜೆರುಸಲೇಮಿಗೆ ಗ್ರಾಮಾಂತರ ಪ್ರದೇಶಗಳಿಂದ ಮೊದಲೇ ಬಂದಿದ್ದರು.”", "r": "11:55"}, {"n": 249, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ಜನರು ಯೇಸುವಿನ ಬಗ್ಗೆ ತಮ್ಮತಮ್ಮೊಳಗೆ ಏನೆಂದು ವಿಚಾರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು?", "a": "“ಆತ ಹಬ್ಬಕ್ಕೆ ಬರುತ್ತಾನೋ ಇಲ್ಲವೋ ನಿಮ್ಮ ಎಣಿಕೆ ಏನು?”", "r": "11:56"}, {"n": 250, "q": "ಪಾಸ್ಕಹಬ್ಬಕ್ಕೆ ಬಂದಿದ್ದವರಿಗೆ ಯಾವ ಆಶೆಯಿತ್ತು?", "a": "ಯೇಸುವನ್ನು ನೋಡಬೇಕೆಂಬ ಆಶೆ", "r": "11:56"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಆತ ಹಬ್ಬಕ್ಕೆ ಬರುತ್ತಾನೋ ಇಲ್ಲವೋ ನಿಮ್ಮ ಎಣಿಕೆ ಏನು?’ ಎಂದು ಮಹಾದೇವಾಲಯದಲ್ಲಿ ತಮ್ಮತಮ್ಮೊಳಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಚಾರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು", "r": "11:56"}, {"n": 252, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ಆತ ಹಬ್ಬಕ್ಕೆ ಬರುತ್ತಾನೋ ಇಲ್ಲವೋ ನಿಮ್ಮ …”", "a": "“… ಎಣಿಕೆ ಏನು?’ ಎಂದು ಮಹಾದೇವಾಲಯದಲ್ಲಿ ತಮ್ಮತಮ್ಮೊಳಗೆ ವಿಚಾರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದರು.”", "r": "11:56"}, {"n": 253, "q": "ಮುಖ್ಯಯಾಜಕರೂ ಫರಿಸಾಯರೂ ಹೊರಡಿಸಿದ್ದ ಆಜ್ಞೆ ಏನು?", "a": "ಯೇಸುವಿನ ಸುಳಿವು ಯಾರಿಗಾದರೂ ಸಿಕ್ಕಿದ್ದೇ ಆದರೆ ತಮಗೆ ತಿಳಿಸಬೇಕೆಂದು", "r": "11:57"}, {"n": 254, "q": "ಮುಖ್ಯಯಾಜಕರೂ ಫರಿಸಾಯರೂ ಯೇಸುವಿನ ಸುಳಿವನ್ನು ಏಕೆ ಬಯಸಿದರು?", "a": "ಯೇಸುವನ್ನು ಬಂಧಿಸುವ ಉದ್ದೇಶದಿಂದ", "r": "11:57"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂಧಿಸುವ ಉದ್ದೇಶದಿಂದ ಮುಖ್ಯಯಾಜಕರೂ ಫರಿಸಾಯರೂ ಆತನ ಸುಳಿವು ಯಾರಿಗಾದರೂ ಸಿಕ್ಕಿದ್ದೇ ಆದರೆ ತಮಗೆ ತಿಳಿಸಬೇಕೆಂದು ಆಜ್ಞೆ ಹೊರಡಿಸಿದ್ದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "11:57"}, {"n": 256, "q": "“ಯೇಸುವನ್ನು ಬಂಧಿಸುವ ಉದ್ದೇಶದಿಂದ ಮುಖ್ಯಯಾಜಕರೂ ಫರಿಸಾಯರೂ ಆತನ ಸುಳಿವು ಯಾರಿಗಾದರೂ ಸಿಕ್ಕಿದ್ದೇ ಆದರೆ ತಮಗೆ ತಿಳಿಸಬೇಕೆಂದು ಆಜ್ಞೆ ಹೊರಡಿಸಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 11ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 57", "r": "11:57"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
