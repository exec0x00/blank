 "r": "8:3"}, {"n": 12, "q": "“ಆಗ ಧರ್ಮಶಾಸ್ತ್ರಿಗಳೂ ಫರಿಸಾಯರೂ ಒಬ್ಬ ಹೆಂಗಸನ್ನು ಅಲ್ಲಿಗೆ ಕರೆತಂದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "8:3"}, {"n": 13, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಬೋಧಕರೇ”", "r": "8:4"}, {"n": 14, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಹೆಂಗಸನ್ನು ಎಲ್ಲಿ ನಿಲ್ಲಿಸಿದರು?", "a": "ಎಲ್ಲರ ಮುಂದೆ", "r": "8:4"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, ‘ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿಕ್ಕಿಬಿದ್ದಳು.”", "a": "ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ", "r": "8:4"}, {"n": 16, "q": "“ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, ‘ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ ಸಿಕ್ಕಿಬಿದ್ದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "8:4"}, {"n": 17, "q": "ಯೊವಾನ್ನ 8:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, “ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ ಸಿಕ್ಕಿಬಿದ್ದಳು.", "r": "8:4"}, {"n": 18, "q": "ಮೋಶೆ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ವ್ಯಭಿಚಾರಿಣಿಯರ ಬಗ್ಗೆ ಏನು ವಿಧಿಸಿದ್ದಾನೆ ಎಂದು ಅವರು ಹೇಳಿದರು?", "a": "ಇಂಥವರನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕೆಂದು", "r": "8:5"}, {"n": 19, "q": "ವ್ಯಭಿಚಾರಿಣಿಯ ಬಗ್ಗೆ ಅವರು ಯೇಸುವನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಈ ಕುರಿತು ನಿಮ್ಮ ಅಭಿಪ್ರಾಯವೇನು?”", "r": "8:5"}, {"n": 20, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಉಲ್ಲೇಖಿಸಿದ ಇಬ್ಬರು/ಗುಂಪುಗಳು ಯಾರು ಮತ್ತು ಏನು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು — ವ್ಯಭಿಚಾರಿಣಿಯನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕು (8:5); ಯೇಸು — ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಸತ್ಯ (8:17)", "r": "8:5; 8:17"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥವರನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ವಿಧಿಸಿದ್ದಾನೆ.”", "a": "ಮೋಶೆಯೇ", "r": "8:5"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕುರಿತು ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ಅಭಿಪ್ರಾಯವೇನು", "r": "8:5"}, {"n": 23, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಯೇಸುವನ್ನು ಏಕೆ ಪ್ರಶ್ನಿಸಿದರು?", "a": "ಯೇಸುವನ್ನು ಮಾತಿನಲ್ಲಿ ಸಿಕ್ಕಿಸಿ ಅವರ ಮೇಲೆ ತಪ್ಪುಹೊರಿಸಬೇಕೆಂದು", "r": "8:6"}, {"n": 24, "q": "ಪ್ರಶ್ನಿಸಿದಾಗ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಬಗ್ಗಿಕೊಂಡು ಬೆರಳಿನಿಂದ ಮರಳ ಮೇಲೆ ಏನನ್ನೋ ಬರೆಯುತ್ತಾ ಕುಳಿತರು", "r": "8:6"}, {"n": 25, "q": "ಯೇಸು ಮರಳ ಮೇಲೆ ಬರೆಯುತ್ತಿದ್ದಾಗ ಬಂದವರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಮೇಲಿಂದ ಮೇಲೆ ಪ್ರಶ್ನೆಹಾಕುತ್ತಲೇ ಇದ್ದರು", "r": "8:6"}, {"n": 26, "q": "ಯೇಸು ಮರಳ ಮೇಲೆ ಯಾವುದರಿಂದ ಬರೆದರು?", "a": "ಬೆರಳಿನಿಂದ", "r": "8:6"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತಿನಲ್ಲಿ ಸಿಕ್ಕಿಸಿ ಅವರ ಮೇಲೆ ತಪ್ಪುಹೊರಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.”", "a": "ಯೇಸುವನ್ನು", "r": "8:6"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಗ್ಗಿಕೊಂಡು ಬೆರಳಿನಿಂದ ಮರಳ ಮೇಲೆ ಏನನ್ನೋ ಬರೆಯುತ್ತಾ ಕುಳಿತರು.”", "a": "ಯೇಸುವಾದರೋ", "r": "8:6"}, {"n": 29, "q": "ಯೇಸು ನೆಟ್ಟಗೆ ಕುಳಿತು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ”", "r": "8:7"}, {"n": 30, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ವ್ಯಭಿಚಾರಿಣಿಯ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಬೇಕಾದವನು ಯಾರು?", "a": "ಪಾಪ ಮಾಡದವನು", "r": "8:7"}, {"n": 31, "q": "ಯೊವಾನ್ನ 8:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು ನೆಟ್ಟಗೆ ಕುಳಿತು, “ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ,” ಎಂದು ಹೇಳಿ,", "r": "8:7"}, {"n": 32, "q": "ಮಾತಾಡಿದ ನಂತರ ಯೇಸು ಪುನಃ ಏನು ಮಾಡಿದರು?", "a": "ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು", "r": "8:8"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರೆಯತೊಡಗಿದರು", "r": "8:8"}, {"n": 34, "q": "“ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "8:8"}, {"n": 35, "q": "ಯೊವಾನ್ನ 8:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು.", "r": "8:8"}, {"n": 36, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿದವರು ಹೇಗೆ ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು?", "a": "ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಒಬ್ಬೊಬ್ಬರಾಗಿ", "r": "8:9"}, {"n": 37, "q": "ಕೊನೆಗೆ ಅಲ್ಲಿ ಉಳಿದವರು ಯಾರು?", "a": "ಯೇಸು ಮತ್ತು ನಿಂತುಕೊಂಡಿದ್ದ ಆ ಹೆಂಗಸು", "r": "8:9"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ್ದೇ ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಅವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು.”", "a": "ಒಬ್ಬೊಬ್ಬರಾಗಿ", "r": "8:9"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊನೆಗೆ ಅಲ್ಲಿ ಉಳಿದವರೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ನಿಂತುಕೊಂಡಿದ್ದ ಆ ಹೆಂಗಸು.”", "a": "ಯೇಸು", "r": "8:9"}, {"n": 40, "q": "“ಇದನ್ನು ಕೇಳಿದ್ದೇ ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಅವರೆಲ್ಲರೂ ಒಬ್ಬೊಬ್ಬರಾಗಿ ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "8:9"}, {"n": 41, "q": "ತಲೆಯೆತ್ತಿದ ಯೇಸು ಹೆಂಗಸನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ? ನಿನಗೆ ಯಾರೂ ಶಿಕ್ಷೆ ವಿಧಿಸಲಿಲ್ಲವೆ?”", "r": "8:10"}, {"n": 42, "q": "ಯೇಸು ವ್ಯಭಿಚಾರಿಣಿಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ತಾಯೀ”", "r": "8:10"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಲೆಯೆತ್ತಿ, ‘ತಾಯೀ, ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ?”", "a": "ಯೇಸು", "r": "8:10"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಯಾರೂ ಶಿಕ್ಷೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ವಿಧಿಸಲಿಲ್ಲವೆ", "r": "8:10"}, {"n": 45, "q": "“ಆಗ ಯೇಸು ತಲೆಯೆತ್ತಿ, ‘ತಾಯೀ, ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "8:10"}, {"n": 46, "q": "ಯೇಸುವಿನ ಪ್ರಶ್ನೆಗೆ ಹೆಂಗಸು ಏನೆಂದು ಉತ್ತರಿಸಿದಳು?", "a": "“ಇಲ್ಲ, ಸ್ವಾಮೀ”", "r": "8:11"}, {"n": 47, "q": "ಯೇಸು ವ್ಯಭಿಚಾರಿಣಿಗೆ ಕೊನೆಯಲ್ಲಿ ಏನು ಹೇಳಿದರು?", "a": "“ನಾನೂ ನಿನಗೆ ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ, ಹೋಗು; ಇನ್ನು ಮೇಲೆ ಪಾಪಮಾಡಬೇಡ”", "r": "8:11"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವಳಿಗೆ, ‘ನಾನೂ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೋಗು;”", "a": "ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ", "r": "8:11"}, {"n": 49, "q": "ಯೊವಾನ್ನ 8:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವಳು “ಇಲ್ಲ, ಸ್ವಾಮೀ,” ಎಂದಳು. ಯೇಸು ಅವಳಿಗೆ, “ನಾನೂ ನಿನಗೆ ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ, ಹೋಗು; ಇನ್ನು ಮೇಲೆ ಪಾಪಮಾಡಬೇಡ,” ಎಂದರು).", "r": "8:11"}, {"n": 50, "q": "“ಯೇಸು ಅವಳಿಗೆ, ‘ನಾನೂ ನಿನಗೆ ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ, ಹೋಗು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "8:11"}, {"n": 51, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:12ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಲೋಕಕ್ಕೆ ಬೆಳಕು", "r": "8:12"}, {"n": 52, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಜಗಜ್ಯೋತಿ ಎಂದು ಘೋಷಿಸಿದ ವಚನ ಯಾವುದು?", "a": "“ನಾನೇ ಜಗಜ್ಯೋತಿ, ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸುವವನು ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ. ಜೀವದಾಯಕ ಜ್ಯೋತಿ ಅವನಲ್ಲಿರುತ್ತದೆ.”", "r": "8:12"}, {"n": 53, "q": "ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸುವವನಲ್ಲಿ ಏನು ಇರುತ್ತದೆ?", "a": "ಜೀವದಾಯಕ ಜ್ಯೋತಿ", "r": "8:12"}, {"n": 54, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1ನೇ ಮತ್ತು 8ನೇ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಜ್ಯೋತಿಯ ಬಗ್ಗೆ ಹೇಳಿರುವುದೇನು?", "a": "ಜ್ಯೋತಿ ಕತ್ತಲಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ (1:5); ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸುವವನು ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ (8:12)", "r": "1:5; 8:12"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಾನೇ ಜಗಜ್ಯೋತಿ, ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ.”", "a": "ಹಿಂಬಾಲಿಸುವವನು", "r": "8:12"}, {"n": 56, "q": "“‘ನಾನೇ ಜಗಜ್ಯೋತಿ, ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸುವವನು ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "8:12"}, {"n": 57, "q": "“ನಾನೇ ಜಗಜ್ಯೋತಿ” ಎಂದಾಗ ಫರಿಸಾಯರು ಏನೆಂದರು?", "a": "“ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ”", "r": "8:13"}, {"n": 58, "q": "ಯೇಸುವಿನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ ಎಂದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರು", "r": "8:13"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ,’ ಎಂದರು.”", "a": "ಫರಿಸಾಯರು", "r": "8:13"}, {"n": 60, "q": "“ಅದಕ್ಕೆ ಫರಿಸಾಯರು, ‘ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "8:13"}, {"n": 61, "q": "ಯೊವಾನ್ನ 8:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಫರಿಸಾಯರು, “ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ,” ಎಂದರು.", "r": "8:13"}, {"n": 62, "q": "ತಮ್ಮ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯುಂಟು ಎಂದು ಯೇಸು ಹೇಳಲು ಕಾರಣವೇನು?", "a": "ತಾವು ಎಲ್ಲಿಂದ ಬಂದರು, ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿದ್ದಾರೆ ಎಂದು ಅವರಿಗೆ ತಿಳಿದಿರುವುದರಿಂದ", "r": "8:14"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಾನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದರೂ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯುಂಟು.”", "a": "ಯೇಸು", "r": "8:14"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು ಎಲ್ಲಿಂದ ಬಂದೆ, ಎಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನನಗೆ ತಿಳಿದಿದೆ.”", "a": "ಹೋಗುತ್ತಿರುವೆ", "r": "8:14"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ‘ಬಂದುದು ಎಲ್ಲಿಂದ, ಹೋಗುವುದು ಎಲ್ಲಿಗೆ’ ಎಂದು ತಿಳಿಯದು.”", "a": "ನಿಮಗಾದರೋ", "r": "8:14"}, {"n": 66, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಹೇಗೆ ತೀರ್ಪುಕೊಡುತ್ತಾರೆ?", "a": "ಲೋಕದ ದೃಷ್ಟಿಯಿಂದ", "r": "8:15"}, {"n": 67, "q": "ಯೇಸು ಯಾರ ಬಗ್ಗೆಯೂ ಏನು ಮಾಡಲು ಹೋಗುವುದಿಲ್ಲ?", "a": "ತೀರ್ಪುಕೊಡಲು", "r": "8:15"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ಯಾರ ಬಗ್ಗೆಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗುವುದಿಲ್ಲ.”", "a": "ತೀರ್ಪುಕೊಡಲು", "r": "8:15"}, {"n": 69, "q": "ಯೊವಾನ್ನ 8:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ತೀರ್ಪುಕೊಡುವುದು ಲೋಕದ ದೃಷ್ಟಿಯಿಂದ. ನಾನಾದರೋ ಯಾರ ಬಗ್ಗೆಯೂ ತೀರ್ಪುಕೊಡಲು ಹೋಗುವುದಿಲ್ಲ.", "r": "8:15"}, {"n": 70, "q": "“ನಾನಾದರೋ ಯಾರ ಬಗ್ಗೆಯೂ ತೀರ್ಪುಕೊಡಲು ಹೋಗುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "8:15"}, {"n": 71, "q": "ಯೇಸುವಿನ ತೀರ್ಪು ಏಕೆ ಯಥಾರ್ಥವಾದುದು?", "a": "ತೀರ್ಪುಕೊಡುವವನು ಅವರೊಬ್ಬರೇ ಅಲ್ಲ; ಅವರನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ಅವರೊಡನೆ ಇದ್ದಾರೆ", "r": "8:16"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನೊಡನೆ ಇದ್ದಾರೆ.”", "a": "ನನ್ನನ್ನು", "r": "8:16"}, {"n": 73, "q": "“ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನೊಡನೆ ಇದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "8:16"}, {"n": 74, "q": "ಯೊವಾನ್ನ 8:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ತೀರ್ಪುಕೊಟ್ಟರೂ ಅದು ಯಥಾರ್ಥವಾದುದು. ಕಾರಣ, ತೀರ್ಪುಕೊಡುವವನು ನಾನೊಬ್ಬನೇ ಅಲ್ಲ; ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನೊಡನೆ ಇದ್ದಾರೆ.", "r": "8:16"}, {"n": 75, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಯಾವ ಸಾಕ್ಷ್ಯ ಸತ್ಯ?", "a": "ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ", "r": "8:17"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿದೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ", "r": "8:17"}, {"n": 77, "q": "“ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ ಬರೆದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "8:17"}, {"n": 78, "q": "ಯೊವಾನ್ನ 8:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ ಬರೆದಿದೆ.", "r": "8:17"}, {"n": 79, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ಹೇಳುವ ಇಬ್ಬರು ಯಾರು?", "a": "ಯೇಸು ತಾವೇ ಮತ್ತು ಅವರನ್ನು ಕಳುಹಿಸಿದ ಪಿತ", "r": "8:18"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "8:18"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ನುಡಿದರು.”", "a": "ಹೇಳುತ್ತಾರೆ", "r": "8:18"}, {"n": 82, "q": "“ನಾನು ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ಹೇಳುತ್ತೇನೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "8:18"}, {"n": 83, "q": "ಫರಿಸಾಯರು ಯೇಸುವಿನ ಪಿತನ ಬಗ್ಗೆ ಏನು ಕೇಳಿದರು?", "a": "“ನಿನ್ನ ಪಿತನೆಲ್ಲಿ?”", "r": "8:19"}, {"n": 84, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಅವರನ್ನು ಅರಿತಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಅವರ ಪಿತನನ್ನೂ ಅರಿಯುತ್ತಿದ್ದರು", "r": "8:19"}, {"n": 85, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಯಾರನ್ನು ಅರಿತಿಲ್ಲ?", "a": "ಯೇಸುವನ್ನೂ ಅವರ ಪಿತನನ್ನೂ", "r": "8:19"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ‘ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಪಿತನೆಲ್ಲಿ", "r": "8:19"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನೀವು ನನ್ನನ್ನು ಅರಿತಿಲ್ಲ, ನನ್ನ ಪಿತನನ್ನೂ ಅರಿತಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "8:19"}, {"n": 88, "q": "ಲೋಕಕ್ಕೆ ಬೆಳಕು ಎಂಬ ವಿಭಾಗದ ಬೋಧನೆಯನ್ನು ಯೇಸು ಎಲ್ಲಿ ಮಾಡಿದರು?", "a": "ಮಹಾದೇವಾಲಯದೊಳಗೆ ಕಾಣಿಕೆ ಪೆಟ್ಟಿಗೆಗಳನ್ನಿಟ್ಟ ಕೋಣೆಯಲ್ಲಿ", "r": "8:20"}, {"n": 89, "q": "ಯೇಸುವನ್ನು ಯಾರೂ ಏಕೆ ಬಂಧಿಸಲಿಲ್ಲ (8:20)?", "a": "ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದಿದ್ದ ಕಾರಣ", "r": "8:20"}, {"n": 90, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು ಬಂಧನದಿಂದ/ಕಲ್ಲೆಸೆತದಿಂದ ತಪ್ಪಿಸಿಕೊಂಡ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಗಳಿಗೆ ಬಾರದಿದ್ದ ಕಾರಣ ಯಾರೂ ಬಂಧಿಸಲಿಲ್ಲ (8:20); ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡಾಗ ಮರೆಯಾಗಿ ಹೊರಟು ಹೋದರು (8:59)", "r": "8:20; 8:59"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಹಾದೇವಾಲಯದೊಳಗೆ ಕಾಣಿಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೋಣೆಯಲ್ಲಿ ಯೇಸು ಮಾತಾಡುತ್ತಾ ಹೇಳಿದ ಮಾತುಗಳಿವು.”", "a": "ಪೆಟ್ಟಿಗೆಗಳನ್ನಿಟ್ಟ", "r": "8:20"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದಿದ್ದ ಕಾರಣ ಯಾರೂ ಅವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂಧಿಸಲಿಲ್ಲ", "r": "8:20"}, {"n": 93, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನಾನು ಹೋಗುವಲ್ಲಿಗೆ ನೀವು ಬರಲಾರಿರಿ", "r": "8:21"}, {"n": 94, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಯಾವುದರಲ್ಲೇ ಸಾಯುವರು?", "a": "ತಮ್ಮ ಪಾಪದಲ್ಲೇ", "r": "8:21"}, {"n": 95, "q": "ಪಾಪದಲ್ಲೇ ಅಥವಾ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವಿರಿ ಎಂಬ ಎಚ್ಚರಿಕೆ ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ (8:21 ಒಂದು; 8:24 ಎರಡು)", "r": "8:21; 8:24"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುನಃ ಅವರಿಗೆ, ‘ನಾನು ಹೊರಟುಹೋಗುತ್ತೇನೆ, ನೀವು ನನ್ನನ್ನು ಹುಡುಕುವಿರಿ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:21"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಸಾಯುವಿರಿ.”", "a": "ಪಾಪದಲ್ಲೇ", "r": "8:21"}, {"n": 98, "q": "“ನಾನು ಹೋಗುವಲ್ಲಿಗೆ ನೀವು ಬರಲಾರಿರಿ” ಎಂಬುದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯರು ಏನೆಂದು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "‘ಹಾಗೆಂದರೆ ಆತ್ಮಹತ್ಯೆ ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂಬುದು ಇವನ ಇಂಗಿತವೆ?’", "r": "8:22"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ‘ತಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮಿಂದ ಬರಲಾಗದಂತೆ!”", "a": "ಹೋಗುವಲ್ಲಿಗೆ", "r": "8:22"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಂದರೆ ಆತ್ಮಹತ್ಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನ ಇಂಗಿತವೆ?’ ಎಂದು ಮಾತನಾಡಿಕೊಂಡರು.”", "a": "ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂಬುದು", "r": "8:22"}, {"n": 101, "q": "“ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ‘ತಾನು ಹೋಗುವಲ್ಲಿಗೆ ನಮ್ಮಿಂದ ಬರಲಾಗದಂತೆ!” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "8:22"}, {"n": 102, "q": "ಯೇಸು ಯೆಹೂದ್ಯರನ್ನು ತಮ್ಮೊಂದಿಗೆ ಹೇಗೆ ಹೋಲಿಸಿದರು?", "a": "“ನೀವು ನರಲೋಕದವರು, ನಾನು ಪರಲೋಕದವನು. ನಿಮ್ಮಂತೆ ನಾನು ಇಹಲೋಕದವನಲ್ಲ”", "r": "8:23"}, {"n": 103, "q": "ಯೊವಾನ್ನ 8:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀವು ನರಲೋಕದವರು, ನಾನು ಪರಲೋಕದವನು. ನಿಮ್ಮಂತೆ ನಾನು ಇಹಲೋಕದವನಲ್ಲ,", "r": "8:23"}, {"n": 104, "q": "ಯೆಹೂದ್ಯರು ಏನನ್ನು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರೆ ತಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವರು?", "a": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂಬುದನ್ನು", "r": "8:24"}, {"n": 105, "q": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂಬ ಮಾತು ಎಂಟನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ಎರಡು ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "8:24 ಮತ್ತು 8:28", "r": "8:24; 8:28"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ.”", "a": "ಸಾಯುವಿರೆಂದು", "r": "8:24"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಇರುವಾತನೇ ನಾನು’ ಎಂಬುದನ್ನು ನೀವು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರೆ ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವಿರಿ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "8:24"}, {"n": 108, "q": "“ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ನೀವು ಸಾಯುವಿರೆಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "8:24"}, {"n": 109, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು 8:25ರಲ್ಲಿ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಯಾರು?”", "r": "8:25"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ‘ನೀನು ಯಾರು?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಶ್ನಿಸಿದರು", "r": "8:25"}, {"n": 111, "q": "“ಅವರು, ‘ನೀನು ಯಾರು?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "8:25"}, {"n": 112, "q": "ಯೊವಾನ್ನ 8:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು, “ನೀನು ಯಾರು?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "8:25"}, {"n": 113, "q": "ಯೇಸು ಲೋಕಕ್ಕೆ ಏನನ್ನು ಸಾರುತ್ತಾರೆ?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಳಿದ್ದನ್ನೇ", "r": "8:26"}, {"n": 114, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಗಿದ್ದಾನೆ?", "a": "ಸತ್ಯಸ್ವರೂಪಿ", "r": "8:26"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಾನು ಯಾರೆಂದು ನಿಮಗೆ ಮೊದಲಿನಿಂದಲೂ ತಿಳಿಸುತ್ತಾ ಬಂದಿದ್ದೇನೆ.”", "a": "ಯೇಸು", "r": "8:26"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ನಾನು ಎಷ್ಟೋ ಹೇಳಿಯೇನು;”", "a": "ನಿಮ್ಮನ್ನು", "r": "8:26"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದನ್ನೇ ಲೋಕಕ್ಕೆ ಸಾರುತ್ತೇನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನು", "r": "8:26"}, {"n": 118, "q": "ಯೆಹೂದ್ಯರು ಏನನ್ನು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ?", "a": "ಯೇಸು ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಮಾತನಾಡುತ್ತಿದ್ದಾರೆಂದು", "r": "8:27"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:27"}, {"n": 120, "q": "“ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "8:27"}, {"n": 121, "q": "ಯೊವಾನ್ನ 8:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.", "r": "8:27"}, {"n": 122, "q": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂದು ಯೆಹೂದ್ಯರಿಗೆ ಯಾವಾಗ ತಿಳಿಯುವುದು?", "a": "ಅವರು ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೇರಿಸಿದಾಗ", "r": "8:28"}, {"n": 123, "q": "ಯೇಸು ಹೇಗೆ ಮಾತನಾಡುತ್ತಾರೆ?", "a": "ಪಿತನು ತಮಗೆ ಬೋಧಿಸಿದಂತೆ", "r": "8:28"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನರಪುತ್ರನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಇರುವಾತನೇ ನಾನು’ ಎಂದು ನಿಮಗೆ ತಿಳಿಯುವುದು.”", "a": "ಮೇಲಕ್ಕೇರಿಸಿದಾಗ", "r": "8:28"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾಗಿಯೇ ಏನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತನು ನನಗೆ ಬೋಧಿಸಿದಂತೆ ನಾನು ಮಾತನಾಡುತ್ತೇನೆಂದೂ ನಿಮಗೆ ಆಗ ಅರಿವಾಗುವುದು.”", "a": "ಮಾಡುವುದಿಲ್ಲವೆಂದೂ", "r": "8:28"}, {"n": 126, "q": "“‘ನರಪುತ್ರನನ್ನು ನೀವು ಮೇಲಕ್ಕೇರಿಸಿದಾಗ, ‘ಇರುವಾತನೇ ನಾನು’ ಎಂದು ನಿಮಗೆ ತಿಳಿಯುವುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "8:28"}, {"n": 127, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಅವರನ್ನು ಏಕಾಕಿಯಾಗಿ ಏಕೆ ಬಿಟ್ಟಿಲ್ಲ?", "a": "ಆತನು ಮೆಚ್ಚುವುದನ್ನೇ ಯೇಸು ಸತತವೂ ಮಾಡುವುದರಿಂದ", "r": "8:29"}, {"n": 128, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಎಲ್ಲಿದ್ದಾನೆ?", "a": "ಯೇಸುವಿನೊಡನಿದ್ದಾನೆ", "r": "8:29"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಸತತವೂ ಮಾಡುವುದರಿಂದ ಆತನು ನನ್ನನ್ನು ಏಕಾಕಿಯಾಗಿ ಬಿಟ್ಟಿಲ್ಲ.’”", "a": "ಮೆಚ್ಚುವುದನ್ನೇ", "r": "8:29"}, {"n": 130, "q": "“ಆತನು ಮೆಚ್ಚುವುದನ್ನೇ ನಾನು ಸತತವೂ ಮಾಡುವುದರಿಂದ ಆತನು ನನ್ನನ್ನು ಏಕಾಕಿಯಾಗಿ ಬಿಟ್ಟಿಲ್ಲ.’” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "8:29"}, {"n": 131, "q": "ಯೊವಾನ್ನ 8:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನು ನನ್ನೊಡನಿದ್ದಾನೆ. ಆತನು ಮೆಚ್ಚುವುದನ್ನೇ ನಾನು ಸತತವೂ ಮಾಡುವುದರಿಂದ ಆತನು ನನ್ನನ್ನು ಏಕಾಕಿಯಾಗಿ ಬಿಟ್ಟಿಲ್ಲ.”", "r": "8:29"}, {"n": 132, "q": "ಯೇಸುವಿನ ಮಾತುಗಳನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಏನಾಯಿತು?", "a": "ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು", "r": "8:30"}, {"n": 133, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:30"}, {"n": 134, "q": "“ಯೇಸುಸ್ವಾಮಿ ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "8:30"}, {"n": 135, "q": "ಯೊವಾನ್ನ 8:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.", "r": "8:30"}, {"n": 136, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:31ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದಾಸ್ಯ ಮತ್ತು ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:31"}, {"n": 137, "q": "ಯಾರು ನಿಜವಾಗಿಯೂ ಯೇಸುವಿನ ಶಿಷ್ಯರು?", "a": "ಅವರ ಮಾತಿಗೆ ಶರಣಾದವರು", "r": "8:31"}, {"n": 138, "q": "“ನನ್ನ ಮಾತಿಗೆ ನೀವು ಶರಣಾದರೆ ನಿಜವಾಗಿಯೂ ನೀವು ನನ್ನ ಶಿಷ್ಯರು” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ತಮ್ಮಲ್ಲಿ ನಂಬಿಕೆ ಇಟ್ಟಿದ್ದ ಯೆಹೂದ್ಯರಿಗೆ", "r": "8:31"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನನ್ನ ಮಾತಿಗೆ ನೀವು ಶರಣಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನ ಶಿಷ್ಯರು.”", "a": "ನಿಜವಾಗಿಯೂ", "r": "8:31"}, {"n": 140, "q": "“‘ನನ್ನ ಮಾತಿಗೆ ನೀವು ಶರಣಾದರೆ ನಿಜವಾಗಿಯೂ ನೀವು ನನ್ನ ಶಿಷ್ಯರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "8:31"}, {"n": 141, "q": "ಸತ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಹೇಳಿದ ಪ್ರಸಿದ್ಧ ಮಾತು ಯಾವುದು?", "a": "“ನೀವು ಸತ್ಯವನ್ನು ಅರಿತುಕೊಳ್ಳುವಿರಿ. ಸತ್ಯವು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುವುದು.”", "r": "8:32"}, {"n": 142, "q": "ಸತ್ಯವು ಏನನ್ನು ನೀಡುವುದು?", "a": "ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:32"}, {"n": 143, "q": "ಯೊವಾನ್ನ 8:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಸತ್ಯವನ್ನು ಅರಿತುಕೊಳ್ಳುವಿರಿ. ಸತ್ಯವು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುವುದು.”", "r": "8:32"}, {"n": 144, "q": "ಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಕೇಳಿದ ಯೆಹೂದ್ಯರು ತಮ್ಮ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ನಾವು ಅಬ್ರಹಾಮನ ವಂಶಜರು; ಯಾರಿಗೂ ಎಂದೂ ನಾವು ದಾಸರಾಗಿಲ್ಲ.”", "r": "8:33"}, {"n": 145, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಅಬ್ರಹಾಮನನ್ನು ಹೇಗೆ ಉಲ್ಲೇಖಿಸುತ್ತಾರೆ?", "a": "“ನಾವು ಅಬ್ರಹಾಮನ ವಂಶಜರು” (8:33); “ಅಬ್ರಹಾಮನೇ ನಮ್ಮ ತಂದೆ” (8:39); “ನಮ್ಮ ತಂದೆ ಅಬ್ರಹಾಮ” (8:53)", "r": "8:33; 8:39; 8:53"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ‘ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಂಶಜರು;”", "a": "ಅಬ್ರಹಾಮನ", "r": "8:33"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದಮೇಲೆ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನೀನು ಹೇಳುವುದಾದರೂ ಹೇಗೆ?’ ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ಸ್ವತಂತ್ರರಾಗುತ್ತೇವೆ", "r": "8:33"}, {"n": 148, "q": "“ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ‘ನಾವು ಅಬ್ರಹಾಮನ ವಂಶಜರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "8:33"}, {"n": 149, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪಾಪವನ್ನು ಮಾಡುವವನು ಏನಾಗಿದ್ದಾನೆ?", "a": "ಪಾಪಕ್ಕೆ ದಾಸನೇ", "r": "8:34"}, {"n": 150, "q": "ಯೊವಾನ್ನ 8:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ ಕೇಳಿ: ಪಾಪವನ್ನು ಮಾಡುವವನು ಪಾಪಕ್ಕೆ ದಾಸನೇ.", "r": "8:34"}, {"n": 151, "q": "ದಾಸನಿಗೂ ಪುತ್ರನಿಗೂ ಮನೆಯಲ್ಲಿ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ದಾಸನಾದವನು ಶಾಶ್ವತವಾಗಿ ಮನೆಯಲ್ಲಿ ಇರುವಂತಿಲ್ಲ; ಶಾಶ್ವತವಾಗಿ ಇರುವವನು ಪುತ್ರನೇ", "r": "8:35"}, {"n": 152, "q": "ಯೊವಾನ್ನ 8:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಾಸನಾದವನು ಶಾಶ್ವತವಾಗಿ ಮನೆಯಲ್ಲಿ ಇರುವಂತಿಲ್ಲ. ಶಾಶ್ವತವಾಗಿ ಇರುವವನು ಪುತ್ರನೇ.", "r": "8:35"}, {"n": 153, "q": "ಪುತ್ರನು ನೀಡುವ ಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.”", "r": "8:36"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.”", "a": "ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:36"}, {"n": 155, "q": "“ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "8:36"}, {"n": 156, "q": "ಯೊವಾನ್ನ 8:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.", "r": "8:36"}, {"n": 157, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಏಕೆ ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದರು?", "a": "ಅವರ ಮಾತು ಹಿಡಿಸದ ಕಾರಣ", "r": "8:37"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಂಶಜರೆಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಅಬ್ರಹಾಮನ", "r": "8:37"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನ್ನ ಮಾತು ಹಿಡಿಸದ ಕಾರಣ ನನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹವಣಿಸುತ್ತೀರಿ", "r": "8:37"}, {"n": 160, "q": "“ನೀವು ಅಬ್ರಹಾಮನ ವಂಶಜರೆಂದು ನಾನು ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "8:37"}, {"n": 161, "q": "ಯೇಸುವಿನ ಮಾತುಗಳು ಮತ್ತು ಯೆಹೂದ್ಯರ ಕಾರ್ಯಗಳು ಏನನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ?", "a": "ಯೇಸುವಿನ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ಕಂಡದ್ದನ್ನು ನಿರೂಪಿಸುತ್ತವೆ; ಯೆಹೂದ್ಯರ ಕಾರ್ಯಗಳು ಅವರ ತಂದೆಯಿಂದ ಕಲಿತದ್ದನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾಡುವ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ನಾನು ಕಂಡದ್ದನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಿರೂಪಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಮಾಡುವ ಕಾರ್ಯಗಳೋ ನಿಮ್ಮ ತಂದೆಯಿಂದ ನೀವು ಕಲಿತದ್ದನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದರು.”", "a": "ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 164, "q": "“ನಾನಾಡುವ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ನಾನು ಕಂಡದ್ದನ್ನೇ ನಿರೂಪಿಸುತ್ತವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "8:38"}, {"n": 165, "q": "ಯೆಹೂದ್ಯರು ತಮ್ಮ ತಂದೆ ಯಾರೆಂದು ಮರುನುಡಿದರು?", "a": "“ಅಬ್ರಹಾಮನೇ ನಮ್ಮ ತಂದೆ”", "r": "8:39"}, {"n": 166, "q": "ಯೆಹೂದ್ಯರು ಅಬ್ರಹಾಮನ ಮಕ್ಕಳಾಗಿದ್ದರೆ ಏನು ಮಾಡುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅಬ್ರಹಾಮನು ಮಾಡಿದಂತೆ ಮಾಡುತ್ತಿದ್ದರು", "r": "8:39"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಯೆಹೂದ್ಯರು, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮ ತಂದೆ,’ ಎಂದು ಮರುನುಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನೇ", "r": "8:39"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ‘ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು ನೀವಾಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಂತೆ ನೀವು ಮಾಡುತ್ತಿದ್ದಿರಿ.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:39"}, {"n": 169, "q": "“ಆಗ ಆ ಯೆಹೂದ್ಯರು, ‘ಅಬ್ರಹಾಮನೇ ನಮ್ಮ ತಂದೆ,’ ಎಂದು ಮರುನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "8:39"}, {"n": 170, "q": "ಯೆಹೂದ್ಯರು ಯಾರನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ಅವರಿಗೆ ಹೇಳುತ್ತಿರುವ ಯೇಸುವನ್ನು", "r": "8:40"}, {"n": 171, "q": "ಅಬ್ರಹಾಮನು ಏನು ಮಾಡಲಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಸತ್ಯವನ್ನು ಹೇಳುವವನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸಲಿಲ್ಲ (ಹಾಗೇನೂ ಮಾಡಲಿಲ್ಲ)", "r": "8:40"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ನಿಮಗೆ ಹೇಳುತ್ತಿರುವ ನನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹವಣಿಸುತ್ತಿದ್ದೀರಿ", "r": "8:40"}, {"n": 173, "q": "“ಅದಕ್ಕೆ ಬದಲಾಗಿ ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ನಿಮಗೆ ಹೇಳುತ್ತಿರುವ ನನ್ನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "8:40"}, {"n": 174, "q": "ಯೊವಾನ್ನ 8:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಬದಲಾಗಿ ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ನಿಮಗೆ ಹೇಳುತ್ತಿರುವ ನನ್ನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದೀರಿ. ಅಬ್ರಹಾಮನು ಹಾಗೇನೂ ಮಾಡಲಿಲ್ಲ.", "r": "8:40"}, {"n": 175, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಯೆಹೂದ್ಯರು ಹೇಗೆ ಪ್ರತಿಭಟಿಸಿದರು?", "a": "“ನಾವೇನು ಹಾದರಕ್ಕೆ ಹುಟ್ಟಿದವರಲ್ಲ, ದೇವರೇ ನಮ್ಮ ತಂದೆ”", "r": "8:41"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಾದರೋ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಂತೆ ಮಾಡುತ್ತೀರಿ,’ ಎಂದರು.”", "a": "ತಂದೆಯಾದವನು", "r": "8:41"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ‘ನಾವೇನು ಹಾದರಕ್ಕೆ ಹುಟ್ಟಿದವರಲ್ಲ, ದೇವರೇ ನಮ್ಮ ತಂದೆ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರತಿಭಟಿಸಿದರು", "r": "8:41"}, {"n": 178, "q": "“ನೀವಾದರೋ ನಿಮಗೆ ತಂದೆಯಾದವನು ಮಾಡಿದಂತೆ ಮಾಡುತ್ತೀರಿ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "8:41"}, {"n": 179, "q": "ದೇವರು ಯೆಹೂದ್ಯರ ತಂದೆಯಾಗಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ಮೇಲೆ ಅವರಿಗೆ ಪ್ರೀತಿಯಿರುತ್ತಿತ್ತು", "r": "8:42"}, {"n": 180, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದವರು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ದೇವರೇ", "r": "8:42"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಅವರಿಗೆ, ‘ದೇವರೇ ನಿಮ್ಮ ತಂದೆಯಾಗಿದ್ದರೆ, ನನ್ನ ಮೇಲೆ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರೀತಿಯಿರುತ್ತಿತ್ತು", "r": "8:42"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟು ಇಲ್ಲಿಗೆ ಬಂದವನು.”", "a": "ದೇವರಿಂದಲೇ", "r": "8:42"}, {"n": 183, "q": "“ಯೇಸು, ಅವರಿಗೆ, ‘ದೇವರೇ ನಿಮ್ಮ ತಂದೆಯಾಗಿದ್ದರೆ, ನನ್ನ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿರುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "8:42"}, {"n": 184, "q": "ಯೇಸು ಹೇಳುವುದು ಯೆಹೂದ್ಯರಿಗೆ ಏಕೆ ಅರ್ಥವಾಗುವುದಿಲ್ಲ?", "a": "ಅವರ ಸಂದೇಶಕ್ಕೆ ಕಿವಿಗೊಡಲು ಅವರಿಂದಾಗದಿರುವುದರಿಂದ", "r": "8:43"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹೇಳುವುದು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏಕೆ?”", "a": "ಅರ್ಥವಾಗುವುದಿಲ್ಲ", "r": "8:43"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಸಂದೇಶಕ್ಕೆ ಕಿವಿಗೊಡಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದಕ್ಕೆ ಕಾರಣ.”", "a": "ನಿಮ್ಮಿಂದಾಗದಿರುವುದೇ", "r": "8:43"}, {"n": 187, "q": "“ನಾನು ಹೇಳುವುದು ನಿಮಗೆ ಅರ್ಥವಾಗುವುದಿಲ್ಲ, ಏಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "8:43"}, {"n": 188, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರ ತಂದೆ ಯಾರು?", "a": "ಸೈತಾನ", "r": "8:44"}, {"n": 189, "q": "ಯೇಸು ಸೈತಾನನನ್ನು ವರ್ಣಿಸಲು ಉಪಯೋಗಿಸಿದ ನಾಲ್ಕು ವಿಶೇಷಣಗಳು ಯಾವುವು?", "a": "ಕೊಲೆಪಾತಕ; ಸತ್ಯಪರನಲ್ಲ; ಸುಳ್ಳುಗಾರ; ಸುಳ್ಳಿನ ಮೂಲಪುರುಷ", "r": "8:44"}, {"n": 190, "q": "ಸೈತಾನನು ಯಾವಾಗಿನಿಂದ ಕೊಲೆಪಾತಕ?", "a": "ಮೊತ್ತ ಮೊದಲಿನಿಂದಲೂ", "r": "8:44"}, {"n": 191, "q": "ಸೈತಾನನು ಸುಳ್ಳಾಡುವಾಗ ಏನನ್ನು ಆಡುತ್ತಾನೆ?", "a": "ತನಗೆ ಸಹಜವಾದುದನ್ನೇ", "r": "8:44"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನಿಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮಾಡಬಯಸುತ್ತೀರಿ;”", "a": "ಮಾಡಬಯಸುವುದನ್ನು", "r": "8:44"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಲ್ಲಿ ಇಲ್ಲದ ಕಾರಣ ಅವನು ಸತ್ಯಪರನಲ್ಲ.”", "a": "ಸತ್ಯವೆಂಬುದೇ", "r": "8:44"}, {"n": 194, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲದ್ದಕ್ಕೆ ಯೇಸು ಕೊಟ್ಟ ಕಾರಣವೇನು?", "a": "ಯೇಸು ನುಡಿಯುವುದು ಸತ್ಯವನ್ನೇ", "r": "8:45"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.”", "a": "ಆದುದರಿಂದಲೇ", "r": "8:45"}, {"n": 196, "q": "“ಆದುದರಿಂದಲೇ ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "8:45"}, {"n": 197, "q": "ಯೊವಾನ್ನ 8:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನುಡಿಯುವುದಾದರೋ ಸತ್ಯವನ್ನೇ. ಆದುದರಿಂದಲೇ ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.", "r": "8:45"}, {"n": 198, "q": "ತಮ್ಮಲ್ಲಿ ತಪ್ಪಿದೆಯೇ ಎಂದು ಯೇಸು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು ಸಮರ್ಥಿಸಬಲ್ಲವರು ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?”", "r": "8:46"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?”", "a": "ಸಮರ್ಥಿಸಬಲ್ಲವರು", "r": "8:46"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸತ್ಯವನ್ನೇ ಆಡುವುದಾದರೆ ನನ್ನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ನಂಬುವುದಿಲ್ಲವೇಕೆ", "r": "8:46"}, {"n": 201, "q": "“ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು ಸಮರ್ಥಿಸಬಲ್ಲವರು ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "8:46"}, {"n": 202, "q": "ದೇವರ ಮಾತಿಗೆ ಕಿವಿಗೊಡುವವರು ಯಾರು?", "a": "ದೇವರ ಮಕ್ಕಳು", "r": "8:47"}, {"n": 203, "q": "ಯೆಹೂದ್ಯರು ದೇವರ ಮಾತಿಗೆ ಏಕೆ ಕಿವಿಗೊಡುವುದಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅವರು ದೇವರ ಮಕ್ಕಳಲ್ಲದ್ದರಿಂದ", "r": "8:47"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮಕ್ಕಳು ದೇವರ ಮಾತಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಿವಿಗೊಡುತ್ತಾರೆ", "r": "8:47"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವೋ ದೇವರ ಮಕ್ಕಳಲ್ಲ, ಆದುದರಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ನುಡಿದರು.”", "a": "ಕಿವಿಗೊಡುವುದಿಲ್ಲ", "r": "8:47"}, {"n": 206, "q": "“ದೇವರ ಮಕ್ಕಳು ದೇವರ ಮಾತಿಗೆ ಕಿವಿಗೊಡುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "8:47"}, {"n": 207, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:48ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಅಬ್ರಹಾಮ", "r": "8:48"}, {"n": 208, "q": "ಯೆಹೂದ್ಯರಲ್ಲಿ ಕೆಲವರು ಯೇಸುವನ್ನು ಯಾವ ಎರಡು ರೀತಿಯಲ್ಲಿ ಕರೆದರು?", "a": "ಸಮಾರಿಯದವನು; ದೆವ್ವಹಿಡಿದವನು", "r": "8:48"}, {"n": 209, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು “ದೆವ್ವಹಿಡಿದವನು” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಕರೆದರು?", "a": "ಎರಡು ಬಾರಿ (8:48; 8:52)", "r": "8:48; 8:52"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೆಹೂದ್ಯರಲ್ಲಿ ಕೆಲವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನೀನು ಸಮಾರಿಯದವನು.”", "a": "ಯೇಸುಸ್ವಾಮಿಗೆ", "r": "8:48"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನಾವು ಹೇಳಿದ್ದು ಸರಿಯಾಗಿದೆ ಅಲ್ಲವೆ?’ ಎಂದರು.”", "a": "ದೆವ್ವಹಿಡಿದವನು", "r": "8:48"}, {"n": 212, "q": "“ದೆವ್ವಹಿಡಿದವನು” ಎಂದು ಕರೆದಾಗ ಯೇಸು ಏನು ಉತ್ತರಿಸಿದರು?", "a": "“ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ. ನೀವಾದರೋ ನನ್ನನ್ನು ಅವಮಾನಪಡಿಸುತ್ತೀರಿ.”", "r": "8:49"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ.”", "a": "ಯೇಸು", "r": "8:49"}, {"n": 214, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ‘ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "8:49"}, {"n": 215, "q": "ಯೊವಾನ್ನ 8:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ. ನೀವಾದರೋ ನನ್ನನ್ನು ಅವಮಾನಪಡಿಸುತ್ತೀರಿ.", "r": "8:49"}, {"n": 216, "q": "ಯೇಸು ತಮ್ಮ ಯಾವುದನ್ನು ಅಪೇಕ್ಷಿಸುವುದಿಲ್ಲ?", "a": "ತಮ್ಮ ಘನತೆ ಗೌರವವನ್ನು", "r": "8:50"}, {"n": 217, "q": "ಯೇಸುವಿನ ಘನತೆ ಗೌರವವನ್ನು ಅಪೇಕ್ಷಿಸುವವರು ಮತ್ತು ಅವರ ಪರವಾಗಿ ತೀರ್ಮಾನ ಮಾಡುವವರು ಯಾರು?", "a": "ಬೇರೊಬ್ಬರು (ಪಿತನು)", "r": "8:50"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಘನತೆ ಗೌರವವನ್ನು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಪೇಕ್ಷಿಸುವುದಿಲ್ಲ", "r": "8:50"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ತೀರ್ಮಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರೇ.”", "a": "ಮಾಡುವುದೂ", "r": "8:50"}, {"n": 220, "q": "“ನನ್ನ ಘನತೆ ಗೌರವವನ್ನು ನಾನು ಅಪೇಕ್ಷಿಸುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 50", "r": "8:50"}, {"n": 221, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ಯಾವುದಕ್ಕೆ ತುತ್ತಾಗನು?", "a": "ನಿತ್ಯಮರಣಕ್ಕೆ", "r": "8:51"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ,’ ಎಂದರು.”", "a": "ನಿತ್ಯಮರಣಕ್ಕೆ", "r": "8:51"}, {"n": 223, "q": "“ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ನಿತ್ಯಮರಣಕ್ಕೆ ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ,’ ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "8:51"}, {"n": 224, "q": "ಯೊವಾನ್ನ 8:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ನಿತ್ಯಮರಣಕ್ಕೆ ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ,” ಎಂದರು.", "r": "8:51"}, {"n": 225, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಸತ್ತುಹೋದವರು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು ಮತ್ತು ಪ್ರವಾದಿಗಳು", "r": "8:52"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ನಮಗೆ ಸ್ಪಷ್ಟವಾಯಿತು.”", "a": "ದೆವ್ವಹಿಡಿದವನೆಂದು", "r": "8:52"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನೀನು, ‘ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ಎಂದೆಂದಿಗೂ ಸಾವಿಗೆ ತುತ್ತಾಗನು,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತಿರುವೆ", "r": "8:52"}, {"n": 228, "q": "“‘ನೀನು ದೆವ್ವಹಿಡಿದವನೆಂದು ಈಗ ನಮಗೆ ಸ್ಪಷ್ಟವಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 52", "r": "8:52"}, {"n": 229, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವನ್ನು ಏನು ಕೇಳಿದರು?", "a": "“ನಮ್ಮ ತಂದೆ ಅಬ್ರಹಾಮನಿಗಿಂತಲೂ ನೀನು ಶ್ರೇಷ್ಟನೋ?”", "r": "8:53"}, {"n": 230, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಕೊನೆಯ ಪ್ರಶ್ನೆ ಯಾವುದು (8:53)?", "a": "“ನೀನು ಯಾರೆಂದು ನಿನ್ನ ಎಣಿಕೆ?”", "r": "8:53"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಶ್ರೇಷ್ಟನೋ?”", "a": "ಅಬ್ರಹಾಮನಿಗಿಂತಲೂ", "r": "8:53"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರವಾದಿಗಳೂ ಸಾವಿಗೆ ಈಡಾಗಿರುವರು;”", "a": "ಸಾವಿಗೀಡಾದನು", "r": "8:53"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಯಾರೆಂದು ನಿನ್ನ ಎಣಿಕೆ?’ ಎಂದು ಆ ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳಿದರು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "8:53"}, {"n": 234, "q": "ಯೇಸುವಿನ ಘನತೆಗೌರವವನ್ನು ಸಾರುವವರು ಯಾರು?", "a": "ಅವರ ಪಿತನು", "r": "8:54"}, {"n": 235, "q": "ಯೇಸುವಿನ ಪಿತನನ್ನು ಕುರಿತು ಯೆಹೂದ್ಯರು ಏನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾರೆ?", "a": "‘ಅವರು ನಮ್ಮ ದೇವರು’", "r": "8:54"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರತ್ಯುತ್ತರವಾಗಿ, ‘ನನ್ನ ಘನತೆಗೌರವವನ್ನು ನಾನೇ ಸಾರಹೊರಟರೆ ಅದಕ್ಕೆ ಬೆಲೆಯಿರದು.”", "a": "ಯೇಸು", "r": "8:54"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾರುವವರಾದರೋ ನನ್ನ ಪಿತನು.”", "a": "ಘನತೆಗೌರವವನ್ನು", "r": "8:54"}, {"n": 238, "q": "ಪಿತನ ಅರಿವು ತಮಗಿಲ್ಲವೆಂದು ಹೇಳಿದರೆ ಯೇಸು ಏನಾಗುತ್ತಾರೆ?", "a": "ಯೆಹೂದ್ಯರಂತೆ ಸುಳ್ಳುಗಾರರಾಗುತ್ತಾರೆ", "r": "8:55"}, {"n": 239, "q": "ಯೇಸು ಪಿತನ ಯಾವುದನ್ನು ಪಾಲಿಸುತ್ತಾರೆ?", "a": "ಅವರ ಮಾತನ್ನು", "r": "8:55"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಅರಿವು ನನಗಿಲ್ಲವೆಂದು ನಾನು ಹೇಳಿದೆಯಾದರೆ ನಿಮ್ಮಂತೆ ನಾನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸುಳ್ಳುಗಾರನಾಗುತ್ತೇನೆ", "r": "8:55"}, {"n": 241, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರ ಅರಿವು ನನಗಿಲ್ಲವೆಂದು ನಾನು …”", "a": "“… ಹೇಳಿದೆಯಾದರೆ ನಿಮ್ಮಂತೆ ನಾನೂ ಸುಳ್ಳುಗಾರನಾಗುತ್ತೇನೆ.”", "r": "8:55"}, {"n": 242, "q": "ಅಬ್ರಹಾಮನು ಯಾವುದನ್ನು ಕಾಣುವನೆಂದು ಹಿಗ್ಗಿದನು?", "a": "ಯೇಸುವಿನ ದಿನವನ್ನು", "r": "8:56"}, {"n": 243, "q": "ಅಬ್ರಹಾಮನು ಯೇಸುವಿನ ದಿನವನ್ನು ಕಂಡು ಏನು ಮಾಡಿದನು?", "a": "ಹಿಗ್ಗಿದನು", "r": "8:56"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ದಿನವನ್ನು ತಾನು ಕಾಣುವನೆಂದು ಹಿಗ್ಗಿದನು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:56"}, {"n": 245, "q": "“ನಿಮ್ಮ ತಂದೆ ಅಬ್ರಹಾಮನು ನನ್ನ ದಿನವನ್ನು ತಾನು ಕಾಣುವನೆಂದು ಹಿಗ್ಗಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 56", "r": "8:56"}, {"n": 246, "q": "ಯೇಸುವಿನ ವಯಸ್ಸಿನ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರು ಏನೆಂದರು?", "a": "“ನಿನಗಿನ್ನೂ ಐವತ್ತು ವರ್ಷವಾಗಿಲ್ಲ; ನೀನು ಅಬ್ರಹಾಮನನ್ನು ನೋಡಿದ್ದೀಯಾ?”", "r": "8:57"}, {"n": 247, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸುವಿಗೆ ಇನ್ನೂ ಎಷ್ಟು ವರ್ಷವಾಗಿರಲಿಲ್ಲ?", "a": "ಐವತ್ತು ವರ್ಷ", "r": "8:57"}, {"n": 248, "q": "ಯೊವಾನ್ನ 8:57 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರು, “ನಿನಗಿನ್ನೂ ಐವತ್ತು ವರ್ಷವಾಗಿಲ್ಲ; ನೀನು ಅಬ್ರಹಾಮನನ್ನು ನೋಡಿದ್ದೀಯಾ?” ಎಂದರು.", "r": "8:57"}, {"n": 249, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಯೇಸು ಮರುನುಡಿದ ಮಾತು ಯಾವುದು?", "a": "“ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ”", "r": "8:58"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವರಿಗೆ, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ,’ ಎಂದು ಮರುನುಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:58"}, {"n": 251, "q": "“ಯೇಸು ಅವರಿಗೆ, ‘ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ,’ ಎಂದು ಮರುನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 58", "r": "8:58"}, {"n": 252, "q": "ಯೊವಾನ್ನ 8:58 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವರಿಗೆ, “ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ,” ಎಂದು ಮರುನುಡಿದರು.", "r": "8:58"}, {"n": 253, "q": "“ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ” ಎಂಬುದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವಿನತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು", "r": "8:59"}, {"n": 254, "q": "ಯೆಹೂದ್ಯರು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡಾಗ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಮರೆಯಾಗಿ ಮಹಾದೇವಾಲಯದಿಂದ ಹೊರಟು ಹೋದರು", "r": "8:59"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ್ದೇ ಆ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು.”", "a": "ಯೇಸುವಿನತ್ತ", "r": "8:59"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರೆಯಾಗಿ ಮಹಾದೇವಾಲಯದಿಂದ ಹೊರಟು ಹೋದರು.”", "a": "ಯೇಸುವಾದರೋ", "r": "8:59"}]}]}</script>

  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>

</html>
