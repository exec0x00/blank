"><\/span> ಒಂದು ಮದುವೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಊರಿನಲ್ಲಿ; ನಡೆಯಿತು", "r": "2:1"}, {"n": 13, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಬಂದಿದ್ದವರು ಯಾರು?", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ", "r": "2:2"}, {"n": 14, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಯಾರಿಗೆ ಆಮಂತ್ರಣವಿತ್ತು?", "a": "ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ", "r": "2:2"}, {"n": 15, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಮೊದಲೇ ಬಂದಿದ್ದವರೆಂದು ಹೇಳಲಾದವರು ಯಾರು?", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ", "r": "2:2"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.”", "a": "ಯೇಸುವಿಗೂ", "r": "2:2"}, {"n": 17, "q": "ಯೊವಾನ್ನ 2:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ ಅಲ್ಲಿಗೆ ಬಂದಿದ್ದರು. ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.", "r": "2:2"}, {"n": 18, "q": "“ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಮಂತ್ರಣವಿತ್ತು", "r": "2:2"}, {"n": 20, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಯಾವುದು ಸಾಲದೆ ಹೋಯಿತು?", "a": "ದ್ರಾಕ್ಷಾರಸ", "r": "2:3"}, {"n": 21, "q": "ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋದಾಗ ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ”", "r": "2:3"}, {"n": 22, "q": "“ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ", "r": "2:3"}, {"n": 23, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯ ಘಟನೆಯಲ್ಲಿ ಬರುವ ವ್ಯಕ್ತಿಗಳು/ಗುಂಪುಗಳು ಯಾರು?", "a": "ಯೇಸು, ಯೇಸುವಿನ ತಾಯಿ, ಶಿಷ್ಯರು, ಸೇವಕರು, ಔತಣದ ಮೇಲ್ವಿಚಾರಕ, ಮದುಮಗ", "r": "2:3–10"}, {"n": 24, "q": "ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ ದ್ರಾಕ್ಷಾರಸದ ಬಗ್ಗೆ ಯಾವಾಗ ಹೇಳಿದರು?", "a": "ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋದಾಗ", "r": "2:3"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು.”", "a": "ಸಂದರ್ಭದಲ್ಲಿ", "r": "2:3"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೇಸುವಿನ ತಾಯಿ, ‘ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದರು.”", "a": "ಯೇಸುವಿಗೆ", "r": "2:3"}, {"n": 27, "q": "“ಆ ಸಂದರ್ಭದಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 28, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಯೇಸುವಿನ ತಾಯಿ, ‘ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ …”", "a": "“… ಮುಗಿದು ಹೋಗಿದೆ,’ ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.”", "r": "2:3"}, {"n": 29, "q": "ಯೊವಾನ್ನ 2:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಸಂದರ್ಭದಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು. ಆಗ ಯೇಸುವಿನ ತಾಯಿ, “ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ,” ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.", "r": "2:3"}, {"n": 30, "q": "“ಆಗ ಯೇಸುವಿನ ತಾಯಿ, ‘ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ,’ ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾಯಿ, ‘ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ,’ ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.”", "a": "ಯೇಸುವಿನ", "r": "2:3"}, {"n": 32, "q": "ತಾಯಿಯ ಮಾತಿಗೆ ಯೇಸು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟರು?", "a": "“ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ? ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ”", "r": "2:4"}, {"n": 33, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಯೇಸು ತಮ್ಮ ಯಾವುದು ಇನ್ನೂ ಬಂದಿಲ್ಲ ಎಂದರು?", "a": "ತಮ್ಮ ಗಳಿಗೆ", "r": "2:4"}, {"n": 34, "q": "ಯೇಸು ತಮ್ಮ ತಾಯಿಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಅಮ್ಮಾ”", "r": "2:4"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ?”", "a": "ಯೇಸು", "r": "2:4"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಬಂದಿಲ್ಲ", "r": "2:4"}, {"n": 37, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ‘ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 38, "q": "ಯೊವಾನ್ನ 2:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ? ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.", "r": "2:4"}, {"n": 39, "q": "“ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ‘ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುತ್ತೀ", "r": "2:4"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನೂ ಬಂದಿಲ್ಲ,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಗಳಿಗೆ", "r": "2:4"}, {"n": 42, "q": "ಯೇಸುವಿನ ತಾಯಿ ಸೇವಕರಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದರು?", "a": "“ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ”", "r": "2:5"}, {"n": 43, "q": "“ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ ಸೇವಕರಿಗೆ", "r": "2:5"}, {"n": 44, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಸೇವಕರಿಗೆ ಆಜ್ಞೆ ಕೊಟ್ಟ ಇಬ್ಬರು ಯಾರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ (2:5) ಮತ್ತು ಯೇಸು (2:7–8)", "r": "2:5; 2:7; 2:8"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ ಸೇವಕರಿಗೆ, ‘ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದರು", "r": "2:5"}, {"n": 46, "q": "“ತಾಯಿ ಸೇವಕರಿಗೆ, ‘ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ,’ ಎಂದು ತಿಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 47, "q": "ಯೊವಾನ್ನ 2:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತಾಯಿ ಸೇವಕರಿಗೆ, “ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ,” ಎಂದು ತಿಳಿಸಿದರು.", "r": "2:5"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ,’ ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಸೇವಕರಿಗೆ", "r": "2:5"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ ಸೇವಕರಿಗೆ, ‘ಆತ ಹೇಳಿದಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಮಾಡಿ", "r": "2:5"}, {"n": 50, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆ ಮನೆಯಲ್ಲಿ ಎಷ್ಟು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಇಟ್ಟಿದ್ದರು?", "a": "ಆರು", "r": "2:6"}, {"n": 51, "q": "ಮದುವೆ ಮನೆಯಲ್ಲಿ ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಏಕೆ ಇಟ್ಟಿದ್ದರು?", "a": "ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ", "r": "2:6"}, {"n": 52, "q": "ಒಂದೊಂದು ಕಲ್ಲುಬಾನೆ ಎಷ್ಟು ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿತ್ತು?", "a": "ಎರಡು ಮೂರು ಕೊಡ ನೀರು", "r": "2:6"}, {"n": 53, "q": "ಮದುವೆ ಮನೆಯಲ್ಲಿದ್ದ ಬಾನೆಗಳು ಯಾವುದರಿಂದ ಮಾಡಿದವು?", "a": "ಕಲ್ಲಿನಿಂದ (ಕಲ್ಲುಬಾನೆಗಳು)", "r": "2:6"}, {"n": 54, "q": "ಕಲ್ಲುಬಾನೆಗಳು ಯಾರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಗಾಗಿ ಇಟ್ಟಿದ್ದವು?", "a": "ಯೆಹೂದ್ಯರ", "r": "2:6"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.”", "a": "ಕಲ್ಲುಬಾನೆಗಳನ್ನು", "r": "2:6"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದೊಡ್ಡದಾಗಿದ್ದವು", "r": "2:6"}, {"n": 57, "q": "“ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 58, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು …”", "a": "“… ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿದ್ದವು.”", "r": "2:6"}, {"n": 59, "q": "ಯೊವಾನ್ನ 2:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು. ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿದ್ದವು.", "r": "2:6"}, {"n": 60, "q": "“ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿದ್ದವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.”", "a": "ಪದ್ಧತಿಯಂತೆ", "r": "2:6"}, {"n": 62, "q": "ಯೇಸು ಸೇವಕರಿಗೆ ಮೊದಲು ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ”", "r": "2:7"}, {"n": 63, "q": "ಸೇವಕರು ಬಾನೆಗಳಲ್ಲಿ ಎಷ್ಟರವರೆಗೆ ನೀರು ತುಂಬಿದರು?", "a": "ಕಂಠದವರೆಗೆ", "r": "2:7"}, {"n": 64, "q": "“ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸೇವಕರಿಗೆ", "r": "2:7"}, {"n": 65, "q": "ಯೇಸು ಸೇವಕರಿಗೆ ಬಾನೆಗಳಲ್ಲಿ ಏನನ್ನು ತುಂಬಲು ಹೇಳಿದರು?", "a": "ನೀರು", "r": "2:7"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇವಕರಿಗೆ, ‘ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:7"}, {"n": 67, "q": "“ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ‘ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ,’ ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 68, "q": "ಯೊವಾನ್ನ 2:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, “ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ,” ಎಂದು ಹೇಳಿದರು. ಅವರು ಕಂಠದವರೆಗೆ ತುಂಬಿದರು.", "r": "2:7"}, {"n": 69, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ‘ಆ ಬಾನೆಗಳಲ್ಲಿ …”", "a": "“… ನೀರು ತುಂಬಿರಿ,’ ಎಂದು ಹೇಳಿದರು.”", "r": "2:7"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ‘ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀರು ತುಂಬಿರಿ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಬಾನೆಗಳಲ್ಲಿ", "r": "2:7"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ‘ಆ ಬಾನೆಗಳಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತುಂಬಿರಿ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ನೀರು", "r": "2:7"}, {"n": 72, "q": "ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿದ ನಂತರ ಯೇಸು ಸೇವಕರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ”", "r": "2:8"}, {"n": 73, "q": "ಸೇವಕರು ತೋಡಿಕೊಂಡು ಹೋದುದನ್ನು ಯಾರಿಗೆ ಕೊಡಬೇಕಿತ್ತು?", "a": "ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:8"}, {"n": 74, "q": "ಯೇಸು ಹೇಳಿದಂತೆ ಸೇವಕರು ಏನು ಮಾಡಿದರು?", "a": "ಹಾಗೆಯೇ ಮಾಡಿದರು (ತೋಡಿಕೊಂಡು ಹೋಗಿ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಟ್ಟರು)", "r": "2:8"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "a": "ಯೇಸು", "r": "2:8"}, {"n": 76, "q": "“ಯೇಸು, ‘ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "2:8"}, {"n": 77, "q": "ಯೊವಾನ್ನ 2:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, “ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,” ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.", "r": "2:8"}, {"n": 78, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸು, ‘ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ …”", "a": "“… ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "r": "2:8"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ‘ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "a": "ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:8"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ‘ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋಡಿಕೊಂಡು; ಮಾಡಿದರು", "r": "2:8"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ‘ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,’ ಎಂದು ಹೇಳಲು ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ಹಾಗೆಯೇ", "r": "2:8"}, {"n": 82, "q": "ಮೇಲ್ವಿಚಾರಕನು ಯಾವುದರ ರುಚಿ ನೋಡಿದನು?", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ", "r": "2:9"}, {"n": 83, "q": "ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಯಾರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು?", "a": "ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ", "r": "2:9"}, {"n": 84, "q": "ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಯಾರಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ?", "a": "ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:9"}, {"n": 85, "q": "ಮೇಲ್ವಿಚಾರಕನು ರುಚಿ ನೋಡಿದ ನೀರು ಏನಾಗಿ ಮಾರ್ಪಟ್ಟಿತ್ತು?", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ", "r": "2:9"}, {"n": 86, "q": "ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನನ್ನು ಏಕೆ ಕರೆದನು?", "a": "ಉತ್ತಮ ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ ತಿಳಿದಿರದ ಕಾರಣ (ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ ಎಂದು ಹೇಳಲು)", "r": "2:9"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲ್ವಿಚಾರಕನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು.”", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ", "r": "2:9"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದು ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿದಿರಲಿಲ್ಲ", "r": "2:9"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿದಿತ್ತು", "r": "2:9"}, {"n": 90, "q": "“ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 91, "q": "“ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 92, "q": "ಯೊವಾನ್ನ 2:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು. ಅದು ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ. ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು.", "r": "2:9"}, {"n": 93, "q": "“ಅದು ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 94, "q": "ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸದ ರುಚಿ ನೋಡಿ ಯಾರನ್ನು ಕರೆದನು?", "a": "ಮದುಮಗನನ್ನು", "r": "2:10"}, {"n": 95, "q": "ಮೇಲ್ವಿಚಾರಕನ ಪ್ರಕಾರ ಜನರೆಲ್ಲರೂ ಮೊದಲು ಯಾವ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಹಂಚುತ್ತಾರೆ?", "a": "ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 96, "q": "ಜನರು ಸಾಧಾರಣ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಯಾವಾಗ ಕೊಡುತ್ತಾರೆ ಎಂದು ಮೇಲ್ವಿಚಾರಕನು ಹೇಳಿದನು?", "a": "ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ", "r": "2:10"}, {"n": 97, "q": "ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನಿಗೆ ಹೇಳಿದ ಕೊನೆಯ ಮಾತು ಯಾವುದು?", "a": "“ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!”", "r": "2:10"}, {"n": 98, "q": "“ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಔತಣದ ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನಿಗೆ", "r": "2:10"}, {"n": 99, "q": "ಮೇಲ್ವಿಚಾರಕನ ಪ್ರಕಾರ ಸಾಮಾನ್ಯ ಪದ್ಧತಿಗೂ ಈ ಮದುವೆಯಲ್ಲಿ ನಡೆದುದಕ್ಕೂ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಸಾಮಾನ್ಯವಾಗಿ ಉತ್ತಮವಾದುದನ್ನು ಮೊದಲು, ಸಾಧಾರಣವಾದುದನ್ನು ಆಮೇಲೆ ಕೊಡುತ್ತಾರೆ; ಇಲ್ಲಿ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಡಲಾಗಿತ್ತು", "r": "2:10"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, ‘ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೊದಲು ಹಂಚುತ್ತಾರೆ;”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ ಸಾಧಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡುತ್ತಾರೆ.”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!’ ಎಂದು ಹೇಳಿದನು.”", "a": "ಉತ್ತಮವಾದುದನ್ನು", "r": "2:10"}, {"n": 103, "q": "“ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, ‘ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಮೊದಲು ಹಂಚುತ್ತಾರೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 104, "q": "“ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!’ ಎಂದು ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 105, "q": "ಯೊವಾನ್ನ 2:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, “ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಮೊದಲು ಹಂಚುತ್ತಾರೆ; ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ ಸಾಧಾರಣ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಕೊಡುತ್ತಾರೆ. ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!” ಎಂದು ಹೇಳಿದನು.", "r": "2:10"}, {"n": 106, "q": "ಕಾನಾ ಊರಿನಲ್ಲಿ ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾರ್ಪಡಿಸಿದ್ದು ಯೇಸುವಿನ ಎಷ್ಟನೆಯ ಸೂಚಕಕಾರ್ಯ?", "a": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ", "r": "2:11"}, {"n": 107, "q": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯದ ಮೂಲಕ ಯೇಸು ಏನನ್ನು ತೋರ್ಪಡಿಸಿದರು?", "a": "ತಮ್ಮ ಮಹಿಮೆಯನ್ನು", "r": "2:11"}, {"n": 108, "q": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯದ ನಂತರ ಯೇಸುವಿನ ಶಿಷ್ಯರಿಗೆ ಏನಾಯಿತು?", "a": "ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು", "r": "2:11"}, {"n": 109, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಸೂಚಕಕಾರ್ಯಗಳ ಫಲವಾಗಿ ವಿಶ್ವಾಸಿಸಿದವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಶಿಷ್ಯರು (2:11) ಮತ್ತು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಅನೇಕರು (2:23)", "r": "2:11; 2:23"}, {"n": 110, "q": "ಯೇಸು ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯವನ್ನು ಎಲ್ಲಿ ಮಾಡಿದರು?", "a": "ಗಲಿಲೇಯ ನಾಡಿನ ಕಾನಾ ಊರಿನಲ್ಲಿ", "r": "2:11"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.”", "a": "ಯೇಸು", "r": "2:11"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನ ಕಾನಾ ಊರಿನಲ್ಲಿ ಮಾಡಿ ತಮ್ಮ ಮಹಿಮೆಯನ್ನು ತೋರ್ಪಡಿಸಿದರು.”", "a": "ಗಲಿಲೇಯ", "r": "2:11"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು.”", "a": "ಶಿಷ್ಯರಿಗೂ", "r": "2:11"}, {"n": 114, "q": "“ಯೇಸು ಮಾಡಿದ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 115, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದನ್ನು ಗಲಿಲೇಯ ನಾಡಿನ ಕಾನಾ …”", "a": "“… ಊರಿನಲ್ಲಿ ಮಾಡಿ ತಮ್ಮ ಮಹಿಮೆಯನ್ನು ತೋರ್ಪಡಿಸಿದರು.”", "r": "2:11"}, {"n": 116, "q": "“ಅವರ ಶಿಷ್ಯರಿಗೂ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 117, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯ ನಂತರ ಯೇಸು ಮತ್ತು ಅವರೊಡನೆ ಇದ್ದವರು ಎಲ್ಲಿಗೆ ಹೋದರು?", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "2:12"}, {"n": 118, "q": "ಯೇಸುವಿನೊಡನೆ ಕಫೆರ್ನವುಮಿಗೆ ಹೋದವರು ಯಾರು?", "a": "ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು", "r": "2:12"}, {"n": 119, "q": "ಯೇಸು ಮತ್ತು ಅವರೊಡನೆ ಇದ್ದವರು ಕಫೆರ್ನವುಮಿನಲ್ಲಿ ಎಷ್ಟು ದಿನ ತಂಗಿದ್ದರು?", "a": "ಕೆಲವು ದಿನ", "r": "2:12"}, {"n": 120, "q": "ಯೇಸು ಮತ್ತು ಅವರ ಕುಟುಂಬದವರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋದದ್ದು ಯಾವಾಗ?", "a": "ಕಾನಾ ಊರಿನ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಆದ ಮೇಲೆ", "r": "2:12"}, {"n": 121, "q": "ಯೇಸುವಿನೊಡನೆ ಕಫೆರ್ನವುಮಿಗೆ ಹೋದವರಲ್ಲಿ ಅವರ ಕುಟುಂಬದವರು ಯಾರು?", "a": "ಅವರ ತಾಯಿ ಮತ್ತು ಸಹೋದರರು", "r": "2:12"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "a": "ಯೇಸು", "r": "2:12"}, {"n": 123, "q": "“ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 124, "q": "ಯೊವಾನ್ನ 2:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.", "r": "2:12"}, {"n": 125, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು …”", "a": "“… ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "r": "2:12"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "2:12"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಹೋದರರು; ತಂಗಿದ್ದರು", "r": "2:12"}, {"n": 128, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 2:13ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವ್ಯಾಪಾರಿಗಳ ಉಚ್ಚಾಟನೆ", "r": "2:13"}, {"n": 129, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿಗೆ ಏಕೆ ತೆರಳಿದರು?", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ", "r": "2:13"}, {"n": 130, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಯಾವುದು?", "a": "ಪಾಸ್ಕ ಹಬ್ಬ", "r": "2:13; 2:23"}, {"n": 131, "q": "ಪಾಸ್ಕ ಹಬ್ಬ ಹತ್ತಿರವಾಗಿದ್ದಾಗ ಯೇಸು ಎಲ್ಲಿಗೆ ತೆರಳಿದರು?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "2:13"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:13"}, {"n": 133, "q": "“ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 134, "q": "ಯೊವಾನ್ನ 2:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.", "r": "2:13"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.”", "a": "ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ", "r": "2:13"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೆರಳಿದರು", "r": "2:13"}, {"n": 137, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ಮಾರಾಟವಾಗುತ್ತಿದ್ದ ಪ್ರಾಣಿಗಳು ಯಾವುವು?", "a": "ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳು", "r": "2:14"}, {"n": 138, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದವರು ಯಾರು?", "a": "ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು", "r": "2:14"}, {"n": 139, "q": "ವ್ಯಾಪಾರಿಗಳು ಎಲ್ಲಿ ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು?", "a": "ಜೆರುಸಲೇಮಿನ ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "2:14"}, {"n": 140, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ಹಣದ ವ್ಯವಹಾರ ಮಾಡುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು", "r": "2:14"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "a": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "2:14"}, {"n": 142, "q": "“ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 143, "q": "ಯೊವಾನ್ನ 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.", "r": "2:14"}, {"n": 144, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು …”", "a": "“… ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "r": "2:14"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "a": "ಪಾರಿವಾಳಗಳನ್ನು", "r": "2:14"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುಳಿತಿದ್ದರು.”", "a": "ನಾಣ್ಯವಿನಿಮಯ; ವ್ಯಾಪಾರಕ್ಕೆ", "r": "2:14"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತಿದ್ದರು", "r": "2:14"}, {"n": 148, "q": "ಯೇಸು ವ್ಯಾಪಾರಿಗಳನ್ನು ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಲು ಏನು ಮಾಡಿದರು?", "a": "ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದರು", "r": "2:15"}, {"n": 149, "q": "ಯೇಸು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರಿಗೆ ಏನು ಮಾಡಿದರು?", "a": "ಅವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು", "r": "2:15"}, {"n": 150, "q": "ಯೇಸು ದನಕುರಿಗಳನ್ನು ಏನು ಮಾಡಿದರು?", "a": "ಓಡಿಸಿದರು", "r": "2:15"}, {"n": 151, "q": "ಯೇಸು ಹಗ್ಗವನ್ನು ಯಾವುದರಂತೆ ಹೆಣೆದರು?", "a": "ಚಾವಟಿಯಂತೆ", "r": "2:15"}, {"n": 152, "q": "ಯೇಸು ವ್ಯಾಪಾರಿಗಳನ್ನು ಎಲ್ಲಿಂದ ಹೊರಗಟ್ಟಿದರು?", "a": "ದೇವಾಲಯದಿಂದ", "r": "2:15"}, {"n": 153, "q": "ದೇವಾಲಯದಲ್ಲಿ ಯೇಸು ಮಾಡಿದ ನಾಲ್ಕು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "1) ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಎಲ್ಲರನ್ನು ಹೊರಗಟ್ಟಿದರು; 2) ದನಕುರಿಗಳನ್ನು ಓಡಿಸಿದರು; 3) ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿದರು; 4) ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು", "r": "2:15"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಕಂಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.”", "a": "ಯೇಸು", "r": "2:15"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.”", "a": "ನಾಣ್ಯವಿನಿಮಯ", "r": "2:15"}, {"n": 156, "q": "“ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "2:15"}, {"n": 157, "q": "ಯೊವಾನ್ನ 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು. ದನಕುರಿಗಳನ್ನು ಓಡಿಸಿದರು. ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.", "r": "2:15"}, {"n": 158, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ …”", "a": "“… ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.”", "r": "2:15"}, {"n": 159, "q": "“ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "2:15"}, {"n": 160, "q": "“ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ", "r": "2:16"}, {"n": 161, "q": "ಯೇಸು ತಮ್ಮ ಪಿತನ ಆಲಯದ ಬಗ್ಗೆ ಏನೆಂದು ಎಚ್ಚರಿಸಿದರು?", "a": "“ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ”", "r": "2:16"}, {"n": 162, "q": "ಯೇಸು ದೇವಾಲಯವನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ನನ್ನ ಪಿತನ ಆಲಯ", "r": "2:16"}, {"n": 163, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ವ್ಯಾಪಾರಿಗಳು ಪಿತನ ಆಲಯವನ್ನು ಏನನ್ನಾಗಿ ಮಾಡಿದ್ದರು?", "a": "ಸಂತೆಯನ್ನಾಗಿ", "r": "2:16"}, {"n": 164, "q": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ ಯೇಸು ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "r": "2:16"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಾರಿವಾಳಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "a": "ಮಾರುತ್ತಿದ್ದವರಿಗೆ", "r": "2:16"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಬೇಡಿ,’ ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಂತೆಯನ್ನಾಗಿ", "r": "2:16"}, {"n": 167, "q": "“ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ, ‘ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 168, "q": "ಯೊವಾನ್ನ 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ, “ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ. ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ,” ಎಂದು ಹೇಳಿದರು.", "r": "2:16"}, {"n": 169, "q": "“ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ,’ ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರುತ್ತಿದ್ದವರಿಗೆ, ‘ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "a": "ಪಾರಿವಾಳಗಳನ್ನು", "r": "2:16"}, {"n": 171, "q": "ದೇವಾಲಯದ ಶುದ್ಧೀಕರಣದ ಸಮಯದಲ್ಲಿ ಶಿಷ್ಯರಿಗೆ ನೆನಪಾದ ಪವಿತ್ರಗ್ರಂಥದ ವಾಕ್ಯ ಯಾವುದು?", "a": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ’", "r": "2:17"}, {"n": 172, "q": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ’ ಎಂಬ ವಾಕ್ಯ ಯಾರಿಗೆ ನೆನಪಾಯಿತು?", "a": "ಶಿಷ್ಯರಿಗೆ", "r": "2:17"}, {"n": 173, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ಹೇಗೆ ದಹಿಸುತ್ತದೆ?", "a": "ಬೆಂಕಿಯಂತೆ", "r": "2:17"}, {"n": 174, "q": "ಪವಿತ್ರಗ್ರಂಥದ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಯಾವಾಗ ನೆನಪಾಯಿತು?", "a": "ಯೇಸು ದೇವಾಲಯದಿಂದ ವ್ಯಾಪಾರಿಗಳನ್ನು ಹೊರಗಟ್ಟಿದಾಗ (ಆಗ)", "r": "2:17"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ", "r": "2:17"}, {"n": 176, "q": "“‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 177, "q": "ಯೊವಾನ್ನ 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.", "r": "2:17"}, {"n": 178, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ …”", "a": "“… ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "r": "2:17"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "a": "ದಹಿಸುತ್ತದೆ", "r": "2:17"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಹಿಸುತ್ತದೆ,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ನೆನಪಾಯಿತು.”", "a": "ಬೆಂಕಿಯಂತೆ; ಶಿಷ್ಯರಿಗೆ", "r": "2:17"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆನಪಾಯಿತು", "r": "2:17"}, {"n": 182, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಅವರ ಅಧಿಕಾರದ ಬಗ್ಗೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "r": "2:18"}, {"n": 183, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನಿಂದ ತಮ್ಮ ಅಧಿಕಾರವನ್ನು ರುಜುವಾತುಪಡಿಸಲು ಏನನ್ನು ಕೇಳಿದರು?", "a": "ಒಂದು ಪವಾಡವನ್ನು", "r": "2:18"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "2:18"}, {"n": 185, "q": "“ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?’ ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 186, "q": "ಯೊವಾನ್ನ 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರು, “ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?” ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.", "r": "2:18"}, {"n": 187, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು …”", "a": "“… ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?’ ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.”", "r": "2:18"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?’ ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ಪಡಿಸುವುದಕ್ಕೆ", "r": "2:18"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?’ ಎಂದು ಯೇಸುವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಧಿಕಾರವಿದೆ; ಪ್ರಶ್ನಿಸಿದರು", "r": "2:18"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ‘ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.”", "a": "ತೋರಿಸಬಲ್ಲೆ", "r": "2:18"}, {"n": 191, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟರು?", "a": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು”", "r": "2:19"}, {"n": 192, "q": "ದೇವಾಲಯವನ್ನು ಎಷ್ಟು ದಿನದಲ್ಲಿ ಪುನಃ ಎಬ್ಬಿಸುವೆನೆಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೂರು ದಿನದಲ್ಲಿ", "r": "2:19"}, {"n": 193, "q": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು” — ಇಲ್ಲಿ ‘ದೇವಾಲಯ’ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?", "a": "ಯೇಸುವಿನ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು", "r": "2:19–21"}, {"n": 194, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯ ಕಟ್ಟಲು ಹಿಡಿದ ಸಮಯ ಮತ್ತು ಯೇಸು ಹೇಳಿದ ಸಮಯವನ್ನು ಹೋಲಿಸಿ.", "a": "ಯೆಹೂದ್ಯರು: ನಲವತ್ತಾರು ವರ್ಷಗಳು; ಯೇಸು: ಮೂರು ದಿನ", "r": "2:19; 2:20"}, {"n": 195, "q": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ", "r": "2:19"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಯೇಸು", "r": "2:19"}, {"n": 197, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ‘ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 198, "q": "ಯೊವಾನ್ನ 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,” ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.", "r": "2:19"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ‘ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು …”", "a": "“… ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "r": "2:19"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ‘ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:19"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ‘ಈ ದೇವಾಲಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಕೆಡವಿಬಿಡಿ; ಎಬ್ಬಿಸುವೆನು", "r": "2:19"}, {"n": 202, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ಎಷ್ಟು ವರ್ಷಗಳು ಹಿಡಿದಿದ್ದವು?", "a": "ನಲವತ್ತಾರು ವರ್ಷಗಳು", "r": "2:20"}, {"n": 203, "q": "ಯೇಸುವಿನ ಉತ್ತರ ಕೇಳಿ ಯೆಹೂದ್ಯರು ಹೇಗಾದರು?", "a": "ಚಕಿತರಾದರು", "r": "2:20"}, {"n": 204, "q": "ದೇವಾಲಯವನ್ನು ಮೂರು ದಿನಗಳಲ್ಲಿ ಎಬ್ಬಿಸುವ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?”", "r": "2:20"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ‘ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:20"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು ಕೇಳಿದರು.”", "a": "ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ", "r": "2:20"}, {"n": 207, "q": "“ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ‘ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 208, "q": "ಯೊವಾನ್ನ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, “ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ. ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?” ಎಂದು ಕೇಳಿದರು.", "r": "2:20"}, {"n": 209, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ‘ಈ ದೇವಾಲಯವನ್ನು …”", "a": "“… ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "r": "2:20"}, {"n": 210, "q": "“ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?’ ಎಂದು ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ಯೆಹೂದ್ಯರು", "r": "2:20"}, {"n": 212, "q": "ಯೇಸು “ಈ ದೇವಾಲಯ” ಎಂದು ಹೇಳಿದ್ದು ಯಾವುದನ್ನು ಕುರಿತು?", "a": "ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು", "r": "2:21"}, {"n": 213, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 2:21ರಲ್ಲಿ ‘ದೇಗುಲ’ ಎಂದು ಯಾವುದನ್ನು ಕರೆಯಲಾಗಿದೆ?", "a": "ಯೇಸುವಿನ ದೇಹವನ್ನು", "r": "2:21"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.”", "a": "ಯೇಸು", "r": "2:21"}, {"n": 215, "q": "“ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 216, "q": "ಯೊವಾನ್ನ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.", "r": "2:21"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು.”", "a": "ದೇಗುಲವನ್ನು", "r": "2:21"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುರಿತು", "r": "2:21"}, {"n": 219, "q": "ಶಿಷ್ಯರು ಯೇಸುವಿನ ದೇವಾಲಯದ ಮಾತುಗಳನ್ನು ಯಾವಾಗ ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ", "r": "2:22"}, {"n": 220, "q": "ಯೇಸುವಿನ ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರಿಗೆ ಯಾವ ಎರಡರಲ್ಲಿ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು?", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ", "r": "2:22"}, {"n": 221, "q": "ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರು ಯೇಸುವಿನ ಯಾವ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ದೇವಾಲಯವನ್ನು ಕೆಡವಿದರೆ ಮೂರು ದಿನದಲ್ಲಿ ಪುನಃ ಎಬ್ಬಿಸುವೆನು ಎಂಬ ಮಾತುಗಳನ್ನು", "r": "2:22"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ಮರಿಸಿಕೊಂಡರು", "r": "2:22"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನ", "r": "2:22"}, {"n": 224, "q": "“ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 225, "q": "ಯೊವಾನ್ನ 2:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು. ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.", "r": "2:22"}, {"n": 226, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ …”", "a": "“… ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "r": "2:22"}, {"n": 227, "q": "“ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "a": "ಪುನರುತ್ಥಾನ", "r": "2:22"}, {"n": 229, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 2:23ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಅಂತರಂಗದ ಅರಿಕೆ", "r": "2:23"}, {"n": 230, "q": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಅನೇಕರು ಯೇಸುವನ್ನು ನಂಬಿದ್ದು ಏಕೆ?", "a": "ಯೇಸು ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ", "r": "2:23"}, {"n": 231, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದ್ದು ಯಾವ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ?", "a": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ", "r": "2:23"}, {"n": 232, "q": "ಯೇಸುವಿನ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ನಂಬಿದವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಅನೇಕರು", "r": "2:23"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:23"}, {"n": 234, "q": "“ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "2:23"}, {"n": 235, "q": "ಯೊವಾನ್ನ 2:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.", "r": "2:23"}, {"n": 236, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ …”", "a": "“… ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "r": "2:23"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ", "r": "2:23"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ; ಕಾರ್ಯಗಳನ್ನು", "r": "2:23"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿದರು.”", "a": "ಅವರನ್ನು", "r": "2:23"}, {"n": 240, "q": "ಯೇಸು ಜನರ ನಂಬಿಕೆಗೆ ಏಕೆ ಮಾರುಹೋಗಲಿಲ್ಲ?", "a": "ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ", "r": "2:24"}, {"n": 241, "q": "ಯೇಸು ಜನರ ಯಾವುದಕ್ಕೆ ಮಾರುಹೋಗಲಿಲ್ಲ?", "a": "ಅವರ ನಂಬಿಕೆಗೆ", "r": "2:24"}, {"n": 242, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "2:24"}, {"n": 243, "q": "“ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "2:24"}, {"n": 244, "q": "ಯೊವಾನ್ನ 2:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.", "r": "2:24"}, {"n": 245, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ …”", "a": "“… ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "r": "2:24"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಬಲ್ಲವರಾದ್ದರಿಂದ", "r": "2:24"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಲ್ಲರನ್ನು; ಮಾರುಹೋಗಲಿಲ್ಲ", "r": "2:24"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಚೆನ್ನಾಗಿ", "r": "2:24"}, {"n": 249, "q": "ಯೇಸುವಿಗೆ ಯಾವುದು ಬಹಿರಂಗವಾಗಿತ್ತು?", "a": "ಮಾನವನ ಅಂತರಂಗ", "r": "2:25"}, {"n": 250, "q": "ಜನರನ್ನು ಕುರಿತು ಯೇಸುವಿಗೆ ಯಾವುದರ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ?", "a": "ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ", "r": "2:25"}, {"n": 251, "q": "ಮಾನವನ ಯಾವ ಭಾಗ ಯೇಸುವಿಗೆ ಬಹಿರಂಗವಾಗಿತ್ತು?", "a": "ಅಂತರಂಗ", "r": "2:25"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಮೇಯವಿರಲಿಲ್ಲ", "r": "2:25"}, {"n": 253, "q": "“ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "2:25"}, {"n": 254, "q": "ಯೊವಾನ್ನ 2:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ. ಮಾನವನ ಅಂತರಂಗ ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿತ್ತು.", "r": "2:25"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.”", "a": "ತಿಳಿಸಬೇಕಾದ", "r": "2:25"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.”", "a": "ಯಾರೂ", "r": "2:25"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
