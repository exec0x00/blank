pt);margin:0 1mm\"><\/span> ಎಂದು ಕರೆಯುತ್ತಾರೆ.”", "a": "ಬೆತ್ಸಥ", "r": "5:2"}, {"n": 14, "q": "“ಅಲ್ಲಿ, ಕುರಿಬಾಗಿಲು ಎಂಬ ಸ್ಥಳದ ಬಳಿ ಐದು ಮಂಟಪಗಳಿಂದ ಕೂಡಿದ ಒಂದು ಕೊಳವಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "5:2"}, {"n": 15, "q": "ಬೆತ್ಸಥ ಕೊಳದ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಂಡಿದ್ದ ರೋಗಿಗಳು ಯಾರು?", "a": "ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು", "r": "5:3–4"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದರು.”", "a": "ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ", "r": "5:3–4"}, {"n": 17, "q": "“ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3–4", "r": "5:3–4"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.”", "a": "ಪಾರ್ಶ್ವವಾಯು", "r": "5:3–4"}, {"n": 19, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ …”", "a": "“… ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.”", "r": "5:3–4"}, {"n": 20, "q": "ಯೊವಾನ್ನ 5:3–4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.", "r": "5:3–4"}, {"n": 21, "q": "ಬೆತ್ಸಥ ಕೊಳದ ಬಳಿ ಮಲಗಿದ್ದ ರೋಗಿ ಎಷ್ಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದನು?", "a": "ಮೂವತ್ತೆಂಟು ವರ್ಷ", "r": "5:5"}, {"n": 22, "q": "ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿ ಎಲ್ಲಿ ಮಲಗಿದ್ದನು?", "a": "ಬೆತ್ಸಥ ಕೊಳದ ಮಂಟಪಗಳಲ್ಲಿ (ಅಲ್ಲಿ)", "r": "5:5"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.”", "a": "ನರಳುತ್ತಿದ್ದ", "r": "5:5"}, {"n": 24, "q": "“ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "5:5"}, {"n": 25, "q": "ಯೊವಾನ್ನ 5:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.", "r": "5:5"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.”", "a": "ಮೂವತ್ತೆಂಟು", "r": "5:5"}, {"n": 27, "q": "ಯೇಸು ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿಯನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "r": "5:6"}, {"n": 28, "q": "ಯೇಸು ರೋಗಿಯ ಬಗ್ಗೆ ಏನನ್ನು ತಿಳಿದುಕೊಂಡರು?", "a": "ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು", "r": "5:6"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು", "r": "5:6"}, {"n": 30, "q": "“ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 31, "q": "ಯೊವಾನ್ನ 5:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, “ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?” ಎಂದು ಕೇಳಿದರು.", "r": "5:6"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಯೇಸು", "r": "5:6"}, {"n": 33, "q": "ರೋಗಿ ಕೊಳಕ್ಕೆ ಇಳಿಯಲು ಸಾಧ್ಯವಾಗದಿದ್ದುದಕ್ಕೆ ಅವನು ಕೊಟ್ಟ ಕಾರಣವೇನು?", "a": "ನೀರು ಉಕ್ಕಿದಾಗ ಅವನನ್ನು ಕೊಳಕ್ಕಿಳಿಸಲು ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ; ಅವನು ಹೋಗುವಷ್ಟರಲ್ಲೇ ಬೇರೆ ಯಾರಾದರೂ ಇಳಿದು ಬಿಡುತ್ತಾರೆ", "r": "5:7"}, {"n": 34, "q": "ರೋಗಿ ಯಾವಾಗ ಕೊಳಕ್ಕೆ ಇಳಿಯಬೇಕಿತ್ತು?", "a": "ನೀರು ಉಕ್ಕಿದಾಗ", "r": "5:7"}, {"n": 35, "q": "ರೋಗಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಸ್ವಾಮೀ”", "r": "5:7"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನೀರು ಉಕ್ಕಿದಾಗ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ;”", "a": "ಕೊಳಕ್ಕಿಳಿಸಲು", "r": "5:7"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇರೆ ಯಾರಾದರೂ ಇಳಿದು ಬಿಡುತ್ತಾರೆ, ಎಂದು ಉತ್ತರಿಸಿದ ಆ ರೋಗಿ.”", "a": "ಹೋಗುವಷ್ಟರಲ್ಲೇ", "r": "5:7"}, {"n": 38, "q": "“ಸ್ವಾಮೀ, ನೀರು ಉಕ್ಕಿದಾಗ ನನ್ನನ್ನು ಕೊಳಕ್ಕಿಳಿಸಲು ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 39, "q": "ಯೇಸು ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿಗೆ ಕೊಟ್ಟ ಆಜ್ಞೆ ಏನು?", "a": "“ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ”", "r": "5:8"}, {"n": 40, "q": "“ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ” ಎಂಬ ಮಾತು ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯಾರ ಯಾರ ಬಾಯಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "ಯೇಸು (5:8, ‘ಸುತ್ತಿಕೊಂಡು ನಡೆ’); ಗುಣಹೊಂದಿದವನು (5:11); ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು (5:12)", "r": "5:8; 5:11; 5:12"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "5:8"}, {"n": 42, "q": "“ಯೇಸು ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "5:8"}, {"n": 43, "q": "ಯೊವಾನ್ನ 5:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನಿಗೆ, “ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ,” ಎಂದರು.", "r": "5:8"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:8"}, {"n": 45, "q": "ರೋಗಿ ಯಾವಾಗ ಗುಣಹೊಂದಿದನು?", "a": "ಆ ಕ್ಷಣವೇ", "r": "5:9"}, {"n": 46, "q": "ಗುಣಹೊಂದಿದ ರೋಗಿ ಏನು ಮಾಡತೊಡಗಿದನು?", "a": "ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು", "r": "5:9"}, {"n": 47, "q": "ಯೇಸು ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿಯನ್ನು ಗುಣಪಡಿಸಿದ ದಿನದ ವಿಶೇಷತೆ ಏನು? ಅದರಿಂದ ಏನಾಯಿತು?", "a": "ಸಬ್ಬತ್ತಿನ ದಿನ; ಯೆಹೂದ್ಯರು ಯೇಸುವಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು ಮತ್ತು ಕೊಲ್ಲಲು ಹವಣಿಸಿದರು", "r": "5:9–10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಡೆಯತೊಡಗಿದನು", "r": "5:9"}, {"n": 49, "q": "“ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "5:9"}, {"n": 50, "q": "ಯೊವಾನ್ನ 5:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು.", "r": "5:9"}, {"n": 51, "q": "ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿ ಗುಣಹೊಂದಿದ್ದು ಯಾವ ದಿನ?", "a": "ಸಬ್ಬತ್ತಿನ ದಿನ", "r": "5:10"}, {"n": 52, "q": "ಗುಣಹೊಂದಿದ ಮನುಷ್ಯನಿಗೆ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನೆಂದರು?", "a": "“ಇಂದು ಸಬ್ಬತ್ತಿನ ದಿನ. ನೀನು ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ”", "r": "5:10"}, {"n": 53, "q": "ಸಬ್ಬತ್ತಿನ ದಿನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "5:10"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದ ಆ ಮನುಷ್ಯನಿಗೆ, ಇಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನ.”", "a": "ಸಬ್ಬತ್ತಿನ", "r": "5:10"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:10"}, {"n": 56, "q": "“ಆದುದರಿಂದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದ ಆ ಮನುಷ್ಯನಿಗೆ, ಇಂದು ಸಬ್ಬತ್ತಿನ ದಿನ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 57, "q": "ಅಧಿಕಾರಿಗಳ ಆಕ್ಷೇಪಕ್ಕೆ ಗುಣಹೊಂದಿದವನು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ‘ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ’ ಎಂದು ಹೇಳಿದರು”", "r": "5:11"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಗುಣಪಡಿಸಿದವರೇ", "r": "5:11"}, {"n": 59, "q": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 60, "q": "ಯೊವಾನ್ನ 5:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವನು: “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ‘ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ’ ಎಂದು ಹೇಳಿದರು,” ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.", "r": "5:11"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:11"}, {"n": 62, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದವನನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "r": "5:12"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "5:12"}, {"n": 64, "q": "“ಅಧಿಕಾರಿಗಳು, ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "5:12"}, {"n": 65, "q": "ಯೊವಾನ್ನ 5:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಧಿಕಾರಿಗಳು, “ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "5:12"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಧಿಕಾರಿಗಳು, ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "a": "ಎತ್ತಿಕೊಂಡು", "r": "5:12"}, {"n": 67, "q": "ಗುಣಹೊಂದಿದವನಿಗೆ ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಏಕೆ ಹೇಳಲಾಗಲಿಲ್ಲ?", "a": "ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ; ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು", "r": "5:13"}, {"n": 68, "q": "ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದು ಏಕೆ?", "a": "ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ", "r": "5:13"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ;”", "a": "ಗುಣಪಡಿಸಿದವರು", "r": "5:13"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು.”", "a": "ಯೇಸು", "r": "5:13"}, {"n": 71, "q": "“ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 72, "q": "ಯೊವಾನ್ನ 5:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ; ಅಲ್ಲದೆ ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು.", "r": "5:13"}, {"n": 73, "q": "ಯೇಸು ಗುಣಹೊಂದಿದ ಮನುಷ್ಯನನ್ನು ಅನಂತರ ಎಲ್ಲಿ ಕಂಡರು?", "a": "ದೇವಾಲಯದಲ್ಲಿ", "r": "5:14"}, {"n": 74, "q": "ದೇವಾಲಯದಲ್ಲಿ ಯೇಸು ಗುಣಹೊಂದಿದವನಿಗೆ ಏನೆಂದು ಎಚ್ಚರಿಸಿದರು?", "a": "“ನೋಡು, ನೀನು ಗುಣಹೊಂದಿರುವೆ; ಇನ್ನುಮೇಲೆ ಪಾಪ ಮಾಡುವುದನ್ನು ಬಿಟ್ಟುಬಿಡು. ಇಲ್ಲದಿದ್ದರೆ ನಿನ್ನ ಗತಿ ಇನ್ನಷ್ಟು ಚಿಂತಾಜನಕವಾದೀತು”", "r": "5:14"}, {"n": 75, "q": "ಪಾಪ ಮಾಡುವುದನ್ನು ಬಿಡದಿದ್ದರೆ ಗುಣಹೊಂದಿದವನ ಗತಿ ಏನಾದೀತು?", "a": "ಇನ್ನಷ್ಟು ಚಿಂತಾಜನಕವಾದೀತು", "r": "5:14"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ದೇವಾಲಯದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮನುಷ್ಯನನ್ನು ಕಂಡು, ನೋಡು, ನೀನು ಗುಣಹೊಂದಿರುವೆ;”", "a": "ಯೇಸು", "r": "5:14"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನುಮೇಲೆ ಪಾಪ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟುಬಿಡು.”", "a": "ಮಾಡುವುದನ್ನು", "r": "5:14"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲದಿದ್ದರೆ ನಿನ್ನ ಗತಿ ಇನ್ನಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಚಿಂತಾಜನಕವಾದೀತು", "r": "5:14"}, {"n": 79, "q": "ಗುಣಹೊಂದಿದವನು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ ಏನು ತಿಳಿಸಿದನು?", "a": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ”", "r": "5:15"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಯೇಸುವೇ", "r": "5:15"}, {"n": 81, "q": "“ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ, ಎಂದು ತಿಳಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "5:15"}, {"n": 82, "q": "ಯೊವಾನ್ನ 5:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ,” ಎಂದು ತಿಳಿಸಿದನು.", "r": "5:15"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವೇ, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಗುಣಪಡಿಸಿದವನು", "r": "5:15"}, {"n": 84, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದ್ದು ಏಕೆ?", "a": "ಯೇಸು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಗುಣಪಡಿಸಿದ್ದರಿಂದ", "r": "5:16"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಇದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.”", "a": "ಸಬ್ಬತ್", "r": "5:16"}, {"n": 86, "q": "“ಯೇಸು ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "5:16"}, {"n": 87, "q": "ಯೊವಾನ್ನ 5:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.", "r": "5:16"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "5:16"}, {"n": 89, "q": "ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಗುಣಪಡಿಸಿದ್ದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು. ಅವರಂತೆಯೇ ನಾನು ಸದಾ ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ”", "r": "5:17"}, {"n": 90, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸತತವೂ ಕಾರ್ಯನಿರತರು ಯಾರು?", "a": "ಅವರ ಪಿತ", "r": "5:17"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು.”", "a": "ಯೇಸು", "r": "5:17"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಂತೆಯೇ ನಾನು ಸದಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ", "r": "5:17"}, {"n": 93, "q": "“ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 94, "q": "ಯೊವಾನ್ನ 5:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, “ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು. ಅವರಂತೆಯೇ ನಾನು ಸದಾ ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ,” ಎಂದು ನುಡಿದರು.", "r": "5:17"}, {"n": 95, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದ ಎರಡು ಕಾರಣಗಳು ಯಾವುವು?", "a": "1) ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದು; 2) ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದುದು", "r": "5:18"}, {"n": 96, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸು ತನ್ನನ್ನು ಯಾರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು?", "a": "ದೇವರಿಗೆ", "r": "5:18"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.”", "a": "ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು", "r": "5:18"}, {"n": 98, "q": "“ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "5:18"}, {"n": 99, "q": "ಯೊವಾನ್ನ 5:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.", "r": "5:18"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.”", "a": "ಸಬ್ಬತ್ತಿನ", "r": "5:18"}, {"n": 101, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 5:19ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದೈವಪುತ್ರನಿಗೆ ಸರ್ವಾಧಿಕಾರ", "r": "5:19"}, {"n": 102, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪುತ್ರನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಏನು ಮಾಡಲಾರನು?", "a": "ಏನೂ ಮಾಡಲಾರನು", "r": "5:19"}, {"n": 103, "q": "ಪುತ್ರನು ಏನನ್ನು ಕಂಡು ಹಾಗೆಯೇ ಮಾಡುತ್ತಾನೆ?", "a": "ಪಿತನು ಮಾಡುವುದನ್ನು", "r": "5:19"}, {"n": 104, "q": "“ನನ್ನಷ್ಟಕ್ಕೇ ನಾನೇ ಏನೂ ಮಾಡಲಾರೆ” ಎಂಬ ವಿಚಾರ ಐದನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ಎರಡು ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "5:19 (ಪುತ್ರನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಏನೂ ಮಾಡಲಾರನು) ಮತ್ತು 5:30", "r": "5:19; 5:30"}, {"n": 105, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ” ಎಂದು ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:19, 5:24, 5:25", "r": "5:19; 5:24; 5:25"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಉದ್ದೇಶಿಸಿ ಹೀಗೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "5:19"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾನೇ ಏನೂ ಮಾಡಲಾರನು;”", "a": "ತನ್ನಷ್ಟಕ್ಕೆ", "r": "5:19"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ತಾನೂ ಹಾಗೆಯೇ ಮಾಡುತ್ತಾನೆ.”", "a": "ಮಾಡುವುದನ್ನು", "r": "5:19"}, {"n": 109, "q": "ಪಿತನು ತಾವು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಪುತ್ರನಿಗೆ ಏಕೆ ತೋರಿಸುತ್ತಾರೆ?", "a": "ಪುತ್ರನೆಂದರೆ ಪಿತನಿಗೆ ಪ್ರೀತಿ", "r": "5:20"}, {"n": 110, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ತೋರಿಸುವ ಮಿಗಿಲಾದ ಕಾರ್ಯಗಳನ್ನು ಕಂಡು ಜನರು ಏನಾಗುವರು?", "a": "ಬೆರಗಾಗುವರು", "r": "5:20"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ತಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನಿಗೆ ತೋರಿಸುತ್ತಾರೆ.”", "a": "ಮಾಡುವುದನ್ನೆಲ್ಲಾ", "r": "5:20"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಇನ್ನೂ ಎಷ್ಟೋ ಮಿಗಿಲಾದ ಕಾರ್ಯಗಳನ್ನು ಪುತ್ರನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸುತ್ತಾರೆ", "r": "5:20"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವುಗಳನ್ನು ಕಂಡು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆರಗಾಗುವಿರಿ", "r": "5:20"}, {"n": 114, "q": "“ಆದುದರಿಂದ ತಾವು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಪುತ್ರನಿಗೆ ತೋರಿಸುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "5:20"}, {"n": 115, "q": "ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಜೀವ ಕೊಡುವಂತೆಯೇ ಪುತ್ರನು ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ", "r": "5:21"}, {"n": 116, "q": "ಪಿತನು ಸತ್ತವರಿಗೆ ಏನು ಮಾಡುತ್ತಾರೆ?", "a": "ಎಬ್ಬಿಸಿ ಜೀವವನ್ನು ಕೊಡುತ್ತಾರೆ", "r": "5:21"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.”", "a": "ಸತ್ತವರನ್ನು", "r": "5:21"}, {"n": 118, "q": "“ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "5:21"}, {"n": 119, "q": "ಯೊವಾನ್ನ 5:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.", "r": "5:21"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.”", "a": "ಕೊಡುವಂತೆಯೇ", "r": "5:21"}, {"n": 121, "q": "ಪಿತನು ತೀರ್ಪುಕೊಡುವ ಅಧಿಕಾರವನ್ನೆಲ್ಲಾ ಯಾರಿಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ?", "a": "ಪುತ್ರನಿಗೆ", "r": "5:22"}, {"n": 122, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ತೀರ್ಪುಕೊಡುವ ಅಧಿಕಾರ ಯಾರಿಗೆ ಕೊಡಲಾಗಿದೆ ಮತ್ತು ಏಕೆ?", "a": "ಪುತ್ರನಿಗೆ; ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ", "r": "5:22; 5:27"}, {"n": 123, "q": "ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡದವರು ಯಾರು?", "a": "ಪಿತನು", "r": "5:22"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ಪಿತನು ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಮಾಡುವುದಿಲ್ಲ", "r": "5:22"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತೀರ್ಪುಕೊಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರು ಪುತ್ರನಿಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಅಧಿಕಾರವನ್ನೆಲ್ಲಾ", "r": "5:22"}, {"n": 126, "q": "“ಅಲ್ಲದೆ, ಪಿತನು ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "5:22"}, {"n": 127, "q": "ಪಿತನ ಬಯಕೆ ಏನು?", "a": "ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕು", "r": "5:23"}, {"n": 128, "q": "ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಯಾರನ್ನೂ ಗೌರವಿಸುವುದಿಲ್ಲ?", "a": "ಪುತ್ರನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ", "r": "5:23"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಬಯಕೆ.”", "a": "ಗೌರವಿಸಬೇಕೆಂಬುದು", "r": "5:23"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಆತನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗೌರವಿಸುವುದಿಲ್ಲ", "r": "5:23"}, {"n": 131, "q": "“ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕೆಂಬುದು ಅವರ ಬಯಕೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "5:23"}, {"n": 132, "q": "ಯೊವಾನ್ನ 5:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕೆಂಬುದು ಅವರ ಬಯಕೆ. ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಆತನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ ಗೌರವಿಸುವುದಿಲ್ಲ.", "r": "5:23"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುವವನು ಯಾರು?", "a": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ಅವರನ್ನು ಕಳುಹಿಸಿದಾತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು", "r": "5:24"}, {"n": 134, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಡುವವನು ಈಗಾಗಲೇ ಏನು ಮಾಡಿರುತ್ತಾನೆ?", "a": "ಸಾವನ್ನು ದಾಟಿ ಜೀವವನ್ನು ಸೇರಿರುತ್ತಾನೆ", "r": "5:24"}, {"n": 135, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ವಿಶ್ವಾಸವಿಡುವವನು ಯಾವುದಕ್ಕೆ ಗುರಿ ಆಗನು?", "a": "ಖಂಡನೆಗೆ", "r": "5:24"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "5:24"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಆತನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ.”", "a": "ವಿಶ್ವಾಸವಿಡುವವನು", "r": "5:24"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗುರಿ ಆಗನು;”", "a": "ಖಂಡನೆಗೆ", "r": "5:24"}, {"n": 139, "q": "ಸತ್ತವರು ಯಾರ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು?", "a": "ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 140, "q": "ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು ಕೇಳುವವರಿಗೆ ಏನಾಗುವುದು?", "a": "ಜೀವಿಸುವರು", "r": "5:25"}, {"n": 141, "q": "ಸತ್ತವರು ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಯಾವಾಗ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಬರುವುದು; ಈಗಾಗಲೇ ಬಂದಿದೆ", "r": "5:25"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "5:25"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ತವರು ದೇವರ ಪುತ್ರನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳುವ ಕಾಲ ಬರುವುದು;”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳುವವರು ಜೀವಿಸುವರು.”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 145, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ಏನಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ?", "a": "ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ", "r": "5:26"}, {"n": 146, "q": "ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವವರು ಯಾರು?", "a": "ಪಿತನು ಮತ್ತು ಪುತ್ರನು", "r": "5:26"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ತಾವೇ ಸ್ವಯಂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.”", "a": "ಜೀವಮೂಲವಾಗಿರುವಂತೆ", "r": "5:26"}, {"n": 148, "q": "“ಪಿತನು ತಾವೇ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "5:26"}, {"n": 149, "q": "ಯೊವಾನ್ನ 5:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತನು ತಾವೇ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.", "r": "5:26"}, {"n": 150, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಏಕೆ ದಯಪಾಲಿಸಿದ್ದಾರೆ?", "a": "ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ", "r": "5:27"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೂ ಅಲ್ಲದೆ, ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.”", "a": "ನರಪುತ್ರನಾಗಿರುವ", "r": "5:27"}, {"n": 152, "q": "“ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "5:27"}, {"n": 153, "q": "ಯೊವಾನ್ನ 5:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.", "r": "5:27"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಯಪಾಲಿಸಿದ್ದಾರೆ", "r": "5:27"}, {"n": 155, "q": "ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು ಎಂದು ಯೇಸು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು?", "a": "ಸತ್ತು ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರ ಬಗ್ಗೆ", "r": "5:28"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇಡ.”", "a": "ಬೆರಗಾಗುವುದು", "r": "5:28"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು.”", "a": "ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರೂ", "r": "5:28"}, {"n": 158, "q": "“ಇದನ್ನು ಕೇಳಿ ನೀವು ಬೆರಗಾಗುವುದು ಬೇಡ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "5:28"}, {"n": 159, "q": "ಯೊವಾನ್ನ 5:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿ ನೀವು ಬೆರಗಾಗುವುದು ಬೇಡ. ಸತ್ತು ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರೂ ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು.", "r": "5:28"}, {"n": 160, "q": "ಸಮಾಧಿಯಿಂದ ಎದ್ದುಬರುವ ಸಜ್ಜನರು ಮತ್ತು ದುರ್ಜನರು ಯಾವುದಕ್ಕಾಗಿ ಪುನರುತ್ಥಾನರಾಗುವರು?", "a": "ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ; ದುರ್ಜನರು ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ", "r": "5:29"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಮಾಧಿಯನ್ನು ಬಿಟ್ಟು ಎದ್ದುಬರುವರು;”", "a": "ಕೇಳಿದವರೆಲ್ಲಾ", "r": "5:29"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದುರ್ಜನರು ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ ಪುನರುತ್ಥಾನ ಆಗುವರು.”", "a": "ಪುನರುತ್ಥಾನರಾಗುವರು", "r": "5:29"}, {"n": 163, "q": "“ಹಾಗೆ ಕೇಳಿದವರೆಲ್ಲಾ ಸಮಾಧಿಯನ್ನು ಬಿಟ್ಟು ಎದ್ದುಬರುವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "5:29"}, {"n": 164, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ ಪುನರುತ್ಥಾನರಾಗುವರು, ದುರ್ಜನರು …”", "a": "“… ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ ಪುನರುತ್ಥಾನ ಆಗುವರು.”", "r": "5:29"}, {"n": 165, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 5:30ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷ್ಯಗಳು", "r": "5:30"}, {"n": 166, "q": "ಯೇಸು ಯಾವುದರ ಪ್ರಕಾರ ತೀರ್ಪುಕೊಡುತ್ತಾರೆ?", "a": "ಪಿತನು ತಮಗೆ ತಿಳಿಸಿದ ಪ್ರಕಾರ", "r": "5:30"}, {"n": 167, "q": "ಯೇಸುವಿನ ತೀರ್ಪು ಏಕೆ ನ್ಯಾಯಬದ್ಧವಾದುದು?", "a": "ಅವರು ತಮ್ಮ ಸ್ವಂತ ಇಚ್ಛೆಯನ್ನು ನೆರವೇರಿಸದೆ ಪಿತನ ಚಿತ್ತವನ್ನೇ ನೆರವೇರಿಸಲು ಆಶಿಸುವುದರಿಂದ", "r": "5:30"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೇ ಏನೂ ಮಾಡಲಾರೆ.”", "a": "ನನ್ನಷ್ಟಕ್ಕೇ", "r": "5:30"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ನನಗೆ ತಿಳಿಸಿದ ಪ್ರಕಾರ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೀರ್ಪುಕೊಡುತ್ತೇನೆ", "r": "5:30"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ನನ್ನ ತೀರ್ಪು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದುದು.”", "a": "ನ್ಯಾಯಬದ್ಧ", "r": "5:30"}, {"n": 171, "q": "ತಮ್ಮ ಪರವಾಗಿ ತಾವೇ ಸಾಕ್ಷಿ ನೀಡುವುದರ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.”", "r": "5:31"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆಲೆಯಿರದು", "r": "5:31"}, {"n": 173, "q": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "5:31"}, {"n": 174, "q": "ಯೊವಾನ್ನ 5:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.", "r": "5:31"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಲೆಯಿರದು.”", "a": "ಸಾಕ್ಷಿಗೆ", "r": "5:31"}, {"n": 176, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವ ‘ಇನ್ನೊಬ್ಬನ’ ಸಾಕ್ಷ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಬಲ್ಲರು?", "a": "ಆತನು ನೀಡುವ ಸಾಕ್ಷ್ಯಕ್ಕೆ ಬೆಲೆಯಿದೆ ಎಂದು", "r": "5:32"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ", "r": "5:32"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ನೀಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಲೆಯಿದೆ ಎಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಸಾಕ್ಷ್ಯಕ್ಕೆ", "r": "5:32"}, {"n": 179, "q": "“ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "5:32"}, {"n": 180, "q": "ಯೊವಾನ್ನ 5:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ. ಆತನು ನೀಡುವ ಸಾಕ್ಷ್ಯಕ್ಕೆ ಬೆಲೆಯಿದೆ ಎಂದು ನಾನು ಬಲ್ಲೆ.", "r": "5:32"}, {"n": 181, "q": "ಯೆಹೂದ್ಯರು ಯಾರ ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದರು?", "a": "ಯೊವಾನ್ನನ ಬಳಿಗೆ", "r": "5:33"}, {"n": 182, "q": "ಯೊವಾನ್ನನು ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ಹೇಳಿದ್ದನು?", "a": "ಸತ್ಯವನ್ನು ಕುರಿತು", "r": "5:33"}, {"n": 183, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವ ನಾಲ್ಕು ಸಾಕ್ಷ್ಯಗಳು ಯಾವುವು?", "a": "1) ಯೊವಾನ್ನ (5:33); 2) ಯೇಸುವಿನ ಸುಕೃತ್ಯಗಳು (5:36); 3) ಪಿತ (5:37); 4) ಪವಿತ್ರ ಗ್ರಂಥ (5:39); (ಮೋಶೆ ಬರೆದುದು ಸಹ — 5:46)", "r": "5:33; 5:36; 5:37; 5:39"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದಿರಿ.”", "a": "ಯೊವಾನ್ನನ", "r": "5:33"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಸತ್ಯವನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳಿದ್ದಾನೆ", "r": "5:33"}, {"n": 186, "q": "“ನೀವೇ ಯೊವಾನ್ನನ ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "5:33"}, {"n": 187, "q": "ಯೇಸು ಯೊವಾನ್ನನ ಸಾಕ್ಷಿಯನ್ನು ಏಕೆ ಉಲ್ಲೇಖಿಸಿದರು?", "a": "ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ; ಜನರ ಉದ್ಧಾರಕ್ಕೆಂದು", "r": "5:34"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ;”", "a": "ಬೇಕೆಂದು", "r": "5:34"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಇದನ್ನೆಲ್ಲಾ ನಿಮ್ಮ ಉದ್ಧಾರಕ್ಕೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳುತ್ತಿದ್ದೇನೆ", "r": "5:34"}, {"n": 190, "q": "“ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "5:34"}, {"n": 191, "q": "ಯೊವಾನ್ನ 5:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ; ಆದರೆ ಇದನ್ನೆಲ್ಲಾ ನಿಮ್ಮ ಉದ್ಧಾರಕ್ಕೆಂದು ನಾನು ಹೇಳುತ್ತಿದ್ದೇನೆ.", "r": "5:34"}, {"n": 192, "q": "ಯೇಸು ಯೊವಾನ್ನನನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದರು?", "a": "ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪಕ್ಕೆ", "r": "5:35"}, {"n": 193, "q": "ಯೊವಾನ್ನನೆಂಬ ಬೆಳಕಿನಲ್ಲಿ ಯೆಹೂದ್ಯರು ಎಷ್ಟು ಕಾಲ ನಲಿದಾಡಿದರು?", "a": "ಸ್ವಲ್ಪಕಾಲ", "r": "5:35"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪದಂತೆ ಇದ್ದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "5:35"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಬೆಳಕಿನಲ್ಲಿ ನೀವು ಸ್ವಲ್ಪಕಾಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಲಿದಾಡಿದಿರಿ", "r": "5:35"}, {"n": 196, "q": "“ಯೊವಾನ್ನನು ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪದಂತೆ ಇದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "5:35"}, {"n": 197, "q": "ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ಯಾವುದು?", "a": "ಯೇಸು ಸಾಧಿಸುತ್ತಿರುವ ಸುಕೃತ್ಯಗಳು, ಅಂದರೆ ಪಿತನು ಅವರಿಗೆ ಮಾಡಿ ಮುಗಿಸಲು ಕೊಟ್ಟ ಕಾರ್ಯಗಳು", "r": "5:36"}, {"n": 198, "q": "ಯೇಸುವಿನ ಸುಕೃತ್ಯಗಳು ಯಾವುದಕ್ಕೆ ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ?", "a": "ಅವರು ಪಿತನಿಂದ ಬಂದವರೆಂದು", "r": "5:36"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀಡಿದ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ನನಗುಂಟು:”", "a": "ಯೊವಾನ್ನನು", "r": "5:36"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸಾಧಿಸುತ್ತಿರುವ ಸುಕೃತ್ಯಗಳೇ, ಅಂದರೆ, ಪಿತನು ನನಗೆ ಮಾಡಿ ಮುಗಿಸಲು ಕೊಟ್ಟ ಕಾರ್ಯಗಳೇ, ನಾನು ಪಿತನಿಂದ ಬಂದವನೆಂದು ನನ್ನ ಪರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ", "r": "5:36"}, {"n": 201, "q": "“ಯೊವಾನ್ನನು ನೀಡಿದ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ನನಗುಂಟು:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "5:36"}, {"n": 202, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿ ಅವರ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದವರು ಯಾರು?", "a": "ಪಿತನೇ", "r": "5:37"}, {"n": 203, "q": "ಯೆಹೂದ್ಯರು ಪಿತನ ಯಾವ ಎರಡನ್ನು ಎಂದೂ ಅನುಭವಿಸಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅವರ ಧ್ವನಿಯನ್ನು ಕೇಳಿಲ್ಲ; ಅವರ ದರ್ಶನವನ್ನು ಕಂಡಿಲ್ಲ", "r": "5:37"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೀಡಿದ್ದಾರೆ", "r": "5:37"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಾದರೋ ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದೂ ಕೇಳಿಲ್ಲ, ಅವರ ದರ್ಶನವನ್ನು ಎಂದೂ ಕಂಡಿಲ್ಲ.”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:37"}, {"n": 206, "q": "“ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "5:37"}, {"n": 207, "q": "ಪಿತನ ಸಂದೇಶ ಯೆಹೂದ್ಯರಲ್ಲಿ ಏಕೆ ನೆಲಸಿಲ್ಲ?", "a": "ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ಯೆಹೂದ್ಯರು ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ", "r": "5:38"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಸಂದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಲಸಿಲ್ಲ.”", "a": "ನಿಮ್ಮಲ್ಲಿ", "r": "5:38"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ", "r": "5:38"}, {"n": 210, "q": "ಯೊವಾನ್ನ 5:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಸಂದೇಶ ನಿಮ್ಮಲ್ಲಿ ನೆಲಸಿಲ್ಲ. ಏಕೆಂದರೆ, ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ನೀವು ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ.", "r": "5:38"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಸಂದೇಶ ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಲಸಿಲ್ಲ", "r": "5:38"}, {"n": 212, "q": "ಯೆಹೂದ್ಯರು ಪವಿತ್ರ ಗ್ರಂಥವನ್ನು ಏಕೆ ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತಿದ್ದರು?", "a": "ಅದರಿಂದಲೇ ನಿತ್ಯಜೀವ ಲಭಿಸುವುದೆಂದು ಭಾವಿಸಿ", "r": "5:39"}, {"n": 213, "q": "ಪವಿತ್ರ ಗ್ರಂಥವು ಯಾರ ಪರವಾಗಿ ಸಾಕ್ಷಿಹೇಳುತ್ತದೆ?", "a": "ಯೇಸುವಿನ ಪರವಾಗಿ", "r": "5:39"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರ ಗ್ರಂಥದಿಂದಲೇ ನಿತ್ಯಜೀವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸಿ, ನೀವು ಅದನ್ನು ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತೀರಿ.”", "a": "ಲಭಿಸುವುದೆಂದು", "r": "5:39"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಗ್ರಂಥವು ಸಹ ನನ್ನ ಪರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಹೇಳುತ್ತದೆ", "r": "5:39"}, {"n": 216, "q": "“ಪವಿತ್ರ ಗ್ರಂಥದಿಂದಲೇ ನಿತ್ಯಜೀವ ಲಭಿಸುವುದೆಂದು ಭಾವಿಸಿ, ನೀವು ಅದನ್ನು ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "5:39"}, {"n": 217, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಯಾವುದು ಇಷ್ಟವಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ಯೇಸುವಿನ ಬಳಿಗೆ ಬರಲು", "r": "5:40"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.”", "a": "ಪಡೆಯುವುದಕ್ಕಾಗಿ", "r": "5:40"}, {"n": 219, "q": "“ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "5:40"}, {"n": 220, "q": "ಯೊವಾನ್ನ 5:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.", "r": "5:40"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "5:40"}, {"n": 222, "q": "ಯೇಸು ಯಾವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ?", "a": "ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು", "r": "5:41"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರಸುವುದಿಲ್ಲ", "r": "5:41"}, {"n": 224, "q": "“ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "5:41"}, {"n": 225, "q": "ಯೊವಾನ್ನ 5:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.", "r": "5:41"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.”", "a": "ಮನುಷ್ಯರಿಂದ", "r": "5:41"}, {"n": 227, "q": "ಯೆಹೂದ್ಯರ ಬಗ್ಗೆ ಯೇಸು ಏನನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾಗಿದ್ದರು?", "a": "ದೇವರ ಮೇಲೆ ಅವರಿಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು", "r": "5:42"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮೇಲೆ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.”", "a": "ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು", "r": "5:42"}, {"n": 229, "q": "“ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "5:42"}, {"n": 230, "q": "ಯೊವಾನ್ನ 5:42 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.", "r": "5:42"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲ್ಲೆ.”", "a": "ಚೆನ್ನಾಗಿ", "r": "5:42"}, {"n": 232, "q": "ಯೇಸು ಯಾರ ಹೆಸರಿನಲ್ಲಿ ಬಂದಿದ್ದಾರೆ?", "a": "ಪಿತನ ಹೆಸರಿನಲ್ಲೇ", "r": "5:43"}, {"n": 233, "q": "ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ಬಂದ ಯೇಸುವಿಗೂ ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬರುವವನಿಗೂ ಯೆಹೂದ್ಯರು ತೋರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಯೇಸುವನ್ನು ಬರಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ; ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬಂದವನನ್ನು ಬರಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ", "r": "5:43"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತನ ಹೆಸರಿನಲ್ಲೇ.”", "a": "ಬಂದಿರುವುದು", "r": "5:43"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ", "r": "5:43"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇರೊಬ್ಬನು ತನ್ನ ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬಂದನೆಂದರೆ ಅಂಥವನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುತ್ತೀರಿ", "r": "5:43"}, {"n": 237, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಲು ಏಕೆ ಸಾಧ್ಯವಿಲ್ಲ?", "a": "ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ತಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು ಬಯಸುವುದರಿಂದ", "r": "5:44"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ನಿಮ್ಮ ನಿಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಯಸುತ್ತೀರಿ", "r": "5:44"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ, ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ತಾನೆ ಸಾಧ್ಯ?”", "a": "ವಿಶ್ವಾಸಮೂಡಲು", "r": "5:44"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ ಮುಂದೆ ನಾನು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಣಿಸಬೇಡಿ.”", "a": "ಆಪಾದಿಸುತ್ತಿರುವೆನೆಂದು", "r": "5:44"}, {"n": 241, "q": "“ಕಾರಣ, ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ನಿಮ್ಮ ನಿಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು ಬಯಸುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "5:44"}, {"n": 242, "q": "ಪಿತನ ಮುಂದೆ ಯೆಹೂದ್ಯರನ್ನು ಆಪಾದಿಸುವವನು ಯಾರು?", "a": "ಅವರು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ ಮೋಶೆ", "r": "5:45"}, {"n": 243, "q": "ಯೇಸು ಪಿತನ ಮುಂದೆ ಯೆಹೂದ್ಯರನ್ನು ಏನು ಮಾಡುತ್ತಿರುವರೆಂದು ಎಣಿಸಬಾರದು?", "a": "ಆಪಾದಿಸುತ್ತಿರುವರೆಂದು", "r": "5:45"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೇ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೋಶೆ.”", "a": "ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ", "r": "5:45"}, {"n": 245, "q": "ಯೊವಾನ್ನ 5:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಪಾದಿಸುವವನು ಒಬ್ಬನಿದ್ದಾನೆ. ಆತನೇ ನೀವು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ ಮೋಶೆ.", "r": "5:45"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೇ ನೀವು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೋಶೆ", "r": "5:45"}, {"n": 247, "q": "ಮೋಶೆಯಲ್ಲಿ ವಿಶ್ವಾಸವಿದ್ದರೆ ಯೆಹೂದ್ಯರು ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಲು ಕಾರಣವೇನು?", "a": "ಮೋಶೆ ಬರೆದುದು ಯೇಸುವನ್ನು ಕುರಿತೇ", "r": "5:46"}, {"n": 248, "q": "ಮೋಶೆ ಯಾರನ್ನು ಕುರಿತು ಬರೆದನು?", "a": "ಯೇಸುವನ್ನು", "r": "5:46"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ವಿಶ್ವಾಸ ಇದ್ದಿದ್ದರೆ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುತ್ತಿದ್ದಿರಿ.”", "a": "ಮೋಶೆಯಲ್ಲಿ", "r": "5:46"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಆತನು ಬರೆದುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತೇ.”", "a": "ನನ್ನನ್ನು", "r": "5:46"}, {"n": 251, "q": "“ಮೋಶೆಯಲ್ಲಿ ನಿಮಗೆ ವಿಶ್ವಾಸ ಇದ್ದಿದ್ದರೆ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುತ್ತಿದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "5:46"}, {"n": 252, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೇಸು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "r": "5:47"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "a": "ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ", "r": "5:47"}, {"n": 254, "q": "“ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "5:47"}, {"n": 255, "q": "ಯೊವಾನ್ನ 5:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "r": "5:47"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "a": "ಬರೆದುದರಲ್ಲಿ", "r": "5:47"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
