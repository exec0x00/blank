anslateY(-2pt);margin:0 1mm\"><\/span> ಬೆಟ್ಟವನ್ನು ಹತ್ತಿ ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "6:3"}, {"n": 12, "q": "“ಯೇಸು ಬೆಟ್ಟವನ್ನು ಹತ್ತಿ ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "6:3"}, {"n": 13, "q": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ ನೀಡಿದ ಸಮಯದಲ್ಲಿ ಯಾವ ಹಬ್ಬ ಹತ್ತಿರವಾಗಿತ್ತು?", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬ", "r": "6:4"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹತ್ತಿರವಾಗಿತ್ತು", "r": "6:4"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿತ್ತು.”", "a": "ಯೆಹೂದ್ಯರ", "r": "6:4"}, {"n": 16, "q": "ದೊಡ್ಡ ಗುಂಪು ಬರುವುದನ್ನು ಕಂಡ ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ಏನು ಕೇಳಿದರು?", "a": "“ಈ ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ನಾವು ಎಲ್ಲಿಂದ ಕೊಂಡುಕೊಳ್ಳುವುದು?”", "r": "6:5"}, {"n": 17, "q": "ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ಎಲ್ಲಿಂದ ಕೊಳ್ಳುವುದು ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕೇಳಿದರು?", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "6:5"}, {"n": 18, "q": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ ನೀಡಿದ ಘಟನೆಯಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಇಬ್ಬರು ಶಿಷ್ಯರು ಯಾರು?", "a": "ಫಿಲಿಪ್ಪ ಮತ್ತು ಅಂದ್ರೆಯ", "r": "6:5–9"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣ್ಣು ಹಾಯಿಸಿ ನೋಡಿದಾಗ ಆ ದೊಡ್ಡ ಗುಂಪು ತಮ್ಮ ಕಡೆಗೆ ಬರುವುದನ್ನು ಕಂಡರು.”", "a": "ಯೇಸು", "r": "6:5"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ನಾವು ಎಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೊಂಡುಕೊಳ್ಳುವುದು", "r": "6:5"}, {"n": 21, "q": "ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಏಕೆ ಕೇಳಿದರು?", "a": "ಫಿಲಿಪ್ಪನನ್ನು ಪರೀಕ್ಷಿಸುವ ಸಲುವಾಗಿ", "r": "6:6"}, {"n": 22, "q": "ಫಿಲಿಪ್ಪನನ್ನು ಕೇಳಿದರೂ ಯೇಸುವಿಗೆ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ತಾವು ಮಾಡಲಿರುವುದು", "r": "6:6"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪರೀಕ್ಷಿಸುವ ಸಲುವಾಗಿ ಅವರು ಹಾಗೆ ಹೇಳಿದರು.”", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "6:6"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ತಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ತಿಳಿದಿತ್ತು.”", "a": "ಮಾಡಲಿರುವುದು", "r": "6:6"}, {"n": 25, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಎಷ್ಟು ದಿನಾರಿ ನಾಣ್ಯಗಳ ರೊಟ್ಟಿ ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು?", "a": "ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳು", "r": "6:7"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳನ್ನು ಕೊಟ್ಟು ರೊಟ್ಟಿಯನ್ನು ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು, ಎಂದನು.”", "a": "ಫಿಲಿಪ್ಪನು", "r": "6:7"}, {"n": 27, "q": "“ಅದಕ್ಕೆ ಫಿಲಿಪ್ಪನು, ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳನ್ನು ಕೊಟ್ಟು ರೊಟ್ಟಿಯನ್ನು ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "6:7"}, {"n": 28, "q": "ಹುಡುಗನ ಬಳಿ ಇದ್ದ ರೊಟ್ಟಿ ಮೀನುಗಳ ಬಗ್ಗೆ ತಿಳಿಸಿದ ಶಿಷ್ಯ ಯಾರು?", "a": "ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು", "r": "6:8"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು, ಅಂದರೆ ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,”", "a": "ಅಂದ್ರೆಯನು", "r": "6:8"}, {"n": 30, "q": "“ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು, ಅಂದರೆ ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "6:8"}, {"n": 31, "q": "ಹುಡುಗನ ಬಳಿ ಏನೇನಿದ್ದವು?", "a": "ಜವೆಗೋದಿಯ ಐದು ರೊಟ್ಟಿಗಳೂ ಎರಡು ಮೀನುಗಳೂ", "r": "6:9"}, {"n": 32, "q": "ಹುಡುಗನ ಬಳಿ ಎಷ್ಟು ರೊಟ್ಟಿಗಳು ಮತ್ತು ಎಷ್ಟು ಮೀನುಗಳಿದ್ದವು?", "a": "ಐದು ರೊಟ್ಟಿಗಳು; ಎರಡು ಮೀನುಗಳು", "r": "6:9"}, {"n": 33, "q": "ಹುಡುಗನ ಬಳಿ ಇದ್ದ ರೊಟ್ಟಿಗಳು ಯಾವ ಧಾನ್ಯದವು?", "a": "ಜವೆಗೋದಿಯ", "r": "6:9"}, {"n": 34, "q": "ಹುಡುಗನ ರೊಟ್ಟಿ ಮೀನುಗಳ ಬಗ್ಗೆ ಹೇಳಿದ ನಂತರ ಅಂದ್ರೆಯನು ಏನು ಕೇಳಿದನು?", "a": "“ಆದರೆ ಈ ಜನಸಮೂಹಕ್ಕೆ ಇವೆಲ್ಲಿ ಸಾಕಾಗುತ್ತವೆ?”", "r": "6:9"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲಿ ಒಬ್ಬ ಹುಡುಗನ ಬಳಿ ಜವೆಗೋದಿಯ ಐದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎರಡು ಮೀನುಗಳೂ ಇವೆ.”", "a": "ರೊಟ್ಟಿಗಳೂ", "r": "6:9"}, {"n": 36, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಜನರ ಬಗ್ಗೆ ಏನು ಆಜ್ಞೆ ಕೊಟ್ಟರು?", "a": "“ಜನರನ್ನು ಊಟಕ್ಕೆ ಕೂರಿಸಿರಿ”", "r": "6:10"}, {"n": 37, "q": "ಜನರು ಎಲ್ಲಿ ಕುಳಿತುಕೊಂಡರು?", "a": "ಅಲ್ಲಿ ಹುಲುಸಾಗಿದ್ದ ಹುಲ್ಲಿನ ಮೇಲೆ", "r": "6:10"}, {"n": 38, "q": "ಯೇಸು ಊಟ ನೀಡಿದ ಜನರಲ್ಲಿ ಗಂಡಸರ ಸಂಖ್ಯೆ ಎಷ್ಟಿತ್ತು?", "a": "ಐದುಸಾವಿರದಷ್ಟು", "r": "6:10"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಜನರನ್ನು ಊಟಕ್ಕೆ ಕೂರಿಸಿರಿ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "6:10"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ಹುಲುಸಾಗಿದ್ದ ಹುಲ್ಲಿನ ಮೇಲೆ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತುಕೊಂಡರು", "r": "6:10"}, {"n": 41, "q": "ರೊಟ್ಟಿಗಳನ್ನು ಹಂಚುವ ಮೊದಲು ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿದರು", "r": "6:11"}, {"n": 42, "q": "ಜನರು ಎಷ್ಟು ತಿಂದರು?", "a": "ತಮಗೆ ಬೇಕಾದಷ್ಟು", "r": "6:11"}, {"n": 43, "q": "ಯೇಸು ರೊಟ್ಟಿಗಳೊಂದಿಗೆ ಬೇರೆ ಏನನ್ನು ಹಂಚಿಕೊಟ್ಟರು?", "a": "ಮೀನುಗಳನ್ನು", "r": "6:11"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ರೊಟ್ಟಿಗಳನ್ನು ತೆಗೆದುಕೊಂಡು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ, ಕುಳಿತಿದ್ದ ಜನರಿಗೆ ಅವುಗಳನ್ನು ಹಂಚಿದರು.”", "a": "ಯೇಸು", "r": "6:11"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಲ್ಲರೂ ತಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದರು.”", "a": "ಬೇಕಾದಷ್ಟು", "r": "6:11"}, {"n": 46, "q": "ಜನರು ತಿಂದು ತೃಪ್ತರಾದ ಮೇಲೆ ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನೆಲ್ಲಾ ಒಟ್ಟುಗೂಡಿಸಿರಿ; ಒಂದು ತುಂಡೂ ಹಾಳಾಗಬಾರದು”", "r": "6:12"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೆಲ್ಲರೂ ತಿಂದು ತೃಪ್ತರಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನೆಲ್ಲಾ ಒಟ್ಟುಗೂಡಿಸಿರಿ;”", "a": "ಯೇಸು", "r": "6:12"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ತುಂಡೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಮ್ಮ ಶಿಷ್ಯರಿಗೆ ಹೇಳಿದರು.”", "a": "ಹಾಳಾಗಬಾರದು", "r": "6:12"}, {"n": 49, "q": "ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಿದಾಗ ಎಷ್ಟು ಬುಟ್ಟಿಗಳು ತುಂಬಿದವು?", "a": "ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು", "r": "6:13"}, {"n": 50, "q": "ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳಲ್ಲಿ ತುಂಬಿದ್ದು ಯಾವ ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳು?", "a": "ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳು", "r": "6:13"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವು ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳ ತುಂಬಾ ಆದವು.”", "a": "ಒಟ್ಟುಗೂಡಿಸಲು", "r": "6:13"}, {"n": 52, "q": "“ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಲು ಅವು ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳ ತುಂಬಾ ಆದವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "6:13"}, {"n": 53, "q": "ಯೇಸು ಮಾಡಿದ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕಂಡ ಜನರು ಏನೆಂದು ಹೇಳತೊಡಗಿದರು?", "a": "“ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ”", "r": "6:14"}, {"n": 54, "q": "ಸೂಚಕಕಾರ್ಯವನ್ನು ಕಂಡ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಕರೆದರು ಮತ್ತು ಏನನ್ನಾಗಿ ಮಾಡಬಯಸಿದರು?", "a": "‘ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ’ ಎಂದು ಕರೆದರು; ಅರಸನನ್ನಾಗಿ ಮಾಡಬಯಸಿದರು", "r": "6:14; 6:15"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಈ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಕಂಡ ಜನರು, ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ, ಎಂದು ಹೇಳತೊಡಗಿದ್ದರು.”", "a": "ಯೇಸು", "r": "6:14"}, {"n": 56, "q": "“ಯೇಸು ಮಾಡಿದ ಈ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಕಂಡ ಜನರು, ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ, ಎಂದು ಹೇಳತೊಡಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "6:14"}, {"n": 57, "q": "ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಏಕೆ ಹೊರಟುಬಿಟ್ಟರು?", "a": "ಜನರು ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಅರಿತುದರಿಂದ", "r": "6:15"}, {"n": 58, "q": "ಜನರು ಯೇಸುವನ್ನು ಏನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದರು?", "a": "ಅರಸನನ್ನಾಗಿ", "r": "6:15"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೆಲ್ಲರೂ ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಅರಿತ ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಹೊರಟುಬಿಟ್ಟರು.”", "a": "ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ", "r": "6:15"}, {"n": 60, "q": "“ಅವರೆಲ್ಲರೂ ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಅರಿತ ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಹೊರಟುಬಿಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "6:15"}, {"n": 61, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:16ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನೀರಿನ ಮೇಲೆ ನಡೆ", "r": "6:16"}, {"n": 62, "q": "ಸಾಯಂಕಾಲ ಶಿಷ್ಯರು ದೋಣಿಯನ್ನು ಹತ್ತಿ ಎಲ್ಲಿಗೆ ಸಾಗಿದರು?", "a": "ಕಫೆರ್ನವುಮಿನ ಕಡೆ", "r": "6:16–17"}, {"n": 63, "q": "ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಯಾವಾಗ ಹೋದರು?", "a": "ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ", "r": "6:16"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಹೋಗಿ”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:16"}, {"n": 65, "q": "“ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ ಯೇಸುಸ್ವಾಮಿಯ ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಹೋಗಿ” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "6:16"}, {"n": 66, "q": "ಶಿಷ್ಯರು ದೋಣಿಯಲ್ಲಿ ಸಾಗುತ್ತಿದ್ದಾಗ ಯಾವ ಸ್ಥಿತಿ ಇತ್ತು?", "a": "ಆಗಲೇ ಕತ್ತಲು ಕವಿದಿತ್ತು; ಯೇಸು ಅವರ ಬಳಿಗೆ ಇನ್ನೂ ಬಂದಿರಲಿಲ್ಲ", "r": "6:17"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೋಣಿಯನ್ನು ಹತ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಡೆ ಸಾಗಿದರು.”", "a": "ಕಫೆರ್ನವುಮಿನ", "r": "6:17"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಬಳಿಗೆ ಇನ್ನೂ ಬಂದಿರಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "6:17"}, {"n": 69, "q": "ಶಿಷ್ಯರು ದೋಣಿಯಲ್ಲಿದ್ದಾಗ ಸರೋವರಕ್ಕೆ ಏನಾಯಿತು?", "a": "ರಭಸವಾದ ಗಾಳಿ ಬೀಸತೊಡಗಿ ಸರೋವರವು ಅಲ್ಲೋಲಕಲ್ಲೋಲವಾಯಿತು", "r": "6:18"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ ರಭಸವಾದ ಗಾಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೀಸತೊಡಗಿತು", "r": "6:18"}, {"n": 71, "q": "ಯೊವಾನ್ನ 6:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಷ್ಟರಲ್ಲಿ ರಭಸವಾದ ಗಾಳಿ ಬೀಸತೊಡಗಿತು. ಸರೋವರವು ಅಲ್ಲೋಲಕಲ್ಲೋಲವಾಯಿತು.", "r": "6:18"}, {"n": 72, "q": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುತ್ತಿರುವುದು ಕಾಣಿಸುವ ಮೊದಲು ಶಿಷ್ಯರು ಎಷ್ಟು ದೂರ ಹುಟ್ಟು ಹಾಕಿರಬೇಕು?", "a": "ಐದು ಆರು ಕಿಲೋಮೀಟರಿನಷ್ಟು", "r": "6:19"}, {"n": 73, "q": "ಶಿಷ್ಯರಿಗೆ ಏನು ಕಾಣಿಸಿತು?", "a": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುತ್ತಾ ದೋಣಿಯನ್ನು ಸಮೀಪಿಸುತ್ತಿರುವುದು", "r": "6:19"}, {"n": 74, "q": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ನೋಡಿ ಶಿಷ್ಯರು ಏನಾದರು?", "a": "ಹೆದರಿದರು", "r": "6:19"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಐದು ಆರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟು ಹಾಕಿರಬೇಕು.”", "a": "ಕಿಲೋಮೀಟರಿನಷ್ಟು", "r": "6:19"}, {"n": 76, "q": "ಹೆದರಿದ ಶಿಷ್ಯರಿಗೆ ಯೇಸು ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ; ಅಂಜಬೇಡಿ”", "r": "6:20"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ;”", "a": "ಯೇಸು", "r": "6:20"}, {"n": 78, "q": "“ಆಗ ಯೇಸು, ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "6:20"}, {"n": 79, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ದೋಣಿಯೊಳಕ್ಕೆ ಬರಮಾಡಿಕೊಳ್ಳುವಷ್ಟರಲ್ಲಿ ಏನಾಯಿತು?", "a": "ದೋಣಿಯು ಸೇರಬೇಕಾಗಿದ್ದ ದಡವನ್ನು ತಲುಪಿತು", "r": "6:21"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು ಅವರನ್ನು ದೋಣಿಯೊಳಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುವುದರಲ್ಲಿದ್ದರು", "r": "6:21"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ, ದೋಣಿಯು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಡವನ್ನು ತಲುಪಿತು.”", "a": "ಸೇರಬೇಕಾಗಿದ್ದ", "r": "6:21"}, {"n": 82, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:22ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜನಪ್ರಿಯ ಯೇಸು", "r": "6:22"}, {"n": 83, "q": "ಹಿಂದಿನ ದಿನ ಸರೋವರದ ಆಚೆಕಡೆ ಎಷ್ಟು ದೋಣಿ ಇದ್ದುದನ್ನು ಜನರು ನೋಡಿದ್ದರು?", "a": "ಒಂದೇ ಒಂದು ದೋಣಿ", "r": "6:22"}, {"n": 84, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಜನರಿಗೆ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ಯೇಸು ಶಿಷ್ಯರೊಡನೆ ದೋಣಿಯನ್ನು ಹತ್ತಲಿಲ್ಲ; ಶಿಷ್ಯರು ಮಾತ್ರ ಹೊರಟು ಹೋಗಿದ್ದಾರೆ ಎಂದು", "r": "6:22"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೆರೆದಿದ್ದ ಜನರು ಮಾರನೆಯ ದಿನವೂ ಸರೋವರದ ಆಚೆಕಡೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಳಿದಿದ್ದರು", "r": "6:22"}, {"n": 86, "q": "ಯಾವ ಊರಿನಿಂದ ಹೊರಟಿದ್ದ ದೋಣಿಗಳು ಅಲ್ಲಿಗೆ ಬಂದು ಸೇರಿದವು?", "a": "ತಿಬೇರಿಯದಿಂದ", "r": "6:23"}, {"n": 87, "q": "ತಿಬೇರಿಯದ ದೋಣಿಗಳು ಬಂದು ಸೇರಿದ ಸ್ಥಳದ ಪಕ್ಕದಲ್ಲಿ ಏನಿತ್ತು?", "a": "ಪ್ರಭುವು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ ಜನರಿಗೆ ರೊಟ್ಟಿ ಬಡಿಸಿದ್ದ ಸ್ಥಳ", "r": "6:23"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟಿದ್ದ ದೋಣಿಗಳು ಅಷ್ಟು ಹೊತ್ತಿಗೆ ಅಲ್ಲಿಗೆ ಬಂದು ಸೇರಿದವು.”", "a": "ತಿಬೇರಿಯದಿಂದ", "r": "6:23"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಭುವು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ, ಜನರಿಗೆ ರೊಟ್ಟಿ ಬಡಿಸಿದ್ದ ಸ್ಥಳ ಅಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಕ್ಕದಲ್ಲಿತ್ತು", "r": "6:23"}, {"n": 90, "q": "ಜನರು ದೋಣಿಗಳನ್ನು ಹತ್ತಿ ಯೇಸುವನ್ನು ಹುಡುಕುತ್ತಾ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "6:24"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಆಗಲಿ, ಅವರ ಶಿಷ್ಯರಾಗಲಿ ಇಲ್ಲದ್ದನ್ನು ನೋಡಿ ಜನರು ಆ ದೋಣಿಗಳನ್ನು ಹತ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಡುಕುತ್ತಾ ಕಫೆರ್ನವುಮಿಗೆ ಬಂದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "6:24"}, {"n": 92, "q": "“ಯೇಸು ಆಗಲಿ, ಅವರ ಶಿಷ್ಯರಾಗಲಿ ಇಲ್ಲದ್ದನ್ನು ನೋಡಿ ಜನರು ಆ ದೋಣಿಗಳನ್ನು ಹತ್ತಿ ಯೇಸುವನ್ನು ಹುಡುಕುತ್ತಾ ಕಫೆರ್ನವುಮಿಗೆ ಬಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "6:24"}, {"n": 93, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:25ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ", "r": "6:25"}, {"n": 94, "q": "ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಯೇಸುವನ್ನು ಕಂಡ ಜನರು ಏನು ಕೇಳಿದರು?", "a": "“ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?”", "r": "6:25"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಕಂಡೊಡನೆ, ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?”", "a": "ಯೇಸುಸ್ವಾಮಿಯನ್ನು", "r": "6:25"}, {"n": 96, "q": "“ಜನರು ಯೇಸುಸ್ವಾಮಿಯನ್ನು ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಕಂಡೊಡನೆ, ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "6:25"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಅವರನ್ನು ಹುಡುಕಿಕೊಂಡು ಬಂದದ್ದು ಏಕೆ?", "a": "ಹೊಟ್ಟೆತುಂಬುವಷ್ಟು ರೊಟ್ಟಿ ಸಿಕ್ಕಿದ್ದರಿಂದ (ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ ಅಲ್ಲ)", "r": "6:26"}, {"n": 98, "q": "ಯೇಸು ಜನರಿಗೆ ಹೇಳಿದಂತೆ ಅವರು ಯಾವುದರಿಂದ ಅವರನ್ನು ಹುಡುಕಿಕೊಂಡು ಬರಲಿಲ್ಲ?", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ", "r": "6:26"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "6:26"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನನ್ನು ಹುಡುಕಿಕೊಂಡು ಬಂದದ್ದು ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ, ಹೊಟ್ಟೆತುಂಬುವಷ್ಟು ರೊಟ್ಟಿ ಸಿಕ್ಕಿದ್ದರಿಂದ.”", "a": "ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ", "r": "6:26"}, {"n": 101, "q": "ಯೇಸು ಯಾವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಬೇಡಿ, ಯಾವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ ಎಂದರು?", "a": "ಅಳಿದುಹೋಗುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಬೇಡಿ; ಉಳಿಯುವ ಮತ್ತು ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ", "r": "6:27"}, {"n": 102, "q": "ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ಆಹಾರವನ್ನು ನೀಡುವವನು ಯಾರು?", "a": "ನರಪುತ್ರನೇ", "r": "6:27"}, {"n": 103, "q": "ಪಿತನಾದ ದೇವರು ನರಪುತ್ರನ ಮೇಲೆ ಏನನ್ನು ಒತ್ತಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಅಧಿಕಾರ ಮುದ್ರೆಯನ್ನು", "r": "6:27"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಳಿಯುವ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಯುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "6:27"}, {"n": 105, "q": "ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳ ಬಗ್ಗೆ ಜನರು ಏನು ಕೇಳಿದರು?", "a": "“ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳನ್ನು ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?”", "r": "6:28"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು, ದೇವರು ಮೆಚ್ಚುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?”", "a": "ಕಾರ್ಯಗಳನ್ನು", "r": "6:28"}, {"n": 107, "q": "“ಆಗ ಆ ಜನರು, ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳನ್ನು ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "6:28"}, {"n": 108, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯ ಯಾವುದು?", "a": "ದೇವರು ಕಳುಹಿಸಿದಾತನನ್ನು ವಿಶ್ವಾಸಿಸುವುದು", "r": "6:29"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರು ಕಳುಹಿಸಿದಾತನನ್ನು ನೀವು ವಿಶ್ವಾಸಿಸಬೇಕು.”", "a": "ಯೇಸು", "r": "6:29"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದೇ ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾರ್ಯ, ಎಂದರು.”", "a": "ಮೆಚ್ಚುವ", "r": "6:29"}, {"n": 111, "q": "ಜನರು ಯೇಸುವಿನಿಂದ ಏಕೆ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದರು?", "a": "ತಾವು ನೋಡಿ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವಂತೆ", "r": "6:30–31"}, {"n": 112, "q": "ಜನರು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಸೂಚಕಕಾರ್ಯದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಯಾವ ಸೂಚಕಕಾರ್ಯವನ್ನು ತೋರಿಸುವಿರಿ?”", "r": "6:30"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ನಾವು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸ ಇಡುವಂತೆ ನೀವು ಏನು ಮಾಡುವಿರಿ?”", "a": "ನಿಮ್ಮಲ್ಲಿ", "r": "6:30"}, {"n": 114, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ನಾವು ನೋಡಿ ನಿಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವಂತೆ ನೀವು ಏನು ಮಾಡುವಿರಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "6:30"}, {"n": 115, "q": "ಜನರ ಪ್ರಕಾರ ಅವರ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಏನು ಸಿಕ್ಕಿತು?", "a": "‘ಮನ್ನಾ’ (ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ)", "r": "6:31"}, {"n": 116, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಮನ್ನಾ’ವನ್ನು ಉಲ್ಲೇಖಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "6:31, 6:49, 6:58", "r": "6:31; 6:49; 6:58"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಮನ್ನಾ ಸಿಕ್ಕಿತು, ತಿನ್ನಲು ಅವರಿಗೆ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ ದೊರಕಿತು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುತ್ತದೆಯಲ್ಲವೇ", "r": "6:31"}, {"n": 118, "q": "“ನಮ್ಮ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಮನ್ನಾ ಸಿಕ್ಕಿತು, ತಿನ್ನಲು ಅವರಿಗೆ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ ದೊರಕಿತು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥವೇ ಹೇಳುತ್ತದೆಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "6:31"}, {"n": 119, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿಯನ್ನು ಕೊಟ್ಟವನು ಯಾರು ಅಲ್ಲ?", "a": "ಮೋಶೆಯಲ್ಲ", "r": "6:32"}, {"n": 120, "q": "ಸ್ವರ್ಗದಿಂದ ನಿಜವಾದ ರೊಟ್ಟಿಯನ್ನು ಕೊಡುವವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಪಿತನೇ", "r": "6:32"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ;”", "a": "ಯೇಸು", "r": "6:32"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ನಿಮಗೆ ರೊಟ್ಟಿಯನ್ನು ಕೊಟ್ಟವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮೋಶೆಯಲ್ಲ", "r": "6:32"}, {"n": 123, "q": "ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ ಯಾರು?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ", "r": "6:33"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ", "r": "6:33"}, {"n": 125, "q": "“ಏಕೆಂದರೆ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "6:33"}, {"n": 126, "q": "ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಕೇಳಿದ ಜನರು ಏನೆಂದು ಬೇಡಿದರು?", "a": "“ಅಂಥಾ ರೊಟ್ಟಿಯನ್ನೇ ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ”", "r": "6:34"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ಅಂಥಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ, ಎಂದು ಕೇಳಿದರು.”", "a": "ರೊಟ್ಟಿಯನ್ನೇ", "r": "6:34"}, {"n": 128, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ಅಂಥಾ ರೊಟ್ಟಿಯನ್ನೇ ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ, ಎಂದು ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "6:34"}, {"n": 129, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಜೀವದಾಯಕ ರೊಟ್ಟಿ ಎಂದು ಘೋಷಿಸಿದ ವಚನ ಯಾವುದು?", "a": "“ನಾನೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ, ನನ್ನ ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು; ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು.”", "r": "6:35"}, {"n": 130, "q": "ಯೇಸುವಿನ ಬಳಿ ಬರುವವನಿಗೆ ಮತ್ತು ಅವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಏನಾಗದು?", "a": "ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು; ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "6:35"}, {"n": 131, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು ತಮ್ಮನ್ನು ರೊಟ್ಟಿಗೆ ಹೋಲಿಸಿಕೊಂಡ ಮೂರು ರೀತಿಗಳು ಯಾವುವು?", "a": "ಜೀವದಾಯಕ ರೊಟ್ಟಿ (6:35, 48); ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ (6:41); ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿ (6:51)", "r": "6:35; 6:41; 6:48; 6:51"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ, ನನ್ನ ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು;”", "a": "ಯೇಸು", "r": "6:35"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಅವರನ್ನು ನೋಡಿಯೂ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ವಿಶ್ವಾಸಿಸಲಿಲ್ಲ", "r": "6:36"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನು ನಿಮಗೆ ಹೇಳಿದಂತೆ, ನೀವು ನನ್ನನ್ನು ನೋಡಿಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದೀರಿ.”", "a": "ವಿಶ್ವಾಸಿಸದೆ", "r": "6:36"}, {"n": 135, "q": "“ಆದರೆ, ನಾನು ನಿಮಗೆ ಹೇಳಿದಂತೆ, ನೀವು ನನ್ನನ್ನು ನೋಡಿಯೂ ವಿಶ್ವಾಸಿಸದೆ ಇದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "6:36"}, {"n": 136, "q": "ಪಿತನು ಯೇಸುವಿಗೆಂದು ಕೊಟ್ಟಿರುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಯೇಸುವಿನಲ್ಲಿಗೆ ಬರುತ್ತಾನೆ", "r": "6:37"}, {"n": 137, "q": "ತಮ್ಮಲ್ಲಿಗೆ ಬರುವವನನ್ನು ಯೇಸು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ಎಂದಿಗೂ ತಳ್ಳಿಬಿಡುವುದಿಲ್ಲ", "r": "6:37"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ನನಗೆಂದು ಕೊಟ್ಟಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನಲ್ಲಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:37"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿಗೆ ಬರುವವನನ್ನು ನಾನೆಂದಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಳ್ಳಿಬಿಡುವುದಿಲ್ಲ", "r": "6:37"}, {"n": 140, "q": "ಯೇಸು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ಯಾವುದಕ್ಕಾಗಿ?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ (ತಮ್ಮ ಇಚ್ಛೆಯಂತೆ ನಡೆಯುವುದಕ್ಕಲ್ಲ)", "r": "6:38"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ನನ್ನ ಇಚ್ಛೆಯಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ.”", "a": "ನಡೆಯುವುದಕ್ಕಲ್ಲ", "r": "6:38"}, {"n": 142, "q": "“ನಾನು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ನನ್ನ ಇಚ್ಛೆಯಂತೆ ನಡೆಯುವುದಕ್ಕಲ್ಲ, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "6:38"}, {"n": 143, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವೇನು?", "a": "ಅವರು ಯೇಸುವಿಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ ಕಳೆದುಕೊಳ್ಳದೆ ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು", "r": "6:39"}, {"n": 144, "q": "“ಅಂತಿಮ ದಿನದಂದು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸುತ್ತೇನೆ” ಎಂಬ ವಾಗ್ದಾನ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ನಾಲ್ಕು ಬಾರಿ (6:39, 40, 44, 54)", "r": "6:39; 6:40; 6:44; 6:54"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ನನಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ನಾನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು.”", "a": "ಕಳೆದುಕೊಳ್ಳದೆ", "r": "6:39"}, {"n": 146, "q": "“ಅವರು ನನಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ ಕಳೆದುಕೊಳ್ಳದೆ ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ನಾನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "6:39"}, {"n": 147, "q": "ಯೇಸುವಿನ ಪಿತನ ಸಂಕಲ್ಪ ಏನು?", "a": "ಪುತ್ರನನ್ನು ಕಂಡು ಆತನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯಬೇಕು", "r": "6:40"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನನ್ನು ಕಂಡು ಆತನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯಬೇಕೆಂಬುದೇ ನನ್ನ ಪಿತನ ಸಂಕಲ್ಪ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "6:40"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವನನ್ನು ಅಂತಿಮ ದಿನದಂದು ನಾನು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:40"}, {"n": 150, "q": "ಯೆಹೂದ್ಯರು ಏಕೆ ಗೊಣಗತೊಡಗಿದರು?", "a": "“ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ” ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ", "r": "6:41"}, {"n": 151, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಗೊಣಗುಟ್ಟಿದ ಎರಡು ಗುಂಪುಗಳು ಯಾರು?", "a": "ಯೆಹೂದ್ಯರು (6:41) ಮತ್ತು ಯೇಸುವಿನ ಶಿಷ್ಯರು (6:61)", "r": "6:41; 6:43; 6:61"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ಗೊಣಗತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "6:41"}, {"n": 153, "q": "“ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ಗೊಣಗತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "6:41"}, {"n": 154, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಕುಟುಂಬದ ಬಗ್ಗೆ ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಈತನು ಜೋಸೆಫನ ಮಗನಾದ ಯೇಸು ಅಲ್ಲವೆ? ಈತನ ತಂದೆ ತಾಯಿ ನಮಗೆ ಗೊತ್ತಿಲ್ಲವೆ?”", "r": "6:42"}, {"n": 155, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸು ಏನೆಂದು ಹೇಳುವುದಾದರೂ ಹೇಗೆ?", "a": "‘ನಾನು ಸ್ವರ್ಗದಿಂದ ಬಂದಿದ್ದೇನೆ’", "r": "6:42"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ಈತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದ ಯೇಸು ಅಲ್ಲವೆ?”", "a": "ಜೋಸೆಫನ", "r": "6:42"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನ ತಂದೆ ತಾಯಿ ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಗೊತ್ತಿಲ್ಲವೆ", "r": "6:42"}, {"n": 158, "q": "ಗೊಣಗುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರಿಗೆ ಯೇಸು ಏನೆಂದರು?", "a": "“ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ ಗೊಣಗುಟ್ಟದಿರಿ.”", "r": "6:43"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ ಗೊಣಗುಟ್ಟದಿರಿ.”", "a": "ಯೇಸು", "r": "6:43"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೊಣಗುಟ್ಟದಿರಿ.”", "a": "ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ", "r": "6:43"}, {"n": 161, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯಾರೂ ಅವರ ಬಳಿಗೆ ಯಾವಾಗ ಬಾರರು?", "a": "ಅವರನ್ನು ಕಳುಹಿಸಿಕೊಟ್ಟ ಪಿತನು ಅವರತ್ತ ಸೆಳೆಯದ ಹೊರತು", "r": "6:44"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತನು, ನನ್ನತ್ತ ಸೆಳೆಯದ ಹೊರತು, ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬಾರರು.”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟ", "r": "6:44"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಂದವರನ್ನು ನಾನು ಅಂತಿಮ ದಿನದಂದು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:44"}, {"n": 164, "q": "‘ದೇವರಿಂದಲೇ ಅವರೆಲ್ಲರೂ ಬೋಧನೆ ಪಡೆಯುವರು’ ಎಂದು ಎಲ್ಲಿ ಬರೆದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಪ್ರವಾದಿಗಳ ಗ್ರಂಥದಲ್ಲಿ", "r": "6:45"}, {"n": 165, "q": "ಯೇಸುವಿನ ಬಳಿಗೆ ಬರುವವನು ಯಾರು?", "a": "ಪಿತನಿಗೆ ಕಿವಿಗೊಟ್ಟು ಅವರಿಂದಲೇ ಕಲಿತುಕೊಂಡ ಪ್ರತಿ ಒಬ್ಬನೂ", "r": "6:45"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರಿಂದಲೇ ಅವರೆಲ್ಲರೂ ಬೋಧನೆ ಪಡೆಯುವರು, ಎಂದು ಪ್ರವಾದಿಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿದೆ.”", "a": "ಗ್ರಂಥದಲ್ಲಿ", "r": "6:45"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಂದಲೇ ಕಲಿತುಕೊಂಡ ಪ್ರತಿ ಒಬ್ಬನೂ ನನ್ನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಕಿವಿಗೊಟ್ಟು", "r": "6:45"}, {"n": 168, "q": "ಪಿತನನ್ನು ಕಂಡಿರುವವನು ಯಾರು?", "a": "ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ", "r": "6:46"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಂದ ಮಾತ್ರಕ್ಕೆ ಪಿತನನ್ನು ಯಾರಾದರೂ ಕಣ್ಣಾರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದಲ್ಲ, ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ ಪಿತನನ್ನು ಕಂಡಿದ್ದಾನೆ.”", "a": "ಕಂಡಿದ್ದಾರೆ", "r": "6:46"}, {"n": 170, "q": "“ಹಾಗೆಂದ ಮಾತ್ರಕ್ಕೆ ಪಿತನನ್ನು ಯಾರಾದರೂ ಕಣ್ಣಾರೆ ಕಂಡಿದ್ದಾರೆ ಎಂದಲ್ಲ, ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ ಪಿತನನ್ನು ಕಂಡಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "6:46"}, {"n": 171, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವ ಯಾರಲ್ಲಿ ಇದೆ?", "a": "ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ", "r": "6:47"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವ ಇದೆಯೆಂದು ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ", "r": "6:47"}, {"n": 173, "q": "“ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ ನಿತ್ಯಜೀವ ಇದೆಯೆಂದು ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "6:47"}, {"n": 174, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 6:48ರ ಮೂರು ಪದಗಳ ವಚನ ಯಾವುದು?", "a": "“ಜೀವದಾಯಕ ರೊಟ್ಟಿ ನಾನೇ.”", "r": "6:48"}, {"n": 175, "q": "ಮರಳುಗಾಡಿನಲ್ಲಿ ‘ಮನ್ನಾ’ವನ್ನು ತಿಂದ ಪೂರ್ವಜರಿಗೆ ಏನಾಯಿತು?", "a": "ಸಾವಿಗೆ ತುತ್ತಾದರು", "r": "6:49"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪೂರ್ವಜರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನ್ನಾವನ್ನು ತಿಂದರು;”", "a": "ಮರಳುಗಾಡಿನಲ್ಲಿ", "r": "6:49"}, {"n": 177, "q": "“ನಿಮ್ಮ ಪೂರ್ವಜರು ಮರಳುಗಾಡಿನಲ್ಲಿ ಮನ್ನಾವನ್ನು ತಿಂದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "6:49"}, {"n": 178, "q": "ಮನ್ನಾ ಮತ್ತು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಮನ್ನಾ ತಿಂದವರು ಸಾವಿಗೆ ತುತ್ತಾದರು; ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯನ್ನು ತಿನ್ನುವ ಯಾರಿಗೂ ಸಾವೆಂಬುದು ಇಲ್ಲ", "r": "6:50"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಾಗಲ್ಲ.”", "a": "ರೊಟ್ಟಿಯಾದರೋ", "r": "6:50"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ತಿನ್ನುವ ಯಾರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲ.”", "a": "ಸಾವೆಂಬುದು", "r": "6:50"}, {"n": 181, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ಕೊಡುವ ರೊಟ್ಟಿ ಯಾವುದು?", "a": "ಲೋಕೋದ್ಧಾರಕ್ಕಾಗಿ ಅವರು ಅರ್ಪಿಸುವ ಅವರ ಮಾಂಸವೇ", "r": "6:51"}, {"n": 182, "q": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿಯನ್ನು ತಿಂದವನು ಎಷ್ಟು ಕಾಲ ಬಾಳುತ್ತಾನೆ?", "a": "ಚಿರಕಾಲ", "r": "6:51"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿ.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "6:51"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದವನು ಚಿರಕಾಲ ಬಾಳುತ್ತಾನೆ.”", "a": "ರೋಟ್ಟಿಯನ್ನು", "r": "6:51"}, {"n": 185, "q": "ಯೇಸುವಿನ ಮಾಂಸದ ಬಗ್ಗೆ ವಾಗ್ವಾದದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಏನೆಂದು ಕೇಳತೊಡಗಿದರು?", "a": "“ಈತನು ತನ್ನ ಮಾಂಸವನ್ನು ತಿನ್ನಲು ಹೇಗೆ ಕೊಟ್ಟಾನು?”", "r": "6:52"}, {"n": 186, "q": "ಯೇಸುವಿನ ಮಾಂಸದ ಮಾತಿನಿಂದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಏನು ಉಂಟಾಯಿತು?", "a": "ತೀವ್ರ ವಾಗ್ವಾದ", "r": "6:52"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟಕ್ಕೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀವ್ರ ವಾಗ್ವಾದ ಉಂಟಾಯಿತು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿ", "r": "6:52"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿನ್ನಲು ಹೇಗೆ ಕೊಟ್ಟಾನು?”", "a": "ಮಾಂಸವನ್ನು", "r": "6:52"}, {"n": 189, "q": "ನರಪುತ್ರನ ಮಾಂಸವನ್ನು ತಿನ್ನದೆ, ರಕ್ತವನ್ನು ಕುಡಿಯದೆ ಹೋದರೆ ಏನಾಗುವುದು?", "a": "ಜನರಲ್ಲಿ ಜೀವ ಇರುವುದಿಲ್ಲ", "r": "6:53"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "6:53"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನರಪುತ್ರನ ಮಾಂಸವನ್ನು ತಿನ್ನದೆ, ಆತನ ರಕ್ತವನ್ನು ಕುಡಿಯದೆ ಹೋದರೆ ನಿಮ್ಮಲ್ಲಿ ಜೀವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರುವುದಿಲ್ಲ", "r": "6:53"}, {"n": 192, "q": "ಯೇಸುವಿನ ಮಾಂಸವನ್ನು ತಿಂದು ರಕ್ತವನ್ನು ಕುಡಿಯುವವನಿಗೆ ಯೇಸು ಯಾವ ಎರಡು ವಾಗ್ದಾನಗಳನ್ನು ಕೊಟ್ಟರು?", "a": "ಅವನಲ್ಲಿ ನಿತ್ಯಜೀವ ಇರುತ್ತದೆ; ಅಂತಿಮ ದಿನದಂದು ಯೇಸು ಅವನನ್ನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸುತ್ತಾರೆ", "r": "6:54"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು ನನ್ನ ರಕ್ತವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವ ಇರುತ್ತದೆ.”", "a": "ಕುಡಿಯುವವನಲ್ಲಿ", "r": "6:54"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ ಅಂತಿಮ ದಿನದಂದು ನಾನು ಅವನನ್ನು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:54"}, {"n": 195, "q": "ಯೇಸು ತಮ್ಮ ಮಾಂಸ ಮತ್ತು ರಕ್ತದ ಬಗ್ಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನನ್ನ ಮಾಂಸವೇ ನಿಜವಾದ ಆಹಾರ; ನನ್ನ ರಕ್ತವೇ ನಿಜವಾದ ಪಾನ.”", "r": "6:55"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜವಾದ ಆಹಾರ;”", "a": "ಮಾಂಸವೇ", "r": "6:55"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜವಾದ ಪಾನ.”", "a": "ರಕ್ತವೇ", "r": "6:55"}, {"n": 198, "q": "ಯೇಸುವಿನ ಮಾಂಸವನ್ನು ತಿಂದು ರಕ್ತವನ್ನು ಕುಡಿಯುವವನಿಗೂ ಯೇಸುವಿಗೂ ಇರುವ ಸಂಬಂಧವೇನು?", "a": "ಅವನು ಯೇಸುವಿನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾನೆ; ಯೇಸು ಅವನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾರೆ", "r": "6:56"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು, ನನ್ನ ರಕ್ತವನ್ನು ಕುಡಿಯುವವನು ನನ್ನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಲೆಸಿರುತ್ತಾನೆ", "r": "6:56"}, {"n": 200, "q": "“ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು, ನನ್ನ ರಕ್ತವನ್ನು ಕುಡಿಯುವವನು ನನ್ನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 56", "r": "6:56"}, {"n": 201, "q": "ಯೇಸು ಪಿತನಿಂದ ಜೀವಿಸುವಂತೆಯೇ ಯಾರು ಯೇಸುವಿನಿಂದ ಜೀವಿಸುತ್ತಾನೆ?", "a": "ಯೇಸುವನ್ನು ಭುಜಿಸುವವನು", "r": "6:57"}, {"n": 202, "q": "ಯೇಸು ಪಿತನನ್ನು ಏನೆಂದು ವರ್ಣಿಸಿದರು?", "a": "ಜೀವಸ್ವರೂಪಿ ಆದ ಪಿತನು", "r": "6:57"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೀವಸ್ವರೂಪಿ ಆದ ಪಿತನು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟಿರುವರು", "r": "6:57"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನನ್ನನ್ನು ಭುಜಿಸುವವನು ನನ್ನಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜೀವಿಸುತ್ತಾನೆ", "r": "6:57"}, {"n": 205, "q": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯನ್ನು ತಿನ್ನುವವನು ಹೇಗೆ ಬಾಳುವನು?", "a": "ಚಿರಕಾಲ ಬಾಳುವನು", "r": "6:58"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ಇದೇ.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "6:58"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪೂರ್ವಜರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದರೂ ಸಾವಿಗೆ ತುತ್ತಾದರು.”", "a": "ಮನ್ನಾವನ್ನು", "r": "6:58"}, {"n": 208, "q": "ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಯೇಸು ಬೋಧನೆ ಮಾಡಿದ್ದು ಎಲ್ಲಿ?", "a": "ಕಫೆರ್ನವುಮಿನ ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ", "r": "6:59"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಫೆರ್ನವುಮಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸು ಬೋಧನೆ ಮಾಡುತ್ತಿದ್ದಾಗ ಆಡಿದ ಮಾತುಗಳಿವು.”", "a": "ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ", "r": "6:59"}, {"n": 210, "q": "“ಕಫೆರ್ನವುಮಿನ ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ ಯೇಸು ಬೋಧನೆ ಮಾಡುತ್ತಿದ್ದಾಗ ಆಡಿದ ಮಾತುಗಳಿವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 59", "r": "6:59"}, {"n": 211, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:60ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜೀವದಾಯಕ ನುಡಿ", "r": "6:60"}, {"n": 212, "q": "ಯೇಸುವಿನ ಬೋಧನೆಯ ಬಗ್ಗೆ ಅವರ ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು ಏನೆಂದು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "“ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?”", "r": "6:60"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು, ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:60"}, {"n": 214, "q": "“ಯೇಸುಸ್ವಾಮಿಯ ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು, ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 60", "r": "6:60"}, {"n": 215, "q": "ಶಿಷ್ಯರು ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು ಅರಿತ ಯೇಸು ಏನು ಕೇಳಿದರು?", "a": "“ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?”", "r": "6:61"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಷಯವಾಗಿ ತಮ್ಮ ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸು ತಾವಾಗಿಯೇ ಅರಿತು, ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?”", "a": "ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು", "r": "6:61"}, {"n": 217, "q": "“ಈ ವಿಷಯವಾಗಿ ತಮ್ಮ ಶಿಷ್ಯರು ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು ಯೇಸು ತಾವಾಗಿಯೇ ಅರಿತು, ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 61", "r": "6:61"}, {"n": 218, "q": "ಶಿಷ್ಯರು ನರಪುತ್ರನು ಏನು ಮಾಡುವುದನ್ನು ಕಂಡಾಗ ಏನನ್ನುವರು ಎಂದು ಯೇಸು ಕೇಳಿದರು?", "a": "ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ ಏರುವುದನ್ನು", "r": "6:62"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ ನರಪುತ್ರನು ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕಂಡಾಗ ಏನನ್ನುವಿರಿ?”", "a": "ಏರುವುದನ್ನು", "r": "6:62"}, {"n": 220, "q": "“ಹಾಗಾದರೆ ನರಪುತ್ರನು ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ ಏರುವುದನ್ನು ನೀವು ಕಂಡಾಗ ಏನನ್ನುವಿರಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 62", "r": "6:62"}, {"n": 221, "q": "ಸಜೀವವನ್ನು ಕೊಡುವಂಥಾದ್ದು ಯಾವುದು?", "a": "ದೇವರ ಆತ್ಮವೇ", "r": "6:63"}, {"n": 222, "q": "ಯೇಸುವಿನ ಮಾತುಗಳು ಏನನ್ನು ತರುತ್ತವೆ?", "a": "ಜೀವದಾಯಕ ದೇವರಾತ್ಮವನ್ನು", "r": "6:63"}, {"n": 223, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯಾವುದರಿಂದ ಏನೂ ಆಗದು?", "a": "ನರಮಾಂಸದಿಂದ", "r": "6:63"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಆತ್ಮವೇ.”", "a": "ಕೊಡುವಂಥಾದ್ದು", "r": "6:63"}, {"n": 225, "q": "ಯೇಸುವಿಗೆ ಮೊದಲಿನಿಂದಲೂ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ವಿಶ್ವಾಸವಿಲ್ಲದವರು ಯಾರು, ತಮ್ಮನ್ನು ಹಿಡಿದುಕೊಡುವ ಗುರುದ್ರೋಹಿ ಯಾರು ಎಂದು", "r": "6:64"}, {"n": 226, "q": "“ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ…” — ಯೇಸುವಿನ ಈ ಮಾತನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ವಿಶ್ವಾಸವಿಲ್ಲ”", "r": "6:64"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದರು.”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲ", "r": "6:64"}, {"n": 228, "q": "“ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ ವಿಶ್ವಾಸವಿಲ್ಲ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 64", "r": "6:64"}, {"n": 229, "q": "ಯಾರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬರಲಾರರು ಎಂದು ಯೇಸು ಹಿಂದೆ ಹೇಳಿದ್ದರು?", "a": "‘ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು’", "r": "6:65"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು, ಎಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೆ ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "6:65"}, {"n": 231, "q": "“ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು, ಎಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ, ಎಂದು ಯೇಸು ಮತ್ತೆ ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 65", "r": "6:65"}, {"n": 232, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:66ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೇತ್ರನ ವಿಶ್ವಾಸ ಪ್ರಮಾಣ", "r": "6:66"}, {"n": 233, "q": "ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬೋಧನೆಯ ನಂತರ ಯೇಸುವಿನ ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಏನು ಮಾಡಿದರು?", "a": "ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟುಬಿಟ್ಟರು; ಹೋದವರು ಹಿಂದಿರುಗಿ ಬರಲಿಲ್ಲ", "r": "6:66"}, {"n": 234, "q": "ಯೇಸುವಿನ ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಯಾವಾಗಿನಿಂದ ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟರು?", "a": "ಅಂದಿನಿಂದ (ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬೋಧನೆಯ ನಂತರ)", "r": "6:66"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟುಬಿಟ್ಟರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:66"}, {"n": 236, "q": "ಯೇಸು ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?”", "r": "6:67"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ, ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?”", "a": "ಯೇಸು", "r": "6:67"}, {"n": 238, "q": "“ಆಗ ಯೇಸು ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ, ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 67", "r": "6:67"}, {"n": 239, "q": "“ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಸಿಮೋನ ಪೇತ್ರನ ಉತ್ತರದ ಆರಂಭ ಏನು?", "a": "“ಪ್ರಭುವೇ, ನಾವು ಹೋಗುವುದಾದರೂ ಯಾರ ಬಳಿಗೆ?”", "r": "6:68"}, {"n": 240, "q": "ಪೇತ್ರನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ನುಡಿ ಎಲ್ಲಿದೆ?", "a": "ಯೇಸುವಿನಲ್ಲೇ (“ತಮ್ಮಲ್ಲೇ”)", "r": "6:68"}, {"n": 241, "q": "ಪೇತ್ರನ ವಿಶ್ವಾಸ ಪ್ರಮಾಣದಲ್ಲಿ ಯೇಸುವನ್ನು ಕುರಿತು ಅವನು ಹೇಳಿದ ಎರಡು ವಿಷಯಗಳು ಯಾವುವು?", "a": "1) ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ನುಡಿ ಇರುವುದು ತಮ್ಮಲ್ಲೇ; 2) ತಾವೇ ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು", "r": "6:68–69"}, {"n": 242, "q": "ಸಿಮೋನ ಪೇತ್ರನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಪ್ರಭುವೇ”", "r": "6:68"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಸಿಮೋನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರಭುವೇ, ನಾವು ಹೋಗುವುದಾದರೂ ಯಾರ ಬಳಿಗೆ?”", "a": "ಪೇತ್ರನು", "r": "6:68"}, {"n": 244, "q": "ಪೇತ್ರನು ಯೇಸುವನ್ನು ಏನೆಂದು ಅರಿಕೆ ಮಾಡಿದನು?", "a": "ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು", "r": "6:69"}, {"n": 245, "q": "ಪೇತ್ರನ ಪ್ರಕಾರ “ತಾವೇ ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು” ಎಂಬುದು ಶಿಷ್ಯರ ಏನು?", "a": "ವಿಶ್ವಾಸ ಮತ್ತು ಗ್ರಹಿಕೆ", "r": "6:69"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾವೇ ದೇವರಿಂದ ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಮಪೂಜ್ಯರು", "r": "6:69"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಇದೇ ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಗ್ರಹಿಕೆ, ಎಂದು ಹೇಳಿದನು.”", "a": "ವಿಶ್ವಾಸ", "r": "6:69"}, {"n": 248, "q": "ಯೇಸು ಎಷ್ಟು ಮಂದಿಯನ್ನು ಆಯ್ದುಕೊಂಡರು?", "a": "ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು", "r": "6:70"}, {"n": 249, "q": "ತಾವು ಆಯ್ದುಕೊಂಡ ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ ಒಬ್ಬನ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು ಪಿಶಾಚಿಯಾಗಿ ಇದ್ದಾನೆ”", "r": "6:70"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮಲ್ಲಿ ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು ನಾನು ಆಯ್ದುಕೊಂಡೆನಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "6:70"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾನೆ, ಎಂದರು.”", "a": "ಪಿಶಾಚಿಯಾಗಿ", "r": "6:70"}, {"n": 252, "q": "“ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು ಪಿಶಾಚಿಯಾಗಿ ಇದ್ದಾನೆ” ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕುರಿತು ಹೇಳಿದರು?", "a": "ಸಿಮೋನನ ಮಗ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನನ್ನು ಕುರಿತು", "r": "6:71"}, {"n": 253, "q": "ಇಸ್ಕರಿಯೋತಿನ ಯೂದನ ತಂದೆ ಯಾರು?", "a": "ಸಿಮೋನ", "r": "6:71"}, {"n": 254, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೂದನನ್ನು ಏನೆಂದು ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಗುರುದ್ರೋಹಿ", "r": "6:71"}, {"n": 255, "q": "ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು ಎಷ್ಟು ಮಂದಿಯಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದನು?", "a": "ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ", "r": "6:71"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಸಿಮೋನನ ಮಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೂದನನ್ನು ಕುರಿತು.”", "a": "ಇಸ್ಕರಿಯೋತಿನ", "r": "6:71"}]}]}</script>

<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
