translateY(-2pt);margin:0 1mm\"><\/span> ಪಂಕ್ತಿಯಲ್ಲಿ ಊಟಕ್ಕೆ ಕುಳಿತಿದ್ದವರಲ್ಲಿ ಲಾಸರನೂ ಒಬ್ಬ.”", "a": "ಯೇಸುವಿನೊಡನೆ", "r": "12:2"}, {"n": 13, "q": "“ಯೇಸುವಿಗೆ ಅಲ್ಲಿ ಒಂದು ಔತಣವನ್ನು ಏರ್ಪಡಿಸಲಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "12:2"}, {"n": 14, "q": "ಯೇಸುವಿನ ಪಾದಗಳಿಗೆ ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿದವಳು ಯಾರು?", "a": "ಮರಿಯಳು", "r": "12:3"}, {"n": 15, "q": "ಮರಿಯಳು ಯೇಸುವಿನ ಪಾದಗಳಿಗೆ ಹಚ್ಚಿದ ತೈಲ ಯಾವುದು?", "a": "ಅತ್ಯಂತ ಬೆಲೆಬಾಳುವ ಅಚ್ಚ ಜಟಾಮಾಂಸಿ ಸುಗಂಧ ತೈಲ", "r": "12:3"}, {"n": 16, "q": "ಮರಿಯಳು ಎಷ್ಟು ಸುಗಂಧ ತೈಲವನ್ನು ತಂದಳು?", "a": "ಸುಮಾರು ಅರ್ಧ ಲೀಟರಿನಷ್ಟು", "r": "12:3"}, {"n": 17, "q": "ಮರಿಯಳು ಯೇಸುವಿನ ಪಾದಗಳನ್ನು ಯಾವುದರಿಂದ ಒರಸಿದಳು?", "a": "ತನ್ನ ತಲೆಗೂದಲಿನಿಂದ", "r": "12:3"}, {"n": 18, "q": "ತೈಲವನ್ನು ಹಚ್ಚಿದಾಗ ಏನಾಯಿತು?", "a": "ತೈಲದ ಸುವಾಸನೆ ಮನೆಯಲ್ಲೆಲ್ಲಾ ಹರಡಿತು", "r": "12:3"}, {"n": 19, "q": "ಮರಿಯಳು ಯೇಸುವಿನ ಪಾದಗಳಿಗೆ ಸುಗಂಧ ತೈಲ ಹಚ್ಚಿದ ಘಟನೆಯನ್ನು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ ಮುಂಚಿತವಾಗಿ ಎಲ್ಲಿ ಉಲ್ಲೇಖಿಸುತ್ತದೆ?", "a": "11:2ರಲ್ಲಿ (ಲಾಸರನ ಸಾವಿನ ವೃತ್ತಾಂತದಲ್ಲಿ)", "r": "11:1–2; 12:3"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಮರಿಯಳು ಸುಮಾರು ಅರ್ಧ ಲೀಟರಿನಷ್ಟು, ಅತ್ಯಂತ ಬೆಲೆಬಾಳುವ ಅಚ್ಚ ಜಟಾಮಾಂಸಿ ಸುಗಂಧ ತೈಲವನ್ನು ತಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾದಗಳಿಗೆ ಹಚ್ಚಿ, ತನ್ನ ತಲೆಗೂದಲಿನಿಂದ ಆ ಪಾದಗಳನ್ನು ಒರಸಿದಳು.”", "a": "ಯೇಸುವಿನ", "r": "12:3"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತೈಲದ ಸುವಾಸನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹರಡಿತು.”", "a": "ಮನೆಯಲ್ಲೆಲ್ಲಾ", "r": "12:3"}, {"n": 22, "q": "ಮರಿಯಳ ಅಭಿಷೇಕವನ್ನು ಆಕ್ಷೇಪಿಸಿದ ಶಿಷ್ಯ ಯಾರು?", "a": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು", "r": "12:4"}, {"n": 23, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 6 ಮತ್ತು 12ನೇ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನನ್ನು ಹೇಗೆ ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಗುರುದ್ರೋಹಿ (6:71); ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ, ಹಣದ ಚೀಲದಿಂದ ಕದಿಯುತ್ತಿದ್ದ ಕಳ್ಳ (12:4–6)", "r": "6:71; 12:4"}, {"n": 24, "q": "ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು ಯಾರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದನು?", "a": "ಶಿಷ್ಯರಲ್ಲಿ", "r": "12:4"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಹಾಗೂ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೂದನು,”", "a": "ಇಸ್ಕರಿಯೋತಿನ", "r": "12:4"}, {"n": 26, "q": "“ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಹಾಗೂ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "12:4"}, {"n": 27, "q": "ಯೊವಾನ್ನ 12:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಹಾಗೂ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು,", "r": "12:4"}, {"n": 28, "q": "ಯೂದನ ಪ್ರಕಾರ ಸುಗಂಧ ತೈಲವನ್ನು ಎಷ್ಟು ನಾಣ್ಯಗಳಿಗೆ ಮಾರಬಹುದಿತ್ತು?", "a": "ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳಿಗೆ", "r": "12:5"}, {"n": 29, "q": "ಮರಿಯಳ ಅಭಿಷೇಕದ ಬಗ್ಗೆ ಯೂದನು ಏನೆಂದನು?", "a": "“ಈ ಸುಗಂಧ ತೈಲವನ್ನು ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳಿಗೆ ಮಾರಿ, ಬಂದ ಹಣವನ್ನು ಬಡಬಗ್ಗರಿಗೆ ಕೊಡಬಹುದಿತ್ತಲ್ಲಾ?”", "r": "12:5"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸುಗಂಧ ತೈಲವನ್ನು ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳಿಗೆ ಮಾರಿ, ಬಂದ ಹಣವನ್ನು ಬಡಬಗ್ಗರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೊಡಬಹುದಿತ್ತಲ್ಲಾ", "r": "12:5"}, {"n": 31, "q": "“ಈ ಸುಗಂಧ ತೈಲವನ್ನು ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳಿಗೆ ಮಾರಿ, ಬಂದ ಹಣವನ್ನು ಬಡಬಗ್ಗರಿಗೆ ಕೊಡಬಹುದಿತ್ತಲ್ಲಾ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "12:5"}, {"n": 32, "q": "ಯೊವಾನ್ನ 12:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಈ ಸುಗಂಧ ತೈಲವನ್ನು ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳಿಗೆ ಮಾರಿ, ಬಂದ ಹಣವನ್ನು ಬಡಬಗ್ಗರಿಗೆ ಕೊಡಬಹುದಿತ್ತಲ್ಲಾ?” ಎಂದನು.", "r": "12:5"}, {"n": 33, "q": "ಯೂದನು ಬಡವರಿಗೆ ಹಣ ಕೊಡಬಹುದಿತ್ತು ಎಂದದ್ದು ಏಕೆ?", "a": "ಬಡವರ ಹಿತಚಿಂತನೆಯಿಂದಲ್ಲ; ಅವನು ತನ್ನ ವಶದಲ್ಲಿದ್ದ ಹಣದ ಚೀಲದಿಂದ ಸ್ವಂತ ಉಪಯೋಗಕ್ಕಾಗಿ ಬಳಸುತ್ತಿದ್ದ ಕಳ್ಳನಾಗಿದ್ದನು", "r": "12:6"}, {"n": 34, "q": "ಯೂದನ ವಶದಲ್ಲಿ ಏನು ಇಡಲಾಗಿತ್ತು?", "a": "ಹಣದ ಚೀಲ", "r": "12:6"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಡವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು ಹೀಗೆ ಹೇಳಲಿಲ್ಲ.”", "a": "ಹಿತಚಿಂತನೆಯಿಂದೇನೂ", "r": "12:6"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ವಶದಲ್ಲಿ ಇಡಲಾಗಿದ್ದ ಹಣದ ಚೀಲದಿಂದ ಸ್ವಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಸುತ್ತಿದ್ದ ಕಳ್ಳ ಅವನು.”", "a": "ಉಪಯೋಗಕ್ಕಾಗಿ", "r": "12:6"}, {"n": 37, "q": "“ಬಡವರ ಹಿತಚಿಂತನೆಯಿಂದೇನೂ ಅವನು ಹೀಗೆ ಹೇಳಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "12:6"}, {"n": 38, "q": "ಯೂದನ ಆಕ್ಷೇಪಕ್ಕೆ ಯೇಸುವಿನ ಉತ್ತರದ ಆರಂಭ ಏನು?", "a": "“ಆಕೆಯ ಗೊಡವೆ ನಿನಗೆ ಬೇಡ.”", "r": "12:7"}, {"n": 39, "q": "ಮರಿಯಳು ತೈಲವನ್ನು ಯಾವ ದಿನಕ್ಕಾಗಿ ಇಟ್ಟುಕೊಳ್ಳಲಿ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ತಮ್ಮ ಶವಸಂಸ್ಕಾರದ ದಿನಕ್ಕಾಗಿ", "r": "12:7"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆಕೆಯ ಗೊಡವೆ ನಿನಗೆ ಬೇಡ.”", "a": "ಯೇಸು", "r": "12:7"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಶವಸಂಸ್ಕಾರದ ದಿನಕ್ಕಾಗಿ ಆಕೆ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇಟ್ಟುಕೊಳ್ಳಲಿ", "r": "12:7"}, {"n": 42, "q": "“ಆಗ ಯೇಸು, ಆಕೆಯ ಗೊಡವೆ ನಿನಗೆ ಬೇಡ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "12:7"}, {"n": 43, "q": "ಬಡಬಗ್ಗರ ಮತ್ತು ತಮ್ಮ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "ಬಡಬಗ್ಗರು ಯಾವಾಗಲೂ ನಿಮ್ಮ ಬಳಿಯಲ್ಲಿ ಇರುತ್ತಾರೆ; ಆದರೆ ನಾನು ಯಾವಾಗಲೂ ನಿಮ್ಮ ಬಳಿ ಇರುವುದಿಲ್ಲ", "r": "12:8"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಡಬಗ್ಗರು ನಿಮ್ಮ ಬಳಿಯಲ್ಲಿ ಯಾವಾಗಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರುತ್ತಾರೆ", "r": "12:8"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾನು ಯಾವಾಗಲೂ ನಿಮ್ಮ ಬಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಇರುವುದಿಲ್ಲ", "r": "12:8"}, {"n": 46, "q": "“ಬಡಬಗ್ಗರು ನಿಮ್ಮ ಬಳಿಯಲ್ಲಿ ಯಾವಾಗಲೂ ಇರುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "12:8"}, {"n": 47, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 12:9ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಲಾಸರನ ಕೊಲೆಗೆ ಹಂಚಿಕೆ", "r": "12:9"}, {"n": 48, "q": "ಯೆಹೂದ್ಯರ ದೊಡ್ಡಗುಂಪು ಬೆಥಾನಿಯಕ್ಕೆ ಏಕೆ ಬಂದಿತು?", "a": "ಯೇಸುವನ್ನು ಮಾತ್ರವಲ್ಲ, ಅವರು ಸಾವಿನಿಂದ ಎಬ್ಬಿಸಿದ ಲಾಸರನನ್ನೂ ಕಾಣಲು", "r": "12:9"}, {"n": 49, "q": "ಹನ್ನೆರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಲಾಸರನ ಪುನರುಜ್ಜೀವನದ ಪರಿಣಾಮಗಳೇನು?", "a": "ಜನರು ಲಾಸರನನ್ನು ಕಾಣಲು ಬಂದರು (12:9); ಅನೇಕರು ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟರು (12:11); ಮುಖ್ಯಯಾಜಕರು ಲಾಸರನನ್ನೂ ಕೊಲ್ಲಲು ಆಲೋಚಿಸಿದರು (12:10); ಜನರು ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋದರು (12:17–18)", "r": "11:43–44; 12:9; 12:17"}, {"n": 50, "q": "ಯೇಸು ಬೆಥಾನಿಯದಲ್ಲಿರುವುದನ್ನು ಕೇಳಿ ಬಂದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯರ ಒಂದು ದೊಡ್ಡಗುಂಪು", "r": "12:9"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿರುವುದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯರ ಒಂದು ದೊಡ್ಡಗುಂಪು ಬಂದಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:9"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರವಲ್ಲ, ಅವರು ಸಾವಿನಿಂದ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಿದ ಲಾಸರನನ್ನೂ ಕಾಣಲು ಆ ಜನರು ಅಲ್ಲಿಗೆ ಬಂದಿದ್ದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "12:9"}, {"n": 53, "q": "ಲಾಸರನನ್ನು ಕೂಡ ಕೊಲ್ಲಬೇಕೆಂದು ಆಲೋಚಿಸಿದವರು ಯಾರು?", "a": "ಮುಖ್ಯಯಾಜಕರು", "r": "12:10–11"}, {"n": 54, "q": "ಮುಖ್ಯಯಾಜಕರು ಲಾಸರನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ಏಕೆ ಆಲೋಚಿಸಿದರು?", "a": "ಲಾಸರನ ನಿಮಿತ್ತವಾಗಿ ಅನೇಕ ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಬಿಟ್ಟು ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟ ಕಾರಣ", "r": "12:10–11"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲಾಸರನ ನಿಮಿತ್ತವಾಗಿ ಅನೇಕ ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಬಿಟ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆಯಿಟ್ಟ ಕಾರಣ ಲಾಸರನನ್ನು ಕೂಡ ಕೊಲ್ಲಬೇಕೆಂದು ಮುಖ್ಯಯಾಜಕರು ಆಲೋಚಿಸಿದರು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "12:10–11"}, {"n": 56, "q": "“ಲಾಸರನ ನಿಮಿತ್ತವಾಗಿ ಅನೇಕ ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಬಿಟ್ಟು ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟ ಕಾರಣ ಲಾಸರನನ್ನು ಕೂಡ ಕೊಲ್ಲಬೇಕೆಂದು ಮುಖ್ಯಯಾಜಕರು ಆಲೋಚಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10–11", "r": "12:10–11"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲಾಸರನ ನಿಮಿತ್ತವಾಗಿ ಅನೇಕ ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಬಿಟ್ಟು ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟ ಕಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ ಕೊಲ್ಲಬೇಕೆಂದು ಮುಖ್ಯಯಾಜಕರು ಆಲೋಚಿಸಿದರು.”", "a": "ಲಾಸರನನ್ನು", "r": "12:10–11"}, {"n": 58, "q": "ಯೊವಾನ್ನ 12:10–11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಲಾಸರನ ನಿಮಿತ್ತವಾಗಿ ಅನೇಕ ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಬಿಟ್ಟು ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟ ಕಾರಣ ಲಾಸರನನ್ನು ಕೂಡ ಕೊಲ್ಲಬೇಕೆಂದು ಮುಖ್ಯಯಾಜಕರು ಆಲೋಚಿಸಿದರು.", "r": "12:10–11"}, {"n": 59, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 12:12ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜೆರುಸಲೇಮಿಗೆ ರಾಜಪ್ರವೇಶ", "r": "12:12"}, {"n": 60, "q": "ಮಾರನೆಯ ದಿನ ಹಬ್ಬಕ್ಕೆ ಬಂದಿದ್ದ ಜನಸಮೂಹಕ್ಕೆ ಯಾವ ಸುದ್ದಿ ಮುಟ್ಟಿತು?", "a": "ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ಬರುತ್ತಿದ್ದಾರೆಂಬ ಸುದ್ದಿ", "r": "12:12"}, {"n": 61, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿಗೆ ಬರುತ್ತಿದ್ದಾರೆಂಬ ಸುದ್ದಿ ಯಾವಾಗ ಹರಡಿತು?", "a": "ಮಾರನೆಯ ದಿನ", "r": "12:12"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿಗೆ ಬರುತ್ತಿದ್ದಾರೆಂಬ ಸುದ್ದಿ ಹರಡಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:12"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬಕ್ಕೆ ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜನ ಸಮೂಹಕ್ಕೆ ಈ ಸುದ್ಧಿ ಮುಟ್ಟಿತು.”", "a": "ನೆರೆದಿದ್ದ", "r": "12:12"}, {"n": 64, "q": "“ಮಾರನೆಯ ದಿನ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ಬರುತ್ತಿದ್ದಾರೆಂಬ ಸುದ್ದಿ ಹರಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "12:12"}, {"n": 65, "q": "ಜನರು ಏನನ್ನು ಹಿಡಿದುಕೊಂಡು ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೊರಟರು?", "a": "ಖರ್ಜೂರದ ಗರಿಗಳನ್ನು", "r": "12:13"}, {"n": 66, "q": "ಜನರು ಯೇಸುವನ್ನು ಸ್ವಾಗತಿಸುವಾಗ ಏನೆಂದು ಘೋಷಿಸಿದರು?", "a": "‘ಸರ್ವೇಶ್ವರನ ನಾಮದಲ್ಲಿ ಬರುವಾತನಿಗೆ ಜಯಜಯವಾಗಲಿ ! ಇಸ್ರಯೇಲಿನ ಅರಸನಿಗೆ ಶುಭವಾಗಲಿ!’", "r": "12:13"}, {"n": 67, "q": "ಜನರು ತಮ್ಮ ಘೋಷಣೆಯಲ್ಲಿ ಯೇಸುವನ್ನು ಯಾರ ಅರಸನೆಂದು ಕರೆದರು?", "a": "ಇಸ್ರಯೇಲಿನ ಅರಸ", "r": "12:13"}, {"n": 68, "q": "ಜನರು ಯೇಸುವನ್ನು ಏನು ಮಾಡಲು ಹೊರಟರು?", "a": "ಎದುರುಗೊಳ್ಳಲು", "r": "12:13"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಖರ್ಜೂರದ ಗರಿಗಳನ್ನು ಹಿಡಿದುಕೊಂಡು ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎದುರುಗೊಳ್ಳಲು ಹೊರಟರು.”", "a": "ಯೇಸುವನ್ನು", "r": "12:13"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಮದಲ್ಲಿ ಬರುವಾತನಿಗೆ ಜಯಜಯವಾಗಲಿ !”", "a": "ಸರ್ವೇಶ್ವರನ", "r": "12:13"}, {"n": 71, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿಗೆ ಯಾವುದನ್ನು ಹತ್ತಿ ಹೊರಟರು?", "a": "ದಾರಿಯಲ್ಲಿದ್ದ ಪ್ರಾಯದ ಹೇಸರಗತ್ತೆಯೊಂದನ್ನು", "r": "12:14"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ದಾರಿಯಲ್ಲಿದ್ದ ಪ್ರಾಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹತ್ತಿ ಹೊರಟರು.”", "a": "ಹೇಸರಗತ್ತೆಯೊಂದನ್ನು", "r": "12:14"}, {"n": 73, "q": "“ಯೇಸು ದಾರಿಯಲ್ಲಿದ್ದ ಪ್ರಾಯದ ಹೇಸರಗತ್ತೆಯೊಂದನ್ನು ಹತ್ತಿ ಹೊರಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "12:14"}, {"n": 74, "q": "ಯೊವಾನ್ನ 12:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ದಾರಿಯಲ್ಲಿದ್ದ ಪ್ರಾಯದ ಹೇಸರಗತ್ತೆಯೊಂದನ್ನು ಹತ್ತಿ ಹೊರಟರು.", "r": "12:14"}, {"n": 75, "q": "ಯೇಸುವಿನ ರಾಜಪ್ರವೇಶದ ಬಗ್ಗೆ ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲಿ ಏನೆಂದಿದೆ?", "a": "‘ಸಿಯೋನ್ ನಗರಿಯೇ, ಅಂಜಬೇಡ. ಇಗೋ ನೋಡು; ಹೇಸರಗತ್ತೆಯನ್ನೇರಿ ಬರುತ್ತಿರುವನು ನಿನ್ನ ಅರಸನು’", "r": "12:15"}, {"n": 76, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾವ ನಗರಿಗೆ “ಅಂಜಬೇಡ” ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಸಿಯೋನ್ ನಗರಿಗೆ", "r": "12:15"}, {"n": 77, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಸಿಯೋನಿನ ಅರಸನು ಯಾವುದನ್ನೇರಿ ಬರುವನು?", "a": "ಹೇಸರಗತ್ತೆಯನ್ನೇರಿ", "r": "12:15"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸಿಯೋನ್ ನಗರಿಯೇ, ಅಂಜಬೇಡ.”", "a": "ಕುರಿತೇ", "r": "12:15"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುತ್ತಿರುವನು ನಿನ್ನ ಅರಸನು ಎಂದಿದೆ ಪವಿತ್ರ ಗ್ರಂಥ.”", "a": "ಹೇಸರಗತ್ತೆಯನ್ನೇರಿ", "r": "12:15"}, {"n": 80, "q": "“ಇದನ್ನು ಕುರಿತೇ, ಸಿಯೋನ್ ನಗರಿಯೇ, ಅಂಜಬೇಡ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "12:15"}, {"n": 81, "q": "ರಾಜಪ್ರವೇಶದ ಅರ್ಥವನ್ನು ಶಿಷ್ಯರು ಯಾವಾಗ ನೆನಪಿಗೆ ತಂದುಕೊಂಡರು?", "a": "ಯೇಸು ಮಹಿಮಾಪದವಿಯನ್ನು ಪಡೆದಾದ ಮೇಲೆ", "r": "12:16"}, {"n": 82, "q": "ರಾಜಪ್ರವೇಶದ ಸಮಯದಲ್ಲಿ ಶಿಷ್ಯರ ಸ್ಥಿತಿ ಏನು?", "a": "ಇದೆಲ್ಲ ಅವರಿಗೆ ಆಗ ಅರ್ಥವಾಗಲಿಲ್ಲ", "r": "12:16"}, {"n": 83, "q": "ಶಿಷ್ಯರು ನೆನಪಿಗೆ ತಂದುಕೊಂಡದ್ದು ಏನು?", "a": "ಇದೆಲ್ಲವನ್ನೂ ಬರೆದದ್ದು ಯೇಸುವನ್ನು ಕುರಿತೇ; ಆ ಪ್ರಕಾರವೇ ನೆರವೇರಿದೆ ಎಂಬುದು", "r": "12:16"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದೆಲ್ಲ ಶಿಷ್ಯರಿಗೆ ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರ್ಥವಾಗಲಿಲ್ಲ", "r": "12:16"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದದ್ದು ಅವರನ್ನು ಕುರಿತೇ;”", "a": "ಇದೆಲ್ಲವನ್ನೂ", "r": "12:16"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಪ್ರಕಾರವೇ ನೆರವೇರಿದೆ ಎಂಬುದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಿಮಾಪದವಿಯನ್ನು ಪಡೆದಾದ ಮೇಲೆ ಅವರು ನೆನಪಿಗೆ ತಂದುಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "12:16"}, {"n": 87, "q": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನದ ವಿಷಯವನ್ನು ಇತರರಿಗೆ ಸಾರುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಯೇಸು ಲಾಸರನನ್ನು ಎಬ್ಬಿಸಿದಾಗ ಅವರ ಸಂಗಡ ಇದ್ದವರು", "r": "12:17"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಮಾಧಿಯಿಂದ ಹೊರಗೆ ಕರೆದು ಸಾವಿನಿಂದ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಿದಾಗ ಅವರ ಸಂಗಡ ಇದ್ದವರು ನಡೆದ ವಿಷಯವನ್ನು ಇತರರಿಗೆ ಸಾರುತ್ತಿದ್ದರು.”", "a": "ಲಾಸರನನ್ನು", "r": "12:17"}, {"n": 89, "q": "“ಇದಲ್ಲದೆ ಯೇಸು ಲಾಸರನನ್ನು ಸಮಾಧಿಯಿಂದ ಹೊರಗೆ ಕರೆದು ಸಾವಿನಿಂದ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಿದಾಗ ಅವರ ಸಂಗಡ ಇದ್ದವರು ನಡೆದ ವಿಷಯವನ್ನು ಇತರರಿಗೆ ಸಾರುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "12:17"}, {"n": 90, "q": "ಯೊವಾನ್ನ 12:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ ಯೇಸು ಲಾಸರನನ್ನು ಸಮಾಧಿಯಿಂದ ಹೊರಗೆ ಕರೆದು ಸಾವಿನಿಂದ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಿದಾಗ ಅವರ ಸಂಗಡ ಇದ್ದವರು ನಡೆದ ವಿಷಯವನ್ನು ಇತರರಿಗೆ ಸಾರುತ್ತಿದ್ದರು.", "r": "12:17"}, {"n": 91, "q": "ಜನರು ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋಗಿದ್ದಕ್ಕೆ ಇನ್ನೊಂದು ಕಾರಣವೇನು?", "a": "ಲಾಸರನನ್ನು ಎಬ್ಬಿಸಿದ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದ್ದ ಕಾರಣ", "r": "12:18"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದ್ದ ಕಾರಣದಿಂದಲೂ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎದುರುಗೊಳ್ಳಲು ಹೋಗಿದ್ದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "12:18"}, {"n": 93, "q": "“ಈ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದ್ದ ಕಾರಣದಿಂದಲೂ ಜನರು ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "12:18"}, {"n": 94, "q": "ಯೊವಾನ್ನ 12:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದ್ದ ಕಾರಣದಿಂದಲೂ ಜನರು ಯೇಸುವನ್ನು ಎದುರುಗೊಳ್ಳಲು ಹೋಗಿದ್ದರು.", "r": "12:18"}, {"n": 95, "q": "ರಾಜಪ್ರವೇಶವನ್ನು ಕಂಡ ಫರಿಸಾಯರು ತಮ್ಮತಮ್ಮೊಳಗೆ ಏನೆಂದುಕೊಂಡರು?", "a": "“ನೋಡಿದಿರಾ? ನಮ್ಮ ಕೈಯಿಂದ ಏನೂ ಆಗಲಿಲ್ಲ. ಇಡೀ ಜಗತ್ತೇ ಅವನ ಹಿಂದೆ ಹೋಗುತ್ತಿದೆಯಲ್ಲಾ!”", "r": "12:19"}, {"n": 96, "q": "“ಇಡೀ ಜಗತ್ತೇ ಅವನ ಹಿಂದೆ ಹೋಗುತ್ತಿದೆಯಲ್ಲಾ!” ಎಂದುಕೊಂಡವರು ಯಾರು?", "a": "ಫರಿಸಾಯರು", "r": "12:19"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನೆಲ್ಲಾ ಕಂಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ತಮ್ಮೊಳಗೆ, ನೋಡಿದಿರಾ?”", "a": "ಫರಿಸಾಯರು", "r": "12:19"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಕೈಯಿಂದ ಏನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಗಲಿಲ್ಲ", "r": "12:19"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಡೀ ಜಗತ್ತೇ ಅವನ ಹಿಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಹೋಗುತ್ತಿದೆಯಲ್ಲಾ", "r": "12:19"}, {"n": 100, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 12:20ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಗ್ರೀಕರಿಗೂ ಯೇಸುವನ್ನು ಕಾಣುವ ಬಯಕೆ", "r": "12:20"}, {"n": 101, "q": "ಆರಾಧನೆಗೆಂದು ಹಬ್ಬಕ್ಕೆ ಬಂದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು ಯಾರು?", "a": "ಗ್ರೀಕರು", "r": "12:20"}, {"n": 102, "q": "ಗ್ರೀಕರು ಹಬ್ಬಕ್ಕೆ ಏಕೆ ಬಂದಿದ್ದರು?", "a": "ಆರಾಧನೆಗೆಂದು", "r": "12:20"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆರಾಧನೆಗೆಂದು ಹಬ್ಬಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲವರು ಗ್ರೀಕರು.”", "a": "ಬಂದಿದ್ದವರಲ್ಲಿ", "r": "12:20"}, {"n": 104, "q": "“ಆರಾಧನೆಗೆಂದು ಹಬ್ಬಕ್ಕೆ ಬಂದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು ಗ್ರೀಕರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "12:20"}, {"n": 105, "q": "ಯೊವಾನ್ನ 12:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆರಾಧನೆಗೆಂದು ಹಬ್ಬಕ್ಕೆ ಬಂದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು ಗ್ರೀಕರು.", "r": "12:20"}, {"n": 106, "q": "ಗ್ರೀಕರು ಯೇಸುವನ್ನು ನೋಡಬೇಕೆಂದು ಯಾರ ಬಳಿ ಕೇಳಿಕೊಂಡರು?", "a": "ಗಲಿಲೇಯದ ಬೆತ್ಸಾಯಿದ ಊರಿನವನಾದ ಫಿಲಿಪ್ಪನ ಬಳಿ", "r": "12:21"}, {"n": 107, "q": "ಗ್ರೀಕರು ಫಿಲಿಪ್ಪನನ್ನು ಏನೆಂದು ಕೇಳಿಕೊಂಡರು?", "a": "“ಅಯ್ಯಾ, ನಾವು ಯೇಸುವನ್ನು ನೋಡಬೇಕೆಂದಿದ್ದೇವೆ”", "r": "12:21"}, {"n": 108, "q": "ಫಿಲಿಪ್ಪನು ಯಾವ ಊರಿನವನೆಂದು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಯಾವ ಎರಡು ವಚನಗಳು ಹೇಳುತ್ತವೆ?", "a": "ಬೆತ್ಸಾಯಿದ (1:44; 12:21)", "r": "1:44; 12:21"}, {"n": 109, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಫಿಲಿಪ್ಪ ಮತ್ತು ಅಂದ್ರೆಯ ಒಟ್ಟಾಗಿ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ (6:5–9); ಗ್ರೀಕರು ಯೇಸುವನ್ನು ಕಾಣಬಯಸಿದಾಗ (12:21–22)", "r": "6:5–9; 12:21–22"}, {"n": 110, "q": "ಗ್ರೀಕರು ಫಿಲಿಪ್ಪನನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಅಯ್ಯಾ”", "r": "12:21"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ಗಲಿಲೇಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಊರಿನವನಾದ ಫಿಲಿಪ್ಪನ ಬಳಿ ಬಂದು, ಅಯ್ಯಾ, ನಾವು ಯೇಸುವನ್ನು ನೋಡಬೇಕೆಂದಿದ್ದೇವೆ, ಎಂದು ಕೇಳಿಕೊಂಡರು.”", "a": "ಬೆತ್ಸಾಯಿದ", "r": "12:21"}, {"n": 112, "q": "“ಇವರು ಗಲಿಲೇಯದ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನಾದ ಫಿಲಿಪ್ಪನ ಬಳಿ ಬಂದು, ಅಯ್ಯಾ, ನಾವು ಯೇಸುವನ್ನು ನೋಡಬೇಕೆಂದಿದ್ದೇವೆ, ಎಂದು ಕೇಳಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "12:21"}, {"n": 113, "q": "ಫಿಲಿಪ್ಪನು ಗ್ರೀಕರ ಕೋರಿಕೆಯನ್ನು ಮೊದಲು ಯಾರಿಗೆ ಹೇಳಿದನು?", "a": "ಅಂದ್ರೆಯನಿಗೆ", "r": "12:22"}, {"n": 114, "q": "ಗ್ರೀಕರ ಕೋರಿಕೆಯನ್ನು ಯೇಸುವಿಗೆ ತಿಳಿಸಿದ ಇಬ್ಬರು ಯಾರು?", "a": "ಫಿಲಿಪ್ಪ ಮತ್ತು ಅಂದ್ರೆಯ", "r": "12:22"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಫಿಲಿಪ್ಪನು ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದನು.”", "a": "ಅಂದ್ರೆಯನಿಗೆ", "r": "12:22"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಿಬ್ಬರೂ ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ವಿಷಯವನ್ನು ತಿಳಿಸಿದರು.”", "a": "ಯೇಸುವಿಗೆ", "r": "12:22"}, {"n": 117, "q": "ಯೊವಾನ್ನ 12:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಫಿಲಿಪ್ಪನು ಬಂದು ಅಂದ್ರೆಯನಿಗೆ ಹೇಳಿದನು. ಅವರಿಬ್ಬರೂ ಹೋಗಿ ಯೇಸುವಿಗೆ ಈ ವಿಷಯವನ್ನು ತಿಳಿಸಿದರು.", "r": "12:22"}, {"n": 118, "q": "ಗ್ರೀಕರ ಕೋರಿಕೆಯನ್ನು ಕೇಳಿದ ಯೇಸು ಏನೆಂದರು?", "a": "“ನರಪುತ್ರನು ಮಹಿಮೆಯನ್ನು ಹೊಂದುವ ಗಳಿಗೆ ಬಂದಿದೆ.”", "r": "12:23"}, {"n": 119, "q": "ಯೇಸುವಿನ ‘ಗಳಿಗೆ’ ಇನ್ನೂ ಬಂದಿಲ್ಲ ಎಂದಿದ್ದದ್ದು ಹನ್ನೆರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೇಗೆ ಬದಲಾಗುತ್ತದೆ?", "a": "“ನರಪುತ್ರನು ಮಹಿಮೆಯನ್ನು ಹೊಂದುವ ಗಳಿಗೆ ಬಂದಿದೆ” (12:23)", "r": "2:4; 7:30; 12:23"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನರಪುತ್ರನು ಮಹಿಮೆಯನ್ನು ಹೊಂದುವ ಗಳಿಗೆ ಬಂದಿದೆ.”", "a": "ಯೇಸು", "r": "12:23"}, {"n": 121, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ನರಪುತ್ರನು ಮಹಿಮೆಯನ್ನು ಹೊಂದುವ ಗಳಿಗೆ ಬಂದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "12:23"}, {"n": 122, "q": "ಯೊವಾನ್ನ 12:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ನರಪುತ್ರನು ಮಹಿಮೆಯನ್ನು ಹೊಂದುವ ಗಳಿಗೆ ಬಂದಿದೆ.", "r": "12:23"}, {"n": 123, "q": "ಗೋದಿಯ ಕಾಳು ಭೂಮಿಯಲ್ಲಿ ಬಿದ್ದು ಸಾಯದಿದ್ದರೆ ಏನಾಗುತ್ತದೆ?", "a": "ಒಂಟಿಯಾಗಿ ಉಳಿಯುತ್ತದೆ", "r": "12:24"}, {"n": 124, "q": "ಗೋದಿಯ ಕಾಳು ಸತ್ತರೆ ಏನಾಗುತ್ತದೆ?", "a": "ಸಮೃದ್ಧಿಯಾದ ಫಲವನ್ನು ಕೊಡುತ್ತದೆ", "r": "12:24"}, {"n": 125, "q": "ಯೇಸು ತಮ್ಮ ಮರಣವನ್ನು ಯಾವುದರ ಉದಾಹರಣೆಯಿಂದ ವಿವರಿಸಿದರು?", "a": "ಭೂಮಿಯಲ್ಲಿ ಬಿದ್ದು ಸಾಯುವ ಗೋದಿಯ ಕಾಳಿನ ಉದಾಹರಣೆಯಿಂದ", "r": "12:24"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "12:24"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗೋದಿಯ ಕಾಳು ಭೂಮಿಯಲ್ಲಿ ಬಿದ್ದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದು ಒಂಟಿಯಾಗಿ ಉಳಿಯುತ್ತದೆ;”", "a": "ಸಾಯದಿದ್ದರೆ", "r": "12:24"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದು ಸತ್ತರೆ ಮಾತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲವನ್ನು ಕೊಡುತ್ತದೆ.”", "a": "ಸಮೃದ್ಧಿಯಾದ", "r": "12:24"}, {"n": 129, "q": "ತನ್ನ ಪ್ರಾಣವನ್ನು ಪ್ರೀತಿಸುವವನು ಮತ್ತು ದ್ವೇಷಿಸುವವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಪ್ರೀತಿಸುವವನು ಅದನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತಾನೆ; ಈ ಲೋಕದಲ್ಲಿ ದ್ವೇಷಿಸುವವನು ಅದನ್ನು ನಿತ್ಯ ಜೀವಕ್ಕಾಗಿ ಕಾಯ್ದಿರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "12:25"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ಪ್ರಾಣವನ್ನು ಪ್ರೀತಿಸುವವನು ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳೆದುಕೊಳ್ಳುತ್ತಾನೆ", "r": "12:25"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ಪ್ರಾಣವನ್ನು ಈ ಲೋಕದಲ್ಲಿ ದ್ವೇಷಿಸುವವನು ಅದನ್ನು ನಿತ್ಯ ಜೀವಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಯ್ದಿರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "12:25"}, {"n": 132, "q": "“ತನ್ನ ಪ್ರಾಣವನ್ನು ಪ್ರೀತಿಸುವವನು ಅದನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "12:25"}, {"n": 133, "q": "ಯೇಸುವಿನ ಸೇವೆ ಮಾಡಬೇಕೆಂದಿರುವವನು ಏನು ಮಾಡಬೇಕು?", "a": "ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಬೇಕು", "r": "12:26"}, {"n": 134, "q": "ಯೇಸುವಿನ ಸೇವೆ ಮಾಡುವವನಿಗೆ ಯಾರಿಂದ ಏನು ದೊರಕುತ್ತದೆ?", "a": "ಯೇಸುವಿನ ಪಿತನಿಂದ ಸನ್ಮಾನ", "r": "12:26"}, {"n": 135, "q": "ಯೇಸುವಿನ ಸೇವಕನು ಎಲ್ಲಿರುತ್ತಾನೆ?", "a": "ಯೇಸು ಇರುವಲ್ಲಿಯೇ", "r": "12:26"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಸೇವೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸಲಿ.”", "a": "ಮಾಡಬೇಕೆಂದಿರುವವನು", "r": "12:26"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಸೇವಕನೂ ಇರುತ್ತಾನೆ.”", "a": "ನಾನಿರುವಲ್ಲಿಯೇ", "r": "12:26"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಸೇವೆ ಮಾಡುವವನು ನನ್ನ ಪಿತನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಸನ್ಮಾನಹೊಂದುತ್ತಾನೆ", "r": "12:26"}, {"n": 139, "q": "ಯೇಸು ತಮ್ಮ ಆತ್ಮದ ಸ್ಥಿತಿಯನ್ನು ಹೇಗೆ ವರ್ಣಿಸಿದರು?", "a": "“ಈಗ ನನ್ನಾತ್ಮ ತತ್ತರಿಸುತ್ತಿದೆ.”", "r": "12:27"}, {"n": 140, "q": "ಯೇಸು ಈ ಗಳಿಗೆಗೆ ಏಕೆ ಕಾಲಿಟ್ಟಿದ್ದಾರೆ?", "a": "ಇದನ್ನು ಅನುಭವಿಸಲೆಂದೇ", "r": "12:27"}, {"n": 141, "q": "ಯೇಸು ತಾವು ಪ್ರಾರ್ಥಿಸಲೇ ಎಂದು ಕೇಳಿಕೊಂಡ ಮಾತು ಯಾವುದು?", "a": "‘ಪಿತನೇ, ಈ ಗಳಿಗೆಯಿಂದ ನನ್ನನ್ನು ಕಾಪಾಡು ಎನ್ನಲೇ?’", "r": "12:27"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಮಾತನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ಈಗ ನನ್ನಾತ್ಮ ತತ್ತರಿಸುತ್ತಿದೆ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:27"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನೇ, ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನನ್ನು ಕಾಪಾಡು ಎನ್ನಲೇ?”", "a": "ಗಳಿಗೆಯಿಂದ", "r": "12:27"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲ, ಅದಕ್ಕೆ ಬದಲಾಗಿ ಇದನ್ನು ಅನುಭವಿಸಲೆಂದೇ ನಾನು ಈ ಗಳಿಗೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಲಿಟ್ಟಿದ್ದೇನೆ", "r": "12:27"}, {"n": 145, "q": "ಯೇಸು ಪಿತನಿಗೆ ಮಾಡಿದ ಪ್ರಾರ್ಥನೆ ಯಾವುದು (12:28)?", "a": "‘ಪಿತನೇ, ನಿಮ್ಮ ನಾಮಮಹಿಮೆಯನ್ನು ಬೆಳಗಿಸಿ’", "r": "12:28"}, {"n": 146, "q": "ಯೇಸುವಿನ ಪ್ರಾರ್ಥನೆಗೆ ಉತ್ತರವಾಗಿ ಕೇಳಿಸಿದ ಸ್ವರ್ಗೀಯ ವಾಣಿ ಏನು?", "a": "“ಹೌದು, ಆ ಮಹಿಮೆಯನ್ನು ಬೆಳಗಿಸಿದ್ದೇನೆ, ಪುನಃ ಬೆಳಗಿಸುತ್ತೇನೆ”", "r": "12:28"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನೇ, ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಗಿಸಿ ಎಂದು ನುಡಿದರು.”", "a": "ನಾಮಮಹಿಮೆಯನ್ನು", "r": "12:28"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಹೌದು, ಆ ಮಹಿಮೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪುನಃ ಬೆಳಗಿಸುತ್ತೇನೆ, ಎಂಬ ಸ್ವರ್ಗೀಯ ವಾಣಿ ಕೇಳಿಸಿತು.”", "a": "ಬೆಳಗಿಸಿದ್ದೇನೆ", "r": "12:28"}, {"n": 149, "q": "“ಪಿತನೇ, ನಿಮ್ಮ ನಾಮಮಹಿಮೆಯನ್ನು ಬೆಳಗಿಸಿ  ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "12:28"}, {"n": 150, "q": "ಸ್ವರ್ಗೀಯ ವಾಣಿಯನ್ನು ಕೇಳಿದ ಜನರು ಏನೆಂದು ಭಾವಿಸಿದರು?", "a": "ಕೆಲವರು — ಗುಡುಗಿನ ಸದ್ದು; ಕೆಲವರು — ದೇವದೂತನೊಬ್ಬ ಆತನೊಡನೆ ಮಾತನಾಡಿದನು", "r": "12:29"}, {"n": 151, "q": "ಸ್ವರ್ಗೀಯ ವಾಣಿಯನ್ನು ಕೇಳಿ “ಇದೇನು ಗುಡುಗಿನ ಸದ್ದು?” ಎಂದವರು ಯಾರು?", "a": "ಅಲ್ಲಿ ನಿಂತುಕೊಂಡಿದ್ದ ಜನರು", "r": "12:29"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜನರು ಆ ವಾಣಿಯನ್ನು ಕೇಳಿ, ಇದೇನು ಗುಡುಗಿನ ಸದ್ದು?”", "a": "ನಿಂತುಕೊಂಡಿದ್ದ", "r": "12:29"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೆಲವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನೊಡನೆ ಮಾತನಾಡಿದನು, ಎಂದರು.”", "a": "ದೇವದೂತನೊಬ್ಬ", "r": "12:29"}, {"n": 154, "q": "“ಅಲ್ಲಿ ನಿಂತುಕೊಂಡಿದ್ದ ಜನರು ಆ ವಾಣಿಯನ್ನು ಕೇಳಿ, ಇದೇನು ಗುಡುಗಿನ ಸದ್ದು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "12:29"}, {"n": 155, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸ್ವರ್ಗೀಯ ವಾಣಿ ಯಾರಿಗಾಗಿ?", "a": "ಜನರಿಗಾಗಿ, ಯೇಸುವಿಗಾಗಿ ಅಲ್ಲ", "r": "12:30"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈ ವಾಣಿಯಾದುದು ನಿಮಗಾಗಿ, ನನಗಾಗಿ ಅಲ್ಲ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:30"}, {"n": 157, "q": "“ಯೇಸುಸ್ವಾಮಿ, ಈ ವಾಣಿಯಾದುದು ನಿಮಗಾಗಿ, ನನಗಾಗಿ ಅಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "12:30"}, {"n": 158, "q": "ಯೊವಾನ್ನ 12:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ, “ಈ ವಾಣಿಯಾದುದು ನಿಮಗಾಗಿ, ನನಗಾಗಿ ಅಲ್ಲ.", "r": "12:30"}, {"n": 159, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಈಗ ಲೋಕಾಧಿಪತಿಗೆ ಏನಾಗುವುದು?", "a": "ಹೊರದೂಡಲಾಗುವುದು", "r": "12:31"}, {"n": 160, "q": "ಈಗ ಈ ಲೋಕವು ಯಾವುದಕ್ಕೆ ಒಳಗಾಗುವುದು?", "a": "ನ್ಯಾಯತೀರ್ಪಿಗೆ", "r": "12:31"}, {"n": 161, "q": "ಇದೀಗಲೇ ಯಾರನ್ನು ಹೊರದೂಡಲಾಗುವುದು?", "a": "ಈ ಲೋಕಾಧಿಪತಿಯನ್ನು", "r": "12:31"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ಈ ಲೋಕವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳಗಾಗುವುದು.”", "a": "ನ್ಯಾಯತೀರ್ಪಿಗೆ", "r": "12:31"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದೀಗಲೇ ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರದೂಡಲಾಗುವುದು.”", "a": "ಲೋಕಾಧಿಪತಿಯನ್ನು", "r": "12:31"}, {"n": 164, "q": "“ಈಗ ಈ ಲೋಕವು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಒಳಗಾಗುವುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "12:31"}, {"n": 165, "q": "ಭೂಮಿಯಿಂದ ಮೇಲೇರಿಸಿದಾಗ ಯೇಸು ಏನು ಮಾಡುವರು?", "a": "ಎಲ್ಲರನ್ನೂ ತಮ್ಮೆಡೆಗೆ ಸೆಳೆದುಕೊಳ್ಳುವರು", "r": "12:32"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನ್ನನ್ನು ಭೂಮಿಯಿಂದ ಮೇಲೇರಿಸಿದಾಗ, ನಾನು ಎಲ್ಲರನ್ನೂ ನನ್ನೆಡೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಸೆಳೆದುಕೊಳ್ಳುತ್ತೇನೆ", "r": "12:32"}, {"n": 167, "q": "“ಆದರೆ ನನ್ನನ್ನು ಭೂಮಿಯಿಂದ ಮೇಲೇರಿಸಿದಾಗ, ನಾನು ಎಲ್ಲರನ್ನೂ ನನ್ನೆಡೆಗೆ ಸೆಳೆದುಕೊಳ್ಳುತ್ತೇನೆ, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "12:32"}, {"n": 168, "q": "ಯೊವಾನ್ನ 12:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ನನ್ನನ್ನು ಭೂಮಿಯಿಂದ ಮೇಲೇರಿಸಿದಾಗ, ನಾನು ಎಲ್ಲರನ್ನೂ ನನ್ನೆಡೆಗೆ ಸೆಳೆದುಕೊಳ್ಳುತ್ತೇನೆ,” ಎಂದು ನುಡಿದರು.", "r": "12:32"}, {"n": 169, "q": "“ನನ್ನನ್ನು ಭೂಮಿಯಿಂದ ಮೇಲೇರಿಸಿದಾಗ” ಎಂಬ ಮಾತಿನಿಂದ ಯೇಸು ಏನನ್ನು ಸೂಚಿಸಿದರು?", "a": "ತಮಗೆಂಥ ಮರಣ ಕಾದಿದೆಯೆಂದು", "r": "12:33"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಾತಿನಿಂದ ತಮಗೆಂಥ ಮರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೂಚಿಸಿದರು.”", "a": "ಕಾದಿದೆಯೆಂದು", "r": "12:33"}, {"n": 171, "q": "“ಈ ಮಾತಿನಿಂದ ತಮಗೆಂಥ ಮರಣ ಕಾದಿದೆಯೆಂದು ಸೂಚಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "12:33"}, {"n": 172, "q": "ಯೊವಾನ್ನ 12:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಮಾತಿನಿಂದ ತಮಗೆಂಥ ಮರಣ ಕಾದಿದೆಯೆಂದು ಸೂಚಿಸಿದರು.", "r": "12:33"}, {"n": 173, "q": "ಜನರ ಪ್ರಕಾರ ಧರ್ಮಶಾಸ್ತ್ರವು ಲೋಕೋದ್ಧಾರಕನ ಬಗ್ಗೆ ಏನು ತಿಳಿಸುತ್ತದೆ?", "a": "ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಸದಾಕಾಲ ಇರುವನೆಂದು", "r": "12:34"}, {"n": 174, "q": "ನೆರೆದಿದ್ದ ಜನರು ನರಪುತ್ರನ ಬಗ್ಗೆ ಕೇಳಿದ ಕೊನೆಯ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಆ ನರಪುತ್ರನು ಯಾರು?”", "r": "12:34"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೆರೆದಿದ್ದ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಸದಾಕಾಲ ಇರುವನೆಂದು ಧರ್ಮಶಾಸ್ತ್ರವೇ ತಿಳಿಸುತ್ತದೆ.”", "a": "ಪ್ರತ್ಯುತ್ತರವಾಗಿ", "r": "12:34"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ, ನರಪುತ್ರನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನೀನು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅದು ಹೇಗೆ?”", "a": "ಮೇಲೇರಿಸಬೇಕಾಗಿದೆ", "r": "12:34"}, {"n": 177, "q": "“ನೆರೆದಿದ್ದ ಜನರು ಪ್ರತ್ಯುತ್ತರವಾಗಿ, ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಸದಾಕಾಲ ಇರುವನೆಂದು ಧರ್ಮಶಾಸ್ತ್ರವೇ ತಿಳಿಸುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "12:34"}, {"n": 178, "q": "ಇನ್ನು ಎಷ್ಟು ಕಾಲ ಜ್ಯೋತಿ ಜನರ ನಡುವೆ ಇರುತ್ತದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಇನ್ನು ತುಸು ಕಾಲ ಮಾತ್ರ", "r": "12:35"}, {"n": 179, "q": "ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವವನಿಗೆ ಏನು ಕಾಣದು?", "a": "ಗೊತ್ತುಗುರಿ", "r": "12:35"}, {"n": 180, "q": "ಜ್ಯೋತಿಯ ಬಗ್ಗೆ ಯೇಸು ಜನರಿಗೆ ಕೊಟ್ಟ ಸಲಹೆ ಏನು?", "a": "“ನಿಮ್ಮನ್ನು ಕತ್ತಲು ಕವಿಯದಂತೆ ಜ್ಯೋತಿಯಿರುವಾಗಲೇ ನಡೆಯಿರಿ.”", "r": "12:35"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇನ್ನು ತುಸು ಕಾಲ ಮಾತ್ರ ಜ್ಯೋತಿ ನಿಮ್ಮ ನಡುವೆ ಇರುತ್ತದೆ.”", "a": "ಯೇಸು", "r": "12:35"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮನ್ನು ಕತ್ತಲು ಕವಿಯದಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಯಿರಿ.”", "a": "ಜ್ಯೋತಿಯಿರುವಾಗಲೇ", "r": "12:35"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕತ್ತಲಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೊತ್ತುಗುರಿ ಕಾಣದು.”", "a": "ನಡೆಯುವವನಿಗೆ", "r": "12:35"}, {"n": 184, "q": "ಜ್ಯೋತಿಯಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟರೆ ಜನರು ಏನಾಗುವರು?", "a": "ಜ್ಯೋತಿಯ ಮಕ್ಕಳು ಆಗುವರು", "r": "12:36"}, {"n": 185, "q": "ಮಾತನಾಡಿದ ತರುವಾಯ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಅಲ್ಲಿಂದ ಹೊರಟು ಜನರ ಕಣ್ಣಿಗೆ ಬೀಳದಂತೆ ಮರೆಯಾದರು", "r": "12:36"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮೊಡನೆ ಇನ್ನೂ ಜ್ಯೋತಿ ಇರುವುದರಿಂದ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆಯಿಡಿ.”", "a": "ಜ್ಯೋತಿಯಲ್ಲಿ", "r": "12:36"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳು ಆಗುವಿರಿ, ಎಂದರು.”", "a": "ಜ್ಯೋತಿಯ", "r": "12:36"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ತರುವಾಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಂದ ಹೊರಟು ಜನರ ಕಣ್ಣಿಗೆ ಬೀಳದಂತೆ ಮರೆಯಾದರು.”", "a": "ಯೇಸು", "r": "12:36"}, {"n": 189, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 12:37ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವಿಹೀನ ಜನರು", "r": "12:37"}, {"n": 190, "q": "ಯೇಸು ಬಹುತೇಕ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದರೂ ಜನರು ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಅವರನ್ನು ವಿಶ್ವಾಸಿಸಲಿಲ್ಲ", "r": "12:37"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಹುತೇಕ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಜನರ ಕಣ್ಮುಂದೆ ಮಾಡಿದರೂ ಆ ಜನರು ಅವರನ್ನು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:37"}, {"n": 192, "q": "“ಯೇಸುಸ್ವಾಮಿ ಬಹುತೇಕ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಜನರ ಕಣ್ಮುಂದೆ ಮಾಡಿದರೂ ಆ ಜನರು ಅವರನ್ನು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "12:37"}, {"n": 193, "q": "ಯೊವಾನ್ನ 12:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಬಹುತೇಕ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಜನರ ಕಣ್ಮುಂದೆ ಮಾಡಿದರೂ ಆ ಜನರು ಅವರನ್ನು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರು.", "r": "12:37"}, {"n": 194, "q": "ಜನರ ಅವಿಶ್ವಾಸದಿಂದ ಯಾವ ಪ್ರವಾದಿಯ ಮಾತು ನೆರವೇರಿತು?", "a": "ಯೆಶಾಯ ಪ್ರವಾದಿಯ", "r": "12:38"}, {"n": 195, "q": "ಜನರ ಅವಿಶ್ವಾಸದಿಂದ ನೆರವೇರಿದ ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತು ಯಾವುದು?", "a": "“ಸರ್ವೇಶ್ವರಾ, ನಮ್ಮ ಸಂದೇಶವನ್ನು ನಂಬಿದವರಾರು? ದೇವರ ಶಕ್ತಿಸಾಮರ್ಥ್ಯ ಗೋಚರವಾದುದು ಯಾರಿಗೆ?”", "r": "12:38"}, {"n": 196, "q": "ಹನ್ನೆರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಎಷ್ಟು ಉಲ್ಲೇಖಗಳಿವೆ?", "a": "ಎರಡು (12:38; 12:40)", "r": "12:38; 12:40"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರವಾದಿಯ ಈ ಮಾತು ನೆರವೇರಿತು:”", "a": "ಯೆಶಾಯ", "r": "12:38"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮ್ಮ ಸಂದೇಶವನ್ನು ನಂಬಿದವರಾರು?”", "a": "ಸರ್ವೇಶ್ವರಾ", "r": "12:38"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೋಚರವಾದುದು ಯಾರಿಗೆ?”", "a": "ಶಕ್ತಿಸಾಮರ್ಥ್ಯ", "r": "12:38"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು ವಿಶ್ವಾಸಿಸದೆ ಹೋದುದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೊಂದು ವಚನದಲ್ಲಿ ಕಾರಣವನ್ನು ಸೂಚಿಸಿದ್ದಾನೆ:”", "a": "ಯೆಶಾಯನು", "r": "12:39"}, {"n": 201, "q": "“ಜನರು ವಿಶ್ವಾಸಿಸದೆ ಹೋದುದಕ್ಕೆ ಯೆಶಾಯನು ಮತ್ತೊಂದು ವಚನದಲ್ಲಿ ಕಾರಣವನ್ನು ಸೂಚಿಸಿದ್ದಾನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "12:39"}, {"n": 202, "q": "ಯೊವಾನ್ನ 12:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜನರು ವಿಶ್ವಾಸಿಸದೆ ಹೋದುದಕ್ಕೆ ಯೆಶಾಯನು ಮತ್ತೊಂದು ವಚನದಲ್ಲಿ ಕಾರಣವನ್ನು ಸೂಚಿಸಿದ್ದಾನೆ:", "r": "12:39"}, {"n": 203, "q": "ಯೆಶಾಯನ ಪ್ರಕಾರ ದೇವರು ಜನರ ಕಣ್ಣುಗಳನ್ನು ಮತ್ತು ಮನಸ್ಸನ್ನು ಏನು ಮಾಡಿರುವರು?", "a": "ಕಣ್ಣುಗಳನ್ನು ಕುರುಡಾಗಿಸಿರುವರು; ಮನಸ್ಸನ್ನು ಕಲ್ಲಾಗಿಸಿರುವರು", "r": "12:40"}, {"n": 204, "q": "ಯೆಶಾಯನ ಪ್ರಕಾರ ಜನರು ಯಾವ ಮೂರು ಸಂಗತಿಗಳು ಆಗದಂತೆ ಕುರುಡರಾಗಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಕಣ್ಣುಗಳಿಂದ ಕಾಣದಂತೆ; ತಮ್ಮ ಮನದಿಂದ ಗ್ರಹಿಸದಂತೆ; ಮನತಿರುಗಿ ಗುಣಹೊಂದದಂತೆ", "r": "12:40"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮ ಕಣ್ಣುಗಳಿಂದ ಅವರು ಕಾಣದಂತೆಯೂ ತಮ್ಮ ಮನದಿಂದ ಗ್ರಹಿಸದಂತೆಯೂ ಹಾಗೂ ಮನತಿರುಗಿ ನನ್ನಿಂದ ಗುಣಹೊಂದದಂತೆಯೂ ಅವರ ಕಣ್ಣುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕುರುಡಾಗಿಸಿರುವರು", "r": "12:40"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಮನಸ್ಸನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು.”", "a": "ಕಲ್ಲಾಗಿಸಿರುವರು", "r": "12:40"}, {"n": 207, "q": "“ತಮ್ಮ ಕಣ್ಣುಗಳಿಂದ ಅವರು ಕಾಣದಂತೆಯೂ ತಮ್ಮ ಮನದಿಂದ ಗ್ರಹಿಸದಂತೆಯೂ ಹಾಗೂ ಮನತಿರುಗಿ ನನ್ನಿಂದ ಗುಣಹೊಂದದಂತೆಯೂ ಅವರ ಕಣ್ಣುಗಳನ್ನು ಕುರುಡಾಗಿಸಿರುವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "12:40"}, {"n": 208, "q": "ಯೆಶಾಯನು ಆ ಮಾತುಗಳನ್ನು ಯಾವಾಗ ಹೇಳಿದನು?", "a": "ಯೇಸುವಿನ ಮಹಿಮೆಯನ್ನು ಮನಗಂಡು, ಅವರನ್ನು ಕುರಿತು ಮಾತನಾಡುವಾಗ", "r": "12:41"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಿಮೆಯನ್ನು ಮನಗಂಡು, ಅವರನ್ನು ಕುರಿತು ಮಾತನಾಡುವಾಗ ಯೆಶಾಯನು ಹೇಳಿದ ಮಾತುಗಳಿವು.”", "a": "ಯೇಸುವಿನ", "r": "12:41"}, {"n": 210, "q": "“ಯೇಸುವಿನ ಮಹಿಮೆಯನ್ನು ಮನಗಂಡು, ಅವರನ್ನು ಕುರಿತು ಮಾತನಾಡುವಾಗ ಯೆಶಾಯನು ಹೇಳಿದ ಮಾತುಗಳಿವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "12:41"}, {"n": 211, "q": "ಯೊವಾನ್ನ 12:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುವಿನ ಮಹಿಮೆಯನ್ನು ಮನಗಂಡು, ಅವರನ್ನು ಕುರಿತು ಮಾತನಾಡುವಾಗ ಯೆಶಾಯನು ಹೇಳಿದ ಮಾತುಗಳಿವು.", "r": "12:41"}, {"n": 212, "q": "ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸಮೂಡಿದರೂ ಅದನ್ನು ಬಯಲು ಮಾಡದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿ ಹಲವು ಮಂದಿ ಮುಖಂಡರು", "r": "12:42"}, {"n": 213, "q": "ಮುಖಂಡರು ತಮ್ಮ ವಿಶ್ವಾಸವನ್ನು ಏಕೆ ಬಯಲು ಮಾಡಲಿಲ್ಲ?", "a": "ಫರಿಸಾಯರು ಪ್ರಾರ್ಥನಾಮಂದಿರಗಳಿಂದ ತಮಗೆ ಬಹಿಷ್ಕಾರ ಹಾಕಿಯಾರೆಂಬ ಅಂಜಿಕೆಯ ಕಾರಣ", "r": "12:42"}, {"n": 214, "q": "ಫರಿಸಾಯರು ಮುಖಂಡರನ್ನು ಎಲ್ಲಿಂದ ಬಹಿಷ್ಕರಿಸಬಹುದಿತ್ತು?", "a": "ಪ್ರಾರ್ಥನಾಮಂದಿರಗಳಿಂದ", "r": "12:42"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರಲ್ಲಿ ಹಲವು ಮಂದಿ ಮುಖಂಡರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸಮೂಡಿತು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "12:42"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾರ್ಥನಾಮಂದಿರಗಳಿಂದ ತಮಗೆ ಬಹಿಷ್ಕಾರ ಹಾಕಿಯಾರೆಂಬ ಅಂಜಿಕೆಯ ಕಾರಣ ಅವರು ತಮ್ಮ ವಿಶ್ವಾಸವನ್ನು ಬಯಲು ಮಾಡಲಿಲ್ಲ.”", "a": "ಫರಿಸಾಯರು", "r": "12:42"}, {"n": 217, "q": "“ಯೆಹೂದ್ಯರಲ್ಲಿ ಹಲವು ಮಂದಿ ಮುಖಂಡರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸಮೂಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "12:42"}, {"n": 218, "q": "ಮುಖಂಡರಿಗೆ ಯಾವ ಮನ್ನಣೆ ಯಾವುದಕ್ಕಿಂತ ಪ್ರಿಯವಾಗಿತ್ತು?", "a": "ಮಾನವರಿಂದ ಸಿಗುವ ಮನ್ನಣೆ, ದೇವರಿಂದ ದೊರಕುವ ಮನ್ನಣೆಗಿಂತ", "r": "12:43"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರಿಂದ ದೊರಕುವ ಮನ್ನಣೆಗಿಂತ ಮಾನವರಿಂದ ಸಿಗುವ ಮನ್ನಣೆಯೇ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಿಯವಾಗಿತ್ತು", "r": "12:43"}, {"n": 220, "q": "“ದೇವರಿಂದ ದೊರಕುವ ಮನ್ನಣೆಗಿಂತ ಮಾನವರಿಂದ ಸಿಗುವ ಮನ್ನಣೆಯೇ ಅವರಿಗೆ ಪ್ರಿಯವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "12:43"}, {"n": 221, "q": "ಯೊವಾನ್ನ 12:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರಿಂದ ದೊರಕುವ ಮನ್ನಣೆಗಿಂತ ಮಾನವರಿಂದ ಸಿಗುವ ಮನ್ನಣೆಯೇ ಅವರಿಗೆ ಪ್ರಿಯವಾಗಿತ್ತು.", "r": "12:43"}, {"n": 222, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 12:44ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವಿನ ಮಾತು ಅಂತಿಮ ತೀರ್ಪು", "r": "12:44"}, {"n": 223, "q": "ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ವಾಸ್ತವವಾಗಿ ಯಾರಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುತ್ತಾನೆ?", "a": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನಲ್ಲೇ", "r": "12:44"}, {"n": 224, "q": "ಯೇಸು 12:44ರ ಮಾತುಗಳನ್ನು ಹೇಗೆ ಹೇಳಿದರು?", "a": "ಗಟ್ಟಿಯಾಗಿ ಕೂಗಿ", "r": "12:44"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಟ್ಟಿಯಾಗಿ ಕೂಗಿ ಇಂತೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "12:44"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ನನ್ನಲ್ಲಿ ಅಲ್ಲ, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಶ್ವಾಸವಿಡುತ್ತಾನೆ", "r": "12:44"}, {"n": 227, "q": "ಯೊವಾನ್ನ 12:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಗಟ್ಟಿಯಾಗಿ ಕೂಗಿ ಇಂತೆಂದರು: “ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ನನ್ನಲ್ಲಿ ಅಲ್ಲ, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನಲ್ಲೇ ವಿಶ್ವಾಸವಿಡುತ್ತಾನೆ.", "r": "12:44"}, {"n": 228, "q": "ಯೇಸುವನ್ನು ಕಾಣುವವನು ಯಾರನ್ನು ಕಾಣುತ್ತಾನೆ?", "a": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನೇ", "r": "12:45"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಕಾಣುವವನು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣುತ್ತಾನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನನ್ನೇ", "r": "12:45"}, {"n": 230, "q": "“ನನ್ನನ್ನು ಕಾಣುವವನು ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನೇ ಕಾಣುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "12:45"}, {"n": 231, "q": "ಯೊವಾನ್ನ 12:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನನ್ನು ಕಾಣುವವನು ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನೇ ಕಾಣುತ್ತಾನೆ.", "r": "12:45"}, {"n": 232, "q": "ಯೇಸು ಜಗಜ್ಯೋತಿಯಾಗಿ ಏಕೆ ಬಂದಿದ್ದಾರೆ?", "a": "ತಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ಅಂಧಕಾರದಲ್ಲಿ ಉಳಿಯಬಾರದೆಂದು", "r": "12:46"}, {"n": 233, "q": "“ಜಗಜ್ಯೋತಿ” ಎಂಬ ಪದವನ್ನು ಯೇಸು ತಮಗೆ ಉಪಯೋಗಿಸಿದ 8 ಮತ್ತು 12ನೇ ಅಧ್ಯಾಯಗಳ ವಚನಗಳು ಯಾವುವು?", "a": "8:12 ಮತ್ತು 12:46", "r": "8:12; 12:46"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂಧಕಾರದಲ್ಲಿ ಉಳಿಯಬಾರದೆಂದು ನಾನೇ ಜಗಜ್ಯೋತಿಯಾಗಿ ಬಂದಿದ್ದೇನೆ.”", "a": "ವಿಶ್ವಾಸವಿಡುವವನು", "r": "12:46"}, {"n": 235, "q": "“ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ಅಂಧಕಾರದಲ್ಲಿ ಉಳಿಯಬಾರದೆಂದು ನಾನೇ ಜಗಜ್ಯೋತಿಯಾಗಿ ಬಂದಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "12:46"}, {"n": 236, "q": "ಯೊವಾನ್ನ 12:46 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು ಅಂಧಕಾರದಲ್ಲಿ ಉಳಿಯಬಾರದೆಂದು ನಾನೇ ಜಗಜ್ಯೋತಿಯಾಗಿ ಬಂದಿದ್ದೇನೆ.", "r": "12:46"}, {"n": 237, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ಬಂದುದು ಯಾವುದಕ್ಕಾಗಿ?", "a": "ಲೋಕದ ಉದ್ಧಾರಕ್ಕಾಗಿ, ತೀರ್ಪು ಕೊಡುವುದಕ್ಕಾಗಿ ಅಲ್ಲ", "r": "12:47"}, {"n": 238, "q": "ಯೇಸುವಿನ ಮಾತನ್ನು ಕೇಳಿಯೂ ನಡೆಯದವನಿಗೆ ತೀರ್ಪುಕೊಡುವವನು ಯಾರು ಅಲ್ಲ?", "a": "ಯೇಸು ಅಲ್ಲ", "r": "12:47"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾವನಾದರೂ ನನ್ನ ಮಾತನ್ನು ಕೇಳಿಯೂ ಅದರಂತೆ ನಡೆಯದೆ ಹೋದರೆ ಅಂಥವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನಲ್ಲ.”", "a": "ತೀರ್ಪುಕೊಡುವವನು", "r": "12:47"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಬಂದುದು ಲೋಕದ ಉದ್ಧಾರಕ್ಕಾಗಿ, ತೀರ್ಪು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ.”", "a": "ಕೊಡುವುದಕ್ಕಾಗಿ", "r": "12:47"}, {"n": 241, "q": "“ಯಾವನಾದರೂ ನನ್ನ ಮಾತನ್ನು ಕೇಳಿಯೂ ಅದರಂತೆ ನಡೆಯದೆ ಹೋದರೆ ಅಂಥವನಿಗೆ ತೀರ್ಪುಕೊಡುವವನು ನಾನಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "12:47"}, {"n": 242, "q": "ಯೇಸುವನ್ನು ನಿರಾಕರಿಸುವವನಿಗೆ ತೀರ್ಪುಕೊಡುವಂಥದ್ದು ಯಾವುದು?", "a": "ಯೇಸು ಆಡಿದ ಮಾತೇ", "r": "12:48–49"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ನಿರಾಕರಿಸಿ ನನ್ನ ಮಾತುಗಳನ್ನು ಅಂಗೀಕರಿಸದೆ ಹೋದವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದು ಇದೆ.”", "a": "ತೀರ್ಪುಕೊಡುವಂಥದ್ದು", "r": "12:48"}, {"n": 244, "q": "“ನನ್ನನ್ನು ನಿರಾಕರಿಸಿ ನನ್ನ ಮಾತುಗಳನ್ನು ಅಂಗೀಕರಿಸದೆ ಹೋದವನಿಗೆ ತೀರ್ಪುಕೊಡುವಂಥದ್ದು ಒಂದು ಇದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "12:48"}, {"n": 245, "q": "ಯೊವಾನ್ನ 12:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನನ್ನು ನಿರಾಕರಿಸಿ ನನ್ನ ಮಾತುಗಳನ್ನು ಅಂಗೀಕರಿಸದೆ ಹೋದವನಿಗೆ ತೀರ್ಪುಕೊಡುವಂಥದ್ದು ಒಂದು ಇದೆ.", "r": "12:48"}, {"n": 246, "q": "ಯೇಸು ಆಡಿದ ಮಾತು ಯಾವಾಗ ತೀರ್ಪುಕೊಡುವುದು?", "a": "ಅಂತಿಮ ದಿನದಂದು", "r": "12:49"}, {"n": 247, "q": "ಯೇಸು ಏನು ಹೇಳಬೇಕು, ಯಾವ ಮಾತನ್ನು ಆಡಬೇಕು ಎಂದು ಆಜ್ಞೆ ಮಾಡಿದವರು ಯಾರು?", "a": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದ ಪಿತನೇ", "r": "12:49"}, {"n": 248, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ತಮ್ಮಷ್ಟಕ್ಕೆ ತಾವೇ ಏನು ಮಾಡುತ್ತಿಲ್ಲ?", "a": "ಮಾತನಾಡುತ್ತಿಲ್ಲ", "r": "12:49"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಆಡಿದ ಮಾತೇ.”", "a": "ಯಾವುದೆಂದರೆ", "r": "12:49"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತಿಮ ದಿನದಂದು ಅದೇ ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೀರ್ಪುಕೊಡುವುದು", "r": "12:49"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನನ್ನಷ್ಟಕ್ಕೆ ನಾನೇ ಇದನ್ನೆಲ್ಲಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತಿಲ್ಲ", "r": "12:49"}, {"n": 252, "q": "ಪಿತನ ಆಜ್ಞೆ ಏನೆಂದು ಯೇಸು ಬಲ್ಲರು?", "a": "ನಿತ್ಯಜೀವದಾಯಕ", "r": "12:50"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಹನ್ನೆರಡನೆಯ ಅಧ್ಯಾಯ ಯೇಸುವಿನ ಯಾವ ಮಾತಿನಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "“ಆದ್ದರಿಂದಲೇ ಪಿತನು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾತನಾಡುತ್ತೇನೆ.”", "r": "12:50"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಆಜ್ಞೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ನಿತ್ಯಜೀವದಾಯಕ", "r": "12:50"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದಲೇ ಪಿತನು ಹೇಳಿದಂತೆಯೇ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತೇನೆ", "r": "12:50"}, {"n": 256, "q": "“ಅವರ ಆಜ್ಞೆಯೇ ನಿತ್ಯಜೀವದಾಯಕ ಎಂದು ನಾನು ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 12ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 50", "r": "12:50"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
