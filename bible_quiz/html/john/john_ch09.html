9:2"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನದೋ ಅಥವಾ ಇವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೆತ್ತವರದೋ", "r": "9:2"}, {"n": 12, "q": "“ಶಿಷ್ಯರು, ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಬೇಕಾದರೆ ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "9:2"}, {"n": 13, "q": "ಯೊವಾನ್ನ 9:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು, “ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಬೇಕಾದರೆ ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ? ಇವನದೋ ಅಥವಾ ಇವನನ್ನು ಹೆತ್ತವರದೋ?” ಎಂದು ಕೇಳಿದರು.", "r": "9:2"}, {"n": 14, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಆ ಮನುಷ್ಯನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಿದ್ದು ಏಕೆ?", "a": "ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ", "r": "9:3"}, {"n": 15, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡುತನಕ್ಕೆ ಯಾವುದು ಕಾರಣವಲ್ಲ?", "a": "ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ", "r": "9:3"}, {"n": 16, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡನಲ್ಲಿ ಏನು ವ್ಯಕ್ತವಾಗಬೇಕಿತ್ತು?", "a": "ದೇವರ ಕಾರ್ಯ", "r": "9:3"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.”", "a": "ಯೇಸು", "r": "9:3"}, {"n": 18, "q": "“ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "9:3"}, {"n": 19, "q": "ಯೊವಾನ್ನ 9:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.", "r": "9:3"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗಾಗಿದೆ.”", "a": "ವ್ಯಕ್ತವಾಗುವಂತೆ", "r": "9:3"}, {"n": 21, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಕೆಲಸವನ್ನು ಯಾವಾಗ ಮಾಡುತ್ತಿರಬೇಕು?", "a": "ಹಗಲಿರುವಾಗಲೇ", "r": "9:4"}, {"n": 22, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ರಾತ್ರಿ ಆದಮೇಲೆ ಏನಾಗದು?", "a": "ಯಾರೂ ಕೆಲಸಮಾಡಲಾಗದು", "r": "9:4"}, {"n": 23, "q": "ಯೇಸು ಹಗಲಿರುವಾಗಲೇ ಯಾರ ಕೆಲಸವನ್ನು ಮಾಡುತ್ತಿರಬೇಕು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು", "r": "9:4"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು.”", "a": "ಕಳುಹಿಸಿರುವಾತನ", "r": "9:4"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರಾತ್ರಿ ಆದಮೇಲೆ ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೆಲಸಮಾಡಲಾಗದು", "r": "9:4"}, {"n": 26, "q": "“ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "9:4"}, {"n": 27, "q": "ಯೊವಾನ್ನ 9:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು. ರಾತ್ರಿ ಆದಮೇಲೆ ಯಾರೂ ಕೆಲಸಮಾಡಲಾಗದು.", "r": "9:4"}, {"n": 28, "q": "ಹುಟ್ಟು ಕುರುಡನನ್ನು ಗುಣಪಡಿಸುವ ಮೊದಲು ಯೇಸು ತಮ್ಮ ಬಗ್ಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ”", "r": "9:5"}, {"n": 29, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸು ತಮ್ಮನ್ನು ಜಗಜ್ಯೋತಿ/ಜಗದ ಜ್ಯೋತಿ ಎಂದು ಕರೆದ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "8:12 ಮತ್ತು 9:5", "r": "9:5; 8:12"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.”", "a": "ಜಗತ್ತಿನಲ್ಲಿ", "r": "9:5"}, {"n": 31, "q": "“ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "9:5"}, {"n": 32, "q": "ಯೊವಾನ್ನ 9:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ,” ಎಂದು ನುಡಿದರು.", "r": "9:5"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜಗತ್ತಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.”", "a": "ನಾನಿರುವಾಗ", "r": "9:5"}, {"n": 34, "q": "ಹುಟ್ಟು ಕುರುಡನ ಕಣ್ಣುಗಳಿಗಾಗಿ ಯೇಸು ಮಾಡಿದ ಕ್ರಿಯೆಗಳು ಯಾವುವು?", "a": "ನೆಲದಲ್ಲಿ ಉಗುಳಿದರು; ಮಣ್ಣಿನ ಲೇಪಮಾಡಿದರು; ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿದರು", "r": "9:6"}, {"n": 35, "q": "ಯೇಸು ಕುರುಡನಿಗೆ ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ”", "r": "9:6"}, {"n": 36, "q": "ಹುಟ್ಟು ಕುರುಡನು ಯಾವ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೊಳ್ಳಬೇಕಿತ್ತು?", "a": "ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ", "r": "9:6"}, {"n": 37, "q": "ಯೇಸು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಯಾವುದನ್ನು ಲೇಪಿಸಿದರು?", "a": "ಮಣ್ಣಿನ ಲೇಪವನ್ನು", "r": "9:6"}, {"n": 38, "q": "ಯೇಸು ಎಲ್ಲಿ ಉಗುಳಿದರು?", "a": "ನೆಲದಲ್ಲಿ", "r": "9:6"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಶಿಲೋವಾಮಿನ", "r": "9:6"}, {"n": 40, "q": "“ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "9:6"}, {"n": 41, "q": "ಯೊವಾನ್ನ 9:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, “ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ,” ಎಂದು ಹೇಳಿದರು.", "r": "9:6"}, {"n": 42, "q": "‘ಶಿಲೋವಾಮ್’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಕಳುಹಿಸಲಾದವನು", "r": "9:7"}, {"n": 43, "q": "ಕೊಳದಲ್ಲಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡು ಹಿಂದಿರುಗಿದ ಕುರುಡನಿಗೆ ಏನಾಗಿತ್ತು?", "a": "ಕಣ್ಣು ಬಂದಿತ್ತು", "r": "9:7"}, {"n": 44, "q": "ಕುರುಡನು ಯೇಸುವಿನ ಆಜ್ಞೆಯಂತೆ ಏನು ಮಾಡಿದನು?", "a": "ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು", "r": "9:7"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ತೊಳೆದುಕೊಂಡನು", "r": "9:7"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಕಣ್ಣು ಬಂದಿತ್ತು.”", "a": "ಹಿಂದಿರುಗಿದಾಗ", "r": "9:7"}, {"n": 47, "q": "“ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "9:7"}, {"n": 48, "q": "ಯೊವಾನ್ನ 9:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "(‘ಶಿಲೋವಾಮ್’ ಎಂದರೆ ಕಳುಹಿಸಲಾದವನು ಎಂದರ್ಥ). ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು; ಹಿಂದಿರುಗಿದಾಗ ಅವನಿಗೆ ಕಣ್ಣು ಬಂದಿತ್ತು.", "r": "9:7"}, {"n": 49, "q": "ಕಣ್ಣು ಬಂದವನನ್ನು ಕಂಡ ನೆರೆಯವರು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?”", "r": "9:8"}, {"n": 50, "q": "ಹುಟ್ಟು ಕುರುಡನು ಹಿಂದೆ ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದನು", "r": "9:8"}, {"n": 51, "q": "“ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” ಎಂದು ವಿಚಾರಿಸಿದವರು ಯಾರು?", "a": "ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನನ್ನು ನೋಡಿದ್ದವರು", "r": "9:8"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?”", "a": "ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ", "r": "9:8"}, {"n": 53, "q": "“ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "9:8"}, {"n": 54, "q": "ಯೊವಾನ್ನ 9:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, “ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” ಎಂದು ವಿಚಾರಿಸಿದರು.", "r": "9:8"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನೇ ಅಲ್ಲವೆ?”", "a": "ಕುಳಿತುಕೊಂಡಿದ್ದವನು", "r": "9:8"}, {"n": 56, "q": "ಕಣ್ಣು ಬಂದವನ ಬಗ್ಗೆ ಜನರು ಹೇಳಿದ ಎರಡು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "“ಹೌದು ಅವನೇ”; “ಇಲ್ಲ, ಇವನು ಅವನಂತೆ ಕಾಣುತ್ತಾನೆ, ಅಷ್ಟೆ”", "r": "9:9"}, {"n": 57, "q": "ಜನರ ಸಂದೇಹಕ್ಕೆ ಕುರುಡನು ತನ್ನ ಬಗ್ಗೆ ಏನೆಂದು ತಿಳಿಸಿದನು?", "a": "“ನಾನೇ ಅವನು”", "r": "9:9"}, {"n": 58, "q": "“ಇಲ್ಲ, ಇವನು ಅವನಂತೆ ಕಾಣುತ್ತಾನೆ, ಅಷ್ಟೆ” ಎಂದವರು ಯಾರು?", "a": "ಇತರರು (ಕೆಲವು ಜನರು)", "r": "9:9"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು ಅವನೇ, ಎಂದರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೆಲವರು", "r": "9:9"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲ, ಇವನು ಅವನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಷ್ಟೆ, ಎಂದರು ಇತರರು.”", "a": "ಕಾಣುತ್ತಾನೆ", "r": "9:9"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ನಾನೇ ಅವನು ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದನು", "r": "9:9"}, {"n": 62, "q": "“ಆ ಕುರುಡನು ನಾನೇ ಅವನು ಎಂದು ತಿಳಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "9:9"}, {"n": 63, "q": "ನೆರೆಯವರು ಕುರುಡನಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?”", "r": "9:10"}, {"n": 64, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿದವರು ಯಾರು?", "a": "ನೆರೆಯವರು (9:10); ಫರಿಸಾಯರು (9:15); ಅಧಿಕಾರಿಗಳು — ಹೆತ್ತವರನ್ನು (9:19); ಅಧಿಕಾರಿಗಳು — ಮತ್ತೆ (9:26)", "r": "9:10; 9:15; 9:19; 9:26"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?”", "a": "ಹಾಗಾದರೆ", "r": "9:10"}, {"n": 66, "q": "“ಆಗ ಅವರು, ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "9:10"}, {"n": 67, "q": "ಯೊವಾನ್ನ 9:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಅವರು, “ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” ಎಂದು ಕೇಳಿದರು.", "r": "9:10"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, ಹಾಗಾದರೆ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ಬಂತು?”", "a": "ಕಣ್ಣು", "r": "9:10"}, {"n": 69, "q": "ಕಣ್ಣು ಬಂದವನು ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರನ್ನು ಏನೆಂದು ಕರೆದನು (9:11)?", "a": "ಯೇಸು ಎಂಬುವರು", "r": "9:11"}, {"n": 70, "q": "ತನಗೆ ಕಣ್ಣು ಬಂದ ಬಗೆಯನ್ನು ಕುರುಡನು ಹೇಗೆ ವಿವರಿಸಿದನು?", "a": "ಯೇಸು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು; ‘ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ’ ಎಂದರು; ಹೋಗಿ ತೊಳೆದುಕೊಂಡೆ; ಕಣ್ಣು ಬಂತು", "r": "9:11"}, {"n": 71, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಕುರುಡನು ಯೇಸುವನ್ನು ಕ್ರಮವಾಗಿ ಹೇಗೆ ಅರಿತುಕೊಂಡನು?", "a": "“ಯೇಸು ಎಂಬುವರು” (9:11) → “ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ” (9:17) → “ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ” ಎಂದು ಅಡ್ಡಬಿದ್ದನು (9:38)", "r": "9:11; 9:17; 9:38"}, {"n": 72, "q": "ಕುರುಡನಿಗೆ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊಳ್ಳಲು ಹೇಳಿದರು (9:11)?", "a": "ಶಿಲೋವಾಮಿಗೆ", "r": "9:11"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುವರು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ನನ್ನ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು, ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ, ಎಂದು ಹೇಳಿದರು;”", "a": "ಯೇಸು", "r": "9:11"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂತು, ಎಂದು ಹೇಳಿದನು.”", "a": "ಕಣ್ಣು", "r": "9:11"}, {"n": 75, "q": "“ಅದಕ್ಕೆ ಅವನು, ಯೇಸು ಎಂಬುವರು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ನನ್ನ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು, ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ, ಎಂದು ಹೇಳಿದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "9:11"}, {"n": 76, "q": "“ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂದಾಗ ಕುರುಡನು ಏನೆಂದನು?", "a": "“ನಾನರಿಯೆ”", "r": "9:12"}, {"n": 77, "q": "“ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂಬ ಪ್ರಶ್ನೆಯಲ್ಲಿ ‘ಆತ’ ಯಾರು?", "a": "ಯೇಸು", "r": "9:12"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ಆತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಎಲ್ಲಿದ್ದಾನೆ", "r": "9:12"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನರಿಯೆ, ಎಂದನು.”", "a": "ಉತ್ತರವಾಗಿ", "r": "9:12"}, {"n": 80, "q": "ಯೊವಾನ್ನ 9:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವರು, “ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂದು ವಿಚಾರಿಸಿದರು. ಅವನು ಉತ್ತರವಾಗಿ “ನಾನರಿಯೆ,” ಎಂದನು.", "r": "9:12"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ನಾನರಿಯೆ", "r": "9:12"}, {"n": 82, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 9:13ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಫರಿಸಾಯರಿಂದ ವಿಚಾರಣೆ", "r": "9:13"}, {"n": 83, "q": "ಜನರು ಕಣ್ಣು ಬಂದವನನ್ನು ಯಾರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು?", "a": "ಫರಿಸಾಯರ ಬಳಿಗೆ", "r": "9:13"}, {"n": 84, "q": "ಜನರು ಕುರುಡನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಏಕೆ ಕರೆದುಕೊಂಡು ಹೋದರು?", "a": "ಯೇಸು ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿದ್ದುದರಿಂದ", "r": "9:13"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.”", "a": "ಫರಿಸಾಯರ", "r": "9:13"}, {"n": 86, "q": "“ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "9:13"}, {"n": 87, "q": "ಯೊವಾನ್ನ 9:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.", "r": "9:13"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಕರೆದುಕೊಂಡು", "r": "9:13"}, {"n": 89, "q": "ಯೇಸು ಹುಟ್ಟು ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಯಾವುದು?", "a": "ಸಬ್ಬತ್ ದಿನ", "r": "9:14"}, {"n": 90, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಸಬ್ಬತ್ ದಿನದಂದು ಯೇಸು ಗುಣಪಡಿಸಿದ ಇಬ್ಬರು ಯಾರು?", "a": "ಬೆತ್ಸಥ ಕೊಳದ ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿ (5:9) ಮತ್ತು ಹುಟ್ಟು ಕುರುಡ (9:14)", "r": "5:9; 9:14"}, {"n": 91, "q": "ಯೇಸು ಕುರುಡನಿಗೆ ಹೇಗೆ ಕಣ್ಣುಕೊಟ್ಟರು?", "a": "ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ", "r": "9:14"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "9:14"}, {"n": 93, "q": "“ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "9:14"}, {"n": 94, "q": "ಯೊವಾನ್ನ 9:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.", "r": "9:14"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನವಾಗಿತ್ತು.”", "a": "ಸಬ್ಬತ್", "r": "9:14"}, {"n": 96, "q": "ಫರಿಸಾಯರಿಗೆ ಕಣ್ಣು ಬಂದವನು ಕೊಟ್ಟ ವಿವರಣೆ ಏನು?", "a": "“ಯೇಸು ನನ್ನ ಕಣ್ಣುಗಳಿಗೆ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಹಚ್ಚಿದರು; ನಾನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಳ್ಳುತ್ತಲೇ ನನಗೆ ದೃಷ್ಟಿ ಬಂತು”", "r": "9:15"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಣ್ಣು ಬಂದುದು ಹೇಗೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಮತ್ತೆ ಕೇಳಿದರು.”", "a": "ಫರಿಸಾಯರು", "r": "9:15"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕಣ್ಣುಗಳಿಗೆ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಹಚ್ಚಿದರು;”", "a": "ಯೇಸು", "r": "9:15"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೆ ದೃಷ್ಟಿ ಬಂತು, ಎಂದನು ಅವನು.”", "a": "ತೊಳೆದುಕೊಳ್ಳುತ್ತಲೇ", "r": "9:15"}, {"n": 100, "q": "“ಕಣ್ಣು ಬಂದುದು ಹೇಗೆಂದು ಫರಿಸಾಯರು ಅವನನ್ನು ಮತ್ತೆ ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "9:15"}, {"n": 101, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ”", "r": "9:16"}, {"n": 102, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಇತರರು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಪಾಪಿಯಾದವನು ಇಂಥ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡಲು ಸಾಧ್ಯವೇ?”", "r": "9:16"}, {"n": 103, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಫರಿಸಾಯರಲ್ಲೇ ಏನುಂಟಾಯಿತು?", "a": "ಭಿನ್ನಬೇಧ", "r": "9:16"}, {"n": 104, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವನ್ನು ‘ಪಾಪಿ’ ಎಂದು ಕರೆದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು (“ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು” 9:24)", "r": "9:16; 9:24"}, {"n": 105, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದವನಲ್ಲ ಎಂಬುದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ", "r": "9:16"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲವರು, ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ, ಎಂದರು.”", "a": "ಫರಿಸಾಯರಲ್ಲಿ", "r": "9:16"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತರರು, ಪಾಪಿಯಾದವನು ಇಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲು ಸಾಧ್ಯವೇ?”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "9:16"}, {"n": 108, "q": "“ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರು, ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "9:16"}, {"n": 109, "q": "ಫರಿಸಾಯರು ಕುರುಡನನ್ನು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನು ವಿಚಾರಿಸಿದರು?", "a": "“ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?”", "r": "9:17"}, {"n": 110, "q": "ಕುರುಡನು ಫರಿಸಾಯರ ಮುಂದೆ ಯೇಸುವನ್ನು ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ”", "r": "9:17"}, {"n": 111, "q": "“ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ” ಎಂದು ಯಾರು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು?", "a": "ಕಣ್ಣು ಬಂದ ಕುರುಡನು ಯೇಸುವಿನ ಬಗ್ಗೆ", "r": "9:17"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಕುರುಡನನ್ನು ಕುರಿತು, ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?”", "a": "ಫರಿಸಾಯರು", "r": "9:17"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನು, ಅವರೊಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರಿ, ಎಂದನು.”", "a": "ಪ್ರವಾದಿಯೇ", "r": "9:17"}, {"n": 114, "q": "“ಆದ್ದರಿಂದ ಫರಿಸಾಯರು ಆ ಕುರುಡನನ್ನು ಕುರಿತು, ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "9:17"}, {"n": 115, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನನ್ನು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ?", "a": "ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು", "r": "9:18"}, {"n": 116, "q": "ಕುರುಡನು ದೃಷ್ಟಿ ಪಡೆದದ್ದನ್ನು ನಂಬಲು ಒಪ್ಪದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "9:18"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.”", "a": "ಕುರುಡನಾಗಿದ್ದು", "r": "9:18"}, {"n": 118, "q": "“ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "9:18"}, {"n": 119, "q": "ಯೊವಾನ್ನ 9:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.", "r": "9:18"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.”", "a": "ಪಡೆದಿದ್ದಾನೆ", "r": "9:18"}, {"n": 121, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಕುರುಡನ ಬಗ್ಗೆ ವಿಚಾರಿಸಲು ಯಾರನ್ನು ಕರೆಯಿಸಿದರು?", "a": "ಅವನ ಹೆತ್ತವರನ್ನು", "r": "9:19"}, {"n": 122, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನ ಹೆತ್ತವರಿಗೆ ಕೇಳಿದ ಮೂರು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ಇವನು ನಿಮ್ಮ ಮಗನೋ? ಇವನು ಹುಟ್ಟು ಕುರುಡನೋ? ಹಾಗಾದರೆ ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?”", "r": "9:19"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆಯಿಸಿ, ಇವನು ನಿಮ್ಮ ಮಗನೋ?”", "a": "ಹೆತ್ತವರನ್ನು", "r": "9:19"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?”", "a": "ಹಾಗಾದರೆ", "r": "9:19"}, {"n": 125, "q": "“ಈ ಕಾರಣ ಅವನ ಹೆತ್ತವರನ್ನು ಕರೆಯಿಸಿ, ಇವನು ನಿಮ್ಮ ಮಗನೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "9:19"}, {"n": 126, "q": "ಯೊವಾನ್ನ 9:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಕಾರಣ ಅವನ ಹೆತ್ತವರನ್ನು ಕರೆಯಿಸಿ, “ಇವನು ನಿಮ್ಮ ಮಗನೋ? ಇವನು ಹುಟ್ಟು ಕುರುಡನೋ? ಹಾಗಾದರೆ ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?” ಎಂದು ಕೇಳಿದರು.", "r": "9:19"}, {"n": 127, "q": "ಕುರುಡನ ತಂದೆ ತಾಯಿಗಳಿಗೆ ಯಾವ ಎರಡು ವಿಷಯಗಳು ತಿಳಿದಿರಲಿಲ್ಲ?", "a": "ಮಗನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ; ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟವರು ಯಾರು", "r": "9:20"}, {"n": 128, "q": "ಕುರುಡನ ತಂದೆ ತಾಯಿಗಳು ಯಾವುದನ್ನು ಒಪ್ಪಿಕೊಂಡರು?", "a": "ಅವನು ತಮ್ಮ ಮಗನೆಂದು ಮತ್ತು ಹುಟ್ಟು ಕುರುಡನೆಂದು (ಅಧಿಕಾರಿಗಳ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸುತ್ತಾ)", "r": "9:20"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಗೊತ್ತಿಲ್ಲ", "r": "9:20"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದೂ ನಮಗೆ ತಿಳಿಯದು.”", "a": "ಕಣ್ಣುಕೊಟ್ಟವರು", "r": "9:20"}, {"n": 131, "q": "“ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ ಗೊತ್ತಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "9:20"}, {"n": 132, "q": "ಯೊವಾನ್ನ 9:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, “ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ ಗೊತ್ತಿಲ್ಲ; ಇವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟವರು ಯಾರೆಂದೂ ನಮಗೆ ತಿಳಿಯದು.", "r": "9:20"}, {"n": 133, "q": "ಕುರುಡನ ಹೆತ್ತವರು ಅಧಿಕಾರಿಗಳಿಗೆ ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ? ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ”", "r": "9:21"}, {"n": 134, "q": "ಹೆತ್ತವರ ಪ್ರಕಾರ ಕುರುಡನು ಏಕೆ ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ?", "a": "ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದರಿಂದ", "r": "9:21"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ", "r": "9:21"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉತ್ತರಿಸಿದರು", "r": "9:21"}, {"n": 137, "q": "ಯೊವಾನ್ನ 9:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ? ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ,” ಎಂದು ಉತ್ತರಿಸಿದರು.", "r": "9:21"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳಿ, ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ?”", "a": "ಇವನನ್ನೇ", "r": "9:21"}, {"n": 139, "q": "ಕುರುಡನ ಹೆತ್ತವರು ಹಾಗೆ ಉತ್ತರಿಸಿದ್ದು ಏಕೆ?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ ಅಂಜಿಕೆಯಿಂದ", "r": "9:22"}, {"n": 140, "q": "ಯೇಸುವನ್ನು ಲೋಕೋದ್ಧಾರಕ ಎಂದು ಒಪ್ಪಿಕೊಳ್ಳುವವರಿಗೆ ಏನು ಮಾಡಬೇಕೆಂದು ಅಧಿಕಾರಿಗಳು ಗೊತ್ತುಮಾಡಿದ್ದರು?", "a": "ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ ಬಹಿಷ್ಕಾರ ಹಾಕಬೇಕೆಂದು", "r": "9:22"}, {"n": 141, "q": "ಯೇಸುವನ್ನು ಲೋಕೋದ್ಧಾರಕನೆಂದು ಒಪ್ಪಿಕೊಳ್ಳುವವರನ್ನು ಎಲ್ಲಿಂದ ಬಹಿಷ್ಕರಿಸಲಾಗುತ್ತಿತ್ತು?", "a": "ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ", "r": "9:22"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಂಜಿಕೆಯಿಂದ", "r": "9:22"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಯಾರಾದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಎಂದು ಒಪ್ಪಿಕೊಂಡರೆ ಅಂಥವರಿಗೆ ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ ಬಹಿಷ್ಕಾರ ಹಾಕಬೇಕೆಂದು ಅಧಿಕಾರಿಗಳು ಈ ಮೊದಲೇ ಗೊತ್ತುಮಾಡಿದ್ದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "9:22"}, {"n": 144, "q": "“ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ ಅಂಜಿಕೆಯಿಂದ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "9:22"}, {"n": 145, "q": "ಕುರುಡನ ತಂದೆತಾಯಿಗಳು ಅಂಜಿಕೆಯಿಂದ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ”", "r": "9:23"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದಲೇ, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು.”", "a": "ತಂದೆತಾಯಿಗಳು", "r": "9:23"}, {"n": 147, "q": "“ಆದುದರಿಂದಲೇ, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "9:23"}, {"n": 148, "q": "ಯೊವಾನ್ನ 9:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದಲೇ, “ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ” ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.", "r": "9:23"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.”", "a": "ಆದುದರಿಂದಲೇ", "r": "9:23"}, {"n": 150, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ ಏನು ಹೇಳಿದರು?", "a": "“ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು. ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು”", "r": "9:24"}, {"n": 151, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಯಾರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳಲು ಕೇಳಿದರು?", "a": "ದೇವರ ಮುಂದೆ", "r": "9:24"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "9:24"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆ ಗೊತ್ತು, ಎಂದು ಕೇಳಿದರು.”", "a": "ಪಾಪಿಯೆಂದು", "r": "9:24"}, {"n": 154, "q": "“ಅಧಿಕಾರಿಗಳು ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "9:24"}, {"n": 155, "q": "ಯೊವಾನ್ನ 9:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಧಿಕಾರಿಗಳು ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, “ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು. ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು,” ಎಂದು ಕೇಳಿದರು.", "r": "9:24"}, {"n": 156, "q": "ಯೇಸು ಪಾಪಿಯೆಂದು ಅಧಿಕಾರಿಗಳು ಹೇಳಿದಾಗ ಕುರುಡನು ಏನು ಹೇಳಿದನು?", "a": "“ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ; ಆದರೆ ನಾನೊಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗಲಾದರೋ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ”", "r": "9:25"}, {"n": 157, "q": "ಕುರುಡನು ತನ್ನ ಬಗ್ಗೆ ಏನನ್ನು ಮಾತ್ರ ಬಲ್ಲೆ ಎಂದನು?", "a": "ಒಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ", "r": "9:25"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು, ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ;”", "a": "ಉತ್ತರವಾಗಿ", "r": "9:25"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗಲಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ, ಎಂದು ಹೇಳಿದನು.”", "a": "ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ", "r": "9:25"}, {"n": 160, "q": "“ಉತ್ತರವಾಗಿ ಅವನು, ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "9:25"}, {"n": 161, "q": "ಯೊವಾನ್ನ 9:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಉತ್ತರವಾಗಿ ಅವನು, “ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ; ಆದರೆ ನಾನೊಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗಲಾದರೋ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ,” ಎಂದು ಹೇಳಿದನು.", "r": "9:25"}, {"n": 162, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಮತ್ತೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಅವನು ನಿನಗೇನು ಮಾಡಿದ? ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು ಬರಿಸಿದ?”", "r": "9:26"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಬರಿಸಿದ", "r": "9:26"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಅವರು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಶ್ನಿಸಿದರು", "r": "9:26"}, {"n": 165, "q": "ಯೊವಾನ್ನ 9:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಅವನು ನಿನಗೇನು ಮಾಡಿದ? ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು ಬರಿಸಿದ?” ಎಂದು ಅವರು ಮತ್ತೆ ಪ್ರಶ್ನಿಸಿದರು.", "r": "9:26"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಹೇಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರಿಸಿದ?”", "a": "ಕಣ್ಣು", "r": "9:26"}, {"n": 167, "q": "ಅಧಿಕಾರಿಗಳ ಪುನರಾವರ್ತಿತ ಪ್ರಶ್ನೆಗೆ ಕುರುಡನು ಕೇಳಿದ ಮರುಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವನ ಶಿಷ್ಯರಾಗಲು ನಿಮಗೂ ಮನಸ್ಸಿದೆಯೇ?”", "r": "9:27"}, {"n": 168, "q": "ಕುರುಡನ ಪ್ರಕಾರ ಅಧಿಕಾರಿಗಳು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ನಂಬುವುದಿಲ್ಲ", "r": "9:27"}, {"n": 169, "q": "“ನಿಮಗೆ ಆಗಲೇ ಹೇಳಿದ್ದೇನೆ…” — ಕುರುಡನು ಅಧಿಕಾರಿಗಳಿಗೆ ಮತ್ತೇನು ಕೇಳಿದನು?", "a": "“ಅದನ್ನೇ ಏಕೆ ಮತ್ತೆ ಮತ್ತೆ ಕೇಳುತ್ತೀರಿ?”", "r": "9:27"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ನಿಮಗೆ ಆಗಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳಿದ್ದೇನೆ", "r": "9:27"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನೇ ಏಕೆ ಮತ್ತೆ ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೇಳುತ್ತೀರಿ", "r": "9:27"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೂ ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಶಿಷ್ಯರಾಗಲು", "r": "9:27"}, {"n": 173, "q": "ಕುರುಡನ ಮಾತು ಕೇಳಿ ಅಧಿಕಾರಿಗಳು ಏನು ಮಾಡಿದರು?", "a": "ಅವನನ್ನು ಶಪಿಸಿದರು", "r": "9:28"}, {"n": 174, "q": "ಅಧಿಕಾರಿಗಳು ತಮ್ಮನ್ನು ಯಾರ ಶಿಷ್ಯರೆಂದು ಹೇಳಿಕೊಂಡರು?", "a": "“ನಾವು ಮೋಶೆಯ ಶಿಷ್ಯರು”", "r": "9:28"}, {"n": 175, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಯಾರ ಶಿಷ್ಯನೆಂದು ಕರೆದರು?", "a": "“ನೀನೇ ಅವನ ಶಿಷ್ಯ”", "r": "9:28"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಶಪಿಸಿದರು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "9:28"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನೇ ಅವನ ಶಿಷ್ಯ, ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರು.”", "a": "ಮೋಶೆಯ", "r": "9:28"}, {"n": 178, "q": "ಯೊವಾನ್ನ 9:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಅಧಿಕಾರಿಗಳು ಅವನನ್ನು ಶಪಿಸಿದರು. “ನೀನೇ ಅವನ ಶಿಷ್ಯ, ನಾವು ಮೋಶೆಯ ಶಿಷ್ಯರು.", "r": "9:28"}, {"n": 179, "q": "ಮೋಶೆಯ ಬಗ್ಗೆ ಅಧಿಕಾರಿಗಳು ಏನು ಬಲ್ಲವರಾಗಿದ್ದರು?", "a": "ಮೋಶೆಯೊಡನೆ ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು", "r": "9:29"}, {"n": 180, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಅಧಿಕಾರಿಗಳು ಏನನ್ನು ಅರಿಯೆವು ಎಂದರು?", "a": "ಅವನು ಎಲ್ಲಿಯವನೋ", "r": "9:29"}, {"n": 181, "q": "ಅಧಿಕಾರಿಗಳ ಪ್ರಕಾರ ದೇವರು ಯಾರೊಡನೆ ಮಾತನಾಡಿದರು?", "a": "ಮೋಶೆಯೊಡನೆ", "r": "9:29"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು ನಾವು ಬಲ್ಲೆವು.”", "a": "ಮೋಶೆಯೊಡನೆ", "r": "9:29"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಇವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಅರಿಯೆವು, ಎಂದರು.”", "a": "ಎಲ್ಲಿಯವನೋ", "r": "9:29"}, {"n": 184, "q": "“ಮೋಶೆಯೊಡನೆ ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು ನಾವು ಬಲ್ಲೆವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "9:29"}, {"n": 185, "q": "ಅಧಿಕಾರಿಗಳ ಮಾತಿಗೆ ಕುರುಡನು ಆಶ್ಚರ್ಯದಿಂದ ಏನೆಂದನು?", "a": "“ಏನಾಶ್ಚರ್ಯ! ನನಗೆ ಕಣ್ಣು ಬರಿಸಿದ್ದಾರೆ.”", "r": "9:30"}, {"n": 186, "q": "ಕುರುಡನಿಗೆ ಆಶ್ಚರ್ಯವಾದ ಸಂಗತಿ ಏನು?", "a": "ಯೇಸು ತನಗೆ ಕಣ್ಣು ಬರಿಸಿದರೂ, ‘ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು’ ಎಂದು ಅಧಿಕಾರಿಗಳು ಹೇಳುತ್ತಿದ್ದುದು", "r": "9:30"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಕುರುಡ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಏನಾಶ್ಚರ್ಯ", "r": "9:30"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎನ್ನುತ್ತೀರಿ", "r": "9:30"}, {"n": 189, "q": "ಯೊವಾನ್ನ 9:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಆ ಕುರುಡ, “ಏನಾಶ್ಚರ್ಯ! ನನಗೆ ಕಣ್ಣು ಬರಿಸಿದ್ದಾರೆ. ಆದರೂ ‘ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು’ ಎನ್ನುತ್ತೀರಿ.", "r": "9:30"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏನಾಶ್ಚರ್ಯ!”", "a": "ಕುರುಡ", "r": "9:30"}, {"n": 191, "q": "ಕುರುಡನ ಪ್ರಕಾರ ದೇವರು ಯಾರಿಗೆ ಓಗೊಡುವುದಿಲ್ಲ?", "a": "ಪಾಪಿಗಳಿಗೆ", "r": "9:31"}, {"n": 192, "q": "ಕುರುಡನ ಪ್ರಕಾರ ದೇವರು ಯಾರಿಗೆ ಓಗೊಡುತ್ತಾರೆ?", "a": "ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುವವರಿಗೆ", "r": "9:31"}, {"n": 193, "q": "ದೇವರು ಓಗೊಡುವವರು ತಮ್ಮ ಚಿತ್ತದಂತೆ ಹೇಗೆ ನಡೆಯುತ್ತಾರೆ?", "a": "ಭಕ್ತಿಯಿಂದ", "r": "9:31"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.”", "a": "ಓಗೊಡುತ್ತಾರೆಂದು", "r": "9:31"}, {"n": 195, "q": "“ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ ಓಗೊಡುತ್ತಾರೆಂದು ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "9:31"}, {"n": 196, "q": "ಯೊವಾನ್ನ 9:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಪಾಪಿಗಳಿಗೆ ಓಗೊಡುವುದಿಲ್ಲ. ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ ಓಗೊಡುತ್ತಾರೆಂದು ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.", "r": "9:31"}, {"n": 197, "q": "ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಯಾರೂ ಕೇಳದ ಸುದ್ದಿ ಯಾವುದು ಎಂದು ಕುರುಡನು ಹೇಳಿದನು?", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿ", "r": "9:32"}, {"n": 198, "q": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಯಾವಾಗಿನಿಂದ ಯಾರೂ ಕೇಳಿಲ್ಲ?", "a": "ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ", "r": "9:32"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.”", "a": "ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ", "r": "9:32"}, {"n": 200, "q": "“ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "9:32"}, {"n": 201, "q": "ಯೊವಾನ್ನ 9:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.", "r": "9:32"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.”", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ", "r": "9:32"}, {"n": 203, "q": "ಕುರುಡನ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:33"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:33"}, {"n": 205, "q": "“ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "9:33"}, {"n": 206, "q": "ಯೊವಾನ್ನ 9:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ,” ಎಂದನು.", "r": "9:33"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ, ಎಂದನು.”", "a": "ಇಂಥದ್ದೇನನ್ನೂ", "r": "9:33"}, {"n": 208, "q": "ಫರಿಸಾಯರು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳುವ ಮೊದಲು ಏನು ಹೇಳಿದರು?", "a": "“ಪಾಪದಲ್ಲೇ ಹುಟ್ಟಿ ಬೆಳೆದವನು ನೀನು. ನಮಗೇ ಬುದ್ಧಿ ಹೇಳ ಹೊರಟೆಯಾ?”", "r": "9:34"}, {"n": 209, "q": "ಫರಿಸಾಯರು ಕೊನೆಗೆ ಕುರುಡನಿಗೆ ಏನು ಮಾಡಿದರು?", "a": "ಅವನನ್ನು ತಳ್ಳಿಬಿಟ್ಟರು", "r": "9:34"}, {"n": 210, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಕುರುಡನು ಯಾವುದರಲ್ಲಿ ಹುಟ್ಟಿ ಬೆಳೆದವನು?", "a": "ಪಾಪದಲ್ಲೇ", "r": "9:34"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪಾಪದಲ್ಲೇ ಹುಟ್ಟಿ ಬೆಳೆದವನು ನೀನು.”", "a": "ಫರಿಸಾಯರು", "r": "9:34"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೇ ಬುದ್ಧಿ ಹೇಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೊರಟೆಯಾ", "r": "9:34"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಳ್ಳಿಬಿಟ್ಟರು", "r": "9:34"}, {"n": 214, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 9:35ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಆತ್ಮದ ಅಂಧತ್ವ", "r": "9:35"}, {"n": 215, "q": "ಹೊರಗೆ ತಳ್ಳಲ್ಪಟ್ಟ ಕುರುಡನನ್ನು ಕಂಡ ಯೇಸು ಏನು ಕೇಳಿದರು?", "a": "“ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?”", "r": "9:35"}, {"n": 216, "q": "ಯೇಸುವಿನ ಕಿವಿಗೆ ಯಾವ ವಾರ್ತೆ ಮುಟ್ಟಿತು?", "a": "ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ", "r": "9:35"}, {"n": 217, "q": "ಯೇಸು ಹೊರಗೆ ತಳ್ಳಲ್ಪಟ್ಟ ಕುರುಡನಿಗೆ ಯಾರಲ್ಲಿ ವಿಶ್ವಾಸವಿದೆಯೇ ಎಂದು ಕೇಳಿದರು?", "a": "ನರಪುತ್ರನಲ್ಲಿ", "r": "9:35"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿವಿಗೆ ಮುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "9:35"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಕಂಡು, ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?”", "a": "ಯೇಸು", "r": "9:35"}, {"n": 220, "q": "“ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ ಯೇಸುಸ್ವಾಮಿಯ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "9:35"}, {"n": 221, "q": "“ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಕುರುಡನು ಏನೆಂದನು?", "a": "“ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ”", "r": "9:36"}, {"n": 222, "q": "ಕುರುಡನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು (9:36)?", "a": "“ಸ್ವಾಮೀ”", "r": "9:36"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ", "r": "9:36"}, {"n": 224, "q": "“ಅವನು, ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "9:36"}, {"n": 225, "q": "ಯೊವಾನ್ನ 9:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು, “ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ,” ಎಂದನು.", "r": "9:36"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದನು.”", "a": "ಯಾರೆಂದು", "r": "9:36"}, {"n": 227, "q": "ಯೇಸು ತಾವೇ ನರಪುತ್ರನೆಂದು ಕುರುಡನಿಗೆ ಹೇಗೆ ತಿಳಿಸಿದರು?", "a": "“ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು”", "r": "9:37"}, {"n": 228, "q": "“ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು” ಎಂಬ ಮಾತನ್ನು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ (4:26) ಮತ್ತು ಹುಟ್ಟು ಕುರುಡನಿಗೆ (9:37)", "r": "4:26; 9:37"}, {"n": 229, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡನು ನರಪುತ್ರನನ್ನು ಏನು ಮಾಡಿದ್ದಾನೆ?", "a": "ಕಂಡಿದ್ದಾನೆ", "r": "9:37"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದರು.”", "a": "ಯೇಸು", "r": "9:37"}, {"n": 231, "q": "“ಯೇಸು, ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "9:37"}, {"n": 232, "q": "ಯೊವಾನ್ನ 9:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, “ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,” ಎಂದರು.", "r": "9:37"}, {"n": 233, "q": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ” ಎಂದು ಹೇಳುತ್ತಾ ಕುರುಡನು ಏನು ಮಾಡಿದನು?", "a": "ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು", "r": "9:38"}, {"n": 234, "q": "ಕುರುಡನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬೀಳುವಾಗ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ”", "r": "9:38"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಡ್ಡಬಿದ್ದನು.”", "a": "ಯೇಸುವಿಗೆ", "r": "9:38"}, {"n": 236, "q": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "9:38"}, {"n": 237, "q": "ಯೊವಾನ್ನ 9:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ,” ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.", "r": "9:38"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.”", "a": "ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ", "r": "9:38"}, {"n": 239, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು ಏಕೆ?", "a": "ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ", "r": "9:39"}, {"n": 240, "q": "ಯೇಸುವಿನ ತೀರ್ಪಿನಿಂದ ಕುರುಡರಿಗೂ ಕಾಣುವವರಿಗೂ ಏನಾಗುತ್ತದೆ?", "a": "ಕುರುಡರು ಕಾಣುವರು; ಕಾಣುವವರು ಕುರುಡರಾಗುವರು", "r": "9:39"}, {"n": 241, "q": "ಯೇಸು ತೀರ್ಪುಕೊಡಲೆಂದು ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಈ ಲೋಕಕ್ಕೆ", "r": "9:39"}, {"n": 242, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು, ಎಂದು ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "9:39"}, {"n": 243, "q": "“ಆಗ ಯೇಸು, ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "9:39"}, {"n": 244, "q": "ಯೊವಾನ್ನ 9:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು,” ಎಂದು ನುಡಿದರು.", "r": "9:39"}, {"n": 245, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ಫರಿಸಾಯರು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "r": "9:40"}, {"n": 246, "q": "“ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” ಎಂದು ಕೇಳಿದವರು ಯಾರು?", "a": "ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು", "r": "9:40"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನಿಂತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "a": "ಫರಿಸಾಯರು", "r": "9:40"}, {"n": 248, "q": "“ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "9:40"}, {"n": 249, "q": "ಯೊವಾನ್ನ 9:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, “ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "9:40"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "a": "ನಿಂತಿದ್ದ", "r": "9:40"}, {"n": 251, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಏಕೆ ಪಾಪಿಗಳಾಗಿದ್ದಾರೆ?", "a": "‘ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ’ ಎಂದು ಹೇಳಿಕೊಳ್ಳುವುದರಿಂದ", "r": "9:41"}, {"n": 252, "q": "ಫರಿಸಾಯರು ಕುರುಡರೇ ಆಗಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:41"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯ ಯೇಸುವಿನ ಯಾವ ಮಾತಿನಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "“ಆದ್ದರಿಂದ ನೀವು ಪಾಪಿಗಳಾಗಿದ್ದೀರಿ”", "r": "9:41"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ನೀವು ಕುರುಡರೇ ಆಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆದರೆ, ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ, ಎಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತೀರಿ;”", "a": "ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:41"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಪಾಪಿಗಳಾಗಿದ್ದೀರಿ", "r": "9:41"}, {"n": 256, "q": "“ಯೇಸು, ನೀವು ಕುರುಡರೇ ಆಗಿದ್ದರೆ ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ, ಆದರೆ, ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ, ಎಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತೀರಿ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "9:41"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
