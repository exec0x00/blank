rm:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗುತ್ತವೆ", "r": "10:4"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನ ಸ್ವರ ಗೊತ್ತು.”", "a": "ಅವುಗಳಿಗೆ", "r": "10:4"}, {"n": 25, "q": "“ತನ್ನ ಕುರಿಗಳನ್ನೆಲ್ಲಾ ಹೊರಗೆ ಬಿಟ್ಟ ನಂತರ ಅವನು ಅವುಗಳ ಮುಂದೆ ಹೋಗುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "10:4"}, {"n": 26, "q": "“ಏಕೆಂದರೆ ಅವುಗಳಿಗೆ ಅವನ ಸ್ವರ ಗೊತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "10:4"}, {"n": 27, "q": "ಕುರಿಗಳು ಅಪರಿಚಿತನಿಗೆ ಏನು ಮಾಡುತ್ತವೆ?", "a": "ಹಿಂಬಾಲಿಸುವುದಿಲ್ಲ; ಅವನಿಂದ ದೂರ ಓಡಿಹೋಗುತ್ತವೆ", "r": "10:5"}, {"n": 28, "q": "ಕುರಿಗಳು ಅಪರಿಚಿತನನ್ನು ಏಕೆ ಹಿಂಬಾಲಿಸುವುದಿಲ್ಲ?", "a": "ಅಪರಿಚಿತರ ಸ್ವರವನ್ನು ಅವು ಗುರುತಿಸುವುದಿಲ್ಲ", "r": "10:5"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಪರಿಚಿತರ ಸ್ವರವನ್ನು ಅವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರುತಿಸುವುದಿಲ್ಲ", "r": "10:5"}, {"n": 30, "q": "ಯೊವಾನ್ನ 10:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಪರಿಚಿತನನ್ನು ಅವು ಹಿಂಬಾಲಿಸುವುದಿಲ್ಲ; ಅವನಿಂದ ದೂರ ಓಡಿಹೋಗುತ್ತವೆ. ಅಪರಿಚಿತರ ಸ್ವರವನ್ನು ಅವು ಗುರುತಿಸುವುದಿಲ್ಲ.”", "r": "10:5"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಪರಿಚಿತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವು ಗುರುತಿಸುವುದಿಲ್ಲ.”", "a": "ಸ್ವರವನ್ನು", "r": "10:5"}, {"n": 32, "q": "ಯೇಸು ಹೇಳಿದ ಕುರಿಗಾಹಿಯ ಸಾಮತಿಯ ಬಗ್ಗೆ ಕೇಳಿದವರ ಪ್ರತಿಕ್ರಿಯೆ ಏನು?", "a": "ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ", "r": "10:6"}, {"n": 33, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 10:6ರಲ್ಲಿ ಯೇಸುವಿನ ಕುರಿಹಟ್ಟಿಯ ಬೋಧನೆಯನ್ನು ಏನೆಂದು ಕರೆಯಲಾಗಿದೆ?", "a": "ಸಾಮತಿ", "r": "10:6"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ ಈ ಸಾಮತಿಯನ್ನು ಕೇಳಿದವರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "10:6"}, {"n": 35, "q": "“ಯೇಸುಸ್ವಾಮಿ ಹೇಳಿದ ಈ ಸಾಮತಿಯನ್ನು ಕೇಳಿದವರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "10:6"}, {"n": 36, "q": "ಯೊವಾನ್ನ 10:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಹೇಳಿದ ಈ ಸಾಮತಿಯನ್ನು ಕೇಳಿದವರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ.", "r": "10:6"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಹೇಳಿದ ಈ ಸಾಮತಿಯನ್ನು ಕೇಳಿದವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ", "r": "10:6"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಸಾಮತಿಯನ್ನು ಕೇಳಿದವರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲಿಲ್ಲ.”", "a": "ಹೇಳಿದ", "r": "10:6"}, {"n": 39, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 10:7ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಉತ್ತಮ ಕುರಿಗಾಹಿ ಯೇಸು", "r": "10:7"}, {"n": 40, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಕುರಿಗಳಿಗೆ ಏನೆಂದು ಹೇಳಿಕೊಂಡರು?", "a": "“ಕುರಿಗಳಿಗೆ ನಾನೇ ಬಾಗಿಲು.”", "r": "10:7"}, {"n": 41, "q": "ಹತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ “ನಾನೇ” ಎಂಬ ಎರಡು ಘೋಷಣೆಗಳು ಯಾವುವು?", "a": "“ನಾನೇ ಬಾಗಿಲು” (10:7, 9); “ನಾನೇ ಉತ್ತಮ ಕುರಿಗಾಹಿ” (10:11, 14)", "r": "10:7; 10:9; 10:11; 10:14"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "10:7"}, {"n": 43, "q": "“ಆದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "10:7"}, {"n": 44, "q": "ಯೊವಾನ್ನ 10:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ, “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಕುರಿಗಳಿಗೆ ನಾನೇ ಬಾಗಿಲು.", "r": "10:7"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "10:7"}, {"n": 46, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರಿಗಿಂತ ಮೊದಲು ಬಂದವರೆಲ್ಲರು ಯಾರು?", "a": "ಕಳ್ಳರು ಹಾಗೂ ಕೊಳ್ಳೆಗಾರರು", "r": "10:8"}, {"n": 47, "q": "ಯೇಸುವಿಗಿಂತ ಮೊದಲು ಬಂದ ಕಳ್ಳರಿಗೆ ಕುರಿಗಳು ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಕಿವಿಗೊಡಲಿಲ್ಲ", "r": "10:8"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮೊದಲು ಬಂದವರೆಲ್ಲರು ಕಳ್ಳರು ಹಾಗೂ ಕೊಳ್ಳೆಗಾರರು, ಕುರಿಗಳು ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಿವಿಗೊಡಲಿಲ್ಲ", "r": "10:8"}, {"n": 49, "q": "“ನನಗಿಂತ ಮೊದಲು ಬಂದವರೆಲ್ಲರು ಕಳ್ಳರು ಹಾಗೂ ಕೊಳ್ಳೆಗಾರರು, ಕುರಿಗಳು ಅವರಿಗೆ ಕಿವಿಗೊಡಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "10:8"}, {"n": 50, "q": "ಯೊವಾನ್ನ 10:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗಿಂತ ಮೊದಲು ಬಂದವರೆಲ್ಲರು ಕಳ್ಳರು ಹಾಗೂ ಕೊಳ್ಳೆಗಾರರು, ಕುರಿಗಳು ಅವರಿಗೆ ಕಿವಿಗೊಡಲಿಲ್ಲ.", "r": "10:8"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮೊದಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳ್ಳರು ಹಾಗೂ ಕೊಳ್ಳೆಗಾರರು, ಕುರಿಗಳು ಅವರಿಗೆ ಕಿವಿಗೊಡಲಿಲ್ಲ.”", "a": "ಬಂದವರೆಲ್ಲರು", "r": "10:8"}, {"n": 52, "q": "ಬಾಗಿಲಾದ ಯೇಸುವಿನ ಮೂಲಕ ಒಳಹೋಗುವವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಸುರಕ್ಷಿತನಾಗಿರುತ್ತಾನೆ; ಒಳಗೆ ಹೋಗುತ್ತಾನೆ, ಹೊರಗೆ ಬರುತ್ತಾನೆ; ಮೇವನ್ನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ", "r": "10:9"}, {"n": 53, "q": "ಯೇಸುವಿನ ಮೂಲಕ ಒಳಹೋಗುವವನು ಏನನ್ನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಮೇವನ್ನು", "r": "10:9"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ನಾನೇ ಬಾಗಿಲು, ನನ್ನ ಮೂಲಕ ಒಳಹೋಗುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸುರಕ್ಷಿತನಾಗಿರುತ್ತಾನೆ", "r": "10:9"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಒಳಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೊರಗೆ ಬರುತ್ತಾನೆ;”", "a": "ಹೋಗುತ್ತಾನೆ", "r": "10:9"}, {"n": 56, "q": "“ಹೌದು, ನಾನೇ ಬಾಗಿಲು, ನನ್ನ ಮೂಲಕ ಒಳಹೋಗುವವನು ಸುರಕ್ಷಿತನಾಗಿರುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "10:9"}, {"n": 57, "q": "ಯೊವಾನ್ನ 10:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೌದು, ನಾನೇ ಬಾಗಿಲು, ನನ್ನ ಮೂಲಕ ಒಳಹೋಗುವವನು ಸುರಕ್ಷಿತನಾಗಿರುತ್ತಾನೆ. ಅವನು ಒಳಗೆ ಹೋಗುತ್ತಾನೆ, ಹೊರಗೆ ಬರುತ್ತಾನೆ; ಮೇವನ್ನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ.", "r": "10:9"}, {"n": 58, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕಳ್ಳನು ಬರುವುದು ಯಾವ ಮೂರು ಉದ್ದೇಶಗಳಿಗಾಗಿ?", "a": "ಕಳ್ಳತನಕ್ಕಾಗಿ, ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ ಮತ್ತು ನಾಶಮಾಡುವುದಕ್ಕಾಗಿ", "r": "10:10"}, {"n": 59, "q": "ಯೇಸು ಬಂದದ್ದು ಏಕೆ?", "a": "ಜೀವನೀಡಲು, ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು", "r": "10:10"}, {"n": 60, "q": "ಕಳ್ಳನ ಮತ್ತು ಯೇಸುವಿನ ಆಗಮನದ ಉದ್ದೇಶಗಳನ್ನು ಹೋಲಿಸಿ.", "a": "ಕಳ್ಳನು ಕಳ್ಳತನ, ಕೊಲೆ, ನಾಶಕ್ಕಾಗಿ ಬರುತ್ತಾನೆ; ಯೇಸು ಜೀವವನ್ನು ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು ಬಂದರು", "r": "10:10"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಳ್ಳನು ಬರುವುದು ಕಳ್ಳತನಕ್ಕಾಗಿ, ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ, ನಾನು ಬಂದದ್ದಾದರೋ ಜೀವನೀಡಲು, ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು.”", "a": "ನಾಶಮಾಡುವುದಕ್ಕಾಗಿ", "r": "10:10"}, {"n": 62, "q": "“ಕಳ್ಳನು ಬರುವುದು ಕಳ್ಳತನಕ್ಕಾಗಿ, ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ ಮತ್ತು ನಾಶಮಾಡುವುದಕ್ಕಾಗಿ ಮಾತ್ರ, ನಾನು ಬಂದದ್ದಾದರೋ ಜೀವನೀಡಲು, ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "10:10"}, {"n": 63, "q": "ಯೊವಾನ್ನ 10:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕಳ್ಳನು ಬರುವುದು ಕಳ್ಳತನಕ್ಕಾಗಿ, ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ ಮತ್ತು ನಾಶಮಾಡುವುದಕ್ಕಾಗಿ ಮಾತ್ರ, ನಾನು ಬಂದದ್ದಾದರೋ ಜೀವನೀಡಲು, ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು.", "r": "10:10"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಳ್ಳನು ಬರುವುದು ಕಳ್ಳತನಕ್ಕಾಗಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ನಾಶಮಾಡುವುದಕ್ಕಾಗಿ ಮಾತ್ರ, ನಾನು ಬಂದದ್ದಾದರೋ ಜೀವನೀಡಲು, ಯಥೇಚ್ಛವಾಗಿ ನೀಡಲು.”", "a": "ಕೊಲ್ಲುವುದಕ್ಕಾಗಿ", "r": "10:10"}, {"n": 65, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಉತ್ತಮ ಕುರಿಗಾಹಿ ಎಂದು ಘೋಷಿಸಿದ ವಚನ ಯಾವುದು?", "a": "“ನಾನೇ ಉತ್ತಮ ಕುರಿಗಾಹಿ. ಉತ್ತಮ ಕುರಿಗಾಹಿಯು ಕುರಿಗಳಿಗೋಸ್ಕರ ತನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾನೆ.”", "r": "10:11"}, {"n": 66, "q": "ಉತ್ತಮ ಕುರಿಗಾಹಿಯು ಕುರಿಗಳಿಗೋಸ್ಕರ ಏನು ಕೊಡುತ್ತಾನೆ?", "a": "ತನ್ನ ಪ್ರಾಣವನ್ನೇ", "r": "10:11"}, {"n": 67, "q": "ಹತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು ತಮ್ಮ ಪ್ರಾಣವನ್ನು ಕೊಡುವ/ಧಾರೆಯೆರೆಯುವ ಬಗ್ಗೆ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "10:11, 10:14–15, 10:17, 10:18", "r": "10:11; 10:15; 10:17; 10:18"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉತ್ತಮ ಕುರಿಗಾಹಿಯು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾನೆ.”", "a": "ಕುರಿಗಳಿಗೋಸ್ಕರ", "r": "10:11"}, {"n": 69, "q": "“ಉತ್ತಮ ಕುರಿಗಾಹಿಯು ಕುರಿಗಳಿಗೋಸ್ಕರ ತನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "10:11"}, {"n": 70, "q": "ಯೊವಾನ್ನ 10:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನಾನೇ ಉತ್ತಮ ಕುರಿಗಾಹಿ. ಉತ್ತಮ ಕುರಿಗಾಹಿಯು ಕುರಿಗಳಿಗೋಸ್ಕರ ತನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾನೆ.", "r": "10:11"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉತ್ತಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿಗಳಿಗೋಸ್ಕರ ತನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾನೆ.”", "a": "ಕುರಿಗಾಹಿಯು", "r": "10:11"}, {"n": 72, "q": "ತೋಳ ಬರುವುದನ್ನು ಕಂಡು ಕುರಿಗಳನ್ನು ಬಿಟ್ಟು ಓಡಿಹೋಗುವವನು ಯಾರು?", "a": "ಕೂಲಿಯಾಳು (ಕುರಿಗಾಹಿಯಾಗಲಿ, ಕುರಿಗಳ ಒಡೆಯನಾಗಲಿ ಅಲ್ಲದವನು)", "r": "10:12"}, {"n": 73, "q": "ತೋಳವು ಬಂದು ಕುರಿಗಳಿಗೆ ಏನು ಮಾಡುತ್ತದೆ?", "a": "ಕುರಿಗಳ ಮೇಲೆ ಎರಗಿ, ಮಂದೆಯನ್ನು ಚದರಿಸುತ್ತದೆ", "r": "10:12"}, {"n": 74, "q": "ಕೂಲಿಯಾಳು ಏನನ್ನು ಕಂಡು ಓಡಿಹೋಗುತ್ತಾನೆ?", "a": "ತೋಳ ಬರುವುದನ್ನು", "r": "10:12"}, {"n": 75, "q": "ಕೂಲಿಯಾಳು ಯಾರಾಗಿರುವುದಿಲ್ಲ?", "a": "ಕುರಿಗಾಹಿಯಾಗಲಿ, ಕುರಿಗಳ ಒಡೆಯನಾಗಲಿ ಅಲ್ಲ", "r": "10:12"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕುರಿಗಳ ಒಡೆಯನಾಗಲಿ ಅಲ್ಲದ ಕೂಲಿಯಾಳು, ತೋಳ ಬರುವುದನ್ನು ಕಂಡದ್ದೇ, ಕುರಿಗಳನ್ನು ಬಿಟ್ಟು ಓಡಿಹೋಗುತ್ತಾನೆ.”", "a": "ಕುರಿಗಾಹಿಯಾಗಲಿ", "r": "10:12"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತೋಳವು ಬಂದು ಕುರಿಗಳ ಮೇಲೆ ಎರಗಿ, ಮಂದೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಚದರಿಸುತ್ತದೆ", "r": "10:12"}, {"n": 78, "q": "“ಕುರಿಗಾಹಿಯಾಗಲಿ, ಕುರಿಗಳ ಒಡೆಯನಾಗಲಿ ಅಲ್ಲದ ಕೂಲಿಯಾಳು, ತೋಳ ಬರುವುದನ್ನು ಕಂಡದ್ದೇ, ಕುರಿಗಳನ್ನು ಬಿಟ್ಟು ಓಡಿಹೋಗುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "10:12"}, {"n": 79, "q": "ಯೊವಾನ್ನ 10:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕುರಿಗಾಹಿಯಾಗಲಿ, ಕುರಿಗಳ ಒಡೆಯನಾಗಲಿ ಅಲ್ಲದ ಕೂಲಿಯಾಳು, ತೋಳ ಬರುವುದನ್ನು ಕಂಡದ್ದೇ, ಕುರಿಗಳನ್ನು ಬಿಟ್ಟು ಓಡಿಹೋಗುತ್ತಾನೆ. ತೋಳವು ಬಂದು ಕುರಿಗಳ ಮೇಲೆ ಎರಗಿ, ಮಂದೆಯನ್ನು ಚದರಿಸುತ್ತದೆ.", "r": "10:12"}, {"n": 80, "q": "ಕೂಲಿಯಾಳು ಕುರಿಗಳನ್ನು ಬಿಟ್ಟು ಏಕೆ ಓಡಿಹೋಗುತ್ತಾನೆ?", "a": "ಅವನು ಕೇವಲ ಕೂಲಿಯಾಳು; ಕುರಿಗಳ ಚಿಂತೆ ಅವನಿಗಿಲ್ಲ", "r": "10:13"}, {"n": 81, "q": "ಯೊವಾನ್ನ 10:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು ಕೇವಲ ಕೂಲಿಯಾಳು; ಕುರಿಗಳ ಚಿಂತೆ ಅವನಿಗಿಲ್ಲ.", "r": "10:13"}, {"n": 82, "q": "ಯೇಸು ತಮಗೂ ಪಿತನಿಗೂ ಇರುವ ಅರಿವನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದರು?", "a": "ತಮಗೂ ತಮ್ಮ ಕುರಿಗಳಿಗೂ ಇರುವ ಅರಿವಿಗೆ (ಪಿತನು ನನ್ನನ್ನು ಬಲ್ಲರು, ನಾನೂ ಪಿತನನ್ನು ಬಲ್ಲೆ; ಅಂತೆಯೇ ನಾನು ನನ್ನ ಕುರಿಗಳನ್ನು ಬಲ್ಲೆನು; ಅವು ನನ್ನನ್ನು ಬಲ್ಲವು)", "r": "10:14–15"}, {"n": 83, "q": "ಉತ್ತಮ ಕುರಿಗಾಹಿಯಾದ ಯೇಸು ಕುರಿಗಳಿಗೋಸ್ಕರ ಏನು ಮಾಡುತ್ತಾರೆ?", "a": "ತಮ್ಮ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತಾರೆ", "r": "10:14–15"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನಾನು ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲ್ಲೆನು;”", "a": "ಕುರಿಗಳನ್ನು", "r": "10:14–15"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ನನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತೇನೆ.”", "a": "ಅವುಗಳಿಗೋಸ್ಕರ", "r": "10:14–15"}, {"n": 86, "q": "“ಅಂತೆಯೇ ನಾನು ನನ್ನ ಕುರಿಗಳನ್ನು ಬಲ್ಲೆನು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14–15", "r": "10:14–15"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನಾನು ನನ್ನ ಕುರಿಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಬಲ್ಲೆನು", "r": "10:14–15"}, {"n": 88, "q": "ಯೊವಾನ್ನ 10:14–15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ಉತ್ತಮ ಕುರಿಗಾಹಿ. ಪಿತನು ನನ್ನನ್ನು ಬಲ್ಲರು; ನಾನೂ ಪಿತನನ್ನು ಬಲ್ಲೆ. ಅಂತೆಯೇ ನಾನು ನನ್ನ ಕುರಿಗಳನ್ನು ಬಲ್ಲೆನು; ಅವು ನನ್ನನ್ನು ಬಲ್ಲವು. ಅವುಗಳಿಗೋಸ್ಕರ ನಾನು ನನ್ನ ಪ್ರಾಣವನ್ನೇ ಕೊಡುತ್ತೇನೆ.", "r": "10:14–15"}, {"n": 89, "q": "ಯೇಸುವಿಗೆ ಈ ಮಂದೆಗೆ ಸೇರದ ಏನಿವೆ?", "a": "ಬೇರೆ ಕುರಿಗಳು", "r": "10:16"}, {"n": 90, "q": "ಬೇರೆ ಕುರಿಗಳನ್ನು ಕರೆತಂದ ಮೇಲೆ ಏನಾಗುವುದು?", "a": "ಒಂದೇ ಕುರಿಹಿಂಡು ಆಗುವುದು; ಒಬ್ಬನೇ ಕುರಿಗಾಹಿ ಇರುವನು", "r": "10:16"}, {"n": 91, "q": "ಬೇರೆ ಕುರಿಗಳು ಏನು ಮಾಡುತ್ತವೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ಸ್ವರಕ್ಕೆ ಕಿವಿಗೊಡುತ್ತವೆ", "r": "10:16"}, {"n": 92, "q": "ಬೇರೆ ಕುರಿಗಳ ವಿಷಯದಲ್ಲಿ ಯೇಸು ಏನು ಮಾಡಬೇಕು?", "a": "ಅವನ್ನೂ ಕರೆತರಬೇಕು", "r": "10:16"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಂದೆಗೆ ಸೇರದ ಬೇರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗಿವೆ.”", "a": "ಕುರಿಗಳೂ", "r": "10:16"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವು ಸಹ ನನ್ನ ಸ್ವರಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಿವಿಗೊಡುತ್ತವೆ", "r": "10:16"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಒಂದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗುವುದು.”", "a": "ಕುರಿಹಿಂಡು", "r": "10:16"}, {"n": 96, "q": "“ಈ ಮಂದೆಗೆ ಸೇರದ ಬೇರೆ ಕುರಿಗಳೂ ನನಗಿವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "10:16"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪಿತನಿಗೆ ಅವರಲ್ಲಿ ಏಕೆ ಪ್ರೀತಿ ಇದೆ?", "a": "ಯೇಸು ತಮ್ಮ ಪ್ರಾಣವನ್ನು ಮರಳಿ ಪಡೆಯುವಂತೆ ಅದನ್ನು ಧಾರೆಯೆರೆಯುವುದರಿಂದ", "r": "10:17"}, {"n": 98, "q": "ಯೇಸು ತಮ್ಮ ಪ್ರಾಣವನ್ನು ಏಕೆ ಧಾರೆಯೆರೆಯುತ್ತಾರೆ?", "a": "ಅದನ್ನು ಮರಳಿ ಪಡೆಯುವಂತೆ", "r": "10:17"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನನ್ನ ಪಿತನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿ ಇದೆ.”", "a": "ನನ್ನಲ್ಲಿ", "r": "10:17"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಾಣವನ್ನು ಮರಳಿ ಪಡೆಯುವಂತೆ ನಾನದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಧಾರೆಯೆರೆಯುತ್ತೇನೆ", "r": "10:17"}, {"n": 101, "q": "“ಏಕೆಂದರೆ, ನನ್ನ ಪಿತನಿಗೆ ನನ್ನಲ್ಲಿ ಪ್ರೀತಿ ಇದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "10:17"}, {"n": 102, "q": "ಯೊವಾನ್ನ 10:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಏಕೆಂದರೆ, ನನ್ನ ಪಿತನಿಗೆ ನನ್ನಲ್ಲಿ ಪ್ರೀತಿ ಇದೆ. ನನ್ನ ಪ್ರಾಣವನ್ನು ಮರಳಿ ಪಡೆಯುವಂತೆ ನಾನದನ್ನು ಧಾರೆಯೆರೆಯುತ್ತೇನೆ.", "r": "10:17"}, {"n": 103, "q": "ತಮ್ಮ ಪ್ರಾಣದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನನ್ನ ಪ್ರಾಣವನ್ನು ಯಾರೂ ನನ್ನಿಂದ ಕಸಿದುಕೊಳ್ಳಲಾರರು; ನಾನಾಗಿಯೇ ಅದನ್ನು ಧಾರೆಯೆರೆಯುತ್ತೇನೆ.”", "r": "10:18"}, {"n": 104, "q": "ತಮ್ಮ ಪ್ರಾಣದ ವಿಷಯದಲ್ಲಿ ಯೇಸುವಿಗಿರುವ ಎರಡು ಹಕ್ಕುಗಳು ಯಾವುವು?", "a": "ಅದನ್ನು ಧಾರೆಯೆರೆಯುವ ಹಕ್ಕು; ಅದನ್ನು ಪುನಃ ಪಡೆಯುವ ಹಕ್ಕು", "r": "10:18"}, {"n": 105, "q": "ಪ್ರಾಣವನ್ನು ಧಾರೆಯೆರೆಯುವ ಮತ್ತು ಪುನಃ ಪಡೆಯುವ ಆಜ್ಞೆಯನ್ನು ಯೇಸು ಯಾರಿಂದ ಪಡೆದಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಪಿತನಿಂದ", "r": "10:18"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪ್ರಾಣವನ್ನು ಯಾರೂ ನನ್ನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕಸಿದುಕೊಳ್ಳಲಾರರು", "r": "10:18"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಕ್ಕು ನನಗಿದೆ.”", "a": "ಧಾರೆಯೆರೆಯುವ", "r": "10:18"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಕ್ಕು ಸಹ ನನಗಿದೆ.”", "a": "ಪಡೆಯುವ", "r": "10:18"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಆಜ್ಞೆಯನ್ನು ನಾನು ನನ್ನ ಪಿತನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಪಡೆದಿದ್ದೇನೆ", "r": "10:18"}, {"n": 110, "q": "ಉತ್ತಮ ಕುರಿಗಾಹಿಯ ಮಾತುಗಳನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಏನಾಯಿತು?", "a": "ಮತ್ತೆ ವಾದವೆದ್ದಿತು", "r": "10:19"}, {"n": 111, "q": "ಉತ್ತಮ ಕುರಿಗಾಹಿಯ ಮಾತುಗಳನ್ನು ಕೇಳಿ ವಾದವೆದ್ದದ್ದು ಯಾರಲ್ಲಿ?", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿ", "r": "10:19"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೆ ವಾದವೆದ್ದಿತು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿ", "r": "10:19"}, {"n": 113, "q": "“ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಮತ್ತೆ ವಾದವೆದ್ದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "10:19"}, {"n": 114, "q": "ಯೊವಾನ್ನ 10:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಮತ್ತೆ ವಾದವೆದ್ದಿತು.", "r": "10:19"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಾತುಗಳನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಾದವೆದ್ದಿತು", "r": "10:19"}, {"n": 116, "q": "ಯೆಹೂದ್ಯರಲ್ಲಿ ಹಲವರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ಅವನಿಗೆ ದೆವ್ವಹಿಡಿದಿದೆ; ಅವನೊಬ್ಬ ಹುಚ್ಚ, ಅವನಿಗೇಕೆ ಕಿವಿಗೊಡುತ್ತೀರಿ?”", "r": "10:20"}, {"n": 117, "q": "ಹತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರಲ್ಲಿದ್ದ ಎರಡು ಭಿನ್ನ ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "ಹಲವರು — ದೆವ್ವಹಿಡಿದವನು, ಹುಚ್ಚ; ಉಳಿದವರು — ಇವು ದೆವ್ವಹಿಡಿದವನ ಮಾತುಗಳಲ್ಲ, ದೆವ್ವವು ಕುರುಡನಿಗೆ ಕಣ್ಣು ಕೊಡುವುದುಂಟೆ?", "r": "10:20; 10:21"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಲ್ಲಿ ಹಲವರು, ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ದೆವ್ವಹಿಡಿದಿದೆ", "r": "10:20"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನೊಬ್ಬ ಹುಚ್ಚ, ಅವನಿಗೇಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕಿವಿಗೊಡುತ್ತೀರಿ", "r": "10:20"}, {"n": 120, "q": "ಯೊವಾನ್ನ 10:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರಲ್ಲಿ ಹಲವರು, “ಅವನಿಗೆ ದೆವ್ವಹಿಡಿದಿದೆ; ಅವನೊಬ್ಬ ಹುಚ್ಚ, ಅವನಿಗೇಕೆ ಕಿವಿಗೊಡುತ್ತೀರಿ?” ಎಂದರು.", "r": "10:20"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಲವರು, ಅವನಿಗೆ ದೆವ್ವಹಿಡಿದಿದೆ;”", "a": "ಅವರಲ್ಲಿ", "r": "10:20"}, {"n": 122, "q": "ಉಳಿದ ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಪರವಾಗಿ ಏನೆಂದರು?", "a": "“ಇವು ದೆವ್ವಹಿಡಿದವನ ಮಾತುಗಳೆಂದಿಗೂ ಅಲ್ಲ. ದೆವ್ವವು ಕುರುಡನಿಗೆ ಕಣ್ಣು ಕೊಡುವುದುಂಟೆ?”", "r": "10:21"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಳಿದವರಾದರೋ, ಇವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತುಗಳೆಂದಿಗೂ ಅಲ್ಲ.”", "a": "ದೆವ್ವಹಿಡಿದವನ", "r": "10:21"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೆವ್ವವು ಕುರುಡನಿಗೆ ಕಣ್ಣು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೊಡುವುದುಂಟೆ", "r": "10:21"}, {"n": 125, "q": "“ಉಳಿದವರಾದರೋ, ಇವು ದೆವ್ವಹಿಡಿದವನ ಮಾತುಗಳೆಂದಿಗೂ ಅಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "10:21"}, {"n": 126, "q": "ಯೊವಾನ್ನ 10:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಉಳಿದವರಾದರೋ, “ಇವು ದೆವ್ವಹಿಡಿದವನ ಮಾತುಗಳೆಂದಿಗೂ ಅಲ್ಲ. ದೆವ್ವವು ಕುರುಡನಿಗೆ ಕಣ್ಣು ಕೊಡುವುದುಂಟೆ?” ಎಂದರು.", "r": "10:21"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಳಿದವರಾದರೋ, ಇವು ದೆವ್ವಹಿಡಿದವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ.”", "a": "ಮಾತುಗಳೆಂದಿಗೂ", "r": "10:21"}, {"n": 128, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 10:22ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪರಿತ್ಯಕ್ತರಾದ ಯೇಸು", "r": "10:22"}, {"n": 129, "q": "ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬಾಚರಣೆ ಯಾವ ಕಾಲದಲ್ಲಿ ನಡೆಯುತ್ತಿತ್ತು?", "a": "ಚಳಿಗಾಲ", "r": "10:22"}, {"n": 130, "q": "ಚಳಿಗಾಲದಲ್ಲಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಯಾವ ಹಬ್ಬಾಚರಣೆ ನಡೆಯುತ್ತಿತ್ತು?", "a": "ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬಾಚರಣೆ", "r": "10:22"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬಾಚರಣೆ ನಡೆಯುತ್ತಿತ್ತು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲಿ", "r": "10:22"}, {"n": 132, "q": "“ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬಾಚರಣೆ ನಡೆಯುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "10:22"}, {"n": 133, "q": "ಯೊವಾನ್ನ 10:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದು ಚಳಿಗಾಲವಾಗಿತ್ತು. ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬಾಚರಣೆ ನಡೆಯುತ್ತಿತ್ತು.", "r": "10:22"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಮಹಾದೇವಾಲಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಬ್ಬಾಚರಣೆ ನಡೆಯುತ್ತಿತ್ತು.”", "a": "ಪ್ರತಿಷ್ಠಾಪನೆಯ", "r": "10:22"}, {"n": 135, "q": "ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೇಸು ಎಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿದ್ದರು?", "a": "ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ", "r": "10:23"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿದ್ದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "10:23"}, {"n": 137, "q": "“ಯೇಸುಸ್ವಾಮಿ ಆ ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "10:23"}, {"n": 138, "q": "ಯೊವಾನ್ನ 10:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಆ ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿದ್ದರು.", "r": "10:23"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಆ ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿರುಗಾಡುತ್ತಿದ್ದರು", "r": "10:23"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಆ ದೇವಾಲಯದ ಆವರಣದಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಂಟಪದಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿದ್ದರು.”", "a": "ಸೊಲೋಮೋನನ", "r": "10:23"}, {"n": 141, "q": "ಯೇಸುವನ್ನು ಸುತ್ತುವರಿದ ಯೆಹೂದ್ಯರು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಇನ್ನೆಷ್ಟು ಕಾಲ ನಮ್ಮನ್ನು ಸಂಶಯದಲ್ಲಿರಿಸುವೆ? ನೀನೇ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಆಗಿದ್ದರೆ ನಮಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳು”", "r": "10:24"}, {"n": 142, "q": "ಸೊಲೋಮೋನನ ಮಂಟಪದಲ್ಲಿ ಯೇಸುವನ್ನು ಸುತ್ತುವರಿದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯರು", "r": "10:24"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ಅವರನ್ನು ಸುತ್ತುವರಿದು, ಇನ್ನೆಷ್ಟು ಕಾಲ ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಸಂಶಯದಲ್ಲಿರಿಸುವೆ", "r": "10:24"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಆಗಿದ್ದರೆ ನಮಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳು, ಎಂದರು.”", "a": "ಅಭಿಷಿಕ್ತನಾದ", "r": "10:24"}, {"n": 145, "q": "“ಯೆಹೂದ್ಯರು, ಅವರನ್ನು ಸುತ್ತುವರಿದು, ಇನ್ನೆಷ್ಟು ಕಾಲ ನಮ್ಮನ್ನು ಸಂಶಯದಲ್ಲಿರಿಸುವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "10:24"}, {"n": 146, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನೇ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಆಗಿದ್ದರೆ …”", "a": "“… ನಮಗೆ ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳು, ಎಂದರು.”", "r": "10:24"}, {"n": 147, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿಕೊಡುವವು ಯಾವುವು (10:25)?", "a": "ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ಅವರು ಮಾಡುವ ಕಾರ್ಯಗಳು", "r": "10:25"}, {"n": 148, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಶ್ನೆಗೆ ಯೇಸುವಿನ ಉತ್ತರದ ಆರಂಭ ಏನು?", "a": "“ನಾನು ನಿಮಗೆ ಹೇಳಿಯಾಯಿತು. ಆದರೂ ನೀವು ನಂಬುತ್ತಿಲ್ಲ.”", "r": "10:25"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರತ್ಯುತ್ತರವಾಗಿ, ನಾನು ನಿಮಗೆ ಹೇಳಿಯಾಯಿತು.”", "a": "ಯೇಸು", "r": "10:25"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ನಾನು ಮಾಡುವ ಕಾರ್ಯಗಳೇ ನನ್ನ ಪರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ", "r": "10:25"}, {"n": 151, "q": "“ಯೇಸು ಪ್ರತ್ಯುತ್ತರವಾಗಿ, ನಾನು ನಿಮಗೆ ಹೇಳಿಯಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "10:25"}, {"n": 152, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನ ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ನಾನು …”", "a": "“… ಮಾಡುವ ಕಾರ್ಯಗಳೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ.”", "r": "10:25"}, {"n": 153, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರಿಗೆ ನಂಬಿಕೆ ಏಕೆ ಇಲ್ಲ?", "a": "ಅವರು ಯೇಸುವಿನ ಕುರಿಗಳಲ್ಲ", "r": "10:26"}, {"n": 154, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಏನಲ್ಲ?", "a": "ಕುರಿಗಳಲ್ಲ", "r": "10:26"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, ನೀವು ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುರಿಗಳಲ್ಲ", "r": "10:26"}, {"n": 156, "q": "ಯೊವಾನ್ನ 10:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ನಿಮಗೆ ನಂಬಿಕೆಯೆಂಬುದಿಲ್ಲ. ಕಾರಣ, ನೀವು ನನ್ನ ಕುರಿಗಳಲ್ಲ.", "r": "10:26"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ನನ್ನ ಕುರಿಗಳಲ್ಲ.”", "a": "ಕಾರಣ", "r": "10:26"}, {"n": 158, "q": "ಯೇಸುವಿನ ಕುರಿಗಳ ಬಗ್ಗೆ 10:27ರಲ್ಲಿ ಹೇಳಲಾದ ಮೂರು ವಿಷಯಗಳು ಯಾವುವು?", "a": "ಅವು ಯೇಸುವಿನ ಸ್ವರವನ್ನು ಗುರುತಿಸುತ್ತವೆ; ಯೇಸು ಅವನ್ನು ಬಲ್ಲರು; ಅವು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸುತ್ತವೆ", "r": "10:27"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಕುರಿಗಳಾದರೋ ನನ್ನ ಸ್ವರವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರುತಿಸುತ್ತವೆ", "r": "10:27"}, {"n": 160, "q": "“ನನ್ನ ಕುರಿಗಳಾದರೋ ನನ್ನ ಸ್ವರವನ್ನು ಗುರುತಿಸುತ್ತವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "10:27"}, {"n": 161, "q": "ಯೊವಾನ್ನ 10:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಕುರಿಗಳಾದರೋ ನನ್ನ ಸ್ವರವನ್ನು ಗುರುತಿಸುತ್ತವೆ. ನಾನು ಅವನ್ನು ಬಲ್ಲೆನು. ಅವು ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸುತ್ತವೆ.", "r": "10:27"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಸ್ವರವನ್ನು ಗುರುತಿಸುತ್ತವೆ.”", "a": "ಕುರಿಗಳಾದರೋ", "r": "10:27"}, {"n": 163, "q": "ಯೇಸು ತಮ್ಮ ಕುರಿಗಳಿಗೆ ಏನನ್ನು ಕೊಡುತ್ತಾರೆ?", "a": "ನಿತ್ಯ ಜೀವವನ್ನು", "r": "10:28"}, {"n": 164, "q": "ಯೇಸುವಿನ ಕುರಿಗಳ ಬಗ್ಗೆ ಅವರ ಭರವಸೆ ಏನು?", "a": "ಅವು ಎಂದಿಗೂ ನಾಶ ಆಗುವುದಿಲ್ಲ; ಯೇಸುವಿನ ಕೈಯಿಂದ ಅವನ್ನು ಯಾರೂ ಕಸಿದುಕೊಳ್ಳಲಾರರು", "r": "10:28"}, {"n": 165, "q": "ಕುರಿಗಳನ್ನು ಯಾರ ಕೈಯಿಂದ ಯಾರೂ ಕಸಿದುಕೊಳ್ಳಲಾರರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ಕೈಯಿಂದ (10:28) ಮತ್ತು ಪಿತನ ಕೈಯಿಂದ (10:29)", "r": "10:28; 10:29"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಅವುಗಳಿಗೆ ನಿತ್ಯ ಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಡುತ್ತೇನೆ", "r": "10:28"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವು ಎಂದಿಗೂ ನಾಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಗುವುದಿಲ್ಲ", "r": "10:28"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಕೈಯಿಂದ ಅವನ್ನು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,”", "a": "ಕಸಿದುಕೊಳ್ಳಲಾರರು", "r": "10:28"}, {"n": 169, "q": "“ನಾನು ಅವುಗಳಿಗೆ ನಿತ್ಯ ಜೀವವನ್ನು ಕೊಡುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "10:28"}, {"n": 170, "q": "ಯೇಸುವಿಗೆ ಕುರಿಗಳನ್ನು ಕೊಟ್ಟವರು ಯಾರು ಮತ್ತು ಅವರು ಹೇಗಿದ್ದಾರೆ?", "a": "ಪಿತ; ಸರ್ವಶ್ರೇಷ್ಠರು", "r": "10:29"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ್ನು ನನಗೆ ಕೊಟ್ಟ ಪಿತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸರ್ವಶ್ರೇಷ್ಠರು", "r": "10:29"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ ಕೈಯಿಂದ ಅವನ್ನು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಸಿದುಕೊಳ್ಳಲಾರರು", "r": "10:29"}, {"n": 173, "q": "“ಅವನ್ನು ನನಗೆ ಕೊಟ್ಟ ಪಿತ ಸರ್ವಶ್ರೇಷ್ಠರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "10:29"}, {"n": 174, "q": "ಯೊವಾನ್ನ 10:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನ್ನು ನನಗೆ ಕೊಟ್ಟ ಪಿತ ಸರ್ವಶ್ರೇಷ್ಠರು. ಪಿತನ ಕೈಯಿಂದ ಅವನ್ನು ಯಾರೂ ಕಸಿದುಕೊಳ್ಳಲಾರರು.", "r": "10:29"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೆ ಕೊಟ್ಟ ಪಿತ ಸರ್ವಶ್ರೇಷ್ಠರು.”", "a": "ಅವನ್ನು", "r": "10:29"}, {"n": 176, "q": "ತಮಗೂ ಪಿತನಿಗೂ ಇರುವ ಸಂಬಂಧದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ”", "r": "10:30"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೂ ಪಿತನೂ ಒಂದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಆಗಿದ್ದೇವೆ", "r": "10:30"}, {"n": 178, "q": "“ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "10:30"}, {"n": 179, "q": "ಯೊವಾನ್ನ 10:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ,” ಎಂದರು.", "r": "10:30"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದೇ ಆಗಿದ್ದೇವೆ, ಎಂದರು.”", "a": "ಪಿತನೂ", "r": "10:30"}, {"n": 181, "q": "“ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ” ಎಂದದ್ದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವಿನತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಆಯ್ದುಕೊಂಡರು", "r": "10:31"}, {"n": 182, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 8 ಮತ್ತು 10ನೇ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಯೆಹೂದ್ಯರು ಯೇಸುವಿನತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡ ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "“ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ” ಎಂದಾಗ (8:58–59); “ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ” ಎಂದಾಗ (10:30–31)", "r": "8:59; 10:31"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೆಹೂದ್ಯರು, ಅವರತ್ತ ಬೀರಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಯ್ದುಕೊಂಡರು.”", "a": "ಕಲ್ಲುಗಳನ್ನು", "r": "10:31"}, {"n": 184, "q": "“ಆಗ ಯೆಹೂದ್ಯರು, ಅವರತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಆಯ್ದುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "10:31"}, {"n": 185, "q": "ಯೊವಾನ್ನ 10:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೆಹೂದ್ಯರು, ಅವರತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಆಯ್ದುಕೊಂಡರು.", "r": "10:31"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೆಹೂದ್ಯರು, ಅವರತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಯ್ದುಕೊಂಡರು", "r": "10:31"}, {"n": 187, "q": "ಕಲ್ಲುಗಳನ್ನು ಆಯ್ದುಕೊಂಡ ಯೆಹೂದ್ಯರಿಗೆ ಯೇಸು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಇವುಗಳಲ್ಲಿ ಯಾವುದಕ್ಕಾಗಿ ನನ್ನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯಬೇಕೆಂದಿದ್ದೀರಿ?”", "r": "10:32"}, {"n": 188, "q": "ಯೇಸು ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ಯೆಹೂದ್ಯರ ಮುಂದೆ ಏನು ಮಾಡಿದ್ದರು?", "a": "ಎಷ್ಟೋ ಸತ್ಕಾರ್ಯಗಳನ್ನು", "r": "10:32"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ನಾನು ಎಷ್ಟೋ ಸತ್ಕಾರ್ಯಗಳನ್ನು ನಿಮ್ಮ ಮುಂದೆ ಮಾಡಿದ್ದೇನೆ.”", "a": "ಯೇಸು", "r": "10:32"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವುಗಳಲ್ಲಿ ಯಾವುದಕ್ಕಾಗಿ ನನ್ನ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕಲ್ಲೆಸೆಯಬೇಕೆಂದಿದ್ದೀರಿ", "r": "10:32"}, {"n": 191, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ನಾನು ಎಷ್ಟೋ ಸತ್ಕಾರ್ಯಗಳನ್ನು ನಿಮ್ಮ ಮುಂದೆ ಮಾಡಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "10:32"}, {"n": 192, "q": "ಯೊವಾನ್ನ 10:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ನಾನು ಎಷ್ಟೋ ಸತ್ಕಾರ್ಯಗಳನ್ನು ನಿಮ್ಮ ಮುಂದೆ ಮಾಡಿದ್ದೇನೆ. ಇವುಗಳಲ್ಲಿ ಯಾವುದಕ್ಕಾಗಿ ನನ್ನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯಬೇಕೆಂದಿದ್ದೀರಿ?” ಎಂದರು.", "r": "10:32"}, {"n": 193, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯಬೇಕೆಂದಿದ್ದದ್ದು ಏಕೆ?", "a": "ಸತ್ಕಾರ್ಯಕ್ಕಾಗಿ ಅಲ್ಲ, ದೇವದೂಷಣೆಗಾಗಿ", "r": "10:33"}, {"n": 194, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸುವಿನ ದೇವದೂಷಣೆ ಏನು?", "a": "“ನೀನು ಮನುಷ್ಯ ಮಾತ್ರನು; ಆದರೂ ನಿನ್ನನ್ನೇ ದೇವರನ್ನಾಗಿ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದೀಯೇ”", "r": "10:33"}, {"n": 195, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸು ಯಾರು ಮಾತ್ರ?", "a": "ಮನುಷ್ಯ ಮಾತ್ರನು", "r": "10:33"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ನಿನ್ನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ, ದೇವದೂಷಣೆಗಾಗಿ.”", "a": "ಸತ್ಕಾರ್ಯಕ್ಕಾಗಿ", "r": "10:33"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿನ್ನನ್ನೇ ದೇವರನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಮಾಡಿಕೊಳ್ಳುತ್ತಿದೀಯೇ", "r": "10:33"}, {"n": 198, "q": "“ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ನಿನ್ನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯುವುದು ಸತ್ಕಾರ್ಯಕ್ಕಾಗಿ ಅಲ್ಲ, ದೇವದೂಷಣೆಗಾಗಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "10:33"}, {"n": 199, "q": "ಯೊವಾನ್ನ 10:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, “ನಿನ್ನ ಮೇಲೆ ಕಲ್ಲೆಸೆಯುವುದು ಸತ್ಕಾರ್ಯಕ್ಕಾಗಿ ಅಲ್ಲ, ದೇವದೂಷಣೆಗಾಗಿ. ನೀನು ಮನುಷ್ಯ ಮಾತ್ರನು; ಆದರೂ ನಿನ್ನನ್ನೇ ದೇವರನ್ನಾಗಿ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದೀಯೇ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.", "r": "10:33"}, {"n": 200, "q": "‘ನೀವು ದೇವರುಗಳು’ ಎಂದು ಎಲ್ಲಿ ಬರೆದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಯೆಹೂದ್ಯರ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ", "r": "10:34"}, {"n": 201, "q": "ಯೇಸು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಉಲ್ಲೇಖಿಸಿದ ದೇವರ ಮಾತು ಯಾವುದು?", "a": "‘ನೀವು ದೇವರುಗಳು’", "r": "10:34"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ದೇವರುಗಳು ಎಂದು ದೇವರೇ ಹೇಳಿರುವ ಮಾತು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಬರೆದಿದೆಯಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "10:34"}, {"n": 203, "q": "“ಆಗ ಯೇಸು,  ನೀವು ದೇವರುಗಳು ಎಂದು ದೇವರೇ ಹೇಳಿರುವ ಮಾತು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಬರೆದಿದೆಯಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "10:34"}, {"n": 204, "q": "ಯೊವಾನ್ನ 10:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ ‘ನೀವು ದೇವರುಗಳು’ ಎಂದು ದೇವರೇ ಹೇಳಿರುವ ಮಾತು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಬರೆದಿದೆಯಲ್ಲವೆ?", "r": "10:34"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೇಸು, ನೀವು ದೇವರುಗಳು ಎಂದು ದೇವರೇ ಹೇಳಿರುವ ಮಾತು ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿದೆಯಲ್ಲವೆ?”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ", "r": "10:34"}, {"n": 206, "q": "‘ದೇವರುಗಳು’ ಎಂದು ಕರೆಯಲ್ಪಟ್ಟವರು ಯಾರು?", "a": "ದೇವರ ವಾಕ್ಯವನ್ನು ಪಡೆದವರು", "r": "10:35"}, {"n": 207, "q": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಲಿಖಿತವಾಗಿರುವುದರ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "ನಿರರ್ಥಕವೇನೂ ಅಲ್ಲ", "r": "10:35"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದವರು ದೇವರುಗಳೇ ಎಂದು ಕರೆಯಲಾಗಿದೆ.”", "a": "ವಾಕ್ಯವನ್ನು", "r": "10:35"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಿಖಿತವಾಗಿರುವುದು ನಿರರ್ಥಕವೇನೂ ಅಲ್ಲ.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ", "r": "10:35"}, {"n": 210, "q": "“ದೇವರ ವಾಕ್ಯವನ್ನು ಪಡೆದವರು ದೇವರುಗಳೇ ಎಂದು ಕರೆಯಲಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "10:35"}, {"n": 211, "q": "ಯೊವಾನ್ನ 10:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ವಾಕ್ಯವನ್ನು ಪಡೆದವರು ದೇವರುಗಳೇ ಎಂದು ಕರೆಯಲಾಗಿದೆ. ಹೀಗೆ ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿರುವುದು ನಿರರ್ಥಕವೇನೂ ಅಲ್ಲ.", "r": "10:35"}, {"n": 212, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಏನೆಂದು ಹೇಳಿಕೊಂಡದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ದೇವದೂಷಣೆ ಎಂದರು?", "a": "‘ದೇವರ ಪುತ್ರನಾಗಿದ್ದೇನೆ’", "r": "10:36"}, {"n": 213, "q": "ಯೇಸುವನ್ನು ಪ್ರತಿಷ್ಠಿಸಿ ಕಳುಹಿಸಿಕೊಟ್ಟವರು ಯಾರು?", "a": "ಪಿತನೇ", "r": "10:36"}, {"n": 214, "q": "‘ದೇವರ ಪುತ್ರನಾಗಿದ್ದೇನೆ’ ಎಂದದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "‘ಇವನು ದೇವದೂಷಣೆ ಮಾಡಿದ್ದಾನೆ’", "r": "10:36"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂತಿರುವಲ್ಲಿ, ಪಿತನೇ ಪ್ರತಿಷ್ಠಿಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು, ದೇವರ ಪುತ್ರನಾಗಿದ್ದೇನೆ ಎಂದು ಹೇಳಿಕೊಂಡದ್ದಕ್ಕೆ, ಇವನು ದೇವದೂಷಣೆ ಮಾಡಿದ್ದಾನೆ ಎನ್ನುತ್ತೀರಲ್ಲಾ?”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟವನಾದ", "r": "10:36"}, {"n": 216, "q": "“ಇಂತಿರುವಲ್ಲಿ, ಪಿತನೇ ಪ್ರತಿಷ್ಠಿಸಿ ಕಳುಹಿಸಿಕೊಟ್ಟವನಾದ ನಾನು, ದೇವರ ಪುತ್ರನಾಗಿದ್ದೇನೆ ಎಂದು ಹೇಳಿಕೊಂಡದ್ದಕ್ಕೆ, ಇವನು ದೇವದೂಷಣೆ ಮಾಡಿದ್ದಾನೆ ಎನ್ನುತ್ತೀರಲ್ಲಾ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "10:36"}, {"n": 217, "q": "ಯೊವಾನ್ನ 10:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇಂತಿರುವಲ್ಲಿ, ಪಿತನೇ ಪ್ರತಿಷ್ಠಿಸಿ ಕಳುಹಿಸಿಕೊಟ್ಟವನಾದ ನಾನು, ‘ದೇವರ ಪುತ್ರನಾಗಿದ್ದೇನೆ’ ಎಂದು ಹೇಳಿಕೊಂಡದ್ದಕ್ಕೆ, ‘ಇವನು ದೇವದೂಷಣೆ ಮಾಡಿದ್ದಾನೆ’ ಎನ್ನುತ್ತೀರಲ್ಲಾ?", "r": "10:36"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂತಿರುವಲ್ಲಿ, ಪಿತನೇ ಪ್ರತಿಷ್ಠಿಸಿ ಕಳುಹಿಸಿಕೊಟ್ಟವನಾದ ನಾನು, ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಹೇಳಿಕೊಂಡದ್ದಕ್ಕೆ, ಇವನು ದೇವದೂಷಣೆ ಮಾಡಿದ್ದಾನೆ ಎನ್ನುತ್ತೀರಲ್ಲಾ?”", "a": "ಪುತ್ರನಾಗಿದ್ದೇನೆ", "r": "10:36"}, {"n": 219, "q": "ಯೇಸು ಯಾವಾಗ ನಂಬಬೇಕಾಗಿಲ್ಲ ಎಂದರು?", "a": "ಅವರು ತಮ್ಮ ಪಿತನ ಕಾರ್ಯಗಳನ್ನು ಮಾಡದಿದ್ದರೆ", "r": "10:37"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನನ್ನ ಪಿತನ ಕಾರ್ಯಗಳನ್ನು ಮಾಡದಿದ್ದರೆ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಂಬಬೇಕಾಗಿಲ್ಲ", "r": "10:37"}, {"n": 221, "q": "“ನಾನು ನನ್ನ ಪಿತನ ಕಾರ್ಯಗಳನ್ನು ಮಾಡದಿದ್ದರೆ ನೀವು ನನ್ನನ್ನು ನಂಬಬೇಕಾಗಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "10:37"}, {"n": 222, "q": "ಯೊವಾನ್ನ 10:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನನ್ನ ಪಿತನ ಕಾರ್ಯಗಳನ್ನು ಮಾಡದಿದ್ದರೆ ನೀವು ನನ್ನನ್ನು ನಂಬಬೇಕಾಗಿಲ್ಲ.", "r": "10:37"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನನ್ನ ಪಿತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡದಿದ್ದರೆ ನೀವು ನನ್ನನ್ನು ನಂಬಬೇಕಾಗಿಲ್ಲ.”", "a": "ಕಾರ್ಯಗಳನ್ನು", "r": "10:37"}, {"n": 224, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ನನ್ನ ಪಿತನ ಕಾರ್ಯಗಳನ್ನು …”", "a": "“… ಮಾಡದಿದ್ದರೆ ನೀವು ನನ್ನನ್ನು ನಂಬಬೇಕಾಗಿಲ್ಲ.”", "r": "10:37"}, {"n": 225, "q": "ಯೇಸುವನ್ನು ನಂಬದೆ ಹೋದರೂ ಏನನ್ನಾದರೂ ನಂಬಿರಿ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅವರ ಕಾರ್ಯಗಳನ್ನಾದರೂ", "r": "10:38"}, {"n": 226, "q": "ಯೇಸುವಿನ ಕಾರ್ಯಗಳನ್ನು ನಂಬಿದರೆ ಏನು ಅರಿವಾಗುವುದು?", "a": "ಪಿತನು ಯೇಸುವಿನಲ್ಲಿಯೂ ಯೇಸು ಪಿತನಲ್ಲಿಯೂ ಇರುವುದು", "r": "10:38"}, {"n": 227, "q": "ಪಿತ ಮತ್ತು ಯೇಸುವಿನ ಸಂಬಂಧ ಯೆಹೂದ್ಯರಿಗೆ ಹೇಗಾಗುವುದು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅರಿವಾಗುವುದು ಹಾಗೂ ಮನದಟ್ಟಾಗುವುದು", "r": "10:38"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹಾಗೆ ಮಾಡಿದ್ದೇ ಆದರೆ, ನನ್ನನ್ನು ನಂಬದೆ ಹೋದರೂ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿರಿ.”", "a": "ಕಾರ್ಯಗಳನ್ನಾದರೂ", "r": "10:38"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಪಿತನು ನನ್ನಲ್ಲಿಯೂ ನಾನು ಪಿತನಲ್ಲಿಯೂ ಇರುವುದು ನಿಮಗೆ ಅರಿವಾಗುವುದು ಹಾಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಮನದಟ್ಟಾಗುವುದು", "r": "10:38"}, {"n": 230, "q": "“ನಾನು ಹಾಗೆ ಮಾಡಿದ್ದೇ ಆದರೆ, ನನ್ನನ್ನು ನಂಬದೆ ಹೋದರೂ ನನ್ನ ಕಾರ್ಯಗಳನ್ನಾದರೂ ನಂಬಿರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "10:38"}, {"n": 231, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಪಿತನು ನನ್ನಲ್ಲಿಯೂ ನಾನು ಪಿತನಲ್ಲಿಯೂ …”", "a": "“… ಇರುವುದು ನಿಮಗೆ ಅರಿವಾಗುವುದು ಹಾಗೂ ಮನದಟ್ಟಾಗುವುದು, ಎಂದರು.”", "r": "10:38"}, {"n": 232, "q": "ಯೆಹೂದ್ಯರು ಮತ್ತೊಮ್ಮೆ ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದಾಗ ಏನಾಯಿತು?", "a": "ಯೇಸು ಅವರ ಕೈಯಿಂದ ತಪ್ಪಿಸಿಕೊಂಡರು", "r": "10:39"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮತ್ತೊಮ್ಮೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂಧಿಸಲು ಆ ಯೆಹೂದ್ಯರು ಪ್ರಯತ್ನಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "10:39"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಕೈಯಿಂದ ತಪ್ಪಿಸಿಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "10:39"}, {"n": 235, "q": "“ಮತ್ತೊಮ್ಮೆ ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಆ ಯೆಹೂದ್ಯರು ಪ್ರಯತ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 10ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "10:39"}, {"n": 236, "q": "ಯೊವಾನ್ನ 10:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮತ್ತೊಮ್ಮೆ ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಆ ಯೆಹೂದ್ಯರು ಪ್ರಯತ್ನಿಸಿದರು. ಆದರೆ ಯೇಸು ಅವರ ಕೈಯಿಂದ ತಪ್ಪಿಸಿಕೊಂಡರು.", "r": "10:39"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮತ್ತೊಮ್ಮೆ ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಆ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಯತ್ನಿಸಿದರು", "r": "10:39"}, {"n": 238, "q": "ಯೆಹೂದ್ಯರ ಕೈಯಿಂದ ತಪ್ಪಿಸಿಕೊಂಡ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಿ ತಂಗಿದರು?", "a": "ಜೋರ್ಡನ್ ನದಿಯನ್ನು ದಾಟಿ ಯೊವಾನ್ನನು ಮೊತ್ತ ಮೊದಲು ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಕೊಡುತ್ತಿದ್ದ ಸ್ಥಳಕ್ಕೆ", "r": "10:40"}, {"n": 239, "q": "ಯೇಸು 10:40ರಲ್ಲಿ ತಂಗಿದ ಸ್ಥಳ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ಸ್ಥಳಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?", "a": "ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದ ಬೆಥಾನಿಯ (1:28)", "r": "1:28; 10:40"}, {"n": 240, "q": "ಯೇಸು ದಾಟಿದ ನದಿ ಯ     const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
