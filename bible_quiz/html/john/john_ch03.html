<script id="src" type="application/json">{"title": "ಯೊವಾನ್ನನು ಬರೆದ ಶುಭಸಂದೇಶ", "portion": "ಯೊವಾನ್ನ 1–12", "cover": false, "chapters": [{"chapter": 3, "label": "ಅಧ್ಯಾಯ 3", "verses": 36, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನವಜನ್ಮದ ಸಮಸ್ಯೆ", "r": "3:1"}, {"n": 2, "q": "ಯೇಸುವಿನ ಬಳಿಗೆ ರಾತ್ರಿ ಬಂದ ಫರಿಸಾಯನ ಹೆಸರೇನು?", "a": "ನಿಕೊದೇಮ", "r": "3:1"}, {"n": 3, "q": "ನಿಕೊದೇಮನು ಯಾವ ಪಂಗಡಕ್ಕೆ ಸೇರಿದವನು?", "a": "ಫರಿಸಾಯನು", "r": "3:1"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫರಿಸಾಯನು ಇದ್ದನು.”", "a": "ನಿಕೊದೇಮನೆಂಬ", "r": "3:1"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನಿಕೊದೇಮನೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದನು.”", "a": "ಫರಿಸಾಯನು", "r": "3:1"}, {"n": 6, "q": "ನಿಕೊದೇಮನು ಯಾರಲ್ಲಿ ಒಬ್ಬನು?", "a": "ಯೆಹೂದ್ಯರ ನಾಯಕರಲ್ಲಿ ಒಬ್ಬನು", "r": "3:2"}, {"n": 7, "q": "ನಿಕೊದೇಮನು ಯೇಸುವಿನ ಬಳಿಗೆ ಯಾವಾಗ ಬಂದನು?", "a": "ಒಂದು ರಾತ್ರಿ", "r": "3:2"}, {"n": 8, "q": "ನಿಕೊದೇಮನು ಯೇಸುವನ್ನು ಕುರಿತು ತಾವು ಏನು ಬಲ್ಲೆವು ಎಂದನು?", "a": "“ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "r": "3:2"}, {"n": 9, "q": "ನಿಕೊದೇಮನ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ತಿಳಿಯಲು ಕಾರಣವೇನು?", "a": "ದೇವರು ತನ್ನೊಡನೆ ಇಲ್ಲದ ಹೊರತು ಯೇಸು ಮಾಡುವ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಯಾರಿಂದಲೂ ಮಾಡಲು ಆಗದು", "r": "3:2"}, {"n": 10, "q": "ನಿಕೊದೇಮನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಗುರುದೇವಾ”", "r": "3:2"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಯೆಹೂದ್ಯರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬನು.”", "a": "ನಾಯಕರಲ್ಲಿ", "r": "3:2"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ರಾತ್ರಿ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು, ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "3:2"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತನ್ನೊಡನೆ ಇಲ್ಲದ ಹೊರತು ಯಾರಿದಂಲೂ ತಾವು ಮಾಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲು ಆಗದು, ಎಂದು ಹೇಳಿದನು.”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "3:2"}, {"n": 14, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಒಂದು ರಾತ್ರಿ ಅವನು ಯೇಸುಸ್ವಾಮಿಯ ಬಳಿಗೆ ಬಂದು, …”", "a": "“… ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "r": "3:2"}, {"n": 15, "q": "ನಿಕೊದೇಮನಿಗೆ ಯೇಸು ಸತ್ಯವಾಗಿ ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ”", "r": "3:3"}, {"n": 16, "q": "ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಒಬ್ಬನು ಏನನ್ನು ಸೇರಲಾರ?", "a": "ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು", "r": "3:3"}, {"n": 17, "q": "ನವಜನ್ಮದ ಬಗ್ಗೆ ಯೇಸು ನಿಕೊದೇಮನಿಗೆ “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ” ಎಂದು ಆರಂಭಿಸಿ ಹೇಳಿದ ಎರಡು ಮಾತುಗಳಲ್ಲಿ ದೇವರ ಸಾಮ್ರಾಜ್ಯ ಅಥವಾ ರಾಜ್ಯದ ಬಗ್ಗೆ ಏನು ಹೇಳಿದರು?", "a": "ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ (3:3); ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು (3:5)", "r": "3:3; 3:5"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "3:3"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇರಲಾರ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಾಮ್ರಾಜ್ಯವನ್ನು", "r": "3:3"}, {"n": 20, "q": "“ಆಗ ಯೇಸು, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 21, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು …”", "a": "“… ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ, ಎಂದು ಹೇಳಿದರು.”", "r": "3:3"}, {"n": 22, "q": "ಯೊವಾನ್ನ 3:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ,” ಎಂದು ಹೇಳಿದರು.", "r": "3:3"}, {"n": 23, "q": "ಹೊಸ ಹುಟ್ಟಿನ ಬಗ್ಗೆ ನಿಕೊದೇಮನು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ? ತಾಯಿಯ ಗರ್ಭವನ್ನು ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?”", "r": "3:4"}, {"n": 24, "q": "ನಿಕೊದೇಮನು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಎರಡು ‘ಹೇಗೆ’ ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?” (3:4); “ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” (3:9)", "r": "3:4; 3:9"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?”", "a": "ನಿಕೊದೇಮನು", "r": "3:4"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?”", "a": "ಗರ್ಭವನ್ನು", "r": "3:4"}, {"n": 27, "q": "“ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 28, "q": "ಯೊವಾನ್ನ 3:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, “ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ? ತಾಯಿಯ ಗರ್ಭವನ್ನು ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?” ಎಂದು ಕೇಳಿದನು.", "r": "3:4"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ?”", "a": "ಹುಟ್ಟುವುದಾದರೂ", "r": "3:4"}, {"n": 30, "q": "ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲು ಯಾವುದರಿಂದ ಹುಟ್ಟಬೇಕು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ", "r": "3:5"}, {"n": 31, "q": "“ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸು ನಿಕೊದೇಮನಿಗೆ", "r": "3:5"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "3:5"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರಿನಿಂದಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.”", "a": "ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ", "r": "3:5"}, {"n": 34, "q": "“ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 35, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು …”", "a": "“… ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.”", "r": "3:5"}, {"n": 36, "q": "ಯೊವಾನ್ನ 3:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.", "r": "3:5"}, {"n": 37, "q": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಮತ್ತು ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ಏನಾಗಿರುತ್ತವೆ?", "a": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ; ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ", "r": "3:6"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.”", "a": "ಹುಟ್ಟಿದ್ದು", "r": "3:6"}, {"n": 39, "q": "“ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 40, "q": "ಯೊವಾನ್ನ 3:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.", "r": "3:6"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೈವಮಯ.”", "a": "ಹುಟ್ಟಿದ್ದು", "r": "3:6"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.”", "a": "ಶರೀರಮಯ", "r": "3:6"}, {"n": 43, "q": "ಯಾವುದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ ಎಂದು ಯೇಸು ನಿಕೊದೇಮನಿಗೆ ಹೇಳಿದರು?", "a": "“ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು” ಯೇಸು ಹೇಳಿದ್ದನ್ನು", "r": "3:7"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆರಗಾಗಬೇಕಿಲ್ಲ", "r": "3:7"}, {"n": 45, "q": "“ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 46, "q": "ಯೊವಾನ್ನ 3:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.", "r": "3:7"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.”", "a": "ಪಡೆಯಬೇಕೆಂದು", "r": "3:7"}, {"n": 48, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು …”", "a": "“… ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.”", "r": "3:7"}, {"n": 49, "q": "ದೇವರ ಆತ್ಮನಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಯೇಸು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದರು?", "a": "ಗಾಳಿಗೆ", "r": "3:8"}, {"n": 50, "q": "ಗಾಳಿಯ ಬಗ್ಗೆ ನಮಗೆ ಏನು ತಿಳಿಯದು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂಬುದು", "r": "3:8"}, {"n": 51, "q": "ಗಾಳಿಯ ಯಾವುದು ನಮಗೆ ಕೇಳಿಸುತ್ತದೆ?", "a": "ಅದರ ಸದ್ದು", "r": "3:8"}, {"n": 52, "q": "ಗಾಳಿ ಹೇಗೆ ಬೀಸುತ್ತದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ತನಗೆ ತೋಚಿದ ಕಡೆ", "r": "3:8"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗಾಳಿ ತನಗೆ ತೋಚಿದ ಕಡೆ ಬಿಸುತ್ತದೆ, ಅದರ ಸದ್ದು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕೇಳಿಸುತ್ತದೆ", "r": "3:8"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, ಎಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದು ನಿನಗೆ ತಿಳಿಯದು.”", "a": "ಹೋಗುತ್ತದೆ", "r": "3:8"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಆತ್ಮನಿಂದ ಹುಟ್ಟಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದರಂತೆಯೇ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "3:8"}, {"n": 56, "q": "“ಗಾಳಿ ತನಗೆ ತೋಚಿದ ಕಡೆ ಬಿಸುತ್ತದೆ, ಅದರ ಸದ್ದು ನಿನಗೆ ಕೇಳಿಸುತ್ತದೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "3:8"}, {"n": 57, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, …”", "a": "“… ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂಬುದು ನಿನಗೆ ತಿಳಿಯದು.”", "r": "3:8"}, {"n": 58, "q": "ಯೇಸುವಿನ ವಿವರಣೆ ಕೇಳಿ ನಿಕೊದೇಮನು ಮತ್ತೆ ಏನು ಕೇಳಿದನು?", "a": "“ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?”", "r": "3:9"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?”", "a": "ನಿಕೊದೇಮನು", "r": "3:9"}, {"n": 60, "q": "“ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "3:9"}, {"n": 61, "q": "ಯೊವಾನ್ನ 3:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, “ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” ಎಂದು ಕೇಳಿದನು.", "r": "3:9"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ಸಾಧ್ಯ?”", "a": "ಇದೆಲ್ಲಾ", "r": "3:9"}, {"n": 63, "q": "ಯೇಸು ನಿಕೊದೇಮನನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕ", "r": "3:10"}, {"n": 64, "q": "“ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಮೊದಲು ಕೇಳಿದ ಮರುಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "r": "3:10"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "3:10"}, {"n": 66, "q": "“ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 67, "q": "ಯೊವಾನ್ನ 3:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?", "r": "3:10"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಅರ್ಥವಾಗಲಿಲ್ಲವೆ", "r": "3:10"}, {"n": 69, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ …”", "a": "“… ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "r": "3:10"}, {"n": 70, "q": "‘ನಾವು’ ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡುತ್ತೇವೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನಾವು ಕಂಡದ್ದನ್ನು ಕುರಿತು", "r": "3:11"}, {"n": 71, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಯಾವುದನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಿದ್ಧರಿಲ್ಲ?", "a": "‘ನಮ್ಮ’ ಸಾಕ್ಷ್ಯವನ್ನು", "r": "3:11"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳು:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "3:11"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೆ ತಿಳಿದುದನ್ನೇ ಕುರಿತು ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮಾತನಾಡುತ್ತೇವೆ", "r": "3:11"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡುತ್ತೇವೆ.”", "a": "ಕಂಡದ್ದನ್ನು", "r": "3:11"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಿದ್ಧರಿಲ್ಲ.”", "a": "ಸಾಕ್ಷ್ಯವನ್ನು", "r": "3:11"}, {"n": 76, "q": "“ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ ಕೇಳು:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 77, "q": "ಯೇಸು ಯಾವ ಎರಡು ಲೋಕಗಳ ವಿಷಯಗಳನ್ನು ಹೋಲಿಸಿ ಮಾತನಾಡಿದರು?", "a": "ಭೂಲೋಕದ ವಿಷಯ ಮತ್ತು ಸ್ವರ್ಗಲೋಕದ ವಿಷಯ", "r": "3:12"}, {"n": 78, "q": "ಯೇಸು ಯಾವುದರ ವಿಷಯ ಮಾತನಾಡಿದಾಗಲೇ ಜನರಿಗೆ ವಿಶ್ವಾಸವಿರಲಿಲ್ಲ?", "a": "ಭೂಲೋಕದ ವಿಷಯ", "r": "3:12"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ", "r": "3:12"}, {"n": 80, "q": "“ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 81, "q": "ಯೊವಾನ್ನ 3:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?", "r": "3:12"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಂಟೆ?”", "a": "ವಿಸ್ವಾಸಿಸುವುದು", "r": "3:12"}, {"n": 83, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, …”", "a": "“… ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?”", "r": "3:12"}, {"n": 84, "q": "ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಇಲ್ಲ", "r": "3:13"}, {"n": 85, "q": "ನರಪುತ್ರನು ಎಲ್ಲಿಂದ ಇಳಿದು ಬಂದವರು?", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ", "r": "3:13"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.”", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ", "r": "3:13"}, {"n": 87, "q": "“ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 88, "q": "ಯೊವಾನ್ನ 3:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.", "r": "3:13"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಏರಿಹೋದವರಿಲ್ಲ", "r": "3:13"}, {"n": 90, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ …”", "a": "“… ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.”", "r": "3:13"}, {"n": 91, "q": "ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದವನು ಯಾರು?", "a": "ಮೋಶೆ", "r": "3:14"}, {"n": 92, "q": "ಮೋಶೆ ಸರ್ಪವನ್ನು ಎಲ್ಲಿ ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು?", "a": "ಮರುಭೂಮಿಯಲ್ಲಿ", "r": "3:14"}, {"n": 93, "q": "ಮೋಶೆ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದಂತೆಯೇ ಯಾರನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು?", "a": "ನರಪುತ್ರನನ್ನು", "r": "3:14–15"}, {"n": 94, "q": "ಯೇಸು ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸುವುದನ್ನು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯಾವ ಘಟನೆಗೆ ಹೋಲಿಸಿದರು?", "a": "ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದ ಘಟನೆಗೆ", "r": "3:14"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.”", "a": "ಮೋಶೆ", "r": "3:14"}, {"n": 96, "q": "“ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 97, "q": "ಯೊವಾನ್ನ 3:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.", "r": "3:14"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.”", "a": "ಮರುಭೂಮಿಯಲ್ಲಿ", "r": "3:14"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏರಿಸಿದನು.”", "a": "ಮೇಲಕ್ಕೆ", "r": "3:14"}, {"n": 100, "q": "ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕಾದ ಉದ್ದೇಶವೇನು?", "a": "ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ", "r": "3:15"}, {"n": 101, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ನಿತ್ಯಜೀವದ ಬಗ್ಗೆ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "3:15, 3:16, 3:36", "r": "3:15; 3:16; 3:36"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ", "r": "3:15"}, {"n": 103, "q": "“ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 104, "q": "ಯೊವಾನ್ನ 3:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.", "r": "3:15"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "3:15"}, {"n": 106, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು …”", "a": "“… ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "r": "3:15"}, {"n": 107, "q": "ದೇವರು ಲೋಕವನ್ನು ಪ್ರೀತಿಸಿದ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 3:16 ಏನು ಹೇಳುತ್ತದೆ?", "a": "“ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು”", "r": "3:16"}, {"n": 108, "q": "ದೇವರು ಲೋಕವನ್ನು ಪ್ರೀತಿಸಿ ಏನು ಮಾಡಿದರು?", "a": "ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು", "r": "3:16"}, {"n": 109, "q": "ದೇವರು ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನು ಧಾರೆಯೆರೆದ ಉದ್ದೇಶವೇನು?", "a": "ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದು", "r": "3:16"}, {"n": 110, "q": "ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟು ಪ್ರೀತಿಸಿದರು?", "a": "ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆಯುವಷ್ಟು", "r": "3:16"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು;”", "a": "ಪ್ರೀತಿಸಿದರೆಂದರೆ", "r": "3:16"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಉದ್ದೇಶ.”", "a": "ಪಡೆಯಬೇಕೆಂಬುದೇ", "r": "3:16"}, {"n": 113, "q": "“ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ …”", "a": "“… ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದೇ ದೇವರ ಉದ್ದೇಶ.”", "r": "3:16"}, {"n": 115, "q": "ಯೊವಾನ್ನ 3:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು; ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದೇ ದೇವರ ಉದ್ದೇಶ.", "r": "3:16"}, {"n": 116, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಲೋಕಕ್ಕೆ ಯಾವುದಕ್ಕಾಗಿ ಕಳುಹಿಸಲಿಲ್ಲ?", "a": "ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ", "r": "3:17"}, {"n": 117, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಲೋಕಕ್ಕೆ ಏಕೆ ಕಳುಹಿಸಿದರು?", "a": "ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ ಉದ್ಧಾರವಾಗಲೆಂದು", "r": "3:17"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಗುರಿಮಾಡಲೆಂದಲ್ಲ", "r": "3:17"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉದ್ಧಾರವಾಗಲೆಂದು", "r": "3:17"}, {"n": 120, "q": "“ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "3:17"}, {"n": 121, "q": "ಯೊವಾನ್ನ 3:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ; ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ ಉದ್ಧಾರವಾಗಲೆಂದು.", "r": "3:17"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ;”", "a": "ಕಳುಹಿಸಿದ್ದು", "r": "3:17"}, {"n": 123, "q": "ಯಾರಿಗೆ ತೀರ್ಪಿಲ್ಲ?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನಿಗೆ", "r": "3:18"}, {"n": 124, "q": "ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿರುವವನು ಯಾರು?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನು", "r": "3:18"}, {"n": 125, "q": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನು ಏಕೆ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ?", "a": "ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಲ್ಲದ್ದರಿಂದ", "r": "3:18"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ.”", "a": "ವಿಶ್ವಾಸವಿಡದವನಾದರೋ", "r": "3:18"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲ", "r": "3:18"}, {"n": 128, "q": "“ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "3:18"}, {"n": 129, "q": "ಯೊವಾನ್ನ 3:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನಿಗೆ ತೀರ್ಪಿಲ್ಲ. ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ. ಏಕೆಂದರೆ, ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಲ್ಲ.", "r": "3:18"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಯಾಗಿದ್ದಾನೆ", "r": "3:18"}, {"n": 131, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ‘ಈ ತೀರ್ಪು’ ಏನು?", "a": "ಜ್ಯೋತಿ ಜಗತ್ತಿಗೆ ಬಂದಿತು; ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು", "r": "3:19"}, {"n": 132, "q": "ಮಾನವರು ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನು ಏಕೆ ಅವಲಂಬಿಸಿದರು?", "a": "ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ", "r": "3:19"}, {"n": 133, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 3:19–21ರಲ್ಲಿ ಕೇಡನ್ನು ಮಾಡುವವನು ಮತ್ತು ಸತ್ಯಸಂಧನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು, ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ; ಸತ್ಯಸಂಧನು ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ", "r": "3:19–21"}, {"n": 134, "q": "ಜಗತ್ತಿಗೆ ಏನು ಬಂದಿತು?", "a": "ಜ್ಯೋತಿ", "r": "3:19"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.”", "a": "ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ", "r": "3:19"}, {"n": 136, "q": "“ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "3:19"}, {"n": 137, "q": "ಯೊವಾನ್ನ 3:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ತೀರ್ಪು ಏನೆಂದರೆ: ಜ್ಯೋತಿ ಜಗತ್ತಿಗೆ ಬಂದಿತು; ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.", "r": "3:19"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಲಂಬಿಸಿದರು.”", "a": "ಅಂಧಕಾರವನ್ನೇ", "r": "3:19"}, {"n": 139, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ …”", "a": "“… ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.”", "r": "3:19"}, {"n": 140, "q": "ಯಾರಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು?", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ", "r": "3:20"}, {"n": 141, "q": "ಕೇಡನ್ನು ಮಾಡುವವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಏಕೆ ಸುಳಿಯುವುದಿಲ್ಲ?", "a": "ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು", "r": "3:20"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೇಡನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಕೆಂದರೆ ಆಗದು.”", "a": "ಮಾಡುವವನಿಗೆ", "r": "3:20"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,”", "a": "ಬಯಲಾಗಬಾರದೆಂದು", "r": "3:20"}, {"n": 144, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು ಅವನು …”", "a": "“… ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,”", "r": "3:20"}, {"n": 145, "q": "ಯೊವಾನ್ನ 3:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು. ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು ಅವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,", "r": "3:20"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗದು.”", "a": "ಬೆಳಕೆಂದರೆ", "r": "3:20"}, {"n": 147, "q": "ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುವವನು ಯಾರು?", "a": "ಸತ್ಯಸಂಧನು", "r": "3:21"}, {"n": 148, "q": "ಸತ್ಯಸಂಧನು ಬೆಳಕಿನ ಬಳಿಗೆ ಬಂದು ಏನನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ?", "a": "ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು", "r": "3:21"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಸತ್ಯಸಂಧನಾದರೋ", "r": "3:21"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರ್ಪಡಿಸುತ್ತಾನೆ", "r": "3:21"}, {"n": 151, "q": "ಯೊವಾನ್ನ 3:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸತ್ಯಸಂಧನಾದರೋ ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ. ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ.", "r": "3:21"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಸಂಧನಾದರೋ ಬೆಳಕಿನ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರುತ್ತಾನೆ", "r": "3:21"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾನು ಮಾಡುವುದು ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ.”", "a": "ಮೆಚ್ಚುವುದನ್ನೇ", "r": "3:21"}, {"n": 154, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 3:22ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಯೊವಾನ್ನ", "r": "3:22"}, {"n": 155, "q": "ನಿಕೊದೇಮನೊಂದಿಗಿನ ಸಂಭಾಷಣೆಯ ಬಳಿಕ ಯೇಸು ಶಿಷ್ಯರೊಡನೆ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ", "r": "3:22"}, {"n": 156, "q": "ಜುದೇಯ ಪ್ರಾಂತ್ಯದಲ್ಲಿ ಉಳಿದುಕೊಂಡು ಯೇಸು ಏನು ಮಾಡತೊಡಗಿದರು?", "a": "ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು", "r": "3:22"}, {"n": 157, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಯೇಸು ಮತ್ತು ಯೊವಾನ್ನ ಇಬ್ಬರೂ ಒಂದೇ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ದೀಕ್ಷಾಸ್ನಾನ (ಸ್ನಾನದೀಕ್ಷೆ) ಮಾಡಿಸುತ್ತಿದ್ದರು", "r": "3:22; 3:26"}, {"n": 158, "q": "ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಯೇಸುವಿನೊಡನೆ ಬಂದವರು ಯಾರು?", "a": "ಅವರ ಶಿಷ್ಯರು", "r": "3:22"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "3:22"}, {"n": 160, "q": "“ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "3:22"}, {"n": 161, "q": "ಯೊವಾನ್ನ 3:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.", "r": "3:22"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಸತೊಡಗಿದರು", "r": "3:22"}, {"n": 163, "q": "ಯೊವಾನ್ನನು ಎಲ್ಲಿ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು?", "a": "ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ", "r": "3:23"}, {"n": 164, "q": "ಯೊವಾನ್ನನು ಐನೋನಿನಲ್ಲಿ ಏಕೆ ಸ್ನಾನದೀಕ್ಷೆ ಮಾಡಿಸುತ್ತಿದ್ದನು?", "a": "ಅಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ", "r": "3:23"}, {"n": 165, "q": "ಐನೋನ್ ಎಂಬ ಸ್ಥಳ ಯಾವ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿತ್ತು?", "a": "ಸಾಲಿಮ್", "r": "3:23"}, {"n": 166, "q": "ಐನೋನಿನಲ್ಲಿ ಬಂದು ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಪಡೆಯುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಜನರು", "r": "3:23"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "3:23"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುತ್ತಿದ್ದರು.”", "a": "ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು", "r": "3:23"}, {"n": 169, "q": "“ಅತ್ತ ಯೊವಾನ್ನನು ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "3:23"}, {"n": 170, "q": "ಯೊವಾನ್ನ 3:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅತ್ತ ಯೊವಾನ್ನನು ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು. ಜನರು ಬಂದು ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಪಡೆಯುತ್ತಿದ್ದರು.", "r": "3:23"}, {"n": 171, "q": "ಐನೋನಿನಲ್ಲಿ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದಾಗ ಯೊವಾನ್ನನ ಸ್ಥಿತಿ ಏನಾಗಿತ್ತು?", "a": "ಇನ್ನೂ ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ", "r": "3:24"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ಇನ್ನೂ ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ.”", "a": "ಯೊವಾನ್ನನು", "r": "3:24"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೊವಾನ್ನನು ಆಗ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ", "r": "3:24"}, {"n": 174, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ಯಾವುದರ ಕುರಿತು ವಿವಾದ ಎದ್ದಿತು?", "a": "ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು", "r": "3:25"}, {"n": 175, "q": "ಶುದ್ಧಾಚಾರದ ಬಗ್ಗೆ ವಿವಾದ ಯಾರ ನಡುವೆ ಎದ್ದಿತು?", "a": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ", "r": "3:25"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.”", "a": "ಯೊವಾನ್ನನ", "r": "3:25"}, {"n": 177, "q": "“ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "3:25"}, {"n": 178, "q": "ಯೊವಾನ್ನ 3:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.", "r": "3:25"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿವಾದ ಎದ್ದಿತು.”", "a": "ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ", "r": "3:25"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎದ್ದಿತು", "r": "3:25"}, {"n": 181, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಅವನಿಗೆ ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾವ ದೂರನ್ನು ಇತ್ತರು?", "a": "ಯೇಸುವೇ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದಾನೆ; ಎಲ್ಲರೂ ಆತನ ಬಳಿಗೆ ಹೋಗುತ್ತಿದ್ದಾರೆ", "r": "3:26"}, {"n": 182, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರ ಪ್ರಕಾರ ಯೇಸು ಯೊವಾನ್ನನೊಡನೆ ಎಲ್ಲಿ ಇದ್ದರು?", "a": "ಜೋರ್ಡನಿನ ಆಚೆಕಡೆಯಲ್ಲಿ", "r": "3:26"}, {"n": 183, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಅವನನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಗುರುವೇ”", "r": "3:26"}, {"n": 184, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರ ಪ್ರಕಾರ ಎಲ್ಲರೂ ಯಾರ ಬಳಿಗೆ ಹೋಗುತ್ತಿದ್ದರು?", "a": "ಯೇಸುವಿನ ಬಳಿಗೆ (“ಆತನ ಬಳಿಗೆ”)", "r": "3:26"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು, ಗುರುವೇ, ಜೋರ್ಡನಿನ ಆಚೆಕಡೆಯಲ್ಲಿ ನಿಮ್ಮೊಡನೆ ಒಬ್ಬನು ಇದ್ದನಲ್ಲವೆ?”", "a": "ಯೊವಾನ್ನನ", "r": "3:26"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನನ್ನು ಕುರಿತು ನೀವೇ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳಲಿಲ್ಲವೆ", "r": "3:26"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನೋಡಿ, ಆತನೇ ದೀಕ್ಷಾಸ್ನಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಸುತ್ತಿದ್ದಾನೆ", "r": "3:26"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಲ್ಲರೂ ಆತನ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ದೂರಿತ್ತರು.”", "a": "ಹೋಗುತ್ತಿದ್ದಾರೆ", "r": "3:26"}, {"n": 189, "q": "ಶಿಷ್ಯರ ದೂರಿಗೆ ಯೊವಾನ್ನನು ಕೊಟ್ಟ ಉತ್ತರದ ಮೊದಲ ವಾಕ್ಯ ಯಾವುದು?", "a": "“ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "r": "3:27"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "a": "ಯೊವಾನ್ನನು", "r": "3:27"}, {"n": 191, "q": "“ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "3:27"}, {"n": 192, "q": "ಯೊವಾನ್ನ 3:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, “ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.", "r": "3:27"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಕ್ಕದು.”", "a": "ಮಾನವನಿಗೇನೂ", "r": "3:27"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "a": "ದೇವರು", "r": "3:27"}, {"n": 195, "q": "ಯೊವಾನ್ನನು ತನ್ನ ಬಗ್ಗೆ ಹೇಳಿದ್ದಕ್ಕೆ ತನ್ನ ಶಿಷ್ಯರೇ ಸಾಕ್ಷಿಗಳೆಂದು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "‘ನಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ; ಆತನ ಮುಂದೂತ ಮಾತ್ರ’", "r": "3:28"}, {"n": 196, "q": "ಯೊವಾನ್ನನು ತಾನು ಲೋಕೋದ್ಧಾರಕನಿಗೆ ಏನೆಂದು ಹೇಳಿಕೊಂಡನು?", "a": "ಆತನ ಮುಂದೂತ", "r": "3:28"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ", "r": "3:28"}, {"n": 198, "q": "“ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "3:28"}, {"n": 199, "q": "ಯೊವಾನ್ನ 3:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ; ಆತನ ಮುಂದೂತ ಮಾತ್ರ’ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.", "r": "3:28"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.”", "a": "ಹೇಳಿದ್ದಕ್ಕೆ", "r": "3:28"}, {"n": 201, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು …”", "a": "“… ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.”", "r": "3:28"}, {"n": 202, "q": "ಯೊವಾನ್ನನ ಉದಾಹರಣೆಯಲ್ಲಿ ಮದುಮಗಳು ಯಾರಿಗೆ ಸೇರಿದವಳು?", "a": "ಮದುಮಗನಿಗೆ", "r": "3:29"}, {"n": 203, "q": "ಯೊವಾನ್ನನು ತನ್ನನ್ನು ಮದುವೆಯ ಉದಾಹರಣೆಯಲ್ಲಿ ಯಾರಿಗೆ ಹೋಲಿಸಿಕೊಂಡನು?", "a": "ಮದುಮಗನ ಗೆಳೆಯನಿಗೆ", "r": "3:29"}, {"n": 204, "q": "ಮದುಮಗನ ಗೆಳೆಯನು ಮದುಮಗನ ಸ್ವರ ಕೇಳಿ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಹರ್ಷಿಸುತ್ತಾನೆ", "r": "3:29"}, {"n": 205, "q": "ಯೊವಾನ್ನನು ತಾನೀಗ ಯಾವುದರಿಂದ ಭರಿತನಾಗಿದ್ದೇನೆ ಎಂದನು?", "a": "ಆನಂದದಿಂದ (ಮದುಮಗನ ಗೆಳೆಯನ ಆನಂದದಿಂದ)", "r": "3:29"}, {"n": 206, "q": "ಮದುಮಗನ ಕರೆಗೆ ಪಕ್ಕದಲ್ಲಿದ್ದು ಕಿವಿಗೊಡುವವನು ಯಾರು?", "a": "ಮದುಮಗನ ಗೆಳೆಯ", "r": "3:29"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮದುಮಗನ ಗೆಳೆಯನಾದರೋ ಪಕ್ಕದಲ್ಲಿದ್ದು ಮದುಮಗನ ಕರೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕಿವಿಗೊಡುತ್ತಾನೆ", "r": "3:29"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಸ್ವರ ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹರ್ಷಿಸುತ್ತಾನೆ", "r": "3:29"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಆನಂದದಿಂದ ನಾನೀಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಭರಿತನಾಗಿದ್ದೇನೆ", "r": "3:29"}, {"n": 210, "q": "“ಮದುಮಗನ ಗೆಳೆಯನಾದರೋ ಪಕ್ಕದಲ್ಲಿದ್ದು ಮದುಮಗನ ಕರೆಗೆ ಕಿವಿಗೊಡುತ್ತಾನೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "3:29"}, {"n": 211, "q": "ಯೇಸು ಮತ್ತು ತನ್ನ ಬಗ್ಗೆ ಯೊವಾನ್ನನು ಹೇಳಿದ ಪ್ರಸಿದ್ಧ ಮಾತು ಯಾವುದು?", "a": "“ಆತ ಬೆಳೆಯುತ್ತಿರಬೇಕು, ನಾನು ಅಳಿಯುತ್ತಿರಬೇಕು.”", "r": "3:30"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಅಳಿಯುತ್ತಿರಬೇಕು.”", "a": "ಬೆಳೆಯುತ್ತಿರಬೇಕು", "r": "3:30"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ ಬೆಳೆಯುತ್ತಿರಬೇಕು, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಳಿಯುತ್ತಿರಬೇಕು", "r": "3:30"}, {"n": 214, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 3:31ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪರದಿಂದ ಬಂದವನು", "r": "3:31"}, {"n": 215, "q": "ಎಲ್ಲರಿಗಿಂತ ಮೇಲಾದವನು ಯಾರು?", "a": "ಮೇಲಿಂದ ಬಂದವನು", "r": "3:31"}, {"n": 216, "q": "ಇಹಲೋಕದಿಂದ ಬಂದವನು ಮತ್ತು ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಇಹಲೋಕದಿಂದ ಬಂದವನು ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು, ಲೌಕಿಕವಾದುದನ್ನೇ ಹೇಳುವವನು; ಸ್ವರ್ಗದಿಂದ ಬಂದವನು ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು", "r": "3:31"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲಿಂದ ಬಂದವನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲಾದವನು.”", "a": "ಎಲ್ಲರಿಗಿಂತ", "r": "3:31"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವನು ಆದರೋ ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು;”", "a": "ಇಹಲೋಕದಿಂದ", "r": "3:31"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವನಾದರೋ ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "3:31"}, {"n": 220, "q": "ಯೊವಾನ್ನ 3:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮೇಲಿಂದ ಬಂದವನೇ ಎಲ್ಲರಿಗಿಂತ ಮೇಲಾದವನು. ಇಹಲೋಕದಿಂದ ಬಂದವನು ಆದರೋ ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು; ಅವನು ಲೌಕಿಕವಾದುದನ್ನೇ ಹೇಳುವವನು. ಸ್ವರ್ಗದಿಂದ ಬಂದವನಾದರೋ ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು.", "r": "3:31"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲಿಂದ ಬಂದವನೇ ಎಲ್ಲರಿಗಿಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೇಲಾದವನು", "r": "3:31"}, {"n": 222, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನು ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತು", "r": "3:32"}, {"n": 223, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ಮಾತನ್ನು ಎಷ್ಟು ಜನರು ಅಂಗೀಕರಿಸುತ್ತಾರೆ ಎಂದು ಯೊವಾನ್ನನು ಹೇಳುತ್ತಾನೆ?", "a": "ಯಾರೂ ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ", "r": "3:32"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ", "r": "3:32"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಆತನ ಮಾತನ್ನು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ", "r": "3:32"}, {"n": 226, "q": "“ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "3:32"}, {"n": 227, "q": "ಯೊವಾನ್ನ 3:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ. ಆದರೂ ಆತನ ಮಾತನ್ನು ಯಾರೂ ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ.", "r": "3:32"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ.”", "a": "ಕೇಳಿದ್ದನ್ನೂ", "r": "3:32"}, {"n": 229, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ಏನನ್ನು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ?", "a": "ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು", "r": "3:33"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ", "r": "3:33"}, {"n": 231, "q": "“ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "3:33"}, {"n": 232, "q": "ಯೊವಾನ್ನ 3:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.", "r": "3:33"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.”", "a": "ಅಂಗೀಕರಿಸುವವನು", "r": "3:33"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.”", "a": "ದೇವರು", "r": "3:33"}, {"n": 235, "q": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ಯಾರ ಮಾತುಗಳನ್ನು ಆಡುತ್ತಾನೆ?", "a": "ದೇವರ ಮಾತುಗಳನ್ನೇ", "r": "3:34"}, {"n": 236, "q": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಏಕೆ ಆಡುತ್ತಾನೆ?", "a": "ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪೂರ್ಣವಾಗಿ ಕೊಟ್ಟಿರುವುದರಿಂದ", "r": "3:34"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನು", "r": "3:34"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮ ಅವರನ್ನು ಪೂರ್ಣವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಟ್ಟಿರುತ್ತಾರೆ", "r": "3:34"}, {"n": 239, "q": "“ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "3:34"}, {"n": 240, "q": "ಯೊವಾನ್ನ 3:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ. ಏಕೆಂದರೆ ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮ ಅವರನ್ನು ಪೂರ್ಣವಾಗಿ ಕೊಟ್ಟಿರುತ್ತಾರೆ.", "r": "3:34"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಡುತ್ತಾನೆ.”", "a": "ಮಾತುಗಳನ್ನೇ", "r": "3:34"}, {"n": 242, "q": "ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಏನು ಮಾಡಿದ್ದಾರೆ?", "a": "ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ", "r": "3:35"}, {"n": 243, "q": "ಸರ್ವಸ್ವವನ್ನೂ ಯಾರ ಕೈಗೆ ಕೊಡಲಾಗಿದೆ?", "a": "ಪುತ್ರನ ಕೈಗೆ", "r": "3:35"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಸರ್ವಸ್ವವನ್ನೂ", "r": "3:35"}, {"n": 245, "q": "“ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "3:35"}, {"n": 246, "q": "ಯೊವಾನ್ನ 3:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.", "r": "3:35"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಟ್ಟಿದ್ದಾರೆ", "r": "3:35"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಕೈಗೆ", "r": "3:35"}, {"n": 249, "q": "ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುವವನು ಯಾರು?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು", "r": "3:36"}, {"n": 250, "q": "ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ನಿತ್ಯಜೀವವನ್ನು ಸವಿಯನು; ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "3:36"}, {"n": 251, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು ಯಾವುದಕ್ಕೆ ಗುರಿಯಾಗುತ್ತಾನೆ ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ದೇವರ ಕೋಪಾಗ್ನಿಗೆ", "r": "3:36"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ;”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವನು", "r": "3:36"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸವಿಯನು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "3:36"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "3:36"}, {"n": 255, "q": "“ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "3:36"}, {"n": 256, "q": "ಯೊವಾನ್ನ 3:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ; ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು ನಿತ್ಯಜೀವವನ್ನು ಸವಿಯನು. ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.", "r": "3:36"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
