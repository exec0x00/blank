ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ತೆನೆಗಳನ್ನು; ಆರಿಸಿಕೊಳ್ಳಲಿ", "r": "2:15"}, {"n": 180, "q": "ಕೊಯ್ಯುವಾಗ ಕಟ್ಟುಗಳಿಂದ ಏನು ಮಾಡಬೇಕೆಂದು ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ ಆಜ್ಞೆಯಿತ್ತನು?", "a": "ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕುವಂತೆ", "r": "2:16"}, {"n": 181, "q": "ರೂತಳ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ಆಳುಗಳಿಗೆ ಕೊಟ್ಟ ಕೊನೆಯ ಆಜ್ಞೆ ಏನು?", "a": "“ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ”", "r": "2:16"}, {"n": 182, "q": "ಆಳುಗಳು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿದ ತೆನೆಗಳನ್ನು ಯಾರು ಆಯ್ದುಕೊಳ್ಳಲಿ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ರೂತಳು (“ಅವಳು ಆಯ್ದುಕೊಳ್ಳಲಿ”)", "r": "2:16"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "a": "ತೆನೆಗಳನ್ನು", "r": "2:16"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಜ್ಞೆಯಿತ್ತನು", "r": "2:16"}, {"n": 185, "q": "“ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "a": "ಕಟ್ಟುಗಳಿಂದ", "r": "2:16"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರೂ ಅವಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಆಜ್ಞೆಯಿತ್ತನು.”", "a": "ಗದರಿಸಬೇಡಿ", "r": "2:16"}, {"n": 188, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು …”", "a": "“… ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "r": "2:16"}, {"n": 189, "q": "“ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ, ಎಂದು ಆಜ್ಞೆಯಿತ್ತನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 190, "q": "ರೂತಳು ಯಾವ ಹೊತ್ತಿನವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು?", "a": "ಸಾಯಂಕಾಲದವರೆಗೆ", "r": "2:17"}, {"n": 191, "q": "ರೂತಳು ಆಯ್ದ ತೆನೆಗಳನ್ನು ಬಡಿದಾಗ ಎಷ್ಟು ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು?", "a": "ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು", "r": "2:17"}, {"n": 192, "q": "ರೂತಳು ಆಯ್ದ ತೆನೆಗಳನ್ನು ಬಡಿದಾಗ ಯಾವ ಧಾನ್ಯ ಸಿಕ್ಕಿತು?", "a": "ಜವೆಗೋದಿ", "r": "2:17"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.”", "a": "ರೂತಳು", "r": "2:17"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು.”", "a": "ಚೀಲದಷ್ಟು", "r": "2:17"}, {"n": 195, "q": "“ಅದರಂತೆಯೇ ರೂತಳು ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೇ ರೂತಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.”", "a": "ಸಾಯಂಕಾಲದವರೆಗೆ", "r": "2:17"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು ಜವೆಗೋದಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಿಕ್ಕಿತು", "r": "2:17"}, {"n": 198, "q": "“ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 199, "q": "ಜವೆಗೋದಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋದ ರೂತಳು ಏನು ಮಾಡಿದಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು", "r": "2:18"}, {"n": 200, "q": "ರೂತಳು ತನ್ನ ಆಹಾರದಿಂದ ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ಏನು ಮಾಡಿದಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು", "r": "2:18"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು.”", "a": "ತೆಗೆದುಕೊಂಡು", "r": "2:18"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ತನ್ನ ಆಹಾರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.”", "a": "ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು", "r": "2:18"}, {"n": 203, "q": "“ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸಿದಳು", "r": "2:18"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.”", "a": "ಆಹಾರದಿಂದ", "r": "2:18"}, {"n": 206, "q": "“ಅಂತೆಯೇ ತನ್ನ ಆಹಾರದಿಂದ ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 207, "q": "ರೂತಳು ತಂದ ಜವೆಗೋದಿಯನ್ನು ನೋಡಿ ನವೊಮಿ ಕೇಳಿದ ಎರಡು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ? ಯಾರ ಹೊಲದಲ್ಲಿ ಕೆಲಸಮಾಡಿದೆ?”", "r": "2:19"}, {"n": 208, "q": "ರೂತಳಿಗೆ ದಯೆ ತೋರಿಸಿದವನನ್ನು ನವೊಮಿ ಹೇಗೆ ಹರಸಿದಳು?", "a": "“ನಿನಗೆ ದಯೆ ತೋರಿಸಿದವನಿಗೆ ಶುಭವಾಗಲಿ!”", "r": "2:19"}, {"n": 209, "q": "ತಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲದ ಬಗ್ಗೆ ರೂತಳು ನವೊಮಿಗೆ ಏನೆಂದು ಹೇಳಿದಳು?", "a": "“ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು”", "r": "2:19"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ?”", "a": "ನವೊಮಿ", "r": "2:19"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ದಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭವಾಗಲಿ!”", "a": "ತೋರಿಸಿದವನಿಗೆ", "r": "2:19"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ರೂತಳು, ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದಳು.”", "a": "ಬೋವಜನದು", "r": "2:19"}, {"n": 213, "q": "“ಅದನ್ನು ನೋಡಿ ನವೊಮಿ, ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ?” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 214, "q": "“ಅದಕ್ಕೆ ರೂತಳು, ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು, ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ನೋಡಿ ನವೊಮಿ, ನೀನು ಈ ದಿನ ಎಲ್ಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹಕ್ಕಲಾಯ್ದೆ", "r": "2:19"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ದಯೆ ತೋರಿಸಿದವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಶುಭವಾಗಲಿ", "r": "2:19"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು, ಎಂದು ಹೇಳಿದಳು.”", "a": "ರೂತಳು", "r": "2:19"}, {"n": 218, "q": "ರೂತಳು ಬೋವಜನ ಹೆಸರನ್ನು ಹೇಳಿದಾಗ ನವೊಮಿ ಹೇಗೆ ಪ್ರತಿಕ್ರಿಯಿಸಿದಳು?", "a": "ಆವೇಶದಿಂದ ಹರಸಿದಳು", "r": "2:20"}, {"n": 219, "q": "ಬೋವಜನನ್ನು ಆಶೀರ್ವದಿಸುವಾಗ ನವೊಮಿ ಸರ್ವೇಶ್ವರನನ್ನು ಹೇಗೆ ವರ್ಣಿಸಿದಳು?", "a": "“ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ”", "r": "2:20"}, {"n": 220, "q": "ಸರ್ವೇಶ್ವರ ಯಾರಿಗೆ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುತ್ತಾರೆ ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ", "r": "2:20"}, {"n": 221, "q": "ನವೊಮಿ ಬೋವಜನ ಬಗ್ಗೆ ರೂತಳಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದಳು?", "a": "“ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು”", "r": "2:20"}, {"n": 222, "q": "“ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ” — ಇಲ್ಲಿ ‘ಆ ಮನುಷ್ಯ’ ಯಾರು?", "a": "ಬೋವಜನು", "r": "2:20"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆವೇಶದಿಂದ, ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ ಅವನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "a": "ನವೊಮಿ", "r": "2:20"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹರಸಿ, ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಿಳಿಸಿದಳು.”", "a": "ಪೋಷಿಸಬೇಕಾದವನು", "r": "2:20"}, {"n": 225, "q": "“ಇದನ್ನು ಕೇಳಿದ ನವೊಮಿ ಆವೇಶದಿಂದ, ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ ಅವನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 226, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಎಂದು ಹರಸಿ, ಆ ಮನುಷ್ಯ ನಮಗೆ …”", "a": "“… ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು, ಎಂದು ತಿಳಿಸಿದಳು.”", "r": "2:20"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ನವೊಮಿ ಆವೇಶದಿಂದ, ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ ಅವನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "a": "ವಾಗ್ದಾನಗಳನ್ನು", "r": "2:20"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹರಸಿ, ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದಳು", "r": "2:20"}, {"n": 229, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ನವೊಮಿ ಆವೇಶದಿಂದ, ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ …”", "a": "“… ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ ಅವನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "r": "2:20"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ನವೊಮಿ ಆವೇಶದಿಂದ, ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ವೇಶ್ವರ ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ನೆರವೇರಿಸುವ; ಆಶೀರ್ವದಿಸಲಿ", "r": "2:20"}, {"n": 231, "q": "ಬೋವಜನು ತನಗೆ ಏನು ಹೇಳಿದ್ದಾನೆಂದು ರೂತಳು ನವೊಮಿಗೆ ತಿಳಿಸಿದಳು?", "a": "“ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ”", "r": "2:21"}, {"n": 232, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಎಲ್ಲಿಯವರೆಗೂ ಅವನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದಿತ್ತು?", "a": "ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ", "r": "2:21"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ, ಎಂದಳು.”", "a": "ರೂತಳು", "r": "2:21"}, {"n": 234, "q": "“ಇದಲ್ಲದೆ ರೂತಳು, ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ, ಎಂದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ಸುಗ್ಗಿಕಾಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ, ಎಂದಳು.”", "a": "ತೀರುವವರೆಗೂ", "r": "2:21"}, {"n": 236, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ …”", "a": "“… ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ, ಎಂದಳು.”", "r": "2:21"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದಳು.”", "a": "ಇರಬಹುದೆಂದು; ಹೇಳಿದ್ದಾನೆ", "r": "2:21"}, {"n": 238, "q": "ರೂತಳು ಯಾರ ಸಂಗಡ ಇರುವುದು ಒಳ್ಳೆಯದು ಎಂದು ನವೊಮಿ ಸಲಹೆ ಕೊಟ್ಟಳು?", "a": "“ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು”", "r": "2:22"}, {"n": 239, "q": "ರೂತಳು ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡವೇ ಇರಬೇಕೆಂದು ನವೊಮಿ ಏಕೆ ಸಲಹೆ ಕೊಟ್ಟಳು?", "a": "ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ಅವಳಿಗೆ ತೊಂದರೆಯಾದೀತು ಎಂದು", "r": "2:22"}, {"n": 240, "q": "ನವೊಮಿ ರೂತಳಿಗೆ ಸಲಹೆ ಕೊಡುವಾಗ ಅವಳನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದಳು?", "a": "“ಮಗಳೇ”", "r": "2:22"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಸೊಸೆಗೆ, ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "a": "ನವೊಮಿ", "r": "2:22"}, {"n": 242, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.”", "a": "ತೊಂದರೆಯಾದೀತು", "r": "2:22"}, {"n": 243, "q": "“ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "a": "ಹೆಣ್ಣಾಳುಗಳ", "r": "2:22"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇರೆಯವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ತೊಂದರೆಯಾದೀತು, ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.”", "a": "ಹೊಲದಲ್ಲಿ", "r": "2:22"}, {"n": 246, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ಹೌದು, ಮಗಳೇ, …”", "a": "“… ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "r": "2:22"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಇರುವುದೇ; ಒಳ್ಳೆಯದು", "r": "2:22"}, {"n": 248, "q": "“ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ನಿನಗೆ ತೊಂದರೆಯಾದೀತು, ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 249, "q": "ರೂತಳು ಯಾವ ಸುಗ್ಗಿಗಳು ಮುಗಿಯುವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ", "r": "2:23"}, {"n": 250, "q": "ಸುಗ್ಗಿಕಾಲದಲ್ಲಿ ರೂತಳು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಳು?", "a": "ಅತ್ತೆಯ ಮನೆಯಲ್ಲೇ", "r": "2:23"}, {"n": 251, "q": "ಸುಗ್ಗಿ ಮುಗಿಯುವವರೆಗೂ ರೂತಳು ಯಾರ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು?", "a": "ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ", "r": "2:23"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "a": "ರೂತಳು", "r": "2:23"}, {"n": 253, "q": "“ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "2:23"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "a": "ಬೋವಜನ", "r": "2:23"}, {"n": 255, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ …”", "a": "“… ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "r": "2:23"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಳು;”", "a": "ಮುಗಿಯವವರೆಗೂ; ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ", "r": "2:23"}]}, {"chapter": 3, "label": "ಅಧ್ಯಾಯ 3", "verses": 18, "questions": [{"n": 1, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ವಿಭಾಗ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಮದುವೆಯ ಪ್ರಸ್ತಾಪ", "r": "3:1"}, {"n": 2, "q": "ನವೊಮಿ ರೂತಳಿಗೆ ತನ್ನ ಕರ್ತವ್ಯವೆಂದು ಹೇಳಿದ್ದು ಏನು?", "a": "“ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "r": "3:1"}, {"n": 3, "q": "ರೂತಳು ಮತ್ತೆ ಏನಾಗಿ ಸುಖದಿಂದ ಬಾಳಬೇಕೆಂದು ನವೊಮಿ ಬಯಸಿದಳು?", "a": "ಗೃಹಿಣಿಯಾಗಿ", "r": "3:1"}, {"n": 4, "q": "“… ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ನವೊಮಿ ರೂತಳಿಗೆ", "r": "3:1"}, {"n": 5, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ರೂತಳನ್ನು “ಮಗಳೇ” ಎಂದು ಕರೆದ ಇಬ್ಬರು ಯಾರು?", "a": "ನವೊಮಿ (3:1, 18) ಮತ್ತು ಬೋವಜನು (3:10, 11)", "r": "3:1; 3:10; 3:11; 3:18"}, {"n": 6, "q": "ನವೊಮಿ ರೂತಳ ಮದುವೆಯ ವಿಷಯವನ್ನು ಯಾವಾಗ ಪ್ರಸ್ತಾಪಿಸಿದಳು?", "a": "ಒಂದು ದಿನ", "r": "3:1"}, {"n": 7, "q": "“ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ ಬಾಳುವಂತೆ…” — ಈ ಮಾತುಗಳಲ್ಲಿ ‘ಮಗಳು’ ಯಾರು?", "a": "ರೂತಳು", "r": "3:1"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳಿಗೆ:”", "a": "ನವೊಮಿ", "r": "3:1"}, {"n": 9, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕರ್ತವ್ಯವಲ್ಲವೇ", "r": "3:1"}, {"n": 10, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ …”", "a": "“… ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "r": "3:1"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ದಿನ ನವೊಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ರೂತಳಿಗೆ", "r": "3:1"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ನೀನು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಖದಿಂದ ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "a": "ಗೃಹಿಣಿಯಾಗಿ", "r": "3:1"}, {"n": 13, "q": "“ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "3:1"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏರ್ಪಾಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "a": "ಬಾಳುವಂತೆ; ಮಾಡುವುದು", "r": "3:1"}, {"n": 15, "q": "ನವೊಮಿ ಬೋವಜನನ್ನು ರೂತಳಿಗೆ ಹೇಗೆ ಪರಿಚಯಿಸಿದಳು?", "a": "“ಆ ಬೋವಜನು ನಮ್ಮ ನೆಂಟ.”", "r": "3:2"}, {"n": 16, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ಯಾವಾಗ ತೂರುವನು?", "a": "ಈ ಸಂಜೆ", "r": "3:2"}, {"n": 17, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ಬೋವಜನು ಎಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು?", "a": "ಕಣದಲ್ಲಿ", "r": "3:2"}, {"n": 18, "q": "ಆ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ ಏನು ಮಾಡುವನೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು", "r": "3:2"}, {"n": 19, "q": "ನವೊಮಿ ತನ್ನ ಯೋಜನೆಯನ್ನು ಹೇಳುವ ಮೊದಲು ರೂತಳಿಗೆ ಏನೆಂದಳು?", "a": "“ಈಗ ನಾನು ಹೇಳುವುದನ್ನು ಗಮನಿಸು”", "r": "3:2"}, {"n": 20, "q": "ನವೊಮಿ ಮತ್ತು ಬೋವಜನು ಇಬ್ಬರೂ ಬೋವಜನನ್ನು ನವೊಮಿಯ ಕುಟುಂಬಕ್ಕೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "ನೆಂಟ (ಹತ್ತಿರದ ನೆಂಟ)", "r": "3:2; 3:12"}, {"n": 21, "q": "ನವೊಮಿ ಹೇಳಿದಂತೆಯೇ ಬೋವಜನು ಆ ರಾತ್ರಿ ಎಲ್ಲಿ ಮಲಗಿದ್ದನು?", "a": "ಕಣದಲ್ಲಿ, ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ", "r": "3:2; 3:7"}, {"n": 22, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ರೂತಳು ಯಾರ ಜೊತೆಯಲ್ಲಿ ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ", "r": "3:2"}, {"n": 23, "q": "“ಆ ಬೋವಜನು ನಮ್ಮ ನೆಂಟ” ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ನವೊಮಿ", "r": "3:2"}, {"n": 24, "q": "ನವೊಮಿ ರೂತಳಿಗೆ ಬೋವಜನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?”", "r": "3:2"}, {"n": 25, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಘಟನೆ ಯಾವ ಸ್ಥಳದಲ್ಲಿ ನಡೆಯಿತು?", "a": "ಕಣದಲ್ಲಿ (ಜವೆಗೋದಿಯನ್ನು ತೂರುವ ಕಣ)", "r": "3:2; 3:7"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮ ನೆಂಟ.”", "a": "ಬೋವಜನು", "r": "3:2"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ", "r": "3:2"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಮನಿಸು;”", "a": "ಹೇಳುವುದನ್ನು", "r": "3:2"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸಂಜೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.”", "a": "ಬೋವಜನು", "r": "3:2"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಬೋವಜನು ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಂಟ", "r": "3:2"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?”", "a": "ಹೆಣ್ಣಾಳುಗಳ", "r": "3:2"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನಾನು ಹೇಳುವುದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಗಮನಿಸು", "r": "3:2"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೂರುವನು.”", "a": "ಜವೆಗೋದಿಯನ್ನು", "r": "3:2"}, {"n": 34, "q": "“ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "3:2"}, {"n": 35, "q": "“ಈ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "3:2"}, {"n": 36, "q": "ಕಣಕ್ಕೆ ಹೋಗುವ ಮೊದಲು ರೂತಳು ಮಾಡಬೇಕಾದ ಮೂರು ಸಿದ್ಧತೆಗಳೇನು ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "1) ಸ್ನಾನಮಾಡಿಕೊಳ್ಳುವುದು; 2) ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚುವುದು; 3) ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊಳ್ಳುವುದು", "r": "3:3"}, {"n": 37, "q": "ರೂತಳು ಯಾವ ತೈಲವನ್ನು ಹಚ್ಚಿಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಸುಗಂಧ ತೈಲವನ್ನು", "r": "3:3"}, {"n": 38, "q": "ರೂತಳು ಯಾವ ರೀತಿಯ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಸೊಗಸಾದ ಉಡುಪನ್ನು", "r": "3:3"}, {"n": 39, "q": "ಬೋವಜನು ಏನು ಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ರೂತಳು ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬಾರದಿತ್ತು?", "a": "ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ", "r": "3:3"}, {"n": 40, "q": "ಕಣದಲ್ಲಿ ಬೋವಜನ ಊಟದ ಸಮಯದ ಬಗ್ಗೆ ನವೊಮಿ ರೂತಳಿಗೆ ಏನು ಎಚ್ಚರಿಕೆ ಕೊಟ್ಟಳು?", "a": "“ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.”", "r": "3:3"}, {"n": 41, "q": "ನವೊಮಿ ಹೇಳಿಕೊಟ್ಟಂತೆಯೇ ರೂತಳು ಬೋವಜನ ಪಾದಗಳ ಹೊದಿಕೆಯನ್ನು ಹೇಗೆ ಸರಿಸಿದಳು?", "a": "ಮೆತ್ತಗೆ ಸರಿಸಿದಳು", "r": "3:3–4; 3:6–7"}, {"n": 42, "q": "ಬೋವಜನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಹೇಗಿದ್ದನು?", "a": "ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:3; 3:7"}, {"n": 43, "q": "ಸಿದ್ಧಳಾದ ಮೇಲೆ ರೂತಳು ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಕಣಕ್ಕೆ", "r": "3:3"}, {"n": 44, "q": "ನವೊಮಿಯ ಸೂಚನೆಯಂತೆ ರೂತಳು ಮೊದಲು ಏನು ಮಾಡಿಕೊಳ್ಳಬೇಕಿತ್ತು?", "a": "ಸ್ನಾನಮಾಡಿಕೊಳ್ಳಬೇಕಿತ್ತು", "r": "3:3"}, {"n": 45, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ರೂತಳ ಉಡುಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಎರಡು ವಸ್ತುಗಳು ಯಾವುವು?", "a": "ಸೊಗಸಾದ ಉಡುಪು (3:3) ಮತ್ತು ಮೇಲ್ಹೊದಿಕೆ (3:15)", "r": "3:3; 3:15"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "a": "ಸ್ನಾನಮಾಡಿಕೊಂಡು", "r": "3:3"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ", "r": "3:3"}, {"n": 48, "q": "“ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "a": "ತೈಲವನ್ನು", "r": "3:3"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಅನ್ನಪಾನಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.”", "a": "ಮುಗಿಸುವವರೆಗೂ", "r": "3:3"}, {"n": 51, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು …”", "a": "“… ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "r": "3:3"}, {"n": 52, "q": "“ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 53, "q": "ಬೋವಜನ ಬಗ್ಗೆ ರೂತಳು ಏನನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ ಎಂಬುದನ್ನು", "r": "3:4"}, {"n": 54, "q": "ಬೋವಜನು ಮಲಗಿದ ಮೇಲೆ ರೂತಳು ಏನು ಮಾಡಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅಲ್ಲಿಗೆ ಹೋಗಿ ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗಬೇಕು", "r": "3:4"}, {"n": 55, "q": "ರೂತಳು ಬೋವಜನ ಯಾವ ಭಾಗದ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಬೇಕಿತ್ತು?", "a": "ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು", "r": "3:4"}, {"n": 56, "q": "ಆಮೇಲೆ ರೂತಳು ಮಾಡಬೇಕಾದುದನ್ನು ಯಾರು ತಿಳಿಸುವರೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "“ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ ತಿಳಿಸುವನು” (ಬೋವಜನು)", "r": "3:4"}, {"n": 57, "q": "ಬೋವಜನು ಮಲಗಿದ ಮೇಲೆ ರೂತಳು ಅವನ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಿ ಎಲ್ಲಿ ಮಲಗಬೇಕಿತ್ತು?", "a": "ಪಕ್ಕದಲ್ಲೇ", "r": "3:4"}, {"n": 58, "q": "ರೂತಳು ಮುಂದೆ ಏನು ಮಾಡಬೇಕೆಂದು ತಿಳಿಸುವವನು ಯಾರು ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಬೋವಜನು (“ಅವನೇ ತಿಳಿಸುವನು”)", "r": "3:4"}, {"n": 59, "q": "ರೂತಳು ಯಾವಾಗ ಬೋವಜನು ಮಲಗಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಹೋಗಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅವನು ಮಲಗಿದ ಮೇಲೆ", "r": "3:4"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಎಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊ.”", "a": "ಮಲಗುತ್ತಾನೆ", "r": "3:4"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಮಲಗಿದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗು.”", "a": "ಅಲ್ಲಿಗೆ", "r": "3:4"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "a": "ಹೊದಿಕೆಯನ್ನು", "r": "3:4"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಮೇಲೆ ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನೇ ತಿಳಿಸುವನು, ಎಂದು ಹೇಳಿದಳು.”", "a": "ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು", "r": "3:4"}, {"n": 64, "q": "“ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ ಎಂಬುದನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 65, "q": "“ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೊತ್ತು ಮಾಡಿಕೊ.”", "a": "ಎಂಬುದನ್ನು", "r": "3:4"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲೆ ಅಲ್ಲಿಗೆ ಹೋಗು.”", "a": "ಮಲಗಿದ", "r": "3:4"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "a": "ಸರಿಸಿಬಿಟ್ಟು", "r": "3:4"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಮೇಲೆ ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದಳು.”", "a": "ತಿಳಿಸುವನು", "r": "3:4"}, {"n": 70, "q": "“ಅವನು ಮಲಗಿದ ಮೇಲೆ ಅಲ್ಲಿಗೆ ಹೋಗು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 71, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು …”", "a": "“… ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "r": "3:4"}, {"n": 72, "q": "“ಆಮೇಲೆ ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ ತಿಳಿಸುವನು, ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 73, "q": "ನವೊಮಿಯ ಸೂಚನೆಗಳಿಗೆ ರೂತಳು ಏನೆಂದು ಮರುತ್ತರಕೊಟ್ಟಳು?", "a": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ”", "r": "3:5"}, {"n": 74, "q": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ರೂತಳು ನವೊಮಿಗೆ", "r": "3:5"}, {"n": 75, "q": "ರೂತಳು ನವೊಮಿಗೆ ಕೊಟ್ಟ ಮಾತನ್ನು ಹೇಗೆ ಉಳಿಸಿಕೊಂಡಳು?", "a": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಹೇಳಿ, ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು", "r": "3:5–6"}, {"n": 76, "q": "ನವೊಮಿಯ ಸೂಚನೆಗಳನ್ನು ಕೇಳಿ “ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಮರುತ್ತರಕೊಟ್ಟವಳು ಯಾರು?", "a": "ರೂತಳು", "r": "3:5"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮರುತ್ತರಕೊಟ್ಟಳು", "r": "3:5"}, {"n": 78, "q": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ, ಎಂದು ಮರುತ್ತರಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಮಾಡುತ್ತೇನೆ, ಎಂದು ಮರುತ್ತರಕೊಟ್ಟಳು.”", "a": "ಹೇಳಿದಂತೆಯೇ", "r": "3:5"}, {"n": 80, "q": "ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಏನು ಮಾಡಿದಳು?", "a": "ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು", "r": "3:6"}, {"n": 81, "q": "ನವೊಮಿ ಹೇಳಿಕೊಟ್ಟಂತೆ ರೂತಳು ಎಲ್ಲಿಗೆ ಹೋದಳು?", "a": "ಕಣಕ್ಕೆ", "r": "3:6"}, {"n": 82, "q": "ರೂತಳು ಕಣದಲ್ಲಿ ಯಾರು ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು?", "a": "ಅತ್ತೆ (ನವೊಮಿ) ಹೇಳಿಕೊಟ್ಟಂತೆ", "r": "3:6"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.”", "a": "ರೂತಳು", "r": "3:6"}, {"n": 84, "q": "“ಅದರಂತೆ ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಳು.”", "a": "ಹೇಳಿಕೊಟ್ಟಂತೆ", "r": "3:6"}, {"n": 86, "q": "ಅನ್ನಪಾನಮಾಡಿದ ನಂತರ ಬೋವಜನು ಹೇಗಿದ್ದನು?", "a": "ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:7"}, {"n": 87, "q": "ಅನ್ನಪಾನಮಾಡಿದ ಮೇಲೆ ಬೋವಜನು ಎಲ್ಲಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು?", "a": "ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ", "r": "3:7"}, {"n": 88, "q": "ರೂತಳು ಬೋವಜನ ಬಳಿಗೆ ಹೇಗೆ ಹೋದಳು?", "a": "ನಿಶ್ಯಬ್ಧವಾಗಿ", "r": "3:7"}, {"n": 89, "q": "ಬೋವಜನಿಗೆ ಯಾವ ಹೊತ್ತಿನಲ್ಲಿ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು?", "a": "ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ", "r": "3:7"}, {"n": 90, "q": "ಬಗ್ಗಿ ನೋಡಿದಾಗ ಬೋವಜನು ಏನನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡನು?", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು", "r": "3:7"}, {"n": 91, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಎಚ್ಚರಗೊಂಡ ಬೋವಜನು ರೂತಳನ್ನು ಏನೆಂದು ಕೇಳಿದನು?", "a": "“ನೀನು ಯಾರು?”", "r": "3:7"}, {"n": 92, "q": "ತನ್ನ ಪಾದಗಳ ಬಳಿ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಮಲಗಿರುವುದನ್ನು ಕಂಡಾಗ ಬೋವಜನ ಸ್ಥಿತಿ ಹೇಗಿತ್ತು?", "a": "ಚಕಿತಗೊಂಡನು", "r": "3:7"}, {"n": 93, "q": "ರೂತಳು ಬೋವಜನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಿದ ನಂತರ ಏನು ಮಾಡಿದಳು?", "a": "ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು", "r": "3:7"}, {"n": 94, "q": "ಬೋವಜನು ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗುವ ಮೊದಲು ಏನು ಮಾಡಿದ್ದನು?", "a": "ಅನ್ನಪಾನಮಾಡಿ ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:7"}, {"n": 95, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಎಚ್ಚರವಾದಾಗ ಬೋವಜನು ಏನು ಮಾಡಿದನು?", "a": "ಬಗ್ಗಿ ನೋಡಿದನು", "r": "3:7"}, {"n": 96, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಬೋವಜನು ತನ್ನ ಪಾದಗಳ ಬಳಿ ಕಂಡದ್ದು ಯಾರನ್ನು?", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳನ್ನು (ರೂತಳನ್ನು)", "r": "3:7"}, {"n": 97, "q": "ಕಣದಲ್ಲಿ ರೂತಳು ಆ ರಾತ್ರಿ ಎಷ್ಟು ಬಾರಿ ಬೋವಜನ ಪಾದಗಳ ಬಳಿ ಮಲಗಿದಳೆಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಎರಡು ಬಾರಿ (ಹೊದಿಕೆ ಸರಿಸಿ ಮಲಗಿಕೊಂಡಳು 3:7; ಬೋವಜನ ಮಾತಿನಂತೆ ಮಲಗಿದಳು 3:14)", "r": "3:7; 3:14"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನ್ನಪಾನಮಾಡಿ ಸಂತುಷ್ಟನಾಗಿದ್ದನು.”", "a": "ಬೋವಜನು", "r": "3:7"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಲಗಿಕೊಂಡನು", "r": "3:7"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಶ್ಯಬ್ಧವಾಗಿ ಅವನ ಬಳಿಗೆ ಹೋದಳು.”", "a": "ರೂತಳು", "r": "3:7"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.”", "a": "ಹೊದಿಕೆಯನ್ನು", "r": "3:7"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುಮಾರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು.”", "a": "ನಡುರಾತ್ರಿಯಲ್ಲಿ", "r": "3:7"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಗ್ಗಿ ನೋಡಿದಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡು, ನೀನು ಯಾರು?”", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳು", "r": "3:7"}, {"n": 104, "q": "“ರೂತಳು ನಿಶ್ಯಬ್ಧವಾಗಿ ಅವನ ಬಳಿಗೆ ಹೋದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 105, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು …”", "a": "“… ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.”", "r": "3:7"}, {"n": 106, "q": "“ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ ಅವನಿಗೆ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 107, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಗ್ಗಿ ನೋಡಿದಾಗ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ …”", "a": "“… ಮಲಗಿರುವುದನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡು, ನೀನು ಯಾರು?”", "r": "3:7"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತ್ತ ಬೋವಜನು ಅನ್ನಪಾನಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:7"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು.”", "a": "ಜವೆಗೋದಿಯ", "r": "3:7"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರೂತಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನ ಬಳಿಗೆ ಹೋದಳು.”", "a": "ನಿಶ್ಯಬ್ಧವಾಗಿ", "r": "3:7"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಲಗಿಕೊಂಡಳು", "r": "3:7"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ ಅವನಿಗೆ ತಟ್ಟನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಚ್ಚರವಾಯಿತು", "r": "3:7"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಗ್ಗಿ ನೋಡಿದಾಗ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಚಕಿತಗೊಂಡು, ನೀನು ಯಾರು?”", "a": "ಮಲಗಿರುವುದನ್ನು", "r": "3:7"}, {"n": 114, "q": "“ಅನಂತರ ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 115, "q": "“ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 116, "q": "“ಬಗ್ಗಿ ನೋಡಿದಾಗ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡು, ನೀನು ಯಾರು?” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 117, "q": "“ನೀನು ಯಾರು?” ಎಂದು ಬೋವಜನು ಕೇಳಿದಾಗ ರೂತಳು ತನ್ನನ್ನು ಹೇಗೆ ಪರಿಚಯಿಸಿಕೊಂಡಳು?", "a": "“ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು.”", "r": "3:8–9"}, {"n": 118, "q": "ರೂತಳು ಬೋವಜನಿಗೆ ತನ್ನ ಮೇಲೆ ಏನನ್ನು ಹಾಕುವಂತೆ ಕೇಳಿಕೊಂಡಳು?", "a": "ಅವನ ಹೊದಿಕೆಯ ಅಂಚನ್ನು", "r": "3:8–9"}, {"n": 119, "q": "ಬೋವಜನು ತನ್ನ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ತನ್ನ ಮೇಲೆ ಹಾಕಬೇಕೆಂದು ರೂತಳು ಯಾವ ಕಾರಣ ಕೊಟ್ಟಳು?", "a": "ಅವನು ತನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ", "r": "3:8–9"}, {"n": 120, "q": "ರೂತಳು ಬೋವಜನನ್ನು ಸಂಬೋಧಿಸಿ ತನ್ನನ್ನು ಏನೆಂದು ಕರೆದುಕೊಂಡಳು?", "a": "“ಒಡೆಯಾ”; “ನಿಮ್ಮ ದಾಸಿ”", "r": "3:8–9"}, {"n": 121, "q": "“ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ” — ಈ ಬೇಡಿಕೆಯನ್ನು ರೂತಳು ಯಾವ ಸಂಬಂಧದ ಆಧಾರದ ಮೇಲೆ ಮಾಡಿದಳು?", "a": "ಬೋವಜನು ತನ್ನ ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವ ಸಂಬಂಧ", "r": "3:8–9"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ರೂತಳು", "r": "3:8–9"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ, ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ಇರುವುದರಿಂದ", "r": "3:8–9"}, {"n": 124, "q": "“ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8–9", "r": "3:8–9"}, {"n": 125, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ …”", "a": "“… ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ, ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "r": "3:8–9"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು.”", "a": "ಒಡೆಯಾ", "r": "3:8–9"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೇಳಿಕೊಂಡಳು", "r": "3:8–9"}, {"n": 128, "q": "“ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ, ಎಂದು ಕೇಳಿಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8–9", "r": "3:8–9"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವುದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ, ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ನೆಂಟರಾಗಿ; ದಯವಿಟ್ಟು", "r": "3:8–9"}, {"n": 130, "q": "ರೂತಳ ಬೇಡಿಕೆ ಕೇಳಿದ ಬೋವಜನು ಮೊದಲು ಅವಳನ್ನು ಹೇಗೆ ಹರಸಿದನು?", "a": "“ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "r": "3:10"}, {"n": 131, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯಾರನ್ನು ಅರಸಲಿಲ್ಲ?", "a": "ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ", "r": "3:10"}, {"n": 132, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಅವನಿಗೆ ತೋರಿದ ವಂಶ ಗೌರವ ಯಾವುದಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು?", "a": "ಇಲ್ಲಿಯವರೆಗೆ ಅವಳು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ", "r": "3:10"}, {"n": 133, "q": "ರೂತಳು ಬೋವಜನಿಗೆ ತೋರಿದ್ದು ಯಾವ ಗೌರವ ಎಂದು ಅವನು ಹೇಳಿದನು?", "a": "ವಂಶ ಗೌರವ", "r": "3:10"}, {"n": 134, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಬೋವಜನು ದೇವರನ್ನು ಯಾವ ಎರಡು ಹೆಸರುಗಳಿಂದ ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಸರ್ವೇಶ್ವರ (3:10); ಜೀವಸ್ವರೂಪರಾದ ದೇವರು (3:13)", "r": "3:10; 3:13"}, {"n": 135, "q": "“ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ” — ಈ ಮಾತನ್ನು ಬೋವಜನು ಯಾವ ಆಶೀರ್ವಾದದ ನಂತರ ಹೇಳಿದನು?", "a": "“ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "r": "3:10"}, {"n": 136, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯೌವನಸ್ಥರ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಬಡ ಅಥವಾ ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನು ಅರಸಲಿಲ್ಲ", "r": "3:10"}, {"n": 137, "q": "ರೂತಳು ಇಲ್ಲಿಯವರೆಗೆ ಯಾರಿಗೆ ಗೌರವ ತೋರಿದ್ದಳೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅತ್ತೆಗೆ", "r": "3:10"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಆಶೀರ್ವದಿಸಲಿ", "r": "3:10"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಬಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ.”", "a": "ಯೌವನಸ್ಥನನ್ನಾಗಲೀ", "r": "3:10"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶ್ರೇಷ್ಠವಾದುದು", "r": "3:10"}, {"n": 141, "q": "“ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "a": "ಸರ್ವೇಶ್ವರ", "r": "3:10"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರಸಲಿಲ್ಲ.”", "a": "ಯೌವನಸ್ಥನನ್ನಾಗಲೀ", "r": "3:10"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶ್ರೇಷ್ಠವಾದುದು.”", "a": "ಗೌರವಕ್ಕಿಂತಲೂ", "r": "3:10"}, {"n": 145, "q": "“ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 146, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು …”", "a": "“… ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.”", "r": "3:10"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.”", "a": "ಇಲ್ಲಿಯವರೆಗೆ; ಅತ್ತೆಗೆ", "r": "3:10"}, {"n": 148, "q": "ರೂತಳ ಭಯವನ್ನು ಹೋಗಲಾಡಿಸಲು ಬೋವಜನು ಏನೆಂದನು?", "a": "“ಮಗಳೇ, ಭಯಪಡಬೇಡ”", "r": "3:11"}, {"n": 149, "q": "ರೂತಳ ಬಗ್ಗೆ ಊರಿಗೆಲ್ಲಾ ಏನು ತಿಳಿದಿದೆ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅವಳು ಸುಗುಣಶೀಲೆ ಎಂದು", "r": "3:11"}, {"n": 150, "q": "ರೂತಳು ಕೇಳಿಕೊಂಡದ್ದನ್ನು ಏನು ಮಾಡುವೆನೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಈಡೇರಿಸುವೆನು", "r": "3:11"}, {"n": 151, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲಿ ‘ಸುಗುಣಶೀಲೆ’ ಎಂದು ಕರೆಯಲ್ಪಟ್ಟವಳು ಯಾರು?", "a": "ರೂತಳು", "r": "3:11"}, {"n": 152, "q": "ರೂತಳು ಸುಗುಣಶೀಲೆ ಎಂದು ಯಾರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಊರಿಗೆಲ್ಲಾ", "r": "3:11"}, {"n": 153, "q": "“ನೀನು ಕೇಳಿಕೊಂಡದ್ದನ್ನು ಈಡೇರಿಸುವೆನು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ವಾಗ್ದಾನ ಮಾಡಿದರು?", "a": "ಬೋವಜನು ರೂತಳಿಗೆ", "r": "3:11"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ;”", "a": "ಸುಗುಣಶೀಲೆ", "r": "3:11"}, {"n": 155, "q": "“ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ;” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದಿದೆ;”", "a": "ಊರಿಗೆಲ್ಲಾ", "r": "3:11"}, {"n": 157, "q": "ರೂತಳನ್ನು ಸಲಹುವ ಯಾವ ಕರ್ತವ್ಯ ತನ್ನದು ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಮೈದುನ ಕರ್ತವ್ಯ", "r": "3:12"}, {"n": 158, "q": "ಬೋವಜನು ತಾನು ರೂತಳ ಕುಟುಂಬಕ್ಕೆ ಏನಾಗಿರುವುದು ನಿಜ ಎಂದು ಒಪ್ಪಿಕೊಂಡನು?", "a": "ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವುದು", "r": "3:12"}, {"n": 159, "q": "ರೂತಳನ್ನು ಸಲಹುವ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ಹೇಳಿದ ಅಡಚಣೆ ಏನು?", "a": "ತನಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ", "r": "3:12"}, {"n": 160, "q": "“ಆದರೆ ನನಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಬೋವಜನು ರೂತಳಿಗೆ", "r": "3:12"}, {"n": 161, "q": "ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿಯ ವಿಷಯದಲ್ಲಿ ಬೋವಜನಿಗಿಂತ ಮೊದಲ ಹಕ್ಕು ಯಾರಿಗಿತ್ತು?", "a": "ಬೋವಜನಿಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನಿಗೆ", "r": "3:12–13"}, {"n": 162, "q": "“ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು” ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ಬೋವಜನು", "r": "3:12"}, {"n": 163, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರಿಲ್ಲದೆ ಉಲ್ಲೇಖಿಸಲಾದ ವ್ಯಕ್ತಿ ಯಾರು?", "a": "ಬೋವಜನಿಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನು", "r": "3:12; 3:13"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜ.”", "a": "ನೆಂಟನಾಗಿರುವುದೇನೋ", "r": "3:12"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು.”", "a": "ನಿನ್ನನ್ನು", "r": "3:12"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನಗಿಂತಲೂ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ", "r": "3:12"}, {"n": 167, "q": "“ನಾನು ನಿಮಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವುದೇನೋ ನಿಜ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಂಟನಾಗಿರುವುದೇನೋ ನಿಜ.”", "a": "ಹತ್ತಿರದ", "r": "3:12"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನದು.”", "a": "ಕರ್ತವ್ಯ", "r": "3:12"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ.”", "a": "ನನಗಿಂತಲೂ", "r": "3:12"}, {"n": 171, "q": "“ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 172, "q": "ಆ ರಾತ್ರಿ ರೂತಳು ಎಲ್ಲಿರಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "“ಈ ರಾತ್ರಿ ಇಲ್ಲೇ ಇರು.”", "r": "3:13"}, {"n": 173, "q": "ಹತ್ತಿರದ ನೆಂಟನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ಯಾವಾಗ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ನಾಳೆ", "r": "3:13"}, {"n": 174, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳದಿದ್ದರೆ ಏನು ಮಾಡುವೆನೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ತಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುವೆನು", "r": "3:13"}, {"n": 175, "q": "ಬೋವಜನು ಯಾರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡಿದನು?", "a": "ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ", "r": "3:13"}, {"n": 176, "q": "ಪ್ರಮಾಣ ಮಾಡಿದ ನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ ಏನೆಂದನು?", "a": "“ಇನ್ನು ನಿಶ್ಚಿಂತಳಾಗಿ ಮಲಗು”", "r": "3:13"}, {"n": 177, "q": "ಹತ್ತಿರದ ನೆಂಟನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಂಡರೆ ಅದರ ಬಗ್ಗೆ ಬೋವಜನು ಏನು ಹೇಳಿದನು?", "a": "ಒಳ್ಳೆಯದು", "r": "3:13"}, {"n": 178, "q": "ಹತ್ತಿರದ ನೆಂಟನ ಬಗ್ಗೆ ಏನನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅವನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು", "r": "3:13"}, {"n": 179, "q": "ಬೋವಜನು ತನ್ನ ಮಾತನ್ನು ದೃಢಪಡಿಸಲು ಏನು ಮಾಡಿದನು?", "a": "ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡಿದನು", "r": "3:13"}, {"n": 180, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಹೇಗೆ ಮಲಗುವಂತೆ ಹೇಳಿದನು?", "a": "ನಿಶ್ಚಿಂತಳಾಗಿ", "r": "3:13"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲೇ ಇರು.”", "a": "ರಾತ್ರಿ", "r": "3:13"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ", "r": "3:13"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳ್ಳೆಯದು.”", "a": "ವಹಿಸಿಕೊಳ್ಳುವುದಾದರೆ", "r": "3:13"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "a": "ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ", "r": "3:13"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಲಗು, ಎಂದನು.”", "a": "ನಿಶ್ಚಿಂತಳಾಗಿ", "r": "3:13"}, {"n": 186, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ …”", "a": "“… ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "r": "3:13"}, {"n": 187, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ …”", "a": "“… ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "r": "3:13"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ರಾತ್ರಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರು.”", "a": "ಇಲ್ಲೇ", "r": "3:13"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "a": "ವಹಿಸಿಕೊಳ್ಳುವನೋ", "r": "3:13"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಅದನ್ನು ವಹಿಸಿಕೊಳ್ಳುವುದಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒಳ್ಳೆಯದು", "r": "3:13"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "a": "ಕರ್ತವ್ಯವನ್ನು", "r": "3:13"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ನಿಶ್ಚಿಂತಳಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ಮಲಗು", "r": "3:13"}, {"n": 193, "q": "“ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ
