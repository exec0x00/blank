ೆದೋರಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "1:1"}, {"n": 13, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ಕಾರಣ ಜುದೇಯ ಪ್ರಾಂತ್ಯದ ಬೆತ್ಲೆಹೇಮ್ ಎಂಬ ಊರಿನವನೊಬ್ಬನು ತನ್ನ …”", "a": "“… ಪತ್ನಿ ಮತ್ತು ಪುತ್ರರಿಬ್ಬರನ್ನು ಕರೆದುಕೊಂಡು ಮೋವಾಬ್ ಎಂಬ ನಾಡಿಗೆ ವಲಸೆ ಹೋದನು.”", "r": "1:1"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲ್ ನಾಡಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಳುತ್ತಿದ್ದಾಗ, ಒಮ್ಮೆ ಕಠಿಣವಾದ ಬರಗಾಲವು ತಲೆದೋರಿತು.”", "a": "ನ್ಯಾಯಸ್ಥಾಪಕರು", "r": "1:1"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ಜುದೇಯ ಪ್ರಾಂತ್ಯದ ಬೆತ್ಲೆಹೇಮ್ ಎಂಬ ಊರಿನವನೊಬ್ಬನು ತನ್ನ ಪತ್ನಿ ಮತ್ತು ಪುತ್ರರಿಬ್ಬರನ್ನು ಕರೆದುಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ನಾಡಿಗೆ ವಲಸೆ ಹೋದನು.”", "a": "ಮೋವಾಬ್", "r": "1:1"}, {"n": 16, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಸ್ರಯೇಲ್ ನಾಡಿನಲ್ಲಿ ನ್ಯಾಯಸ್ಥಾಪಕರು ಆಳುತ್ತಿದ್ದಾಗ, …”", "a": "“… ಒಮ್ಮೆ ಕಠಿಣವಾದ ಬರಗಾಲವು ತಲೆದೋರಿತು.”", "r": "1:1"}, {"n": 17, "q": "ಬೆತ್ಲೆಹೇಮಿನಿಂದ ಮೋವಾಬ್ ನಾಡಿಗೆ ವಲಸೆ ಹೋದವನ ಹೆಸರೇನು?", "a": "ಎಲಿಮೆಲೆಕ್", "r": "1:2"}, {"n": 18, "q": "ಎಲಿಮೆಲೆಕನ ಪತ್ನಿಯ ಹೆಸರೇನು?", "a": "ನವೊಮಿ", "r": "1:2"}, {"n": 19, "q": "ಎಲಿಮೆಲೆಕ್ ಮತ್ತು ನವೊಮಿಯರ ಇಬ್ಬರು ಪುತ್ರರು ಯಾರು?", "a": "ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್", "r": "1:2"}, {"n": 20, "q": "ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬದವರು ಇಸ್ರಯೇಲ್ ವಂಶದ ಯಾವ ಕುಲಕ್ಕೆ ಸೇರಿದವರು?", "a": "ಎಫ್ರಾತಕುಲಕ್ಕೆ", "r": "1:2"}, {"n": 21, "q": "ಎಲಿಮೆಲೆಕ್, ನವೊಮಿ, ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್ ಯಾವ ಊರಿನವರು?", "a": "ಬೆತ್ಲೆಹೇಮಿನವರು", "r": "1:2"}, {"n": 22, "q": "ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನರ ತಂದೆ ಯಾರು?", "a": "ಎಲಿಮೆಲೆಕ್", "r": "1:2"}, {"n": 23, "q": "ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನರ ತಾಯಿ ಯಾರು?", "a": "ನವೊಮಿ", "r": "1:2"}, {"n": 24, "q": "‘ಎಫ್ರಾತಕುಲ’ ಯಾವ ವಂಶಕ್ಕೆ ಸೇರಿದ ಕುಲ?", "a": "ಇಸ್ರಯೇಲ್ ವಂಶಕ್ಕೆ", "r": "1:2"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪತ್ನಿಯ ಹೆಸರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನವೊಮಿ", "r": "1:2"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಹ್ಲೋನ್ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಇಬ್ಬರು ಪುತ್ರರು.”", "a": "ಕಿಲ್ಯೋನ್", "r": "1:2"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ಇಸ್ರಯೇಲ್ ವಂಶದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇರಿದವರು, ಬೆತ್ಲೆಹೇಮಿನವರು.”", "a": "ಎಫ್ರಾತಕುಲಕ್ಕೆ", "r": "1:2"}, {"n": 28, "q": "“ಇವರು ಇಸ್ರಯೇಲ್ ವಂಶದ ಎಫ್ರಾತಕುಲಕ್ಕೆ ಸೇರಿದವರು, ಬೆತ್ಲೆಹೇಮಿನವರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "1:2"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಸರು ನವೊಮಿ.”", "a": "ಪತ್ನಿಯ", "r": "1:2"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಕಿಲ್ಯೋನ್ ಅವರ ಇಬ್ಬರು ಪುತ್ರರು.”", "a": "ಮಹ್ಲೋನ್", "r": "1:2"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಂಶದ ಎಫ್ರಾತಕುಲಕ್ಕೆ ಸೇರಿದವರು, ಬೆತ್ಲೆಹೇಮಿನವರು.”", "a": "ಇಸ್ರಯೇಲ್", "r": "1:2"}, {"n": 32, "q": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಾಗ ಮೊದಲು ಮರಣ ಹೊಂದಿದವನು ಯಾರು?", "a": "ಎಲಿಮೆಲೆಕನು", "r": "1:3"}, {"n": 33, "q": "ಎಲಿಮೆಲೆಕನು ಎಲ್ಲಿ ಮರಣ ಹೊಂದಿದನು?", "a": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ", "r": "1:3"}, {"n": 34, "q": "ಎಲಿಮೆಲೆಕನು ಮರಣ ಹೊಂದಿದ ನಂತರ ವಿಧವೆಯಾದ ನವೊಮಿ ಏನು ಮಾಡಿದಳು?", "a": "ಇಬ್ಬರು ಗಂಡು ಮಕ್ಕಳೊಡನೆ ಅಲ್ಲೇ ಉಳಿದಳು", "r": "1:3"}, {"n": 35, "q": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ವಿಧವೆಯಾದವಳು ಯಾರು?", "a": "ನವೊಮಿ", "r": "1:3"}, {"n": 36, "q": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ನವೊಮಿಯ ಕುಟುಂಬದಲ್ಲಿ ಮೊದಲು ಯಾರು, ಆಮೇಲೆ ಯಾರು ಮರಣಹೊಂದಿದರು?", "a": "ಮೊದಲು ಎಲಿಮೆಲೆಕನು; ಆಮೇಲೆ ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್", "r": "1:3; 1:5"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರಣ ಹೊಂದಿದನು.”", "a": "ಎಲಿಮೆಲೆಕನು", "r": "1:3"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಧವೆಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಬ್ಬರು ಗಂಡು ಮಕ್ಕಳೊಡನೆ ಅಲ್ಲೇ ಉಳಿದಳು.”", "a": "ನವೊಮಿ", "r": "1:3"}, {"n": 39, "q": "“ಇವರು ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಾಗ ಎಲಿಮೆಲೆಕನು ಮರಣ ಹೊಂದಿದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "1:3"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಾಗ ಎಲಿಮೆಲೆಕನು ಮರಣ ಹೊಂದಿದನು.”", "a": "ಮೋವಾಬ್", "r": "1:3"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಧವೆಯಾದ ನವೊಮಿ ಇಬ್ಬರು ಗಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲೇ ಉಳಿದಳು.”", "a": "ಮಕ್ಕಳೊಡನೆ", "r": "1:3"}, {"n": 42, "q": "“ವಿಧವೆಯಾದ ನವೊಮಿ ಇಬ್ಬರು ಗಂಡು ಮಕ್ಕಳೊಡನೆ ಅಲ್ಲೇ ಉಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "1:3"}, {"n": 43, "q": "ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್ ಯಾರನ್ನು ವಿವಾಹ ಆದರು?", "a": "ಮೋವಾಬ್ಯ ಹುಡುಗಿಯರನ್ನು", "r": "1:4"}, {"n": 44, "q": "ನವೊಮಿಯ ಪುತ್ರರು ವಿವಾಹವಾದ ಮೋವಾಬ್ಯ ಹುಡುಗಿಯರ ಹೆಸರುಗಳೇನು?", "a": "ಒರ್ಫಾ ಮತ್ತು ರೂತ್", "r": "1:4"}, {"n": 45, "q": "ನವೊಮಿಯ ಕುಟುಂಬ ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ಸುಮಾರು ಎಷ್ಟು ವರ್ಷಗಳ ಕಾಲ ವಾಸಮಾಡಿತು?", "a": "ಸುಮಾರು ಹತ್ತು ವರ್ಷ", "r": "1:4"}, {"n": 46, "q": "ರೂತ್ ಯಾವ ನಾಡಿನ ಹುಡುಗಿ?", "a": "ಮೋವಾಬ್ ನಾಡಿನ (ಮೋವಾಬ್ಯ ಹುಡುಗಿ)", "r": "1:4"}, {"n": 47, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಆರು ವ್ಯಕ್ತಿಗಳು ಯಾರು?", "a": "1) ಎಲಿಮೆಲೆಕ್; 2) ನವೊಮಿ; 3) ಮಹ್ಲೋನ್; 4) ಕಿಲ್ಯೋನ್; 5) ಒರ್ಫಾ; 6) ರೂತ್", "r": "1:4"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಡುಗರು ಇಬ್ಬರೂ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಡುಗಿಯರನ್ನು ವಿವಾಹ ಆದರು.”", "a": "ಮೋವಾಬ್ಯ", "r": "1:4"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬಳ ಹೆಸರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಇನ್ನೊಬ್ಬಳು ರೂತ್.”", "a": "ಒರ್ಫಾ", "r": "1:4"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಅಲ್ಲಿ ಸುಮಾರು ಹತ್ತು ವರ್ಷಗಳ ಕಾಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂತರ,”", "a": "ವಾಸಮಾಡಿದ", "r": "1:4"}, {"n": 51, "q": "“ಹುಡುಗರು ಇಬ್ಬರೂ, ಮೋವಾಬ್ಯ ಹುಡುಗಿಯರನ್ನು ವಿವಾಹ ಆದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "1:4"}, {"n": 52, "q": "“ಅವರು ಅಲ್ಲಿ ಸುಮಾರು ಹತ್ತು ವರ್ಷಗಳ ಕಾಲ ವಾಸಮಾಡಿದ ನಂತರ,” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "1:4"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಡುಗರು ಇಬ್ಬರೂ, ಮೋವಾಬ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿವಾಹ ಆದರು.”", "a": "ಹುಡುಗಿಯರನ್ನು", "r": "1:4"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬಳ ಹೆಸರು ಒರ್ಫಾ ಮತ್ತು ಇನ್ನೊಬ್ಬಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ರೂತ್", "r": "1:4"}, {"n": 55, "q": "ಸುಮಾರು ಹತ್ತು ವರ್ಷಗಳ ನಂತರ ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ತೀರಿ ಹೋದವರು ಯಾರು?", "a": "ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್", "r": "1:5"}, {"n": 56, "q": "ನವೊಮಿ ಯಾರನ್ನೆಲ್ಲಾ ಕಳೆದುಕೊಂಡು ಒಬ್ಬಂಟಿಗಳು ಆದಳು?", "a": "ತನ್ನ ಪತಿಯನ್ನೂ ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ", "r": "1:5"}, {"n": 57, "q": "ಪತಿಯನ್ನೂ ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ ಕಳೆದುಕೊಂಡ ನವೊಮಿ ಹೇಗಾದಳು?", "a": "ಒಬ್ಬಂಟಿಗಳು ಆದಳು", "r": "1:5"}, {"n": 58, "q": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ ನವೊಮಿಯ ಕುಟುಂಬದಲ್ಲಿ ಎಷ್ಟು ಮಂದಿ ಗಂಡಸರು ಮರಣಹೊಂದಿದರು?", "a": "ಮೂವರು (ಎಲಿಮೆಲೆಕ್, ಮಹ್ಲೋನ್, ಕಿಲ್ಯೋನ್)", "r": "1:5"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಹ್ಲೋನ್ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹ ತೀರಿ ಹೋದರು.”", "a": "ಕಿಲ್ಯೋನ್", "r": "1:5"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಪತಿಯನ್ನೂ ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ ಕಳೆದುಕೊಂಡು ಒಬ್ಬಂಟಿಗಳು ಆದಳು.”", "a": "ನವೊಮಿ", "r": "1:5"}, {"n": 61, "q": "“ಮಹ್ಲೋನ್ ಮತ್ತು ಕಿಲ್ಯೋನ್ ಸಹ ತೀರಿ ಹೋದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "1:5"}, {"n": 62, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಪತಿಯನ್ನೂ …”", "a": "“… ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ ಕಳೆದುಕೊಂಡು ಒಬ್ಬಂಟಿಗಳು ಆದಳು.”", "r": "1:5"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಕಿಲ್ಯೋನ್ ಸಹ ತೀರಿ ಹೋದರು.”", "a": "ಮಹ್ಲೋನ್", "r": "1:5"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಪತಿಯನ್ನೂ ಇಬ್ಬರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳೆದುಕೊಂಡು ಒಬ್ಬಂಟಿಗಳು ಆದಳು.”", "a": "ಪುತ್ರರನ್ನೂ", "r": "1:5"}, {"n": 65, "q": "“ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಪತಿಯನ್ನೂ ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ ಕಳೆದುಕೊಂಡು ಒಬ್ಬಂಟಿಗಳು ಆದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "1:5"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಪತಿಯನ್ನೂ ಇಬ್ಬರು ಪುತ್ರರನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದಳು.”", "a": "ಕಳೆದುಕೊಂಡು; ಒಬ್ಬಂಟಿಗಳು", "r": "1:5"}, {"n": 67, "q": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿದ್ದ ನವೊಮಿಗೆ ಯಾವ ಸಮಾಚಾರ ತಿಳಿದು ಬಂದಿತು?", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ", "r": "1:6"}, {"n": 68, "q": "ಯಾರ ಅನುಗ್ರಹದಿಂದ ನವೊಮಿಯ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿದ್ದವು?", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ", "r": "1:6"}, {"n": 69, "q": "ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ ನವೊಮಿಗೆ ತಿಳಿದು ಬಂದಾಗ ಅವಳು ಎಲ್ಲಿದ್ದಳು?", "a": "ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿ", "r": "1:6"}, {"n": 70, "q": "ನವೊಮಿ ಜುದೇಯಕ್ಕೆ ಹಿಂದಿರುಗಿ ಹೋಗಲು ಸಿದ್ಧತೆಮಾಡಿದ್ದು ಏಕೆ?", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ ತಿಳಿದು ಬಂದುದರಿಂದ", "r": "1:6–7"}, {"n": 71, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ವಚನ 6ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಬೆತ್ಲೆಹೇಮಿಗೆ ಪುನರಾಗಮನ", "r": "1:6"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದು ಬಂದಿತು.”", "a": "ನವೊಮಿಗೆ", "r": "1:6"}, {"n": 73, "q": "“ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿದ್ದ ನವೊಮಿಗೆ ತಿಳಿದು ಬಂದಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "1:6"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನಲ್ಲಿದ್ದ ನವೊಮಿಗೆ ತಿಳಿದು ಬಂದಿತು.”", "a": "ಮೋವಾಬ್", "r": "1:6"}, {"n": 75, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ …”", "a": "“… ಎಂಬ ಸಮಾಚಾರ ಮೋವಾಬ್ ನಾಡಿನಲ್ಲಿದ್ದ ನವೊಮಿಗೆ ತಿಳಿದು ಬಂದಿತು.”", "r": "1:6"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹದಿಂದ ತನ್ನ ನಾಡಿನಲ್ಲಿ ಒಳ್ಳೆಯ ಮಳೆ ಬೆಳೆಗಳಾಗಿವೆ ಎಂಬ ಸಮಾಚಾರ ಮೋವಾಬ್ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನವೊಮಿಗೆ ತಿಳಿದು ಬಂದಿತು.”", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ; ನಾಡಿನಲ್ಲಿದ್ದ", "r": "1:6"}, {"n": 77, "q": "ಮೋವಾಬಿನಿಂದ ಸಿದ್ಧತೆಮಾಡಿ ನವೊಮಿ ಎಲ್ಲಿಗೆ ಹೊರಟಳು?", "a": "ಜುದೇಯಕ್ಕೆ", "r": "1:7"}, {"n": 78, "q": "ನವೊಮಿ ಜುದೇಯಕ್ಕೆ ಹೊರಟಾಗ ಅವಳ ಜೊತೆಯಲ್ಲೆ ಹೋದವರು ಯಾರು?", "a": "ಸೊಸೆಯರು (ಒರ್ಫಾ ಮತ್ತು ರೂತ್)", "r": "1:7"}, {"n": 79, "q": "ಮೋವಾಬಿನಿಂದ ಹೊರಡುವ ಮೊದಲು ನವೊಮಿ ಏನು ಮಾಡಿದಳು?", "a": "ಅಲ್ಲಿಗೆ ಹಿಂದಿರುಗಿ ಹೋಗಲು ಸಿದ್ಧತೆಮಾಡಿದಳು", "r": "1:7"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಅವಳು ಅಲ್ಲಿಗೆ ಹಿಂದಿರುಗಿ ಹೋಗಲು ಸಿದ್ಧತೆಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟಳು.”", "a": "ಜುದೇಯಕ್ಕೆ", "r": "1:7"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸೊಸೆಯರು ಅವಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಜೊತೆಯಲ್ಲೆ", "r": "1:7"}, {"n": 82, "q": "“ಆದ್ದರಿಂದ ಅವಳು ಅಲ್ಲಿಗೆ ಹಿಂದಿರುಗಿ ಹೋಗಲು ಸಿದ್ಧತೆಮಾಡಿ ಜುದೇಯಕ್ಕೆ ಹೊರಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಅವಳು ಅಲ್ಲಿಗೆ ಹಿಂದಿರುಗಿ ಹೋಗಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜುದೇಯಕ್ಕೆ ಹೊರಟಳು.”", "a": "ಸಿದ್ಧತೆಮಾಡಿ", "r": "1:7"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಳ ಜೊತೆಯಲ್ಲೆ ಹೋದರು.”", "a": "ಸೊಸೆಯರು", "r": "1:7"}, {"n": 85, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದ್ದರಿಂದ ಅವಳು ಅಲ್ಲಿಗೆ ಹಿಂದಿರುಗಿ …”", "a": "“… ಹೋಗಲು ಸಿದ್ಧತೆಮಾಡಿ ಜುದೇಯಕ್ಕೆ ಹೊರಟಳು.”", "r": "1:7"}, {"n": 86, "q": "ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರಿಗೆ ತವರುಮನೆಗಳಿಗೆ ಹಿಂದಿರುಗುವಂತೆ ಎಲ್ಲಿ ಹೇಳಿದಳು?", "a": "ಹೋಗುತ್ತಿರುವಾಗ ದಾರಿಯಲ್ಲಿ", "r": "1:8"}, {"n": 87, "q": "ದಾರಿಯಲ್ಲಿ ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರಿಗೆ ಎಲ್ಲಿಗೆ ಹಿಂದಿರುಗುವಂತೆ ಹೇಳಿದಳು?", "a": "“ನೀವು ಇಬ್ಬರೂ ನಿಮ್ಮ ತವರುಮನೆಗಳಿಗೆ ಹಿಂದಿರುಗಿರಿ.”", "r": "1:8"}, {"n": 88, "q": "“ನನಗೂ ಮರಣಹೊಂದಿದ ನನ್ನ ಮಕ್ಕಳಿಗೂ ನೀವು ಒಳಿತು ಮಾಡಿದಿರಿ” ಎಂದು ನವೊಮಿ ಯಾರಿಗೆ ಹೇಳಿದಳು?", "a": "ತನ್ನ ಸೊಸೆಯರಿಗೆ (ಒರ್ಫಾ ಮತ್ತು ರೂತಳಿಗೆ)", "r": "1:8"}, {"n": 89, "q": "ತನ್ನ ಸೊಸೆಯರು ತನಗೂ ಮರಣಹೊಂದಿದ ತನ್ನ ಮಕ್ಕಳಿಗೂ ಏನು ಮಾಡಿದರೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಒಳಿತು ಮಾಡಿದರು", "r": "1:8"}, {"n": 90, "q": "ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರಿಗೆ ತವರುಮನೆಗಳಿಗೆ ಹಿಂದಿರುಗುವಂತೆ ಎಷ್ಟು ಬಾರಿ ಹೇಳಿದಳು (ವಚನ 8, 11, 12)?", "a": "ಮೂರು ಬಾರಿ (“ಹಿಂದಿರುಗಿರಿ”, “ಹಿಂದಿರುಗುವುದು ಒಳ್ಳೆಯದು”, “ಹಿಂದಿರುಗಿ ಹೋಗಿರಿ”)", "r": "1:8–14"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಹೋಗುತ್ತಿರುವಾಗ ದಾರಿಯಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ:”", "a": "ನವೊಮಿ", "r": "1:8"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಇಬ್ಬರೂ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂದಿರುಗಿರಿ.”", "a": "ತವರುಮನೆಗಳಿಗೆ", "r": "1:8"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಮಕ್ಕಳಿಗೂ ನೀವು ಒಳಿತು ಮಾಡಿದಿರಿ.”", "a": "ಮರಣಹೊಂದಿದ", "r": "1:8"}, {"n": 94, "q": "“ಹೀಗೆ ಹೋಗುತ್ತಿರುವಾಗ ದಾರಿಯಲ್ಲಿ ನವೊಮಿ ಅವರಿಗೆ:” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 95, "q": "“ನನಗೂ ಮರಣಹೊಂದಿದ ನನ್ನ ಮಕ್ಕಳಿಗೂ ನೀವು ಒಳಿತು ಮಾಡಿದಿರಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾರಿಯಲ್ಲಿ ನವೊಮಿ ಅವರಿಗೆ:”", "a": "ಹೋಗುತ್ತಿರುವಾಗ", "r": "1:8"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಇಬ್ಬರೂ ನಿಮ್ಮ ತವರುಮನೆಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹಿಂದಿರುಗಿರಿ", "r": "1:8"}, {"n": 98, "q": "ಸೊಸೆಯರನ್ನು ಬೀಳ್ಕೊಡುವಾಗ ನವೊಮಿ ಅವರನ್ನು ಹೇಗೆ ಹರಸಿದಳು?", "a": "“ಸರ್ವೇಶ ನಿಮಗೂ ಹಾಗೆಯೇ ಒಳಿತನ್ನು ಮಾಡಲಿ. ನೀವಿಬ್ಬರೂ ಪುನಃ ಮದುವೆಯಾಗಿ ಸುಖವಾಗಿರುವಂತೆ ಅನುಗ್ರಹಿಸಲಿ!”", "r": "1:9"}, {"n": 99, "q": "ತನ್ನ ಸೊಸೆಯರು ಪುನಃ ಮದುವೆಯಾಗಿ ಹೇಗಿರುವಂತೆ ಸರ್ವೇಶ ಅನುಗ್ರಹಿಸಲಿ ಎಂದು ನವೊಮಿ ಹರಸಿದಳು?", "a": "ಸುಖವಾಗಿರುವಂತೆ", "r": "1:9"}, {"n": 100, "q": "ಸೊಸೆಯರನ್ನು ಹರಸಿ ಬೀಳ್ಕೊಡುತ್ತಾ ನವೊಮಿ ಏನು ಮಾಡಿದಳು?", "a": "ಮುದ್ದಿಟ್ಟಳು", "r": "1:9"}, {"n": 101, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮುದ್ದಿಟ್ಟ ಅಥವಾ ಮುತ್ತಿಟ್ಟ ಇಬ್ಬರು ಯಾರು?", "a": "ನವೊಮಿ (ಸೊಸೆಯರನ್ನು ಬೀಳ್ಕೊಡುತ್ತಾ ಮುದ್ದಿಟ್ಟಳು) ಮತ್ತು ಒರ್ಫಾ (ಅತ್ತೆಗೆ ಮುತ್ತಿಟ್ಟಳು)", "r": "1:9; 1:14"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರ್ವೇಶ ನಿಮಗೂ ಹಾಗೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲಿ.”", "a": "ಒಳಿತನ್ನು", "r": "1:9"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಿಬ್ಬರೂ ಪುನಃ ಮದುವೆಯಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹಿಸಲಿ!”", "a": "ಸುಖವಾಗಿರುವಂತೆ", "r": "1:9"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹರಸಿ ಅವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುದ್ದಿಟ್ಟಳು.”", "a": "ಬೀಳ್ಕೊಡುತ್ತಾ", "r": "1:9"}, {"n": 105, "q": "“ಸರ್ವೇಶ ನಿಮಗೂ ಹಾಗೆಯೇ ಒಳಿತನ್ನು ಮಾಡಲಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "1:9"}, {"n": 106, "q": "“ಎಂದು ಹರಸಿ ಅವರನ್ನು ಬೀಳ್ಕೊಡುತ್ತಾ ಮುದ್ದಿಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "1:9"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೂ ಹಾಗೆಯೇ ಒಳಿತನ್ನು ಮಾಡಲಿ.”", "a": "ಸರ್ವೇಶ", "r": "1:9"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಿಬ್ಬರೂ ಪುನಃ ಮದುವೆಯಾಗಿ ಸುಖವಾಗಿರುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಅನುಗ್ರಹಿಸಲಿ", "r": "1:9"}, {"n": 109, "q": "ನವೊಮಿ ಬೀಳ್ಕೊಡುತ್ತಾ ಮುದ್ದಿಟ್ಟಾಗ ಸೊಸೆಯರು ಏನು ಮಾಡಿದರು?", "a": "ಅಳಲಾರಂಭಿಸಿದರು", "r": "1:10"}, {"n": 110, "q": "ನವೊಮಿ ತವರುಮನೆಗಳಿಗೆ ಹಿಂದಿರುಗುವಂತೆ ಹೇಳಿದಾಗ ಸೊಸೆಯರು ಮೊದಲು ಏನೆಂದು ಉತ್ತರಿಸಿದರು?", "a": "“ಇಲ್ಲಮ್ಮಾ, ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗಲಾರೆವು. ನಾವೂ ನಿಮ್ಮ ಜೊತೆಯಲ್ಲಿಯೇ ನಿಮ್ಮ ಸ್ವಜನರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ”", "r": "1:10"}, {"n": 111, "q": "“ಇಲ್ಲಮ್ಮಾ, ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗಲಾರೆವು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಒರ್ಫಾ ಮತ್ತು ರೂತ್ ನವೊಮಿಗೆ", "r": "1:10"}, {"n": 112, "q": "ಸೊಸೆಯರು ನವೊಮಿಯ ಜೊತೆಯಲ್ಲಿಯೇ ಯಾರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ ಎಂದರು?", "a": "ನವೊಮಿಯ ಸ್ವಜನರ ಬಳಿಗೆ", "r": "1:10"}, {"n": 113, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಸೊಸೆಯರು ಎಷ್ಟು ಬಾರಿ ಅತ್ತರು ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಎರಡು ಬಾರಿ (ಅಳಲಾರಂಭಿಸಿದರು; ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಅತ್ತರು)", "r": "1:10; 1:14"}, {"n": 114, "q": "ಸೊಸೆಯರು ನವೊಮಿಯನ್ನು ಯಾವ ಸಂಬೋಧನೆಯಿಂದ ಕರೆದರು?", "a": "“ಅಮ್ಮಾ” (“ಇಲ್ಲಮ್ಮಾ”)", "r": "1:10"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು, ಇಲ್ಲಮ್ಮಾ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟು ಹೋಗಲಾರೆವು.”", "a": "ನಿಮ್ಮನ್ನು", "r": "1:10"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವೂ ನಿಮ್ಮ ಜೊತೆಯಲ್ಲಿಯೇ ನಿಮ್ಮ ಸ್ವಜನರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಳಲಾರಂಭಿಸಿದರು", "r": "1:10"}, {"n": 117, "q": "“ಆದರೆ ಅವರು, ಇಲ್ಲಮ್ಮಾ, ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗಲಾರೆವು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 118, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವೂ ನಿಮ್ಮ ಜೊತೆಯಲ್ಲಿಯೇ ನಿಮ್ಮ …”", "a": "“… ಸ್ವಜನರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ, ಎಂದು ಅಳಲಾರಂಭಿಸಿದರು.”", "r": "1:10"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು, ಇಲ್ಲಮ್ಮಾ, ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಲಾರೆವು", "r": "1:10"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವೂ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಸ್ವಜನರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ, ಎಂದು ಅಳಲಾರಂಭಿಸಿದರು.”", "a": "ಜೊತೆಯಲ್ಲಿಯೇ", "r": "1:10"}, {"n": 121, "q": "“ನಾವೂ ನಿಮ್ಮ ಜೊತೆಯಲ್ಲಿಯೇ ನಿಮ್ಮ ಸ್ವಜನರ ಬಳಿಗೆ ಬರುತ್ತೇವೆ, ಎಂದು ಅಳಲಾರಂಭಿಸಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 122, "q": "“ಮಕ್ಕಳೇ, ನೀವು ಹಿಂದಿರುಗುವುದು ಒಳ್ಳೆಯದು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರಿಗೆ", "r": "1:11"}, {"n": 123, "q": "ಸೊಸೆಯರು ಪುನಃ ಮದುವೆಯಾಗುವುದರ ಬಗ್ಗೆ ನವೊಮಿ ಯಾವ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿದಳು?", "a": "“ನೀವು ಪುನಃ ಮದುವೆಯಾಗುವುದಕ್ಕೆ ನನಗೆ ಬೇರೆ ಮಕ್ಕಳಿರುವರೇ?”", "r": "1:11"}, {"n": 124, "q": "“ನನ್ನ ಸಂಗಡ ಏಕೆ ಬರಬೇಕೆಂದಿರುವಿರಿ?” ಎಂದು ನವೊಮಿ ಯಾರನ್ನು ಕೇಳಿದಳು?", "a": "ತನ್ನ ಸೊಸೆಯರನ್ನು", "r": "1:11"}, {"n": 125, "q": "ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರನ್ನು ಯಾವ ಪ್ರೀತಿಯ ಸಂಬೋಧನೆಯಿಂದ ಕರೆದಳು?", "a": "“ಮಕ್ಕಳೇ”", "r": "1:11"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮಕ್ಕಳೇ, ನೀವು ಹಿಂದಿರುಗುವುದು ಒಳ್ಳೆಯದು.”", "a": "ನವೊಮಿ", "r": "1:11"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಸಂಗಡ ಏಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಬರಬೇಕೆಂದಿರುವಿರಿ", "r": "1:11"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೆ ಬೇರೆ ಮಕ್ಕಳಿರುವರೇ?”", "a": "ಮದುವೆಯಾಗುವುದಕ್ಕೆ", "r": "1:11"}, {"n": 129, "q": "“ಆಗ ನವೊಮಿ, ಮಕ್ಕಳೇ, ನೀವು ಹಿಂದಿರುಗುವುದು ಒಳ್ಳೆಯದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "1:11"}, {"n": 130, "q": "“ನೀವು ಪುನಃ ಮದುವೆಯಾಗುವುದಕ್ಕೆ ನನಗೆ ಬೇರೆ ಮಕ್ಕಳಿರುವರೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "1:11"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನವೊಮಿ, ಮಕ್ಕಳೇ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳ್ಳೆಯದು.”", "a": "ಹಿಂದಿರುಗುವುದು", "r": "1:11"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏಕೆ ಬರಬೇಕೆಂದಿರುವಿರಿ?”", "a": "ಸಂಗಡ", "r": "1:11"}, {"n": 133, "q": "ನವೊಮಿ ತನಗೆ ಯಾವುದರ ಪ್ರಾಯ ದಾಟಿ ಹೋಗಿದೆ ಎಂದು ಹೇಳಿದಳು?", "a": "ಪುನಃ ಮದುವೆಮಾಡಿಕೊಳ್ಳುವ ಪ್ರಾಯ", "r": "1:12"}, {"n": 134, "q": "“ಪುನಃ ಮದುವೆಮಾಡಿಕೊಳ್ಳುವ ಪ್ರಾಯ ನನಗೆ ದಾಟಿ ಹೋಗಿದೆ” ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ನವೊಮಿ", "r": "1:12"}, {"n": 135, "q": "ಸಂತಾನಭಾಗ್ಯದ ನಿರೀಕ್ಷೆಯಿಂದ ಈ ಹೊತ್ತೇ ಮದುವೆಯಾಗಿ ಮಕ್ಕಳನ್ನು ಹಡೆದರೂ ಸೊಸೆಯರಿಗೆ ಯಾವುದು ಸಾಧ್ಯವಾಗದು ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅವರು ಬೆಳೆದು ದೊಡ್ಡವರಾಗುವವರೆಗೂ ಕಾದಿರಲು", "r": "1:12–13"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಕ್ಕಳೇ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿರಿ.”", "a": "ಹಿಂದಿರುಗಿ", "r": "1:12"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾಯ ನನಗೆ ದಾಟಿ ಹೋಗಿದೆ.”", "a": "ಮದುವೆಮಾಡಿಕೊಳ್ಳುವ", "r": "1:12"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ವೇಳೆ ಸಂತಾನಭಾಗ್ಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಹೊತ್ತೇ ಮದುವೆಯಾಗಿ ಮಕ್ಕಳನ್ನು ಹಡೆದರೂ”", "a": "ನಿರೀಕ್ಷೆಯಿಂದ", "r": "1:12"}, {"n": 139, "q": "“ಒಂದು ವೇಳೆ ಸಂತಾನಭಾಗ್ಯದ ನಿರೀಕ್ಷೆಯಿಂದ ಈ ಹೊತ್ತೇ ಮದುವೆಯಾಗಿ ಮಕ್ಕಳನ್ನು ಹಡೆದರೂ” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "1:12"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ಹಿಂದಿರುಗಿ ಹೋಗಿರಿ.”", "a": "ಮಕ್ಕಳೇ", "r": "1:12"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ ಮದುವೆಮಾಡಿಕೊಳ್ಳುವ ಪ್ರಾಯ ನನಗೆ ದಾಟಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಿದೆ", "r": "1:12"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ವೇಳೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರೀಕ್ಷೆಯಿಂದ ಈ ಹೊತ್ತೇ ಮದುವೆಯಾಗಿ ಮಕ್ಕಳನ್ನು ಹಡೆದರೂ”", "a": "ಸಂತಾನಭಾಗ್ಯದ", "r": "1:12"}, {"n": 143, "q": "“ಪುನಃ ಮದುವೆಮಾಡಿಕೊಳ್ಳುವ ಪ್ರಾಯ ನನಗೆ ದಾಟಿ ಹೋಗಿದೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "1:12"}, {"n": 144, "q": "ತನ್ನ ಕಷ್ಟಕ್ಕೆ ಕಾರಣವಾಗಿ ನವೊಮಿ ಸರ್ವೇಶ್ವರನ ಬಗ್ಗೆ ಏನು ಹೇಳಿದಳು?", "a": "“ಸರ್ವೇಶ್ವರ ನನ್ನ ಕೈ ಬಿಟ್ಟಿದ್ದಾರೆ”", "r": "1:13"}, {"n": 145, "q": "“ನಿಮಗಾಗಿ ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ” ಎಂದು ನವೊಮಿ ಹೇಳಿದ ಮಾತುಗಳನ್ನು ಗ್ರಂಥ ಏನೆಂದು ವರ್ಣಿಸುತ್ತದೆ?", "a": "ಸಮಾಧಾನ ಹೇಳಿದಳು", "r": "1:13"}, {"n": 146, "q": "“ಬೇಡ, ಮಕ್ಕಳೇ, …” ನವೊಮಿ ತನ್ನ ಸೊಸೆಯರಿಗಾಗಿ ಏನು ಮಾಡುತ್ತೇನೆ ಎಂದಳು?", "a": "“ನಿಮಗಾಗಿ ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ”", "r": "1:13"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಬೆಳೆದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕಾದಿರಲು ಸಾಧ್ಯವೇ?”", "a": "ದೊಡ್ಡವರಾಗುವವರೆಗೂ", "r": "1:13"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇಡ, ಮಕ್ಕಳೇ, ಸರ್ವೇಶ್ವರ ನನ್ನ ಕೈ ಬಿಟ್ಟಿದ್ದಾರೆ, ನಿಮಗಾಗಿ ನಾನು ಬಹಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಸಮಾಧಾನ ಹೇಳಿದಳು.”", "a": "ವಿಷಾದಿಸುತ್ತೇನೆ", "r": "1:13"}, {"n": 149, "q": "“ಅವರು ಬೆಳೆದು ದೊಡ್ಡವರಾಗುವವರೆಗೂ ನೀವು ಕಾದಿರಲು ಸಾಧ್ಯವೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 150, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬೇಡ, ಮಕ್ಕಳೇ, ಸರ್ವೇಶ್ವರ ನನ್ನ ಕೈ ಬಿಟ್ಟಿದ್ದಾರೆ, …”", "a": "“… ನಿಮಗಾಗಿ ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ, ಎಂದು ಸಮಾಧಾನ ಹೇಳಿದಳು.”", "r": "1:13"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಬೆಳೆದು ದೊಡ್ಡವರಾಗುವವರೆಗೂ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಧ್ಯವೇ?”", "a": "ಕಾದಿರಲು", "r": "1:13"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇಡ, ಮಕ್ಕಳೇ, ಸರ್ವೇಶ್ವರ ನನ್ನ ಕೈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮಗಾಗಿ ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ, ಎಂದು ಸಮಾಧಾನ ಹೇಳಿದಳು.”", "a": "ಬಿಟ್ಟಿದ್ದಾರೆ", "r": "1:13"}, {"n": 153, "q": "“ಬೇಡ, ಮಕ್ಕಳೇ, ಸರ್ವೇಶ್ವರ ನನ್ನ ಕೈ ಬಿಟ್ಟಿದ್ದಾರೆ, ನಿಮಗಾಗಿ ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ, ಎಂದು ಸಮಾಧಾನ ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇಡ, ಮಕ್ಕಳೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕೈ ಬಿಟ್ಟಿದ್ದಾರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಬಹಳ ವಿಷಾದಿಸುತ್ತೇನೆ, ಎಂದು ಸಮಾಧಾನ ಹೇಳಿದಳು.”", "a": "ಸರ್ವೇಶ್ವರ; ನಿಮಗಾಗಿ", "r": "1:13"}, {"n": 155, "q": "ನವೊಮಿಯ ಸಮಾಧಾನದ ಮಾತುಗಳನ್ನು ಕೇಳಿ ಸೊಸೆಯರು ಏನು ಮಾಡಿದರು?", "a": "ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಅತ್ತರು", "r": "1:14"}, {"n": 156, "q": "ಅತ್ತೆಗೆ ಮುತ್ತಿಟ್ಟು ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋದವಳು ಯಾರು?", "a": "ಒರ್ಫಾ", "r": "1:14"}, {"n": 157, "q": "ಒರ್ಫಾ ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋಗುವ ಮೊದಲು ಅತ್ತೆಗೆ ಏನು ಮಾಡಿದಳು?", "a": "ಮುತ್ತಿಟ್ಟಳು", "r": "1:14"}, {"n": 158, "q": "ಅತ್ತೆಯನ್ನು ಬಿಟ್ಟುಹೋಗದವಳು ಯಾರು?", "a": "ರೂತಳು", "r": "1:14"}, {"n": 159, "q": "ಅತ್ತೆಯನ್ನು ಬೀಳ್ಕೊಡುವ ಸಂದರ್ಭದಲ್ಲಿ ಒರ್ಫಾ ಮತ್ತು ರೂತಳ ನಡೆಯಲ್ಲಿ ಇದ್ದ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಒರ್ಫಾ ಅತ್ತೆಗೆ ಮುತ್ತಿಟ್ಟು ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋದಳು; ರೂತಳು ಮಾತ್ರ ಅತ್ತೆಯನ್ನು ಬಿಟ್ಟುಹೋಗಲಿಲ್ಲ", "r": "1:14"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಇದನ್ನು ಕೇಳಿ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅತ್ತರು.”", "a": "ಹೆಚ್ಚಾಗಿ", "r": "1:14"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅತ್ತೆಗೆ ಮುತ್ತಿಟ್ಟು ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋದಳು.”", "a": "ಒರ್ಫಾ", "r": "1:14"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ ಅತ್ತೆಯನ್ನು ಬಿಟ್ಟುಹೋಗಲಿಲ್ಲ.”", "a": "ರೂತಳು", "r": "1:14"}, {"n": 163, "q": "“ಅವರು ಇದನ್ನು ಕೇಳಿ ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಅತ್ತರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 164, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅನಂತರ ಒರ್ಫಾ ಅತ್ತೆಗೆ ಮುತ್ತಿಟ್ಟು …”", "a": "“… ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋದಳು.”", "r": "1:14"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಇದನ್ನು ಕೇಳಿ ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅತ್ತರು", "r": "1:14"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ಒರ್ಫಾ ಅತ್ತೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ಹೋದಳು.”", "a": "ಮುತ್ತಿಟ್ಟು", "r": "1:14"}, {"n": 167, "q": "“ನೋಡು, ನಿನ್ನ ಓರಗತ್ತಿಯು …” ಎಂದು ನವೊಮಿ ರೂತಳಿಗೆ ಹೇಳಿದಾಗ ಓರಗತ್ತಿ ಯಾರು?", "a": "ಒರ್ಫಾ", "r": "1:15"}, {"n": 168, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ರೂತಳ ಓರಗತ್ತಿ ಯಾರ ಯಾರ ಬಳಿಗೆ ಹಿಂದಿರುಗಿ ಹೋಗಿದ್ದಾಳೆ?", "a": "ತನ್ನ ಜನಾಂಗದವರ ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ", "r": "1:15"}, {"n": 169, "q": "ಒರ್ಫಾ ಹಿಂದಿರುಗಿದ ಮೇಲೆ ನವೊಮಿ ರೂತಳನ್ನು ಏನೆಂದು ಒತ್ತಾಯಪಡಿಸಿದಳು?", "a": "“ನೀನೂ ಅವಳಂತೆಯೇ ಹೋಗಿಬಿಡು”", "r": "1:15"}, {"n": 170, "q": "“ನೀನೂ ಅವಳಂತೆಯೇ ಹೋಗಿಬಿಡು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ನವೊಮಿ ರೂತಳಿಗೆ", "r": "1:15"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೋಡು, ನಿನ್ನ ಓರಗತ್ತಿಯು ತನ್ನ ಜನಾಂಗದವರ ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ ಹಿಂದಿರುಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಿದ್ದಾಳೆ", "r": "1:15"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನೂ ಅವಳಂತೆಯೇ ಹೋಗಿಬಿಡು, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒತ್ತಾಯಪಡಿಸಿದಳು", "r": "1:15"}, {"n": 173, "q": "“ನೋಡು, ನಿನ್ನ ಓರಗತ್ತಿಯು ತನ್ನ ಜನಾಂಗದವರ ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ ಹಿಂದಿರುಗಿ ಹೋಗಿದ್ದಾಳೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "1:15"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೋಡು, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಜನಾಂಗದವರ ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ ಹಿಂದಿರುಗಿ ಹೋಗಿದ್ದಾಳೆ.”", "a": "ಓರಗತ್ತಿಯು", "r": "1:15"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿಬಿಡು, ಎಂದು ಒತ್ತಾಯಪಡಿಸಿದಳು.”", "a": "ಅವಳಂತೆಯೇ", "r": "1:15"}, {"n": 176, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೋಡು, ನಿನ್ನ ಓರಗತ್ತಿಯು ತನ್ನ ಜನಾಂಗದವರ …”", "a": "“… ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ ಹಿಂದಿರುಗಿ ಹೋಗಿದ್ದಾಳೆ.”", "r": "1:15"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೋಡು, ನಿನ್ನ ಓರಗತ್ತಿಯು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೂ ತನ್ನ ಕುಲದೇವರ ಬಳಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿದ್ದಾಳೆ.”", "a": "ಜನಾಂಗದವರ; ಹಿಂದಿರುಗಿ", "r": "1:15"}, {"n": 178, "q": "ನವೊಮಿ ಒತ್ತಾಯಪಡಿಸಿದಾಗ ರೂತಳು ಮೊದಲು ಏನೆಂದು ಬೇಡಿಕೊಂಡಳು?", "a": "“ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗುವಂತೆ ಒತ್ತಾಯಪಡಿಸಬೇಡಿ.”", "r": "1:16"}, {"n": 179, "q": "“ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ ಬರುತ್ತೇನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ರೂತಳು ನವೊಮಿಗೆ", "r": "1:16"}, {"n": 180, "q": "ನವೊಮಿ ಎಲ್ಲಿ ವಾಸಿಸಿದರೂ ತಾನು ಏನು ಮಾಡುವೆನೆಂದು ರೂತಳು ಹೇಳಿದಳು?", "a": "“ನಾನು ಅಲ್ಲೇ ವಾಸಿಸುತ್ತೇನೆ”", "r": "1:16"}, {"n": 181, "q": "ರೂತಳು ನವೊಮಿಗೆ ಕೊಟ್ಟ ವಾಗ್ದಾನಗಳಲ್ಲಿ ಯಾವುದಾದರೂ ನಾಲ್ಕನ್ನು ತಿಳಿಸಿ.", "a": "1) ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ ಬರುತ್ತೇನೆ; 2) ನೀವು ಎಲ್ಲಿ ವಾಸಿಸಿದರೂ ನಾನು ಅಲ್ಲೇ ವಾಸಿಸುತ್ತೇನೆ; 3) ನಿಮ್ಮ ಜನರೇ ನನ್ನ ಜನರು; 4) ನಿಮ್ಮ ದೇವರೇ ನನ್ನ ದೇವರು; 5) ನೀವು ಸಾಯುವಲ್ಲೇ ನಾನು ಸಾಯುವೆನು", "r": "1:16–17"}, {"n": 182, "q": "“ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ ಬರುತ್ತೇನೆ” ಎಂದ ರೂತಳು ಯಾವ ನಾಡಿನವಳು?", "a": "ಮೋವಾಬ್ ನಾಡಿನವಳು", "r": "1:16"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒತ್ತಾಯಪಡಿಸಬೇಡಿ", "r": "1:16"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರುತ್ತೇನೆ", "r": "1:16"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಎಲ್ಲಿ ವಾಸಿಸಿದರೂ ನಾನು ಅಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಾಸಿಸುತ್ತೇನೆ", "r": "1:16"}, {"n": 186, "q": "“ನೀವು ಎಲ್ಲಿ ವಾಸಿಸಿದರೂ ನಾನು ಅಲ್ಲೇ ವಾಸಿಸುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟು ಹೋಗುವಂತೆ ಒತ್ತಾಯಪಡಿಸಬೇಡಿ.”", "a": "ನಿಮ್ಮನ್ನು", "r": "1:16"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ ಬರುತ್ತೇನೆ.”", "a": "ಎಲ್ಲಿಗೆ", "r": "1:16"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಎಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಅಲ್ಲೇ ವಾಸಿಸುತ್ತೇನೆ.”", "a": "ವಾಸಿಸಿದರೂ", "r": "1:16"}, {"n": 190, "q": "ನವೊಮಿಯ ಜನರ ಹಾಗೂ ದೇವರ ಬಗ್ಗೆ ರೂತಳು ಏನೆಂದು ಹೇಳಿದಳು?", "a": "“ನಿಮ್ಮ ಜನರೇ ನನ್ನ ಜನರು; ನಿಮ್ಮ ದೇವರೇ ನನ್ನ ದೇವರು”", "r": "1:17"}, {"n": 191, "q": "“ನಿಮ್ಮ ದೇವರೇ ನನ್ನ ದೇವರು” — ಇದು ಯಾರ ಮಾತು?", "a": "ರೂತಳ ಮಾತು (ನವೊಮಿಗೆ ಹೇಳಿದ್ದು)", "r": "1:17"}, {"n": 192, "q": "ರೂತಳು ತಾನು ಎಲ್ಲಿ ಸಾಯುವೆನೆಂದು ಹೇಳಿದಳು?", "a": "ನವೊಮಿ ಸಾಯುವಲ್ಲೇ (“ನೀವು ಸಾಯುವಲ್ಲೇ ನಾನು ಸಾಯುವೆನು”)", "r": "1:17"}, {"n": 193, "q": "ರೂತಳು ತನಗೆ ಎಲ್ಲಿ ಸಮಾಧಿಯಾಗಲಿ ಎಂದು ಬೇಡಿಕೊಂಡಳು?", "a": "ನವೊಮಿ ಸಾಯುವಲ್ಲಿಯೇ (“ಅಲ್ಲಿಯೇ ನನಗೆ ಸಮಾಧಿಯಾಗಲಿ”)", "r": "1:17"}, {"n": 194, "q": "ಮರಣದ ಬಗ್ಗೆ ರೂತಳು ನವೊಮಿಗೆ ಏನೆಂದು ಹೇಳಿದಳು?", "a": "“ಮರಣದಲ್ಲಿಯೂ ನಾನು ನಿಮ್ಮನ್ನು ಬಿಟ್ಟಿರಲಾರೆ.”", "r": "1:17"}, {"n": 195, "q": "ತನ್ನ ಮಾತಿನಂತೆ ನಡೆಯದಿದ್ದರೆ ಸರ್ವೇಶ್ವರ ತನಗೆ ಏನು ಮಾಡಲಿ ಎಂದು ರೂತಳು ಹೇಳಿದಳು?", "a": "ತಕ್ಕ ದಂಡನೆಯನ್ನು ವಿಧಿಸಲಿ", "r": "1:17"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಜನರು;”", "a": "ಜನರೇ", "r": "1:17"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ದೇವರು;”", "a": "ದೇವರೇ", "r": "1:17"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಸಾಯುವೆನು;”", "a": "ಸಾಯುವಲ್ಲೇ", "r": "1:17"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರಣದಲ್ಲಿಯೂ ನಾನು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಿಟ್ಟಿರಲಾರೆ", "r": "1:17"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ವೇಶ್ವರ ನನಗೆ ತಕ್ಕ ದಂಡನೆಯನ್ನು ವಿಧಿಸಲಿ!”", "a": "ಇಲ್ಲದಿದ್ದರೆ", "r": "1:17"}, {"n": 201, "q": "“ಇಲ್ಲದಿದ್ದರೆ ಸರ್ವೇಶ್ವರ ನನಗೆ ತಕ್ಕ ದಂಡನೆಯನ್ನು ವಿಧಿಸಲಿ!” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "1:17"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಜನರೇ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಜನರು", "r": "1:17"}, {"n": 203, "q": "ನವೊಮಿ ರೂತಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ, ಏಕೆ?", "a": "ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು ತಿಳಿದುದರಿಂದ", "r": "1:18"}, {"n": 204, "q": "ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು ತಿಳಿದ ನವೊಮಿ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಅವಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ", "r": "1:18"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದು ನವೊಮಿ ಅವಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು", "r": "1:18"}, {"n": 206, "q": "“ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು ತಿಳಿದು ನವೊಮಿ ಅವಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "1:18"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು ತಿಳಿದು ನವೊಮಿ ಅವಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ರೂತಳು", "r": "1:18"}, {"n": 208, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು …”", "a": "“… ತಿಳಿದು ನವೊಮಿ ಅವಳನ್ನು ಮತ್ತೆ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "r": "1:18"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರೂತಳು ತನ್ನ ಸಂಗಡ ಬರಲು ನಿರ್ಧರಿಸಿದ್ದಾಳೆಂದು ತಿಳಿದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಳನ್ನು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನವೊಮಿ; ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ", "r": "1:18"}, {"n": 210, "q": "ಪ್ರಯಾಣವನ್ನು ಮುಂದುವರೆಸಿ ನವೊಮಿ ಮತ್ತು ರೂತಳು ಯಾವ ಊರನ್ನು ತಲುಪಿದರು?", "a": "ಬೆತ್ಲೆಹೇಮನ್ನು", "r": "1:19"}, {"n": 211, "q": "ನವೊಮಿ ಮತ್ತು ರೂತಳು ಊರಿಗೆ ಹಿಂದಿರುಗಿ ಬಂದ ಸಂಗತಿ ಜನರಲ್ಲಿ ಏನನ್ನು ಮೂಡಿಸಿತು?", "a": "ಕುತೂಹಲ", "r": "1:19"}, {"n": 212, "q": "ನವೊಮಿ ಬೆತ್ಲೆಹೇಮಿಗೆ ಹಿಂದಿರುಗಿದಾಗ ಊರಿನ ಹೆಂಗಸರು ಏನೆಂದು ವಿಚಾರಿಸತೊಡಗಿದರು?", "a": "“ಈಕೆ ನವೊಮಿಯಲ್ಲವೇ?”", "r": "1:19"}, {"n": 213, "q": "“ಈಕೆ ನವೊಮಿಯಲ್ಲವೇ?” ಎಂದು ವಿಚಾರಿಸತೊಡಗಿದವರು ಯಾರು?", "a": "ಬೆತ್ಲೆಹೇಮ್ ಊರಿನ ಹೆಂಗಸರು", "r": "1:19"}, {"n": 214, "q": "ಬೆತ್ಲೆಹೇಮಿನ ಹೆಂಗಸರು “ಈಕೆ ನವೊಮಿಯಲ್ಲವೇ?” ಎಂದು ಕೇಳಿದ್ದು ಯಾವ ಸಂಗತಿ ಕುತೂಹಲ ಮೂಡಿಸಿದ್ದರಿಂದ?", "a": "ನವೊಮಿ ಮತ್ತು ರೂತಳು ಊರಿಗೆ ಹಿಂದಿರುಗಿ ಬಂದ ಸಂಗತಿ", "r": "1:19"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಯೇ ಪ್ರಯಾಣವನ್ನು ಮುಂದುವರೆಸಿ ಅವರಿಬ್ಬರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಲುಪಿದರು.”", "a": "ಬೆತ್ಲೆಹೇಮನ್ನು", "r": "1:19"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಊರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದ ಸಂಗತಿ ಜನರಲ್ಲಿ ಕುತೂಹಲ ಮೂಡಿಸಿತು.”", "a": "ಹಿಂದಿರುಗಿ", "r": "1:19"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಊರಿನ ಹೆಂಗಸರು, ಈಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ನವೊಮಿಯಲ್ಲವೇ", "r": "1:19"}, {"n": 218, "q": "“ಹಾಗೆಯೇ ಪ್ರಯಾಣವನ್ನು ಮುಂದುವರೆಸಿ ಅವರಿಬ್ಬರೂ ಬೆತ್ಲೆಹೇಮನ್ನು ತಲುಪಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "1:19"}, {"n": 219, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರು ಊರಿಗೆ ಹಿಂದಿರುಗಿ ಬಂದ …”", "a": "“… ಸಂಗತಿ ಜನರಲ್ಲಿ ಕುತೂಹಲ ಮೂಡಿಸಿತು.”", "r": "1:19"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಂದುವರೆಸಿ ಅವರಿಬ್ಬರೂ ಬೆತ್ಲೆಹೇಮನ್ನು ತಲುಪಿದರು.”", "a": "ಪ್ರಯಾಣವನ್ನು", "r": "1:19"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಊರಿಗೆ ಹಿಂದಿರುಗಿ ಬಂದ ಸಂಗತಿ ಜನರಲ್ಲಿ ಕುತೂಹಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೂಡಿಸಿತು", "r": "1:19"}, {"n": 222, "q": "ತನ್ನನ್ನು ಯಾವ ಹೆಸರಿನಿಂದ ಕರೆಯಬೇಡಿ ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "‘ನವೊಮಿ’ ಎಂದು", "r": "1:20"}, {"n": 223, "q": "ತನ್ನನ್ನು ಯಾವ ಹೆಸರಿನಿಂದ ಕರೆಯಿರಿ ಎಂದು ನವೊಮಿ ಊರಿನ ಹೆಂಗಸರಿಗೆ ಹೇಳಿದಳು?", "a": "‘ಮಾರಾ’ ಎಂದು", "r": "1:20"}, {"n": 224, "q": "ತನ್ನನ್ನು ‘ಮಾರಾ’ ಎಂದು ಕರೆಯಿರಿ ಎಂದು ನವೊಮಿ ಏಕೆ ಹೇಳಿದಳು?", "a": "ಸರ್ವಶಕ್ತ ದೇವರು ತನ್ನನ್ನು ಬಹಳ ದುಃಖಪಡಿಸಿದ್ದರಿಂದ", "r": "1:20"}, {"n": 225, "q": "“ನನ್ನನ್ನು ‘ನವೊಮಿ’ ಎಂದು ಕರೆಯಬೇಡಿ; ‘ಮಾರಾ’ ಎಂದು ಕರೆಯಿರಿ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ನವೊಮಿ ಬೆತ್ಲೆಹೇಮಿನ ಹೆಂಗಸರಿಗೆ", "r": "1:20"}, {"n": 226, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ಅವಳನ್ನು ಬಹಳ ದುಃಖಪಡಿಸಿದವರು ಯಾರು?", "a": "ಸರ್ವಶಕ್ತ ದೇವರು", "r": "1:20"}, {"n": 227, "q": "ನವೊಮಿ ತನ್ನ ದುಃಖಕ್ಕೆ ಕಾರಣರೆಂದು ದೇವರನ್ನು ಯಾವ ಎರಡು ಹೆಸರುಗಳಿಂದ ಉಲ್ಲೇಖಿಸುತ್ತಾಳೆ?", "a": "ಸರ್ವಶಕ್ತ ದೇವರು; ಸರ್ವೇಶ್ವರ", "r": "1:20–21"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವಳು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಕರೆಯಬೇಡಿ;”", "a": "ನವೊಮಿ", "r": "1:20"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನ್ನನ್ನು ಬಹಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದುಃಖಪಡಿಸಿದ್ದಾರೆ", "r": "1:20"}, {"n": 230, "q": "“ಅದಕ್ಕೆ ಅವಳು ನನ್ನನ್ನು ನವೊಮಿ ಎಂದು ಕರೆಯಬೇಡಿ;” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "1:20"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನವೊಮಿ ಎಂದು ಕರೆಯಬೇಡಿ;”", "a": "ನನ್ನನ್ನು", "r": "1:20"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನನ್ನನ್ನು ಬಹಳ ದುಃಖಪಡಿಸಿದ್ದಾರೆ.”", "a": "ಸರ್ವಶಕ್ತ", "r": "1:20"}, {"n": 233, "q": "“ಏಕೆಂದರೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನ್ನನ್ನು ಬಹಳ ದುಃಖಪಡಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "1:20"}, {"n": 234, "q": "ನವೊಮಿ ಇಲ್ಲಿಂದ (ಬೆತ್ಲೆಹೇಮಿನಿಂದ) ಹೇಗೆ ಹೋದೆ ಎಂದು ಹೇಳಿದಳು?", "a": "ಸಿರಿವಂತಳಾಗಿ", "r": "1:21"}, {"n": 235, "q": "ಸರ್ವೇಶ್ವರ ತನ್ನನ್ನು ಹೇಗೆ ಹಿಂದಕ್ಕೆ ಕರೆತಂದಿದ್ದಾರೆ ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಗತಿಹೀನಳನ್ನಾಗಿ", "r": "1:21"}, {"n": 236, "q": "ನವೊಮಿ ತಾನು ಹೋದಾಗಿನ ಮತ್ತು ಹಿಂದಿರುಗಿದಾಗಿನ ಸ್ಥಿತಿಯನ್ನು ಹೇಗೆ ಹೋಲಿಸಿದಳು?", "a": "ಸಿರಿವಂತಳಾಗಿ ಇಲ್ಲಿಂದ ಹೋದೆ; ಗತಿಹೀನಳನ್ನಾಗಿ ಸರ್ವೇಶ್ವರ ನನ್ನನ್ನು ಹಿಂದಕ್ಕೆ ಕರೆತಂದಿದ್ದಾರೆ", "r": "1:21"}, {"n": 237, "q": "ಊರಿನ ಹೆಂಗಸರಿಗೆ ಉತ್ತರಕೊಡುವಾಗ ನವೊಮಿ ಕೊನೆಯಲ್ಲಿ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀವು ನನ್ನನ್ನು ನವೊಮಿ ಎಂದು ಕರೆಯುವುದು ಸರಿಯೇ?”", "r": "1:21"}, {"n": 238, "q": "ಸರ್ವಶಕ್ತ ದೇವರು ತನಗೆ ವಿರೋಧವಾಗಿ ಏನು ಮಾಡಿದ್ದಾರೆ ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ತನ್ನನ್ನು ಬಾಧಿಸಿದ್ದಾರೆ", "r": "1:21"}, {"n": 239, "q": "ನವೊಮಿ ತನ್ನನ್ನು ‘ನವೊಮಿ’ ಎಂದು ಕರೆಯುವುದು ಸರಿಯಲ್ಲ ಎಂದು ಭಾವಿಸಿದ್ದು ಯಾವ ಸ್ಥಿತಿಯಲ್ಲಿ?", "a": "ಸರ್ವಶಕ್ತ ದೇವರು ತನಗೆ ವಿರೋಧವಾಗಿ ತನ್ನನ್ನು ಬಾಧಿಸಿರುವಾಗ", "r": "1:21"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ವೇಶ್ವರ ನನ್ನನ್ನು ಹಿಂದಕ್ಕೆ ಕರೆತಂದಿದ್ದಾರೆ.”", "a": "ಗತಿಹೀನಳನ್ನಾಗಿ", "r": "1:21"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನಗೆ ವಿರೋಧವಾಗಿ ನನ್ನನ್ನು ಬಾಧಿಸಿರುವಾಗ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಕರೆಯುವುದು ಸರಿಯೇ?”", "a": "ನವೊಮಿ", "r": "1:21"}, {"n": 242, "q": "“ಗತಿಹೀನಳನ್ನಾಗಿ ಸರ್ವೇಶ್ವರ ನನ್ನನ್ನು ಹಿಂದಕ್ಕೆ ಕರೆತಂದಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "1:21"}, {"n": 243, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನಗೆ ವಿರೋಧವಾಗಿ ನನ್ನನ್ನು …”", "a": "“… ಬಾಧಿಸಿರುವಾಗ ನೀವು ನನ್ನನ್ನು ನವೊಮಿ ಎಂದು ಕರೆಯುವುದು ಸರಿಯೇ?”", "r": "1:21"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗತಿಹೀನಳನ್ನಾಗಿ ಸರ್ವೇಶ್ವರ ನನ್ನನ್ನು ಹಿಂದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕರೆತಂದಿದ್ದಾರೆ", "r": "1:21"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನಗೆ ವಿರೋಧವಾಗಿ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನನ್ನು ನವೊಮಿ ಎಂದು ಕರೆಯುವುದು ಸರಿಯೇ?”", "a": "ಬಾಧಿಸಿರುವಾಗ", "r": "1:21"}, {"n": 246, "q": "“ಹೀಗೆ ಸರ್ವಶಕ್ತ ದೇವರು ನನಗೆ ವಿರೋಧವಾಗಿ ನನ್ನನ್ನು ಬಾಧಿಸಿರುವಾಗ ನೀವು ನನ್ನನ್ನು ನವೊಮಿ ಎಂದು ಕರೆಯುವುದು ಸರಿಯೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "1:21"}, {"n": 247, "q": "ನವೊಮಿ ಬೆತ್ಲೆಹೇಮಿಗೆ ಯಾರ ಸಂಗಡ ಬಂದಳು?", "a": "ತನ್ನ ಮೋವಾಬ್ಯ ಸೊಸೆಯಾದ ರೂತಳ ಸಂಗಡ", "r": "1:22"}, {"n": 248, "q": "ನವೊಮಿ ಮತ್ತು ರೂತಳು ಬೆತ್ಲೆಹೇಮಿಗೆ ಬಂದಾಗ ಯಾವ ಸುಗ್ಗಿ ಪ್ರಾರಂಭವಾಗಿತ್ತು?", "a": "ಜವೆಗೋದಿಯ ಸುಗ್ಗಿ", "r": "1:22"}, {"n": 249, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ರೂತಳನ್ನು ಯಾವ ವಿಶೇಷಣದಿಂದ ಪರಿಚಯಿಸಲಾಗಿದೆ?", "a": "ನವೊಮಿಯ ಮೋವಾಬ್ಯ ಸೊಸೆ", "r": "1:22"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೊಸೆಯಾದ ರೂತಳ ಸಂಗಡ ಬೆತ್ಲೆಹೇಮಿಗೆ ಬಂದಳು.”", "a": "ಮೋವಾಬ್ಯ", "r": "1:22"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಜವೆಗೋದಿಯ ಸುಗ್ಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಾರಂಭವಾಗಿತ್ತು", "r": "1:22"}, {"n": 252, "q": "“ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಮೋವಾಬ್ಯ ಸೊಸೆಯಾದ ರೂತಳ ಸಂಗಡ ಬೆತ್ಲೆಹೇಮಿಗೆ ಬಂದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "1:22"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಮೋವಾಬ್ಯ ಸೊಸೆಯಾದ ರೂತಳ ಸಂಗಡ ಬೆತ್ಲೆಹೇಮಿಗೆ ಬಂದಳು.”", "a": "ನವೊಮಿ", "r": "1:22"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಗ್ಗಿ ಪ್ರಾರಂಭವಾಗಿತ್ತು.”", "a": "ಜವೆಗೋದಿಯ", "r": "1:22"}, {"n": 255, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಮೋವಾಬ್ಯ …”", "a": "“… ಸೊಸೆಯಾದ ರೂತಳ ಸಂಗಡ ಬೆತ್ಲೆಹೇಮಿಗೆ ಬಂದಳು.”", "r": "1:22"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನವೊಮಿ ತನ್ನ ಮೋವಾಬ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳ ಸಂಗಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಳು.”", "a": "ಸೊಸೆಯಾದ; ಬೆತ್ಲೆಹೇಮಿಗೆ", "r": "1:22"}]}]}</script>

Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
