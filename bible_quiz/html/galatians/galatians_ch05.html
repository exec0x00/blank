ಬಾಳಬೇಕೆಂದು …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.”", "r": "5:1"}, {"n": 12, "q": "“ಗುಲಾಮಗಿರಿಯ ನೊಗಕ್ಕೆ ಪುನಃ ಕೊರಳನ್ನು ಒಡ್ಡದಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "5:1"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಮುಕ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು.”", "a": "ಸ್ವಾತಂತ್ರ್ಯದಿಂದ", "r": "5:1"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ಬಿಡುಗಡೆ", "r": "5:1"}, {"n": 15, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:2ರಲ್ಲಿ ತನ್ನ ಹೆಸರನ್ನು ಹೇಳಿಕೊಂಡು ಮಾತನಾಡುವವರು ಯಾರು?", "a": "ಪೌಲನು (“ಪೌಲನಾದ ನಾನು”)", "r": "5:2"}, {"n": 16, "q": "ಗಲಾತ್ಯರು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ಅವರಿಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ", "r": "5:2"}, {"n": 17, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸುನ್ನತಿ’ ವಿಷಯ ಬರುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:2, 5:3, 5:6, 5:11", "r": "5:2; 5:3; 5:6; 5:11"}, {"n": 18, "q": "ಪೌಲನು 5:2ರಲ್ಲಿ ಗಲಾತ್ಯರಿಗೆ ಹೇಳುವ ಮಾತುಗಳನ್ನು ಹೇಗೆ ಆರಂಭಿಸುತ್ತಾನೆ?", "a": "“ಪೌಲನಾದ ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳಿ”", "r": "5:2"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತ", "r": "5:2"}, {"n": 20, "q": "“ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "5:2"}, {"n": 21, "q": "ಗಲಾತ್ಯರಿಗೆ 5:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪೌಲನಾದ ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳಿ: ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.", "r": "5:2"}, {"n": 22, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ …”", "a": "“… ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "r": "5:2"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ ಆಗುವುದಿಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಂಡರೆ", "r": "5:2"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಯಾವ ಪ್ರಯೋಜನವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೇಸುವಿನಿಂದ; ಆಗುವುದಿಲ್ಲ", "r": "5:2"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೆ ಕ್ರಿಸ್ತ ಯೇಸುವಿನಿಂದ ನಿಮಗೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗುವುದಿಲ್ಲ.”", "a": "ಪ್ರಯೋಜನವೂ", "r": "5:2"}, {"n": 26, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಏನನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ?", "a": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "5:3"}, {"n": 27, "q": "ಸುನ್ನತಿಯ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಹೇಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ಪುನಃ ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ", "r": "5:3"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "5:3"}, {"n": 29, "q": "“ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "5:3"}, {"n": 30, "q": "ಗಲಾತ್ಯರಿಗೆ 5:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.", "r": "5:3"}, {"n": 31, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು …”", "a": "“… ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "r": "5:3"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಬದ್ಧನಾಗಿದ್ದಾನೆ", "r": "5:3"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳುವ; ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "5:3"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಇಡೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಲು ಬದ್ಧನಾಗಿದ್ದಾನೆ ಎಂದು ಪುನಃ ನಿಮಗೆ ನಾನು ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:3"}, {"n": 35, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳ ಮೂಲಕ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು ಯಾರಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದಾರೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ", "r": "5:4"}, {"n": 36, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು ಯಾವುದರಿಂದ ದೂರವಾಗಿದ್ದಾರೆ?", "a": "ದೈವಾನುಗ್ರಹದಿಂದ", "r": "5:4"}, {"n": 37, "q": "ಪೌಲನ ಪ್ರಕಾರ ದೈವಾನುಗ್ರಹದಿಂದ ದೂರವಾಗಿರುವವರು ಯಾರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವವರು", "r": "5:4"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ", "r": "5:4"}, {"n": 39, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "5:4"}, {"n": 40, "q": "ಗಲಾತ್ಯರಿಗೆ 5:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ. ದೈವಾನುಗ್ರಹದಿಂದ ದೂರವಾಗಿದ್ದೀರಿ.", "r": "5:4"}, {"n": 41, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ …”", "a": "“… ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "r": "5:4"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ", "r": "5:4"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು; ಪಡೆಯಬೇಕೆಂದಿರುವ", "r": "5:4"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರ ಮೂಲಕವೇ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಬೇಕೆಂದಿರುವ ನೀವು ಕ್ರಿಸ್ತಯೇಸುವಿನಿಂದ ಬೇರ್ಪಟ್ಟಿದ್ದೀರಿ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:4"}, {"n": 45, "q": "ನಾವು ಯಾವ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ", "r": "5:5"}, {"n": 46, "q": "ನಾವು ಏನನ್ನು ಎದುರುನೋಡುತ್ತಿದ್ದೇವೆ?", "a": "ಈ ನಿರೀಕ್ಷೆ ಸಫಲವಾಗುವುದನ್ನು", "r": "5:5"}, {"n": 47, "q": "ನಾವು ಯಾರ ಮುಖಾಂತರ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ?", "a": "ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ", "r": "5:5"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ಪವಿತ್ರಾತ್ಮರ", "r": "5:5"}, {"n": 49, "q": "“ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "5:5"}, {"n": 50, "q": "ಗಲಾತ್ಯರಿಗೆ 5:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ; ಈ ನಿರೀಕ್ಷೆ ಸಫಲವಾಗುವುದನ್ನು ಎದುರುನೋಡುತ್ತಿದ್ದೇವೆ.", "r": "5:5"}, {"n": 51, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ …”", "a": "“… ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "r": "5:5"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಉಳ್ಳವರಾಗಿದ್ದೇವೆ", "r": "5:5"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ ವಿಶ್ವಾಸದಿಂದ ದೇವರೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ಸತ್ಸಂಬಂಧವನ್ನು; ಹೊಂದುತ್ತೇವೆಂಬ", "r": "5:5"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವಾದರೋ ಪವಿತ್ರಾತ್ಮರ ಮುಖಾಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರೊಂದಿಗೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದುತ್ತೇವೆಂಬ ನಿರೀಕ್ಷೆ ಉಳ್ಳವರಾಗಿದ್ದೇವೆ;”", "a": "ವಿಶ್ವಾಸದಿಂದ", "r": "5:5"}, {"n": 55, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಯಾವುದು ಮುಖ್ಯವಲ್ಲ?", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "5:6"}, {"n": 56, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಪ್ರಮುಖವಾದುದು ಯಾವುದು?", "a": "ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸ", "r": "5:6"}, {"n": 57, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಪ್ರೀತಿ’ಯನ್ನು ಉಲ್ಲೇಖಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:6, 5:13, 5:14, 5:22", "r": "5:6; 5:13; 5:14; 5:22"}, {"n": 58, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಮುಖ್ಯವಲ್ಲದವರು ಯಾರು?", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ", "r": "5:6"}, {"n": 59, "q": "ಪ್ರಮುಖವಾದ ವಿಶ್ವಾಸವು ಹೇಗೆ ಕಾರ್ಯ ಎಸಗುತ್ತದೆ?", "a": "ಪ್ರೀತಿಯಿಂದ", "r": "5:6"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತ", "r": "5:6"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಮುಖವಾದುದು", "r": "5:6"}, {"n": 62, "q": "“ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 63, "q": "ಗಲಾತ್ಯರಿಗೆ 5:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ. ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ ಪ್ರಮುಖವಾದುದು.", "r": "5:6"}, {"n": 64, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ …”", "a": "“… ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "r": "5:6"}, {"n": 65, "q": "“ಪ್ರೀತಿಯಿಂದ ಕಾರ್ಯ ಎಸಗುವ ವಿಶ್ವಾಸವೇ ಪ್ರಮುಖವಾದುದು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ ಬಾಳುವವರಿಗೆ ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖ್ಯವಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "5:6"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತ ಯೇಸುವಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ ಅಥವಾ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮುಖ್ಯವಲ್ಲ.”", "a": "ಬಾಳುವವರಿಗೆ", "r": "5:6"}, {"n": 68, "q": "ಪೌಲನು ಗಲಾತ್ಯರ ಬದುಕನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ಓಟಕ್ಕೆ (“ನಿಮ್ಮ ಬದುಕಿನ ಓಟ”)", "r": "5:7"}, {"n": 69, "q": "ಗಲಾತ್ಯರ ಓಟಕ್ಕೆ ಅಡ್ಡಿಯಾದದ್ದರ ಬಗ್ಗೆ ಪೌಲನು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?”", "r": "5:7"}, {"n": 70, "q": "ಇದುವರೆಗೂ ಗಲಾತ್ಯರ ಬದುಕಿನ ಓಟ ಹೇಗೆ ಸಾಗುತ್ತಿತ್ತು?", "a": "ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು", "r": "5:7"}, {"n": 71, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಶರಣರಾಗದಂತೆ ತಡೆಯಲ್ಪಟ್ಟರು?", "a": "ಸತ್ಯಕ್ಕೆ", "r": "5:7"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಗುತ್ತಿತ್ತು", "r": "5:7"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?”", "a": "ಶರಣರಾಗದಂತೆ", "r": "5:7"}, {"n": 74, "q": "“ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 75, "q": "ಗಲಾತ್ಯರಿಗೆ 5:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದುವರೆಗೂ ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು. ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?", "r": "5:7"}, {"n": 76, "q": "“ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ ನಿಮ್ಮನ್ನು ತಡೆದವರು ಯಾರು?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಬದುಕಿನ ಓಟ ಚೆನ್ನಾಗಿ ಸಾಗುತ್ತಿತ್ತು.”", "a": "ಇದುವರೆಗೂ", "r": "5:7"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಕ್ಕೆ ಶರಣರಾಗದಂತೆ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಡೆದವರು ಯಾರು?”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:7"}, {"n": 79, "q": "ಗಲಾತ್ಯರಿಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು ಯಾರು ಅಲ್ಲ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರನ್ನು ಕರೆದ ದೇವರು ಅಲ್ಲ", "r": "5:8"}, {"n": 80, "q": "ಗಲಾತ್ಯರನ್ನು ಕರೆದವರು ಯಾರು?", "a": "ದೇವರು", "r": "5:8"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:8"}, {"n": 82, "q": "“ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "5:8"}, {"n": 83, "q": "ಗಲಾತ್ಯರಿಗೆ 5:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.", "r": "5:8"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ಮಾಡಿದವರು", "r": "5:8"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಅಡ್ಡಿ ಮಾಡಿದವರು, ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರೇನೂ ಅಲ್ಲ.”", "a": "ಕರೆದ", "r": "5:8"}, {"n": 86, "q": "ಹುಳಿಯ ಬಗ್ಗೆ ಪೌಲನು ಹೇಳುವ ಗಾದೆ ಮಾತು ಯಾವುದು?", "a": "“ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!”", "r": "5:9"}, {"n": 87, "q": "ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು ಎಷ್ಟು ಹುಳಿ ಸಾಕು?", "a": "ಒಂದಿಷ್ಟು", "r": "5:9"}, {"n": 88, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:9ರಲ್ಲಿ ಸ್ವಲ್ಪ ಹುಳಿ ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಏನು ಮಾಡುತ್ತದೆ?", "a": "ಹುದುಗೆಬ್ಬಿಸುತ್ತದೆ", "r": "5:9"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುದುಗೆಬ್ಬಿಸಲು!”", "a": "ಹಿಟ್ಟನ್ನೆಲ್ಲಾ", "r": "5:9"}, {"n": 90, "q": "“ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "5:9"}, {"n": 91, "q": "ಗಲಾತ್ಯರಿಗೆ 5:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಒಂದಿಷ್ಟು ಹುಳಿ ಸಾಕು, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!", "r": "5:9"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದಿಷ್ಟು ಹುಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಿಟ್ಟನ್ನೆಲ್ಲಾ ಹುದುಗೆಬ್ಬಿಸಲು!”", "a": "ಸಾಕು", "r": "5:9"}, {"n": 93, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನಿಗೆ ಪ್ರಭುವಿನಲ್ಲಿ ಯಾವ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ?", "a": "ಅವರು ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ಮಣಿಯುವುದಿಲ್ಲವೆಂದು", "r": "5:10"}, {"n": 94, "q": "ಗಲಾತ್ಯರಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "5:10"}, {"n": 95, "q": "ಗಲಾತ್ಯರ ಬಗ್ಗೆ ಪೌಲನ ದೃಢವಾದ ನಂಬಿಕೆ ಯಾರಲ್ಲಿ ಇದೆ?", "a": "ಪ್ರಭುವಿನಲ್ಲಿ", "r": "5:10"}, {"n": 96, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ಪೌಲನಿಗೆ ನಂಬಿಕೆ ಇದೆ?", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ", "r": "5:10"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ", "r": "5:10"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "5:10"}, {"n": 99, "q": "“ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 100, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ …”", "a": "“… ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.”", "r": "5:10"}, {"n": 101, "q": "ಗಲಾತ್ಯರಿಗೆ 5:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ. ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.", "r": "5:10"}, {"n": 102, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು ಮಣಿಯುವುದಿಲ್ಲವೆಂದು ನಿಮ್ಮನ್ನು ಕುರಿತು …”", "a": "“… ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "r": "5:10"}, {"n": 103, "q": "“ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲ ಎಬ್ಬಿಸುವವನು ಯಾರೇ ಆಗಿರಲಿ, ಅವನು ದೈವ ದಂಡನೆಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿಗೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮನ್ನು ಕುರಿತು ಪ್ರಭುವಿನಲ್ಲಿ ನನಗೆ ದೃಢವಾದ ನಂಬಿಕೆ ಇದೆ.”", "a": "ಮಣಿಯುವುದಿಲ್ಲವೆಂದು", "r": "5:10"}, {"n": 105, "q": "ಪೌಲನ ಬಗ್ಗೆ ಕೆಲವರು ಏನು ಹೇಳುತ್ತಿದ್ದರು?", "a": "ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ಅವನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿದ್ದಾನೆ ಎಂದು", "r": "5:11"}, {"n": 106, "q": "ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸುತ್ತಿದ್ದರೆ ತನಗೆ ಏನಾಗುತ್ತಿರಲಿಲ್ಲ ಎಂದು ಪೌಲನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು?”", "r": "5:11"}, {"n": 107, "q": "ಪೌಲನು ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸಿದ್ದರೆ ಯಾವುದರಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ?", "a": "ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ", "r": "5:11"}, {"n": 108, "q": "ಪೌಲನು ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಯಾವ ಸಂಬೋಧನೆಯಿಂದ ಕರೆಯುತ್ತಾನೆ?", "a": "“ಸಹೋದರರೇ” (5:11; 5:13)", "r": "5:11; 5:13"}, {"n": 109, "q": "ಪೌಲನು ಸುನ್ನತಿಯನ್ನು ಬೋಧಿಸುತ್ತಿಲ್ಲ ಎಂಬುದಕ್ಕೆ ಅವನು ಕೊಡುವ ಪುರಾವೆ ಏನು?", "a": "ಅವನು ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸುತ್ತಿರುವುದು", "r": "5:11"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?”", "a": "ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು", "r": "5:11"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು", "r": "5:11"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "5:11"}, {"n": 113, "q": "“ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 114, "q": "“ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 115, "q": "ಗಲಾತ್ಯರಿಗೆ 5:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ? ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು? ನಾನು ಹಾಗೇನಾದರೂ ಬೋಧಿಸಿದ್ದರೆ, ಶಿಲುಬೆಯ ಸಂದೇಶದಿಂದ ಯಾವ ಅಡ್ಡಿ ಆತಂಕವೂ ಉಂಟಾಗುತ್ತಿರಲಿಲ್ಲ.", "r": "5:11"}, {"n": 116, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಹೋದರರೇ, ಸುನ್ನತಿಮಾಡಿಸಿಕೊಳ್ಳುವುದು ಅವಶ್ಯಕವೆಂದು ನಾನು …”", "a": "“… ಇನ್ನೂ ಬೋಧಿಸುತ್ತಿರುವುದಾಗಿ ಕೆಲವರು ಹೇಳುತ್ತಿದ್ದಾರಲ್ಲವೇ?”", "r": "5:11"}, {"n": 117, "q": "“ಹಾಗೆ ಬೋಧಿಸುತ್ತಿರುವುದಾದರೆ ನಾನೇಕೆ ಹೀಗೆ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ಅನುಭವಿಸಬೇಕಾಗುತ್ತಿತ್ತು?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 118, "q": "ಗಲಾತ್ಯರಿಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು", "r": "5:12"}, {"n": 119, "q": "ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು ಎಂದು ಪೌಲನು ಯಾರ ಬಗ್ಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ಗಲಾತ್ಯರಿಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರ ಬಗ್ಗೆ", "r": "5:12"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.”", "a": "ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ", "r": "5:12"}, {"n": 121, "q": "“ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "5:12"}, {"n": 122, "q": "ಗಲಾತ್ಯರಿಗೆ 5:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.", "r": "5:12"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ ಲೇಸು.”", "a": "ಕೊಡುತ್ತಿರುವವರು", "r": "5:12"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ಕಿರುಕುಳ ಕೊಡುತ್ತಿರುವವರು ತಮ್ಮ ಅಂಗಚ್ಛೇದವನ್ನಾದರೂ ಮಾಡಿಕೊಂಡರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಲೇಸು", "r": "5:12"}, {"n": 125, "q": "ದೇವರು ಗಲಾತ್ಯರನ್ನು ಯಾವ ಜೀವನಕ್ಕೆ ಕರೆದಿದ್ದಾರೆ?", "a": "ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನಕ್ಕೆ", "r": "5:13"}, {"n": 126, "q": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಯಾವುದಕ್ಕೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬಾರದು?", "a": "ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ", "r": "5:13"}, {"n": 127, "q": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದುರುಪಯೋಗ ಮಾಡುವ ಬದಲು ಗಲಾತ್ಯರು ಏನು ಮಾಡಬೇಕು?", "a": "“ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.”", "r": "5:13"}, {"n": 128, "q": "ಗಲಾತ್ಯರು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ಕರೆದವರು ಯಾರು?", "a": "ದೇವರು", "r": "5:13"}, {"n": 129, "q": "ಗಲಾತ್ಯರು ಒಬ್ಬರಿಗೊಬ್ಬರು ಹೇಗೆ ಸೇವೆಮಾಡಬೇಕು?", "a": "ಪ್ರೀತಿಯಿಂದ", "r": "5:13"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.”", "a": "ನಡೆಸಬೇಕೆಂದು", "r": "5:13"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ.”", "a": "ಸ್ವಾತಂತ್ರ್ಯವನ್ನು", "r": "5:13"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.”", "a": "ಒಬ್ಬರಿಗೊಬ್ಬರು", "r": "5:13"}, {"n": 133, "q": "“ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 134, "q": "“ಬದಲಾಗಿ, ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 135, "q": "ಗಲಾತ್ಯರಿಗೆ 5:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ. ಆದರೆ, ಆ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ. ಬದಲಾಗಿ, ನೀವು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪ್ರೀತಿಯಿಂದ ಸೇವೆಮಾಡಿರಿ.", "r": "5:13"}, {"n": 136, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಹೋದರರೇ, ನೀವು ಮುಕ್ತ ಸ್ವತಂತ್ರ …”", "a": "“… ಜೀವನವನ್ನು ನಡೆಸಬೇಕೆಂದು ದೇವರು ನಿಮ್ಮನ್ನು ಕರೆದಿದ್ದಾರೆ.”", "r": "5:13"}, {"n": 137, "q": "“ಆದರೆ, ಆ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ದೈಹಿಕ ಬಯಕೆಗಳಿಗೆ ಸಾಧನವಾಗಿ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 138, "q": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿರುವ ಒಂದೇ ವಚನ ಯಾವುದು?", "a": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು”", "r": "5:14"}, {"n": 139, "q": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು” ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಏನು ಅಡಗಿದೆ?", "a": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರ", "r": "5:14"}, {"n": 140, "q": "“… ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು” — ನಾವು ನೆರೆಯವರನ್ನು ಯಾರಂತೆ ಪ್ರೀತಿಸಬೇಕು?", "a": "ನಮ್ಮನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ", "r": "5:14"}, {"n": 141, "q": "ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಎಷ್ಟು ವಚನದಲ್ಲಿ ಅಡಗಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಒಂದೇ ವಚನದಲ್ಲಿ", "r": "5:14"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ", "r": "5:14"}, {"n": 143, "q": "“‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "5:14"}, {"n": 144, "q": "ಗಲಾತ್ಯರಿಗೆ 5:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,” ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.", "r": "5:14"}, {"n": 145, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ …”", "a": "“… ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "r": "5:14"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಡಗಿದೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರವು", "r": "5:14"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸು,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ನಿನ್ನನ್ನೇ; ನೆರೆಯವರನ್ನು", "r": "5:14"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂಬ ಒಂದೇ ವಚನದಲ್ಲಿ ಇಡೀ ಧರ್ಮಶಾಸ್ತ್ರವು ಅಡಗಿದೆ.”", "a": "ಪ್ರೀತಿಸು", "r": "5:14"}, {"n": 149, "q": "ಗಲಾತ್ಯರು ನಿಲ್ಲಿಸಬೇಕಾದ ಮೂರು ವಿಷಯಗಳು ಯಾವುವು?", "a": "ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ", "r": "5:15"}, {"n": 150, "q": "ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಪೌಲನು ಎಚ್ಚರಿಸುತ್ತಾನೆ?", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ", "r": "5:15"}, {"n": 151, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:15 ಯಾವ ಪದದಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಎಚ್ಚರಿಕೆ!", "r": "5:15"}, {"n": 152, "q": "ಗಲಾತ್ಯರು ಕಚ್ಚಾಟವನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಯಾರಿಂದ ವಿನಾಶವಾದಾರು?", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು", "r": "5:15"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "a": "ನಿಲ್ಲಿಸದಿದ್ದರೆ", "r": "5:15"}, {"n": 154, "q": "“ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "5:15"}, {"n": 155, "q": "ಗಲಾತ್ಯರಿಗೆ 5:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!", "r": "5:15"}, {"n": 156, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ …”", "a": "“… - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "r": "5:15"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿನಾಶವಾದೀರಿ, ಎಚ್ಚರಿಕೆ!”", "a": "ಒಬ್ಬರಿಂದೊಬ್ಬರು", "r": "5:15"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಚ್ಚರಿಕೆ!”", "a": "ಇವುಗಳನ್ನು; ವಿನಾಶವಾದೀರಿ", "r": "5:15"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀವು ನಿಮ್ಮ ಕಚ್ಚಾಟ, ಕಿತ್ತಾಟ, ನುಂಗಾಟ - ಇವುಗಳನ್ನು ನಿಲ್ಲಿಸದಿದ್ದರೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ವಿನಾಶವಾದೀರಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಎಚ್ಚರಿಕೆ", "r": "5:15"}, {"n": 160, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:16ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಹಾಗೂ ದೇಹದ ದುಷ್ಫಲಗಳು", "r": "5:16"}, {"n": 161, "q": "ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು?", "a": "ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ", "r": "5:16"}, {"n": 162, "q": "ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಂಡರೆ ಗಲಾತ್ಯರು ಯಾವುದಕ್ಕೆ ಈಡಾಗಲಾರರು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ", "r": "5:16"}, {"n": 163, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಜಯಿಸಲು ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಐದನೆಯ ಅಧ್ಯಾಯ ನೀಡುವ ಎರಡು ಮಾರ್ಗಗಳು ಯಾವುವು?", "a": "1) ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳುವುದು (5:16); 2) ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಶಿಲುಬೆಗೆ ಜಡಿಯುವುದು (5:24)", "r": "5:16; 5:24"}, {"n": 164, "q": "“ನಾನು ಹೇಳುವುದೇನೆಂದರೆ:” — ಎಂದು ಆರಂಭಿಸಿ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು.”", "r": "5:16"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ದೈಹಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಈಡಾಗಲಾರಿರಿ.”", "a": "ವ್ಯಾಮೋಹಕ್ಕೆ", "r": "5:16"}, {"n": 166, "q": "ಗಲಾತ್ಯರಿಗೆ 5:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಹೇಳುವುದೇನೆಂದರೆ: ನೀವು ಪವಿತ್ರಾತ್ಮರ ಪ್ರೇರಣೆಗನುಸಾರವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು. ಆಗ, ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ನೀವು ಈಡಾಗಲಾರಿರಿ.", "r": "5:16"}, {"n": 167, "q": "“ಆಗ, ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ನೀವು ಈಡಾಗಲಾರಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "5:16"}, {"n": 168, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಯಾರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ?", "a": "ಪವಿತ್ರಾತ್ಮರಿಗೆ", "r": "5:17"}, {"n": 169, "q": "ನಮ್ಮ ಬಯಕೆ ಏಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹ ಮತ್ತು ಪವಿತ್ರಾತ್ಮ ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ", "r": "5:17"}, {"n": 170, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹಕ್ಕೆ ವಿರುದ್ಧವಾಗಿರುವವರು ಯಾರು?", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "5:17"}, {"n": 171, "q": "ಯಾವ ಎರಡು ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುತ್ತವೆ?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹ ಮತ್ತು ಪವಿತ್ರಾತ್ಮ", "r": "5:17"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾಗಿದೆ.”", "a": "ಪವಿತ್ರಾತ್ಮರಿಗೆ", "r": "5:17"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.”", "a": "ಕಾದಾಡುವುದರಿಂದ", "r": "5:17"}, {"n": 174, "q": "“ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಪವಿತ್ರಾತ್ಮರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 175, "q": "“ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 176, "q": "ಗಲಾತ್ಯರಿಗೆ 5:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ದೈಹಿಕ ವ್ಯಾಮೋಹವು ಪವಿತ್ರಾತ್ಮರಿಗೆ ವಿರುದ್ಧವಾಗಿದೆ. ಪವಿತ್ರಾತ್ಮ ಆ ವ್ಯಾಮೋಹಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದ್ದಾರೆ. ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ ಕೈಗೂಡುವುದಿಲ್ಲ.", "r": "5:17"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ ಬಯಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಗೂಡುವುದಿಲ್ಲ", "r": "5:17"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವೆರಡೂ ಒಂದಕ್ಕೊಂದು ಕಾದಾಡುವುದರಿಂದ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈಗೂಡುವುದಿಲ್ಲ.”", "a": "ಬಯಕೆ", "r": "5:17"}, {"n": 179, "q": "ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರು ಯಾವುದಕ್ಕೆ ಅಧೀನರಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ", "r": "5:18"}, {"n": 180, "q": "ಗಲಾತ್ಯರು ಯಾವಾಗ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ಅಧೀನರಲ್ಲ?", "a": "ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ", "r": "5:18"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "5:18"}, {"n": 182, "q": "“ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "5:18"}, {"n": 183, "q": "ಗಲಾತ್ಯರಿಗೆ 5:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.", "r": "5:18"}, {"n": 184, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ …”", "a": "“… ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "r": "5:18"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ವಿಧಿನಿಯಮಗಳಿಗೆ", "r": "5:18"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ ಮಾರ್ಗದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ನಡೆಯುವವರಾದರೆ; ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "5:18"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ನಡೆಸುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆಯುವವರಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳಿಗೆ ನೀವು ಅಧೀನರಲ್ಲ.”", "a": "ಮಾರ್ಗದಲ್ಲಿ", "r": "5:18"}, {"n": 188, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳಲ್ಲಿ 5:19ರಲ್ಲಿ ಹೇಳಲಾದ ಮೂರು ಯಾವುವು?", "a": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ", "r": "5:19"}, {"n": 189, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:19–20ರಲ್ಲಿ ಹೆಸರಿಸಲಾದ ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ಎಷ್ಟು?", "a": "ಹದಿನಾಲ್ಕು (ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ, ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ) — “ಇತ್ಯಾದಿಗಳು”", "r": "5:19–20"}, {"n": 190, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳನ್ನು ಪೌಲನು ಹೇಳಿದ ಕ್ರಮದಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಿ.", "a": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ, ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ", "r": "5:19–20"}, {"n": 191, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಅವು ತಿಳಿದೇ ಇವೆ", "r": "5:19"}, {"n": 192, "q": "ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ ಇವು ಯಾವುದರ ದುಷ್ಪರಿಣಾಮಗಳು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ", "r": "5:19"}, {"n": 193, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ಎಷ್ಟು, ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಎಷ್ಟು?", "a": "ದುಷ್ಪರಿಣಾಮಗಳು ಹದಿನಾಲ್ಕು; ಸತ್ಫಲಗಳು ಒಂಬತ್ತು", "r": "5:19–22"}, {"n": 194, "q": "ಗಲಾತ್ಯರಿಗೆ 5:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳು ತಿಳಿದೇ ಇವೆ: ಹಾದರ, ಅಶುದ್ಧತೆ, ಕಾಮುಕತನ,", "r": "5:19"}, {"n": 195, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ವಿಗ್ರಹಾರಾಧನೆ’ಯ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಮಾಟಮಂತ್ರ", "r": "5:20"}, {"n": 196, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ಕೊನೆಯದು ಯಾವುದು?", "a": "ದುಂದೌತಣ", "r": "5:20"}, {"n": 197, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲೂ ಅಧ್ಯಾಯದ ಕೊನೆಯ ಎಚ್ಚರಿಕೆಯಲ್ಲೂ ಬರುವ ದುರ್ಗುಣ ಯಾವುದು?", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20; 5:26"}, {"n": 198, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಕ್ರೋಧ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಸ್ವಾರ್ಥಭೇದ", "r": "5:20"}, {"n": 199, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಜಗಳ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20"}, {"n": 200, "q": "ದುಷ್ಪರಿಣಾಮಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಮತ್ಸರ’ದ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ಕುಡುಕತನ", "r": "5:20"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ವಿಗ್ರಹಾರಾಧನೆ", "r": "5:20"}, {"n": 202, "q": "“ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "5:20"}, {"n": 203, "q": "ಗಲಾತ್ಯರಿಗೆ 5:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.", "r": "5:20"}, {"n": 204, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, …”", "a": "“… ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "r": "5:20"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ಹೊಟ್ಟೆಕಿಚ್ಚು", "r": "5:20"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, ಮಾಟಮಂತ್ರ, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ವಾರ್ಥಭೇದ; ಇತ್ಯಾದಿಗಳು", "r": "5:20"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಗ್ರಹಾರಾಧನೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಗೆತನ, ಜಗಳ, ಹೊಟ್ಟೆಕಿಚ್ಚು, ಕ್ರೋಧ, ಸ್ವಾರ್ಥಭೇದ, ಪಕ್ಷಪಾತ, ಮತ್ಸರ, ಕುಡುಕತನ, ದುಂದೌತಣ - ಇತ್ಯಾದಿಗಳು.”", "a": "ಮಾಟಮಂತ್ರ", "r": "5:20"}, {"n": 208, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ಯಾವುದಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ?", "a": "ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ", "r": "5:21"}, {"n": 209, "q": "‘ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ’ ಎಂದು ಪೌಲನು ಯಾವಾಗ ಎಚ್ಚರಿಸಿದ್ದನು?", "a": "ಈಗಾಗಲೇ ಎಚ್ಚರಿಸಿದ್ದನು; ಈಗಲೂ ಎಚ್ಚರಿಸುತ್ತಾನೆ", "r": "5:21"}, {"n": 210, "q": "ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲದವರು ಯಾರು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹದ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು", "r": "5:21"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಎಚ್ಚರಿಸಿದ್ದೇನೆ", "r": "5:21"}, {"n": 212, "q": "“ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "5:21"}, {"n": 213, "q": "ಗಲಾತ್ಯರಿಗೆ 5:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ; ಈಗಲೂ ಎಚ್ಚರಿಸುತ್ತೇನೆ.", "r": "5:21"}, {"n": 214, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ …”", "a": "“… ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "r": "5:21"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ", "r": "5:21"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಈಗಾಗಲೇ ನಿಮ್ಮನ್ನು ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ಕೃತ್ಯಗಳನ್ನು; ಬಾಧ್ಯರಲ್ಲ", "r": "5:21"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಕೃತ್ಯಗಳನ್ನು ಮಾಡುವವರು ದೇವರ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಬಾಧ್ಯರಲ್ಲ ಎಂದು ಈಗಾಗಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಚ್ಚರಿಸಿದ್ದೇನೆ;”", "a": "ನಿಮ್ಮನ್ನು", "r": "5:21"}, {"n": 218, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಯಾವುವು?", "a": "ಪ್ರೀತಿ, ಆನಂದ, ಶಾಂತಿಸಮಾಧಾನ, ಸಹನೆ, ದಯೆ, ಸದ್ಗುಣ, ಪ್ರಾಮಾಣಿಕತೆ, ಸೌಜನ್ಯ, ಸಂಯಮ", "r": "5:22"}, {"n": 219, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5:22ರಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಎಷ್ಟು?", "a": "ಒಂಬತ್ತು", "r": "5:22"}, {"n": 220, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ಮೊದಲನೆಯದು ಮತ್ತು ಕೊನೆಯದು ಯಾವುವು?", "a": "ಪ್ರೀತಿ; ಸಂಯಮ", "r": "5:22"}, {"n": 221, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಸಹನೆ’ಯ ನಂತರ ಬರುವುದು ಯಾವುದು?", "a": "ದಯೆ", "r": "5:22"}, {"n": 222, "q": "ಸತ್ಫಲಗಳ ಪಟ್ಟಿಯಲ್ಲಿ ‘ಸದ್ಗುಣ’ದ ನ     p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
