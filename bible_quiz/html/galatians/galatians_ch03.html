ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ್ದನ್ನು ನಿಮ್ಮ ಕಣ್ಣೆದುರಿಗೇ ಚಿತ್ರಿತಗೊಳಿಸಲಿಲ್ಲವೆ?", "r": "3:1"}, {"n": 12, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಪವಿತ್ರಾತ್ಮರ ಬಗ್ಗೆ ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನೀವು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದು ಹೇಗೆ?”", "r": "3:2"}, {"n": 13, "q": "ಗಲಾತ್ಯರು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದರ ಬಗ್ಗೆ ಪೌಲನು ಮುಂದಿಡುವ ಎರಡು ಆಯ್ಕೆಗಳು ಯಾವುವು?", "a": "1) ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲೋ? 2) ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸಿದ್ದರಿಂದಲೋ?", "r": "3:2"}, {"n": 14, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಪವಿತ್ರಾತ್ಮರು ದೊರಕುವುದು ಯಾವುದರ ಮೂಲಕ?", "a": "ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸುವುದರ ಮೂಲಕ (ವಿಶ್ವಾಸದ ಮೂಲಕ)", "r": "3:2; 3:5; 3:14"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಬಳಿ ಒಂದು ವಿಷಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಕೇಳಲಿಚ್ಛಿಸುತ್ತೇನೆ", "r": "3:2"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದುದು ಹೇಗೆ?”", "a": "ಪವಿತ್ರಾತ್ಮರನ್ನು", "r": "3:2"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವೆ ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ವಿಶ್ವಾಸಿಸಿದ್ದರಿಂದಲೋ", "r": "3:2"}, {"n": 18, "q": "“ನಿಮ್ಮ ಬಳಿ ಒಂದು ವಿಷಯವನ್ನು ಕೇಳಲಿಚ್ಛಿಸುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "3:2"}, {"n": 19, "q": "ಗಲಾತ್ಯರಿಗೆ 3:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ಬಳಿ ಒಂದು ವಿಷಯವನ್ನು ಕೇಳಲಿಚ್ಛಿಸುತ್ತೇನೆ: ನೀವು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪಡೆದುದು ಹೇಗೆ? ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲೋ? ಇಲ್ಲವೆ ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸಿಸಿದ್ದರಿಂದಲೋ?", "r": "3:2"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಬಳಿ ಒಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳಲಿಚ್ಛಿಸುತ್ತೇನೆ:”", "a": "ವಿಷಯವನ್ನು", "r": "3:2"}, {"n": 21, "q": "ಗಲಾತ್ಯರು ಯಾವ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿದ್ದರು?", "a": "ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು", "r": "3:3"}, {"n": 22, "q": "ಗಲಾತ್ಯರು ತಮ್ಮ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಈಗ ಯಾವುದರಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದರು?", "a": "ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ", "r": "3:3"}, {"n": 23, "q": "ಗಲಾತ್ಯರ ಬದಲಾವಣೆಯ ಬಗ್ಗೆ ಪೌಲನು 3:3ರ ಕೊನೆಯಲ್ಲಿ ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀವು ಅಷ್ಟು ಮತಿಗೆಟ್ಟವರೋ?”", "r": "3:3"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "3:3"}, {"n": 25, "q": "“ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 26, "q": "ಗಲಾತ್ಯರಿಗೆ 3:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ? ನೀವು ಅಷ್ಟು ಮತಿಗೆಟ್ಟವರೋ?", "r": "3:3"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ", "r": "3:3"}, {"n": 28, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವನವನ್ನು ಪ್ರಾರಂಭಿಸಿಯೂ …”", "a": "“… ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "r": "3:3"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಪವಿತ್ರಾತ್ಮ ಸಂಬಂಧವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೀವನವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ಅದನ್ನು ಕೇವಲ ದೇಹ ಸಂಬಂಧವಾದ ವಿಧಿಯಿಂದ ಪೂರೈಸಬೇಕೆಂದಿದ್ದೀರೋ?”", "a": "ಆಧ್ಯಾತ್ಮಿಕ; ಪ್ರಾರಂಭಿಸಿಯೂ", "r": "3:3"}, {"n": 30, "q": "ಗಲಾತ್ಯರ ಅನುಭವಗಳ ಬಗ್ಗೆ ಪೌಲನು ಏನು ಕೇಳುತ್ತಾನೆ?", "a": "“ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?”", "r": "3:4"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?”", "a": "ಅನುಭವಗಳೆಲ್ಲವೂ", "r": "3:4"}, {"n": 32, "q": "“ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 33, "q": "ಗಲಾತ್ಯರಿಗೆ 3:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ ವ್ಯರ್ಥವಾದುವು ಎಂದು ಹೇಳೋಣವೇ?", "r": "3:4"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಅನುಭವಗಳೆಲ್ಲವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಹೇಳೋಣವೇ?”", "a": "ವ್ಯರ್ಥವಾದುವು", "r": "3:4"}, {"n": 35, "q": "ದೇವರು ಗಲಾತ್ಯರಿಗೆ ಏನನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ?", "a": "ಪವಿತ್ರಾತ್ಮರನ್ನು", "r": "3:5"}, {"n": 36, "q": "ದೇವರು ಗಲಾತ್ಯರಲ್ಲಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಿರುವುದು ಯಾವುದರಿಂದ?", "a": "ಅವರು ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ ವಿಶ್ವಾಸ ಇಟ್ಟಿರುವುದರಿಂದ (ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ)", "r": "3:5"}, {"n": 37, "q": "ದೇವರು ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಏನನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ?", "a": "ಮಹತ್ಕಾರ್ಯಗಳನ್ನು", "r": "3:5"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.”", "a": "ಪವಿತ್ರಾತ್ಮರನ್ನು", "r": "3:5"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ ಮಾಡುತ್ತಿರುವುದು, ನೀವು ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ", "r": "3:5"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ, ವಿಶ್ವಾಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇಟ್ಟಿರುವುದರಿಂದ", "r": "3:5"}, {"n": 41, "q": "“ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 42, "q": "ಗಲಾತ್ಯರಿಗೆ 3:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ ಮಹತ್ಕಾರ್ಯಗಳನ್ನು ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ. ಹಾಗೆ ಮಾಡುತ್ತಿರುವುದು, ನೀವು ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸಿದ್ದರಿಂದಲ್ಲ. ಶುಭಸಂದೇಶವನ್ನು ಕೇಳಿ, ವಿಶ್ವಾಸ ಇಟ್ಟಿರುವುದರಿಂದ.", "r": "3:5"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಿಮಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪ್ರಧಾನಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಸಗುತ್ತಾ ಬಂದಿದ್ದಾರೆ.”", "a": "ಮಹತ್ಕಾರ್ಯಗಳನ್ನು", "r": "3:5"}, {"n": 44, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು", "r": "3:6"}, {"n": 45, "q": "ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಕಾರಣ ದೇವರು ಆತನನ್ನು ಏನೆಂದು ಪರಿಗಣಿಸಿದರು?", "a": "ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ", "r": "3:6"}, {"n": 46, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದಾಗಿ ಪೌಲನು ಉಲ್ಲೇಖಿಸುವ ವಾಕ್ಯ ಯಾವುದು?", "a": "“ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು; ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "r": "3:6"}, {"n": 47, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು/ಸಂತತಿ ಯಾರು?", "a": "ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುವವರು (3:7); ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು (3:29)", "r": "3:6; 3:7; 3:9; 3:29"}, {"n": 48, "q": "ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು ಎಂಬುದು ಎಲ್ಲಿ ಬರೆದಿದೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ", "r": "3:6"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "a": "ಸತ್ಸಂಬಂಧದಲ್ಲಿ", "r": "3:6"}, {"n": 50, "q": "“ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 51, "q": "ಗಲಾತ್ಯರಿಗೆ 3:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವಂತೆ: “ಅಬ್ರಹಾಮನು ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟನು; ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "r": "3:6"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಿಗಣಿಸಿದರು", "r": "3:6"}, {"n": 53, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ಕಾರಣ ದೇವರು ಆತನನ್ನು …”", "a": "“… ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "r": "3:6"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನನ್ನು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರುವುದಾಗಿ ಪರಿಗಣಿಸಿದರು.”", "a": "ದೇವರು", "r": "3:6"}, {"n": 55, "q": "ಪೌಲನ ಪ್ರಕಾರ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು ಯಾರು?", "a": "ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ", "r": "3:7"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಅಬ್ರಹಾಮನ", "r": "3:7"}, {"n": 57, "q": "“ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 58, "q": "ಗಲಾತ್ಯರಿಗೆ 3:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.", "r": "3:7"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಜೀವಿಸುತ್ತಾರೋ", "r": "3:7"}, {"n": 60, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ …”", "a": "“… ಅವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳೆಂದು ತಿಳಿದುಕೊಳ್ಳಿ.”", "r": "3:7"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಯಾರು ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುತ್ತಾರೋ ಅವರೇ ಅಬ್ರಹಾಮನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದುಕೊಳ್ಳಿ.”", "a": "ಮಕ್ಕಳೆಂದು", "r": "3:7"}, {"n": 62, "q": "ದೇವರು ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುವುದು ಯಾವುದರ ಮೂಲಕ?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕವೇ", "r": "3:8"}, {"n": 63, "q": "ಅಬ್ರಹಾಮನಿಗೆ ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾದ ಶುಭವರ್ತಮಾನ ಯಾವುದು?", "a": "“ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು”", "r": "3:8"}, {"n": 64, "q": "“ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು” ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಯಾರಿಗೆ ತಿಳಿಸಲಾಯಿತು?", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:8"}, {"n": 65, "q": "ಅನ್ಯಧರ್ಮೀಯರ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಏನು ಬರೆಯಲಾಗಿತ್ತು?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು", "r": "3:8"}, {"n": 66, "q": "ಶುಭವರ್ತಮಾನವನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ಯಾವಾಗ ತಿಳಿಸಲಾಯಿತು?", "a": "ಮುಂಚಿತವಾಗಿ", "r": "3:8"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.”", "a": "ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ", "r": "3:8"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣದಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು, ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.”", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:8"}, {"n": 69, "q": "“ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "3:8"}, {"n": 70, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ಕಾರಣದಿಂದಲೇ ಅಬ್ರಹಾಮನಿಗೆ, ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ …”", "a": "“… ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು, ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.”", "r": "3:8"}, {"n": 71, "q": "ಗಲಾತ್ಯರಿಗೆ 3:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು. ಈ ಕಾರಣದಿಂದಲೇ ಅಬ್ರಹಾಮನಿಗೆ, “ನಿನ್ನ ಮುಖಾಂತರವೇ ಎಲ್ಲಾ ಜನಾಂಗಗಳು ಆಶೀರ್ವಾದವನ್ನು ಪಡೆಯುವುವು,” ಎಂಬ ಶುಭವರ್ತಮಾನವನ್ನು ಮುಂಚಿತವಾಗಿ ತಿಳಿಸಲಾಯಿತು.", "r": "3:8"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಶ್ವಾಸದ ಮೂಲಕವೇ ಅನ್ಯಧರ್ಮೀಯರನ್ನು ಕೂಡ ದೇವರು ತಮ್ಮ ಸತ್ಸಂಬಂಧದಲ್ಲಿ ಇರಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೊದಲೇ ಬರೆಯಲಾಗಿತ್ತು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ", "r": "3:8"}, {"n": 73, "q": "ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ಏನನ್ನು ಪಡೆಯುವರು?", "a": "ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ", "r": "3:9"}, {"n": 74, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:9ರಲ್ಲಿ ‘ವಿಶ್ವಾಸಿ’ ಎಂದು ಕರೆಯಲ್ಪಟ್ಟವನು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು", "r": "3:9"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "3:9"}, {"n": 76, "q": "“ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "3:9"}, {"n": 77, "q": "ಗಲಾತ್ಯರಿಗೆ 3:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.", "r": "3:9"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವರು.”", "a": "ಸೌಭಾಗ್ಯವನ್ನೇ", "r": "3:9"}, {"n": 79, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರಲಾಗಿ, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ …”", "a": "“… ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "r": "3:9"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ವಿಶ್ವಾಸದಿಂದ ಬಾಳುವವರು ವಿಶ್ವಾಸಿಯಾದ ಅಬ್ರಹಾಮನು ಪಡೆದ ಸೌಭಾಗ್ಯವನ್ನೇ ಪಡೆಯುವರು.”", "a": "ಹೀಗಿರಲಾಗಿ", "r": "3:9"}, {"n": 81, "q": "ಪೌಲನ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು", "r": "3:10"}, {"n": 82, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತನು ಎಂದು ಲಿಖಿತವಾಗಿದೆ?", "a": "“ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು”", "r": "3:10"}, {"n": 83, "q": "ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಎಷ್ಟು ಬಾರಿ ಕೈಗೊಂಡು ನಡೆಯಬೇಕು ಎಂದು ಲಿಖಿತವಾಗಿದೆ?", "a": "ಅನುದಿನವೂ", "r": "3:10"}, {"n": 84, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಶಾಪಗ್ರಸ್ತನು” ಎಂದು ಲಿಖಿತವಾದ ಎರಡು ಉಲ್ಲೇಖಗಳು ಯಾರನ್ನು ಕುರಿತಿವೆ?", "a": "ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನು (3:10); ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನು (3:13)", "r": "3:10; 3:13"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು.”", "a": "ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು", "r": "3:10"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ", "r": "3:10"}, {"n": 87, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 88, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಏಕೆಂದರೆ, ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು …”", "a": "“… ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಲಿಖಿತವಾಗಿದೆ.”", "r": "3:10"}, {"n": 89, "q": "ಗಲಾತ್ಯರಿಗೆ 3:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನೇ ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು. ಏಕೆಂದರೆ, “ಧರ್ಮಗ್ರಂಥದಲ್ಲಿ ಬರೆದಿರುವುದನ್ನೆಲ್ಲಾ ಅನುದಿನವೂ ಕೈಗೊಂಡು ನಡೆಯದ ಪ್ರತಿಯೊಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,” ಎಂದು ಲಿಖಿತವಾಗಿದೆ.", "r": "3:10"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಧಾರವಾಗಿಟ್ಟುಕೊಂಡು ಬಾಳುವವರು ಶಾಪಗ್ರಸ್ತರು.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನೇ", "r": "3:10"}, {"n": 91, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಏನು ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಸ್ಪಷ್ಟವಾಗಿದೆ?", "a": "ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು", "r": "3:11"}, {"n": 92, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದಿರುವವರು ಯಾವುದರಿಂದ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ?", "a": "“ವಿಶ್ವಾಸದಿಂದಲೇ”", "r": "3:11"}, {"n": 93, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಯಾರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ?", "a": "ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುವವರು", "r": "3:11"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.”", "a": "ವಿಧಿಸುವುದನ್ನು", "r": "3:11"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾಕೆಂದರೆ, ಯಾರು ದೇವರೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಂದಿರುತ್ತಾರೋ ಅವರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "a": "ಸತ್ಸಂಬಂಧವನ್ನು", "r": "3:11"}, {"n": 96, "q": "“ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 97, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯಾಕೆಂದರೆ, ಯಾರು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುತ್ತಾರೋ ಅವರು …”", "a": "“… ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.”", "r": "3:11"}, {"n": 98, "q": "ಗಲಾತ್ಯರಿಗೆ 3:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು ಪೂರೈಸುವುದರಿಂದ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ. ಯಾಕೆಂದರೆ, “ಯಾರು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೊಂದಿರುತ್ತಾರೋ ಅವರು ವಿಶ್ವಾಸದಿಂದಲೇ ಸಜ್ಜೀವವನ್ನು ಪಡೆಯುತ್ತಾರೆ” ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥದಲ್ಲೇ ಲಿಖಿತವಾಗಿದೆ.", "r": "3:11"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಧರ್ಮಶಾಸ್ತ್ರ ವಿಧಿಸುವುದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಪಡೆಯಲಾರರು ಎಂಬುದು ಸಹ ಸ್ಪಷ್ಟವಾಗಿದೆ.”", "a": "ಪೂರೈಸುವುದರಿಂದ", "r": "3:11"}, {"n": 100, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವುದನ್ನು ಆಧರಿಸಿಲ್ಲ?", "a": "ವಿಶ್ವಾಸವನ್ನು", "r": "3:12"}, {"n": 101, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನ ಬಗ್ಗೆ ಏನೆಂದು ಬರೆಯಲಾಗಿದೆ?", "a": "“ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ”", "r": "3:12"}, {"n": 102, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಯಾವುದರ ಮೂಲಕ ಜೀವಿಸುತ್ತಾನೆ?", "a": "ಆ ವಿಧಿನಿಯಮಗಳ ಮೂಲಕ", "r": "3:12"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ಅದರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ, ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "a": "ವಿಧಿನಿಯಮಗಳನ್ನು", "r": "3:12"}, {"n": 104, "q": "“ಬದಲಿಗೆ, ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ, ಎಂದು ಬರೆಯಲಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 105, "q": "ಗಲಾತ್ಯರಿಗೆ 3:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರ ವಿಶ್ವಾಸವನ್ನು ಆಧರಿಸಿಲ್ಲ. ಬದಲಿಗೆ, “ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ,” ಎಂದು ಬರೆಯಲಾಗಿದೆ.", "r": "3:12"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಅವುಗಳ ಮೂಲಕವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "a": "ಜೀವಿಸುತ್ತಾನೆ", "r": "3:12"}, {"n": 107, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬದಲಿಗೆ, ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು …”", "a": "“… ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ, ಎಂದು ಬರೆಯಲಾಗಿದೆ.”", "r": "3:12"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ಅದರ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವುಗಳ ಮೂಲಕವಾಗಿ ಜೀವಿಸುತ್ತಾನೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಾಲಿಸುವವನು; ಬರೆಯಲಾಗಿದೆ", "r": "3:12"}, {"n": 109, "q": "ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದವನ ಬಗ್ಗೆ ಏನೆಂದು ಬರೆಯಲಾಗಿದೆ?", "a": "“ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು”", "r": "3:13"}, {"n": 110, "q": "ಕ್ರಿಸ್ತಯೇಸು ನಮಗೋಸ್ಕರ ಏನಾದರು?", "a": "ಶಾಪ ಸ್ವರೂಪಿಯಾದರು", "r": "3:13"}, {"n": 111, "q": "ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ನಮ್ಮನ್ನು ಯಾವುದರಿಂದ ಪಾರುಮಾಡಿದರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ", "r": "3:13"}, {"n": 112, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದವರು ಯಾರು?", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:13"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:13"}, {"n": 114, "q": "“ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 115, "q": "ಗಲಾತ್ಯರಿಗೆ 3:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು,” ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.", "r": "3:13"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ", "r": "3:13"}, {"n": 117, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು, ಎಂದು ಬರೆದಿರುವಂತೆ, ನಮಗೋಸ್ಕರ …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "r": "3:13"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮಗೋಸ್ಕರ ಕ್ರಿಸ್ತಯೇಸು ಶಾಪ ಸ್ವರೂಪಿಯಾಗಿ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿರುವ ಶಾಪದಿಂದ ನಮ್ಮನ್ನು ಪಾರುಮಾಡಿದರು.”", "a": "ಶಾಪಗ್ರಸ್ತನು; ಬರೆದಿರುವಂತೆ", "r": "3:13"}, {"n": 119, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ಏನು ದೊರಕುವಂತಾಯಿತು?", "a": "ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ", "r": "3:14"}, {"n": 120, "q": "ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ ನಮಗೂ ಯಾರು ದೊರಕುವಂತಾಯಿತು?", "a": "ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ", "r": "3:14"}, {"n": 121, "q": "ಕ್ರಿಸ್ತಯೇಸು ಶಾಪದಿಂದ ಪಾರುಮಾಡಿದ್ದರ ಎರಡು ಫಲಗಳು ಯಾವುವು?", "a": "1) ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು; 2) ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ವಿಶ್ವಾಸದ ಮೂಲಕ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು", "r": "3:14"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "3:14"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "3:14"}, {"n": 124, "q": "“ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 125, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ …”", "a": "“… ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.”", "r": "3:14"}, {"n": 126, "q": "ಗಲಾತ್ಯರಿಗೆ 3:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದರಿಂದಾಗಿ ಅಬ್ರಹಾಮನಿಗೆ ದೊರಕಿದ ಸೌಭಾಗ್ಯ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು; ವಿಶ್ವಾಸದ ಮೂಲಕವಾಗಿ, ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಪವಿತ್ರಾತ್ಮ ನಮಗೂ ದೊರಕುವಂತಾಯಿತು.", "r": "3:14"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೊರಕಿದ ಸೌಭಾಗ್ಯ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ಅನ್ಯಧರ್ಮೀಯರಿಗೂ ದೊರಕುವಂತಾಯಿತು;”", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:14"}, {"n": 128, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:15ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ರದ್ದಾಗದ ವಾಗ್ದಾನ", "r": "3:15"}, {"n": 129, "q": "ಪೌಲನು ದೈನಂದಿನ ಜೀವನದಿಂದ ಯಾವ ಉದಾಹರಣೆಯನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಮಾಡಿಕೊಳ್ಳುವ ಒಪ್ಪಂದ", "r": "3:15"}, {"n": 130, "q": "ಕ್ರಮಬದ್ಧವಾಗಿ ಮಾಡಿ ಮುಗಿಸಿದ ಒಪ್ಪಂದದ ಬಗ್ಗೆ ಯಾರೂ ಏನು ಮಾಡುವಂತಿಲ್ಲ?", "a": "ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ", "r": "3:15"}, {"n": 131, "q": "ಪೌಲನು 3:15ರಲ್ಲಿ ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ?", "a": "“ಪ್ರಿಯ ಸಹೋದರರೇ”", "r": "3:15"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ದೈನಂದಿನ ಜೀವನದಿಂದ ಒಂದು ಉದಾಹಣೆಯನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ತೆಗೆದುಕೊಳ್ಳೋಣ", "r": "3:15"}, {"n": 133, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಒಂದು ಒಪ್ಪಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "3:15"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.”", "a": "ರದ್ದುಮಾಡುವಂತಿಲ್ಲ", "r": "3:15"}, {"n": 135, "q": "“ಪ್ರಿಯ ಸಹೋದರರೇ, ದೈನಂದಿನ ಜೀವನದಿಂದ ಒಂದು ಉದಾಹಣೆಯನ್ನೇ ತೆಗೆದುಕೊಳ್ಳೋಣ:” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 136, "q": "“ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 137, "q": "ಗಲಾತ್ಯರಿಗೆ 3:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ದೈನಂದಿನ ಜೀವನದಿಂದ ಒಂದು ಉದಾಹಣೆಯನ್ನೇ ತೆಗೆದುಕೊಳ್ಳೋಣ: ಒಬ್ಬನು ಮತ್ತೊಬ್ಬನೊಡನೆ ಒಂದು ಒಪ್ಪಂದ ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ. ಕ್ರಮಬದ್ಧವಾಗಿ ಅದನ್ನು ಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಯಾರೂ ಅದನ್ನು ರದ್ದುಮಾಡುವಂತಿಲ್ಲ, ಬದಲಾಯಿಸುವಂತಿಲ್ಲ.", "r": "3:15"}, {"n": 138, "q": "ದೇವರು ಯಾರಿಗೆ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು?", "a": "ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ", "r": "3:16"}, {"n": 139, "q": "“ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಮತ್ತು “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂಬ ಮಾತುಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಪೌಲನು ಹೇಗೆ ವಿವರಿಸುತ್ತಾನೆ?", "a": "“ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಎಂದರೆ ಅನೇಕರು; “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂದರೆ ಒಬ್ಬ ವ್ಯಕ್ತಿ", "r": "3:16"}, {"n": 140, "q": "ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಲಾದ ‘ಒಬ್ಬ ವ್ಯಕ್ತಿ’ ಯಾರು?", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:16"}, {"n": 141, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸಂತತಿ’ ಎಂಬ ಪದ ಯಾರನ್ನು ಸೂಚಿಸುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವನ್ನು (3:16, 19); ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರೂ ಅಬ್ರಹಾಮನ ಸಂತತಿ (3:29)", "r": "3:16; 3:19; 3:29"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಯೇ, ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನಿಗೂ", "r": "3:16"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, ನಿನ್ನ ಸಂತತಿಗೆ ಎಂದು ಹೇಳಿ ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು.”", "a": "ವ್ಯಕ್ತಿಯನ್ನೇ", "r": "3:16"}, {"n": 144, "q": "“ಹಾಗೆಯೇ, ದೇವರು ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 145, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, ನಿನ್ನ …”", "a": "“… ಸಂತತಿಗೆ ಎಂದು ಹೇಳಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನೇ ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು.”", "r": "3:16"}, {"n": 146, "q": "ಗಲಾತ್ಯರಿಗೆ 3:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗೆಯೇ, ದೇವರು ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ ವಾಗ್ದಾನಗಳನ್ನು ಮಾಡಿದರು. “ನಿನ್ನ ಸಂತತಿಗಳಿಗೆ” ಎಂದು ಹೇಳಿ ಅನೇಕರನ್ನು ಸೂಚಿಸಿದೆ, “ನಿನ್ನ ಸಂತತಿಗೆ” ಎಂದು ಹೇಳಿ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನೇ ಆ ವಾಗ್ದಾನದಲ್ಲಿ ಸೂಚಿಸಿದರು. ಆ ವ್ಯಕ್ತಿಯೇ ಕ್ರಿಸ್ತಯೇಸು.", "r": "3:16"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಯೇ, ದೇವರು ಅಬ್ರಹಾಮನಿಗೂ ಆತನ ಸಂತತಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ವಾಗ್ದಾನಗಳನ್ನು", "r": "3:16"}, {"n": 148, "q": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಒಪ್ಪಂದ ಮಾಡಿದ ಎಷ್ಟು ವರ್ಷಗಳಾದ ಮೇಲೆ ಧರ್ಮಶಾಸ್ತ್ರ ಬಂತು?", "a": "ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ", "r": "3:17"}, {"n": 149, "q": "ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಏನು ಮಾಡಲಾಗದು?", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ರದ್ದುಪಡಿಸಲಾಗದು; ಆ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು", "r": "3:17"}, {"n": 150, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಯಾವ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು?", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದದ ವಾಗ್ದಾನವನ್ನು", "r": "3:17"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;”", "a": "ಅಬ್ರಹಾಮನೊಂದಿಗೆ", "r": "3:17"}, {"n": 152, "q": "“ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "3:17"}, {"n": 153, "q": "ಗಲಾತ್ಯರಿಗೆ 3:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು; ಆ ವಾಗ್ದಾನವನ್ನು ವ್ಯರ್ಥಪಡಿಸಲಾಗದು.", "r": "3:17"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರದ್ದುಪಡಿಸಲಾಗದು;”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ", "r": "3:17"}, {"n": 155, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ ಮಾಡಿಮುಗಿಸಿದ ಒಪ್ಪಂದವನ್ನು ನಾನೂರ …”", "a": "“… ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ರದ್ದುಪಡಿಸಲಾಗದು;”", "r": "3:17"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಅಬ್ರಹಾಮನೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಪ್ಪಂದವನ್ನು ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ ಬಂದ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮಾಡಿಮುಗಿಸಿದ; ರದ್ದುಪಡಿಸಲಾಗದು", "r": "3:17"}, {"n": 157, "q": "ದೇವರು ಹಕ್ಕುಬಾಧ್ಯತೆಯನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ಯಾವುದರ ಮೂಲಕ ದಯಪಾಲಿಸಿದರು?", "a": "ವಾಗ್ದಾನದ ಮೂಲಕವೇ", "r": "3:18"}, {"n": 158, "q": "ಹಕ್ಕುಬಾಧ್ಯತೆ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಏನೆಂದಂತಾಯಿತು?", "a": "ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು", "r": "3:18"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.”", "a": "ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ", "r": "3:18"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ದೇವರು ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯಪಾಲಿಸಿದ್ದು ವಾಗ್ದಾನದ ಮೂಲಕವೇ.”", "a": "ಅಬ್ರಹಾಮನಿಗೆ", "r": "3:18"}, {"n": 161, "q": "“ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "3:18"}, {"n": 162, "q": "ಗಲಾತ್ಯರಿಗೆ 3:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು. ಆದರೆ ದೇವರು ಅದನ್ನು ಅಬ್ರಹಾಮನಿಗೆ ದಯಪಾಲಿಸಿದ್ದು ವಾಗ್ದಾನದ ಮೂಲಕವೇ.", "r": "3:18"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ನಮಗೆ ಹಕ್ಕುಬಾಧ್ಯತೆಯಾಗಿ ಕೊಡುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಭಿಸುವುದಾದರೆ ಅದು ಇನ್ನು ದೇವ ವಾಗ್ದಾನದಿಂದ ಲಭಿಸದು ಎಂದಂತಾಯಿತು.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ", "r": "3:18"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ದೇವರು ಅದನ್ನು ಅಬ್ರಹಾಮನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಾಗ್ದಾನದ ಮೂಲಕವೇ.”", "a": "ದಯಪಾಲಿಸಿದ್ದು", "r": "3:18"}, {"n": 165, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಬಗ್ಗೆ ಪೌಲನು 3:19ರಲ್ಲಿ ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹಾಗಾದರೆ ಧರ್ಮಶಾಸ್ತ್ರದ ಉದ್ದೇಶವಾದರೂ ಏನು?”", "r": "3:19"}, {"n": 166, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕಾಲಕ್ರಮೇಣ ಏಕೆ ಸೇರಿಸಲಾಯಿತು?", "a": "ಅಪರಾಧದ ಅರಿವನ್ನು ಮೂಡಿಸುವುದಕ್ಕಾಗಿ", "r": "3:19"}, {"n": 167, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವ ತನಕ ಮಾತ್ರ ಇರಲೆಂದು ಕೊಡಲಾಯಿತು?", "a": "ದೇವವಾಗ್ದಾನವನ್ನು ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ", "r": "3:19"}, {"n": 168, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ನೀಡಲಾಯಿತು?", "a": "ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ", "r": "3:19"}, {"n": 169, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ನೀಡಲಾಯಿತು ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವದೂತರ ಮುಖಾಂತರ", "r": "3:19"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉದ್ದೇಶವಾದರೂ ಏನು?”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "3:19"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಪರಾಧದ ಅರಿವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದನ್ನು ಕಾಲಕ್ರಮೇಣ ಸೇರಿಸಲಾಯಿತು.”", "a": "ಮೂಡಿಸುವುದಕ್ಕಾಗಿ", "r": "3:19"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ ಮಾತ್ರ ಅದು ಇರಲೆಂದು ಕೊಡಲಾಯಿತು.”", "a": "ದೇವವಾಗ್ದಾನವನ್ನು", "r": "3:19"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ಕೇವಲ ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ ಮಾತ್ರ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೀಡಲಾಯಿತು", "r": "3:19"}, {"n": 174, "q": "“ದೇವವಾಗ್ದಾನವನ್ನು ಪಡೆದ ಆ ಸಂತತಿ ಬರುವ ತನಕ ಮಾತ್ರ ಅದು ಇರಲೆಂದು ಕೊಡಲಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "3:19"}, {"n": 175, "q": "ಯಾವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ?", "a": "ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ", "r": "3:20"}, {"n": 176, "q": "ದೇವರ ಬಗ್ಗೆ ಪೌಲನು 3:20ರಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರಾದರೋ ಒಬ್ಬರೇ.”", "r": "3:20"}, {"n": 177, "q": "‘ಒಬ್ಬರೇ’ ಎಂದು ಪೌಲನು ಯಾರ ಬಗ್ಗೆ ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವರ ಬಗ್ಗೆ", "r": "3:20"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.”", "a": "ಮಧ್ಯಸ್ಥನು", "r": "3:20"}, {"n": 179, "q": "“ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "3:20"}, {"n": 180, "q": "ಗಲಾತ್ಯರಿಗೆ 3:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ ಒಬ್ಬರೇ.", "r": "3:20"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರೇ.”", "a": "ದೇವರಾದರೋ", "r": "3:20"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದೇ ಪಕ್ಷ ಇರುವಾಗ ಮಧ್ಯಸ್ಥನು ಬೇಕಿಲ್ಲ, ದೇವರಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒಬ್ಬರೇ", "r": "3:20"}, {"n": 183, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 3:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಕ್ರಿಸ್ತೇಸುವಿಗೆ ಸೇರಿದವರು ವಾರಸುದಾರರು", "r": "3:21"}, {"n": 184, "q": "“ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಪೌಲನ ಉತ್ತರವೇನು?", "a": "“ಎಂದಿಗೂ ಇಲ್ಲ.”", "r": "3:21"}, {"n": 185, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಯಾವ ಶಕ್ತಿಯನ್ನು ಹೊಂದಿದ್ದರೆ ಅದರಿಂದ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು?", "a": "ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು", "r": "3:21"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳೋಣವೇ?”", "a": "ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು", "r": "3:21"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.”", "a": "ಅನುಸರಿಸುವುದರಿಂದ", "r": "3:21"}, {"n": 188, "q": "“ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "3:21"}, {"n": 189, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು …”", "a": "“… ಅನುಸರಿಸುವುದರಿಂದ ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.”", "r": "3:21"}, {"n": 190, "q": "ಗಲಾತ್ಯರಿಗೆ 3:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಾಗಾದರೆ, ಧರ್ಮಶಾಸ್ತ್ರ ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ? ಎಂದಿಗೂ ಇಲ್ಲ. ಸಜ್ಜೀವಗೊಳಿಸುವ ಶಕ್ತಿಯನ್ನು ಧರ್ಮಶಾಸ್ತ್ರ ಹೊಂದಿದ್ದರೆ ಅದನ್ನು ಅನುಸರಿಸುವುದರಿಂದ ನಿಸ್ಸಂದೇಹವಾಗಿ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ದೊರಕುತ್ತಿತ್ತು.", "r": "3:21"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ವಾಗ್ದಾನಕ್ಕೆ ವಿರುದ್ಧವಾಗಿದೆಯೆಂದು ಹೇಳೋಣವೇ?”", "a": "ಧರ್ಮಶಾಸ್ತ್ರ", "r": "3:21"}, {"n": 192, "q": "ಸಮಸ್ತ ಲೋಕದ ಬಗ್ಗೆ ಪವಿತ್ರಗ್ರಂಥ ಏನನ್ನು ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ?", "a": "ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು", "r": "3:22"}, {"n": 193, "q": "ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯಾರಿಗೆ ಕೊಡಲಾಗುತ್ತದೆ?", "a": "ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ", "r": "3:22"}, {"n": 194, "q": "ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯಾವುದರ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ?", "a": "ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ", "r": "3:22"}, {"n": 195, "q": "ಸಮಸ್ತ ಲೋಕವೂ ಏನಕ್ಕೆ ಒಳಗಾಯಿತು?", "a": "ಪಾಪಕ್ಕೆ", "r": "3:22"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ", "r": "3:22"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ", "r": "3:22"}, {"n": 198, "q": "“ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "3:22"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ …”", "a": "“… ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.”", "r": "3:22"}, {"n": 200, "q": "ಗಲಾತ್ಯರಿಗೆ 3:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು ಪವಿತ್ರಗ್ರಂಥ ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ. ಹೀಗೆ, ವಾಗ್ದಾನ ಮಾಡಿದ ಸೌಭಾಗ್ಯವನ್ನು ಯೇಸುಕ್ರಿಸ್ತರಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರಿಗೆ ಅವರ ನಂಬಿಕೆಯ ಆಧಾರದ ಮೇಲೆ ಕೊಡಲಾಗುತ್ತದೆ.", "r": "3:22"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ಸಮಸ್ತ ಲೋಕವೂ ಪಾಪಕ್ಕೆ ಒಳಗಾಯಿತು ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ಪಷ್ಟೀಕರಿಸುತ್ತದೆ.”", "a": "ಪವಿತ್ರಗ್ರಂಥ", "r": "3:22"}, {"n": 202, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ‘ನಾವು’ ಯಾರಂತೆ ಇದ್ದೆವು?", "a": "ಕೈದಿಗಳಂತೆ", "r": "3:23"}, {"n": 203, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲಕ್ಕೆ ಮೊದಲು ನಾವು ಯಾವುದಕ್ಕೆ ಒಳಗಾಗಿದ್ದೆವು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ", "r": "3:23"}, {"n": 204, "q": "‘ಕೈದಿಗಳಂತೆ’ ಇದ್ದ ಪರಿಸ್ಥಿತಿ ಯಾವ ತನಕ ಇತ್ತು?", "a": "ಈ ವಿಶ್ವಾಸವು ಪ್ರಕಟವಾಗುವವರೆಗೂ", "r": "3:23"}, {"n": 205, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸ ಬರುವ ಮೊದಲು ಮತ್ತು ಬಂದ ನಂತರದ ನಮ್ಮ ಸ್ಥಿತಿ ಏನು?", "a": "ಮೊದಲು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು; ಈಗ ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ", "r": "3:23; 3:25"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.”", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ", "r": "3:23"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಶ್ವಾಸವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.”", "a": "ಪ್ರಕಟವಾಗುವವರೆಗೂ", "r": "3:23"}, {"n": 208, "q": "“ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "3:23"}, {"n": 209, "q": "ಗಲಾತ್ಯರಿಗೆ 3:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು. ಈ ವಿಶ್ವಾಸವು ಪ್ರಕಟವಾಗುವವರೆಗೂ ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.", "r": "3:23"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರೈಸ್ತವಿಶ್ವಾಸದ ಕಾಲವು ಬರುವುದಕ್ಕೆ ಮೊದಲು ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರ್ಬಂಧಕ್ಕೆ ಒಳಗಾಗಿ ಕೈದಿಗಳಂತೆ ಇದ್ದೆವು.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ", "r": "3:23"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಕಟವಾಗುವವರೆಗೂ ಇದೇ ಪರಿಸ್ಥಿತಿ ಇತ್ತು.”", "a": "ವಿಶ್ವಾಸವು", "r": "3:23"}, {"n": 212, "q": "ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಧರ್ಮಶಾಸ್ತ್ರ ನಮಗೆ ಏನಾಗಿತ್ತು?", "a": "ಕಾವಲಾಗಿತ್ತು", "r": "3:24"}, {"n": 213, "q": "ಧರ್ಮಶಾಸ್ತ್ರ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ನಮಗೆ ಕಾವಲಾಗಿದ್ದದ್ದು ಏಕೆ?", "a": "ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ", "r": "3:24"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "3:24"}, {"n": 215, "q": "“ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "3:24"}, {"n": 216, "q": "ಗಲಾತ್ಯರಿಗೆ 3:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.", "r": "3:24"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾವಲಾಗಿತ್ತು", "r": "3:24"}, {"n": 218, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ, ವಿಶ್ವಾಸದ ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ …”", "a": "“… ಹೊಂದುವಂತೆ ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "r": "3:24"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ನಾವು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತಯೇಸು ಬರುವತನಕ ಅದು ನಮಗೆ ಕಾವಲಾಗಿತ್ತು.”", "a": "ವಿಶ್ವಾಸದ; ಹೊಂದುವಂತೆ", "r": "3:24"}, {"n": 220, "q": "ನಾವು ಇನ್ನು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲದಿರಲು ಕಾರಣವೇನು?", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ", "r": "3:25"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು", "r": "3:25"}, {"n": 222, "q": "“ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "3:25"}, {"n": 223, "q": "ಗಲಾತ್ಯರಿಗೆ 3:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.", "r": "3:25"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನು ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಆಗಮಿಸಿರುವುದರಿಂದ", "r": "3:25"}, {"n": 225, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈಗ ಕ್ರೈಸ್ತವಿಶ್ವಾಸವು ಆಗಮಿಸಿರುವುದರಿಂದ ಇನ್ನು …”", "a": "“… ನಾವು ಧರ್ಮಶಾಸ್ತ್ರದ ಅಧೀನದಲ್ಲಿ ಇಲ್ಲ.”", "r": "3:25"}, {"n": 226, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ಗಲಾತ್ಯರು ಏನಾಗಿದ್ದಾರೆ?", "a": "ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದಾರೆ", "r": "3:26"}, {"n": 227, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ದೇವರ ಮಕ್ಕಳಾಗಿರುವವರು ಯಾರು?", "a": "ನೀವೆಲ್ಲರೂ (ಗಲಾತ್ಯರೆಲ್ಲರೂ)", "r": "3:26"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "3:26"}, {"n": 229, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "3:26"}, {"n": 230, "q": "ಗಲಾತ್ಯರಿಗೆ 3:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.", "r": "3:26"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಕ್ಕಳಾಗಿದ್ದೀರಿ", "r": "3:26"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ.”", "a": "ವಿಶ್ವಾಸದ", "r": "3:26"}, {"n": 233, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡವರು ಏನಾಗಿದ್ದಾರೆ?", "a": "ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದಾರೆ", "r": "3:27"}, {"n": 234, "q": "ಗಲಾತ್ಯರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ಏನು ಮಾಡಿಸಿಕೊಂಡಿದ್ದರು?", "a": "ದೀಕ್ಷಾಸ್ನಾನ", "r": "3:27"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೇಗೆಂದರೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡಿರುವ ನೀವೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದೀರಿ", "r": "3:27"}, {"n": 236, "q": "“ಹೇಗೆಂದರೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡಿರುವ ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "3:27"}, {"n": 237, "q": "ಗಲಾತ್ಯರಿಗೆ 3:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೇಗೆಂದರೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡಿರುವ ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದೀರಿ.", "r": "3:27"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೇಗೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದಾಗುವುದಕ್ಕೆ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿಕೊಂಡಿರುವ ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದೀರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "3:27"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೇಗೆಂದರೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗುವುದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಸಿಕೊಂಡಿರುವ ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಂಬರರಾಗಿದ್ದೀರಿ.”", "a": "ದೀಕ್ಷಾಸ್ನಾನ", "r": "3:27"}, {"n": 240, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗಿರುವವರಲ್ಲಿ ಇನ್ನು ಮೇಲೆ ಇಲ್ಲದ ಮೂರು ಭೇದಗಳು ಯಾವುವು?", "a": "ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ; ದಾಸ-ದಣಿ; ಗಂಡು-ಹೆಣ್ಣು", "r": "3:28"}, {"n": 241, "q": "ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದ ಇನ್ನಿಲ್ಲ ಎಂಬುದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಎಲ್ಲರೂ ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗಿರುವುದರಿಂದ", "r": "3:28"}, {"n": 242, "q": "ಗಲಾತ್ಯರೆಲ್ಲರೂ ಯಾರಲ್ಲಿ ಒಂದಾಗಿದ್ದಾರೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "3:28"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.”", "a": "ಯೆಹೂದ್ಯನಲ್ಲದವ", "r": "3:28"}, {"n": 244, "q": "“ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "3:28"}, {"n": 245, "q": "ಗಲಾತ್ಯರಿಗೆ 3:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವೆಲ್ಲರೂ ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಒಂದಾಗಿದ್ದೀರಿ. ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.", "r": "3:28"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಭೇದವಿಲ್ಲ.”", "a": "ಗಂಡು-ಹೆಣ್ಣು", "r": "3:28"}, {"n": 247, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ ಯೆಹೂದ್ಯ- …”", "a": "“… ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದವಿಲ್ಲ.”", "r": "3:28"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ, ಇನ್ನು ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೆಹೂದ್ಯ; ಭೇದವಿಲ್ಲ", "r": "3:28"}, {"n": 249, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು ಯಾರ ಸಂತತಿಯಾಗಿದ್ದಾರೆ?", "a": "ಅಬ್ರಹಾಮನ ಸಂತತಿ", "r": "3:29"}, {"n": 250, "q": "ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರು ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ಏನಾಗಿದ್ದಾರೆ?", "a": "ವಾರಸುದಾರರು", "r": "3:29"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;”", "a": "ಅಬ್ರಹಾಮನ", "r": "3:29"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಿದ್ದೀರಿ.”", "a": "ವಾರಸುದಾರರೂ", "r": "3:29"}, {"n": 253, "q": "“ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "3:29"}, {"n": 254, "q": "ಗಲಾತ್ಯರಿಗೆ 3:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಕ್ರಿಸ್ತ ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ; ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ವಾರಸುದಾರರೂ ಆಗಿದ್ದೀರಿ.", "r": "3:29"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿಗೆ ಸೇರಿದವರಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನ ಸಂತತಿಯೂ ಆಗಿದ್ದೀರಿ;”", "a": "ಕ್ರಿಸ್ತ", "r": "3:29"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈವ ವಾಗ್ದಾನದ ಪ್ರಕಾರ ವಾರಸುದಾರರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಗಿದ್ದೀರಿ", "r": "3:29"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
