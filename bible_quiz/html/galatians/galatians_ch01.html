ಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಿಂದಾಗಲಿ ಮಾನವ ಅಧಿಕಾರದಿಂದಾಗಲಿ ನಾನು ಪ್ರೇಷಿತನಾಗಿರದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಅವರನ್ನು ಮರಣದಿಂದ ಎಬ್ಬಿಸಿದ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರೇಷಿತನಾಗಿರುತ್ತೇನೆ.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ", "r": "1:2"}, {"n": 23, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮಾನವರಿಂದಾಗಲಿ ಮಾನವ ಅಧಿಕಾರದಿಂದಾಗಲಿ ನಾನು ಪ್ರೇಷಿತನಾಗಿರದೆ ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ …”", "a": "“… ಮತ್ತು ಅವರನ್ನು ಮರಣದಿಂದ ಎಬ್ಬಿಸಿದ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರೇಷಿತನಾಗಿರುತ್ತೇನೆ.”", "r": "1:2"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಿಂದಾಗಲಿ ಮಾನವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ಮತ್ತು ಅವರನ್ನು ಮರಣದಿಂದ ಎಬ್ಬಿಸಿದ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರೇಷಿತನಾಗಿರುತ್ತೇನೆ.”", "a": "ಅಧಿಕಾರದಿಂದಾಗಲಿ; ಪ್ರೇಷಿತನಾಗಿರದೆ", "r": "1:2"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾನವ ಅಧಿಕಾರದಿಂದಾಗಲಿ ನಾನು ಪ್ರೇಷಿತನಾಗಿರದೆ ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ಮತ್ತು ಅವರನ್ನು ಮರಣದಿಂದ ಎಬ್ಬಿಸಿದ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರೇಷಿತನಾಗಿರುತ್ತೇನೆ.”", "a": "ಮಾನವರಿಂದಾಗಲಿ", "r": "1:2"}, {"n": 26, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಏನೇನು ಲಭಿಸಲಿ ಎಂದು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ", "r": "1:3"}, {"n": 27, "q": "ಗಲಾತ್ಯರಿಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಯಾರಿಂದ ಲಭಿಸಲಿ ಎಂದು ಪೌಲನು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ", "r": "1:3"}, {"n": 28, "q": "ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರೊಡನೆ ಕೃಪಾಶೀರ್ವಾದವನ್ನು ನೀಡುವವರು ಎಂದು ಪೌಲನು ಹೇಳುವವರು ಯಾರು?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರು", "r": "1:3"}, {"n": 29, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:3–4ರಲ್ಲಿ ದೇವರನ್ನು ಯಾವ ಹೆಸರಿನಿಂದ ಎರಡು ಬಾರಿ ಕರೆಯಲಾಗಿದೆ?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರು", "r": "1:3–4"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ", "r": "1:3"}, {"n": 31, "q": "“ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "1:3"}, {"n": 32, "q": "ಗಲಾತ್ಯರಿಗೆ 1:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!", "r": "1:3"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ಕೃಪಾಶೀರ್ವಾದವೂ", "r": "1:3"}, {"n": 34, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ ದೇವರಿಂದಲೂ ಪ್ರಭು …”", "a": "“… ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "r": "1:3"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಭಿಸಲಿ!”", "a": "ದೇವರಿಂದಲೂ; ಶಾಂತಿಸಮಾಧಾನವೂ", "r": "1:3"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರಿಂದಲೂ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರಿಂದಲೂ ನಿಮಗೆ ಕೃಪಾಶೀರ್ವಾದವೂ ಶಾಂತಿಸಮಾಧಾನವೂ ಲಭಿಸಲಿ!”", "a": "ತಂದೆಯಾದ", "r": "1:3"}, {"n": 37, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಏನಾಗಿ ಅರ್ಪಿಸಿದರು?", "a": "ಬಲಿಯಾಗಿ", "r": "1:4"}, {"n": 38, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದ್ದು ಏಕೆ?", "a": "ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 39, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ಯಾರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು?", "a": "ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ", "r": "1:4"}, {"n": 40, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ನಮ್ಮನ್ನು ಯಾವುದರಿಂದ ಬಿಡುಗಡೆ ಮಾಡಲು ಬಲಿಯಾದರು?", "a": "ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ", "r": "1:4"}, {"n": 41, "q": "“ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು” — ಯಾರು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:4"}, {"n": 42, "q": "ಯೇಸುಕ್ರಿಸ್ತರು ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದ್ದು ಯಾವುದರ ಪರಿಹಾರಕ್ಕಾಗಿ?", "a": "ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ", "r": "1:4"}, {"n": 44, "q": "“ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "1:4"}, {"n": 45, "q": "ಗಲಾತ್ಯರಿಗೆ 1:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.", "r": "1:4"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:4"}, {"n": 47, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ …”", "a": "“… ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "r": "1:4"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಡುಗಡೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ ಪರಿಹಾರಕ್ಕಾಗಿ ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ದುಷ್ಟಕಾಲದಿಂದ; ಮಾಡುವುದಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಕ್ರಿಸ್ತರು, ನಮ್ಮ ತಂದೆಯಾದ ದೇವರ ಚಿತ್ತಕ್ಕನುಸಾರವಾಗಿ, ನಮ್ಮನ್ನು ಸದ್ಯದ ದುಷ್ಟಕಾಲದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುವುದಕ್ಕಾಗಿ ಹಾಗು ನಮ್ಮ ಪಾಪಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮನ್ನೇ ಬಲಿಯಾಗಿ ಅರ್ಪಿಸಿದರು.”", "a": "ಪರಿಹಾರಕ್ಕಾಗಿ", "r": "1:4"}, {"n": 50, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೌಲನು ದೇವರಿಗೆ ಸಲ್ಲಿಸುವ ಸ್ತುತಿ ಏನು?", "a": "“ದೇವರಿಗೆ ಯುಗಯುಗಾಂತರಕ್ಕೂ ಸ್ತುತಿಸ್ತೋತ್ರ ಸಲ್ಲಲಿ! ಆಮೆನ್.”", "r": "1:5"}, {"n": 51, "q": "ದೇವರಿಗೆ ಸ್ತುತಿಸ್ತೋತ್ರ ಎಷ್ಟು ಕಾಲ ಸಲ್ಲಲಿ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಯುಗಯುಗಾಂತರಕ್ಕೂ", "r": "1:5"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ತುತಿಸ್ತೋತ್ರ ಸಲ್ಲಲಿ!”", "a": "ಯುಗಯುಗಾಂತರಕ್ಕೂ", "r": "1:5"}, {"n": 53, "q": "ಗಲಾತ್ಯರಿಗೆ 1:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರಿಗೆ ಯುಗಯುಗಾಂತರಕ್ಕೂ ಸ್ತುತಿಸ್ತೋತ್ರ ಸಲ್ಲಲಿ! ಆಮೆನ್.", "r": "1:5"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರಿಗೆ ಯುಗಯುಗಾಂತರಕ್ಕೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಲ್ಲಲಿ!”", "a": "ಸ್ತುತಿಸ್ತೋತ್ರ", "r": "1:5"}, {"n": 55, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:6ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಏಕೈಕ ಶುಭಸಂದೇಶ", "r": "1:6"}, {"n": 56, "q": "ಪೌಲನಿಗೆ ಏಕೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿತ್ತು?", "a": "ಗಲಾತ್ಯರು ತಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ಇಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವರೆಂದು ಕೇಳಿ", "r": "1:6"}, {"n": 57, "q": "ದೇವರು ಗಲಾತ್ಯರನ್ನು ಯಾವುದರಿಂದ ಕರೆದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ", "r": "1:6"}, {"n": 58, "q": "ಗಲಾತ್ಯರು ದೇವರನ್ನು ತ್ಯಜಿಸಿ ಏನನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿದ್ದರು?", "a": "ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು", "r": "1:6"}, {"n": 59, "q": "ಗಲಾತ್ಯರು ದೇವರನ್ನು ಎಷ್ಟು ಬೇಗ ತ್ಯಜಿಸುತ್ತಿದ್ದರೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಇಷ್ಟು ಬೇಗನೆ", "r": "1:6"}, {"n": 60, "q": "ಗಲಾತ್ಯರು ‘ಬೇರೊಂದು ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವರೆಂದು ಕೇಳಿ ಪೌಲನಿಗೆ ಏನಾಯಿತು?", "a": "ಆಶ್ಚರ್ಯವಾಗುತ್ತಿತ್ತು", "r": "1:6"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ಶುಭಸಂದೇಶವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:6"}, {"n": 62, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ಶುಭಸಂದೇಶವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "1:6"}, {"n": 63, "q": "ಗಲಾತ್ಯರಿಗೆ 1:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ‘ಶುಭಸಂದೇಶ’ವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.", "r": "1:6"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ಶುಭಸಂದೇಶವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು", "r": "1:6"}, {"n": 65, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ …”", "a": "“… ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ಶುಭಸಂದೇಶವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "r": "1:6"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಅನುಗ್ರಹದಿಂದ ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶುಭಸಂದೇಶವನ್ನು; ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ", "r": "1:6"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮನ್ನು ಕರೆದ ದೇವರನ್ನು ನೀವಿಷ್ಟು ಬೇಗನೆ ತ್ಯಜಿಸಿ, ಬೇರೊಂದು ಶುಭಸಂದೇಶವನ್ನು ಅಂಗೀಕರಿಸುತ್ತಿರುವಿರೆಂದು ಕೇಳಿ ನನಗೆ ಆಶ್ಚರ್ಯವಾಗುತ್ತಿದೆ.”", "a": "ಅನುಗ್ರಹದಿಂದ", "r": "1:6"}, {"n": 68, "q": "‘ಬೇರೊಂದು ಶುಭಸಂದೇಶ’ದ ಬಗ್ಗೆ ಪೌಲನು ವಾಸ್ತವವಾಗಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.”", "r": "1:7"}, {"n": 69, "q": "ಗಲಾತ್ಯರಲ್ಲಿ ಕೆಲವರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಗೊಂದಲವೆಬ್ಬಿಸಿ ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು", "r": "1:7"}, {"n": 70, "q": "ಗೊಂದಲವೆಬ್ಬಿಸುವವರು ಯಾವುದನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು", "r": "1:7"}, {"n": 71, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಗಲಾತ್ಯರಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸುತ್ತಿದ್ದ ಕೆಲವರು", "r": "1:7"}, {"n": 72, "q": "ಗೊಂದಲವೆಬ್ಬಿಸುವವರು ಗಲಾತ್ಯರಲ್ಲಿ ಏನನ್ನು ಎಬ್ಬಿಸುತ್ತಿದ್ದರು?", "a": "ಗೊಂದಲವನ್ನು", "r": "1:7"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.”", "a": "ವಾಸ್ತವವಾಗಿ", "r": "1:7"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:7"}, {"n": 75, "q": "“ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 76, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, …”", "a": "“… ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "r": "1:7"}, {"n": 77, "q": "ಗಲಾತ್ಯರಿಗೆ 1:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ ಶುಭಸಂದೇಶವೂ ಇಲ್ಲ. ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ ಗೊಂದಲವೆಬ್ಬಿಸಿ, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.", "r": "1:7"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವಾಸ್ತವವಾಗಿ, ಬೇರೆ ಯಾವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲ.”", "a": "ಶುಭಸಂದೇಶವೂ", "r": "1:7"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಕೆಲವರು ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶುಭಸಂದೇಶವನ್ನು ಮಾರ್ಪಡಿಸಲು ಯತ್ನಿಸುತ್ತಾ ಇದ್ದಾರೆ.”", "a": "ಗೊಂದಲವೆಬ್ಬಿಸಿ", "r": "1:7"}, {"n": 80, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಯಾರು ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ", "r": "1:8"}, {"n": 81, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಬೋಧಿಸುವವನಿಗೆ ಏನಾಗಲಿ ಎಂದು ಅವನು ಹೇಳುತ್ತಾನೆ?", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:8"}, {"n": 82, "q": "ಪೌಲನ ಪ್ರಕಾರ ಯಾವ ದೇವದೂತನು ವಿರುದ್ಧ ಸಂದೇಶ ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತನಾಗಲಿ?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನು", "r": "1:8"}, {"n": 83, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಶಾಪಗ್ರಸ್ತನಾಗಲಿ’ ಎಂಬ ಪದ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಎರಡು ಬಾರಿ (1:8; 1:9)", "r": "1:8–9"}, {"n": 84, "q": "ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ‘ನಾವೇ’ ಬೋಧಿಸಿದರೂ ಶಾಪಗ್ರಸ್ತರಾಗಲಿ ಎಂದು ಹೇಳುವವರು ಯಾರು?", "a": "ಪೌಲನು", "r": "1:8"}, {"n": 85, "q": "ಪೌಲನ ಪ್ರಕಾರ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಬೋಧಿಸಿದರೆ ಶಾಪಗ್ರಸ್ತರಾಗುವವರಲ್ಲಿ ಸ್ವರ್ಗದ ಜೀವಿ ಯಾರು?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನು", "r": "1:8"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:8"}, {"n": 87, "q": "“ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 88, "q": "ಗಲಾತ್ಯರಿಗೆ 1:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!", "r": "1:8"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "a": "ಶುಭಸಂದೇಶಕ್ಕೆ", "r": "1:8"}, {"n": 90, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ನಾವೇ ಆಗಲಿ, …”", "a": "“… ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "r": "1:8"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು ನಿಮಗೆ ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವೇ ಆಗಲಿ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದ ದೇವದೂತನೇ ಆಗಲಿ, ಯಾರೇ ಆಗಲಿ ಬೋಧಿಸಿದರೆ ಅವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ!”", "a": "ವಿರುದ್ಧವಾದ; ಸಂದೇಶವನ್ನು", "r": "1:8"}, {"n": 92, "q": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂಬ ಮಾತನ್ನು ಪೌಲನು ಮೊದಲೇ ಹೇಳಿದಂತೆ ಮತ್ತೊಮ್ಮೆ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ", "r": "1:9"}, {"n": 93, "q": "ಗಲಾತ್ಯರು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನಿಗೆ ಏನಾಗಲಿ ಎಂದು ಪೌಲನು ಒತ್ತಿ ಹೇಳುತ್ತಾನೆ?", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:9"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಸಾರುವವನು", "r": "1:9"}, {"n": 95, "q": "“ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "1:9"}, {"n": 96, "q": "ಗಲಾತ್ಯರಿಗೆ 1:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.", "r": "1:9"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಶಾಪಗ್ರಸ್ತನಾಗಲಿ", "r": "1:9"}, {"n": 98, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ …”", "a": "“… ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "r": "1:9"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿರುದ್ಧವಾದ ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ಅಂಗೀಕರಿಸಿದ; ಶುಭಸಂದೇಶಕ್ಕೆ", "r": "1:9"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಅಂಗೀಕರಿಸಿದ ಶುಭಸಂದೇಶಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂದೇಶವನ್ನು ಸಾರುವವನು ಶಾಪಗ್ರಸ್ತನಾಗಲಿ ಎಂದು ನಾನು ಮೊದಲೇ ಹೇಳಿದಂತೆ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿರುದ್ಧವಾದ", "r": "1:9"}, {"n": 101, "q": "“ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ?” — ಈ ಪ್ರಶ್ನೆಯ ನಂತರ ಪೌಲನು ಕೇಳುವ ಎರಡು ಉಪಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ಮಾನವರನ್ನೋ? ದೇವರನ್ನೋ?”", "r": "1:10"}, {"n": 102, "q": "ಪೌಲನು ಯಾರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ?", "a": "ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು", "r": "1:10"}, {"n": 103, "q": "ಪೌಲನು ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಅವನಿಗೆ ಏನು ಸಾಧ್ಯವೇ ಇಲ್ಲ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು", "r": "1:10"}, {"n": 104, "q": "ಪೌಲನು ತನ್ನನ್ನು ಯಾರ ದಾಸನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸ", "r": "1:10"}, {"n": 105, "q": "ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನು ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂದು ಪೌಲನು ಏಕೆ ಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನಲ್ಲ, ದೇವರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿರುವುದರಿಂದ", "r": "1:10"}, {"n": 106, "q": "“ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ” — ಇದು ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಯಾವ ವಚನ?", "a": "1:10", "r": "1:10"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ", "r": "1:10"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಯತ್ನಿಸುತ್ತಿಲ್ಲ", "r": "1:10"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "1:10"}, {"n": 110, "q": "“ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 111, "q": "“ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "1:10"}, {"n": 112, "q": "ಗಲಾತ್ಯರಿಗೆ 1:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದರಿಂದ ನಾನು ಯಾರನ್ನು ಒಲಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿದ್ದೇನೆ? ಮಾನವರನ್ನೋ? ದೇವರನ್ನೋ? ನಾನು ಮಾನವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿಕೊಳ್ಳಲು ಯತ್ನಿಸುತ್ತಿಲ್ಲ; ನಾನಿನ್ನೂ ಜನರ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸುವವನೇ ಆಗಿದ್ದರೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ದಾಸನಾಗಿರಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.", "r": "1:10"}, {"n": 113, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 1:11ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪ್ರೇಷಿತನಾದ ಪೌಲ", "r": "1:11"}, {"n": 114, "q": "ತಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶದ ಬಗ್ಗೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಏನನ್ನು ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತಾನೆ?", "a": "ಅದು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು", "r": "1:11"}, {"n": 115, "q": "ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸುತ್ತಾನೆ (1:11)?", "a": "“ಪ್ರಿಯ ಸಹೋದರರೇ”", "r": "1:11"}, {"n": 116, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶದ ಮೂಲ ಯಾವುದು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರೇ ಅದನ್ನು ಶ್ರುತಪಡಿಸಿದರು", "r": "1:11–12"}, {"n": 117, "q": "ಪೌಲನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶ ಯಾವುದು ಅಲ್ಲ?", "a": "ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ", "r": "1:11"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಶುಭಸಂದೇಶವು", "r": "1:11"}, {"n": 119, "q": "“ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "1:11"}, {"n": 120, "q": "ಗಲಾತ್ಯರಿಗೆ 1:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.", "r": "1:11"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಯಸುತ್ತೇನೆ", "r": "1:11"}, {"n": 122, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ …”", "a": "“… ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "r": "1:11"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಬೋಧಿಸಿದ ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಸಹೋದರರೇ; ಅಲ್ಲವೆಂದು", "r": "1:11"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಿಯ ಸಹೋದರರೇ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವು ಮಾನವ ಕಲ್ಪಿತ ಸಂದೇಶ ಅಲ್ಲವೆಂದು ನಿಮಗೆ ಮನದಟ್ಟು ಮಾಡಲು ಬಯಸುತ್ತೇನೆ.”", "a": "ಬೋಧಿಸಿದ", "r": "1:11"}, {"n": 125, "q": "ಪೌಲನಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಶ್ರುತಪಡಿಸಿದವರು ಯಾರು?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು", "r": "1:12"}, {"n": 126, "q": "ಪೌಲನು ಶುಭಸಂದೇಶವನ್ನು ಹೇಗೆ ಪಡೆಯಲಿಲ್ಲ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "1) ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ; 2) ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ", "r": "1:12"}, {"n": 127, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಶ್ರುತಪಡಿಸಿದರು’ ಎಂಬ ಪದವನ್ನು ಯಾರ ಬಗ್ಗೆ ಉಪಯೋಗಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುಕ್ರಿಸ್ತರು ಶುಭಸಂದೇಶವನ್ನು ಶ್ರುತಪಡಿಸಿದರು (1:12); ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದರು (1:16)", "r": "1:12; 1:16"}, {"n": 128, "q": "ಪೌಲನು ಶುಭಸಂದೇಶವನ್ನು ಯಾರಿಂದ ಕಲಿತುಕೊಂಡನು?", "a": "ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ; ಯೇಸುಕ್ರಿಸ್ತರೇ ಅದನ್ನು ಶ್ರುತಪಡಿಸಿದರು", "r": "1:12"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ;”", "a": "ಶುಭಸಂದೇಶವನ್ನು", "r": "1:12"}, {"n": 130, "q": "“ಈ ಶುಭಸಂದೇಶವನ್ನು ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "1:12"}, {"n": 131, "q": "ಗಲಾತ್ಯರಿಗೆ 1:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಶುಭಸಂದೇಶವನ್ನು ನಾನು ಮನುಷ್ಯರಿಂದ ಪಡೆಯಲಿಲ್ಲ; ಅದನ್ನು ಯಾರಿಂದಲೂ ಕಲಿತುಕೊಳ್ಳಲಿಲ್ಲ; ಯೇಸುಕ್ರಿಸ್ತರೇ ನನಗದನ್ನು ಶ್ರುತಪಡಿಸಿದರು.", "r": "1:12"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಶುಭಸಂದೇಶವನ್ನು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯಲಿಲ್ಲ;”", "a": "ಮನುಷ್ಯರಿಂದ", "r": "1:12"}, {"n": 133, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದ್ದು ಯಾವಾಗ?", "a": "ಹಿಂದೊಮ್ಮೆ ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ", "r": "1:13"}, {"n": 134, "q": "ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ಪೌಲನು ದೇವರ ಸಭೆಗೆ ಏನು ಮಾಡಿದನು?", "a": "ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದನು; ಅದನ್ನು ಧ್ವಂಸಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದನು", "r": "1:13"}, {"n": 135, "q": "ಪೌಲನ ಹಿಂದಿನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ಯಾರು ಚೆನ್ನಾಗಿ ಬಲ್ಲರು?", "a": "ಗಲಾತ್ಯರು (“ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ”)", "r": "1:13"}, {"n": 136, "q": "ಪೌಲನು ಹಿಂದೆ ಹಿಂಸಿಸಿದ್ದನ್ನು ಸ್ವತಃ ಪೌಲನೂ, ಜುದೇಯದ ಸಭೆಗಳೂ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "1:13 (ಪೌಲನು); 1:23 (ಜುದೇಯದ ಸಭೆಗಳು ಕೇಳಿದ ಸುದ್ದಿ)", "r": "1:13; 1:23"}, {"n": 137, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಏನು ಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದನು?", "a": "ಧ್ವಂಸಮಾಡಲು", "r": "1:13"}, {"n": 138, "q": "ಪೌಲನು ಹಿಂದೆ ಯಾವ ಮತಕ್ಕೆ ಸೇರಿದವನಾಗಿದ್ದನು?", "a": "ಯೆಹೂದ್ಯ ಮತ (ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದನು)", "r": "1:13"}, {"n": 139, "q": "ಪೌಲನು ದೇವರ ಸಭೆಯನ್ನು ಹೇಗೆ ಹಿಂಸಿಸಿದನು?", "a": "ಕ್ರೂರವಾಗಿ", "r": "1:13"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.”", "a": "ಮತಸ್ಥನಾಗಿದ್ದಾಗ", "r": "1:13"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಸಿಸಿದೆ;”", "a": "ಕ್ರೂರವಾಗಿ", "r": "1:13"}, {"n": 142, "q": "“ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 143, "q": "ಗಲಾತ್ಯರಿಗೆ 1:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ ಹೇಗಿತ್ತೆಂದು ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ. ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ ಹಿಂಸಿಸಿದೆ; ಅದನ್ನು ಧ್ವಂಸಮಾಡಲು ಪ್ರಯತ್ನಿಸಿದೆ.", "r": "1:13"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಾನು ಯೆಹೂದ್ಯ ಮತಸ್ಥನಾಗಿದ್ದಾಗ ನನ್ನ ನಡತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಚೆನ್ನಾಗಿ ಬಲ್ಲಿರಿ.”", "a": "ಹೇಗಿತ್ತೆಂದು", "r": "1:13"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನಾನು ದೇವರ ಸಭೆಯನ್ನು ಕ್ರೂರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹಿಂಸಿಸಿದೆ", "r": "1:13"}, {"n": 146, "q": "ಪೌಲನು ಯಾವುದರಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದನು?", "a": "ತನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ", "r": "1:14"}, {"n": 147, "q": "ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಪೌಲನು ಯಾರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದನು?", "a": "ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ", "r": "1:14"}, {"n": 148, "q": "ಪೌಲನು ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಹೇಗಿದ್ದನು?", "a": "ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದನು", "r": "1:14"}, {"n": 149, "q": "ಪೌಲನು ಯಾರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದನು?", "a": "ತನ್ನ ಪೂರ್ವಜರ", "r": "1:14"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ", "r": "1:14"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.”", "a": "ಸಮವಯಸ್ಕರಿಗಿಂತ", "r": "1:14"}, {"n": 152, "q": "“ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 153, "q": "ಗಲಾತ್ಯರಿಗೆ 1:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ. ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.", "r": "1:14"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ನಾನು ನನ್ನ ಪೂರ್ವಜರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅತ್ಯಧಿಕ ನಿಷ್ಠೆಯುಳ್ಳವನಾಗಿದ್ದೆ.”", "a": "ಮತಸಂಪ್ರದಾಯಗಳಲ್ಲಿ", "r": "1:14"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.”", "a": "ಮತಾಚರಣೆಯಲ್ಲಿ", "r": "1:14"}, {"n": 156, "q": "“ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯಲ್ಲಿ ಅನೇಕ ಸಮವಯಸ್ಕರಿಗಿಂತ ಎಷ್ಟೋ ಮುಂದಾಗಿದ್ದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "1:14"}, {"n": 157, "q": "ದೇವರು ಪೌಲನನ್ನು ಯಾವಾಗ ಆರಿಸಿಕೊಂಡರು?", "a": "ಅವನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ", "r": "1:15"}, {"n": 158, "q": "ದೇವರು ಪೌಲನನ್ನು ಯಾವುದರಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು?", "a": "ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ", "r": "1:15"}, {"n": 159, "q": "ದೇವರು ಪೌಲನನ್ನು ಆರಿಸಿಕೊಂಡು ಯಾವುದಕ್ಕೆ ಕರೆದರು?", "a": "ತಮ್ಮ ಸೇವೆಗೆ", "r": "1:15"}, {"n": 160, "q": "ಪೌಲನ ಕರೆಯ ವಿಷಯದಲ್ಲಿ ದೇವರು ಮಾಡಿದ ಮೂರು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "1) ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡರು; 2) ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು; 3) ತಮ್ಮ ಮಗನನ್ನು ಅವನಿಗೆ ಶ್ರುತಪಡಿಸಿದರು", "r": "1:15–16"}, {"n": 161, "q": "ದೇವರು ಪೌಲನನ್ನು ಆರಿಸಿಕೊಂಡಾಗ ಅವನು ಎಲ್ಲಿದ್ದನು?", "a": "ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ", "r": "1:15"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ಅನುಗ್ರಹದಿಂದ", "r": "1:15"}, {"n": 163, "q": "“ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "1:15"}, {"n": 164, "q": "ಗಲಾತ್ಯರಿಗೆ 1:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.", "r": "1:15"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ಆರಿಸಿಕೊಂಡು", "r": "1:15"}, {"n": 166, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ ದೇವರು …”", "a": "“… ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "r": "1:15"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾಯಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾಗಲೇ ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ನಾನಿನ್ನೂ; ಗರ್ಭದಲ್ಲಿ", "r": "1:15"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನಿನ್ನೂ ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನನ್ನನ್ನು ತಮ್ಮ ಅನುಗ್ರಹದಿಂದ ಆರಿಸಿಕೊಂಡು ತಮ್ಮ ಸೇವೆಗೆ ಕರೆದರು.”", "a": "ಇದ್ದಾಗಲೇ", "r": "1:15"}, {"n": 169, "q": "ಪೌಲನು ಯಾರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಅವನಿಗೆ ಶ್ರುತಪಡಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "1:16"}, {"n": 170, "q": "ದೇವರು ಪೌಲನಿಗೆ ಯಾರನ್ನು ಶ್ರುತಪಡಿಸಿದರು?", "a": "ತಮ್ಮ ಮಗನನ್ನು", "r": "1:16"}, {"n": 171, "q": "ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದಾಗ ಪೌಲನು ಸಲಹೆಗಾಗಿ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ", "r": "1:16"}, {"n": 172, "q": "ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ಶ್ರುತಪಡಿಸಿದ ನಂತರ ಪೌಲನು ಮಾಡದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "1) ಸಲಹೆಗಾಗಿ ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ; 2) ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಲಿಲ್ಲ", "r": "1:16–17"}, {"n": 173, "q": "ಪೌಲನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಏನನ್ನು ಸಾರಬೇಕಿತ್ತು?", "a": "ಶುಭಸಂದೇಶವನ್ನು", "r": "1:16"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "a": "ಸಾರಬೇಕೆಂದು", "r": "1:16"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ.”", "a": "ಸಲಹೆಗಾಗಿ", "r": "1:16"}, {"n": 176, "q": "“ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 177, "q": "ಗಲಾತ್ಯರಿಗೆ 1:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು. ಆಗ ಸಲಹೆಗಾಗಿ ನಾನು ಯಾರ ಬಳಿಗೂ ಹೋಗಲಿಲ್ಲ.", "r": "1:16"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "1:16"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಸಲಹೆಗಾಗಿ ನಾನು ಯಾರ ಬಳಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೋಗಲಿಲ್ಲ", "r": "1:16"}, {"n": 180, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರಬೇಕೆಂದು …”", "a": "“… ದೇವರು ತಮ್ಮ ಮಗನನ್ನು ನನಗೆ ಶ್ರುತಪಡಿಸಿದರು.”", "r": "1:16"}, {"n": 181, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿ ಯಾರನ್ನು ಕಾಣಲಿಲ್ಲ?", "a": "ತನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು", "r": "1:17"}, {"n": 182, "q": "ಕರೆ ಹೊಂದಿದ ನಂತರ ಪೌಲನು ನೇರವಾಗಿ ಎಲ್ಲಿಗೆ ಹೋದನು?", "a": "ಅರೇಬಿಯಾಕ್ಕೆ", "r": "1:17"}, {"n": 183, "q": "ಅರೇಬಿಯಾದಿಂದ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹಿಂದಿರುಗಿದನು?", "a": "ದಮಸ್ಕಸ್ ನಗರಕ್ಕೆ", "r": "1:17"}, {"n": 184, "q": "ಕರೆ ಹೊಂದಿದ ತಕ್ಷಣ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹೋಗಲಿಲ್ಲ?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "1:17"}, {"n": 185, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೌಲನು ಹೋದ ಸ್ಥಳಗಳನ್ನು ಕ್ರಮವಾಗಿ ತಿಳಿಸಿ.", "a": "1) ಅರೇಬಿಯ; 2) ದಮಸ್ಕಸ್; 3) ಜೆರುಸಲೇಮ್ (ಮೂರು ವರ್ಷಗಳ ನಂತರ); 4) ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳು", "r": "1:17–21"}, {"n": 186, "q": "ಪೌಲನು ಅರೇಬಿಯಾಕ್ಕೆ ಹೇಗೆ ಹೋದನು?", "a": "ನೇರವಾಗಿ", "r": "1:17"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ.”", "a": "ಪ್ರೇಷಿತರಾದವರನ್ನು", "r": "1:17"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಿಗೆ, ನೇರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದೆ.”", "a": "ಅರೇಬಿಯಾಕ್ಕೆ", "r": "1:17"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಗರಕ್ಕೆ ಹಿಂದಿರುಗಿದೆ.”", "a": "ದಮಸ್ಕಸ್", "r": "1:17"}, {"n": 190, "q": "“ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "1:17"}, {"n": 191, "q": "ಗಲಾತ್ಯರಿಗೆ 1:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಲಿಲ್ಲ. ಬದಲಿಗೆ, ನೇರವಾಗಿ ಅರೇಬಿಯಾಕ್ಕೆ ಹೋದೆ. ಅಲ್ಲಿಂದ ದಮಸ್ಕಸ್ ನಗರಕ್ಕೆ ಹಿಂದಿರುಗಿದೆ.", "r": "1:17"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಿಂತ ಮುಂಚಿತವಾಗಿ ಪ್ರೇಷಿತರಾದವರನ್ನು ಕಾಣಲೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಲಿಲ್ಲ.”", "a": "ಜೆರುಸಲೇಮಿಗೂ", "r": "1:17"}, {"n": 193, "q": "ಎಷ್ಟು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಹೋದನು?", "a": "ಮೂರು ವರ್ಷಗಳ ನಂತರ", "r": "1:18"}, {"n": 194, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಯಾರನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಹೋದನು?", "a": "ಕೇಫನನ್ನು", "r": "1:18"}, {"n": 195, "q": "ಪೌಲನು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಕೇಫನೊಂದಿಗೆ ಎಷ್ಟು ದಿನ ತಂಗಿದ್ದನು?", "a": "ಹದಿನೈದು ದಿನ", "r": "1:18"}, {"n": 196, "q": "ಮೂರು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಜೆರುಸಲೇಮಿಗೆ ಏಕೆ ಹೋದನು?", "a": "ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು", "r": "1:18"}, {"n": 197, "q": "ಮೂರು ವರ್ಷಗಳ ನಂತರ ಪೌಲನು ಯಾವ ನಗರಕ್ಕೆ ಹೋದನು?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "1:18"}, {"n": 198, "q": "ಪೌಲನು ಹದಿನೈದು ದಿನ ಯಾರೊಂದಿಗೆ ತಂಗಿದ್ದನು?", "a": "ಕೇಫನೊಂದಿಗೆ", "r": "1:18"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ;”", "a": "ಕೇಫನನ್ನು", "r": "1:18"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹದಿನೈದು ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಂಗಿದ್ದೆ.”", "a": "ಆತನೊಂದಿಗೆ", "r": "1:18"}, {"n": 201, "q": "“ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "1:18"}, {"n": 202, "q": "ಗಲಾತ್ಯರಿಗೆ 1:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು ಜೆರುಸಲೇಮಿಗೆ ಹೋದೆ; ಹದಿನೈದು ದಿನ ಆತನೊಂದಿಗೆ ತಂಗಿದ್ದೆ.", "r": "1:18"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೂರು ವರ್ಷಗಳ ನಂತರವೇ ಕೇಫನನ್ನು ಕಂಡು ಮಾತನಾಡಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದೆ;”", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "1:18"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹದಿನೈದು ದಿನ ಆತನೊಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಂಗಿದ್ದೆ", "r": "1:18"}, {"n": 205, "q": "ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಕೇಫನಲ್ಲದೆ ಪೌಲನು ಕಂಡ ಇನ್ನೊಬ್ಬ ಪ್ರೇಷಿತನು ಯಾರು?", "a": "ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬ", "r": "1:19"}, {"n": 206, "q": "ಯಕೋಬನನ್ನು ಪೌಲನು ಯಾರ ಸಹೋದರ ಎಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಪ್ರಭುವಿನ ಸಹೋದರ", "r": "1:19"}, {"n": 207, "q": "ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಪೌಲನು ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾರನ್ನೂ ಕಾಣಲಿಲ್ಲ?", "a": "ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ", "r": "1:19"}, {"n": 208, "q": "ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬನು ಯಾರಲ್ಲಿ ಒಬ್ಬನೆಂದು ಪೌಲನ ಮಾತುಗಳು ಸೂಚಿಸುತ್ತವೆ?", "a": "ಪ್ರೇಷಿತರಲ್ಲಿ", "r": "1:19"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ, ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ ಪ್ರಭುವಿನ ಸಹೋದರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ ನಾನು ಕಾಣಲಿಲ್ಲ.”", "a": "ಯಕೋಬನಲ್ಲದೆ", "r": "1:19"}, {"n": 210, "q": "“ಆಗ, ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ ನಾನು ಕಾಣಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "1:19"}, {"n": 211, "q": "ಗಲಾತ್ಯರಿಗೆ 1:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ, ಉಳಿದ ಪ್ರೇಷಿತರಲ್ಲಿ ಪ್ರಭುವಿನ ಸಹೋದರ ಯಕೋಬನಲ್ಲದೆ ಬೇರೆ ಯಾವ ಪ್ರೇಷಿತರನ್ನೂ ನಾನು ಕಾಣಲಿಲ್ಲ.", "r": "1:19"}, {"n": 212, "q": "ವಾಕ -width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.”", "a": "ಸಂಗತಿಗಳು", "r": "1:20"}, {"n": 222, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು …”", "a": "“… ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ ಸಾಕ್ಷಿ.”", "r": "1:20"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಬರೆಯುವ ಸಂಗತಿಗಳು ಸುಳ್ಳಲ್ಲ ಎಂಬುದಕ್ಕೆ ದೇವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿ", "r": "1:20"}, {"n": 224, "q": "ಜೆರುಸಲೇಮಿನ ಭೇಟಿಯ ಅನಂತರ ಪೌಲನು ಯಾವ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದನು?", "a": "ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ", "r": "1:21"}, {"n": 225, "q": "ಜೆರುಸಲೇಮಿನಿಂದ ಪೌಲನು ಹೋದ ಪ್ರಾಂತ್ಯಗಳು ಎಷ್ಟು? ಯಾವುವು?", "a": "ಎರಡು: ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ", "r": "1:21"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.”", "a": "ಸಿಲಿಸಿಯ", "r": "1:21"}, {"n": 227, "q": "“ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "1:21"}, {"n": 228, "q": "ಗಲಾತ್ಯರಿಗೆ 1:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅನಂತರ ನಾನು ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.", "r": "1:21"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದೆ.”", "a": "ಸಿರಿಯ", "r": "1:21"}, {"n": 230, "q": "ಪೌಲನ ಪರಿಚಯವಾಗಿರದಿದ್ದ ಸಭೆಗಳು ಯಾವುವು?", "a": "ಜುದೇಯ ಪ್ರಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು", "r": "1:22"}, {"n": 231, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನನ್ನು ಕುರಿತು ದೇವರನ್ನು ಏಕೆ ಕೊಂಡಾಡುತ್ತಿದ್ದರು?", "a": "ಹಿಂದೆ ತಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ ಎಂಬ ಸುದ್ದಿ ಕೇಳಿದ್ದರಿಂದ", "r": "1:22–24"}, {"n": 232, "q": "ಸಿರಿಯ ಮತ್ತು ಸಿಲಿಸಿಯ ಪ್ರಾಂತ್ಯಗಳಿಗೆ ಹೋದಾಗ ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ಪೌಲನ ಬಗ್ಗೆ ಏನು ಸ್ಥಿತಿ ಇತ್ತು?", "a": "ಅವರಿಗೆ ಅವನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ", "r": "1:22"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.”", "a": "ಜುದೇಯ", "r": "1:22"}, {"n": 234, "q": "“ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "1:22"}, {"n": 235, "q": "ಗಲಾತ್ಯರಿಗೆ 1:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.", "r": "1:22"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತ ಸಭೆಗಳಿಗೆ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ", "r": "1:22"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಜುದೇಯ ಪಾಂತ್ಯದಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಭೆಗಳಿಗೆ ನನ್ನ ಪರಿಚಯವಾಗಿರಲಿಲ್ಲ.”", "a": "ಕ್ರೈಸ್ತ", "r": "1:22"}, {"n": 238, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನ ಬಗ್ಗೆ ಕೇಳಿದ್ದ ಸುದ್ದಿ ಏನು?", "a": "‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’", "r": "1:23"}, {"n": 239, "q": "ಪೌಲನು ಹಿಂದೆ ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ್ದು ಏನನ್ನು?", "a": "ವಿಶ್ವಾಸವನ್ನು (ದೇವರ ಸಭೆಯನ್ನು)", "r": "1:23"}, {"n": 240, "q": "“ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು” ಎಂಬುದು ಯಾರನ್ನು ಕುರಿತು?", "a": "ಪೌಲನನ್ನು", "r": "1:23"}, {"n": 241, "q": "ಹಿಂದೊಮ್ಮೆ ಸಭೆಯನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದ ಪೌಲನು ಈಗ ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದನು", "r": "1:23"}, {"n": 242, "q": "ಜುದೇಯದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು ಪೌಲನ ಬಗ್ಗೆ ಏನನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು?", "a": "ಒಂದು ಸುದ್ದಿಯನ್ನು (ಹಿಂದೆ ಹಿಂಸಿಸುತ್ತಿದ್ದವನು ಈಗ ವಿಶ್ವಾಸವನ್ನು ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ ಎಂಬುದು)", "r": "1:23"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಹಿಂಸಿಸುತ್ತಿದ್ದವನು", "r": "1:23"}, {"n": 244, "q": "“ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "1:23"}, {"n": 245, "q": "ಗಲಾತ್ಯರಿಗೆ 1:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ’, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.", "r": "1:23"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಮಾಡುತ್ತಿದ್ದಾನೆ", "r": "1:23"}, {"n": 247, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ …”", "a": "“… ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "r": "1:23"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಎಂಬ ಸುದ್ದಿಯನ್ನು ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಮಾಡಲೆತ್ನಿಸಿದ; ವಿಶ್ವಾಸವನ್ನೇ", "r": "1:23"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೊಮ್ಮೆ ನಮ್ಮನ್ನು ಹಿಂಸಿಸುತ್ತಿದ್ದವನು, ತಾನು ನಾಶ ಮಾಡಲೆತ್ನಿಸಿದ ವಿಶ್ವಾಸವನ್ನೇ ಈಗ ಪ್ರಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ, ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ ಕೇಳಿದ್ದರು.”", "a": "ಸುದ್ದಿಯನ್ನು", "r": "1:23"}, {"n": 250, "q": "ಪೌಲ Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
