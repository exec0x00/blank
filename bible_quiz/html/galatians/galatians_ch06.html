<script id="src" type="application/json">{"title": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರ", "portion": "ಗಲಾತ್ಯರಿಗೆ 1–6", "cover": false, "chapters": [{"chapter": 6, "label": "ಅಧ್ಯಾಯ 6", "verses": 18, "questions": [{"n": 1, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಆರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಸತ್ಕಾರ್ಯಗಳಿಂದ ಸತ್ಫಲ", "r": "6:1"}, {"n": 2, "q": "ಗಲಾತ್ಯರಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳು ಏನು ಮಾಡಬೇಕು?", "a": "ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು", "r": "6:1"}, {"n": 3, "q": "ತಪ್ಪಿತಸ್ಥನನ್ನು ಹೇಗೆ ತಿದ್ದಬೇಕು?", "a": "ನಯವಿನಯದಿಂದ", "r": "6:1"}, {"n": 4, "q": "ತಪ್ಪಿತಸ್ಥನನ್ನು ತಿದ್ದಬೇಕಾದವರನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳು", "r": "6:1"}, {"n": 5, "q": "ತಪ್ಪಿತಸ್ಥನನ್ನು ತಿದ್ದುವವನು ಯಾವುದಕ್ಕೆ ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು?", "a": "ಪಾಪಪ್ರಚೋದನೆಗೆ", "r": "6:1"}, {"n": 6, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಸಹೋದರರೇ” ಎಂಬ ಸಂಬೋಧನೆ ಬರುವ ವಚನಗಳು ಯಾವುವು?", "a": "6:1 ಮತ್ತು 6:18", "r": "6:1; 6:18"}, {"n": 7, "q": "ಆರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಚನದಲ್ಲಿ ಪೌಲನು ಗಲಾತ್ಯರನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳು", "r": "6:1"}, {"n": 8, "q": "ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳು ಯಾವಾಗ ಒಬ್ಬನನ್ನು ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು?", "a": "ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ", "r": "6:1"}, {"n": 9, "q": "ತಪ್ಪಿತಸ್ಥನನ್ನು ತಿದ್ದಿ ಎಲ್ಲಿಗೆ ತರಬೇಕು?", "a": "ಸರಿಯಾದ ದಾರಿಗೆ", "r": "6:1"}, {"n": 10, "q": "ತಪ್ಪಿತಸ್ಥನನ್ನು ತಿದ್ದುವವನು ಹೇಗಿರಬೇಕು?", "a": "ತಾನೂ ಅವನಂತೆ ಪಾಪಪ್ರಚೋದನೆಗೆ ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು", "r": "6:1"}, {"n": 11, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:1–10ರಲ್ಲಿ ಪೌಲನು ಕೊಡುವ ಯಾವುದಾದರೂ ಐದು ಸಲಹೆಗಳನ್ನು ತಿಳಿಸಿ.", "a": "1) ತಪ್ಪಿತಸ್ಥನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಬೇಕು; 2) ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ; 3) ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ; 4) ಉಪದೇಶ ಪಡೆಯುವವನು ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ; 5) ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವುದರಲ್ಲಿ ಬೇಸರಪಡದಿರೋಣ; 6) ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ", "r": "6:1–10"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ ನೀವು ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.”", "a": "ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ", "r": "6:1"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀನೂ ಅವನಂತೆ ಪಾಪಪ್ರಚೋದನೆಗೆ ಒಳಗಾಗದಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು", "r": "6:1"}, {"n": 14, "q": "“ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ ನೀವು ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "6:1"}, {"n": 15, "q": "ಗಲಾತ್ಯರಿಗೆ 6:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ ನೀವು ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು. ಆದರೆ ನೀನೂ ಅವನಂತೆ ಪಾಪಪ್ರಚೋದನೆಗೆ ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು.", "r": "6:1"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೀವಿಗಳಾದ ನೀವು ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.”", "a": "ಆಧ್ಯಾತ್ಮಿಕ", "r": "6:1"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀನೂ ಅವನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು.”", "a": "ಪಾಪಪ್ರಚೋದನೆಗೆ", "r": "6:1"}, {"n": 18, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ …”", "a": "“… ನೀವು ಅಂಥವನನ್ನು ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.”", "r": "6:1"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ ನೀವು ಅಂಥವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.”", "a": "ನಿಮ್ಮಲ್ಲಿ; ನಯವಿನಯದಿಂದ", "r": "6:1"}, {"n": 20, "q": "“ಆದರೆ ನೀನೂ ಅವನಂತೆ ಪಾಪಪ್ರಚೋದನೆಗೆ ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "6:1"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಿಮ್ಮಲ್ಲಿ ಯಾರಾದರೂ ತಪ್ಪಿತಸ್ಥರಾಗಿದ್ದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಜೀವಿಗಳಾದ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಯವಿನಯದಿಂದ ತಿದ್ದಿ ಸರಿಯಾದ ದಾರಿಗೆ ತರಬೇಕು.”", "a": "ಅಂಥವನನ್ನು", "r": "6:1"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಂತೆ ಪಾಪಪ್ರಚೋದನೆಗೆ ಒಳಗಾಗದಂತೆ ಎಚ್ಚರಿಕೆಯಿಂದಿರಬೇಕು.”", "a": "ನೀನೂ", "r": "6:1"}, {"n": 23, "q": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ನಿಯಮವನ್ನು ನೆರವೇರಿಸುವ ಮಾರ್ಗ ಯಾವುದು ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ.”", "r": "6:2"}, {"n": 24, "q": "ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳುವುದರಿಂದ ಏನನ್ನು ನೆರವೇರಿಸುತ್ತೇವೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ನಿಯಮವನ್ನು", "r": "6:2"}, {"n": 25, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:2 ಮತ್ತು 6:5ರಲ್ಲಿ ‘ಭಾರ’ ಮತ್ತು ‘ಹೊರೆ’ಯ ಬಗ್ಗೆ ಹೇಳಿರುವುದೇನು?", "a": "6:2 — ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ; 6:5 — ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ ಹೊತ್ತುಕೊಳ್ಳಬೇಕು", "r": "6:2; 6:5"}, {"n": 26, "q": "ಪೌಲನು 6:2ರಲ್ಲಿ ಯಾರ ನಿಯಮವನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ನಿಯಮವನ್ನು", "r": "6:2"}, {"n": 27, "q": "ಗಲಾತ್ಯರು ಒಬ್ಬರಿಗೊಬ್ಬರು ಏನನ್ನು ಹೊತ್ತುಕೊಳ್ಳಬೇಕು?", "a": "ಒಬ್ಬರ ಭಾರವನ್ನು", "r": "6:2"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೊತ್ತುಕೊಳ್ಳಿ", "r": "6:2"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಯಮವನ್ನು ನೆರವೇರಿಸುವಿರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "6:2"}, {"n": 30, "q": "ಗಲಾತ್ಯರಿಗೆ 6:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ. ಹೀಗೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ನಿಯಮವನ್ನು ನೆರವೇರಿಸುವಿರಿ.", "r": "6:2"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ.”", "a": "ಭಾರವನ್ನು", "r": "6:2"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಕ್ರಿಸ್ತಯೇಸುವಿನ ನಿಯಮವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆರವೇರಿಸುವಿರಿ", "r": "6:2"}, {"n": 33, "q": "ಅಲ್ಪನು ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ ಏನಾಗುತ್ತದೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "6:3"}, {"n": 34, "q": "ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುವವನು ಯಾರು?", "a": "ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಳ್ಳುವ ಅಲ್ಪನು", "r": "6:3"}, {"n": 35, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:3 ಯಾವ ಪದದಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಅಷ್ಟೆ", "r": "6:3"}, {"n": 36, "q": "ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಳ್ಳುವವನನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಅಲ್ಪನು", "r": "6:3"}, {"n": 37, "q": "ಅಲ್ಪನು ತನ್ನನ್ನು ಏನೆಂದು ಭಾವಿಸಿಕೊಳ್ಳುತ್ತಾನೆ?", "a": "ಶ್ರೇಷ್ಠನೆಂದು", "r": "6:3"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಪನು ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ ತನ್ನನ್ನು ತಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಷ್ಟೆ.”", "a": "ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ", "r": "6:3"}, {"n": 39, "q": "“ಅಲ್ಪನು ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಅಷ್ಟೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "6:3"}, {"n": 40, "q": "ಗಲಾತ್ಯರಿಗೆ 6:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಪನು ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಅಷ್ಟೆ.", "r": "6:3"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಪನು ತಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸಿಕೊಂಡರೆ ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಅಷ್ಟೆ.”", "a": "ಶ್ರೇಷ್ಠನೆಂದು", "r": "6:3"}, {"n": 42, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಪನು ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ …”", "a": "“… ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಅಷ್ಟೆ.”", "r": "6:3"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾನು ಶ್ರೇಷ್ಠನೆಂದು ಭಾವಿಸಿಕೊಂಡರೆ ತನ್ನನ್ನು ತಾನೇ ವಂಚಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಅಷ್ಟೆ.”", "a": "ಅಲ್ಪನು", "r": "6:3"}, {"n": 44, "q": "ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಏನನ್ನು ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ?", "a": "ತನ್ನ ನಡತೆಯನ್ನು", "r": "6:4"}, {"n": 45, "q": "ಒಬ್ಬನು ಯಾವಾಗ ಹೆಮ್ಮೆಪಡಬಹುದು?", "a": "ತನ್ನ ನಡತೆ ಒಳಿತಾಗಿದ್ದರೆ", "r": "6:4"}, {"n": 46, "q": "ಯಾವ ರೀತಿಯಲ್ಲಿ ಹೆಮ್ಮೆಪಡಬೇಕಾಗಿಲ್ಲ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಇತರರೊಂದಿಗೆ ಹೋಲಿಸಿ", "r": "6:4"}, {"n": 47, "q": "ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಯಾರು ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಬೇಕು?", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:4"}, {"n": 48, "q": "ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ಹೇಗೆ ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಬೇಕು?", "a": "ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ", "r": "6:4"}, {"n": 49, "q": "ತನ್ನ ನಡತೆ ಒಳಿತಾಗಿದ್ದರೆ ಒಬ್ಬನು ಏನು ಮಾಡಲಿ?", "a": "ಹೆಮ್ಮೆಪಡಲಿ", "r": "6:4"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ", "r": "6:4"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ನಡತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಮ್ಮೆಪಡಲಿ.”", "a": "ಒಳಿತಾಗಿದ್ದರೆ", "r": "6:4"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಇತರರೊಂದಿಗೆ ಹೋಲಿಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೆಮ್ಮೆಪಡಬೇಕಾಗಿಲ್ಲ", "r": "6:4"}, {"n": 53, "q": "“ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "6:4"}, {"n": 54, "q": "ಗಲಾತ್ಯರಿಗೆ 6:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ. ತನ್ನ ನಡತೆ ಒಳಿತಾಗಿದ್ದರೆ ಹೆಮ್ಮೆಪಡಲಿ. ಆದರೆ ಇತರರೊಂದಿಗೆ ಹೋಲಿಸಿ ಹೆಮ್ಮೆಪಡಬೇಕಾಗಿಲ್ಲ.", "r": "6:4"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:4"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ನಡತೆ ಒಳಿತಾಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೆಮ್ಮೆಪಡಲಿ", "r": "6:4"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಲಿಸಿ ಹೆಮ್ಮೆಪಡಬೇಕಾಗಿಲ್ಲ.”", "a": "ಇತರರೊಂದಿಗೆ", "r": "6:4"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ನಡತೆಯನ್ನು ತನ್ನಷ್ಟಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪರಿಶೋಧಿಸಿಕೊಳ್ಳಲಿ.”", "a": "ತಾನೇ", "r": "6:4"}, {"n": 59, "q": "ಪ್ರತಿಯೊಬ್ಬನೂ ತಾನೇ ಏನನ್ನು ಹೊತ್ತುಕೊಳ್ಳಬೇಕು?", "a": "ತನ್ನ ಹೊರೆಯನ್ನು", "r": "6:5"}, {"n": 60, "q": "ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ ಹೊತ್ತುಕೊಳ್ಳಬೇಕಾದವನು ಯಾರು?", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:5"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೊತ್ತುಕೊಳ್ಳಬೇಕು", "r": "6:5"}, {"n": 62, "q": "“ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ ಹೊತ್ತುಕೊಳ್ಳಬೇಕು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "6:5"}, {"n": 63, "q": "ಗಲಾತ್ಯರಿಗೆ 6:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ ಹೊತ್ತುಕೊಳ್ಳಬೇಕು.", "r": "6:5"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಹೊರೆಯನ್ನು ತಾನೇ ಹೊತ್ತುಕೊಳ್ಳಬೇಕು.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:5"}, {"n": 65, "q": "ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಯಾರೊಂದಿಗೆ ತನ್ನ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ?", "a": "ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ", "r": "6:6"}, {"n": 66, "q": "ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ಏನನ್ನು ಹಂಚಿಕೊಳ್ಳಲಿ?", "a": "ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ", "r": "6:6"}, {"n": 67, "q": "ಉಪದೇಶ ಪಡೆಯುವವನು ಯಾವ ಉಪದೇಶವನ್ನು ಪಡೆಯುತ್ತಾನೆ?", "a": "ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶವನ್ನು", "r": "6:6"}, {"n": 68, "q": "ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಬೇಕಾದವನು ಯಾರು?", "a": "ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು", "r": "6:6"}, {"n": 69, "q": "ಉಪದೇಶ ಪಡೆಯುವವನು ತನ್ನ ಒಳ್ಳೆಯದನ್ನು ಹಂಚಿಕೊಳ್ಳಬೇಕಾದ ವ್ಯಕ್ತಿಯನ್ನು ಏನೆಂದು ಕರೆಯಲಾಗಿದೆ?", "a": "ಉಪದೇಶ ಮಾಡುವವನು", "r": "6:6"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಂಚಿಕೊಳ್ಳಲಿ.”", "a": "ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ", "r": "6:6"}, {"n": 71, "q": "“ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "6:6"}, {"n": 72, "q": "ಗಲಾತ್ಯರಿಗೆ 6:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ.", "r": "6:6"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ.”", "a": "ಮಾಡುವವನೊಂದಿಗೆ", "r": "6:6"}, {"n": 74, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ …”", "a": "“… ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ.”", "r": "6:6"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ವಾಕ್ಯದ ಉಪದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಡೆಯುವವನು; ಹಂಚಿಕೊಳ್ಳಲಿ", "r": "6:6"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಪದೇಶ ಪಡೆಯುವವನು ಉಪದೇಶ ಮಾಡುವವನೊಂದಿಗೆ ತನಗೆ ಇರುವ ಒಳ್ಳೆಯದನ್ನೆಲ್ಲಾ ಹಂಚಿಕೊಳ್ಳಲಿ.”", "a": "ವಾಕ್ಯದ", "r": "6:6"}, {"n": 77, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:7 ಯಾವ ಎಚ್ಚರಿಕೆಯಿಂದ ಆರಂಭವಾಗುತ್ತದೆ?", "a": "“ಮೋಸಹೋಗದಿರಿ”", "r": "6:7"}, {"n": 78, "q": "ಯಾರನ್ನು ವಂಚಿಸಬಹುದೆಂದು ಭಾವಿಸಬಾರದು?", "a": "ದೇವರನ್ನು", "r": "6:7"}, {"n": 79, "q": "ಏನನ್ನು ನೆನಪಿನಲ್ಲಿಡಬೇಕೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಬಿತ್ತುವುದನ್ನೇ ಕೊಯ್ಯುತ್ತೇವೆ”", "r": "6:7"}, {"n": 80, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:7–9ರಲ್ಲಿ ಬಿತ್ತುವುದು ಮತ್ತು ಕೊಯ್ಯುವುದು ಎಂಬ ಉದಾಹರಣೆಯನ್ನು ಉಪಯೋಗಿಸಲಾದ ಮೂರು ವಚನಗಳು ಯಾವುವು?", "a": "6:7, 6:8, 6:9", "r": "6:7–9"}, {"n": 81, "q": "ಮೋಸಹೋಗದಿರಿ ಎಂದು ಹೇಳಿದ ನಂತರ ಪೌಲನು ಏನು ಭಾವಿಸದಿರಿ ಎನ್ನುತ್ತಾನೆ?", "a": "ದೇವರನ್ನು ವಂಚಿಸಬಹುದೆಂದು", "r": "6:7"}, {"n": 82, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:7ರ ಪ್ರಕಾರ ನಾವು ಏನನ್ನು ಕೊಯ್ಯುತ್ತೇವೆ?", "a": "ಬಿತ್ತುವುದನ್ನೇ", "r": "6:7"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಸಹೋಗದಿರಿ, ದೇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸದಿರಿ;”", "a": "ವಂಚಿಸಬಹುದೆಂದು", "r": "6:7"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಯ್ಯುತ್ತೇವೆ ಎಂಬುದನ್ನು ನೆನಪಿನಲ್ಲಿಡಿ.”", "a": "ಬಿತ್ತುವುದನ್ನೇ", "r": "6:7"}, {"n": 85, "q": "ಗಲಾತ್ಯರಿಗೆ 6:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೋಸಹೋಗದಿರಿ, ದೇವರನ್ನು ವಂಚಿಸಬಹುದೆಂದು ಭಾವಿಸದಿರಿ; ಬಿತ್ತುವುದನ್ನೇ ಕೊಯ್ಯುತ್ತೇವೆ ಎಂಬುದನ್ನು ನೆನಪಿನಲ್ಲಿಡಿ.", "r": "6:7"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರನ್ನು ವಂಚಿಸಬಹುದೆಂದು ಭಾವಿಸದಿರಿ;”", "a": "ಮೋಸಹೋಗದಿರಿ", "r": "6:7"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಿತ್ತುವುದನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ನೆನಪಿನಲ್ಲಿಡಿ.”", "a": "ಕೊಯ್ಯುತ್ತೇವೆ", "r": "6:7"}, {"n": 88, "q": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಯಾವ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ?", "a": "ನಾಶವೆಂಬ ಫಲವನ್ನು", "r": "6:8"}, {"n": 89, "q": "ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಯಾವ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ?", "a": "ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು", "r": "6:8"}, {"n": 90, "q": "ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಿತ್ಯಜೀವವನ್ನು ಯಾವುದರಿಂದ ಕೊಯ್ಯುತ್ತಾನೆ?", "a": "ಆತ್ಮದಿಂದ", "r": "6:8"}, {"n": 91, "q": "ಎರಡು ಸ್ವಭಾವಗಳಲ್ಲಿ ಬಿತ್ತುವವರು ಕೊಯ್ಯುವ ಫಲಗಳನ್ನು ಹೋಲಿಸಿ.", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಾಶವೆಂಬ ಫಲವನ್ನು; ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ", "r": "6:8"}, {"n": 92, "q": "ನಾಶವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುವವನು ಯಾವ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ", "r": "6:8"}, {"n": 93, "q": "ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುವವನು ಯಾರು?", "a": "ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು", "r": "6:8"}, {"n": 94, "q": "ನಾಶವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುವವನು ಯಾರು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು", "r": "6:8"}, {"n": 95, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:8ರಲ್ಲಿ ಹೇಳಲಾದ ಎರಡು ಸ್ವಭಾವಗಳು ಯಾವುವು?", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವ; ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವ", "r": "6:8"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಾಶವೆಂಬ ಫಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಯ್ಯುತ್ತಾನೆ", "r": "6:8"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಆತ್ಮದಿಂದ ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.”", "a": "ಪವಿತ್ರಾತ್ಮ", "r": "6:8"}, {"n": 98, "q": "“ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಾಶವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "6:8"}, {"n": 99, "q": "ಗಲಾತ್ಯರಿಗೆ 6:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಾಶವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ. ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಆತ್ಮದಿಂದ ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.", "r": "6:8"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈಹಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ನಾಶವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.”", "a": "ವ್ಯಾಮೋಹವೆಂಬ", "r": "6:8"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಆತ್ಮದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.”", "a": "ನಿತ್ಯಜೀವವೆಂಬ", "r": "6:8"}, {"n": 102, "q": "“ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು ಆತ್ಮದಿಂದ ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "6:8"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೈಹಿಕ ವ್ಯಾಮೋಹವೆಂಬ ಸ್ವಭಾವದಲ್ಲಿ ಬಿತ್ತುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.”", "a": "ನಾಶವೆಂಬ", "r": "6:8"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರಾತ್ಮ ಸ್ವಭಾವದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತ್ಮದಿಂದ ನಿತ್ಯಜೀವವೆಂಬ ಫಲವನ್ನು ಕೊಯ್ಯುತ್ತಾನೆ.”", "a": "ಬಿತ್ತುವವನು", "r": "6:8"}, {"n": 105, "q": "ಯಾವುದರಲ್ಲಿ ಬೇಸರಪಡದಿರೋಣ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವುದರಲ್ಲಿ", "r": "6:9"}, {"n": 106, "q": "ಸತ್ಕಾರ್ಯಗಳಲ್ಲಿ ಎದೆಗುಂದದಿದ್ದರೆ ಯಾವಾಗ ಸತ್ಫಲವನ್ನು ಕೊಯ್ಯುವೆವು?", "a": "ಸೂಕ್ತಕಾಲದಲ್ಲಿ", "r": "6:9"}, {"n": 107, "q": "ಸತ್ಕಾರ್ಯಗಳ ವಿಷಯದಲ್ಲಿ ಪೌಲನು ಹೇಳುವ ಎರಡು ಮಾಡದಿರೋಣ ಎಂಬ ಸಲಹೆಗಳು ಯಾವುವು?", "a": "ಬೇಸರಪಡದಿರೋಣ; ಎದೆಗುಂದದಿರೋಣ", "r": "6:9"}, {"n": 108, "q": "ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಾ ಎದೆಗುಂದದಿದ್ದರೆ ಏನನ್ನು ಕೊಯ್ಯುವೆವು?", "a": "ಸತ್ಫಲವನ್ನು", "r": "6:9"}, {"n": 109, "q": "ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವುದರಲ್ಲಿ ನಾವು ಹೇಗಿರಬೇಕು?", "a": "ಬೇಸರಪಡದೆ, ಎದೆಗುಂದದೆ ಇರಬೇಕು", "r": "6:9"}, {"n": 110, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ‘ಸತ್ಫಲ’ ಎಂಬ ಪದ ಬರುವ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು (5:22); ಸೂಕ್ತಕಾಲದಲ್ಲಿ ಸತ್ಫಲವನ್ನು ಕೊಯ್ಯುವೆವು (6:9)", "r": "5:22; 6:9"}, {"n": 111, "q": "“ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವುದರಲ್ಲಿ ಬೇಸರಪಡದಿರೋಣ” — ಇದನ್ನು ಬರೆದವರು ಯಾರು ಮತ್ತು ಯಾರಿಗೆ?", "a": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ", "r": "6:9"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಫಲವನ್ನು ಕೊಯ್ಯುವೆವು.”", "a": "ಸೂಕ್ತಕಾಲದಲ್ಲಿ", "r": "6:9"}, {"n": 113, "q": "ಗಲಾತ್ಯರಿಗೆ 6:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸತ್ಕಾರ್ಯಗಳನ್ನು ಮಾಡುವುದರಲ್ಲಿ ಬೇಸರಪಡದಿರೋಣ. ಎದೆಗುಂದದಿರೋಣ; ಆಗ ಸೂಕ್ತಕಾಲದಲ್ಲಿ ಸತ್ಫಲವನ್ನು ಕೊಯ್ಯುವೆವು.", "r": "6:9"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಸೂಕ್ತಕಾಲದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಯ್ಯುವೆವು.”", "a": "ಸತ್ಫಲವನ್ನು", "r": "6:9"}, {"n": 115, "q": "ಸರ್ವರಿಗೂ ಯಾವಾಗ ಉಪಕಾರಮಾಡಬೇಕು?", "a": "ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ", "r": "6:10"}, {"n": 116, "q": "ಮುಖ್ಯವಾಗಿ ಯಾರಿಗೆ ಉಪಕಾರ ಮಾಡಬೇಕೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ", "r": "6:10"}, {"n": 117, "q": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳು ಯಾರಂತೆ ಇದ್ದಾರೆ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಒಂದೇ ಕುಟುಂಬದವರಂತೆ", "r": "6:10"}, {"n": 118, "q": "ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ಯಾರಿಗೆ ಉಪಕಾರಮಾಡಬೇಕು?", "a": "ಸರ್ವರಿಗೂ", "r": "6:10"}, {"n": 119, "q": "ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ನಾವು ಏನು ಮಾಡೋಣ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ", "r": "6:10"}, {"n": 120, "q": "ಉಪಕಾರ ಮಾಡುವುದರಲ್ಲಿ ಯಾರಿಗೆ ಆದ್ಯತೆ ಕೊಡಬೇಕು?", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ (ಮುಖ್ಯವಾಗಿ)", "r": "6:10"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ಸರ್ವರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಪಕಾರಮಾಡೋಣ", "r": "6:10"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಇರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಪಕಾರ ಮಾಡೋಣ.”", "a": "ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ", "r": "6:10"}, {"n": 123, "q": "“ಎಂದೇ ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "6:10"}, {"n": 124, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ ಕುಟುಂಬದವರಂತೆ …”", "a": "“… ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ ಉಪಕಾರ ಮಾಡೋಣ.”", "r": "6:10"}, {"n": 125, "q": "ಗಲಾತ್ಯರಿಗೆ 6:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎಂದೇ ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ. ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ ಉಪಕಾರ ಮಾಡೋಣ.", "r": "6:10"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ ಸಮಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವಾಗಲೇ ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ.”", "a": "ಸಂದರ್ಭಗಳು", "r": "6:10"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ ಉಪಕಾರ ಮಾಡೋಣ.”", "a": "ಕುಟುಂಬದವರಂತೆ", "r": "6:10"}, {"n": 128, "q": "“ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ ಉಪಕಾರ ಮಾಡೋಣ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "6:10"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಮಯ ಸಂದರ್ಭಗಳು ಇರುವಾಗಲೇ ಸರ್ವರಿಗೂ ಉಪಕಾರಮಾಡೋಣ.”", "a": "ಎಂದೇ", "r": "6:10"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಲ್ಲೂ ಮುಖ್ಯವಾಗಿ, ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಇರುವ ಕ್ರೈಸ್ತವಿಶ್ವಾಸಿಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡೋಣ.”", "a": "ಉಪಕಾರ", "r": "6:10"}, {"n": 131, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:11ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಶಿಲುಬೆಯ ಮಹತ್ವ", "r": "6:11"}, {"n": 132, "q": "ಪೌಲನು ಗಲಾತ್ಯರಿಗೆ ಯಾವ ಅಕ್ಷರಗಳನ್ನು ನೋಡಿರಿ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಈ ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳನ್ನು", "r": "6:11"}, {"n": 133, "q": "ಪೌಲನು ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳನ್ನು ಹೇಗೆ ಬರೆಯುತ್ತಿದ್ದನು?", "a": "ತನ್ನ ಸ್ವಂತ ಕೈಯಿಂದಲೇ", "r": "6:11"}, {"n": 134, "q": "“ಇವನ್ನು ನನ್ನ ಸ್ವಂತ ಕೈಯಿಂದಲೇ ಬರೆಯುತ್ತಿದ್ದೇನೆ” — ‘ಇವನ್ನು’ ಎಂದರೆ ಏನು?", "a": "ಈ ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳನ್ನು", "r": "6:11"}, {"n": 135, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಕೊನೆಯಲ್ಲಿ ಪೌಲನು ತನ್ನ ಕೈ ಮತ್ತು ದೇಹದ ಬಗ್ಗೆ ಹೇಳುವ ಎರಡು ಸಂಗತಿಗಳು ಯಾವುವು?", "a": "ಸ್ವಂತ ಕೈಯಿಂದಲೇ ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳಲ್ಲಿ ಬರೆಯುತ್ತಿದ್ದಾನೆ (6:11); ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ಅವನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ (6:17)", "r": "6:11; 6:17"}, {"n": 136, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಕೊನೆಯ ಭಾಗವನ್ನು ಸ್ವಂತ ಕೈಯಿಂದಲೇ ಬರೆದವರು ಯಾರು?", "a": "ಪೌಲನು", "r": "6:11"}, {"n": 137, "q": "ಪೌಲನು ತನ್ನ ಸ್ವಂತ ಕೈಯಿಂದ ಬರೆದ ಅಕ್ಷರಗಳು ಹೇಗಿದ್ದವು?", "a": "ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳು", "r": "6:11"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ದೊಡ್ಡದೊಡ್ಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿರಿ:”", "a": "ಅಕ್ಷರಗಳನ್ನು", "r": "6:11"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನ್ನು ನನ್ನ ಸ್ವಂತ ಕೈಯಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರೆಯುತ್ತಿದ್ದೇನೆ", "r": "6:11"}, {"n": 140, "q": "ಗಲಾತ್ಯರಿಗೆ 6:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ದೊಡ್ಡದೊಡ್ಡ ಅಕ್ಷರಗಳನ್ನು ನೋಡಿರಿ: ಇವನ್ನು ನನ್ನ ಸ್ವಂತ ಕೈಯಿಂದಲೇ ಬರೆಯುತ್ತಿದ್ದೇನೆ.", "r": "6:11"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಕ್ಷರಗಳನ್ನು ನೋಡಿರಿ:”", "a": "ದೊಡ್ಡದೊಡ್ಡ", "r": "6:11"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನ್ನು ನನ್ನ ಸ್ವಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆಯುತ್ತಿದ್ದೇನೆ.”", "a": "ಕೈಯಿಂದಲೇ", "r": "6:11"}, {"n": 143, "q": "“ಇವನ್ನು ನನ್ನ ಸ್ವಂತ ಕೈಯಿಂದಲೇ ಬರೆಯುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "6:11"}, {"n": 144, "q": "ಗಲಾತ್ಯರು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು", "r": "6:12"}, {"n": 145, "q": "ಸುನ್ನತಿಗಾಗಿ ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದವರ ಉದ್ದೇಶವೇನು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದು", "r": "6:12"}, {"n": 146, "q": "ಸುನ್ನತಿಗಾಗಿ ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದವರು ಯಾವುದರಿಂದ ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆಂದಿದ್ದರು?", "a": "ಬಾಹ್ಯಾಚಾರಗಳಿಂದ", "r": "6:12"}, {"n": 147, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸುನ್ನತಿ’ ಬಗ್ಗೆ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "6:12, 6:13, 6:15", "r": "6:12; 6:13; 6:15"}, {"n": 148, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ಹಿಂಸೆಯನ್ನು ತಪ್ಪಿಸಿಕೊಳ್ಳಲು ಬಯಸಿದರೆ, ಪೌಲನು ಶಿಲುಬೆಯ ಬಗ್ಗೆ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ", "r": "6:12; 6:14"}, {"n": 149, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಯಾರ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ಹಿಂಸೆಬಾಧೆಗಳನ್ನು ತಪ್ಪಿಸಿಕೊಳ್ಳಲು ಬಯಸುತ್ತಿದ್ದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ", "r": "6:12"}, {"n": 150, "q": "ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ಗಲಾತ್ಯರನ್ನು ಯಾವುದಕ್ಕೆ ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಲು", "r": "6:12"}, {"n": 151, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಏನು ಉಂಟಾಗಬಾರದೆಂದು ಬಯಸಿದರು?", "a": "ಹಿಂಸೆಬಾಧೆಗಳು", "r": "6:12"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ.”", "a": "ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು", "r": "6:12"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "6:12"}, {"n": 154, "q": "“ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "6:12"}, {"n": 155, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ …”", "a": "“… ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.”", "r": "6:12"}, {"n": 156, "q": "ಗಲಾತ್ಯರಿಗೆ 6:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ. ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.", "r": "6:12"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ನೀವು ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು", "r": "6:12"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.”", "a": "ಹಿಂಸೆಬಾಧೆಗಳು", "r": "6:12"}, {"n": 159, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು …”", "a": "“… ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ.”", "r": "6:12"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾವು ಒಳ್ಳೆಯವರು ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಾಹ್ಯಾಚಾರಗಳಿಂದ; ಮಾಡುತ್ತಿದ್ದಾರೆ", "r": "6:12"}, {"n": 161, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "6:12"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಶಿಲುಬೆಯ ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದೇ ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಂಟಾಗಬಾರದು; ಉದ್ದೇಶವಾಗಿದೆ", "r": "6:12"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಾಹ್ಯಾಚಾರಗಳಿಂದ ತಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎನಿಸಿಕೊಳ್ಳಬೇಕೆನ್ನುವವರು ನೀವು ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದಾರೆ.”", "a": "ಒಳ್ಳೆಯವರು", "r": "6:12"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಿತ್ತ ತಮಗೆ ಹಿಂಸೆಬಾಧೆಗಳು ಉಂಟಾಗಬಾರದು ಎಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿದೆ.”", "a": "ಶಿಲುಬೆಯ", "r": "6:12"}, {"n": 165, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವವರು ತಾವೇ ಏನನ್ನು ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು", "r": "6:13"}, {"n": 166, "q": "ಅವರು ಗಲಾತ್ಯರಿಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಏಕೆ ಬಯಸುತ್ತಾರೆ?", "a": "ಗಲಾತ್ಯರ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ ತಾವು ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ", "r": "6:13"}, {"n": 167, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಯಾವುದರಲ್ಲಿ ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸಲು ಬಯಸುತ್ತಾರೆ, ಪೌಲನು ಯಾವುದರಲ್ಲಿ ಹೆಚ್ಚಳಪಡುತ್ತಾನೆ?", "a": "ಅವರು ಗಲಾತ್ಯರ ದೈಹಿಕ ಸುನ್ನತಿಯಲ್ಲಿ; ಪೌಲನು ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯಲ್ಲಿ", "r": "6:13; 6:14"}, {"n": 168, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಗಲಾತ್ಯರ ಯಾವ ಸುನ್ನತಿಯಿಂದ ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸಲು ಬಯಸುತ್ತಾರೆ?", "a": "ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ", "r": "6:13"}, {"n": 169, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಂಡರೂ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಅನುಸರಿಸಿ ನಡೆಯದವರು ಯಾರು?", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವವರು (ಸುನ್ನತಿಗಾಗಿ ಬಲಾತ್ಕಾರ ಮಾಡುತ್ತಿದ್ದವರು)", "r": "6:13"}, {"n": 170, "q": "ಸುನ್ನತಿ ಪರವಾದಿಗಳು ಗಲಾತ್ಯರ ಸುನ್ನತಿಯಿಂದ ಏನನ್ನು ಗಳಿಸಲು ಬಯಸುತ್ತಾರೆ?", "a": "ಹೆಚ್ಚಳಿಕೆ", "r": "6:13"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ತಾವಾದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು", "r": "6:13"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಯಸುತ್ತಾರೆ.”", "a": "ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು", "r": "6:13"}, {"n": 173, "q": "“ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ತಾವಾದರೂ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "6:13"}, {"n": 174, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು …”", "a": "“… ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಬಯಸುತ್ತಾರೆ.”", "r": "6:13"}, {"n": 175, "q": "ಗಲಾತ್ಯರಿಗೆ 6:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವ ತಾವಾದರೂ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ. ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಬಯಸುತ್ತಾರೆ.", "r": "6:13"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾವಾದರೂ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳುವ", "r": "6:13"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು ಹೆಚ್ಚಳಿಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಬಯಸುತ್ತಾರೆ.”", "a": "ಗಳಿಸುವುದಕ್ಕಾಗಿ", "r": "6:13"}, {"n": 178, "q": "“ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಬಯಸುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "6:13"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವರು ಹೆಚ್ಚಳಿಕೆ ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸುನ್ನತಿಯಿಂದ; ಬಯಸುತ್ತಾರೆ", "r": "6:13"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಸಿಕೊಳ್ಳುವ ತಾವಾದರೂ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಅನುಸರಿಸಿ ನಡೆಯುವುದಿಲ್ಲ.”", "a": "ಸುನ್ನತಿ", "r": "6:13"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ ದೈಹಿಕ ಸುನ್ನತಿಯಿಂದ, ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಳಿಸುವುದಕ್ಕಾಗಿ ನಿಮಗೆ ಸುನ್ನತಿಯಾಗಬೇಕೆಂದು ಬಯಸುತ್ತಾರೆ.”", "a": "ಹೆಚ್ಚಳಿಕೆ", "r": "6:13"}, {"n": 182, "q": "ಪೌಲನು ಯಾವುದನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡಲು ಬಯಸುವುದಿಲ್ಲ?", "a": "ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು", "r": "6:14"}, {"n": 183, "q": "ಶಿಲುಬೆಯ ಮೂಲಕ ಪೌಲನ ಪಾಲಿಗೆ ಲೋಕ ಏನಾಗಿದೆ?", "a": "ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ", "r": "6:14"}, {"n": 184, "q": "ಶಿಲುಬೆಯ ಮೂಲಕ ಪೌಲನು ಲೋಕದ ಪಾಲಿಗೆ ಏನಾಗಿದ್ದಾನೆ?", "a": "ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದ್ದಾನೆ", "r": "6:14"}, {"n": 185, "q": "ಪೌಲನಿಗೆ ಲೋಕವೂ ಲೋಕಕ್ಕೆ ಪೌಲನೂ ಸತ್ತದ್ದು ಯಾವುದರ ಮೂಲಕ?", "a": "ಆ ಶಿಲುಬೆಯ ಮೂಲಕ (ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯ ಮೂಲಕ)", "r": "6:14"}, {"n": 186, "q": "ಪೌಲನು ಹೆಚ್ಚಳಪಡುವ ಶಿಲುಬೆ ಯಾರದು?", "a": "ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರದು", "r": "6:14"}, {"n": 187, "q": "“ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು…” — ಈ ವಾಕ್ಯವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.”", "r": "6:14"}, {"n": 188, "q": "ಶಿಲುಬೆಯ ಮೂಲಕ ಪೌಲನ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿರುವುದು ಯಾವುದು?", "a": "ಲೋಕ", "r": "6:14"}, {"n": 189, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 5 ಮತ್ತು 6ನೇ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ‘ಶಿಲುಬೆಗೆ ಜಡಿ’ಯುವ ಬಗ್ಗೆ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:24 (ದೈಹಿಕ ವ್ಯಾಮೋಹವನ್ನು ಶಿಲುಬೆಗೆ ಜಡಿದುಬಿಟ್ಟಿದ್ದಾರೆ); 6:14 (ಲೋಕವೂ ಪೌಲನೂ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದ್ದಾರೆ)", "r": "5:24; 6:14"}, {"n": 190, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ಪೌಲನು ತಾನು ಶಿಲುಬೆಗೇರಿಸಲ್ಪಟ್ಟವನು ಎಂದು ಹೇಳುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:20 ಮತ್ತು 6:14", "r": "2:20; 6:14"}, {"n": 191, "q": "ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿರುವವನು ಯಾರು?", "a": "ಪೌಲನು", "r": "6:14"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇಡವೇ ಬೇಡ.”", "a": "ಹೆಚ್ಚಳಪಡುವುದು", "r": "6:14"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ ಪಾಲಿಗೆ ಲೋಕವೇ ಶಿಲುಬೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ತಿದೆ;”", "a": "ಜಡಿಸಿಕೊಂಡು", "r": "6:14"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೂ ಸಹ ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸತ್ತಿದ್ದೇನೆ", "r": "6:14"}, {"n": 195, "q": "“ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "6:14"}, {"n": 196, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ …”", "a": "“… ಪಾಲಿಗೆ ಲೋಕವೇ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ;”", "r": "6:14"}, {"n": 197, "q": "“ನಾನೂ ಸಹ ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "6:14"}, {"n": 198, "q": "ಗಲಾತ್ಯರಿಗೆ 6:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ. ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ ಪಾಲಿಗೆ ಲೋಕವೇ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ; ನಾನೂ ಸಹ ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದ್ದೇನೆ.", "r": "6:14"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರ", "r": "6:14"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ ಪಾಲಿಗೆ ಲೋಕವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ;”", "a": "ಶಿಲುಬೆಗೆ", "r": "6:14"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೂ ಸಹ ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ತಿದ್ದೇನೆ.”", "a": "ಜಡಿಸಿಕೊಂಡು", "r": "6:14"}, {"n": 202, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು …”", "a": "“… ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.”", "r": "6:14"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗಾದರೋ ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.”", "a": "ಶಿಲುಬೆಯನ್ನು; ಬೇರಾವುದರಲ್ಲೂ", "r": "6:14"}, {"n": 204, "q": "“ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ ಪಾಲಿಗೆ ಲೋಕವೇ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ;” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "6:14"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ, ನನ್ನ ಪಾಲಿಗೆ ಲೋಕವೇ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಶಿಲುಬೆಯ; ಸತ್ತಿದೆ", "r": "6:14"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಶಿಲುಬೆಯನ್ನು ಬಿಟ್ಟು ಬೇರಾವುದರಲ್ಲೂ ಹೆಚ್ಚಳಪಡುವುದು ಬೇಡವೇ ಬೇಡ.”", "a": "ನನಗಾದರೋ", "r": "6:14"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಶಿಲುಬೆಯ ಮೂಲಕ, ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕವೇ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದೆ;”", "a": "ಪಾಲಿಗೆ", "r": "6:14"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹ ಲೋಕದ ಪಾಲಿಗೆ ಶಿಲುಬೆಗೆ ಜಡಿಸಿಕೊಂಡು ಸತ್ತಿದ್ದೇನೆ.”", "a": "ನಾನೂ", "r": "6:14"}, {"n": 209, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:15ರ ಪ್ರಕಾರ ಯಾವುದು ಮಹತ್ತಾದುದಲ್ಲ?", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ, ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "6:15"}, {"n": 210, "q": "ಪೌಲನ ಪ್ರಕಾರ ಮಹತ್ತರವಾದುದು ಯಾವುದು?", "a": "ಹೊಸ ಸೃಷ್ಟಿಯಾಗುವುದು", "r": "6:15"}, {"n": 211, "q": "“ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ… ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ” ಎಂಬ ಹೋಲಿಕೆಯ ವಾಕ್ಯ ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಯಾವ ಎರಡು ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "5:6 ಮತ್ತು 6:15", "r": "5:6; 6:15"}, {"n": 212, "q": "ಸುನ್ನತಿಗಿಂತ ಮಹತ್ತರವಾದುದು ಯಾವುದು?", "a": "ಹೊಸ ಸೃಷ್ಟಿಯಾಗುವುದು", "r": "6:15"}, {"n": 213, "q": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದು ಮಹತ್ತಾದುದೇ?", "a": "ಅಲ್ಲ; ಮಾಡಿಸಿಕೊಳ್ಳುವುದೂ ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೂ ಮಹತ್ತಾದುದಲ್ಲ; ಹೊಸ ಸೃಷ್ಟಿಯಾಗುವುದೇ ಮಹತ್ತರವಾದುದು", "r": "6:15"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹತ್ತಾದುದಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ", "r": "6:15"}, {"n": 215, "q": "ಗಲಾತ್ಯರಿಗೆ 6:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ, ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮಹತ್ತಾದುದಲ್ಲ. ಹೊಸ ಸೃಷ್ಟಿಯಾಗುವುದೇ ಮಹತ್ತರವಾದುದು.", "r": "6:15"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮಾಡಿಸಿಕೊಳ್ಳದಿರುವುದೋ ಮಹತ್ತಾದುದಲ್ಲ.”", "a": "ಮಾಡಿಸಿಕೊಳ್ಳುವುದೋ", "r": "6:15"}, {"n": 217, "q": "ಪೌಲನು ನಿಜ ಇಸ್ರಯೇಲರು ಎಂದು ಯಾರನ್ನು ಕರೆಯುತ್ತಾನೆ?", "a": "ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ದೇವಜನರೆಲ್ಲರನ್ನು", "r": "6:16"}, {"n": 218, "q": "ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ ಏನೇನು ಲಭಿಸಲಿ ಎಂದು ಪೌಲನು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ", "r": "6:16"}, {"n": 219, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಆರಂಭದ ಹಾಗೂ ಕೊನೆಯ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಹಾರೈಸಲಾದ ಎರಡು ವರಗಳು ಯಾವುವು?", "a": "ಕೃಪಾಶೀರ್ವಾದ ಮತ್ತು ಶಾಂತಿಸಮಾಧಾನ (1:3; 6:16)", "r": "1:3; 6:16"}, {"n": 220, "q": "ನಿಜ ಇಸ್ರಯೇಲರು ಎಂದರೆ ಯಾರು ಎಂದು ಪೌಲನು ವಿವರಿಸುತ್ತಾನೆ?", "a": "ದೇವಜನರೆಲ್ಲರು", "r": "6:16"}, {"n": 221, "q": "ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಯಾರಿಗೆ ಲಭಿಸಲಿ ಎಂದು ಪೌಲನು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ", "r": "6:16"}, {"n": 222, "q": "ಪೌಲನು ‘ಈ ನಿಯಮ’ ಎಂದು ಹೇಳುವುದು ಯಾವುದನ್ನು ಕುರಿತು (6:15–16)?", "a": "ಹೊಸ ಸೃಷ್ಟಿಯಾಗುವುದೇ ಮಹತ್ತರವಾದುದು ಎಂಬ ನಿಯಮವನ್ನು", "r": "6:16"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!”", "a": "ದೇವಜನರೆಲ್ಲರಿಗೂ", "r": "6:16"}, {"n": 224, "q": "“ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "6:16"}, {"n": 225, "q": "ಗಲಾತ್ಯರಿಗೆ 6:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!", "r": "6:16"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲಭಿಸಲಿ!”", "a": "ಕೃಪಾಶೀರ್ವಾದವೂ", "r": "6:16"}, {"n": 227, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಈ ನಿಯಮವನ್ನು ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ …”", "a": "“… ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!”", "r": "6:16"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಸರಿಸುವ ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!”", "a": "ನಿಯಮವನ್ನು; ಇಸ್ರಯೇಲರಾದ", "r": "6:16"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ನಿಯಮವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಲ್ಲರಿಗೂ, ಅಂದರೆ ನಿಜ ಇಸ್ರಯೇಲರಾದ ದೇವಜನರೆಲ್ಲರಿಗೂ ಶಾಂತಿ ಸಮಾಧಾನವೂ ಕೃಪಾಶೀರ್ವಾದವೂ ಲಭಿಸಲಿ!”", "a": "ಅನುಸರಿಸುವ", "r": "6:16"}, {"n": 230, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 6:17ರಲ್ಲಿ ಪೌಲನ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಇನ್ನು ಮೇಲೆ ಯಾರೂ ನನಗೆ ತೊಂದರೆ ಕೊಡದಿರಲಿ.”", "r": "6:17"}, {"n": 231, "q": "ಪೌಲನ ದೇಹದಲ್ಲಿ ಏನು ಮುದ್ರಿತವಾಗಿವೆ?", "a": "ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು", "r": "6:17"}, {"n": 232, "q": "ಪೌಲನ ದೇಹದಲ್ಲಿರುವ ಕೆಂಗುರುತುಗಳು ಏನನ್ನು ಸೂಚಿಸುತ್ತವೆ?", "a": "ಅವನು ಯೇಸುವಿನ ದಾಸನೆಂದು", "r": "6:17"}, {"n": 233, "q": "ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ಎಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ?", "a": "ಪೌಲನ ದೇಹದಲ್ಲಿ", "r": "6:17"}, {"n": 234, "q": "ಇನ್ನು ಮೇಲೆ ಯಾರೂ ತನಗೆ ಏನು ಮಾಡದಿರಲಿ ಎಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "ತೊಂದರೆ ಕೊಡದಿರಲಿ", "r": "6:17"}, {"n": 235, "q": "ಇನ್ನು ಯಾರೂ ತನಗೆ ತೊಂದರೆ ಕೊಡಬಾರದೆಂದು ಹೇಳಲು ಪೌಲನು ಕೊಡುವ ಕಾರಣವೇನು?", "a": "ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ಅವನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿರುವುದರಿಂದ", "r": "6:17"}, {"n": 236, "q": "ಪೌಲನು ತನ್ನನ್ನು ಯಾರ ದಾಸನೆಂದು ಹೇಳುತ್ತಾನೆ (6:17)?", "a": "ಯೇಸುವಿನ ದಾಸ", "r": "6:17"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮೇಲೆ ಯಾರೂ ನನಗೆ ತೊಂದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಡದಿರಲಿ", "r": "6:17"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ನನ್ನ ದೇಹದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮುದ್ರಿತವಾಗಿವೆ", "r": "6:17"}, {"n": 239, "q": "“ಇನ್ನು ಮೇಲೆ ಯಾರೂ ನನಗೆ ತೊಂದರೆ ಕೊಡದಿರಲಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "6:17"}, {"n": 240, "q": "ಗಲಾತ್ಯರಿಗೆ 6:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇನ್ನು ಮೇಲೆ ಯಾರೂ ನನಗೆ ತೊಂದರೆ ಕೊಡದಿರಲಿ. ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ನನ್ನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ.", "r": "6:17"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮೇಲೆ ಯಾರೂ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡದಿರಲಿ.”", "a": "ತೊಂದರೆ", "r": "6:17"}, {"n": 242, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ.”", "a": "ಕೆಂಗುರುತುಗಳು", "r": "6:17"}, {"n": 243, "q": "“ಯೇಸುವಿನ ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ನನ್ನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "6:17"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾಸನೆಂದು ಸೂಚಿಸುವ ಕೆಂಗುರುತುಗಳು ನನ್ನ ದೇಹದಲ್ಲಿ ಮುದ್ರಿತವಾಗಿವೆ.”", "a": "ಯೇಸುವಿನ", "r": "6:17"}, {"n": 245, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಕೊನೆಯ ಆಶೀರ್ವಾದ ಯಾವುದು?", "a": "“ಸಹೋದರರೇ, ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ ನಿಮ್ಮೊಡನೆ ಇರಲಿ! ಆಮೆನ್.”", "r": "6:18"}, {"n": 246, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರ ಯಾವ ಪದದಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಆಮೆನ್", "r": "6:18"}, {"n": 247, "q": "ಪೌಲನ ಕೊನೆಯ ಆಶೀರ್ವಾದದಲ್ಲಿ ಗಲಾತ್ಯರೊಡನೆ ಏನು ಇರಲಿ ಎಂದು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ", "r": "6:18"}, {"n": 248, "q": "ಗಲಾತ್ಯರೊಡನೆ ಯಾರ ಅನುಗ್ರಹ ಇರಲಿ ಎಂದು ಪೌಲನು ಹಾರೈಸುತ್ತಾನೆ?", "a": "ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ", "r": "6:18"}, {"n": 249, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ “ಆಮೆನ್” ಎಂಬ ಪದ ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "1:5 ಮತ್ತು 6:18", "r": "1:5; 6:18"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಮ್ಮ ಪ್ರಭು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹ ನಿಮ್ಮೊಡನೆ ಇರಲಿ!”", "a": "ಯೇಸುಕ್ರಿಸ್ತರ", "r": "6:18"}, {"n": 251, "q": "“ಸಹೋದರರೇ, ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ ನಿಮ್ಮೊಡನೆ ಇರಲಿ!” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "6:18"}, {"n": 252, "q": "ಗಲಾತ್ಯರಿಗೆ 6:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸಹೋದರರೇ, ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ ನಿಮ್ಮೊಡನೆ ಇರಲಿ! ಆಮೆನ್.", "r": "6:18"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಮ್ಮ ಪ್ರಭು ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರಲಿ!”", "a": "ನಿಮ್ಮೊಡನೆ", "r": "6:18"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಹೋದರರೇ, ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಕ್ರಿಸ್ತರ ಅನುಗ್ರಹ ನಿಮ್ಮೊಡನೆ ಇರಲಿ!”", "a": "ಪ್ರಭು", "r": "6:18"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
