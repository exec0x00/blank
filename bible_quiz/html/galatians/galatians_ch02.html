ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "a": "ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ", "r": "2:2"}, {"n": 22, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು …”", "a": "“… ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.”", "r": "2:2"}, {"n": 23, "q": "“ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 24, "q": "ಗಲಾತ್ಯರಿಗೆ 2:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವಪ್ರೇರಣೆಗೆ ಅನುಸಾರವಾಗಿಯೇ ಅಲ್ಲಿಗೆ ಹೋದೆ. ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ. ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.", "r": "2:2"}, {"n": 25, "q": "“ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 26, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ …”", "a": "“… ಪಡುತ್ತಿರುವ ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "r": "2:2"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನ್ಯಧರ್ಮೀಯರಿಗೆ ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರತ್ಯೇಕವಾಗಿ ತಿಳಿಸಿದೆ.”", "a": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ", "r": "2:2"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದುವರೆಗೆ ನಾನು ಪಟ್ಟ ಶ್ರಮವಾಗಲಿ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶ್ರಮವಾಗಲಿ ವ್ಯರ್ಥವಾಗಬಾರದೆಂಬ ಉದ್ದೇಶದಿಂದ ಹೀಗೆ ಮಾಡಿದೆ.”", "a": "ಪಡುತ್ತಿರುವ", "r": "2:2"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಸಾರುತ್ತಿದ್ದ ಸಂದೇಶ ಏನೆಂಬುದನ್ನು ಅಲ್ಲಿದ್ದ ಕೆಲವು ಗಣ್ಯವ್ಯಕ್ತಿಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸಿದೆ.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಗೆ; ಪ್ರತ್ಯೇಕವಾಗಿ", "r": "2:2"}, {"n": 30, "q": "ಪೌಲನ ಸಂಗಡವಿದ್ದ ಗ್ರೀಕನು ಯಾರು?", "a": "ತೀತನು", "r": "2:3"}, {"n": 31, "q": "ತೀತನು ಯಾವ ಜನಾಂಗದವನಾಗಿದ್ದನು?", "a": "ಗ್ರೀಕನು", "r": "2:3"}, {"n": 32, "q": "ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಯಾರೂ ಅವನಿಗೆ ಏನಾಗಬೇಕೆಂದು ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ?", "a": "ಸುನ್ನತಿ", "r": "2:3"}, {"n": 33, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಸುನ್ನತಿ’ ಎಂಬ ಪದ ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:3 (ತೀತನಿಗೆ ಸುನ್ನತಿ); 2:12 (ಸುನ್ನತಿ ಪರವಾದಿಗಳು)", "r": "2:3; 2:12"}, {"n": 34, "q": "“ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು” — ಇಲ್ಲಿ ‘ನನ್ನ’ ಎಂಬುದು ಯಾರನ್ನು ಕುರಿತದ್ದು?", "a": "ಪೌಲನನ್ನು", "r": "2:3"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ತೀತನು", "r": "2:3"}, {"n": 36, "q": "“ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 37, "q": "ಗಲಾತ್ಯರಿಗೆ 2:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.", "r": "2:3"}, {"n": 38, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ …”", "a": "“… ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "r": "2:3"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ", "r": "2:3"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಸುನ್ನತಿ ಆಗಬೇಕೆಂದು ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ಸಂಗಡವಿದ್ದ; ಗ್ರೀಕನಾಗಿದ್ದರೂ", "r": "2:3"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನನ್ನ ಸಂಗಡವಿದ್ದ ತೀತನು ಗ್ರೀಕನಾಗಿದ್ದರೂ ಅವನಿಗೆ ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ಒತ್ತಾಯಪಡಿಸಲಿಲ್ಲ.”", "a": "ಆಗಬೇಕೆಂದು", "r": "2:3"}, {"n": 42, "q": "ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಸುನ್ನತಿಯ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆಗೆ ಕಾರಣರಾದವರು ಯಾರು?", "a": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು", "r": "2:4"}, {"n": 43, "q": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಸಹೋದರರು ಯಾವುದರ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ", "r": "2:4"}, {"n": 44, "q": "ಗೂಢಾಚಾರರ ಉದ್ದೇಶ ಏನಾಗಿತ್ತು?", "a": "ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದು", "r": "2:4"}, {"n": 45, "q": "ಗೂಢಾಚಾರರು ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಹೇಗೆ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು?", "a": "ಗುಟ್ಟಾಗಿ", "r": "2:4"}, {"n": 46, "q": "ಗೂಢಾಚಾರರು ಪೌಲನ ಸಂಗಡಿಗರನ್ನು ಯಾವುದರಲ್ಲಿ ಸಿಕ್ಕಿಸಲು ಬಯಸಿದರು, ಪೌಲನು ಯಾವುದನ್ನು ಕಾಪಾಡಿದನು?", "a": "ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಲು; ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದನು", "r": "2:4; 2:5"}, {"n": 47, "q": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದವರನ್ನು ಪೌಲನು ಏನೆಂದು ಕರೆಯುತ್ತಾನೆ?", "a": "ಕೆಲವು ಸಹೋದರರು", "r": "2:4"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "a": "ಅಲ್ಲಿದ್ದುದರಿಂದ", "r": "2:4"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:4"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.”", "a": "ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ", "r": "2:4"}, {"n": 51, "q": "“ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 52, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ …”", "a": "“… ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.”", "r": "2:4"}, {"n": 53, "q": "“ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 54, "q": "ಗಲಾತ್ಯರಿಗೆ 2:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು. ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು. ನಮ್ಮನ್ನು ಪುನಃ ದಾಸತ್ವದಲ್ಲಿ ಸಿಕ್ಕಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.", "r": "2:4"}, {"n": 55, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಗೂಢಾಚಾರರಾಗಿ ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು …”", "a": "“… ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "r": "2:4"}, {"n": 56, "q": "“ಇವರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ನಮಗಿರುವ ಮುಕ್ತಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗುಟ್ಟಾಗಿ ವಿಚಾರಿಸಲು ಬಂದಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಿದ್ದ ಕೆಲವು ಸಹೋದರರು ಅಲ್ಲಿದ್ದುದರಿಂದ ಒತ್ತಾಯ ನಡೆದೀತೆಂಬ ಶಂಕೆ ಇತ್ತು.”", "a": "ಗೂಢಾಚಾರರಾಗಿ", "r": "2:4"}, {"n": 58, "q": "ಪೌಲನು ಮತ್ತು ಸಂಗಡಿಗರು ಗೂಢಾಚಾರರಿಗೆ ಎಷ್ಟು ಹೊತ್ತು ಬಿಟ್ಟುಕೊಟ್ಟರು?", "a": "ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ", "r": "2:5"}, {"n": 59, "q": "ಗೂಢಾಚಾರರಿಗೆ ಬಿಟ್ಟುಕೊಡದೆ ಪೌಲನು ಗಲಾತ್ಯರಿಗೋಸ್ಕರ ಏನನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದನು?", "a": "ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು", "r": "2:5"}, {"n": 60, "q": "ಶುಭಸಂದೇಶದ ‘ಸತ್ಯಾರ್ಥ’ ಮತ್ತು ‘ಸತ್ಯ’ ಎಂಬ ಪದಗಳು ಬರುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:5 (ಸತ್ಯಾರ್ಥ) ಮತ್ತು 2:14 (ಸತ್ಯ)", "r": "2:5; 2:14"}, {"n": 61, "q": "ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಯಾರಿಗೋಸ್ಕರ ಸುಭದ್ರವಾಗಿ ಇರಿಸಲಾಯಿತು?", "a": "ಗಲಾತ್ಯರಿಗೋಸ್ಕರ (“ನಿಮಗೋಸ್ಕರ”)", "r": "2:5"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ", "r": "2:5"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.”", "a": "ಸತ್ಯಾರ್ಥವನ್ನು", "r": "2:5"}, {"n": 64, "q": "“ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 65, "q": "ಗಲಾತ್ಯರಿಗೆ 2:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ನಾವು ಅವರಿಗೆ ಕ್ಷಣಮಾತ್ರವೂ ಬಿಟ್ಟುಕೊಡಲಿಲ್ಲ. ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.", "r": "2:5"}, {"n": 66, "q": "“ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ ಇರಿಸಿದೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರಿಸಿದೆವು.”", "a": "ಸುಭದ್ರವಾಗಿ", "r": "2:5"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ನಿಮಗೋಸ್ಕರ ಶುಭಸಂದೇಶದ ಸತ್ಯಾರ್ಥವನ್ನು ಸುಭದ್ರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರಿಸಿದೆವು", "r": "2:5"}, {"n": 69, "q": "ಜೆರುಸಲೇಮಿನ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಪೌಲನಿಗೆ ಏನು ನೀಡಲಿಲ್ಲ?", "a": "ಯಾವ ಹೊಸ ಸಲಹೆಯನ್ನೂ", "r": "2:6"}, {"n": 70, "q": "ದೇವರ ನಿಷ್ಪಕ್ಷಪಾತದ ಬಗ್ಗೆ ಪೌಲನು ಆವರಣದಲ್ಲಿ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ದೇವರು ಮುಖನೋಡಿ ಮಣೆ ಹಾಕುವವರಲ್ಲ”", "r": "2:6"}, {"n": 71, "q": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳ ಬಗ್ಗೆ ಪೌಲನಿಗೆ ಯಾವುದು ಮುಖ್ಯವಲ್ಲ?", "a": "ಅವರು ಹಿಂದೆ ಎಂಥವರಾಗಿದ್ದರು ಎಂಬುದು", "r": "2:6"}, {"n": 72, "q": "ಪೌಲನಿಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡದವರು ಯಾರು?", "a": "ಅಲ್ಲಿದ್ದ (ಜೆರುಸಲೇಮಿನ) ಗಣ್ಯವ್ಯಕ್ತಿಗಳು", "r": "2:6"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಗಣ್ಯವ್ಯಕ್ತಿಗಳು", "r": "2:6"}, {"n": 74, "q": "“ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 75, "q": "ಗಲಾತ್ಯರಿಗೆ 2:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ (ಅವರು ಹಿಂದೆ ಎಂಥವರಾಗಿದ್ದರು ಎಂಬುದು ನನಗೆ ಮುಖ್ಯವಲ್ಲ; ದೇವರು ಮುಖನೋಡಿ ಮಣೆ ಹಾಕುವವರಲ್ಲ) ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.", "r": "2:6"}, {"n": 76, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … …”", "a": "“… ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "r": "2:6"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಅಲ್ಲಿದ್ದ", "r": "2:6"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ ಯಾವ ಹೊಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಲಹೆ; ನೀಡಲಿಲ್ಲ", "r": "2:6"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಕೂಡ … ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಸ ಸಲಹೆ ನೀಡಲಿಲ್ಲ.”", "a": "ಯಾವ", "r": "2:6"}, {"n": 80, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ದೇವರು ಯಾರಿಗೆ ವಹಿಸಿಕೊಟ್ಟರು?", "a": "ಪೇತ್ರನಿಗೆ", "r": "2:7"}, {"n": 81, "q": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯ ಯಾರಿಗೆ ವಹಿಸಲ್ಪಟ್ಟಿತು?", "a": "ಪೌಲನಿಗೆ", "r": "2:7"}, {"n": 82, "q": "ಜೆರುಸಲೇಮಿನ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಪೌಲನ ಬಗ್ಗೆ ಏನನ್ನು ಒಪ್ಪಿಕೊಂಡರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ಅವನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು", "r": "2:7"}, {"n": 83, "q": "ಪೌಲನು ತನ್ನ ಸೇವೆಯನ್ನು ಯಾರ ಸೇವೆಗೆ ಹೋಲಿಸುತ್ತಾನೆ?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶ ಸಾರುವ ಪೇತ್ರನ ಸೇವೆಗೆ", "r": "2:7"}, {"n": 84, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಪೇತ್ರನನ್ನು ಯಾವ ಎರಡು ಹೆಸರುಗಳಿಂದ ಕರೆಯಲಾಗಿದೆ?", "a": "ಪೇತ್ರ (2:7–8) ಮತ್ತು ಕೇಫ (2:9, 11, 14)", "r": "2:7–9; 2:11"}, {"n": 85, "q": "ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟ ಸೇವೆ ಯಾವುದು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆ", "r": "2:7"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಪೇತ್ರನಿಗೆ", "r": "2:7"}, {"n": 87, "q": "“ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 88, "q": "ಗಲಾತ್ಯರಿಗೆ 2:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.", "r": "2:7"}, {"n": 89, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು …”", "a": "“… ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "r": "2:7"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:7"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವಾಕಾರ್ಯವನ್ನು ದೇವರು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ; ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ", "r": "2:7"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬದಲಾಗಿ, ಯೆಹೂದ್ಯರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ ಸೇವೆಯನ್ನು ಪೇತ್ರನಿಗೆ ವಹಿಸಿಕೊಟ್ಟಂತೆಯೇ ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಶುಭಸಂದೇಶವನ್ನು ಸಾರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನನಗೆ ವಹಿಸಿಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಆ ಗಣ್ಯವ್ಯಕ್ತಿಗಳು ಒಪ್ಪಿಕೊಂಡರು.”", "a": "ಸೇವಾಕಾರ್ಯವನ್ನು", "r": "2:7"}, {"n": 93, "q": "ದೇವರು ಪೇತ್ರನನ್ನು ಯಾರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪ್ರೇರೇಪಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ", "r": "2:8"}, {"n": 94, "q": "ದೇವರು ಪೌಲನನ್ನು ಯಾರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ಪ್ರೇರೇಪಿಸಿದರು?", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:8"}, {"n": 95, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದವರು ಯಾರು?", "a": "ದೇವರು", "r": "2:8"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಪೇತ್ರನನ್ನು", "r": "2:8"}, {"n": 97, "q": "“ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "2:8"}, {"n": 98, "q": "ಗಲಾತ್ಯರಿಗೆ 2:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.", "r": "2:8"}, {"n": 99, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ …”", "a": "“… ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "r": "2:8"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ", "r": "2:8"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ ಪ್ರೇಷಿತನಾಗಲು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರೇಷಿತನಾಗುವಂತೆ; ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ", "r": "2:8"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಯೆಹೂದ್ಯರಿಗೆ ಪ್ರೇಷಿತನಾಗುವಂತೆ ಪೇತ್ರನನ್ನು ಪ್ರೇರೇಪಿಸಿದ ದೇವರು, ಯೆಹೂದ್ಯರಲ್ಲದವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನನ್ನು ಪ್ರೇರೇಪಿಸಿದ್ದಾರೆ.”", "a": "ಪ್ರೇಷಿತನಾಗಲು", "r": "2:8"}, {"n": 103, "q": "ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದವರು ಯಾರು?", "a": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು", "r": "2:9"}, {"n": 104, "q": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ಏನೆಂದು ಪರಿಗಣಿತರಾಗಿದ್ದರು?", "a": "ಸಭಾಸ್ತಂಭಗಳೆಂದು", "r": "2:9"}, {"n": 105, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಿಗೂ ಬಾರ್ನಬನಿಗೂ ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಹೇಗೆ ಸೂಚಿಸಿದರು?", "a": "ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು", "r": "2:9"}, {"n": 106, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಲ್ಲಿ ಏನನ್ನು ಮನಗಂಡರು?", "a": "ಅವನಿಗೆ ಕೊಡಲಾಗಿದ್ದ ವಿಶೇಷ ವರವನ್ನು", "r": "2:9"}, {"n": 107, "q": "ಸೇವೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳುವ ಬಗ್ಗೆ ಸಭಾಸ್ತಂಭಗಳು ಪೌಲ ಬಾರ್ನಬರಿಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ”", "r": "2:9"}, {"n": 108, "q": "ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ಯಾರಿಬ್ಬರಿಗೆ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು?", "a": "ಪೌಲನಿಗೂ ಬಾರ್ನಬನಿಗೂ", "r": "2:9"}, {"n": 109, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯಕೋಬನನ್ನು ಉಲ್ಲೇಖಿಸುವ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "2:9 (ಸಭಾಸ್ತಂಭಗಳಲ್ಲಿ ಒಬ್ಬ); 2:12 (ಯಕೋಬನ ಕಡೆಯಿಂದ ಬಂದ ಸಹೋದರರು)", "r": "2:9; 2:12"}, {"n": 110, "q": "ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಮೂವರು (ಯಕೋಬ, ಕೇಫ, ಯೊವಾನ್ನ)", "r": "2:9"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "a": "ಬಾರ್ನಬನಿಗೂ", "r": "2:9"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲದವರ", "r": "2:9"}, {"n": 113, "q": "“ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, …”", "a": "“… ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.”", "r": "2:9"}, {"n": 115, "q": "ಗಲಾತ್ಯರಿಗೆ 2:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು. ಅಲ್ಲದೆ, “ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,” ಎಂದೂ ಹೇಳಿದರು.", "r": "2:9"}, {"n": 116, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, …”", "a": "“… ಕೇಫ ಮತ್ತು ಯೊವಾನ್ನರು ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "r": "2:9"}, {"n": 117, "q": "“ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗುತ್ತೇವೆ,’ ಎಂದೂ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಕೊಡಲಾಗಿದ್ದ ಈ ವಿಶೇಷ ವರವನ್ನು ಮನಗಂಡು ಸಭಾಸ್ತಂಭಗಳೆಂದು ಪರಿಗಣಿತರಾದ ಯಕೋಬ, ಕೇಫ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೂ ಬಾರ್ನಬನಿಗೂ ಕೈಯಲ್ಲಿ ಕೈಯನ್ನಿಟ್ಟು ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಸೂಚಿಸಿದರು.”", "a": "ಯೊವಾನ್ನರು", "r": "2:9"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ‘ನೀವು ಯೆಹೂದ್ಯರಲ್ಲದವರ ಬಳಿಗೆ ಹೋಗಿರಿ, ನಾವು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದೂ ಹೇಳಿದರು.”", "a": "ಹೋಗುತ್ತೇವೆ", "r": "2:9"}, {"n": 120, "q": "ಸಭಾಸ್ತಂಭಗಳು ಪೌಲನಿಂದ ಕೇಳಿಕೊಂಡ ಒಂದೇ ವಿಷಯ ಯಾವುದು?", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬುದು", "r": "2:10"}, {"n": 121, "q": "ಬಡಬಗ್ಗರಿಗೆ ನೆರವಾಗುವ ವಿಷಯದಲ್ಲಿ ಪೌಲನು ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು", "r": "2:10"}, {"n": 122, "q": "ಪೌಲನು ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂದು ಸಭಾಸ್ತಂಭಗಳು ಕೇಳಿಕೊಂಡದ್ದು ಯಾರಿಗೆ?", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ", "r": "2:10"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ನೆರವಾಗಬೇಕೆಂಬ", "r": "2:10"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.”", "a": "ಮಾಡಬೇಕೆಂದು", "r": "2:10"}, {"n": 125, "q": "“ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 126, "q": "ಗಲಾತ್ಯರಿಗೆ 2:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು. ನಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.", "r": "2:10"}, {"n": 127, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ …”", "a": "“… ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "r": "2:10"}, {"n": 128, "q": "“ನಾನು ಮಾಡಬೇಕೆಂದು ಎಣಿಸಿದುದು ಅದೇ ಆಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು ವಿಷಯವನ್ನು ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ಅವರಲ್ಲಿದ್ದ", "r": "2:10"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಲ್ಲಿದ್ದ ಬಡಬಗ್ಗರಿಗೆ ಮರೆಯದೆ ನೆರವಾಗಬೇಕೆಂಬ ಒಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರ ಕೇಳಿಕೊಂಡರು.”", "a": "ವಿಷಯವನ್ನು", "r": "2:10"}, {"n": 131, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:11ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೇತ್ರ ಪೌಲರ ವಾಗ್ವಾದ", "r": "2:11"}, {"n": 132, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಎಲ್ಲಿ ಖಂಡಿಸಿದನು?", "a": "ಅಂತಿಯೋಕ್ಯದಲ್ಲಿ (ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ)", "r": "2:11"}, {"n": 133, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಹೇಗೆ ಖಂಡಿಸಿದನು?", "a": "ಮುಖಾಮುಖಿಯಾಗಿ", "r": "2:11"}, {"n": 134, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಏಕೆ ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದನು?", "a": "ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ", "r": "2:11"}, {"n": 135, "q": "ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಅವನ ಬಗ್ಗೆ ಏನು ಸಿದ್ಧವಾಗಿತ್ತು?", "a": "ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು", "r": "2:11"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಅಂತಿಯೋಕ್ಯಕ್ಕೆ", "r": "2:11"}, {"n": 137, "q": "“ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 138, "q": "ಗಲಾತ್ಯರಿಗೆ 2:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.", "r": "2:11"}, {"n": 139, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು …”", "a": "“… ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "r": "2:11"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ", "r": "2:11"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದೆ.”", "a": "ಕೇಫನು; ತಪ್ಪಿತಸ್ಥನೆಂಬುದು", "r": "2:11"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರೆ ಕೇಫನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಬಂದಾಗ ಆತನು ತಪ್ಪಿತಸ್ಥನೆಂಬುದು ಸಿದ್ಧವಾಗಿದ್ದುದರಿಂದ ನಾನು ಆತನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಖಂಡಿಸಿದೆ.”", "a": "ಮುಖಾಮುಖಿಯಾಗಿ", "r": "2:11"}, {"n": 143, "q": "ಕೇಫನು ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದದ್ದು ಯಾರ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬಂದ ಮೇಲೆ?", "a": "ಯಕೋಬನ ಕಡೆಯಿಂದ", "r": "2:12"}, {"n": 144, "q": "ಯಕೋಬನ ಕಡೆಯ ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಕೇಫನು ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು", "r": "2:12"}, {"n": 145, "q": "ಕೇಫನು ಅನ್ಯಧರ್ಮೀಯರಿಂದ ಏಕೆ ದೂರವಾದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ", "r": "2:12"}, {"n": 146, "q": "ಕೇಫನು ಯಾರಿಗೆ ಅಂಜಿದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ", "r": "2:12"}, {"n": 147, "q": "ಯಕೋಬನ ಕಡೆಯ ಸಹೋದರರು ಬಂದ ಮೇಲೆ ಕೇಫನು ಏನು ಮಾಡಿದನು?", "a": "ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು", "r": "2:12"}, {"n": 148, "q": "ಕೇಫನು ಯಾರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದು ಆಮೇಲೆ ಅವರಿಂದ ದೂರವಾದನು?", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ", "r": "2:12"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "a": "ಯಕೋಬನ", "r": "2:12"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೂರವಾದನು.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಿಂದ", "r": "2:12"}, {"n": 151, "q": "“ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 152, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ …”", "a": "“… ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.”", "r": "2:12"}, {"n": 153, "q": "ಗಲಾತ್ಯರಿಗೆ 2:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು. ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.", "r": "2:12"}, {"n": 154, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ …”", "a": "“… ಮುಂಚೆ ಆತನು ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "r": "2:12"}, {"n": 155, "q": "“ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ ಪರವಾದಿಗಳಿಗೆ ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಕೋಬನ ಕಡೆಯಿಂದ ಕೆಲವು ಸಹೋದರರು ಬರುವುದಕ್ಕೆ ಮುಂಚೆ ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊಟ ಮಾಡುತ್ತಿದ್ದನು.”", "a": "ಅನ್ಯಧರ್ಮೀಯರೊಡನೆ", "r": "2:12"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರು ಬಂದ ಮೇಲೆ ಸುನ್ನತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂಜಿ ಅನ್ಯಧರ್ಮೀಯರಿಂದ ದೂರವಾದನು.”", "a": "ಪರವಾದಿಗಳಿಗೆ", "r": "2:12"}, {"n": 158, "q": "ಕೇಫನ ಸಂಗಡ ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದವರು ಯಾರು?", "a": "ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು", "r": "2:13"}, {"n": 159, "q": "ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದ ಯೆಹೂದ್ಯರ ವರ್ತನೆಗೆ ಮಾರುಹೋದವನು ಯಾರು?", "a": "ಬಾರ್ನಬ", "r": "2:13"}, {"n": 160, "q": "ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಹೇಗೆ ವರ್ತಿಸಿದರು?", "a": "ಕಪಟತನದಿಂದ", "r": "2:13"}, {"n": 161, "q": "ಬಾರ್ನಬನು ಯಾರ ವರ್ತನೆಗೆ ಮಾರುಹೋದನು?", "a": "ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರ ವರ್ತನೆಗೆ", "r": "2:13"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "a": "ಕೇಫನ", "r": "2:13"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರ ವರ್ತನೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹ ಮಾರುಹೋದನು.”", "a": "ಬಾರ್ನಬನೂ", "r": "2:13"}, {"n": 164, "q": "“ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 165, "q": "ಗಲಾತ್ಯರಿಗೆ 2:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು. ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ ಮಾರುಹೋದನು.", "r": "2:13"}, {"n": 166, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ …”", "a": "“… ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "r": "2:13"}, {"n": 167, "q": "“ಇವರ ವರ್ತನೆಗೆ ಬಾರ್ನಬನೂ ಸಹ ಮಾರುಹೋದನು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ ಮಿಕ್ಕ ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವರ್ತಿಸಿದರು", "r": "2:13"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ, ಕೇಫನ ಸಂಗಡ ಇದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರು ಕಪಟತನದಿಂದ ವರ್ತಿಸಿದರು.”", "a": "ಮಿಕ್ಕ", "r": "2:13"}, {"n": 170, "q": "ಕೇಫನ ಮತ್ತು ಇತರರ ನಡತೆ ಯಾವುದಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಪೌಲನಿಗೆ ಮನದಟ್ಟಾಯಿತು?", "a": "ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ", "r": "2:14"}, {"n": 171, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಯಾರ ಸಮ್ಮುಖದಲ್ಲಿ ಪ್ರಶ್ನಿಸಿದನು?", "a": "ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ", "r": "2:14"}, {"n": 172, "q": "ಪೌಲನು ಕೇಫನ ನಡತೆಯ ಬಗ್ಗೆ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "r": "2:14"}, {"n": 173, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಅನ್ಯಧರ್ಮೀಯರ ಬಗ್ಗೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದನು?", "a": "“ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?”", "r": "2:14"}, {"n": 174, "q": "“ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ…” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಕೇಳಿದರು?", "a": "ಪೌಲನು ಕೇಫನಿಗೆ", "r": "2:14"}, {"n": 175, "q": "ಪೌಲನು ಕೇಫನಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಿದ್ದು ಯಾವಾಗ?", "a": "ಅವರ ನಡತೆ ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ಮನದಟ್ಟಾದಾಗ", "r": "2:14"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.”", "a": "ಅನುಗುಣವಾದುದಲ್ಲ", "r": "2:14"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?”", "a": "ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ", "r": "2:14"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.”", "a": "ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ", "r": "2:14"}, {"n": 179, "q": "“ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 180, "q": "“ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 181, "q": "ಗಲಾತ್ಯರಿಗೆ 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು. ಆಗ ನಾನು ಅವರೆಲ್ಲರ ಸಮ್ಮುಖದಲ್ಲೇ ಕೇಫನಿಗೆ: “ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ? ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?” ಎಂದು ಕೇಳಿದೆ.", "r": "2:14"}, {"n": 182, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರ ಈ ನಡತೆ, ಶುಭಸಂದೇಶದ …”", "a": "“… ಸತ್ಯಕ್ಕೆ ಅನುಗುಣವಾದುದಲ್ಲ ಎಂದು ನನಗೆ ಮನದಟ್ಟಾಯಿತು.”", "r": "2:14"}, {"n": 183, "q": "“‘ನೀನು ಯೆಹೂದ್ಯನಾಗಿದ್ದೂ ಯೆಹೂದ್ಯರಂತೆ ನಡೆಯದೆ ಅನ್ಯಧರ್ಮೀಯರಂತೆ ನಡೆದುಕೊಳ್ಳುತ್ತ ಇದ್ದೀಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 184, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ ಅನ್ಯಧರ್ಮೀಯರು ಯೆಹೂದ್ಯರಂತೆ ನಡೆದುಕೊಳ್ಳಬೇಕೆಂದು …”", "a": "“… ನೀನು ಒತ್ತಾಯಪಡಿಸುವುದಾದರೂ ಹೇಗೆ?’ ಎಂದು ಕೇಳಿದೆ.”", "r": "2:14"}, {"n": 185, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:15ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವೇ ಜೀವೋದ್ಧಾರದ ಮಾರ್ಗ", "r": "2:15"}, {"n": 186, "q": "ಪೌಲನು ತಾನೂ ಕೇಫನೂ ಹುಟ್ಟಿನಿಂದ ಏನೆಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಹುಟ್ಟು ಯೆಹೂದ್ಯರು", "r": "2:15"}, {"n": 187, "q": "‘ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ’ ಜನರು ಯಾರು ಎಂದು ಪೌಲನು ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಅನ್ಯಧರ್ಮೀಯರು", "r": "2:15"}, {"n": 188, "q": "ಪೌಲನು ಹುಟ್ಟು ಯೆಹೂದ್ಯರನ್ನು ಯಾರಿಂದ ಬೇರ್ಪಡಿಸಿ ಹೇಳುತ್ತಾನೆ?", "a": "ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಿಂದ", "r": "2:15"}, {"n": 189, "q": "ಗಲಾತ್ಯರಿಗೆ 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾವಂತೂ ಹುಟ್ಟು ಯೆಹೂದ್ಯರು; ಪಾಪಿಗಳೆಂದು ಕರೆಯಲಾಗುವ ಅನ್ಯಧರ್ಮೀಯರಲ್ಲ.", "r": "2:15"}, {"n": 190, "q": "ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಹೇಗೆ ಪಡೆಯುತ್ತಾನೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ", "r": "2:16"}, {"n": 191, "q": "ಮಾನವನು ಯಾವುದರಿಂದ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವುದಿಲ್ಲ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದ", "r": "2:16"}, {"n": 192, "q": "ಪೌಲನು ಮತ್ತು ಇತರರು ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟದ್ದು ಏಕೆ?", "a": "ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ", "r": "2:16"}, {"n": 193, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:16ರಲ್ಲಿ “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು” ಎಂಬ ಪದಗುಚ್ಛ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ", "r": "2:16"}, {"n": 194, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧ ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ದೊರಕುವುದಾದರೆ ಏನಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕ", "r": "2:16; 2:21"}, {"n": 195, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ…” — ಈ ವಾಕ್ಯವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "r": "2:16"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ", "r": "2:16"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.”", "a": "ಅನುಸರಿಸುವುದರಿಂದಲೆ", "r": "2:16"}, {"n": 199, "q": "“ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 200, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ …”", "a": "“… ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.”", "r": "2:16"}, {"n": 201, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 202, "q": "ಗಲಾತ್ಯರಿಗೆ 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು. ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ. ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲೆ ಯಾರೂ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧಿಕರಾಗಿ ಕಂಡು ಬರುವುದಿಲ್ಲ.", "r": "2:16"}, {"n": 203, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಅನುಸರಿಸುವುದರಿಂದಲ್ಲ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವುದರಿಂದ …”", "a": "“… ಮಾತ್ರ ಮಾನವನು ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುತ್ತಾನೆಂದು ಬಲ್ಲೆವು.”", "r": "2:16"}, {"n": 204, "q": "“ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯುವ ಸಲುವಾಗಿ ನಾವೂ ಧರ್ಮಶಾಸ್ತ್ರದ ವಿಧಿನಿಯಮಗಳನ್ನು ಬಿಟ್ಟು, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟಿದ್ದೇವೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 205, "q": "ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುವವರು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡುಬಂದರೆ ಏನು ಹೇಳಿದಂತಾಗುತ್ತದೆ?", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 206, "q": "ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುವ ವಾದಕ್ಕೆ ಪೌಲನ ಉತ್ತರವೇನು?", "a": "“ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.”", "r": "2:17"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ", "r": "2:17"}, {"n": 208, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 209, "q": "ಗಲಾತ್ಯರಿಗೆ 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ. ಆದರೆ ಅದೆಂದಿಗೂ ಆಗದು.", "r": "2:17"}, {"n": 210, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು …”", "a": "“… ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "r": "2:17"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಕ್ರಿಸ್ತಯೇಸುವೇ", "r": "2:17"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಅನ್ಯಧರ್ಮೀಯರಂತೆ ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯತ್ನಿಸುತ್ತಿರುವ; ಹೇಳಿದಂತಾಗುತ್ತದೆ", "r": "2:17"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕ್ರಿಸ್ತಯೇಸುವಿನ ಮುಖಾಂತರ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವನ್ನು ಪಡೆಯಲು ಯತ್ನಿಸುತ್ತಿರುವ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಬರುವುದಾದರೆ, ಕ್ರಿಸ್ತಯೇಸುವೇ ಪಾಪಕ್ಕೆ ಕಾರಣರೆಂದು ಹೇಳಿದಂತಾಗುತ್ತದೆ.”", "a": "ಅನ್ಯಧರ್ಮೀಯರಂತೆ", "r": "2:17"}, {"n": 214, "q": "ಪೌಲನು ತಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ಏನಾಗುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 215, "q": "ಪೌಲನ ಪ್ರಕಾರ ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟುವುದು ಯಾವ ಪರಿಣಾಮ ಉಂಟುಮಾಡುತ್ತದೆ?", "a": "ತನ್ನನ್ನು ತಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುತ್ತದೆ", "r": "2:18"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ", "r": "2:18"}, {"n": 217, "q": "“ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 218, "q": "ಗಲಾತ್ಯರಿಗೆ 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?", "r": "2:18"}, {"n": 219, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು …”", "a": "“… ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "r": "2:18"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕೆಡವಿದ್ದನ್ನೇ", "r": "2:18"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೇ ಅಪರಾಧಿ ಎಂದು ರುಜುವಾತು ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ಕಟ್ಟಿದರೆ; ನನ್ನನ್ನು", "r": "2:18"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಕೆಡವಿದ್ದನ್ನೇ ಪುನಃ ಕಟ್ಟಿದರೆ ನನ್ನನ್ನು ನಾನೇ ಅಪರಾಧಿ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡಿಸಿದಂತಾಗುವುದಿಲ್ಲವೇ?”", "a": "ರುಜುವಾತು", "r": "2:18"}, {"n": 223, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಏನಾಗಿದ್ದಾನೆ?", "a": "ಸತ್ತವನಾಗಿದ್ದಾನೆ", "r": "2:19"}, {"n": 224, "q": "ಪೌಲನು ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿರುವುದು ಯಾವುದಕ್ಕೋಸ್ಕರ?", "a": "ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 225, "q": "ಪೌಲನು ಯಾವುದರ ಮೂಲಕ ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ", "r": "2:19"}, {"n": 226, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ 2:19–20ರಲ್ಲಿ ಪೌಲನು ತಾನು ಯಾವುದರ ಪಾಲಿಗೆ ಸತ್ತವನು, ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನು; ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು", "r": "2:19–20"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ", "r": "2:19"}, {"n": 228, "q": "“ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 229, "q": "ಗಲಾತ್ಯರಿಗೆ 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.", "r": "2:19"}, {"n": 230, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ …”", "a": "“… ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "r": "2:19"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ ಪಾಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸತ್ತವನಾಗಿದ್ದೇನೆ", "r": "2:19"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ದೇವರಿಗಾಗಿ ಜೀವಿಸುವುದಕ್ಕೋಸ್ಕರ, ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ, ಧರ್ಮಶಾಸ್ತ್ರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ತವನಾಗಿದ್ದೇನೆ.”", "a": "ಪಾಲಿಗೆ", "r": "2:19"}, {"n": 233, "q": "ಪೌಲನು ಯಾರೊಂದಿಗೆ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು?", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ", "r": "2:20"}, {"n": 234, "q": "ಈಗ ತನ್ನಲ್ಲಿ ಯಾರು ಜೀವಿಸುತ್ತಾರೆಂದು ಪೌಲನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ.”", "r": "2:20"}, {"n": 235, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು” ಎಂಬ ಮಾತಿನ ನಂತರ ಪೌಲನು ತನ್ನ ಬಗ್ಗೆ ಏನು ಹೇಳುತ್ತಾನೆ?", "a": "“ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ.”", "r": "2:20"}, {"n": 236, "q": "ಪೌಲನು ಈಗ ಯಾವುದರಿಂದ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ?", "a": "ದೇವರ ಪುತ್ರನಲ್ಲಿ ತಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 237, "q": "ಪೌಲನ ಪ್ರಕಾರ ದೇವರ ಪುತ್ರನು ಅವನಿಗಾಗಿ ಮಾಡಿದ ಎರಡು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ಅವನನ್ನು ಪ್ರೀತಿಸಿದರು; ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದರು", "r": "2:20"}, {"n": 238, "q": "ಪೌಲನನ್ನು ಪ್ರೀತಿಸಿ ಅವನಿಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದವರು ಯಾರು?", "a": "ದೇವರ ಪುತ್ರ", "r": "2:20"}, {"n": 239, "q": "ಪೌಲನು ಈಗ ಎಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದಾನೆ ಎಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ಈ ದೇಹದಲ್ಲಿ", "r": "2:20"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜೀವಿಸುತ್ತಿದ್ದೇನೆ", "r": "2:20"}, {"n": 241, "q": "“ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 242, "q": "ಗಲಾತ್ಯರಿಗೆ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು. ಈಗ ಜೀವಿಸುವವನು ನಾನಲ್ಲ. ಕ್ರಿಸ್ತಯೇಸು ನನ್ನಲ್ಲಿ ಜೀವಿಸುತ್ತಾರೆ. ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.", "r": "2:20"}, {"n": 243, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ …”", "a": "“… ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "r": "2:20"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ವಿಶ್ವಾಸದಿಂದಲೇ", "r": "2:20"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ಪ್ರಾಣಾರ್ಪಣೆ; ಪುತ್ರನಲ್ಲಿ", "r": "2:20"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರನಲ್ಲಿ ನಾನು ಇರಿಸಿರುವ ವಿಶ್ವಾಸದಿಂದಲೇ ನಾನೀಗ ಈ ದೇಹದಲ್ಲಿ ಜೀವಿಸುತ್ತಿದ್ದೇನೆ.”", "a": "ನನ್ನನ್ನು", "r": "2:20"}, {"n": 247, "q": "ಪೌಲನು ಯಾವುದನ್ನು ನಿರಾಕರಿಸುವಂಥವನಲ್ಲ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 248, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಏನು ನಿರರ್ಥಕವೇ ಸರಿ?", "a": "ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 249, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯ ವಚನದಲ್ಲಿ ಪೌಲನು ಏನನ್ನು ನಿರಾಕರಿಸುವುದಿಲ್ಲವೆಂದು ಹೇಳುತ್ತಾನೆ?", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು", "r": "2:21"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಕ್ರಿಸ್ತಯೇಸು", "r": "2:21"}, {"n": 251, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು …”", "a": "“… ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "r": "2:21"}, {"n": 252, "q": "ಗಲಾತ್ಯರಿಗೆ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಅನುಗ್ರಹವನ್ನು ನಿರಾಕರಿಸುವಂಥವನು ನಾನಲ್ಲ. ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.", "r": "2:21"}, {"n": 253, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.” — ಈ ಮಾತುಗಳು ಗಲಾತ್ಯರಿಗೆ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಮರಣಕ್ಕೀಡಾದುದು", "r": "2:21"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೂಲಕ ದೇವರೊಡನೆ ಸತ್ಸಂಬಂಧವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ; ದೊರಕುವುದಾದರೆ", "r": "2:21"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಮೂಲಕ ದೇವರೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೊರಕುವುದಾದರೆ ಕ್ರಿಸ್ತಯೇಸು ಮರಣಕ್ಕೀಡಾದುದು ನಿರರ್ಥಕವೇ ಸರಿ.”", "a": "ಸತ್ಸಂಬಂಧವು", "r": "2:21"}]}]}</script>

    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
