form:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಖದಿಂದ ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "a": "ಗೃಹಿಣಿಯಾಗಿ", "r": "3:1"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ ಸುಖದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏರ್ಪಾಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "a": "ಬಾಳುವಂತೆ; ಮಾಡುವುದು", "r": "3:1"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಮಗಳೇ, ನೀನು ಮತ್ತೆ ಗೃಹಿಣಿಯಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾಳುವಂತೆ ಏರ್ಪಾಟು ಮಾಡುವುದು ನನ್ನ ಕರ್ತವ್ಯವಲ್ಲವೇ?”", "a": "ಸುಖದಿಂದ", "r": "3:1"}, {"n": 15, "q": "ನವೊಮಿ ಬೋವಜನನ್ನು ರೂತಳಿಗೆ ಹೇಗೆ ಪರಿಚಯಿಸಿದಳು?", "a": "“ಆ ಬೋವಜನು ನಮ್ಮ ನೆಂಟ.”", "r": "3:2"}, {"n": 16, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ಯಾವಾಗ ತೂರುವನು?", "a": "ಈ ಸಂಜೆ", "r": "3:2"}, {"n": 17, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ಬೋವಜನು ಎಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು?", "a": "ಕಣದಲ್ಲಿ", "r": "3:2"}, {"n": 18, "q": "ಆ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ ಏನು ಮಾಡುವನೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು", "r": "3:2"}, {"n": 19, "q": "ನವೊಮಿ ತನ್ನ ಯೋಜನೆಯನ್ನು ಹೇಳುವ ಮೊದಲು ರೂತಳಿಗೆ ಏನೆಂದಳು?", "a": "“ಈಗ ನಾನು ಹೇಳುವುದನ್ನು ಗಮನಿಸು”", "r": "3:2"}, {"n": 20, "q": "ನವೊಮಿ ಮತ್ತು ಬೋವಜನು ಇಬ್ಬರೂ ಬೋವಜನನ್ನು ನವೊಮಿಯ ಕುಟುಂಬಕ್ಕೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "ನೆಂಟ (ಹತ್ತಿರದ ನೆಂಟ)", "r": "3:2; 3:12"}, {"n": 21, "q": "ನವೊಮಿ ಹೇಳಿದಂತೆಯೇ ಬೋವಜನು ಆ ರಾತ್ರಿ ಎಲ್ಲಿ ಮಲಗಿದ್ದನು?", "a": "ಕಣದಲ್ಲಿ, ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ", "r": "3:2; 3:7"}, {"n": 22, "q": "ನವೊಮಿಯ ಪ್ರಕಾರ ರೂತಳು ಯಾರ ಜೊತೆಯಲ್ಲಿ ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ", "r": "3:2"}, {"n": 23, "q": "“ಆ ಬೋವಜನು ನಮ್ಮ ನೆಂಟ” ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ನವೊಮಿ", "r": "3:2"}, {"n": 24, "q": "ನವೊಮಿ ರೂತಳಿಗೆ ಬೋವಜನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?”", "r": "3:2"}, {"n": 25, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಘಟನೆ ಯಾವ ಸ್ಥಳದಲ್ಲಿ ನಡೆಯಿತು?", "a": "ಕಣದಲ್ಲಿ (ಜವೆಗೋದಿಯನ್ನು ತೂರುವ ಕಣ)", "r": "3:2; 3:7"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ", "r": "3:2"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸಂಜೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.”", "a": "ಬೋವಜನು", "r": "3:2"}, {"n": 28, "q": "ರೂತಳು 3:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಬೋವಜನು ನಮ್ಮ ನೆಂಟ. ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ? ಈಗ ನಾನು ಹೇಳುವುದನ್ನು ಗಮನಿಸು; ಈ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.", "r": "3:2"}, {"n": 29, "q": "“ಅವನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "3:2"}, {"n": 30, "q": "“ಈ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "3:2"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೊತೆಯಲ್ಲಿ ನೀನು ತೆನೆ ಆರಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದೀಯಲ್ಲವೇ?”", "a": "ಹೆಣ್ಣಾಳುಗಳ", "r": "3:2"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಸಂಜೆ ಬೋವಜನು ಕಣದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೂರುವನು.”", "a": "ಜವೆಗೋದಿಯನ್ನು", "r": "3:2"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನು ಕಣದಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ತೂರುವನು.”", "a": "ಸಂಜೆ", "r": "3:2"}, {"n": 34, "q": "ಕಣಕ್ಕೆ ಹೋಗುವ ಮೊದಲು ರೂತಳು ಮಾಡಬೇಕಾದ ಮೂರು ಸಿದ್ಧತೆಗಳೇನು ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "1) ಸ್ನಾನಮಾಡಿಕೊಳ್ಳುವುದು; 2) ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚುವುದು; 3) ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊಳ್ಳುವುದು", "r": "3:3"}, {"n": 35, "q": "ರೂತಳು ಯಾವ ತೈಲವನ್ನು ಹಚ್ಚಿಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಸುಗಂಧ ತೈಲವನ್ನು", "r": "3:3"}, {"n": 36, "q": "ರೂತಳು ಯಾವ ರೀತಿಯ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಸೊಗಸಾದ ಉಡುಪನ್ನು", "r": "3:3"}, {"n": 37, "q": "ಬೋವಜನು ಏನು ಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ರೂತಳು ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬಾರದಿತ್ತು?", "a": "ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ", "r": "3:3"}, {"n": 38, "q": "ಕಣದಲ್ಲಿ ಬೋವಜನ ಊಟದ ಸಮಯದ ಬಗ್ಗೆ ನವೊಮಿ ರೂತಳಿಗೆ ಏನು ಎಚ್ಚರಿಕೆ ಕೊಟ್ಟಳು?", "a": "“ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.”", "r": "3:3"}, {"n": 39, "q": "ನವೊಮಿ ಹೇಳಿಕೊಟ್ಟಂತೆಯೇ ರೂತಳು ಬೋವಜನ ಪಾದಗಳ ಹೊದಿಕೆಯನ್ನು ಹೇಗೆ ಸರಿಸಿದಳು?", "a": "ಮೆತ್ತಗೆ ಸರಿಸಿದಳು", "r": "3:3–4; 3:6–7"}, {"n": 40, "q": "ಬೋವಜನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸಿದ ಮೇಲೆ ಹೇಗಿದ್ದನು?", "a": "ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:3; 3:7"}, {"n": 41, "q": "ಸಿದ್ಧಳಾದ ಮೇಲೆ ರೂತಳು ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಕಣಕ್ಕೆ", "r": "3:3"}, {"n": 42, "q": "ನವೊಮಿಯ ಸೂಚನೆಯಂತೆ ರೂತಳು ಮೊದಲು ಏನು ಮಾಡಿಕೊಳ್ಳಬೇಕಿತ್ತು?", "a": "ಸ್ನಾನಮಾಡಿಕೊಳ್ಳಬೇಕಿತ್ತು", "r": "3:3"}, {"n": 43, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ರೂತಳ ಉಡುಪಿಗೆ ಸಂಬಂಧಿಸಿದ ಎರಡು ವಸ್ತುಗಳು ಯಾವುವು?", "a": "ಸೊಗಸಾದ ಉಡುಪು (3:3) ಮತ್ತು ಮೇಲ್ಹೊದಿಕೆ (3:15)", "r": "3:3; 3:15"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "a": "ಸ್ನಾನಮಾಡಿಕೊಂಡು", "r": "3:3"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ", "r": "3:3"}, {"n": 46, "q": "“ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 47, "q": "ರೂತಳು 3:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ. ಆಮೇಲೆ ಕಣಕ್ಕೆ ಹೋಗು. ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.", "r": "3:3"}, {"n": 48, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು …”", "a": "“… ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "r": "3:3"}, {"n": 49, "q": "“ಅವನು ಅನ್ನಪಾನಮಾಡಿ ಮುಗಿಸುವವರೆಗೂ ಅವನಿಗೆ ಕಾಣಿಸಿಕೊಳ್ಳಬೇಡ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಚ್ಚಿ, ಸೊಗಸಾದ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "a": "ತೈಲವನ್ನು", "r": "3:3"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಸ್ನಾನಮಾಡಿಕೊಂಡು ಸುಗಂಧ ತೈಲವನ್ನು ಹಚ್ಚಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊ.”", "a": "ಸೊಗಸಾದ", "r": "3:3"}, {"n": 52, "q": "ಬೋವಜನ ಬಗ್ಗೆ ರೂತಳು ಏನನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ ಎಂಬುದನ್ನು", "r": "3:4"}, {"n": 53, "q": "ಬೋವಜನು ಮಲಗಿದ ಮೇಲೆ ರೂತಳು ಏನು ಮಾಡಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅಲ್ಲಿಗೆ ಹೋಗಿ ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗಬೇಕು", "r": "3:4"}, {"n": 54, "q": "ರೂತಳು ಬೋವಜನ ಯಾವ ಭಾಗದ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಬೇಕಿತ್ತು?", "a": "ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು", "r": "3:4"}, {"n": 55, "q": "ಆಮೇಲೆ ರೂತಳು ಮಾಡಬೇಕಾದುದನ್ನು ಯಾರು ತಿಳಿಸುವರೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "“ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ ತಿಳಿಸುವನು” (ಬೋವಜನು)", "r": "3:4"}, {"n": 56, "q": "ಬೋವಜನು ಮಲಗಿದ ಮೇಲೆ ರೂತಳು ಅವನ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಿ ಎಲ್ಲಿ ಮಲಗಬೇಕಿತ್ತು?", "a": "ಪಕ್ಕದಲ್ಲೇ", "r": "3:4"}, {"n": 57, "q": "ರೂತಳು ಮುಂದೆ ಏನು ಮಾಡಬೇಕೆಂದು ತಿಳಿಸುವವನು ಯಾರು ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಬೋವಜನು (“ಅವನೇ ತಿಳಿಸುವನು”)", "r": "3:4"}, {"n": 58, "q": "ರೂತಳು ಯಾವಾಗ ಬೋವಜನು ಮಲಗಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಹೋಗಬೇಕೆಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಅವನು ಮಲಗಿದ ಮೇಲೆ", "r": "3:4"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಎಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊ.”", "a": "ಮಲಗುತ್ತಾನೆ", "r": "3:4"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಮಲಗಿದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗು.”", "a": "ಅಲ್ಲಿಗೆ", "r": "3:4"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "a": "ಹೊದಿಕೆಯನ್ನು", "r": "3:4"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಮೇಲೆ ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನೇ ತಿಳಿಸುವನು,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು", "r": "3:4"}, {"n": 63, "q": "“ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ ಎಂಬುದನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 64, "q": "“ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 65, "q": "ರೂತಳು 3:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ ಎಂಬುದನ್ನು ಗೊತ್ತು ಮಾಡಿಕೊ. ಅವನು ಮಲಗಿದ ಮೇಲೆ ಅಲ್ಲಿಗೆ ಹೋಗು. ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು. ಆಮೇಲೆ ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ ತಿಳಿಸುವನು,” ಎಂದು ಹೇಳಿದಳು.", "r": "3:4"}, {"n": 66, "q": "“ಅವನು ಮಲಗಿದ ಮೇಲೆ ಅಲ್ಲಿಗೆ ಹೋಗು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 67, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು …”", "a": "“… ಮೆತ್ತಗೆ ಸರಿಸಿಬಿಟ್ಟು ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "r": "3:4"}, {"n": 68, "q": "“ಆಮೇಲೆ ನೀನು ಮಾಡಬೇಕಾದುದೇನೆಂಬುದನ್ನು ಅವನೇ ತಿಳಿಸುವನು,’ ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಎಲ್ಲಿ ಮಲಗುತ್ತಾನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೊತ್ತು ಮಾಡಿಕೊ.”", "a": "ಎಂಬುದನ್ನು", "r": "3:4"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿನ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಕ್ಕದಲ್ಲೇ ಮಲಗು.”", "a": "ಸರಿಸಿಬಿಟ್ಟು", "r": "3:4"}, {"n": 71, "q": "ನವೊಮಿಯ ಸೂಚನೆಗಳಿಗೆ ರೂತಳು ಏನೆಂದು ಮರುತ್ತರಕೊಟ್ಟಳು?", "a": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ”", "r": "3:5"}, {"n": 72, "q": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ರೂತಳು ನವೊಮಿಗೆ", "r": "3:5"}, {"n": 73, "q": "ರೂತಳು ನವೊಮಿಗೆ ಕೊಟ್ಟ ಮಾತನ್ನು ಹೇಗೆ ಉಳಿಸಿಕೊಂಡಳು?", "a": "“ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಹೇಳಿ, ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು", "r": "3:5–6"}, {"n": 74, "q": "ನವೊಮಿಯ ಸೂಚನೆಗಳನ್ನು ಕೇಳಿ “ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ” ಎಂದು ಮರುತ್ತರಕೊಟ್ಟವಳು ಯಾರು?", "a": "ರೂತಳು", "r": "3:5"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮರುತ್ತರಕೊಟ್ಟಳು", "r": "3:5"}, {"n": 76, "q": "“‘ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ,’ ಎಂದು ಮರುತ್ತರಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 77, "q": "ರೂತಳು 3:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ರೂತಳು: “ನೀವು ಹೇಳಿದಂತೆಯೇ ನಾನು ಮಾಡುತ್ತೇನೆ,” ಎಂದು ಮರುತ್ತರಕೊಟ್ಟಳು.", "r": "3:5"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಮಾಡುತ್ತೇನೆ,’ ಎಂದು ಮರುತ್ತರಕೊಟ್ಟಳು.”", "a": "ಹೇಳಿದಂತೆಯೇ", "r": "3:5"}, {"n": 79, "q": "ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಏನು ಮಾಡಿದಳು?", "a": "ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು", "r": "3:6"}, {"n": 80, "q": "ನವೊಮಿ ಹೇಳಿಕೊಟ್ಟಂತೆ ರೂತಳು ಎಲ್ಲಿಗೆ ಹೋದಳು?", "a": "ಕಣಕ್ಕೆ", "r": "3:6"}, {"n": 81, "q": "ರೂತಳು ಕಣದಲ್ಲಿ ಯಾರು ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು?", "a": "ಅತ್ತೆ (ನವೊಮಿ) ಹೇಳಿಕೊಟ್ಟಂತೆ", "r": "3:6"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.”", "a": "ರೂತಳು", "r": "3:6"}, {"n": 83, "q": "“ಅದರಂತೆ ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 84, "q": "ರೂತಳು 3:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರಂತೆ ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.", "r": "3:6"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ ರೂತಳು ಕಣಕ್ಕೆ ಹೋಗಿ ಅತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಳು.”", "a": "ಹೇಳಿಕೊಟ್ಟಂತೆ", "r": "3:6"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ ರೂತಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಅತ್ತೆ ಹೇಳಿಕೊಟ್ಟಂತೆ ಮಾಡಿದಳು.”", "a": "ಕಣಕ್ಕೆ", "r": "3:6"}, {"n": 87, "q": "ಅನ್ನಪಾನಮಾಡಿದ ನಂತರ ಬೋವಜನು ಹೇಗಿದ್ದನು?", "a": "ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:7"}, {"n": 88, "q": "ಅನ್ನಪಾನಮಾಡಿದ ಮೇಲೆ ಬೋವಜನು ಎಲ್ಲಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು?", "a": "ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ", "r": "3:7"}, {"n": 89, "q": "ರೂತಳು ಬೋವಜನ ಬಳಿಗೆ ಹೇಗೆ ಹೋದಳು?", "a": "ನಿಶ್ಯಬ್ಧವಾಗಿ", "r": "3:7"}, {"n": 90, "q": "ಬೋವಜನಿಗೆ ಯಾವ ಹೊತ್ತಿನಲ್ಲಿ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು?", "a": "ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ", "r": "3:7"}, {"n": 91, "q": "ಬಗ್ಗಿ ನೋಡಿದಾಗ ಬೋವಜನು ಏನನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡನು?", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು", "r": "3:7"}, {"n": 92, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಎಚ್ಚರಗೊಂಡ ಬೋವಜನು ರೂತಳನ್ನು ಏನೆಂದು ಕೇಳಿದನು?", "a": "“ನೀನು ಯಾರು?”", "r": "3:7"}, {"n": 93, "q": "ತನ್ನ ಪಾದಗಳ ಬಳಿ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಮಲಗಿರುವುದನ್ನು ಕಂಡಾಗ ಬೋವಜನ ಸ್ಥಿತಿ ಹೇಗಿತ್ತು?", "a": "ಚಕಿತಗೊಂಡನು", "r": "3:7"}, {"n": 94, "q": "ರೂತಳು ಬೋವಜನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಸರಿಸಿದ ನಂತರ ಏನು ಮಾಡಿದಳು?", "a": "ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು", "r": "3:7"}, {"n": 95, "q": "ಬೋವಜನು ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗುವ ಮೊದಲು ಏನು ಮಾಡಿದ್ದನು?", "a": "ಅನ್ನಪಾನಮಾಡಿ ಸಂತುಷ್ಟನಾಗಿದ್ದನು", "r": "3:7"}, {"n": 96, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಎಚ್ಚರವಾದಾಗ ಬೋವಜನು ಏನು ಮಾಡಿದನು?", "a": "ಬಗ್ಗಿ ನೋಡಿದನು", "r": "3:7"}, {"n": 97, "q": "ನಡುರಾತ್ರಿಯಲ್ಲಿ ಬೋವಜನು ತನ್ನ ಪಾದಗಳ ಬಳಿ ಕಂಡದ್ದು ಯಾರನ್ನು?", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳನ್ನು (ರೂತಳನ್ನು)", "r": "3:7"}, {"n": 98, "q": "ಕಣದಲ್ಲಿ ರೂತಳು ಆ ರಾತ್ರಿ ಎಷ್ಟು ಬಾರಿ ಬೋವಜನ ಪಾದಗಳ ಬಳಿ ಮಲಗಿದಳೆಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಎರಡು ಬಾರಿ (ಹೊದಿಕೆ ಸರಿಸಿ ಮಲಗಿಕೊಂಡಳು 3:7; ಬೋವಜನ ಮಾತಿನಂತೆ ಮಲಗಿದಳು 3:14)", "r": "3:7; 3:14"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಲಗಿಕೊಂಡನು", "r": "3:7"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಶ್ಯಬ್ಧವಾಗಿ ಅವನ ಬಳಿಗೆ ಹೋದಳು.”", "a": "ರೂತಳು", "r": "3:7"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.”", "a": "ಹೊದಿಕೆಯನ್ನು", "r": "3:7"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುಮಾರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು.”", "a": "ನಡುರಾತ್ರಿಯಲ್ಲಿ", "r": "3:7"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಗ್ಗಿ ನೋಡಿದಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡು, ‘ನೀನು ಯಾರು?’ ಎಂದು ಕೇಳಿದನು.”", "a": "ಸ್ತ್ರೀಯೊಬ್ಬಳು", "r": "3:7"}, {"n": 104, "q": "“ರೂತಳು ನಿಶ್ಯಬ್ಧವಾಗಿ ಅವನ ಬಳಿಗೆ ಹೋದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 105, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು …”", "a": "“… ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.”", "r": "3:7"}, {"n": 106, "q": "“ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ ಅವನಿಗೆ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 107, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಗ್ಗಿ ನೋಡಿದಾಗ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು …”", "a": "“… ಕಂಡು ಚಕಿತಗೊಂಡು, ‘ನೀನು ಯಾರು?’ ಎಂದು ಕೇಳಿದನು.”", "r": "3:7"}, {"n": 108, "q": "ರೂತಳು 3:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇತ್ತ ಬೋವಜನು ಅನ್ನಪಾನಮಾಡಿ ಸಂತುಷ್ಟನಾಗಿದ್ದನು. ಅನಂತರ ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು. ರೂತಳು ನಿಶ್ಯಬ್ಧವಾಗಿ ಅವನ ಬಳಿಗೆ ಹೋದಳು. ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು. ಸುಮಾರು ನಡುರಾತ್ರಿಯಲ್ಲಿ ಅವನಿಗೆ ತಟ್ಟನೆ ಎಚ್ಚರವಾಯಿತು. ಬಗ್ಗಿ ನೋಡಿದಾಗ ಸ್ತ್ರೀಯೊಬ್ಬಳು ಪಾದಗಳ ಬಳಿ ಮಲಗಿರುವುದನ್ನು ಕಂಡು ಚಕಿತಗೊಂಡು, “ನೀನು ಯಾರು?” ಎಂದು ಕೇಳಿದನು.", "r": "3:7"}, {"n": 109, "q": "“ಅನಂತರ ಜವೆಗೋದಿಯ ರಾಶಿಯ ಬಳಿ ಹೋಗಿ ಮಲಗಿಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 110, "q": "“ಅವನ ಪಾದಗಳ ಮೇಲಿದ್ದ ಹೊದಿಕೆಯನ್ನು ಮೆತ್ತಗೆ ಸರಿಸಿ, ಅಲ್ಲೇ ಮಲಗಿಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 111, "q": "“ನೀನು ಯಾರು?” ಎಂದು ಬೋವಜನು ಕೇಳಿದಾಗ ರೂತಳು ತನ್ನನ್ನು ಹೇಗೆ ಪರಿಚಯಿಸಿಕೊಂಡಳು?", "a": "“ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು.”", "r": "3:8–9"}, {"n": 112, "q": "ರೂತಳು ಬೋವಜನಿಗೆ ತನ್ನ ಮೇಲೆ ಏನನ್ನು ಹಾಕುವಂತೆ ಕೇಳಿಕೊಂಡಳು?", "a": "ಅವನ ಹೊದಿಕೆಯ ಅಂಚನ್ನು", "r": "3:8–9"}, {"n": 113, "q": "ಬೋವಜನು ತನ್ನ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ತನ್ನ ಮೇಲೆ ಹಾಕಬೇಕೆಂದು ರೂತಳು ಯಾವ ಕಾರಣ ಕೊಟ್ಟಳು?", "a": "ಅವನು ತನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ", "r": "3:8–9"}, {"n": 114, "q": "ರೂತಳು ಬೋವಜನನ್ನು ಸಂಬೋಧಿಸಿ ತನ್ನನ್ನು ಏನೆಂದು ಕರೆದುಕೊಂಡಳು?", "a": "“ಒಡೆಯಾ”; “ನಿಮ್ಮ ದಾಸಿ”", "r": "3:8–9"}, {"n": 115, "q": "“ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ” — ಈ ಬೇಡಿಕೆಯನ್ನು ರೂತಳು ಯಾವ ಸಂಬಂಧದ ಆಧಾರದ ಮೇಲೆ ಮಾಡಿದಳು?", "a": "ಬೋವಜನು ತನ್ನ ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವ ಸಂಬಂಧ", "r": "3:8–9"}, {"n": 116, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ರೂತಳು", "r": "3:8–9"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ಇರುವುದರಿಂದ", "r": "3:8–9"}, {"n": 118, "q": "“‘ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8–9", "r": "3:8–9"}, {"n": 119, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ …”", "a": "“… ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "r": "3:8–9"}, {"n": 120, "q": "“ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು ಕೇಳಿಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8–9", "r": "3:8–9"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೇಳಿಕೊಂಡಳು", "r": "3:8–9"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರುವುದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ನೆಂಟರಾಗಿ; ದಯವಿಟ್ಟು", "r": "3:8–9"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,’ ಎಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ಹತ್ತಿರದ", "r": "3:8–9"}, {"n": 124, "q": "ರೂತಳು 3:8–9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ರೂತಳು: “ಒಡೆಯಾ, ನಾನು ನಿಮ್ಮ ದಾಸಿ ರೂತಳು. ನೀವು ನನ್ನ ಹತ್ತಿರದ ನೆಂಟರಾಗಿ ಇರುವುದರಿಂದ ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೊದಿಕೆಯ ಅಂಚನ್ನು ನನ್ನ ಮೇಲೆ ಹಾಕಿ,” ಎಂದು ಕೇಳಿಕೊಂಡಳು.", "r": "3:8–9"}, {"n": 125, "q": "ರೂತಳ ಬೇಡಿಕೆ ಕೇಳಿದ ಬೋವಜನು ಮೊದಲು ಅವಳನ್ನು ಹೇಗೆ ಹರಸಿದನು?", "a": "“ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "r": "3:10"}, {"n": 126, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯಾರನ್ನು ಅರಸಲಿಲ್ಲ?", "a": "ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ", "r": "3:10"}, {"n": 127, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಅವನಿಗೆ ತೋರಿದ ವಂಶ ಗೌರವ ಯಾವುದಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು?", "a": "ಇಲ್ಲಿಯವರೆಗೆ ಅವಳು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ", "r": "3:10"}, {"n": 128, "q": "ರೂತಳು ಬೋವಜನಿಗೆ ತೋರಿದ್ದು ಯಾವ ಗೌರವ ಎಂದು ಅವನು ಹೇಳಿದನು?", "a": "ವಂಶ ಗೌರವ", "r": "3:10"}, {"n": 129, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಬೋವಜನು ದೇವರನ್ನು ಯಾವ ಎರಡು ಹೆಸರುಗಳಿಂದ ಉಲ್ಲೇಖಿಸುತ್ತಾನೆ?", "a": "ಸರ್ವೇಶ್ವರ (3:10); ಜೀವಸ್ವರೂಪರಾದ ದೇವರು (3:13)", "r": "3:10; 3:13"}, {"n": 130, "q": "“ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ” — ಈ ಮಾತನ್ನು ಬೋವಜನು ಯಾವ ಆಶೀರ್ವಾದದ ನಂತರ ಹೇಳಿದನು?", "a": "“ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!”", "r": "3:10"}, {"n": 131, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯೌವನಸ್ಥರ ವಿಷಯದಲ್ಲಿ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ಬಡ ಅಥವಾ ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನು ಅರಸಲಿಲ್ಲ", "r": "3:10"}, {"n": 132, "q": "ರೂತಳು ಇಲ್ಲಿಯವರೆಗೆ ಯಾರಿಗೆ ಗೌರವ ತೋರಿದ್ದಳೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅತ್ತೆಗೆ", "r": "3:10"}, {"n": 133, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರಸಲಿಲ್ಲ", "r": "3:10"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಶ್ರೇಷ್ಠವಾದುದು", "r": "3:10"}, {"n": 135, "q": "“ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 136, "q": "ರೂತಳು 3:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬೋವಜನು: “ಮಗಳೇ, ಸರ್ವೇಶ್ವರ ನಿನ್ನನ್ನು ಆಶೀರ್ವದಿಸಲಿ! ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ. ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.", "r": "3:10"}, {"n": 137, "q": "“ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, ಸಿರಿವಂತ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 138, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು …”", "a": "“… ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.”", "r": "3:10"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಬಡ ಯೌವನಸ್ಥನನ್ನಾಗಲೀ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೌವನಸ್ಥನನ್ನಾಗಲೀ ಅರಸಲಿಲ್ಲ.”", "a": "ಸಿರಿವಂತ", "r": "3:10"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶ್ರೇಷ್ಠವಾದುದು.”", "a": "ಗೌರವಕ್ಕಿಂತಲೂ", "r": "3:10"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ ಗೌರವವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.”", "a": "ಇಲ್ಲಿಯವರೆಗೆ; ಅತ್ತೆಗೆ", "r": "3:10"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ನನಗೆ ತೋರಿದ ವಂಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲಿಯವರೆಗೆ ನೀನು ಅತ್ತೆಗೆ ತೋರಿದ ಗೌರವಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠವಾದುದು.”", "a": "ಗೌರವವು", "r": "3:10"}, {"n": 143, "q": "ರೂತಳ ಭಯವನ್ನು ಹೋಗಲಾಡಿಸಲು ಬೋವಜನು ಏನೆಂದನು?", "a": "“ಮಗಳೇ, ಭಯಪಡಬೇಡ”", "r": "3:11"}, {"n": 144, "q": "ರೂತಳ ಬಗ್ಗೆ ಊರಿಗೆಲ್ಲಾ ಏನು ತಿಳಿದಿದೆ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅವಳು ಸುಗುಣಶೀಲೆ ಎಂದು", "r": "3:11"}, {"n": 145, "q": "ರೂತಳು ಕೇಳಿಕೊಂಡದ್ದನ್ನು ಏನು ಮಾಡುವೆನೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಈಡೇರಿಸುವೆನು", "r": "3:11"}, {"n": 146, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲಿ ‘ಸುಗುಣಶೀಲೆ’ ಎಂದು ಕರೆಯಲ್ಪಟ್ಟವಳು ಯಾರು?", "a": "ರೂತಳು", "r": "3:11"}, {"n": 147, "q": "ರೂತಳು ಸುಗುಣಶೀಲೆ ಎಂದು ಯಾರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಊರಿಗೆಲ್ಲಾ", "r": "3:11"}, {"n": 148, "q": "“ನೀನು ಕೇಳಿಕೊಂಡದ್ದನ್ನು ಈಡೇರಿಸುವೆನು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ವಾಗ್ದಾನ ಮಾಡಿದರು?", "a": "ಬೋವಜನು ರೂತಳಿಗೆ", "r": "3:11"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ;”", "a": "ಸುಗುಣಶೀಲೆ", "r": "3:11"}, {"n": 150, "q": "“ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ;” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 151, "q": "ರೂತಳು 3:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ; ನೀನು ಕೇಳಿಕೊಂಡದ್ದನ್ನು ಈಡೇರಿಸುವೆನು.", "r": "3:11"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಗಳೇ, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದಿದೆ;”", "a": "ಊರಿಗೆಲ್ಲಾ", "r": "3:11"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಭಯಪಡಬೇಡ, ನೀನು ಸುಗುಣಶೀಲೆ ಎಂದು ಊರಿಗೆಲ್ಲಾ ತಿಳಿದಿದೆ;”", "a": "ಮಗಳೇ", "r": "3:11"}, {"n": 154, "q": "ರೂತಳನ್ನು ಸಲಹುವ ಯಾವ ಕರ್ತವ್ಯ ತನ್ನದು ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಮೈದುನ ಕರ್ತವ್ಯ", "r": "3:12"}, {"n": 155, "q": "ಬೋವಜನು ತಾನು ರೂತಳ ಕುಟುಂಬಕ್ಕೆ ಏನಾಗಿರುವುದು ನಿಜ ಎಂದು ಒಪ್ಪಿಕೊಂಡನು?", "a": "ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವುದು", "r": "3:12"}, {"n": 156, "q": "ರೂತಳನ್ನು ಸಲಹುವ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ಹೇಳಿದ ಅಡಚಣೆ ಏನು?", "a": "ತನಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ", "r": "3:12"}, {"n": 157, "q": "“ಆದರೆ ನನಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಬೋವಜನು ರೂತಳಿಗೆ", "r": "3:12"}, {"n": 158, "q": "ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿಯ ವಿಷಯದಲ್ಲಿ ಬೋವಜನಿಗಿಂತ ಮೊದಲ ಹಕ್ಕು ಯಾರಿಗಿತ್ತು?", "a": "ಬೋವಜನಿಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನಿಗೆ", "r": "3:12–13"}, {"n": 159, "q": "“ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು” ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ಬೋವಜನು", "r": "3:12"}, {"n": 160, "q": "ರೂತಳ ಗ್ರಂಥದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರಿಲ್ಲದೆ ಉಲ್ಲೇಖಿಸಲಾದ ವ್ಯಕ್ತಿ ಯಾರು?", "a": "ಬೋವಜನಿಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನು", "r": "3:12; 3:13"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜ.”", "a": "ನೆಂಟನಾಗಿರುವುದೇನೋ", "r": "3:12"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು.”", "a": "ನಿನ್ನನ್ನು", "r": "3:12"}, {"n": 163, "q": "“ನಾನು ನಿಮಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವುದೇನೋ ನಿಜ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 164, "q": "ರೂತಳು 3:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನಿಮಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿರುವುದೇನೋ ನಿಜ. ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು. ಆದರೆ ನನಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನೊಬ್ಬನಿದ್ದಾನೆ.", "r": "3:12"}, {"n": 165, "q": "“ನಿನ್ನನ್ನು ಸಲಹುವ ಮೈದುನ ಕರ್ತವ್ಯ ನನ್ನದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನನ್ನು ಸಲಹುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರ್ತವ್ಯ ನನ್ನದು.”", "a": "ಮೈದುನ", "r": "3:12"}, {"n": 167, "q": "ಆ ರಾತ್ರಿ ರೂತಳು ಎಲ್ಲಿರಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "“ಈ ರಾತ್ರಿ ಇಲ್ಲೇ ಇರು.”", "r": "3:13"}, {"n": 168, "q": "ಹತ್ತಿರದ ನೆಂಟನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ಯಾವಾಗ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ನಾಳೆ", "r": "3:13"}, {"n": 169, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳದಿದ್ದರೆ ಏನು ಮಾಡುವೆನೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ತಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುವೆನು", "r": "3:13"}, {"n": 170, "q": "ಬೋವಜನು ಯಾರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡಿದನು?", "a": "ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ", "r": "3:13"}, {"n": 171, "q": "ಪ್ರಮಾಣ ಮಾಡಿದ ನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ ಏನೆಂದನು?", "a": "“ಇನ್ನು ನಿಶ್ಚಿಂತಳಾಗಿ ಮಲಗು”", "r": "3:13"}, {"n": 172, "q": "ಹತ್ತಿರದ ನೆಂಟನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಂಡರೆ ಅದರ ಬಗ್ಗೆ ಬೋವಜನು ಏನು ಹೇಳಿದನು?", "a": "ಒಳ್ಳೆಯದು", "r": "3:13"}, {"n": 173, "q": "ಹತ್ತಿರದ ನೆಂಟನ ಬಗ್ಗೆ ಏನನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅವನು ರೂತಳನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು", "r": "3:13"}, {"n": 174, "q": "ಬೋವಜನು ತನ್ನ ಮಾತನ್ನು ದೃಢಪಡಿಸಲು ಏನು ಮಾಡಿದನು?", "a": "ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡಿದನು", "r": "3:13"}, {"n": 175, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಹೇಗೆ ಮಲಗುವಂತೆ ಹೇಳಿದನು?", "a": "ನಿಶ್ಚಿಂತಳಾಗಿ", "r": "3:13"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ", "r": "3:13"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "a": "ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ", "r": "3:13"}, {"n": 178, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ …”", "a": "“… ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "r": "3:13"}, {"n": 179, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ …”", "a": "“… ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "r": "3:13"}, {"n": 180, "q": "ರೂತಳು 3:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ರಾತ್ರಿ ಇಲ್ಲೇ ಇರು. ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ. ಅವನು ಅದನ್ನು ವಹಿಸಿಕೊಳ್ಳುವುದಾದರೆ ಒಳ್ಳೆಯದು. ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ. ಇನ್ನು ನಿಶ್ಚಿಂತಳಾಗಿ ಮಲಗು,” ಎಂದನು.", "r": "3:13"}, {"n": 181, "q": "“ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 182, "q": "“ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "a": "ವಹಿಸಿಕೊಳ್ಳುವನೋ", "r": "3:13"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ ಎಂದು ಜೀವಸ್ವರೂಪರಾದ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "a": "ಕರ್ತವ್ಯವನ್ನು", "r": "3:13"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಲಹುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ ಎಂಬುದನ್ನು ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "a": "ನಿನ್ನನ್ನು; ಜವಾಬ್ದಾರಿ", "r": "3:13"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲವಾದರೆ ನಾನೇ ಆ ಕರ್ತವ್ಯವನ್ನು ವಹಿಸಿಕೊಳ್ಳುತ್ತೇನೆ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಮಾಣ ಮಾಡುತ್ತೇನೆ.”", "a": "ಜೀವಸ್ವರೂಪರಾದ; ಹೆಸರಿನಲ್ಲಿ", "r": "3:13"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನ್ನನ್ನು ಸಲಹುವ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವನೋ ಇಲ್ಲವೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಳೆ ವಿಚಾರಿಸಿಕೊಳ್ಳೋಣ.”", "a": "ಎಂಬುದನ್ನು", "r": "3:13"}, {"n": 188, "q": "ಬೋವಜನ ಮಾತಿನಂತೆ ರೂತಳು ಎಲ್ಲಿ ಮಲಗಿದಳು?", "a": "ಅವನ ಪಾದಗಳ ಬಳಿಯಲ್ಲೇ", "r": "3:14"}, {"n": 189, "q": "ರೂತಳು ಕಣದಿಂದ ಯಾವಾಗ ಎದ್ದಳು?", "a": "ನಸುಕಿನಲ್ಲೇ", "r": "3:14"}, {"n": 190, "q": "ರೂತಳು ನಸುಕಿನಲ್ಲೇ ಏಕೆ ಎದ್ದಳು?", "a": "ಅವಳು ಅಲ್ಲಿಗೆ ಬಂದದ್ದು ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು ಬೋವಜನು ಹೇಳಿದ್ದರಿಂದ", "r": "3:14"}, {"n": 191, "q": "ರೂತಳು ಕಣಕ್ಕೆ ಬಂದ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ಏನು ಹೇಳಿದ್ದನು?", "a": "ಅದು ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು", "r": "3:14"}, {"n": 192, "q": "ನಸುಕಿನಲ್ಲೇ ಎದ್ದ ರೂತಳು ಆ ರಾತ್ರಿ ಎಲ್ಲಿ ಮಲಗಿದ್ದಳು?", "a": "ಬೋವಜನ ಪಾದಗಳ ಬಳಿಯಲ್ಲೇ", "r": "3:14"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ ಅವಳು ಅವನ ಪಾದಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಲಗಿದಳು.”", "a": "ಬಳಿಯಲ್ಲೇ", "r": "3:14"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಅಲ್ಲಿಗೆ ಬಂದದ್ದು ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದನು;”", "a": "ಬೋವಜನು", "r": "3:14"}, {"n": 195, "q": "“ಅದರಂತೆ ಅವಳು ಅವನ ಪಾದಗಳ ಬಳಿಯಲ್ಲೇ ಮಲಗಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 196, "q": "ರೂತಳು 3:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರಂತೆ ಅವಳು ಅವನ ಪಾದಗಳ ಬಳಿಯಲ್ಲೇ ಮಲಗಿದಳು. ಅವಳು ಅಲ್ಲಿಗೆ ಬಂದದ್ದು ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು ಬೋವಜನು ಹೇಳಿದ್ದನು; ಎಂತಲೇ ನಸುಕಿನಲ್ಲೇ ಎದ್ದಳು.", "r": "3:14"}, {"n": 197, "q": "“ಅವಳು ಅಲ್ಲಿಗೆ ಬಂದದ್ದು ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು ಬೋವಜನು ಹೇಳಿದ್ದನು;” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆ ಅವಳು ಅವನ ಪಾದಗಳ ಬಳಿಯಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಲಗಿದಳು", "r": "3:14"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಅಲ್ಲಿಗೆ ಬಂದದ್ದು ಯಾರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನು ಹೇಳಿದ್ದನು;”", "a": "ತಿಳಿಯಬಾರದೆಂದು", "r": "3:14"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಅಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದು ಬೋವಜನು ಹೇಳಿದ್ದನು;”", "a": "ಬಂದದ್ದು", "r": "3:14"}, {"n": 201, "q": "ಬೆಳಿಗ್ಗೆ ಹೊರಡುವ ಮೊದಲು ಬೋವಜನು ರೂತಳಿಗೆ ಏನು ಮಾಡಲು ಹೇಳಿದನು?", "a": "“ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು”", "r": "3:15"}, {"n": 202, "q": "ಬೋವಜನು ರೂತಳ ಮೇಲ್ಹೊದಿಕೆಯಲ್ಲಿ ಎಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದನು?", "a": "ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು", "r": "3:15"}, {"n": 203, "q": "ಬೋವಜನು ರೂತಳ ಮೇಲ್ಹೊದಿಕೆಯಲ್ಲಿ ಯಾವ ಧಾನ್ಯವನ್ನು ಸುರಿದನು?", "a": "ಜವೆಗೋದಿಯನ್ನು", "r": "3:15"}, {"n": 204, "q": "ಜವೆಗೋದಿಯನ್ನು ಮೇಲ್ಹೊದಿಕೆಯಲ್ಲಿ ಸುರಿದ ನಂತರ ಬೋವಜನು ಏನು ಮಾಡಿದನು?", "a": "ಅದನ್ನೆತ್ತಿ ರೂತಳಿಗೆ ಹೊರಿಸಿದನು", "r": "3:15"}, {"n": 205, "q": "ಜವೆಗೋದಿಯನ್ನು ಹೊತ್ತುಕೊಂಡು ರೂತಳು ಎಲ್ಲಿಗೆ ಹೋದಳು?", "a": "ಊರೊಳಗೆ", "r": "3:15"}, {"n": 206, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಕೊಟ್ಟ ಜವೆಗೋದಿಯನ್ನು ಅವಳು ಯಾವುದರಲ್ಲಿ ಹೊತ್ತುಕೊಂಡು ಹೋದಳು?", "a": "ತನ್ನ ಮೇಲ್ಹೊದಿಕೆಯಲ್ಲಿ", "r": "3:15; 3:17"}, {"n": 207, "q": "ರೂತಳ ಮೇಲ್ಹೊದಿಕೆಯಲ್ಲಿ ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದವನು ಯಾರು?", "a": "ಬೋವಜನು", "r": "3:15"}, {"n": 208, "q": "ರೂತಳು ಜವೆಗೋದಿಯನ್ನು ಹೇಗೆ ಊರೊಳಗೆ ತೆಗೆದುಕೊಂಡು ಹೋದಳು?", "a": "ಹೊತ್ತುಕೊಂಡು", "r": "3:15"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಕೆಗೆ, ‘ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,’ ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.”", "a": "ಬೋವಜನು", "r": "3:15"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಕೆ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರೊಳಗೆ ಹೋದಳು.”", "a": "ಹೊತ್ತುಕೊಂಡು", "r": "3:15"}, {"n": 211, "q": "“ಬೋವಜನು ಆಕೆಗೆ, ‘ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,’ ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 212, "q": "ರೂತಳು 3:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬೋವಜನು ಆಕೆಗೆ, “ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,” ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು. ಆಕೆ ಅದನ್ನು ಹೊತ್ತುಕೊಂಡು ಊರೊಳಗೆ ಹೋದಳು.", "r": "3:15"}, {"n": 213, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬೋವಜನು ಆಕೆಗೆ, ‘ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,’ ಎಂದು ಹೇಳಿ …”", "a": "“… ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.”", "r": "3:15"}, {"n": 214, "q": "“ಆಕೆ ಅದನ್ನು ಹೊತ್ತುಕೊಂಡು ಊರೊಳಗೆ ಹೋದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ಆಕೆಗೆ, ‘ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಾಸು,’ ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.”", "a": "ಮೇಲ್ಹೊದಿಕೆಯನ್ನು", "r": "3:15"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ಆಕೆಗೆ, ‘ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,’ ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು ಇಪ್ಪತ್ತೈದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.”", "a": "ಕಿಲೋಗ್ರಾಂನಷ್ಟು; ಜವೆಗೋದಿಯನ್ನು", "r": "3:15"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ಆಕೆಗೆ, ‘ನಿನ್ನ ಮೇಲ್ಹೊದಿಕೆಯನ್ನು ಹಾಸು,’ ಎಂದು ಹೇಳಿ ಅದರಲ್ಲಿ ಸುಮಾರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿಲೋಗ್ರಾಂನಷ್ಟು ಜವೆಗೋದಿಯನ್ನು ಸುರಿದು, ಅದನ್ನೆತ್ತಿ ಹೊರಿಸಿದನು.”", "a": "ಇಪ್ಪತ್ತೈದು", "r": "3:15"}, {"n": 218, "q": "ರೂತಳು ಹಿಂದಿರುಗಿದಾಗ ಅತ್ತೆ ಏನೆಂದು ಕೇಳಿದಳು?", "a": "“ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?”", "r": "3:16"}, {"n": 219, "q": "“ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?” ಎಂದು ಅತ್ತೆ ಕೇಳಿದಾಗ ರೂತಳು ಏನು ಮಾಡಿದಳು?", "a": "ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು", "r": "3:16"}, {"n": 220, "q": "ರೂತಳು ಕಣದಿಂದ ಹಿಂದಿರುಗಿದಾಗ ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ಯಾರಿಗೆ ತಿಳಿಸಿದಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ (ನವೊಮಿಗೆ)", "r": "3:16"}, {"n": 221, "q": "“ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?” ಎಂದು ಯಾರು ಯಾರನ್ನು ಕೇಳಿದರು?", "a": "ನವೊಮಿ (ಅತ್ತೆ) ರೂತಳನ್ನು", "r": "3:16"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?’ ಎಂದು ಕೇಳಲು, ರೂತಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.”", "a": "ಬೋವಜನು", "r": "3:16"}, {"n": 223, "q": "“ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?’ ಎಂದು ಕೇಳಲು, ರೂತಳು ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 224, "q": "ರೂತಳು 3:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, “ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?” ಎಂದು ಕೇಳಲು, ರೂತಳು ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.", "r": "3:16"}, {"n": 225, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?’ …”", "a": "“… ಎಂದು ಕೇಳಲು, ರೂತಳು ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.”", "r": "3:16"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?’ ಎಂದು ಕೇಳಲು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.”", "a": "ರೂತಳು", "r": "3:16"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು ಹೋಗಿದ್ದ ಕಾರ್ಯ ಏನಾಯಿತು?’ ಎಂದು ಕೇಳಲು, ರೂತಳು ಬೋವಜನು ತನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು; ತಿಳಿಸಿದಳು", "r": "3:16"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತೆಯ ಬಳಿಗೆ ಬಂದಾಗ, ‘ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾರ್ಯ ಏನಾಯಿತು?’ ಎಂದು ಕೇಳಲು, ರೂತಳು ಬೋವಜನು ತನಗೆ ಮಾಡಿದ್ದೆಲ್ಲವನ್ನು ತಿಳಿಸಿದಳು.”", "a": "ಹೋಗಿದ್ದ", "r": "3:16"}, {"n": 229, "q": "ಬೋವಜನು ಜವೆಗೋದಿಯನ್ನು ಕೊಡುವಾಗ ರೂತಳಿಗೆ ಏನು ಹೇಳಿದನೆಂದು ಅವಳು ತಿಳಿಸಿದಳು?", "a": "“ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ”", "r": "3:17"}, {"n": 230, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟದ್ದು ಏಕೆ ಎಂದು ರೂತಳು ಹೇಳಿದಳು?", "a": "ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬಾರದೆಂದು", "r": "3:17"}, {"n": 231, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಕೊಟ್ಟ ಜವೆಗೋದಿಯ ಪ್ರಮಾಣವನ್ನು ರೂತಳು ಅತ್ತೆಗೆ ಹೇಗೆ ವರ್ಣಿಸಿದಳು?", "a": "ಇಷ್ಟೊಂದು ಜವೆಗೋದಿ", "r": "3:17"}, {"n": 232, "q": "“ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ” — ಇದು ಮೊದಲು ಯಾರ ಮಾತು? ಅದನ್ನು ನವೊಮಿಗೆ ತಿಳಿಸಿದವರು ಯಾರು?", "a": "ಬೋವಜನ ಮಾತು; ರೂತಳು ತಿಳಿಸಿದಳು", "r": "3:17"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ‘ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ ಇಷ್ಟೊಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟನು,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಜವೆಗೋದಿಯನ್ನು", "r": "3:17"}, {"n": 234, "q": "“ಇದಲ್ಲದೆ, ‘ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟನು,’ ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "3:17"}, {"n": 235, "q": "ರೂತಳು 3:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ, “ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟನು,” ಎಂದು ಹೇಳಿದಳು.", "r": "3:17"}, {"n": 236, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಲ್ಲದೆ, ‘ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು …”", "a": "“… ಹೇಳಿ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟನು,’ ಎಂದು ಹೇಳಿದಳು.”", "r": "3:17"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ‘ಅತ್ತೆಯ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟನು,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಬರಿಗೈಯಲ್ಲಿ", "r": "3:17"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜವೆಗೋದಿಯನ್ನು ಕೊಟ್ಟನು,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಇದಲ್ಲದೆ; ಇಷ್ಟೊಂದು", "r": "3:17"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ‘ಅತ್ತೆಯ ಬಳಿಗೆ ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಬೇಡ, ಎಂದು ಹೇಳಿ ಇಷ್ಟೊಂದು ಜವೆಗೋದಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:transla   function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
