<script id="src" type="application/json">{"title": "ರೂತಳು", "portion": "ರೂತಳು 1–4", "cover": false, "sections": false, "chapters": [{"chapter": 2, "label": "ಅಧ್ಯಾಯ 2", "verses": 23, "subtitle": null, "questions": [{"n": 1, "q": "ರೂತಳ ಗ್ರಂಥದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ವಿಭಾಗ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಬೋವಜನ ಹೊಲದಲ್ಲಿ ರೂತಳು", "r": "2:1"}, {"n": 2, "q": "ನವೊಮಿಯ ನೆಂಟನಾದ ಐಶ್ವರ್ಯವಂತ ಗಣ್ಯ ವ್ಯಕ್ತಿಯ ಹೆಸರೇನು?", "a": "ಬೋವಜ", "r": "2:1"}, {"n": 3, "q": "ಬೋವಜನು ಯಾರ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿದವನು?", "a": "ನವೊಮಿಯ ಪತಿ ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬಕ್ಕೆ", "r": "2:1"}, {"n": 4, "q": "ಬೋವಜನನ್ನು ಗ್ರಂಥ ಹೇಗೆ ವರ್ಣಿಸುತ್ತದೆ?", "a": "ಐಶ್ವರ್ಯವಂತ ಮತ್ತು ಒಬ್ಬ ಗಣ್ಯ ವ್ಯಕ್ತಿ", "r": "2:1"}, {"n": 5, "q": "ಬೋವಜನು ನವೊಮಿಗೆ ಏನಾಗಬೇಕು?", "a": "ನೆಂಟನು", "r": "2:1"}, {"n": 6, "q": "ರೂತಳ ಗ್ರಂಥದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಬೋವಜನು ನವೊಮಿಯ ಕುಟುಂಬಕ್ಕೆ ಸಂಬಂಧಿಕನೆಂದು ಹೇಳುವ ಮೂರು ವಚನಗಳು ಯಾವುವು?", "a": "2:1 (ನವೊಮಿಗೆ ಬೋವಜ ಎಂಬ ನೆಂಟನು); 2:3 (ಎಲಿಮೆಲೆಕನ ನೆಂಟನಾದ ಬೋವಜನು); 2:20 (ಹತ್ತಿರದ ನೆಂಟ)", "r": "2:1; 2:3; 2:20"}, {"n": 7, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲಿ ‘ಐಶ್ವರ್ಯವಂತ ಮತ್ತು ಒಬ್ಬ ಗಣ್ಯ ವ್ಯಕ್ತಿ’ ಎಂದು ವರ್ಣಿಸಲಾದವನು ಯಾರು?", "a": "ಬೋವಜ", "r": "2:1"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜ ಎಂಬ ನೆಂಟನು ಇದ್ದನು.”", "a": "ನವೊಮಿಗೆ", "r": "2:1"}, {"n": 9, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಒಬ್ಬ ಗಣ್ಯ ವ್ಯಕ್ತಿ;”", "a": "ಐಶ್ವರ್ಯವಂತ", "r": "2:1"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪತಿ ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿದವನು.”", "a": "ನವೊಮಿಯ", "r": "2:1"}, {"n": 11, "q": "“ನವೊಮಿಗೆ ಬೋವಜ ಎಂಬ ನೆಂಟನು ಇದ್ದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "2:1"}, {"n": 12, "q": "“ನವೊಮಿಯ ಪತಿ ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿದವನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "2:1"}, {"n": 13, "q": "ರೂತಳು 2:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನವೊಮಿಗೆ ಬೋವಜ ಎಂಬ ನೆಂಟನು ಇದ್ದನು. ಅವನು ಐಶ್ವರ್ಯವಂತ ಮತ್ತು ಒಬ್ಬ ಗಣ್ಯ ವ್ಯಕ್ತಿ; ನವೊಮಿಯ ಪತಿ ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿದವನು.", "r": "2:1"}, {"n": 14, "q": "ರೂತಳು ಹೊಲಗಳಿಗೆ ಹೋಗಲು ನವೊಮಿಯನ್ನು ಹೇಗೆ ಅನುಮತಿ ಕೇಳಿದಳು?", "a": "“ನಾನು ಹೊಲಗಳಿಗೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡು ಬರಲೇ?”", "r": "2:2"}, {"n": 15, "q": "ರೂತಳು ಹೊಲಗಳಿಗೆ ಹೋಗಿ ಏನನ್ನು ಆಯ್ದುಕೊಂಡು ಬರಲು ಬಯಸಿದಳು?", "a": "ತೆನೆಗಳನ್ನು", "r": "2:2"}, {"n": 16, "q": "ಹೊಲಗಳಲ್ಲಿ ತನಗೆ ಏನಾಗಬಹುದೆಂದು ರೂತಳು ನಿರೀಕ್ಷಿಸಿದಳು?", "a": "“ಇದಕ್ಕೆ ಯಾರಾದರು ನನಗೆ ನೆರವಾಗಬಹುದು”", "r": "2:2"}, {"n": 17, "q": "ರೂತಳು ತೆನೆ ಆಯಲು ಅನುಮತಿ ಕೇಳಿದಾಗ ನವೊಮಿ ಏನೆಂದು ಅಪ್ಪಣೆಕೊಟ್ಟಳು?", "a": "“ಹೋಗಿ ಬಾ, ಮಗಳೇ”", "r": "2:2"}, {"n": 18, "q": "“ಹೋಗಿ ಬಾ, ಮಗಳೇ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ನವೊಮಿ ರೂತಳಿಗೆ", "r": "2:2"}, {"n": 19, "q": "ರೂತಳ ಗ್ರಂಥದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ನವೊಮಿ ರೂತಳನ್ನು “ಮಗಳೇ” ಎಂದು ಕರೆದದ್ದು ಯಾವ ಎರಡು ಸಂದರ್ಭಗಳಲ್ಲಿ?", "a": "1) ತೆನೆ ಆಯಲು ಅಪ್ಪಣೆಕೊಟ್ಟಾಗ (2:2); 2) ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವಂತೆ ಸಲಹೆ ಕೊಟ್ಟಾಗ (2:22)", "r": "2:2; 2:19; 2:22"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ನಾನು ಹೊಲಗಳಿಗೆ ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಯ್ದುಕೊಂಡು ಬರಲೇ?”", "a": "ತೆನೆಗಳನ್ನು", "r": "2:2"}, {"n": 21, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಕ್ಕೆ ಯಾರಾದರು ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಕೇಳಿದಳು.”", "a": "ನೆರವಾಗಬಹುದು", "r": "2:2"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಹೋಗಿ ಬಾ, ಮಗಳೇ,’ ಎಂದು ಅಪ್ಪಣೆಕೊಟ್ಟಳು.”", "a": "ನವೊಮಿ", "r": "2:2"}, {"n": 23, "q": "“‘ನಾನು ಹೊಲಗಳಿಗೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡು ಬರಲೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 24, "q": "“ನವೊಮಿ, ‘ಹೋಗಿ ಬಾ, ಮಗಳೇ,’ ಎಂದು ಅಪ್ಪಣೆಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 25, "q": "ರೂತಳು 2:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ರೂತಳು ನವೊಮಿಗೆ: “ನಾನು ಹೊಲಗಳಿಗೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡು ಬರಲೇ? ಇದಕ್ಕೆ ಯಾರಾದರು ನನಗೆ ನೆರವಾಗಬಹುದು,” ಎಂದು ಕೇಳಿದಳು. ನವೊಮಿ, “ಹೋಗಿ ಬಾ, ಮಗಳೇ,” ಎಂದು ಅಪ್ಪಣೆಕೊಟ್ಟಳು.", "r": "2:2"}, {"n": 26, "q": "“ಇದಕ್ಕೆ ಯಾರಾದರು ನನಗೆ ನೆರವಾಗಬಹುದು,’ ಎಂದು ಕೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 27, "q": "ರೂತಳು ಯಾರ ಹಿಂದೆ ಹೋಗುತ್ತಾ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಕೊಯ್ಯುವವರ ಹಿಂದೆ", "r": "2:3"}, {"n": 28, "q": "ರೂತಳು ಯಾವ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು", "r": "2:3"}, {"n": 29, "q": "ರೂತಳು ತೆನೆ ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದ ಹೊಲ ಯಾರದಾಗಿತ್ತು?", "a": "ಎಲಿಮೆಲೆಕನ ನೆಂಟನಾದ ಬೋವಜನ ಹೊಲ", "r": "2:3"}, {"n": 30, "q": "ರೂತಳು ಬೋವಜನ ಹೊಲಕ್ಕೆ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ಗ್ರಂಥ ಹೇಳುತ್ತದೆ?", "a": "ಸುದೈವದಿಂದ", "r": "2:3"}, {"n": 31, "q": "ರೂತಳು ತೆನೆ ಆಯ್ದುಕೊಂಡದ್ದು ಬೋವಜನ ಹೊಲದಲ್ಲಿ ಎಂದು ನವೊಮಿಗೆ ಹೇಗೆ ತಿಳಿಯಿತು?", "a": "“ಯಾರ ಹೊಲದಲ್ಲಿ ಕೆಲಸಮಾಡಿದೆ?” ಎಂದು ನವೊಮಿ ಕೇಳಿದಾಗ ರೂತಳು, “ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು” ಎಂದು ಹೇಳಿದಳು", "r": "2:3; 2:19"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರೂತಳು ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗುತ್ತಾ ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು", "r": "2:3"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುದೈವದಿಂದ ಅದು ಎಲಿಮೆಲೆಕನ ನೆಂಟನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಲವಾಗಿತ್ತು.”", "a": "ಬೋವಜನ", "r": "2:3"}, {"n": 34, "q": "“ರೂತಳು ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗುತ್ತಾ ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 35, "q": "ರೂತಳು 2:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ರೂತಳು ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗುತ್ತಾ ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು. ಸುದೈವದಿಂದ ಅದು ಎಲಿಮೆಲೆಕನ ನೆಂಟನಾದ ಬೋವಜನ ಹೊಲವಾಗಿತ್ತು.", "r": "2:3"}, {"n": 36, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ರೂತಳು ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗುತ್ತಾ …”", "a": "“… ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು.”", "r": "2:3"}, {"n": 37, "q": "“ಸುದೈವದಿಂದ ಅದು ಎಲಿಮೆಲೆಕನ ನೆಂಟನಾದ ಬೋವಜನ ಹೊಲವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗುತ್ತಾ ಅಲ್ಲಲ್ಲಿ ಬಿದ್ದ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು.”", "a": "ರೂತಳು", "r": "2:3"}, {"n": 39, "q": "ಸ್ವಲ್ಪ ಹೊತ್ತಾದ ಮೇಲೆ ಬೋವಜನು ಎಲ್ಲಿಂದ ಹೊಲಕ್ಕೆ ಬಂದನು?", "a": "ಬೆತ್ಲೆಹೇಮಿನಿಂದ", "r": "2:4"}, {"n": 40, "q": "ಬೋವಜನು ತನ್ನ ಕೆಲಸದಾಳುಗಳನ್ನು ಹೇಗೆ ವಂದಿಸಿದನು?", "a": "“ಸರ್ವೇಶ್ವರಸ್ವಾಮಿ ನಿಮ್ಮೊಡನೆ ಇರಲಿ!”", "r": "2:4"}, {"n": 41, "q": "ಬೋವಜನ ವಂದನೆಗೆ ಕೆಲಸದಾಳುಗಳು ಹೇಗೆ ಪ್ರತಿವಂದನೆ ಮಾಡಿದರು?", "a": "“ಸರ್ವೇಶ್ವರ ನಿಮ್ಮನ್ನೂ ಹರಸಲಿ!”", "r": "2:4"}, {"n": 42, "q": "“ಸರ್ವೇಶ್ವರ ನಿಮ್ಮನ್ನೂ ಹರಸಲಿ!” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಪ್ರತಿವಂದನೆ ಮಾಡಿದರು?", "a": "ಕೆಲಸದಾಳುಗಳು ಬೋವಜನಿಗೆ", "r": "2:4"}, {"n": 43, "q": "ಬೋವಜನು ಹೊಲಕ್ಕೆ ಹೇಗೆ ಬಂದನು ಎಂದು ಗ್ರಂಥ ವರ್ಣಿಸುತ್ತದೆ?", "a": "ಇದ್ದಕ್ಕಿದ್ದ ಹಾಗೆ (ಸ್ವಲ್ಪ ಹೊತ್ತಾದ ಮೇಲೆ)", "r": "2:4"}, {"n": 44, "q": "ರೂತಳ ಗ್ರಂಥದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಬೋವಜನು ಸರ್ವೇಶ್ವರನ ಹೆಸರಿನಲ್ಲಿ ಹರಸಿದ ಇಬ್ಬರು/ಗುಂಪುಗಳು ಯಾರು?", "a": "ತನ್ನ ಕೆಲಸದಾಳುಗಳು (2:4) ಮತ್ತು ರೂತಳು (2:12)", "r": "2:4; 2:12; 2:20"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಲ್ಪ ಹೊತ್ತಾದ ಮೇಲೆ ಇದ್ದಕ್ಕಿದ್ದ ಹಾಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆತ್ಲೆಹೇಮಿನಿಂದ ಅಲ್ಲಿಗೆ ಬಂದನು.”", "a": "ಬೋವಜನು", "r": "2:4"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮೊಡನೆ ಇರಲಿ!’ ಎಂದು ಕೆಲಸದಾಳುಗಳನ್ನು ವಂದಿಸಿದನು.”", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿ", "r": "2:4"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ‘ಸರ್ವೇಶ್ವರ ನಿಮ್ಮನ್ನೂ ಹರಸಲಿ!’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ಪ್ರತಿವಂದನೆ", "r": "2:4"}, {"n": 48, "q": "“ಸ್ವಲ್ಪ ಹೊತ್ತಾದ ಮೇಲೆ ಇದ್ದಕ್ಕಿದ್ದ ಹಾಗೆ ಬೋವಜನು ಬೆತ್ಲೆಹೇಮಿನಿಂದ ಅಲ್ಲಿಗೆ ಬಂದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 49, "q": "“ಅದಕ್ಕೆ ಅವರು, ‘ಸರ್ವೇಶ್ವರ ನಿಮ್ಮನ್ನೂ ಹರಸಲಿ!’ ಎಂದು ಪ್ರತಿವಂದನೆ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 50, "q": "ರೂತಳು 2:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸ್ವಲ್ಪ ಹೊತ್ತಾದ ಮೇಲೆ ಇದ್ದಕ್ಕಿದ್ದ ಹಾಗೆ ಬೋವಜನು ಬೆತ್ಲೆಹೇಮಿನಿಂದ ಅಲ್ಲಿಗೆ ಬಂದನು. ಅವನು, “ಸರ್ವೇಶ್ವರಸ್ವಾಮಿ ನಿಮ್ಮೊಡನೆ ಇರಲಿ!” ಎಂದು ಕೆಲಸದಾಳುಗಳನ್ನು ವಂದಿಸಿದನು. ಅದಕ್ಕೆ ಅವರು, “ಸರ್ವೇಶ್ವರ ನಿಮ್ಮನ್ನೂ ಹರಸಲಿ!” ಎಂದು ಪ್ರತಿವಂದನೆ ಮಾಡಿದರು.", "r": "2:4"}, {"n": 51, "q": "“ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?” ಎಂದು ಬೋವಜನು ಯಾರನ್ನು ವಿಚಾರಿಸಿದನು?", "a": "ಮೇಸ್ತ್ರಿಯನ್ನು", "r": "2:5"}, {"n": 52, "q": "ಬೋವಜನು ರೂತಳ ಬಗ್ಗೆ ಮೇಸ್ತ್ರಿಯನ್ನು ಏನೆಂದು ವಿಚಾರಿಸಿದನು?", "a": "“ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?”", "r": "2:5"}, {"n": 53, "q": "ಬೋವಜನಿಗೆ ರೂತಳ ಪರಿಚಯ ಮಾಡಿಸಿದವನು ಯಾರು?", "a": "ಮೇಸ್ತ್ರಿ", "r": "2:5–7"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಸ್ತ್ರಿಯನ್ನು ಕರೆದು, ‘ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?’ ಎಂದು ವಿಚಾರಿಸಿದನು.”", "a": "ಬೋವಜನು", "r": "2:5"}, {"n": 55, "q": "“ಬೋವಜನು ಮೇಸ್ತ್ರಿಯನ್ನು ಕರೆದು, ‘ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?’ ಎಂದು ವಿಚಾರಿಸಿದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 56, "q": "ರೂತಳು 2:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬೋವಜನು ಮೇಸ್ತ್ರಿಯನ್ನು ಕರೆದು, “ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?” ಎಂದು ವಿಚಾರಿಸಿದನು.", "r": "2:5"}, {"n": 57, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬೋವಜನು ಮೇಸ್ತ್ರಿಯನ್ನು ಕರೆದು, ‘ಇವಳು …”", "a": "“… ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?’ ಎಂದು ವಿಚಾರಿಸಿದನು.”", "r": "2:5"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದು, ‘ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?’ ಎಂದು ವಿಚಾರಿಸಿದನು.”", "a": "ಮೇಸ್ತ್ರಿಯನ್ನು", "r": "2:5"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ಮೇಸ್ತ್ರಿಯನ್ನು ಕರೆದು, ‘ಇವಳು ಯಾವ ಮನೆಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೆಣ್ಣು; ವಿಚಾರಿಸಿದನು", "r": "2:5"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ಮೇಸ್ತ್ರಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಇವಳು ಯಾವ ಮನೆಯ ಹೆಣ್ಣು?’ ಎಂದು ವಿಚಾರಿಸಿದನು.”", "a": "ಕರೆದು", "r": "2:5"}, {"n": 61, "q": "ಮೇಸ್ತ್ರಿಯ ಪ್ರಕಾರ ರೂತಳು ಯಾವ ನಾಡಿನವಳು?", "a": "ಮೋವಾಬ್ಯಳು", "r": "2:6"}, {"n": 62, "q": "ಮೇಸ್ತ್ರಿಯ ಪ್ರಕಾರ ರೂತಳು ಯಾರ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು?", "a": "ನವೊಮಿಯ ಸಂಗಡ", "r": "2:6"}, {"n": 63, "q": "“ಇವಳು ಮೋವಾಬ್ಯಳು, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಮೇಸ್ತ್ರಿ ಬೋವಜನಿಗೆ", "r": "2:6"}, {"n": 64, "q": "ಮೋವಾಬ್ ನಾಡಿನಿಂದ ನವೊಮಿಯ ಸಂಗಡ ಹಿಂದಿರುಗಿ ಬಂದ ಮೋವಾಬ್ಯಳು ಯಾರು?", "a": "ರೂತಳು", "r": "2:6"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, ‘ಇವಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು.”", "a": "ಮೋವಾಬ್ಯಳು", "r": "2:6"}, {"n": 66, "q": "“ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, ‘ಇವಳು ಮೋವಾಬ್ಯಳು, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 67, "q": "ರೂತಳು 2:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, “ಇವಳು ಮೋವಾಬ್ಯಳು, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು.", "r": "2:6"}, {"n": 68, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, ‘ಇವಳು ಮೋವಾಬ್ಯಳು, …”", "a": "“… ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು.”", "r": "2:6"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, ‘ಇವಳು ಮೋವಾಬ್ಯಳು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಿರುಗಿ ಬಂದವಳು.”", "a": "ನವೊಮಿಯ", "r": "2:6"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಇವಳು ಮೋವಾಬ್ಯಳು, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ ನಾಡಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವಳು.”", "a": "ಮೇಸ್ತ್ರಿ; ಹಿಂದಿರುಗಿ", "r": "2:6"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮೇಸ್ತ್ರಿ, ‘ಇವಳು ಮೋವಾಬ್ಯಳು, ನವೊಮಿಯ ಸಂಗಡ ಮೋವಾಬ್ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂದಿರುಗಿ ಬಂದವಳು.”", "a": "ನಾಡಿನಿಂದ", "r": "2:6"}, {"n": 72, "q": "ರೂತಳು ಮೇಸ್ತ್ರಿಯನ್ನು ಯಾವುದಕ್ಕೆ ಅಪ್ಪಣೆ ಕೇಳಿಕೊಂಡಳು?", "a": "ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗಿ ಸಿವುಡಗಳ ಮಧ್ಯೆ ಹಕ್ಕಲಾಯ್ದುಕೊಳ್ಳುವುದಕ್ಕೆ", "r": "2:7"}, {"n": 73, "q": "ಮೇಸ್ತ್ರಿಯ ಪ್ರಕಾರ ರೂತಳು ಹೊಲಕ್ಕೆ ಯಾವಾಗ ಬಂದಿದ್ದಳು?", "a": "ಬೆಳಿಗ್ಗೆ", "r": "2:7"}, {"n": 74, "q": "ಬೋವಜನು ಬಂದಾಗ ರೂತಳು ಸದ್ಯಕ್ಕೆ ಏನು ಮಾಡುತ್ತಿದ್ದಳೆಂದು ಮೇಸ್ತ್ರಿ ಹೇಳಿದನು?", "a": "ನೆರಳಿನಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾಳೆ", "r": "2:7"}, {"n": 75, "q": "ರೂತಳು ಎಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ನೆರಳಿನಲ್ಲಿ", "r": "2:7"}, {"n": 76, "q": "ರೂತಳ ಗ್ರಂಥದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ರೂತಳು ಎಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಂಡಳು ಮತ್ತು ಯಾರ ಸಂಗಡ ಕುಳಿತು ಊಟಮಾಡಿದಳು?", "a": "ನೆರಳಿನಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಂಡಳು; ಕೊಯ್ಯುವವರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡಳು", "r": "2:7; 2:14"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗಿ ಸಿವುಡಗಳ ಮಧ್ಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಪ್ಪಣೆಯಾಗಬೇಕೆಂದು ಕೇಳಿಕೊಂಡಳು.”", "a": "ಹಕ್ಕಲಾಯ್ದುಕೊಳ್ಳುವುದಕ್ಕೆ", "r": "2:7"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವಳು ಇನ್ನೂ ಇಲ್ಲೇ ಇದ್ದಾಳೆ.”", "a": "ಬೆಳಿಗ್ಗೆ", "r": "2:7"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸದ್ಯಕ್ಕೆ ನೆರಳಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ವಿಶ್ರಮಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾಳೆ", "r": "2:7"}, {"n": 80, "q": "“ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗಿ ಸಿವುಡಗಳ ಮಧ್ಯೆ ಹಕ್ಕಲಾಯ್ದುಕೊಳ್ಳುವುದಕ್ಕೆ ಅಪ್ಪಣೆಯಾಗಬೇಕೆಂದು ಕೇಳಿಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 81, "q": "“ಸದ್ಯಕ್ಕೆ ನೆರಳಿನಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾಳೆ,’ ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 82, "q": "ರೂತಳು 2:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗಿ ಸಿವುಡಗಳ ಮಧ್ಯೆ ಹಕ್ಕಲಾಯ್ದುಕೊಳ್ಳುವುದಕ್ಕೆ ಅಪ್ಪಣೆಯಾಗಬೇಕೆಂದು ಕೇಳಿಕೊಂಡಳು. ಬೆಳಿಗ್ಗೆ ಬಂದವಳು ಇನ್ನೂ ಇಲ್ಲೇ ಇದ್ದಾಳೆ. ಸದ್ಯಕ್ಕೆ ನೆರಳಿನಲ್ಲಿ ವಿಶ್ರಮಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾಳೆ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.", "r": "2:7"}, {"n": 83, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕೊಯ್ಯುವವರ ಹಿಂದೆ ಹೋಗಿ ಸಿವುಡಗಳ …”", "a": "“… ಮಧ್ಯೆ ಹಕ್ಕಲಾಯ್ದುಕೊಳ್ಳುವುದಕ್ಕೆ ಅಪ್ಪಣೆಯಾಗಬೇಕೆಂದು ಕೇಳಿಕೊಂಡಳು.”", "r": "2:7"}, {"n": 84, "q": "ಬೋವಜನು ರೂತಳನ್ನು ಯಾವ ಸಂಬೋಧನೆಯಿಂದ ಮಾತನಾಡಿಸಿದನು?", "a": "“ನೋಡಮ್ಮಾ”", "r": "2:8"}, {"n": 85, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಬೇರೆ ಹೊಲಗಳ ಬಗ್ಗೆ ಏನು ಹೇಳಿದನು?", "a": "“ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ”", "r": "2:8"}, {"n": 86, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಯಾರ ಜೊತೆಯಲ್ಲಿಯೇ ಇರುವಂತೆ ಹೇಳಿದನು?", "a": "ತನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ", "r": "2:8"}, {"n": 87, "q": "ಬೋವಜನು ತನ್ನ ಹೊಲದಲ್ಲಿ ರೂತಳಿಗೆ ಕೊಟ್ಟ ಮೂರು ಸೌಲಭ್ಯಗಳು ಯಾವುವು?", "a": "1) ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇದ್ದು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳುವುದು; 2) ಯಾರೂ ತೊಂದರೆ ಕೊಡಬಾರದೆಂದು ಆಳುಗಳಿಗೆ ಆಜ್ಞೆ; 3) ಬಾಯಾರಿಕೆಯಾದರೆ ನೀರಿನ ಬಾನೆಗಳಿಂದ ಕುಡಿಯುವುದು", "r": "2:8–9"}, {"n": 88, "q": "ರೂತಳು ಯಾರ ಜೊತೆಯಲ್ಲಿ ಇರಬೇಕೆಂದು ಬೋವಜನೂ ನವೊಮಿಯೂ ಒಂದೇ ರೀತಿ ಹೇಳಿದರು?", "a": "ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿ", "r": "2:8; 2:22; 2:23"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತದನಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.”", "a": "ಬೋವಜನು", "r": "2:8"}, {"n": 90, "q": "“ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "2:8"}, {"n": 91, "q": "ರೂತಳು 2:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, “ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.", "r": "2:8"}, {"n": 92, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ …”", "a": "“… ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.”", "r": "2:8"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.”", "a": "ಹೋಗಬೇಕಾಗಿಲ್ಲ", "r": "2:8"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ ಹೊಲವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇರು.”", "a": "ಹೆಣ್ಣಾಳುಗಳ; ಜೊತೆಯಲ್ಲಿಯೇ", "r": "2:8"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತದನಂತರ ಬೋವಜನು ರೂತಳಿಗೆ, ‘ನೋಡಮ್ಮಾ, ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟು ಮತ್ತೆ ಎಲ್ಲಿಯೂ ತೆನೆ ಆಯಲು ಹೋಗಬೇಕಾಗಿಲ್ಲ, ನನ್ನ ಹೆಣ್ಣಾಳುಗಳ ಜೊತೆಯಲ್ಲಿಯೇ ಇರು.”", "a": "ಹೊಲವನ್ನು", "r": "2:8"}, {"n": 96, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ತೊಂದರೆ ಕೊಡಬಾರದೆಂದು ಯಾರಿಗೆ ಆಜ್ಞಾಪಿಸಿದ್ದನು?", "a": "ತನ್ನ ಆಳುಗಳಿಗೆ", "r": "2:9"}, {"n": 97, "q": "ಬಾಯಾರಿಕೆಯಾದರೆ ರೂತಳು ಏನು ಮಾಡಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "“ಹೋಗಿ ನನ್ನ ಆಳುಗಳು ತುಂಬಿಸಿರುವ ನೀರಿನ ಬಾನೆಗಳಿಂದ ಕುಡಿ”", "r": "2:9"}, {"n": 98, "q": "ರೂತಳು ಯಾರ ಹಿಂದೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಹೆಣ್ಣಾಳುಗಳು ಎಲ್ಲಿ ಪೈರು ಕೊಯ್ಯುತ್ತಾರೋ ಅವರ ಹಿಂದೆ", "r": "2:9"}, {"n": 99, "q": "ನೀರಿನ ಬಾನೆಗಳನ್ನು ತುಂಬಿಸಿದ್ದವರು ಯಾರು?", "a": "ಬೋವಜನ ಆಳುಗಳು", "r": "2:9"}, {"n": 100, "q": "ಹೆಣ್ಣಾಳುಗಳು ಎಲ್ಲಿ ಪೈರು ಕೊಯ್ಯುತ್ತಾರೋ ಅವರ ಹಿಂದೆ ಹೋಗಿ ರೂತಳು ಏನು ಮಾಡಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಬೇಕು", "r": "2:9"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಎಲ್ಲಿ ಪೈರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಹಿಂದೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊ.”", "a": "ಕೊಯ್ಯುತ್ತಾರೋ", "r": "2:9"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಯಾರೂ ತೊಂದರೆ ಕೊಡಬಾರದೆಂದು ನನ್ನ ಆಳುಗಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಜ್ಞಾಪಿಸಿದ್ದೇನೆ", "r": "2:9"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ನನ್ನ ಆಳುಗಳು ತುಂಬಿಸಿರುವ ನೀರಿನ ಬಾನೆಗಳಿಂದ ಕುಡಿ,’ ಎಂದನು.”", "a": "ಬಾಯಾರಿಕೆಯಾದರೆ", "r": "2:9"}, {"n": 104, "q": "“ಅವರು ಎಲ್ಲಿ ಪೈರು ಕೊಯ್ಯುತ್ತಾರೋ ಅವರ ಹಿಂದೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 105, "q": "“ನಿನಗೆ ಬಾಯಾರಿಕೆಯಾದರೆ ಹೋಗಿ ನನ್ನ ಆಳುಗಳು ತುಂಬಿಸಿರುವ ನೀರಿನ ಬಾನೆಗಳಿಂದ ಕುಡಿ,’ ಎಂದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 106, "q": "ರೂತಳು 2:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ಎಲ್ಲಿ ಪೈರು ಕೊಯ್ಯುತ್ತಾರೋ ಅವರ ಹಿಂದೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊ. ನಿನಗೆ ಯಾರೂ ತೊಂದರೆ ಕೊಡಬಾರದೆಂದು ನನ್ನ ಆಳುಗಳಿಗೆ ಆಜ್ಞಾಪಿಸಿದ್ದೇನೆ. ನಿನಗೆ ಬಾಯಾರಿಕೆಯಾದರೆ ಹೋಗಿ ನನ್ನ ಆಳುಗಳು ತುಂಬಿಸಿರುವ ನೀರಿನ ಬಾನೆಗಳಿಂದ ಕುಡಿ,” ಎಂದನು.", "r": "2:9"}, {"n": 107, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರು ಎಲ್ಲಿ ಪೈರು ಕೊಯ್ಯುತ್ತಾರೋ …”", "a": "“… ಅವರ ಹಿಂದೆ ಹೋಗಿ ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊ.”", "r": "2:9"}, {"n": 108, "q": "ಬೋವಜನ ಮಾತುಗಳನ್ನು ಕೇಳಿದ ರೂತಳು ಅವನಿಗೆ ಹೇಗೆ ನಮಸ್ಕರಿಸಿದಳು?", "a": "ಸಾಷ್ಟಾಂಗವೆರಗಿ ನಮಸ್ಕರಿಸಿದಳು", "r": "2:10"}, {"n": 109, "q": "ರೂತಳು ಬೋವಜನಿಗೆ ಸಾಷ್ಟಾಂಗವೆರಗಿ ಕೇಳಿದ ಮೊದಲ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಒಡೆಯಾ, ನನ್ನ ಮೇಲೆ ಏಕೆ ಇಷ್ಟು ಕನಿಕರ?”", "r": "2:10"}, {"n": 110, "q": "ರೂತಳು ಬೋವಜನ ಮುಂದೆ ತನ್ನನ್ನು ಏನೆಂದು ಕರೆದುಕೊಂಡಳು?", "a": "ಪರದೇಶಿ", "r": "2:10"}, {"n": 111, "q": "“ಪರದೇಶಿಯಾದ ನನಗೆ ತಾವಿಷ್ಟು ದಯೆತೋರಿಸುವುದೇಕೆ?” ಎಂದು ಯಾರು ಯಾರನ್ನು ಕೇಳಿದರು?", "a": "ರೂತಳು ಬೋವಜನನ್ನು", "r": "2:10"}, {"n": 112, "q": "ರೂತಳು ಬೋವಜನನ್ನು ಯಾವ ಸಂಬೋಧನೆಯಿಂದ ಕರೆದಳು?", "a": "“ಒಡೆಯಾ”", "r": "2:10"}, {"n": 113, "q": "ರೂತಳು ಬೋವಜನ ಮುಂದೆ ತನ್ನನ್ನು ಕುರಿತು ಹೇಳಿಕೊಂಡ ಎರಡು ದೀನ ನುಡಿಗಳು ಯಾವುವು?", "a": "“ಪರದೇಶಿಯಾದ ನನಗೆ…” (2:10); “ನಾನು ತಮ್ಮ ದಾಸಿ ಎನಿಸಿಕೊಳ್ಳುವುದಕ್ಕೂ ಯೋಗ್ಯಳಲ್ಲ” (2:13)", "r": "2:10; 2:13"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಸಾಷ್ಟಾಂಗವೆರಗಿ ನಮಸ್ಕರಿಸಿ, ‘ಒಡೆಯಾ, ನನ್ನ ಮೇಲೆ ಏಕೆ ಇಷ್ಟು ಕನಿಕರ?”", "a": "ರೂತಳು", "r": "2:10"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪರದೇಶಿಯಾದ ನನಗೆ ತಾವಿಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?’ ಎಂದಳು.”", "a": "ದಯೆತೋರಿಸುವುದೇಕೆ", "r": "2:10"}, {"n": 116, "q": "“ಆಗ ರೂತಳು ಅವನಿಗೆ ಸಾಷ್ಟಾಂಗವೆರಗಿ ನಮಸ್ಕರಿಸಿ, ‘ಒಡೆಯಾ, ನನ್ನ ಮೇಲೆ ಏಕೆ ಇಷ್ಟು ಕನಿಕರ?” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 117, "q": "ರೂತಳು 2:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ರೂತಳು ಅವನಿಗೆ ಸಾಷ್ಟಾಂಗವೆರಗಿ ನಮಸ್ಕರಿಸಿ, “ಒಡೆಯಾ, ನನ್ನ ಮೇಲೆ ಏಕೆ ಇಷ್ಟು ಕನಿಕರ? ಪರದೇಶಿಯಾದ ನನಗೆ ತಾವಿಷ್ಟು ದಯೆತೋರಿಸುವುದೇಕೆ?” ಎಂದಳು.", "r": "2:10"}, {"n": 118, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ರೂತಳು ಅವನಿಗೆ ಸಾಷ್ಟಾಂಗವೆರಗಿ ನಮಸ್ಕರಿಸಿ, …”", "a": "“… ‘ಒಡೆಯಾ, ನನ್ನ ಮೇಲೆ ಏಕೆ ಇಷ್ಟು ಕನಿಕರ?”", "r": "2:10"}, {"n": 119, "q": "“ಪರದೇಶಿಯಾದ ನನಗೆ ತಾವಿಷ್ಟು ದಯೆತೋರಿಸುವುದೇಕೆ?’ ಎಂದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 120, "q": "ರೂತಳ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ಅವಳು ಯಾರಿಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ ಬೋವಜನು ಕೇಳಿದ್ದನು?", "a": "ಅತ್ತೆಗಾಗಿ (ನವೊಮಿಗಾಗಿ)", "r": "2:11"}, {"n": 121, "q": "ರೂತಳು ಏನನ್ನೆಲ್ಲಾ ಬಿಟ್ಟು ಬಂದಿದ್ದಾಳೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ತನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಮತ್ತು ಸ್ವಂತನಾಡನ್ನು", "r": "2:11"}, {"n": 122, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯಾರ ಮಧ್ಯೆ ವಾಸಿಸಲು ಬಂದಿದ್ದಳು?", "a": "ಅಪರಿಚಿತರಾದ ಜನರ ಮಧ್ಯೆ", "r": "2:11"}, {"n": 123, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ದಯೆತೋರಿಸಲು ಕಾರಣವೇನೆಂದು ಅವನು ಹೇಳಿದನು?", "a": "ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ಅವಳು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ, ತಂದೆತಾಯಿಗಳನ್ನೂ ಸ್ವಂತನಾಡನ್ನೂ ಬಿಟ್ಟು ಬಂದುದನ್ನೂ ಅವನು ಕೇಳಿದ್ದರಿಂದ", "r": "2:11"}, {"n": 124, "q": "ಬೋವಜನು ರೂತಳ ಬಗ್ಗೆ ಏನನ್ನು ಕುರಿತು ಕೇಳಿದ್ದನು?", "a": "ಅವಳ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ಅವಳು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ", "r": "2:11"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನಿನ್ನ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ನೀನು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ ಕುರಿತು ಕೇಳಿದ್ದೇನೆ.”", "a": "ಬೋವಜನು", "r": "2:11"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಹೇಗೆ ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಸ್ವಂತನಾಡನ್ನು ಬಿಟ್ಟು, ಅಪರಿಚಿತರಾದ ಜನರ ಮಧ್ಯೆ ವಾಸಿಸಲು ಬಂದಿರುವೆ ಎಂಬುದು ಸಹ ನನಗೆ ತಿಳಿದಿದೆ.”", "a": "ತಂದೆತಾಯಿಗಳನ್ನು", "r": "2:11"}, {"n": 127, "q": "“ಅದಕ್ಕೆ ಬೋವಜನು, ‘ನಿನ್ನ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ನೀನು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ ಕುರಿತು ಕೇಳಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 128, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀನು ಹೇಗೆ ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಮತ್ತು ಸ್ವಂತನಾಡನ್ನು ಬಿಟ್ಟು, ಅಪರಿಚಿತರಾದ …”", "a": "“… ಜನರ ಮಧ್ಯೆ ವಾಸಿಸಲು ಬಂದಿರುವೆ ಎಂಬುದು ಸಹ ನನಗೆ ತಿಳಿದಿದೆ.”", "r": "2:11"}, {"n": 129, "q": "ರೂತಳು 2:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಬೋವಜನು, “ನಿನ್ನ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ ನೀನು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ ಕುರಿತು ಕೇಳಿದ್ದೇನೆ. ನೀನು ಹೇಗೆ ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಮತ್ತು ಸ್ವಂತನಾಡನ್ನು ಬಿಟ್ಟು, ಅಪರಿಚಿತರಾದ ಜನರ ಮಧ್ಯೆ ವಾಸಿಸಲು ಬಂದಿರುವೆ ಎಂಬುದು ಸಹ ನನಗೆ ತಿಳಿದಿದೆ.", "r": "2:11"}, {"n": 130, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಬೋವಜನು, ‘ನಿನ್ನ ಪತಿ ತೀರಿಹೋದಂದಿನಿಂದ …”", "a": "“… ನೀನು ಅತ್ತೆಗಾಗಿ ಮಾಡಿದ್ದ ಎಲ್ಲವನ್ನೂ ಕುರಿತು ಕೇಳಿದ್ದೇನೆ.”", "r": "2:11"}, {"n": 131, "q": "“ನೀನು ಹೇಗೆ ನಿನ್ನ ತಂದೆತಾಯಿಗಳನ್ನು ಮತ್ತು ಸ್ವಂತನಾಡನ್ನು ಬಿಟ್ಟು, ಅಪರಿಚಿತರಾದ ಜನರ ಮಧ್ಯೆ ವಾಸಿಸಲು ಬಂದಿರುವೆ ಎಂಬುದು ಸಹ ನನಗೆ ತಿಳಿದಿದೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 132, "q": "ರೂತಳು ಮಾಡಿದ್ದಕ್ಕೆಲ್ಲಾ ದೇವರು ಏನು ಮಾಡಲಿ ಎಂದು ಬೋವಜನು ಹರಸಿದನು?", "a": "“ದೇವರು ನಿನಗೆ ತಕ್ಕ ಪ್ರತಿಫಲವನ್ನೀಯಲಿ”", "r": "2:12"}, {"n": 133, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಯಾರ ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿದ್ದಳು?", "a": "ಇಸ್ರಯೇಲಿನ ದೇವರಾದ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಆಶ್ರಯವನ್ನು", "r": "2:12"}, {"n": 134, "q": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿ ರೂತಳಿಗೆ ಏನನ್ನು ಅನುಗ್ರಹಿಸಲಿ ಎಂದು ಬೋವಜನು ಹರಸಿದನು?", "a": "ಹೇರಳವಾದ ಆಶೀರ್ವಾದವನ್ನು", "r": "2:12"}, {"n": 135, "q": "“ಇಸ್ರಯೇಲಿನ ದೇವರಾದ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿರುವೆ” — ಇದನ್ನು ಯಾರು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು?", "a": "ಬೋವಜನು ರೂತಳ ಬಗ್ಗೆ", "r": "2:12"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ನಿನಗೆ ತಕ್ಕ ಪ್ರತಿಫಲವನ್ನೀಯಲಿ.”", "a": "ಮಾಡಿದ್ದಕ್ಕೆಲ್ಲಾ", "r": "2:12"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲಿನ ದೇವರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿರುವೆ.”", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ", "r": "2:12"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ನಿನಗೆ ಹೇರಳವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹಿಸಲಿ!’ ಎಂದನು.”", "a": "ಆಶೀರ್ವಾದವನ್ನು", "r": "2:12"}, {"n": 139, "q": "“ನೀನು ಮಾಡಿದ್ದಕ್ಕೆಲ್ಲಾ ದೇವರು ನಿನಗೆ ತಕ್ಕ ಪ್ರತಿಫಲವನ್ನೀಯಲಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 140, "q": "“ಅವರು ನಿನಗೆ ಹೇರಳವಾದ ಆಶೀರ್ವಾದವನ್ನು ಅನುಗ್ರಹಿಸಲಿ!’ ಎಂದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 141, "q": "ರೂತಳು 2:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀನು ಮಾಡಿದ್ದಕ್ಕೆಲ್ಲಾ ದೇವರು ನಿನಗೆ ತಕ್ಕ ಪ್ರತಿಫಲವನ್ನೀಯಲಿ. ಇಸ್ರಯೇಲಿನ ದೇವರಾದ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿರುವೆ. ಅವರು ನಿನಗೆ ಹೇರಳವಾದ ಆಶೀರ್ವಾದವನ್ನು ಅನುಗ್ರಹಿಸಲಿ!” ಎಂದನು.", "r": "2:12"}, {"n": 142, "q": "“ಇಸ್ರಯೇಲಿನ ದೇವರಾದ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿರುವೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 143, "q": "ಬೋವಜನ ಆಶೀರ್ವಾದದ ನಂತರ ರೂತಳು ತಾನು ಯಾವುದಕ್ಕೆ ಯೋಗ್ಯಳಲ್ಲ ಎಂದಳು?", "a": "“ನಾನು ತಮ್ಮ ದಾಸಿ ಎನಿಸಿಕೊಳ್ಳುವುದಕ್ಕೂ ಯೋಗ್ಯಳಲ್ಲ”", "r": "2:13"}, {"n": 144, "q": "ಬೋವಜನು ತನಗೆ ಏನು ಮಾಡಿದ್ದಾನೆಂದು ರೂತಳು ಹೇಳಿದಳು?", "a": "“ತಾವು ನನಗೆ ದೊಡ್ಡ ಉಪಕಾರವನ್ನು ಮಾಡಿದ್ದೀರಿ”", "r": "2:13"}, {"n": 145, "q": "ಬೋವಜನು ತನ್ನೊಡನೆ ಹೇಗೆ ಮಾತನಾಡಿದನೆಂದು ರೂತಳು ಹೇಳಿದಳು?", "a": "ಕನಿಕರಿಸಿ ಪ್ರೀತಿಯಿಂದ", "r": "2:13"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಒಡೆಯಾ, ತಾವು ನನಗೆ ದೊಡ್ಡ ಉಪಕಾರವನ್ನು ಮಾಡಿದ್ದೀರಿ.”", "a": "ರೂತಳು", "r": "2:13"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ತಮ್ಮ ದಾಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೋಗ್ಯಳಲ್ಲ.”", "a": "ಎನಿಸಿಕೊಳ್ಳುವುದಕ್ಕೂ", "r": "2:13"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನನ್ನನ್ನು ಕನಿಕರಿಸಿ ಪ್ರೀತಿಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಮಾತನಾಡಿದ್ದೀರಿ", "r": "2:13"}, {"n": 149, "q": "“ಆಗ ರೂತಳು, ‘ಒಡೆಯಾ, ತಾವು ನನಗೆ ದೊಡ್ಡ ಉಪಕಾರವನ್ನು ಮಾಡಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 150, "q": "“ಆದರೂ ನನ್ನನ್ನು ಕನಿಕರಿಸಿ ಪ್ರೀತಿಯಿಂದ ಮಾತನಾಡಿದ್ದೀರಿ,’ ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 151, "q": "ರೂತಳು 2:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ರೂತಳು, “ಒಡೆಯಾ, ತಾವು ನನಗೆ ದೊಡ್ಡ ಉಪಕಾರವನ್ನು ಮಾಡಿದ್ದೀರಿ. ನಾನು ತಮ್ಮ ದಾಸಿ ಎನಿಸಿಕೊಳ್ಳುವುದಕ್ಕೂ ಯೋಗ್ಯಳಲ್ಲ. ಆದರೂ ನನ್ನನ್ನು ಕನಿಕರಿಸಿ ಪ್ರೀತಿಯಿಂದ ಮಾತನಾಡಿದ್ದೀರಿ,” ಎಂದು ಹೇಳಿದಳು.", "r": "2:13"}, {"n": 152, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ರೂತಳು, ‘ಒಡೆಯಾ, ತಾವು …”", "a": "“… ನನಗೆ ದೊಡ್ಡ ಉಪಕಾರವನ್ನು ಮಾಡಿದ್ದೀರಿ.”", "r": "2:13"}, {"n": 153, "q": "ಬೋವಜನು ರೂತಳನ್ನು ಯಾವಾಗ ಕರೆದು ಊಟಕ್ಕೆ ಆಹ್ವಾನಿಸಿದನು?", "a": "ಊಟದ ಸಮಯದಲ್ಲಿ", "r": "2:14"}, {"n": 154, "q": "ಊಟದ ಸಮಯದಲ್ಲಿ ಬೋವಜನು ರೂತಳಿಗೆ ಏನು ಹೇಳಿದನು?", "a": "“ಇಲ್ಲಿ ಬಾ, ರೊಟ್ಟಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನು”", "r": "2:14"}, {"n": 155, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ರೊಟ್ಟಿಯನ್ನು ಯಾವುದರಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನುವಂತೆ ಹೇಳಿದನು?", "a": "ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ", "r": "2:14"}, {"n": 156, "q": "ಊಟದ ಸಮಯದಲ್ಲಿ ರೂತಳು ಯಾರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡಳು?", "a": "ಕೊಯ್ಯುವವರ ಸಂಗಡ", "r": "2:14"}, {"n": 157, "q": "ಬೋವಜನು ರೂತಳಿಗೆ ಕೊಟ್ಟ ತೆನೆಗಳು ಯಾವ ರೀತಿಯವು?", "a": "ಸುಟ್ಟ ತೆನೆಗಳು", "r": "2:14"}, {"n": 158, "q": "ರೂತಳು ತೃಪ್ತಿಯಾಗಿ ಊಟಮಾಡಿದ ಮೇಲೆ ಏನು ಮಾಡಿದಳು?", "a": "ಇನ್ನೂ ಸ್ವಲ್ಪ ಉಳಿಸಿಕೊಂಡಳು", "r": "2:14"}, {"n": 159, "q": "ರೂತಳು ಊಟದ ಸಮಯದಲ್ಲಿ ಉಳಿಸಿಕೊಂಡದ್ದನ್ನು ಕೊನೆಗೆ ಯಾರಿಗೆ ಕೊಟ್ಟಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ (ನವೊಮಿಗೆ)", "r": "2:14; 2:18"}, {"n": 160, "q": "ಊಟದ ಸಮಯದಲ್ಲಿ ಬೋವಜನು ರೂತಳಿಗೆ ಕೊಟ್ಟ ಆಹಾರಗಳು ಯಾವುವು?", "a": "ರೊಟ್ಟಿ (ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನಲು) ಮತ್ತು ಸುಟ್ಟ ತೆನೆಗಳು", "r": "2:14"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಊಟದ ಸಮಯದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳನ್ನು ಕರೆದು, ‘ಇಲ್ಲಿ ಬಾ, ರೊಟ್ಟಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನು,’ ಎಂದನು.”", "a": "ಬೋವಜನು", "r": "2:14"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಕೆಗೆ ಸುಟ್ಟ ತೆನೆಗಳನ್ನು ಕೊಟ್ಟನು.”", "a": "ಬೋವಜನು", "r": "2:14"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ತೃಪ್ತಿಯಾಗಿ ಊಟಮಾಡಿ ಇನ್ನೂ ಸ್ವಲ್ಪ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಳಿಸಿಕೊಂಡಳು", "r": "2:14"}, {"n": 164, "q": "“ಊಟದ ಸಮಯದಲ್ಲಿ ಬೋವಜನು ರೂತಳನ್ನು ಕರೆದು, ‘ಇಲ್ಲಿ ಬಾ, ರೊಟ್ಟಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನು,’ ಎಂದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 165, "q": "“ಇದಲ್ಲದೆ ಬೋವಜನು ಆಕೆಗೆ ಸುಟ್ಟ ತೆನೆಗಳನ್ನು ಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 166, "q": "ರೂತಳು 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಊಟದ ಸಮಯದಲ್ಲಿ ಬೋವಜನು ರೂತಳನ್ನು ಕರೆದು, “ಇಲ್ಲಿ ಬಾ, ರೊಟ್ಟಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ದ್ರಾಕ್ಷಾರಸದಲ್ಲಿ ಅದ್ದಿ ತಿನ್ನು,” ಎಂದನು. ಆಕೆ ಕೊಯ್ಯುವವರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡಳು. ಇದಲ್ಲದೆ ಬೋವಜನು ಆಕೆಗೆ ಸುಟ್ಟ ತೆನೆಗಳನ್ನು ಕೊಟ್ಟನು. ಅವಳು ತೃಪ್ತಿಯಾಗಿ ಊಟಮಾಡಿ ಇನ್ನೂ ಸ್ವಲ್ಪ ಉಳಿಸಿಕೊಂಡಳು.", "r": "2:14"}, {"n": 167, "q": "ರೂತಳು ಪುನಃ ತೆನೆ ಆರಿಸಲು ಹೋದಾಗ ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ ಅವಳು ಎಲ್ಲಿ ಆರಿಸಿಕೊಳ್ಳಲಿ ಎಂದನು?", "a": "ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ", "r": "2:15"}, {"n": 168, "q": "ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ರೂತಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಬಿಡುವಂತೆ ಹೇಳುವಾಗ ಬೋವಜನು ಆಳುಗಳಿಗೆ ಏನೆಂದು ಎಚ್ಚರಿಸಿದನು?", "a": "“ಅಡ್ಡಿಮಾಡಬೇಡಿ.”", "r": "2:15"}, {"n": 169, "q": "ರೂತಳ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ ಕೊಟ್ಟ ಆಜ್ಞೆಗಳು ಯಾವುವು?", "a": "1) ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ; 2) ಅಡ್ಡಿಮಾಡಬೇಡಿ; 3) ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ; 4) ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ", "r": "2:15–16"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಆಳುಗಳಿಗೆ, ‘ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ;”", "a": "ಬೋವಜನು", "r": "2:15"}, {"n": 171, "q": "“ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ, ‘ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ;” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "2:15"}, {"n": 172, "q": "ರೂತಳು 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ, “ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ; ಅಡ್ಡಿಮಾಡಬೇಡಿ.", "r": "2:15"}, {"n": 173, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, ಬೋವಜನು …”", "a": "“… ತನ್ನ ಆಳುಗಳಿಗೆ, ‘ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ;”", "r": "2:15"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದಾಗ, ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ, ‘ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ;”", "a": "ಆರಿಸಿಕೊಳ್ಳಲು", "r": "2:15"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ, ‘ಸಿವುಡುಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಳು ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮಧ್ಯದಲ್ಲೂ; ಆರಿಸಿಕೊಳ್ಳಲಿ", "r": "2:15"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಪುನಃ ಹಕ್ಕಲು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲು ಹೋದಾಗ, ಬೋವಜನು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಸಿವುಡುಗಳ ಮಧ್ಯದಲ್ಲೂ ಅವಳು ತೆನೆಗಳನ್ನು ಆರಿಸಿಕೊಳ್ಳಲಿ;”", "a": "ಆಳುಗಳಿಗೆ", "r": "2:15"}, {"n": 177, "q": "ಕೊಯ್ಯುವಾಗ ಕಟ್ಟುಗಳಿಂದ ಏನು ಮಾಡಬೇಕೆಂದು ಬೋವಜನು ತನ್ನ ಆಳುಗಳಿಗೆ ಆಜ್ಞೆಯಿತ್ತನು?", "a": "ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕುವಂತೆ", "r": "2:16"}, {"n": 178, "q": "ರೂತಳ ವಿಷಯದಲ್ಲಿ ಬೋವಜನು ಆಳುಗಳಿಗೆ ಕೊಟ್ಟ ಕೊನೆಯ ಆಜ್ಞೆ ಏನು?", "a": "“ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ”", "r": "2:16"}, {"n": 179, "q": "ಆಳುಗಳು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿದ ತೆನೆಗಳನ್ನು ಯಾರು ಆಯ್ದುಕೊಳ್ಳಲಿ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ರೂತಳು (“ಅವಳು ಆಯ್ದುಕೊಳ್ಳಲಿ”)", "r": "2:16"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "a": "ತೆನೆಗಳನ್ನು", "r": "2:16"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಜ್ಞೆಯಿತ್ತನು", "r": "2:16"}, {"n": 182, "q": "“ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 183, "q": "ರೂತಳು 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ. ಅವಳು ಆಯ್ದುಕೊಳ್ಳಲಿ; ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ,” ಎಂದು ಆಜ್ಞೆಯಿತ್ತನು.", "r": "2:16"}, {"n": 184, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು …”", "a": "“… ಕಟ್ಟುಗಳಿಂದ ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "r": "2:16"}, {"n": 185, "q": "“ಯಾರೂ ಅವಳನ್ನು ಗದರಿಸಬೇಡಿ,’ ಎಂದು ಆಜ್ಞೆಯಿತ್ತನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಕೊಯ್ಯುವಾಗ ಕೆಲವು ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿತ್ತು ಕೆಳಗೆ ಹಾಕಿರಿ.”", "a": "ಕಟ್ಟುಗಳಿಂದ", "r": "2:16"}, {"n": 187, "q": "ರೂತಳು ಯಾವ ಹೊತ್ತಿನವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು?", "a": "ಸಾಯಂಕಾಲದವರೆಗೆ", "r": "2:17"}, {"n": 188, "q": "ರೂತಳು ಆಯ್ದ ತೆನೆಗಳನ್ನು ಬಡಿದಾಗ ಎಷ್ಟು ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು?", "a": "ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು", "r": "2:17"}, {"n": 189, "q": "ರೂತಳು ಆಯ್ದ ತೆನೆಗಳನ್ನು ಬಡಿದಾಗ ಯಾವ ಧಾನ್ಯ ಸಿಕ್ಕಿತು?", "a": "ಜವೆಗೋದಿ", "r": "2:17"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.”", "a": "ರೂತಳು", "r": "2:17"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು.”", "a": "ಚೀಲದಷ್ಟು", "r": "2:17"}, {"n": 192, "q": "“ಅದರಂತೆಯೇ ರೂತಳು ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 193, "q": "ರೂತಳು 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರಂತೆಯೇ ರೂತಳು ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು. ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು.", "r": "2:17"}, {"n": 194, "q": "“ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು ಜವೆಗೋದಿ ಸಿಕ್ಕಿತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ್ನು ಬಡಿದಾಗ ಸುಮಾರು ಅರ್ಧ ಚೀಲದಷ್ಟು ಜವೆಗೋದಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಿಕ್ಕಿತು", "r": "2:17"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳು ಸಾಯಂಕಾಲದವರೆಗೆ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಂಡಳು.”", "a": "ಅದರಂತೆಯೇ", "r": "2:17"}, {"n": 197, "q": "ಜವೆಗೋದಿಯನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋದ ರೂತಳು ಏನು ಮಾಡಿದಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು", "r": "2:18"}, {"n": 198, "q": "ರೂತಳು ತನ್ನ ಆಹಾರದಿಂದ ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ಏನು ಮಾಡಿದಳು?", "a": "ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು", "r": "2:18"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು.”", "a": "ತೆಗೆದುಕೊಂಡು", "r": "2:18"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ತನ್ನ ಆಹಾರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.”", "a": "ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು", "r": "2:18"}, {"n": 201, "q": "“ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 202, "q": "ರೂತಳು 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ ತೋರಿಸಿದಳು. ಅಂತೆಯೇ ತನ್ನ ಆಹಾರದಿಂದ ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.", "r": "2:18"}, {"n": 203, "q": "“ಅಂತೆಯೇ ತನ್ನ ಆಹಾರದಿಂದ ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ಊರೊಳಕ್ಕೆ ಹೋಗಿ ತನ್ನ ಅತ್ತೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸಿದಳು", "r": "2:18"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿಸಿಟ್ಟಿದ್ದನ್ನು ತನ್ನ ಅತ್ತೆಗೆ ಕೊಟ್ಟಳು.”", "a": "ಆಹಾರದಿಂದ", "r": "2:18"}, {"n": 206, "q": "ರೂತಳು ತಂದ ಜವೆಗೋದಿಯನ್ನು ನೋಡಿ ನವೊಮಿ ಕೇಳಿದ ಎರಡು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ? ಯಾರ ಹೊಲದಲ್ಲಿ ಕೆಲಸಮಾಡಿದೆ?”", "r": "2:19"}, {"n": 207, "q": "ರೂತಳಿಗೆ ದಯೆ ತೋರಿಸಿದವನನ್ನು ನವೊಮಿ ಹೇಗೆ ಹರಸಿದಳು?", "a": "“ನಿನಗೆ ದಯೆ ತೋರಿಸಿದವನಿಗೆ ಶುಭವಾಗಲಿ!”", "r": "2:19"}, {"n": 208, "q": "ತಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲದ ಬಗ್ಗೆ ರೂತಳು ನವೊಮಿಗೆ ಏನೆಂದು ಹೇಳಿದಳು?", "a": "“ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು”", "r": "2:19"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ?”", "a": "ನವೊಮಿ", "r": "2:19"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ದಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶುಭವಾಗಲಿ!’ ಎಂದಳು.”", "a": "ತೋರಿಸಿದವನಿಗೆ", "r": "2:19"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ರೂತಳು, ‘ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಹೇಳಿದಳು.”", "a": "ಬೋವಜನದು", "r": "2:19"}, {"n": 212, "q": "“ಅದನ್ನು ನೋಡಿ ನವೊಮಿ, ‘ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ?” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 213, "q": "“ಅದಕ್ಕೆ ರೂತಳು, ‘ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು,’ ಎಂದು ಹೇಳಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 214, "q": "ರೂತಳು 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದನ್ನು ನೋಡಿ ನವೊಮಿ, “ನೀನು ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ? ಯಾರ ಹೊಲದಲ್ಲಿ ಕೆಲಸಮಾಡಿದೆ? ನಿನಗೆ ದಯೆ ತೋರಿಸಿದವನಿಗೆ ಶುಭವಾಗಲಿ!” ಎಂದಳು. ಅದಕ್ಕೆ ರೂತಳು, “ನಾನು ತೆನೆ ಆಯ್ದುಕೊಂಡ ಹೊಲವು ಬೋವಜನದು,” ಎಂದು ಹೇಳಿದಳು.", "r": "2:19"}, {"n": 215, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದನ್ನು ನೋಡಿ ನವೊಮಿ, ‘ನೀನು …”", "a": "“… ಈ ದಿನ ಎಲ್ಲ ಹಕ್ಕಲಾಯ್ದೆ?”", "r": "2:19"}, {"n": 216, "q": "ರೂತಳು ಬೋವಜನ ಹೆಸರನ್ನು ಹೇಳಿದಾಗ ನವೊಮಿ ಹೇಗೆ ಪ್ರತಿಕ್ರಿಯಿಸಿದಳು?", "a": "ಆವೇಶದಿಂದ ಹರಸಿದಳು", "r": "2:20"}, {"n": 217, "q": "ಬೋವಜನನ್ನು ಆಶೀರ್ವದಿಸುವಾಗ ನವೊಮಿ ಸರ್ವೇಶ್ವರನನ್ನು ಹೇಗೆ ವರ್ಣಿಸಿದಳು?", "a": "“ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ”", "r": "2:20"}, {"n": 218, "q": "ಸರ್ವೇಶ್ವರ ಯಾರಿಗೆ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುತ್ತಾರೆ ಎಂದು ನವೊಮಿ ಹೇಳಿದಳು?", "a": "ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ", "r": "2:20"}, {"n": 219, "q": "ನವೊಮಿ ಬೋವಜನ ಬಗ್ಗೆ ರೂತಳಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದಳು?", "a": "“ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು”", "r": "2:20"}, {"n": 220, "q": "“ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ” — ಇಲ್ಲಿ ‘ಆ ಮನುಷ್ಯ’ ಯಾರು?", "a": "ಬೋವಜನು", "r": "2:20"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ತಿಳಿಸಿದಳು.”", "a": "ಪೋಷಿಸಬೇಕಾದವನು", "r": "2:20"}, {"n": 222, "q": "“‘ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು,’ ಎಂದು ತಿಳಿಸಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 223, "q": "ರೂತಳು 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿದ ನವೊಮಿ ಆವೇಶದಿಂದ, “ಜೀವಂತರಿಗೂ ಮೃತರಿಗೂ ಮಾಡಿದ ವಾಗ್ದಾನಗಳನ್ನು ನೆರವೇರಿಸುವ ಸರ್ವೇಶ್ವರ ಅವನನ್ನು ಆಶೀರ್ವದಿಸಲಿ!” ಎಂದು ಹರಸಿ, “ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು,” ಎಂದು ತಿಳಿಸಿದಳು.", "r": "2:20"}, {"n": 224, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “‘ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ …”", "a": "“… ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು,’ ಎಂದು ತಿಳಿಸಿದಳು.”", "r": "2:20"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಆ ಮನುಷ್ಯ ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು,’ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದಳು", "r": "2:20"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಆ ಮನುಷ್ಯ ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಂಟ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೋಷಿಸಬೇಕಾದವನು,’ ಎಂದು ತಿಳಿಸಿದಳು.”", "a": "ಹತ್ತಿರದ; ನಮ್ಮನ್ನು", "r": "2:20"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “‘ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆ ಹತ್ತಿರದ ನೆಂಟ, ನಮ್ಮನ್ನು ಪೋಷಿಸಬೇಕಾದವನು,’ ಎಂದು ತಿಳಿಸಿದಳು.”", "a": "ಮನುಷ್ಯ", "r": "2:20"}, {"n": 228, "q": "ಬೋವಜನು ತನಗೆ ಏನು ಹೇಳಿದ್ದಾನೆಂದು ರೂತಳು ನವೊಮಿಗೆ ತಿಳಿಸಿದಳು?", "a": "“ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ”", "r": "2:21"}, {"n": 229, "q": "ಬೋವಜನ ಪ್ರಕಾರ ರೂತಳು ಎಲ್ಲಿಯವರೆಗೂ ಅವನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದಿತ್ತು?", "a": "ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ", "r": "2:21"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ‘ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,’ ಎಂದಳು.”", "a": "ರೂತಳು", "r": "2:21"}, {"n": 231, "q": "“ಇದಲ್ಲದೆ ರೂತಳು, ‘ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,’ ಎಂದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 232, "q": "ರೂತಳು 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಲ್ಲದೆ ರೂತಳು, “ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,” ಎಂದಳು.", "r": "2:21"}, {"n": 233, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ‘ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ …”", "a": "“… ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,’ ಎಂದಳು.”", "r": "2:21"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ‘ಸುಗ್ಗಿಕಾಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,’ ಎಂದಳು.”", "a": "ತೀರುವವರೆಗೂ", "r": "2:21"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ‘ಸುಗ್ಗಿಕಾಲ ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದಳು.”", "a": "ಇರಬಹುದೆಂದು; ಹೇಳಿದ್ದಾನೆ", "r": "2:21"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ರೂತಳು, ‘<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀರುವವರೆಗೂ ನನ್ನ ಆಳುಗಳ ಜೊತೆಯಲ್ಲೇ ಇರಬಹುದೆಂದು ಹೇಳಿದ್ದಾನೆ,’ ಎಂದಳು.”", "a": "ಸುಗ್ಗಿಕಾಲ", "r": "2:21"}, {"n": 237, "q": "ರೂತಳು ಯಾರ ಸಂಗಡ ಇರುವುದು ಒಳ್ಳೆಯದು ಎಂದು ನವೊಮಿ ಸಲಹೆ ಕೊಟ್ಟಳು?", "a": "“ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು”", "r": "2:22"}, {"n": 238, "q": "ರೂತಳು ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡವೇ ಇರಬೇಕೆಂದು ನವೊಮಿ ಏಕೆ ಸಲಹೆ ಕೊಟ್ಟಳು?", "a": "ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ಅವಳಿಗೆ ತೊಂದರೆಯಾದೀತು ಎಂದು", "r": "2:22"}, {"n": 239, "q": "ನವೊಮಿ ರೂತಳಿಗೆ ಸಲಹೆ ಕೊಡುವಾಗ ಅವಳನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದಳು?", "a": "“ಮಗಳೇ”", "r": "2:22"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಸೊಸೆಗೆ, ‘ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "a": "ನವೊಮಿ", "r": "2:22"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,’ ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.”", "a": "ತೊಂದರೆಯಾದೀತು", "r": "2:22"}, {"n": 242, "q": "“ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ‘ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 243, "q": "ರೂತಳು 2:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, “ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು; ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ನಿನಗೆ ತೊಂದರೆಯಾದೀತು,” ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.", "r": "2:22"}, {"n": 244, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ‘ಹೌದು, ಮಗಳೇ, …”", "a": "“… ನೀನು ಆತನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "r": "2:22"}, {"n": 245, "q": "“ಬೇರೆಯವರ ಹೊಲದಲ್ಲಿ ನಿನಗೆ ತೊಂದರೆಯಾದೀತು,’ ಎಂದು ಸಲಹೆ ಕೊಟ್ಟಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನವೊಮಿ ತನ್ನ ಸೊಸೆಗೆ, ‘ಹೌದು, ಮಗಳೇ, ನೀನು ಆತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ಇರುವುದೇ ಒಳ್ಳೆಯದು;”", "a": "ಹೆಣ್ಣಾಳುಗಳ", "r": "2:22"}, {"n": 247, "q": "ರೂತಳು ಯಾವ ಸುಗ್ಗಿಗಳು ಮುಗಿಯುವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಿದ್ದಳು?", "a": "ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ", "r": "2:23"}, {"n": 248, "q": "ಸುಗ್ಗಿಕಾಲದಲ್ಲಿ ರೂತಳು ಎಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದಳು?", "a": "ಅತ್ತೆಯ ಮನೆಯಲ್ಲೇ", "r": "2:23"}, {"n": 249, "q": "ಸುಗ್ಗಿ ಮುಗಿಯುವವರೆಗೂ ರೂತಳು ಯಾರ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು?", "a": "ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ", "r": "2:23"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "a": "ರೂತಳು", "r": "2:23"}, {"n": 251, "q": "“ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;” — ಈ ಮಾತುಗಳು ರೂತಳು 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "2:23"}, {"n": 252, "q": "ರೂತಳು 2:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು; ಅತ್ತೆಯ ಮನೆಯಲ್ಲೇ ವಾಸಿಸುತ್ತಿದ್ದಳು.", "r": "2:23"}, {"n": 253, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ …”", "a": "“… ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "r": "2:23"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "a": "ಬೋವಜನ", "r": "2:23"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನ ಹೆಣ್ಣಾಳುಗಳ ಸಂಗಡ ತೆನೆಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಳು;”", "a": "ಮುಗಿಯವವರೆಗೂ; ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ", "r": "2:23"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೆ ರೂತಳು ಜವೆಗೋದಿ ಮತ್ತು ಗೋದಿಯ ಸುಗ್ಗಿ ಮುಗಿಯವವರೆಗೂ ಬೋವಜನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಗಡ ತೆನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದಳು;”", "a": "ಹೆಣ್ಣಾಳುಗಳ", "r": "2:23"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
