<script id="src" type="application/json">{"title": "ರೂತಳು", "portion": "ರೂತಳು 1–4", "cover": false, "chapters": [{"chapter": 4, "label": "ಅಧ್ಯಾಯ 4", "verses": 22, "questions": [{"n": 1, "q": "ರೂತಳ ಗ್ರಂಥದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ವಿಭಾಗ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಬೋವಜನೊಂದಿಗೆ ರೂತಳ ವಿವಾಹ", "r": "4:1"}, {"n": 2, "q": "ಬೋವಜನು ಊರಿನ ಯಾವ ಸ್ಥಳದ ಬಳಿ ಹೋಗಿ ಕುಳಿತುಕೊಂಡನು?", "a": "ಊರಿನ ಸಭಾಮಂಟಪದ ಬಳಿ", "r": "4:1"}, {"n": 3, "q": "ಬೋವಜ ಮತ್ತು ರೂತಳ ವಿವಾಹದ ವ್ಯವಹಾರ ಎಲ್ಲಿ, ಯಾರ ಸಮ್ಮುಖದಲ್ಲಿ ನಡೆಯಿತು?", "a": "ಊರಿನ ಸಭಾಮಂಟಪದ ಬಳಿ; ಊರಿನ ಹಿರಿಯರು ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರ ಸಮ್ಮುಖದಲ್ಲಿ", "r": "4:1; 4:11"}, {"n": 4, "q": "ರೂತಳ ಗ್ರಂಥದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಆರಂಭದಲ್ಲಿ ಸಭಾಮಂಟಪದ ಬಳಿ ಹೋಗಿ ಕುಳಿತುಕೊಂಡವನು ಯಾರು?", "a": "ಬೋವಜನು", "r": "4:1"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರಿನ ಸಭಾಮಂಟಪದ ಬಳಿ ಹೋಗಿ ಅಲ್ಲಿ ಕುಳಿತುಕೊಂಡನು.”", "a": "ಬೋವಜನು", "r": "4:1"}, {"n": 6, "q": "“ಇತ್ತ ಬೋವಜನು ಊರಿನ ಸಭಾಮಂಟಪದ ಬಳಿ ಹೋಗಿ ಅಲ್ಲಿ ಕುಳಿತುಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "4:1"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತ್ತ ಬೋವಜನು ಊರಿನ ಸಭಾಮಂಟಪದ ಬಳಿ ಹೋಗಿ ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತುಕೊಂಡನು", "r": "4:1"}, {"n": 8, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇತ್ತ ಬೋವಜನು ಊರಿನ ಸಭಾಮಂಟಪದ …”", "a": "“… ಬಳಿ ಹೋಗಿ ಅಲ್ಲಿ ಕುಳಿತುಕೊಂಡನು.”", "r": "4:1"}, {"n": 9, "q": "ಬೋವಜನು ಸಭಾಮಂಟಪದ ಬಳಿ ಕುಳಿತಿದ್ದಾಗ ಅಲ್ಲಿಗೆ ಬಂದವನು ಯಾರು?", "a": "ಬೋವಜನು ಮುಂಚೆ ಹೇಳಿದ್ದ ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು", "r": "4:2"}, {"n": 10, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಬಂದಾಗ ಬೋವಜನು ಅವನನ್ನು ಹೇಗೆ ಕರೆದನು?", "a": "“ಬಾರಪ್ಪಾ, ಇಲ್ಲಿ ಕುಳಿತುಕೊ”", "r": "4:2"}, {"n": 11, "q": "ಬೋವಜನು ಕರೆದಾಗ ಹತ್ತಿರದ ನೆಂಟನು ಎಲ್ಲಿ ಕುಳಿತುಕೊಂಡನು?", "a": "ಬೋವಜನ ಪಕ್ಕದಲ್ಲೇ", "r": "4:2"}, {"n": 12, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಯಾರಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದನು?", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ", "r": "4:2"}, {"n": 13, "q": "ರೂತಳ ಗ್ರಂಥದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರು ತಿಳಿಸದೆ ‘ನೆಂಟನು’, ‘ಆ ವ್ಯಕ್ತಿ’ ಎಂದು ಕರೆಯಲಾದವನು ಯಾರು?", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು (ಬೋವಜನಿಗಿಂತಲೂ ಹತ್ತಿರದ ನೆಂಟನು)", "r": "4:2; 4:6; 4:8"}, {"n": 14, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಸಭಾಮಂಟಪದ ಬಳಿಗೆ ಯಾವಾಗ ಬಂದನು?", "a": "ಬೋವಜನು ಅಲ್ಲಿ ಹೋಗಿ ಕುಳಿತುಕೊಂಡಿದ್ದಷ್ಟರಲ್ಲಿ", "r": "4:2"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಂಚೆ ಹೇಳಿದ್ದ ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು ಅಲ್ಲಿಗೆ ಬಂದನು.”", "a": "ಬೋವಜನು", "r": "4:2"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಾರಪ್ಪಾ, ಇಲ್ಲಿ ಕುಳಿತುಕೊ, ಎಂದು ಕರೆಯಲು, ಅವನು ಬಂದು ಪಕ್ಕದಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತುಕೊಂಡನು", "r": "4:2"}, {"n": 17, "q": "“ಅಷ್ಟರಲ್ಲಿ, ಬೋವಜನು ಮುಂಚೆ ಹೇಳಿದ್ದ ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು ಅಲ್ಲಿಗೆ ಬಂದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "4:2"}, {"n": 18, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಬಾರಪ್ಪಾ, ಇಲ್ಲಿ ಕುಳಿತುಕೊ, ಎಂದು …”", "a": "“… ಕರೆಯಲು, ಅವನು ಬಂದು ಪಕ್ಕದಲ್ಲೇ ಕುಳಿತುಕೊಂಡನು.”", "r": "4:2"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ, ಬೋವಜನು ಮುಂಚೆ ಹೇಳಿದ್ದ ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಗೆ ಬಂದನು.”", "a": "ನೆಂಟನಾಗಿದ್ದವನು", "r": "4:2"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಾರಪ್ಪಾ, ಇಲ್ಲಿ ಕುಳಿತುಕೊ, ಎಂದು ಕರೆಯಲು, ಅವನು ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುಳಿತುಕೊಂಡನು.”", "a": "ಪಕ್ಕದಲ್ಲೇ", "r": "4:2"}, {"n": 21, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ, ಬೋವಜನು ಮುಂಚೆ ಹೇಳಿದ್ದ …”", "a": "“… ಎಲಿಮೆಲೆಕನಿಗೆ ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು ಅಲ್ಲಿಗೆ ಬಂದನು.”", "r": "4:2"}, {"n": 22, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬೋವಜನು ಮುಂಚೆ ಹೇಳಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹತ್ತಿರದ ನೆಂಟನಾಗಿದ್ದವನು ಅಲ್ಲಿಗೆ ಬಂದನು.”", "a": "ಅಷ್ಟರಲ್ಲಿ; ಎಲಿಮೆಲೆಕನಿಗೆ", "r": "4:2"}, {"n": 23, "q": "“ಬಾರಪ್ಪಾ, ಇಲ್ಲಿ ಕುಳಿತುಕೊ, ಎಂದು ಕರೆಯಲು, ಅವನು ಬಂದು ಪಕ್ಕದಲ್ಲೇ ಕುಳಿತುಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "4:2"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಕರೆಯಲು, ಅವನು ಬಂದು ಪಕ್ಕದಲ್ಲೇ ಕುಳಿತುಕೊಂಡನು.”", "a": "ಬಾರಪ್ಪಾ; ಕುಳಿತುಕೊ", "r": "4:2"}, {"n": 25, "q": "ಬೋವಜನು ಹಿರಿಯರಲ್ಲಿ ಎಷ್ಟು ಮಂದಿಯನ್ನು ಕರೆಸಿದನು?", "a": "ಹತ್ತುಮಂದಿಯನ್ನು", "r": "4:3"}, {"n": 26, "q": "ಬೋವಜನು ಸಭಾಮಂಟಪದ ಬಳಿಗೆ ಕರೆಸಿದ ಹತ್ತುಮಂದಿ ಯಾರು?", "a": "ಊರಿನ ಹಿರಿಯರು", "r": "4:3"}, {"n": 27, "q": "ಬೋವಜನು ಹತ್ತಿರದ ನೆಂಟನಿಗೆ ಯಾವ ಹೊಲದ ಬಗ್ಗೆ ತಿಳಿಸಿದನು?", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲ", "r": "4:3"}, {"n": 28, "q": "ಎಲಿಮೆಲೆಕನಿಗೆ ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲವನ್ನು ಮಾರಬೇಕೆಂದಿದ್ದವಳು ಯಾರು?", "a": "ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಕ್ಕೆ ಬಂದಿರುವ ನವೊಮಿ", "r": "4:3"}, {"n": 29, "q": "ಹೊಲದ ಮಾರಾಟದ ವಿಷಯವನ್ನು ತಿಳಿಸಿದ ಮೇಲೆ ಬೋವಜನು ನೆಂಟನಿಗೆ ಏನೆಂದನು?", "a": "“ಇದನ್ನು ನಿನಗೆ ತಿಳಿಸಬೇಕೆನಿಸಿತು.”", "r": "4:3"}, {"n": 30, "q": "ಹೊಲದ ವ್ಯವಹಾರದಲ್ಲಿ ಮಾರುವವಳು ಯಾರು, ಕೊಂಡುಕೊಂಡವನು ಯಾರು?", "a": "ಮಾರುವವಳು ನವೊಮಿ; ಕೊಂಡುಕೊಂಡವನು ಬೋವಜನು", "r": "4:3; 4:9"}, {"n": 31, "q": "ನವೊಮಿ ಯಾವ ನಾಡಿನಿಂದ ಹಿಂದಕ್ಕೆ ಬಂದಿದ್ದಳೆಂದು ಬೋವಜನು ನೆಂಟನಿಗೆ ಹೇಳಿದನು?", "a": "ಮೋವಾಬ್ ನಾಡಿನಿಂದ", "r": "4:3"}, {"n": 32, "q": "ಬೋವಜನು ಕರೆಸಿದ ಹಿರಿಯರು ಬಂದು ಏನು ಮಾಡಿದರು?", "a": "ಅಲ್ಲಿಗೆ ಬಂದು ಕುಳಿತುಕೊಂಡರು", "r": "4:3"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿರಿಯರಲ್ಲಿ ಹತ್ತುಮಂದಿಯನ್ನು ಕರೆಸಿದನು.”", "a": "ಬೋವಜನು", "r": "4:3"}, {"n": 34, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೂ ಅಲ್ಲಿಗೆ ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತುಕೊಂಡರು", "r": "4:3"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ನೆಂಟನಿಗೆ, ನಮಗೆ ಸ್ವಂತ ದವನಾದ ಎಲಿಮೆಲೆಕನಿಗೆ ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲ ಇದೆಯಲ್ಲವೇ?”", "a": "ಬೋವಜನು", "r": "4:3"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಮೋವಾಬ್ ನಾಡಿನಿಂದ ಹಿಂದಕ್ಕೆ ಬಂದಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರಬೇಕೆಂದಿದ್ದಾಳೆ.”", "a": "ನವೊಮಿಯು", "r": "4:3"}, {"n": 37, "q": "“ಆಮೇಲೆ ಬೋವಜನು ಹಿರಿಯರಲ್ಲಿ ಹತ್ತುಮಂದಿಯನ್ನು ಕರೆಸಿದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "4:3"}, {"n": 38, "q": "“ಅನಂತರ ಬೋವಜನು ಆ ನೆಂಟನಿಗೆ, ನಮಗೆ ಸ್ವಂತ ದವನಾದ ಎಲಿಮೆಲೆಕನಿಗೆ ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲ ಇದೆಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "4:3"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಮೇಲೆ ಬೋವಜನು ಹಿರಿಯರಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆಸಿದನು.”", "a": "ಹತ್ತುಮಂದಿಯನ್ನು", "r": "4:3"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದು ಕುಳಿತುಕೊಂಡರು.”", "a": "ಅಲ್ಲಿಗೆ", "r": "4:3"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ಬೋವಜನು ಆ ನೆಂಟನಿಗೆ, ನಮಗೆ ಸ್ವಂತ ದವನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲ ಇದೆಯಲ್ಲವೇ?”", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ", "r": "4:3"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನಿಂದ ಹಿಂದಕ್ಕೆ ಬಂದಿರುವ ನವೊಮಿಯು ಮಾರಬೇಕೆಂದಿದ್ದಾಳೆ.”", "a": "ಮೋವಾಬ್", "r": "4:3"}, {"n": 43, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅನಂತರ ಬೋವಜನು ಆ ನೆಂಟನಿಗೆ, ನಮಗೆ ಸ್ವಂತ …”", "a": "“… ದವನಾದ ಎಲಿಮೆಲೆಕನಿಗೆ ಸೇರಿದ ಒಂದು ತುಂಡು ಹೊಲ ಇದೆಯಲ್ಲವೇ?”", "r": "4:3"}, {"n": 44, "q": "ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಮೊದಲು ಯಾರಿಗೆ, ಅನಂತರ ಯಾರಿಗೆ ಸೇರಿದ್ದು ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಮೊದಲು ಹತ್ತಿರದ ನೆಂಟನಿಗೆ, ಅನಂತರ ಬೋವಜನಿಗೆ; ಬೇರೆಯವರಿಗಲ್ಲ", "r": "4:4"}, {"n": 45, "q": "ಹೊಲವನ್ನು ಯಾರ ಮುಂದೆ ಕೊಂಡುಕೊಳ್ಳಬೇಕೆಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಇಲ್ಲಿ ಕುಳಿತಿರುವ ಹಿರಿಯರ ಮುಂದೆ", "r": "4:4"}, {"n": 46, "q": "ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ವಿಷಯದಲ್ಲಿ ಹತ್ತಿರದ ನೆಂಟನು ಮೊದಲು ಏನೆಂದು ಉತ್ತರಿಸಿದನು?", "a": "“ನಾನೇ ಕೊಂಡುಕೊಳ್ಳುತ್ತೇನೆ”", "r": "4:4"}, {"n": 47, "q": "“ನಾನೇ ಕೊಂಡುಕೊಳ್ಳುತ್ತೇನೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಹತ್ತಿರದ ನೆಂಟನು ಬೋವಜನಿಗೆ", "r": "4:4"}, {"n": 48, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಮೊದಲು “ನಾನೇ ಕೊಂಡುಕೊಳ್ಳುತ್ತೇನೆ” ಎಂದು, ನಂತರ ಹಕ್ಕನ್ನು ಬಿಟ್ಟುಕೊಟ್ಟದ್ದು ಏಕೆ?", "a": "ಹೊಲದ ಜೊತೆಗೆ ಮೋವಾಬದ ರೂತಳನ್ನು ಮದುವೆಯಾಗಬೇಕೆಂದು ಬೋವಜನು ತಿಳಿಸಿದ್ದರಿಂದ; ಇಲ್ಲದಿದ್ದರೆ ತನ್ನ ಕುಟುಂಬದ ಆಸ್ತಿಗೆ ನಷ್ಟವಾಗುತ್ತದೆ ಎಂದು", "r": "4:4; 4:6"}, {"n": 49, "q": "ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಯಾರಿಗೆ ಇಲ್ಲ ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಬೇರೆಯವರಿಗಲ್ಲ (ತಮ್ಮಿಬ್ಬರನ್ನು ಬಿಟ್ಟು ಬೇರೆ ಯಾರಿಗೂ ಇಲ್ಲ)", "r": "4:4"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಹೊಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ ಇಲ್ಲಿ ಕುಳಿತಿರುವ ಹಿರಿಯರ ಮುಂದೆ ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಮೊದಲು ನಿನಗೆ, ಅನಂತರ ನನಗೆ ಸೇರಿದ್ದು;”", "a": "ಕೊಂಡುಕೊಳ್ಳಲು", "r": "4:4"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದನು.”", "a": "ಕೊಂಡುಕೊಳ್ಳುತ್ತೇನೆ", "r": "4:4"}, {"n": 52, "q": "“ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲು ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ ಇಲ್ಲಿ ಕುಳಿತಿರುವ ಹಿರಿಯರ ಮುಂದೆ ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಮೊದಲು ನಿನಗೆ, ಅನಂತರ ನನಗೆ ಸೇರಿದ್ದು;” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "4:4"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲು ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ ಇಲ್ಲಿ ಕುಳಿತಿರುವ ಹಿರಿಯರ ಮುಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಕ್ಕು ಮೊದಲು ನಿನಗೆ, ಅನಂತರ ನನಗೆ ಸೇರಿದ್ದು;”", "a": "ಕೊಂಡುಕೊಳ್ಳುವ", "r": "4:4"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಂಡುಕೊಳ್ಳುತ್ತೇನೆ, ಎಂದು ಹೇಳಿದನು.”", "a": "ನಾನೇ", "r": "4:4"}, {"n": 55, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲು ನಿನಗೆ ಮನಸ್ಸಿದ್ದರೆ ಇಲ್ಲಿ ಕುಳಿತಿರುವ ಹಿರಿಯರ …”", "a": "“… ಮುಂದೆ ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಮೊದಲು ನಿನಗೆ, ಅನಂತರ ನನಗೆ ಸೇರಿದ್ದು;”", "r": "4:4"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳಲು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿರಿಯರ ಮುಂದೆ ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕು ಮೊದಲು ನಿನಗೆ, ಅನಂತರ ನನಗೆ ಸೇರಿದ್ದು;”", "a": "ಮನಸ್ಸಿದ್ದರೆ; ಕುಳಿತಿರುವ", "r": "4:4"}, {"n": 57, "q": "ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವವನು ಯಾರನ್ನು ಮದುವೆಯಾಗಬೇಕೆಂದು ಬೋವಜನು ತಿಳಿಸಿದನು?", "a": "ನವೊಮಿಯ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು", "r": "4:5"}, {"n": 58, "q": "ಹೊಲ ಕೊಂಡವನು ರೂತಳನ್ನು ಮದುವೆಯಾದರೆ ಹೊಲದ ಖಾತೆ ಯಾರ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುತ್ತದೆ?", "a": "ಗತಿಸಿದ ಮಗನ ಹೆಸರಿನಲ್ಲೇ", "r": "4:5"}, {"n": 59, "q": "ಹೊಲವನ್ನು ಕೊಳ್ಳುವವನಿಗೆ ಬೋವಜನು ತಿಳಿಸಿದ ಷರತ್ತು ಏನು?", "a": "“ನೀನು ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ, ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು ಮದುವೆಯಾಗಬೇಕು.”", "r": "4:5"}, {"n": 60, "q": "ರೂತಳ ಗ್ರಂಥದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಗತಿಸಿದ ಮಗ” ಎಂದು ಹೇಳಿರುವುದು ಯಾರನ್ನು?", "a": "ಮಹ್ಲೋನನನ್ನು", "r": "4:5; 4:10"}, {"n": 61, "q": "ಬೋವಜನು ರೂತಳನ್ನು ನೆಂಟನಿಗೆ ಯಾರ ಸೊಸೆ ಎಂದು ಪರಿಚಯಿಸಿದನು?", "a": "ನವೊಮಿಯ ಸೊಸೆ (ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳು)", "r": "4:5"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀನು ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ, ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು ಮದುವೆಯಾಗಬೇಕು.”", "a": "ಬೋವಜನು", "r": "4:5"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಗನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿಯುತ್ತದೆ, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಹೆಸರಿನಲ್ಲೇ", "r": "4:5"}, {"n": 64, "q": "“ಆಗ ಬೋವಜನು, ನೀನು ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ, ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು ಮದುವೆಯಾಗಬೇಕು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "4:5"}, {"n": 65, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಆ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ …”", "a": "“… ಮಗನ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುತ್ತದೆ, ಎಂದು ತಿಳಿಸಿದನು.”", "r": "4:5"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಬೋವಜನು, ನೀನು ಆ ಹೊಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು ಮದುವೆಯಾಗಬೇಕು.”", "a": "ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ", "r": "4:5"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಗನ ಹೆಸರಿನಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಉಳಿಯುತ್ತದೆ", "r": "4:5"}, {"n": 68, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಬೋವಜನು, ನೀನು ಆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ, …”", "a": "“… ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು ಮದುವೆಯಾಗಬೇಕು.”", "r": "4:5"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಬೋವಜನು, ನೀನು ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಂಡುಕೊಳ್ಳುವುದಾದರೆ, ಅವಳ ಸೊಸೆಯಾದ ಮೋವಾಬದ ರೂತಳನ್ನು ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೊಲವನ್ನು; ಮದುವೆಯಾಗಬೇಕು", "r": "4:5"}, {"n": 70, "q": "“ಆಗ ಆ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಗನ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುತ್ತದೆ, ಎಂದು ತಿಳಿಸಿದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "4:5"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಹೊಲದ ಖಾತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುತ್ತದೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗತಿಸಿದ; ತಿಳಿಸಿದನು", "r": "4:5"}, {"n": 72, "q": "ರೂತಳನ್ನು ಮದುವೆಯಾಗಬೇಕೆಂಬ ಷರತ್ತು ಕೇಳಿದ ಮೇಲೆ ಹತ್ತಿರದ ನೆಂಟನು ಏನೆಂದನು?", "a": "“ಹಾಗಾದರೆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕನ್ನು ನಾನು ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ.”", "r": "4:6"}, {"n": 73, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕನ್ನು ಏಕೆ ಬಿಟ್ಟುಕೊಟ್ಟನು?", "a": "ಇಲ್ಲದಿದ್ದರೆ ತನ್ನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿರುವ ಆಸ್ತಿಗೆ ನಷ್ಟವಾಗುತ್ತದೆ ಎಂದು", "r": "4:6"}, {"n": 74, "q": "ಹಕ್ಕನ್ನು ಬಿಟ್ಟುಕೊಡುವಾಗ ಹತ್ತಿರದ ನೆಂಟನು ಬೋವಜನಿಗೆ ಏನೆಂದನು?", "a": "“ಆ ಹಕ್ಕನ್ನು ನೀನೇ ವಹಿಸಿಕೋ, ನನ್ನಿಂದಾಗದು”", "r": "4:6"}, {"n": 75, "q": "“ನನ್ನಿಂದಾಗದು” ಎಂದು ಹೇಳಿ ಹಕ್ಕನ್ನು ಬಿಟ್ಟುಕೊಟ್ಟವನು ಯಾರು?", "a": "ಎಲಿಮೆಲೆಕನ ಹತ್ತಿರದ ನೆಂಟನು", "r": "4:6"}, {"n": 76, "q": "ಹತ್ತಿರದ ನೆಂಟನು ತನ್ನ ಯಾವುದಕ್ಕೆ ನಷ್ಟವಾಗುತ್ತದೆ ಎಂದು ಹೆದರಿದನು?", "a": "ತನ್ನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿರುವ ಆಸ್ತಿಗೆ", "r": "4:6"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ, ಹಾಗಾದರೆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕನ್ನು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ", "r": "4:6"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲದಿದ್ದರೆ ನನ್ನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿರುವ ಆಸ್ತಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಷ್ಟವಾಗುತ್ತದೆ", "r": "4:6"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಆ ಹಕ್ಕನ್ನು ನೀನೇ ವಹಿಸಿಕೋ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದುಬಿಟ್ಟನು.”", "a": "ನನ್ನಿಂದಾಗದು", "r": "4:6"}, {"n": 80, "q": "“ಅದಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ, ಹಾಗಾದರೆ ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕನ್ನು ನಾನು ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "4:6"}, {"n": 81, "q": "“ಆದ್ದರಿಂದ ಆ ಹಕ್ಕನ್ನು ನೀನೇ ವಹಿಸಿಕೋ, ನನ್ನಿಂದಾಗದು, ಎಂದುಬಿಟ್ಟನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "4:6"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ, ಹಾಗಾದರೆ ಹೊಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಕ್ಕನ್ನು ನಾನು ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ.”", "a": "ಕೊಂಡುಕೊಳ್ಳುವ", "r": "4:6"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿರುವ ಆಸ್ತಿಗೆ ನಷ್ಟವಾಗುತ್ತದೆ.”", "a": "ಇಲ್ಲದಿದ್ದರೆ", "r": "4:6"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ಆ ಹಕ್ಕನ್ನು ನೀನೇ ವಹಿಸಿಕೋ, ನನ್ನಿಂದಾಗದು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಂದುಬಿಟ್ಟನು", "r": "4:6"}, {"n": 85, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ, ಹಾಗಾದರೆ …”", "a": "“… ಹೊಲವನ್ನು ಕೊಂಡುಕೊಳ್ಳುವ ಹಕ್ಕನ್ನು ನಾನು ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ.”", "r": "4:6"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ವ್ಯಕ್ತಿ, ಹಾಗಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಂಡುಕೊಳ್ಳುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಬಿಟ್ಟುಕೊಡುತ್ತೇನೆ.”", "a": "ಹೊಲವನ್ನು; ಹಕ್ಕನ್ನು", "r": "4:6"}, {"n": 87, "q": "“ಇಲ್ಲದಿದ್ದರೆ ನನ್ನ ಕುಟುಂಬಕ್ಕೆ ಸೇರಿರುವ ಆಸ್ತಿಗೆ ನಷ್ಟವಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "4:6"}, {"n": 88, "q": "ಇಸ್ರಯೇಲರಲ್ಲಿ ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ರೂಢಿಯಲ್ಲಿದ್ದ ಪದ್ಧತಿ ಏನು?", "a": "ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಕೊಡುತ್ತಿದ್ದನು", "r": "4:7"}, {"n": 89, "q": "ಪಾದರಕ್ಷೆಯನ್ನು ಕೊಡುವ ಪದ್ಧತಿಯ ಮೂಲಕ ಇಸ್ರಯೇಲರ ಮಧ್ಯೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ವ್ಯವಹಾರವು ಇತ್ಯರ್ಥವಾಗುತ್ತಿತ್ತು", "r": "4:7"}, {"n": 90, "q": "ಇಸ್ರಯೇಲರ ಪದ್ಧತಿಯಂತೆ ಪಾದರಕ್ಷೆಯನ್ನು ಯಾರು ಯಾರಿಗೆ ಕೊಡುತ್ತಿದ್ದರು?", "a": "ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ", "r": "4:7"}, {"n": 91, "q": "ಪಾದರಕ್ಷೆಯನ್ನು ಕೊಡುವ ಪದ್ಧತಿ ಇಸ್ರಯೇಲರಲ್ಲಿ ಯಾವ ಸಂದರ್ಭಗಳಲ್ಲಿ ರೂಢಿಯಲ್ಲಿತ್ತು?", "a": "ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ", "r": "4:7"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲರಲ್ಲಿ ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ಒಂದು ಪದ್ಧತಿ ರೂಢಿಯಲ್ಲಿತ್ತು:”", "a": "ಮಾರಾಟಮಾಡುವಾಗ", "r": "4:7"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡುತ್ತಿದ್ದನು.”", "a": "ಪಾದರಕ್ಷೆಯನ್ನು", "r": "4:7"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಇಸ್ರಯೇಲರ ಮಧ್ಯೆ ವ್ಯವಹಾರವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇತ್ಯರ್ಥವಾಗುತ್ತಿತ್ತು", "r": "4:7"}, {"n": 95, "q": "“ಇಸ್ರಯೇಲರಲ್ಲಿ ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ಒಂದು ಪದ್ಧತಿ ರೂಢಿಯಲ್ಲಿತ್ತು:” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 96, "q": "“ಹೀಗೆ ಇಸ್ರಯೇಲರ ಮಧ್ಯೆ ವ್ಯವಹಾರವು ಇತ್ಯರ್ಥವಾಗುತ್ತಿತ್ತು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲರಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ಒಂದು ಪದ್ಧತಿ ರೂಢಿಯಲ್ಲಿತ್ತು:”", "a": "ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು", "r": "4:7"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಡುತ್ತಿದ್ದನು", "r": "4:7"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಇಸ್ರಯೇಲರ ಮಧ್ಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇತ್ಯರ್ಥವಾಗುತ್ತಿತ್ತು.”", "a": "ವ್ಯವಹಾರವು", "r": "4:7"}, {"n": 100, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಸ್ರಯೇಲರಲ್ಲಿ ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ …”", "a": "“… ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ಒಂದು ಪದ್ಧತಿ ರೂಢಿಯಲ್ಲಿತ್ತು:”", "r": "4:7"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಸ್ತಿಪಾಸ್ತಿಯನ್ನು ಮಾರಾಟಮಾಡುವಾಗ ಅಥವಾ ವಿನಿಮಯಿಸಿ ಕೊಳ್ಳುವಾಗ ಒಂದು ಪದ್ಧತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಇಸ್ರಯೇಲರಲ್ಲಿ; ರೂಢಿಯಲ್ಲಿತ್ತು", "r": "4:7"}, {"n": 102, "q": "“ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಕೊಡುತ್ತಿದ್ದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 103, "q": "ಪಾದರಕ್ಷೆಯನ್ನು ತೆಗೆದುಕೊಡುವಾಗ ಹತ್ತಿರದ ನೆಂಟನು ಬೋವಜನಿಗೆ ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ಹೊಲವನ್ನು ನೀನೇ ಕೊಂಡುಕೊ”", "r": "4:8"}, {"n": 104, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಬೋವಜನಿಗೆ ಏನನ್ನು ತೆಗೆದುಕೊಟ್ಟನು?", "a": "ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು", "r": "4:8"}, {"n": 105, "q": "ಹತ್ತಿರದ ನೆಂಟನು ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಯಾರಿಗೆ ತೆಗೆದುಕೊಟ್ಟನು?", "a": "ಬೋವಜನಿಗೆ", "r": "4:8"}, {"n": 106, "q": "ಹತ್ತಿರದ ನೆಂಟನು ಪಾದರಕ್ಷೆಯನ್ನು ತೆಗೆದುಕೊಟ್ಟದ್ದು ಯಾವ ಪದ್ಧತಿಯ ಪ್ರಕಾರ?", "a": "ಆಸ್ತಿಪಾಸ್ತಿಯ ವ್ಯವಹಾರದಲ್ಲಿ ಕೊಡುವವನು ಕೊಳ್ಳುವವನಿಗೆ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಕೊಡುವ ಇಸ್ರಯೇಲರ ಪದ್ಧತಿಯ ಪ್ರಕಾರ", "r": "4:8"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ಆ ನೆಂಟನು, ಹೊಲವನ್ನು ನೀನೇ ಕೊಂಡುಕೊ, ಎಂದು ಹೇಳಿ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೆಗೆದುಕೊಟ್ಟನು.”", "a": "ಬೋವಜನಿಗೆ", "r": "4:8"}, {"n": 108, "q": "“ಅಂತೆಯೇ ಆ ನೆಂಟನು, ಹೊಲವನ್ನು ನೀನೇ ಕೊಂಡುಕೊ, ಎಂದು ಹೇಳಿ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಬೋವಜನಿಗೆ ತೆಗೆದುಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "4:8"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ಆ ನೆಂಟನು, ಹೊಲವನ್ನು ನೀನೇ ಕೊಂಡುಕೊ, ಎಂದು ಹೇಳಿ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋವಜನಿಗೆ ತೆಗೆದುಕೊಟ್ಟನು.”", "a": "ಪಾದರಕ್ಷೆಯನ್ನು", "r": "4:8"}, {"n": 110, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ ಆ ನೆಂಟನು, ಹೊಲವನ್ನು ನೀನೇ ಕೊಂಡುಕೊ, …”", "a": "“… ಎಂದು ಹೇಳಿ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಬೋವಜನಿಗೆ ತೆಗೆದುಕೊಟ್ಟನು.”", "r": "4:8"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ಆ ನೆಂಟನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನೇ ಕೊಂಡುಕೊ, ಎಂದು ಹೇಳಿ ತನ್ನ ಪಾದರಕ್ಷೆಯನ್ನು ಬೋವಜನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೊಲವನ್ನು; ತೆಗೆದುಕೊಟ್ಟನು", "r": "4:8"}, {"n": 112, "q": "ಬೋವಜನು ತಾನು ಆಸ್ತಿಯನ್ನು ಕೊಂಡುಕೊಂಡಿರುವುದಕ್ಕೆ ಯಾರನ್ನು ಸಾಕ್ಷಿಗಳನ್ನಾಗಿ ಮಾಡಿದನು?", "a": "ಊರಿನ ಹಿರಿಯರೆಲ್ಲರನ್ನು ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರನ್ನು", "r": "4:9"}, {"n": 113, "q": "ಬೋವಜನು ನವೊಮಿಯಿಂದ ಯಾರ ಯಾರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿಯನ್ನು ಕೊಂಡುಕೊಂಡನು?", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ", "r": "4:9"}, {"n": 114, "q": "ಬೋವಜನು ಎಲಿಮೆಲೆಕನ ಕುಟುಂಬದ ಆಸ್ತಿಯನ್ನು ಯಾರಿಂದ ಕೊಂಡುಕೊಂಡನು?", "a": "ನವೊಮಿಯಿಂದ", "r": "4:9"}, {"n": 115, "q": "ಆಸ್ತಿಯನ್ನು ಕೊಂಡುಕೊಂಡಿರುವುದನ್ನು ಪ್ರಕಟಿಸಿದ ನಂತರ ಬೋವಜನು ಹಿರಿಯರಿಗೂ ಜನರಿಗೂ ಏನೆಂದನು?", "a": "“ಇದಕ್ಕೆ ನೀವೆಲ್ಲರೂ ಸಾಕ್ಷಿಗಳು.”", "r": "4:9"}, {"n": 116, "q": "ಬೋವಜನು ಹಿರಿಯರಿಗೂ ಜನರಿಗೂ “ನೀವೆಲ್ಲರೂ ಸಾಕ್ಷಿಗಳು” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಹೇಳಿದನು?", "a": "ಎರಡು ಬಾರಿ (4:9; 4:10)", "r": "4:9–10"}, {"n": 117, "q": "ಬೋವಜನು ನವೊಮಿಯಿಂದ ಎಷ್ಟು ಆಸ್ತಿಯನ್ನು ಕೊಂಡುಕೊಂಡನು?", "a": "ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ", "r": "4:9"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಬೋವಜನು ಊರಿನ ಹಿರಿಯರೆಲ್ಲರಿಗೆ ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರಿಗೆ, ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಕೊಂಡುಕೊಂಡಿದ್ದೇನೆ.”", "a": "ನವೊಮಿಯಿಂದ", "r": "4:9"}, {"n": 119, "q": "“ಆಗ ಬೋವಜನು ಊರಿನ ಹಿರಿಯರೆಲ್ಲರಿಗೆ ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರಿಗೆ, ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ ನವೊಮಿಯಿಂದ ನಾನು ಕೊಂಡುಕೊಂಡಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "4:9"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಬೋವಜನು ಊರಿನ ಹಿರಿಯರೆಲ್ಲರಿಗೆ ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರಿಗೆ, ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ ನವೊಮಿಯಿಂದ ನಾನು ಕೊಂಡುಕೊಂಡಿದ್ದೇನೆ.”", "a": "ಮಹ್ಲೋನ್", "r": "4:9"}, {"n": 121, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಬೋವಜನು ಊರಿನ ಹಿರಿಯರೆಲ್ಲರಿಗೆ ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರಿಗೆ, ಎಲಿಮೆಲೆಕನಿಗೆ …”", "a": "“… ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ ನವೊಮಿಯಿಂದ ನಾನು ಕೊಂಡುಕೊಂಡಿದ್ದೇನೆ.”", "r": "4:9"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರಿನ ಹಿರಿಯರೆಲ್ಲರಿಗೆ ಹಾಗು ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಜನರಿಗೆ, ಎಲಿಮೆಲೆಕನಿಗೆ ಮತ್ತು ಕಲ್ಯೋನ್, ಮಹ್ಲೋನ್ ಇವರಿಗೆ ಸೇರಿದ್ದ ಆಸ್ತಿ ಎಲ್ಲವನ್ನೂ ನವೊಮಿಯಿಂದ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೋವಜನು; ಕೊಂಡುಕೊಂಡಿದ್ದೇನೆ", "r": "4:9"}, {"n": 123, "q": "ಬೋವಜನು ಯಾರನ್ನು ತನ್ನ ಹೆಂಡತಿಯನ್ನಾಗಿ ಸ್ವೀಕರಿಸಿದನು?", "a": "ಮಹ್ಲೋನನ ಪತ್ನಿಯಾದ ಮೋವಾಬ್ಯದ ರೂತಳನ್ನು", "r": "4:10"}, {"n": 124, "q": "ರೂತಳ ಮೊದಲ ಪತಿ ಯಾರು?", "a": "ಮಹ್ಲೋನ್", "r": "4:10"}, {"n": 125, "q": "ಬೋವಜನು ರೂತಳನ್ನು ಸ್ವೀಕರಿಸಿದ್ದರಿಂದ ಹೊಲದ ಖಾತೆ ಯಾರ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುವುದು?", "a": "ಗತಿಸಿದ ಮಹ್ಲೋನನ ಹೆಸರಿನಲ್ಲೇ", "r": "4:10"}, {"n": 126, "q": "ಮಹ್ಲೋನನ ವಂಶವೃಕ್ಷವು ಎಲ್ಲಿ ನೆಲೆಯಾಗಿರುವುದು ಎಂದು ಬೋವಜನು ಹೇಳಿದನು?", "a": "ಅವನ ಬಂಧುಬಳಗದವರಲ್ಲೂ ಊರಿನಲ್ಲೂ", "r": "4:10"}, {"n": 127, "q": "ಬೋವಜನ ಪ್ರಕಾರ ಮಹ್ಲೋನನ ಯಾವುದು ಅವನ ಬಂಧುಬಳಗದವರಲ್ಲೂ ಊರಿನಲ್ಲೂ ನೆಲೆಯಾಗಿರುವುದು?", "a": "ಅವನ ವಂಶವೃಕ್ಷ", "r": "4:10"}, {"n": 128, "q": "ಬೋವಜನು ರೂತಳನ್ನು ತನ್ನ ಏನನ್ನಾಗಿ ಸ್ವೀಕರಿಸಿದನು?", "a": "ಹೆಂಡತಿಯನ್ನಾಗಿ", "r": "4:10"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ಮಹ್ಲೋನನ ಪತ್ನಿಯಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳನ್ನು ನನ್ನ ಹೆಂಡತಿಯನ್ನಾಗಿ ಸ್ವೀಕರಿಸಿದ್ದೇನೆ.”", "a": "ಮೋವಾಬ್ಯದ", "r": "4:10"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಹ್ಲೋನನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿಯುವುದು.”", "a": "ಹೆಸರಿನಲ್ಲೇ", "r": "4:10"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾತ್ರವಲ್ಲ, ಅವನ ವಂಶವೃಕ್ಷವು ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರಿನಲ್ಲೂ ನೆಲೆಯಾಗಿರುವುದು.”", "a": "ಬಂಧುಬಳಗದವರಲ್ಲೂ", "r": "4:10"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಕ್ಷಿಗಳು, ಎಂದನು.”", "a": "ನೀವೆಲ್ಲರು", "r": "4:10"}, {"n": 133, "q": "“ಇದಲ್ಲದೆ, ಮಹ್ಲೋನನ ಪತ್ನಿಯಾದ ಮೋವಾಬ್ಯದ ರೂತಳನ್ನು ನನ್ನ ಹೆಂಡತಿಯನ್ನಾಗಿ ಸ್ವೀಕರಿಸಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 134, "q": "“ಮಾತ್ರವಲ್ಲ, ಅವನ ವಂಶವೃಕ್ಷವು ಅವನ ಬಂಧುಬಳಗದವರಲ್ಲೂ ಊರಿನಲ್ಲೂ ನೆಲೆಯಾಗಿರುವುದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ, ಮಹ್ಲೋನನ ಪತ್ನಿಯಾದ ಮೋವಾಬ್ಯದ ರೂತಳನ್ನು ನನ್ನ ಹೆಂಡತಿಯನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ವೀಕರಿಸಿದ್ದೇನೆ", "r": "4:10"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದರಿಂದ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಹ್ಲೋನನ ಹೆಸರಿನಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಳಿಯುವುದು", "r": "4:10"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾತ್ರವಲ್ಲ, ಅವನ ವಂಶವೃಕ್ಷವು ಅವನ ಬಂಧುಬಳಗದವರಲ್ಲೂ ಊರಿನಲ್ಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಲೆಯಾಗಿರುವುದು", "r": "4:10"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಕ್ಕೆ ನೀವೆಲ್ಲರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ಸಾಕ್ಷಿಗಳು", "r": "4:10"}, {"n": 139, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಲ್ಲದೆ, ಮಹ್ಲೋನನ ಪತ್ನಿಯಾದ ಮೋವಾಬ್ಯದ …”", "a": "“… ರೂತಳನ್ನು ನನ್ನ ಹೆಂಡತಿಯನ್ನಾಗಿ ಸ್ವೀಕರಿಸಿದ್ದೇನೆ.”", "r": "4:10"}, {"n": 140, "q": "“ಇದರಿಂದ ಹೊಲದ ಖಾತೆ ಗತಿಸಿದ ಮಹ್ಲೋನನ ಹೆಸರಿನಲ್ಲೇ ಉಳಿಯುವುದು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "4:10"}, {"n": 141, "q": "ಬೋವಜನ ಮಾತುಗಳಿಗೆ ಊರಿನ ಹಿರಿಯರು ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರು ಮೊದಲು ಏನೆಂದರು?", "a": "“ಹೌದು, ನಾವೆಲ್ಲರೂ ಸಾಕ್ಷಿಗಳು.”", "r": "4:11"}, {"n": 142, "q": "ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು ವೃದ್ಧಿಗೊಳಿಸಿದ ಕುಲೀನೆಯರು ಯಾರು ಎಂದು ಹಿರಿಯರು ಹೇಳಿದರು?", "a": "ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ", "r": "4:11"}, {"n": 143, "q": "ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಏನು ಮಾಡಿದರೆಂದು ಹಿರಿಯರು ಹೇಳಿದರು?", "a": "ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು ವೃದ್ಧಿಗೊಳಿಸಿದರು", "r": "4:11"}, {"n": 144, "q": "ಬೋವಜನು ಯಾವ ಕುಲದಲ್ಲಿ ಧನವಂತನಾಗಲಿ ಎಂದು ಹಿರಿಯರು ಹರಸಿದರು?", "a": "ಎಫ್ರಾತ ಕುಲದಲ್ಲಿ", "r": "4:11"}, {"n": 145, "q": "ಹಿರಿಯರ ಆಶೀರ್ವಾದದಲ್ಲಿ ‘ಧನವಂತನಾಗು’ ಮತ್ತು ‘ಘನವಂತನಾಗು’ ಎಂಬ ಮಾತುಗಳು ಯಾವ ಸ್ಥಳಗಳಿಗೆ ಸಂಬಂಧಿಸಿವೆ?", "a": "ಎಫ್ರಾತ ಕುಲದಲ್ಲಿ ಧನವಂತನಾಗು; ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಘನವಂತನಾಗು", "r": "4:11–12"}, {"n": 146, "q": "ರೂತಳ ಗ್ರಂಥದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹರಸಿದ ಎರಡು ಗುಂಪುಗಳು ಯಾರು?", "a": "ಊರಿನ ಹಿರಿಯರು ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರು (ಬೋವಜನನ್ನು); ಊರಿನ ಮಹಿಳೆಯರು (ನವೊಮಿಯನ್ನು)", "r": "4:11; 4:14"}, {"n": 147, "q": "ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಎಂಬ ಕುಲೀನೆಯರನ್ನು ಸರ್ವೇಶ್ವರ ಆಶೀರ್ವದಿಸಲಿ ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ಊರಿನ ಹಿರಿಯರು ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರು", "r": "4:11"}, {"n": 148, "q": "ಹಿರಿಯರು ಕುಲೀನೆಯರು ಎಂದು ಕರೆದವರು ಯಾರು?", "a": "ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ", "r": "4:11"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಊರಿನ ಹಿರಿಯರು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಭಿಕರು:”", "a": "ನೆರೆದಿದ್ದ", "r": "4:11"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಎಂಬ ಕುಲೀನೆಯರನ್ನು ಸರ್ವೇಶ್ವರ ಆಶೀರ್ವದಿಸಲಿ!”", "a": "ವೃದ್ಧಿಗೊಳಿಸಿದ", "r": "4:11"}, {"n": 151, "q": "“ಆಗ ಊರಿನ ಹಿರಿಯರು ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರು:” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 152, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು ವೃದ್ಧಿಗೊಳಿಸಿದ ರಾಹೆಲ್ ಮತ್ತು …”", "a": "“… ಲೆಯಾ ಎಂಬ ಕುಲೀನೆಯರನ್ನು ಸರ್ವೇಶ್ವರ ಆಶೀರ್ವದಿಸಲಿ!”", "r": "4:11"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಊರಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ನೆರೆದಿದ್ದ ಸಭಿಕರು:”", "a": "ಹಿರಿಯರು", "r": "4:11"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು ವೃದ್ಧಿಗೊಳಿಸಿದ ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ವೇಶ್ವರ ಆಶೀರ್ವದಿಸಲಿ!”", "a": "ಕುಲೀನೆಯರನ್ನು", "r": "4:11"}, {"n": 155, "q": "“ಇಸ್ರಯೇಲಿನ ಮನೆತನವನ್ನು ವೃದ್ಧಿಗೊಳಿಸಿದ ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಎಂಬ ಕುಲೀನೆಯರನ್ನು ಸರ್ವೇಶ್ವರ ಆಶೀರ್ವದಿಸಲಿ!” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವೃದ್ಧಿಗೊಳಿಸಿದ ರಾಹೆಲ್ ಮತ್ತು ಲೆಯಾ ಎಂಬ ಕುಲೀನೆಯರನ್ನು ಸರ್ವೇಶ್ವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಮನೆತನವನ್ನು; ಆಶೀರ್ವದಿಸಲಿ", "r": "4:11"}, {"n": 157, "q": "ಬೋವಜನು ಎಲ್ಲಿ ಘನವಂತನಾಗಲಿ ಎಂದು ಹಿರಿಯರು ಹರಸಿದರು?", "a": "ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ", "r": "4:12"}, {"n": 158, "q": "ಬೋವಜನ ಮನೆತನವು ಯಾರ ಮನೆತನದಂತೆ ಪ್ರಖ್ಯಾತವಾಗಲಿ ಎಂದು ಹಿರಿಯರು ಹರಸಿದರು?", "a": "ಯೆಹೂದನಿಗೆ ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ ಪೆರೆಚನ ಮನೆತನದಂತೆ", "r": "4:12"}, {"n": 159, "q": "ಪೆರೆಚನ ತಂದೆ ಮತ್ತು ತಾಯಿ ಯಾರು?", "a": "ಯೆಹೂದ ಮತ್ತು ತಾಮಾರಳು", "r": "4:12"}, {"n": 160, "q": "ಯಾರ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ಬೋವಜನಿಗೆ ಸಂತಾನವನ್ನು ಅನುಗ್ರಹಿಸಲಿ ಎಂದು ಹಿರಿಯರು ಹರಸಿದರು?", "a": "ಆ ಯುವತಿಯ (ರೂತಳ) ಮುಖಾಂತರ", "r": "4:12"}, {"n": 161, "q": "ಹಿರಿಯರ ಆಶೀರ್ವಾದದಲ್ಲೂ ಗ್ರಂಥದ ಕೊನೆಯ ವಂಶಾವಳಿಯಲ್ಲೂ ಉಲ್ಲೇಖಗೊಂಡ ವ್ಯಕ್ತಿ ಯಾರು?", "a": "ಪೆರೆಚ", "r": "4:12; 4:18–22"}, {"n": 162, "q": "“ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ ಅನುಗ್ರಹಿಸುವ ಸಂತಾನದಿಂದ…” — ಇಲ್ಲಿ ‘ಆ ಯುವತಿ’ ಯಾರು?", "a": "ರೂತಳು", "r": "4:12"}, {"n": 163, "q": "ತಾಮಾರಳಿಂದ ಯೆಹೂದನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಪೆರೆಚ", "r": "4:12"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ ಅನುಗ್ರಹಿಸುವ ಸಂತಾನದಿಂದ ನಿನ್ನ ಮನೆತನವು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ ಪೆರೆಚನ ಮನೆತನದಂತೆ ಪ್ರಖ್ಯಾತವಾಗಲಿ!”", "a": "ಯೆಹೂದನಿಗೆ", "r": "4:12"}, {"n": 165, "q": "“ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ ಅನುಗ್ರಹಿಸುವ ಸಂತಾನದಿಂದ ನಿನ್ನ ಮನೆತನವು, ಯೆಹೂದನಿಗೆ ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ ಪೆರೆಚನ ಮನೆತನದಂತೆ ಪ್ರಖ್ಯಾತವಾಗಲಿ!” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "4:12"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ ಅನುಗ್ರಹಿಸುವ ಸಂತಾನದಿಂದ ನಿನ್ನ ಮನೆತನವು, ಯೆಹೂದನಿಗೆ ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನೆತನದಂತೆ ಪ್ರಖ್ಯಾತವಾಗಲಿ!”", "a": "ಪೆರೆಚನ", "r": "4:12"}, {"n": 167, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ ಅನುಗ್ರಹಿಸುವ ಸಂತಾನದಿಂದ …”", "a": "“… ನಿನ್ನ ಮನೆತನವು, ಯೆಹೂದನಿಗೆ ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ ಪೆರೆಚನ ಮನೆತನದಂತೆ ಪ್ರಖ್ಯಾತವಾಗಲಿ!”", "r": "4:12"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಯುವತಿಯ ಮುಖಾಂತರ ಸರ್ವೇಶ್ವರ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂತಾನದಿಂದ ನಿನ್ನ ಮನೆತನವು, ಯೆಹೂದನಿಗೆ ತಾಮಾರಳಿಂದ ಹುಟ್ಟಿದ ಪೆರೆಚನ ಮನೆತನದಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಅನುಗ್ರಹಿಸುವ; ಪ್ರಖ್ಯಾತವಾಗಲಿ", "r": "4:12"}, {"n": 169, "q": "ಬೋವಜನು ರೂತಳನ್ನು ಮದುವೆಯಾಗಿ ಏನು ಮಾಡಿದನು?", "a": "ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋದನು", "r": "4:13"}, {"n": 170, "q": "ರೂತಳು ಯಾರ ಅನುಗ್ರಹದಿಂದ ಗರ್ಭಿಣಿಯಾದಳು?", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ", "r": "4:13"}, {"n": 171, "q": "ರೂತಳು ಗರ್ಭಿಣಿಯಾಗಿ ಯಾರನ್ನು ಹೆತ್ತಳು?", "a": "ಒಬ್ಬ ಮಗನನ್ನು", "r": "4:13"}, {"n": 172, "q": "ರೂತಳು ಮಗನನ್ನು ಹೆತ್ತಾಗ ನವೊಮಿಯನ್ನು ಹರಸಿದವರು ಯಾರು?", "a": "ಊರಿನ ಮಹಿಳೆಯರು", "r": "4:13–14"}, {"n": 173, "q": "ಓಬೇದನ ತಂದೆ ಮತ್ತು ತಾಯಿ ಯಾರು?", "a": "ಬೋವಜ ಮತ್ತು ರೂತಳು", "r": "4:13; 4:17"}, {"n": 174, "q": "ಊರಿನ ಮಹಿಳೆಯರು ನವೊಮಿಯನ್ನು ಯಾವಾಗ ಹರಸಿದರು?", "a": "ರೂತಳು ಒಬ್ಬ ಮಗನನ್ನು ಹೆತ್ತಾಗ", "r": "4:13"}, {"n": 175, "q": "ಬೋವಜನು ರೂತಳನ್ನು ಮದುವೆಯಾದ ನಂತರ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ಏನಾಯಿತು?", "a": "ರೂತಳು ಗರ್ಭಿಣಿಯಾಗಿ ಒಬ್ಬ ಮಗನನ್ನು ಹೆತ್ತಳು", "r": "4:13"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರೂತಳನ್ನು ಮದುವೆಯಾಗಿ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋದನು.”", "a": "ಬೋವಜನು", "r": "4:13"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹದಿಂದ ಆಕೆ ಗರ್ಭಿಣಿಯಾಗಿ ಒಬ್ಬ ಮಗನನ್ನು ಹೆತ್ತಳು.”", "a": "ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ", "r": "4:13"}, {"n": 178, "q": "“ಬೋವಜನು ರೂತಳನ್ನು ಮದುವೆಯಾಗಿ ಮನೆಗೆ ಕರೆದುಕೊಂಡು ಹೋದನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನು ರೂತಳನ್ನು ಮದುವೆಯಾಗಿ ಮನೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದನು.”", "a": "ಕರೆದುಕೊಂಡು", "r": "4:13"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಕೆ ಗರ್ಭಿಣಿಯಾಗಿ ಒಬ್ಬ ಮಗನನ್ನು ಹೆತ್ತಳು.”", "a": "ಅನುಗ್ರಹದಿಂದ", "r": "4:13"}, {"n": 181, "q": "“ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಅನುಗ್ರಹದಿಂದ ಆಕೆ ಗರ್ಭಿಣಿಯಾಗಿ ಒಬ್ಬ ಮಗನನ್ನು ಹೆತ್ತಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 182, "q": "ರೂತಳಿಗೆ ಮಗ ಹುಟ್ಟಿದಾಗ ಊರಿನ ಮಹಿಳೆಯರು ಮೊದಲು ಯಾರಿಗೆ ಸ್ತುತಿ ಸಲ್ಲಿಸಿದರು?", "a": "“ಸರ್ವೇಶ್ವರ ಸ್ವಾಮಿಗೆ ಸ್ತುತಿ ಸ್ತೋತ್ರ!”", "r": "4:14"}, {"n": 183, "q": "ಸರ್ವೇಶ್ವರ ನವೊಮಿಗೆ ಯಾರನ್ನು ಅನುಗ್ರಹಿಸಿದರೆಂದು ಮಹಿಳೆಯರು ಹೇಳಿದರು?", "a": "ಒಬ್ಬ ವಂಶೋದ್ಧಾರಕನನ್ನು", "r": "4:14"}, {"n": 184, "q": "ಆ ಮಗು ಎಲ್ಲಿ ಪ್ರಖ್ಯಾತನಾಗಲಿ ಎಂದು ಮಹಿಳೆಯರು ಹರಸಿದರು?", "a": "ಇಸ್ರಯೇಲ್ ನಾಡಿನಲ್ಲಿ", "r": "4:14"}, {"n": 185, "q": "“ನಿನಗೊಬ್ಬ ವಂಶೋದ್ಧಾರಕನನ್ನು ಅನುಗ್ರಹಿಸಿದ…” — ಇಲ್ಲಿ ‘ನಿನಗೆ’ ಎಂಬುದು ಯಾರನ್ನು ಕುರಿತದ್ದು?", "a": "ನವೊಮಿಯನ್ನು", "r": "4:14"}, {"n": 186, "q": "ಊರಿನ ಮಹಿಳೆಯರು ಮಗುವನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ವಂಶೋದ್ಧಾರಕ", "r": "4:14"}, {"n": 187, "q": "“ಸಪ್ತ ಕುವರರಿಗಿಂತ ನಿನಗೆ ಮೆಚ್ಚುಗೆ ಆದ ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ…” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಊರಿನ ಮಹಿಳೆಯರು ನವೊಮಿಗೆ", "r": "4:14–15"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ವಾಮಿಗೆ ಸ್ತುತಿ ಸ್ತೋತ್ರ!”", "a": "ಸರ್ವೇಶ್ವರ", "r": "4:14"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೊಬ್ಬ ವಂಶೋದ್ಧಾರಕನನ್ನು ಅನುಗ್ರಹಿಸಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನಲ್ಲಿ ಆ ಮಗು ಪ್ರಖ್ಯಾತನಾಗಲಿ!”", "a": "ಇಸ್ರಯೇಲ್", "r": "4:14"}, {"n": 190, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿನಗೊಬ್ಬ ವಂಶೋದ್ಧಾರಕನನ್ನು ಅನುಗ್ರಹಿಸಿದ ಇಸ್ರಯೇಲ್ …”", "a": "“… ನಾಡಿನಲ್ಲಿ ಆ ಮಗು ಪ್ರಖ್ಯಾತನಾಗಲಿ!”", "r": "4:14"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸರ್ವೇಶ್ವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ತುತಿ ಸ್ತೋತ್ರ!”", "a": "ಸ್ವಾಮಿಗೆ", "r": "4:14"}, {"n": 192, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೊಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅನುಗ್ರಹಿಸಿದ ಇಸ್ರಯೇಲ್ ನಾಡಿನಲ್ಲಿ ಆ ಮಗು ಪ್ರಖ್ಯಾತನಾಗಲಿ!”", "a": "ವಂಶೋದ್ಧಾರಕನನ್ನು", "r": "4:14"}, {"n": 193, "q": "“ನಿನಗೊಬ್ಬ ವಂಶೋದ್ಧಾರಕನನ್ನು ಅನುಗ್ರಹಿಸಿದ ಇಸ್ರಯೇಲ್ ನಾಡಿನಲ್ಲಿ ಆ ಮಗು ಪ್ರಖ್ಯಾತನಾಗಲಿ!” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 194, "q": "ಮಗುವು ನವೊಮಿಗೆ ಏನು ಮಾಡುವನೆಂದು ಮಹಿಳೆಯರು ಹೇಳಿದರು?", "a": "1) ನವಚೈತನ್ಯವನ್ನು ಕೊಡುವನು; 2) ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನು", "r": "4:15"}, {"n": 195, "q": "ಮಹಿಳೆಯರ ಪ್ರಕಾರ ನವೊಮಿಗೆ ರೂತಳು ಯಾರಿಗಿಂತ ಮೆಚ್ಚುಗೆಯಾದವಳು?", "a": "ಸಪ್ತ ಕುವರರಿಗಿಂತ", "r": "4:15"}, {"n": 196, "q": "ಎಷ್ಟು ಕುವರರಿಗಿಂತ ರೂತಳು ನವೊಮಿಗೆ ಮೆಚ್ಚುಗೆಯಾದವಳು ಎಂದು ಮಹಿಳೆಯರು ಹೇಳಿದರು?", "a": "ಸಪ್ತ (ಏಳು) ಕುವರರಿಗಿಂತ", "r": "4:15"}, {"n": 197, "q": "“ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ ಆ ಮಗುವನ್ನು ನಿನಗೆ ಕೊಟ್ಟಿದ್ದಾಳೆ!” — ಇಲ್ಲಿ ‘ಪ್ರಿಯ ಸೊಸೆ’ ಯಾರು?", "a": "ರೂತಳು", "r": "4:15"}, {"n": 198, "q": "ಮಗುವು ನವೊಮಿಗೆ ಯಾವ ಕಾಲದಲ್ಲಿ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನೆಂದು ಮಹಿಳೆಯರು ಹೇಳಿದರು?", "a": "ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ", "r": "4:15"}, {"n": 199, "q": "“ಅವನು ನಿನಗೆ ನವಚೈತನ್ಯವನ್ನು ಕೊಟ್ಟು…” — ಇಲ್ಲಿ ‘ಅವನು’ ಯಾರು?", "a": "ರೂತಳ ಮಗ (ಓಬೇದ್)", "r": "4:15"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನಗೆ ನವಚೈತನ್ಯವನ್ನು ಕೊಟ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನು.”", "a": "ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ", "r": "4:15"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಪ್ತ ಕುವರರಿಗಿಂತ ನಿನಗೆ ಮೆಚ್ಚುಗೆ ಆದ ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ ಆ ಮಗುವನ್ನು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಕೊಟ್ಟಿದ್ದಾಳೆ", "r": "4:15"}, {"n": 202, "q": "“ಅವನು ನಿನಗೆ ನವಚೈತನ್ಯವನ್ನು ಕೊಟ್ಟು ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ನಿನಗೆ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "4:15"}, {"n": 203, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಪ್ತ ಕುವರರಿಗಿಂತ ನಿನಗೆ ಮೆಚ್ಚುಗೆ ಆದ ನಿನ್ನ …”", "a": "“… ಪ್ರಿಯ ಸೊಸೆ ಆ ಮಗುವನ್ನು ನಿನಗೆ ಕೊಟ್ಟಿದ್ದಾಳೆ!”", "r": "4:15"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟು ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ನಿನಗೆ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನು.”", "a": "ನವಚೈತನ್ಯವನ್ನು", "r": "4:15"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಪ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಮೆಚ್ಚುಗೆ ಆದ ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ ಆ ಮಗುವನ್ನು ನಿನಗೆ ಕೊಟ್ಟಿದ್ದಾಳೆ!”", "a": "ಕುವರರಿಗಿಂತ", "r": "4:15"}, {"n": 206, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವನು ನಿನಗೆ ನವಚೈತನ್ಯವನ್ನು ಕೊಟ್ಟು …”", "a": "“… ವೃದ್ಧಾಪ್ಯದಲ್ಲಿ ನಿನಗೆ ಸಂರಕ್ಷಣೆಯನ್ನು ನೀಡುವನು.”", "r": "4:15"}, {"n": 207, "q": "“ಸಪ್ತ ಕುವರರಿಗಿಂತ ನಿನಗೆ ಮೆಚ್ಚುಗೆ ಆದ ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ ಆ ಮಗುವನ್ನು ನಿನಗೆ ಕೊಟ್ಟಿದ್ದಾಳೆ!” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "4:15"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಪ್ತ ಕುವರರಿಗಿಂತ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದ ನಿನ್ನ ಪ್ರಿಯ ಸೊಸೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಕೊಟ್ಟಿದ್ದಾಳೆ!”", "a": "ಮೆಚ್ಚುಗೆ; ಮಗುವನ್ನು", "r": "4:15"}, {"n": 209, "q": "ನವೊಮಿ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ಏನು ಮಾಡಿದಳು?", "a": "ತನ್ನ ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು ಸಾಕಿ ಸಲಹಿದಳು", "r": "4:16"}, {"n": 210, "q": "ರೂತಳ ಮಗುವನ್ನು ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು ಸಾಕಿ ಸಲಹಿದವಳು ಯಾರು?", "a": "ನವೊಮಿ", "r": "4:16"}, {"n": 211, "q": "ನವೊಮಿ ಮಗುವನ್ನು ಎಲ್ಲಿ ಇಟ್ಟುಕೊಂಡಳು?", "a": "ತನ್ನ ಮಡಿಲಲ್ಲಿ", "r": "4:16"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ತನ್ನ ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು ಸಾಕಿ ಸಲಹಿದಳು.”", "a": "ನವೊಮಿ", "r": "4:16"}, {"n": 213, "q": "“ನವೊಮಿ ಆ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ತನ್ನ ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು ಸಾಕಿ ಸಲಹಿದಳು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "4:16"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನವೊಮಿ ಆ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಕಿ ಸಲಹಿದಳು.”", "a": "ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು", "r": "4:16"}, {"n": 215, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನವೊಮಿ ಆ ಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು …”", "a": "“… ತನ್ನ ಮಡಿಲಲ್ಲಿಟ್ಟುಕೊಂಡು ಸಾಕಿ ಸಲಹಿದಳು.”", "r": "4:16"}, {"n": 216, "q": "ರೂತಳ ಮಗುವಿಗೆ ಹೆಸರಿಟ್ಟವರು ಯಾರು?", "a": "ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು", "r": "4:17"}, {"n": 217, "q": "ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು ರೂತಳ ಮಗುವಿಗೆ ಇಟ್ಟ ಹೆಸರೇನು?", "a": "ಓಬೇದ್", "r": "4:17"}, {"n": 218, "q": "ಮಗುವಿಗೆ ಹೆಸರಿಡುವಾಗ ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನವೊಮಿಗೆ ಕುಲಪುತ್ರನೊಬ್ಬನು ಹುಟ್ಟಿದ್ದಾನೆ!”", "r": "4:17"}, {"n": 219, "q": "ಓಬೇದ್ ಯಾರ ತಂದೆ?", "a": "ಜೆಸ್ಸೆಯ ತಂದೆ", "r": "4:17"}, {"n": 220, "q": "ಓಬೇದ್ ದಾವೀದನಿಗೆ ಏನಾಗಬೇಕು?", "a": "ತಾತ", "r": "4:17"}, {"n": 221, "q": "ದಾವೀದನ ತಂದೆ ಯಾರು?", "a": "ಜೆಸ್ಸೆಯ (ಜೆಸ್ಸಯ)", "r": "4:17"}, {"n": 222, "q": "ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರ ಪ್ರಕಾರ ನವೊಮಿಗೆ ಯಾರು ಹುಟ್ಟಿದ್ದಾನೆ?", "a": "ಕುಲಪುತ್ರನೊಬ್ಬನು", "r": "4:17"}, {"n": 223, "q": "ರೂತಳು ದಾವೀದನಿಗೆ ಏನಾಗಬೇಕು?", "a": "ಮುತ್ತಜ್ಜಿ (ಓಬೇದ್ ದಾವೀದನ ತಾತ; ರೂತಳು ಓಬೇದನ ತಾಯಿ)", "r": "4:17"}, {"n": 224, "q": "‘ಓಬೇದ್’ ಎಂಬ ಮಗು ಯಾರ ಕುಲಪುತ್ರನೆಂದು ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು ಹೇಳಿದರು?", "a": "ನವೊಮಿಯ", "r": "4:17"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುಲಪುತ್ರನೊಬ್ಬನು ಹುಟ್ಟಿದ್ದಾನೆ!”", "a": "ನವೊಮಿಗೆ", "r": "4:17"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಆ ಮಗುವಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಹೆಸರಿಟ್ಟರು.”", "a": "ಓಬೇದ್", "r": "4:17"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನೇ ಜೆಸ್ಸೆಯ ತಂದೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾತ.”", "a": "ದಾವೀದನ", "r": "4:17"}, {"n": 228, "q": "“ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು, ನವೊಮಿಗೆ ಕುಲಪುತ್ರನೊಬ್ಬನು ಹುಟ್ಟಿದ್ದಾನೆ!” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 229, "q": "“ಇವನೇ ಜೆಸ್ಸೆಯ ತಂದೆ, ದಾವೀದನ ತಾತ.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೆರೆಹೊರೆಯ ಮಹಿಳೆಯರು, ನವೊಮಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದ್ದಾನೆ!”", "a": "ಕುಲಪುತ್ರನೊಬ್ಬನು", "r": "4:17"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಆ ಮಗುವಿಗೆ ಓಬೇದ್ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೆಸರಿಟ್ಟರು", "r": "4:17"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಂದೆ, ದಾವೀದನ ತಾತ.”", "a": "ಜೆಸ್ಸೆಯ", "r": "4:17"}, {"n": 233, "q": "“ಎಂದು ಹೇಳಿ ಆ ಮಗುವಿಗೆ ಓಬೇದ್ ಎಂದು ಹೆಸರಿಟ್ಟರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "4:17"}, {"n": 234, "q": "ರೂತಳ ಗ್ರಂಥದ ಕೊನೆಯಲ್ಲಿರುವ ವಂಶಾವಳಿ ಯಾರಿಂದ ಯಾರವರೆಗಿನದು?", "a": "ಪೆರೆಚನಿಂದ ದಾವೀದನವರೆಗಿನ ವಂಶಾವಳಿ", "r": "4:18–22"}, {"n": 235, "q": "ಪೆರೆಚನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಹೆಜ್ರೋನನು", "r": "4:18–22"}, {"n": 236, "q": "ಹೆಜ್ರೋನನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ರಾಮನು", "r": "4:18–22"}, {"n": 237, "q": "ರಾಮನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಅಮಿನದಾಬನು", "r": "4:18–22"}, {"n": 238, "q": "ಅಮಿನದಾಬನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ನಹಶೋನ", "r": "4:18–22"}, {"n": 239, "q": "ನಹಶೋನನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಸಲ್ಮೋನ್", "r": "4:18–22"}, {"n": 240, "q": "ಬೋವಜನ ತಂದೆ ಯಾರು?", "a": "ಸಲ್ಮೋನ್", "r": "4:18–22"}, {"n": 241, "q": "ಜೆಸ್ಸಯನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ದಾವೀದ", "r": "4:18–22"}, {"n": 242, "q": "ರೂತಳ ಗ್ರಂಥದ ವಂಶಾವಳಿಯಲ್ಲಿ ಪೆರೆಚನಿಂದ ದಾವೀದನವರೆಗೆ ಎಷ್ಟು ಹೆಸರುಗಳಿವೆ?", "a": "ಹತ್ತು (ಪೆರೆಚ, ಹೆಜ್ರೋನ, ರಾಮ, ಅಮಿನದಾಬ, ನಹಶೋನ, ಸಲ್ಮೋನ್, ಬೋವಜ, ಓಬೇದ್, ಜೆಸ್ಸಯ, ದಾವೀದ)", "r": "4:18–22"}, {"n": 243, "q": "ಪೆರೆಚನಿಂದ ದಾವೀದನವರೆಗಿನ ವಂಶಾವಳಿಯನ್ನು ಕ್ರಮವಾಗಿ ಹೇಳಿ.", "a": "ಪೆರೆಚ → ಹೆಜ್ರೋನ → ರಾಮ → ಅಮಿನದಾಬ → ನಹಶೋನ → ಸಲ್ಮೋನ್ → ಬೋವಜ → ಓಬೇದ್ → ಜೆಸ್ಸಯ → ದಾವೀದ", "r": "4:18–22"}, {"n": 244, "q": "ವಂಶಾವಳಿಯಲ್ಲಿ ಬೋವಜನಿಗೆ ಮುಂಚಿನ ಮತ್ತು ನಂತರದ ಹೆಸರುಗಳು ಯಾವುವು?", "a": "ಮುಂಚೆ ಸಲ್ಮೋನ್ (ತಂದೆ); ನಂತರ ಓಬೇದ್ (ಮಗ)", "r": "4:18–22"}, {"n": 245, "q": "ವಂಶಾವಳಿಯಲ್ಲಿ ಬೋವಜನಿಂದ ದಾವೀದನವರೆಗೆ ಎಷ್ಟು ತಲೆಮಾರುಗಳು?", "a": "ನಾಲ್ಕು ಹೆಸರುಗಳು (ಬೋವಜ, ಓಬೇದ್, ಜೆಸ್ಸಯ, ದಾವೀದ)", "r": "4:18–22"}, {"n": 246, "q": "ವಂಶಾವಳಿಯ ಪ್ರಕಾರ ಓಬೇದನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಜೆಸ್ಸಯ", "r": "4:18–22"}, {"n": 247, "q": "ವಂಶಾವಳಿಯಲ್ಲಿ ಸಲ್ಮೋನನಿಗೆ ಹುಟ್ಟಿದವನು ಯಾರು?", "a": "ಬೋವಜನು", "r": "4:18–22"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೆಜ್ರೋನನು, ಹೆಜ್ರೋನನಿಗೆ ರಾಮನು, ರಾಮನಿಗೆ ಅಮಿನದಾಬನು ಹುಟ್ಟಿದರು.”", "a": "ಪೆರೆಚನಿಗೆ", "r": "4:18–22"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಮಿನದಾಬನಿಗೆ ನಹಶೋನ, ನಹಶೋನನಿಗೆ ಸಲ್ಮೋನ್, ಸಲ್ಮೋನನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದರು.”", "a": "ಬೋವಜನು", "r": "4:18–22"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೋವಜನಿಗೆ ಓಬೇದ್, ಓಬೇದನಿಗೆ ಜೆಸ್ಸಯ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಾವೀದ ಹುಟ್ಟಿದರು.”", "a": "ಜೆಸ್ಸಯನಿಗೆ", "r": "4:18–22"}, {"n": 251, "q": "“ಪೆರೆಚನಿಗೆ ಹೆಜ್ರೋನನು, ಹೆಜ್ರೋನನಿಗೆ ರಾಮನು, ರಾಮನಿಗೆ ಅಮಿನದಾಬನು ಹುಟ್ಟಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18–22", "r": "4:18–22"}, {"n": 252, "q": "“ಬೋವಜನಿಗೆ ಓಬೇದ್, ಓಬೇದನಿಗೆ ಜೆಸ್ಸಯ, ಜೆಸ್ಸಯನಿಗೆ ದಾವೀದ ಹುಟ್ಟಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18–22", "r": "4:18–22"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪೆರೆಚನಿಗೆ ಹೆಜ್ರೋನನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ರಾಮನು, ರಾಮನಿಗೆ ಅಮಿನದಾಬನು ಹುಟ್ಟಿದರು.”", "a": "ಹೆಜ್ರೋನನಿಗೆ", "r": "4:18–22"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಹಶೋನ, ನಹಶೋನನಿಗೆ ಸಲ್ಮೋನ್, ಸಲ್ಮೋನನಿಗೆ ಬೋವಜನು ಹುಟ್ಟಿದರು.”", "a": "ಅಮಿನದಾಬನಿಗೆ", "r": "4:18–22"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಓಬೇದ್, ಓಬೇದನಿಗೆ ಜೆಸ್ಸಯ, ಜೆಸ್ಸಯನಿಗೆ ದಾವೀದ ಹುಟ್ಟಿದರು.”", "a": "ಬೋವಜನಿಗೆ", "r": "4:18–22"}, {"n": 256, "q": "“ಅಮಿನದಾಬನಿಗೆ ನಹಶೋನ, ನಹಶೋನನಿಗೆ ಸಲ್ಮೋನ್, ಸಲ್ಮೋನನಿಗೆ ಬೋವಜನು ಹುಟ್ಟಿದರು.” — ಈ ಮಾತುಗಳು ರೂತಳು 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18–22", "r": "4:18–22"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
