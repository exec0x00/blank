r-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?”", "a": "ಫರಿಸಾಯರು", "r": "7:47"}, {"n": 227, "q": "“ಅದಕ್ಕೆ ಫರಿಸಾಯರು, ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "7:47"}, {"n": 228, "q": "ಯೊವಾನ್ನ 7:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಫರಿಸಾಯರು, “ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?", "r": "7:47"}, {"n": 229, "q": "ಯೇಸುವನ್ನು ನಂಬಿದವರ ಬಗ್ಗೆ ಫರಿಸಾಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?”", "r": "7:48"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?”", "a": "ಫರಿಸಾಯರಲ್ಲಾಗಲಿ", "r": "7:48"}, {"n": 231, "q": "“ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "7:48"}, {"n": 232, "q": "ಯೊವಾನ್ನ 7:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಮ್ಮ ಮುಖಂಡರಲ್ಲಾಗಲಿ, ಫರಿಸಾಯರಲ್ಲಾಗಲಿ, ಯಾರಾದರೂ ಅವನನ್ನು ನಂಬಿದ್ದುಂಟೆ?", "r": "7:48"}, {"n": 233, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಯಾರು ಶಾಪಗ್ರಸ್ತರಾಗಿದ್ದಾರೆ?", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ", "r": "7:49"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ", "r": "7:49"}, {"n": 235, "q": "“ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "7:49"}, {"n": 236, "q": "ಯೊವಾನ್ನ 7:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರದ ಗಂಧವೂ ಇಲ್ಲದ ಜನಜಂಗುಳಿ ಶಾಪಗ್ರಸ್ತವಾಗಿದೆ,” ಎಂದರು.", "r": "7:49"}, {"n": 237, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದು ಹಿಂದೆ ಯೇಸುವನ್ನು ಕಾಣಲು ಬಂದಿದ್ದವನು ಯಾರು?", "a": "ನಿಕೊದೇಮನು", "r": "7:50"}, {"n": 238, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ನಿಕೊದೇಮನನ್ನು ಉಲ್ಲೇಖಿಸುವ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು (ಅಧ್ಯಾಯ 3 ಮತ್ತು 7)?", "a": "ರಾತ್ರಿ ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದದ್ದು (3:1–2); ಫರಿಸಾಯರ ಮುಂದೆ ಯೇಸುವಿನ ಪರವಾಗಿ ಪ್ರಶ್ನಿಸಿದ್ದು (7:50–51)", "r": "3:1–2; 7:50–51"}, {"n": 239, "q": "ನಿಕೊದೇಮನು ಯಾವ ಪಂಗಡದವನು?", "a": "ಫರಿಸಾಯರಲ್ಲಿ ಒಬ್ಬನು", "r": "7:50"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಕೊದೇಮನು ಒಬ್ಬನು.”", "a": "ಫರಿಸಾಯರಲ್ಲಿ", "r": "7:50"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಿಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾಣಲು ಬಂದಿದ್ದವನು ಈತನೇ.”", "a": "ಯೇಸುವನ್ನು", "r": "7:50"}, {"n": 242, "q": "ಯೊವಾನ್ನ 7:50 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿದ್ದ ಫರಿಸಾಯರಲ್ಲಿ ನಿಕೊದೇಮನು ಒಬ್ಬನು. ಹಿಂದೆ ಯೇಸುವನ್ನು ಕಾಣಲು ಬಂದಿದ್ದವನು ಈತನೇ.", "r": "7:50"}, {"n": 243, "q": "ನಿಕೊದೇಮನು ಫರಿಸಾಯರಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?”", "r": "7:51"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನು ಅವರಿಗೆ, ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಶಾಸ್ತ್ರಸಮ್ಮತವೇ", "r": "7:51"}, {"n": 245, "q": "“ಈತನು ಅವರಿಗೆ, ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "7:51"}, {"n": 246, "q": "ಯೊವಾನ್ನ 7:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನು ಅವರಿಗೆ, “ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೇಳಿಕೆಯನ್ನು ಕೇಳದೆ, ಆತನು ಮಾಡಿರುವುದನ್ನು ಕಂಡುಕೊಳ್ಳದೆ, ಆತನನ್ನು ದೋಷಿಯೆಂದು ನಿರ್ಧರಿಸುವುದು ಶಾಸ್ತ್ರಸಮ್ಮತವೇ?” ಎಂದು ಕೇಳಿದನು.", "r": "7:51"}, {"n": 247, "q": "ನಿಕೊದೇಮನಿಗೆ ಫರಿಸಾಯರು ಕೊಟ್ಟ ಮರುತ್ತರ ಯಾವ ಪ್ರಶ್ನೆಯಿಂದ ಆರಂಭವಾಯಿತು?", "a": "“ನೀನೂ ಗಲಿಲೇಯದವನೋ?”", "r": "7:52"}, {"n": 248, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಗಲಿಲೇಯದಿಂದ ಯಾರು ತಲೆಯೆತ್ತುವುದಿಲ್ಲ?", "a": "ಯಾವ ಪ್ರವಾದಿಯೂ", "r": "7:52"}, {"n": 249, "q": "ಫರಿಸಾಯರು ನಿಕೊದೇಮನಿಗೆ ಏನನ್ನು ಓದಿ ನೋಡಲು ಹೇಳಿದರು?", "a": "ಪವಿತ್ರಗ್ರಂಥವನ್ನು", "r": "7:52"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ನೀನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಗಲಿಲೇಯದವನೋ", "r": "7:52"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾವ ಪ್ರವಾದಿಯೂ ತಲೆಯೆತ್ತುವುದಿಲ್ಲ, ಎಂಬುದು ನಿನಗೇ ಗೊತ್ತಾಗುತ್ತದೆ, ಎಂದು ಮರುತ್ತರ ಕೊಟ್ಟರು.”", "a": "ಗಲಿಲೇಯದಿಂದ", "r": "7:52"}, {"n": 252, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಗಲಿಲೇಯದಿಂದ ಯಾವ ಪ್ರವಾದಿಯೂ ತಲೆಯೆತ್ತುವುದಿಲ್ಲ, ಎಂಬುದು …”", "a": "“… ನಿನಗೇ ಗೊತ್ತಾಗುತ್ತದೆ, ಎಂದು ಮರುತ್ತರ ಕೊಟ್ಟರು.”", "r": "7:52"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಏಳನೆಯ ಅಧ್ಯಾಯ ಯಾವ ಸಂಗತಿಯಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು", "r": "7:53"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಳಿಕ ಎಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.”", "a": "ತಮ್ಮತಮ್ಮ", "r": "7:53"}, {"n": 255, "q": "“ಬಳಿಕ ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 53", "r": "7:53"}, {"n": 256, "q": "ಯೊವಾನ್ನ 7:53 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಬಳಿಕ ಎಲ್ಲರೂ ತಮ್ಮತಮ್ಮ ಮನೆಗಳಿಗೆ ತೆರಳಿದರು.", "r": "7:53"}]}, {"chapter": 8, "label": "ಅಧ್ಯಾಯ 8", "verses": 59, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎಂಟನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವ್ಯಭಿಚಾರಿಣಿಗೂ ಕ್ಷಮಾಪಣೆ", "r": "8:1"}, {"n": 2, "q": "ಯೇಸು ಎಂಟನೆಯ ಅಧ್ಯಾಯದ ಆರಂಭದಲ್ಲಿ ಎಲ್ಲಿಗೆ ಹೋದರು?", "a": "ಓಲಿವ್ ಗುಡ್ಡಕ್ಕೆ", "r": "8:1"}, {"n": 3, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “(<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಓಲಿವ್ ಗುಡ್ಡಕ್ಕೆ ಹೋದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:1"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “(ಯೇಸುಸ್ವಾಮಿ ಓಲಿವ್ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಗುಡ್ಡಕ್ಕೆ", "r": "8:1"}, {"n": 5, "q": "ಯೇಸು ಮತ್ತೆ ಮಹಾದೇವಾಲಯಕ್ಕೆ ಯಾವಾಗ ಬಂದರು?", "a": "ಮರುದಿನ ಮುಂಜಾನೆ", "r": "8:2"}, {"n": 6, "q": "ಜನರು ಸುತ್ತಲೂ ನೆರೆದಾಗ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಕುಳಿತುಕೊಂಡು ಬೋಧಿಸತೊಡಗಿದರು", "r": "8:2"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರುದಿನ ಮುಂಜಾನೆ ಅವರು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದರು.”", "a": "ಮಹಾದೇವಾಲಯಕ್ಕೆ", "r": "8:2"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು ಸುತ್ತಲೂ ಬಂದು ನೆರೆಯಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುಳಿತುಕೊಂಡು ಬೋಧಿಸತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "8:2"}, {"n": 9, "q": "“ಮರುದಿನ ಮುಂಜಾನೆ ಅವರು ಮತ್ತೆ ಮಹಾದೇವಾಲಯಕ್ಕೆ ಬಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "8:2"}, {"n": 10, "q": "ವ್ಯಭಿಚಾರದಲ್ಲಿ ಸಿಕ್ಕಿಬಿದ್ದ ಹೆಂಗಸನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದವರು ಯಾರು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳೂ ಫರಿಸಾಯರೂ", "r": "8:3"}, {"n": 11, "q": "ವ್ಯಭಿಚಾರಿಣಿಯ ಘಟನೆಯಲ್ಲಿ ಯೇಸು ಮಾಡಿದ ಕ್ರಿಯೆಗಳನ್ನು ಕ್ರಮವಾಗಿ ತಿಳಿಸಿ.", "a": "ಬಗ್ಗಿಕೊಂಡು ಮರಳ ಮೇಲೆ ಬರೆದರು; ನೆಟ್ಟಗೆ ಕುಳಿತು ಮಾತನಾಡಿದರು; ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆದರು; ತಲೆಯೆತ್ತಿ ಹೆಂಗಸನ್ನು ಪ್ರಶ್ನಿಸಿದರು; ಶಿಕ್ಷೆವಿಧಿಸದೆ ಕಳುಹಿಸಿದರು", "r": "8:3–11"}, {"n": 12, "q": "ಕರೆತಂದ ಹೆಂಗಸು ಯಾವಾಗ ಸಿಕ್ಕಿಬಿದ್ದಿದ್ದಳು?", "a": "ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ", "r": "8:3"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಧರ್ಮಶಾಸ್ತ್ರಿಗಳೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬ ಹೆಂಗಸನ್ನು ಅಲ್ಲಿಗೆ ಕರೆತಂದರು;”", "a": "ಫರಿಸಾಯರೂ", "r": "8:3"}, {"n": 14, "q": "“ಆಗ ಧರ್ಮಶಾಸ್ತ್ರಿಗಳೂ ಫರಿಸಾಯರೂ ಒಬ್ಬ ಹೆಂಗಸನ್ನು ಅಲ್ಲಿಗೆ ಕರೆತಂದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "8:3"}, {"n": 15, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಬೋಧಕರೇ”", "r": "8:4"}, {"n": 16, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಹೆಂಗಸನ್ನು ಎಲ್ಲಿ ನಿಲ್ಲಿಸಿದರು?", "a": "ಎಲ್ಲರ ಮುಂದೆ", "r": "8:4"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿಕ್ಕಿಬಿದ್ದಳು.”", "a": "ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ", "r": "8:4"}, {"n": 18, "q": "“ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ ಸಿಕ್ಕಿಬಿದ್ದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "8:4"}, {"n": 19, "q": "ಯೊವಾನ್ನ 8:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವಳನ್ನು ಎಲ್ಲರ ಮುಂದೆ ನಿಲ್ಲಿಸಿ, “ಬೋಧಕರೇ, ಈ ಹೆಂಗಸು ವ್ಯಭಿಚಾರಮಾಡುತ್ತಿದ್ದಾಗಲೇ ಸಿಕ್ಕಿಬಿದ್ದಳು.", "r": "8:4"}, {"n": 20, "q": "ಮೋಶೆ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ವ್ಯಭಿಚಾರಿಣಿಯರ ಬಗ್ಗೆ ಏನು ವಿಧಿಸಿದ್ದಾನೆ ಎಂದು ಅವರು ಹೇಳಿದರು?", "a": "ಇಂಥವರನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕೆಂದು", "r": "8:5"}, {"n": 21, "q": "ವ್ಯಭಿಚಾರಿಣಿಯ ಬಗ್ಗೆ ಅವರು ಯೇಸುವನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಈ ಕುರಿತು ನಿಮ್ಮ ಅಭಿಪ್ರಾಯವೇನು?”", "r": "8:5"}, {"n": 22, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮೋಶೆಯ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಉಲ್ಲೇಖಿಸಿದ ಇಬ್ಬರು/ಗುಂಪುಗಳು ಯಾರು ಮತ್ತು ಏನು?", "a": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು — ವ್ಯಭಿಚಾರಿಣಿಯನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕು (8:5); ಯೇಸು — ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಸತ್ಯ (8:17)", "r": "8:5; 8:17"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥವರನ್ನು ಕಲ್ಲೆಸೆದು ಕೊಲ್ಲಬೇಕೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ವಿಧಿಸಿದ್ದಾನೆ.”", "a": "ಮೋಶೆಯೇ", "r": "8:5"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕುರಿತು ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಅಭಿಪ್ರಾಯವೇನು", "r": "8:5"}, {"n": 25, "q": "ಧರ್ಮಶಾಸ್ತ್ರಿಗಳು ಮತ್ತು ಫರಿಸಾಯರು ಯೇಸುವನ್ನು ಏಕೆ ಪ್ರಶ್ನಿಸಿದರು?", "a": "ಯೇಸುವನ್ನು ಮಾತಿನಲ್ಲಿ ಸಿಕ್ಕಿಸಿ ಅವರ ಮೇಲೆ ತಪ್ಪುಹೊರಿಸಬೇಕೆಂದು", "r": "8:6"}, {"n": 26, "q": "ಪ್ರಶ್ನಿಸಿದಾಗ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಬಗ್ಗಿಕೊಂಡು ಬೆರಳಿನಿಂದ ಮರಳ ಮೇಲೆ ಏನನ್ನೋ ಬರೆಯುತ್ತಾ ಕುಳಿತರು", "r": "8:6"}, {"n": 27, "q": "ಯೇಸು ಮರಳ ಮೇಲೆ ಬರೆಯುತ್ತಿದ್ದಾಗ ಬಂದವರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಮೇಲಿಂದ ಮೇಲೆ ಪ್ರಶ್ನೆಹಾಕುತ್ತಲೇ ಇದ್ದರು", "r": "8:6"}, {"n": 28, "q": "ಯೇಸು ಮರಳ ಮೇಲೆ ಯಾವುದರಿಂದ ಬರೆದರು?", "a": "ಬೆರಳಿನಿಂದ", "r": "8:6"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತಿನಲ್ಲಿ ಸಿಕ್ಕಿಸಿ ಅವರ ಮೇಲೆ ತಪ್ಪುಹೊರಿಸಬೇಕೆಂಬುದೇ ಅವರ ಉದ್ದೇಶವಾಗಿತ್ತು.”", "a": "ಯೇಸುವನ್ನು", "r": "8:6"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಗ್ಗಿಕೊಂಡು ಬೆರಳಿನಿಂದ ಮರಳ ಮೇಲೆ ಏನನ್ನೋ ಬರೆಯುತ್ತಾ ಕುಳಿತರು.”", "a": "ಯೇಸುವಾದರೋ", "r": "8:6"}, {"n": 31, "q": "ಯೇಸು ನೆಟ್ಟಗೆ ಕುಳಿತು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ”", "r": "8:7"}, {"n": 32, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ವ್ಯಭಿಚಾರಿಣಿಯ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಬೇಕಾದವನು ಯಾರು?", "a": "ಪಾಪ ಮಾಡದವನು", "r": "8:7"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಟ್ಟಗೆ ಕುಳಿತು, ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ, ಎಂದು ಹೇಳಿ,”", "a": "ಯೇಸು", "r": "8:7"}, {"n": 34, "q": "“ಆಗ ಯೇಸು ನೆಟ್ಟಗೆ ಕುಳಿತು, ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ, ಎಂದು ಹೇಳಿ,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "8:7"}, {"n": 35, "q": "ಯೊವಾನ್ನ 8:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು ನೆಟ್ಟಗೆ ಕುಳಿತು, “ನಿಮ್ಮಲ್ಲಿ ಪಾಪ ಮಾಡದವನು ಯಾವನೋ ಅಂಥವನು ಇವಳ ಮೇಲೆ ಮೊದಲನೆಯ ಕಲ್ಲು ಬೀರಲಿ,” ಎಂದು ಹೇಳಿ,", "r": "8:7"}, {"n": 36, "q": "ಮಾತಾಡಿದ ನಂತರ ಯೇಸು ಪುನಃ ಏನು ಮಾಡಿದರು?", "a": "ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು", "r": "8:8"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರೆಯತೊಡಗಿದರು", "r": "8:8"}, {"n": 38, "q": "“ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "8:8"}, {"n": 39, "q": "ಯೊವಾನ್ನ 8:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುನಃ ಬಗ್ಗಿಕೊಂಡು ನೆಲದ ಮೇಲೆ ಬರೆಯತೊಡಗಿದರು.", "r": "8:8"}, {"n": 40, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿದವರು ಹೇಗೆ ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು?", "a": "ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಒಬ್ಬೊಬ್ಬರಾಗಿ", "r": "8:9"}, {"n": 41, "q": "ಕೊನೆಗೆ ಅಲ್ಲಿ ಉಳಿದವರು ಯಾರು?", "a": "ಯೇಸು ಮತ್ತು ನಿಂತುಕೊಂಡಿದ್ದ ಆ ಹೆಂಗಸು", "r": "8:9"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ್ದೇ ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಅವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು.”", "a": "ಒಬ್ಬೊಬ್ಬರಾಗಿ", "r": "8:9"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊನೆಗೆ ಅಲ್ಲಿ ಉಳಿದವರೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ನಿಂತುಕೊಂಡಿದ್ದ ಆ ಹೆಂಗಸು.”", "a": "ಯೇಸು", "r": "8:9"}, {"n": 44, "q": "“ಇದನ್ನು ಕೇಳಿದ್ದೇ ಹಿರಿಯರಿಂದ ಹಿಡಿದು ಅವರೆಲ್ಲರೂ ಒಬ್ಬೊಬ್ಬರಾಗಿ ಅಲ್ಲಿಂದ ಕಾಲುಕಿತ್ತರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "8:9"}, {"n": 45, "q": "ತಲೆಯೆತ್ತಿದ ಯೇಸು ಹೆಂಗಸನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ? ನಿನಗೆ ಯಾರೂ ಶಿಕ್ಷೆ ವಿಧಿಸಲಿಲ್ಲವೆ?”", "r": "8:10"}, {"n": 46, "q": "ಯೇಸು ವ್ಯಭಿಚಾರಿಣಿಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ತಾಯೀ”", "r": "8:10"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಲೆಯೆತ್ತಿ, ತಾಯೀ, ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ?”", "a": "ಯೇಸು", "r": "8:10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಯಾರೂ ಶಿಕ್ಷೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ವಿಧಿಸಲಿಲ್ಲವೆ", "r": "8:10"}, {"n": 49, "q": "“ಆಗ ಯೇಸು ತಲೆಯೆತ್ತಿ, ತಾಯೀ, ಅವರೆಲ್ಲಾ ಎಲ್ಲಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "8:10"}, {"n": 50, "q": "ಯೇಸುವಿನ ಪ್ರಶ್ನೆಗೆ ಹೆಂಗಸು ಏನೆಂದು ಉತ್ತರಿಸಿದಳು?", "a": "“ಇಲ್ಲ, ಸ್ವಾಮೀ”", "r": "8:11"}, {"n": 51, "q": "ಯೇಸು ವ್ಯಭಿಚಾರಿಣಿಗೆ ಕೊನೆಯಲ್ಲಿ ಏನು ಹೇಳಿದರು?", "a": "“ನಾನೂ ನಿನಗೆ ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ, ಹೋಗು; ಇನ್ನು ಮೇಲೆ ಪಾಪಮಾಡಬೇಡ”", "r": "8:11"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವಳು ಇಲ್ಲ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದಳು.”", "a": "ಸ್ವಾಮೀ", "r": "8:11"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವಳಿಗೆ, ನಾನೂ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೋಗು;”", "a": "ಶಿಕ್ಷೆವಿಧಿಸುವುದಿಲ್ಲ", "r": "8:11"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು).”", "a": "ಪಾಪಮಾಡಬೇಡ", "r": "8:11"}, {"n": 55, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:12ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಲೋಕಕ್ಕೆ ಬೆಳಕು", "r": "8:12"}, {"n": 56, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಜಗಜ್ಯೋತಿ ಎಂದು ಘೋಷಿಸಿದ ವಚನ ಯಾವುದು?", "a": "“ನಾನೇ ಜಗಜ್ಯೋತಿ, ನನ್ನನ್ನು ಹಿಂಬಾಲಿಸುವವನು ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ. ಜೀವದಾಯಕ ಜ್ಯೋತಿ ಅವನಲ್ಲಿರುತ್ತದೆ.”", "r": "8:12"}, {"n": 57, "q": "ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸುವವನಲ್ಲಿ ಏನು ಇರುತ್ತದೆ?", "a": "ಜೀವದಾಯಕ ಜ್ಯೋತಿ", "r": "8:12"}, {"n": 58, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1ನೇ ಮತ್ತು 8ನೇ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಜ್ಯೋತಿಯ ಬಗ್ಗೆ ಹೇಳಿರುವುದೇನು?", "a": "ಜ್ಯೋತಿ ಕತ್ತಲಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ (1:5); ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸುವವನು ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ (8:12)", "r": "1:5; 8:12"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜನರನ್ನು ಮತ್ತೊಮ್ಮೆ ಕಂಡು ಹೀಗೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:12"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೇ ಜಗಜ್ಯೋತಿ, ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕತ್ತಲಲ್ಲಿ ನಡೆಯುವುದಿಲ್ಲ.”", "a": "ಹಿಂಬಾಲಿಸುವವನು", "r": "8:12"}, {"n": 61, "q": "“ನಾನೇ ಜಗಜ್ಯೋತಿ” ಎಂದಾಗ ಫರಿಸಾಯರು ಏನೆಂದರು?", "a": "“ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ”", "r": "8:13"}, {"n": 62, "q": "ಯೇಸುವಿನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ ಎಂದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರು", "r": "8:13"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ, ಎಂದರು.”", "a": "ಫರಿಸಾಯರು", "r": "8:13"}, {"n": 64, "q": "“ಅದಕ್ಕೆ ಫರಿಸಾಯರು, ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "8:13"}, {"n": 65, "q": "ಯೊವಾನ್ನ 8:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಫರಿಸಾಯರು, “ಈಗ ನೀನು ನಿನ್ನ ಪರವಾಗಿಯೇ ಸಾಕ್ಷಿ ನೀಡುತ್ತಿರುವೆ, ಅಂಥ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿಲ್ಲ,” ಎಂದರು.", "r": "8:13"}, {"n": 66, "q": "ತಮ್ಮ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯುಂಟು ಎಂದು ಯೇಸು ಹೇಳಲು ಕಾರಣವೇನು?", "a": "ತಾವು ಎಲ್ಲಿಂದ ಬಂದರು, ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿದ್ದಾರೆ ಎಂದು ಅವರಿಗೆ ತಿಳಿದಿರುವುದರಿಂದ", "r": "8:14"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದರೂ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯುಂಟು.”", "a": "ಯೇಸು", "r": "8:14"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು ಎಲ್ಲಿಂದ ಬಂದೆ, ಎಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನನಗೆ ತಿಳಿದಿದೆ.”", "a": "ಹೋಗುತ್ತಿರುವೆ", "r": "8:14"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಬಂದುದು ಎಲ್ಲಿಂದ, ಹೋಗುವುದು ಎಲ್ಲಿಗೆ ಎಂದು ತಿಳಿಯದು.”", "a": "ನಿಮಗಾದರೋ", "r": "8:14"}, {"n": 70, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಹೇಗೆ ತೀರ್ಪುಕೊಡುತ್ತಾರೆ?", "a": "ಲೋಕದ ದೃಷ್ಟಿಯಿಂದ", "r": "8:15"}, {"n": 71, "q": "ಯೇಸು ಯಾರ ಬಗ್ಗೆಯೂ ಏನು ಮಾಡಲು ಹೋಗುವುದಿಲ್ಲ?", "a": "ತೀರ್ಪುಕೊಡಲು", "r": "8:15"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕದ ದೃಷ್ಟಿಯಿಂದ.”", "a": "ತೀರ್ಪುಕೊಡುವುದು", "r": "8:15"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾದರೋ ಯಾರ ಬಗ್ಗೆಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗುವುದಿಲ್ಲ.”", "a": "ತೀರ್ಪುಕೊಡಲು", "r": "8:15"}, {"n": 74, "q": "ಯೊವಾನ್ನ 8:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ತೀರ್ಪುಕೊಡುವುದು ಲೋಕದ ದೃಷ್ಟಿಯಿಂದ. ನಾನಾದರೋ ಯಾರ ಬಗ್ಗೆಯೂ ತೀರ್ಪುಕೊಡಲು ಹೋಗುವುದಿಲ್ಲ.", "r": "8:15"}, {"n": 75, "q": "ಯೇಸುವಿನ ತೀರ್ಪು ಏಕೆ ಯಥಾರ್ಥವಾದುದು?", "a": "ತೀರ್ಪುಕೊಡುವವನು ಅವರೊಬ್ಬರೇ ಅಲ್ಲ; ಅವರನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ಅವರೊಡನೆ ಇದ್ದಾರೆ", "r": "8:16"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದು ಯಥಾರ್ಥವಾದುದು.”", "a": "ತೀರ್ಪುಕೊಟ್ಟರೂ", "r": "8:16"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೊಬ್ಬನೇ ಅಲ್ಲ;”", "a": "ತೀರ್ಪುಕೊಡುವವನು", "r": "8:16"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನೊಡನೆ ಇದ್ದಾರೆ.”", "a": "ನನ್ನನ್ನು", "r": "8:16"}, {"n": 79, "q": "ಧರ್ಮಶಾಸ್ತ್ರದ ಪ್ರಕಾರ ಯಾವ ಸಾಕ್ಷ್ಯ ಸತ್ಯ?", "a": "ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ", "r": "8:17"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿದೆ.”", "a": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ", "r": "8:17"}, {"n": 81, "q": "“ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ ಬರೆದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "8:17"}, {"n": 82, "q": "ಯೊವಾನ್ನ 8:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇಬ್ಬರ ಸಾಕ್ಷ್ಯ ಒಂದೇ ಆಗಿದ್ದರೆ ಅದು ಸತ್ಯವೆಂದು ನಿಮ್ಮ ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿಯೇ ಬರೆದಿದೆ.", "r": "8:17"}, {"n": 83, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ಹೇಳುವ ಇಬ್ಬರು ಯಾರು?", "a": "ಯೇಸು ತಾವೇ ಮತ್ತು ಅವರನ್ನು ಕಳುಹಿಸಿದ ಪಿತ", "r": "8:18"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "8:18"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತ ಸಹ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಹೇಳುತ್ತಾರೆ", "r": "8:18"}, {"n": 86, "q": "“ನಾನು ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ಹೇಳುತ್ತೇನೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "8:18"}, {"n": 87, "q": "ಫರಿಸಾಯರು ಯೇಸುವಿನ ಪಿತನ ಬಗ್ಗೆ ಏನು ಕೇಳಿದರು?", "a": "“ನಿನ್ನ ಪಿತನೆಲ್ಲಿ?”", "r": "8:19"}, {"n": 88, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಅವರನ್ನು ಅರಿತಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಅವರ ಪಿತನನ್ನೂ ಅರಿಯುತ್ತಿದ್ದರು", "r": "8:19"}, {"n": 89, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಯಾರನ್ನು ಅರಿತಿಲ್ಲ?", "a": "ಯೇಸುವನ್ನೂ ಅವರ ಪಿತನನ್ನೂ", "r": "8:19"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪಿತನೆಲ್ಲಿ", "r": "8:19"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀವು ನನ್ನನ್ನು ಅರಿತಿಲ್ಲ, ನನ್ನ ಪಿತನನ್ನೂ ಅರಿತಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "8:19"}, {"n": 92, "q": "ಲೋಕಕ್ಕೆ ಬೆಳಕು ಎಂಬ ವಿಭಾಗದ ಬೋಧನೆಯನ್ನು ಯೇಸು ಎಲ್ಲಿ ಮಾಡಿದರು?", "a": "ಮಹಾದೇವಾಲಯದೊಳಗೆ ಕಾಣಿಕೆ ಪೆಟ್ಟಿಗೆಗಳನ್ನಿಟ್ಟ ಕೋಣೆಯಲ್ಲಿ", "r": "8:20"}, {"n": 93, "q": "ಯೇಸುವನ್ನು ಯಾರೂ ಏಕೆ ಬಂಧಿಸಲಿಲ್ಲ (8:20)?", "a": "ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದಿದ್ದ ಕಾರಣ", "r": "8:20"}, {"n": 94, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು ಬಂಧನದಿಂದ/ಕಲ್ಲೆಸೆತದಿಂದ ತಪ್ಪಿಸಿಕೊಂಡ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಗಳಿಗೆ ಬಾರದಿದ್ದ ಕಾರಣ ಯಾರೂ ಬಂಧಿಸಲಿಲ್ಲ (8:20); ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡಾಗ ಮರೆಯಾಗಿ ಹೊರಟು ಹೋದರು (8:59)", "r": "8:20; 8:59"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಹಾದೇವಾಲಯದೊಳಗೆ ಕಾಣಿಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೋಣೆಯಲ್ಲಿ ಯೇಸು ಮಾತಾಡುತ್ತಾ ಹೇಳಿದ ಮಾತುಗಳಿವು.”", "a": "ಪೆಟ್ಟಿಗೆಗಳನ್ನಿಟ್ಟ", "r": "8:20"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದಿದ್ದ ಕಾರಣ ಯಾರೂ ಅವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂಧಿಸಲಿಲ್ಲ", "r": "8:20"}, {"n": 97, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:21ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನಾನು ಹೋಗುವಲ್ಲಿಗೆ ನೀವು ಬರಲಾರಿರಿ", "r": "8:21"}, {"n": 98, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಯಾವುದರಲ್ಲೇ ಸಾಯುವರು?", "a": "ತಮ್ಮ ಪಾಪದಲ್ಲೇ", "r": "8:21"}, {"n": 99, "q": "ಪಾಪದಲ್ಲೇ ಅಥವಾ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವಿರಿ ಎಂಬ ಎಚ್ಚರಿಕೆ ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಮೂರು ಬಾರಿ (8:21 ಒಂದು; 8:24 ಎರಡು)", "r": "8:21; 8:24"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುನಃ ಅವರಿಗೆ, ನಾನು ಹೊರಟುಹೋಗುತ್ತೇನೆ, ನೀವು ನನ್ನನ್ನು ಹುಡುಕುವಿರಿ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:21"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಿಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಸಾಯುವಿರಿ.”", "a": "ಪಾಪದಲ್ಲೇ", "r": "8:21"}, {"n": 102, "q": "“ನಾನು ಹೋಗುವಲ್ಲಿಗೆ ನೀವು ಬರಲಾರಿರಿ” ಎಂಬುದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯರು ಏನೆಂದು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "‘ಹಾಗೆಂದರೆ ಆತ್ಮಹತ್ಯೆ ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂಬುದು ಇವನ ಇಂಗಿತವೆ?’", "r": "8:22"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ತಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮಿಂದ ಬರಲಾಗದಂತೆ!”", "a": "ಹೋಗುವಲ್ಲಿಗೆ", "r": "8:22"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಂದರೆ ಆತ್ಮಹತ್ಯೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನ ಇಂಗಿತವೆ?”", "a": "ಮಾಡಿಕೊಳ್ಳಬೇಕೆಂಬುದು", "r": "8:22"}, {"n": 105, "q": "“ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ತಾನು ಹೋಗುವಲ್ಲಿಗೆ ನಮ್ಮಿಂದ ಬರಲಾಗದಂತೆ!” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "8:22"}, {"n": 106, "q": "ಯೇಸು ಯೆಹೂದ್ಯರನ್ನು ತಮ್ಮೊಂದಿಗೆ ಹೇಗೆ ಹೋಲಿಸಿದರು?", "a": "“ನೀವು ನರಲೋಕದವರು, ನಾನು ಪರಲೋಕದವನು. ನಿಮ್ಮಂತೆ ನಾನು ಇಹಲೋಕದವನಲ್ಲ”", "r": "8:23"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಪರಲೋಕದವನು.”", "a": "ನರಲೋಕದವರು", "r": "8:23"}, {"n": 108, "q": "ಯೊವಾನ್ನ 8:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀವು ನರಲೋಕದವರು, ನಾನು ಪರಲೋಕದವನು. ನಿಮ್ಮಂತೆ ನಾನು ಇಹಲೋಕದವನಲ್ಲ,", "r": "8:23"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನರಲೋಕದವರು, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಲೋಕದವನು", "r": "8:23"}, {"n": 110, "q": "ಯೆಹೂದ್ಯರು ಏನನ್ನು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರೆ ತಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವರು?", "a": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂಬುದನ್ನು", "r": "8:24"}, {"n": 111, "q": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂಬ ಮಾತು ಎಂಟನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ಎರಡು ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "8:24 ಮತ್ತು 8:28", "r": "8:24; 8:28"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ.”", "a": "ಸಾಯುವಿರೆಂದು", "r": "8:24"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇರುವಾತನೇ ನಾನು ಎಂಬುದನ್ನು ನೀವು ವಿಶ್ವಾಸಿಸದೆ ಹೋದರೆ ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ಸಾಯುವಿರಿ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "8:24"}, {"n": 114, "q": "“ನಿಮ್ಮ ಪಾಪಗಳಲ್ಲೇ ನೀವು ಸಾಯುವಿರೆಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "8:24"}, {"n": 115, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು 8:25ರಲ್ಲಿ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಯಾರು?”", "r": "8:25"}, {"n": 116, "q": "ಯೊವಾನ್ನ 8:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು, “ನೀನು ಯಾರು?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "8:25"}, {"n": 117, "q": "ಯೇಸು ಲೋಕಕ್ಕೆ ಏನನ್ನು ಸಾರುತ್ತಾರೆ?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಳಿದ್ದನ್ನೇ", "r": "8:26"}, {"n": 118, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಗಿದ್ದಾನೆ?", "a": "ಸತ್ಯಸ್ವರೂಪಿ", "r": "8:26"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಯಾರೆಂದು ನಿಮಗೆ ಮೊದಲಿನಿಂದಲೂ ತಿಳಿಸುತ್ತಾ ಬಂದಿದ್ದೇನೆ.”", "a": "ಯೇಸು", "r": "8:26"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ನಾನು ಎಷ್ಟೋ ಹೇಳಿಯೇನು;”", "a": "ನಿಮ್ಮನ್ನು", "r": "8:26"}, {"n": 121, "q": "ಯೆಹೂದ್ಯರು ಏನನ್ನು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ?", "a": "ಯೇಸು ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಮಾತನಾಡುತ್ತಿದ್ದಾರೆಂದು", "r": "8:27"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:27"}, {"n": 123, "q": "“ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "8:27"}, {"n": 124, "q": "ಯೊವಾನ್ನ 8:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಪಿತನನ್ನು ಕುರಿತು ಹೀಗೆನ್ನುತ್ತಿದ್ದಾರೆಂದು ಅವರು ಅರಿತುಕೊಳ್ಳಲಿಲ್ಲ.", "r": "8:27"}, {"n": 125, "q": "‘ಇರುವಾತನೇ ನಾನು’ ಎಂದು ಯೆಹೂದ್ಯರಿಗೆ ಯಾವಾಗ ತಿಳಿಯುವುದು?", "a": "ಅವರು ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೇರಿಸಿದಾಗ", "r": "8:28"}, {"n": 126, "q": "ಯೇಸು ಹೇಗೆ ಮಾತನಾಡುತ್ತಾರೆ?", "a": "ಪಿತನು ತಮಗೆ ಬೋಧಿಸಿದಂತೆ", "r": "8:28"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೆ ಇಂತೆಂದರು:”", "a": "ಯೇಸು", "r": "8:28"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನರಪುತ್ರನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇರುವಾತನೇ ನಾನು ಎಂದು ನಿಮಗೆ ತಿಳಿಯುವುದು.”", "a": "ಮೇಲಕ್ಕೇರಿಸಿದಾಗ", "r": "8:28"}, {"n": 129, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಅವರನ್ನು ಏಕಾಕಿಯಾಗಿ ಏಕೆ ಬಿಟ್ಟಿಲ್ಲ?", "a": "ಆತನು ಮೆಚ್ಚುವುದನ್ನೇ ಯೇಸು ಸತತವೂ ಮಾಡುವುದರಿಂದ", "r": "8:29"}, {"n": 130, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನು ಎಲ್ಲಿದ್ದಾನೆ?", "a": "ಯೇಸುವಿನೊಡನಿದ್ದಾನೆ", "r": "8:29"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಸತತವೂ ಮಾಡುವುದರಿಂದ ಆತನು ನನ್ನನ್ನು ಏಕಾಕಿಯಾಗಿ ಬಿಟ್ಟಿಲ್ಲ.”", "a": "ಮೆಚ್ಚುವುದನ್ನೇ", "r": "8:29"}, {"n": 132, "q": "“ಆತನು ಮೆಚ್ಚುವುದನ್ನೇ ನಾನು ಸತತವೂ ಮಾಡುವುದರಿಂದ ಆತನು ನನ್ನನ್ನು ಏಕಾಕಿಯಾಗಿ ಬಿಟ್ಟಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "8:29"}, {"n": 133, "q": "ಯೇಸುವಿನ ಮಾತುಗಳನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಏನಾಯಿತು?", "a": "ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು", "r": "8:30"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:30"}, {"n": 135, "q": "“ಯೇಸುಸ್ವಾಮಿ ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "8:30"}, {"n": 136, "q": "ಯೊವಾನ್ನ 8:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಹೀಗೆ ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಹಲವರಿಗೆ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.", "r": "8:30"}, {"n": 137, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:31ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದಾಸ್ಯ ಮತ್ತು ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:31"}, {"n": 138, "q": "ಯಾರು ನಿಜವಾಗಿಯೂ ಯೇಸುವಿನ ಶಿಷ್ಯರು?", "a": "ಅವರ ಮಾತಿಗೆ ಶರಣಾದವರು", "r": "8:31"}, {"n": 139, "q": "“ನನ್ನ ಮಾತಿಗೆ ನೀವು ಶರಣಾದರೆ ನಿಜವಾಗಿಯೂ ನೀವು ನನ್ನ ಶಿಷ್ಯರು” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ತಮ್ಮಲ್ಲಿ ನಂಬಿಕೆ ಇಟ್ಟಿದ್ದ ಯೆಹೂದ್ಯರಿಗೆ", "r": "8:31"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮಲ್ಲಿ ನಂಬಿಕೆ ಇಟ್ಟಿದ್ದ ಯೆಹೂದ್ಯರಿಗೆ ಹೀಗೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "8:31"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾತಿಗೆ ನೀವು ಶರಣಾದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನ ಶಿಷ್ಯರು.”", "a": "ನಿಜವಾಗಿಯೂ", "r": "8:31"}, {"n": 142, "q": "ಸತ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಹೇಳಿದ ಪ್ರಸಿದ್ಧ ಮಾತು ಯಾವುದು?", "a": "“ನೀವು ಸತ್ಯವನ್ನು ಅರಿತುಕೊಳ್ಳುವಿರಿ. ಸತ್ಯವು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುವುದು.”", "r": "8:32"}, {"n": 143, "q": "ಸತ್ಯವು ಏನನ್ನು ನೀಡುವುದು?", "a": "ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:32"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯವು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀಡುವುದು.”", "a": "ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:32"}, {"n": 145, "q": "ಯೊವಾನ್ನ 8:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಸತ್ಯವನ್ನು ಅರಿತುಕೊಳ್ಳುವಿರಿ. ಸತ್ಯವು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುವುದು.”", "r": "8:32"}, {"n": 146, "q": "ಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಕೇಳಿದ ಯೆಹೂದ್ಯರು ತಮ್ಮ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ನಾವು ಅಬ್ರಹಾಮನ ವಂಶಜರು; ಯಾರಿಗೂ ಎಂದೂ ನಾವು ದಾಸರಾಗಿಲ್ಲ.”", "r": "8:33"}, {"n": 147, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಅಬ್ರಹಾಮನನ್ನು ಹೇಗೆ ಉಲ್ಲೇಖಿಸುತ್ತಾರೆ?", "a": "“ನಾವು ಅಬ್ರಹಾಮನ ವಂಶಜರು” (8:33); “ಅಬ್ರಹಾಮನೇ ನಮ್ಮ ತಂದೆ” (8:39); “ನಮ್ಮ ತಂದೆ ಅಬ್ರಹಾಮ” (8:53)", "r": "8:33; 8:39; 8:53"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೆಹೂದ್ಯರು, ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಂಶಜರು;”", "a": "ಅಬ್ರಹಾಮನ", "r": "8:33"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರಿಗೂ ಎಂದೂ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಾಸರಾಗಿಲ್ಲ", "r": "8:33"}, {"n": 150, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪಾಪವನ್ನು ಮಾಡುವವನು ಏನಾಗಿದ್ದಾನೆ?", "a": "ಪಾಪಕ್ಕೆ ದಾಸನೇ", "r": "8:34"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ ಕೇಳಿ:”", "a": "ಯೇಸು", "r": "8:34"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವನು ಪಾಪಕ್ಕೆ ದಾಸನೇ.”", "a": "ಪಾಪವನ್ನು", "r": "8:34"}, {"n": 153, "q": "“ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ ಕೇಳಿ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "8:34"}, {"n": 154, "q": "ದಾಸನಿಗೂ ಪುತ್ರನಿಗೂ ಮನೆಯಲ್ಲಿ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ದಾಸನಾದವನು ಶಾಶ್ವತವಾಗಿ ಮನೆಯಲ್ಲಿ ಇರುವಂತಿಲ್ಲ; ಶಾಶ್ವತವಾಗಿ ಇರುವವನು ಪುತ್ರನೇ", "r": "8:35"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸನಾದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನೆಯಲ್ಲಿ ಇರುವಂತಿಲ್ಲ.”", "a": "ಶಾಶ್ವತವಾಗಿ", "r": "8:35"}, {"n": 156, "q": "ಯೊವಾನ್ನ 8:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಾಸನಾದವನು ಶಾಶ್ವತವಾಗಿ ಮನೆಯಲ್ಲಿ ಇರುವಂತಿಲ್ಲ. ಶಾಶ್ವತವಾಗಿ ಇರುವವನು ಪುತ್ರನೇ.", "r": "8:35"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾಸನಾದವನು ಶಾಶ್ವತವಾಗಿ ಮನೆಯಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರುವಂತಿಲ್ಲ", "r": "8:35"}, {"n": 158, "q": "ಪುತ್ರನು ನೀಡುವ ಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.”", "r": "8:36"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.”", "a": "ಸ್ವಾತಂತ್ರ್ಯ", "r": "8:36"}, {"n": 160, "q": "“ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "8:36"}, {"n": 161, "q": "ಯೊವಾನ್ನ 8:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ, ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು.", "r": "8:36"}, {"n": 162, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಏಕೆ ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದರು?", "a": "ಅವರ ಮಾತು ಹಿಡಿಸದ ಕಾರಣ", "r": "8:37"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಂಶಜರೆಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಅಬ್ರಹಾಮನ", "r": "8:37"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನನ್ನ ಮಾತು ಹಿಡಿಸದ ಕಾರಣ ನನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹವಣಿಸುತ್ತೀರಿ", "r": "8:37"}, {"n": 165, "q": "“ನೀವು ಅಬ್ರಹಾಮನ ವಂಶಜರೆಂದು ನಾನು ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "8:37"}, {"n": 166, "q": "ಯೇಸುವಿನ ಮಾತುಗಳು ಮತ್ತು ಯೆಹೂದ್ಯರ ಕಾರ್ಯಗಳು ಏನನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ?", "a": "ಯೇಸುವಿನ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ಕಂಡದ್ದನ್ನು ನಿರೂಪಿಸುತ್ತವೆ; ಯೆಹೂದ್ಯರ ಕಾರ್ಯಗಳು ಅವರ ತಂದೆಯಿಂದ ಕಲಿತದ್ದನ್ನು ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನಾಡುವ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ನಾನು ಕಂಡದ್ದನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಿರೂಪಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಮಾಡುವ ಕಾರ್ಯಗಳೋ ನಿಮ್ಮ ತಂದೆಯಿಂದ ನೀವು ಕಲಿತದ್ದನ್ನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ವ್ಯಕ್ತಪಡಿಸುತ್ತವೆ", "r": "8:38"}, {"n": 169, "q": "“ನಾನಾಡುವ ಮಾತುಗಳು ಪಿತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ನಾನು ಕಂಡದ್ದನ್ನೇ ನಿರೂಪಿಸುತ್ತವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "8:38"}, {"n": 170, "q": "ಯೆಹೂದ್ಯರು ತಮ್ಮ ತಂದೆ ಯಾರೆಂದು ಮರುನುಡಿದರು?", "a": "“ಅಬ್ರಹಾಮನೇ ನಮ್ಮ ತಂದೆ”", "r": "8:39"}, {"n": 171, "q": "ಯೆಹೂದ್ಯರು ಅಬ್ರಹಾಮನ ಮಕ್ಕಳಾಗಿದ್ದರೆ ಏನು ಮಾಡುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅಬ್ರಹಾಮನು ಮಾಡಿದಂತೆ ಮಾಡುತ್ತಿದ್ದರು", "r": "8:39"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಯೆಹೂದ್ಯರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮ್ಮ ತಂದೆ, ಎಂದು ಮರುನುಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನೇ", "r": "8:39"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು ನೀವಾಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಂತೆ ನೀವು ಮಾಡುತ್ತಿದ್ದಿರಿ.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:39"}, {"n": 174, "q": "ಯೆಹೂದ್ಯರು ಯಾರನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ಅವರಿಗೆ ಹೇಳುತ್ತಿರುವ ಯೇಸುವನ್ನು", "r": "8:40"}, {"n": 175, "q": "ಅಬ್ರಹಾಮನು ಏನು ಮಾಡಲಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಸತ್ಯವನ್ನು ಹೇಳುವವನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸಲಿಲ್ಲ (ಹಾಗೇನೂ ಮಾಡಲಿಲ್ಲ)", "r": "8:40"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಬದಲಾಗಿ ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ನಿಮಗೆ ಹೇಳುತ್ತಿರುವ ನನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹವಣಿಸುತ್ತಿದ್ದೀರಿ", "r": "8:40"}, {"n": 177, "q": "“ಅದಕ್ಕೆ ಬದಲಾಗಿ ದೇವರಿಂದಲೇ ತಿಳಿದ ಸತ್ಯವನ್ನು ನಿಮಗೆ ಹೇಳುತ್ತಿರುವ ನನ್ನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "8:40"}, {"n": 178, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಯೆಹೂದ್ಯರು ಹೇಗೆ ಪ್ರತಿಭಟಿಸಿದರು?", "a": "“ನಾವೇನು ಹಾದರಕ್ಕೆ ಹುಟ್ಟಿದವರಲ್ಲ, ದೇವರೇ ನಮ್ಮ ತಂದೆ”", "r": "8:41"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಾದರೋ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದಂತೆ ಮಾಡುತ್ತೀರಿ, ಎಂದರು.”", "a": "ತಂದೆಯಾದವನು", "r": "8:41"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ನಾವೇನು ಹಾದರಕ್ಕೆ ಹುಟ್ಟಿದವರಲ್ಲ, ದೇವರೇ ನಮ್ಮ ತಂದೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರತಿಭಟಿಸಿದರು", "r": "8:41"}, {"n": 181, "q": "“ನೀವಾದರೋ ನಿಮಗೆ ತಂದೆಯಾದವನು ಮಾಡಿದಂತೆ ಮಾಡುತ್ತೀರಿ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "8:41"}, {"n": 182, "q": "ದೇವರು ಯೆಹೂದ್ಯರ ತಂದೆಯಾಗಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ಮೇಲೆ ಅವರಿಗೆ ಪ್ರೀತಿಯಿರುತ್ತಿತ್ತು", "r": "8:42"}, {"n": 183, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದವರು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ದೇವರೇ", "r": "8:42"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಅವರಿಗೆ, ದೇವರೇ ನಿಮ್ಮ ತಂದೆಯಾಗಿದ್ದರೆ, ನನ್ನ ಮೇಲೆ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರೀತಿಯಿರುತ್ತಿತ್ತು", "r": "8:42"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟು ಇಲ್ಲಿಗೆ ಬಂದವನು.”", "a": "ದೇವರಿಂದಲೇ", "r": "8:42"}, {"n": 186, "q": "ಯೇಸು ಹೇಳುವುದು ಯೆಹೂದ್ಯರಿಗೆ ಏಕೆ ಅರ್ಥವಾಗುವುದಿಲ್ಲ?", "a": "ಅವರ ಸಂದೇಶಕ್ಕೆ ಕಿವಿಗೊಡಲು ಅವರಿಂದಾಗದಿರುವುದರಿಂದ", "r": "8:43"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹೇಳುವುದು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏಕೆ?”", "a": "ಅರ್ಥವಾಗುವುದಿಲ್ಲ", "r": "8:43"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಸಂದೇಶಕ್ಕೆ ಕಿವಿಗೊಡಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದಕ್ಕೆ ಕಾರಣ.”", "a": "ನಿಮ್ಮಿಂದಾಗದಿರುವುದೇ", "r": "8:43"}, {"n": 189, "q": "“ನಾನು ಹೇಳುವುದು ನಿಮಗೆ ಅರ್ಥವಾಗುವುದಿಲ್ಲ, ಏಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "8:43"}, {"n": 190, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರ ತಂದೆ ಯಾರು?", "a": "ಸೈತಾನ", "r": "8:44"}, {"n": 191, "q": "ಯೇಸು ಸೈತಾನನನ್ನು ವರ್ಣಿಸಲು ಉಪಯೋಗಿಸಿದ ನಾಲ್ಕು ವಿಶೇಷಣಗಳು ಯಾವುವು?", "a": "ಕೊಲೆಪಾತಕ; ಸತ್ಯಪರನಲ್ಲ; ಸುಳ್ಳುಗಾರ; ಸುಳ್ಳಿನ ಮೂಲಪುರುಷ", "r": "8:44"}, {"n": 192, "q": "ಸೈತಾನನು ಯಾವಾಗಿನಿಂದ ಕೊಲೆಪಾತಕ?", "a": "ಮೊತ್ತ ಮೊದಲಿನಿಂದಲೂ", "r": "8:44"}, {"n": 193, "q": "ಸೈತಾನನು ಸುಳ್ಳಾಡುವಾಗ ಏನನ್ನು ಆಡುತ್ತಾನೆ?", "a": "ತನಗೆ ಸಹಜವಾದುದನ್ನೇ", "r": "8:44"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನಿಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಮಾಡಬಯಸುತ್ತೀರಿ;”", "a": "ಮಾಡಬಯಸುವುದನ್ನು", "r": "8:44"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೊತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು ಕೊಲೆಪಾತಕ.”", "a": "ಮೊದಲಿನಿಂದಲೂ", "r": "8:44"}, {"n": 196, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲದ್ದಕ್ಕೆ ಯೇಸು ಕೊಟ್ಟ ಕಾರಣವೇನು?", "a": "ಯೇಸು ನುಡಿಯುವುದು ಸತ್ಯವನ್ನೇ", "r": "8:45"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.”", "a": "ಆದುದರಿಂದಲೇ", "r": "8:45"}, {"n": 198, "q": "“ಆದುದರಿಂದಲೇ ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "8:45"}, {"n": 199, "q": "ಯೊವಾನ್ನ 8:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನು ನುಡಿಯುವುದಾದರೋ ಸತ್ಯವನ್ನೇ. ಆದುದರಿಂದಲೇ ನಿಮಗೆ ನನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಲ್ಲ.", "r": "8:45"}, {"n": 200, "q": "ತಮ್ಮಲ್ಲಿ ತಪ್ಪಿದೆಯೇ ಎಂದು ಯೇಸು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು ಸಮರ್ಥಿಸಬಲ್ಲವರು ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?”", "r": "8:46"}, {"n": 201, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?”", "a": "ಸಮರ್ಥಿಸಬಲ್ಲವರು", "r": "8:46"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸತ್ಯವನ್ನೇ ಆಡುವುದಾದರೆ ನನ್ನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ನಂಬುವುದಿಲ್ಲವೇಕೆ", "r": "8:46"}, {"n": 203, "q": "“ನನ್ನಲ್ಲಿ ತಪ್ಪಿದೆಯೆಂದು ಸಮರ್ಥಿಸಬಲ್ಲವರು ನಿಮ್ಮಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "8:46"}, {"n": 204, "q": "ದೇವರ ಮಾತಿಗೆ ಕಿವಿಗೊಡುವವರು ಯಾರು?", "a": "ದೇವರ ಮಕ್ಕಳು", "r": "8:47"}, {"n": 205, "q": "ಯೆಹೂದ್ಯರು ದೇವರ ಮಾತಿಗೆ ಏಕೆ ಕಿವಿಗೊಡುವುದಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅವರು ದೇವರ ಮಕ್ಕಳಲ್ಲದ್ದರಿಂದ", "r": "8:47"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮಕ್ಕಳು ದೇವರ ಮಾತಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಿವಿಗೊಡುತ್ತಾರೆ", "r": "8:47"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವೋ ದೇವರ ಮಕ್ಕಳಲ್ಲ, ಆದುದರಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಕಿವಿಗೊಡುವುದಿಲ್ಲ", "r": "8:47"}, {"n": 208, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 8:48ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಅಬ್ರಹಾಮ", "r": "8:48"}, {"n": 209, "q": "ಯೆಹೂದ್ಯರಲ್ಲಿ ಕೆಲವರು ಯೇಸುವನ್ನು ಯಾವ ಎರಡು ರೀತಿಯಲ್ಲಿ ಕರೆದರು?", "a": "ಸಮಾರಿಯದವನು; ದೆವ್ವಹಿಡಿದವನು", "r": "8:48"}, {"n": 210, "q": "ಎಂಟನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು “ದೆವ್ವಹಿಡಿದವನು” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಕರೆದರು?", "a": "ಎರಡು ಬಾರಿ (8:48; 8:52)", "r": "8:48; 8:52"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೆಹೂದ್ಯರಲ್ಲಿ ಕೆಲವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀನು ಸಮಾರಿಯದವನು.”", "a": "ಯೇಸುಸ್ವಾಮಿಗೆ", "r": "8:48"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನಾವು ಹೇಳಿದ್ದು ಸರಿಯಾಗಿದೆ ಅಲ್ಲವೆ?”", "a": "ದೆವ್ವಹಿಡಿದವನು", "r": "8:48"}, {"n": 213, "q": "“ದೆವ್ವಹಿಡಿದವನು” ಎಂದು ಕರೆದಾಗ ಯೇಸು ಏನು ಉತ್ತರಿಸಿದರು?", "a": "“ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ. ನೀವಾದರೋ ನನ್ನನ್ನು ಅವಮಾನಪಡಿಸುತ್ತೀರಿ.”", "r": "8:49"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ.”", "a": "ಯೇಸು", "r": "8:49"}, {"n": 215, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "8:49"}, {"n": 216, "q": "ಯೊವಾನ್ನ 8:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ನಾನು ದೆವ್ವಹಿಡಿದವನಲ್ಲ, ನನ್ನ ಪಿತನನ್ನು ನಾನು ಗೌರವಿಸುತ್ತೇನೆ. ನೀವಾದರೋ ನನ್ನನ್ನು ಅವಮಾನಪಡಿಸುತ್ತೀರಿ.", "r": "8:49"}, {"n": 217, "q": "ಯೇಸು ತಮ್ಮ ಯಾವುದನ್ನು ಅಪೇಕ್ಷಿಸುವುದಿಲ್ಲ?", "a": "ತಮ್ಮ ಘನತೆ ಗೌರವವನ್ನು", "r": "8:50"}, {"n": 218, "q": "ಯೇಸುವಿನ ಘನತೆ ಗೌರವವನ್ನು ಅಪೇಕ್ಷಿಸುವವರು ಮತ್ತು ಅವರ ಪರವಾಗಿ ತೀರ್ಮಾನ ಮಾಡುವವರು ಯಾರು?", "a": "ಬೇರೊಬ್ಬರು (ಪಿತನು)", "r": "8:50"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಘನತೆ ಗೌರವವನ್ನು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಪೇಕ್ಷಿಸುವುದಿಲ್ಲ", "r": "8:50"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ತೀರ್ಮಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರೇ.”", "a": "ಮಾಡುವುದೂ", "r": "8:50"}, {"n": 221, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ಯಾವುದಕ್ಕೆ ತುತ್ತಾಗನು?", "a": "ನಿತ್ಯಮರಣಕ್ಕೆ", "r": "8:51"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ, ಎಂದರು.”", "a": "ನಿತ್ಯಮರಣಕ್ಕೆ", "r": "8:51"}, {"n": 223, "q": "“ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ನಿತ್ಯಮರಣಕ್ಕೆ ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "8:51"}, {"n": 224, "q": "ಯೊವಾನ್ನ 8:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ನಿತ್ಯಮರಣಕ್ಕೆ ತುತ್ತಾಗನು, ಎಂದು ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಹೇಳುತ್ತೇನೆ,” ಎಂದರು.", "r": "8:51"}, {"n": 225, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಸತ್ತುಹೋದವರು ಯಾರು?", "a": "ಅಬ್ರಹಾಮನು ಮತ್ತು ಪ್ರವಾದಿಗಳು", "r": "8:52"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ನಮಗೆ ಸ್ಪಷ್ಟವಾಯಿತು.”", "a": "ದೆವ್ವಹಿಡಿದವನೆಂದು", "r": "8:52"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನೀನು, ನನ್ನ ಮಾತಿಗೆ ಶರಣಾಗಿ ನಡೆಯುವವನು ಎಂದೆಂದಿಗೂ ಸಾವಿಗೆ ತುತ್ತಾಗನು, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತಿರುವೆ", "r": "8:52"}, {"n": 228, "q": "“ನೀನು ದೆವ್ವಹಿಡಿದವನೆಂದು ಈಗ ನಮಗೆ ಸ್ಪಷ್ಟವಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 52", "r": "8:52"}, {"n": 229, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವನ್ನು ಏನು ಕೇಳಿದರು?", "a": "“ನಮ್ಮ ತಂದೆ ಅಬ್ರಹಾಮನಿಗಿಂತಲೂ ನೀನು ಶ್ರೇಷ್ಟನೋ?”", "r": "8:53"}, {"n": 230, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಕೊನೆಯ ಪ್ರಶ್ನೆ ಯಾವುದು (8:53)?", "a": "“ನೀನು ಯಾರೆಂದು ನಿನ್ನ ಎಣಿಕೆ?”", "r": "8:53"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಶ್ರೇಷ್ಟನೋ?”", "a": "ಅಬ್ರಹಾಮನಿಗಿಂತಲೂ", "r": "8:53"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರವಾದಿಗಳೂ ಸಾವಿಗೆ ಈಡಾಗಿರುವರು;”", "a": "ಸಾವಿಗೀಡಾದನು", "r": "8:53"}, {"n": 233, "q": "ಯೇಸುವಿನ ಘನತೆಗೌರವವನ್ನು ಸಾರುವವರು ಯಾರು?", "a": "ಅವರ ಪಿತನು", "r": "8:54"}, {"n": 234, "q": "ಯೇಸುವಿನ ಪಿತನನ್ನು ಕುರಿತು ಯೆಹೂದ್ಯರು ಏನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾರೆ?", "a": "‘ಅವರು ನಮ್ಮ ದೇವರು’", "r": "8:54"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರತ್ಯುತ್ತರವಾಗಿ, ನನ್ನ ಘನತೆಗೌರವವನ್ನು ನಾನೇ ಸಾರಹೊರಟರೆ ಅದಕ್ಕೆ ಬೆಲೆಯಿರದು.”", "a": "ಯೇಸು", "r": "8:54"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾರುವವರಾದರೋ ನನ್ನ ಪಿತನು.”", "a": "ಘನತೆಗೌರವವನ್ನು", "r": "8:54"}, {"n": 237, "q": "ಪಿತನ ಅರಿವು ತಮಗಿಲ್ಲವೆಂದು ಹೇಳಿದರೆ ಯೇಸು ಏನಾಗುತ್ತಾರೆ?", "a": "ಯೆಹೂದ್ಯರಂತೆ ಸುಳ್ಳುಗಾರರಾಗುತ್ತಾರೆ", "r": "8:55"}, {"n": 238, "q": "ಯೇಸು ಪಿತನ ಯಾವುದನ್ನು ಪಾಲಿಸುತ್ತಾರೆ?", "a": "ಅವರ ಮಾತನ್ನು", "r": "8:55"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರ ಅರಿವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ನಿಮಗಿಲ್ಲ", "r": "8:55"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಅರಿವು ನನಗಿಲ್ಲವೆಂದು ನಾನು ಹೇಳಿದೆಯಾದರೆ ನಿಮ್ಮಂತೆ ನಾನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸುಳ್ಳುಗಾರನಾಗುತ್ತೇನೆ", "r": "8:55"}, {"n": 241, "q": "ಅಬ್ರಹಾಮನು ಯಾವುದನ್ನು ಕಾಣುವನೆಂದು ಹಿಗ್ಗಿದನು?", "a": "ಯೇಸುವಿನ ದಿನವನ್ನು", "r": "8:56"}, {"n": 242, "q": "ಅಬ್ರಹಾಮನು ಯೇಸುವಿನ ದಿನವನ್ನು ಕಂಡು ಏನು ಮಾಡಿದನು?", "a": "ಹಿಗ್ಗಿದನು", "r": "8:56"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ತಂದೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ದಿನವನ್ನು ತಾನು ಕಾಣುವನೆಂದು ಹಿಗ್ಗಿದನು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:56"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಅದನ್ನು ಕಂಡೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಆಯಿತು", "r": "8:56"}, {"n": 245, "q": "ಯೇಸುವಿನ ವಯಸ್ಸಿನ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರು ಏನೆಂದರು?", "a": "“ನಿನಗಿನ್ನೂ ಐವತ್ತು ವರ್ಷವಾಗಿಲ್ಲ; ನೀನು ಅಬ್ರಹಾಮನನ್ನು ನೋಡಿದ್ದೀಯಾ?”", "r": "8:57"}, {"n": 246, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸುವಿಗೆ ಇನ್ನೂ ಎಷ್ಟು ವರ್ಷವಾಗಿರಲಿಲ್ಲ?", "a": "ಐವತ್ತು ವರ್ಷ", "r": "8:57"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ನಿನಗಿನ್ನೂ ಐವತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ವರ್ಷವಾಗಿಲ್ಲ", "r": "8:57"}, {"n": 248, "q": "ಯೊವಾನ್ನ 8:57 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರು, “ನಿನಗಿನ್ನೂ ಐವತ್ತು ವರ್ಷವಾಗಿಲ್ಲ; ನೀನು ಅಬ್ರಹಾಮನನ್ನು ನೋಡಿದ್ದೀಯಾ?” ಎಂದರು.", "r": "8:57"}, {"n": 249, "q": "ಅಬ್ರಹಾಮನ ಬಗ್ಗೆ ಯೇಸು ಮರುನುಡಿದ ಮಾತು ಯಾವುದು?", "a": "“ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ”", "r": "8:58"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವರಿಗೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ, ಎಂದು ಮರುನುಡಿದರು.”", "a": "ಅಬ್ರಹಾಮನು", "r": "8:58"}, {"n": 251, "q": "“ಯೇಸು ಅವರಿಗೆ, ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ, ಎಂದು ಮರುನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 8ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 58", "r": "8:58"}, {"n": 252, "q": "ಯೊವಾನ್ನ 8:58 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವರಿಗೆ, “ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ,” ಎಂದು ಮರುನುಡಿದರು.", "r": "8:58"}, {"n": 253, "q": "“ಅಬ್ರಹಾಮನು ಹುಟ್ಟುವುದಕ್ಕೆ ಮೊದಲಿನಿಂದಲೂ ನಾನಿದ್ದೇನೆ” ಎಂಬುದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವಿನತ್ತ ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು", "r": "8:59"}, {"n": 254, "q": "ಯೆಹೂದ್ಯರು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡಾಗ ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ಮರೆಯಾಗಿ ಮಹಾದೇವಾಲಯದಿಂದ ಹೊರಟು ಹೋದರು", "r": "8:59"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ್ದೇ ಆ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೀರಲು ಕಲ್ಲುಗಳನ್ನು ಎತ್ತಿಕೊಂಡರು.”", "a": "ಯೇಸುವಿನತ್ತ", "r": "8:59"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರೆಯಾಗಿ ಮಹಾದೇವಾಲಯದಿಂದ ಹೊರಟು ಹೋದರು.”", "a": "ಯೇಸುವಾದರೋ", "r": "8:59"}]}, {"chapter": 9, "label": "ಅಧ್ಯಾಯ 9", "verses": 41, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಹುಟ್ಟು ಕುರುಡನಿಗೆ ದೃಷ್ಟಿದಾನ", "r": "9:1"}, {"n": 2, "q": "ಯೇಸು ನಡೆದು ಹೋಗುತ್ತಿದ್ದಾಗ ಯಾರನ್ನು ಕಂಡರು?", "a": "ಒಬ್ಬ ಹುಟ್ಟು ಕುರುಡನನ್ನು", "r": "9:1"}, {"n": 3, "q": "ಹುಟ್ಟು ಕುರುಡನನ್ನು ಗುಣಪಡಿಸಿದ ಘಟನೆಯ ಹಂತಗಳನ್ನು ಕ್ರಮವಾಗಿ ತಿಳಿಸಿ.", "a": "ಯೇಸು ಕುರುಡನನ್ನು ಕಂಡರು; ಶಿಷ್ಯರ ಪ್ರಶ್ನೆ; ಯೇಸುವಿನ ಉತ್ತರ; ನೆಲದಲ್ಲಿ ಉಗುಳಿ ಮಣ್ಣಿನ ಲೇಪ; ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ ಶಿಲೋವಾಮಿಗೆ ಕಳುಹಿಸಿದರು; ತೊಳೆದುಕೊಂಡು ಕಣ್ಣು ಪಡೆದು ಹಿಂದಿರುಗಿದನು", "r": "9:1–7"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆದು ಹೋಗುತ್ತಿದ್ದಾಗ, ಒಬ್ಬ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಕಂಡರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "9:1"}, {"n": 5, "q": "“ಯೇಸುಸ್ವಾಮಿ ನಡೆದು ಹೋಗುತ್ತಿದ್ದಾಗ, ಒಬ್ಬ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಕಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "9:1"}, {"n": 6, "q": "ಯೊವಾನ್ನ 9:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ನಡೆದು ಹೋಗುತ್ತಿದ್ದಾಗ, ಒಬ್ಬ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಕಂಡರು.", "r": "9:1"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ನಡೆದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಒಬ್ಬ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಕಂಡರು.”", "a": "ಹೋಗುತ್ತಿದ್ದಾಗ", "r": "9:1"}, {"n": 8, "q": "ಹುಟ್ಟು ಕುರುಡನ ಬಗ್ಗೆ ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಏನು ಕೇಳಿದರು?", "a": "“ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಬೇಕಾದರೆ ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ? ಇವನದೋ ಅಥವಾ ಇವನನ್ನು ಹೆತ್ತವರದೋ?”", "r": "9:2"}, {"n": 9, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು (9:2)?", "a": "“ಗುರುದೇವಾ”", "r": "9:2"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು, ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ?”", "a": "ಹುಟ್ಟಬೇಕಾದರೆ", "r": "9:2"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನದೋ ಅಥವಾ ಇವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೆತ್ತವರದೋ", "r": "9:2"}, {"n": 12, "q": "“ಶಿಷ್ಯರು, ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಬೇಕಾದರೆ ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "9:2"}, {"n": 13, "q": "ಯೊವಾನ್ನ 9:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು, “ಗುರುದೇವಾ, ಇವನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಬೇಕಾದರೆ ಅದಕ್ಕೆ ಯಾರ ಪಾಪ ಕಾರಣ? ಇವನದೋ ಅಥವಾ ಇವನನ್ನು ಹೆತ್ತವರದೋ?” ಎಂದು ಕೇಳಿದರು.", "r": "9:2"}, {"n": 14, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಆ ಮನುಷ್ಯನು ಕುರುಡನಾಗಿ ಹುಟ್ಟಿದ್ದು ಏಕೆ?", "a": "ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ", "r": "9:3"}, {"n": 15, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡುತನಕ್ಕೆ ಯಾವುದು ಕಾರಣವಲ್ಲ?", "a": "ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ", "r": "9:3"}, {"n": 16, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡನಲ್ಲಿ ಏನು ವ್ಯಕ್ತವಾಗಬೇಕಿತ್ತು?", "a": "ದೇವರ ಕಾರ್ಯ", "r": "9:3"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.”", "a": "ಯೇಸು", "r": "9:3"}, {"n": 18, "q": "“ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "9:3"}, {"n": 19, "q": "ಯೊವಾನ್ನ 9:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ ವ್ಯಕ್ತವಾಗುವಂತೆ ಹೀಗಾಗಿದೆ.", "r": "9:3"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ಇವನ ಪಾಪವಾಗಲಿ, ಇವನನ್ನು ಹೆತ್ತವರ ಪಾಪವಾಗಲಿ ಇದಕ್ಕೆ ಕಾರಣವಲ್ಲ, ದೇವರ ಕಾರ್ಯ ಇವನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗಾಗಿದೆ.”", "a": "ವ್ಯಕ್ತವಾಗುವಂತೆ", "r": "9:3"}, {"n": 21, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಕೆಲಸವನ್ನು ಯಾವಾಗ ಮಾಡುತ್ತಿರಬೇಕು?", "a": "ಹಗಲಿರುವಾಗಲೇ", "r": "9:4"}, {"n": 22, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ರಾತ್ರಿ ಆದಮೇಲೆ ಏನಾಗದು?", "a": "ಯಾರೂ ಕೆಲಸಮಾಡಲಾಗದು", "r": "9:4"}, {"n": 23, "q": "ಯೇಸು ಹಗಲಿರುವಾಗಲೇ ಯಾರ ಕೆಲಸವನ್ನು ಮಾಡುತ್ತಿರಬೇಕು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು", "r": "9:4"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು.”", "a": "ಕಳುಹಿಸಿರುವಾತನ", "r": "9:4"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ರಾತ್ರಿ ಆದಮೇಲೆ ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೆಲಸಮಾಡಲಾಗದು", "r": "9:4"}, {"n": 26, "q": "“ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "9:4"}, {"n": 27, "q": "ಯೊವಾನ್ನ 9:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಗಲಿರುವಾಗಲೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿರುವಾತನ ಕೆಲಸವನ್ನು ನಾನು ಮಾಡುತ್ತಿರಬೇಕು. ರಾತ್ರಿ ಆದಮೇಲೆ ಯಾರೂ ಕೆಲಸಮಾಡಲಾಗದು.", "r": "9:4"}, {"n": 28, "q": "ಹುಟ್ಟು ಕುರುಡನನ್ನು ಗುಣಪಡಿಸುವ ಮೊದಲು ಯೇಸು ತಮ್ಮ ಬಗ್ಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ”", "r": "9:5"}, {"n": 29, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸು ತಮ್ಮನ್ನು ಜಗಜ್ಯೋತಿ/ಜಗದ ಜ್ಯೋತಿ ಎಂದು ಕರೆದ ಎರಡು ವಚನಗಳು ಯಾವುವು?", "a": "8:12 ಮತ್ತು 9:5", "r": "9:5; 8:12"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.”", "a": "ಜಗತ್ತಿನಲ್ಲಿ", "r": "9:5"}, {"n": 31, "q": "“ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "9:5"}, {"n": 32, "q": "ಯೊವಾನ್ನ 9:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜಗತ್ತಿನಲ್ಲಿ ನಾನಿರುವಾಗ ಜಗದ ಜ್ಯೋತಿ ನಾನೇ,” ಎಂದು ನುಡಿದರು.", "r": "9:5"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜಗತ್ತಿನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜಗದ ಜ್ಯೋತಿ ನಾನೇ, ಎಂದು ನುಡಿದರು.”", "a": "ನಾನಿರುವಾಗ", "r": "9:5"}, {"n": 34, "q": "ಹುಟ್ಟು ಕುರುಡನ ಕಣ್ಣುಗಳಿಗಾಗಿ ಯೇಸು ಮಾಡಿದ ಕ್ರಿಯೆಗಳು ಯಾವುವು?", "a": "ನೆಲದಲ್ಲಿ ಉಗುಳಿದರು; ಮಣ್ಣಿನ ಲೇಪಮಾಡಿದರು; ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿದರು", "r": "9:6"}, {"n": 35, "q": "ಯೇಸು ಕುರುಡನಿಗೆ ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ”", "r": "9:6"}, {"n": 36, "q": "ಹುಟ್ಟು ಕುರುಡನು ಯಾವ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೊಳ್ಳಬೇಕಿತ್ತು?", "a": "ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ", "r": "9:6"}, {"n": 37, "q": "ಯೇಸು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಯಾವುದನ್ನು ಲೇಪಿಸಿದರು?", "a": "ಮಣ್ಣಿನ ಲೇಪವನ್ನು", "r": "9:6"}, {"n": 38, "q": "ಯೇಸು ಎಲ್ಲಿ ಉಗುಳಿದರು?", "a": "ನೆಲದಲ್ಲಿ", "r": "9:6"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಶಿಲೋವಾಮಿನ", "r": "9:6"}, {"n": 40, "q": "“ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "9:6"}, {"n": 41, "q": "ಯೊವಾನ್ನ 9:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತರುವಾಯ ನೆಲದಲ್ಲಿ ಉಗುಳಿ, ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ, ಅದನ್ನು ಕುರುಡನ ಕಣ್ಣಿಗೆ ಲೇಪಿಸಿ, “ನೀನು ಶಿಲೋವಾಮಿನ ಕೊಳಕ್ಕೆ ಹೋಗಿ ತೊಳೆದುಕೋ,” ಎಂದು ಹೇಳಿದರು.", "r": "9:6"}, {"n": 42, "q": "‘ಶಿಲೋವಾಮ್’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಕಳುಹಿಸಲಾದವನು", "r": "9:7"}, {"n": 43, "q": "ಕೊಳದಲ್ಲಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡು ಹಿಂದಿರುಗಿದ ಕುರುಡನಿಗೆ ಏನಾಗಿತ್ತು?", "a": "ಕಣ್ಣು ಬಂದಿತ್ತು", "r": "9:7"}, {"n": 44, "q": "ಕುರುಡನು ಯೇಸುವಿನ ಆಜ್ಞೆಯಂತೆ ಏನು ಮಾಡಿದನು?", "a": "ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು", "r": "9:7"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ತೊಳೆದುಕೊಂಡನು", "r": "9:7"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಕಣ್ಣು ಬಂದಿತ್ತು.”", "a": "ಹಿಂದಿರುಗಿದಾಗ", "r": "9:7"}, {"n": 47, "q": "“ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "9:7"}, {"n": 48, "q": "ಯೊವಾನ್ನ 9:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "(‘ಶಿಲೋವಾಮ್’ ಎಂದರೆ ಕಳುಹಿಸಲಾದವನು ಎಂದರ್ಥ). ಅದರಂತೆಯೇ ಆ ಕುರುಡನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಂಡನು; ಹಿಂದಿರುಗಿದಾಗ ಅವನಿಗೆ ಕಣ್ಣು ಬಂದಿತ್ತು.", "r": "9:7"}, {"n": 49, "q": "ಕಣ್ಣು ಬಂದವನನ್ನು ಕಂಡ ನೆರೆಯವರು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?”", "r": "9:8"}, {"n": 50, "q": "ಹುಟ್ಟು ಕುರುಡನು ಹಿಂದೆ ಏನು ಮಾಡುತ್ತಿದ್ದನು?", "a": "ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದನು", "r": "9:8"}, {"n": 51, "q": "“ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” ಎಂದು ವಿಚಾರಿಸಿದವರು ಯಾರು?", "a": "ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನನ್ನು ನೋಡಿದ್ದವರು", "r": "9:8"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?”", "a": "ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ", "r": "9:8"}, {"n": 53, "q": "“ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "9:8"}, {"n": 54, "q": "ಯೊವಾನ್ನ 9:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, “ಭಿಕ್ಷೆಬೇಡುತ್ತಾ ಕುಳಿತುಕೊಂಡಿದ್ದವನು ಇವನೇ ಅಲ್ಲವೆ?” ಎಂದು ವಿಚಾರಿಸಿದರು.", "r": "9:8"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ ನೆರೆಯವರು ಮತ್ತು ಹಿಂದೆ ಅವನು ಭಿಕ್ಷೆಬೇಡುತ್ತಿದ್ದಾಗ ಅವನನ್ನು ನೋಡಿದ್ದವರು, ಭಿಕ್ಷೆಬೇಡುತ್ತಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನೇ ಅಲ್ಲವೆ?”", "a": "ಕುಳಿತುಕೊಂಡಿದ್ದವನು", "r": "9:8"}, {"n": 56, "q": "ಕಣ್ಣು ಬಂದವನ ಬಗ್ಗೆ ಜನರು ಹೇಳಿದ ಎರಡು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "“ಹೌದು ಅವನೇ”; “ಇಲ್ಲ, ಇವನು ಅವನಂತೆ ಕಾಣುತ್ತಾನೆ, ಅಷ್ಟೆ”", "r": "9:9"}, {"n": 57, "q": "ಜನರ ಸಂದೇಹಕ್ಕೆ ಕುರುಡನು ತನ್ನ ಬಗ್ಗೆ ಏನೆಂದು ತಿಳಿಸಿದನು?", "a": "“ನಾನೇ ಅವನು”", "r": "9:9"}, {"n": 58, "q": "“ಇಲ್ಲ, ಇವನು ಅವನಂತೆ ಕಾಣುತ್ತಾನೆ, ಅಷ್ಟೆ” ಎಂದವರು ಯಾರು?", "a": "ಇತರರು (ಕೆಲವು ಜನರು)", "r": "9:9"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು ಅವನೇ, ಎಂದರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೆಲವರು", "r": "9:9"}, {"n": 60, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲ, ಇವನು ಅವನಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಷ್ಟೆ, ಎಂದರು ಇತರರು.”", "a": "ಕಾಣುತ್ತಾನೆ", "r": "9:9"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ನಾನೇ ಅವನು ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದನು", "r": "9:9"}, {"n": 62, "q": "“ಆ ಕುರುಡನು ನಾನೇ ಅವನು ಎಂದು ತಿಳಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "9:9"}, {"n": 63, "q": "ನೆರೆಯವರು ಕುರುಡನಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?”", "r": "9:10"}, {"n": 64, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” ಎಂಬ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿದವರು ಯಾರು?", "a": "ನೆರೆಯವರು (9:10); ಫರಿಸಾಯರು (9:15); ಅಧಿಕಾರಿಗಳು — ಹೆತ್ತವರನ್ನು (9:19); ಅಧಿಕಾರಿಗಳು — ಮತ್ತೆ (9:26)", "r": "9:10; 9:15; 9:19; 9:26"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?”", "a": "ಹಾಗಾದರೆ", "r": "9:10"}, {"n": 66, "q": "“ಆಗ ಅವರು, ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "9:10"}, {"n": 67, "q": "ಯೊವಾನ್ನ 9:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಅವರು, “ಹಾಗಾದರೆ ನಿನಗೆ ಕಣ್ಣು ಹೇಗೆ ಬಂತು?” ಎಂದು ಕೇಳಿದರು.", "r": "9:10"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, ಹಾಗಾದರೆ ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ಬಂತು?”", "a": "ಕಣ್ಣು", "r": "9:10"}, {"n": 69, "q": "ಕಣ್ಣು ಬಂದವನು ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರನ್ನು ಏನೆಂದು ಕರೆದನು (9:11)?", "a": "ಯೇಸು ಎಂಬುವರು", "r": "9:11"}, {"n": 70, "q": "ತನಗೆ ಕಣ್ಣು ಬಂದ ಬಗೆಯನ್ನು ಕುರುಡನು ಹೇಗೆ ವಿವರಿಸಿದನು?", "a": "ಯೇಸು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು; ‘ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ’ ಎಂದರು; ಹೋಗಿ ತೊಳೆದುಕೊಂಡೆ; ಕಣ್ಣು ಬಂತು", "r": "9:11"}, {"n": 71, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಕುರುಡನು ಯೇಸುವನ್ನು ಕ್ರಮವಾಗಿ ಹೇಗೆ ಅರಿತುಕೊಂಡನು?", "a": "“ಯೇಸು ಎಂಬುವರು” (9:11) → “ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ” (9:17) → “ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ” ಎಂದು ಅಡ್ಡಬಿದ್ದನು (9:38)", "r": "9:11; 9:17; 9:38"}, {"n": 72, "q": "ಕುರುಡನಿಗೆ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊಳ್ಳಲು ಹೇಳಿದರು (9:11)?", "a": "ಶಿಲೋವಾಮಿಗೆ", "r": "9:11"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುವರು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ನನ್ನ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು, ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ, ಎಂದು ಹೇಳಿದರು;”", "a": "ಯೇಸು", "r": "9:11"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂತು, ಎಂದು ಹೇಳಿದನು.”", "a": "ಕಣ್ಣು", "r": "9:11"}, {"n": 75, "q": "“ಅದಕ್ಕೆ ಅವನು, ಯೇಸು ಎಂಬುವರು ಮಣ್ಣಿನ ಲೇಪಮಾಡಿ ನನ್ನ ಕಣ್ಣಿಗೆ ಹಚ್ಚಿದರು, ಶಿಲೋವಾಮಿಗೆ ಹೋಗಿ ತೊಳೆದುಕೊ, ಎಂದು ಹೇಳಿದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "9:11"}, {"n": 76, "q": "“ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂದಾಗ ಕುರುಡನು ಏನೆಂದನು?", "a": "“ನಾನರಿಯೆ”", "r": "9:12"}, {"n": 77, "q": "“ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂಬ ಪ್ರಶ್ನೆಯಲ್ಲಿ ‘ಆತ’ ಯಾರು?", "a": "ಯೇಸು", "r": "9:12"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವರು, ಆತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಎಲ್ಲಿದ್ದಾನೆ", "r": "9:12"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನರಿಯೆ, ಎಂದನು.”", "a": "ಉತ್ತರವಾಗಿ", "r": "9:12"}, {"n": 80, "q": "ಯೊವಾನ್ನ 9:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವರು, “ಆತ ಎಲ್ಲಿದ್ದಾನೆ?” ಎಂದು ವಿಚಾರಿಸಿದರು. ಅವನು ಉತ್ತರವಾಗಿ “ನಾನರಿಯೆ,” ಎಂದನು.", "r": "9:12"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ನಾನರಿಯೆ", "r": "9:12"}, {"n": 82, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 9:13ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಫರಿಸಾಯರಿಂದ ವಿಚಾರಣೆ", "r": "9:13"}, {"n": 83, "q": "ಜನರು ಕಣ್ಣು ಬಂದವನನ್ನು ಯಾರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು?", "a": "ಫರಿಸಾಯರ ಬಳಿಗೆ", "r": "9:13"}, {"n": 84, "q": "ಜನರು ಕುರುಡನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಏಕೆ ಕರೆದುಕೊಂಡು ಹೋದರು?", "a": "ಯೇಸು ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿದ್ದುದರಿಂದ", "r": "9:13"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.”", "a": "ಫರಿಸಾಯರ", "r": "9:13"}, {"n": 86, "q": "“ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "9:13"}, {"n": 87, "q": "ಯೊವಾನ್ನ 9:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು.", "r": "9:13"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು ಅವನನ್ನು ಫರಿಸಾಯರ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಕರೆದುಕೊಂಡು", "r": "9:13"}, {"n": 89, "q": "ಯೇಸು ಹುಟ್ಟು ಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಯಾವುದು?", "a": "ಸಬ್ಬತ್ ದಿನ", "r": "9:14"}, {"n": 90, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಸಬ್ಬತ್ ದಿನದಂದು ಯೇಸು ಗುಣಪಡಿಸಿದ ಇಬ್ಬರು ಯಾರು?", "a": "ಬೆತ್ಸಥ ಕೊಳದ ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿ (5:9) ಮತ್ತು ಹುಟ್ಟು ಕುರುಡ (9:14)", "r": "5:9; 9:14"}, {"n": 91, "q": "ಯೇಸು ಕುರುಡನಿಗೆ ಹೇಗೆ ಕಣ್ಣುಕೊಟ್ಟರು?", "a": "ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ", "r": "9:14"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "9:14"}, {"n": 93, "q": "“ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "9:14"}, {"n": 94, "q": "ಯೊವಾನ್ನ 9:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ ಸಬ್ಬತ್ ದಿನವಾಗಿತ್ತು.", "r": "9:14"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಯೇಸುಸ್ವಾಮಿ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಮಾಡಿ ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನವಾಗಿತ್ತು.”", "a": "ಸಬ್ಬತ್", "r": "9:14"}, {"n": 96, "q": "ಫರಿಸಾಯರಿಗೆ ಕಣ್ಣು ಬಂದವನು ಕೊಟ್ಟ ವಿವರಣೆ ಏನು?", "a": "“ಯೇಸು ನನ್ನ ಕಣ್ಣುಗಳಿಗೆ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಹಚ್ಚಿದರು; ನಾನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು ತೊಳೆದುಕೊಳ್ಳುತ್ತಲೇ ನನಗೆ ದೃಷ್ಟಿ ಬಂತು”", "r": "9:15"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಣ್ಣು ಬಂದುದು ಹೇಗೆಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಮತ್ತೆ ಕೇಳಿದರು.”", "a": "ಫರಿಸಾಯರು", "r": "9:15"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಕಣ್ಣುಗಳಿಗೆ ಮಣ್ಣಿನ ಲೇಪವನ್ನು ಹಚ್ಚಿದರು;”", "a": "ಯೇಸು", "r": "9:15"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಹೋಗಿ ಕಣ್ಣುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗೆ ದೃಷ್ಟಿ ಬಂತು, ಎಂದನು ಅವನು.”", "a": "ತೊಳೆದುಕೊಳ್ಳುತ್ತಲೇ", "r": "9:15"}, {"n": 100, "q": "“ಕಣ್ಣು ಬಂದುದು ಹೇಗೆಂದು ಫರಿಸಾಯರು ಅವನನ್ನು ಮತ್ತೆ ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "9:15"}, {"n": 101, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನೆಂದರು?", "a": "“ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ”", "r": "9:16"}, {"n": 102, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಇತರರು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಪಾಪಿಯಾದವನು ಇಂಥ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡಲು ಸಾಧ್ಯವೇ?”", "r": "9:16"}, {"n": 103, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಫರಿಸಾಯರಲ್ಲೇ ಏನುಂಟಾಯಿತು?", "a": "ಭಿನ್ನಬೇಧ", "r": "9:16"}, {"n": 104, "q": "ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವನ್ನು ‘ಪಾಪಿ’ ಎಂದು ಕರೆದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು (“ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು” 9:24)", "r": "9:16; 9:24"}, {"n": 105, "q": "ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದವನಲ್ಲ ಎಂಬುದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ", "r": "9:16"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲವರು, ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ, ಎಂದರು.”", "a": "ಫರಿಸಾಯರಲ್ಲಿ", "r": "9:16"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇತರರು, ಪಾಪಿಯಾದವನು ಇಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲು ಸಾಧ್ಯವೇ?”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "9:16"}, {"n": 108, "q": "“ಫರಿಸಾಯರಲ್ಲಿ ಕೆಲವರು, ಹೀಗೆ ಮಾಡಿದವನು ದೇವರಿಂದ ಬಂದವನಲ್ಲ, ಅವನು ಸಬ್ಬತ್ ನಿಯಮವನ್ನು ಪಾಲಿಸುವುದಿಲ್ಲ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "9:16"}, {"n": 109, "q": "ಫರಿಸಾಯರು ಕುರುಡನನ್ನು ಯೇಸುವಿನ ಬಗ್ಗೆ ಏನು ವಿಚಾರಿಸಿದರು?", "a": "“ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?”", "r": "9:17"}, {"n": 110, "q": "ಕುರುಡನು ಫರಿಸಾಯರ ಮುಂದೆ ಯೇಸುವನ್ನು ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ”", "r": "9:17"}, {"n": 111, "q": "“ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ” ಎಂದು ಯಾರು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು?", "a": "ಕಣ್ಣು ಬಂದ ಕುರುಡನು ಯೇಸುವಿನ ಬಗ್ಗೆ", "r": "9:17"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಕುರುಡನನ್ನು ಕುರಿತು, ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?”", "a": "ಫರಿಸಾಯರು", "r": "9:17"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನು, ಅವರೊಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರಿ, ಎಂದನು.”", "a": "ಪ್ರವಾದಿಯೇ", "r": "9:17"}, {"n": 114, "q": "“ಆದ್ದರಿಂದ ಫರಿಸಾಯರು ಆ ಕುರುಡನನ್ನು ಕುರಿತು, ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "9:17"}, {"n": 115, "q": "ಯೊವಾನ್ನ 9:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದ್ದರಿಂದ ಫರಿಸಾಯರು ಆ ಕುರುಡನನ್ನು ಕುರಿತು, “ಅವನೇ ನಿನಗೆ ಕಣ್ಣು ಕೊಟ್ಟನೆಂದು ಹೇಳುತ್ತೀಯಲ್ಲಾ, ಅವನ ಬಗ್ಗೆ ನಿನಗೇನು ಅನ್ನಿಸುತ್ತದೆ?” ಎಂದು ವಿಚಾರಿಸಿದರು. ಅದಕ್ಕೆ ಅವನು, “ಅವರೊಬ್ಬ ಪ್ರವಾದಿಯೇ ಸರಿ,” ಎಂದನು.", "r": "9:17"}, {"n": 116, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನನ್ನು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ?", "a": "ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು", "r": "9:18"}, {"n": 117, "q": "ಕುರುಡನು ದೃಷ್ಟಿ ಪಡೆದದ್ದನ್ನು ನಂಬಲು ಒಪ್ಪದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "9:18"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.”", "a": "ಕುರುಡನಾಗಿದ್ದು", "r": "9:18"}, {"n": 119, "q": "“ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "9:18"}, {"n": 120, "q": "ಯೊವಾನ್ನ 9:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ ಪಡೆದಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.", "r": "9:18"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕುರುಡನು ಹಿಂದೆ ನಿಜವಾಗಿಯೂ ಕುರುಡನಾಗಿದ್ದು ಈಗ ದೃಷ್ಟಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ನಂಬಲು ಒಪ್ಪಲಿಲ್ಲ.”", "a": "ಪಡೆದಿದ್ದಾನೆ", "r": "9:18"}, {"n": 122, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಕುರುಡನ ಬಗ್ಗೆ ವಿಚಾರಿಸಲು ಯಾರನ್ನು ಕರೆಯಿಸಿದರು?", "a": "ಅವನ ಹೆತ್ತವರನ್ನು", "r": "9:19"}, {"n": 123, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನ ಹೆತ್ತವರಿಗೆ ಕೇಳಿದ ಮೂರು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ಇವನು ನಿಮ್ಮ ಮಗನೋ? ಇವನು ಹುಟ್ಟು ಕುರುಡನೋ? ಹಾಗಾದರೆ ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?”", "r": "9:19"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಕಾರಣ ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆಯಿಸಿ, ಇವನು ನಿಮ್ಮ ಮಗನೋ?”", "a": "ಹೆತ್ತವರನ್ನು", "r": "9:19"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?”", "a": "ಹಾಗಾದರೆ", "r": "9:19"}, {"n": 126, "q": "“ಈ ಕಾರಣ ಅವನ ಹೆತ್ತವರನ್ನು ಕರೆಯಿಸಿ, ಇವನು ನಿಮ್ಮ ಮಗನೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "9:19"}, {"n": 127, "q": "ಯೊವಾನ್ನ 9:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಕಾರಣ ಅವನ ಹೆತ್ತವರನ್ನು ಕರೆಯಿಸಿ, “ಇವನು ನಿಮ್ಮ ಮಗನೋ? ಇವನು ಹುಟ್ಟು ಕುರುಡನೋ? ಹಾಗಾದರೆ ಇವನಿಗೆ ಈಗ ಕಣ್ಣು ಬಂದದ್ದು ಹೇಗೆ?” ಎಂದು ಕೇಳಿದರು.", "r": "9:19"}, {"n": 128, "q": "ಕುರುಡನ ತಂದೆ ತಾಯಿಗಳಿಗೆ ಯಾವ ಎರಡು ವಿಷಯಗಳು ತಿಳಿದಿರಲಿಲ್ಲ?", "a": "ಮಗನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ; ಅವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟವರು ಯಾರು", "r": "9:20"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಗೊತ್ತಿಲ್ಲ", "r": "9:20"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದೂ ನಮಗೆ ತಿಳಿಯದು.”", "a": "ಕಣ್ಣುಕೊಟ್ಟವರು", "r": "9:20"}, {"n": 131, "q": "“ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ ಗೊತ್ತಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "9:20"}, {"n": 132, "q": "ಯೊವಾನ್ನ 9:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವನ ತಂದೆ ತಾಯಿಗಳು, “ಇವನಿಗೆ ದೃಷ್ಟಿ ಬಂದದ್ದು ಹೇಗೆ ಎಂದು ನಮಗೆ ಗೊತ್ತಿಲ್ಲ; ಇವನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟವರು ಯಾರೆಂದೂ ನಮಗೆ ತಿಳಿಯದು.", "r": "9:20"}, {"n": 133, "q": "ಕುರುಡನ ಹೆತ್ತವರು ಅಧಿಕಾರಿಗಳಿಗೆ ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ? ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ”", "r": "9:21"}, {"n": 134, "q": "ಹೆತ್ತವರ ಪ್ರಕಾರ ಕುರುಡನು ಏಕೆ ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ?", "a": "ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದರಿಂದ", "r": "9:21"}, {"n": 135, "q": "ಕುರುಡನ ಹೆತ್ತವರು ಅಧಿಕಾರಿಗಳಿಗೆ ಮಗನನ್ನೇ ಕೇಳಿ ಎಂದದ್ದು ಏಕೆ ಎಂದು 9:22 ವಿವರಿಸುತ್ತದೆ?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ ಅಂಜಿಕೆಯಿಂದ (ಯೇಸುವನ್ನು ಲೋಕೋದ್ಧಾರಕನೆಂದು ಒಪ್ಪಿಕೊಂಡವರಿಗೆ ಬಹಿಷ್ಕಾರ ಹಾಕಲು ಗೊತ್ತುಮಾಡಿದ್ದರಿಂದ)", "r": "9:21"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ", "r": "9:21"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉತ್ತರಿಸಿದರು", "r": "9:21"}, {"n": 138, "q": "ಯೊವಾನ್ನ 9:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇವನನ್ನೇ ಕೇಳಿ, ಹೇಗೂ ಪ್ರಾಯದವನಾಗಿದ್ದಾನಲ್ಲವೆ? ತನ್ನ ವಿಷಯವಾಗಿ ತಾನೇ ಮಾತನಾಡಬಲ್ಲ,” ಎಂದು ಉತ್ತರಿಸಿದರು.", "r": "9:21"}, {"n": 139, "q": "ಕುರುಡನ ಹೆತ್ತವರು ಹಾಗೆ ಉತ್ತರಿಸಿದ್ದು ಏಕೆ?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ ಅಂಜಿಕೆಯಿಂದ", "r": "9:22"}, {"n": 140, "q": "ಯೇಸುವನ್ನು ಲೋಕೋದ್ಧಾರಕ ಎಂದು ಒಪ್ಪಿಕೊಳ್ಳುವವರಿಗೆ ಏನು ಮಾಡಬೇಕೆಂದು ಅಧಿಕಾರಿಗಳು ಗೊತ್ತುಮಾಡಿದ್ದರು?", "a": "ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ ಬಹಿಷ್ಕಾರ ಹಾಕಬೇಕೆಂದು", "r": "9:22"}, {"n": 141, "q": "ಯೇಸುವನ್ನು ಲೋಕೋದ್ಧಾರಕನೆಂದು ಒಪ್ಪಿಕೊಳ್ಳುವವರನ್ನು ಎಲ್ಲಿಂದ ಬಹಿಷ್ಕರಿಸಲಾಗುತ್ತಿತ್ತು?", "a": "ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ", "r": "9:22"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಂಜಿಕೆಯಿಂದ", "r": "9:22"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಯಾರಾದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಎಂದು ಒಪ್ಪಿಕೊಂಡರೆ ಅಂಥವರಿಗೆ ಪ್ರಾರ್ಥನಾ ಮಂದಿರದಿಂದ ಬಹಿಷ್ಕಾರ ಹಾಕಬೇಕೆಂದು ಅಧಿಕಾರಿಗಳು ಈ ಮೊದಲೇ ಗೊತ್ತುಮಾಡಿದ್ದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "9:22"}, {"n": 144, "q": "“ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳ ಅಂಜಿಕೆಯಿಂದ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "9:22"}, {"n": 145, "q": "ಕುರುಡನ ತಂದೆತಾಯಿಗಳು ಅಂಜಿಕೆಯಿಂದ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ”", "r": "9:23"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದಲೇ, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು.”", "a": "ತಂದೆತಾಯಿಗಳು", "r": "9:23"}, {"n": 147, "q": "“ಆದುದರಿಂದಲೇ, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "9:23"}, {"n": 148, "q": "ಯೊವಾನ್ನ 9:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದಲೇ, “ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ” ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.", "r": "9:23"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನು ಪ್ರಾಯದವನು, ಅವನನ್ನೇ ಕೇಳಿ ಎಂದು ಅವನ ತಂದೆತಾಯಿಗಳು ಹೇಳಿದ್ದು.”", "a": "ಆದುದರಿಂದಲೇ", "r": "9:23"}, {"n": 150, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ ಏನು ಹೇಳಿದರು?", "a": "“ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು. ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು”", "r": "9:24"}, {"n": 151, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಯಾರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳಲು ಕೇಳಿದರು?", "a": "ದೇವರ ಮುಂದೆ", "r": "9:24"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "9:24"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆ ಗೊತ್ತು, ಎಂದು ಕೇಳಿದರು.”", "a": "ಪಾಪಿಯೆಂದು", "r": "9:24"}, {"n": 154, "q": "“ಅಧಿಕಾರಿಗಳು ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ
