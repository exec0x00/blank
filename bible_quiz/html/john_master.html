 1mm\"><\/span> ಮುಖಾಂತರವೇ ಸಮಸ್ತವೂ ಉಂಟಾಯಿತು.”", "a": "ದಿವ್ಯವಾಣಿಯ", "r": "1:3"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದುದಲ್ಲ.”", "a": "ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ", "r": "1:3"}, {"n": 14, "q": "ಯೊವಾನ್ನ 1:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಿವ್ಯವಾಣಿಯ ಮುಖಾಂತರವೇ ಸಮಸ್ತವೂ ಉಂಟಾಯಿತು. ಉಂಟಾದವುಗಳಲ್ಲಿ ಯಾವುದೂ ಆ ದಿವ್ಯವಾಣಿಯಿಂದಲ್ಲದೆ ಆದುದಲ್ಲ.", "r": "1:3"}, {"n": 15, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ಏನಿತ್ತು?", "a": "ಸಜ್ಜೀವ", "r": "1:4"}, {"n": 16, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿದ್ದ ಜೀವವು ಏನಾಗಿತ್ತು?", "a": "ಮಾನವಜನಾಂಗದ ಜ್ಯೋತಿ", "r": "1:4"}, {"n": 17, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರಂಭದಲ್ಲಿ ದಿವ್ಯವಾಣಿಯನ್ನು ಯಾವ ಪ್ರತೀಕದಿಂದ ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಜ್ಯೋತಿ (ನಿಜವಾದ ಜ್ಯೋತಿ, ಜಗಜ್ಯೋತಿ)", "r": "1:4–9"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಜೀವವೇ ಮಾನವಜನಾಂಗದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜ್ಯೋತಿಯಾಗಿತ್ತು", "r": "1:4"}, {"n": 19, "q": "ಯೊವಾನ್ನ 1:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ಸಜ್ಜೀವವಿತ್ತು. ಆ ಜೀವವೇ ಮಾನವಜನಾಂಗದ ಜ್ಯೋತಿಯಾಗಿತ್ತು.", "r": "1:4"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಜೀವವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜ್ಯೋತಿಯಾಗಿತ್ತು.”", "a": "ಮಾನವಜನಾಂಗದ", "r": "1:4"}, {"n": 21, "q": "ಜ್ಯೋತಿ ಎಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ?", "a": "ಕತ್ತಲಲ್ಲಿ", "r": "1:5"}, {"n": 22, "q": "ಕತ್ತಲಿಗೆ ಜ್ಯೋತಿಯನ್ನು ಏನು ಮಾಡಲಾಗಲಿಲ್ಲ?", "a": "ನಿಗ್ರಹಿಸಲಾಗಲಿಲ್ಲ", "r": "1:5"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಜ್ಯೋತಿ ಕತ್ತಲಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಕಾಶಿಸುತ್ತದೆ", "r": "1:5"}, {"n": 24, "q": "ಯೊವಾನ್ನ 1:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಜ್ಯೋತಿ ಕತ್ತಲಲ್ಲಿ ಪ್ರಕಾಶಿಸುತ್ತದೆ. ಕತ್ತಲಿಗಾದರೋ ಅದನ್ನು ನಿಗ್ರಹಿಸಲಾಗಲಿಲ್ಲ.", "r": "1:5"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಜ್ಯೋತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಕಾಶಿಸುತ್ತದೆ.”", "a": "ಕತ್ತಲಲ್ಲಿ", "r": "1:5"}, {"n": 26, "q": "ದೇವರು ಕಳುಹಿಸಿದ ವ್ಯಕ್ತಿಯ ಹೆಸರೇನು?", "a": "ಯೊವಾನ್ನ", "r": "1:6"}, {"n": 27, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಸ್ನಾನಿಕ ಯೊವಾನ್ನನನ್ನು ಮೊದಲು ಹೇಗೆ ಪರಿಚಯಿಸಲಾಗಿದೆ?", "a": "ದೇವರು ಕಳುಹಿಸಿದ ವ್ಯಕ್ತಿ; ಆತನ ಹೆಸರು ಯೊವಾನ್ನ", "r": "1:6; 1:19"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಳುಹಿಸಿದರು.”", "a": "ವ್ಯಕ್ತಿಯನ್ನು", "r": "1:6"}, {"n": 29, "q": "ಯೊವಾನ್ನ 1:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು ಕಳುಹಿಸಿದರು. ಆತನ ಹೆಸರು ಯೊವಾನ್ನ.", "r": "1:6"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿದರು", "r": "1:6"}, {"n": 31, "q": "ಯೊವಾನ್ನನು ಏಕೆ ಬಂದನು?", "a": "ಸಾಕ್ಷಿಕೊಡಲು (ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲು)", "r": "1:7"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.”", "a": "ವಿಶ್ವಾಸಿಸುವಂತೆ", "r": "1:7"}, {"n": 33, "q": "“ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "1:7"}, {"n": 34, "q": "ಯೊವಾನ್ನ 1:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನು ಸಾಕ್ಷಿಕೊಡಲು ಬಂದನು. ತನ್ನ ಮುಖಾಂತರ ಸರ್ವರೂ ವಿಶ್ವಾಸಿಸುವಂತೆ ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಿದನು.", "r": "1:7"}, {"n": 35, "q": "ಯೊವಾನ್ನನು ಏನಾಗಿರಲಿಲ್ಲ?", "a": "ಜ್ಯೋತಿಯಾಗಿರಲಿಲ್ಲ", "r": "1:8"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.”", "a": "ಜ್ಯೋತಿಯನ್ನು", "r": "1:8"}, {"n": 37, "q": "“ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "1:8"}, {"n": 38, "q": "ಯೊವಾನ್ನ 1:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈತನೇ ಜ್ಯೋತಿಯಾಗಿರಲಿಲ್ಲ; ಆ ಜ್ಯೋತಿಯನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡಲೆಂದೇ ಬಂದವನು.", "r": "1:8"}, {"n": 39, "q": "ನಿಜವಾದ ಜ್ಯೋತಿ ಯಾರು?", "a": "ಆ ದಿವ್ಯವಾಣಿಯೇ", "r": "1:9"}, {"n": 40, "q": "ಜಗಜ್ಯೋತಿ ಲೋಕಕ್ಕೆ ಏಕೆ ಆಗಮಿಸಲಿದ್ದರು?", "a": "ಮಾನವರೆಲ್ಲರನ್ನು ಬೆಳಗಿಸಲು", "r": "1:9"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಜವಾದ ಜ್ಯೋತಿ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಿವ್ಯವಾಣಿಯೇ", "r": "1:9"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಗಿಸಲು ಲೋಕಕ್ಕೆ ಆಗಮಿಸಲಿದ್ದ ಜಗಜ್ಯೋತಿ ಅವರೇ.”", "a": "ಮಾನವರೆಲ್ಲರನ್ನು", "r": "1:9"}, {"n": 43, "q": "ಯೊವಾನ್ನ 1:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಿಜವಾದ ಜ್ಯೋತಿ ಆ ದಿವ್ಯವಾಣಿಯೇ. ಮಾನವರೆಲ್ಲರನ್ನು ಬೆಳಗಿಸಲು ಲೋಕಕ್ಕೆ ಆಗಮಿಸಲಿದ್ದ ಜಗಜ್ಯೋತಿ ಅವರೇ.", "r": "1:9"}, {"n": 44, "q": "ದಿವ್ಯವಾಣಿ ಲೋಕದಲ್ಲಿ ಇದ್ದರೂ ಲೋಕ ಏನು ಮಾಡಿತು?", "a": "ಅವರನ್ನು ಅರಿತುಕೊಳ್ಳದೆ ಹೋಯಿತು", "r": "1:10"}, {"n": 45, "q": "ದಿವ್ಯವಾಣಿಯ ಮುಖಾಂತರವೇ ಯಾವುದು ಉಂಟಾಯಿತು ಎಂದು 1:10 ಹೇಳುತ್ತದೆ?", "a": "ಲೋಕವು", "r": "1:10"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕವು ಉಂಟಾಯಿತು.”", "a": "ಮುಖಾಂತರವೇ", "r": "1:10"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕವಾದರೋ ಅವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಯಿತು.”", "a": "ಅರಿತುಕೊಳ್ಳದೆ", "r": "1:10"}, {"n": 48, "q": "ಯೊವಾನ್ನ 1:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದಿವ್ಯವಾಣಿ ಲೋಕದಲ್ಲಿ ಇದ್ದರು. ಅವರ ಮುಖಾಂತರವೇ ಲೋಕವು ಉಂಟಾಯಿತು. ಲೋಕವಾದರೋ ಅವರನ್ನು ಅರಿತುಕೊಳ್ಳದೆ ಹೋಯಿತು.", "r": "1:10"}, {"n": 49, "q": "ದಿವ್ಯವಾಣಿ ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ ಬಂದಾಗ ಅವರನ್ನು ಬರಮಾಡಿಕೊಳ್ಳದೆ ಹೋದವರು ಯಾರು?", "a": "ಸ್ವಜನರೇ", "r": "1:11"}, {"n": 50, "q": "ದಿವ್ಯವಾಣಿ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ", "r": "1:11"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದರು;”", "a": "ಸ್ವದೇಶಕ್ಕೆ", "r": "1:11"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಜನರೇ ಅವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳದೆ", "r": "1:11"}, {"n": 53, "q": "ಯೊವಾನ್ನ 1:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ತಮ್ಮ ಸ್ವದೇಶಕ್ಕೆ ಬಂದರು; ಸ್ವಜನರೇ ಅವರನ್ನು ಬರಮಾಡಿಕೊಳ್ಳದೆ ಹೋದರು.", "r": "1:11"}, {"n": 54, "q": "ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ ಅವರು ಏನನ್ನು ಕೊಟ್ಟರು?", "a": "ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು", "r": "1:12"}, {"n": 55, "q": "ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಪಡೆದವರು ಯಾರು?", "a": "ದಿವ್ಯವಾಣಿಯನ್ನು ಬರಮಾಡಿಕೊಂಡವರು, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರು", "r": "1:12"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಬರಮಾಡಿ ಕೊಂಡರು.”", "a": "ಕೆಲವರಾದರೋ", "r": "1:12"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರಿಗೆ, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಅವರು ಕೊಟ್ಟರು.”", "a": "ಇಟ್ಟವರಿಗೆ", "r": "1:12"}, {"n": 58, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂಥವರಿಗೆ, ಅಂದರೆ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ, …”", "a": "“… ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಅವರು ಕೊಟ್ಟರು.”", "r": "1:12"}, {"n": 59, "q": "ದೇವರ ಮಕ್ಕಳಾದವರ ಜನನವು ಯಾವುದರಿಂದ ಅಲ್ಲ?", "a": "ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ; ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ; ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ", "r": "1:13"}, {"n": 60, "q": "ದೇವರ ಮಕ್ಕಳಾದವರ ಜನನವು ಯಾರಿಂದ ಆದುದು?", "a": "ದೇವರಿಂದಲೇ", "r": "1:13"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರ ಜನನವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.”", "a": "ರಕ್ತಸಂಬಂಧದಿಂದ", "r": "1:13"}, {"n": 62, "q": "“ಅಂಥವರ ಜನನವು ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "1:13"}, {"n": 63, "q": "ಯೊವಾನ್ನ 1:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂಥವರ ಜನನವು ರಕ್ತಸಂಬಂಧದಿಂದ ಅಲ್ಲ, ಶಾರೀರಕ ಇಚ್ಛೆಯಿಂದ ಅಲ್ಲ, ಮಾನವಸಹಜ ಬಯಕೆಯಿಂದಲೂ ಅಲ್ಲ, ದೇವರಿಂದಲೇ ಆದುದು.", "r": "1:13"}, {"n": 64, "q": "ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯರಾದುದರ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:14ರ ಆರಂಭದ ಮಾತುಗಳು ಯಾವುವು?", "a": "“ಆ ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯ ಆದರು. ಮನುಷ್ಯನಾಗಿ ನಮ್ಮೊಡನೆ ವಾಸಮಾಡಿದರು.”", "r": "1:14"}, {"n": 65, "q": "ಯಾರ ಮಹಿಮೆಯನ್ನು ‘ನಾವು ನೋಡಿದೆವು’ ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ದಿವ್ಯವಾಣಿಯ ಮಹಿಮೆಯನ್ನು", "r": "1:14"}, {"n": 66, "q": "ದಿವ್ಯವಾಣಿ ಯಾವುದರಿಂದ ಪರಿಪೂರ್ಣರಾಗಿದ್ದರು?", "a": "ವರಪ್ರಸಾದದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ", "r": "1:14"}, {"n": 67, "q": "ಪಿತನಿಂದ ಪಡೆದ ಮಹಿಮೆ ಯಾರಿಗೆ ಮೀಸಲಾದ ಮಹಿಮೆ?", "a": "ಏಕೈಕ ಪುತ್ರನಿಗೆ", "r": "1:14"}, {"n": 68, "q": "ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯನಾಗಿ ಯಾರೊಡನೆ ವಾಸಮಾಡಿದರು?", "a": "ನಮ್ಮೊಡನೆ", "r": "1:14"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನುಷ್ಯ ಆದರು.”", "a": "ದಿವ್ಯವಾಣಿ", "r": "1:14"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ನೋಡಿದೆವು.”", "a": "ಮಹಿಮೆಯನ್ನು", "r": "1:14"}, {"n": 71, "q": "ಯೊವಾನ್ನನು ದಿವ್ಯವಾಣಿಯನ್ನು ಕುರಿತು ಘೋಷಿಸಿದ ಸಾಕ್ಷಿ ಯಾವುದು?", "a": "‘ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು; ಆದುದರಿಂದ ಅವರು ನನಗಿಂತಲೂ ಶ್ರೇಷ್ಠರು’", "r": "1:15"}, {"n": 72, "q": "“ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು” ಎಂಬ ಯೊವಾನ್ನನ ಸಾಕ್ಷಿ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ಎರಡು ಬಾರಿ (1:15; 1:30)", "r": "1:15; 1:30"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನುಡಿಯುತ್ತಾ, ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು;”", "a": "ಯೊವಾನ್ನನು", "r": "1:15"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವರು ನನಗಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ನಾನು ಹೇಳಿದ್ದು ಅವರನ್ನು ಕುರಿತೇ, ಎಂದು ಘೋಷಿಸಿದನು.”", "a": "ಶ್ರೇಷ್ಠರು", "r": "1:15"}, {"n": 75, "q": "“ಯೊವಾನ್ನನು ಅವರನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನುಡಿಯುತ್ತಾ,  ಅವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತ ಮೊದಲೇ ಇದ್ದವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "1:15"}, {"n": 76, "q": "ದಿವ್ಯವಾಣಿಯ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ಏನನ್ನು ಪಡೆದಿದ್ದೇವೆ?", "a": "ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು", "r": "1:16"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.”", "a": "ಪರಿಪೂರ್ಣತೆಯಿಂದ", "r": "1:16"}, {"n": 78, "q": "“ಅವರ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "1:16"}, {"n": 79, "q": "ಯೊವಾನ್ನ 1:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಪರಿಪೂರ್ಣತೆಯಿಂದ ನಾವೆಲ್ಲರು ವರಪ್ರಸಾದದ ಮೇಲೆ ವರಪ್ರಸಾದವನ್ನು ಪಡೆದಿದ್ದೇವೆ.", "r": "1:16"}, {"n": 80, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು?", "a": "ಮೋಶೆಯ ಮುಖಾಂತರ", "r": "1:17"}, {"n": 81, "q": "ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವು ಯಾವುವು?", "a": "ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯ", "r": "1:17"}, {"n": 82, "q": "ಮೋಶೆ ಮತ್ತು ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವುಗಳನ್ನು ಹೋಲಿಸಿ.", "a": "ಮೋಶೆಯ ಮುಖಾಂತರ ಧರ್ಮಶಾಸ್ತ್ರ; ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯ", "r": "1:17"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು.”", "a": "ಮೋಶೆಯ", "r": "1:17"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯವಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮುಖಾಂತರ ಬಂದವು.”", "a": "ಯೇಸುಕ್ರಿಸ್ತರ", "r": "1:17"}, {"n": 85, "q": "ಯೊವಾನ್ನ 1:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಮೋಶೆಯ ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು. ವರಪ್ರಸಾದ ಹಾಗೂ ಸತ್ಯವಾದರೋ ಯೇಸುಕ್ರಿಸ್ತರ ಮುಖಾಂತರ ಬಂದವು.", "r": "1:17"}, {"n": 86, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:18ರ ಪ್ರಕಾರ ಯಾರೂ ಎಂದೂ ಯಾರನ್ನು ಕಂಡಿಲ್ಲ?", "a": "ದೇವರನ್ನು", "r": "1:18"}, {"n": 87, "q": "ದೇವರನ್ನು ತಿಳಿಯಪಡಿಸಿದವರು ಯಾರು?", "a": "ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ, ಸ್ವತಃ ದೇವರಾಗಿರುವ ಏಕೈಕ ಪುತ್ರ", "r": "1:18"}, {"n": 88, "q": "ಏಕೈಕ ಪುತ್ರನು ಎಲ್ಲಿರುವವರು ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿ", "r": "1:18"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರೂ ಎಂದೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡಿಲ್ಲ;”", "a": "ದೇವರನ್ನು", "r": "1:18"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಸ್ವತಃ ದೇವರಾಗಿರುವ ಏಕೈಕ ಪುತ್ರನೇ ಅವರನ್ನು ತಿಳಿಯಪಡಿಸಿದ್ದಾರೆ.”", "a": "ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ", "r": "1:18"}, {"n": 91, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಪಿತನ ವಕ್ಷಸ್ಥಳದಲ್ಲಿರುವ, ಸ್ವತಃ ದೇವರಾಗಿರುವ …”", "a": "“… ಏಕೈಕ ಪುತ್ರನೇ ಅವರನ್ನು ತಿಳಿಯಪಡಿಸಿದ್ದಾರೆ.”", "r": "1:18"}, {"n": 92, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:19ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಸ್ನಾನಿಕ ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯ", "r": "1:19"}, {"n": 93, "q": "ಯೊವಾನ್ನನ ಬಳಿಗೆ ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ ಕಳಿಸಿದವರು ಯಾರು?", "a": "ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "1:19"}, {"n": 94, "q": "ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೊವಾನ್ನನ ಬಳಿಗೆ ಯಾರನ್ನು ಕಳಿಸಿದರು?", "a": "ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ", "r": "1:19"}, {"n": 95, "q": "ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಯೊವಾನ್ನನನ್ನು ಮೊದಲು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಯಾರು?”", "r": "1:19"}, {"n": 96, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಕಳಿಸಿದರು.”", "a": "ಯೊವಾನ್ನನ", "r": "1:19"}, {"n": 97, "q": "“ಜೆರುಸಲೇಮಿನ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ಯಾಜಕರನ್ನೂ ಲೇವಿಯರನ್ನೂ ಯೊವಾನ್ನನ ಬಳಿಗೆ ಕಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "1:19"}, {"n": 98, "q": "“ನೀನು ಯಾರು?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೊವಾನ್ನನು ಸ್ಪಷ್ಟವಾಗಿ ಏನು ಹೇಳಿದನು?", "a": "“ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ”", "r": "1:20"}, {"n": 99, "q": "ಯೆಹೂದ್ಯರು ಕಳಿಸಿದವರ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರವಾಗಿ ಯೊವಾನ್ನನು ತಾನು ಯಾರಲ್ಲ ಎಂದು ಹೇಳಿದನು?", "a": "1) ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ; 2) ಎಲೀಯ; 3) ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ", "r": "1:20–21"}, {"n": 100, "q": "ಯೊವಾನ್ನನು ತಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ ಎಂದು ಹೇಗೆ ಹೇಳಿದನು?", "a": "ಸ್ಪಷ್ಟವಾಗಿ; ಏನನ್ನೂ ಮರೆಮಾಚಲಿಲ್ಲ", "r": "1:20"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ, ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:20"}, {"n": 102, "q": "“ಯೊವಾನ್ನನು ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ, ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "1:20"}, {"n": 103, "q": "ಯೊವಾನ್ನ 1:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ, “ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ನಾನಲ್ಲ,” ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿದನು. ಏನನ್ನೂ ಮರೆಮಾಚಲಿಲ್ಲ.", "r": "1:20"}, {"n": 104, "q": "“ನೀನು ಎಲೀಯನೋ?” ಎಂದು ಕೇಳಿದಾಗ ಯೊವಾನ್ನನು ಏನೆಂದನು?", "a": "‘ಅಲ್ಲ’", "r": "1:21"}, {"n": 105, "q": "“ನೀನು ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯಿರಬಹುದೇ?” ಎಂದು ಕೇಳಿದಾಗ ಯೊವಾನ್ನನು ಏನೆಂದು ಮರುನುಡಿದನು?", "a": "“ಅದೂ ಅಲ್ಲ”", "r": "1:21"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ ಎಂದನು.”", "a": "ಕೇಳಲು", "r": "1:21"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಅವರು ಮತ್ತೆ ಕೇಳಲು, ಅದೂ ಅಲ್ಲ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮರುನುಡಿದನು", "r": "1:21"}, {"n": 108, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಎಂದು ಅವರು ಮತ್ತೆ ಕೇಳಲು, …”", "a": "“… ಅದೂ ಅಲ್ಲ, ಎಂದು ಮರುನುಡಿದನು.”", "r": "1:21"}, {"n": 109, "q": "ಯೊವಾನ್ನನು ಯಾರೆಂದು ತಿಳಿಸಬೇಕೆಂದು ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಏಕೆ ಕೇಳಿದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದವರಿಗೆ ಅವರು ಉತ್ತರಕೊಡಬೇಕಾಗಿದ್ದರಿಂದ", "r": "1:22"}, {"n": 110, "q": "ಯೊವಾನ್ನನಿಗೆ ಯಾಜಕರು ಮತ್ತು ಲೇವಿಯರು ಮತ್ತೊಮ್ಮೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಿನ್ನನ್ನು ಕುರಿತು ನೀನು ಏನು ಹೇಳುತ್ತೀ?”", "r": "1:22"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಯಾರೆಂದು ನಮಗೆ ತಿಳಿಸು.”", "a": "ಹಾಗಾದರೆ", "r": "1:22"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮನ್ನು ಕಳುಹಿಸಿದವರಿಗೆ ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉತ್ತರಕೊಡಬೇಕಾಗಿದೆ", "r": "1:22"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ನೀನು ಏನು ಹೇಳುತ್ತೀ?”", "a": "ನಿನ್ನನ್ನು", "r": "1:22"}, {"n": 114, "q": "ತನ್ನ ಬಗ್ಗೆ ಯೊವಾನ್ನನು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲಿ ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು”", "r": "1:23"}, {"n": 115, "q": "“ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು” — ಯೊವಾನ್ನನು ಯಾವ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲಿ ಹೀಗೆ ಉತ್ತರಿಸಿದನು?", "a": "ಯೆಶಾಯ ಪ್ರವಾದಿಯ", "r": "1:23"}, {"n": 116, "q": "ಯೊವಾನ್ನನು ತಾನು ಎಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೆಂದು ಹೇಳಿದನು?", "a": "ಬೆಂಗಾಡಿನಲ್ಲಿ", "r": "1:23"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು, ಎಂದು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲೇ ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:23"}, {"n": 118, "q": "“ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ಪ್ರಭುವಿನ ಮಾರ್ಗವನ್ನು ನೇರಗೊಳಿಸಿರೆಂದು ಬೆಂಗಾಡಿನಲ್ಲಿ ಕೂಗುವವನ ಸ್ವರವೇ ನಾನು, ಎಂದು ಯೆಶಾಯ ಪ್ರವಾದಿಯ ಮಾತುಗಳಲ್ಲೇ ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "1:23"}, {"n": 119, "q": "“… ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?” ಎಂದು ಯೊವಾನ್ನನನ್ನು ಪ್ರಶ್ನಿಸಿದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು", "r": "1:24–25"}, {"n": 120, "q": "ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದವರು ಯೊವಾನ್ನನನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?”", "r": "1:24–25"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?”", "a": "ಎಲೀಯನಾಗಲಿ", "r": "1:24–25"}, {"n": 122, "q": "“ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24–25", "r": "1:24–25"}, {"n": 123, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?”", "a": "ಫರಿಸಾಯರ", "r": "1:24–25"}, {"n": 124, "q": "ಯೊವಾನ್ನ 1:24–25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಫರಿಸಾಯರ ಕಡೆಯಿಂದ ಬಂದಿದ್ದ ಕೆಲವರು, “ನೀನು ಲೋಕೋದ್ಧಾರಕನಾಗಲಿ, ಎಲೀಯನಾಗಲಿ, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿಯೇ ಆಗಲಿ ಅಲ್ಲವೆಂದ ಮೇಲೆ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವುದೇಕೆ?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "1:24–25"}, {"n": 125, "q": "ಯೊವಾನ್ನನು ಯಾವುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದನು?", "a": "ನೀರಿನಿಂದ", "r": "1:26"}, {"n": 126, "q": "ಫರಿಸಾಯರ ಕಡೆಯವರಿಗೆ ಯೊವಾನ್ನನು ಅವರ ನಡುವೆ ಇರುವವರ ಬಗ್ಗೆ ಏನು ಹೇಳಿದನು?", "a": "“ನಿಮಗೆ ತಿಳಿಯದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ನಿಮ್ಮ ನಡುವೆ ಇದ್ದಾರೆ.”", "r": "1:26"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರತ್ಯುತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದೇನೆ.”", "a": "ಯೊವಾನ್ನನು", "r": "1:26"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮಗೆ ತಿಳಿಯದ ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮ ನಡುವೆ ಇದ್ದಾರೆ.”", "a": "ವ್ಯಕ್ತಿ", "r": "1:26"}, {"n": 129, "q": "“ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೊವಾನ್ನನು, ನಾನು ನಿಮಗೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "1:26"}, {"n": 130, "q": "ಯೊವಾನ್ನನು ತನ್ನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರ ಯಾವುದನ್ನು ಬಿಚ್ಚುವುದಕ್ಕೂ ಯೋಗ್ಯನಲ್ಲ ಎಂದನು?", "a": "ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು", "r": "1:27"}, {"n": 131, "q": "ಯೊವಾನ್ನನ ಪ್ರಕಾರ ಅವನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರು ಯಾರು?", "a": "ಅವರ ನಡುವೆ ಇದ್ದ, ಅವರಿಗೆ ತಿಳಿಯದ ವ್ಯಕ್ತಿ (ಯೇಸು)", "r": "1:27"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರೇ.”", "a": "ಬರಬೇಕಾಗಿದ್ದವರು", "r": "1:27"}, {"n": 133, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಚ್ಚುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ, ಎಂದನು.”", "a": "ಪಾದರಕ್ಷೆಗಳನ್ನು", "r": "1:27"}, {"n": 134, "q": "ಯೊವಾನ್ನ 1:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಬಳಿಕ ಬರಬೇಕಾಗಿದ್ದವರು ಅವರೇ. ಅವರ ಪಾದರಕ್ಷೆಗಳನ್ನು ಬಿಚ್ಚುವುದಕ್ಕೂ ನಾನು ಯೋಗ್ಯನಲ್ಲ,” ಎಂದನು.", "r": "1:27"}, {"n": 135, "q": "ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯದ ಈ ಘಟನೆಗಳು ಎಲ್ಲಿ ನಡೆದವು?", "a": "ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ", "r": "1:28"}, {"n": 136, "q": "ಬೆಥಾನಿಯ ಯಾವ ನದಿಯ ಆಚೆದಡದಲ್ಲಿತ್ತು?", "a": "ಜೋರ್ಡನ್ ನದಿಯ", "r": "1:28"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:28"}, {"n": 138, "q": "“ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "1:28"}, {"n": 139, "q": "ಯೊವಾನ್ನ 1:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡತ್ತಿದ್ದ ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ ಎಂಬಲ್ಲಿ ಇದೆಲ್ಲವೂ ನಡೆಯಿತು.", "r": "1:28"}, {"n": 140, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:29ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದೇವರ ಯಜ್ಞಪಶು", "r": "1:29"}, {"n": 141, "q": "ಯೇಸು ತನ್ನ ಬಳಿಗೆ ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು ಯೊವಾನ್ನನು ಏನೆಂದನು?", "a": "“ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ; ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಇವರೇ.”", "r": "1:29"}, {"n": 142, "q": "ಯೊವಾನ್ನನ ಪ್ರಕಾರ ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಯಾರು?", "a": "ಯೇಸು (ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ)", "r": "1:29"}, {"n": 143, "q": "ಯೊವಾನ್ನನು ಯೇಸುವನ್ನು “ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಕರೆದನು?", "a": "ಎರಡು ಬಾರಿ (1:29; 1:36)", "r": "1:29; 1:36"}, {"n": 144, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿಗೆ ಉಪಯೋಗಿಸಲಾದ ಯಾವುದಾದರೂ ನಾಲ್ಕು ಬಿರುದುಗಳನ್ನು ತಿಳಿಸಿ.", "a": "ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ; ದೇವರ ಪುತ್ರ; ಮೆಸ್ಸೀಯ; ಇಸ್ರಯೇಲರ ಅರಸ; ಗುರುದೇವ (ರಬ್ಬಿ); ನರಪುತ್ರ", "r": "1:29; 1:34; 1:36; 1:41; 1:49"}, {"n": 145, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಮರುದಿನ ಅಥವಾ ಮಾರನೆಯ ದಿನ ಎಂದು ಆರಂಭವಾಗುವ ವಚನಗಳು ಯಾವುವು?", "a": "1:29, 1:35, 1:43", "r": "1:29; 1:35; 1:43"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರುದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಾನಿದ್ದಲ್ಲಿಗೇ ಯೇಸು ಬರುತ್ತಿರುವುದನ್ನು ಕಂಡು, ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ;”", "a": "ಯೊವಾನ್ನನು", "r": "1:29"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕದ ಪಾಪಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ.”", "a": "ಪರಿಹರಿಸುವವರು", "r": "1:29"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ನನ್ನ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನಗಿಂತಲೂ ಮೊದಲೇ ಇದ್ದವರು;”", "a": "ಬಂದವರಾದರೂ", "r": "1:30"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಇವರು ನನಗಿಂತಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನಾನು ಹೇಳಿದುದು ಇವರನ್ನು ಕುರಿತೇ.”", "a": "ಶ್ರೇಷ್ಠರು", "r": "1:30"}, {"n": 150, "q": "“ಇವರು ನನ್ನ ಬಳಿಕ ಬಂದವರಾದರೂ ನನಗಿಂತಲೂ ಮೊದಲೇ ಇದ್ದವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "1:30"}, {"n": 151, "q": "ಯೊವಾನ್ನನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದದ್ದು ಏಕೆ?", "a": "ಇಸ್ರಯೇಲರಿಗೆ ಯೇಸುವನ್ನು ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ", "r": "1:31"}, {"n": 152, "q": "“ಬರಬೇಕಾಗಿದ್ದವರು ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ” ಎಂದು ಯೊವಾನ್ನನು ಎಷ್ಟು ಬಾರಿ ಹೇಳಿದನು?", "a": "ಎರಡು ಬಾರಿ (1:31; 1:33)", "r": "1:31; 1:33"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಸ್ರಯೇಲರಿಗೆ ಇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದೆನು;”", "a": "ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ", "r": "1:31"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ, ಎಂದು ನುಡಿದನು.”", "a": "ಬರಬೇಕಾಗಿದ್ದವರು", "r": "1:31"}, {"n": 155, "q": "“ಇಸ್ರಯೇಲರಿಗೆ ಇವರನ್ನು ತೋರ್ಪಡಿಸಬೇಕೆಂದೇ ನಾನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾ ಬಂದೆನು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "1:31"}, {"n": 156, "q": "ಪವಿತ್ರಾತ್ಮ ಯಾವ ರೂಪದಲ್ಲಿ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಯೇಸುವಿನ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ಯೊವಾನ್ನನು ನೋಡಿದನು?", "a": "ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ", "r": "1:32"}, {"n": 157, "q": "ಪವಿತ್ರಾತ್ಮ ಎಲ್ಲಿಂದ ಇಳಿದು ಬಂದರು?", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "1:32"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:32"}, {"n": 159, "q": "“ಯೊವಾನ್ನನು ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "1:32"}, {"n": 160, "q": "ಯೊವಾನ್ನ 1:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೊವಾನ್ನನು ತನ್ನ ಸಾಕ್ಷ್ಯವನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, “ಪಾರಿವಾಳದ ರೂಪದಲ್ಲಿ ಪವಿತ್ರಾತ್ಮ ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಅವರ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನಾನು ನೋಡಿದೆನು.", "r": "1:32"}, {"n": 161, "q": "ಯೊವಾನ್ನನನ್ನು ಕಳುಹಿಸಿದ ದೇವರು ಅವನಿಗೆ ಕೊಟ್ಟ ಗುರುತು ಯಾವುದು?", "a": "‘ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದು ಯಾವ ವ್ಯಕ್ತಿಯ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನೀನು ನೋಡುವಿಯೋ ಆತನೇ ಪವಿತ್ರಾತ್ಮನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುವಾತ’", "r": "1:33"}, {"n": 162, "q": "ಯೊವಾನ್ನನ ಸ್ನಾನದೀಕ್ಷೆ ಮತ್ತು ಯೇಸುವಿನ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಹೋಲಿಸಿ.", "a": "ಯೊವಾನ್ನನು ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಾನೆ; ಯೇಸು ಪವಿತ್ರಾತ್ಮನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುತ್ತಾರೆ", "r": "1:33"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ.”", "a": "ಬರಬೇಕಾಗಿದ್ದವರು", "r": "1:33"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನೀರಿನಿಂದ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುವಂತೆ ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ದೇವರು, ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದು ಯಾವ ವ್ಯಕ್ತಿಯ ಮೇಲೆ ನೆಲಸುವುದನ್ನು ನೀನು ನೋಡುವಿಯೋ ಆತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೀಕ್ಷಾಸ್ನಾನ ಕೊಡುವಾತ, ಎಂದಿದ್ದರು.”", "a": "ಪವಿತ್ರಾತ್ಮನಿಂದ", "r": "1:33"}, {"n": 165, "q": "“ಬರಬೇಕಾಗಿದ್ದವರು ಇವರೇ ಎಂದು ನನಗೂ ತಿಳಿದಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "1:33"}, {"n": 166, "q": "ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದುದನ್ನು ಕಣ್ಣಾರೆ ನೋಡಿದ ಯೊವಾನ್ನನು ಯೇಸುವನ್ನು ಕುರಿತು ಏನೆಂದು ಸಾಕ್ಷಿ ನೀಡಿದನು?", "a": "ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು", "r": "1:34"}, {"n": 167, "q": "ಯೊವಾನ್ನನು ಪವಿತ್ರಾತ್ಮ ಇಳಿದು ಬಂದುದನ್ನು ಹೇಗೆ ನೋಡಿದನು?", "a": "ಕಣ್ಣಾರೆ", "r": "1:34"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ನಾನು ಕಣ್ಣಾರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೋಡಿದ್ದೇನೆ", "r": "1:34"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದನು.”", "a": "ನೀಡುತ್ತಿದ್ದೇನೆ", "r": "1:34"}, {"n": 170, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದುದರಿಂದ ಅವರೇ ದೇವರ ಪುತ್ರನೆಂದು …”", "a": "“… ಸಾಕ್ಷಿ ನೀಡುತ್ತಿದ್ದೇನೆ, ಎಂದು ಹೇಳಿದನು.”", "r": "1:34"}, {"n": 171, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:35ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪ್ರಥಮ ಶಿಷ್ಯರು", "r": "1:35"}, {"n": 172, "q": "ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ಎಷ್ಟು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿದ್ದನು?", "a": "ಇಬ್ಬರು", "r": "1:35"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:35"}, {"n": 174, "q": "“ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, ಯೇಸುಸ್ವಾಮಿ ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "1:35"}, {"n": 175, "q": "ಯೊವಾನ್ನ 1:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಾರನೆಯ ದಿನ ಯೊವಾನ್ನನು ತನ್ನಿಬ್ಬರು ಶಿಷ್ಯರ ಸಂಗಡ ನಿಂತುಕೊಂಡಿರುವಾಗ, ಯೇಸುಸ್ವಾಮಿ ಆ ಮಾರ್ಗವಾಗಿ ಹೋಗುತ್ತಿದ್ದರು.", "r": "1:35"}, {"n": 176, "q": "ಯೇಸುವನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಶಿಷ್ಯರಿಗೆ ಏನೆಂದು ಹೇಳಿದನು?", "a": "“ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ”", "r": "1:36"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರನ್ನು ನೋಡುತ್ತಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ, ಎಂದು ಹೇಳಿದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "1:36"}, {"n": 178, "q": "“ಅವರನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ, ಎಂದು ಹೇಳಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "1:36"}, {"n": 179, "q": "ಯೊವಾನ್ನ 1:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರನ್ನು ನೋಡುತ್ತಲೇ ಯೊವಾನ್ನನು ತನ್ನ ಆ ಶಿಷ್ಯರಿಗೆ, “ಇಗೋ ನೋಡಿ, ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ,” ಎಂದು ಹೇಳಿದನು.", "r": "1:36"}, {"n": 180, "q": "ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿದ ಅವನ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು", "r": "1:37"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "1:37"}, {"n": 182, "q": "“ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "1:37"}, {"n": 183, "q": "ಯೊವಾನ್ನ 1:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿದ ಆ ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದರು.", "r": "1:37"}, {"n": 184, "q": "ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸಿ ಬರುತ್ತಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಿಗೆ ಯೇಸು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನಿಮಗೆ ಏನು ಬೇಕು?”", "r": "1:38"}, {"n": 185, "q": "“ನಿಮಗೆ ಏನು ಬೇಕು?” ಎಂದು ಯೇಸು ಕೇಳಿದಾಗ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ರಬ್ಬಿ, ತಾವು ವಾಸ ಮಾಡುವುದೆಲ್ಲಿ?”", "r": "1:38"}, {"n": 186, "q": "‘ರಬ್ಬಿ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಗುರುದೇವ", "r": "1:38"}, {"n": 187, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಅರ್ಥವನ್ನು ವಿವರಿಸಲಾದ ಮೂರು ಪದಗಳು ಯಾವುವು?", "a": "ರಬ್ಬಿ (ಗುರುದೇವ); ಮೆಸ್ಸೀಯ (ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ); ಕೇಫ (ಪೇತ್ರ ಇಲ್ಲವೇ ಬಂಡೆ)", "r": "1:38; 1:41–42"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಮ್ಮನ್ನು ಹಿಂಬಾಲಿಸಿ ಬರುತ್ತಿರುವುದನ್ನು ನೋಡಿ, ನಿಮಗೆ ಏನು ಬೇಕು?”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:38"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ರಬ್ಬಿ, ತಾವು ವಾಸ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಮಾಡುವುದೆಲ್ಲಿ", "r": "1:38"}, {"n": 190, "q": "“ತಾವು ವಾಸ ಮಾಡುವುದೆಲ್ಲಿ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಕೊಟ್ಟ ಉತ್ತರವೇನು?", "a": "“ಬಂದು ನೋಡಿ”", "r": "1:39"}, {"n": 191, "q": "ಇಬ್ಬರು ಶಿಷ್ಯರು ಯೇಸುವಿನೊಡನೆ ದಿನ ಕಳೆಯಲು ಹೋದಾಗ ಸಮಯ ಎಷ್ಟಾಗಿತ್ತು?", "a": "ಸಾಯಂಕಾಲ ಸುಮಾರು ನಾಲ್ಕು ಗಂಟೆ", "r": "1:39"}, {"n": 192, "q": "ಯೇಸು ಇದ್ದ ಸ್ಥಳವನ್ನು ಕಂಡ ಇಬ್ಬರು ಶಿಷ್ಯರು ಏನು ಮಾಡಿದರು?", "a": "ಆ ದಿನವನ್ನು ಅವರೊಡನೆ ಕಳೆದರು", "r": "1:39"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಉತ್ತರವಾಗಿ, ಬಂದು ನೋಡಿ ಎನ್ನಲು ಅವರು ಹೋಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದ ಸ್ಥಳವನ್ನು ಕಂಡು ಆ ದಿನವನ್ನು ಅವರೊಡನೆ ಕಳೆದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:39"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಸಾಯಂಕಾಲ ಸುಮಾರು ನಾಲ್ಕು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗಂಟೆಯಾಗಿತ್ತು", "r": "1:39"}, {"n": 195, "q": "ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು ಯಾರು?", "a": "ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು", "r": "1:40"}, {"n": 196, "q": "ಅಂದ್ರೆಯನು ಯಾರ ಸಹೋದರ?", "a": "ಸಿಮೋನ ಪೇತ್ರನ", "r": "1:40"}, {"n": 197, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಯೇಸುವಿನ ನಾಲ್ವರು ಶಿಷ್ಯರು ಯಾರು?", "a": "ಅಂದ್ರೆಯ, ಸಿಮೋನ ಪೇತ್ರ, ಫಿಲಿಪ್ಪ, ನತಾನಿಯೇಲ", "r": "1:40–49"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಿಸಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು ಒಬ್ಬನು.”", "a": "ಯೇಸುವನ್ನು", "r": "1:40"}, {"n": 199, "q": "“ಯೊವಾನ್ನನ ಮಾತನ್ನು ಕೇಳಿ ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ್ದ ಇಬ್ಬರು ಶಿಷ್ಯರಲ್ಲಿ ಸಿಮೋನ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು ಒಬ್ಬನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "1:40"}, {"n": 200, "q": "ಅಂದ್ರೆಯನು ತನ್ನ ಸಹೋದರ ಸಿಮೋನನಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದನು?", "a": "“ನಮಗೆ ‘ಮೆಸ್ಸೀಯ’ ಸಿಕ್ಕಿದ್ದಾರೆ”", "r": "1:41"}, {"n": 201, "q": "‘ಮೆಸ್ಸೀಯ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ", "r": "1:41–42"}, {"n": 202, "q": "ಅಂದ್ರೆಯನು ಯೇಸುವನ್ನು ಹಿಂಬಾಲಿಸಿದ ನಂತರ ಮೊದಲು ಯಾರನ್ನು ಕಂಡನು?", "a": "ತನ್ನ ಸಹೋದರ ಸಿಮೋನನನ್ನು", "r": "1:41"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವನು ಮೊದಲು ತನ್ನ ಸಹೋದರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ನಮಗೆ ಮೆಸ್ಸೀಯ ಸಿಕ್ಕಿದ್ದಾರೆ, ಎಂದು ತಿಳಿಸಿ”", "a": "ಸಿಮೋನನನ್ನು", "r": "1:41"}, {"n": 204, "q": "“ಇವನು ಮೊದಲು ತನ್ನ ಸಹೋದರ ಸಿಮೋನನನ್ನು ಕಂಡು, ನಮಗೆ ಮೆಸ್ಸೀಯ ಸಿಕ್ಕಿದ್ದಾರೆ, ಎಂದು ತಿಳಿಸಿ” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "1:41"}, {"n": 205, "q": "ಸಿಮೋನನನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಕರೆತಂದವನು ಯಾರು?", "a": "ಅಂದ್ರೆಯನು", "r": "1:42"}, {"n": 206, "q": "ಯೇಸು ಸಿಮೋನನನ್ನು ನೋಡಿ ಏನೆಂದು ನುಡಿದರು?", "a": "“ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು”", "r": "1:42"}, {"n": 207, "q": "ಸಿಮೋನನ ತಂದೆಯ ಹೆಸರೇನು?", "a": "ಯೊವಾನ್ನ", "r": "1:42"}, {"n": 208, "q": "‘ಕೇಫ’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "‘ಪೇತ್ರ’ ಇಲ್ಲವೇ ‘ಬಂಡೆ’", "r": "1:42"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಕರೆತಂದನು.”", "a": "ಯೇಸುವಿನ", "r": "1:42"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ, ಯೊವಾನ್ನನ ಮಗನಾದ ಸಿಮೋನನೇ, ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕೇಫನೆಂದು ಕರೆಯುವರು, ಎಂದು ನುಡಿದರು.”", "a": "ಸಿಮೋನನನ್ನು", "r": "1:42"}, {"n": 211, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 1:43ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಫಿಲಿಪ್ಪ ಮತ್ತು ನತಾನಿಯೇಲರಿಗೆ ಕರೆ", "r": "1:43"}, {"n": 212, "q": "ಮರುದಿನ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿದರು?", "a": "ಗಲಿಲೇಯ ನಾಡಿಗೆ", "r": "1:43"}, {"n": 213, "q": "ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ಕಂಡು ಹೇಗೆ ಕರೆದರು?", "a": "“ನನ್ನೊಡನೆ ಬಾ”", "r": "1:43"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮರುದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಲಿಲೇಯ ನಾಡಿಗೆ ಹೋಗಲು ನಿರ್ಧರಿಸಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "1:43"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ನನ್ನೊಡನೆ ಬಾ, ಎಂದು ಕರೆದರು.”", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "1:43"}, {"n": 216, "q": "ಫಿಲಿಪ್ಪನು ಯಾವ ಊರಿನವನು?", "a": "ಬೆತ್ಸಾಯಿದ", "r": "1:44"}, {"n": 217, "q": "ಫಿಲಿಪ್ಪನಂತೆ ಬೆತ್ಸಾಯಿದ ಊರಿನವರಾದ ಇನ್ನಿಬ್ಬರು ಯಾರು?", "a": "ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರ", "r": "1:44"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದ್ರೆಯ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.”", "a": "ಪೇತ್ರನಂತೆ", "r": "1:44"}, {"n": 219, "q": "“ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರನಂತೆ ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "1:44"}, {"n": 220, "q": "ಯೊವಾನ್ನ 1:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂದ್ರೆಯ ಮತ್ತು ಪೇತ್ರನಂತೆ ಫಿಲಿಪ್ಪನು ಕೂಡ ಬೆತ್ಸಾಯಿದ ಎಂಬ ಊರಿನವನು.", "r": "1:44"}, {"n": 221, "q": "ಫಿಲಿಪ್ಪನು ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾರಿಗೆ ತಿಳಿಸಿದನು?", "a": "ನತಾನಿಯೇಲನಿಗೆ", "r": "1:45"}, {"n": 222, "q": "ಫಿಲಿಪ್ಪನು ನತಾನಿಯೇಲನಿಗೆ ಯೇಸುವನ್ನು ಹೇಗೆ ಪರಿಚಯಿಸಿದನು?", "a": "“ಇವರೇ ಜೋಸೆಫನ ಮಗನಾದ ನಜರೇತ್ ಊರಿನ ಯೇಸು”", "r": "1:45"}, {"n": 223, "q": "ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಯಾರು ಉಲ್ಲೇಖಿಸಿದ ವ್ಯಕ್ತಿ ತಮಗೆ ಸಿಕ್ಕಿದ್ದಾರೆಂದು ಫಿಲಿಪ್ಪನು ಹೇಳಿದನು?", "a": "ಮೋಶೆ (ಮತ್ತು ಪ್ರವಾದಿಗಳು)", "r": "1:45"}, {"n": 224, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಯೇಸು ಯಾರ ಮಗ?", "a": "ಜೋಸೆಫನ ಮಗ", "r": "1:45"}, {"n": 225, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಯೇಸು ಯಾವ ಊರಿನವರು?", "a": "ನಜರೇತ್", "r": "1:45"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಫಿಲಿಪ್ಪನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು, ಧರ್ಮಶಾಸ್ತ್ರದಲ್ಲಿ ಮೋಶೆ ಉಲ್ಲೇಖಿಸಿದ ಮತ್ತು ಪ್ರವಾದಿಗಳು ಪ್ರವಚನ ಮಾಡಿದ ವ್ಯಕ್ತಿಯು ನಮಗೆ ಸಿಕ್ಕಿದ್ದಾರೆ.”", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:45"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದ ನಜರೇತ್ ಊರಿನ ಯೇಸು, ಎಂದು ಹೇಳಿದನು.”", "a": "ಜೋಸೆಫನ", "r": "1:45"}, {"n": 228, "q": "ನಜರೇತಿನ ಬಗ್ಗೆ ನತಾನಿಯೇಲನು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಏನು? ನಜರೇತಿನಿಂದ ಒಳ್ಳೆಯದೇನಾದರೂ ಬರುವುದು ಉಂಟೆ?”", "r": "1:46"}, {"n": 229, "q": "ನತಾನಿಯೇಲನ ಸಂಶಯಕ್ಕೆ ಫಿಲಿಪ್ಪನು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ಬಂದು ನೀನೇ ನೋಡು”", "r": "1:46"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಜರೇತಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವುದು ಉಂಟೆ?”", "a": "ಒಳ್ಳೆಯದೇನಾದರೂ", "r": "1:46"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಕೇಳಲು, ಬಂದು ನೀನೇ ನೋಡು, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಫಿಲಿಪ್ಪನು", "r": "1:46"}, {"n": 232, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಎಂದು ಕೇಳಲು, ಬಂದು ನೀನೇ …”", "a": "“… ನೋಡು, ಎಂದು ಫಿಲಿಪ್ಪನು ಉತ್ತರಕೊಟ್ಟನು.”", "r": "1:46"}, {"n": 233, "q": "ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ ನತಾನಿಯೇಲನನ್ನು ಕಂಡು ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ”", "r": "1:47"}, {"n": 234, "q": "ಯೇಸು ಯಾರನ್ನು “ನಿಜವಾದ ಇಸ್ರಯೇಲನು” ಎಂದು ಕರೆದರು?", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:47"}, {"n": 235, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನತಾನಿಯೇಲನಲ್ಲಿ ಏನಿಲ್ಲ?", "a": "ಕಪಟವಿಲ್ಲ", "r": "1:47"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡ ಯೇಸು, ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ, ಎಂದು ನುಡಿದರು.”", "a": "ನತಾನಿಯೇಲನನ್ನು", "r": "1:47"}, {"n": 237, "q": "“ತಮ್ಮ ಬಳಿಗೆ ಬರುತ್ತಿದ್ದ ನತಾನಿಯೇಲನನ್ನು ಕಂಡ ಯೇಸು, ಇಗೋ ನೋಡಿ, ನಿಜವಾದ ಇಸ್ರಯೇಲನು, ಈತನಲ್ಲಿ ಕಪಟವಿಲ್ಲ, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "1:47"}, {"n": 238, "q": "ನತಾನಿಯೇಲನು ಯೇಸುವನ್ನು ಏನೆಂದು ಕೇಳಿದನು?", "a": "“ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?”", "r": "1:48"}, {"n": 239, "q": "ಫಿಲಿಪ್ಪನು ಕರೆಯುವ ಮೊದಲೇ ನತಾನಿಯೇಲನು ಎಲ್ಲಿದ್ದಾಗ ಯೇಸು ಅವನನ್ನು ಕಂಡರು?", "a": "ಅಂಜೂರದ ಮರದಡಿ", "r": "1:48"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?”", "a": "ನತಾನಿಯೇಲನು", "r": "1:48"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಕೇಳಲು ಯೇಸು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನನ್ನು ಕರೆಯುವ ಮೊದಲೇ ನೀನು ಅಂಜೂರದ ಮರದಡಿ ಇದ್ದಾಗ ನಾನು ನಿನ್ನನ್ನು ಕಂಡೆ, ಎಂದು ಉತ್ತರ ಕೊಟ್ಟರು.”", "a": "ಫಿಲಿಪ್ಪನು", "r": "1:48"}, {"n": 242, "q": "“ನತಾನಿಯೇಲನು, ನನ್ನ ಪರಿಚಯ ನಿಮಗೆ ಹೇಗಾಯಿತು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "1:48"}, {"n": 243, "q": "ನತಾನಿಯೇಲನು ಯೇಸುವನ್ನು ಕುರಿತು ಮಾಡಿದ ಅರಿಕೆ ಏನು?", "a": "“ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ; ಇಸ್ರಯೇಲರ ಅರಸ ನೀವೇ”", "r": "1:49"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ;”", "a": "ನತಾನಿಯೇಲನು", "r": "1:49"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರಸ ನೀವೇ, ಎಂದನು.”", "a": "ಇಸ್ರಯೇಲರ", "r": "1:49"}, {"n": 246, "q": "“ಅದಕ್ಕೆ ನತಾನಿಯೇಲನು ಗುರುದೇವಾ, ದೇವರ ಪುತ್ರ ನೀವೇ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "1:49"}, {"n": 247, "q": "ನತಾನಿಯೇಲನ ವಿಶ್ವಾಸಕ್ಕೆ ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ? ಇದಕ್ಕೂ ಮಿಗಿಲಾದುವುಗಳನ್ನು ನೀನು ಕಾಣುವೆ”", "r": "1:50"}, {"n": 248, "q": "ನತಾನಿಯೇಲನು ಏನನ್ನು ಕಾಣುವನೆಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಇದಕ್ಕೂ ಮಿಗಿಲಾದುವುಗಳನ್ನು", "r": "1:50"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ?”", "a": "ಯೇಸು", "r": "1:50"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಕ್ಕೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀನು ಕಾಣುವೆ, ಎಂದು ನುಡಿದರು.”", "a": "ಮಿಗಿಲಾದುವುಗಳನ್ನು", "r": "1:50"}, {"n": 251, "q": "“ಆಗ ಯೇಸು, ಅಂಜೂರದ ಮರದಡಿಯಲ್ಲಿ ನಿನ್ನನ್ನು ಕಂಡೆ ಎಂದು ನಾನು ಹೇಳಿದ ಮಾತ್ರಕ್ಕೆ ಇಷ್ಟೊಂದು ವಿಶ್ವಾಸವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 50", "r": "1:50"}, {"n": 252, "q": "ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ದೇವದೂತರು ಯಾರ ಮುಖಾಂತರ ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ಶಿಷ್ಯರು ಕಾಣುವರು?", "a": "ನರಪುತ್ರನ ಮುಖಾಂತರ", "r": "1:51"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೇಸು ಸತ್ಯವಾಗಿ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಸ್ವರ್ಗವು ತೆರೆದಿರುವುದನ್ನೂ ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ”", "r": "1:51"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮ ಮಾತನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಮುಂದುವರಿಸುತ್ತಾ", "r": "1:51"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನರಪುತ್ರನ ಮುಖಾಂತರ ದೇವದೂತರು ಏರುವುದನ್ನೂ ಇಳಿಯುವುದನ್ನೂ ನೀವು ಕಾಣುವಿರಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ತೆರೆದಿರುವುದನ್ನೂ", "r": "1:51"}, {"n": 256, "q": "“ತಮ್ಮ ಮಾತನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 1ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "1:51"}]}, {"chapter": 2, "label": "ಅಧ್ಯಾಯ 2", "verses": 25, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎರಡನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ", "r": "2:1"}, {"n": 2, "q": "ಮದುವೆ ನಡೆದದ್ದು ಯಾವ ಊರಿನಲ್ಲಿ?", "a": "ಗಲಿಲೇಯದ ಕಾನಾ ಎಂಬ ಊರಿನಲ್ಲಿ", "r": "2:1"}, {"n": 3, "q": "ಕಾನಾ ಊರಿನಲ್ಲಿ ಮದುವೆ ಯಾವಾಗ ನಡೆಯಿತು?", "a": "ಮಾರನೆಯ ದಿನ", "r": "2:1"}, {"n": 4, "q": "ಕಾನಾ ಊರು ಯಾವ ನಾಡಿನಲ್ಲಿದೆ?", "a": "ಗಲಿಲೇಯದಲ್ಲಿ", "r": "2:1"}, {"n": 5, "q": "ಯೇಸುವಿನ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಎಲ್ಲಿ ಮತ್ತು ಯಾವ ಸಂದರ್ಭದಲ್ಲಿ ನಡೆಯಿತು?", "a": "ಗಲಿಲೇಯ ನಾಡಿನ ಕಾನಾ ಊರಿನಲ್ಲಿ, ಒಂದು ಮದುವೆಯಲ್ಲಿ", "r": "2:1; 2:11"}, {"n": 6, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆ ಯಾವ ನಾಡಿನಲ್ಲಿ ನಡೆಯಿತು ಮತ್ತು ಅದಕ್ಕೆ ಯಾರು ಯಾರು ಹೋಗಿದ್ದರು?", "a": "ಗಲಿಲೇಯದಲ್ಲಿ; ಯೇಸುವಿನ ತಾಯಿ, ಯೇಸು ಮತ್ತು ಅವರ ಶಿಷ್ಯರು", "r": "2:1–2"}, {"n": 7, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾನಾ ಎಂಬ ಊರಿನಲ್ಲಿ ಒಂದು ಮದುವೆ ನಡೆಯಿತು.”", "a": "ಗಲಿಲೇಯದ", "r": "2:1"}, {"n": 8, "q": "“ಮಾರನೆಯ ದಿನ ಗಲಿಲೇಯದ ಕಾನಾ ಎಂಬ ಊರಿನಲ್ಲಿ ಒಂದು ಮದುವೆ ನಡೆಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "2:1"}, {"n": 9, "q": "ಯೊವಾನ್ನ 2:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮಾರನೆಯ ದಿನ ಗಲಿಲೇಯದ ಕಾನಾ ಎಂಬ ಊರಿನಲ್ಲಿ ಒಂದು ಮದುವೆ ನಡೆಯಿತು.", "r": "2:1"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ ಗಲಿಲೇಯದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಊರಿನಲ್ಲಿ ಒಂದು ಮದುವೆ ನಡೆಯಿತು.”", "a": "ಕಾನಾ", "r": "2:1"}, {"n": 11, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮಾರನೆಯ ದಿನ ಗಲಿಲೇಯದ ಕಾನಾ …”", "a": "“… ಎಂಬ ಊರಿನಲ್ಲಿ ಒಂದು ಮದುವೆ ನಡೆಯಿತು.”", "r": "2:1"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾರನೆಯ ದಿನ ಗಲಿಲೇಯದ ಕಾನಾ ಎಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಂದು ಮದುವೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಊರಿನಲ್ಲಿ; ನಡೆಯಿತು", "r": "2:1"}, {"n": 13, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಬಂದಿದ್ದವರು ಯಾರು?", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ", "r": "2:2"}, {"n": 14, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಯಾರಿಗೆ ಆಮಂತ್ರಣವಿತ್ತು?", "a": "ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ", "r": "2:2"}, {"n": 15, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಗೆ ಮೊದಲೇ ಬಂದಿದ್ದವರೆಂದು ಹೇಳಲಾದವರು ಯಾರು?", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ", "r": "2:2"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾಯಿ ಅಲ್ಲಿಗೆ ಬಂದಿದ್ದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "2:2"}, {"n": 17, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.”", "a": "ಯೇಸುವಿಗೂ", "r": "2:2"}, {"n": 18, "q": "ಯೊವಾನ್ನ 2:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ ಅಲ್ಲಿಗೆ ಬಂದಿದ್ದರು. ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.", "r": "2:2"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿಯ ತಾಯಿ ಅಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂದಿದ್ದರು", "r": "2:2"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಮಂತ್ರಣವಿತ್ತು", "r": "2:2"}, {"n": 21, "q": "“ಯೇಸುವಿಗೂ ಅವರ ಶಿಷ್ಯರಿಗೂ ಆ ಮದುವೆಗೆ ಆಮಂತ್ರಣವಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "2:2"}, {"n": 22, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಯಾವುದು ಸಾಲದೆ ಹೋಯಿತು?", "a": "ದ್ರಾಕ್ಷಾರಸ", "r": "2:3"}, {"n": 23, "q": "ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋದಾಗ ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ”", "r": "2:3"}, {"n": 24, "q": "“ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ", "r": "2:3"}, {"n": 25, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯ ಘಟನೆಯಲ್ಲಿ ಬರುವ ವ್ಯಕ್ತಿಗಳು/ಗುಂಪುಗಳು ಯಾರು?", "a": "ಯೇಸು, ಯೇಸುವಿನ ತಾಯಿ, ಶಿಷ್ಯರು, ಸೇವಕರು, ಔತಣದ ಮೇಲ್ವಿಚಾರಕ, ಮದುಮಗ", "r": "2:3–10"}, {"n": 26, "q": "ಯೇಸುವಿನ ತಾಯಿ ಯೇಸುವಿಗೆ ದ್ರಾಕ್ಷಾರಸದ ಬಗ್ಗೆ ಯಾವಾಗ ಹೇಳಿದರು?", "a": "ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋದಾಗ", "r": "2:3"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು.”", "a": "ಸಂದರ್ಭದಲ್ಲಿ", "r": "2:3"}, {"n": 28, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೇಸುವಿನ ತಾಯಿ, ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದರು.”", "a": "ಯೇಸುವಿಗೆ", "r": "2:3"}, {"n": 29, "q": "“ಆ ಸಂದರ್ಭದಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "2:3"}, {"n": 30, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಯೇಸುವಿನ ತಾಯಿ, ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ …”", "a": "“… ಮುಗಿದು ಹೋಗಿದೆ, ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.”", "r": "2:3"}, {"n": 31, "q": "ಯೊವಾನ್ನ 2:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಸಂದರ್ಭದಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಸಾಲದೆ ಹೋಯಿತು. ಆಗ ಯೇಸುವಿನ ತಾಯಿ, “ಅವರಲ್ಲಿ ದ್ರಾಕ್ಷಾರಸ ಮುಗಿದು ಹೋಗಿದೆ,” ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.", "r": "2:3"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಸಂದರ್ಭದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಾಲದೆ ಹೋಯಿತು.”", "a": "ದ್ರಾಕ್ಷಾರಸ", "r": "2:3"}, {"n": 33, "q": "ತಾಯಿಯ ಮಾತಿಗೆ ಯೇಸು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟರು?", "a": "“ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ? ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ”", "r": "2:4"}, {"n": 34, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಯೇಸು ತಮ್ಮ ಯಾವುದು ಇನ್ನೂ ಬಂದಿಲ್ಲ ಎಂದರು?", "a": "ತಮ್ಮ ಗಳಿಗೆ", "r": "2:4"}, {"n": 35, "q": "ಯೇಸು ತಮ್ಮ ತಾಯಿಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಅಮ್ಮಾ”", "r": "2:4"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ?”", "a": "ಯೇಸು", "r": "2:4"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಬಂದಿಲ್ಲ", "r": "2:4"}, {"n": 38, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 39, "q": "ಯೊವಾನ್ನ 2:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ ಹೇಳುತ್ತೀ? ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.", "r": "2:4"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಅಮ್ಮಾ, ಇದನ್ನು ನನಗೇಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುತ್ತೀ", "r": "2:4"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನೂ ಬಂದಿಲ್ಲ, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಗಳಿಗೆ", "r": "2:4"}, {"n": 42, "q": "“ನನ್ನ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "2:4"}, {"n": 43, "q": "ಯೇಸುವಿನ ತಾಯಿ ಸೇವಕರಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದರು?", "a": "“ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ”", "r": "2:5"}, {"n": 44, "q": "“ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ ಸೇವಕರಿಗೆ", "r": "2:5"}, {"n": 45, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿ ಸೇವಕರಿಗೆ ಆಜ್ಞೆ ಕೊಟ್ಟ ಇಬ್ಬರು ಯಾರು?", "a": "ಯೇಸುವಿನ ತಾಯಿ (2:5) ಮತ್ತು ಯೇಸು (2:7–8)", "r": "2:5; 2:7; 2:8"}, {"n": 46, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ ಸೇವಕರಿಗೆ, ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಸಿದರು", "r": "2:5"}, {"n": 47, "q": "“ತಾಯಿ ಸೇವಕರಿಗೆ, ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ, ಎಂದು ತಿಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "2:5"}, {"n": 48, "q": "ಯೊವಾನ್ನ 2:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತಾಯಿ ಸೇವಕರಿಗೆ, “ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ,” ಎಂದು ತಿಳಿಸಿದರು.", "r": "2:5"}, {"n": 49, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆತ ಹೇಳಿದಂತೆ ಮಾಡಿ, ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಸೇವಕರಿಗೆ", "r": "2:5"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿ ಸೇವಕರಿಗೆ, ಆತ ಹೇಳಿದಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಮಾಡಿ", "r": "2:5"}, {"n": 51, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆ ಮನೆಯಲ್ಲಿ ಎಷ್ಟು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಇಟ್ಟಿದ್ದರು?", "a": "ಆರು", "r": "2:6"}, {"n": 52, "q": "ಮದುವೆ ಮನೆಯಲ್ಲಿ ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಏಕೆ ಇಟ್ಟಿದ್ದರು?", "a": "ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ", "r": "2:6"}, {"n": 53, "q": "ಒಂದೊಂದು ಕಲ್ಲುಬಾನೆ ಎಷ್ಟು ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿತ್ತು?", "a": "ಎರಡು ಮೂರು ಕೊಡ ನೀರು", "r": "2:6"}, {"n": 54, "q": "ಮದುವೆ ಮನೆಯಲ್ಲಿದ್ದ ಬಾನೆಗಳು ಯಾವುದರಿಂದ ಮಾಡಿದವು?", "a": "ಕಲ್ಲಿನಿಂದ (ಕಲ್ಲುಬಾನೆಗಳು)", "r": "2:6"}, {"n": 55, "q": "ಕಲ್ಲುಬಾನೆಗಳು ಯಾರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಗಾಗಿ ಇಟ್ಟಿದ್ದವು?", "a": "ಯೆಹೂದ್ಯರ", "r": "2:6"}, {"n": 56, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.”", "a": "ಕಲ್ಲುಬಾನೆಗಳನ್ನು", "r": "2:6"}, {"n": 57, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದೊಡ್ಡದಾಗಿದ್ದವು", "r": "2:6"}, {"n": 58, "q": "“ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "2:6"}, {"n": 59, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು …”", "a": "“… ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿದ್ದವು.”", "r": "2:6"}, {"n": 60, "q": "ಯೊವಾನ್ನ 2:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ ಪದ್ಧತಿಯಂತೆ ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು. ಅವು ಒಂದೊಂದೂ ಎರಡು ಮೂರು ಕೊಡ ನೀರು ಹಿಡಿಯುವಷ್ಟು ದೊಡ್ಡದಾಗಿದ್ದವು.", "r": "2:6"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಶುದ್ಧಾಚಾರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆರು ಕಲ್ಲುಬಾನೆಗಳನ್ನು ಅಲ್ಲಿ ಇಟ್ಟಿದ್ದರು.”", "a": "ಪದ್ಧತಿಯಂತೆ", "r": "2:6"}, {"n": 62, "q": "ಯೇಸು ಸೇವಕರಿಗೆ ಮೊದಲು ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ”", "r": "2:7"}, {"n": 63, "q": "ಸೇವಕರು ಬಾನೆಗಳಲ್ಲಿ ಎಷ್ಟರವರೆಗೆ ನೀರು ತುಂಬಿದರು?", "a": "ಕಂಠದವರೆಗೆ", "r": "2:7"}, {"n": 64, "q": "“ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸೇವಕರಿಗೆ", "r": "2:7"}, {"n": 65, "q": "ಯೇಸು ಸೇವಕರಿಗೆ ಬಾನೆಗಳಲ್ಲಿ ಏನನ್ನು ತುಂಬಲು ಹೇಳಿದರು?", "a": "ನೀರು", "r": "2:7"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇವಕರಿಗೆ, ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:7"}, {"n": 67, "q": "“ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "2:7"}, {"n": 68, "q": "ಯೊವಾನ್ನ 2:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, “ಆ ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿರಿ,” ಎಂದು ಹೇಳಿದರು. ಅವರು ಕಂಠದವರೆಗೆ ತುಂಬಿದರು.", "r": "2:7"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀರು ತುಂಬಿರಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಬಾನೆಗಳಲ್ಲಿ", "r": "2:7"}, {"n": 70, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ಆ ಬಾನೆಗಳಲ್ಲಿ …”", "a": "“… ನೀರು ತುಂಬಿರಿ, ಎಂದು ಹೇಳಿದರು.”", "r": "2:7"}, {"n": 71, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಸೇವಕರಿಗೆ, ಆ ಬಾನೆಗಳಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತುಂಬಿರಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ನೀರು", "r": "2:7"}, {"n": 72, "q": "ಬಾನೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿದ ನಂತರ ಯೇಸು ಸೇವಕರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ”", "r": "2:8"}, {"n": 73, "q": "ಸೇವಕರು ತೋಡಿಕೊಂಡು ಹೋದುದನ್ನು ಯಾರಿಗೆ ಕೊಡಬೇಕಿತ್ತು?", "a": "ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:8"}, {"n": 74, "q": "ಯೇಸು ಹೇಳಿದಂತೆ ಸೇವಕರು ಏನು ಮಾಡಿದರು?", "a": "ಹಾಗೆಯೇ ಮಾಡಿದರು (ತೋಡಿಕೊಂಡು ಹೋಗಿ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಟ್ಟರು)", "r": "2:8"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "a": "ಯೇಸು", "r": "2:8"}, {"n": 76, "q": "“ಯೇಸು, ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "2:8"}, {"n": 77, "q": "ಯೊವಾನ್ನ 2:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, “ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ,” ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.", "r": "2:8"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "a": "ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:8"}, {"n": 79, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸು, ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ …”", "a": "“… ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ ಮಾಡಿದರು.”", "r": "2:8"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು ಹಾಗೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋಡಿಕೊಂಡು; ಮಾಡಿದರು", "r": "2:8"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ಈಗ ತೋಡಿಕೊಂಡು ಹೋಗಿ ಔತಣದ ಮೇಲ್ವಿಚಾರಕನಿಗೆ ಕೊಡಿ, ಎಂದು ಹೇಳಲು ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದರು.”", "a": "ಹಾಗೆಯೇ", "r": "2:8"}, {"n": 82, "q": "ಮೇಲ್ವಿಚಾರಕನು ಯಾವುದರ ರುಚಿ ನೋಡಿದನು?", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ", "r": "2:9"}, {"n": 83, "q": "ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಯಾರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು?", "a": "ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ", "r": "2:9"}, {"n": 84, "q": "ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಯಾರಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ?", "a": "ಮೇಲ್ವಿಚಾರಕನಿಗೆ", "r": "2:9"}, {"n": 85, "q": "ಮೇಲ್ವಿಚಾರಕನು ರುಚಿ ನೋಡಿದ ನೀರು ಏನಾಗಿ ಮಾರ್ಪಟ್ಟಿತ್ತು?", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ", "r": "2:9"}, {"n": 86, "q": "ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನನ್ನು ಏಕೆ ಕರೆದನು?", "a": "ಉತ್ತಮ ದ್ರಾಕ್ಷಾರಸ ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ ತಿಳಿದಿರದ ಕಾರಣ (ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ ಎಂದು ಹೇಳಲು)", "r": "2:9"}, {"n": 87, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲ್ವಿಚಾರಕನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು.”", "a": "ದ್ರಾಕ್ಷಾರಸವಾಗಿ", "r": "2:9"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದು ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿದಿರಲಿಲ್ಲ", "r": "2:9"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿದಿತ್ತು", "r": "2:9"}, {"n": 90, "q": "“ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 91, "q": "“ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "2:9"}, {"n": 92, "q": "ಯೊವಾನ್ನ 2:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸವಾಗಿ ಮಾರ್ಪಟ್ಟಿದ್ದ ನೀರಿನ ರುಚಿ ನೋಡಿದನು. ಅದು ಎಲ್ಲಿಂದ ಬಂದಿತೆಂಬುದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ. ನೀರನ್ನು ತೋಡಿಕೊಂಡು ಬಂದ ಸೇವಕರಿಗೆ ಮಾತ್ರ ತಿಳಿದಿತ್ತು.", "r": "2:9"}, {"n": 93, "q": "ಮೇಲ್ವಿಚಾರಕನು ದ್ರಾಕ್ಷಾರಸದ ರುಚಿ ನೋಡಿ ಯಾರನ್ನು ಕರೆದನು?", "a": "ಮದುಮಗನನ್ನು", "r": "2:10"}, {"n": 94, "q": "ಮೇಲ್ವಿಚಾರಕನ ಪ್ರಕಾರ ಜನರೆಲ್ಲರೂ ಮೊದಲು ಯಾವ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಹಂಚುತ್ತಾರೆ?", "a": "ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 95, "q": "ಜನರು ಸಾಧಾರಣ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಯಾವಾಗ ಕೊಡುತ್ತಾರೆ ಎಂದು ಮೇಲ್ವಿಚಾರಕನು ಹೇಳಿದನು?", "a": "ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ", "r": "2:10"}, {"n": 96, "q": "ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನಿಗೆ ಹೇಳಿದ ಕೊನೆಯ ಮಾತು ಯಾವುದು?", "a": "“ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!”", "r": "2:10"}, {"n": 97, "q": "“ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಔತಣದ ಮೇಲ್ವಿಚಾರಕನು ಮದುಮಗನಿಗೆ", "r": "2:10"}, {"n": 98, "q": "ಮೇಲ್ವಿಚಾರಕನ ಪ್ರಕಾರ ಸಾಮಾನ್ಯ ಪದ್ಧತಿಗೂ ಈ ಮದುವೆಯಲ್ಲಿ ನಡೆದುದಕ್ಕೂ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಸಾಮಾನ್ಯವಾಗಿ ಉತ್ತಮವಾದುದನ್ನು ಮೊದಲು, ಸಾಧಾರಣವಾದುದನ್ನು ಆಮೇಲೆ ಕೊಡುತ್ತಾರೆ; ಇಲ್ಲಿ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಡಲಾಗಿತ್ತು", "r": "2:10"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೊದಲು ಹಂಚುತ್ತಾರೆ;”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ ಸಾಧಾರಣ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡುತ್ತಾರೆ.”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನು", "r": "2:10"}, {"n": 101, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!”", "a": "ಉತ್ತಮವಾದುದನ್ನು", "r": "2:10"}, {"n": 102, "q": "“ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಮೊದಲು ಹಂಚುತ್ತಾರೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "2:10"}, {"n": 103, "q": "ಯೊವಾನ್ನ 2:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದುದರಿಂದ ಅವನು ಮದುಮಗನನ್ನು ಕರೆದು, “ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಮೊದಲು ಹಂಚುತ್ತಾರೆ; ಅತಿಥಿಗಳು ಯಥೇಚ್ಛವಾಗಿ ಕುಡಿದಾದ ಮೇಲೆ ಸಾಧಾರಣ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಕೊಡುತ್ತಾರೆ. ನೀನಾದರೋ ಉತ್ತಮವಾದುದನ್ನು ಈವರೆಗೂ ಇಟ್ಟಿದ್ದೀಯಲ್ಲಾ!” ಎಂದು ಹೇಳಿದನು.", "r": "2:10"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದು, ಜನರೆಲ್ಲರೂ ಉತ್ತಮವಾದ ದ್ರಾಕ್ಷಾರಸವನ್ನು ಮೊದಲು ಹಂಚುತ್ತಾರೆ;”", "a": "ಮದುಮಗನನ್ನು", "r": "2:10"}, {"n": 105, "q": "ಕಾನಾ ಊರಿನಲ್ಲಿ ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾರ್ಪಡಿಸಿದ್ದು ಯೇಸುವಿನ ಎಷ್ಟನೆಯ ಸೂಚಕಕಾರ್ಯ?", "a": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ", "r": "2:11"}, {"n": 106, "q": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯದ ಮೂಲಕ ಯೇಸು ಏನನ್ನು ತೋರ್ಪಡಿಸಿದರು?", "a": "ತಮ್ಮ ಮಹಿಮೆಯನ್ನು", "r": "2:11"}, {"n": 107, "q": "ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯದ ನಂತರ ಯೇಸುವಿನ ಶಿಷ್ಯರಿಗೆ ಏನಾಯಿತು?", "a": "ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು", "r": "2:11"}, {"n": 108, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಸೂಚಕಕಾರ್ಯಗಳ ಫಲವಾಗಿ ವಿಶ್ವಾಸಿಸಿದವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಶಿಷ್ಯರು (2:11) ಮತ್ತು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಅನೇಕರು (2:23)", "r": "2:11; 2:23"}, {"n": 109, "q": "ಯೇಸು ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯವನ್ನು ಎಲ್ಲಿ ಮಾಡಿದರು?", "a": "ಗಲಿಲೇಯ ನಾಡಿನ ಕಾನಾ ಊರಿನಲ್ಲಿ", "r": "2:11"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.”", "a": "ಯೇಸು", "r": "2:11"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾಡಿನ ಕಾನಾ ಊರಿನಲ್ಲಿ ಮಾಡಿ ತಮ್ಮ ಮಹಿಮೆಯನ್ನು ತೋರ್ಪಡಿಸಿದರು.”", "a": "ಗಲಿಲೇಯ", "r": "2:11"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು.”", "a": "ಶಿಷ್ಯರಿಗೂ", "r": "2:11"}, {"n": 113, "q": "“ಯೇಸು ಮಾಡಿದ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದನ್ನು ಗಲಿಲೇಯ ನಾಡಿನ ಕಾನಾ …”", "a": "“… ಊರಿನಲ್ಲಿ ಮಾಡಿ ತಮ್ಮ ಮಹಿಮೆಯನ್ನು ತೋರ್ಪಡಿಸಿದರು.”", "r": "2:11"}, {"n": 115, "q": "“ಅವರ ಶಿಷ್ಯರಿಗೂ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "2:11"}, {"n": 116, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯ ನಂತರ ಯೇಸು ಮತ್ತು ಅವರೊಡನೆ ಇದ್ದವರು ಎಲ್ಲಿಗೆ ಹೋದರು?", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "2:12"}, {"n": 117, "q": "ಯೇಸುವಿನೊಡನೆ ಕಫೆರ್ನವುಮಿಗೆ ಹೋದವರು ಯಾರು?", "a": "ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು", "r": "2:12"}, {"n": 118, "q": "ಯೇಸು ಮತ್ತು ಅವರೊಡನೆ ಇದ್ದವರು ಕಫೆರ್ನವುಮಿನಲ್ಲಿ ಎಷ್ಟು ದಿನ ತಂಗಿದ್ದರು?", "a": "ಕೆಲವು ದಿನ", "r": "2:12"}, {"n": 119, "q": "ಯೇಸು ಮತ್ತು ಅವರ ಕುಟುಂಬದವರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋದದ್ದು ಯಾವಾಗ?", "a": "ಕಾನಾ ಊರಿನ ಮೊದಲನೆಯ ಸೂಚಕಕಾರ್ಯ ಆದ ಮೇಲೆ", "r": "2:12"}, {"n": 120, "q": "ಯೇಸುವಿನೊಡನೆ ಕಫೆರ್ನವುಮಿಗೆ ಹೋದವರಲ್ಲಿ ಅವರ ಕುಟುಂಬದವರು ಯಾರು?", "a": "ಅವರ ತಾಯಿ ಮತ್ತು ಸಹೋದರರು", "r": "2:12"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "a": "ಯೇಸು", "r": "2:12"}, {"n": 122, "q": "“ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "2:12"}, {"n": 123, "q": "ಯೊವಾನ್ನ 2:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.", "r": "2:12"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "2:12"}, {"n": 125, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, ಸಹೋದರರು ಮತ್ತು …”", "a": "“… ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ ತಂಗಿದ್ದರು.”", "r": "2:12"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೇಸು, ಅವರ ತಾಯಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಶಿಷ್ಯರು ಕಫೆರ್ನವುಮಿಗೆ ಹೋಗಿ ಅಲ್ಲಿ ಕೆಲವು ದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಹೋದರರು; ತಂಗಿದ್ದರು", "r": "2:12"}, {"n": 127, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 2:13ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವ್ಯಾಪಾರಿಗಳ ಉಚ್ಚಾಟನೆ", "r": "2:13"}, {"n": 128, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿಗೆ ಏಕೆ ತೆರಳಿದರು?", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ", "r": "2:13"}, {"n": 129, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಎರಡನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಯಾವುದು?", "a": "ಪಾಸ್ಕ ಹಬ್ಬ", "r": "2:13; 2:23"}, {"n": 130, "q": "ಪಾಸ್ಕ ಹಬ್ಬ ಹತ್ತಿರವಾಗಿದ್ದಾಗ ಯೇಸು ಎಲ್ಲಿಗೆ ತೆರಳಿದರು?", "a": "ಜೆರುಸಲೇಮಿಗೆ", "r": "2:13"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:13"}, {"n": 132, "q": "“ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "2:13"}, {"n": 133, "q": "ಯೊವಾನ್ನ 2:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.", "r": "2:13"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.”", "a": "ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ", "r": "2:13"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿದ್ದುದರಿಂದ ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೆರಳಿದರು", "r": "2:13"}, {"n": 136, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ಮಾರಾಟವಾಗುತ್ತಿದ್ದ ಪ್ರಾಣಿಗಳು ಯಾವುವು?", "a": "ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳು", "r": "2:14"}, {"n": 137, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದವರು ಯಾರು?", "a": "ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು", "r": "2:14"}, {"n": 138, "q": "ವ್ಯಾಪಾರಿಗಳು ಎಲ್ಲಿ ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು?", "a": "ಜೆರುಸಲೇಮಿನ ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "2:14"}, {"n": 139, "q": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ ಹಣದ ವ್ಯವಹಾರ ಮಾಡುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು", "r": "2:14"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "a": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "2:14"}, {"n": 141, "q": "“ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "2:14"}, {"n": 142, "q": "ಯೊವಾನ್ನ 2:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.", "r": "2:14"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "a": "ಪಾರಿವಾಳಗಳನ್ನು", "r": "2:14"}, {"n": 144, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು …”", "a": "“… ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ ಕುಳಿತಿದ್ದರು.”", "r": "2:14"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುಳಿತಿದ್ದರು.”", "a": "ನಾಣ್ಯವಿನಿಮಯ; ವ್ಯಾಪಾರಕ್ಕೆ", "r": "2:14"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿಯ ಮಹಾದೇವಾಲಯದಲ್ಲಿ ದನ, ಕುರಿ ಮತ್ತು ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುವವರು ಮತ್ತು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರು ವ್ಯಾಪಾರಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತಿದ್ದರು", "r": "2:14"}, {"n": 147, "q": "ಯೇಸು ವ್ಯಾಪಾರಿಗಳನ್ನು ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಲು ಏನು ಮಾಡಿದರು?", "a": "ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದರು", "r": "2:15"}, {"n": 148, "q": "ಯೇಸು ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರಿಗೆ ಏನು ಮಾಡಿದರು?", "a": "ಅವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು", "r": "2:15"}, {"n": 149, "q": "ಯೇಸು ದನಕುರಿಗಳನ್ನು ಏನು ಮಾಡಿದರು?", "a": "ಓಡಿಸಿದರು", "r": "2:15"}, {"n": 150, "q": "ಯೇಸು ಹಗ್ಗವನ್ನು ಯಾವುದರಂತೆ ಹೆಣೆದರು?", "a": "ಚಾವಟಿಯಂತೆ", "r": "2:15"}, {"n": 151, "q": "ಯೇಸು ವ್ಯಾಪಾರಿಗಳನ್ನು ಎಲ್ಲಿಂದ ಹೊರಗಟ್ಟಿದರು?", "a": "ದೇವಾಲಯದಿಂದ", "r": "2:15"}, {"n": 152, "q": "ದೇವಾಲಯದಲ್ಲಿ ಯೇಸು ಮಾಡಿದ ನಾಲ್ಕು ಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "1) ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಎಲ್ಲರನ್ನು ಹೊರಗಟ್ಟಿದರು; 2) ದನಕುರಿಗಳನ್ನು ಓಡಿಸಿದರು; 3) ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿದರು; 4) ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು", "r": "2:15"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಕಂಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.”", "a": "ಯೇಸು", "r": "2:15"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.”", "a": "ನಾಣ್ಯವಿನಿಮಯ", "r": "2:15"}, {"n": 155, "q": "“ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "2:15"}, {"n": 156, "q": "ಯೊವಾನ್ನ 2:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ ಅವರನ್ನೆಲ್ಲಾ ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು. ದನಕುರಿಗಳನ್ನು ಓಡಿಸಿದರು. ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ ಮೇಜುಗಳನ್ನು ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.", "r": "2:15"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಕಂಡ ಯೇಸು, ಹಗ್ಗವನ್ನು ಚಾವಟಿಯಂತೆ ಹೆಣೆದು ಅದರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವಾಲಯದಿಂದ ಹೊರಗಟ್ಟಿದರು.”", "a": "ಅವರನ್ನೆಲ್ಲಾ", "r": "2:15"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾಣ್ಯವಿನಿಮಯ ಮಾಡುವವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಡವಿ, ಚಿಲ್ಲರೆ ಹಣವನ್ನು ಚೆಲ್ಲಿದರು.”", "a": "ಮೇಜುಗಳನ್ನು", "r": "2:15"}, {"n": 159, "q": "“ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ", "r": "2:16"}, {"n": 160, "q": "ಯೇಸು ತಮ್ಮ ಪಿತನ ಆಲಯದ ಬಗ್ಗೆ ಏನೆಂದು ಎಚ್ಚರಿಸಿದರು?", "a": "“ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ”", "r": "2:16"}, {"n": 161, "q": "ಯೇಸು ದೇವಾಲಯವನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ನನ್ನ ಪಿತನ ಆಲಯ", "r": "2:16"}, {"n": 162, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ವ್ಯಾಪಾರಿಗಳು ಪಿತನ ಆಲಯವನ್ನು ಏನನ್ನಾಗಿ ಮಾಡಿದ್ದರು?", "a": "ಸಂತೆಯನ್ನಾಗಿ", "r": "2:16"}, {"n": 163, "q": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ ಯೇಸು ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "r": "2:16"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಾರಿವಾಳಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "a": "ಮಾರುತ್ತಿದ್ದವರಿಗೆ", "r": "2:16"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಬೇಡಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಂತೆಯನ್ನಾಗಿ", "r": "2:16"}, {"n": 166, "q": "“ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ, ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "2:16"}, {"n": 167, "q": "ಯೊವಾನ್ನ 2:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಾರಿವಾಳಗಳನ್ನು ಮಾರುತ್ತಿದ್ದವರಿಗೆ, “ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ. ನನ್ನ ಪಿತನ ಆಲಯವನ್ನು ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ,” ಎಂದು ಹೇಳಿದರು.", "r": "2:16"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾರುತ್ತಿದ್ದವರಿಗೆ, ಇವನ್ನು ಇಲ್ಲಿಂದ ತೆಗೆದುಕೊಂಡು ಹೊರಡಿ.”", "a": "ಪಾರಿವಾಳಗಳನ್ನು", "r": "2:16"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪಿತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂತೆಯನ್ನಾಗಿ ಮಾಡಬೇಡಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಆಲಯವನ್ನು", "r": "2:16"}, {"n": 170, "q": "ದೇವಾಲಯದ ಶುದ್ಧೀಕರಣದ ಸಮಯದಲ್ಲಿ ಶಿಷ್ಯರಿಗೆ ನೆನಪಾದ ಪವಿತ್ರಗ್ರಂಥದ ವಾಕ್ಯ ಯಾವುದು?", "a": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ’", "r": "2:17"}, {"n": 171, "q": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ’ ಎಂಬ ವಾಕ್ಯ ಯಾರಿಗೆ ನೆನಪಾಯಿತು?", "a": "ಶಿಷ್ಯರಿಗೆ", "r": "2:17"}, {"n": 172, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ಹೇಗೆ ದಹಿಸುತ್ತದೆ?", "a": "ಬೆಂಕಿಯಂತೆ", "r": "2:17"}, {"n": 173, "q": "ಪವಿತ್ರಗ್ರಂಥದ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಯಾವಾಗ ನೆನಪಾಯಿತು?", "a": "ಯೇಸು ದೇವಾಲಯದಿಂದ ವ್ಯಾಪಾರಿಗಳನ್ನು ಹೊರಗಟ್ಟಿದಾಗ (ಆಗ)", "r": "2:17"}, {"n": 174, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ", "r": "2:17"}, {"n": 175, "q": "“ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "2:17"}, {"n": 176, "q": "ಯೊವಾನ್ನ 2:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ,’ ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.", "r": "2:17"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "a": "ದಹಿಸುತ್ತದೆ", "r": "2:17"}, {"n": 178, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ, …”", "a": "“… ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ ನೆನಪಾಯಿತು.”", "r": "2:17"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಹಿಸುತ್ತದೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ನೆನಪಾಯಿತು.”", "a": "ಬೆಂಕಿಯಂತೆ; ಶಿಷ್ಯರಿಗೆ", "r": "2:17"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಆಲಯದ ಮೇಲಿನ ಅಭಿಮಾನವು ನನ್ನನ್ನು ಬೆಂಕಿಯಂತೆ ದಹಿಸುತ್ತದೆ, ಎಂದು ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೇ ಬರೆದಿರುವ ವಾಕ್ಯವು ಶಿಷ್ಯರಿಗೆ ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆನಪಾಯಿತು", "r": "2:17"}, {"n": 181, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಅವರ ಅಧಿಕಾರದ ಬಗ್ಗೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "r": "2:18"}, {"n": 182, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನಿಂದ ತಮ್ಮ ಅಧಿಕಾರವನ್ನು ರುಜುವಾತುಪಡಿಸಲು ಏನನ್ನು ಕೇಳಿದರು?", "a": "ಒಂದು ಪವಾಡವನ್ನು", "r": "2:18"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "a": "ಪಡಿಸುವುದಕ್ಕೆ", "r": "2:18"}, {"n": 184, "q": "“ಯೆಹೂದ್ಯರು, ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "2:18"}, {"n": 185, "q": "ಯೊವಾನ್ನ 2:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರು, “ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?” ಎಂದು ಯೇಸುವನ್ನು ಪ್ರಶ್ನಿಸಿದರು.", "r": "2:18"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "a": "ಅಧಿಕಾರವಿದೆ", "r": "2:18"}, {"n": 187, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೆಹೂದ್ಯರು, ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು …”", "a": "“… ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "r": "2:18"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇಷ್ಟೆಲ್ಲಾ ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಯೆಹೂದ್ಯರು; ತೋರಿಸಬಲ್ಲೆ", "r": "2:18"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ ಎಂದು ರುಜುವಾತು ಪಡಿಸುವುದಕ್ಕೆ ಯಾವ ಪವಾಡವನ್ನು ಮಾಡಿ ತೋರಿಸಬಲ್ಲೆ?”", "a": "ಇಷ್ಟೆಲ್ಲಾ", "r": "2:18"}, {"n": 190, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟರು?", "a": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು”", "r": "2:19"}, {"n": 191, "q": "ದೇವಾಲಯವನ್ನು ಎಷ್ಟು ದಿನದಲ್ಲಿ ಪುನಃ ಎಬ್ಬಿಸುವೆನೆಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೂರು ದಿನದಲ್ಲಿ", "r": "2:19"}, {"n": 192, "q": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು” — ಇಲ್ಲಿ ‘ದೇವಾಲಯ’ ಏನನ್ನು ಸೂಚಿಸುತ್ತದೆ?", "a": "ಯೇಸುವಿನ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು", "r": "2:19–21"}, {"n": 193, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯ ಕಟ್ಟಲು ಹಿಡಿದ ಸಮಯ ಮತ್ತು ಯೇಸು ಹೇಳಿದ ಸಮಯವನ್ನು ಹೋಲಿಸಿ.", "a": "ಯೆಹೂದ್ಯರು: ನಲವತ್ತಾರು ವರ್ಷಗಳು; ಯೇಸು: ಮೂರು ದಿನ", "r": "2:19; 2:20"}, {"n": 194, "q": "“ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ” ಎಂದು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೆಹೂದ್ಯರಿಗೆ", "r": "2:19"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಯೇಸು", "r": "2:19"}, {"n": 196, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "2:19"}, {"n": 197, "q": "ಯೊವಾನ್ನ 2:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು,” ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.", "r": "2:19"}, {"n": 198, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translate
