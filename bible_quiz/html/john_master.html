Y(-2pt);margin:0 1mm\"><\/span> ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:19"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು …”", "a": "“… ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "r": "2:19"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಈ ದೇವಾಲಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಕೆಡವಿಬಿಡಿ; ಎಬ್ಬಿಸುವೆನು", "r": "2:19"}, {"n": 201, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ಎಷ್ಟು ವರ್ಷಗಳು ಹಿಡಿದಿದ್ದವು?", "a": "ನಲವತ್ತಾರು ವರ್ಷಗಳು", "r": "2:20"}, {"n": 202, "q": "ಯೇಸುವಿನ ಉತ್ತರ ಕೇಳಿ ಯೆಹೂದ್ಯರು ಹೇಗಾದರು?", "a": "ಚಕಿತರಾದರು", "r": "2:20"}, {"n": 203, "q": "ದೇವಾಲಯವನ್ನು ಮೂರು ದಿನಗಳಲ್ಲಿ ಎಬ್ಬಿಸುವ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?”", "r": "2:20"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:20"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ", "r": "2:20"}, {"n": 206, "q": "“ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 207, "q": "ಯೊವಾನ್ನ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, “ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ. ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?” ಎಂದು ಕೇಳಿದರು.", "r": "2:20"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ಯೆಹೂದ್ಯರು", "r": "2:20"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಮೂರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?”", "a": "ದಿನಗಳಲ್ಲೇ", "r": "2:20"}, {"n": 210, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ ದೇವಾಲಯವನ್ನು …”", "a": "“… ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "r": "2:20"}, {"n": 211, "q": "ಯೇಸು “ಈ ದೇವಾಲಯ” ಎಂದು ಹೇಳಿದ್ದು ಯಾವುದನ್ನು ಕುರಿತು?", "a": "ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು", "r": "2:21"}, {"n": 212, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 2:21ರಲ್ಲಿ ‘ದೇಗುಲ’ ಎಂದು ಯಾವುದನ್ನು ಕರೆಯಲಾಗಿದೆ?", "a": "ಯೇಸುವಿನ ದೇಹವನ್ನು", "r": "2:21"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.”", "a": "ಯೇಸು", "r": "2:21"}, {"n": 214, "q": "“ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 215, "q": "ಯೊವಾನ್ನ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.", "r": "2:21"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು.”", "a": "ದೇಗುಲವನ್ನು", "r": "2:21"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುರಿತು", "r": "2:21"}, {"n": 218, "q": "ಶಿಷ್ಯರು ಯೇಸುವಿನ ದೇವಾಲಯದ ಮಾತುಗಳನ್ನು ಯಾವಾಗ ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ", "r": "2:22"}, {"n": 219, "q": "ಯೇಸುವಿನ ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರಿಗೆ ಯಾವ ಎರಡರಲ್ಲಿ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು?", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ", "r": "2:22"}, {"n": 220, "q": "ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರು ಯೇಸುವಿನ ಯಾವ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ದೇವಾಲಯವನ್ನು ಕೆಡವಿದರೆ ಮೂರು ದಿನದಲ್ಲಿ ಪುನಃ ಎಬ್ಬಿಸುವೆನು ಎಂಬ ಮಾತುಗಳನ್ನು", "r": "2:22"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ಮರಿಸಿಕೊಂಡರು", "r": "2:22"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನ", "r": "2:22"}, {"n": 223, "q": "“ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 224, "q": "ಯೊವಾನ್ನ 2:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು. ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.", "r": "2:22"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "a": "ಪುನರುತ್ಥಾನ", "r": "2:22"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ", "r": "2:22"}, {"n": 227, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ …”", "a": "“… ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "r": "2:22"}, {"n": 228, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 2:23ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಅಂತರಂಗದ ಅರಿಕೆ", "r": "2:23"}, {"n": 229, "q": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಅನೇಕರು ಯೇಸುವನ್ನು ನಂಬಿದ್ದು ಏಕೆ?", "a": "ಯೇಸು ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ", "r": "2:23"}, {"n": 230, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದ್ದು ಯಾವ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ?", "a": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ", "r": "2:23"}, {"n": 231, "q": "ಯೇಸುವಿನ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ನಂಬಿದವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಅನೇಕರು", "r": "2:23"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:23"}, {"n": 233, "q": "“ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "2:23"}, {"n": 234, "q": "ಯೊವಾನ್ನ 2:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.", "r": "2:23"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ", "r": "2:23"}, {"n": 236, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ …”", "a": "“… ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "r": "2:23"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ; ಕಾರ್ಯಗಳನ್ನು", "r": "2:23"}, {"n": 238, "q": "ಯೇಸು ಜನರ ನಂಬಿಕೆಗೆ ಏಕೆ ಮಾರುಹೋಗಲಿಲ್ಲ?", "a": "ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ", "r": "2:24"},     const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
