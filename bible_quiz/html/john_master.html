Y(-2pt);margin:0 1mm\"><\/span> ಕೆಡವಿಬಿಡಿ, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:19"}, {"n": 199, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಈ ದೇವಾಲಯವನ್ನು ಕೆಡವಿಬಿಡಿ, ಮೂರು …”", "a": "“… ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ ಎಬ್ಬಿಸುವೆನು, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "r": "2:19"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, ಈ ದೇವಾಲಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಮೂರು ದಿನದಲ್ಲಿ ಅದನ್ನು ಪುನಃ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಕೆಡವಿಬಿಡಿ; ಎಬ್ಬಿಸುವೆನು", "r": "2:19"}, {"n": 201, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ಎಷ್ಟು ವರ್ಷಗಳು ಹಿಡಿದಿದ್ದವು?", "a": "ನಲವತ್ತಾರು ವರ್ಷಗಳು", "r": "2:20"}, {"n": 202, "q": "ಯೇಸುವಿನ ಉತ್ತರ ಕೇಳಿ ಯೆಹೂದ್ಯರು ಹೇಗಾದರು?", "a": "ಚಕಿತರಾದರು", "r": "2:20"}, {"n": 203, "q": "ದೇವಾಲಯವನ್ನು ಮೂರು ದಿನಗಳಲ್ಲಿ ಎಬ್ಬಿಸುವ ಬಗ್ಗೆ ಯೆಹೂದ್ಯರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?”", "r": "2:20"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ದೇವಾಲಯವನ್ನು", "r": "2:20"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ", "r": "2:20"}, {"n": 206, "q": "“ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "2:20"}, {"n": 207, "q": "ಯೊವಾನ್ನ 2:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, “ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ. ನೀನು ಮೂರು ದಿನಗಳಲ್ಲೇ ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?” ಎಂದು ಕೇಳಿದರು.", "r": "2:20"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಚಕಿತರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "a": "ಯೆಹೂದ್ಯರು", "r": "2:20"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಮೂರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದನ್ನು ಎಬ್ಬಿಸಬಲ್ಲೆಯಾ?”", "a": "ದಿನಗಳಲ್ಲೇ", "r": "2:20"}, {"n": 210, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಚಕಿತರಾದ ಯೆಹೂದ್ಯರು, ಈ ದೇವಾಲಯವನ್ನು …”", "a": "“… ಕಟ್ಟಲು ನಲವತ್ತಾರು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ.”", "r": "2:20"}, {"n": 211, "q": "ಯೇಸು “ಈ ದೇವಾಲಯ” ಎಂದು ಹೇಳಿದ್ದು ಯಾವುದನ್ನು ಕುರಿತು?", "a": "ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು", "r": "2:21"}, {"n": 212, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 2:21ರಲ್ಲಿ ‘ದೇಗುಲ’ ಎಂದು ಯಾವುದನ್ನು ಕರೆಯಲಾಗಿದೆ?", "a": "ಯೇಸುವಿನ ದೇಹವನ್ನು", "r": "2:21"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.”", "a": "ಯೇಸು", "r": "2:21"}, {"n": 214, "q": "“ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "2:21"}, {"n": 215, "q": "ಯೊವಾನ್ನ 2:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು ಕುರಿತು.", "r": "2:21"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು.”", "a": "ದೇಗುಲವನ್ನು", "r": "2:21"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೇಳಿದ್ದು ತಮ್ಮ ದೇಹವೆಂಬ ದೇಗುಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುರಿತು", "r": "2:21"}, {"n": 218, "q": "ಶಿಷ್ಯರು ಯೇಸುವಿನ ದೇವಾಲಯದ ಮಾತುಗಳನ್ನು ಯಾವಾಗ ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ", "r": "2:22"}, {"n": 219, "q": "ಯೇಸುವಿನ ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರಿಗೆ ಯಾವ ಎರಡರಲ್ಲಿ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು?", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ", "r": "2:22"}, {"n": 220, "q": "ಪುನರುತ್ಥಾನದ ನಂತರ ಶಿಷ್ಯರು ಯೇಸುವಿನ ಯಾವ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು?", "a": "ದೇವಾಲಯವನ್ನು ಕೆಡವಿದರೆ ಮೂರು ದಿನದಲ್ಲಿ ಪುನಃ ಎಬ್ಬಿಸುವೆನು ಎಂಬ ಮಾತುಗಳನ್ನು", "r": "2:22"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸ್ಮರಿಸಿಕೊಂಡರು", "r": "2:22"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನ", "r": "2:22"}, {"n": 223, "q": "“ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "2:22"}, {"n": 224, "q": "ಯೊವಾನ್ನ 2:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು. ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.", "r": "2:22"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಸತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊಂದಿದ ಬಳಿಕ ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "a": "ಪುನರುತ್ಥಾನ", "r": "2:22"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವಿನ ಮಾತಿನಲ್ಲೂ ಅವರಿಗೆ ಆಗ ವಿಶ್ವಾಸ ಹುಟ್ಟಿತು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲೂ", "r": "2:22"}, {"n": 227, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅವರು ಸತ್ತು ಪುನರುತ್ಥಾನ ಹೊಂದಿದ ಬಳಿಕ …”", "a": "“… ಶಿಷ್ಯರು ಅವರ ಈ ಮಾತುಗಳನ್ನು ಸ್ಮರಿಸಿಕೊಂಡರು.”", "r": "2:22"}, {"n": 228, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 2:23ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಅಂತರಂಗದ ಅರಿಕೆ", "r": "2:23"}, {"n": 229, "q": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಅನೇಕರು ಯೇಸುವನ್ನು ನಂಬಿದ್ದು ಏಕೆ?", "a": "ಯೇಸು ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ", "r": "2:23"}, {"n": 230, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿನಲ್ಲಿ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದ್ದು ಯಾವ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ?", "a": "ಪಾಸ್ಕಹಬ್ಬದ ಸಮಯದಲ್ಲಿ", "r": "2:23"}, {"n": 231, "q": "ಯೇಸುವಿನ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿ ನಂಬಿದವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಅನೇಕರು", "r": "2:23"}, {"n": 232, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "2:23"}, {"n": 233, "q": "“ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "2:23"}, {"n": 234, "q": "ಯೊವಾನ್ನ 2:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.", "r": "2:23"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಸೂಚಕ ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ", "r": "2:23"}, {"n": 236, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ …”", "a": "“… ಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "r": "2:23"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜೆರುಸಲೇಮಿನಲ್ಲಿದ್ದಾಗ ಮಾಡಿದ ಸೂಚಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ ಅನೇಕರು ಅವರನ್ನು ನಂಬಿದರು.”", "a": "ಪಾಸ್ಕಹಬ್ಬಕ್ಕಾಗಿ; ಕಾರ್ಯಗಳನ್ನು", "r": "2:23"}, {"n": 238, "q": "ಯೇಸು ಜನರ ನಂಬಿಕೆಗೆ ಏಕೆ ಮಾರುಹೋಗಲಿಲ್ಲ?", "a": "ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ", "r": "2:24"}, {"n": 239, "q": "ಯೇಸು ಜನರ ಯಾವುದಕ್ಕೆ ಮಾರುಹೋಗಲಿಲ್ಲ?", "a": "ಅವರ ನಂಬಿಕೆಗೆ", "r": "2:24"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "2:24"}, {"n": 241, "q": "“ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "2:24"}, {"n": 242, "q": "ಯೊವಾನ್ನ 2:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.", "r": "2:24"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಬಲ್ಲವರಾದ್ದರಿಂದ", "r": "2:24"}, {"n": 244, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು ಚೆನ್ನಾಗಿ …”", "a": "“… ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "r": "2:24"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಲ್ಲರನ್ನು; ಮಾರುಹೋಗಲಿಲ್ಲ", "r": "2:24"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯೇಸು ಎಲ್ಲರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲ್ಲವರಾದ್ದರಿಂದ ಅವರ ಈ ನಂಬಿಕೆಗೆ ಮಾರುಹೋಗಲಿಲ್ಲ.”", "a": "ಚೆನ್ನಾಗಿ", "r": "2:24"}, {"n": 247, "q": "ಯೇಸುವಿಗೆ ಯಾವುದು ಬಹಿರಂಗವಾಗಿತ್ತು?", "a": "ಮಾನವನ ಅಂತರಂಗ", "r": "2:25"}, {"n": 248, "q": "ಜನರನ್ನು ಕುರಿತು ಯೇಸುವಿಗೆ ಯಾವುದರ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ?", "a": "ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ", "r": "2:25"}, {"n": 249, "q": "ಮಾನವನ ಯಾವ ಭಾಗ ಯೇಸುವಿಗೆ ಬಹಿರಂಗವಾಗಿತ್ತು?", "a": "ಅಂತರಂಗ", "r": "2:25"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಮೇಯವಿರಲಿಲ್ಲ", "r": "2:25"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವನ ಅಂತರಂಗ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಹಿರಂಗವಾಗಿತ್ತು", "r": "2:25"}, {"n": 252, "q": "“ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 2ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "2:25"}, {"n": 253, "q": "ಯೊವಾನ್ನ 2:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ. ಮಾನವನ ಅಂತರಂಗ ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿತ್ತು.", "r": "2:25"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು ಯಾರೂ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.”", "a": "ತಿಳಿಸಬೇಕಾದ", "r": "2:25"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ಬಹಿರಂಗವಾಗಿತ್ತು.”", "a": "ಅಂತರಂಗ", "r": "2:25"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರನ್ನು ಕುರಿತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ತಿಳಿಸಬೇಕಾದ ಪ್ರಮೇಯವಿರಲಿಲ್ಲ.”", "a": "ಯಾರೂ", "r": "2:25"}]}, {"chapter": 3, "label": "ಅಧ್ಯಾಯ 3", "verses": 36, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನವಜನ್ಮದ ಸಮಸ್ಯೆ", "r": "3:1"}, {"n": 2, "q": "ಯೇಸುವಿನ ಬಳಿಗೆ ರಾತ್ರಿ ಬಂದ ಫರಿಸಾಯನ ಹೆಸರೇನು?", "a": "ನಿಕೊದೇಮ", "r": "3:1"}, {"n": 3, "q": "ನಿಕೊದೇಮನು ಯಾವ ಪಂಗಡಕ್ಕೆ ಸೇರಿದವನು?", "a": "ಫರಿಸಾಯನು", "r": "3:1"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫರಿಸಾಯನು ಇದ್ದನು.”", "a": "ನಿಕೊದೇಮನೆಂಬ", "r": "3:1"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನಿಕೊದೇಮನೆಂಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದನು.”", "a": "ಫರಿಸಾಯನು", "r": "3:1"}, {"n": 6, "q": "ನಿಕೊದೇಮನು ಯಾರಲ್ಲಿ ಒಬ್ಬನು?", "a": "ಯೆಹೂದ್ಯರ ನಾಯಕರಲ್ಲಿ ಒಬ್ಬನು", "r": "3:2"}, {"n": 7, "q": "ನಿಕೊದೇಮನು ಯೇಸುವಿನ ಬಳಿಗೆ ಯಾವಾಗ ಬಂದನು?", "a": "ಒಂದು ರಾತ್ರಿ", "r": "3:2"}, {"n": 8, "q": "ನಿಕೊದೇಮನು ಯೇಸುವನ್ನು ಕುರಿತು ತಾವು ಏನು ಬಲ್ಲೆವು ಎಂದನು?", "a": "“ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "r": "3:2"}, {"n": 9, "q": "ನಿಕೊದೇಮನ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ತಿಳಿಯಲು ಕಾರಣವೇನು?", "a": "ದೇವರು ತನ್ನೊಡನೆ ಇಲ್ಲದ ಹೊರತು ಯೇಸು ಮಾಡುವ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಯಾರಿಂದಲೂ ಮಾಡಲು ಆಗದು", "r": "3:2"}, {"n": 10, "q": "ನಿಕೊದೇಮನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಗುರುದೇವಾ”", "r": "3:2"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ಯೆಹೂದ್ಯರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬನು.”", "a": "ನಾಯಕರಲ್ಲಿ", "r": "3:2"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ರಾತ್ರಿ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು, ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "3:2"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತನ್ನೊಡನೆ ಇಲ್ಲದ ಹೊರತು ಯಾರಿದಂಲೂ ತಾವು ಮಾಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲು ಆಗದು, ಎಂದು ಹೇಳಿದನು.”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "3:2"}, {"n": 14, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಒಂದು ರಾತ್ರಿ ಅವನು ಯೇಸುಸ್ವಾಮಿಯ ಬಳಿಗೆ ಬಂದು, …”", "a": "“… ಗುರುದೇವಾ, ತಾವು ದೇವರಿಂದ ಬಂದ ಬೋಧಕರೆಂದು ನಾವು ಬಲ್ಲೆವು.”", "r": "3:2"}, {"n": 15, "q": "ನಿಕೊದೇಮನಿಗೆ ಯೇಸು ಸತ್ಯವಾಗಿ ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ”", "r": "3:3"}, {"n": 16, "q": "ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಒಬ್ಬನು ಏನನ್ನು ಸೇರಲಾರ?", "a": "ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು", "r": "3:3"}, {"n": 17, "q": "ನವಜನ್ಮದ ಬಗ್ಗೆ ಯೇಸು ನಿಕೊದೇಮನಿಗೆ “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ” ಎಂದು ಆರಂಭಿಸಿ ಹೇಳಿದ ಎರಡು ಮಾತುಗಳಲ್ಲಿ ದೇವರ ಸಾಮ್ರಾಜ್ಯ ಅಥವಾ ರಾಜ್ಯದ ಬಗ್ಗೆ ಏನು ಹೇಳಿದರು?", "a": "ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ (3:3); ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು (3:5)", "r": "3:3; 3:5"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "3:3"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೇರಲಾರ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಾಮ್ರಾಜ್ಯವನ್ನು", "r": "3:3"}, {"n": 20, "q": "“ಆಗ ಯೇಸು, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "3:3"}, {"n": 21, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು …”", "a": "“… ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ, ಎಂದು ಹೇಳಿದರು.”", "r": "3:3"}, {"n": 22, "q": "ಯೊವಾನ್ನ 3:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟದಿದ್ದರೆ ಅವನು ದೇವರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸೇರಲಾರ,” ಎಂದು ಹೇಳಿದರು.", "r": "3:3"}, {"n": 23, "q": "ಹೊಸ ಹುಟ್ಟಿನ ಬಗ್ಗೆ ನಿಕೊದೇಮನು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ? ತಾಯಿಯ ಗರ್ಭವನ್ನು ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?”", "r": "3:4"}, {"n": 24, "q": "ನಿಕೊದೇಮನು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಎರಡು ‘ಹೇಗೆ’ ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "“ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?” (3:4); “ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” (3:9)", "r": "3:4; 3:9"}, {"n": 25, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?”", "a": "ನಿಕೊದೇಮನು", "r": "3:4"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾಯಿಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?”", "a": "ಗರ್ಭವನ್ನು", "r": "3:4"}, {"n": 27, "q": "“ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "3:4"}, {"n": 28, "q": "ಯೊವಾನ್ನ 3:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, “ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ ಹುಟ್ಟುವುದಾದರೂ ಹೇಗೆ? ತಾಯಿಯ ಗರ್ಭವನ್ನು ಮತ್ತೊಮ್ಮೆ ಹೊಕ್ಕು ಅವನು ಹುಟ್ಟಲು ಸಾಧ್ಯವೇ?” ಎಂದು ಕೇಳಿದನು.", "r": "3:4"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ವಯಸ್ಸಾದ ಒಬ್ಬನು ಹೊಸದಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ?”", "a": "ಹುಟ್ಟುವುದಾದರೂ", "r": "3:4"}, {"n": 30, "q": "ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲು ಯಾವುದರಿಂದ ಹುಟ್ಟಬೇಕು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ", "r": "3:5"}, {"n": 31, "q": "“ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಯೇಸು ನಿಕೊದೇಮನಿಗೆ", "r": "3:5"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "3:5"}, {"n": 33, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರಿನಿಂದಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.”", "a": "ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ", "r": "3:5"}, {"n": 34, "q": "“ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "3:5"}, {"n": 35, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು …”", "a": "“… ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.”", "r": "3:5"}, {"n": 36, "q": "ಯೊವಾನ್ನ 3:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಪ್ರತ್ಯುತ್ತರವಾಗಿ ಯೇಸು, “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ: ನೀರಿನಿಂದಲೂ ಪವಿತ್ರಾತ್ಮನಿಂದಲೂ ಹುಟ್ಟಿದ ಹೊರತು ಯಾವನೂ ದೇವರ ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸಲಾರನು.", "r": "3:5"}, {"n": 37, "q": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಮತ್ತು ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ಏನಾಗಿರುತ್ತವೆ?", "a": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ; ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ", "r": "3:6"}, {"n": 38, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.”", "a": "ಹುಟ್ಟಿದ್ದು", "r": "3:6"}, {"n": 39, "q": "“ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "3:6"}, {"n": 40, "q": "ಯೊವಾನ್ನ 3:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.", "r": "3:6"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು ಶರೀರಮಯ, ದೇವರಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೈವಮಯ.”", "a": "ಹುಟ್ಟಿದ್ದು", "r": "3:6"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶರೀರದಿಂದ ಹುಟ್ಟಿದ್ದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರಿಂದ ಹುಟ್ಟಿದ್ದು ದೈವಮಯ.”", "a": "ಶರೀರಮಯ", "r": "3:6"}, {"n": 43, "q": "ಯಾವುದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ ಎಂದು ಯೇಸು ನಿಕೊದೇಮನಿಗೆ ಹೇಳಿದರು?", "a": "“ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು” ಯೇಸು ಹೇಳಿದ್ದನ್ನು", "r": "3:7"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆರಗಾಗಬೇಕಿಲ್ಲ", "r": "3:7"}, {"n": 45, "q": "“ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "3:7"}, {"n": 46, "q": "ಯೊವಾನ್ನ 3:7 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.", "r": "3:7"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.”", "a": "ಪಡೆಯಬೇಕೆಂದು", "r": "3:7"}, {"n": 48, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ನೀವು ಹೊಸ ಜನ್ಮ ಪಡೆಯಬೇಕೆಂದು …”", "a": "“… ನಾನು ಹೇಳಿದ್ದನ್ನು ಕೇಳಿ ಬೆರಗಾಗಬೇಕಿಲ್ಲ.”", "r": "3:7"}, {"n": 49, "q": "ದೇವರ ಆತ್ಮನಿಂದ ಹುಟ್ಟಿದವನನ್ನು ಯೇಸು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದರು?", "a": "ಗಾಳಿಗೆ", "r": "3:8"}, {"n": 50, "q": "ಗಾಳಿಯ ಬಗ್ಗೆ ನಮಗೆ ಏನು ತಿಳಿಯದು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂಬುದು", "r": "3:8"}, {"n": 51, "q": "ಗಾಳಿಯ ಯಾವುದು ನಮಗೆ ಕೇಳಿಸುತ್ತದೆ?", "a": "ಅದರ ಸದ್ದು", "r": "3:8"}, {"n": 52, "q": "ಗಾಳಿ ಹೇಗೆ ಬೀಸುತ್ತದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ತನಗೆ ತೋಚಿದ ಕಡೆ", "r": "3:8"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗಾಳಿ ತನಗೆ ತೋಚಿದ ಕಡೆ ಬಿಸುತ್ತದೆ, ಅದರ ಸದ್ದು ನಿನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕೇಳಿಸುತ್ತದೆ", "r": "3:8"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, ಎಲ್ಲಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದು ನಿನಗೆ ತಿಳಿಯದು.”", "a": "ಹೋಗುತ್ತದೆ", "r": "3:8"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಆತ್ಮನಿಂದ ಹುಟ್ಟಿದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅದರಂತೆಯೇ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "3:8"}, {"n": 56, "q": "“ಗಾಳಿ ತನಗೆ ತೋಚಿದ ಕಡೆ ಬಿಸುತ್ತದೆ, ಅದರ ಸದ್ದು ನಿನಗೆ ಕೇಳಿಸುತ್ತದೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "3:8"}, {"n": 57, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆದರೆ ಅದು ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ, …”", "a": "“… ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ ಎಂಬುದು ನಿನಗೆ ತಿಳಿಯದು.”", "r": "3:8"}, {"n": 58, "q": "ಯೇಸುವಿನ ವಿವರಣೆ ಕೇಳಿ ನಿಕೊದೇಮನು ಮತ್ತೆ ಏನು ಕೇಳಿದನು?", "a": "“ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?”", "r": "3:9"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?”", "a": "ನಿಕೊದೇಮನು", "r": "3:9"}, {"n": 60, "q": "“ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "3:9"}, {"n": 61, "q": "ಯೊವಾನ್ನ 3:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, “ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” ಎಂದು ಕೇಳಿದನು.", "r": "3:9"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ನಿಕೊದೇಮನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ಸಾಧ್ಯ?”", "a": "ಇದೆಲ್ಲಾ", "r": "3:9"}, {"n": 63, "q": "ಯೇಸು ನಿಕೊದೇಮನನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕ", "r": "3:10"}, {"n": 64, "q": "“ಇದೆಲ್ಲಾ ಹೇಗೆ ಸಾಧ್ಯ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಯೇಸು ಮೊದಲು ಕೇಳಿದ ಮರುಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "r": "3:10"}, {"n": 65, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "3:10"}, {"n": 66, "q": "“ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "3:10"}, {"n": 67, "q": "ಯೊವಾನ್ನ 3:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?", "r": "3:10"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ ಬೋಧಕನಾದ ನಿನಗೇ ಇದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಅರ್ಥವಾಗಲಿಲ್ಲವೆ", "r": "3:10"}, {"n": 69, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆಗ ಯೇಸು, ಇಸ್ರಯೇಲಿನ ಹೆಸರಾಂತ …”", "a": "“… ಬೋಧಕನಾದ ನಿನಗೇ ಇದು ಅರ್ಥವಾಗಲಿಲ್ಲವೆ?”", "r": "3:10"}, {"n": 70, "q": "‘ನಾವು’ ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡುತ್ತೇವೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನಾವು ಕಂಡದ್ದನ್ನು ಕುರಿತು", "r": "3:11"}, {"n": 71, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಯಾವುದನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಿದ್ಧರಿಲ್ಲ?", "a": "‘ನಮ್ಮ’ ಸಾಕ್ಷ್ಯವನ್ನು", "r": "3:11"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳು:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "3:11"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೆ ತಿಳಿದುದನ್ನೇ ಕುರಿತು ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮಾತನಾಡುತ್ತೇವೆ", "r": "3:11"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಸಾಕ್ಷಿ ನೀಡುತ್ತೇವೆ.”", "a": "ಕಂಡದ್ದನ್ನು", "r": "3:11"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಿದ್ಧರಿಲ್ಲ.”", "a": "ಸಾಕ್ಷ್ಯವನ್ನು", "r": "3:11"}, {"n": 76, "q": "“ನಾನು ನಿನಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ ಕೇಳು:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "3:11"}, {"n": 77, "q": "ಯೇಸು ಯಾವ ಎರಡು ಲೋಕಗಳ ವಿಷಯಗಳನ್ನು ಹೋಲಿಸಿ ಮಾತನಾಡಿದರು?", "a": "ಭೂಲೋಕದ ವಿಷಯ ಮತ್ತು ಸ್ವರ್ಗಲೋಕದ ವಿಷಯ", "r": "3:12"}, {"n": 78, "q": "ಯೇಸು ಯಾವುದರ ವಿಷಯ ಮಾತನಾಡಿದಾಗಲೇ ಜನರಿಗೆ ವಿಶ್ವಾಸವಿರಲಿಲ್ಲ?", "a": "ಭೂಲೋಕದ ವಿಷಯ", "r": "3:12"}, {"n": 79, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ", "r": "3:12"}, {"n": 80, "q": "“ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "3:12"}, {"n": 81, "q": "ಯೊವಾನ್ನ 3:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?", "r": "3:12"}, {"n": 82, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಂಟೆ?”", "a": "ವಿಸ್ವಾಸಿಸುವುದು", "r": "3:12"}, {"n": 83, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಭೂಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಾಗಲೇ ನಿಮಗೆ ವಿಶ್ವಾಸವಿಲ್ಲವೆಂದ ಮೇಲೆ, …”", "a": "“… ಸ್ವರ್ಗಲೋಕದ ವಿಷಯವನ್ನು ಕುರಿತು ನಾನು ಮಾತನಾಡಿದಲ್ಲಿ ನೀವು ವಿಸ್ವಾಸಿಸುವುದು ಉಂಟೆ?”", "r": "3:12"}, {"n": 84, "q": "ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಇಲ್ಲ", "r": "3:13"}, {"n": 85, "q": "ನರಪುತ್ರನು ಎಲ್ಲಿಂದ ಇಳಿದು ಬಂದವರು?", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ", "r": "3:13"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.”", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ", "r": "3:13"}, {"n": 87, "q": "“ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "3:13"}, {"n": 88, "q": "ಯೊವಾನ್ನ 3:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.", "r": "3:13"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಏರಿಹೋದವರಿಲ್ಲ", "r": "3:13"}, {"n": 90, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸ್ವರ್ಗಲೋಕದಿಂದಲೇ ಇಳಿದು ಬಂದ ನರಪುತ್ರನೇ …”", "a": "“… ಹೊರತು ಬೇರೆ ಯಾರೂ ಸ್ವರ್ಗಕ್ಕೆ ಏರಿಹೋದವರಿಲ್ಲ.”", "r": "3:13"}, {"n": 91, "q": "ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದವನು ಯಾರು?", "a": "ಮೋಶೆ", "r": "3:14"}, {"n": 92, "q": "ಮೋಶೆ ಸರ್ಪವನ್ನು ಎಲ್ಲಿ ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು?", "a": "ಮರುಭೂಮಿಯಲ್ಲಿ", "r": "3:14"}, {"n": 93, "q": "ಮೋಶೆ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದಂತೆಯೇ ಯಾರನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು?", "a": "ನರಪುತ್ರನನ್ನು", "r": "3:14–15"}, {"n": 94, "q": "ಯೇಸು ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸುವುದನ್ನು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯ ಯಾವ ಘಟನೆಗೆ ಹೋಲಿಸಿದರು?", "a": "ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದ ಘಟನೆಗೆ", "r": "3:14"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.”", "a": "ಮೋಶೆ", "r": "3:14"}, {"n": 96, "q": "“ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "3:14"}, {"n": 97, "q": "ಯೊವಾನ್ನ 3:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.", "r": "3:14"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರ್ಪವನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಿದನು.”", "a": "ಮರುಭೂಮಿಯಲ್ಲಿ", "r": "3:14"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆ ಮರುಭೂಮಿಯಲ್ಲಿ ಸರ್ಪವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಏರಿಸಿದನು.”", "a": "ಮೇಲಕ್ಕೆ", "r": "3:14"}, {"n": 100, "q": "ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕಾದ ಉದ್ದೇಶವೇನು?", "a": "ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ", "r": "3:15"}, {"n": 101, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ನಿತ್ಯಜೀವದ ಬಗ್ಗೆ ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "3:15, 3:16, 3:36", "r": "3:15; 3:16; 3:36"}, {"n": 102, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ", "r": "3:15"}, {"n": 103, "q": "“ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "3:15"}, {"n": 104, "q": "ಯೊವಾನ್ನ 3:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.", "r": "3:15"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "3:15"}, {"n": 106, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಅಂತೆಯೇ ನರಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವರೆಲ್ಲರೂ ನಿತ್ಯಜೀವವನ್ನು …”", "a": "“… ಪಡೆಯುವಂತೆ ನರಪುತ್ರನನ್ನು ಸಹ ಮೇಲಕ್ಕೆ ಏರಿಸಬೇಕು.”", "r": "3:15"}, {"n": 107, "q": "ದೇವರು ಲೋಕವನ್ನು ಪ್ರೀತಿಸಿದ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 3:16 ಏನು ಹೇಳುತ್ತದೆ?", "a": "“ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು”", "r": "3:16"}, {"n": 108, "q": "ದೇವರು ಲೋಕವನ್ನು ಪ್ರೀತಿಸಿ ಏನು ಮಾಡಿದರು?", "a": "ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು", "r": "3:16"}, {"n": 109, "q": "ದೇವರು ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನು ಧಾರೆಯೆರೆದ ಉದ್ದೇಶವೇನು?", "a": "ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದು", "r": "3:16"}, {"n": 110, "q": "ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟು ಪ್ರೀತಿಸಿದರು?", "a": "ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆಯುವಷ್ಟು", "r": "3:16"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು;”", "a": "ಪ್ರೀತಿಸಿದರೆಂದರೆ", "r": "3:16"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಉದ್ದೇಶ.”", "a": "ಪಡೆಯಬೇಕೆಂಬುದೇ", "r": "3:16"}, {"n": 113, "q": "“ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "3:16"}, {"n": 114, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ …”", "a": "“… ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದೇ ದೇವರ ಉದ್ದೇಶ.”", "r": "3:16"}, {"n": 115, "q": "ಯೊವಾನ್ನ 3:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು; ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟ ಯಾರೂ ನಾಶವಾಗದೆ ಎಲ್ಲರೂ ನಿತ್ಯ ಜೀವವನ್ನು ಪಡೆಯಬೇಕೆಂಬುದೇ ದೇವರ ಉದ್ದೇಶ.", "r": "3:16"}, {"n": 116, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಲೋಕಕ್ಕೆ ಯಾವುದಕ್ಕಾಗಿ ಕಳುಹಿಸಲಿಲ್ಲ?", "a": "ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ", "r": "3:17"}, {"n": 117, "q": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಲೋಕಕ್ಕೆ ಏಕೆ ಕಳುಹಿಸಿದರು?", "a": "ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ ಉದ್ಧಾರವಾಗಲೆಂದು", "r": "3:17"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಗುರಿಮಾಡಲೆಂದಲ್ಲ", "r": "3:17"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉದ್ಧಾರವಾಗಲೆಂದು", "r": "3:17"}, {"n": 120, "q": "“ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "3:17"}, {"n": 121, "q": "ಯೊವಾನ್ನ 3:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ ಕಳುಹಿಸಿದ್ದು ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ; ಪುತ್ರನ ಮುಖಾಂತರ ಲೋಕ ಉದ್ಧಾರವಾಗಲೆಂದು.", "r": "3:17"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ತಮ್ಮ ಪುತ್ರನನ್ನು ಈ ಲೋಕಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕವನ್ನು ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡಲೆಂದಲ್ಲ;”", "a": "ಕಳುಹಿಸಿದ್ದು", "r": "3:17"}, {"n": 123, "q": "ಯಾರಿಗೆ ತೀರ್ಪಿಲ್ಲ?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನಿಗೆ", "r": "3:18"}, {"n": 124, "q": "ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿರುವವನು ಯಾರು?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನು", "r": "3:18"}, {"n": 125, "q": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನು ಏಕೆ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ?", "a": "ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಲ್ಲದ್ದರಿಂದ", "r": "3:18"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ.”", "a": "ವಿಶ್ವಾಸವಿಡದವನಾದರೋ", "r": "3:18"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲ", "r": "3:18"}, {"n": 128, "q": "“ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "3:18"}, {"n": 129, "q": "ಯೊವಾನ್ನ 3:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನಿಗೆ ತೀರ್ಪಿಲ್ಲ. ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ ಗುರಿಯಾಗಿದ್ದಾನೆ. ಏಕೆಂದರೆ, ಅವನಿಗೆ ದೇವರ ಏಕೈಕ ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಲ್ಲ.", "r": "3:18"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡದವನಾದರೋ ಈಗಾಗಲೇ ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಯಾಗಿದ್ದಾನೆ", "r": "3:18"}, {"n": 131, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ‘ಈ ತೀರ್ಪು’ ಏನು?", "a": "ಜ್ಯೋತಿ ಜಗತ್ತಿಗೆ ಬಂದಿತು; ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು", "r": "3:19"}, {"n": 132, "q": "ಮಾನವರು ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನು ಏಕೆ ಅವಲಂಬಿಸಿದರು?", "a": "ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ", "r": "3:19"}, {"n": 133, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 3:19–21ರಲ್ಲಿ ಕೇಡನ್ನು ಮಾಡುವವನು ಮತ್ತು ಸತ್ಯಸಂಧನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು, ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ; ಸತ್ಯಸಂಧನು ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ", "r": "3:19–21"}, {"n": 134, "q": "ಜಗತ್ತಿಗೆ ಏನು ಬಂದಿತು?", "a": "ಜ್ಯೋತಿ", "r": "3:19"}, {"n": 135, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.”", "a": "ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ", "r": "3:19"}, {"n": 136, "q": "“ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "3:19"}, {"n": 137, "q": "ಯೊವಾನ್ನ 3:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ತೀರ್ಪು ಏನೆಂದರೆ: ಜ್ಯೋತಿ ಜಗತ್ತಿಗೆ ಬಂದಿತು; ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.", "r": "3:19"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ ಜ್ಯೋತಿಗೆ ಬದಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವಲಂಬಿಸಿದರು.”", "a": "ಅಂಧಕಾರವನ್ನೇ", "r": "3:19"}, {"n": 139, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಮಾನವರಾದರೋ ತಮ್ಮ ದುಷ್ಕೃತ್ಯಗಳಿಂದಾಗಿ ಆ …”", "a": "“… ಜ್ಯೋತಿಗೆ ಬದಲು ಅಂಧಕಾರವನ್ನೇ ಅವಲಂಬಿಸಿದರು.”", "r": "3:19"}, {"n": 140, "q": "ಯಾರಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು?", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ", "r": "3:20"}, {"n": 141, "q": "ಕೇಡನ್ನು ಮಾಡುವವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಏಕೆ ಸುಳಿಯುವುದಿಲ್ಲ?", "a": "ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು", "r": "3:20"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೇಡನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಕೆಂದರೆ ಆಗದು.”", "a": "ಮಾಡುವವನಿಗೆ", "r": "3:20"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,”", "a": "ಬಯಲಾಗಬಾರದೆಂದು", "r": "3:20"}, {"n": 144, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು ಅವನು …”", "a": "“… ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,”", "r": "3:20"}, {"n": 145, "q": "ಯೊವಾನ್ನ 3:20 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ ಬೆಳಕೆಂದರೆ ಆಗದು. ತನ್ನ ದುಷ್ಕೃತ್ಯಗಳು ಬಯಲಾಗಬಾರದೆಂದು ಅವನು ಬೆಳಕಿನ ಬಳಿಗೆ ಸುಳಿಯುವುದೂ ಇಲ್ಲ,", "r": "3:20"}, {"n": 146, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೇಡನ್ನು ಮಾಡುವವನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗದು.”", "a": "ಬೆಳಕೆಂದರೆ", "r": "3:20"}, {"n": 147, "q": "ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುವವನು ಯಾರು?", "a": "ಸತ್ಯಸಂಧನು", "r": "3:21"}, {"n": 148, "q": "ಸತ್ಯಸಂಧನು ಬೆಳಕಿನ ಬಳಿಗೆ ಬಂದು ಏನನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ?", "a": "ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು", "r": "3:21"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಸತ್ಯಸಂಧನಾದರೋ", "r": "3:21"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರ್ಪಡಿಸುತ್ತಾನೆ", "r": "3:21"}, {"n": 151, "q": "ಯೊವಾನ್ನ 3:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸತ್ಯಸಂಧನಾದರೋ ಬೆಳಕಿನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ. ತಾನು ಮಾಡುವುದು ದೇವರು ಮೆಚ್ಚುವುದನ್ನೇ ಎಂಬುದನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ.", "r": "3:21"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯಸಂಧನಾದರೋ ಬೆಳಕಿನ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರುತ್ತಾನೆ", "r": "3:21"}, {"n": 153, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾನು ಮಾಡುವುದು ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ತೋರ್ಪಡಿಸುತ್ತಾನೆ.”", "a": "ಮೆಚ್ಚುವುದನ್ನೇ", "r": "3:21"}, {"n": 154, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 3:22ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಯೊವಾನ್ನ", "r": "3:22"}, {"n": 155, "q": "ನಿಕೊದೇಮನೊಂದಿಗಿನ ಸಂಭಾಷಣೆಯ ಬಳಿಕ ಯೇಸು ಶಿಷ್ಯರೊಡನೆ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ", "r": "3:22"}, {"n": 156, "q": "ಜುದೇಯ ಪ್ರಾಂತ್ಯದಲ್ಲಿ ಉಳಿದುಕೊಂಡು ಯೇಸು ಏನು ಮಾಡತೊಡಗಿದರು?", "a": "ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು", "r": "3:22"}, {"n": 157, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ಯೇಸು ಮತ್ತು ಯೊವಾನ್ನ ಇಬ್ಬರೂ ಒಂದೇ ಕಾಲದಲ್ಲಿ ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ದೀಕ್ಷಾಸ್ನಾನ (ಸ್ನಾನದೀಕ್ಷೆ) ಮಾಡಿಸುತ್ತಿದ್ದರು", "r": "3:22; 3:26"}, {"n": 158, "q": "ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಯೇಸುವಿನೊಡನೆ ಬಂದವರು ಯಾರು?", "a": "ಅವರ ಶಿಷ್ಯರು", "r": "3:22"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "3:22"}, {"n": 160, "q": "“ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "3:22"}, {"n": 161, "q": "ಯೊವಾನ್ನ 3:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸತೊಡಗಿದರು.", "r": "3:22"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ತಮ್ಮ ಶಿಷ್ಯರೊಡನೆ ಜುದೇಯ ಪ್ರಾಂತ್ಯಕ್ಕೆ ಬಂದು ಅವರೊಡನೆ ಕೆಲವು ಕಾಲ ಅಲ್ಲೇ ಉಳಿದುಕೊಂಡು ದೀಕ್ಷಾಸ್ನಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಸತೊಡಗಿದರು", "r": "3:22"}, {"n": 163, "q": "ಯೊವಾನ್ನನು ಎಲ್ಲಿ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು?", "a": "ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ", "r": "3:23"}, {"n": 164, "q": "ಯೊವಾನ್ನನು ಐನೋನಿನಲ್ಲಿ ಏಕೆ ಸ್ನಾನದೀಕ್ಷೆ ಮಾಡಿಸುತ್ತಿದ್ದನು?", "a": "ಅಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ", "r": "3:23"}, {"n": 165, "q": "ಐನೋನ್ ಎಂಬ ಸ್ಥಳ ಯಾವ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿತ್ತು?", "a": "ಸಾಲಿಮ್", "r": "3:23"}, {"n": 166, "q": "ಐನೋನಿನಲ್ಲಿ ಬಂದು ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಪಡೆಯುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಜನರು", "r": "3:23"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "3:23"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು ಬಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುತ್ತಿದ್ದರು.”", "a": "ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು", "r": "3:23"}, {"n": 169, "q": "“ಅತ್ತ ಯೊವಾನ್ನನು ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "3:23"}, {"n": 170, "q": "ಯೊವಾನ್ನ 3:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅತ್ತ ಯೊವಾನ್ನನು ಕೂಡ ಸಾಲಿಮ್ ಎಂಬ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿದ್ದ ಐನೋನ್ ಎಂಬ ಸ್ಥಳದಲ್ಲಿ ನೀರು ಹೆಚ್ಚಾಗಿದ್ದುದರಿಂದ ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದನು. ಜನರು ಬಂದು ಸ್ನಾನದೀಕ್ಷೆಯನ್ನು ಪಡೆಯುತ್ತಿದ್ದರು.", "r": "3:23"}, {"n": 171, "q": "ಐನೋನಿನಲ್ಲಿ ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದಾಗ ಯೊವಾನ್ನನ ಸ್ಥಿತಿ ಏನಾಗಿತ್ತು?", "a": "ಇನ್ನೂ ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ", "r": "3:24"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ಇನ್ನೂ ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ.”", "a": "ಯೊವಾನ್ನನು", "r": "3:24"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೊವಾನ್ನನು ಆಗ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂಧಿತನಾಗಿರಲಿಲ್ಲ", "r": "3:24"}, {"n": 174, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ಯಾವುದರ ಕುರಿತು ವಿವಾದ ಎದ್ದಿತು?", "a": "ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು", "r": "3:25"}, {"n": 175, "q": "ಶುದ್ಧಾಚಾರದ ಬಗ್ಗೆ ವಿವಾದ ಯಾರ ನಡುವೆ ಎದ್ದಿತು?", "a": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ", "r": "3:25"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.”", "a": "ಯೊವಾನ್ನನ", "r": "3:25"}, {"n": 177, "q": "“ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "3:25"}, {"n": 178, "q": "ಯೊವಾನ್ನ 3:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ ಎದ್ದಿತು.", "r": "3:25"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿವಾದ ಎದ್ದಿತು.”", "a": "ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ", "r": "3:25"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶುದ್ಧಾಚಾರವನ್ನು ಕುರಿತು ಯೊವಾನ್ನನ ಶಿಷ್ಯರಿಗೂ ಯೆಹೂದ್ಯನೊಬ್ಬನಿಗೂ ವಿವಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎದ್ದಿತು", "r": "3:25"}, {"n": 181, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಅವನಿಗೆ ಯೇಸುವಿನ ಬಗ್ಗೆ ಯಾವ ದೂರನ್ನು ಇತ್ತರು?", "a": "ಯೇಸುವೇ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದಾನೆ; ಎಲ್ಲರೂ ಆತನ ಬಳಿಗೆ ಹೋಗುತ್ತಿದ್ದಾರೆ", "r": "3:26"}, {"n": 182, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರ ಪ್ರಕಾರ ಯೇಸು ಯೊವಾನ್ನನೊಡನೆ ಎಲ್ಲಿ ಇದ್ದರು?", "a": "ಜೋರ್ಡನಿನ ಆಚೆಕಡೆಯಲ್ಲಿ", "r": "3:26"}, {"n": 183, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಅವನನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ಗುರುವೇ”", "r": "3:26"}, {"n": 184, "q": "ಯೊವಾನ್ನನ ಶಿಷ್ಯರ ಪ್ರಕಾರ ಎಲ್ಲರೂ ಯಾರ ಬಳಿಗೆ ಹೋಗುತ್ತಿದ್ದರು?", "a": "ಯೇಸುವಿನ ಬಳಿಗೆ (“ಆತನ ಬಳಿಗೆ”)", "r": "3:26"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು, ಗುರುವೇ, ಜೋರ್ಡನಿನ ಆಚೆಕಡೆಯಲ್ಲಿ ನಿಮ್ಮೊಡನೆ ಒಬ್ಬನು ಇದ್ದನಲ್ಲವೆ?”", "a": "ಯೊವಾನ್ನನ", "r": "3:26"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನನ್ನು ಕುರಿತು ನೀವೇ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳಲಿಲ್ಲವೆ", "r": "3:26"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನೋಡಿ, ಆತನೇ ದೀಕ್ಷಾಸ್ನಾನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾಡಿಸುತ್ತಿದ್ದಾನೆ", "r": "3:26"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಲ್ಲರೂ ಆತನ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ದೂರಿತ್ತರು.”", "a": "ಹೋಗುತ್ತಿದ್ದಾರೆ", "r": "3:26"}, {"n": 189, "q": "ಶಿಷ್ಯರ ದೂರಿಗೆ ಯೊವಾನ್ನನು ಕೊಟ್ಟ ಉತ್ತರದ ಮೊದಲ ವಾಕ್ಯ ಯಾವುದು?", "a": "“ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "r": "3:27"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "a": "ಯೊವಾನ್ನನು", "r": "3:27"}, {"n": 191, "q": "“ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "3:27"}, {"n": 192, "q": "ಯೊವಾನ್ನ 3:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, “ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.", "r": "3:27"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, ದೇವರು ದಯಪಾಲಿಸದೆ ಹೋದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಕ್ಕದು.”", "a": "ಮಾನವನಿಗೇನೂ", "r": "3:27"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೊವಾನ್ನನು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಯಪಾಲಿಸದೆ ಹೋದರೆ ಮಾನವನಿಗೇನೂ ದಕ್ಕದು.”", "a": "ದೇವರು", "r": "3:27"}, {"n": 195, "q": "ಯೊವಾನ್ನನು ತನ್ನ ಬಗ್ಗೆ ಹೇಳಿದ್ದಕ್ಕೆ ತನ್ನ ಶಿಷ್ಯರೇ ಸಾಕ್ಷಿಗಳೆಂದು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "‘ನಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ; ಆತನ ಮುಂದೂತ ಮಾತ್ರ’", "r": "3:28"}, {"n": 196, "q": "ಯೊವಾನ್ನನು ತಾನು ಲೋಕೋದ್ಧಾರಕನಿಗೆ ಏನೆಂದು ಹೇಳಿಕೊಂಡನು?", "a": "ಆತನ ಮುಂದೂತ", "r": "3:28"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ", "r": "3:28"}, {"n": 198, "q": "“ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "3:28"}, {"n": 199, "q": "ಯೊವಾನ್ನ 3:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಾನು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ; ಆತನ ಮುಂದೂತ ಮಾತ್ರ’ ಎಂದು ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.", "r": "3:28"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.”", "a": "ಹೇಳಿದ್ದಕ್ಕೆ", "r": "3:28"}, {"n": 201, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಆತನ ಮುಂದೂತ ಮಾತ್ರ ಎಂದು …”", "a": "“… ನಾನು ಹೇಳಿದ್ದಕ್ಕೆ ನೀವೇ ಸಾಕ್ಷಿಗಳಾಗಿದ್ದೀರಿ.”", "r": "3:28"}, {"n": 202, "q": "ಯೊವಾನ್ನನ ಉದಾಹರಣೆಯಲ್ಲಿ ಮದುಮಗಳು ಯಾರಿಗೆ ಸೇರಿದವಳು?", "a": "ಮದುಮಗನಿಗೆ", "r": "3:29"}, {"n": 203, "q": "ಯೊವಾನ್ನನು ತನ್ನನ್ನು ಮದುವೆಯ ಉದಾಹರಣೆಯಲ್ಲಿ ಯಾರಿಗೆ ಹೋಲಿಸಿಕೊಂಡನು?", "a": "ಮದುಮಗನ ಗೆಳೆಯನಿಗೆ", "r": "3:29"}, {"n": 204, "q": "ಮದುಮಗನ ಗೆಳೆಯನು ಮದುಮಗನ ಸ್ವರ ಕೇಳಿ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಹರ್ಷಿಸುತ್ತಾನೆ", "r": "3:29"}, {"n": 205, "q": "ಯೊವಾನ್ನನು ತಾನೀಗ ಯಾವುದರಿಂದ ಭರಿತನಾಗಿದ್ದೇನೆ ಎಂದನು?", "a": "ಆನಂದದಿಂದ (ಮದುಮಗನ ಗೆಳೆಯನ ಆನಂದದಿಂದ)", "r": "3:29"}, {"n": 206, "q": "ಮದುಮಗನ ಕರೆಗೆ ಪಕ್ಕದಲ್ಲಿದ್ದು ಕಿವಿಗೊಡುವವನು ಯಾರು?", "a": "ಮದುಮಗನ ಗೆಳೆಯ", "r": "3:29"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮದುಮಗನ ಗೆಳೆಯನಾದರೋ ಪಕ್ಕದಲ್ಲಿದ್ದು ಮದುಮಗನ ಕರೆಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಕಿವಿಗೊಡುತ್ತಾನೆ", "r": "3:29"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಸ್ವರ ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹರ್ಷಿಸುತ್ತಾನೆ", "r": "3:29"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಂಥ ಆನಂದದಿಂದ ನಾನೀಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಭರಿತನಾಗಿದ್ದೇನೆ", "r": "3:29"}, {"n": 210, "q": "“ಮದುಮಗನ ಗೆಳೆಯನಾದರೋ ಪಕ್ಕದಲ್ಲಿದ್ದು ಮದುಮಗನ ಕರೆಗೆ ಕಿವಿಗೊಡುತ್ತಾನೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "3:29"}, {"n": 211, "q": "ಯೇಸು ಮತ್ತು ತನ್ನ ಬಗ್ಗೆ ಯೊವಾನ್ನನು ಹೇಳಿದ ಪ್ರಸಿದ್ಧ ಮಾತು ಯಾವುದು?", "a": "“ಆತ ಬೆಳೆಯುತ್ತಿರಬೇಕು, ನಾನು ಅಳಿಯುತ್ತಿರಬೇಕು.”", "r": "3:30"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಅಳಿಯುತ್ತಿರಬೇಕು.”", "a": "ಬೆಳೆಯುತ್ತಿರಬೇಕು", "r": "3:30"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ ಬೆಳೆಯುತ್ತಿರಬೇಕು, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಳಿಯುತ್ತಿರಬೇಕು", "r": "3:30"}, {"n": 214, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 3:31ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪರದಿಂದ ಬಂದವನು", "r": "3:31"}, {"n": 215, "q": "ಎಲ್ಲರಿಗಿಂತ ಮೇಲಾದವನು ಯಾರು?", "a": "ಮೇಲಿಂದ ಬಂದವನು", "r": "3:31"}, {"n": 216, "q": "ಇಹಲೋಕದಿಂದ ಬಂದವನು ಮತ್ತು ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಇಹಲೋಕದಿಂದ ಬಂದವನು ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು, ಲೌಕಿಕವಾದುದನ್ನೇ ಹೇಳುವವನು; ಸ್ವರ್ಗದಿಂದ ಬಂದವನು ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು", "r": "3:31"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲಿಂದ ಬಂದವನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲಾದವನು.”", "a": "ಎಲ್ಲರಿಗಿಂತ", "r": "3:31"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವನು ಆದರೋ ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು;”", "a": "ಇಹಲೋಕದಿಂದ", "r": "3:31"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದವನಾದರೋ ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "3:31"}, {"n": 220, "q": "ಯೊವಾನ್ನ 3:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಮೇಲಿಂದ ಬಂದವನೇ ಎಲ್ಲರಿಗಿಂತ ಮೇಲಾದವನು. ಇಹಲೋಕದಿಂದ ಬಂದವನು ಆದರೋ ಈ ಲೋಕಕ್ಕೆ ಸೇರಿದವನು; ಅವನು ಲೌಕಿಕವಾದುದನ್ನೇ ಹೇಳುವವನು. ಸ್ವರ್ಗದಿಂದ ಬಂದವನಾದರೋ ಸರ್ವರಿಗೂ ಶ್ರೇಷ್ಠನು.", "r": "3:31"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೇಲಿಂದ ಬಂದವನೇ ಎಲ್ಲರಿಗಿಂತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೇಲಾದವನು", "r": "3:31"}, {"n": 222, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನು ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ?", "a": "ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತು", "r": "3:32"}, {"n": 223, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ಮಾತನ್ನು ಎಷ್ಟು ಜನರು ಅಂಗೀಕರಿಸುತ್ತಾರೆ ಎಂದು ಯೊವಾನ್ನನು ಹೇಳುತ್ತಾನೆ?", "a": "ಯಾರೂ ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ", "r": "3:32"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ", "r": "3:32"}, {"n": 225, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಆತನ ಮಾತನ್ನು ಯಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ", "r": "3:32"}, {"n": 226, "q": "“ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "3:32"}, {"n": 227, "q": "ಯೊವಾನ್ನ 3:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ ಕೇಳಿದ್ದನ್ನೂ ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ. ಆದರೂ ಆತನ ಮಾತನ್ನು ಯಾರೂ ಅಂಗೀಕರಿಸುವುದಿಲ್ಲ.", "r": "3:32"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ತಾನು ಕಂಡದ್ದನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತೇ ಸಾಕ್ಷಿಹೇಳುತ್ತಾನೆ.”", "a": "ಕೇಳಿದ್ದನ್ನೂ", "r": "3:32"}, {"n": 229, "q": "ಸ್ವರ್ಗದಿಂದ ಬಂದವನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ಏನನ್ನು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ?", "a": "ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು", "r": "3:33"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ", "r": "3:33"}, {"n": 231, "q": "“ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "3:33"}, {"n": 232, "q": "ಯೊವಾನ್ನ 3:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.", "r": "3:33"}, {"n": 233, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.”", "a": "ಅಂಗೀಕರಿಸುವವನು", "r": "3:33"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನ ಮಾತನ್ನು ಅಂಗೀಕರಿಸುವವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯಸ್ವರೂಪಿ ಎಂದು ಸಾದೃಶ್ಯಪಡಿಸುತ್ತಾನೆ.”", "a": "ದೇವರು", "r": "3:33"}, {"n": 235, "q": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ಯಾರ ಮಾತುಗಳನ್ನು ಆಡುತ್ತಾನೆ?", "a": "ದೇವರ ಮಾತುಗಳನ್ನೇ", "r": "3:34"}, {"n": 236, "q": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಏಕೆ ಆಡುತ್ತಾನೆ?", "a": "ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮರನ್ನು ಪೂರ್ಣವಾಗಿ ಕೊಟ್ಟಿರುವುದರಿಂದ", "r": "3:34"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನು", "r": "3:34"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮ ಅವರನ್ನು ಪೂರ್ಣವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಟ್ಟಿರುತ್ತಾರೆ", "r": "3:34"}, {"n": 239, "q": "“ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "3:34"}, {"n": 240, "q": "ಯೊವಾನ್ನ 3:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ ಮಾತುಗಳನ್ನೇ ಆಡುತ್ತಾನೆ. ಏಕೆಂದರೆ ದೇವರು ಆತನಿಗೆ ಪವಿತ್ರಾತ್ಮ ಅವರನ್ನು ಪೂರ್ಣವಾಗಿ ಕೊಟ್ಟಿರುತ್ತಾರೆ.", "r": "3:34"}, {"n": 241, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರು ಕಳುಹಿಸಿದಾತನು ದೇವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಡುತ್ತಾನೆ.”", "a": "ಮಾತುಗಳನ್ನೇ", "r": "3:34"}, {"n": 242, "q": "ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಏನು ಮಾಡಿದ್ದಾರೆ?", "a": "ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ", "r": "3:35"}, {"n": 243, "q": "ಸರ್ವಸ್ವವನ್ನೂ ಯಾರ ಕೈಗೆ ಕೊಡಲಾಗಿದೆ?", "a": "ಪುತ್ರನ ಕೈಗೆ", "r": "3:35"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಸರ್ವಸ್ವವನ್ನೂ", "r": "3:35"}, {"n": 245, "q": "“ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "3:35"}, {"n": 246, "q": "ಯೊವಾನ್ನ 3:35 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.", "r": "3:35"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ ಕೈಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೊಟ್ಟಿದ್ದಾರೆ", "r": "3:35"}, {"n": 248, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತ ಪುತ್ರನನ್ನು ಪ್ರೀತಿಸಿ ಸರ್ವಸ್ವವನ್ನೂ ಆತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಕೈಗೆ", "r": "3:35"}, {"n": 249, "q": "ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುವವನು ಯಾರು?", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು", "r": "3:36"}, {"n": 250, "q": "ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ನಿತ್ಯಜೀವವನ್ನು ಸವಿಯನು; ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "3:36"}, {"n": 251, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೂರನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು ಯಾವುದಕ್ಕೆ ಗುರಿಯಾಗುತ್ತಾನೆ ಎಂದು ಹೇಳಲಾಗಿದೆ?", "a": "ದೇವರ ಕೋಪಾಗ್ನಿಗೆ", "r": "3:36"}, {"n": 252, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ;”", "a": "ವಿಶ್ವಾಸವಿಟ್ಟವನು", "r": "3:36"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸವಿಯನು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "3:36"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಗುರಿಯಾಗುತ್ತಾನೆ", "r": "3:36"}, {"n": 255, "q": "“ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 3ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "3:36"}, {"n": 256, "q": "ಯೊವಾನ್ನ 3:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪುತ್ರನಲ್ಲಿ ವಿಶ್ವಾಸವಿಟ್ಟವನು ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ; ಪುತ್ರನಿಗೆ ಶರಣಾಗದವನು ನಿತ್ಯಜೀವವನ್ನು ಸವಿಯನು. ಅವನು ದೇವರ ಕೋಪಾಗ್ನಿಗೆ ಗುರಿಯಾಗುತ್ತಾನೆ,” ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.", "r": "3:36"}]}, {"chapter": 4, "label": "ಅಧ್ಯಾಯ 4", "verses": 54, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಸಮಾರಿಯದ ಮಹಿಳೆ", "r": "4:1"}, {"n": 2, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದ ವಾರ್ತೆ ಏನು?", "a": "ಯೊವಾನ್ನನಿಗಿಂತಲೂ ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದಾರೆ ಎಂಬುದು", "r": "4:1"}, {"n": 3, "q": "ಯೇಸು ಹೆಚ್ಚುಮಂದಿಯನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದಾರೆಂಬ ವಾರ್ತೆ ಯಾರ ಕಿವಿಗೆ ಬಿದ್ದಿತು?", "a": "ಫರಿಸಾಯರ", "r": "4:1"}, {"n": 4, "q": "ಫರಿಸಾಯರು ಕೇಳಿದ ವಾರ್ತೆಗೂ ವಾಸ್ತವಕ್ಕೂ ಇದ್ದ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಯೇಸು ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದಾರೆಂದು ವಾರ್ತೆ; ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸುತ್ತಿದ್ದವರು ಅವರ ಶಿಷ್ಯರು", "r": "4:1–2"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ, ಅವರಿಗೆ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಾ ಇದ್ದಾರೆಂಬ ವಾರ್ತೆ ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದಿತು.”", "a": "ಯೊವಾನ್ನನಿಗಿಂತಲೂ", "r": "4:1"}, {"n": 6, "q": "“ಯೊವಾನ್ನನಿಗಿಂತಲೂ ಯೇಸುಸ್ವಾಮಿಯೇ ಹೆಚ್ಚುಮಂದಿ ಜನರನ್ನು ಶಿಷ್ಯರನ್ನಾಗಿಸಿಕೊಳ್ಳುತ್ತಾ, ಅವರಿಗೆ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಾ ಇದ್ದಾರೆಂಬ ವಾರ್ತೆ ಫರಿಸಾಯರ ಕಿವಿಗೆ ಬಿದ್ದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "4:1"}, {"n": 7, "q": "ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಶಿಷ್ಯರು (ಯೇಸುವಲ್ಲ)", "r": "4:2"}, {"n": 8, "q": "ಯೊವಾನ್ನ 4:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "(ವಾಸ್ತವವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಮಾಡಿಸುತ್ತಿದ್ದವರು ಯೇಸುವಿನ ಶಿಷ್ಯರೇ ಹೊರತು ಯೇಸುವಲ್ಲ).", "r": "4:2"}, {"n": 9, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ವಾರ್ತೆ ಬಿದ್ದುದನ್ನು ತಿಳಿದು ಯೇಸು ಯಾವ ನಾಡನ್ನು ಬಿಟ್ಟು ಎಲ್ಲಿಗೆ ಹೊರಟರು?", "a": "ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:3"}, {"n": 10, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟರು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:3"}, {"n": 11, "q": "“ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "4:3"}, {"n": 12, "q": "ಯೊವಾನ್ನ 4:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಇದನ್ನು ತಿಳಿದು ಜುದೇಯವನ್ನು ಬಿಟ್ಟು ಮತ್ತೆ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.", "r": "4:3"}, {"n": 13, "q": "ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೋಗುವ ದಾರಿಯಲ್ಲಿ ಯೇಸು ಯಾವ ಪ್ರಾಂತ್ಯವನ್ನು ಹಾದುಹೋಗಬೇಕಾಗಿತ್ತು?", "a": "ಸಮಾರಿಯ ಪ್ರಾಂತ್ಯವನ್ನು", "r": "4:4"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾರಿಯಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪ್ರಾಂತ್ಯವನ್ನು ಹಾದುಹೋಗಬೇಕಾಗಿತ್ತು.”", "a": "ಸಮಾರಿಯ", "r": "4:4"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದಾರಿಯಲ್ಲಿ ಸಮಾರಿಯ ಪ್ರಾಂತ್ಯವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹಾದುಹೋಗಬೇಕಾಗಿತ್ತು", "r": "4:4"}, {"n": 16, "q": "ಯೇಸು ಸಮಾರಿಯದ ಯಾವ ಊರನ್ನು ತಲುಪಿದರು?", "a": "ಸಿಖಾರ್", "r": "4:5"}, {"n": 17, "q": "ಸಿಖಾರ್ ಊರಿನ ಪಕ್ಕದಲ್ಲಿ ಏನಿದೆ?", "a": "ಯಕೋಬನು ತನ್ನ ಮಗನಾದ ಜೋಸೆಫನಿಗೆ ಕೊಟ್ಟ ಭೂಮಿ", "r": "4:5"}, {"n": 18, "q": "ಯಕೋಬನು ಸಿಖಾರಿನ ಬಳಿಯ ಭೂಮಿಯನ್ನು ಯಾರಿಗೆ ಕೊಟ್ಟನು?", "a": "ತನ್ನ ಮಗನಾದ ಜೋಸೆಫನಿಗೆ", "r": "4:5"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಹೋಗುತ್ತಿರುವಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಿಖಾರೆಂಬ ಊರನ್ನು ತಲುಪಿದರು.”", "a": "ಸಮಾರಿಯದ", "r": "4:5"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಊರಿನ ಪಕ್ಕದಲ್ಲೇ ಯಕೋಬನು ತನ್ನ ಮಗನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟ ಭೂಮಿ ಇದೆ.”", "a": "ಜೋಸೆಫನಿಗೆ", "r": "4:5"}, {"n": 21, "q": "“ಯೇಸು ಹೋಗುತ್ತಿರುವಾಗ ಸಮಾರಿಯದ ಸಿಖಾರೆಂಬ ಊರನ್ನು ತಲುಪಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "4:5"}, {"n": 22, "q": "ಸಿಖಾರಿನ ಬಳಿ ಇರುವ ಬಾವಿ ಯಾರದು?", "a": "ಯಕೋಬನ ಬಾವಿ", "r": "4:6"}, {"n": 23, "q": "ಯೇಸು ಬಾವಿಯ ಬಳಿ ಏಕೆ ಕುಳಿತುಕೊಂಡರು?", "a": "ಪಯಣದಿಂದ ಬಳಲಿದ್ದರಿಂದ", "r": "4:6"}, {"n": 24, "q": "ಯೇಸು ಯಕೋಬನ ಬಾವಿಯ ಬಳಿ ಕುಳಿತಾಗ ಸಮಯ ಎಷ್ಟಾಗಿತ್ತು?", "a": "ಸುಮಾರು ಮಧ್ಯಾಹ್ನದ ಹೊತ್ತು", "r": "4:6"}, {"n": 25, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಎರಡು ಮಧ್ಯಾಹ್ನದ ಹೊತ್ತುಗಳು ಯಾವುವು?", "a": "ಯೇಸು ಯಕೋಬನ ಬಾವಿಯ ಬಳಿ ಕುಳಿತ ಹೊತ್ತು (4:6); ಅಧಿಕಾರಿಯ ಮಗನ ಜ್ವರ ಬಿಟ್ಟ ಹೊತ್ತು — ಮಧ್ಯಾಹ್ನ ಒಂದು ಗಂಟೆ (4:52)", "r": "4:6; 4:52"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾವಿಯೂ ಇದೆ.”", "a": "ಯಕೋಬನ", "r": "4:6"}, {"n": 27, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಯಣದಿಂದ ಬಳಲಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಾವಿಯ ಬಳಿ ಕುಳಿತುಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "4:6"}, {"n": 28, "q": "ಯಕೋಬನ ಬಾವಿಗೆ ನೀರು ಸೇದಲು ಬಂದವರು ಯಾರು?", "a": "ಒಬ್ಬ ಸಮಾರಿಯದ ಮಹಿಳೆ", "r": "4:7"}, {"n": 29, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಕುಡಿಯಲು ಕೊಂಚ ನೀರು ಕೊಡು”", "r": "4:7"}, {"n": 30, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವಿನೊಡನೆ ಮಾತನಾಡುವಾಗ ಯೇಸುವನ್ನು ಕುರಿತು ಕ್ರಮವಾಗಿ ಏನೆಂದು ಗುರುತಿಸಿಕೊಂಡಳು?", "a": "ಯೆಹೂದ್ಯ (4:9) → ಸ್ವಾಮೀ (4:15) → ಪ್ರವಾದಿ (4:19) → ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು? (4:29)", "r": "4:7; 4:9; 4:15; 4:17"}, {"n": 31, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಿಳೆ ನೀರು ಸೇದಲು ಅಲ್ಲಿಗೆ ಬಂದಳು.”", "a": "ಸಮಾರಿಯದ", "r": "4:7"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕುಡಿಯಲು ಕೊಂಚ ನೀರು ಕೊಡು, ಎಂದು ಕೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:7"}, {"n": 33, "q": "“ಒಬ್ಬ ಸಮಾರಿಯದ ಮಹಿಳೆ ನೀರು ಸೇದಲು ಅಲ್ಲಿಗೆ ಬಂದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "4:7"}, {"n": 34, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ ಮಾತನಾಡುತ್ತಿದ್ದಾಗ ಶಿಷ್ಯರು ಎಲ್ಲಿಗೆ ಹೋಗಿದ್ದರು?", "a": "ಊರಿನೊಳಗೆ (ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ)", "r": "4:8"}, {"n": 35, "q": "ಶಿಷ್ಯರು ಊರಿನೊಳಗೆ ಹೋದದ್ದು ಏಕೆ, ಹಿಂದಿರುಗಿದ ಮೇಲೆ ಅವರು ಯೇಸುವಿಗೆ ಏನು ಒತ್ತಾಯಿಸಿದರು?", "a": "ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ; “ಗುರುದೇವಾ, ಊಟಮಾಡಿ”", "r": "4:8; 4:31–33"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.”", "a": "ತರುವುದಕ್ಕೆ", "r": "4:8"}, {"n": 37, "q": "“ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "4:8"}, {"n": 38, "q": "ಯೊವಾನ್ನ 4:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು ಊಟಕ್ಕೆ ಏನಾದರೂ ಕೊಂಡು ತರುವುದಕ್ಕೆ ಊರಿನೊಳಗೆ ಹೋಗಿದ್ದರು.", "r": "4:8"}, {"n": 39, "q": "ಯೇಸು ನೀರು ಕೇಳಿದಾಗ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನೆಂದಳು?", "a": "“ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು ಸಮಾರಿಯದವಳು. ಹೀಗಿರುವಲ್ಲಿ ನೀವು ನನ್ನಿಂದ ನೀರು ಕೇಳಬಹುದೇ?”", "r": "4:9"}, {"n": 40, "q": "ಯೆಹೂದ್ಯನಾದ ಯೇಸು ನೀರು ಕೇಳಿದ್ದು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಆಶ್ಚರ್ಯವಾದದ್ದು ಏಕೆ?", "a": "ಯೆಹೂದ್ಯರಿಗೂ ಸಮಾರಿಯದವರಿಗೂ ಹೊಕ್ಕುಬಳಕೆ ಇರಲಿಲ್ಲ", "r": "4:9"}, {"n": 41, "q": "“ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು ಸಮಾರಿಯದವಳು” ಎಂದು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವಿಗೆ", "r": "4:9"}, {"n": 42, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ನೀವು ಯೆಹೂದ್ಯರು, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಮಾರಿಯದವಳು", "r": "4:9"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ನನ್ನಿಂದ ನೀರು ಕೇಳಬಹುದೇ?”", "a": "ಹೀಗಿರುವಲ್ಲಿ", "r": "4:9"}, {"n": 44, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯಾವ ಎರಡನ್ನು ಅರಿತಿದ್ದರೆ ಯೇಸುವಿನಲ್ಲಿ ಬೇಡುತ್ತಿದ್ದಳು?", "a": "ದೇವರು ಕೊಡುವ ವರದಾನವನ್ನು ಮತ್ತು ಕುಡಿಯಲು ನೀರು ಕೇಳುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು", "r": "4:10"}, {"n": 45, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಏನನ್ನು ಕೊಡುತ್ತಿದ್ದರು ಎಂದು ಹೇಳಿದರು?", "a": "ಜೀವಜಲವನ್ನು", "r": "4:10"}, {"n": 46, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಂದಿಗಿನ ಸಂಭಾಷಣೆಯಲ್ಲಿ ಯೇಸು ಕೊಡುವ ‘ನೀರು’ ಏನನ್ನು ತರುತ್ತದೆ?", "a": "ನಿತ್ಯಜೀವವನ್ನು (ಅದು ಜೀವಜಲ)", "r": "4:10; 4:14"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರು ಕೊಡುವ ವರದಾನವನ್ನು ಮತ್ತು ಕುಡಿಯಲು ನಿನ್ನಿಂದ ನೀರು ಕೇಳುತ್ತಿರುವ ವ್ಯಕ್ತಿಯನ್ನು ನೀನು ಅರಿತಿದ್ದರೆ ಆಗ ನೀನೇ ಆತನಲ್ಲಿ ಬೇಡುತ್ತಿದ್ದೆ.”", "a": "ಯೇಸು", "r": "4:10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ನಿನಗೆ ಜೀವಜಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಕೊಡುತ್ತಿದ್ದನು", "r": "4:10"}, {"n": 49, "q": "ಜೀವಜಲದ ಬಗ್ಗೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಹೀಗಿರುವಲ್ಲಿ ನಿಮಗೆ ಜೀವಜಲ ಎಲ್ಲಿಂದ ಬಂದೀತು?”", "r": "4:11"}, {"n": 50, "q": "ಯೇಸು ಜೀವಜಲ ಕೊಡಲಾರರು ಎಂಬುದಕ್ಕೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಕೊಟ್ಟ ಎರಡು ಕಾರಣಗಳು ಯಾವುವು?", "a": "1) ನೀರು ಸೇದುವುದಕ್ಕೆ ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ; 2) ಬಾವಿಯೂ ಆಳವಾಗಿದೆ", "r": "4:11"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ನೀರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ, ಬಾವಿಯೂ ಆಳವಾಗಿದೆ;”", "a": "ಸೇದುವುದಕ್ಕೆ", "r": "4:11"}, {"n": 52, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ಜೀವಜಲ ಎಲ್ಲಿಂದ ಬಂದೀತು?”", "a": "ಹೀಗಿರುವಲ್ಲಿ", "r": "4:11"}, {"n": 53, "q": "“ಅದಕ್ಕೆ ಆಕೆ, ನೀರು ಸೇದುವುದಕ್ಕೆ ನಿಮ್ಮಲ್ಲಿ ಏನೂ ಇಲ್ಲ, ಬಾವಿಯೂ ಆಳವಾಗಿದೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "4:11"}, {"n": 54, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯ ಪ್ರಕಾರ ಅವರಿಗೆ ಬಾವಿಯನ್ನು ಕೊಟ್ಟವನು ಯಾರು?", "a": "ನಮ್ಮ ಪಿತಾಮಹ ಯಕೋಬನು", "r": "4:12"}, {"n": 55, "q": "ಯಕೋಬನ ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದವರು ಯಾರು ಎಂದು ಸಮಾರಿಯದ ಮಹಿಳೆ ಹೇಳಿದಳು?", "a": "ಯಕೋಬನು, ಆತನ ಮಕ್ಕಳು ಮತ್ತು ದನಕರುಗಳು", "r": "4:12"}, {"n": 56, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯೇಸುವನ್ನು ಯಕೋಬನಿಗೆ ಹೋಲಿಸಿ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅಂಥ ಪಿತಾಮಹನಿಗಿಂತ ತಾವು ದೊಡ್ಡವರೋ?”", "r": "4:12"}, {"n": 57, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಯಕೋಬನನ್ನು ಏನೆಂದು ಕರೆದಳು?", "a": "ನಮ್ಮ ಪಿತಾಮಹ", "r": "4:12"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೆ ಈ ಬಾವಿಯನ್ನು ಕೊಟ್ಟವನು ನಮ್ಮ ಪಿತಾಮಹ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯಕೋಬನು", "r": "4:12"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು, ಆತನ ಮಕ್ಕಳು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದೇ ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದರು.”", "a": "ದನಕರುಗಳು", "r": "4:12"}, {"n": 60, "q": "ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಏನಾಗುತ್ತದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ", "r": "4:13"}, {"n": 61, "q": "ಯಕೋಬನ ಬಾವಿಯ ನೀರಿಗೂ ಯೇಸು ಕೊಡುವ ನೀರಿಗೂ ಇರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಬಾವಿಯ ನೀರನ್ನು ಕುಡಿದವರಿಗೆ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ; ಯೇಸು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "4:13–14"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.”", "a": "ಯೇಸು", "r": "4:13"}, {"n": 63, "q": "“ಆಗ ಯೇಸು, ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "4:13"}, {"n": 64, "q": "ಯೊವಾನ್ನ 4:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಈ ನೀರನ್ನು ಕುಡಿಯುವ ಎಲ್ಲರಿಗೂ ಮತ್ತೆ ದಾಹವಾಗುತ್ತದೆ.", "r": "4:13"}, {"n": 65, "q": "ಯೇಸು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಏನಾಗುತ್ತದೆ?", "a": "ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "4:14"}, {"n": 66, "q": "ಯೇಸು ಕೊಡುವ ನೀರು ಕುಡಿದವನಲ್ಲಿ ಏನಾಗುತ್ತದೆ?", "a": "ಉಕ್ಕಿ ಹರಿಯುವ ಬುಗ್ಗೆಯಾಗಿ ನಿತ್ಯಜೀವವನ್ನು ತರುತ್ತದೆ", "r": "4:14"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾನು ಕೊಡುವ ನೀರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದಿಗೂ ದಾಹವಾಗದು;”", "a": "ಕುಡಿದವನಿಗೆ", "r": "4:14"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ನೀರು ಅವನಲ್ಲಿ ಉಕ್ಕಿ ಹರಿಯುವ ಬುಗ್ಗೆಯಾಗಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತರುತ್ತದೆ, ಎಂದು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "4:14"}, {"n": 69, "q": "“ಆದರೆ ನಾನು ಕೊಡುವ ನೀರನ್ನು ಕುಡಿದವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "4:14"}, {"n": 70, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನೆಂದು ಬೇಡಿದಳು?", "a": "“ಸ್ವಾಮೀ, ಅಂಥ ನೀರನ್ನು ಕೊಡಿ; ಇನ್ನು ಮುಂದೆ ನನಗೆ ದಾಹವಾಗದಿರಲಿ.”", "r": "4:15"}, {"n": 71, "q": "ಜೀವಜಲ ಪಡೆದರೆ ತನಗೆ ಏನು ತಪ್ಪುತ್ತದೆ ಎಂದು ಮಹಿಳೆ ಭಾವಿಸಿದಳು?", "a": "ನೀರು ಸೇದಲು ಇಷ್ಟು ದೂರ ಬರುವುದು", "r": "4:15"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆಕೆ, ಸ್ವಾಮೀ, ಅಂಥ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಡಿ;”", "a": "ನೀರನ್ನು", "r": "4:15"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮುಂದೆ ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಾಹವಾಗದಿರಲಿ", "r": "4:15"}, {"n": 74, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀರು ಸೇದಲು ಇಷ್ಟು ದೂರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಪ್ಪಲಿ, ಎಂದಳು.”", "a": "ಬರುವುದು", "r": "4:15"}, {"n": 75, "q": "ಜೀವಜಲ ಕೇಳಿದ ಮಹಿಳೆಗೆ ಯೇಸು ಏನು ಮಾಡಲು ಹೇಳಿದರು?", "a": "“ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ”", "r": "4:16"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:16"}, {"n": 77, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "4:16"}, {"n": 78, "q": "ಯೊವಾನ್ನ 4:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ,” ಎಂದು ಹೇಳಿದರು.", "r": "4:16"}, {"n": 79, "q": "“ಹೋಗಿ ನಿನ್ನ ಗಂಡನನ್ನು ಕರೆದುಕೊಂಡು ಬಾ” ಎಂದಾಗ ಮಹಿಳೆ ಏನು ಹೇಳಿದಳು?", "a": "“ನನಗೆ ಗಂಡನಿಲ್ಲ”", "r": "4:17"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಕೆ, ನನಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದಳು.”", "a": "ಗಂಡನಿಲ್ಲ", "r": "4:17"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನಗೆ ಗಂಡನಿಲ್ಲ, ಎಂದಳು.”", "a": "ಆಕೆ", "r": "4:17"}, {"n": 82, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಎಷ್ಟು ಜನ ಗಂಡಂದಿರು ಇದ್ದರು?", "a": "ಐದು", "r": "4:18"}, {"n": 83, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ ಈಗ ಇರುವವನ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "ಅವನು ಅವಳ ಗಂಡನಲ್ಲ", "r": "4:18"}, {"n": 84, "q": "ಮಹಿಳೆ “ನನಗೆ ಗಂಡನಿಲ್ಲ” ಎಂದಾಗ ಯೇಸು ಏನೆಂದರು?", "a": "“ಗಂಡನಿಲ್ಲವೆಂದು ಸರಿಯಾಗಿ ಹೇಳಿದೆ”", "r": "4:18"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಐದು ಜನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದರು.”", "a": "ಗಂಡಂದಿರು", "r": "4:18"}, {"n": 86, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗ ನಿನ್ನೊಡನೆ ಇರುವವನು ನಿನ್ನ ಗಂಡನಲ್ಲ, ನೀನು ಹೇಳಿದ್ದು ಸರಿಯೇ, ಎಂದರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "4:18"}, {"n": 87, "q": "ಯೇಸು ತನ್ನ ಜೀವನದ ಬಗ್ಗೆ ಹೇಳಿದ ನಂತರ ಮಹಿಳೆ ಯೇಸುವನ್ನು ಏನೆಂದು ಗುರುತಿಸಿದಳು?", "a": "ಪ್ರವಾದಿ", "r": "4:19"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಯಿತು", "r": "4:19"}, {"n": 89, "q": "“ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ ತಿಳಿಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "4:19"}, {"n": 90, "q": "ಯೊವಾನ್ನ 4:19 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಆ ಮಹಿಳೆ, “ಸ್ವಾಮೀ, ತಾವು ಪ್ರವಾದಿ ಎಂದು ನನಗೀಗ ತಿಳಿಯಿತು.", "r": "4:19"}, {"n": 91, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಯ ಪೂರ್ವಜರು ದೇವರನ್ನು ಎಲ್ಲಿ ಆರಾಧಿಸುತ್ತಿದ್ದರು?", "a": "ಈ ಬೆಟ್ಟದ ಮೇಲೆ", "r": "4:20"}, {"n": 92, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಆರಾಧಿಸತಕ್ಕ ಕ್ಷೇತ್ರ ಎಲ್ಲಿದೆ?", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲೇ", "r": "4:20"}, {"n": 93, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಪೂರ್ವಜರು ಈ ಬೆಟ್ಟದ ಮೇಲೆ ದೇವರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆರಾಧಿಸುತ್ತಿದ್ದರು", "r": "4:20"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಆರಾಧಿಸತಕ್ಕ ಕ್ಷೇತ್ರ ಇರುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಯೆಹೂದ್ಯರಾದ ನೀವು ಹೇಳುತ್ತೀರಲ್ಲ ಎಂದಳು.”", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲೇ", "r": "4:20"}, {"n": 95, "q": "“ನಮ್ಮ ಪೂರ್ವಜರು ಈ ಬೆಟ್ಟದ ಮೇಲೆ ದೇವರನ್ನು ಆರಾಧಿಸುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "4:20"}, {"n": 96, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದರು?", "a": "“ತಾಯಿ”", "r": "4:21"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಮುಂದೆ ಪಿತನ ಆರಾಧನೆಗೆ ಎಲ್ಲಿಗೆ ಹೋಗಬೇಕಾಗಿಲ್ಲ?", "a": "ಈ ಬೆಟ್ಟಕ್ಕೂ ಬರಬೇಕಾಗಿಲ್ಲ; ಜೆರುಸಲೇಮಿಗೂ ಹೋಗಬೇಕಾಗಿಲ್ಲ", "r": "4:21"}, {"n": 98, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಾಯಿ, ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳು.”", "a": "ಯೇಸು", "r": "4:21"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ ಆರಾಧನೆಗೆ ಈ ಬೆಟ್ಟಕ್ಕೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಬರಬೇಕಾಗಿಲ್ಲ", "r": "4:21"}, {"n": 100, "q": "“ಆಗ ಯೇಸು, ತಾಯಿ, ನಾನು ಹೇಳುವುದನ್ನು ಕೇಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "4:21"}, {"n": 101, "q": "ಯೆಹೂದ್ಯರಿಗೆ ತಾವು ಆರಾಧಿಸುವುದು ಯಾರೆಂದು ತಿಳಿದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಲೋಕೋದ್ಧಾರಕ ಬರುವುದು ಯೆಹೂದ್ಯರಿಂದಲೇ", "r": "4:22"}, {"n": 102, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕ ಯಾರಿಂದ ಬರುವನು?", "a": "ಯೆಹೂದ್ಯರಿಂದಲೇ", "r": "4:22"}, {"n": 103, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ನಿಮಗೇ ತಿಳಿಯದು.”", "a": "ಆರಾಧಿಸುವುದು", "r": "4:22"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ನಮಗೆ ತಿಳಿದಿದೆ.”", "a": "ಆರಾಧಿಸುವುದು", "r": "4:22"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ ಲೋಕೋದ್ಧಾರಕ ಬರುವುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಯೆಹೂದ್ಯರಿಂದಲೇ", "r": "4:22"}, {"n": 106, "q": "ನಿಜವಾದ ಆರಾಧಕರು ಪಿತನನ್ನು ಹೇಗೆ ಆರಾಧಿಸುವರು?", "a": "ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ", "r": "4:23"}, {"n": 107, "q": "ಪಿತ ಯಾವ ರೀತಿಯ ಆರಾಧಕರನ್ನು ಆಶಿಸುತ್ತಾರೆ?", "a": "ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವ ನಿಜವಾದ ಆರಾಧಕರನ್ನು", "r": "4:23"}, {"n": 108, "q": "ನಿಜವಾದ ಆರಾಧಕರು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವ ಕಾಲ ಯಾವಾಗ ಬಂದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಈಗಲೇ ಬಂದಿದೆ", "r": "4:23"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ಮೇಲೆ ನಿಜವಾದ ಆರಾಧಕರು ಪಿತನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸುವರು.”", "a": "ಆತ್ಮದಿಂದಲೂ", "r": "4:23"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವರೇ ತಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತ ಆಶಿಸುತ್ತಾರೆ.”", "a": "ಆರಾಧಿಸಬೇಕೆಂದು", "r": "4:23"}, {"n": 111, "q": "ದೇವರ ಸ್ವರೂಪದ ಬಗ್ಗೆ ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ.”", "r": "4:24"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದರು.”", "a": "ಆರಾಧಿಸತಕ್ಕದ್ದು", "r": "4:24"}, {"n": 113, "q": "“ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸತಕ್ಕದ್ದು, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "4:24"}, {"n": 114, "q": "ಯೊವಾನ್ನ 4:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ. ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸತಕ್ಕದ್ದು,” ಎಂದು ಹೇಳಿದರು.", "r": "4:24"}, {"n": 115, "q": "ಲೋಕೋದ್ಧಾರಕನ ಬಗ್ಗೆ ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನು ಬಲ್ಲವಳಾಗಿದ್ದಳು?", "a": "“ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ. ಆತನು ಬಂದಾಗ ಎಲ್ಲವನ್ನೂ ತಿಳಿಸುವನು”", "r": "4:25"}, {"n": 116, "q": "ಲೋಕೋದ್ಧಾರಕನು ಬಂದಾಗ ಏನು ಮಾಡುವನೆಂದು ಮಹಿಳೆ ಹೇಳಿದಳು?", "a": "ಎಲ್ಲವನ್ನೂ ತಿಳಿಸುವನು", "r": "4:25"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಅಭಿಷಿಕ್ತನಾದ", "r": "4:25"}, {"n": 118, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಬಂದಾಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸುವನು, ಎಂದು ಹೇಳಿದಳು.”", "a": "ಎಲ್ಲವನ್ನೂ", "r": "4:25"}, {"n": 119, "q": "“ಆಕೆ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಬರುವನೆಂದು ನಾನು ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "4:25"}, {"n": 120, "q": "ಯೇಸು ತಾವೇ ಲೋಕೋದ್ಧಾರಕನೆಂದು ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಹೇಗೆ ತಿಳಿಸಿದರು?", "a": "“ನ
