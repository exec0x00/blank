ರ್ಣಗೊಳಿಸಿ: “ಅವರೆಲ್ಲರೂ ತಿಂದು ತೃಪ್ತರಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನೆಲ್ಲಾ ಒಟ್ಟುಗೂಡಿಸಿರಿ;”", "a": "ಯೇಸು", "r": "6:12"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ತುಂಡೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಮ್ಮ ಶಿಷ್ಯರಿಗೆ ಹೇಳಿದರು.”", "a": "ಹಾಳಾಗಬಾರದು", "r": "6:12"}, {"n": 49, "q": "ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಿದಾಗ ಎಷ್ಟು ಬುಟ್ಟಿಗಳು ತುಂಬಿದವು?", "a": "ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು", "r": "6:13"}, {"n": 50, "q": "ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳಲ್ಲಿ ತುಂಬಿದ್ದು ಯಾವ ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳು?", "a": "ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳು", "r": "6:13"}, {"n": 51, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವು ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳ ತುಂಬಾ ಆದವು.”", "a": "ಒಟ್ಟುಗೂಡಿಸಲು", "r": "6:13"}, {"n": 52, "q": "“ತಿಂದುಳಿದ ಆ ಐದು ರೊಟ್ಟಿಗಳ ತುಂಡುಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಲು ಅವು ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳ ತುಂಬಾ ಆದವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "6:13"}, {"n": 53, "q": "ಯೇಸು ಮಾಡಿದ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕಂಡ ಜನರು ಏನೆಂದು ಹೇಳತೊಡಗಿದರು?", "a": "“ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ”", "r": "6:14"}, {"n": 54, "q": "ಸೂಚಕಕಾರ್ಯವನ್ನು ಕಂಡ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಕರೆದರು ಮತ್ತು ಏನನ್ನಾಗಿ ಮಾಡಬಯಸಿದರು?", "a": "‘ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ’ ಎಂದು ಕರೆದರು; ಅರಸನನ್ನಾಗಿ ಮಾಡಬಯಸಿದರು", "r": "6:14; 6:15"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ ಈ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಕಂಡ ಜನರು, ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ, ಎಂದು ಹೇಳತೊಡಗಿದ್ದರು.”", "a": "ಯೇಸು", "r": "6:14"}, {"n": 56, "q": "“ಯೇಸು ಮಾಡಿದ ಈ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಕಂಡ ಜನರು, ಲೋಕಕ್ಕೆ ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ನಿಜವಾಗಿಯೂ ಇವರೇ, ಎಂದು ಹೇಳತೊಡಗಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 14", "r": "6:14"}, {"n": 57, "q": "ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಏಕೆ ಹೊರಟುಬಿಟ್ಟರು?", "a": "ಜನರು ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಅರಿತುದರಿಂದ", "r": "6:15"}, {"n": 58, "q": "ಜನರು ಯೇಸುವನ್ನು ಏನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದರು?", "a": "ಅರಸನನ್ನಾಗಿ", "r": "6:15"}, {"n": 59, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೆಲ್ಲರೂ ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬುದನ್ನು ಅರಿತ ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಹೊರಟುಬಿಟ್ಟರು.”", "a": "ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ", "r": "6:15"}, {"n": 60, "q": "“ಅವರೆಲ್ಲರೂ ಬಂದು ತಮ್ಮನ್ನು ಹಿಡಿದು ಅರಸನನ್ನಾಗಿ ಮಾಡುವ ಯೋಚನೆಯಲ್ಲಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಅರಿತ ಯೇಸು ತಾವೊಬ್ಬರೇ ಬೆಟ್ಟದ ಕಡೆಗೆ ಹೊರಟುಬಿಟ್ಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "6:15"}, {"n": 61, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:16ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ನೀರಿನ ಮೇಲೆ ನಡೆ", "r": "6:16"}, {"n": 62, "q": "ಸಾಯಂಕಾಲ ಶಿಷ್ಯರು ದೋಣಿಯನ್ನು ಹತ್ತಿ ಎಲ್ಲಿಗೆ ಸಾಗಿದರು?", "a": "ಕಫೆರ್ನವುಮಿನ ಕಡೆ", "r": "6:16–17"}, {"n": 63, "q": "ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಯಾವಾಗ ಹೋದರು?", "a": "ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ", "r": "6:16"}, {"n": 64, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಹೋಗಿ”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:16"}, {"n": 65, "q": "“ಸಾಯಂಕಾಲವಾದ ಮೇಲೆ ಯೇಸುಸ್ವಾಮಿಯ ಶಿಷ್ಯರು ಸರೋವರಕ್ಕೆ ಹೋಗಿ” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "6:16"}, {"n": 66, "q": "ಶಿಷ್ಯರು ದೋಣಿಯಲ್ಲಿ ಸಾಗುತ್ತಿದ್ದಾಗ ಯಾವ ಸ್ಥಿತಿ ಇತ್ತು?", "a": "ಆಗಲೇ ಕತ್ತಲು ಕವಿದಿತ್ತು; ಯೇಸು ಅವರ ಬಳಿಗೆ ಇನ್ನೂ ಬಂದಿರಲಿಲ್ಲ", "r": "6:17"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೋಣಿಯನ್ನು ಹತ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಡೆ ಸಾಗಿದರು.”", "a": "ಕಫೆರ್ನವುಮಿನ", "r": "6:17"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಬಳಿಗೆ ಇನ್ನೂ ಬಂದಿರಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "6:17"}, {"n": 69, "q": "ಶಿಷ್ಯರು ದೋಣಿಯಲ್ಲಿದ್ದಾಗ ಸರೋವರಕ್ಕೆ ಏನಾಯಿತು?", "a": "ರಭಸವಾದ ಗಾಳಿ ಬೀಸತೊಡಗಿ ಸರೋವರವು ಅಲ್ಲೋಲಕಲ್ಲೋಲವಾಯಿತು", "r": "6:18"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ ರಭಸವಾದ ಗಾಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೀಸತೊಡಗಿತು", "r": "6:18"}, {"n": 71, "q": "ಯೊವಾನ್ನ 6:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಷ್ಟರಲ್ಲಿ ರಭಸವಾದ ಗಾಳಿ ಬೀಸತೊಡಗಿತು. ಸರೋವರವು ಅಲ್ಲೋಲಕಲ್ಲೋಲವಾಯಿತು.", "r": "6:18"}, {"n": 72, "q": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುತ್ತಿರುವುದು ಕಾಣಿಸುವ ಮೊದಲು ಶಿಷ್ಯರು ಎಷ್ಟು ದೂರ ಹುಟ್ಟು ಹಾಕಿರಬೇಕು?", "a": "ಐದು ಆರು ಕಿಲೋಮೀಟರಿನಷ್ಟು", "r": "6:19"}, {"n": 73, "q": "ಶಿಷ್ಯರಿಗೆ ಏನು ಕಾಣಿಸಿತು?", "a": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುತ್ತಾ ದೋಣಿಯನ್ನು ಸಮೀಪಿಸುತ್ತಿರುವುದು", "r": "6:19"}, {"n": 74, "q": "ಯೇಸು ನೀರಿನ ಮೇಲೆ ನಡೆಯುವುದನ್ನು ನೋಡಿ ಶಿಷ್ಯರು ಏನಾದರು?", "a": "ಹೆದರಿದರು", "r": "6:19"}, {"n": 75, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಐದು ಆರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಟ್ಟು ಹಾಕಿರಬೇಕು.”", "a": "ಕಿಲೋಮೀಟರಿನಷ್ಟು", "r": "6:19"}, {"n": 76, "q": "ಹೆದರಿದ ಶಿಷ್ಯರಿಗೆ ಯೇಸು ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ; ಅಂಜಬೇಡಿ”", "r": "6:20"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ;”", "a": "ಯೇಸು", "r": "6:20"}, {"n": 78, "q": "“ಆಗ ಯೇಸು, ನಾನೇ, ಇನ್ಯಾರೂ ಅಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "6:20"}, {"n": 79, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ದೋಣಿಯೊಳಕ್ಕೆ ಬರಮಾಡಿಕೊಳ್ಳುವಷ್ಟರಲ್ಲಿ ಏನಾಯಿತು?", "a": "ದೋಣಿಯು ಸೇರಬೇಕಾಗಿದ್ದ ದಡವನ್ನು ತಲುಪಿತು", "r": "6:21"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು ಅವರನ್ನು ದೋಣಿಯೊಳಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುವುದರಲ್ಲಿದ್ದರು", "r": "6:21"}, {"n": 81, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ, ದೋಣಿಯು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಡವನ್ನು ತಲುಪಿತು.”", "a": "ಸೇರಬೇಕಾಗಿದ್ದ", "r": "6:21"}, {"n": 82, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:22ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜನಪ್ರಿಯ ಯೇಸು", "r": "6:22"}, {"n": 83, "q": "ಹಿಂದಿನ ದಿನ ಸರೋವರದ ಆಚೆಕಡೆ ಎಷ್ಟು ದೋಣಿ ಇದ್ದುದನ್ನು ಜನರು ನೋಡಿದ್ದರು?", "a": "ಒಂದೇ ಒಂದು ದೋಣಿ", "r": "6:22"}, {"n": 84, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಜನರಿಗೆ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ಯೇಸು ಶಿಷ್ಯರೊಡನೆ ದೋಣಿಯನ್ನು ಹತ್ತಲಿಲ್ಲ; ಶಿಷ್ಯರು ಮಾತ್ರ ಹೊರಟು ಹೋಗಿದ್ದಾರೆ ಎಂದು", "r": "6:22"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೆರೆದಿದ್ದ ಜನರು ಮಾರನೆಯ ದಿನವೂ ಸರೋವರದ ಆಚೆಕಡೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಉಳಿದಿದ್ದರು", "r": "6:22"}, {"n": 86, "q": "ಯಾವ ಊರಿನಿಂದ ಹೊರಟಿದ್ದ ದೋಣಿಗಳು ಅಲ್ಲಿಗೆ ಬಂದು ಸೇರಿದವು?", "a": "ತಿಬೇರಿಯದಿಂದ", "r": "6:23"}, {"n": 87, "q": "ತಿಬೇರಿಯದ ದೋಣಿಗಳು ಬಂದು ಸೇರಿದ ಸ್ಥಳದ ಪಕ್ಕದಲ್ಲಿ ಏನಿತ್ತು?", "a": "ಪ್ರಭುವು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ ಜನರಿಗೆ ರೊಟ್ಟಿ ಬಡಿಸಿದ್ದ ಸ್ಥಳ", "r": "6:23"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೊರಟಿದ್ದ ದೋಣಿಗಳು ಅಷ್ಟು ಹೊತ್ತಿಗೆ ಅಲ್ಲಿಗೆ ಬಂದು ಸೇರಿದವು.”", "a": "ತಿಬೇರಿಯದಿಂದ", "r": "6:23"}, {"n": 89, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರಭುವು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ, ಜನರಿಗೆ ರೊಟ್ಟಿ ಬಡಿಸಿದ್ದ ಸ್ಥಳ ಅಲ್ಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಕ್ಕದಲ್ಲಿತ್ತು", "r": "6:23"}, {"n": 90, "q": "ಜನರು ದೋಣಿಗಳನ್ನು ಹತ್ತಿ ಯೇಸುವನ್ನು ಹುಡುಕುತ್ತಾ ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಕಫೆರ್ನವುಮಿಗೆ", "r": "6:24"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಆಗಲಿ, ಅವರ ಶಿಷ್ಯರಾಗಲಿ ಇಲ್ಲದ್ದನ್ನು ನೋಡಿ ಜನರು ಆ ದೋಣಿಗಳನ್ನು ಹತ್ತಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹುಡುಕುತ್ತಾ ಕಫೆರ್ನವುಮಿಗೆ ಬಂದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "6:24"}, {"n": 92, "q": "“ಯೇಸು ಆಗಲಿ, ಅವರ ಶಿಷ್ಯರಾಗಲಿ ಇಲ್ಲದ್ದನ್ನು ನೋಡಿ ಜನರು ಆ ದೋಣಿಗಳನ್ನು ಹತ್ತಿ ಯೇಸುವನ್ನು ಹುಡುಕುತ್ತಾ ಕಫೆರ್ನವುಮಿಗೆ ಬಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "6:24"}, {"n": 93, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:25ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ", "r": "6:25"}, {"n": 94, "q": "ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಯೇಸುವನ್ನು ಕಂಡ ಜನರು ಏನು ಕೇಳಿದರು?", "a": "“ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?”", "r": "6:25"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಕಂಡೊಡನೆ, ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?”", "a": "ಯೇಸುಸ್ವಾಮಿಯನ್ನು", "r": "6:25"}, {"n": 96, "q": "“ಜನರು ಯೇಸುಸ್ವಾಮಿಯನ್ನು ಸರೋವರದ ಆಚೆದಡದಲ್ಲಿ ಕಂಡೊಡನೆ, ಗುರುದೇವಾ, ತಾವಿಲ್ಲಿಗೆ ಬಂದುದು ಯಾವಾಗ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "6:25"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಅವರನ್ನು ಹುಡುಕಿಕೊಂಡು ಬಂದದ್ದು ಏಕೆ?", "a": "ಹೊಟ್ಟೆತುಂಬುವಷ್ಟು ರೊಟ್ಟಿ ಸಿಕ್ಕಿದ್ದರಿಂದ (ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ ಅಲ್ಲ)", "r": "6:26"}, {"n": 98, "q": "ಯೇಸು ಜನರಿಗೆ ಹೇಳಿದಂತೆ ಅವರು ಯಾವುದರಿಂದ ಅವರನ್ನು ಹುಡುಕಿಕೊಂಡು ಬರಲಿಲ್ಲ?", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ", "r": "6:26"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "6:26"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನನ್ನನ್ನು ಹುಡುಕಿಕೊಂಡು ಬಂದದ್ದು ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ, ಹೊಟ್ಟೆತುಂಬುವಷ್ಟು ರೊಟ್ಟಿ ಸಿಕ್ಕಿದ್ದರಿಂದ.”", "a": "ಗ್ರಹಿಸಿಕೊಂಡಿದ್ದರಿಂದ", "r": "6:26"}, {"n": 101, "q": "ಯೇಸು ಯಾವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಬೇಡಿ, ಯಾವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ ಎಂದರು?", "a": "ಅಳಿದುಹೋಗುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಬೇಡಿ; ಉಳಿಯುವ ಮತ್ತು ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ", "r": "6:27"}, {"n": 102, "q": "ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ಆಹಾರವನ್ನು ನೀಡುವವನು ಯಾರು?", "a": "ನರಪುತ್ರನೇ", "r": "6:27"}, {"n": 103, "q": "ಪಿತನಾದ ದೇವರು ನರಪುತ್ರನ ಮೇಲೆ ಏನನ್ನು ಒತ್ತಿದ್ದಾರೆ?", "a": "ತಮ್ಮ ಅಧಿಕಾರ ಮುದ್ರೆಯನ್ನು", "r": "6:27"}, {"n": 104, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಉಳಿಯುವ ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈಯುವ ಆಹಾರಕ್ಕಾಗಿ ದುಡಿಯಿರಿ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "6:27"}, {"n": 105, "q": "ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳ ಬಗ್ಗೆ ಜನರು ಏನು ಕೇಳಿದರು?", "a": "“ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳನ್ನು ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?”", "r": "6:28"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಆ ಜನರು, ದೇವರು ಮೆಚ್ಚುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?”", "a": "ಕಾರ್ಯಗಳನ್ನು", "r": "6:28"}, {"n": 107, "q": "“ಆಗ ಆ ಜನರು, ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯಗಳನ್ನು ನಾವು ಮಾಡಬೇಕಾದರೆ, ಏನು ಮಾಡಬೇಕು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "6:28"}, {"n": 108, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ದೇವರು ಮೆಚ್ಚುವ ಕಾರ್ಯ ಯಾವುದು?", "a": "ದೇವರು ಕಳುಹಿಸಿದಾತನನ್ನು ವಿಶ್ವಾಸಿಸುವುದು", "r": "6:29"}, {"n": 109, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದೇವರು ಕಳುಹಿಸಿದಾತನನ್ನು ನೀವು ವಿಶ್ವಾಸಿಸಬೇಕು.”", "a": "ಯೇಸು", "r": "6:29"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದೇ ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾರ್ಯ, ಎಂದರು.”", "a": "ಮೆಚ್ಚುವ", "r": "6:29"}, {"n": 111, "q": "ಜನರು ಯೇಸುವಿನಿಂದ ಏಕೆ ಸೂಚಕಕಾರ್ಯವನ್ನು ಕೇಳಿದರು?", "a": "ತಾವು ನೋಡಿ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವಂತೆ", "r": "6:30–31"}, {"n": 112, "q": "ಜನರು ಯೇಸುವಿಗೆ ಕೇಳಿದ ಸೂಚಕಕಾರ್ಯದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಯಾವ ಸೂಚಕಕಾರ್ಯವನ್ನು ತೋರಿಸುವಿರಿ?”", "r": "6:30"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ನಾವು ನೋಡಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸ ಇಡುವಂತೆ ನೀವು ಏನು ಮಾಡುವಿರಿ?”", "a": "ನಿಮ್ಮಲ್ಲಿ", "r": "6:30"}, {"n": 114, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ನಾವು ನೋಡಿ ನಿಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವಂತೆ ನೀವು ಏನು ಮಾಡುವಿರಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "6:30"}, {"n": 115, "q": "ಜನರ ಪ್ರಕಾರ ಅವರ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಏನು ಸಿಕ್ಕಿತು?", "a": "‘ಮನ್ನಾ’ (ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ)", "r": "6:31"}, {"n": 116, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ‘ಮನ್ನಾ’ವನ್ನು ಉಲ್ಲೇಖಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "6:31, 6:49, 6:58", "r": "6:31; 6:49; 6:58"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮ್ಮ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಮನ್ನಾ ಸಿಕ್ಕಿತು, ತಿನ್ನಲು ಅವರಿಗೆ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ ದೊರಕಿತು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುತ್ತದೆಯಲ್ಲವೇ", "r": "6:31"}, {"n": 118, "q": "“ನಮ್ಮ ಪೂರ್ವಜರಿಗೆ ಮರುಭೂಮಿಯಲ್ಲಿ ತಿನ್ನಲು ಮನ್ನಾ ಸಿಕ್ಕಿತು, ತಿನ್ನಲು ಅವರಿಗೆ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿ ದೊರಕಿತು, ಎಂದು ಪವಿತ್ರಗ್ರಂಥವೇ ಹೇಳುತ್ತದೆಯಲ್ಲವೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "6:31"}, {"n": 119, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸ್ವರ್ಗದಿಂದ ರೊಟ್ಟಿಯನ್ನು ಕೊಟ್ಟವನು ಯಾರು ಅಲ್ಲ?", "a": "ಮೋಶೆಯಲ್ಲ", "r": "6:32"}, {"n": 120, "q": "ಸ್ವರ್ಗದಿಂದ ನಿಜವಾದ ರೊಟ್ಟಿಯನ್ನು ಕೊಡುವವರು ಯಾರು?", "a": "ಯೇಸುವಿನ ಪಿತನೇ", "r": "6:32"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ;”", "a": "ಯೇಸು", "r": "6:32"}, {"n": 122, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ನಿಮಗೆ ರೊಟ್ಟಿಯನ್ನು ಕೊಟ್ಟವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಮೋಶೆಯಲ್ಲ", "r": "6:32"}, {"n": 123, "q": "ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ ಯಾರು?", "a": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ", "r": "6:33"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ", "r": "6:33"}, {"n": 125, "q": "“ಏಕೆಂದರೆ, ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದು ಲೋಕಕ್ಕೆ ಸಜ್ಜೀವವನ್ನೀಯುವಾತನೇ ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "6:33"}, {"n": 126, "q": "ದೇವರು ಕೊಡುವ ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಕೇಳಿದ ಜನರು ಏನೆಂದು ಬೇಡಿದರು?", "a": "“ಅಂಥಾ ರೊಟ್ಟಿಯನ್ನೇ ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ”", "r": "6:34"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ಅಂಥಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ, ಎಂದು ಕೇಳಿದರು.”", "a": "ರೊಟ್ಟಿಯನ್ನೇ", "r": "6:34"}, {"n": 128, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ಅಂಥಾ ರೊಟ್ಟಿಯನ್ನೇ ನಮಗೆ ಯಾವಾಗಲೂ ಕೊಡಿ, ಎಂದು ಕೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "6:34"}, {"n": 129, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಜೀವದಾಯಕ ರೊಟ್ಟಿ ಎಂದು ಘೋಷಿಸಿದ ವಚನ ಯಾವುದು?", "a": "“ನಾನೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ, ನನ್ನ ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು; ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು.”", "r": "6:35"}, {"n": 130, "q": "ಯೇಸುವಿನ ಬಳಿ ಬರುವವನಿಗೆ ಮತ್ತು ಅವರಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಏನಾಗದು?", "a": "ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು; ವಿಶ್ವಾಸವಿಡುವವನಿಗೆ ಎಂದಿಗೂ ದಾಹವಾಗದು", "r": "6:35"}, {"n": 131, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು ತಮ್ಮನ್ನು ರೊಟ್ಟಿಗೆ ಹೋಲಿಸಿಕೊಂಡ ಮೂರು ರೀತಿಗಳು ಯಾವುವು?", "a": "ಜೀವದಾಯಕ ರೊಟ್ಟಿ (6:35, 48); ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ (6:41); ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿ (6:51)", "r": "6:35; 6:41; 6:48; 6:51"}, {"n": 132, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನೇ ಜೀವದಾಯಕ ರೊಟ್ಟಿ, ನನ್ನ ಬಳಿ ಬರುವವನಿಗೆ ಹಸಿವೇ ಇರದು;”", "a": "ಯೇಸು", "r": "6:35"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಜನರು ಅವರನ್ನು ನೋಡಿಯೂ ಏನು ಮಾಡಲಿಲ್ಲ?", "a": "ವಿಶ್ವಾಸಿಸಲಿಲ್ಲ", "r": "6:36"}, {"n": 134, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ, ನಾನು ನಿಮಗೆ ಹೇಳಿದಂತೆ, ನೀವು ನನ್ನನ್ನು ನೋಡಿಯೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದೀರಿ.”", "a": "ವಿಶ್ವಾಸಿಸದೆ", "r": "6:36"}, {"n": 135, "q": "“ಆದರೆ, ನಾನು ನಿಮಗೆ ಹೇಳಿದಂತೆ, ನೀವು ನನ್ನನ್ನು ನೋಡಿಯೂ ವಿಶ್ವಾಸಿಸದೆ ಇದ್ದೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "6:36"}, {"n": 136, "q": "ಪಿತನು ಯೇಸುವಿಗೆಂದು ಕೊಟ್ಟಿರುವ ಪ್ರತಿಯೊಬ್ಬನೂ ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಯೇಸುವಿನಲ್ಲಿಗೆ ಬರುತ್ತಾನೆ", "r": "6:37"}, {"n": 137, "q": "ತಮ್ಮಲ್ಲಿಗೆ ಬರುವವನನ್ನು ಯೇಸು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ಎಂದಿಗೂ ತಳ್ಳಿಬಿಡುವುದಿಲ್ಲ", "r": "6:37"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ನನಗೆಂದು ಕೊಟ್ಟಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನಲ್ಲಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಪ್ರತಿಯೊಬ್ಬನೂ", "r": "6:37"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನಲ್ಲಿಗೆ ಬರುವವನನ್ನು ನಾನೆಂದಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಳ್ಳಿಬಿಡುವುದಿಲ್ಲ", "r": "6:37"}, {"n": 140, "q": "ಯೇಸು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ಯಾವುದಕ್ಕಾಗಿ?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ (ತಮ್ಮ ಇಚ್ಛೆಯಂತೆ ನಡೆಯುವುದಕ್ಕಲ್ಲ)", "r": "6:38"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ನನ್ನ ಇಚ್ಛೆಯಂತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ.”", "a": "ನಡೆಯುವುದಕ್ಕಲ್ಲ", "r": "6:38"}, {"n": 142, "q": "“ನಾನು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದುದು ನನ್ನ ಇಚ್ಛೆಯಂತೆ ನಡೆಯುವುದಕ್ಕಲ್ಲ, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತದಂತೆ ನಡೆಯುವುದಕ್ಕೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "6:38"}, {"n": 143, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವೇನು?", "a": "ಅವರು ಯೇಸುವಿಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ ಕಳೆದುಕೊಳ್ಳದೆ ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು", "r": "6:39"}, {"n": 144, "q": "“ಅಂತಿಮ ದಿನದಂದು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸುತ್ತೇನೆ” ಎಂಬ ವಾಗ್ದಾನ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಎಷ್ಟು ಬಾರಿ ಬರುತ್ತದೆ?", "a": "ನಾಲ್ಕು ಬಾರಿ (6:39, 40, 44, 54)", "r": "6:39; 6:40; 6:44; 6:54"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ನನಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ನಾನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು.”", "a": "ಕಳೆದುಕೊಳ್ಳದೆ", "r": "6:39"}, {"n": 146, "q": "“ಅವರು ನನಗೆ ಕೊಟ್ಟವರಲ್ಲಿ ಒಬ್ಬನನ್ನೂ ಕಳೆದುಕೊಳ್ಳದೆ ಅಂತಿಮ ದಿನದಂದು ಅವರೆಲ್ಲರನ್ನೂ ನಾನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸಬೇಕು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "6:39"}, {"n": 147, "q": "ಯೇಸುವಿನ ಪಿತನ ಸಂಕಲ್ಪ ಏನು?", "a": "ಪುತ್ರನನ್ನು ಕಂಡು ಆತನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯಬೇಕು", "r": "6:40"}, {"n": 148, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನನ್ನು ಕಂಡು ಆತನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುವ ಪ್ರತಿಯೊಬ್ಬನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯಬೇಕೆಂಬುದೇ ನನ್ನ ಪಿತನ ಸಂಕಲ್ಪ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "6:40"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂಥವನನ್ನು ಅಂತಿಮ ದಿನದಂದು ನಾನು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:40"}, {"n": 150, "q": "ಯೆಹೂದ್ಯರು ಏಕೆ ಗೊಣಗತೊಡಗಿದರು?", "a": "“ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ” ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ", "r": "6:41"}, {"n": 151, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಗೊಣಗುಟ್ಟಿದ ಎರಡು ಗುಂಪುಗಳು ಯಾರು?", "a": "ಯೆಹೂದ್ಯರು (6:41) ಮತ್ತು ಯೇಸುವಿನ ಶಿಷ್ಯರು (6:61)", "r": "6:41; 6:43; 6:61"}, {"n": 152, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ಗೊಣಗತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "6:41"}, {"n": 153, "q": "“ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ನಾನೇ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದಕ್ಕೆ ಯೆಹೂದ್ಯರು ಗೊಣಗತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "6:41"}, {"n": 154, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿನ ಕುಟುಂಬದ ಬಗ್ಗೆ ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ಈತನು ಜೋಸೆಫನ ಮಗನಾದ ಯೇಸು ಅಲ್ಲವೆ? ಈತನ ತಂದೆ ತಾಯಿ ನಮಗೆ ಗೊತ್ತಿಲ್ಲವೆ?”", "r": "6:42"}, {"n": 155, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸು ಏನೆಂದು ಹೇಳುವುದಾದರೂ ಹೇಗೆ?", "a": "‘ನಾನು ಸ್ವರ್ಗದಿಂದ ಬಂದಿದ್ದೇನೆ’", "r": "6:42"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ಈತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಗನಾದ ಯೇಸು ಅಲ್ಲವೆ?”", "a": "ಜೋಸೆಫನ", "r": "6:42"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನ ತಂದೆ ತಾಯಿ ನಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಗೊತ್ತಿಲ್ಲವೆ", "r": "6:42"}, {"n": 158, "q": "ಗೊಣಗುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರಿಗೆ ಯೇಸು ಏನೆಂದರು?", "a": "“ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ ಗೊಣಗುಟ್ಟದಿರಿ.”", "r": "6:43"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ ಗೊಣಗುಟ್ಟದಿರಿ.”", "a": "ಯೇಸು", "r": "6:43"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಯೇಸು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗೊಣಗುಟ್ಟದಿರಿ.”", "a": "ನಿಮ್ಮನಿಮ್ಮೊಳಗೆ", "r": "6:43"}, {"n": 161, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯಾರೂ ಅವರ ಬಳಿಗೆ ಯಾವಾಗ ಬಾರರು?", "a": "ಅವರನ್ನು ಕಳುಹಿಸಿಕೊಟ್ಟ ಪಿತನು ಅವರತ್ತ ಸೆಳೆಯದ ಹೊರತು", "r": "6:44"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತನು, ನನ್ನತ್ತ ಸೆಳೆಯದ ಹೊರತು, ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬಾರರು.”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟ", "r": "6:44"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಂದವರನ್ನು ನಾನು ಅಂತಿಮ ದಿನದಂದು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:44"}, {"n": 164, "q": "‘ದೇವರಿಂದಲೇ ಅವರೆಲ್ಲರೂ ಬೋಧನೆ ಪಡೆಯುವರು’ ಎಂದು ಎಲ್ಲಿ ಬರೆದಿದೆ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಪ್ರವಾದಿಗಳ ಗ್ರಂಥದಲ್ಲಿ", "r": "6:45"}, {"n": 165, "q": "ಯೇಸುವಿನ ಬಳಿಗೆ ಬರುವವನು ಯಾರು?", "a": "ಪಿತನಿಗೆ ಕಿವಿಗೊಟ್ಟು ಅವರಿಂದಲೇ ಕಲಿತುಕೊಂಡ ಪ್ರತಿ ಒಬ್ಬನೂ", "r": "6:45"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರಿಂದಲೇ ಅವರೆಲ್ಲರೂ ಬೋಧನೆ ಪಡೆಯುವರು, ಎಂದು ಪ್ರವಾದಿಗಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರೆದಿದೆ.”", "a": "ಗ್ರಂಥದಲ್ಲಿ", "r": "6:45"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಂದಲೇ ಕಲಿತುಕೊಂಡ ಪ್ರತಿ ಒಬ್ಬನೂ ನನ್ನ ಬಳಿಗೆ ಬರುತ್ತಾನೆ.”", "a": "ಕಿವಿಗೊಟ್ಟು", "r": "6:45"}, {"n": 168, "q": "ಪಿತನನ್ನು ಕಂಡಿರುವವನು ಯಾರು?", "a": "ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ", "r": "6:46"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆಂದ ಮಾತ್ರಕ್ಕೆ ಪಿತನನ್ನು ಯಾರಾದರೂ ಕಣ್ಣಾರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದಲ್ಲ, ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ ಪಿತನನ್ನು ಕಂಡಿದ್ದಾನೆ.”", "a": "ಕಂಡಿದ್ದಾರೆ", "r": "6:46"}, {"n": 170, "q": "“ಹಾಗೆಂದ ಮಾತ್ರಕ್ಕೆ ಪಿತನನ್ನು ಯಾರಾದರೂ ಕಣ್ಣಾರೆ ಕಂಡಿದ್ದಾರೆ ಎಂದಲ್ಲ, ದೇವರಿಂದ ಬಂದಿರುವ ಒಬ್ಬನು ಮಾತ್ರ ಪಿತನನ್ನು ಕಂಡಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "6:46"}, {"n": 171, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವ ಯಾರಲ್ಲಿ ಇದೆ?", "a": "ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ", "r": "6:47"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವ ಇದೆಯೆಂದು ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ.”", "a": "ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ", "r": "6:47"}, {"n": 173, "q": "“ವಿಶ್ವಾಸವುಳ್ಳವನಲ್ಲಿ ನಿತ್ಯಜೀವ ಇದೆಯೆಂದು ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "6:47"}, {"n": 174, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 6:48ರ ಮೂರು ಪದಗಳ ವಚನ ಯಾವುದು?", "a": "“ಜೀವದಾಯಕ ರೊಟ್ಟಿ ನಾನೇ.”", "r": "6:48"}, {"n": 175, "q": "ಮರಳುಗಾಡಿನಲ್ಲಿ ‘ಮನ್ನಾ’ವನ್ನು ತಿಂದ ಪೂರ್ವಜರಿಗೆ ಏನಾಯಿತು?", "a": "ಸಾವಿಗೆ ತುತ್ತಾದರು", "r": "6:49"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪೂರ್ವಜರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮನ್ನಾವನ್ನು ತಿಂದರು;”", "a": "ಮರಳುಗಾಡಿನಲ್ಲಿ", "r": "6:49"}, {"n": 177, "q": "“ನಿಮ್ಮ ಪೂರ್ವಜರು ಮರಳುಗಾಡಿನಲ್ಲಿ ಮನ್ನಾವನ್ನು ತಿಂದರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "6:49"}, {"n": 178, "q": "ಮನ್ನಾ ಮತ್ತು ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಮನ್ನಾ ತಿಂದವರು ಸಾವಿಗೆ ತುತ್ತಾದರು; ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯನ್ನು ತಿನ್ನುವ ಯಾರಿಗೂ ಸಾವೆಂಬುದು ಇಲ್ಲ", "r": "6:50"}, {"n": 179, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಾಗಲ್ಲ.”", "a": "ರೊಟ್ಟಿಯಾದರೋ", "r": "6:50"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ತಿನ್ನುವ ಯಾರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಲ್ಲ.”", "a": "ಸಾವೆಂಬುದು", "r": "6:50"}, {"n": 181, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ಕೊಡುವ ರೊಟ್ಟಿ ಯಾವುದು?", "a": "ಲೋಕೋದ್ಧಾರಕ್ಕಾಗಿ ಅವರು ಅರ್ಪಿಸುವ ಅವರ ಮಾಂಸವೇ", "r": "6:51"}, {"n": 182, "q": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿಯನ್ನು ತಿಂದವನು ಎಷ್ಟು ಕಾಲ ಬಾಳುತ್ತಾನೆ?", "a": "ಚಿರಕಾಲ", "r": "6:51"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ಜೀವಂತ ರೊಟ್ಟಿ.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "6:51"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದವನು ಚಿರಕಾಲ ಬಾಳುತ್ತಾನೆ.”", "a": "ರೋಟ್ಟಿಯನ್ನು", "r": "6:51"}, {"n": 185, "q": "ಯೇಸುವಿನ ಮಾಂಸದ ಬಗ್ಗೆ ವಾಗ್ವಾದದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಏನೆಂದು ಕೇಳತೊಡಗಿದರು?", "a": "“ಈತನು ತನ್ನ ಮಾಂಸವನ್ನು ತಿನ್ನಲು ಹೇಗೆ ಕೊಟ್ಟಾನು?”", "r": "6:52"}, {"n": 186, "q": "ಯೇಸುವಿನ ಮಾಂಸದ ಮಾತಿನಿಂದ ಯೆಹೂದ್ಯರಲ್ಲಿ ಏನು ಉಂಟಾಯಿತು?", "a": "ತೀವ್ರ ವಾಗ್ವಾದ", "r": "6:52"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟಕ್ಕೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀವ್ರ ವಾಗ್ವಾದ ಉಂಟಾಯಿತು.”", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿ", "r": "6:52"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿನ್ನಲು ಹೇಗೆ ಕೊಟ್ಟಾನು?”", "a": "ಮಾಂಸವನ್ನು", "r": "6:52"}, {"n": 189, "q": "ನರಪುತ್ರನ ಮಾಂಸವನ್ನು ತಿನ್ನದೆ, ರಕ್ತವನ್ನು ಕುಡಿಯದೆ ಹೋದರೆ ಏನಾಗುವುದು?", "a": "ಜನರಲ್ಲಿ ಜೀವ ಇರುವುದಿಲ್ಲ", "r": "6:53"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ:”", "a": "ಯೇಸು", "r": "6:53"}, {"n": 191, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ನರಪುತ್ರನ ಮಾಂಸವನ್ನು ತಿನ್ನದೆ, ಆತನ ರಕ್ತವನ್ನು ಕುಡಿಯದೆ ಹೋದರೆ ನಿಮ್ಮಲ್ಲಿ ಜೀವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇರುವುದಿಲ್ಲ", "r": "6:53"}, {"n": 192, "q": "ಯೇಸುವಿನ ಮಾಂಸವನ್ನು ತಿಂದು ರಕ್ತವನ್ನು ಕುಡಿಯುವವನಿಗೆ ಯೇಸು ಯಾವ ಎರಡು ವಾಗ್ದಾನಗಳನ್ನು ಕೊಟ್ಟರು?", "a": "ಅವನಲ್ಲಿ ನಿತ್ಯಜೀವ ಇರುತ್ತದೆ; ಅಂತಿಮ ದಿನದಂದು ಯೇಸು ಅವನನ್ನು ಜೀವಕ್ಕೆ ಎಬ್ಬಿಸುತ್ತಾರೆ", "r": "6:54"}, {"n": 193, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು ನನ್ನ ರಕ್ತವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವ ಇರುತ್ತದೆ.”", "a": "ಕುಡಿಯುವವನಲ್ಲಿ", "r": "6:54"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ ಅಂತಿಮ ದಿನದಂದು ನಾನು ಅವನನ್ನು ಜೀವಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎಬ್ಬಿಸುತ್ತೇನೆ", "r": "6:54"}, {"n": 195, "q": "ಯೇಸು ತಮ್ಮ ಮಾಂಸ ಮತ್ತು ರಕ್ತದ ಬಗ್ಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನನ್ನ ಮಾಂಸವೇ ನಿಜವಾದ ಆಹಾರ; ನನ್ನ ರಕ್ತವೇ ನಿಜವಾದ ಪಾನ.”", "r": "6:55"}, {"n": 196, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜವಾದ ಆಹಾರ;”", "a": "ಮಾಂಸವೇ", "r": "6:55"}, {"n": 197, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಜವಾದ ಪಾನ.”", "a": "ರಕ್ತವೇ", "r": "6:55"}, {"n": 198, "q": "ಯೇಸುವಿನ ಮಾಂಸವನ್ನು ತಿಂದು ರಕ್ತವನ್ನು ಕುಡಿಯುವವನಿಗೂ ಯೇಸುವಿಗೂ ಇರುವ ಸಂಬಂಧವೇನು?", "a": "ಅವನು ಯೇಸುವಿನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾನೆ; ಯೇಸು ಅವನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾರೆ", "r": "6:56"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು, ನನ್ನ ರಕ್ತವನ್ನು ಕುಡಿಯುವವನು ನನ್ನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಲೆಸಿರುತ್ತಾನೆ", "r": "6:56"}, {"n": 200, "q": "“ನನ್ನ ಮಾಂಸವನ್ನು ತಿಂದು, ನನ್ನ ರಕ್ತವನ್ನು ಕುಡಿಯುವವನು ನನ್ನಲ್ಲಿ ನೆಲೆಸಿರುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 56", "r": "6:56"}, {"n": 201, "q": "ಯೇಸು ಪಿತನಿಂದ ಜೀವಿಸುವಂತೆಯೇ ಯಾರು ಯೇಸುವಿನಿಂದ ಜೀವಿಸುತ್ತಾನೆ?", "a": "ಯೇಸುವನ್ನು ಭುಜಿಸುವವನು", "r": "6:57"}, {"n": 202, "q": "ಯೇಸು ಪಿತನನ್ನು ಏನೆಂದು ವರ್ಣಿಸಿದರು?", "a": "ಜೀವಸ್ವರೂಪಿ ಆದ ಪಿತನು", "r": "6:57"}, {"n": 203, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೀವಸ್ವರೂಪಿ ಆದ ಪಿತನು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿಕೊಟ್ಟಿರುವರು", "r": "6:57"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ ನನ್ನನ್ನು ಭುಜಿಸುವವನು ನನ್ನಿಂದಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಜೀವಿಸುತ್ತಾನೆ", "r": "6:57"}, {"n": 205, "q": "ಸ್ವರ್ಗದಿಂದ ಇಳಿದು ಬಂದ ರೊಟ್ಟಿಯನ್ನು ತಿನ್ನುವವನು ಹೇಗೆ ಬಾಳುವನು?", "a": "ಚಿರಕಾಲ ಬಾಳುವನು", "r": "6:58"}, {"n": 206, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಳಿದು ಬಂದ ರೊಟ್ಟಿ ಇದೇ.”", "a": "ಸ್ವರ್ಗದಿಂದ", "r": "6:58"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ಪೂರ್ವಜರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದರೂ ಸಾವಿಗೆ ತುತ್ತಾದರು.”", "a": "ಮನ್ನಾವನ್ನು", "r": "6:58"}, {"n": 208, "q": "ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಯೇಸು ಬೋಧನೆ ಮಾಡಿದ್ದು ಎಲ್ಲಿ?", "a": "ಕಫೆರ್ನವುಮಿನ ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ", "r": "6:59"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಫೆರ್ನವುಮಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸು ಬೋಧನೆ ಮಾಡುತ್ತಿದ್ದಾಗ ಆಡಿದ ಮಾತುಗಳಿವು.”", "a": "ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ", "r": "6:59"}, {"n": 210, "q": "“ಕಫೆರ್ನವುಮಿನ ಪ್ರಾರ್ಥನಾಮಂದಿರದಲ್ಲಿ ಯೇಸು ಬೋಧನೆ ಮಾಡುತ್ತಿದ್ದಾಗ ಆಡಿದ ಮಾತುಗಳಿವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 59", "r": "6:59"}, {"n": 211, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:60ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜೀವದಾಯಕ ನುಡಿ", "r": "6:60"}, {"n": 212, "q": "ಯೇಸುವಿನ ಬೋಧನೆಯ ಬಗ್ಗೆ ಅವರ ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು ಏನೆಂದು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "“ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?”", "r": "6:60"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು, ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:60"}, {"n": 214, "q": "“ಯೇಸುಸ್ವಾಮಿಯ ಶಿಷ್ಯರಲ್ಲಿ ಹಲವರು, ಇವು ಕಟುವಾದ ಮಾತುಗಳು, ಇವನ್ನು ಯಾರುತಾನೆ ಕೇಳಿಯಾರು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 60", "r": "6:60"}, {"n": 215, "q": "ಶಿಷ್ಯರು ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು ಅರಿತ ಯೇಸು ಏನು ಕೇಳಿದರು?", "a": "“ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?”", "r": "6:61"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ವಿಷಯವಾಗಿ ತಮ್ಮ ಶಿಷ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸು ತಾವಾಗಿಯೇ ಅರಿತು, ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?”", "a": "ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು", "r": "6:61"}, {"n": 217, "q": "“ಈ ವಿಷಯವಾಗಿ ತಮ್ಮ ಶಿಷ್ಯರು ಗೊಣಗುಟ್ಟುತ್ತಿರುವುದನ್ನು ಯೇಸು ತಾವಾಗಿಯೇ ಅರಿತು, ಇಷ್ಟು ಮಾತ್ರಕ್ಕೆ ನೀವು ಕಂಗೆಡಬೇಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 61", "r": "6:61"}, {"n": 218, "q": "ಶಿಷ್ಯರು ನರಪುತ್ರನು ಏನು ಮಾಡುವುದನ್ನು ಕಂಡಾಗ ಏನನ್ನುವರು ಎಂದು ಯೇಸು ಕೇಳಿದರು?", "a": "ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ ಏರುವುದನ್ನು", "r": "6:62"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗಾದರೆ ನರಪುತ್ರನು ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಕಂಡಾಗ ಏನನ್ನುವಿರಿ?”", "a": "ಏರುವುದನ್ನು", "r": "6:62"}, {"n": 220, "q": "“ಹಾಗಾದರೆ ನರಪುತ್ರನು ತಾನು ಮೊದಲಿದ್ದ ಸ್ಥಳಕ್ಕೆ ಮರಳಿ ಏರುವುದನ್ನು ನೀವು ಕಂಡಾಗ ಏನನ್ನುವಿರಿ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 62", "r": "6:62"}, {"n": 221, "q": "ಸಜೀವವನ್ನು ಕೊಡುವಂಥಾದ್ದು ಯಾವುದು?", "a": "ದೇವರ ಆತ್ಮವೇ", "r": "6:63"}, {"n": 222, "q": "ಯೇಸುವಿನ ಮಾತುಗಳು ಏನನ್ನು ತರುತ್ತವೆ?", "a": "ಜೀವದಾಯಕ ದೇವರಾತ್ಮವನ್ನು", "r": "6:63"}, {"n": 223, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯಾವುದರಿಂದ ಏನೂ ಆಗದು?", "a": "ನರಮಾಂಸದಿಂದ", "r": "6:63"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರ ಆತ್ಮವೇ.”", "a": "ಕೊಡುವಂಥಾದ್ದು", "r": "6:63"}, {"n": 225, "q": "ಯೇಸುವಿಗೆ ಮೊದಲಿನಿಂದಲೂ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ವಿಶ್ವಾಸವಿಲ್ಲದವರು ಯಾರು, ತಮ್ಮನ್ನು ಹಿಡಿದುಕೊಡುವ ಗುರುದ್ರೋಹಿ ಯಾರು ಎಂದು", "r": "6:64"}, {"n": 226, "q": "“ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ…” — ಯೇಸುವಿನ ಈ ಮಾತನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.", "a": "“… ವಿಶ್ವಾಸವಿಲ್ಲ”", "r": "6:64"}, {"n": 227, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದರು.”", "a": "ವಿಶ್ವಾಸವಿಲ್ಲ", "r": "6:64"}, {"n": 228, "q": "“ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರಿಗೆ ವಿಶ್ವಾಸವಿಲ್ಲ, ಎಂದು ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 64", "r": "6:64"}, {"n": 229, "q": "ಯಾರು ಯೇಸುವಿನ ಬಳಿಗೆ ಬರಲಾರರು ಎಂದು ಯೇಸು ಹಿಂದೆ ಹೇಳಿದ್ದರು?", "a": "‘ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು’", "r": "6:65"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು, ಎಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತೆ ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "6:65"}, {"n": 231, "q": "“ಪಿತನು ಅನುಗ್ರಹಿಸಿದ ಹೊರತು ಯಾರೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರರು, ಎಂದು ನಾನು ಹೇಳಿದುದು ಇದಕ್ಕಾಗಿಯೇ, ಎಂದು ಯೇಸು ಮತ್ತೆ ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 65", "r": "6:65"}, {"n": 232, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 6:66ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪೇತ್ರನ ವಿಶ್ವಾಸ ಪ್ರಮಾಣ", "r": "6:66"}, {"n": 233, "q": "ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬೋಧನೆಯ ನಂತರ ಯೇಸುವಿನ ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಏನು ಮಾಡಿದರು?", "a": "ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟುಬಿಟ್ಟರು; ಹೋದವರು ಹಿಂದಿರುಗಿ ಬರಲಿಲ್ಲ", "r": "6:66"}, {"n": 234, "q": "ಯೇಸುವಿನ ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಯಾವಾಗಿನಿಂದ ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟರು?", "a": "ಅಂದಿನಿಂದ (ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬೋಧನೆಯ ನಂತರ)", "r": "6:66"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದಿನಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಂಬಾಲಕರಲ್ಲಿ ಹಲವರು ಅವರ ಸಹವಾಸವನ್ನು ಬಿಟ್ಟುಬಿಟ್ಟರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "6:66"}, {"n": 236, "q": "ಯೇಸು ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?”", "r": "6:67"}, {"n": 237, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ, ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?”", "a": "ಯೇಸು", "r": "6:67"}, {"n": 238, "q": "“ಆಗ ಯೇಸು ಹನ್ನೆರಡು ಮಂದಿ ಶಿಷ್ಯರಿಗೆ, ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 67", "r": "6:67"}, {"n": 239, "q": "“ನೀವು ಕೂಡ ಹೋಗಬೇಕೆಂದು ಇದ್ದೀರಾ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಸಿಮೋನ ಪೇತ್ರನ ಉತ್ತರದ ಆರಂಭ ಏನು?", "a": "“ಪ್ರಭುವೇ, ನಾವು ಹೋಗುವುದಾದರೂ ಯಾರ ಬಳಿಗೆ?”", "r": "6:68"}, {"n": 240, "q": "ಪೇತ್ರನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ನುಡಿ ಎಲ್ಲಿದೆ?", "a": "ಯೇಸುವಿನಲ್ಲೇ (“ತಮ್ಮಲ್ಲೇ”)", "r": "6:68"}, {"n": 241, "q": "ಪೇತ್ರನ ವಿಶ್ವಾಸ ಪ್ರಮಾಣದಲ್ಲಿ ಯೇಸುವನ್ನು ಕುರಿತು ಅವನು ಹೇಳಿದ ಎರಡು ವಿಷಯಗಳು ಯಾವುವು?", "a": "1) ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ನುಡಿ ಇರುವುದು ತಮ್ಮಲ್ಲೇ; 2) ತಾವೇ ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು", "r": "6:68–69"}, {"n": 242, "q": "ಸಿಮೋನ ಪೇತ್ರನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಪ್ರಭುವೇ”", "r": "6:68"}, {"n": 243, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಸಿಮೋನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪ್ರಭುವೇ, ನಾವು ಹೋಗುವುದಾದರೂ ಯಾರ ಬಳಿಗೆ?”", "a": "ಪೇತ್ರನು", "r": "6:68"}, {"n": 244, "q": "ಪೇತ್ರನು ಯೇಸುವನ್ನು ಏನೆಂದು ಅರಿಕೆ ಮಾಡಿದನು?", "a": "ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು", "r": "6:69"}, {"n": 245, "q": "ಪೇತ್ರನ ಪ್ರಕಾರ “ತಾವೇ ದೇವರಿಂದ ಬಂದ ಪರಮಪೂಜ್ಯರು” ಎಂಬುದು ಶಿಷ್ಯರ ಏನು?", "a": "ವಿಶ್ವಾಸ ಮತ್ತು ಗ್ರಹಿಕೆ", "r": "6:69"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಾವೇ ದೇವರಿಂದ ಬಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪರಮಪೂಜ್ಯರು", "r": "6:69"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೌದು, ಇದೇ ನಮ್ಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮತ್ತು ಗ್ರಹಿಕೆ, ಎಂದು ಹೇಳಿದನು.”", "a": "ವಿಶ್ವಾಸ", "r": "6:69"}, {"n": 248, "q": "ಯೇಸು ಎಷ್ಟು ಮಂದಿಯನ್ನು ಆಯ್ದುಕೊಂಡರು?", "a": "ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು", "r": "6:70"}, {"n": 249, "q": "ತಾವು ಆಯ್ದುಕೊಂಡ ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ ಒಬ್ಬನ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು ಪಿಶಾಚಿಯಾಗಿ ಇದ್ದಾನೆ”", "r": "6:70"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮ್ಮಲ್ಲಿ ಹನ್ನೆರಡು ಮಂದಿಯನ್ನು ನಾನು ಆಯ್ದುಕೊಂಡೆನಲ್ಲವೆ?”", "a": "ಯೇಸು", "r": "6:70"}, {"n": 251, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾನೆ, ಎಂದರು.”", "a": "ಪಿಶಾಚಿಯಾಗಿ", "r": "6:70"}, {"n": 252, "q": "“ನಿಮ್ಮಲ್ಲಿ ಒಬ್ಬನು ಪಿಶಾಚಿಯಾಗಿ ಇದ್ದಾನೆ” ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕುರಿತು ಹೇಳಿದರು?", "a": "ಸಿಮೋನನ ಮಗ ಇಸ್ಕರಿಯೋತಿನ ಯೂದನನ್ನು ಕುರಿತು", "r": "6:71"}, {"n": 253, "q": "ಇಸ್ಕರಿಯೋತಿನ ಯೂದನ ತಂದೆ ಯಾರು?", "a": "ಸಿಮೋನ", "r": "6:71"}, {"n": 254, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೂದನನ್ನು ಏನೆಂದು ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಗುರುದ್ರೋಹಿ", "r": "6:71"}, {"n": 255, "q": "ಇಸ್ಕರಿಯೋತಿನ ಯೂದನು ಎಷ್ಟು ಮಂದಿಯಲ್ಲಿ ಒಬ್ಬನಾಗಿದ್ದನು?", "a": "ಹನ್ನೆರಡು ಮಂದಿಯಲ್ಲಿ", "r": "6:71"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹೀಗೆ ಹೇಳಿದ್ದು ಸಿಮೋನನ ಮಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೂದನನ್ನು ಕುರಿತು.”", "a": "ಇಸ್ಕರಿಯೋತಿನ", "r": "6:71"}]}, {"chapter": 7, "label": "ಅಧ್ಯಾಯ 7", "verses": 53, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಏಳನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಮತ್ತು ಸಹೋದರರು", "r": "7:1"}, {"n": 2, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದ ಆರಂಭದಲ್ಲಿ ಯೇಸು ಎಲ್ಲಿ ಸಂಚರಿಸತೊಡಗಿದರು?", "a": "ಗಲಿಲೇಯದಲ್ಲಿ", "r": "7:1"}, {"n": 3, "q": "ಯೇಸು ಜುದೇಯದಲ್ಲಿ ಸಂಚರಿಸಲು ಏಕೆ ಇಷ್ಟಪಡಲಿಲ್ಲ?", "a": "ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿದ್ದುದರಿಂದ", "r": "7:1"}, {"n": 4, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಂಚರಿಸತೊಡಗಿದರು.”", "a": "ಗಲಿಲೇಯದಲ್ಲಿ", "r": "7:1"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಜುದೇಯದಲ್ಲಿ ಸಂಚರಿಸಲು ಅವರು ಇಷ್ಟಪಡಲಿಲ್ಲ.”", "a": "ಹವಣಿಸುತ್ತಿದ್ದುದರಿಂದ", "r": "7:1"}, {"n": 6, "q": "“ಇದಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ಗಲಿಲೇಯದಲ್ಲಿ ಸಂಚರಿಸತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "7:1"}, {"n": 7, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಹತ್ತಿರವಾಗುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಯಾವುದು?", "a": "ಪರ್ಣಕುಟೀರಗಳ ಹಬ್ಬ", "r": "7:2"}, {"n": 8, "q": "ಪರ್ಣಕುಟೀರಗಳ ಹಬ್ಬ ಯಾರ ಹಬ್ಬ?", "a": "ಯೆಹೂದ್ಯರ", "r": "7:2"}, {"n": 9, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪರ್ಣಕುಟೀರಗಳ ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹತ್ತಿರವಾಗುತ್ತಿತ್ತು", "r": "7:2"}, {"n": 10, "q": "ಯೊವಾನ್ನ 7:2 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರ ಪರ್ಣಕುಟೀರಗಳ ಹಬ್ಬವು ಹತ್ತಿರವಾಗುತ್ತಿತ್ತು. ಯೇಸುವಿನ ಸೋದರರು,", "r": "7:2"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಬ್ಬವು ಹತ್ತಿರವಾಗುತ್ತಿತ್ತು.”", "a": "ಪರ್ಣಕುಟೀರಗಳ", "r": "7:2"}, {"n": 12, "q": "ಯೇಸುವಿನ ಸೋದರರು ಅವರಿಗೆ ಎಲ್ಲಿಗೆ ಹೋಗಲು ಹೇಳಿದರು?", "a": "“ನೀನು ಇಲ್ಲಿಂದ ಜುದೇಯಕ್ಕೆ ಹೋಗು.”", "r": "7:3"}, {"n": 13, "q": "ಯೇಸು ಜುದೇಯಕ್ಕೆ ಹೋಗಬೇಕೆಂದು ಸೋದರರು ಏಕೆ ಹೇಳಿದರು?", "a": "ಅಲ್ಲಿ ಯೇಸು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಅವರ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ ಎಂದು", "r": "7:3"}, {"n": 14, "q": "ಹಬ್ಬಕ್ಕೆ ಹೋಗುವ ಬಗ್ಗೆ ಸೋದರರ ಸಲಹೆ ಮತ್ತು ಯೇಸು ಮಾಡಿದ್ದು ಏನು?", "a": "ಸೋದರರು ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಜುದೇಯಕ್ಕೆ ಹೋಗು ಎಂದರು; ಯೇಸು ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ ಹೋದರು", "r": "7:3; 7:10"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು ಇಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗು.”", "a": "ಜುದೇಯಕ್ಕೆ", "r": "7:3"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿನ್ನ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ.”", "a": "ಮಾಡುವುದನ್ನೆಲ್ಲಾ", "r": "7:3"}, {"n": 17, "q": "ಯೊವಾನ್ನ 7:3 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನೀನು ಇಲ್ಲಿಂದ ಜುದೇಯಕ್ಕೆ ಹೋಗು. ಅಲ್ಲಿ ನೀನು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ನಿನ್ನ ಅನುಯಾಯಿಗಳು ನೋಡಲಿ.", "r": "7:3"}, {"n": 18, "q": "ಸೋದರರ ಪ್ರಕಾರ ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವವನು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ", "r": "7:4"}, {"n": 19, "q": "ಯೇಸು ತಮ್ಮ ಕಾರ್ಯಗಳನ್ನು ಹೇಗೆ ಮಾಡಬೇಕೆಂದು ಸೋದರರು ಹೇಳಿದರು?", "a": "ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ", "r": "7:4"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು, ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.”", "a": "ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ", "r": "7:4"}, {"n": 21, "q": "“ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು, ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 4", "r": "7:4"}, {"n": 22, "q": "ಯೊವಾನ್ನ 7:4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರಖ್ಯಾತನಾಗಬೇಕೆಂದಿರುವ ಯಾರೂ ತನ್ನ ಕಾರ್ಯಗಳನ್ನು ಮರೆಯಲ್ಲಿ ಮಾಡುವುದಿಲ್ಲ, ಇವನ್ನೆಲ್ಲಾ ನೀನು ಮಾಡುವುದಾದರೆ ಲೋಕಕ್ಕೆ ಪ್ರಕಟವಾಗುವಂತೆ ಮಾಡಬೇಕು,” ಎಂದು ಯೇಸುವಿಗೆ ಹೇಳಿದರು.", "r": "7:4"}, {"n": 23, "q": "ಯೇಸುವಿನ ಸೋದರರ ಬಗ್ಗೆ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 7:5 ಏನು ಹೇಳುತ್ತದೆ?", "a": "ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ", "r": "7:5"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.”", "a": "ಸೋದರರಿಗೆ", "r": "7:5"}, {"n": 25, "q": "“ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "7:5"}, {"n": 26, "q": "ಯೊವಾನ್ನ 7:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಸೋದರರಿಗೆ ಕೂಡ ಅವರಲ್ಲಿ ವಿಶ್ವಾಸ ಇರಲಿಲ್ಲ.", "r": "7:5"}, {"n": 27, "q": "ಸಮಯದ ಬಗ್ಗೆ ಯೇಸು ತಮಗೂ ಸೋದರರಿಗೂ ಇರುವ ವ್ಯತ್ಯಾಸವನ್ನು ಹೇಗೆ ಹೇಳಿದರು?", "a": "ತಮಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ; ಸೋದರರಿಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ", "r": "7:6"}, {"n": 28, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ ಸಮಯ ಅಥವಾ ಗಳಿಗೆ ಇನ್ನೂ ಬಂದಿಲ್ಲ ಎಂದು ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "7:6, 7:8, 7:30", "r": "7:6; 7:8; 7:30"}, {"n": 29, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸೋದರರಿಗೆ ಸಮಯ ಹೇಗಿದೆ?", "a": "ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ", "r": "7:6"}, {"n": 30, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.”", "a": "ಯೇಸು", "r": "7:6"}, {"n": 31, "q": "“ಅದಕ್ಕೆ ಯೇಸು, ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "7:6"}, {"n": 32, "q": "ಯೊವಾನ್ನ 7:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಯೇಸು, “ನನಗೆ ಸೂಕ್ತ ಸಮಯ ಇನ್ನೂ ಬಂದಿಲ್ಲ, ನಿಮಗಾದರೋ ಎಲ್ಲಾ ಸಮಯವೂ ಒಂದೇ.", "r": "7:6"}, {"n": 33, "q": "ಲೋಕಕ್ಕೆ ಯೇಸುವಿನ ಮೇಲೆ ಏಕೆ ಹಗೆ ಇದೆ?", "a": "ಅದರ ವರ್ತನೆ ಕೆಟ್ಟದೆಂದು ಯೇಸು ಯಥಾರ್ಥವಾಗಿ ಹೇಳುತ್ತಿದ್ದುದರಿಂದ", "r": "7:7"}, {"n": 34, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಲೋಕಕ್ಕೆ ಯಾರ ಮೇಲೆ ಹಗೆಯಿಲ್ಲ?", "a": "ಸೋದರರ ಮೇಲೆ", "r": "7:7"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕಕ್ಕೆ ನಿಮ್ಮ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹಗೆಯಿಲ್ಲ", "r": "7:7"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಮೇಲೆ.”", "a": "ಹಗೆಯಿರುವುದು", "r": "7:7"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅದರ ವರ್ತನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಯಥಾರ್ಥವಾಗಿ ಹೇಳುತ್ತಾ ಇದ್ದೇನೆ.”", "a": "ಕೆಟ್ಟದೆಂದು", "r": "7:7"}, {"n": 38, "q": "ಹಬ್ಬಕ್ಕೆ ಹೋಗುವ ವಿಷಯದಲ್ಲಿ ಯೇಸು ಸೋದರರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ”", "r": "7:8"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,”", "a": "ಹೋಗುವುದಿಲ್ಲ", "r": "7:8"}, {"n": 40, "q": "“ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "7:8"}, {"n": 41, "q": "ಯೊವಾನ್ನ 7:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಬ್ಬಕ್ಕೆ ನೀವೇ ಹೋಗಿರಿ, ನನಗೆ ಸಮಯವು ಇನ್ನೂ ಬಂದಿಲ್ಲವಾದ ಕಾರಣ ನಾನು ಹಬ್ಬಕ್ಕೆ ಈಗ ಹೋಗುವುದಿಲ್ಲ,”", "r": "7:8"}, {"n": 42, "q": "ಸೋದರರಿಗೆ ಉತ್ತರ ಕೊಟ್ಟ ನಂತರ ಯೇಸು ಎಲ್ಲಿ ಉಳಿದುಕೊಂಡರು?", "a": "ಗಲಿಲೇಯದಲ್ಲೇ", "r": "7:9"}, {"n": 43, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಳಿದುಕೊಂಡರು.”", "a": "ಗಲಿಲೇಯದಲ್ಲೇ", "r": "7:9"}, {"n": 44, "q": "“ಎಂದು ಹೇಳಿ ಯೇಸು ಗಲಿಲೇಯದಲ್ಲೇ ಉಳಿದುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "7:9"}, {"n": 45, "q": "ಯೊವಾನ್ನ 7:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎಂದು ಹೇಳಿ ಯೇಸು ಗಲಿಲೇಯದಲ್ಲೇ ಉಳಿದುಕೊಂಡರು.", "r": "7:9"}, {"n": 46, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:10ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಪರ್ಣಕುಟೀರ ಹಬ್ಬದಲ್ಲಿ ಯೇಸು", "r": "7:10"}, {"n": 47, "q": "ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದ ನಂತರ ಯೇಸು ಹಬ್ಬಕ್ಕೆ ಹೇಗೆ ಹೋದರು?", "a": "ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ", "r": "7:10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "7:10"}, {"n": 49, "q": "ಯೊವಾನ್ನ 7:10 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸುಸ್ವಾಮಿಯ ಸೋದರರು ಹಬ್ಬಕ್ಕೆ ಹೋದರು. ಯೇಸುವೂ ಅಲ್ಲಿಗೆ ಹೋದರು. ಬಹಿರಂಗವಾಗಿ ಅಲ್ಲ, ಗುಟ್ಟಾಗಿ.", "r": "7:10"}, {"n": 50, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸುಸ್ವಾಮಿಯ ಸೋದರರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋದರು.”", "a": "ಹಬ್ಬಕ್ಕೆ", "r": "7:10"}, {"n": 51, "q": "ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?", "a": "ಯೇಸು ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು", "r": "7:11"}, {"n": 52, "q": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಗುಂಪು ಹೇಗೆ ಮಾತನಾಡುತ್ತಿತ್ತು?", "a": "ಗುಜುಗುಜು", "r": "7:11"}, {"n": 53, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು.”", "a": "ಯೇಸು", "r": "7:11"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರಗುಂಪು ಗುಜುಗುಜು ಮಾತನಾಡುತ್ತಿತ್ತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:11"}, {"n": 55, "q": "“ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಯೇಸು ಎಲ್ಲಿದ್ದಾನೆಂದು ಹುಡುಕುತ್ತಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "7:11"}, {"n": 56, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಜನರಲ್ಲಿ ಇದ್ದ ಎರಡು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’; ‘ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ’", "r": "7:12"}, {"n": 57, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಕೆಲವರು ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’", "r": "7:12"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.”", "a": "ಎಳೆಯುತ್ತಿದ್ದಾನೆ", "r": "7:12"}, {"n": 59, "q": "“ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ, ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "7:12"}, {"n": 60, "q": "ಯೊವಾನ್ನ 7:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಆತ ಒಳ್ಳೆಯ ವ್ಯಕ್ತಿ’ ಎಂದು ಕೆಲವರು ಹೇಳಿದರೆ, ‘ಇಲ್ಲ, ಆತನು ಜನರನ್ನು ಅಡ್ಡದಾರಿಗೆ ಎಳೆಯುತ್ತಿದ್ದಾನೆ,’ ಎನ್ನುತ್ತಿದ್ದರು ಇತರರು.", "r": "7:12"}, {"n": 61, "q": "ಜನರು ಯೇಸುವಿನ ಬಗ್ಗೆ ಬಹಿರಂಗವಾಗಿ ಏಕೆ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ?", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ", "r": "7:13"}, {"n": 62, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ", "r": "7:13"}, {"n": 63, "q": "“ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "7:13"}, {"n": 64, "q": "ಯೊವಾನ್ನ 7:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೆಹೂದ್ಯರಿಗೆ ಅಂಜಿ ಅವರಾರೂ ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿರಲಿಲ್ಲ.", "r": "7:13"}, {"n": 65, "q": "ಯೇಸು ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದ್ದು ಯಾವಾಗ?", "a": "ಹಬ್ಬವು ಅರ್ಧಕ್ಕೆ ಅರ್ಧ ಮುಗಿದಾಗ", "r": "7:14"}, {"n": 66, "q": "ಹಬ್ಬದ ಮಧ್ಯದಲ್ಲಿ ಯೇಸು ಎಲ್ಲಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು?", "a": "ಮಹಾದೇವಾಲಯದಲ್ಲಿ", "r": "7:14"}, {"n": 67, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅರ್ಧ ಮುಗಿಯಿತು.”", "a": "ಅರ್ಧಕ್ಕೆ", "r": "7:14"}, {"n": 68, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "7:14"}, {"n": 69, "q": "ಯೊವಾನ್ನ 7:14 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹಬ್ಬವು ಅರ್ಧಕ್ಕೆ ಅರ್ಧ ಮುಗಿಯಿತು. ಆಗ ಯೇಸು ಮಹಾದೇವಾಲಯಕ್ಕೆ ಹೋಗಿ ಬೋಧನೆ ಮಾಡತೊಡಗಿದರು.", "r": "7:14"}, {"n": 70, "q": "ಯೇಸುವಿನ ಬೋಧನೆ ಕೇಳಿ ಬೆರಗಾದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನೆಂದು ವಿಚಾರಿಸಿದರು?", "a": "“ಕಲಿಯದಿದ್ದರೂ ಈ ಮನುಷ್ಯನಿಗೆ ಇಷ್ಟೆಲ್ಲಾ ಪಾಂಡಿತ್ಯ ಎಲ್ಲಿಂದ ಬಂದಿತು?”", "r": "7:15"}, {"n": 71, "q": "ಯೇಸುವಿನ ಪಾಂಡಿತ್ಯ ಕಂಡು ಬೆರಗಾದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "7:15"}, {"n": 72, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆರಗಾದರು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "7:15"}, {"n": 73, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಮನುಷ್ಯನಿಗೆ ಇಷ್ಟೆಲ್ಲಾ ಪಾಂಡಿತ್ಯ ಎಲ್ಲಿಂದ ಬಂದಿತು?”", "a": "ಕಲಿಯದಿದ್ದರೂ", "r": "7:15"}, {"n": 74, "q": "“ಅದನ್ನು ಕೇಳಿ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಬೆರಗಾದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "7:15"}, {"n": 75, "q": "ತಮ್ಮ ಬೋಧನೆಯ ಮೂಲದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ; ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನದು.”", "r": "7:16"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ;”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:16"}, {"n": 77, "q": "“ಆಗ ಯೇಸುಸ್ವಾಮಿ, ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "7:16"}, {"n": 78, "q": "ಯೊವಾನ್ನ 7:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸುಸ್ವಾಮಿ, “ನಾನು ಮಾಡುವ ಬೋಧನೆ ನನ್ನದಲ್ಲ; ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನದು.", "r": "7:16"}, {"n": 79, "q": "ಯೇಸುವಿನ ಬೋಧನೆ ದೇವರಿಂದ ಬಂದುದೋ ಎಂಬುದು ಯಾರಿಗೆ ತಿಳಿಯುತ್ತದೆ?", "a": "ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ", "r": "7:17"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಿಳಿಯುತ್ತದೆ", "r": "7:17"}, {"n": 81, "q": "“ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು ತಿಳಿಯುತ್ತದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "7:17"}, {"n": 82, "q": "ಯೊವಾನ್ನ 7:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಚಿತ್ತದಂತೆ ನಡೆಯಲು ಮನಸ್ಸು ಉಳ್ಳವನಿಗೆ, ನಾನು ಬೋಧಿಸುವುದು ದೇವರಿಂದ ಬಂದುದೋ ಅಥವಾ ನನ್ನ ಸ್ವಂತ ಕಲ್ಪನೆಯೋ ಎಂಬುದು ತಿಳಿಯುತ್ತದೆ.", "r": "7:17"}, {"n": 83, "q": "ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ಮತ್ತು ಕಳುಹಿಸಿದಾತನ ಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುವವನ ನಡುವಿನ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುತ್ತಾನೆ; ಕಳುಹಿಸಿದಾತನ ಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುವವನು ಪ್ರಾಮಾಣಿಕನು, ಅವನಲ್ಲಿ ಕಪಟವಿರದು", "r": "7:18"}, {"n": 84, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಯಸುತ್ತಾನೆ.”", "a": "ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು", "r": "7:18"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಯಸುವವನು ಪ್ರಾಮಾಣಿಕನು.”", "a": "ಪ್ರತಿಷ್ಠೆಯನ್ನು", "r": "7:18"}, {"n": 86, "q": "“ಸ್ವಂತ ಕಲ್ಪನೆಯಿಂದ ಮಾತನಾಡುವವನು ತನ್ನ ಸ್ವಪ್ರತಿಷ್ಠೆಯನ್ನು ಬಯಸುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "7:18"}, {"n": 87, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕೊಟ್ಟವನು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೋಶೆ", "r": "7:19"}, {"n": 88, "q": "ಯೇಸು ಯೆಹೂದ್ಯರಿಗೆ ತಮ್ಮನ್ನು ಕೊಲ್ಲುವ ಸಂಚಿನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ನನ್ನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನೀವು ಹವಣಿಸುವುದೇಕೆ?”", "r": "7:19"}, {"n": 89, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಮೋಶೆ ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಯಾರೂ ಇಲ್ಲ", "r": "7:19"}, {"n": 90, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರ ನಿಮಗಿದೆಯಲ್ಲವೇ, ಆದರೂ ಅದಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರಾರೂ ನಿಮ್ಮಲ್ಲಿ ಇಲ್ಲ.”", "a": "ಮೋಶೆ", "r": "7:19"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಹವಣಿಸುವುದೇಕೆ?”", "a": "ಕೊಲ್ಲಬೇಕೆಂದು", "r": "7:19"}, {"n": 92, "q": "“ಮೋಶೆ ಕೊಟ್ಟ ಧರ್ಮಶಾಸ್ತ್ರ ನಿಮಗಿದೆಯಲ್ಲವೇ, ಆದರೂ ಅದಕ್ಕೆ ಸರಿಯಾಗಿ ನಡೆಯುವವರಾರೂ ನಿಮ್ಮಲ್ಲಿ ಇಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 19", "r": "7:19"}, {"n": 93, "q": "“ನನ್ನನ್ನು ಕೊಲ್ಲಬೇಕೆಂದು ನೀವು ಹವಣಿಸುವುದೇಕೆ?” ಎಂದಾಗ ಜನರು ಏನೆಂದರು?", "a": "“ನಿನಗೆ ದೆವ್ವ ಹಿಡಿದಿರಬೇಕು; ನಿನ್ನನ್ನು ಕೊಲ್ಲಲು ಹವಣಿಸುತ್ತಿರುವವರಾದರು ಯಾರು?”", "r": "7:20"}, {"n": 94, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಜನರು, ನಿನಗೆ ದೆವ್ವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹಿಡಿದಿರಬೇಕು", "r": "7:20"}, {"n": 95, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನನ್ನು ಕೊಲ್ಲಲು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರು?”", "a": "ಹವಣಿಸುತ್ತಿರುವವರಾದರು", "r": "7:20"}, {"n": 96, "q": "“ಅದಕ್ಕೆ ಆ ಜನರು, ನಿನಗೆ ದೆವ್ವ ಹಿಡಿದಿರಬೇಕು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "7:20"}, {"n": 97, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸಬ್ಬತ್ ದಿನ ಅವರು ಮಾಡಿದ್ದು ಏನು?", "a": "ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ", "r": "7:21"}, {"n": 98, "q": "ಸಬ್ಬತ್ ದಿನದ ಸೂಚಕಕಾರ್ಯಕ್ಕೆ ಜನರ ಪ್ರತಿಕ್ರಿಯೆ ಹೇಗಿತ್ತು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಎಲ್ಲರೂ ಕಂಗಾಲಾಗಿದ್ದರು", "r": "7:21"}, {"n": 99, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವರಿಗೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ.”", "a": "ಸಬ್ಬತ್", "r": "7:21"}, {"n": 100, "q": "“ಯೇಸು ಅವರಿಗೆ, ಸಬ್ಬತ್ ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "7:21"}, {"n": 101, "q": "ಯೊವಾನ್ನ 7:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವರಿಗೆ, “ಸಬ್ಬತ್ ದಿನ ನಾನು ಮಾಡಿದ್ದು ಒಂದು ಸೂಚಕಕಾರ್ಯ ಮಾತ್ರ. ಅಷ್ಟಕ್ಕೇ ನೀವೆಲ್ಲರೂ ಕಂಗಾಲಾಗಿದ್ದೀರಿ.", "r": "7:21"}, {"n": 102, "q": "ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು ಯಾರು ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಮೋಶೆ", "r": "7:22"}, {"n": 103, "q": "ವಾಸ್ತವವಾಗಿ ಸುನ್ನತಿ ಯಾವಾಗಿನಿಂದ ರೂಢಿಯಲ್ಲಿತ್ತು?", "a": "ಪೂರ್ವಜರ ಕಾಲದಿಂದಲೂ (ಮೋಶೆಯ ಕಾಲದಿಂದಲ್ಲ)", "r": "7:22"}, {"n": 104, "q": "ಯೆಹೂದ್ಯರು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿಯೂ ಏನು ಮಾಡುವುದುಂಟು?", "a": "ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು", "r": "7:22"}, {"n": 105, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೋಶೆ", "r": "7:22"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನದಲ್ಲಿಯೂ ನೀವು ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು.”", "a": "ಸಬ್ಬತ್", "r": "7:22"}, {"n": 107, "q": "ಯೊವಾನ್ನ 7:22 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಸುನ್ನತಿಯನ್ನು ಆಚರಿಸಬೇಕೆಂದು ನಿಯಮಿಸಿದವನು ಮೋಶೆ. (ವಾಸ್ತವವಾಗಿ ಅದು ಮೋಶೆಯ ಕಾಲದಿಂದಲ್ಲ, ಪೂರ್ವಜರ ಕಾಲದಿಂದಲೂ ರೂಢಿಯಲ್ಲಿತ್ತು). ಸಬ್ಬತ್ ದಿನದಲ್ಲಿಯೂ ನೀವು ಸುನ್ನತಿಯನ್ನು ಮಾಡುವುದುಂಟು.", "r": "7:22"}, {"n": 108, "q": "ಸಬ್ಬತ್ ದಿನದ ಸುನ್ನತಿ ಮತ್ತು ತಮ್ಮ ಗುಣಪಡಿಸುವಿಕೆಯನ್ನು ಯೇಸು ಹೇಗೆ ಹೋಲಿಸಿದರು?", "a": "ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ, ಅದೇ ದಿನದಲ್ಲಿ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ಸಿಟ್ಟಾಗಬೇಕೆ?", "r": "7:23"}, {"n": 109, "q": "ಯೇಸು ಸಬ್ಬತ್‌ದಿನದಲ್ಲಿ ಒಬ್ಬ ಮನುಷ್ಯನಿಗೆ ಏನು ಮಾಡಿದ್ದರು?", "a": "ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದರು", "r": "7:23"}, {"n": 110, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?”", "a": "ಸಬ್ಬತ್ದಿನದಲ್ಲಿ", "r": "7:23"}, {"n": 111, "q": "“ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "7:23"}, {"n": 112, "q": "ಯೊವಾನ್ನ 7:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೋಶೆಯ ನಿಯಮವನ್ನು ಉಲ್ಲಂಘಿಸದೆ ನೀವು ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ಒಬ್ಬನಿಗೆ ಸುನ್ನತಿ ಮಾಡಬಹುದಾದರೆ ಅದೇ ಸಬ್ಬತ್ದಿನದಲ್ಲಿ ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಸಂಪೂರ್ಣ ಸ್ವಸ್ಥಪಡಿಸಿದ್ದಕ್ಕೆ ನೀವು ಸಿಟ್ಟಾಗಬೇಕೆ?", "r": "7:23"}, {"n": 113, "q": "ತೀರ್ಪು ಕೊಡುವ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ಬರೀ ತೋರಿಕೆಯಿಂದ ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು; ನಿಮ್ಮ ತೀರ್ಪು ನ್ಯಾಯಬದ್ಧವಾಗಿರಬೇಕು”", "r": "7:24"}, {"n": 114, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬರೀ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು;”", "a": "ತೋರಿಕೆಯಿಂದ", "r": "7:24"}, {"n": 115, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿಮ್ಮ ತೀರ್ಪು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳಿದರು.”", "a": "ನ್ಯಾಯಬದ್ಧವಾಗಿರಬೇಕು", "r": "7:24"}, {"n": 116, "q": "“ಬರೀ ತೋರಿಕೆಯಿಂದ ತೀರ್ಪು ಕೊಡುವುದು ಸಲ್ಲದು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "7:24"}, {"n": 117, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:25ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸು ಲೋಕೋದ್ಧಾರಕನೇ?", "r": "7:25"}, {"n": 118, "q": "“ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?” ಎಂದವರು ಯಾರು?", "a": "ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ", "r": "7:25"}, {"n": 119, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?”", "a": "ಕೊಲ್ಲಬೇಕೆಂದು", "r": "7:25"}, {"n": 120, "q": "“ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "7:25"}, {"n": 121, "q": "ಯೊವಾನ್ನ 7:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಜೆರುಸಲೇಮಿನ ಕೆಲವು ಮಂದಿ ಇದನ್ನು ಕೇಳಿ, “ಅವರು ಕೊಲ್ಲಬೇಕೆಂದು ಹವಣಿಸುತ್ತಾ ಇರುವುದು ಈತನನ್ನೇ ಅಲ್ಲವೆ?", "r": "7:25"}, {"n": 122, "q": "ಜೆರುಸಲೇಮಿನವರಿಗೆ ಆಶ್ಚರ್ಯವಾದ ಸಂಗತಿ ಏನು?", "a": "ಯೇಸು ಬಹಿರಂಗವಾಗಿ ಮಾತನಾಡುತ್ತಿದ್ದರೂ ಅವರ ವಿರುದ್ಧ ಯಾರೂ ಮಾತೆತ್ತುತ್ತಿರಲಿಲ್ಲ", "r": "7:26"}, {"n": 123, "q": "ಮುಖಂಡರ ಬಗ್ಗೆ ಜೆರುಸಲೇಮಿನವರು ಕೇಳಿಕೊಂಡ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಈತನೇ ಲೋಕೋದ್ಧಾರಕನೆಂದು ಆ ಮುಖಂಡರಿಗೆ ಹೊಳೆದಿರಬಹುದೆ?”", "r": "7:26"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಗೋ, ಈತ ಬಹಿರಂಗವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮಾತನಾಡುತ್ತಿದ್ದಾನೆ", "r": "7:26"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಈತನಿಗೆ ವಿರುದ್ಧವಾಗಿ ಅವರಾರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಮಾತೆತ್ತುತ್ತಿಲ್ಲ", "r": "7:26"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮುಖಂಡರಿಗೆ ಹೊಳೆದಿರಬಹುದೆ?”", "a": "ಲೋಕೋದ್ಧಾರಕನೆಂದು", "r": "7:26"}, {"n": 127, "q": "ಜೆರುಸಲೇಮಿನವರ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕನು ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ ಯಾರಿಗೂ ಏನು ತಿಳಿದಿರುವುದಿಲ್ಲ?", "a": "ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು", "r": "7:27"}, {"n": 128, "q": "ಜೆರುಸಲೇಮಿನವರ ಪ್ರಕಾರ ಯೇಸುವಿನ ಬಗ್ಗೆ ಅವರೆಲ್ಲರಿಗೂ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ಯೇಸು ಎಲ್ಲಿಂದ ಬಂದವನೆಂದು", "r": "7:27"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕೋದ್ಧಾರಕನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು ಯಾರಿಗೂ ತಿಳಿದಿರುವುದಿಲ್ಲ.”", "a": "ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ", "r": "7:27"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಈತನು ಎಲ್ಲಿಂದ ಬಂದವನೆಂದು ನಮ್ಮೆಲ್ಲರಿಗೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ತಿಳಿದಿದೆಯಲ್ಲಾ", "r": "7:27"}, {"n": 131, "q": "“ಲೋಕೋದ್ಧಾರಕನು ಕಾಣಿಸಿಕೊಳ್ಳುವಾಗ ಆತನು ಎಲ್ಲಿಂದ ಬಂದನೆಂದು ಯಾರಿಗೂ ತಿಳಿದಿರುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "7:27"}, {"n": 132, "q": "ಯೇಸು ಗಟ್ಟಿಯಾಗಿ ಮಾತನಾಡಿದಾಗ ಎಲ್ಲಿ ಬೋಧಿಸುತ್ತಿದ್ದರು?", "a": "ದೇವಾಲಯದಲ್ಲಿ", "r": "7:28"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರನ್ನು ಕಳುಹಿಸಿದಾತನು ಹೇಗಿದ್ದಾನೆ?", "a": "ಸತ್ಯಸ್ವರೂಪಿ", "r": "7:28"}, {"n": 134, "q": "ಯೇಸು ತಮ್ಮ ಆಗಮನದ ಬಗ್ಗೆ ಏನೆಂದು ಗಟ್ಟಿಯಾಗಿ ಹೇಳಿದರು?", "a": "“ನಾನು ನನ್ನಷ್ಟಕ್ಕೇ ಬಂದವನಲ್ಲ”", "r": "7:28"}, {"n": 135, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರು ಯಾರನ್ನು ಅರಿತಿಲ್ಲ?", "a": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು", "r": "7:28"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ದೇವಾಲಯದಲ್ಲಿ ಬೋಧಿಸುತ್ತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗ ಗಟ್ಟಿಯಾಗಿ ಇಂತೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:28"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಯಾರೆಂದು, ಎಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬಲ್ಲಿರೋ?”", "a": "ಬಂದವನೆಂದು", "r": "7:28"}, {"n": 138, "q": "ಯೇಸು ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು ಅರಿತಿರುವುದಕ್ಕೆ ಕಾರಣವೇನು?", "a": "ಅವರು ಬಂದುದು ಆತನಿಂದಲೇ; ಆತನೇ ಅವರನ್ನು ಕಳುಹಿಸಿದ್ದು", "r": "7:29"}, {"n": 139, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು ಬಂದುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆತನಿಂದಲೇ", "r": "7:29"}, {"n": 140, "q": "ಯೊವಾನ್ನ 7:29 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನಾನಾದರೋ ಆತನನ್ನು ಅರಿತಿದ್ದೇನೆ. ಏಕೆಂದರೆ, ನಾನು ಬಂದುದು ಆತನಿಂದಲೇ. ಆತನೇ ನನ್ನನ್ನು ಕಳುಹಿಸಿದ್ದು,”", "r": "7:29"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನಿಂದಲೇ.”", "a": "ಬಂದುದು", "r": "7:29"}, {"n": 142, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರೂ ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ, ಏಕೆ?", "a": "ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದೆ ಇದ್ದ ಕಾರಣ", "r": "7:30"}, {"n": 143, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ “ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಹೇಳಲಾಗಿದೆ?", "a": "ಎರಡು ಬಾರಿ (7:30; 7:44)", "r": "7:30; 7:44"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಡಿದು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:30"}, {"n": 145, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಅವರ ಗಳಿಗೆ ಇನ್ನೂ ಬಾರದೆ ಇದ್ದ ಕಾರಣ ಯಾರೂ ಅವರ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಹಾಕಲಿಲ್ಲ", "r": "7:30"}, {"n": 146, "q": "“ಇದನ್ನು ಕೇಳಿದ ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಹಿಡಿದು ಬಂಧಿಸಲು ಪ್ರಯತ್ನಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 30", "r": "7:30"}, {"n": 147, "q": "ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ ಹಲವರು ಏನೆಂದುಕೊಂಡರು?", "a": "“ಲೋಕೋದ್ಧಾರಕ ಬಂದಾಗ ಈತನು ಮಾಡಿದ್ದಕ್ಕೂ ಮಿಗಿಲಾದ ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡಿಯಾನೆ?”", "r": "7:31"}, {"n": 148, "q": "ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದವರು ಯಾರು?", "a": "ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರು", "r": "7:31"}, {"n": 149, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "7:31"}, {"n": 150, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಲೋಕೋದ್ಧಾರಕ ಬಂದಾಗ ಈತನು ಮಾಡಿದ್ದಕ್ಕೂ ಮಿಗಿಲಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿಯಾನೆ?”", "a": "ಸೂಚಕಕಾರ್ಯಗಳನ್ನು", "r": "7:31"}, {"n": 151, "q": "“ಅಲ್ಲಿ ನೆರೆದಿದ್ದ ಹಲವರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "7:31"}, {"n": 152, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:32ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಸಂಚು", "r": "7:32"}, {"n": 153, "q": "ಯೇಸುವನ್ನು ಬಂಧಿಸಲು ಕಾವಲಾಳುಗಳನ್ನು ಕಳುಹಿಸಿದವರು ಯಾರು?", "a": "ಫರಿಸಾಯರೂ ಮುಖ್ಯಯಾಜಕರೂ", "r": "7:32"}, {"n": 154, "q": "ಫರಿಸಾಯರ ಕಿವಿಗೆ ಏನು ಮುಟ್ಟಿತು?", "a": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರು ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು", "r": "7:32"}, {"n": 155, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರು ಹೀಗೆ ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು ಫರಿಸಾಯರ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯನ್ನು", "r": "7:32"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೂ ಮುಖ್ಯಯಾಜಕರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂಧಿಸಲು ಕಾವಲಾಳುಗಳನ್ನು ಕಳುಹಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:32"}, {"n": 157, "q": "“ಯೇಸುಸ್ವಾಮಿಯನ್ನು ಕುರಿತು ಜನರು ಹೀಗೆ ಆಡುತ್ತಿದ್ದ ಗುಸುಗುಸು ಮಾತು ಫರಿಸಾಯರ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "7:32"}, {"n": 158, "q": "ಯೇಸು ಇನ್ನು ಎಷ್ಟು ಕಾಲ ಜನರೊಡನೆ ಇರುವುದಾಗಿ ಹೇಳಿದರು?", "a": "ತುಸುಕಾಲ ಮಾತ್ರ", "r": "7:33"}, {"n": 159, "q": "ತುಸುಕಾಲದ ಅನಂತರ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೊರಟು ಹೋಗುವುದಾಗಿ ಹೇಳಿದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಬಳಿಗೆ", "r": "7:33"}, {"n": 160, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇನ್ನು ತುಸುಕಾಲ ಮಾತ್ರ ನಾನು ನಿಮ್ಮೊಡನೆ ಇರುತ್ತೇನೆ.”", "a": "ಯೇಸು", "r": "7:33"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಹೊರಟು ಹೋಗುತ್ತೇನೆ.”", "a": "ಕಳುಹಿಸಿದಾತನ", "r": "7:33"}, {"n": 162, "q": "“ಆಗ ಯೇಸು, ಇನ್ನು ತುಸುಕಾಲ ಮಾತ್ರ ನಾನು ನಿಮ್ಮೊಡನೆ ಇರುತ್ತೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "7:33"}, {"n": 163, "q": "ಯೇಸು ಹೊರಟು ಹೋದ ನಂತರ ಜನರ ಬಗ್ಗೆ ಹೇಳಿದ ಮೂರು ಸಂಗತಿಗಳು ಯಾವುವು?", "a": "ನೀವು ನನ್ನನ್ನು ಹುಡುಕುವಿರಿ; ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ; ನಾನು ಇರುವಲ್ಲಿಗೆ ನೀವು ಬರುವಂತೆಯೂ ಇಲ್ಲ", "r": "7:34"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹುಡುಕುವಿರಿ", "r": "7:34"}, {"n": 165, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಸಿಗುವುದಿಲ್ಲ", "r": "7:34"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬರುವಂತೆಯೂ ಇಲ್ಲ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಇರುವಲ್ಲಿಗೆ", "r": "7:34"}, {"n": 167, "q": "ಯೇಸು ಎಲ್ಲಿಗೆ ಹೋಗಲಿದ್ದಾನೆ ಎಂದು ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಊಹಿಸಿದರು?", "a": "ಗ್ರೀಕರ ನಡುವೆ ಚದರಿ ಹೋಗಿರುವ ಯೆಹೂದ್ಯರಲ್ಲಿಗೆ ಹೋಗಿ ಅವರಿಗೆ ಬೋಧಿಸುವನೋ ಎಂದು", "r": "7:35"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ನಮಗೆ ಕಾಣಸಿಗದ ಹಾಗೆ ಇವನು ಎಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೋಗಲಿದ್ದಾನೆ", "r": "7:35"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಗ್ರೀಕರ ನಡುವೆ ಚದರಿ ಹೋಗಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೋಗಿ ಅವರಿಗೆ ಬೋಧಿಸುವನೋ?”", "a": "ಯೆಹೂದ್ಯರಲ್ಲಿಗೆ", "r": "7:35"}, {"n": 170, "q": "“ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು, ನಮಗೆ ಕಾಣಸಿಗದ ಹಾಗೆ ಇವನು ಎಲ್ಲಿ ಹೋಗಲಿದ್ದಾನೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "7:35"}, {"n": 171, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಯೇಸುವಿನ ಯಾವ ಮಾತಿನ ಅರ್ಥವನ್ನು ತಿಳಿಯದಾದರು?", "a": "“ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ. ನಾನಿರುವಲ್ಲಿಗೆ ನೀವು ಬರುವಂತಿಲ್ಲ’", "r": "7:36"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಾಣಸಿಗುವುದಿಲ್ಲ", "r": "7:36"}, {"n": 173, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀವು ಬರುವಂತಿಲ್ಲ ಎಂದು ಇವನು ಹೇಳುವುದರ ಅರ್ಥ ಏನಿರಬಹುದು?”", "a": "ನಾನಿರುವಲ್ಲಿಗೆ", "r": "7:36"}, {"n": 174, "q": "“ನನ್ನನ್ನು ಅರಸುವಿರಿ, ಆದರೆ ನಾನು ನಿಮಗೆ ಕಾಣಸಿಗುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "7:36"}, {"n": 175, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:37ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜೀವದಾಯಕ ಹೊನಲು", "r": "7:37"}, {"n": 176, "q": "ಯೇಸು “ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ” ಎಂದು ಕೂಗಿ ಹೇಳಿದ್ದು ಯಾವ ದಿನ?", "a": "ಹಬ್ಬದ ಕೊನೆಯ ದಿನ, ಮಹಾದಿನ", "r": "7:37"}, {"n": 177, "q": "ಹಬ್ಬದ ಮಹಾದಿನದಂದು ಯೇಸು ನಿಂತುಕೊಂಡು ಕೂಗಿ ಹೇಳಿದ ಮೊದಲ ಮಾತು ಯಾವುದು?", "a": "“ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ.”", "r": "7:37"}, {"n": 178, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ‘ಜೀವಜಲ’ದ ಬಗ್ಗೆ ಯೇಸು ಮಾತನಾಡಿದ ಎರಡು ಸಂದರ್ಭಗಳು ಯಾವುವು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆಯೊಡನೆ (4:10); ಪರ್ಣಕುಟೀರ ಹಬ್ಬದ ಮಹಾದಿನದಂದು (7:37–38)", "r": "4:10; 7:37–38"}, {"n": 179, "q": "ಹಬ್ಬದ ಮಹಾದಿನದಂದು ಯೇಸು ಹೇಗೆ ಮಾತನಾಡಿದರು?", "a": "ನಿಂತುಕೊಂಡು ಕೂಗಿ ಹೇಳಿದರು", "r": "7:37"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಬ್ಬದ ಕೊನೆಯ ದಿನ ಮಹಾದಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಆಗಿತ್ತು", "r": "7:37"}, {"n": 181, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿ ನಿಂತುಕೊಂಡು, ಬಾಯಾರಿದವನು ನನ್ನ ಬಳಿಗೆ ಬಂದು ಕುಡಿಯಲಿ.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "7:37"}, {"n": 182, "q": "ಪವಿತ್ರಗ್ರಂಥದ ಪ್ರಕಾರ ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಏನು ಹರಿಯುವುದು?", "a": "‘ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು’", "r": "7:38"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿರುವಂತೆ, ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು, ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.”", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ", "r": "7:38"}, {"n": 184, "q": "“ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಹೇಳಿರುವಂತೆ, ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು, ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "7:38"}, {"n": 185, "q": "ಯೊವಾನ್ನ 7:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪವಿತ್ರಗ್ರಂಥದಲ್ಲಿ ಹೇಳಿರುವಂತೆ, ‘ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನ ಹೃದಯದಿಂದ ಜೀವಜಲ ಹೊನಲುಹೊನಲಾಗಿ ಹರಿಯುವುದು’,” ಎಂದು ಕೂಗಿ ಹೇಳಿದರು.", "r": "7:38"}, {"n": 186, "q": "‘ಜೀವಜಲ’ ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕುರಿತು ಹೇಳಿದರು?", "a": "ತಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವರು ಪಡೆಯಲಿದ್ದ ಪವಿತ್ರಾತ್ಮರನ್ನು ಕುರಿತು", "r": "7:39"}, {"n": 187, "q": "ಆಗ ಪವಿತ್ರ ಆತ್ಮ ಇನ್ನೂ ಏಕೆ ಬಂದಿರಲಿಲ್ಲ?", "a": "ಯೇಸು ಇನ್ನೂ ಮೇಲೇರಿ ಮಹಿಮೆಯನ್ನು ಪಡೆದಿರಲಿಲ್ಲ", "r": "7:39"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತಮ್ಮಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವರು ಪಡೆಯಲಿದ್ದ ಪವಿತ್ರಾತ್ಮರನ್ನು ಕುರಿತೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೀಗೆ ಹೇಳಿದ್ದು.”", "a": "ಯೇಸು", "r": "7:39"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ತ ಆತ್ಮ ಇನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂದಿರಲಿಲ್ಲ", "r": "7:39"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇನ್ನೂ ಮೇಲೇರಿ ಮಹಿಮೆಯನ್ನು ಪಡೆದಿರಲಿಲ್ಲ.”", "a": "ಯೇಸು", "r": "7:39"}, {"n": 191, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:40ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಜನರಲ್ಲಿ ಭಿನ್ನಭಾವನೆ", "r": "7:40"}, {"n": 192, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು ಏನೆಂದರು?", "a": "“ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ”", "r": "7:40"}, {"n": 193, "q": "ಏಳನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರ ಮೂರು ಅಭಿಪ್ರಾಯಗಳು ಯಾವುವು?", "a": "1) ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ; 2) ಈತನೇ ಲೋಕೋದ್ಧಾರಕ; 3) ಲೋಕೋದ್ಧಾರಕ ಗಲಿಲೇಯದಿಂದ ಬರುವುದುಂಟೇ?", "r": "7:40–41"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೆಲವರು, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ, ಎಂದರು.”", "a": "ನೆರೆದಿದ್ದವರಲ್ಲಿ", "r": "7:40"}, {"n": 195, "q": "“ಇದನ್ನು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು, ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "7:40"}, {"n": 196, "q": "ಯೊವಾನ್ನ 7:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿ ನೆರೆದಿದ್ದವರಲ್ಲಿ ಕೆಲವರು, “ಬರಬೇಕಾಗಿದ್ದ ಪ್ರವಾದಿ ಈತನೇ ಸರಿ,” ಎಂದರು.", "r": "7:40"}, {"n": 197, "q": "ಇನ್ನೂ ಕೆಲವರು ಯೇಸುವನ್ನು ಏನೆಂದು ಕರೆದರು?", "a": "ಲೋಕೋದ್ಧಾರಕ", "r": "7:41"}, {"n": 198, "q": "ಯೇಸು ಲೋಕೋದ್ಧಾರಕನಲ್ಲ ಎಂದು ವಾದಿಸಿದವರು ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಲೋಕೋದ್ಧಾರಕ ಗಲಿಲೇಯದಿಂದ ಬರುವುದುಂಟೇ?”", "r": "7:41"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನೂ ಕೆಲವರು, ಈತನೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಲೋಕೋದ್ದಾರಕ", "r": "7:41"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮತ್ತೆ ಕೆಲವರು, ಲೋಕೋದ್ಧಾರಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವುದುಂಟೇ?”", "a": "ಗಲಿಲೇಯದಿಂದ", "r": "7:41"}, {"n": 201, "q": "“ಇನ್ನೂ ಕೆಲವರು, ಈತನೇ ಲೋಕೋದ್ದಾರಕ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "7:41"}, {"n": 202, "q": "ಪವಿತ್ರ ಗ್ರಂಥದ ಪ್ರಕಾರ ಲೋಕೋದ್ಧಾರಕನು ಯಾರ ವಂಶಜನು ಮತ್ತು ಎಲ್ಲಿ ಹುಟ್ಟುವನು?", "a": "ದಾವೀದ ವಂಶಜನು; ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಹುಟ್ಟುವನು", "r": "7:42"}, {"n": 203, "q": "ದಾವೀದನ ಊರು ಯಾವುದು?", "a": "ಬೆತ್ಲೆಹೇಮ್", "r": "7:42"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?”", "a": "ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ", "r": "7:42"}, {"n": 205, "q": "“ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "7:42"}, {"n": 206, "q": "ಯೊವಾನ್ನ 7:42 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಆತ ದಾವೀದ ವಂಶಜನು; ಆತನು ಹುಟ್ಟುವುದು ದಾವೀದನ ಊರಾದ ಬೆತ್ಲೆಹೇಮಿನಲ್ಲಿ’ ಎಂದು ಪವಿತ್ರ ಗ್ರಂಥವೇ ಹೇಳಿದೆಯಲ್ಲವೆ?” ಎಂದು ವಾದಿಸಿದರು.", "r": "7:42"}, {"n": 207, "q": "ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಏನು ಉಂಟಾಯಿತು?", "a": "ಭಿನ್ನಾಭಿಪ್ರಾಯ", "r": "7:43"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:43"}, {"n": 209, "q": "“ಹೀಗೆ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "7:43"}, {"n": 210, "q": "ಯೊವಾನ್ನ 7:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹೀಗೆ ಯೇಸುವನ್ನು ಕುರಿತು ಜನರಲ್ಲಿ ಭಿನ್ನಾಭಿಪ್ರಾಯ ಉಂಟಾಯಿತು.", "r": "7:43"}, {"n": 211, "q": "ಕೆಲವರಿಗೆ ಯೇಸುವನ್ನು ಏನು ಮಾಡಬೇಕೆನಿಸಿತು?", "a": "ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು", "r": "7:44"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೆಲವರಿಗಂತೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು.”", "a": "ಯೇಸುವನ್ನು", "r": "7:44"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಯಾರೂ ಅವರ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೈಹಾಕಲಿಲ್ಲ", "r": "7:44"}, {"n": 214, "q": "ಯೊವಾನ್ನ 7:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕೆಲವರಿಗಂತೂ ಯೇಸುವನ್ನು ಹಿಡಿದು ಬಂಧಿಸಬೇಕೆನಿಸಿತು. ಆದರೆ ಯಾರೂ ಅವರ ಮೇಲೆ ಕೈಹಾಕಲಿಲ್ಲ.", "r": "7:44"}, {"n": 215, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 7:45ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ವಿಶ್ವಾಸವಿಹೀನ ಮುಖಂಡರು", "r": "7:45"}, {"n": 216, "q": "ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು ಏನು ಕೇಳಿದರು?", "a": "“ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?”", "r": "7:45"}, {"n": 217, "q": "ಯೇಸುವನ್ನು ಹಿಡಿಯದೆ ಹಿಂದಿರುಗಿದವರು ಯಾರು?", "a": "ಕಾವಲಾಳುಗಳು", "r": "7:45"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?”", "a": "ಫರಿಸಾಯರು", "r": "7:45"}, {"n": 219, "q": "“ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು, ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "7:45"}, {"n": 220, "q": "ಯೊವಾನ್ನ 7:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕಾವಲಾಳುಗಳು ಹಿಂದಿರುಗಿದಾಗ, ಮುಖ್ಯಯಾಜಕರು ಮತ್ತು ಫರಿಸಾಯರು, “ಅವನನ್ನೇಕೆ ನೀವು ಹಿಡಿದು ತರಲಿಲ್ಲ?” ಎಂದು ಕೇಳಿದರು.", "r": "7:45"}, {"n": 221, "q": "ಯೇಸುವನ್ನು ಏಕೆ ಹಿಡಿದು ತರಲಿಲ್ಲ ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಕಾವಲಾಳುಗಳು ಏನೆಂದು ಉತ್ತರಿಸಿದರು?", "a": "“ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ”", "r": "7:46"}, {"n": 222, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು, ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಉತ್ತರಿಸಿದರು.”", "a": "ಮಾತನಾಡಿದ್ದಿಲ್ಲ", "r": "7:46"}, {"n": 223, "q": "“ಅವರು, ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ, ಎಂದು ಉತ್ತರಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 7ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "7:46"}, {"n": 224, "q": "ಯೊವಾನ್ನ 7:46 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರು, “ಆತನು ಮಾತನಾಡುವಂತೆ ಯಾರೂ ಎಂದೂ ಮಾತನಾಡಿದ್ದಿಲ್ಲ,” ಎಂದು ಉತ್ತರಿಸಿದರು.", "r": "7:46"}, {"n": 225, "q": "ಕಾವಲಾಳುಗಳ ಉತ್ತರಕ್ಕೆ ಫರಿಸಾಯರು ಏನೆಂದರು?", "a": "“ಏನು, ನೀವು ಕೂಡ ಅವನಿಗೆ ಮರುಳಾಗಿಬಿಟ್ಟಿರೋ?”", "r": "7:47"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;borde
