 ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 24", "r": "9:24"}, {"n": 155, "q": "ಯೊವಾನ್ನ 9:24 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಧಿಕಾರಿಗಳು ಆ ಹುಟ್ಟು ಕುರುಡನನ್ನು ಮತ್ತೆ ಕರೆಯಿಸಿ, “ನೀನು ದೇವರ ಮುಂದೆ ಪ್ರಮಾಣ ಮಾಡಿ ಹೇಳು. ಆ ಮನುಷ್ಯ ಪಾಪಿಯೆಂದು ನಮಗೆ ಗೊತ್ತು,” ಎಂದು ಕೇಳಿದರು.", "r": "9:24"}, {"n": 156, "q": "ಯೇಸು ಪಾಪಿಯೆಂದು ಅಧಿಕಾರಿಗಳು ಹೇಳಿದಾಗ ಕುರುಡನು ಏನು ಹೇಳಿದನು?", "a": "“ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ; ಆದರೆ ನಾನೊಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗಲಾದರೋ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ”", "r": "9:25"}, {"n": 157, "q": "ಕುರುಡನು ತನ್ನ ಬಗ್ಗೆ ಏನನ್ನು ಮಾತ್ರ ಬಲ್ಲೆ ಎಂದನು?", "a": "ಒಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ", "r": "9:25"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನು, ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ;”", "a": "ಉತ್ತರವಾಗಿ", "r": "9:25"}, {"n": 159, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈಗಲಾದರೋ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ, ಎಂದು ಹೇಳಿದನು.”", "a": "ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ", "r": "9:25"}, {"n": 160, "q": "“ಉತ್ತರವಾಗಿ ಅವನು, ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 25", "r": "9:25"}, {"n": 161, "q": "ಯೊವಾನ್ನ 9:25 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಉತ್ತರವಾಗಿ ಅವನು, “ಅವರು ಪಾಪಿಯೋ, ಅಲ್ಲವೋ ನಾನರಿಯೆ; ಆದರೆ ನಾನೊಮ್ಮೆ ಕುರುಡನಾಗಿದ್ದೆ; ಈಗಲಾದರೋ ಕಣ್ಣುಕಾಣಿಸುತ್ತದೆ ಇಷ್ಟು ಮಾತ್ರ ಬಲ್ಲೆ,” ಎಂದು ಹೇಳಿದನು.", "r": "9:25"}, {"n": 162, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಮತ್ತೆ ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಅವನು ನಿನಗೇನು ಮಾಡಿದ? ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು ಬರಿಸಿದ?”", "r": "9:26"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಬರಿಸಿದ", "r": "9:26"}, {"n": 164, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಅವರು ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪ್ರಶ್ನಿಸಿದರು", "r": "9:26"}, {"n": 165, "q": "ಯೊವಾನ್ನ 9:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಅವನು ನಿನಗೇನು ಮಾಡಿದ? ನಿನಗೆ ಹೇಗೆ ಕಣ್ಣು ಬರಿಸಿದ?” ಎಂದು ಅವರು ಮತ್ತೆ ಪ್ರಶ್ನಿಸಿದರು.", "r": "9:26"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನಗೆ ಹೇಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರಿಸಿದ?”", "a": "ಕಣ್ಣು", "r": "9:26"}, {"n": 167, "q": "ಅಧಿಕಾರಿಗಳ ಪುನರಾವರ್ತಿತ ಪ್ರಶ್ನೆಗೆ ಕುರುಡನು ಕೇಳಿದ ಮರುಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವನ ಶಿಷ್ಯರಾಗಲು ನಿಮಗೂ ಮನಸ್ಸಿದೆಯೇ?”", "r": "9:27"}, {"n": 168, "q": "ಕುರುಡನ ಪ್ರಕಾರ ಅಧಿಕಾರಿಗಳು ಏನು ಮಾಡುವುದಿಲ್ಲ?", "a": "ನಂಬುವುದಿಲ್ಲ", "r": "9:27"}, {"n": 169, "q": "“ನಿಮಗೆ ಆಗಲೇ ಹೇಳಿದ್ದೇನೆ…” — ಕುರುಡನು ಅಧಿಕಾರಿಗಳಿಗೆ ಮತ್ತೇನು ಕೇಳಿದನು?", "a": "“ಅದನ್ನೇ ಏಕೆ ಮತ್ತೆ ಮತ್ತೆ ಕೇಳುತ್ತೀರಿ?”", "r": "9:27"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ನಿಮಗೆ ಆಗಲೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳಿದ್ದೇನೆ", "r": "9:27"}, {"n": 171, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನೇ ಏಕೆ ಮತ್ತೆ ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೇಳುತ್ತೀರಿ", "r": "9:27"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೂ ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಶಿಷ್ಯರಾಗಲು", "r": "9:27"}, {"n": 173, "q": "ಕುರುಡನ ಮಾತು ಕೇಳಿ ಅಧಿಕಾರಿಗಳು ಏನು ಮಾಡಿದರು?", "a": "ಅವನನ್ನು ಶಪಿಸಿದರು", "r": "9:28"}, {"n": 174, "q": "ಅಧಿಕಾರಿಗಳು ತಮ್ಮನ್ನು ಯಾರ ಶಿಷ್ಯರೆಂದು ಹೇಳಿಕೊಂಡರು?", "a": "“ನಾವು ಮೋಶೆಯ ಶಿಷ್ಯರು”", "r": "9:28"}, {"n": 175, "q": "ಅಧಿಕಾರಿಗಳು ಕುರುಡನನ್ನು ಯಾರ ಶಿಷ್ಯನೆಂದು ಕರೆದರು?", "a": "“ನೀನೇ ಅವನ ಶಿಷ್ಯ”", "r": "9:28"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಶಪಿಸಿದರು.”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "9:28"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನೇ ಅವನ ಶಿಷ್ಯ, ನಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಶಿಷ್ಯರು.”", "a": "ಮೋಶೆಯ", "r": "9:28"}, {"n": 178, "q": "ಯೊವಾನ್ನ 9:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಅಧಿಕಾರಿಗಳು ಅವನನ್ನು ಶಪಿಸಿದರು. “ನೀನೇ ಅವನ ಶಿಷ್ಯ, ನಾವು ಮೋಶೆಯ ಶಿಷ್ಯರು.", "r": "9:28"}, {"n": 179, "q": "ಮೋಶೆಯ ಬಗ್ಗೆ ಅಧಿಕಾರಿಗಳು ಏನು ಬಲ್ಲವರಾಗಿದ್ದರು?", "a": "ಮೋಶೆಯೊಡನೆ ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು", "r": "9:29"}, {"n": 180, "q": "ಯೇಸುವಿನ ಬಗ್ಗೆ ಅಧಿಕಾರಿಗಳು ಏನನ್ನು ಅರಿಯೆವು ಎಂದರು?", "a": "ಅವನು ಎಲ್ಲಿಯವನೋ", "r": "9:29"}, {"n": 181, "q": "ಅಧಿಕಾರಿಗಳ ಪ್ರಕಾರ ದೇವರು ಯಾರೊಡನೆ ಮಾತನಾಡಿದರು?", "a": "ಮೋಶೆಯೊಡನೆ", "r": "9:29"}, {"n": 182, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು ನಾವು ಬಲ್ಲೆವು.”", "a": "ಮೋಶೆಯೊಡನೆ", "r": "9:29"}, {"n": 183, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಇವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾವು ಅರಿಯೆವು, ಎಂದರು.”", "a": "ಎಲ್ಲಿಯವನೋ", "r": "9:29"}, {"n": 184, "q": "“ಮೋಶೆಯೊಡನೆ ದೇವರು ಮಾತನಾಡಿದರು ಎಂಬುದನ್ನು ನಾವು ಬಲ್ಲೆವು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "9:29"}, {"n": 185, "q": "ಅಧಿಕಾರಿಗಳ ಮಾತಿಗೆ ಕುರುಡನು ಆಶ್ಚರ್ಯದಿಂದ ಏನೆಂದನು?", "a": "“ಏನಾಶ್ಚರ್ಯ! ನನಗೆ ಕಣ್ಣು ಬರಿಸಿದ್ದಾರೆ.”", "r": "9:30"}, {"n": 186, "q": "ಕುರುಡನಿಗೆ ಆಶ್ಚರ್ಯವಾದ ಸಂಗತಿ ಏನು?", "a": "ಯೇಸು ತನಗೆ ಕಣ್ಣು ಬರಿಸಿದರೂ, ‘ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು’ ಎಂದು ಅಧಿಕಾರಿಗಳು ಹೇಳುತ್ತಿದ್ದುದು", "r": "9:30"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ ಕುರುಡ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>!”", "a": "ಏನಾಶ್ಚರ್ಯ", "r": "9:30"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಎನ್ನುತ್ತೀರಿ", "r": "9:30"}, {"n": 189, "q": "ಯೊವಾನ್ನ 9:30 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಆ ಕುರುಡ, “ಏನಾಶ್ಚರ್ಯ! ನನಗೆ ಕಣ್ಣು ಬರಿಸಿದ್ದಾರೆ. ಆದರೂ ‘ಅವನು ಎಲ್ಲಿಯವನೋ ನಾವರಿಯೆವು’ ಎನ್ನುತ್ತೀರಿ.", "r": "9:30"}, {"n": 190, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಏನಾಶ್ಚರ್ಯ!”", "a": "ಕುರುಡ", "r": "9:30"}, {"n": 191, "q": "ಕುರುಡನ ಪ್ರಕಾರ ದೇವರು ಯಾರಿಗೆ ಓಗೊಡುವುದಿಲ್ಲ?", "a": "ಪಾಪಿಗಳಿಗೆ", "r": "9:31"}, {"n": 192, "q": "ಕುರುಡನ ಪ್ರಕಾರ ದೇವರು ಯಾರಿಗೆ ಓಗೊಡುತ್ತಾರೆ?", "a": "ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುವವರಿಗೆ", "r": "9:31"}, {"n": 193, "q": "ದೇವರು ಓಗೊಡುವವರು ತಮ್ಮ ಚಿತ್ತದಂತೆ ಹೇಗೆ ನಡೆಯುತ್ತಾರೆ?", "a": "ಭಕ್ತಿಯಿಂದ", "r": "9:31"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.”", "a": "ಓಗೊಡುತ್ತಾರೆಂದು", "r": "9:31"}, {"n": 195, "q": "“ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ ಓಗೊಡುತ್ತಾರೆಂದು ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "9:31"}, {"n": 196, "q": "ಯೊವಾನ್ನ 9:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರು ಪಾಪಿಗಳಿಗೆ ಓಗೊಡುವುದಿಲ್ಲ. ಯಾರು ಭಕ್ತಿಯಿಂದ ಅವರ ಚಿತ್ತದಂತೆ ನಡೆಯುತ್ತಾರೋ ಅವರಿಗೆ ಓಗೊಡುತ್ತಾರೆಂದು ನಮಗೆಲ್ಲಾ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ.", "r": "9:31"}, {"n": 197, "q": "ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಯಾರೂ ಕೇಳದ ಸುದ್ದಿ ಯಾವುದು ಎಂದು ಕುರುಡನು ಹೇಳಿದನು?", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿ", "r": "9:32"}, {"n": 198, "q": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಯಾವಾಗಿನಿಂದ ಯಾರೂ ಕೇಳಿಲ್ಲ?", "a": "ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ", "r": "9:32"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.”", "a": "ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ", "r": "9:32"}, {"n": 200, "q": "“ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "9:32"}, {"n": 201, "q": "ಯೊವಾನ್ನ 9:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.", "r": "9:32"}, {"n": 202, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರಾದರೂ ಕಣ್ಣುಕೊಟ್ಟ ಸುದ್ದಿಯನ್ನು ಲೋಕ ಸೃಷ್ಟಿಯಾದಾಗಿನಿಂದ ಒಬ್ಬರೂ ಕೇಳಿಲ್ಲ.”", "a": "ಹುಟ್ಟುಕುರುಡನಿಗೆ", "r": "9:32"}, {"n": 203, "q": "ಕುರುಡನ ಪ್ರಕಾರ ಯೇಸು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:33"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:33"}, {"n": 205, "q": "“ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "9:33"}, {"n": 206, "q": "ಯೊವಾನ್ನ 9:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ ಇಂಥದ್ದೇನನ್ನೂ ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ,” ಎಂದನು.", "r": "9:33"}, {"n": 207, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇವರು ದೇವರಿಂದ ಬಂದವರು ಅಲ್ಲದಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಲಾಗುತ್ತಿರಲಿಲ್ಲ, ಎಂದನು.”", "a": "ಇಂಥದ್ದೇನನ್ನೂ", "r": "9:33"}, {"n": 208, "q": "ಫರಿಸಾಯರು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳುವ ಮೊದಲು ಏನು ಹೇಳಿದರು?", "a": "“ಪಾಪದಲ್ಲೇ ಹುಟ್ಟಿ ಬೆಳೆದವನು ನೀನು. ನಮಗೇ ಬುದ್ಧಿ ಹೇಳ ಹೊರಟೆಯಾ?”", "r": "9:34"}, {"n": 209, "q": "ಫರಿಸಾಯರು ಕೊನೆಗೆ ಕುರುಡನಿಗೆ ಏನು ಮಾಡಿದರು?", "a": "ಅವನನ್ನು ತಳ್ಳಿಬಿಟ್ಟರು", "r": "9:34"}, {"n": 210, "q": "ಫರಿಸಾಯರ ಪ್ರಕಾರ ಕುರುಡನು ಯಾವುದರಲ್ಲಿ ಹುಟ್ಟಿ ಬೆಳೆದವನು?", "a": "ಪಾಪದಲ್ಲೇ", "r": "9:34"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಪಾಪದಲ್ಲೇ ಹುಟ್ಟಿ ಬೆಳೆದವನು ನೀನು.”", "a": "ಫರಿಸಾಯರು", "r": "9:34"}, {"n": 212, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಮಗೇ ಬುದ್ಧಿ ಹೇಳ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೊರಟೆಯಾ", "r": "9:34"}, {"n": 213, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಹೇಳಿ ಅವನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತಳ್ಳಿಬಿಟ್ಟರು", "r": "9:34"}, {"n": 214, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 9:35ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಆತ್ಮದ ಅಂಧತ್ವ", "r": "9:35"}, {"n": 215, "q": "ಹೊರಗೆ ತಳ್ಳಲ್ಪಟ್ಟ ಕುರುಡನನ್ನು ಕಂಡ ಯೇಸು ಏನು ಕೇಳಿದರು?", "a": "“ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?”", "r": "9:35"}, {"n": 216, "q": "ಯೇಸುವಿನ ಕಿವಿಗೆ ಯಾವ ವಾರ್ತೆ ಮುಟ್ಟಿತು?", "a": "ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ", "r": "9:35"}, {"n": 217, "q": "ಯೇಸು ಹೊರಗೆ ತಳ್ಳಲ್ಪಟ್ಟ ಕುರುಡನಿಗೆ ಯಾರಲ್ಲಿ ವಿಶ್ವಾಸವಿದೆಯೇ ಎಂದು ಕೇಳಿದರು?", "a": "ನರಪುತ್ರನಲ್ಲಿ", "r": "9:35"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಿವಿಗೆ ಮುಟ್ಟಿತು.”", "a": "ಯೇಸುಸ್ವಾಮಿಯ", "r": "9:35"}, {"n": 219, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ಕಂಡು, ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?”", "a": "ಯೇಸು", "r": "9:35"}, {"n": 220, "q": "“ಹುಟ್ಟು ಕುರುಡನನ್ನು ಹೊರಗೆ ತಳ್ಳಿದ ವಾರ್ತೆ ಯೇಸುಸ್ವಾಮಿಯ ಕಿವಿಗೆ ಮುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "9:35"}, {"n": 221, "q": "“ನರಪುತ್ರನಲ್ಲಿ ನಿನಗೆ ವಿಶ್ವಾಸವಿದೆಯೇ?” ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಕುರುಡನು ಏನೆಂದನು?", "a": "“ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ”", "r": "9:36"}, {"n": 222, "q": "ಕುರುಡನು ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು (9:36)?", "a": "“ಸ್ವಾಮೀ”", "r": "9:36"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದನು.”", "a": "ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ", "r": "9:36"}, {"n": 224, "q": "“ಅವನು, ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "9:36"}, {"n": 225, "q": "ಯೊವಾನ್ನ 9:36 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು, “ಅವರು ಯಾರೆಂದು ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ,” ಎಂದನು.", "r": "9:36"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು, ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿಸಿ ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದನು.”", "a": "ಯಾರೆಂದು", "r": "9:36"}, {"n": 227, "q": "ಯೇಸು ತಾವೇ ನರಪುತ್ರನೆಂದು ಕುರುಡನಿಗೆ ಹೇಗೆ ತಿಳಿಸಿದರು?", "a": "“ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು”", "r": "9:37"}, {"n": 228, "q": "“ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು” ಎಂಬ ಮಾತನ್ನು ಯೇಸು ಯಾರಿಗೆ ಹೇಳಿದರು?", "a": "ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ (4:26) ಮತ್ತು ಹುಟ್ಟು ಕುರುಡನಿಗೆ (9:37)", "r": "4:26; 9:37"}, {"n": 229, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಕುರುಡನು ನರಪುತ್ರನನ್ನು ಏನು ಮಾಡಿದ್ದಾನೆ?", "a": "ಕಂಡಿದ್ದಾನೆ", "r": "9:37"}, {"n": 230, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದರು.”", "a": "ಯೇಸು", "r": "9:37"}, {"n": 231, "q": "“ಯೇಸು, ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "9:37"}, {"n": 232, "q": "ಯೊವಾನ್ನ 9:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು, “ನೀನು ಆತನನ್ನು ಕಂಡಿದ್ದೀಯೆ, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,” ಎಂದರು.", "r": "9:37"}, {"n": 233, "q": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ” ಎಂದು ಹೇಳುತ್ತಾ ಕುರುಡನು ಏನು ಮಾಡಿದನು?", "a": "ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು", "r": "9:38"}, {"n": 234, "q": "ಕುರುಡನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬೀಳುವಾಗ ಹೇಳಿದ ಮಾತು ಯಾವುದು?", "a": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ”", "r": "9:38"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಡ್ಡಬಿದ್ದನು.”", "a": "ಯೇಸುವಿಗೆ", "r": "9:38"}, {"n": 236, "q": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "9:38"}, {"n": 237, "q": "ಯೊವಾನ್ನ 9:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ಸ್ವಾಮೀ, ನಾನು ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ,” ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.", "r": "9:38"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಹೇಳುತ್ತಾ ಅವನು ಯೇಸುವಿಗೆ ಅಡ್ಡಬಿದ್ದನು.”", "a": "ವಿಶ್ವಾಸಿಸುತ್ತೇನೆ", "r": "9:38"}, {"n": 239, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು ಏಕೆ?", "a": "ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ", "r": "9:39"}, {"n": 240, "q": "ಯೇಸುವಿನ ತೀರ್ಪಿನಿಂದ ಕುರುಡರಿಗೂ ಕಾಣುವವರಿಗೂ ಏನಾಗುತ್ತದೆ?", "a": "ಕುರುಡರು ಕಾಣುವರು; ಕಾಣುವವರು ಕುರುಡರಾಗುವರು", "r": "9:39"}, {"n": 241, "q": "ಯೇಸು ತೀರ್ಪುಕೊಡಲೆಂದು ಎಲ್ಲಿಗೆ ಬಂದರು?", "a": "ಈ ಲೋಕಕ್ಕೆ", "r": "9:39"}, {"n": 242, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು, ಎಂದು ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "9:39"}, {"n": 243, "q": "“ಆಗ ಯೇಸು, ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "9:39"}, {"n": 244, "q": "ಯೊವಾನ್ನ 9:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ಕುರುಡರು ಕಾಣುವಂತೆಯೂ ಕಾಣುವವರು ಕುರುಡರಾಗುವಂತೆಯೂ ತೀರ್ಪುಕೊಡಲೆಂದೇ ನಾನು ಈ ಲೋಕಕ್ಕೆ ಬಂದುದು,” ಎಂದು ನುಡಿದರು.", "r": "9:39"}, {"n": 245, "q": "ಯೇಸುವಿನ ಮಾತು ಕೇಳಿ ಫರಿಸಾಯರು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "r": "9:40"}, {"n": 246, "q": "“ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” ಎಂದು ಕೇಳಿದವರು ಯಾರು?", "a": "ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು", "r": "9:40"}, {"n": 247, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ನಿಂತಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "a": "ಫರಿಸಾಯರು", "r": "9:40"}, {"n": 248, "q": "“ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "9:40"}, {"n": 249, "q": "ಯೊವಾನ್ನ 9:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಲ್ಲಿ ನಿಂತಿದ್ದ ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, “ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "9:40"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫರಿಸಾಯರು ಈ ಮಾತನ್ನು ಕೇಳಿ, ಹಾಗಾದರೆ ನಾವು ಕೂಡ ಕುರುಡರೋ?”", "a": "ನಿಂತಿದ್ದ", "r": "9:40"}, {"n": 251, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಫರಿಸಾಯರು ಏಕೆ ಪಾಪಿಗಳಾಗಿದ್ದಾರೆ?", "a": "‘ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ’ ಎಂದು ಹೇಳಿಕೊಳ್ಳುವುದರಿಂದ", "r": "9:41"}, {"n": 252, "q": "ಫರಿಸಾಯರು ಕುರುಡರೇ ಆಗಿದ್ದರೆ ಏನಾಗುತ್ತಿತ್ತು?", "a": "ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:41"}, {"n": 253, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಒಂಬತ್ತನೆಯ ಅಧ್ಯಾಯ ಯೇಸುವಿನ ಯಾವ ಮಾತಿನಿಂದ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ?", "a": "“ಆದ್ದರಿಂದ ನೀವು ಪಾಪಿಗಳಾಗಿದ್ದೀರಿ”", "r": "9:41"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು, ನೀವು ಕುರುಡರೇ ಆಗಿದ್ದರೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಆದರೆ, ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ, ಎಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತೀರಿ;”", "a": "ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ", "r": "9:41"}, {"n": 255, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದ್ದರಿಂದ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಪಾಪಿಗಳಾಗಿದ್ದೀರಿ", "r": "9:41"}, {"n": 256, "q": "“ಯೇಸು, ನೀವು ಕುರುಡರೇ ಆಗಿದ್ದರೆ ಪಾಪಿಗಳಾಗುತ್ತಿರಲಿಲ್ಲ, ಆದರೆ, ನಮಗೆ ಕಣ್ಣು ಕಾಣುತ್ತದೆ, ಎಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತೀರಿ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 9ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "9:41"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>ಅಧ್ಯಾಯ</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
</body>
</html>
