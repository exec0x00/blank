ಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು”", "r": "4:26"}, {"n": 121, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದು ನುಡಿದರು.”", "a": "ಯೇಸು", "r": "4:26"}, {"n": 122, "q": "“ಆಗ ಯೇಸು, ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು, ಎಂದು ನುಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "4:26"}, {"n": 123, "q": "ಯೊವಾನ್ನ 4:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಿನ್ನೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವ ನಾನೇ ಆತನು,” ಎಂದು ನುಡಿದರು.", "r": "4:26"}, {"n": 124, "q": "ಹಿಂದಿರುಗಿ ಬಂದ ಶಿಷ್ಯರು ಯಾವುದನ್ನು ಕಂಡು ಆಶ್ಚರ್ಯಪಟ್ಟರು?", "a": "ಯೇಸು ಆ ಮಹಿಳೆಯೊಡನೆ ಮಾತನಾಡುತ್ತಿರುವುದನ್ನು", "r": "4:27"}, {"n": 125, "q": "ಆಶ್ಚರ್ಯಪಟ್ಟರೂ ಶಿಷ್ಯರು ಕೇಳದ ಎರಡು ಪ್ರಶ್ನೆಗಳು ಯಾವುವು?", "a": "ಮಹಿಳೆಗೆ “ಏನು ಬೇಕು?”; ಯೇಸುವಿಗೆ “ಆಕೆಯೊಡನೆ ಏಕೆ ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ?”", "r": "4:27"}, {"n": 126, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಷ್ಟರಲ್ಲಿ ಹಿಂದಿರುಗಿ ಬಂದ ಶಿಷ್ಯರು ಯೇಸು ಆ ಮಹಿಳೆಯೊಡನೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ಆಶ್ಚರ್ಯಪಟ್ಟರು.”", "a": "ಮಾತನಾಡುತ್ತಿರುವುದನ್ನು", "r": "4:27"}, {"n": 127, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಆಕೆಯನ್ನಾಗಲಿ, ಆಕೆಯೊಡನೆ ಏಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಮಾತನಾಡುತ್ತಿದ್ದೀರಿ", "r": "4:27"}, {"n": 128, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರು ಕೇಳಲಿಲ್ಲ.”", "a": "ಯೇಸುವನ್ನಾಗಲಿ", "r": "4:27"}, {"n": 129, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಏನನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು?", "a": "ತನ್ನ ಕೊಡವನ್ನು", "r": "4:28"}, {"n": 130, "q": "ಕೊಡವನ್ನು ಬಿಟ್ಟು ಮಹಿಳೆ ಎಲ್ಲಿಗೆ ನಡೆದಳು?", "a": "ಊರಿಗೆ", "r": "4:28"}, {"n": 131, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮಹಿಳೆ ತನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.”", "a": "ಕೊಡವನ್ನು", "r": "4:28"}, {"n": 132, "q": "“ಆ ಮಹಿಳೆ ತನ್ನ ಕೊಡವನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "4:28"}, {"n": 133, "q": "ಯೊವಾನ್ನ 4:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಮಹಿಳೆ ತನ್ನ ಕೊಡವನ್ನು ಅಲ್ಲಿಯೇ ಬಿಟ್ಟು ಊರಿಗೆ ನಡೆದಳು.", "r": "4:28"}, {"n": 134, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಊರಿನ ಜನರನ್ನು ಯೇಸುವಿನ ಬಳಿಗೆ ಹೇಗೆ ಕರೆದಳು?", "a": "“ನಾನು ಮಾಡಿದ್ದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ತಿಳಿಸಿದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಅಲ್ಲಿ ಇದ್ದಾರೆ. ಬಂದು ನೋಡಿ.”", "r": "4:29"}, {"n": 135, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆ ಊರಿನ ಜನರಿಗೆ ಯೇಸುವಿನ ಬಗ್ಗೆ ಕೇಳಿದ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಅವರೇ ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು?”", "r": "4:29"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮಾಡಿದ್ದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡಂತೆ ತಿಳಿಸಿದ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಅಲ್ಲಿ ಇದ್ದಾರೆ.”", "a": "ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ", "r": "4:29"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಲೋಕೋದ್ಧಾರಕ ಏಕಾಗಿರಬಾರದು?”", "a": "ಅಭಿಷಿಕ್ತನಾದ", "r": "4:29"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದು ಊರಿನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕರೆದಳು.”", "a": "ಜನರನ್ನು", "r": "4:29"}, {"n": 139, "q": "ಮಹಿಳೆಯ ಮಾತು ಕೇಳಿದ ಊರಿನ ಜನರು ಏನು ಮಾಡಿದರು?", "a": "ಯೇಸುವಿನ ಬಳಿಗೆ ಬಂದರು", "r": "4:30"}, {"n": 140, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದರು.”", "a": "ಯೇಸುವಿನ", "r": "4:30"}, {"n": 141, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಯೇಸುವಿನ ಬಳಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂದರು", "r": "4:30"}, {"n": 142, "q": "ಶಿಷ್ಯರು ಯೇಸುವನ್ನು ಏನೆಂದು ಒತ್ತಾಯ ಮಾಡಿದರು?", "a": "“ಗುರುದೇವಾ, ಊಟಮಾಡಿ”", "r": "4:31"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, ಗುರುದೇವಾ, ಊಟಮಾಡಿ, ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒತ್ತಾಯ ಮಾಡಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "4:31"}, {"n": 144, "q": "“ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, ಗುರುದೇವಾ, ಊಟಮಾಡಿ, ಎಂದು ಯೇಸುವನ್ನು ಒತ್ತಾಯ ಮಾಡಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "4:31"}, {"n": 145, "q": "ಯೊವಾನ್ನ 4:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಈ ಮಧ್ಯೆ ಶಿಷ್ಯರು, “ಗುರುದೇವಾ, ಊಟಮಾಡಿ,” ಎಂದು ಯೇಸುವನ್ನು ಒತ್ತಾಯ ಮಾಡಿದರು.", "r": "4:31"}, {"n": 146, "q": "ಶಿಷ್ಯರು ಊಟಮಾಡಲು ಒತ್ತಾಯಿಸಿದಾಗ ಯೇಸು ಏನೆಂದರು?", "a": "“ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ”", "r": "4:32"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "4:32"}, {"n": 148, "q": "“ಆಗ ಯೇಸು, ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "4:32"}, {"n": 149, "q": "ಯೊವಾನ್ನ 4:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಗ ಯೇಸು, “ನಿಮಗೆ ತಿಳಿಯದಂಥ ಆಹಾರ ನನ್ನಲ್ಲಿದೆ,” ಎಂದರು.", "r": "4:32"}, {"n": 150, "q": "ಯೇಸುವಿನ ಆಹಾರದ ಬಗ್ಗೆ ಶಿಷ್ಯರು ಪರಸ್ಪರ ಏನು ಮಾತನಾಡಿಕೊಂಡರು?", "a": "“ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?”", "r": "4:33"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಶಿಷ್ಯರು, ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೊಟ್ಟಿರಬಹುದೇ", "r": "4:33"}, {"n": 152, "q": "“ಶಿಷ್ಯರು, ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "4:33"}, {"n": 153, "q": "ಯೊವಾನ್ನ 4:33 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಶಿಷ್ಯರು, “ಯಾರಾದರೂ ಅವರಿಗೆ ತಿನ್ನಲು ತಂದು ಕೊಟ್ಟಿರಬಹುದೇ?” ಎಂದು ಮಾತನಾಡಿಕೊಂಡರು.", "r": "4:33"}, {"n": 154, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರ ಆಹಾರ ಯಾವುದು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದು", "r": "4:34"}, {"n": 155, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಅವರ ತಿಂಡಿತೀರ್ಥ ಯಾವುದು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನು ಕೊಟ್ಟ ಕಾರ್ಯಗಳನ್ನು ಪೂರೈಸುವುದು", "r": "4:34"}, {"n": 156, "q": "ಯೇಸು ತಮ್ಮ ‘ಆಹಾರ’ ಎಂದು ಏನನ್ನು ಕರೆದರು?", "a": "ತಮ್ಮನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದನ್ನು", "r": "4:34"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ, ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನ ಚಿತ್ತವನ್ನು ನೆರವೇರಿಸುವುದೇ ನನಗೆ ಆಹಾರ.”", "a": "ಯೇಸು", "r": "4:34"}, {"n": 158, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಕೊಟ್ಟ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೂರೈಸುವುದೇ ನನಗೆ ತಿಂಡಿತೀರ್ಥ.”", "a": "ಕಾರ್ಯಗಳನ್ನು", "r": "4:34"}, {"n": 159, "q": "ಸುಗ್ಗಿ ಬರಲು ಇನ್ನು ಎಷ್ಟು ತಿಂಗಳು ಎಂದು ಜನರು ಹೇಳುತ್ತಿದ್ದರು?", "a": "ನಾಲ್ಕು ತಿಂಗಳು", "r": "4:35"}, {"n": 160, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಕಣ್ಣುಹಾಯಿಸಿ ಏನನ್ನು ನೋಡಲು ಹೇಳಿದರು?", "a": "ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿರುವ ಹೊಲಗಳನ್ನು", "r": "4:35"}, {"n": 161, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ತೋರಿಸಿದ ಹೊಲಗಳು ಯಾವ ಸ್ಥಿತಿಯಲ್ಲಿದ್ದವು?", "a": "ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿದ್ದವು", "r": "4:35"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನು ನಾಲ್ಕು ತಿಂಗಳು ಆದ ಮೇಲೆ ಸುಗ್ಗಿ ಬರುತ್ತದೆ ಎಂದು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಹೇಳುವುದಿಲ್ಲವೆ", "r": "4:35"}, {"n": 163, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಲಿತು ಕೊಯ್ಲಿಗೆ ಬಂದಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೋಡಿ.”", "a": "ಹೊಲಗಳನ್ನು", "r": "4:35"}, {"n": 164, "q": "ಕೊಯ್ದವನು ಏನನ್ನು ಪಡೆಯುತ್ತಾನೆ ಮತ್ತು ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ಈಗಾಗಲೇ ಕೂಲಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ; ನಿತ್ಯಜೀವಕ್ಕೆ ಫಲವನ್ನು ಕೂಡಿಸಿಡುತ್ತಾನೆ", "r": "4:36"}, {"n": 165, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಒಟ್ಟಿಗೆ ಸಂತೋಷಪಡುವವರು ಯಾರು?", "a": "ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ", "r": "4:36"}, {"n": 166, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕೊಯ್ದವನು ಈಗಾಗಲೇ ಕೂಲಿಯನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಪಡೆಯುತ್ತಾನೆ", "r": "4:36"}, {"n": 167, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು ನಿತ್ಯಜೀವಕ್ಕೆ ಫಲವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕೂಡಿಸಿಡುತ್ತಾನೆ", "r": "4:36"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗೆ ಬಿತ್ತುವವನೂ ಕೊಯ್ಯುವವನೂ ಒಟ್ಟಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಂತೋಷಪಡುತ್ತಾರೆ", "r": "4:36"}, {"n": 169, "q": "ಯೇಸು ನಿಜವಾದುದೆಂದು ಹೇಳಿದ ನಾಣ್ನುಡಿ ಯಾವುದು?", "a": "‘ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ’", "r": "4:37"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬಿತ್ತುವವನೊಬ್ಬ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.”", "a": "ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ", "r": "4:37"}, {"n": 171, "q": "“ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ, ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "4:37"}, {"n": 172, "q": "ಯೊವಾನ್ನ 4:37 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ಬಿತ್ತುವವನೊಬ್ಬ, ಕೊಯ್ಯುವವನಿನ್ನೊಬ್ಬ,’ ಎಂಬ ನಾಣ್ನುಡಿ ನಿಜವಾದುದು.", "r": "4:37"}, {"n": 173, "q": "ಯೇಸು ಶಿಷ್ಯರನ್ನು ಎಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ಕಳುಹಿಸಿದ್ದರು?", "a": "ಅವರು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ", "r": "4:38"}, {"n": 174, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಬೇರೆಯವರ ದುಡಿಮೆಯ ಫಲ ಯಾರ ಪಾಲಿಗೆ ಬರುವುದು?", "a": "ಶಿಷ್ಯರ ಪಾಲಿಗೆ", "r": "4:38"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ನಾನು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕಳುಹಿಸಿದ್ದೇನೆ", "r": "4:38"}, {"n": 176, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಫಲ ಬರುವುದು ನಿಮ್ಮ ಪಾಲಿಗೆ, ಎಂದು ಹೇಳಿದರು.”", "a": "ದುಡಿಮೆಯ", "r": "4:38"}, {"n": 177, "q": "“ನೀವು ದುಡಿಯದ ಎಡೆಯಲ್ಲಿ ಕೊಯ್ಲುಮಾಡಲು ನಾನು ನಿಮ್ಮನ್ನು ಕಳುಹಿಸಿದ್ದೇನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 38", "r": "4:38"}, {"n": 178, "q": "ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ್ದು ಹೇಗೆ?", "a": "‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ", "r": "4:39"}, {"n": 179, "q": "ಸಮಾರಿಯದವರಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿದ ಎರಡು ಮಾರ್ಗಗಳು ಯಾವುವು?", "a": "ಮಹಿಳೆಯ ಮಾತಿನಿಂದ (4:39); ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ (4:41)", "r": "4:39; 4:41"}, {"n": 180, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಂಬಿಕೆ ಹುಟ್ಟಿತು.”", "a": "ಯೇಸುವಿನಲ್ಲಿ", "r": "4:39"}, {"n": 181, "q": "“ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "4:39"}, {"n": 182, "q": "ಯೊವಾನ್ನ 4:39 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "‘ನಾನು ಮಾಡಿದ ಕೃತ್ಯಗಳನ್ನೆಲ್ಲಾ ಕಂಡಂತೆ ಹೇಳಿದ ವ್ಯಕ್ತಿ’ ಎಂದು ಸಾರಿದ ಮಹಿಳೆಯ ಮಾತಿನಿಂದ ಸಮಾರಿಯ ಊರಿನ ಹಲವು ಮಂದಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಹುಟ್ಟಿತು.", "r": "4:39"}, {"n": 183, "q": "ಸಮಾರಿಯದ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡರು?", "a": "ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು", "r": "4:40"}, {"n": 184, "q": "ಯೇಸು ಸಮಾರಿಯದವರ ಊರಿನಲ್ಲಿ ಎಷ್ಟು ದಿನ ಉಳಿದರು?", "a": "ಎರಡು ದಿನ", "r": "4:40"}, {"n": 185, "q": "ಯೇಸು ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು ಬೇಡಿಕೊಂಡವರು ಯಾರು?", "a": "ಸಮಾರಿಯ ಊರಿನ ಜನರು", "r": "4:40"}, {"n": 186, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಂದೇ ಆ ಊರಿನ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ಬಂದು ತಮ್ಮಲ್ಲಿಯೇ ತಂಗಬೇಕೆಂದು ಬೇಡಿಕೊಂಡರು.”", "a": "ಯೇಸುವಿನ", "r": "4:40"}, {"n": 187, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಂತೆಯೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅಲ್ಲಿ ಎರಡು ದಿನ ಉಳಿದರು.”", "a": "ಯೇಸು", "r": "4:40"}, {"n": 188, "q": "ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿದ್ದು ಹೇಗೆ?", "a": "ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ", "r": "4:41"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನೂ ಅನೇಕರಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.”", "a": "ಯೇಸುವಿನ", "r": "4:41"}, {"n": 190, "q": "“ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "4:41"}, {"n": 191, "q": "ಯೊವಾನ್ನ 4:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇನ್ನೂ ಅನೇಕರಿಗೆ ಯೇಸುವಿನ ಬೋಧನೆಯನ್ನು ಅವರ ಬಾಯಿಂದಲೇ ಕೇಳಿ ಅವರಲ್ಲಿ ನಂಬಿಕೆ ಮೂಡಿತು.", "r": "4:41"}, {"n": 192, "q": "ಸಮಾರಿಯದ ಜನರು ಮಹಿಳೆಗೆ ಏನೆಂದು ಹೇಳಿದರು?", "a": "“ನೀನು ಹೇಳಿದುದರಿಂದ ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ”", "r": "4:42"}, {"n": 193, "q": "ಸಮಾರಿಯದ ಜನರು ಯೇಸುವನ್ನು ಏನೆಂದು ಅರಿತುಕೊಂಡರು?", "a": "ಲೋಕೋದ್ಧಾರಕ ಇವರೇ ಎಂದು", "r": "4:42"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಅವರು, ಆ ಮಹಿಳೆಗೆ, ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ;”", "a": "ಹೇಳಿದುದರಿಂದ", "r": "4:42"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇವರೇ ಎಂದು ನಮಗೀಗ ತಿಳಿಯಿತು, ಎಂದರು.”", "a": "ಲೋಕೋದ್ಧಾರಕ", "r": "4:42"}, {"n": 196, "q": "“ಆಗ ಅವರು, ಆ ಮಹಿಳೆಗೆ, ನೀನು ಹೇಳಿದುದರಿಂದ ಮಾತ್ರವೇ ಈಗ ನಾವು ನಂಬುತ್ತಿಲ್ಲ, ನಾವೇ ಕಿವಿಯಾರೆ ಕೇಳಿ ನಂಬಿದ್ದೇವೆ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "4:42"}, {"n": 197, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 4:43ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಅಧಿಕಾರಿಯ ಮಗನಿಗೆ ಆರೋಗ್ಯದಾನ", "r": "4:43"}, {"n": 198, "q": "ಸಮಾರಿಯದಲ್ಲಿ ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸು ಎಲ್ಲಿಗೆ ಹೊರಟರು?", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:43"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "4:43"}, {"n": 200, "q": "“ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 43", "r": "4:43"}, {"n": 201, "q": "ಯೊವಾನ್ನ 4:43 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಎರಡು ದಿನಗಳಾದ ಬಳಿಕ ಯೇಸುಸ್ವಾಮಿ ಅಲ್ಲಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಹೊರಟರು.", "r": "4:43"}, {"n": 202, "q": "ಪ್ರವಾದಿಯ ಬಗ್ಗೆ ಯೇಸು ಸಾರಿದ್ದ ಮಾತು ಯಾವುದು?", "a": "ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ", "r": "4:44"}, {"n": 203, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪ್ರವಾದಿಗೆ ಎಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ?", "a": "ಸ್ವಗ್ರಾಮದಲ್ಲಿ", "r": "4:44"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪ್ರವಾದಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.”", "a": "ಸ್ವಗ್ರಾಮದಲ್ಲಿ", "r": "4:44"}, {"n": 205, "q": "“ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "4:44"}, {"n": 206, "q": "ಯೊವಾನ್ನ 4:44 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪ್ರವಾದಿಗೆ ಸ್ವಗ್ರಾಮದಲ್ಲಿ ಮರ್ಯಾದೆ ಇಲ್ಲ ಎಂದು ಅವರೇ ಸಾರಿದ್ದರು.", "r": "4:44"}, {"n": 207, "q": "ಗಲಿಲೇಯದ ಜನರು ಯೇಸುವನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡದ್ದು ಏಕೆ?", "a": "ಹಬ್ಬಕ್ಕಾಗಿ ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿದ್ದಾಗ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ ಯೇಸು ಮಾಡಿದ್ದನ್ನೆಲ್ಲಾ ನೋಡಿದ್ದರಿಂದ", "r": "4:45"}, {"n": 208, "q": "ಗಲಿಲೇಯದ ಜನರು ಯೇಸುವನ್ನು ಹೇಗೆ ಬರಮಾಡಿಕೊಂಡರು?", "a": "ಆದರದಿಂದ", "r": "4:45"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಲುಪಿದೊಡನೆ ಜನರು ಅವರನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡರು.”", "a": "ಗಲಿಲೇಯವನ್ನು", "r": "4:45"}, {"n": 210, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಹಬ್ಬಕ್ಕಾಗಿ ಆ ಜನರು ಜೆರುಸಲೇಮಿಗೆ ಹೋಗಿದ್ದಾಗ ಹಬ್ಬದ ಸಮಯದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ್ದನ್ನೆಲ್ಲಾ ನೋಡಿದ್ದರು.”", "a": "ಯೇಸು", "r": "4:45"}, {"n": 211, "q": "“ಗಲಿಲೇಯವನ್ನು ತಲುಪಿದೊಡನೆ ಜನರು ಅವರನ್ನು ಆದರದಿಂದ ಬರಮಾಡಿಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 45", "r": "4:45"}, {"n": 212, "q": "ಯೇಸು ಗಲಿಲೇಯದ ಯಾವ ಊರಿಗೆ ಮರಳಿ ಬಂದರು?", "a": "ಕಾನಾ ಊರಿಗೆ", "r": "4:46"}, {"n": 213, "q": "ಕಾನಾ ಊರಿನಲ್ಲಿ ಯೇಸು ಹಿಂದೆ ಏನು ಮಾಡಿದ್ದರು?", "a": "ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾಡಿದ್ದರು", "r": "4:46"}, {"n": 214, "q": "ಕಫೆರ್ನವುಮಿನಲ್ಲಿ ಯಾರ ಮಗನಿಗೆ ಕಾಯಿಲೆಯಾಗಿತ್ತು?", "a": "ರಾಜಸೇವೆಯಲ್ಲಿದ್ದ ಒಬ್ಬ ಅಧಿಕಾರಿಯ ಮಗನಿಗೆ", "r": "4:46"}, {"n": 215, "q": "ಅಧಿಕಾರಿಯ ಮಗನು ಯಾವ ಊರಿನಲ್ಲಿ ಕಾಯಿಲೆಬಿದ್ದಿದ್ದನು?", "a": "ಕಫೆರ್ನವುಮಿನಲ್ಲಿ", "r": "4:46"}, {"n": 216, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾನಾ ಊರಿಗೆ ಮರಳಿ ಬಂದರು.”", "a": "ಗಲಿಲೇಯದ", "r": "4:46"}, {"n": 217, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರು ಹಿಂದೆ ನೀರನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾಡಿದ್ದು ಅಲ್ಲಿಯೇ.”", "a": "ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ", "r": "4:46"}, {"n": 218, "q": "ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಏನೆಂದು ಬೇಡಿಕೊಂಡನು?", "a": "ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು", "r": "4:47"}, {"n": 219, "q": "ಅಧಿಕಾರಿಯ ಪ್ರಕಾರ ಅವನ ಮಗನು ಎಲ್ಲಿದ್ದನು?", "a": "ಸಾವಿನ ದವಡೆಯಲ್ಲಿ", "r": "4:47"}, {"n": 220, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಜುದೇಯದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:47"}, {"n": 221, "q": "“ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "4:47"}, {"n": 222, "q": "ಯೊವಾನ್ನ 4:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದಿರುವುದನ್ನು ಕೇಳಿದ ಆ ಅಧಿಕಾರಿ, ಅವರ ಬಳಿಗೆ ಬಂದು, ಸಾವಿನ ದವಡೆಯಲ್ಲಿರುವ ತನ್ನ ಮಗನನ್ನು ಬಂದು ಬದುಕಿಸಬೇಕೆಂದು ಬೇಡಿಕೊಂಡನು.", "r": "4:47"}, {"n": 223, "q": "ಅಧಿಕಾರಿಯ ಬೇಡಿಕೆಗೆ ಯೇಸು ಮೊದಲು ಏನು ಹೇಳಿದರು?", "a": "“ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ”", "r": "4:48"}, {"n": 224, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "4:48"}, {"n": 225, "q": "“ಯೇಸು ಅವನಿಗೆ ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 48", "r": "4:48"}, {"n": 226, "q": "ಯೊವಾನ್ನ 4:48 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನಿಗೆ “ಸೂಚಕಕಾರ್ಯಗಳನ್ನೂ ಅದ್ಭುತಗಳನ್ನೂ ಕಂಡ ಹೊರತು ನೀವು ನಂಬುವುದಿಲ್ಲವಲ್ಲಾ,” ಎಂದರು.", "r": "4:48"}, {"n": 227, "q": "ಆದರೂ ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಅಂಗಲಾಚಿದನು?", "a": "“ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ”", "r": "4:49"}, {"n": 228, "q": "ಅಧಿಕಾರಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಸ್ವಾಮೀ”", "r": "4:49"}, {"n": 229, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ಆ ಅಧಿಕಾರಿ, ನನ್ನ ಮಗನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ, ಎಂದು ಅಂಗಲಾಚಿದನು.”", "a": "ಪ್ರಾಣಬಿಡುವ", "r": "4:49"}, {"n": 230, "q": "“ಆದರೂ ಆ ಅಧಿಕಾರಿ, ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ, ಎಂದು ಅಂಗಲಾಚಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 49", "r": "4:49"}, {"n": 231, "q": "ಯೊವಾನ್ನ 4:49 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ಆ ಅಧಿಕಾರಿ, “ನನ್ನ ಮಗನು ಪ್ರಾಣಬಿಡುವ ಮೊದಲೇ ಬನ್ನಿ ಸ್ವಾಮೀ,” ಎಂದು ಅಂಗಲಾಚಿದನು.", "r": "4:49"}, {"n": 232, "q": "ಅಧಿಕಾರಿಗೆ ಯೇಸು ಕೊಟ್ಟ ಆಶ್ವಾಸನೆ ಏನು?", "a": "“ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ”", "r": "4:50"}, {"n": 233, "q": "“ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ” ಎಂದು ಯೇಸು ಹೇಳಿದಾಗ ಅಧಿಕಾರಿ ಏನು ಮಾಡಿದನು?", "a": "ಯೇಸುವಿನ ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು", "r": "4:50"}, {"n": 234, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 4:50 ಮತ್ತು 4:53ರಲ್ಲಿ ಅಧಿಕಾರಿಯ ವಿಶ್ವಾಸ ಹೇಗೆ ಬೆಳೆಯಿತು?", "a": "ಮೊದಲು ಯೇಸುವಿನ ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು (4:50); ಆಮೇಲೆ ಅವನೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದರು (4:53)", "r": "4:50; 4:53"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಹೋಗು, ನಿನ್ನ ಮಗನು ಬದುಕುತ್ತಾನೆ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಯೇಸು", "r": "4:50"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಅಧಿಕಾರಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮಾತನ್ನು ನಂಬಿ ಹೊರಟನು.”", "a": "ಯೇಸುವಿನ", "r": "4:50"}, {"n": 237, "q": "ಅರ್ಧದಾರಿಯಲ್ಲಿ ಆಳುಗಳು ಅಧಿಕಾರಿಗೆ ಏನೆಂದು ತಿಳಿಸಿದರು?", "a": "“ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ”", "r": "4:51"}, {"n": 238, "q": "ಆಳುಗಳು ಅಧಿಕಾರಿಗೆ ಎಲ್ಲಿ ಎದುರಾದರು?", "a": "ಅರ್ಧದಾರಿಯಲ್ಲಿ", "r": "4:51"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ, ಎಂದು ತಿಳಿಸಿದರು.”", "a": "ಅರ್ಧದಾರಿಯಲ್ಲಿ", "r": "4:51"}, {"n": 240, "q": "“ಅವನು ಅರ್ಧದಾರಿಯಲ್ಲಿ ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ, ಎಂದು ತಿಳಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 51", "r": "4:51"}, {"n": 241, "q": "ಯೊವಾನ್ನ 4:51 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವನು ಅರ್ಧದಾರಿಯಲ್ಲಿ ಇದ್ದಾಗಲೇ ಆಳುಗಳು ಅವನಿಗೆ ಎದುರಾಗಿ ಬಂದು, “ನಿಮ್ಮ ಮಗ ಬದುಕಿಕೊಂಡ,” ಎಂದು ತಿಳಿಸಿದರು.", "r": "4:51"}, {"n": 242, "q": "ಆಳುಗಳ ಪ್ರಕಾರ ಅಧಿಕಾರಿಯ ಮಗನ ಜ್ವರ ಯಾವಾಗ ಬಿಟ್ಟಿತು?", "a": "ನಿನ್ನೆ ಮಧ್ಯಾಹ್ನ ಒಂದು ಗಂಟೆಗೆ", "r": "4:52"}, {"n": 243, "q": "ಅಧಿಕಾರಿ ಆಳುಗಳನ್ನು ಏನೆಂದು ವಿಚಾರಿಸಿದನು?", "a": "ಎಷ್ಟು ಹೊತ್ತಿಗೆ ತನ್ನ ಮಗ ಚೇತರಿಸಿಕೊಂಡನೆಂದು", "r": "4:52"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಷ್ಟು ಹೊತ್ತಿಗೆ ತನ್ನ ಮಗ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಅಧಿಕಾರಿ ವಿಚಾರಿಸಿದಾಗ, ನಿನ್ನೆ ಮಧ್ಯಾಹ್ನ:”", "a": "ಚೇತರಿಸಿಕೊಂಡನೆಂದು", "r": "4:52"}, {"n": 245, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಒಂದು ಗಂಟೆಗೆ ಅವನ ಜ್ವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ಆಳುಗಳು ಉತ್ತರಕೊಟ್ಟರು.”", "a": "ಬಿಟ್ಟಿತು", "r": "4:52"}, {"n": 246, "q": "“ಎಷ್ಟು ಹೊತ್ತಿಗೆ ತನ್ನ ಮಗ ಚೇತರಿಸಿಕೊಂಡನೆಂದು ಆ ಅಧಿಕಾರಿ ವಿಚಾರಿಸಿದಾಗ, ನಿನ್ನೆ ಮಧ್ಯಾಹ್ನ:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 52", "r": "4:52"}, {"n": 247, "q": "ಅಧಿಕಾರಿಗೆ ಯಾವುದು ತಿಳಿಯಿತು?", "a": "‘ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ’ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು", "r": "4:53"}, {"n": 248, "q": "ಅಧಿಕಾರಿಯ ಮಗನು ಗುಣಹೊಂದಿದ ನಂತರ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದವರು ಯಾರು?", "a": "ಅಧಿಕಾರಿಯೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ", "r": "4:53"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ ಎಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು ತಂದೆಗೆ ತಿಳಿಯಿತು.”", "a": "ಯೇಸು", "r": "4:53"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನೂ ಅವನ ಮನೆಯವರೆಲ್ಲರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವಿಶ್ವಾಸಿಸಿದರು.”", "a": "ಯೇಸುವನ್ನು", "r": "4:53"}, {"n": 251, "q": "“ನಿನ್ನ ಮಗ ಬದುಕುತ್ತಾನೆ ಎಂದು ಯೇಸು ಹೇಳಿದ್ದ ಗಳಿಗೆಯಲ್ಲಿಯೇ ತನ್ನ ಮಗ ಬದುಕಿಕೊಂಡನೆಂದು ತಂದೆಗೆ ತಿಳಿಯಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 53", "r": "4:53"}, {"n": 252, "q": "ಅಧಿಕಾರಿಯ ಮಗನನ್ನು ಗುಣಪಡಿಸಿದ್ದು ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು ಮಾಡಿದ ಎಷ್ಟನೆಯ ಸೂಚಕಕಾರ್ಯ?", "a": "ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ", "r": "4:54"}, {"n": 253, "q": "ಯೇಸು ಗಲಿಲೇಯದ ಕಾನಾ ಊರಿನಲ್ಲಿ ಮಾಡಿದ ಎರಡು ಸೂಚಕಕಾರ್ಯಗಳು ಯಾವುವು?", "a": "ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾಡಿದ್ದು (2:11); ಅಧಿಕಾರಿಯ ಮಗನನ್ನು ಗುಣಪಡಿಸಿದ್ದು (4:46–54)", "r": "2:11; 4:54"}, {"n": 254, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಜುದೇಯದಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.”", "a": "ಗಲಿಲೇಯಕ್ಕೆ", "r": "4:54"}, {"n": 255, "q": "“ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 4ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 54", "r": "4:54"}, {"n": 256, "q": "ಯೊವಾನ್ನ 4:54 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಜುದೇಯದಿಂದ ಗಲಿಲೇಯಕ್ಕೆ ಬಂದು, ಮಾಡಿದ ಎರಡನೆಯ ಸೂಚಕಕಾರ್ಯ ಇದು.", "r": "4:54"}]}, {"chapter": 5, "label": "ಅಧ್ಯಾಯ 5", "verses": 47, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಸಬ್ಬತಿನಂದು ಸ್ವಸ್ಥನಾದ ರೋಗಿ", "r": "5:1"}, {"n": 2, "q": "ಯೇಸು ಜೆರುಸಲೇಮಿಗೆ ಏಕೆ ತೆರಳಿದರು (5:1)?", "a": "ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಬಂದುದರಿಂದ", "r": "5:1"}, {"n": 3, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹಬ್ಬ ಬಂದಿತು.”", "a": "ಯೆಹೂದ್ಯರ", "r": "5:1"}, {"n": 4, "q": "“ಇದಾದ ಮೇಲೆ ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಬಂದಿತು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 1", "r": "5:1"}, {"n": 5, "q": "ಯೊವಾನ್ನ 5:1 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದಾದ ಮೇಲೆ ಯೆಹೂದ್ಯರ ಹಬ್ಬ ಬಂದಿತು. ಯೇಸುಸ್ವಾಮಿ ಜೆರುಸಲೇಮಿಗೆ ತೆರಳಿದರು.", "r": "5:1"}, {"n": 6, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಾದ ಮೇಲೆ ಯೆಹೂದ್ಯರ ಹಬ್ಬ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಂದಿತು", "r": "5:1"}, {"n": 7, "q": "ಬೆತ್ಸಥ ಕೊಳವು ಯಾವ ಸ್ಥಳದ ಬಳಿ ಇದೆ?", "a": "‘ಕುರಿಬಾಗಿಲು’ ಎಂಬ ಸ್ಥಳದ ಬಳಿ", "r": "5:2"}, {"n": 8, "q": "ಬೆತ್ಸಥ ಕೊಳವು ಎಷ್ಟು ಮಂಟಪಗಳಿಂದ ಕೂಡಿದೆ?", "a": "ಐದು", "r": "5:2"}, {"n": 9, "q": "ಕುರಿಬಾಗಿಲಿನ ಬಳಿಯ ಕೊಳವನ್ನು ಹಿಬ್ರಿಯ ಭಾಷೆಯಲ್ಲಿ ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", "a": "ಬೆತ್ಸಥ", "r": "5:2"}, {"n": 10, "q": "‘ಬೆತ್ಸಥ’ ಎಂಬುದು ಯಾವ ಭಾಷೆಯ ಹೆಸರು?", "a": "ಹಿಬ್ರಿಯ ಭಾಷೆಯ", "r": "5:2"}, {"n": 11, "q": "ಬೆತ್ಸಥ ಕೊಳ ಯಾವ ನಗರದಲ್ಲಿದೆ?", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲಿ", "r": "5:2"}, {"n": 12, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂಬ ಸ್ಥಳದ ಬಳಿ ಐದು ಮಂಟಪಗಳಿಂದ ಕೂಡಿದ ಒಂದು ಕೊಳವಿದೆ.”", "a": "ಕುರಿಬಾಗಿಲು", "r": "5:2"}, {"n": 13, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದನ್ನು ಹಿಬ್ರಿಯ ಭಾಷೆಯಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದು ಕರೆಯುತ್ತಾರೆ.”", "a": "ಬೆತ್ಸಥ", "r": "5:2"}, {"n": 14, "q": "“ಅಲ್ಲಿ, ಕುರಿಬಾಗಿಲು ಎಂಬ ಸ್ಥಳದ ಬಳಿ ಐದು ಮಂಟಪಗಳಿಂದ ಕೂಡಿದ ಒಂದು ಕೊಳವಿದೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 2", "r": "5:2"}, {"n": 15, "q": "ಬೆತ್ಸಥ ಕೊಳದ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಂಡಿದ್ದ ರೋಗಿಗಳು ಯಾರು?", "a": "ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು", "r": "5:3–4"}, {"n": 16, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದ್ದರು.”", "a": "ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ", "r": "5:3–4"}, {"n": 17, "q": "“ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3–4", "r": "5:3–4"}, {"n": 18, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.”", "a": "ಪಾರ್ಶ್ವವಾಯು", "r": "5:3–4"}, {"n": 19, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ …”", "a": "“… ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.”", "r": "5:3–4"}, {"n": 20, "q": "ಯೊವಾನ್ನ 5:3–4 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಕುರುಡರು, ಕುಂಟರು, ಪಾರ್ಶ್ವವಾಯು ಪೀಡಿತರು ಮೊದಲಾದ ಅನೇಕ ರೋಗಿಗಳು ಆ ಮಂಟಪಗಳಲ್ಲಿ ಬಿದ್ದುಕೊಳ್ಳುತ್ತಾ ಇದ್ದರು.", "r": "5:3–4"}, {"n": 21, "q": "ಬೆತ್ಸಥ ಕೊಳದ ಬಳಿ ಮಲಗಿದ್ದ ರೋಗಿ ಎಷ್ಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದನು?", "a": "ಮೂವತ್ತೆಂಟು ವರ್ಷ", "r": "5:5"}, {"n": 22, "q": "ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿ ಎಲ್ಲಿ ಮಲಗಿದ್ದನು?", "a": "ಬೆತ್ಸಥ ಕೊಳದ ಮಂಟಪಗಳಲ್ಲಿ (ಅಲ್ಲಿ)", "r": "5:5"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.”", "a": "ನರಳುತ್ತಿದ್ದ", "r": "5:5"}, {"n": 24, "q": "“ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 5", "r": "5:5"}, {"n": 25, "q": "ಯೊವಾನ್ನ 5:5 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಮೂವತ್ತೆಂಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.", "r": "5:5"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದ ಒಬ್ಬ ರೋಗಿ ಅಲ್ಲಿ ಮಲಗಿದ್ದನು.”", "a": "ಮೂವತ್ತೆಂಟು", "r": "5:5"}, {"n": 27, "q": "ಯೇಸು ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿಯನ್ನು ಏನೆಂದು ಕೇಳಿದರು?", "a": "“ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "r": "5:6"}, {"n": 28, "q": "ಯೇಸು ರೋಗಿಯ ಬಗ್ಗೆ ಏನನ್ನು ತಿಳಿದುಕೊಂಡರು?", "a": "ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು", "r": "5:6"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು", "r": "5:6"}, {"n": 30, "q": "“ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 6", "r": "5:6"}, {"n": 31, "q": "ಯೊವಾನ್ನ 5:6 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, “ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?” ಎಂದು ಕೇಳಿದರು.", "r": "5:6"}, {"n": 32, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನನ್ನು ನೋಡಿ, ದೀರ್ಘಕಾಲದಿಂದ ಅವನು ಹಾಗೆ ಬಿದ್ದುಕೊಂಡಿರುವುದನ್ನು ತಿಳಿದು, ನಿನಗೆ ಗುಣಹೊಂದಲು ಮನಸ್ಸಿದೆಯೇ?”", "a": "ಯೇಸು", "r": "5:6"}, {"n": 33, "q": "ರೋಗಿ ಕೊಳಕ್ಕೆ ಇಳಿಯಲು ಸಾಧ್ಯವಾಗದಿದ್ದುದಕ್ಕೆ ಅವನು ಕೊಟ್ಟ ಕಾರಣವೇನು?", "a": "ನೀರು ಉಕ್ಕಿದಾಗ ಅವನನ್ನು ಕೊಳಕ್ಕಿಳಿಸಲು ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ; ಅವನು ಹೋಗುವಷ್ಟರಲ್ಲೇ ಬೇರೆ ಯಾರಾದರೂ ಇಳಿದು ಬಿಡುತ್ತಾರೆ", "r": "5:7"}, {"n": 34, "q": "ರೋಗಿ ಯಾವಾಗ ಕೊಳಕ್ಕೆ ಇಳಿಯಬೇಕಿತ್ತು?", "a": "ನೀರು ಉಕ್ಕಿದಾಗ", "r": "5:7"}, {"n": 35, "q": "ರೋಗಿ ಯೇಸುವನ್ನು ಹೇಗೆ ಸಂಬೋಧಿಸಿದನು?", "a": "“ಸ್ವಾಮೀ”", "r": "5:7"}, {"n": 36, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸ್ವಾಮೀ, ನೀರು ಉಕ್ಕಿದಾಗ ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ;”", "a": "ಕೊಳಕ್ಕಿಳಿಸಲು", "r": "5:7"}, {"n": 37, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇರೆ ಯಾರಾದರೂ ಇಳಿದು ಬಿಡುತ್ತಾರೆ, ಎಂದು ಉತ್ತರಿಸಿದ ಆ ರೋಗಿ.”", "a": "ಹೋಗುವಷ್ಟರಲ್ಲೇ", "r": "5:7"}, {"n": 38, "q": "“ಸ್ವಾಮೀ, ನೀರು ಉಕ್ಕಿದಾಗ ನನ್ನನ್ನು ಕೊಳಕ್ಕಿಳಿಸಲು ಸಹಾಯಕರು ಇರುವುದಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "5:7"}, {"n": 39, "q": "ಯೇಸು ಮೂವತ್ತೆಂಟು ವರ್ಷದ ರೋಗಿಗೆ ಕೊಟ್ಟ ಆಜ್ಞೆ ಏನು?", "a": "“ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ”", "r": "5:8"}, {"n": 40, "q": "“ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ” ಎಂಬ ಮಾತು ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯಾರ ಯಾರ ಬಾಯಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "ಯೇಸು (5:8, ‘ಸುತ್ತಿಕೊಂಡು ನಡೆ’); ಗುಣಹೊಂದಿದವನು (5:11); ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು (5:12)", "r": "5:8; 5:11; 5:12"}, {"n": 41, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "5:8"}, {"n": 42, "q": "“ಯೇಸು ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "5:8"}, {"n": 43, "q": "ಯೊವಾನ್ನ 5:8 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಅವನಿಗೆ, “ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆ,” ಎಂದರು.", "r": "5:8"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಅವನಿಗೆ, ಎದ್ದು ನಿಲ್ಲು, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸುತ್ತಿಕೊಂಡು ನಡೆ, ಎಂದರು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:8"}, {"n": 45, "q": "ರೋಗಿ ಯಾವಾಗ ಗುಣಹೊಂದಿದನು?", "a": "ಆ ಕ್ಷಣವೇ", "r": "5:9"}, {"n": 46, "q": "ಗುಣಹೊಂದಿದ ರೋಗಿ ಏನು ಮಾಡತೊಡಗಿದನು?", "a": "ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು", "r": "5:9"}, {"n": 47, "q": "ಯೇಸು ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿಯನ್ನು ಗುಣಪಡಿಸಿದ ದಿನದ ವಿಶೇಷತೆ ಏನು? ಅದರಿಂದ ಏನಾಯಿತು?", "a": "ಸಬ್ಬತ್ತಿನ ದಿನ; ಯೆಹೂದ್ಯರು ಯೇಸುವಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು ಮತ್ತು ಕೊಲ್ಲಲು ಹವಣಿಸಿದರು", "r": "5:9–10"}, {"n": 48, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಡೆಯತೊಡಗಿದನು", "r": "5:9"}, {"n": 49, "q": "“ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 9", "r": "5:9"}, {"n": 50, "q": "ಯೊವಾನ್ನ 5:9 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಕ್ಷಣವೇ ಅವನು ಗುಣಹೊಂದಿ, ತನ್ನ ಹಾಸಿಗೆಯನ್ನು ಸುತ್ತಿಕೊಂಡು ನಡೆಯತೊಡಗಿದನು.", "r": "5:9"}, {"n": 51, "q": "ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿ ಗುಣಹೊಂದಿದ್ದು ಯಾವ ದಿನ?", "a": "ಸಬ್ಬತ್ತಿನ ದಿನ", "r": "5:10"}, {"n": 52, "q": "ಗುಣಹೊಂದಿದ ಮನುಷ್ಯನಿಗೆ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಏನೆಂದರು?", "a": "“ಇಂದು ಸಬ್ಬತ್ತಿನ ದಿನ. ನೀನು ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ”", "r": "5:10"}, {"n": 53, "q": "ಸಬ್ಬತ್ತಿನ ದಿನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ ಎಂದು ಹೇಳಿದವರು ಯಾರು?", "a": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು", "r": "5:10"}, {"n": 54, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದ ಆ ಮನುಷ್ಯನಿಗೆ, ಇಂದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನ.”", "a": "ಸಬ್ಬತ್ತಿನ", "r": "5:10"}, {"n": 55, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎತ್ತಿಕೊಂಡು ನಡೆಯುವುದು ನಿಷಿದ್ಧ, ಎಂದು ಹೇಳಿದರು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:10"}, {"n": 56, "q": "“ಆದುದರಿಂದ ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದ ಆ ಮನುಷ್ಯನಿಗೆ, ಇಂದು ಸಬ್ಬತ್ತಿನ ದಿನ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 10", "r": "5:10"}, {"n": 57, "q": "ಅಧಿಕಾರಿಗಳ ಆಕ್ಷೇಪಕ್ಕೆ ಗುಣಹೊಂದಿದವನು ಏನೆಂದು ಉತ್ತರಕೊಟ್ಟನು?", "a": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ‘ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ’ ಎಂದು ಹೇಳಿದರು”", "r": "5:11"}, {"n": 58, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಗುಣಪಡಿಸಿದವರೇ", "r": "5:11"}, {"n": 59, "q": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 11", "r": "5:11"}, {"n": 60, "q": "ಯೊವಾನ್ನ 5:11 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಅವನು: “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ‘ನಿನ್ನ ಹಾಸಿಗೆಯನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ’ ಎಂದು ಹೇಳಿದರು,” ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.", "r": "5:11"}, {"n": 61, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರೇ, ನಿನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದು ಹೇಳಿದರು, ಎಂದು ಉತ್ತರಕೊಟ್ಟನು.”", "a": "ಹಾಸಿಗೆಯನ್ನು", "r": "5:11"}, {"n": 62, "q": "ಯೆಹೂದ್ಯ ಅಧಿಕಾರಿಗಳು ಗುಣಹೊಂದಿದವನನ್ನು ಏನೆಂದು ಪ್ರಶ್ನಿಸಿದರು?", "a": "“ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "r": "5:12"}, {"n": 63, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "a": "ಅಧಿಕಾರಿಗಳು", "r": "5:12"}, {"n": 64, "q": "“ಅಧಿಕಾರಿಗಳು, ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 12", "r": "5:12"}, {"n": 65, "q": "ಯೊವಾನ್ನ 5:12 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅಧಿಕಾರಿಗಳು, “ಅದನ್ನು ಎತ್ತಿಕೊಂಡು ನಡೆ ಎಂದ ಅವನು ಯಾರು?” ಎಂದು ಪ್ರಶ್ನಿಸಿದರು.", "r": "5:12"}, {"n": 66, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಧಿಕಾರಿಗಳು, ಅದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಡೆ ಎಂದ ಅವನು ಯಾರು?”", "a": "ಎತ್ತಿಕೊಂಡು", "r": "5:12"}, {"n": 67, "q": "ಗುಣಹೊಂದಿದವನಿಗೆ ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಏಕೆ ಹೇಳಲಾಗಲಿಲ್ಲ?", "a": "ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ; ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು", "r": "5:13"}, {"n": 68, "q": "ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದು ಏಕೆ?", "a": "ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ", "r": "5:13"}, {"n": 69, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ;”", "a": "ಗುಣಪಡಿಸಿದವರು", "r": "5:13"}, {"n": 70, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು.”", "a": "ಯೇಸು", "r": "5:13"}, {"n": 71, "q": "“ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 13", "r": "5:13"}, {"n": 72, "q": "ಯೊವಾನ್ನ 5:13 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ತನ್ನನ್ನು ಗುಣಪಡಿಸಿದವರು ಯಾರೆಂದು ಅವನಿಗೆ ತಿಳಿದಿರಲಿಲ್ಲ; ಅಲ್ಲದೆ ಜನಸಂದಣಿಯ ನಿಮಿತ್ತ ಯೇಸು ಆಗಲೇ ಮರೆಯಾಗಿ ಬಿಟ್ಟಿದ್ದರು.", "r": "5:13"}, {"n": 73, "q": "ಯೇಸು ಗುಣಹೊಂದಿದ ಮನುಷ್ಯನನ್ನು ಅನಂತರ ಎಲ್ಲಿ ಕಂಡರು?", "a": "ದೇವಾಲಯದಲ್ಲಿ", "r": "5:14"}, {"n": 74, "q": "ದೇವಾಲಯದಲ್ಲಿ ಯೇಸು ಗುಣಹೊಂದಿದವನಿಗೆ ಏನೆಂದು ಎಚ್ಚರಿಸಿದರು?", "a": "“ನೋಡು, ನೀನು ಗುಣಹೊಂದಿರುವೆ; ಇನ್ನುಮೇಲೆ ಪಾಪ ಮಾಡುವುದನ್ನು ಬಿಟ್ಟುಬಿಡು. ಇಲ್ಲದಿದ್ದರೆ ನಿನ್ನ ಗತಿ ಇನ್ನಷ್ಟು ಚಿಂತಾಜನಕವಾದೀತು”", "r": "5:14"}, {"n": 75, "q": "ಪಾಪ ಮಾಡುವುದನ್ನು ಬಿಡದಿದ್ದರೆ ಗುಣಹೊಂದಿದವನ ಗತಿ ಏನಾದೀತು?", "a": "ಇನ್ನಷ್ಟು ಚಿಂತಾಜನಕವಾದೀತು", "r": "5:14"}, {"n": 76, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅನಂತರ ದೇವಾಲಯದಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆ ಮನುಷ್ಯನನ್ನು ಕಂಡು, ನೋಡು, ನೀನು ಗುಣಹೊಂದಿರುವೆ;”", "a": "ಯೇಸು", "r": "5:14"}, {"n": 77, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇನ್ನುಮೇಲೆ ಪಾಪ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಿಟ್ಟುಬಿಡು.”", "a": "ಮಾಡುವುದನ್ನು", "r": "5:14"}, {"n": 78, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲದಿದ್ದರೆ ನಿನ್ನ ಗತಿ ಇನ್ನಷ್ಟು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದರು.”", "a": "ಚಿಂತಾಜನಕವಾದೀತು", "r": "5:14"}, {"n": 79, "q": "ಗುಣಹೊಂದಿದವನು ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ ಏನು ತಿಳಿಸಿದನು?", "a": "“ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ”", "r": "5:15"}, {"n": 80, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಯೇಸುವೇ", "r": "5:15"}, {"n": 81, "q": "“ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ, ಎಂದು ತಿಳಿಸಿದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 15", "r": "5:15"}, {"n": 82, "q": "ಯೊವಾನ್ನ 5:15 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, “ನನ್ನನ್ನು ಗುಣಪಡಿಸಿದವನು ಯೇಸುವೇ,” ಎಂದು ತಿಳಿಸಿದನು.", "r": "5:15"}, {"n": 83, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಮನುಷ್ಯ ಅಲ್ಲಿಂದ ಯೆಹೂದ್ಯರ ಬಳಿಗೆ ಹೋಗಿ, ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೇಸುವೇ, ಎಂದು ತಿಳಿಸಿದನು.”", "a": "ಗುಣಪಡಿಸಿದವನು", "r": "5:15"}, {"n": 84, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದ್ದು ಏಕೆ?", "a": "ಯೇಸು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಗುಣಪಡಿಸಿದ್ದರಿಂದ", "r": "5:16"}, {"n": 85, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಇದನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.”", "a": "ಸಬ್ಬತ್", "r": "5:16"}, {"n": 86, "q": "“ಯೇಸು ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 16", "r": "5:16"}, {"n": 87, "q": "ಯೊವಾನ್ನ 5:16 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.", "r": "5:16"}, {"n": 88, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಇದನ್ನು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಮಾಡಿದ್ದರಿಂದ ಯೆಹೂದ್ಯರು ಅವರಿಗೆ ಕಿರುಕುಳಕೊಡಲು ತೊಡಗಿದರು.”", "a": "ಯೇಸು", "r": "5:16"}, {"n": 89, "q": "ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಗುಣಪಡಿಸಿದ್ದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು ಏನೆಂದು ನುಡಿದರು?", "a": "“ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು. ಅವರಂತೆಯೇ ನಾನು ಸದಾ ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ”", "r": "5:17"}, {"n": 90, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಸತತವೂ ಕಾರ್ಯನಿರತರು ಯಾರು?", "a": "ಅವರ ಪಿತ", "r": "5:17"}, {"n": 91, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು.”", "a": "ಯೇಸು", "r": "5:17"}, {"n": 92, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರಂತೆಯೇ ನಾನು ಸದಾ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಎಂದು ನುಡಿದರು.”", "a": "ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ", "r": "5:17"}, {"n": 93, "q": "“ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 17", "r": "5:17"}, {"n": 94, "q": "ಯೊವಾನ್ನ 5:17 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದಕ್ಕೆ ಉತ್ತರವಾಗಿ ಯೇಸು, “ನನ್ನ ಪಿತ ಸತತವೂ ಕಾರ್ಯನಿರತರು. ಅವರಂತೆಯೇ ನಾನು ಸದಾ ಕಾರ್ಯನಿರತನಾಗಿದ್ದೇನೆ,” ಎಂದು ನುಡಿದರು.", "r": "5:17"}, {"n": 95, "q": "ಯೆಹೂದ್ಯರು ಯೇಸುವನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದ ಎರಡು ಕಾರಣಗಳು ಯಾವುವು?", "a": "1) ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದು; 2) ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದುದು", "r": "5:18"}, {"n": 96, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ಯೇಸು ತನ್ನನ್ನು ಯಾರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದರು?", "a": "ದೇವರಿಗೆ", "r": "5:18"}, {"n": 97, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.”", "a": "ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು", "r": "5:18"}, {"n": 98, "q": "“ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 18", "r": "5:18"}, {"n": 99, "q": "ಯೊವಾನ್ನ 5:18 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಯೇಸು ಸಬ್ಬತ್ತಿನ ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.", "r": "5:18"}, {"n": 100, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೇಸು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಯಮವನ್ನು ಮುರಿದುದೇ ಅಲ್ಲದೆ, ದೇವರನ್ನು ತನ್ನ ಪಿತನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾ, ತನ್ನನ್ನೇ ದೇವರಿಗೆ ಸರಿಸಮ ಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದಾನೆಂದು ಯೆಹೂದ್ಯರು ಅವರನ್ನು ಕೊಲ್ಲಲು ಮತ್ತಷ್ಟು ಹವಣಿಸಿದರು.”", "a": "ಸಬ್ಬತ್ತಿನ", "r": "5:18"}, {"n": 101, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 5:19ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದೈವಪುತ್ರನಿಗೆ ಸರ್ವಾಧಿಕಾರ", "r": "5:19"}, {"n": 102, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಪುತ್ರನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಏನು ಮಾಡಲಾರನು?", "a": "ಏನೂ ಮಾಡಲಾರನು", "r": "5:19"}, {"n": 103, "q": "ಪುತ್ರನು ಏನನ್ನು ಕಂಡು ಹಾಗೆಯೇ ಮಾಡುತ್ತಾನೆ?", "a": "ಪಿತನು ಮಾಡುವುದನ್ನು", "r": "5:19"}, {"n": 104, "q": "“ನನ್ನಷ್ಟಕ್ಕೇ ನಾನೇ ಏನೂ ಮಾಡಲಾರೆ” ಎಂಬ ವಿಚಾರ ಐದನೆಯ ಅಧ್ಯಾಯದ ಯಾವ ಎರಡು ವಚನಗಳಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "5:19 (ಪುತ್ರನು ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಏನೂ ಮಾಡಲಾರನು) ಮತ್ತು 5:30", "r": "5:19; 5:30"}, {"n": 105, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸು “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ ಹೇಳುತ್ತೇನೆ” ಎಂದು ಹೇಳುವ ವಚನಗಳು ಯಾವುವು?", "a": "5:19, 5:24, 5:25", "r": "5:19; 5:24; 5:25"}, {"n": 106, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರನ್ನು ಉದ್ದೇಶಿಸಿ ಹೀಗೆಂದರು:”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "5:19"}, {"n": 107, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಾನೇ ಏನೂ ಮಾಡಲಾರನು;”", "a": "ತನ್ನಷ್ಟಕ್ಕೆ", "r": "5:19"}, {"n": 108, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಂಡು ತಾನೂ ಹಾಗೆಯೇ ಮಾಡುತ್ತಾನೆ.”", "a": "ಮಾಡುವುದನ್ನು", "r": "5:19"}, {"n": 109, "q": "ಪಿತನು ತಾವು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಪುತ್ರನಿಗೆ ಏಕೆ ತೋರಿಸುತ್ತಾರೆ?", "a": "ಪುತ್ರನೆಂದರೆ ಪಿತನಿಗೆ ಪ್ರೀತಿ", "r": "5:20"}, {"n": 110, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ತೋರಿಸುವ ಮಿಗಿಲಾದ ಕಾರ್ಯಗಳನ್ನು ಕಂಡು ಜನರು ಏನಾಗುವರು?", "a": "ಬೆರಗಾಗುವರು", "r": "5:20"}, {"n": 111, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದುದರಿಂದ ತಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನಿಗೆ ತೋರಿಸುತ್ತಾರೆ.”", "a": "ಮಾಡುವುದನ್ನೆಲ್ಲಾ", "r": "5:20"}, {"n": 112, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದಲ್ಲದೆ ಇನ್ನೂ ಎಷ್ಟೋ ಮಿಗಿಲಾದ ಕಾರ್ಯಗಳನ್ನು ಪುತ್ರನಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೋರಿಸುತ್ತಾರೆ", "r": "5:20"}, {"n": 113, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವುಗಳನ್ನು ಕಂಡು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆರಗಾಗುವಿರಿ", "r": "5:20"}, {"n": 114, "q": "“ಆದುದರಿಂದ ತಾವು ಮಾಡುವುದನ್ನೆಲ್ಲಾ ಪುತ್ರನಿಗೆ ತೋರಿಸುತ್ತಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 20", "r": "5:20"}, {"n": 115, "q": "ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಜೀವ ಕೊಡುವಂತೆಯೇ ಪುತ್ರನು ಏನು ಮಾಡುತ್ತಾನೆ?", "a": "ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ", "r": "5:21"}, {"n": 116, "q": "ಪಿತನು ಸತ್ತವರಿಗೆ ಏನು ಮಾಡುತ್ತಾರೆ?", "a": "ಎಬ್ಬಿಸಿ ಜೀವವನ್ನು ಕೊಡುತ್ತಾರೆ", "r": "5:21"}, {"n": 117, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.”", "a": "ಸತ್ತವರನ್ನು", "r": "5:21"}, {"n": 118, "q": "“ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 21", "r": "5:21"}, {"n": 119, "q": "ಯೊವಾನ್ನ 5:21 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುವಂತೆಯೇ ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.", "r": "5:21"}, {"n": 120, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ಸತ್ತವರನ್ನು ಎಬ್ಬಿಸಿ ಅವರಿಗೆ ಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನೂ ತನಗೆ ಬೇಕಾದವರಿಗೆ ಜೀವವನ್ನು ಕೊಡುತ್ತಾನೆ.”", "a": "ಕೊಡುವಂತೆಯೇ", "r": "5:21"}, {"n": 121, "q": "ಪಿತನು ತೀರ್ಪುಕೊಡುವ ಅಧಿಕಾರವನ್ನೆಲ್ಲಾ ಯಾರಿಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ?", "a": "ಪುತ್ರನಿಗೆ", "r": "5:22"}, {"n": 122, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಪ್ರಕಾರ ತೀರ್ಪುಕೊಡುವ ಅಧಿಕಾರ ಯಾರಿಗೆ ಕೊಡಲಾಗಿದೆ ಮತ್ತು ಏಕೆ?", "a": "ಪುತ್ರನಿಗೆ; ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ", "r": "5:22; 5:27"}, {"n": 123, "q": "ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡದವರು ಯಾರು?", "a": "ಪಿತನು", "r": "5:22"}, {"n": 124, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲದೆ, ಪಿತನು ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗುರಿಮಾಡುವುದಿಲ್ಲ", "r": "5:22"}, {"n": 125, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ತೀರ್ಪುಕೊಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರು ಪುತ್ರನಿಗೆ ಕೊಟ್ಟಿದ್ದಾರೆ.”", "a": "ಅಧಿಕಾರವನ್ನೆಲ್ಲಾ", "r": "5:22"}, {"n": 126, "q": "“ಅಲ್ಲದೆ, ಪಿತನು ಯಾರನ್ನೂ ತೀರ್ಪಿಗೆ ಗುರಿಮಾಡುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 22", "r": "5:22"}, {"n": 127, "q": "ಪಿತನ ಬಯಕೆ ಏನು?", "a": "ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕು", "r": "5:23"}, {"n": 128, "q": "ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಯಾರನ್ನೂ ಗೌರವಿಸುವುದಿಲ್ಲ?", "a": "ಪುತ್ರನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ", "r": "5:23"}, {"n": 129, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಬಯಕೆ.”", "a": "ಗೌರವಿಸಬೇಕೆಂಬುದು", "r": "5:23"}, {"n": 130, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಆತನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಗೌರವಿಸುವುದಿಲ್ಲ", "r": "5:23"}, {"n": 131, "q": "“ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕೆಂಬುದು ಅವರ ಬಯಕೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 23", "r": "5:23"}, {"n": 132, "q": "ಯೊವಾನ್ನ 5:23 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಏಕೆಂದರೆ, ತಮ್ಮನ್ನು ಗೌರವಿಸುವಂತೆಯೇ ಜನರೆಲ್ಲರು ಪುತ್ರನನ್ನು ಗೌರವಿಸಬೇಕೆಂಬುದು ಅವರ ಬಯಕೆ. ಪುತ್ರನನ್ನು ಗೌರವಿಸದವನು ಆತನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನನ್ನೂ ಗೌರವಿಸುವುದಿಲ್ಲ.", "r": "5:23"}, {"n": 133, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುವವನು ಯಾರು?", "a": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ಅವರನ್ನು ಕಳುಹಿಸಿದಾತನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುವವನು", "r": "5:24"}, {"n": 134, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಡುವವನು ಈಗಾಗಲೇ ಏನು ಮಾಡಿರುತ್ತಾನೆ?", "a": "ಸಾವನ್ನು ದಾಟಿ ಜೀವವನ್ನು ಸೇರಿರುತ್ತಾನೆ", "r": "5:24"}, {"n": 135, "q": "ಯೇಸುವಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ವಿಶ್ವಾಸವಿಡುವವನು ಯಾವುದಕ್ಕೆ ಗುರಿ ಆಗನು?", "a": "ಖಂಡನೆಗೆ", "r": "5:24"}, {"n": 136, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ನಿಮಗೆ ಸತ್ಯವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>:”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "5:24"}, {"n": 137, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟು ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಆತನಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿತ್ಯಜೀವವನ್ನು ಪಡೆದಿರುತ್ತಾನೆ.”", "a": "ವಿಶ್ವಾಸವಿಡುವವನು", "r": "5:24"}, {"n": 138, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗುರಿ ಆಗನು;”", "a": "ಖಂಡನೆಗೆ", "r": "5:24"}, {"n": 139, "q": "ಸತ್ತವರು ಯಾರ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು?", "a": "ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 140, "q": "ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು ಕೇಳುವವರಿಗೆ ಏನಾಗುವುದು?", "a": "ಜೀವಿಸುವರು", "r": "5:25"}, {"n": 141, "q": "ಸತ್ತವರು ದೇವರ ಪುತ್ರನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಯಾವಾಗ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಬರುವುದು; ಈಗಾಗಲೇ ಬಂದಿದೆ", "r": "5:25"}, {"n": 142, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ಯವಾಗಿ ನಿಮಗೆ ಮತ್ತೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>;”", "a": "ಹೇಳುತ್ತೇನೆ", "r": "5:25"}, {"n": 143, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ತವರು ದೇವರ ಪುತ್ರನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳುವ ಕಾಲ ಬರುವುದು;”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 144, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕೇಳುವವರು ಜೀವಿಸುವರು.”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:25"}, {"n": 145, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ಏನಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ?", "a": "ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ", "r": "5:26"}, {"n": 146, "q": "ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವವರು ಯಾರು?", "a": "ಪಿತನು ಮತ್ತು ಪುತ್ರನು", "r": "5:26"}, {"n": 147, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ತಾವೇ ಸ್ವಯಂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.”", "a": "ಜೀವಮೂಲವಾಗಿರುವಂತೆ", "r": "5:26"}, {"n": 148, "q": "“ಪಿತನು ತಾವೇ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 26", "r": "5:26"}, {"n": 149, "q": "ಯೊವಾನ್ನ 5:26 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಪಿತನು ತಾವೇ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಪುತ್ರನು ಸಹ ಸ್ವಯಂ ಜೀವಮೂಲವಾಗಿರುವಂತೆ ಕರುಣಿಸಿದ್ದಾರೆ.", "r": "5:26"}, {"n": 150, "q": "ಪಿತನು ಪುತ್ರನಿಗೆ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಏಕೆ ದಯಪಾಲಿಸಿದ್ದಾರೆ?", "a": "ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ", "r": "5:27"}, {"n": 151, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೂ ಅಲ್ಲದೆ, ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.”", "a": "ನರಪುತ್ರನಾಗಿರುವ", "r": "5:27"}, {"n": 152, "q": "“ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 27", "r": "5:27"}, {"n": 153, "q": "ಯೊವಾನ್ನ 5:27 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ ದಯಪಾಲಿಸಿದ್ದಾರೆ.", "r": "5:27"}, {"n": 154, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದೂ ಅಲ್ಲದೆ, ಆತನು ನರಪುತ್ರನಾಗಿರುವ ಕಾರಣ ತೀರ್ಪನ್ನು ಕೊಡುವ ಹಕ್ಕನ್ನು ಆತನಿಗೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ದಯಪಾಲಿಸಿದ್ದಾರೆ", "r": "5:27"}, {"n": 155, "q": "ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು ಎಂದು ಯೇಸು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು?", "a": "ಸತ್ತು ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರ ಬಗ್ಗೆ", "r": "5:28"}, {"n": 156, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇದನ್ನು ಕೇಳಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೇಡ.”", "a": "ಬೆರಗಾಗುವುದು", "r": "5:28"}, {"n": 157, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸತ್ತು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು.”", "a": "ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರೂ", "r": "5:28"}, {"n": 158, "q": "“ಇದನ್ನು ಕೇಳಿ ನೀವು ಬೆರಗಾಗುವುದು ಬೇಡ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 28", "r": "5:28"}, {"n": 159, "q": "ಯೊವಾನ್ನ 5:28 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಇದನ್ನು ಕೇಳಿ ನೀವು ಬೆರಗಾಗುವುದು ಬೇಡ. ಸತ್ತು ಸಮಾಧಿಯಲ್ಲಿರುವವರೆಲ್ಲರೂ ಆತನ ಧ್ವನಿಯನ್ನು ಕೇಳುವ ಕಾಲ ಬರುವುದು.", "r": "5:28"}, {"n": 160, "q": "ಸಮಾಧಿಯಿಂದ ಎದ್ದುಬರುವ ಸಜ್ಜನರು ಮತ್ತು ದುರ್ಜನರು ಯಾವುದಕ್ಕಾಗಿ ಪುನರುತ್ಥಾನರಾಗುವರು?", "a": "ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ; ದುರ್ಜನರು ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ", "r": "5:29"}, {"n": 161, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹಾಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸಮಾಧಿಯನ್ನು ಬಿಟ್ಟು ಎದ್ದುಬರುವರು;”", "a": "ಕೇಳಿದವರೆಲ್ಲಾ", "r": "5:29"}, {"n": 162, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ದುರ್ಜನರು ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ ಪುನರುತ್ಥಾನ ಆಗುವರು.”", "a": "ಪುನರುತ್ಥಾನರಾಗುವರು", "r": "5:29"}, {"n": 163, "q": "“ಹಾಗೆ ಕೇಳಿದವರೆಲ್ಲಾ ಸಮಾಧಿಯನ್ನು ಬಿಟ್ಟು ಎದ್ದುಬರುವರು;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 29", "r": "5:29"}, {"n": 164, "q": "ವಚನವನ್ನು ಮುಂದುವರಿಸಿ: “ಸಜ್ಜನರು ಸಜ್ಜೀವಕ್ಕಾಗಿ ಪುನರುತ್ಥಾನರಾಗುವರು, ದುರ್ಜನರು …”", "a": "“… ದಂಡನಾ ತೀರ್ಪಿಗಾಗಿ ಪುನರುತ್ಥಾನ ಆಗುವರು.”", "r": "5:29"}, {"n": 165, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ 5:30ರಿಂದ ಆರಂಭವಾಗುವ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷ್ಯಗಳು", "r": "5:30"}, {"n": 166, "q": "ಯೇಸು ಯಾವುದರ ಪ್ರಕಾರ ತೀರ್ಪುಕೊಡುತ್ತಾರೆ?", "a": "ಪಿತನು ತಮಗೆ ತಿಳಿಸಿದ ಪ್ರಕಾರ", "r": "5:30"}, {"n": 167, "q": "ಯೇಸುವಿನ ತೀರ್ಪು ಏಕೆ ನ್ಯಾಯಬದ್ಧವಾದುದು?", "a": "ಅವರು ತಮ್ಮ ಸ್ವಂತ ಇಚ್ಛೆಯನ್ನು ನೆರವೇರಿಸದೆ ಪಿತನ ಚಿತ್ತವನ್ನೇ ನೆರವೇರಿಸಲು ಆಶಿಸುವುದರಿಂದ", "r": "5:30"}, {"n": 168, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನೇ ಏನೂ ಮಾಡಲಾರೆ.”", "a": "ನನ್ನಷ್ಟಕ್ಕೇ", "r": "5:30"}, {"n": 169, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನು ನನಗೆ ತಿಳಿಸಿದ ಪ್ರಕಾರ ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ತೀರ್ಪುಕೊಡುತ್ತೇನೆ", "r": "5:30"}, {"n": 170, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ನನ್ನ ತೀರ್ಪು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಆದುದು.”", "a": "ನ್ಯಾಯಬದ್ಧ", "r": "5:30"}, {"n": 171, "q": "ತಮ್ಮ ಪರವಾಗಿ ತಾವೇ ಸಾಕ್ಷಿ ನೀಡುವುದರ ಬಗ್ಗೆ ಯೇಸು ಏನು ಹೇಳಿದರು?", "a": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.”", "r": "5:31"}, {"n": 172, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬೆಲೆಯಿರದು", "r": "5:31"}, {"n": 173, "q": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 31", "r": "5:31"}, {"n": 174, "q": "ಯೊವಾನ್ನ 5:31 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ ಸಾಕ್ಷಿಗೆ ಬೆಲೆಯಿರದು.", "r": "5:31"}, {"n": 175, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ನಾನೇ ಸಾಕ್ಷಿ ನೀಡಿದರೆ ನನ್ನ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಲೆಯಿರದು.”", "a": "ಸಾಕ್ಷಿಗೆ", "r": "5:31"}, {"n": 176, "q": "ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವ ‘ಇನ್ನೊಬ್ಬನ’ ಸಾಕ್ಷ್ಯದ ಬಗ್ಗೆ ಯೇಸು ಏನು ಬಲ್ಲರು?", "a": "ಆತನು ನೀಡುವ ಸಾಕ್ಷ್ಯಕ್ಕೆ ಬೆಲೆಯಿದೆ ಎಂದು", "r": "5:32"}, {"n": 177, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ", "r": "5:32"}, {"n": 178, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ನೀಡುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಲೆಯಿದೆ ಎಂದು ನಾನು ಬಲ್ಲೆ.”", "a": "ಸಾಕ್ಷ್ಯಕ್ಕೆ", "r": "5:32"}, {"n": 179, "q": "“ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 32", "r": "5:32"}, {"n": 180, "q": "ಯೊವಾನ್ನ 5:32 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವಾತನು ಇನ್ನೊಬ್ಬನಿದ್ದಾನೆ. ಆತನು ನೀಡುವ ಸಾಕ್ಷ್ಯಕ್ಕೆ ಬೆಲೆಯಿದೆ ಎಂದು ನಾನು ಬಲ್ಲೆ.", "r": "5:32"}, {"n": 181, "q": "ಯೆಹೂದ್ಯರು ಯಾರ ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದರು?", "a": "ಯೊವಾನ್ನನ ಬಳಿಗೆ", "r": "5:33"}, {"n": 182, "q": "ಯೊವಾನ್ನನು ಯಾವುದನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ ಹೇಳಿದ್ದನು?", "a": "ಸತ್ಯವನ್ನು ಕುರಿತು", "r": "5:33"}, {"n": 183, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಯೇಸುವಿನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡುವ ನಾಲ್ಕು ಸಾಕ್ಷ್ಯಗಳು ಯಾವುವು?", "a": "1) ಯೊವಾನ್ನ (5:33); 2) ಯೇಸುವಿನ ಸುಕೃತ್ಯಗಳು (5:36); 3) ಪಿತ (5:37); 4) ಪವಿತ್ರ ಗ್ರಂಥ (5:39); (ಮೋಶೆ ಬರೆದುದು ಸಹ — 5:46)", "r": "5:33; 5:36; 5:37; 5:39"}, {"n": 184, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವೇ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದಿರಿ.”", "a": "ಯೊವಾನ್ನನ", "r": "5:33"}, {"n": 185, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಸತ್ಯವನ್ನು ಕುರಿತು ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳಿದ್ದಾನೆ", "r": "5:33"}, {"n": 186, "q": "“ನೀವೇ ಯೊವಾನ್ನನ ಬಳಿಗೆ ದೂತರನ್ನು ಕಳುಹಿಸಿದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 33", "r": "5:33"}, {"n": 187, "q": "ಯೇಸು ಯೊವಾನ್ನನ ಸಾಕ್ಷಿಯನ್ನು ಏಕೆ ಉಲ್ಲೇಖಿಸಿದರು?", "a": "ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ; ಜನರ ಉದ್ಧಾರಕ್ಕೆಂದು", "r": "5:34"}, {"n": 188, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅಲ್ಲ;”", "a": "ಬೇಕೆಂದು", "r": "5:34"}, {"n": 189, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೆ ಇದನ್ನೆಲ್ಲಾ ನಿಮ್ಮ ಉದ್ಧಾರಕ್ಕೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹೇಳುತ್ತಿದ್ದೇನೆ", "r": "5:34"}, {"n": 190, "q": "“ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ;” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 34", "r": "5:34"}, {"n": 191, "q": "ಯೊವಾನ್ನ 5:34 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ನನಗೆ ಮಾನವ ಸಾಕ್ಷಿ ಬೇಕೆಂದು ಅಲ್ಲ; ಆದರೆ ಇದನ್ನೆಲ್ಲಾ ನಿಮ್ಮ ಉದ್ಧಾರಕ್ಕೆಂದು ನಾನು ಹೇಳುತ್ತಿದ್ದೇನೆ.", "r": "5:34"}, {"n": 192, "q": "ಯೇಸು ಯೊವಾನ್ನನನ್ನು ಯಾವುದಕ್ಕೆ ಹೋಲಿಸಿದರು?", "a": "ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪಕ್ಕೆ", "r": "5:35"}, {"n": 193, "q": "ಯೊವಾನ್ನನೆಂಬ ಬೆಳಕಿನಲ್ಲಿ ಯೆಹೂದ್ಯರು ಎಷ್ಟು ಕಾಲ ನಲಿದಾಡಿದರು?", "a": "ಸ್ವಲ್ಪಕಾಲ", "r": "5:35"}, {"n": 194, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪದಂತೆ ಇದ್ದನು.”", "a": "ಯೊವಾನ್ನನು", "r": "5:35"}, {"n": 195, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಬೆಳಕಿನಲ್ಲಿ ನೀವು ಸ್ವಲ್ಪಕಾಲ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನಲಿದಾಡಿದಿರಿ", "r": "5:35"}, {"n": 196, "q": "“ಯೊವಾನ್ನನು ಉಜ್ವಲವಾಗಿ ಉರಿಯುವ ದೀಪದಂತೆ ಇದ್ದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 35", "r": "5:35"}, {"n": 197, "q": "ಯೊವಾನ್ನನ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ಯಾವುದು?", "a": "ಯೇಸು ಸಾಧಿಸುತ್ತಿರುವ ಸುಕೃತ್ಯಗಳು, ಅಂದರೆ ಪಿತನು ಅವರಿಗೆ ಮಾಡಿ ಮುಗಿಸಲು ಕೊಟ್ಟ ಕಾರ್ಯಗಳು", "r": "5:36"}, {"n": 198, "q": "ಯೇಸುವಿನ ಸುಕೃತ್ಯಗಳು ಯಾವುದಕ್ಕೆ ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ?", "a": "ಅವರು ಪಿತನಿಂದ ಬಂದವರೆಂದು", "r": "5:36"}, {"n": 199, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೀಡಿದ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ನನಗುಂಟು:”", "a": "ಯೊವಾನ್ನನು", "r": "5:36"}, {"n": 200, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಸಾಧಿಸುತ್ತಿರುವ ಸುಕೃತ್ಯಗಳೇ, ಅಂದರೆ, ಪಿತನು ನನಗೆ ಮಾಡಿ ಮುಗಿಸಲು ಕೊಟ್ಟ ಕಾರ್ಯಗಳೇ, ನಾನು ಪಿತನಿಂದ ಬಂದವನೆಂದು ನನ್ನ ಪರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಕೊಡುತ್ತವೆ", "r": "5:36"}, {"n": 201, "q": "“ಯೊವಾನ್ನನು ನೀಡಿದ ಸಾಕ್ಷ್ಯಕ್ಕಿಂತಲೂ ಮಿಗಿಲಾದ ಸಾಕ್ಷ್ಯ ನನಗುಂಟು:” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 36", "r": "5:36"}, {"n": 202, "q": "ಯೇಸುವನ್ನು ಕಳುಹಿಸಿ ಅವರ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದವರು ಯಾರು?", "a": "ಪಿತನೇ", "r": "5:37"}, {"n": 203, "q": "ಯೆಹೂದ್ಯರು ಪಿತನ ಯಾವ ಎರಡನ್ನು ಎಂದೂ ಅನುಭವಿಸಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ಅವರ ಧ್ವನಿಯನ್ನು ಕೇಳಿಲ್ಲ; ಅವರ ದರ್ಶನವನ್ನು ಕಂಡಿಲ್ಲ", "r": "5:37"}, {"n": 204, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೀಡಿದ್ದಾರೆ", "r": "5:37"}, {"n": 205, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನೀವಾದರೋ ಅವರ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಂದೂ ಕೇಳಿಲ್ಲ, ಅವರ ದರ್ಶನವನ್ನು ಎಂದೂ ಕಂಡಿಲ್ಲ.”", "a": "ಧ್ವನಿಯನ್ನು", "r": "5:37"}, {"n": 206, "q": "“ನನ್ನನ್ನು ಕಳುಹಿಸಿದ ಪಿತನೇ ನನ್ನ ಪರವಾಗಿ ಸಾಕ್ಷಿ ನೀಡಿದ್ದಾರೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 37", "r": "5:37"}, {"n": 207, "q": "ಪಿತನ ಸಂದೇಶ ಯೆಹೂದ್ಯರಲ್ಲಿ ಏಕೆ ನೆಲಸಿಲ್ಲ?", "a": "ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ಯೆಹೂದ್ಯರು ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ", "r": "5:38"}, {"n": 208, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಸಂದೇಶ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನೆಲಸಿಲ್ಲ.”", "a": "ನಿಮ್ಮಲ್ಲಿ", "r": "5:38"}, {"n": 209, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ", "r": "5:38"}, {"n": 210, "q": "ಯೊವಾನ್ನ 5:38 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಅವರ ಸಂದೇಶ ನಿಮ್ಮಲ್ಲಿ ನೆಲಸಿಲ್ಲ. ಏಕೆಂದರೆ, ಅವರು ಕಳುಹಿಸಿದವನಲ್ಲಿ ನೀವು ವಿಶ್ವಾಸವಿಡಲಿಲ್ಲ.", "r": "5:38"}, {"n": 211, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅವರ ಸಂದೇಶ ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ನೆಲಸಿಲ್ಲ", "r": "5:38"}, {"n": 212, "q": "ಯೆಹೂದ್ಯರು ಪವಿತ್ರ ಗ್ರಂಥವನ್ನು ಏಕೆ ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತಿದ್ದರು?", "a": "ಅದರಿಂದಲೇ ನಿತ್ಯಜೀವ ಲಭಿಸುವುದೆಂದು ಭಾವಿಸಿ", "r": "5:39"}, {"n": 213, "q": "ಪವಿತ್ರ ಗ್ರಂಥವು ಯಾರ ಪರವಾಗಿ ಸಾಕ್ಷಿಹೇಳುತ್ತದೆ?", "a": "ಯೇಸುವಿನ ಪರವಾಗಿ", "r": "5:39"}, {"n": 214, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪವಿತ್ರ ಗ್ರಂಥದಿಂದಲೇ ನಿತ್ಯಜೀವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಭಾವಿಸಿ, ನೀವು ಅದನ್ನು ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತೀರಿ.”", "a": "ಲಭಿಸುವುದೆಂದು", "r": "5:39"}, {"n": 215, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆ ಗ್ರಂಥವು ಸಹ ನನ್ನ ಪರವಾಗಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಸಾಕ್ಷಿಹೇಳುತ್ತದೆ", "r": "5:39"}, {"n": 216, "q": "“ಪವಿತ್ರ ಗ್ರಂಥದಿಂದಲೇ ನಿತ್ಯಜೀವ ಲಭಿಸುವುದೆಂದು ಭಾವಿಸಿ, ನೀವು ಅದನ್ನು ಪರಿಶೀಲಿಸಿ ನೋಡುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 39", "r": "5:39"}, {"n": 217, "q": "ಯೆಹೂದ್ಯರಿಗೆ ಯಾವುದು ಇಷ್ಟವಿಲ್ಲ ಎಂದು ಯೇಸು ಹೇಳಿದರು?", "a": "ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ಯೇಸುವಿನ ಬಳಿಗೆ ಬರಲು", "r": "5:40"}, {"n": 218, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.”", "a": "ಪಡೆಯುವುದಕ್ಕಾಗಿ", "r": "5:40"}, {"n": 219, "q": "“ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 40", "r": "5:40"}, {"n": 220, "q": "ಯೊವಾನ್ನ 5:40 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆದರೂ ನಿತ್ಯಜೀವವನ್ನು ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.", "r": "5:40"}, {"n": 221, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಡೆಯುವುದಕ್ಕಾಗಿ ನನ್ನ ಬಳಿಗೆ ಬರಲು ನಿಮಗೆ ಇಷ್ಟವಿಲ್ಲ.”", "a": "ನಿತ್ಯಜೀವವನ್ನು", "r": "5:40"}, {"n": 222, "q": "ಯೇಸು ಯಾವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ?", "a": "ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು", "r": "5:41"}, {"n": 223, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಅರಸುವುದಿಲ್ಲ", "r": "5:41"}, {"n": 224, "q": "“ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 41", "r": "5:41"}, {"n": 225, "q": "ಯೊವಾನ್ನ 5:41 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "“ನಾನು ಮನುಷ್ಯರಿಂದ ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.", "r": "5:41"}, {"n": 226, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬರುವ ಗೌರವವನ್ನು ಅರಸುವುದಿಲ್ಲ.”", "a": "ಮನುಷ್ಯರಿಂದ", "r": "5:41"}, {"n": 227, "q": "ಯೆಹೂದ್ಯರ ಬಗ್ಗೆ ಯೇಸು ಏನನ್ನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವರಾಗಿದ್ದರು?", "a": "ದೇವರ ಮೇಲೆ ಅವರಿಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು", "r": "5:42"}, {"n": 228, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮೇಲೆ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.”", "a": "ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು", "r": "5:42"}, {"n": 229, "q": "“ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 42", "r": "5:42"}, {"n": 230, "q": "ಯೊವಾನ್ನ 5:42 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ.", "r": "5:42"}, {"n": 231, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ದೇವರ ಮೇಲೆ ನಿಮಗೆ ಪ್ರೀತಿಯಿಲ್ಲವೆಂದು ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬಲ್ಲೆ.”", "a": "ಚೆನ್ನಾಗಿ", "r": "5:42"}, {"n": 232, "q": "ಯೇಸು ಯಾರ ಹೆಸರಿನಲ್ಲಿ ಬಂದಿದ್ದಾರೆ?", "a": "ಪಿತನ ಹೆಸರಿನಲ್ಲೇ", "r": "5:43"}, {"n": 233, "q": "ಪಿತನ ಹೆಸರಿನಲ್ಲಿ ಬಂದ ಯೇಸುವಿಗೂ ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬರುವವನಿಗೂ ಯೆಹೂದ್ಯರು ತೋರುವ ವ್ಯತ್ಯಾಸವೇನು?", "a": "ಯೇಸುವನ್ನು ಬರಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ; ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬಂದವನನ್ನು ಬರಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ", "r": "5:43"}, {"n": 234, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ನಾನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಿತನ ಹೆಸರಿನಲ್ಲೇ.”", "a": "ಬಂದಿರುವುದು", "r": "5:43"}, {"n": 235, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆದರೂ ನೀವು ನನ್ನನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುವುದಿಲ್ಲ", "r": "5:43"}, {"n": 236, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಬೇರೊಬ್ಬನು ತನ್ನ ಸ್ವಂತ ಹೆಸರಿನಲ್ಲಿ ಬಂದನೆಂದರೆ ಅಂಥವನನ್ನು ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬರಮಾಡಿಕೊಳ್ಳುತ್ತೀರಿ", "r": "5:43"}, {"n": 237, "q": "ಯೇಸುವಿನ ಪ್ರಕಾರ ಯೆಹೂದ್ಯರಲ್ಲಿ ವಿಶ್ವಾಸ ಮೂಡಲು ಏಕೆ ಸಾಧ್ಯವಿಲ್ಲ?", "a": "ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ತಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು ಬಯಸುವುದರಿಂದ", "r": "5:44"}, {"n": 238, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಕಾರಣ, ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ನಿಮ್ಮ ನಿಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಬಯಸುತ್ತೀರಿ", "r": "5:44"}, {"n": 239, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಹೀಗಿರುವಲ್ಲಿ, ನಿಮ್ಮಲ್ಲಿ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಹೇಗೆ ತಾನೆ ಸಾಧ್ಯ?”", "a": "ವಿಶ್ವಾಸಮೂಡಲು", "r": "5:44"}, {"n": 240, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಪಿತನ ಮುಂದೆ ನಾನು ನಿಮ್ಮನ್ನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎಣಿಸಬೇಡಿ.”", "a": "ಆಪಾದಿಸುತ್ತಿರುವೆನೆಂದು", "r": "5:44"}, {"n": 241, "q": "“ಕಾರಣ, ದೇವರಿಂದ ಸಿಗುವಂಥ ಗೌರವವನ್ನು ಅರಸದೆ ನಿಮ್ಮ ನಿಮ್ಮಲ್ಲೇ ಪರಸ್ಪರ ಗೌರವವನ್ನು ಬಯಸುತ್ತೀರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 44", "r": "5:44"}, {"n": 242, "q": "ಪಿತನ ಮುಂದೆ ಯೆಹೂದ್ಯರನ್ನು ಆಪಾದಿಸುವವನು ಯಾರು?", "a": "ಅವರು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ ಮೋಶೆ", "r": "5:45"}, {"n": 243, "q": "ಯೇಸು ಪಿತನ ಮುಂದೆ ಯೆಹೂದ್ಯರನ್ನು ಏನು ಮಾಡುತ್ತಿರುವರೆಂದು ಎಣಿಸಬಾರದು?", "a": "ಆಪಾದಿಸುತ್ತಿರುವರೆಂದು", "r": "5:45"}, {"n": 244, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೇ ನೀವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೋಶೆ.”", "a": "ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ", "r": "5:45"}, {"n": 245, "q": "ಯೊವಾನ್ನ 5:45 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆಪಾದಿಸುವವನು ಒಬ್ಬನಿದ್ದಾನೆ. ಆತನೇ ನೀವು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ ಮೋಶೆ.", "r": "5:45"}, {"n": 246, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನೇ ನೀವು ಆಶ್ರಯಿಸಿಕೊಂಡಿರುವ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಮೋಶೆ", "r": "5:45"}, {"n": 247, "q": "ಮೋಶೆಯಲ್ಲಿ ವಿಶ್ವಾಸವಿದ್ದರೆ ಯೆಹೂದ್ಯರು ಯೇಸುವಿನಲ್ಲಿ ವಿಶ್ವಾಸವಿಡುತ್ತಿದ್ದರು ಎಂದು ಯೇಸು ಹೇಳಲು ಕಾರಣವೇನು?", "a": "ಮೋಶೆ ಬರೆದುದು ಯೇಸುವನ್ನು ಕುರಿತೇ", "r": "5:46"}, {"n": 248, "q": "ಮೋಶೆ ಯಾರನ್ನು ಕುರಿತು ಬರೆದನು?", "a": "ಯೇಸುವನ್ನು", "r": "5:46"}, {"n": 249, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ವಿಶ್ವಾಸ ಇದ್ದಿದ್ದರೆ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುತ್ತಿದ್ದಿರಿ.”", "a": "ಮೋಶೆಯಲ್ಲಿ", "r": "5:46"}, {"n": 250, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ಆತನು ಬರೆದುದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕುರಿತೇ.”", "a": "ನನ್ನನ್ನು", "r": "5:46"}, {"n": 251, "q": "“ಮೋಶೆಯಲ್ಲಿ ನಿಮಗೆ ವಿಶ್ವಾಸ ಇದ್ದಿದ್ದರೆ ನನ್ನಲ್ಲಿ ವಿಶ್ವಾಸ ಇಡುತ್ತಿದ್ದಿರಿ.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 46", "r": "5:46"}, {"n": 252, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಐದನೆಯ ಅಧ್ಯಾಯದ ಕೊನೆಯಲ್ಲಿ ಯೇಸು ಕೇಳುವ ಪ್ರಶ್ನೆ ಯಾವುದು?", "a": "“ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "r": "5:47"}, {"n": 253, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "a": "ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ", "r": "5:47"}, {"n": 254, "q": "“ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 5ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 47", "r": "5:47"}, {"n": 255, "q": "ಯೊವಾನ್ನ 5:47 ವಚನವನ್ನು ಬರೆಯಿರಿ.", "a": "ಆತನು ಬರೆದುದರಲ್ಲಿ ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "r": "5:47"}, {"n": 256, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆತನು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ನಿಮಗೆ ನಂಬಿಕೆಯಿಲ್ಲವೆಂದ ಮೇಲೆ ನನ್ನ ಮಾತಿನಲ್ಲಿ ನಿಮಗೆ ಹೇಗೆ ನಂಬಿಕೆ ಹುಟ್ಟೀತು?”", "a": "ಬರೆದುದರಲ್ಲಿ", "r": "5:47"}]}, {"chapter": 6, "label": "ಅಧ್ಯಾಯ 6", "verses": 71, "questions": [{"n": 1, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದ ಮೊದಲ ವಿಭಾಗದ ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಅದ್ಭುತ ಆಹಾರ", "r": "6:1"}, {"n": 2, "q": "ಗಲಿಲೇಯ ಸರೋವರಕ್ಕೆ ಇರುವ ಇನ್ನೊಂದು ಹೆಸರೇನು?", "a": "ತಿಬೇರಿಯ ಸರೋವರ", "r": "6:1"}, {"n": 3, "q": "ಯೇಸು ಯಾವ ಸರೋವರವನ್ನು ದಾಟಿ ಆಚೆಯ ದಡಕ್ಕೆ ಹೋದರು?", "a": "ಗಲಿಲೇಯ ಸರೋವರವನ್ನು", "r": "6:1"}, {"n": 4, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಆರನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಸರೋವರ ಮತ್ತು ಊರುಗಳು ಯಾವುವು?", "a": "ಗಲಿಲೇಯ (ತಿಬೇರಿಯ) ಸರೋವರ; ಕಫೆರ್ನವುಮ್; ತಿಬೇರಿಯ", "r": "6:1; 6:16; 6:23"}, {"n": 5, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಗಲಿಲೇಯ ಸರೋವರವನ್ನು ದಾಟಿ, ಆಚೆಯ ದಡಕ್ಕೆ ಹೋದರು.”", "a": "ಯೇಸುಸ್ವಾಮಿ", "r": "6:1"}, {"n": 6, "q": "ಜನರ ದೊಡ್ಡ ಗುಂಪು ಯೇಸುವಿನ ಹಿಂದೆ ಏಕೆ ಹೋಯಿತು?", "a": "ಯೇಸು ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಾ ರೋಗಪೀಡಿತರನ್ನು ಗುಣಪಡಿಸುತ್ತಿದ್ದುದನ್ನು ಅವರು ನೋಡಿದ್ದರಿಂದ", "r": "6:2"}, {"n": 7, "q": "ಜನರು ಯೇಸುವಿನ ಹಿಂದೆ ಹೋದದ್ದು ಯಾವುದನ್ನು ನೋಡಿದ್ದರಿಂದ?", "a": "ಯೇಸು ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಾ ರೋಗಪೀಡಿತರನ್ನು ಗುಣಪಡಿಸುತ್ತಿದ್ದುದನ್ನು", "r": "6:2"}, {"n": 8, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಜನರು ದೊಡ್ಡ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರ ಹಿಂದೆ ಹೋಯಿತು.”", "a": "ಗುಂಪೊಂದು", "r": "6:2"}, {"n": 9, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಸೂಚಕಕಾರ್ಯಗಳನ್ನು ಮಾಡುತ್ತಾ ರೋಗಪೀಡಿತರನ್ನು ಗುಣಪಡಿಸುತ್ತಾ ಇದ್ದುದ್ದನ್ನು ಆ ಜನರು ನೋಡಿದ್ದರು.”", "a": "ಯೇಸು", "r": "6:2"}, {"n": 10, "q": "ಯೇಸು ಶಿಷ್ಯರ ಸಂಗಡ ಎಲ್ಲಿ ಕುಳಿತುಕೊಂಡರು?", "a": "ಬೆಟ್ಟವನ್ನು ಹತ್ತಿ (ಬೆಟ್ಟದ ಮೇಲೆ)", "r": "6:3"}, {"n": 11, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಬೆಟ್ಟವನ್ನು ಹತ್ತಿ ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡರು.”", "a": "ಯೇಸು", "r": "6:3"}, {"n": 12, "q": "“ಯೇಸು ಬೆಟ್ಟವನ್ನು ಹತ್ತಿ ತಮ್ಮ ಶಿಷ್ಯರ ಸಂಗಡ ಕುಳಿತುಕೊಂಡರು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 3", "r": "6:3"}, {"n": 13, "q": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ ನೀಡಿದ ಸಮಯದಲ್ಲಿ ಯಾವ ಹಬ್ಬ ಹತ್ತಿರವಾಗಿತ್ತು?", "a": "ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬ", "r": "6:4"}, {"n": 14, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಯೆಹೂದ್ಯರ ಪಾಸ್ಕ ಹಬ್ಬವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಹತ್ತಿರವಾಗಿತ್ತು", "r": "6:4"}, {"n": 15, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪಾಸ್ಕ ಹಬ್ಬವು ಹತ್ತಿರವಾಗಿತ್ತು.”", "a": "ಯೆಹೂದ್ಯರ", "r": "6:4"}, {"n": 16, "q": "ದೊಡ್ಡ ಗುಂಪು ಬರುವುದನ್ನು ಕಂಡ ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ಏನು ಕೇಳಿದರು?", "a": "“ಈ ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ನಾವು ಎಲ್ಲಿಂದ ಕೊಂಡುಕೊಳ್ಳುವುದು?”", "r": "6:5"}, {"n": 17, "q": "ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ಎಲ್ಲಿಂದ ಕೊಳ್ಳುವುದು ಎಂದು ಯೇಸು ಯಾರನ್ನು ಕೇಳಿದರು?", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "6:5"}, {"n": 18, "q": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ ನೀಡಿದ ಘಟನೆಯಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಇಬ್ಬರು ಶಿಷ್ಯರು ಯಾರು?", "a": "ಫಿಲಿಪ್ಪ ಮತ್ತು ಅಂದ್ರೆಯ", "r": "6:5–9"}, {"n": 19, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಕಣ್ಣು ಹಾಯಿಸಿ ನೋಡಿದಾಗ ಆ ದೊಡ್ಡ ಗುಂಪು ತಮ್ಮ ಕಡೆಗೆ ಬರುವುದನ್ನು ಕಂಡರು.”", "a": "ಯೇಸು", "r": "6:5"}, {"n": 20, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಈ ಜನರ ಊಟಕ್ಕೆ ರೊಟ್ಟಿಯನ್ನು ನಾವು ಎಲ್ಲಿಂದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>?”", "a": "ಕೊಂಡುಕೊಳ್ಳುವುದು", "r": "6:5"}, {"n": 21, "q": "ಯೇಸು ಫಿಲಿಪ್ಪನನ್ನು ರೊಟ್ಟಿಯ ಬಗ್ಗೆ ಏಕೆ ಕೇಳಿದರು?", "a": "ಫಿಲಿಪ್ಪನನ್ನು ಪರೀಕ್ಷಿಸುವ ಸಲುವಾಗಿ", "r": "6:6"}, {"n": 22, "q": "ಫಿಲಿಪ್ಪನನ್ನು ಕೇಳಿದರೂ ಯೇಸುವಿಗೆ ಏನು ತಿಳಿದಿತ್ತು?", "a": "ತಾವು ಮಾಡಲಿರುವುದು", "r": "6:6"}, {"n": 23, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಪರೀಕ್ಷಿಸುವ ಸಲುವಾಗಿ ಅವರು ಹಾಗೆ ಹೇಳಿದರು.”", "a": "ಫಿಲಿಪ್ಪನನ್ನು", "r": "6:6"}, {"n": 24, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಏಕೆಂದರೆ, ತಾವು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಅವರಿಗೆ ತಿಳಿದಿತ್ತು.”", "a": "ಮಾಡಲಿರುವುದು", "r": "6:6"}, {"n": 25, "q": "ಫಿಲಿಪ್ಪನ ಪ್ರಕಾರ ಎಷ್ಟು ದಿನಾರಿ ನಾಣ್ಯಗಳ ರೊಟ್ಟಿ ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು?", "a": "ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳು", "r": "6:7"}, {"n": 26, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅದಕ್ಕೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳನ್ನು ಕೊಟ್ಟು ರೊಟ್ಟಿಯನ್ನು ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು, ಎಂದನು.”", "a": "ಫಿಲಿಪ್ಪನು", "r": "6:7"}, {"n": 27, "q": "“ಅದಕ್ಕೆ ಫಿಲಿಪ್ಪನು, ಇನ್ನೂರು ದಿನಾರಿ ನಾಣ್ಯಗಳನ್ನು ಕೊಟ್ಟು ರೊಟ್ಟಿಯನ್ನು ತಂದರೂ ಆಳಿಗೊಂದು ತುಂಡೂ ಬಾರದು, ಎಂದನು.” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 7", "r": "6:7"}, {"n": 28, "q": "ಹುಡುಗನ ಬಳಿ ಇದ್ದ ರೊಟ್ಟಿ ಮೀನುಗಳ ಬಗ್ಗೆ ತಿಳಿಸಿದ ಶಿಷ್ಯ ಯಾರು?", "a": "ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು", "r": "6:8"}, {"n": 29, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು, ಅಂದರೆ ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>,”", "a": "ಅಂದ್ರೆಯನು", "r": "6:8"}, {"n": 30, "q": "“ಆಗ ಶಿಷ್ಯರಲ್ಲಿ ಒಬ್ಬನು, ಅಂದರೆ ಸಿಮೋನ್ ಪೇತ್ರನ ಸಹೋದರನಾದ ಅಂದ್ರೆಯನು,” — ಈ ಮಾತುಗಳು ಯೊವಾನ್ನ 6ನೇ ಅಧ್ಯಾಯದ ಯಾವ ವಚನದಲ್ಲಿವೆ?", "a": "ವಚನ 8", "r": "6:8"}, {"n": 31, "q": "ಹುಡುಗನ ಬಳಿ ಏನೇನಿದ್ದವು?", "a": "ಜವೆಗೋದಿಯ ಐದು ರೊಟ್ಟಿಗಳೂ ಎರಡು ಮೀನುಗಳೂ", "r": "6:9"}, {"n": 32, "q": "ಹುಡುಗನ ಬಳಿ ಎಷ್ಟು ರೊಟ್ಟಿಗಳು ಮತ್ತು ಎಷ್ಟು ಮೀನುಗಳಿದ್ದವು?", "a": "ಐದು ರೊಟ್ಟಿಗಳು; ಎರಡು ಮೀನುಗಳು", "r": "6:9"}, {"n": 33, "q": "ಹುಡುಗನ ಬಳಿ ಇದ್ದ ರೊಟ್ಟಿಗಳು ಯಾವ ಧಾನ್ಯದವು?", "a": "ಜವೆಗೋದಿಯ", "r": "6:9"}, {"n": 34, "q": "ಹುಡುಗನ ರೊಟ್ಟಿ ಮೀನುಗಳ ಬಗ್ಗೆ ಹೇಳಿದ ನಂತರ ಅಂದ್ರೆಯನು ಏನು ಕೇಳಿದನು?", "a": "“ಆದರೆ ಈ ಜನಸಮೂಹಕ್ಕೆ ಇವೆಲ್ಲಿ ಸಾಕಾಗುತ್ತವೆ?”", "r": "6:9"}, {"n": 35, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಇಲ್ಲಿ ಒಬ್ಬ ಹುಡುಗನ ಬಳಿ ಜವೆಗೋದಿಯ ಐದು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ಎರಡು ಮೀನುಗಳೂ ಇವೆ.”", "a": "ರೊಟ್ಟಿಗಳೂ", "r": "6:9"}, {"n": 36, "q": "ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಜನರ ಬಗ್ಗೆ ಏನು ಆಜ್ಞೆ ಕೊಟ್ಟರು?", "a": "“ಜನರನ್ನು ಊಟಕ್ಕೆ ಕೂರಿಸಿರಿ”", "r": "6:10"}, {"n": 37, "q": "ಜನರು ಎಲ್ಲಿ ಕುಳಿತುಕೊಂಡರು?", "a": "ಅಲ್ಲಿ ಹುಲುಸಾಗಿದ್ದ ಹುಲ್ಲಿನ ಮೇಲೆ", "r": "6:10"}, {"n": 38, "q": "ಯೇಸು ಊಟ ನೀಡಿದ ಜನರಲ್ಲಿ ಗಂಡಸರ ಸಂಖ್ಯೆ ಎಷ್ಟಿತ್ತು?", "a": "ಐದುಸಾವಿರದಷ್ಟು", "r": "6:10"}, {"n": 39, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ಜನರನ್ನು ಊಟಕ್ಕೆ ಕೂರಿಸಿರಿ, ಎಂದರು.”", "a": "ಯೇಸು", "r": "6:10"}, {"n": 40, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಅಲ್ಲಿ ಹುಲುಸಾಗಿದ್ದ ಹುಲ್ಲಿನ ಮೇಲೆ ಜನರು <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>.”", "a": "ಕುಳಿತುಕೊಂಡರು", "r": "6:10"}, {"n": 41, "q": "ರೊಟ್ಟಿಗಳನ್ನು ಹಂಚುವ ಮೊದಲು ಯೇಸು ಏನು ಮಾಡಿದರು?", "a": "ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿದರು", "r": "6:11"}, {"n": 42, "q": "ಜನರು ಎಷ್ಟು ತಿಂದರು?", "a": "ತಮಗೆ ಬೇಕಾದಷ್ಟು", "r": "6:11"}, {"n": 43, "q": "ಯೇಸು ರೊಟ್ಟಿಗಳೊಂದಿಗೆ ಬೇರೆ ಏನನ್ನು ಹಂಚಿಕೊಟ್ಟರು?", "a": "ಮೀನುಗಳನ್ನು", "r": "6:11"}, {"n": 44, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “<span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span>, ರೊಟ್ಟಿಗಳನ್ನು ತೆಗೆದುಕೊಂಡು ದೇವರಿಗೆ ಸ್ತೋತ್ರವನ್ನು ಸಲ್ಲಿಸಿ, ಕುಳಿತಿದ್ದ ಜನರಿಗೆ ಅವುಗಳನ್ನು ಹಂಚಿದರು.”", "a": "ಯೇಸು", "r": "6:11"}, {"n": 45, "q": "ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ: “ಎಲ್ಲರೂ ತಮಗೆ <span style=\"display:inline-block;min-width:20mm;border-bottom:0.6pt solid #333;transform:translateY(-2pt);margin:0 1mm\"><\/span> ತಿಂದರು.”", "a": "ಬೇಕಾದಷ್ಟು", "r": "6:11"}, {"n": 46, "q": "ಜನರು ತಿಂದು ತೃಪ್ತರಾದ ಮೇಲೆ ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಏನು ಹೇಳಿದರು?", "a": "“ತಿಂದುಳಿದ ತುಂಡುಗಳನ್ನೆಲ್ಲಾ ಒಟ್ಟುಗೂಡಿಸಿರಿ; ಒಂದು ತುಂಡೂ ಹಾಳಾಗಬಾರದು”", "r": "6:12"}, {"n": 47, "q": "ವಾಕ್ಯ ಪೂ
