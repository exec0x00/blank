": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 40, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ ತನ್ನ ಉದ್ದೇಶವನ್ನು ಯಾವ ವಚನದಲ್ಲಿ ತಾನೇ ಹೇಳಿಕೊಳ್ಳುತ್ತದೆ?", "a": "20:31", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ; 20:31"}, {"n": 41, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಬರೆದವುಗಳ ಉದ್ದೇಶ ಏನು ಎಂದು ಮುನ್ನುಡಿ ಉಲ್ಲೇಖಿಸುತ್ತದೆ?", "a": "ಯೇಸುಸ್ವಾಮಿ ದೇವರ ಪುತ್ರ ಹಾಗೂ ಲೋಕೋದ್ಧಾರಕ ಎಂದು ನೀವು ನಂಬಿ ವಿಶ್ವಾಸಿಸಬೇಕು; ಹೀಗೆ ವಿಶ್ವಾಸಿಸಿ ಅವರ ಹೆಸರಿನಲ್ಲಿ ಸಜೀವವನ್ನು ಪಡೆಯಬೇಕು", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ; 20:31"}, {"n": 42, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸುವಿನ ಸೂಚಕಕಾರ್ಯಗಳ ಗುರಿ ಹಾಗೂ ಧ್ಯೇಯ ಏನು?", "a": "ಯೇಸುಸ್ವಾಮಿ ದೇವರ ಏಕೈಕ ಪುತ್ರ ಹಾಗೂ ಪುರಾತನ ಕಾಲದಿಂದಲೂ ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ಲೋಕೋದ್ಧಾರಕ ಎಂಬ ಸತ್ಯವನ್ನು ಸಾದೃಶ್ಯ ಪಡಿಸುವುದು", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 43, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೇಸುವಿಗೂ ಅವರ ಆಪ್ತಶಿಷ್ಯರಿಗೂ ಇದ್ದ ನಿಕಟ ಬಾಂಧವ್ಯವನ್ನು ಯಾವ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ವರ್ಣಿಸಲಾಗಿದೆ?", "a": "ಅಧ್ಯಾಯ 13 ರಿಂದ 17ರವರೆಗೆ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 44, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಕೊನೆಯ ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಏನೇನನ್ನು ವಿವರಿಸಲಾಗಿದೆ?", "a": "ಯೇಸುವಿನ ಬಂಧನ, ನ್ಯಾಯವಿಚಾರಣೆ, ಶಿಲುಬೆಮರಣ, ಪುನರುತ್ಥಾನ, ಶಿಷ್ಯರಿಗಿತ್ತ ದಿವ್ಯ ದರ್ಶನಗಳು", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 45, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಕೆಲವು ಮೂಲ ಪ್ರತಿಗಳಲ್ಲಿ ಯಾವ ವೃತ್ತಾಂತವಿಲ್ಲ?", "a": "ವ್ಯಭಿಚಾರದಲ್ಲಿ ಸಿಕ್ಕಿಬಿದ್ದ ಸ್ತ್ರೀಯ ವೃತ್ತಾಂತ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ; 8:1-11"}, {"n": 46, "q": "ವ್ಯಭಿಚಾರಿಣಿಯ ವೃತ್ತಾಂತವನ್ನು (8:1–11) KRCBCಯಲ್ಲಿ ಆವರಣಗಳೊಳಗೆ ಏಕೆ ಕೊಡಲಾಗಿದೆ?", "a": "ಕೆಲವು ಮೂಲ ಪ್ರತಿಗಳಲ್ಲಿ ಅದು ಇಲ್ಲ; ಮತ್ತೆ ಕೆಲವು ಪ್ರತಿಗಳಲ್ಲಿ ಅದು ಬೇರೆ ಬೇರೆ ಅಧ್ಯಾಯಗಳಡಿ ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತದೆ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ; 8:1-11"}, {"n": 47, "q": "ಮುನ್ನುಡಿಯಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಯೇಸುವಿನ ‘ನಾನೇ’ ಎಂಬ ಮಾತು ಯಾವುದು?", "a": "‘ಮಾರ್ಗವೂ ಸತ್ಯವೂ ಜೀವವೂ ನಾನೇ’", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 48, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಕ್ರಿಸ್ತಯೇಸು ಅನುಗ್ರಹಿಸುವ ಜೀವ ಹೇಗಿದೆ?", "a": "ಸತ್ಯವಾದುದು, ನಿತ್ಯವಾದುದು; ಅದೊಂದು ಪರಮೋನ್ನತ ಕೊಡುಗೆ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 49, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನು ಆಧ್ಯಾತ್ಮಿಕ ಸತ್ಯಗಳನ್ನು ವ್ಯಕ್ತಪಡಿಸಲು ಉಪಯೋಗಿಸುವ ದಿನನಿತ್ಯದ ಪದಾರ್ಥಗಳು ಯಾವುವು?", "a": "ನೀರು, ರೊಟ್ಟಿ, ಬೆಳಕು, ದ್ರಾಕ್ಷಾರಸ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 50, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನು ಉಪಯೋಗಿಸುವ ಎರಡು ಸಾಮಾನ್ಯ ಉದಾಹರಣೆಗಳು ಯಾವುವು?", "a": "ಕುರಿ ಮತ್ತು ಕುರಿಗಾಹಿ", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 51, "q": "ಮುನ್ನುಡಿಯ ಪ್ರಕಾರ ಯೊವಾನ್ನನ ವೈಶಿಷ್ಟ್ಯ ಏನು?", "a": "ದಿನನಿತ್ಯದ ಪದಾರ್ಥಗಳ ಮೂಲಕ, ಸಾಮಾನ್ಯ ಉದಾಹರಣೆಗಳ ಮೂಲಕ ಆಳವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಸತ್ಯಗಳನ್ನು ವ್ಯಕ್ತಪಡಿಸುವುದು", "r": "ಯೊವಾನ್ನ, ಮುನ್ನುಡಿ"}, {"n": 52, "q": "KRCBC ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯಲ್ಲಿ ಎಷ್ಟು ಭಾಗಗಳಿವೆ?", "a": "ಆರು", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 53, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯ ಮೊದಲ ಮೂರು ಭಾಗಗಳು ಯಾವುವು?", "a": "1) ದಿವ್ಯವಾಣಿ (1:1–18); 2) ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಮತ್ತು ಯೇಸುವಿನ ಪ್ರಥಮ ಶಿಷ್ಯರು (1:19–51); 3) ಯೇಸುವಿನ ಸಾರ್ವಜನಿಕ ಸೇವೆ (2:1–12:50)", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 54, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯ ಪ್ರಕಾರ 2:1ರಿಂದ 12:50ರವರೆಗಿನ ಭಾಗದ ಹೆಸರೇನು?", "a": "ಯೇಸುವಿನ ಸಾರ್ವಜನಿಕ ಸೇವೆ", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 55, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯ ಪ್ರಕಾರ 13:1ರಿಂದ 19:42ರವರೆಗಿನ ಭಾಗದ ಹೆಸರೇನು?", "a": "ಜೆರುಸಲೇಮಿನಲ್ಲೂ ಅದರ ಪರಿಸರದಲ್ಲೂ ಅಂತಿಮ ದಿನಗಳು", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 56, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯ ಪ್ರಕಾರ 20ನೇ ಅಧ್ಯಾಯದ ಭಾಗದ ಹೆಸರೇನು?", "a": "ಪುನರುತ್ಥಾನ ಮತ್ತು ದಿವ್ಯದರ್ಶನಗಳು", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 57, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಪರಿವಿಡಿಯ ಪ್ರಕಾರ 21ನೇ ಅಧ್ಯಾಯದ ಭಾಗದ ಹೆಸರೇನು?", "a": "ಗಲಿಲೇಯದಲ್ಲಿ ಅಂತಿಮ ದರ್ಶನ", "r": "ಯೊವಾನ್ನ, ಪರಿವಿಡಿ"}, {"n": 58, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಅಧ್ಯಾಯಗಳಿವೆ?", "a": "ಇಪ್ಪತ್ತೊಂದು", "r": "ಯೊವಾನ್ನ"}, {"n": 59, "q": "ಈ ರಸಪ್ರಶ್ನೆಯ ಭಾಗವಾದ ಯೊವಾನ್ನ 1–12 ಅಧ್ಯಾಯಗಳು ಪರಿವಿಡಿಯ ಯಾವ ಭಾಗಗಳನ್ನು ಒಳಗೊಂಡಿವೆ?", "a": "ದಿವ್ಯವಾಣಿ; ಯೊವಾನ್ನನ ಶಿಷ್ಯರು ಮತ್ತು ಯೇಸುವಿನ ಪ್ರಥಮ ಶಿಷ್ಯರು; ಯೇಸುವಿನ ಸಾರ್ವಜನಿಕ ಸೇವೆ", "r": "ಯೊವಾನ್ನ 1-12"}, {"n": 60, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಮೊದಲ ಭಾಗದ (1:1–18) ಶೀರ್ಷಿಕೆ ಏನು?", "a": "ದಿವ್ಯವಾಣಿ", "r": "ಯೊವಾನ್ನ 1:1"}, {"n": 61, "q": "ಈ ರಸಪ್ರಶ್ನೆಯ ಮೂರು ಗ್ರಂಥಗಳ ಮೊದಲ ವಚನಗಳು ಯಾವ ವಿಷಯದಿಂದ ಆರಂಭವಾಗುತ್ತವೆ?", "a": "ರೂತಳು — ನ್ಯಾಯಸ್ಥಾಪಕರು ಆಳುತ್ತಿದ್ದಾಗ ಬಂದ ಬರಗಾಲ; ಗಲಾತ್ಯರಿಗೆ — ಗಲಾತ್ಯದ ಸಭೆಗಳಿಗೆ ಪೌಲನ ಪತ್ರ; ಯೊವಾನ್ನ — ಜಗತ್ತು ಉಂಟಾಗುವ ಮೊದಲೇ ಇದ್ದ ದಿವ್ಯವಾಣಿ", "r": "ರೂತಳು 1:1; ಗಲಾತ್ಯರಿಗೆ 1:1; ಯೊವಾನ್ನ 1:1"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
