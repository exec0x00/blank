<script id="src" type="application/json">{"title": "ಸಾಮಾನ್ಯ ಪ್ರಶ್ನೆಗಳು", "portion": "ಸಾಮಾನ್ಯ ಪ್ರಶ್ನೆಗಳು (ರೂತಳು, ಗಲಾತ್ಯರಿಗೆ, ಯೊವಾನ್ನ 1–12 ಮತ್ತು KRCBC ಬೈಬಲ್ ಗ್ರಂಥಗಳು)", "cover": false, "sections": true, "chapters": [{"chapter": 3, "label": "ಭಾಗ 3", "verses": null, "subtitle": "ರಸಪ್ರಶ್ನೆಯ ಭಾಗಗಳನ್ನು ಕುರಿತ ಸಾಮಾನ್ಯ ಪ್ರಶ್ನೆಗಳು", "questions": [{"n": 1, "q": "ರೂತಳ ಗ್ರಂಥದ ಕೊನೆಯಲ್ಲಿ ಹೆಸರಿಸಲಾದ ರಾಜ ದಾವೀದನ ಊರು ಬೆತ್ಲೆಹೇಮ್ ಎಂದು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಯಾವ ವಚನ ಹೇಳುತ್ತದೆ?", "a": "ಯೊವಾನ್ನ 7:42", "r": "ರೂತಳು 4:17; ಯೊವಾನ್ನ 7:42"}, {"n": 2, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲೂ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲೂ ಉಲ್ಲೇಖಿಸಲಾದ ಊರು ಯಾವುದು?", "a": "ಬೆತ್ಲೆಹೇಮ್", "r": "ರೂತಳು 1:1; ಯೊವಾನ್ನ 7:42"}, {"n": 3, "q": "ರೂತಳ ಗ್ರಂಥದ ವಂಶಾವಳಿಯ ಕೊನೆಯ ಹೆಸರು ಯಾರು? ಅವರ ವಂಶಜನೆಂದು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ ಯಾರನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತದೆ?", "a": "ದಾವೀದ; ಲೋಕೋದ್ಧಾರಕನು ದಾವೀದ ವಂಶಜನು (ಯೊವಾನ್ನ 7:42)", "r": "ರೂತಳು 4:22; ಯೊವಾನ್ನ 7:42"}, {"n": 4, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲೂ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲೂ ಪ್ರಮುಖವಾಗಿ ಉಲ್ಲೇಖಿಸಲಾದ ಪೂರ್ವಜನು ಯಾರು?", "a": "ಅಬ್ರಹಾಮ", "r": "ಗಲಾತ್ಯರಿಗೆ 3:6; ಯೊವಾನ್ನ 8:39,56"}, {"n": 5, "q": "ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು ಯಾರು ಎಂಬುದರ ಬಗ್ಗೆ ಗಲಾತ್ಯರಿಗೆ 3:7 ಮತ್ತು ಯೊವಾನ್ನ 8:39 ಏನು ಹೇಳುತ್ತವೆ?", "a": "ಗಲಾತ್ಯ 3:7 — ವಿಶ್ವಾಸದಿಂದ ಜೀವಿಸುವವರೇ ಅಬ್ರಹಾಮನ ಮಕ್ಕಳು; ಯೊವಾನ್ನ 8:39 — ಅಬ್ರಹಾಮನ ಮಕ್ಕಳಾಗಿದ್ದರೆ ಅಬ್ರಹಾಮನು ಮಾಡಿದಂತೆ ಮಾಡುತ್ತಿದ್ದರು", "r": "ಗಲಾತ್ಯರಿಗೆ 3:7; ಯೊವಾನ್ನ 8:39"}, {"n": 6, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲೂ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲೂ ಉಲ್ಲೇಖಿಸಲಾದ ‘ಕೇಫ’ ಯಾರು?", "a": "ಸಿಮೋನ ಪೇತ್ರ (‘ಕೇಫ’ ಎಂದರೆ ‘ಪೇತ್ರ’ ಇಲ್ಲವೇ ‘ಬಂಡೆ’ — ಯೊವಾನ್ನ 1:42)", "r": "ಗಲಾತ್ಯರಿಗೆ 1:18; ಯೊವಾನ್ನ 1:42"}, {"n": 7, "q": "ಸಿಮೋನನಿಗೆ ‘ಕೇಫ’ ಎಂಬ ಹೆಸರು ಕೊಟ್ಟವರು ಯಾರು?", "a": "ಯೇಸು", "r": "ಯೊವಾನ್ನ 1:42"}, {"n": 8, "q": "ಗಲಾತ್ಯರಿಗೆ 2:9ರ ‘ಯೊವಾನ್ನ’ ಮತ್ತು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ 1:6ರ ‘ಯೊವಾನ್ನ’ ಒಬ್ಬರೇ? ವಿವರಿಸಿ.", "a": "ಅಲ್ಲ — ಗಲಾತ್ಯ 2:9ರ ಯೊವಾನ್ನನು ಸಭಾಸ್ತಂಭಗಳಲ್ಲಿ ಒಬ್ಬನು; ಯೊವಾನ್ನ 1:6ರ ಯೊವಾನ್ನನು ದೇವರು ಕಳುಹಿಸಿದ ಸ್ನಾನಿಕ (ಸಾಕ್ಷಿ ನೀಡಲು ಬಂದವನು)", "r": "ಗಲಾತ್ಯರಿಗೆ 2:9; ಯೊವಾನ್ನ 1:6"}, {"n": 9, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರ ಮತ್ತು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶ ಯೇಸುವಿನ ಶಿಲುಬೆಮರಣವನ್ನು ಹೇಗೆ ಸೂಚಿಸುತ್ತವೆ?", "a": "ಗಲಾತ್ಯ 3:13 — ‘ಮರಕ್ಕೆ ತೂಗುಹಾಕಲಾದ ಪ್ರತಿ ಒಬ್ಬನೂ ಶಾಪಗ್ರಸ್ತನು’; ಯೊವಾನ್ನ 3:14; 12:32 — ನರಪುತ್ರನನ್ನು ಮೇಲಕ್ಕೆ ಏರಿಸುವುದು", "r": "ಗಲಾತ್ಯರಿಗೆ 3:13; ಯೊವಾನ್ನ 3:14; 12:32"}, {"n": 10, "q": "ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಯಾರ ಮುಖಾಂತರ ಕೊಡಲಾಯಿತು ಎಂದು ಯೊವಾನ್ನ 1:17 ಮತ್ತು ಗಲಾತ್ಯರಿಗೆ 3:19 ಹೇಳುತ್ತವೆ?", "a": "ಯೊವಾನ್ನ 1:17 — ಮೋಶೆಯ ಮುಖಾಂತರ; ಗಲಾತ್ಯ 3:19 — ದೇವದೂತರ ಮುಖಾಂತರ, ಒಬ್ಬ ಮಾನವ ಮಧ್ಯಸ್ಥನ ಮೂಲಕ", "r": "ಯೊವಾನ್ನ 1:17; ಗಲಾತ್ಯರಿಗೆ 3:19"}, {"n": 11, "q": "ದೇವರ ಪ್ರೀತಿಯಿಂದ ಪುತ್ರನು ಕೊಡಲ್ಪಟ್ಟದ್ದನ್ನು ಯೊವಾನ್ನ 3:16 ಮತ್ತು ಗಲಾತ್ಯರಿಗೆ 2:20 ಹೇಗೆ ಹೇಳುತ್ತವೆ?", "a": "ಯೊವಾನ್ನ 3:16 — ದೇವರು ಲೋಕವನ್ನು ಪ್ರೀತಿಸಿ ತಮ್ಮ ಏಕೈಕ ಪುತ್ರನನ್ನೇ ಧಾರೆಯೆರೆದರು; ಗಲಾತ್ಯ 2:20 — ನನ್ನನ್ನು ಪ್ರೀತಿಸಿ ನನಗಾಗಿ ಪ್ರಾಣಾರ್ಪಣೆ ಮಾಡಿದ ದೇವರ ಪುತ್ರ", "r": "ಯೊವಾನ್ನ 3:16; ಗಲಾತ್ಯರಿಗೆ 2:20"}, {"n": 12, "q": "ಪವಿತ್ರಾತ್ಮರ ಬಗ್ಗೆ ಗಲಾತ್ಯರಿಗೆ 5:22 ಮತ್ತು ದೇವರ ಆರಾಧನೆಯ ಬಗ್ಗೆ ಯೊವಾನ್ನ 4:24 ಏನು ಹೇಳುತ್ತವೆ?", "a": "ಗಲಾತ್ಯ 5:22 — ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು; ಯೊವಾನ್ನ 4:24 — ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ, ಅವರನ್ನು ಆತ್ಮದಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ಆರಾಧಿಸತಕ್ಕದ್ದು", "r": "ಗಲಾತ್ಯರಿಗೆ 5:22; ಯೊವಾನ್ನ 4:23-24"}, {"n": 13, "q": "ಸ್ವಾತಂತ್ರ್ಯದ ಬಗ್ಗೆ ಗಲಾತ್ಯರಿಗೆ 5:1 ಮತ್ತು ಯೊವಾನ್ನ 8:36 ಏನು ಹೇಳುತ್ತವೆ?", "a": "ಗಲಾತ್ಯ 5:1 — ನಾವು ಮುಕ್ತ ಸ್ವಾತಂತ್ರ್ಯದಿಂದ ಬಾಳಬೇಕೆಂದು ಕ್ರಿಸ್ತಯೇಸು ನಮ್ಮನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿದರು; ಯೊವಾನ್ನ 8:36 — ಪುತ್ರನು ಸ್ವಾತಂತ್ರ್ಯ ನೀಡಿದರೆ ನೀವು ನಿಜವಾಗಿಯೂ ಸ್ವತಂತ್ರರು", "r": "ಗಲಾತ್ಯರಿಗೆ 5:1; ಯೊವಾನ್ನ 8:32,36"}, {"n": 14, "q": "ವಿಶ್ವಾಸಿಗಳು ದೇವರ ಮಕ್ಕಳಾಗುವ ಬಗ್ಗೆ ಯೊವಾನ್ನ 1:12 ಮತ್ತು ಗಲಾತ್ಯರಿಗೆ 3:26 ಏನು ಹೇಳುತ್ತವೆ?", "a": "ಯೊವಾನ್ನ 1:12 — ದಿವ್ಯವಾಣಿಯಲ್ಲಿ ವಿಶ್ವಾಸ ಇಟ್ಟವರಿಗೆ ದೇವರ ಮಕ್ಕಳಾಗುವ ಹಕ್ಕನ್ನು ಕೊಟ್ಟರು; ಗಲಾತ್ಯ 3:26 — ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇಟ್ಟಿರುವ ವಿಶ್ವಾಸದ ಮೂಲಕ ನೀವೆಲ್ಲರೂ ದೇವರ ಮಕ್ಕಳಾಗಿದ್ದೀರಿ", "r": "ಗಲಾತ್ಯರಿಗೆ 4:6-7; ಯೊವಾನ್ನ 1:12"}, {"n": 15, "q": "“ನಿಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗುವಂತೆ ಒತ್ತಾಯಪಡಿಸಬೇಡಿ” ಎಂದ ರೂತಳಂತೆ, “ನಾವು ಹೋಗುವುದಾದರೂ ಯಾರ ಬಳಿಗೆ?” ಎಂದು ನಿಷ್ಠೆ ತೋರಿದವರು ಯಾರು?", "a": "ಸಿಮೋನ ಪೇತ್ರ (ಯೊವಾನ್ನ 6:68)", "r": "ರೂತಳು 1:16-17; ಯೊವಾನ್ನ 6:68"}, {"n": 16, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲೂ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲೂ ಉಲ್ಲೇಖಿಸಲಾದ ಧಾನ್ಯ ಯಾವುದು?", "a": "ಜವೆಗೋದಿ (ರೂತಳು 1:22; 2:17; ಯೊವಾನ್ನ 6:9 — ಜವೆಗೋದಿಯ ಐದು ರೊಟ್ಟಿಗಳು)", "r": "ರೂತಳು 2:14; ಯೊವಾನ್ನ 6:9,13"}, {"n": 17, "q": "ರೂತಳು ತೃಪ್ತಿಯಾಗಿ ಊಟಮಾಡಿ ಉಳಿಸಿಕೊಂಡಂತೆ, ಐದುಸಾವಿರ ಮಂದಿ ತಿಂದ ಮೇಲೆ ಏನಾಯಿತು?", "a": "ತಿಂದುಳಿದ ತುಂಡುಗಳು ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳ ತುಂಬಾ ಆದವು (ಯೊವಾನ್ನ 6:13)", "r": "ರೂತಳು 2:14; ಯೊವಾನ್ನ 6:11-13"}, {"n": 18, "q": "ರೂತಳ ಗ್ರಂಥದ ಸುಗ್ಗಿಯ ಹಿನ್ನೆಲೆಯಂತೆ, ಯೇಸು ಸುಗ್ಗಿ ಮತ್ತು ಕೊಯ್ಲಿನ ಉದಾಹರಣೆಯನ್ನು ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಯಾವ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಪಯೋಗಿಸಿದರು?", "a": "ನಾಲ್ಕನೆಯ ಅಧ್ಯಾಯ (4:35–38)", "r": "ರೂತಳು 2:4; ಯೊವಾನ್ನ 4:35-36"}, {"n": 19, "q": "ಬಿತ್ತುವುದು ಮತ್ತು ಕೊಯ್ಯುವುದು ಎಂಬ ಉದಾಹರಣೆ ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲೂ ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲೂ ಎಲ್ಲಿ ಬರುತ್ತದೆ?", "a": "ಗಲಾತ್ಯ 6:7–9; ಯೊವಾನ್ನ 4:36–37", "r": "ಗಲಾತ್ಯರಿಗೆ 6:7-9; ಯೊವಾನ್ನ 4:36-37"}, {"n": 20, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1–12 ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪಾಸ್ಕ ಹಬ್ಬವನ್ನು ಉಲ್ಲೇಖಿಸುವ ವಚನಗಳು ಯಾವುವು?", "a": "2:13; 2:23; 6:4; 11:55; 12:1", "r": "ಯೊವಾನ್ನ 2:13,23; 6:4; 11:55; 12:1"}, {"n": 21, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1–12 ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಪಾಸ್ಕ ಹಬ್ಬವಲ್ಲದೆ ಉಲ್ಲೇಖಿಸಲಾದ ಇತರ ಹಬ್ಬಗಳು ಯಾವುವು?", "a": "ಪರ್ಣಕುಟೀರಗಳ ಹಬ್ಬ (7:2); ಮಹಾದೇವಾಲಯದ ಪ್ರತಿಷ್ಠಾಪನೆಯ ಹಬ್ಬ (10:22); ಹೆಸರಿಸದ ಯೆಹೂದ್ಯರ ಹಬ್ಬ (5:1)", "r": "ಯೊವಾನ್ನ 7:2; 10:22"}, {"n": 22, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1–12 ಅಧ್ಯಾಯಗಳಲ್ಲಿ ವರ್ಣಿಸಲಾದ ಏಳು ಸೂಚಕಕಾರ್ಯಗಳು/ಅದ್ಭುತಗಳು ಯಾವುವು?", "a": "1) ಕಾನಾ ಊರಿನಲ್ಲಿ ನೀರು ದ್ರಾಕ್ಷಾರಸ (2:1–11); 2) ಅಧಿಕಾರಿಯ ಮಗನಿಗೆ ಆರೋಗ್ಯ (4:46–54); 3) ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿ (5:1–9); 4) ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ (6:1–13); 5) ನೀರಿನ ಮೇಲೆ ನಡೆ (6:16–21); 6) ಹುಟ್ಟು ಕುರುಡನಿಗೆ ದೃಷ್ಟಿ (9:1–7); 7) ಲಾಸರನ ಪುನರುಜ್ಜೀವನ (11:38–44)", "r": "ಯೊವಾನ್ನ 2:11; 4:54; 5:9; 6:11; 6:19; 9:7; 11:44"}, {"n": 23, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ 1–12 ಅಧ್ಯಾಯಗಳಲ್ಲಿ ಯೇಸುವಿನ “ನಾನೇ…” ಘೋಷಣೆಗಳು ಯಾವುವು?", "a": "ಜೀವದಾಯಕ ರೊಟ್ಟಿ (6:35); ಜಗಜ್ಯೋತಿ (8:12; 9:5); ಬಾಗಿಲು (10:7, 9); ಉತ್ತಮ ಕುರಿಗಾಹಿ (10:11, 14); ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ (11:25)", "r": "ಯೊವಾನ್ನ 6:35; 8:12; 10:7; 10:11; 11:25"}, {"n": 24, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸುವಿನ ಎರಡು ಸೂಚಕಕಾರ್ಯಗಳು ನಡೆದ ಗಲಿಲೇಯದ ಊರು ಯಾವುದು?", "a": "ಕಾನಾ", "r": "ಯೊವಾನ್ನ 2:1; 4:46"}, {"n": 25, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಬರುವ ಎರಡು ‘ಬೆಥಾನಿಯ’ಗಳು ಯಾವುವು?", "a": "ಜೋರ್ಡನ್ ನದಿಯ ಆಚೆದಡದಲ್ಲಿದ್ದ ಬೆಥಾನಿಯ (1:28); ಜೆರುಸಲೇಮಿನಿಂದ ಸುಮಾರು ಮೂರು ಕಿಲೊಮೀಟರು ದೂರದ ಲಾಸರನ ಊರು ಬೆಥಾನಿಯ (11:1, 18)", "r": "ಯೊವಾನ್ನ 1:28; 11:1"}, {"n": 26, "q": "ಅಂದ್ರೆಯ, ಪೇತ್ರ ಮತ್ತು ಫಿಲಿಪ್ಪರ ಊರು ಯಾವುದು?", "a": "ಬೆತ್ಸಾಯಿದ", "r": "ಯೊವಾನ್ನ 1:44; 12:21"}, {"n": 27, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಜೀವದಾಯಕ ರೊಟ್ಟಿಯ ಬೋಧನೆ ನಡೆದ ಊರು ಯಾವುದು?", "a": "ಕಫೆರ್ನವುಮ್ (ಅಲ್ಲಿನ ಪ್ರಾರ್ಥನಾಮಂದಿರ)", "r": "ಯೊವಾನ್ನ 2:12; 6:24,59"}, {"n": 28, "q": "ಯೇಸು ಸಮಾರಿಯದ ಮಹಿಳೆಯನ್ನು ಭೇಟಿಯಾದ ಊರು ಯಾವುದು?", "a": "ಸಮಾರಿಯದ ಸಿಖಾರ್ (ಯಕೋಬನ ಬಾವಿಯ ಬಳಿ)", "r": "ಯೊವಾನ್ನ 4:5"}, {"n": 29, "q": "ಯೊವಾನ್ನನು ಸ್ನಾನದೀಕ್ಷೆ ಕೊಡುತ್ತಿದ್ದ ಐನೋನ್ ಯಾವ ಊರಿಗೆ ಹತ್ತಿರವಾಗಿತ್ತು?", "a": "ಸಾಲಿಮ್", "r": "ಯೊವಾನ್ನ 3:23"}, {"n": 30, "q": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನದ ನಂತರ ಯೇಸು ಶಿಷ್ಯರೊಡನೆ ತಂಗಿದ ಗ್ರಾಮ ಯಾವುದು?", "a": "ಎಫ್ರಯಿಮ್", "r": "ಯೊವಾನ್ನ 11:54"}, {"n": 31, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಮೊದಲನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಸ್ಥಳಗಳು ಯಾವುವು?", "a": "ಜೆರುಸಲೇಮ್, ಅರೇಬಿಯ, ದಮಸ್ಕಸ್, ಸಿರಿಯ, ಸಿಲಿಸಿಯ, ಜುದೇಯ", "r": "ಗಲಾತ್ಯರಿಗೆ 1:17-21"}, {"n": 32, "q": "ಪೌಲನು ಕೇಫನನ್ನು ಮುಖಾಮುಖಿಯಾಗಿ ಖಂಡಿಸಿದ ಊರು ಯಾವುದು?", "a": "ಅಂತಿಯೋಕ್ಯ", "r": "ಗಲಾತ್ಯರಿಗೆ 2:11"}, {"n": 33, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ಪ್ರಕಾರ ಸೀನಾಯ್ ಪರ್ವತ ಎಲ್ಲಿದೆ?", "a": "ಅರೇಬಿಯಾದಲ್ಲಿ", "r": "ಗಲಾತ್ಯರಿಗೆ 4:24-25"}, {"n": 34, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ನಾಡು/ಊರುಗಳು ಯಾವುವು?", "a": "ಇಸ್ರಯೇಲ್ ನಾಡು, ಜುದೇಯ ಪ್ರಾಂತ್ಯ, ಬೆತ್ಲೆಹೇಮ್, ಮೋವಾಬ್ ನಾಡು", "r": "ರೂತಳು 1:1-2"}, {"n": 35, "q": "ರೂತಳ ಗ್ರಂಥದ ಹಿರಿಯರ ಆಶೀರ್ವಾದದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಹಳೆಯ ಕಾಲದ ವ್ಯಕ್ತಿಗಳು ಯಾರು?", "a": "ರಾಹೆಲ್, ಲೆಯಾ, ಯೆಹೂದ, ತಾಮಾರಳು, ಪೆರೆಚ", "r": "ರೂತಳು 4:11-12"}, {"n": 36, "q": "ಈ ರಸಪ್ರಶ್ನೆಯ ಭಾಗಗಳಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಅಧ್ಯಾಯಗಳಿವೆ?", "a": "ಇಪ್ಪತ್ತೆರಡು (ರೂತಳು 4 + ಗಲಾತ್ಯರಿಗೆ 6 + ಯೊವಾನ್ನ 12)", "r": "ರೂತಳು; ಗಲಾತ್ಯರಿಗೆ; ಯೊವಾನ್ನ 1-12"}, {"n": 37, "q": "ಮೋವಾಬ್ಯಳಾದ ರೂತಳು ಇಸ್ರಯೇಲರ ದೇವರನ್ನು ಸ್ವೀಕರಿಸಿದಂತೆ, ಕ್ರಿಸ್ತಯೇಸುವಿನಲ್ಲಿ ಇನ್ನು ಮೇಲೆ ಇಲ್ಲದ ಭೇದ ಯಾವುದು ಎಂದು ಗಲಾತ್ಯರಿಗೆ 3:28 ಹೇಳುತ್ತದೆ?", "a": "ಯೆಹೂದ್ಯ- ಯೆಹೂದ್ಯನಲ್ಲದವ, ದಾಸ-ದಣಿ, ಗಂಡು-ಹೆಣ್ಣು ಎಂಬ ಭೇದ", "r": "ರೂತಳು 1:16; ಗಲಾತ್ಯರಿಗೆ 3:28"}, {"n": 38, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೆಹೂದ್ಯರು ಮತ್ತು ಸಮಾರಿಯದವರ ಸಂಬಂಧದ ಬಗ್ಗೆ ಏನು ಹೇಳಲಾಗಿದೆ?", "a": "ಯೆಹೂದ್ಯರಿಗೂ ಸಮಾರಿಯದವರಿಗೂ ಹೊಕ್ಕುಬಳಕೆ ಇರಲಿಲ್ಲ (4:9)", "r": "ಯೊವಾನ್ನ 4:9; 8:48"}, {"n": 39, "q": "ಸ್ನಾನಿಕ ಯೊವಾನ್ನನು ಯೇಸುವನ್ನು ಯಾವ ಬಿರುದಿನಿಂದ ಪರಿಚಯಿಸಿದನು?", "a": "ಬಲಿಯರ್ಪಣೆಗಾಗಿ ದೇವರು ನೇಮಿಸಿರುವ ಕುರಿಮರಿ", "r": "ಯೊವಾನ್ನ 1:29,36"}, {"n": 40, "q": "ದೇವರು ಕಳುಹಿಸಿದ ಯೊವಾನ್ನನಂತೆ, ಪೌಲನನ್ನು ದೇವರು ಯಾವಾಗ ಆರಿಸಿಕೊಂಡರು?", "a": "ತಾಯಿಯ ಗರ್ಭದಲ್ಲಿ ಇದ್ದಾಗಲೇ (ಗಲಾತ್ಯ 1:15)", "r": "ಗಲಾತ್ಯರಿಗೆ 1:15; ಯೊವಾನ್ನ 1:6"}, {"n": 41, "q": "ಯೇಸು ತಿರುಗಾಡುತ್ತಿದ್ದ ದೇವಾಲಯದ ಮಂಟಪದ ಹೆಸರೇನು?", "a": "ಸೊಲೋಮೋನನ ಮಂಟಪ", "r": "ಯೊವಾನ್ನ 10:22-23"}, {"n": 42, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಗುಣಪಡಿಸುವಿಕೆಗೆ ಸಂಬಂಧಿಸಿದ ಎರಡು ಕೊಳಗಳು ಯಾವುವು?", "a": "ಬೆತ್ಸಥ (5:2) ಮತ್ತು ಶಿಲೋವಾಮ್ (9:7)", "r": "ಯೊವಾನ್ನ 5:2; 9:7"}, {"n": 43, "q": "‘ಶಿಲೋವಾಮ್’ ಎಂದರೆ ಅರ್ಥವೇನು?", "a": "ಕಳುಹಿಸಲಾದವನು", "r": "ಯೊವಾನ್ನ 9:7"}, {"n": 44, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಅರ್ಥವನ್ನು ವಿವರಿಸಲಾದ ಪದಗಳು ಯಾವುವು?", "a": "ರಬ್ಬಿ — ಗುರುದೇವ (1:38); ಮೆಸ್ಸೀಯ — ಅಭಿಷಿಕ್ತನಾದ ಲೋಕೋದ್ಧಾರಕ (1:41); ಕೇಫ — ಪೇತ್ರ ಇಲ್ಲವೇ ಬಂಡೆ (1:42); ಶಿಲೋವಾಮ್ — ಕಳುಹಿಸಲಾದವನು (9:7)", "r": "ಯೊವಾನ್ನ 1:38,41-42"}, {"n": 45, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ‘ದಿದುಮ’ ಎಂಬ ಹೆಸರಿನವನು ಯಾರು?", "a": "ತೋಮ", "r": "ಯೊವಾನ್ನ 11:16"}, {"n": 46, "q": "ಲಾಸರನ ಪುನರುಜ್ಜೀವನದ ವರ್ಷ ಪ್ರಧಾನ ಯಾಜಕನಾಗಿದ್ದವನು ಯಾರು?", "a": "ಕಾಯಫ", "r": "ಯೊವಾನ್ನ 11:49"}, {"n": 47, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ರಾತ್ರಿ ಯೇಸುವನ್ನು ಕಾಣಲು ಬಂದ ಯೆಹೂದ್ಯರ ನಾಯಕ ಯಾರು?", "a": "ನಿಕೊದೇಮ", "r": "ಯೊವಾನ್ನ 3:1; 7:50"}, {"n": 48, "q": "ಯೇಸುವನ್ನು ಹಿಡಿದುಕೊಡಲಿದ್ದ ಶಿಷ್ಯನ ಪೂರ್ಣ ಹೆಸರೇನು?", "a": "ಸಿಮೋನನ ಮಗ ಇಸ್ಕರಿಯೋತಿನ ಯೂದ", "r": "ಯೊವಾನ್ನ 6:71; 12:4"}, {"n": 49, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಗ್ರೀಕ ಸಹಕಾರಿ ಯಾರು?", "a": "ತೀತ", "r": "ಗಲಾತ್ಯರಿಗೆ 2:1,3"}, {"n": 50, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ‘ಪ್ರಭುವಿನ ಸಹೋದರ’ ಎಂದು ಕರೆಯಲಾದವನು ಯಾರು?", "a": "ಯಕೋಬ", "r": "ಗಲಾತ್ಯರಿಗೆ 1:19; 2:9,12"}, {"n": 51, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಅಬ್ರಹಾಮನ ಕುಟುಂಬದವರು ಯಾರು?", "a": "ಹಾಗರಳು (ದಾಸಿ) ಮತ್ತು ಇಸಾಕ (ವಾಗ್ದಾನದ ಫಲವಾಗಿ ಹುಟ್ಟಿದವನು)", "r": "ಗಲಾತ್ಯರಿಗೆ 4:22-30"}, {"n": 52, "q": "ರೂತಳ ಗ್ರಂಥದಲ್ಲಿ ಹೆಸರಿಸಲಾದ ಸ್ತ್ರೀಯರು ಯಾರು?", "a": "ನವೊಮಿ, ಒರ್ಫಾ, ರೂತ್, ರಾಹೆಲ್, ಲೆಯಾ, ತಾಮಾರಳು", "r": "ರೂತಳು 1:2,4; 4:17"}, {"n": 53, "q": "ರೂತಳ ಮಗ ಓಬೇದನ ಮೊಮ್ಮಗ ಯಾರು?", "a": "ದಾವೀದ", "r": "ರೂತಳು 4:17,22"}, {"n": 54, "q": "ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದಲ್ಲಿ ಯೇಸುವಿಗೆ ಅಚ್ಚುಮೆಚ್ಚಿನವರಾದ ಬೆಥಾನಿಯದ ಕುಟುಂಬದವರು ಯಾರು?", "a": "ಮಾರ್ತ, ಮರಿಯ ಮತ್ತು ಲಾಸರ", "r": "ಯೊವಾನ್ನ 11:5; 12:2-3"}, {"n": 55, "q": "ಕಫೆರ್ನವುಮಿನಲ್ಲಿ ಮಗನು ಗುಣಹೊಂದಿದ ನಂತರ ತನ್ನ ಮನೆಯವರೆಲ್ಲರೊಡನೆ ಯೇಸುವನ್ನು ವಿಶ್ವಾಸಿಸಿದವನು ಯಾರು?", "a": "ರಾಜಸೇವೆಯಲ್ಲಿದ್ದ ಅಧಿಕಾರಿ", "r": "ಯೊವಾನ್ನ 4:46-53"}, {"n": 56, "q": "ಬೆತ್ಸಥ ಕೊಳದ ರೋಗಿ ಎಷ್ಟು ವರ್ಷ ಕಾಯಿಲೆಯಿಂದ ನರಳುತ್ತಿದ್ದನು?", "a": "ಮೂವತ್ತೆಂಟು ವರ್ಷ", "r": "ಯೊವಾನ್ನ 5:5"}, {"n": 57, "q": "ಯೆಹೂದ್ಯರ ಪ್ರಕಾರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಲು ಎಷ್ಟು ವರ್ಷಗಳು ಹಿಡಿದಿವೆ?", "a": "ನಲವತ್ತಾರು ವರ್ಷಗಳು", "r": "ಯೊವಾನ್ನ 2:20"}, {"n": 58, "q": "ಅಬ್ರಹಾಮನೊಂದಿಗಿನ ಒಪ್ಪಂದದ ಎಷ್ಟು ವರ್ಷಗಳಾದ ಮೇಲೆ ಧರ್ಮಶಾಸ್ತ್ರ ಬಂತು?", "a": "ನಾನೂರ ಮೂವತ್ತು ವರ್ಷಗಳಾದ ಮೇಲೆ", "r": "ಗಲಾತ್ಯರಿಗೆ 3:17"}, {"n": 59, "q": "ನವೊಮಿಯ ಕುಟುಂಬ ಮೋವಾಬಿನಲ್ಲಿ ಸುಮಾರು ಎಷ್ಟು ವರ್ಷ ವಾಸಮಾಡಿತು?", "a": "ಸುಮಾರು ಹತ್ತು ವರ್ಷ", "r": "ರೂತಳು 1:4"}, {"n": 60, "q": "ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಎರಡು ಕಾಲಾವಧಿಗಳು ಯಾವುವು?", "a": "ಮೂರು ವರ್ಷಗಳ ನಂತರ (1:18); ಹದಿನಾಲ್ಕು ವರ್ಷಗಳು ಕಳೆದ ಮೇಲೆ (2:1)", "r": "ಗಲಾತ್ಯರಿಗೆ 1:18; 2:1"}, {"n": 61, "q": "ಐದುಸಾವಿರ ಮಂದಿಗೆ ಆಹಾರ ನೀಡಿದ ಘಟನೆಯ ಸಂಖ್ಯೆಗಳು ಯಾವುವು?", "a": "ಐದು ರೊಟ್ಟಿಗಳು, ಎರಡು ಮೀನುಗಳು, ಐದುಸಾವಿರ ಗಂಡಸರು, ಹನ್ನೆರಡು ಬುಟ್ಟಿಗಳು", "r": "ಯೊವಾನ್ನ 6:10,13"}, {"n": 62, "q": "ಕಾನಾ ಊರಿನ ಮದುವೆಯಲ್ಲಿದ್ದ ಕಲ್ಲುಬಾನೆಗಳು ಎಷ್ಟು?", "a": "ಆರು", "r": "ಯೊವಾನ್ನ 2:6"}, {"n": 63, "q": "ರೂತಳಿಗೆ ಸಿಕ್ಕಿದ ಜವೆಗೋದಿಯ ಪ್ರಮಾಣಗಳನ್ನು ತಿಳಿಸಿ (ಅಧ್ಯಾಯ 2 ಮತ್ತು 3).", "a": "ಸುಮಾರು ಅರ್ಧ ಚೀಲ (2:17); ಸುಮಾರು ಇಪ್ಪತ್ತೈದು ಕಿಲೋಗ್ರಾಂ (3:15)", "r": "ರೂತಳು 3:15; 2:17"}, {"n": 64, "q": "ಮರಿಯಳು ಹಚ್ಚಿದ ಸುಗಂಧ ತೈಲದ ಪ್ರಮಾಣ ಮತ್ತು ಬೆಲೆ ಎಷ್ಟು?", "a": "ಸುಮಾರು ಅರ್ಧ ಲೀಟರ್; ಮುನ್ನೂರು ದೆನಾರಿ ನಾಣ್ಯಗಳು (ಯೂದನ ಪ್ರಕಾರ)", "r": "ಯೊವಾನ್ನ 12:3,5"}, {"n": 65, "q": "ಪವಿತ್ರಾತ್ಮದತ್ತವಾದ ಸತ್ಫಲಗಳು ಎಷ್ಟು?", "a": "ಒಂಬತ್ತು", "r": "ಗಲಾತ್ಯರಿಗೆ 5:22"}, {"n": 66, "q": "ಯೇಸು ಬಂದಾಗ ಲಾಸರನು ಸತ್ತು ಎಷ್ಟು ದಿನಗಳಾಗಿದ್ದವು?", "a": "ನಾಲ್ಕು ದಿನಗಳು", "r": "ಯೊವಾನ್ನ 11:17,39"}, {"n": 67, "q": "ಸಮಾರಿಯದ ಮಹಿಳೆಗೆ ಎಷ್ಟು ಗಂಡಂದಿರು ಇದ್ದರು?", "a": "ಐದು", "r": "ಯೊವಾನ್ನ 4:18"}, {"n": 68, "q": "ಪಾಸ್ಕಹಬ್ಬಕ್ಕೆ ಎಷ್ಟು ದಿನ ಇರುವಾಗ ಯೇಸು ಬೆಥಾನಿಯಕ್ಕೆ ಬಂದರು?", "a": "ಆರು ದಿನಗಳಿರುವಾಗ", "r": "ಯೊವಾನ್ನ 12:1"}, {"n": 69, "q": "ಬೋವಜನು ಸಾಕ್ಷಿಗಳಾಗಿ ಕರೆಸಿದ ಹಿರಿಯರು ಎಷ್ಟು ಮಂದಿ?", "a": "ಹತ್ತು", "r": "ರೂತಳು 4:2"}, {"n": 70, "q": "KRCBC ಯೊವಾನ್ನನ ಶುಭಸಂದೇಶದ ಅತಿ ಚಿಕ್ಕ ವಚನ ಯಾವುದು?", "a": "“ಯೇಸು ಕಣ್ಣೀರಿಟ್ಟರು.” (11:35)", "r": "ಯೊವಾನ್ನ 11:35"}, {"n": 71, "q": "“ದೇವರು ಲೋಕವನ್ನು ಎಷ್ಟಾಗಿ ಪ್ರೀತಿಸಿದರೆಂದರೆ…” ಎಂದು ಆರಂಭವಾಗುವ ಪ್ರಸಿದ್ಧ ವಚನ ಯಾವುದು?", "a": "ಯೊವಾನ್ನ 3:16", "r": "ಯೊವಾನ್ನ 3:16"}, {"n": 72, "q": "“ನೀವು ಎಲ್ಲಿಗೆ ಹೋದರೂ ನಾನೂ ಅಲ್ಲಿಗೆ ಬರುತ್ತೇನೆ” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ರೂತಳು 1:16", "r": "ರೂತಳು 1:16"}, {"n": 73, "q": "“ಕ್ರಿಸ್ತಯೇಸುವಿನೊಂದಿಗೆ ನಾನೂ ಶಿಲುಬೆಗೇರಿಸಲಾದವನು” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಗಲಾತ್ಯರಿಗೆ 2:20", "r": "ಗಲಾತ್ಯರಿಗೆ 2:20"}, {"n": 74, "q": "“ಬಿತ್ತುವುದನ್ನೇ ಕೊಯ್ಯುತ್ತೇವೆ” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಗಲಾತ್ಯರಿಗೆ 6:7", "r": "ಗಲಾತ್ಯರಿಗೆ 6:7"}, {"n": 75, "q": "“ಸತ್ಯವು ನಿಮಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನೀಡುವುದು” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 8:32", "r": "ಯೊವಾನ್ನ 8:32"}, {"n": 76, "q": "“ನಾನೂ ಪಿತನೂ ಒಂದೇ ಆಗಿದ್ದೇವೆ” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 10:30", "r": "ಯೊವಾನ್ನ 10:30"}, {"n": 77, "q": "“ನಿಮ್ಮ ದೇವರೇ ನನ್ನ ದೇವರು” ಎಂಬ ಮಾತು ಯಾವ ಗ್ರಂಥದ, ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ರೂತಳು 1:17", "r": "ರೂತಳು 1:17"}, {"n": 78, "q": "“ನೀನು ನಿನ್ನನ್ನೇ ಪ್ರೀತಿಸಿಕೊಳ್ಳುವಂತೆ ನಿನ್ನ ನೆರೆಯವರನ್ನು ಪ್ರೀತಿಸು” ಎಂಬ ವಚನವನ್ನು ಉಲ್ಲೇಖಿಸುವ ಗಲಾತ್ಯರಿಗೆ ಬರೆದ ಪತ್ರದ ವಚನ ಯಾವುದು?", "a": "ಗಲಾತ್ಯರಿಗೆ 5:14", "r": "ಗಲಾತ್ಯರಿಗೆ 5:14"}, {"n": 79, "q": "“ಆ ದಿವ್ಯವಾಣಿ ಮನುಷ್ಯ ಆದರು” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 1:14", "r": "ಯೊವಾನ್ನ 1:14"}, {"n": 80, "q": "“ಪುನರುತ್ಥಾನವೂ ಜೀವವೂ ನಾನೇ” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 11:25", "r": "ಯೊವಾನ್ನ 11:25"}, {"n": 81, "q": "“ದೇವರು ಆತ್ಮಸ್ವರೂಪಿ” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 4:24", "r": "ಯೊವಾನ್ನ 4:24"}, {"n": 82, "q": "“ಆತ ಬೆಳೆಯುತ್ತಿರಬೇಕು, ನಾನು ಅಳಿಯುತ್ತಿರಬೇಕು” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಯೊವಾನ್ನ 3:30", "r": "ಯೊವಾನ್ನ 3:30"}, {"n": 83, "q": "“ಒಬ್ಬರ ಭಾರವನ್ನು ಒಬ್ಬರು ಹೊತ್ತುಕೊಳ್ಳಿ” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ಗಲಾತ್ಯರಿಗೆ 6:2", "r": "ಗಲಾತ್ಯರಿಗೆ 6:2"}, {"n": 84, "q": "“ಇಸ್ರಯೇಲಿನ ದೇವರಾದ ಸರ್ವೇಶ್ವರಸ್ವಾಮಿಯ ಆಶ್ರಯವನ್ನರಸಿ ಬಂದಿರುವೆ” ಎಂಬ ಮಾತು ಯಾವ ವಚನದಲ್ಲಿದೆ?", "a": "ರೂತಳು 2:12", "r": "ರೂತಳು 2:12"}, {"n": 85, "q": "“ನಿತ್ಯಜೀವವನ್ನು ಈಯುವ ನುಡಿ ಇರುವುದು ತಮ್ಮಲ್ಲೇ” ಎಂದು ಹೇಳಿದವರು ಯಾರು? ಯಾವ ವಚನ?", "a": "ಸಿಮೋನ ಪೇತ್ರ; ಯೊವಾನ್ನ 6:68", "r": "ಯೊವಾನ್ನ 6:68"}, {"n": 86, "q": "“ಲೋಕದ ಪಾಪಗಳನ್ನು ಪರಿಹರಿಸುವವರು ಇವರೇ” ಎಂದು ಯಾರು ಯಾರ ಬಗ್ಗೆ ಹೇಳಿದರು? ಯಾವ ವಚನ?", "a": "ಸ್ನಾನಿಕ ಯೊವಾನ್ನನು ಯೇಸುವಿನ ಬಗ್ಗೆ; ಯೊವಾನ್ನ 1:29", "r": "ಯೊವಾನ್ನ 1:29"}]}]}</script>
<div id="root"></div>
<script>
Promise.all(["400 11pt 'Noto Serif Kannada'","700 11pt 'Noto Serif Kannada'","400 9pt 'Noto Sans Kannada'","700 9pt 'Noto Sans Kannada'"].map(f=>document.fonts.load(f,'ಕನ್ನಡ'))).then(()=>document.fonts.ready).then(()=>{

(function(){
  const data = JSON.parse(document.getElementById('src').textContent);
  const root = document.getElementById('root');
  let folio = 0;
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function cover(){
    const p = el('div','page cover');
    p.appendChild(el('h1',null,data.title));
    p.appendChild(el('h2',null,'ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ – ಸಾಮಾನ್ಯ (ಲಿಖಿತ)'));
    p.appendChild(el('div','meta','ಭಾಗ: '+data.portion+'<br>ಭಾಷೆ: ಕನ್ನಡ · ಪಠ್ಯ: KRCBC ಕನ್ನಡ ಬೈಬಲ್'));
    const t = el('table'); t.id='toc';
    t.innerHTML = '<tr><th>'+(data.sections?'ಭಾಗ':'ಅಧ್ಯಾಯ')+'</th><th>ಪ್ರಶ್ನೆಗಳು</th><th>ಪುಟ</th></tr>';
    p.appendChild(t);
    p.appendChild(el('div','src','ಪ್ರತಿಯೊಂದು ಉತ್ತರದ ಕೊನೆಯಲ್ಲಿ ವಚನದ ಉಲ್ಲೇಖವಿದೆ. ಪ್ರತಿ ಅಧ್ಯಾಯದ ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆ 1ರಿಂದ ಆರಂಭವಾಗುತ್ತದೆ.<br>ಆಧಾರ: krcbcbible.org/kannada_bible.php'));
    root.appendChild(p);
    return t;
  }
  function newPage(ch, first){
    folio++;
    const p = el('div','page');
    const h = el('div','head');
    h.appendChild(el('div','book','<small>ವಿದ್ಯಾರ್ಥಿಗಳ ಬೈಬಲ್ ರಸಪ್ರಶ್ನೆ · KRCBC</small>'+data.title+' — <span class="chap">'+ch.label+'</span>'));
    h.appendChild(el('div','folio',String(folio)));
    p.appendChild(h);
    if(first){
      const info = ch.subtitle ? ch.subtitle+' · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು' : data.title+' '+ch.chapter+' · '+ch.verses+' ವಚನಗಳು · '+ch.questions.length+' ಪ್ರಶ್ನೆಗಳು';
      p.appendChild(el('div','chapter-banner','<b>'+ch.label+'</b><span>'+info+'</span>'));
    }
    const ol = el('ol','questions'); p.appendChild(ol);
    const ans = el('div','answers');
    ans.appendChild(el('div','answers-title','ಉತ್ತರಗಳು — '+ch.label));
    const box = el('div','answer-box'); ans.appendChild(box);
    p.appendChild(ans);
    root.appendChild(p);
    return {p, ol, box};
  }
  function overflow(pg){ return pg.p.scrollHeight > pg.p.clientHeight + 0.5; }
  const toc = data.cover ? cover() : null;
  for(const ch of data.chapters){
    let pg = newPage(ch, true);
    const startFolio = folio;
    let count = 0;
    for(const q of ch.questions){
      const li = el('li', null, '<span class="num">'+q.n+'.</span><span>'+q.q+'</span>');
      const an = el('div','ans','<span class="num">'+q.n+'.</span><p>'+q.a+' <span class="ref">('+q.r+')</span></p>');
      pg.ol.appendChild(li); pg.box.appendChild(an);
      if(overflow(pg)){
        if(count===0){ console.warn('question does not fit an empty page', q.n); }
        else {
          pg.ol.removeChild(li); pg.box.removeChild(an);
          pg = newPage(ch, false); count = 0;
          pg.ol.appendChild(li); pg.box.appendChild(an);
        }
      }
      count++;
    }
    if(toc){ const r=document.createElement('tr'); r.innerHTML='<td>'+ch.label+(ch.subtitle?' — '+ch.subtitle:'')+'</td><td>'+ch.questions.length+'</td><td>'+startFolio+'</td>'; toc.appendChild(r); }
  }
  window.__paginated = true;
})();

});
</script>
