name: Verify application

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 -m py_compile app.py scripts/deploy.py scripts/check-space.py scripts/release_build.py
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/release_build.py verify
      - run: npm run test:bootstrap
      - run: python3 -m unittest tests/test_release_build.py
      - run: npm run test:native-ui
      - run: npm run test:native-history
      - run: npm run test:overflow
      - run: npm run test:loading
      - run: npm run test:interactions
      - run: npm run test:typing
      - run: npm run test:e2e
      - run: python3 scripts/release_build.py package
      - name: Preserve the verified portable application build
        uses: actions/upload-artifact@v4
        with:
          name: arc-workspace-portable-build
          path: |
            release/workspace-build.json
            release/workspace-build.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
            /tmp/arc-loading-proof/
            /tmp/arc-interaction-proof/
            /tmp/arc-typing-proof/
          if-no-files-found: ignore
          retention-days: 7
